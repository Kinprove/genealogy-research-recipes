# Canonical gitleaks configuration for the public genealogy-research-recipes skill.
#
# This is the SINGLE source of truth. `export_public_recipe.py` byte-copies it
# into the public checkout root as `.gitleaks.toml`, and its D1 pre-write leak
# guard asserts SHA-256 equality between the two copies so they cannot drift.
# The public-repo GitHub Actions run only checks that the file exists.
#
# `useDefault = true` makes any allowlisting below ADD to (never REPLACE) the
# gitleaks default ruleset. There are deliberately NO allowlist entries yet: the
# public tree is reviewed public content, so the gate runs the full default
# ruleset fail-closed. If a genuine false positive surfaces on the public tree,
# add a NARROW, commented allowlist entry here and let the D1 SHA-256-equality
# assertion carry it to the public-repo copy.
title = "genealogy-research-recipes secret-scan config"

[extend]
useDefault = true
