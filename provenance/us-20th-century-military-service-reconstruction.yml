  - {"id":"S41","kind":"web-page","urls":["https://boards.law.af.mil/ARMY/BCMR/CY2003/2003088150C070403.rtf"],"published":null,"retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","entry_sha256":"48ff668212292be58dd1b3948e27054de449731d261653ffba67cb953ca5df9e","claims":["C-0c8f2287000b"],"review":"reviewed"}
claims:
  - {"id":"C-dccea303417b","kind":"unclassified","anchor":"Use this when a 20th-century Army or Air Force personnel file burned, came back thin or is restricted, or when a family says a man served but he does not appear in federal lists. The task is to rebuild his service from records held separately from that file, and to log each record's custodian and scope. For older compiled service records, pension files and choosing a custodian, use [military pension file recovery § 1](us-military-pension-file-recovery.md). For the grave and cemetery-record packet, use [burial evidence packet](burial-evidence-packet.md). For naturalization C-files, use [U.S. immigration search recovery](usa-immigration-search-recovery.md). Identity and proof rulings belong in [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f2a3138a2a09","kind":"unclassified","anchor":"Do not claim that the records burned and nothing survives. On July 12, 1973 a fire at the National Personnel Records Center (NPRC) in St. Louis destroyed about 16–18 million Official Military Personnel Files (OMPFs). NARA gives these losses ([NARA, 1973 fire](https://www.archives.gov/personnel-records-center/fire-1973); presenter account in [S11], [S12]):","sources":["S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-26ebd8201e5f","kind":"unclassified","anchor":"- Army: about 80% of files lost for men discharged November 1, 1912 – January 1, 1960.\n- Air Force: about 75% of files lost for discharges September 25, 1947 – January 1, 1964, but only for names alphabetically after \"Hubbard, James E.\"\n- Navy, Marine Corps and Coast Guard: NARA's fire page lists no losses for these branches. Strauss calls them largely unaffected [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d203d929a4fe","kind":"unclassified","anchor":"A discharge date inside a range means the file *may* be lost, not that it is lost. These are exactly the ranges for which NPRC keeps a burned (\"B\") file registry of about 6.5 million recovered records and a reconstructed (\"R\") file registry ([NARA](https://www.archives.gov/personnel-records-center/fire-1973)). Request the file anyway.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eee9a329599c","kind":"unclassified","anchor":"Then check access. OMPFs become archival and open to the public 62 years after separation, on a rolling basis. Before that, full access is limited to the veteran or next of kin ([NARA, OMPF access](https://www.archives.gov/personnel-records-center/ompf-access)). Work out the cutoff from the discharge date. Do not reuse the presenter's example year [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d135f2c0a832","kind":"unclassified","anchor":"An archival file is public, so no release is needed ([NARA, archival OMPF requests](https://www.archives.gov/personnel-records-center/military-personnel/ompf-archival-requests)). For a non-archival file, a requester who is neither the veteran nor his next of kin (for example, a grandson) must send a signed, dated authorization. If the veteran is living, it comes from him. If he is deceased, it comes from his next of kin (un-remarried spouse, son, daughter, father, mother, brother or sister), sent with proof of death ([NARA, OMPF access](https://www.archives.gov/personnel-records-center/ompf-access)). In one listener's account, a release signed by the veteran's sons turned a limited reply into the full file [S15].","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c87b05240885","kind":"unclassified","anchor":"Request routes: NARA's online request system, eVetRecs ([vetrecs.archives.gov](https://vetrecs.archives.gov/)); Standard Form 180 (SF-180) by mail; an in-person visit to St. Louis by appointment; or an independent researcher ([NARA](https://www.archives.gov/personnel-records-center/military-personnel/morning-reports-and-unit-rosters); [S11]). eVetRecs is not limited to the family. A requester who is neither the veteran nor his next of kin chooses \"Other\", and every user verifies identity through ID.me ([NARA, eVetRecs help](https://www.archives.gov/veterans/military-service-records/evetrecs-help.html)).","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f851d986213e","kind":"unclassified","anchor":"Ignore loose fire dates. One presenter said \"1979\" [S16], and another was unsure of the custodian's name [S20]. Cite NARA's own description instead.","sources":["S16","S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d6582d41a40e","kind":"unclassified","anchor":"Name each product in the request, and log the product returned and its page count [S9], [S10]:","sources":["S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-afdc973492ad","kind":"unclassified","anchor":"- **OMPF:** the personnel file itself.\n- **Burnt (B) file:** a file that survived with fire or water damage, listed in NPRC's B-file registry. The presenter says the custodian may scan and email it rather than show the original [S9].\n- **Reconstructed (R) file:** assembled after the fire from alternate sources: VA claim files, final pay vouchers, state records, Selective Service records, hospital records and organizational records ([NARA](https://www.archives.gov/personnel-records-center/fire-1973)). The presenter adds that veterans were asked to send in copies of their discharge papers [S9]. Expect only a few pages [S9].\n- **Auxiliary file:** ask for it by name when the OMPF is lost, and expect it to be minimal. One example is a final pay voucher giving name, service number, and dates and character of service ([NARA, other records](https://www.archives.gov/st-louis/other-records)). Strauss adds rank, last duty station, last unit, pay and overseas status, all from the man's last period of service [S9]. His own WWI request returned three pages: a final pay roll naming the man with other men of his unit [S11]. Log the product under the label the custodian puts on it.","sources":["S9","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fe1348fcb99e","kind":"unclassified","anchor":"Before choosing final pay as a substitute, distinguish a discharge from an in-service\ndeath. NARA's 2023 presentation says a final pay voucher required discharge: a person\nkilled in service would have one only from an earlier break before the final reenlistment\n[S27]. Preserve the evidence for that earlier separation and request the voucher for its\nactual period; an in-service death alone does not supply that target. Use the separate\ndeath-file route below. A missing voucher is not evidence of non-service.","sources":["S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3aa1babc0a92","kind":"unclassified","anchor":"A payroll entry dates the end of service and names the last unit. It is not a full service history. The recorded unit may be a separation unit rather than the operational unit [S27]. Log \"no OMPF; auxiliary returned, 3 pp.\" rather than \"file destroyed\".","sources":["S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8587740d068a","kind":"unclassified","anchor":"- **In-service deaths:** request the WWI burial case file (also called a mortuary or casualty file) or the WWII Individual Deceased Personnel File (IDPF) separately from the OMPF. Do not merge it with the OMPF in the register. Route the request by custodian:\n  - WWI-era burial case files (1915–1939, RG 92) were held at the National Archives in College Park and moved to NARA St. Louis in 2012 ([NARA](https://narations.blogs.archives.gov/2012/06/26/records-heading-west-to-st-louis)).\n  - WWII Army IDPFs: search the National Archives Catalog for his file first, then ask NARA St. Louis, whatever his surname. NARA St. Louis lists IDPFs for 1939–1975 among its holdings ([NARA St. Louis, frequently requested](https://www.archives.gov/st-louis/frequently-requested)) and states that WWII Army IDPFs for surnames M–Z are open ([NARA St. Louis](https://www.archives.gov/st-louis)). Its Catalog series also has digitized files for some A–L surnames ([NARA Catalog, IDPFs](https://catalog.archives.gov/id/297287480)). Older accounts split custody by surname between NARA and the Army, so do not route by surname alone. If NARA St. Louis says it does not hold the file, send a FOIA request to the U.S. Army Human Resources Command at Fort Knox, Kentucky. A 2025 History Hub reply gives the address and what to include ([History Hub](https://openhistoryhub.com/t/55151)).\n  - Expect cause and date of death, temporary and permanent burial, medical records and sometimes a burial-site map [S10].\n- **VA claim file (VA C-file or XC-file):** request it by FOIA. It exists only if a benefits claim was made ([birls.org](https://www.birls.org); [S18], [S20], [S21]).\n  - Route: Reclaim The Records runs birls.org, which prepares faxed FOIA requests for deceased veterans' C-files. VBA no longer accepts emailed FOIA requests. Use fax, and use the appeal texts on birls.org for refusals.\n  - Example contents: one file contained a DD214 and a WD AGO 53-55 enlistment/discharge form listing decorations [S18].\n  - Timing: one request took about five months [S18].\n  - Refusals: Reclaim The Records reports that beginning in late July 2025 the VA withheld copies of XC-files and sent only a summary of the genealogical details it deemed releasable ([birls.org updates](https://www.birls.org/updates)). Refusals the presenter received said the records had \"no genealogical relevance\" [S21]. Log a summary-only reply as a response with the file withheld. A refusal is an access result to appeal, not proof the file doesn't exist.\n  - Name: keep the VA C-file apart from the USCIS C-file, which shares the label [S21].\n- **VA Master Index card (1917–1940):** held by NARA St. Louis, not the VA. It is digitized and free to search on [FamilySearch](https://familysearch.org/search/collection/2968245). Search there first and log it as its own product [S20].\n- **BIRLS entry:** BIRLS (Beneficiary Identification Records Locator Subsystem) is a VA index of veterans and beneficiaries who claimed benefits, built from the 1980s on. Death does not create a BIRLS record. The public release covers only veterans the VA has confirmed as deceased ([birls.org](https://www.birls.org); [S17]). A BIRLS hit tells you a claim file may exist. Log it as its own product.\n- **Compensation file:** one presenter used a WWI \"compensation file\" listing company, battalion, division and dated engagements [S17]. Take the custodian from the file's own heading or citation and record it exactly as found.\n- **State bonus file:** many states paid their own WWI bonus or compensation. The application files are state records with a state custodian, separate from the OMPF. Search the archives of the veteran's home state [S29]:\n  - Pennsylvania State Archives, RG 19, Series 19.91, *World War I Veterans Service and Compensation File, 1917–1919, 1934–1948*. It records residence, unit, service and overseas dates, discharge, and dependents' names and addresses. Images are on Ancestry and, free to Pennsylvania residents, on Ancestry Pennsylvania ([PA State Archives, WWI records](https://www.pa.gov/en/agencies/phmc/pa-state-archives/research-online/research-guides/world-war-i-records.html); [RG 19](https://www.pa.gov/en/agencies/phmc/pa-state-archives/research-online/research-guides/wpa-and-new-deal-records/wpa-and-new-deal-records-rg-19-rg-23.html); [Ancestry Pennsylvania](https://www.pa.gov/en/agencies/phmc/pa-state-archives/research-online/collection-highlights.html)).\n  - Iowa: [Iowa, World War I Bonus Applications, 1922–1954](https://www.familysearch.org/en/search/collection/5000051) (State Historical Society of Iowa; the applications are indexed on FamilySearch).\n  - Washington: [Washington, World War I Veteran's Compensation Fund Application Records, 1921–1925](https://www.familysearch.org/en/search/collection/1878898) (Washington State Archives; on FamilySearch).\n  - Use: the state holds these files, so they can supply a dated residence and service details when the OMPF burned in 1973. Cite the state custodian and series, not the federal one.","sources":["S10","S18","S20","S21","S17","S29"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e532a0f4066b","kind":"unclassified","anchor":"Keep the trial record separate from personnel-file remarks. Gather the service, trial\nyear or bounded interval, court type, original outcome and any later appeal or discharge\nupgrade. NARA's 2024 presentation describes these historical selection distinctions [S26]:","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-96a053888cc3","kind":"unclassified","anchor":"The presentation places surviving summary-court details in the OMPF rather than a separate\ntrial series. Use these distinctions to select a candidate finding description, then\nverify its actual period, custodian, survival and access before requesting it. They do\nnot establish that an individual's file survives or was destroyed. A later discharge\nupgrade alone does not settle survival; preserve the original disposition and appeal dates.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8fa5f778fc56","kind":"unclassified","anchor":"1. Preserve any case number already supplied; otherwise use the **defendant's surname**\n   as the lookup lead. The presentation describes staff card indexes arranged by service\n   and surname, not by the victim or witness [S26]. Check the custodian's present finder\n   and request requirements rather than assuming the 2024 index format is unchanged.\n2. Supply the service, all known names and aliases, including married/maiden names, and\n   the trial date or bounded interval. Keep unit and trial location as additional clues\n   when the date is uncertain. For a joint trial, one known defendant can supply the\n   individual card lead; the presentation does not require every defendant's name [S26].\n3. Retain any separately cited appeal case number as another retrieval target. Record\n   the trial file requested, the actual file or personnel-file extract returned, its\n   extent and unresolved references. Personnel remarks are not the trial transcript.","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-101a36aff879","kind":"unclassified","anchor":"Retrieve the government headstone or marker application and read **both sides**. A WWI veteran's card had his whole service history written on the back by an unnamed hand [S1], [S4], [S5]. FamilySearch holds \"United States, Headstone Applications for U.S. Military Veterans, 1925–1949\" (NARA M1916/M2113, RG 92) ([FamilySearch](https://www.familysearch.org/en/search/collection/1916249)), which covers many WWII-era applicants. One presenter found a full list of assignments on the reverse of a card in that series [S7].","sources":["S1","S4","S5","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c03ac3d58a46","kind":"unclassified","anchor":"The stone itself can supply the unit when nothing else names it [S5], [S6].","sources":["S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0dc39584731b","kind":"unclassified","anchor":"Not appearing in the VA Nationwide Gravesite Locator is a non-result. Tanner says his grandfather had a VA marker but was missing from the locator [S5]. Log the search and its scope, then check the marker and the application.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e16c6408fd0b","kind":"unclassified","anchor":"NARA's WWII Army Enlistment Records in the Access to Archival Databases (AAD) hold about 9 million Army enlistments from 1938–1946, including the Women's Army Auxiliary Corps and the Enlisted Reserve Corps. They exclude Army officers and every other service: Navy, Marine Corps and Coast Guard ([NARA, WWII electronic records](https://www.archives.gov/research/military/ww2/electronic-records.html); [NARA press release, 2004](https://www.archives.gov/press/press-releases/2004/nr04-64.html)). The series is the Electronic Army Serial Number Merged File, RG 64 ([NARA Catalog](https://catalog.archives.gov/id/1263923)). If his OMPF burned, search AAD first to test a claimed Army enlistment. A hit gives his Army serial number for the later requests.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e616f5265e98","kind":"unclassified","anchor":"The file was converted from punch-card microfilm. 212 rolls holding about 1.5 million cards were too dark to scan, and 160,390 records only flag that cards at that point were unreadable ([Prologue, 2006](https://www.archives.gov/publications/prologue/2006/spring/aad-ww2.html)). An AAD miss is therefore not evidence that he did not enlist.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-295fa53c5a00","kind":"unclassified","anchor":"- Coded fields, such as residence state and county, need AAD's code lists and field notes. Read the code from the list; do not guess it ([Prologue, 2006](https://www.archives.gov/publications/prologue/2006/spring/aad-ww2.html)).\n- Tell same-name men apart by state of residence and year of birth. For a common surname, narrow the query by state of residence before reading the results.\n- AAD can refuse automated fetches: an automated fetch got HTTP 403 on 2026-11-04. Do not rely on web search to find its record pages. Log a 403 or an empty web search as an access failure, not a no-record finding, and search AAD in a browser session.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0c0fd6a8694e","kind":"unclassified","anchor":"Absence from federal service lists does not show non-service. In Tanner's repeated account, a man missing from every WWI list he searched had served in a National Guard unit [S1], [S3], [S4], [S5], [S6]:","sources":["S1","S3","S4","S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8503c6de0e1a","kind":"unclassified","anchor":"The retellings differ on details (Arizona versus New Mexico Guard). Keep the method, not the specifics. Tanner says such a man was \"never in the Army\", yet his family held the man's Army discharge papers [S1], [S2]. Do not read that phrase as meaning no federal record exists.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ce509e4a9621","kind":"unclassified","anchor":"Search both states' Guard records. Search the unit's later federal designation, but keep the original designation as written [S6], [S7].","sources":["S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb6145f40cf4","kind":"unclassified","anchor":"Check the county for a locally recorded discharge, even if the family holds the Army papers. Tanner found that an Apache County–recorded copy carried information missing from the Army documents [S2]. Record it as a separate source with its own custodian, and compare it field by field. Strauss also found Pennsylvania local records that were not in federal hands [S11].","sources":["S2","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fb3f9a8e1098","kind":"unclassified","anchor":"Search the state archive's WWI historical-project questionnaires and Gold Star files as a\nseparate product from the OMPF or federal burial file. Read the collection's own inclusion\nrule first: Alabama's Gold Star project collected survivors' contributions about service\nmembers who died, so a miss is not a general test of service. Use documented state ties,\nincluding a supported collateral soldier or next of kin living elsewhere, to choose other\ncollections whose scope fits. Birthplace alone need not identify the right one; a relative's\nresidence does not itself establish eligibility. [S23, H1]","sources":["S23","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0f8a0a12cafd","kind":"unclassified","anchor":"Inventory the supplied biography, questionnaire, letters, photographs and notification papers\nrather than treating the result as a service abstract. Record who supplied each family\nstatement, keeping apparent or unknown informants uncertain, and carry names and addresses\nas attributed leads. Where both an online preview and a downloadable packet are available,\ncompare their page/image extents and log omissions before calling the packet inspected.\nContents and access vary by collection; these state papers do not reconstruct a complete\nservice history. The Reclaiming Kin examples motivate the family-file and extent checks;\ntheir historical site controls are not current access promises. [S23]","sources":["S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0cc3ac3c6fee","kind":"unclassified","anchor":"A draft registration shows a man was present when he registered, not that he served [S5], [S14]. The 1917 card asks about prior military service, and Strauss says Guard service was often noted [S14]. Read the whole card, but don't count it as service.","sources":["S5","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cc8a7b087d3f","kind":"unclassified","anchor":"For WWII, the draft records in Record Group 147 cover men only. The Fourth Registration took men born from April 1877 to 16 February 1897. Its cards no longer exist for Alabama, Florida, Georgia, Maine, Mississippi, North Carolina, South Carolina and Tennessee. The other WWII registrations took men born from 17 February 1897 to 31 July 1927 ([NARA, Fourth Registration](https://www.archives.gov/files/research/military/ww2/draft-cards-fourth-registration.pdf); [NARA St. Louis, Selective Service](https://www.archives.gov/st-louis/selective-service)). NARA St. Louis also holds *Classification Records, 1940–1947* for many but not all states. Search the Catalog for his state's series before you rely on it ([NARA Catalog, example](https://catalog.archives.gov/id/2173095)). A classification entry, like a card, is not proof of service.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00c0493da440","kind":"unclassified","anchor":"With a service number and unit, get the morning reports and after-action reports covering his dates. Morning reports and muster rolls are unit records that were not part of the OMPF, and the fire did not touch them [S10], [S16].","sources":["S10","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d526d462e63","kind":"unclassified","anchor":"Check whether the selected morning-report series and period record personnel changes rather\nthan a full roster. McComb describes entries for changes such as promotion, illness or\nabsence [S24]. Where that practice is confirmed, use an independently dated status change\nto choose an initial, bounded run of the supported unit or company's reports. A name missing\non one day then does not show that the man was absent from the unit.","sources":["S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a43c0ce4c386","kind":"unclassified","anchor":"- **Online first:** NARA has been adding digitized WWII Army morning reports to the National Archives Catalog, in the series *Morning Reports, 1940–1946*. When checked on 2026-11-07, it had monthly reports through December 1944 only ([NARA Catalog](https://catalog.archives.gov/id/85713825)). Search the Catalog for the unit and his dates first. If his reports are not there, use the offline route. The 2023 advice that morning reports are \"not online\" [S16] is out of date.\n- **Privacy gate:** <!-- privacy-gate: request --> Morning reports name the men of a unit, and the 1969–1974 reports may concern living people; answer the privacy gate in `SKILL.md` before requesting them or briefing a researcher.\n- **Offline access:** for archival Army morning reports (1912–1968), NPRC does not take written requests. Read them in person at St. Louis by appointment, or hire an independent researcher. Mail and fax requests apply only to non-archival 1969–1974 reports ([NARA](https://www.archives.gov/personnel-records-center/military-personnel/morning-reports-and-unit-rosters)).\n- **Personal entries:** promotions and furloughs, dated to the day [S16]. Log only entries that name him.\n- **Unit context:** movements, incidents and after-action detail [S16]. An after-action report corrected a family memory of an incident's date (Christmas Day versus Christmas Eve) [S16]. Note that it dates the unit's incident, not his part in it.","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6f8e12c480c7","kind":"unclassified","anchor":"**An award reference:** an OMPF decorations field is a lead to an order, not the order\nitself. For Korean War Army records, NARA's 2023 presentation gives two search keys:\nthe General Order (GO) number, or the awarding unit and approximate award date [S28].\nPreserve whichever is actually supplied; a surname alone does not identify the order.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-99cddc3ed04f","kind":"unclassified","anchor":"1. Copy the GO number and any date or issuing unit from the referring document. With\n   only unit/date evidence, identify the actual awarding unit before selecting records.\n   Keep the supported interval and any unresolved command relationship explicit.\n2. Search that unit's actual record descriptions. If the company or battalion search\n   misses, use its documented command relationship to inspect the relevant higher-level\n   regiment or other issuing formation. The presentation shows regimental records that\n   cover subordinate units [S28]; do not substitute an unrelated same-numbered formation.\n3. **Privacy gate:** <!-- privacy-gate: request --> The order can name other award\n   recipients who may be living; answer the privacy gate in `SKILL.md` before requesting it.\n   Retrieve the matching order and retain its locator and extent. Compare the actual\n   name, rank, service number and organization with the independent identity anchors.\n   Keep order, award and action dates in their stated roles. Some orders list only basic\n   award details; record an individual action only when the inspected order states it.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-98a62c0c28ed","kind":"unclassified","anchor":"The presenters describe outbound and returning Army transport passenger lists [S14], [S22]. The [Ancestry database 61174 link](https://search.ancestry.com/search/db.aspx?dbid=61174) is a collection lead: its fetch returned HTTP 403, so the reported RG 92 attribution and 1910–1939 coverage were not confirmed from the collection description [H12]. Check that description before choosing the collection, then search both directions:","sources":["S14","S22","H12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b2a259c6b494","kind":"method","anchor":"- Treat a 1930 census veteran answer as a lead either way: search the transport lists even when the answer is \"no\" [S22].\n- Record the vessel, dates, service number, company/regiment and named nearest relative with the stated relationship [S14].\n- Follow ditto marks up to the top of the page, or back to earlier pages, to read the unit [S22].\n- Compare the relative and address with the census household and city directories before attributing a letter, postcard or identity [S14], [S22].","sources":["S14","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-816efa27dd43","kind":"unclassified","anchor":"Unit histories, unit reports and veterans' associations supply context. One example is a group that sent books and pointers to repositories holding diaries and photographs [S17]. Another is a hospital unit's periodic reports [S19].","sources":["S17","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-50ff10a71ed7","kind":"unclassified","anchor":"- Limit them to his service dates.\n- Exclude later incarnations of the designation. The 97th General Hospital designation stayed in use for a postwar U.S. military hospital in Frankfurt, and that postwar role swamped search results for its WWII service [S18], [S19]. Filter results to his service dates, and confirm the unit number from his documents before searching.\n- Write unit actions as unit context, never as \"he fought at…\". Tanner's own wording (\"I assume, from the record of that unit\") is an inference [S4].","sources":["S18","S19","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7252e879d69f","kind":"unclassified","anchor":"Do not accept the National Archives WWII casualty lists as a complete roster. The presenter found people missing from them by checking newspaper casualty lists, county memorial lists and the full crew of a single crash [S13]. Cross-check all three, and record which roster supplied each name.","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7cca8a6b6a60","kind":"unclassified","anchor":"1. **Register:** one row per product (OMPF/B/R/auxiliary, separate court-martial trial file, burial case file/IDPF with its custodian, VA C-file, VA Master Index card, BIRLS, AAD enlistment record, compensation file, state bonus file, headstone application both sides, Guard records per state, county discharge, state WWI questionnaire/Gold Star packet, morning/after-action reports, award GO, transport lists, unit histories). Each row gives custodian, access status, release used, date requested and result (including page count, refusal, summary-only reply, appeal or pending). For a state questionnaire packet, also retain its subject, collection inclusion rule, family informants and the received page/image extent.\n2. **Dated timeline:** three marked columns: personal entries, unit-level context and derivative annotations.\n3. **Negative searches:** each with its scope (database, name form, branch, state, date range).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0c8f2287000b","kind":"historical","anchor":"Copy the character of discharge exactly as written, and read the discharge papers for the stated reason [S30]. During WWII about 50,000 people received \"blue\" discharges, named for the paper, for \"undesirable habits and traits of character\". About 9,000 of them were men and women discharged because of their sexuality, and African American men were the largest group of recipients. The practice ended on 1 July 1947, when the undesirable discharge replaced the blue discharge and the general discharge was created [S41]. The VA's reading of the GI Bill barred blue-discharge recipients from veterans' benefits [S31], so a missing VA claim file can follow from the discharge type, not from non-service. A blue or other-than-honorable discharge is a lead to the reason for separation; it does not by itself establish his sexuality or any other reason.","sources":["S30","S31","S41"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c60b38a51539","kind":"method","anchor":"Search his school's yearbooks for every war year in which he could have been serving, not only his graduation year. Some WWI- and WWII-era yearbooks carried a list of students in service [S32]. The detail varies. Bangor High School's June 1944 yearbook listed 60 members of the class of 1944 in service, by name only [S33]. A 1919 normal-school yearbook gave five pages of students who served, back to the class of 1892, with name, rank and where each served [S34]. Log a listing as a lead and confirm the branch and unit in service records. A missing listing is not evidence that he did not serve.","sources":["S32","S33","S34"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-43116ac42179","kind":"portal-availability","anchor":"If he served in the Navy, Army morning reports and AAD's WWII Army enlistment file do not cover him; his unit records are the muster rolls of each ship and station he passed through. A muster roll records the date a man reported on board or for duty. The personnel diaries, the Navy's equivalent of the Army's morning rosters, record reporting to and transfer from the activity. For 1939–1956 the rolls list enlisted men only; for an officer serving aboard a commissioned ship, use that ship's deck logs [S35 @2026-11-12]. NARA's muster-roll page points to the Ancestry collection *U.S. World War II Navy Muster Rolls, 1938–1949* [S36 @2026-11-12]. Log each \"received\" and \"transferred\" entry with its roll and month as a dated row, then add the Notice of Separation and the discharge certificate. One account rebuilt a sailor's 1945–1946 moves through a training center, a naval hospital and a carrier this way [S37 @2026-11-12]. The rolls are not daily lists, so a gap between two entries does not place him anywhere [S35 @2026-11-12].","sources":["S35","S36","S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e90166f10f3e","kind":"historical","anchor":"Before reading a miss, check which branch and which deaths each list covers. NARA's 1946 *World War II Honor List of Dead and Missing Army and Army Air Forces Personnel* lists War Department casualties only, by state and then county [S38], [S40]. Each entry gives serial number, rank and type of casualty, not birthplace or residence [S38]. Navy, Marine Corps and Coast Guard men are in the separate 1946 *State Summary of War Casualties*. It covers deaths from enemy action or from operations against the enemy in war zones, and leaves out deaths in the United States and deaths from disease, homicide or suicide anywhere [S39]. A sailor or Marine absent from the Army list, or a man who died stateside or of illness absent from the Navy summary, is outside that list's scope; log the miss as out of scope, not as a negative.","sources":["S38","S40","S39"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
