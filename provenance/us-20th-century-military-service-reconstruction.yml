  - {"id":"S36","kind":"web-page","urls":["https://www.archives.gov/research/military/navy/muster-rolls"],"published":null,"retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","entry_sha256":"6acb1675ea7005d37140a7d6003abdd719886fa42975d0379187a5d5002f1c8c","claims":["C-43116ac42179"],"review":"reviewed"}
  - {"id":"S37","kind":"web-page","urls":["https://familylocket.com/a-navy-life-the-world-war-ii-service-of-bobby-gene-shults/"],"published":"2026-05-25","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","entry_sha256":"717198d653a2881eb3faaa4d6482d6aa4d71229e54cd339636b59e6e14a46c66","claims":["C-43116ac42179"],"review":"reviewed"}
  - {"id":"S38","kind":"web-page","urls":["https://www.archives.gov/research/military/ww2/army-casualties/arizona.html"],"published":null,"retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","entry_sha256":"f3b001f175b87ebd4e53072250d7b2438957095915fb1550faeefeec530ec044","claims":["C-e90166f10f3e"],"review":"reviewed"}
