claims:
  - {"id":"C-dccea303417b","kind":"unclassified","anchor":"Use this when a 20th-century Army or Air Force personnel file burned, came back thin or is restricted, or when a family says a man served but he does not appear in federal lists. The task is to rebuild his service from records held separately from that file, and to log each record's custodian and scope. For older compiled service records, pension files and choosing a custodian, use [military pension file recovery § 1](us-military-pension-file-recovery.md). For the grave and cemetery-record packet, use [burial evidence packet](burial-evidence-packet.md). For naturalization C-files, use [U.S. immigration search recovery](usa-immigration-search-recovery.md). Identity and proof rulings belong in [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f2a3138a2a09","kind":"unclassified","anchor":"Do not claim that the records burned and nothing survives. On July 12, 1973 a fire at the National Personnel Records Center (NPRC) in St. Louis destroyed about 16–18 million Official Military Personnel Files (OMPFs). NARA gives these losses ([NARA, 1973 fire](https://www.archives.gov/personnel-records-center/fire-1973); presenter account in [S11], [S12]):","sources":["S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-26ebd8201e5f","kind":"unclassified","anchor":"- Army: about 80% of files lost for men discharged November 1, 1912 – January 1, 1960.\n- Air Force: about 75% of files lost for discharges September 25, 1947 – January 1, 1964, but only for names alphabetically after \"Hubbard, James E.\"\n- Navy, Marine Corps and Coast Guard: NARA's fire page lists no losses for these branches. Strauss calls them largely unaffected [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d203d929a4fe","kind":"unclassified","anchor":"A discharge date inside a range means the file *may* be lost, not that it is lost. These are exactly the ranges for which NPRC keeps a burned (\"B\") file registry of about 6.5 million recovered records and a reconstructed (\"R\") file registry ([NARA](https://www.archives.gov/personnel-records-center/fire-1973)). Request the file anyway.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eee9a329599c","kind":"unclassified","anchor":"Then check access. OMPFs become archival and open to the public 62 years after separation, on a rolling basis. Before that, full access is limited to the veteran or next of kin ([NARA, OMPF access](https://www.archives.gov/personnel-records-center/ompf-access)). Work out the cutoff from the discharge date. Do not reuse the presenter's example year [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d135f2c0a832","kind":"custody","anchor":"An archival OMPF is open to the public [H22 @2026-11-19]. For access beyond the releasable information in a non-archival file, a third party needs signed, dated authorization from the living veteran or, if deceased, the eligible next of kin with proof of death. NARA defines eligible kin as an unremarried surviving spouse, parent, child or sibling [H3 @2026-11-19]. A grandchild requesting the full non-archival file therefore needs authorization unless acting in another eligible capacity.","sources":["H22","H3"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c87b05240885","kind":"unclassified","anchor":"Request routes: NARA's online request system, eVetRecs ([vetrecs.archives.gov](https://vetrecs.archives.gov/)); Standard Form 180 (SF-180) by mail; an in-person visit to St. Louis by appointment; or an independent researcher ([NARA](https://www.archives.gov/personnel-records-center/military-personnel/morning-reports-and-unit-rosters); [S11]). eVetRecs is not limited to the family. A requester who is neither the veteran nor his next of kin chooses \"Other\", and every user verifies identity through ID.me ([NARA, eVetRecs help](https://www.archives.gov/veterans/military-service-records/evetrecs-help.html)).","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f851d986213e","kind":"method","anchor":"Check a reported fire date and repository against NARA’s description: the fire was at NPRC in St. Louis on 12 July 1973. A presentation placed it in 1979 [S16], [H2]. Use the actual discharge date and affected branch to assess a possible loss.","sources":["S16","H2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d6582d41a40e","kind":"unclassified","anchor":"Name each product in the request, and log the product returned and its page count [S9], [S10]:","sources":["S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-afdc973492ad","kind":"method","anchor":"- **OMPF:** the personnel file itself.\n- **Burnt (B) file:** a file that survived with fire or water damage, listed in NPRC's B-file registry. The presenter says the custodian may scan and email it rather than show the original [S9].\n- **Reconstructed (R) file:** check the sources used in the reconstruction, such as a VA claim, state record, hospital record, final pay voucher or a discharge copy supplied by the veteran [H2], [S9]. Record the documents and page count actually returned.\n- **Auxiliary records:** if the personnel file is missing, ask which auxiliary series cover the branch and period. A final pay voucher can give the service number, dates and character of service [H5]. A final pay roll instead may list the veteran alongside others from the unit [S11]. Transcribe any last unit, duty station, pay and overseas status as recorded for that period [S9]. Log the product under the custodian’s label.","sources":["S9","H2","H5","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fe1348fcb99e","kind":"unclassified","anchor":"Before choosing final pay as a substitute, distinguish a discharge from an in-service\ndeath. NARA's 2023 presentation says a final pay voucher required discharge: a person\nkilled in service would have one only from an earlier break before the final reenlistment\n[S27]. Preserve the evidence for that earlier separation and request the voucher for its\nactual period; an in-service death alone does not supply that target. Use the separate\ndeath-file route below. A missing voucher is not evidence of non-service.","sources":["S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3aa1babc0a92","kind":"unclassified","anchor":"A payroll entry dates the end of service and names the last unit. It is not a full service history. The recorded unit may be a separation unit rather than the operational unit [S27]. Log \"no OMPF; auxiliary returned, 3 pp.\" rather than \"file destroyed\".","sources":["S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8587740d068a","kind":"method","anchor":"- **In-service deaths:** request the WWI burial case file (also called a mortuary or casualty file) or the WWII Individual Deceased Personnel File (IDPF) separately from the OMPF. Do not merge it with the OMPF in the register. Route the request by custodian:\n  - WWI-era burial case files (1915–1939, RG 92) were held at the National Archives in College Park and moved to NARA St. Louis in 2012 [S25].","sources":["S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e532a0f4066b","kind":"unclassified","anchor":"Keep the trial record separate from personnel-file remarks. Gather the service, trial\nyear or bounded interval, court type, original outcome and any later appeal or discharge\nupgrade. NARA's 2024 presentation describes these historical selection distinctions [S26]:","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-96a053888cc3","kind":"unclassified","anchor":"The presentation places surviving summary-court details in the OMPF rather than a separate\ntrial series. Use these distinctions to select a candidate finding description, then\nverify its actual period, custodian, survival and access before requesting it. They do\nnot establish that an individual's file survives or was destroyed. A later discharge\nupgrade alone does not settle survival; preserve the original disposition and appeal dates.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8fa5f778fc56","kind":"unclassified","anchor":"1. Preserve any case number already supplied; otherwise use the **defendant's surname**\n   as the lookup lead. The presentation describes staff card indexes arranged by service\n   and surname, not by the victim or witness [S26]. Check the custodian's present finder\n   and request requirements rather than assuming the 2024 index format is unchanged.\n2. Supply the service, all known names and aliases, including married/maiden names, and\n   the trial date or bounded interval. Keep unit and trial location as additional clues\n   when the date is uncertain. For a joint trial, one known defendant can supply the\n   individual card lead; the presentation does not require every defendant's name [S26].\n3. Retain any separately cited appeal case number as another retrieval target. Record\n   the trial file requested, the actual file or personnel-file extract returned, its\n   extent and unresolved references. Personnel remarks are not the trial transcript.","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-101a36aff879","kind":"method","anchor":"Retrieve the government headstone or marker application and read **both sides**. In the 1925–1949 series, search NARA M1916 for 1925–1941 and M2113 for 1941–1949 [H11]. A WWI application reportedly had assignments written on its reverse in an unidentified hand [S1], [S4], [S5], [S7]. Record them as leads for service records.","sources":["H11","S1","S4","S5","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c03ac3d58a46","kind":"unclassified","anchor":"The stone itself can supply the unit when nothing else names it [S5], [S6].","sources":["S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0dc39584731b","kind":"portal-availability","anchor":"A missing entry in the Nationwide Gravesite Locator cannot exclude a VA marker. The VA says it lacks private-cemetery burial information from before 1997 [S68 @2026-11-19]. Record the search and check the cemetery, marker and headstone application directly [S5 @2026-11-19].","sources":["S68","S5"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-e16c6408fd0b","kind":"unclassified","anchor":"NARA's WWII Army Enlistment Records in the Access to Archival Databases (AAD) hold about 9 million Army enlistments from 1938–1946, including the Women's Army Auxiliary Corps and the Enlisted Reserve Corps. They exclude Army officers and every other service: Navy, Marine Corps and Coast Guard ([NARA, WWII electronic records](https://www.archives.gov/research/military/ww2/electronic-records.html); [NARA press release, 2004](https://www.archives.gov/press/press-releases/2004/nr04-64.html)). The series is the Electronic Army Serial Number Merged File, RG 64 ([NARA Catalog](https://catalog.archives.gov/id/1263923)). If his OMPF burned, search AAD first to test a claimed Army enlistment. A hit gives his Army serial number for the later requests.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e616f5265e98","kind":"unclassified","anchor":"The file was converted from punch-card microfilm. 212 rolls holding about 1.5 million cards were too dark to scan, and 160,390 records only flag that cards at that point were unreadable ([Prologue, 2006](https://www.archives.gov/publications/prologue/2006/spring/aad-ww2.html)). An AAD miss is therefore not evidence that he did not enlist.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-295fa53c5a00","kind":"unclassified","anchor":"- Coded fields, such as residence state and county, need AAD's code lists and field notes. Read the code from the list; do not guess it ([Prologue, 2006](https://www.archives.gov/publications/prologue/2006/spring/aad-ww2.html)).\n- Tell same-name men apart by state of residence and year of birth. For a common surname, narrow the query by state of residence before reading the results.\n- AAD can refuse automated fetches: an automated fetch got HTTP 403 on 2026-11-04. Do not rely on web search to find its record pages. Log a 403 or an empty web search as an access failure, not a no-record finding, and search AAD in a browser session.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0c0fd6a8694e","kind":"method","anchor":"If federal lists miss a WWI veteran, check the state National Guard and follow any transfer or attachment across state lines. In one account, the family held an Army discharge for a man whose route through the Guard had eluded the researcher’s federal searches [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8503c6de0e1a","kind":"method","anchor":"Keep the original enlistment and later unit designations separate. The accounts disagree about Arizona and New Mexico. Check both Guard rosters and the reported Texas attachment before assigning an originating state [S3], [S4], [S5], [S6].","sources":["S3","S4","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ce509e4a9621","kind":"unclassified","anchor":"Search both states' Guard records. Search the unit's later federal designation, but keep the original designation as written [S6], [S7].","sources":["S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb6145f40cf4","kind":"method","anchor":"Request the locally recorded discharge even when the family has Army papers. A reported Apache County copy contained details absent from the federal documents [S2]. Compare each field and retain the county’s own volume and page. Also check local veterans’ records in the state of residence [S11].","sources":["S2","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fb3f9a8e1098","kind":"unclassified","anchor":"Search the state archive's WWI historical-project questionnaires and Gold Star files as a\nseparate product from the OMPF or federal burial file. Read the collection's own inclusion\nrule first: Alabama's Gold Star project collected survivors' contributions about service\nmembers who died, so a miss is not a general test of service. Use documented state ties,\nincluding a supported collateral soldier or next of kin living elsewhere, to choose other\ncollections whose scope fits. Birthplace alone need not identify the right one; a relative's\nresidence does not itself establish eligibility. [S23, H1]","sources":["S23","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0f8a0a12cafd","kind":"unclassified","anchor":"Inventory the supplied biography, questionnaire, letters, photographs and notification papers\nrather than treating the result as a service abstract. Record who supplied each family\nstatement, keeping apparent or unknown informants uncertain, and carry names and addresses\nas attributed leads. Where both an online preview and a downloadable packet are available,\ncompare their page/image extents and log omissions before calling the packet inspected.\nContents and access vary by collection; these state papers do not reconstruct a complete\nservice history. The Reclaiming Kin examples motivate the family-file and extent checks;\ntheir historical site controls are not current access promises. [S23]","sources":["S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0cc3ac3c6fee","kind":"unclassified","anchor":"A draft registration shows a man was present when he registered, not that he served [S5], [S14]. The 1917 card asks about prior military service, and Strauss says Guard service was often noted [S14]. Read the whole card, but don't count it as service.","sources":["S5","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cc8a7b087d3f","kind":"unclassified","anchor":"For WWII, the draft records in Record Group 147 cover men only. The Fourth Registration took men born from April 1877 to 16 February 1897. Its cards no longer exist for Alabama, Florida, Georgia, Maine, Mississippi, North Carolina, South Carolina and Tennessee. The other WWII registrations took men born from 17 February 1897 to 31 July 1927 ([NARA, Fourth Registration](https://www.archives.gov/files/research/military/ww2/draft-cards-fourth-registration.pdf); [NARA St. Louis, Selective Service](https://www.archives.gov/st-louis/selective-service)). NARA St. Louis also holds *Classification Records, 1940–1947* for many but not all states. Search the Catalog for his state's series before you rely on it ([NARA Catalog, example](https://catalog.archives.gov/id/2173095)). A classification entry, like a card, is not proof of service.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00c0493da440","kind":"unclassified","anchor":"With a service number and unit, get the morning reports and after-action reports covering his dates. Morning reports and muster rolls are unit records that were not part of the OMPF, and the fire did not touch them [S10], [S16].","sources":["S10","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d526d462e63","kind":"unclassified","anchor":"Check whether the selected morning-report series and period record personnel changes rather\nthan a full roster. McComb describes entries for changes such as promotion, illness or\nabsence [S24]. Where that practice is confirmed, use an independently dated status change\nto choose an initial, bounded run of the supported unit or company's reports. A name missing\non one day then does not show that the man was absent from the unit.","sources":["S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a43c0ce4c386","kind":"portal-availability","anchor":"- **Online first:** search the National Archives Catalog’s *Morning Reports, 1940–1946* (NAID 85713825) for the unit and dates [H29 @2026-11-07]. The series span alone does not establish that the needed monthly report is online. The 7 November 2026 check found monthly files through December 1944 [H29 @2026-11-07]. Record the files and dates currently visible. If the target is absent, check offline access [H4 @2026-11-07].","sources":["H29","H4"],"checked":"2026-11-07","stated_as":"observation","review":"reviewed"}
  - {"id":"C-6f8e12c480c7","kind":"unclassified","anchor":"**An award reference:** an OMPF decorations field is a lead to an order, not the order\nitself. For Korean War Army records, NARA's 2023 presentation gives two search keys:\nthe General Order (GO) number, or the awarding unit and approximate award date [S28].\nPreserve whichever is actually supplied; a surname alone does not identify the order.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-99cddc3ed04f","kind":"unclassified","anchor":"1. Copy the GO number and any date or issuing unit from the referring document. With\n   only unit/date evidence, identify the actual awarding unit before selecting records.\n   Keep the supported interval and any unresolved command relationship explicit.\n2. Search that unit's actual record descriptions. If the company or battalion search\n   misses, use its documented command relationship to inspect the relevant higher-level\n   regiment or other issuing formation. The presentation shows regimental records that\n   cover subordinate units [S28]; do not substitute an unrelated same-numbered formation.\n3. **Privacy gate:** <!-- privacy-gate: request --> The order can name other award\n   recipients who may be living; answer the privacy gate in `SKILL.md` before requesting it.\n   Retrieve the matching order and retain its locator and extent. Compare the actual\n   name, rank, service number and organization with the independent identity anchors.\n   Keep order, award and action dates in their stated roles. Some orders list only basic\n   award details; record an individual action only when the inspected order states it.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-98a62c0c28ed","kind":"unclassified","anchor":"The presenters describe outbound and returning Army transport passenger lists [S14], [S22]. The [Ancestry database 61174 link](https://search.ancestry.com/search/db.aspx?dbid=61174) is a collection lead: its fetch returned HTTP 403, so the reported RG 92 attribution and 1910–1939 coverage were not confirmed from the collection description [H12]. Check that description before choosing the collection, then search both directions:","sources":["S14","S22","H12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b2a259c6b494","kind":"method","anchor":"- Treat a 1930 census veteran answer as a lead either way: search the transport lists even when the answer is \"no\" [S22].\n- Record the vessel, dates, service number, company/regiment and named nearest relative with the stated relationship [S14].\n- Follow ditto marks up to the top of the page, or back to earlier pages, to read the unit [S22].\n- Compare the relative and address with the census household and city directories before attributing a letter, postcard or identity [S14], [S22].","sources":["S14","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-816efa27dd43","kind":"method","anchor":"Ask the veterans’ association which repositories hold diaries or photographs, and check the unit’s periodic reports, including hospital reports [S17], [S19].","sources":["S17","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-50ff10a71ed7","kind":"method","anchor":"- Limit them to his service dates.\n- Search the unit number with its dates and station. Postwar Frankfurt results for the 97th General Hospital can obscure a search for its wartime records [S18], [S19].\n- Use a report of a unit action to identify the date to check for an individual posting, absence or transfer. A recorded unit action alone cannot place a named veteran there [S4].","sources":["S18","S19","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7252e879d69f","kind":"method","anchor":"Compare the federal WWII casualty roster for the relevant branch and circumstances with local newspaper casualty lists, county memorial lists and, for a crash, the full crew roster. Differences can reveal a name missed in the initial search [S13]. Record which list or report supplies each name and verify the individual’s status.","sources":["S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7cca8a6b6a60","kind":"unclassified","anchor":"1. **Register:** one row per product (OMPF/B/R/auxiliary, separate court-martial trial file, burial case file/IDPF with its custodian, VA C-file, VA Master Index card, BIRLS, AAD enlistment record, compensation file, state bonus file, headstone application both sides, Guard records per state, county discharge, state WWI questionnaire/Gold Star packet, morning/after-action reports, award GO, transport lists, unit histories). Each row gives custodian, access status, release used, date requested and result (including page count, refusal, summary-only reply, appeal or pending). For a state questionnaire packet, also retain its subject, collection inclusion rule, family informants and the received page/image extent.\n2. **Dated timeline:** three marked columns: personal entries, unit-level context and derivative annotations.\n3. **Negative searches:** each with its scope (database, name form, branch, state, date range).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0c8f2287000b","kind":"historical","anchor":"Copy the character of discharge exactly as written, and read the discharge papers for the stated reason [S30]. During WWII about 50,000 people received \"blue\" discharges, named for the paper, for \"undesirable habits and traits of character\". About 9,000 of them were men and women discharged because of their sexuality, and African American men were the largest group of recipients. The practice ended on 1 July 1947, when the undesirable discharge replaced the blue discharge and the general discharge was created [S41]. The VA's reading of the GI Bill barred blue-discharge recipients from veterans' benefits [S31], so a missing VA claim file can follow from the discharge type, not from non-service. A blue or other-than-honorable discharge is a lead to the reason for separation; it does not by itself establish his sexuality or any other reason.","sources":["S30","S31","S41"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c60b38a51539","kind":"method","anchor":"Search school yearbooks for the war years as well as the graduation year [S32]. Bangor’s June 1944 yearbook named members of the graduating class in service without giving their units [S33]. An alumni roll can instead reach back across classes: a 1919 normal-school yearbook included students from as far back as 1892, with ranks and service locations [S34]. Verify any proposed service in a military record and confine a miss to the years and lists actually checked.","sources":["S32","S33","S34"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-43116ac42179","kind":"portal-availability","anchor":"If he served in the Navy, Army morning reports and AAD's WWII Army enlistment file do not cover him; his unit records are the muster rolls of each ship and station he passed through. A muster roll records the date a man reported on board or for duty. The personnel diaries, the Navy's equivalent of the Army's morning rosters, record reporting to and transfer from the activity. For 1939–1956 the rolls list enlisted men only; for an officer serving aboard a commissioned ship, use that ship's deck logs [S35 @2026-11-12]. NARA's muster-roll page points to the Ancestry collection *U.S. World War II Navy Muster Rolls, 1938–1949* [S36 @2026-11-12]. Log each \"received\" and \"transferred\" entry with its roll and month as a dated row, then add the Notice of Separation and the discharge certificate. Follow transfers through shore stations and naval hospitals as well as ships [S37 @2026-11-12]. The rolls are not daily lists, so a gap between two entries does not place him anywhere [S35 @2026-11-12].","sources":["S35","S36","S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e90166f10f3e","kind":"historical","anchor":"Before reading a miss, check which branch and which deaths each list covers. NARA's 1946 *World War II Honor List of Dead and Missing Army and Army Air Forces Personnel* lists War Department casualties only, by state and then county [S38], [S40]. Each entry gives serial number, rank and type of casualty, not birthplace or residence [S38]. Navy, Marine Corps and Coast Guard men are in the separate 1946 *State Summary of War Casualties*. It covers deaths from enemy action or from operations against the enemy in war zones, and leaves out deaths in the United States and deaths from disease, homicide or suicide anywhere [S39]. A sailor or Marine absent from the Army list, or a man who died stateside or of illness absent from the Navy summary, is outside that list's scope; log the miss as out of scope, not as a negative.","sources":["S38","S40","S39"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-68bc8a2c7dab","kind":"custody","anchor":"For proof of death, send one of NARA's examples: a copy of the death certificate, a letter from the funeral home or a published obituary [H3 @2026-11-16], [S42 @2026-11-16].","sources":["H3","S42"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a3453b1d28a","kind":"custody","anchor":"Without the veteran's or next of kin's consent, NPRC releases only limited information from a non-archival file [S43 @2026-11-16], [S42 @2026-11-16]. NPRC's FOIA page gives examples of what may be released: name, service number, dates and branch of service, final duty status, final rank, assignments and geographical locations, military education level, award eligibility (not the medals), photograph, court-martial trial transcripts, and place of entrance and separation. For a deceased veteran it adds place of birth, date and place of death, and place of burial [S44 @2026-11-16]. Log such a reply as a limited release, not as the file and not as a thin file. Use its assignments and dates to choose unit records, and seek the authorization above for the rest.","sources":["S43","S42","S44"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b6abda57c1ae","kind":"custody","anchor":"- **Officer pay card:** for an Army officer, also ask for his pay card. NARA St. Louis holds Army officer pay cards for 1917–1921 and 1940–1951 [H5 @2026-11-16], [S42 @2026-11-16]. A WWII officer's card can give his serial number, grade, branch, dependents, date he entered and place he was ordered to active duty, years of service, mailing address, prior enlisted service, promotions, and the date and authority of his relief from active duty. These are archival records: NARA takes written requests by mail, fax or email and needs no veteran's or next-of-kin signature for copies [S45 @2026-11-16].\n- **Other auxiliary series:** NARA St. Louis also lists Army Surgeon General's Office admission records (about 7.8 million hospital or treatment-facility admissions: 1942–1945 for the Army and Army Air Corps, and Army records listed as \"1950 and 1954\") and VA index cards for 1917 to 19 September 1940 and for 20 September 1940 to January 1972 [H5 @2026-11-16], [S42 @2026-11-16]. Its holdings page gives no access route for these series, only \"Check back later for more information\". Name each series in the auxiliary request, log each reply as its own product, and keep an unanswered series open. An admission record shows health status: treat it as sensitive data under the privacy gate. The earlier VA cards' span matches the VA Master Index on FamilySearch (below); search there first.","sources":["H5","S42","S45"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-541a8ba9280f","kind":"historical","anchor":"- **BIRLS entry:** Reclaim The Records describes each entry as giving name, birth and death dates, branch of service, and enlistment and release dates [S48]; MyHeritage's 2025 release of the same index, *United States, Deceased Veteran Benefit Claims*, described the same date fields [S47]. When the OMPF burned, use these dates to bound the auxiliary, unit-record and claim-file requests. Log them as an index entry, not as a discharge document.","sources":["S48","S47"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-af74be788b85","kind":"historical","anchor":"An OMPF is primarily an administrative record. NARA states that it does not contain detailed information about the veteran's participation in battles and engagements [S46]. Do not read the file's silence about a battle as evidence that he was not there; take engagements from the unit records below and log them as unit context [S42].","sources":["S46","S42"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b4045adaabf5","kind":"custody","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> Morning reports and unit rosters name the men of a unit, and the Air Force reports to 1966 and the 1969–1974 Army reports and rosters may concern living people; answer the privacy gate in `SKILL.md` before requesting them or briefing a researcher.\n- **Unit rosters:** Army unit rosters, which include the Army Air Corps and Army Air Forces, follow the same split. Rosters for 1912–1968 are archival: no written requests, and NARA does not mail copies of the microfilmed rosters. Rosters for 1969–1974 are requested on a signed, dated SF-180 by mail or fax. The 1944–1946 Army rosters were destroyed; do not request them, and do not log their absence as a finding about him [H4 @2026-11-16], [H5 @2026-11-16], [S42 @2026-11-16].\n- **Air Force:** a WWII airman's unit reports are in the Army morning reports, which include the Army Air Corps and Army Air Forces. Separate Air Force morning reports run from September 1947 to 30 June 1966 [H5 @2026-11-16], [S42 @2026-11-16]. All Air Force morning reports are archival, so the same in-person or researcher route applies; NARA takes no written requests for them [H4 @2026-11-16].","sources":["H4","H5","S42"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-613a95c24142","kind":"historical","anchor":"Do not order the destroyed original punch cards as a fuller version of an AAD enlistment entry. NARA explains that the originals were destroyed after microfilming; the microfilm survives. Do not describe the AAD entry as a digital-only surviving record. [S55](https://www.pricegen.com/8127-2/), [S56](https://www.archives.gov/publications/prologue/2006/spring/aad-ww2.html)","sources":["S55","S56"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-acea78bb544e","kind":"historical","anchor":"Read a WWI draft card against its actual form. The third registration's Card C has no birthplace or marital-status question; Card B asks the father's birthplace. A nearest-relative name and address do not state that person's relationship. Cards A and B print an instruction to cut a corner for a registrant recorded as of African descent; a damaged corner alone is not a racial identification. Copy the form's labels before interpreting missing fields or physical marks. [S49](https://www.pricegen.com/my-world-war-i-ancestors/), [S50](https://genealogytipoftheday.com/index.php/2025/06/02/there-were-three-us-world-war-i-draft-registrations/), [S51](https://www.archives.gov/research/military/ww1/draft-registration), [S52](https://www.archives.gov/files/research/genealogy/charts-forms/ww1-draft-a.pdf), [S53](https://www.archives.gov/files/research/genealogy/charts-forms/ww1-draft-b.pdf), [S54](https://www.archives.gov/files/research/genealogy/charts-forms/ww1-draft-c.pdf)","sources":["S49","S50","S51","S52","S53","S54"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c92a59d7bf30","kind":"historical","anchor":"Where two numbers appear at the top, copy each with its printed heading. NARA's blank Card B has Serial No. on the left and Registration No. on the right; Card C has Serial Number on the left and Order Number on the right. Do not record an unlabeled number as a service number. [S53](https://www.archives.gov/files/research/genealogy/charts-forms/ww1-draft-b.pdf), [S54](https://www.archives.gov/files/research/genealogy/charts-forms/ww1-draft-c.pdf)","sources":["S53","S54"],"checked":"2026-11-17","stated_as":"fact","review":"reviewed"}
  - {"id":"C-01d6b5b34cfd","kind":"method","anchor":"For possible Quaker affiliation, use the suggestion from the available excerpt of *Just\nGenealogy* and check surviving military papers for a religion entry [S62].\nFor WWI, look for a burial-related entry on a service health form. For WWII, check the\npersonnel papers for a recorded religious preference [S63]. If the WWII Army papers include\na stateside Hospital Report of Death (WD AGO Form 52-9), check item 7 [S64]. Copy the entry\nas written. A broad category or a blank field leaves Quaker membership unresolved.","sources":["S62","S63","S64"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3c5833758697","kind":"custody","anchor":"For an early Army court-martial, check the 1894–1917 case files at the National Archives\nin Washington, DC (RG 153, NAID 5916762) [S60 @2026-11-18]. Use the 1891–1917\nindex (RG 153, entry 17) to find a missing general court-martial case number\n[S61 @2026-11-18]. For a trial in 1917, check\nwhich series covers its date before choosing the lookup procedure.","sources":["S60","S61"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4e1e0d91045c","kind":"method","anchor":"If earlier Regular Army service is plausible, search the *Register of Enlistments in the\nU.S. Army, 1798–1914* (NARA microfilm M233, RG 94) even when his WWI or WWII draft\ncard is silent. Start with the likely enlistment years. Check the entry's age and birthplace\nagainst your identity evidence, then record the unit and read the remarks for service dates\nand changes [S58]. The WWII Fourth Registration card has no prior-service field [S59].\nA veteran’s WWI and WWII draft cards reportedly omitted his 1907–1909 service in the 13th U.S. Cavalry [S57].","sources":["S58","S59","S57"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fd2747d5eab0","kind":"method","anchor":"For WWI Army unit research, search the Center of Military History's *Order of Battle of\nthe United States Land Forces in the World War* by title and volume. Use volume 3, part 2\nfor a U.S. post or camp and volumes 1–2 for American Expeditionary Forces (AEF)\norganizations [S66]. The suggestion from the available excerpt is to search stateside\nand overseas service separately [S65]. The Zone of the Interior includes U.S. possessions,\nand its *Directory of Troops* (volume 3, part 3) also lists AEF units [S67]. Verify the\nunit's location for the relevant period before drawing an inference from its inclusion.","sources":["S66","S65","S67"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c7a2e72e7489","kind":"custody","anchor":"- WWII Army IDPFs: search the National Archives Catalog for his file first, then ask NARA St. Louis, whatever his surname. NARA St. Louis lists IDPFs for 1939–1975 among its holdings [H6 @2026-11-19] and states that WWII Army IDPFs for surnames M–Z are open [H7 @2026-11-19]. The catalogue check on 7 November 2026 found digitized A–E surname files in the IDPF series [H23 @2026-11-19]. Older accounts split custody by surname between NARA and the Army, so do not route by surname alone. If NARA St. Louis says it does not hold the file, send a FOIA request to the U.S. Army Human Resources Command at Fort Knox, Kentucky. A 2025 History Hub reply gives the address and what to include [H24 @2026-11-19].","sources":["H6","H7","H23","H24"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-093aed8c096a","kind":"method","anchor":"- Expect cause and date of death, temporary and permanent burial, medical records and sometimes a burial-site map [S10].\n- **VA claim file (VA C-file or XC-file):** request it by FOIA. It exists only if a benefits claim was made ([H8]; [S18], [S20], [S21]).","sources":["S10","H8","S18","S20","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f815be4eefb2","kind":"portal-availability","anchor":"- Reclaim The Records offers a fax-based FOIA request for a deceased veteran’s claim file and publishes information on appeals [H8 @2026-11-19], [H9 @2026-11-19].","sources":["H8","H9"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-804e5f963111","kind":"method","anchor":"- Inspect the claim file for a separation document such as DD Form 214 or WD AGO Form 53-55. Copy its actual form number, unit and decorations separately from the claim decision [S18].\n  - Log the submission and reply dates. One request’s turnaround does not predict another’s [S18].\n  - Record whether the reply supplies copies or only a summary. Reclaim The Records reported a change to summary-only replies in July 2025 [H9]. Preserve any stated reason for withholding records and the appeal instructions [S21]. A withheld file remains distinct from a search that found no file.\n  - Name: keep the VA C-file apart from the USCIS C-file, which shares the label [S21].","sources":["S18","H9","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ce98cf2537ae","kind":"portal-availability","anchor":"- **VA Master Index card (1917–1940):** NARA St. Louis holds the index, and FamilySearch offers a free searchable collection [H10 @2026-11-19]. Log the card separately from a VA claim file [S20 @2026-11-19].\n- **BIRLS entry:** BIRLS (Beneficiary Identification Records Locator Subsystem) is a VA index of veterans and beneficiaries who claimed benefits, built from the 1980s on. Death does not create a BIRLS record. The public release covers only veterans the VA has confirmed as deceased ([H8 @2026-11-19]; [S17 @2026-11-19]). A BIRLS hit tells you a claim file may exist. Log it as its own product.","sources":["H10","S20","H8","S17"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0d10299b2b4a","kind":"method","anchor":"- **Compensation file:** take the custodian and series from the file’s heading or citation. Extract company, battalion or division and any dated engagements it actually lists [S17].\n- **State bonus file:** many states paid their own WWI bonus or compensation. The application files are state records with a state custodian, separate from the OMPF. Search the archives of the veteran's home state [S29]:","sources":["S17","S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ebe3b3a981e4","kind":"portal-availability","anchor":"- Pennsylvania State Archives, RG 19, Series 19.91, *World War I Veterans Service and Compensation File, 1917–1919, 1934–1948*. It records residence, unit, service and overseas dates, discharge, and dependents' names and addresses. Images are on Ancestry, with free access for Pennsylvania residents through Ancestry Pennsylvania [H16 @2026-11-19], [H17 @2026-11-19], [H18 @2026-11-19].\n  - The State Historical Society of Iowa’s WWI applications have a FamilySearch index [H19 @2026-11-19].\n  - FamilySearch lists the Washington State Archives collection of veterans’ compensation applications [H20 @2026-11-19].\n  - Use: the state holds these files, so they can supply a dated residence and service details when the OMPF burned in 1973. Cite the state custodian and series, not the federal one.","sources":["H16","H17","H18","H19","H20"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f27eefd2130f","kind":"custody","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> Morning reports name the men of a unit, and the 1969–1974 reports may concern living people; answer the privacy gate in `SKILL.md` before requesting them or briefing a researcher.\n- **Offline access:** for archival Army morning reports (1912–1968), NPRC does not take written requests. Read them in person at St. Louis by appointment, or hire an independent researcher. Mail and fax requests apply only to non-archival 1969–1974 reports [H4 @2026-11-16].","sources":["H4"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-3f33841f6711","kind":"method","anchor":"- **Personal entries:** promotions and furloughs, dated to the day [S16]. Log only entries that name him.\n- **Unit context:** date unit movements and incidents from unit records. An after-action report placed one incident on Christmas Eve when family memory placed it on Christmas Day [S16]. Seek an individual entry before placing the veteran there.","sources":["S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b6e94165aacd","kind":"method","anchor":"Before closing a WWII Army decorations search, read the darkened pages of surviving\ncopies for award references and use any order number in the award-order search below\n[H2], [S69]. One incomplete, darkened set of papers reportedly yielded a Good Conduct\nAward reference [S69].","sources":["H2","S69"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4370fe148575","kind":"platform-ui","anchor":"Check the user's Fold3 account for *US, Morning Reports, 1912–1939*, listed by NARA\nstaff in 2024 [S75 @2026-11-20]. Use the company ranges from the available excerpt of\nthe April 2022 walkthrough when the account offers them [S74 @2026-11-20]. Match\nthe exact company and month before reading the images.","sources":["S75","S74"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-52252a32f212","kind":"method","anchor":"If Fold3 lacks the target company or month, log the gap and use the offline route\nabove. For WWI reports, look up the arm of service or unit type and unit number in\nthe NARA morning-report index. Use the box number on the index card to locate the\nmicrofilm reel [S76].","sources":["S76"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09801c92af3d","kind":"method","anchor":"On a WWI monthly form, use the month and year in the heading and the day number\nin the dated remark to place the status change. Read the daily strength columns as\nunit totals and the signed men’s rations figures as ration changes. Use the named\nremarks to establish who went sick, returned to duty, joined or left. Match a\nsurname-only entry against the documented company and retain the service number\nwhere given. Keep the identification open if more than one person fits [S76].","sources":["S76"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6fe1bebfe833","kind":"method","anchor":"Use **Station and Record of Events** to date the company’s locations and movements.\nFollow the suggestion from the available excerpt and check this section as well as\nthe remarks for individual names and serial numbers [S74]. Keep the itinerary in\nunit context unless an entry ties the person to the event. Follow any continuation sheets,\nincluding typed pages, and match them to the unit and date before reading the\nreport as complete [S76], [S77].","sources":["S74","S76","S77"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-87631cb2d921","kind":"portal-availability","anchor":"For WWI transport, check Ancestry collection 61174 even when the NARA Catalog has\nno images for the target direction. NARA's partner table points both RG 92 series\nto the same Ancestry collection, with incoming lists at NAID 6234465 and outgoing\nlists at NAID 6234477. Read the availability column as the status in NARA's own\nCatalog. Use the partner table to identify the database if its description is\nblocked. Check the vessel and date coverage on Ancestry for each direction\n[S71 @2026-11-20].","sources":["S71"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-3876ae858295","kind":"portal-availability","anchor":"Search by the veteran's name in the Ancestry collection and look for the outbound\nand return images separately. Compare any recorded rank, unit, service number\nand next of kin across the two results and against the independent identity\nevidence. Record the ship, voyage date and port in the role each manifest gives\nthem [S71 @2026-11-20], [S72 @2026-11-20].","sources":["S71","S72"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f495fad864d1","kind":"method","anchor":"If the outbound manifest places him on a voyage overseas and the return search\ncomes up empty, keep the return unresolved. When his fate is also unresolved,\ncheck the WWI burial-case series for a possible death in service [S61].","sources":["S61"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f5a6c24d946b","kind":"method","anchor":"If you have a unit and need the ship, use the finding-aid approach\nfrom the available excerpt [S70]. For WWI, start with RG 92 entry 2043 for U.S.\ndepartures to Europe in 1917–1919, entry 2051 for organizations traveling overseas\nand back in 1918–1919, or entry 2053 for troop returns in 1918–1920. Search by\norganization type and unit number. Keep the ship, date and port with the unit lead. For the archival passenger\nlists, look under the vessel and then the date in entry 2060 for incoming voyages\nor entry 2061 for outgoing voyages [S61].","sources":["S70","S61"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-35bc65713b87","kind":"method","anchor":"If a WWI morning report records an embarkation without naming the ship, use the\ndivision's **Movement Overseas** section in *Order of Battle of the United States\nLand Forces in the World War*, volume 2 (CMH Pub 23-2), to bound the sailing date\nand port [S78]. Use those leads and the exact unit in the vessel indexes, then\nverify the person's voyage on the manifest [S61].","sources":["S78","S61"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3314cb0ed13a","kind":"portal-availability","anchor":"For a missing WWII Army Air Forces crew, look for the *Missing Air Crew Report*\n(MACR). If the report number is unknown, browse the digitized crew-name card index\nin the NARA Catalog (RG 92, entry A1 2109-A). Use the report number to retrieve the\nfile in the Catalog (entry A1 2109-B) or in Fold3's M1380 collection. Record the\nMACR as its own product and compare the names, service numbers and crew positions\nactually given with the casualty list [S73 @2026-11-20], [S71 @2026-11-20].","sources":["S73","S71"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-38f4e25d3bad","kind":"portal-availability","anchor":"If the soldier's handwritten name on a WWI letter is hard to read, search MyHeritage's *United States, World War I Draft Registrations, 1917–1918* for the tentative name [S79 @2026-11-21], [S80 @2026-11-21]. Check that the collection search opens in your account before logging a miss.","sources":["S79","S80"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8979e2deac0c","kind":"method","anchor":"Use the envelope's destination as an initial locality clue [S79]. Compare the full address locally with each candidate card's home address. Where a nearest relative is listed, compare both the name and address with the envelope. Keep the envelope address attributed to the addressee until evidence places the soldier there. If the locality yields no hit, drop it as a filter and check other plausible registration localities. For a browse search, use NARA microfilm M1509 by state or territory, then county or city and draft board [S81].","sources":["S79","S81"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-request-1","kind":"portal-availability","anchor":"Before submitting the OMPF request to NPRC, gather the full name used in service, branch, service dates and the service number or Social Security number required for the request. When the service number is unknown, have the birth date and birthplace ready. For a file that may have burned, use the three identifiers from the available excerpt [S125 @2026-11-22]. Add the place of discharge, last assigned unit and place of entry if known. Use the request above even if the file’s fate is unresolved [S82 @2026-11-22], [S83 @2026-11-22].","sources":["S125","S82","S83"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-deserter-1","kind":"portal-availability","anchor":"For a documented WWII Army desertion lead in 1943–1945, search *U.S., WWII Army Deserters Pay Cards, 1943–1945* (Ancestry collection 61993). Check that the collection opens in your account before logging an absence [S82 @2026-11-22], [S86 @2026-11-22].","sources":["S82","S86"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-deserter-2","kind":"method","anchor":"If the collection is unavailable, use the series title and NAID 4713145 to locate the NARA description. Copy the service number, organization and date from the card. Use them to pursue any trial record and verify the final disposition independently of the pay entry [S85].","sources":["S85"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-vami-1","kind":"portal-availability","anchor":"If a VA Master Index search returns extracted details alone, follow the image lookup from the available excerpt [S113 @2026-11-22]. Use FamilySearch collection 2968245 to find the card and read its number prefixes and annotations [S96 @2026-11-22].","sources":["S113","S96"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-vami-2","kind":"method","anchor":"On a VA Master Index card, copy the birth and death dates, any address, rank, unit, branch and dates of entry and discharge as labeled. Keep the date or purpose of the address unresolved if the card supplies neither. Bound a miss in the 1917–1940 index by the benefits, pension or insurance activity it indexes for veterans or heirs in that claim window. Continue with another military record series after a miss [S95], [S96].","sources":["S95","S96"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-vami-3","kind":"method","anchor":"Use the comparison from the available excerpt [S113]. Match the WWI service card to the VA Master Index card on the service number where recorded and the birth, entry and discharge dates. If the service card and gravestone leave the death date unresolved, check the index card for a recorded date and corroborate it separately [S96], [S91].","sources":["S113","S96","S91"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-vami-4","kind":"method","anchor":"Copy VA claim, service and insurance numbers with their prefixes. Use NARA’s *VA Master Index Codes* to select the right number for the record wanted. For an F-prefixed insurance file number, check the reverse for additional numbers [S97].","sources":["S97"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-pow-1","kind":"portal-availability","anchor":"Search *US World War II Prisoners of War, 1941–1946* (MyHeritage collection 10080) or NARA’s *World War II Prisoners of War Data File* in AAD (RG 389, NAID 1263907). Match the serial number and branch or civilian status. Copy the parent unit, theater of capture, reporting date and camp as separate fields. Verify the collection opens and covers the event before recording a miss [S102 @2026-11-22], [S103 @2026-11-22], [S104 @2026-11-22], [S105 @2026-11-22].","sources":["S102","S103","S104","S105"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-pow-2","kind":"historical","anchor":"Read an RG 389 entry as a War Department compilation made using copies of International Committee of the Red Cross reports. Keep the date reported distinct from the date of capture. Some people listed in the underlying reports or cables are absent from the compilation, so continue checking capture or internment records when a search misses [S102], [S104].","sources":["S102","S104"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-aad-1","kind":"portal-availability","anchor":"In AAD’s *Electronic Army Serial Number Merged File*, select the Enlistment Records table for general WWII Army enlistments, including Women’s Army Auxiliary Corps entries. Select the separate Reserve Corps Records table for an Enlisted Reserve Corps lead. Verify the selected table opens before logging a miss [S82 @2026-11-22], [S84 @2026-11-22], [S102 @2026-11-22].","sources":["S82","S84","S102"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-aad-2","kind":"platform-ui","anchor":"Search by Army serial number when you have it. In a name search, enter surname, given name and middle initial in that order, and omit apostrophes [S82 @2026-11-22], [S84 @2026-11-22]. Try both a space and no space after a surname prefix. For a wildcard search, use at least three known characters followed by an asterisk. If a damaged punch-card character is suspected, retry with a quoted name in which `#` replaces the suspect character. If the result has only an initial, keep the full middle name unresolved and check a separate record that spells it out [S124 @2026-11-22]. Use the identity check from the available excerpt [S126 @2026-11-22]. Match the recovered serial number to another service record before carrying it into a separate request. Carry the verified number into the VA file search suggested by the lookup from the available excerpt [S127 @2026-11-22].","sources":["S82","S84","S124","S126","S127"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-aad-3","kind":"method","anchor":"Record the AAD result as an electronic extract of the Army’s microfilmed punch cards. Use the extraction fields from the available excerpt [S125]. Copy the enlistment date and place, grade, branch, term, education, civilian occupation and marital status as recorded at that event. Read an entry with a later enlistment date as a possible reenlistment, and check the source-of-personnel field before treating the date as first entry [S82], [S84], [S102].","sources":["S125","S82","S84","S102"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-induction-1","kind":"method","anchor":"Use the staged check from the available excerpt when a WWI local board’s physical examination is the last entry you have [S111]. Look for the board’s classification docket and then a certified list of men ordered to report. Compare the order, camp report and acceptance or rejection before recording induction [S112], [S118].","sources":["S111","S112","S118"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwiidraft-1","kind":"historical","anchor":"Read “Old Man’s Draft” as the Fourth Registration of 27 April 1942. Check coverage separately for that registration and the younger men’s cards. Ancestry’s collection guide identifies Maine as a loss in its younger-men’s series. For the Fourth Registration use the NARA state list above [S82], [S87], [S116], [S102].","sources":["S82","S87","S116","S102"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwiidraft-2","kind":"method","anchor":"For a WWII draft card, look in the state where the person lived or worked on the registration date. Verify the card’s jurisdiction, follow the two-sided reading from the available excerpt [S126]. Keep residence, mailing address, employer’s address and contact address in their own fields. Copy birthplace and signature from the front and the recorded height, weight and eye color from the physical description [S82], [S88], [S102]. Compare the named contact with independent household evidence before assigning a relationship. Check the top margin for annotations that point to other records. One WWII draft card reportedly carried a typed Army discharge date, giving a lead to the separation record [S82]. Before using eye color to exclude a candidate, check which choices the actual form offered [S82].","sources":["S126","S82","S88","S102"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-community-wwiidraft-3","kind":"portal-availability","anchor":"For the Fourth Registration, check FamilySearch collection 1861144 for the state and the image, or select Ancestry’s separate 1942 collection. Check the selected site’s access and state coverage before logging a miss [S82 @2026-11-22], [S87 @2026-11-22], [S122 @2026-11-22].","sources":["S82","S87","S122"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwiidraft-4","kind":"portal-availability","anchor":"If an online search of the younger registration cards provides no usable image, use NARA St. Louis’s Selective Service Request Form to ask for the date-appropriate registration card or the separate classification history. Identify the registration state and distinguish the two products in the log [S82 @2026-11-22], [S123 @2026-11-22].","sources":["S82","S123"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwicards-1","kind":"portal-availability","anchor":"Use the state-first search from the available excerpt [S89 @2026-11-22]. Start with the state of entry or documented wartime residence and check the series’ own inclusion rule. For Florida Army cards follow the state’s link to Florida Memory’s *World War I Service Cards* (series S1204). For North Carolina use FamilySearch collection 2568864. For Mississippi Army cards use the surname range in series 1731. Record the state, branch and dates actually covered. If card survival or coverage is unresolved, keep the service question open [S90 @2026-11-22], [S91 @2026-11-22], [S92 @2026-11-22], [S94 @2026-11-22], [S117 @2026-11-22], [S119 @2026-11-22].","sources":["S89","S90","S91","S92","S94","S117","S119"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwicards-2","kind":"method","anchor":"Use the timeline examples from the available excerpt on reading cards [S89] and the dated entries from the available excerpt of the case walkthrough [S113]. Read the dated organizations, ranks, overseas interval and discharge as recorded. Retain the serial number, birth details and residence as identity clues. On North Carolina cards, check for a separate earlier National Guard or federal card and record its dates separately from the later unit. Preserve strikeouts and underlining. Interpret race and service markings against the state’s guide and the printed fields. For a Florida Army card with only one image, keep the reverse uninspected. Florida Memory’s digitization used added remarks to select the backs it scanned [S91], [S92].","sources":["S89","S113","S91","S92"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwicards-3","kind":"method","anchor":"For Army Form 724, identify the printed form number, revision and entry wording. Use any uncrossed entry wording with the series guide to read whether the person enlisted or was inducted. Read the suffix as an outcome code. The Mississippi series includes forms with the same suffix for enlisted and inducted soldiers. Mississippi’s series 1731 gives 1 for discharge without conditions, 2 for discharge with a disability percentage, 3 for discharge for the Army’s convenience, 4 for dishonorable discharge, 5 for desertion, 6 for killed in action, 7 for death from wounds, 8 for death from noncombat causes and 9 for wounded in action. The guide identifies 1 and 2 as white, 4 and 5 as buff, and 6 through 8 can be pink. The format reading from the available excerpt is a lead to the printed code [S89], [S113]. Use the code and recorded text when color is ambiguous. Check a separate dated record before assigning a return home to a wounded person [S90].","sources":["S89","S113","S90"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwicards-4","kind":"method","anchor":"Use the War Department’s *List of Authorized Abbreviations: World War I Service Discharge Cards* hosted by North Carolina. Use the glossary lead from the available excerpt [S89]. Read SCD as Surgeon’s Certificate of Disability and copy any percentage as the figure recorded on the card [S92], [S93].","sources":["S89","S92","S93"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwicards-5","kind":"historical","anchor":"If a WWI Army card lacks a serial number, continue with name, rank, unit and dates. Use the alternatives from the available excerpt and check for an officer’s commission or service before numbering [S89]. The War Department’s February 1918 instructions applied to enlisted men, with a general muster assignment date of 28 February 1918 [S120].","sources":["S89","S120"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwicards-6","kind":"method","anchor":"Use the wounded-card example from the available excerpt as a prompt to check the injury field [S89]. On the card, look for the date and nature or severity actually recorded. A blank field can leave an injury unresolved. Compare hospital, unit and state papers before closing the question [S92].","sources":["S89","S92"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwicards-7","kind":"portal-availability","anchor":"Use the index-to-copy sequence from the available excerpt [S89 @2026-11-22]. If the North Carolina index identifies the card but you cannot inspect its image, use the State Archives’ copy request form for *World War I Service Cards*. Supply the card locator and enough identifying detail to distinguish the veteran [S121 @2026-11-22].","sources":["S89","S121"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-alabama-1","kind":"portal-availability","anchor":"Search *Alabama, Active Military Service Reports* (MyHeritage collection 20271) for an Alabama resident who entered service circa 1940–1966. Read the home-address report image for the residence the enlistee reported to the local Selective Service board. Keep the address tied to the date and wording on that form. Check that the collection opens in your account before logging a miss [S100 @2026-11-22], [S101 @2026-11-22].","sources":["S100","S101"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-border-1","kind":"method","anchor":"For Mexican border or Punitive Expedition service with a missing personnel file, follow the headquarters and state routes from the available excerpt [S98]. Look for duplicate personnel material in field or higher headquarters records. For a National Guard regiment, start with its home state’s archives, then compare the regiment’s federal records [S99].","sources":["S98","S99"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-border-2","kind":"method","anchor":"Use the entry numbers from the available excerpt as finding leads [S98]. Select by the veteran’s role and unit. For staff officers through 1917, check RG 94 entry 25 through the name and subject index in entry 27. Check the same entry for an enlisted soldier whose discharge, desertion or in-service death may have generated correspondence. For medical officers, check the Surgeon General's correspondence in RG 112 entry 26. For a missing regimental return or roll, check RG 391 entries 2118, 2122, 2124 and 2133 for the relevant infantry, cavalry or field artillery regiment. For National Guard unit orders, sick reports, rosters and pay vouchers, check RG 407 entry 21. For regimental strength returns check entry 112. Match the unit and dates and confirm each entry’s current locator before relying on a miss [S99].","sources":["S98","S99"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-camp-1","kind":"historical","anchor":"For a WWI service card naming Camp Grant, Illinois, use the lookup from the available excerpt [S113]. Open the Camp Grant entry in *Order of Battle*, volume 3, part 2 (CMH Pub 23-4), and look for the exact organization in the station complement, divisional units and nondivisional units. The 86th Division’s “N. A.” stands for National Army. If the individual went overseas with that division, check his transfer entries and the receiving unit’s records. The division’s overseas account records a transfer of personnel for replacements, so the division’s history alone cannot place him in combat [S114], [S115].","sources":["S113","S114","S115"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-bulge-1","kind":"method","anchor":"To test a Battle of the Bulge lead, use 16 December 1944 through 25 January 1945 to check the veteran’s dated postings against the exact company’s morning reports. An Ardennes or Belgium mention is a locality lead. Check individual remarks and hospital records for frostbite or trench foot as well as combat wounds. Preserve the recorded diagnosis and date before drawing any conclusion about what happened to the individual [S108], [S109], [S110].","sources":["S108","S109","S110"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-dcas-1","kind":"portal-availability","anchor":"For a reported Korean or Vietnam War death, look up the conflict’s Defense Casualty Analysis System extract in NARA’s AAD (RG 330). If AAD is inaccessible, browse NARA’s state lists of fatal casualties using state of home of record at last entry into service. Keep that field distinct from birthplace and place of death. Log the result as a casualty entry and continue the personnel-file search when broader service details are needed [S105 @2026-11-22], [S106 @2026-11-22], [S107 @2026-11-22].","sources":["S105","S106","S107"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-naval-reserve-cutoff","kind":"custody","anchor":"For a Navy veteran who stayed in the Naval Reserve after active duty, use the final Reserve separation date for the rolling archival cutoff. Keep any later civilian shipyard retirement out of that calculation. Use the separation question from the available excerpt to identify which date needs proof [S128 @2026-11-23]. Recheck a refusal based on non-archival status and use the archival request route once the file qualifies [S129 @2026-11-23], [S147 @2026-11-23].","sources":["S128","S129","S147"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwi-draft-rounds","kind":"historical","anchor":"Before treating a WWI draft-card miss as evidence, calculate his age on the relevant registration date. Use the age check from the available excerpt of each walkthrough [S132], [S133]. For June 5, 1917, check ages 21–30 inclusive. For June 5, 1918, check men who turned 21 after the first registration. The August 24, 1918 supplement covered those who turned 21 after June 5 of that year. For September 12, 1918, check ages 18–45 inclusive, including men who were too young or too old in June 1917. Check the applicable exemptions, including prior registration for the September round, before expecting a card [S51], [S134], [S135].","sources":["S132","S133","S51","S134","S135"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwi-draft-familysearch","kind":"portal-availability","anchor":"Search FamilySearch collection 1968530 for the WWI draft registration card. If the index misses, browse by state, county or city, and local draft board, then by surname. Record blocked image access separately from an uncovered draft board or date [S106 @2026-11-23], [S136 @2026-11-23].","sources":["S106","S136"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-draft-middle-name","kind":"method","anchor":"For an unresolved middle name, inspect the name field on the original WWI or WWII registration card. Use the draft-card lead from the available excerpt of Watson’s interview [S130]. Copy a spelled-out name or initial exactly as written. Leave the expansion unresolved if the card gives only an initial, and record the name as registration evidence [S52], [S53], [S54], [S124], [S131].","sources":["S130","S52","S53","S54","S124","S131"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwi-draft-card-reverse","kind":"method","anchor":"Before marking a WWI draft-card field absent, match both sides of the same card. Follow the image sequence if the registrar’s report is missing from the first view. If the reverse remains unavailable, record it as uninspected. Use the two-sided reading from the available excerpt [S125]. Read the physical description on the registrar’s side and take citizenship and named contacts from the fields the actual registration form provides [S52], [S53], [S54].","sources":["S125","S52","S53","S54"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwii-draft-catalog","kind":"portal-availability","anchor":"For the Catalog image route from the available excerpt [S137 @2026-11-23], open NARA’s *Bulk Downloads of World War II Draft Cards* list. Match the state or territory and registration dates, then follow *View in Catalog* for the listed series or surname range. Check the listed image coverage before interpreting a miss [S88 @2026-11-23].","sources":["S137","S88"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-navy-marine-aims","kind":"portal-availability","anchor":"For a Navy or Marine Corps award lead, search AAD’s *Awards Information Management System (AIMS)* Public Use History Data File by recipient name. Use the name-search approach from the available excerpt [S127 @2026-11-23]. Start with the May 2004 extract. Open the full result and compare the grade and approved award. Keep the approval date separate from the merit period when both appear. Use the entry to locate the original award citation or order. Log the extract separately. Check the file’s coverage before interpreting a miss [S138 @2026-11-23], [S139 @2026-11-23].","sources":["S127","S138","S139"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-pacific-hospital-treatment","kind":"method","anchor":"For a treatment lead at Iwo Jima or Okinawa, check individual medical entries for combat fatigue as well as physical wounds. At Okinawa also look for neuropsychiatric entries. Preserve the recorded term and date. Use unit medical reports to identify treatment facilities and look for a named record before assigning a diagnosis [S108], [S145], [S146].","sources":["S108","S145","S146"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-wwii-registry-sources","kind":"portal-availability","anchor":"For a WWII Memorial Registry hit, identify its database before using the entry. Use a Killed in Service roster entry to locate the underlying War or Navy Department roster. Treat a Registry of Remembrances entry as an attributed public submission and verify any claim of death in service separately [S82 @2026-11-23], [S144 @2026-11-23].","sources":["S82","S144"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-korean-war-file-choice","kind":"portal-availability","anchor":"For Korea, use the DCAS extract (NAID 2240988) for a death or missing-in-action lead. For an Army wound, search *Records on Korean War Dead and Wounded Army Casualties* (RG 407, NAID 583580). For captivity, search *Records of American Prisoners of War During the Korean War* (RG 319, NAID 583429) and check the separate repatriated POW file (RG 15, NAID 583582) when return is at issue. Use the Korean War lookup lead from the available excerpt [S137 @2026-11-23]. Compare the name and any date and status fields actually supplied before combining hits. A fatal-list miss leaves a wound or captivity unresolved [S140 @2026-11-23].","sources":["S137","S140"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-vietnam-caccf-locality","kind":"portal-availability","anchor":"For a Vietnam town search, use the Home of Record city and state fields in the December 1998 *Combat Area Casualties Current File* (CACCF). Use the locality lookup from the available excerpt [S127 @2026-11-23]. Keep home of record separate from the casualty location. Compare the branch and casualty details, and use a number locally as a service identifier only when its type is confirmed. Check the successor Vietnam DCAS extract for the same person and cite each file separately [S141 @2026-11-23], [S142 @2026-11-23].","sources":["S127","S141","S142"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-community-vietnam-casualty-date-fields","kind":"method","anchor":"Keep the date under its original field label. CACCF’s *Date of Death or Date Declared Dead* can be an actual death date or a declaration date. Vietnam DCAS’s *Incident or Death Date* can be an incident date or an actual death date. Use the date comparison from the available excerpt [S127]. If an entry does not resolve the difference, look for a dated casualty report or determination before assigning an actual death date [S142], [S143].","sources":["S127","S142","S143"],"checked":null,"stated_as":"fact","review":"reviewed"}
