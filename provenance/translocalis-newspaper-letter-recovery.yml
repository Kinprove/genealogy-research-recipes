claims:
  - {"id":"C-5326baaec558","kind":"portal-availability","anchor":"Start with the National Library of Finland’s [Translocalis\ncollection](https://digi.kansalliskirjasto.fi/collections?id=742). Use it for local readers’ letters\nin the Finnish-language press through 1885 [S2 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bf72be5fa508","kind":"platform-ui","anchor":"In the collection keywords, search `translocalis_104` for the printed signature, including an\ninitialled form or pseudonym. Run a separate `translocalis_105` search for the attributed writer’s\nname. In a general clipping keyword list, use the Translocalis field code to identify the matching\nmetadata rather than reading a similarly worded keyword from another collection as a Translocalis\nattribution [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3f80842192d5","kind":"method","anchor":"A signature search alone cannot close an inventory of a writer’s letters. Compare the abbreviated\nsignature and the reported locality with the proposed writer’s names and known locality. Record the\ncatalogue attribution as a lead and keep the identification provisional while corroboration is\nmissing. According to the community author, the attributed-name field recovered letters whose\nsignatures omitted the full surname [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0275da35477a","kind":"method","anchor":"Read *toisinto* as a reprint. If the author keyword misses, search Digi’s newspaper text for a\ndistinctive phrase from the letter, then compare wording and publication dates across newspapers [S2],\n[S3]. According to the community author, a reprint found by word search had no author metadata [S1†].","sources":["S2","S3","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e996b029513f","kind":"platform-ui","anchor":"Browse the Translocalis sending-locality keyword (`translocalis_101`) for unsigned versions and\nreprints. For a place in Finland, start with the project’s 1860 municipality label. Try the 1885 label\nunder `translocalis_102` if the municipality changed [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-333e90290899","kind":"platform-ui","anchor":"On a known Digi issue page, turn on **Korosta leikkeet** and check whether the letter itself is\nhighlighted. Verify the collection on a matching clipping before counting it as Translocalis coverage\n[S4 @2026-11-22], [S5 @2026-11-22]. According to the community author, a known letter had no\nhighlighting in the 2023 interface [S1† @2026-11-22]. Check the issue in the current viewer and keep\nthe letter in the research even if no Translocalis clipping is visible.","sources":["S4","S5","S1"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
