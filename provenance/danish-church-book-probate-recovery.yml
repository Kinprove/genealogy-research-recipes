sources:
  - {"id":"S1","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/kirkeboger-borgerlige-vielser-m-m/kirkeboeger-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's church-book guide. Used the holdings range; the royal letters of 1645 and 1646; the 1812 rescript, preprinted forms from about 1814 and the two copies kept by the priest and the parish clerk; the period routes before about 1814, about 1814–1960 and from 1961; the optional pre-1814 entries; the event order and the males-first rule; the moves lists in some parishes; the 100-year access period, blurred CPR numbers and blurred birth-list remarks from 1892; DigDag for finding the parish.","entry_sha256":"7759be4c93c02be44a60b4e995f7b4b73f252f122c26b866b5c880df8c5caef7","claims":["C-01","C-02","C-03","C-04","C-05","C-07","C-09"],"review":"reviewed"}
  - {"id":"S2","kind":"pdf","urls":["https://www.rigsarkivet.dk/wp-content/uploads/2022/03/Kirkeboeger-fra-1800-tallet-Det-finder-du-i-dem.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's leaflet on nineteenth-century church books. Used the special forms from about 1812; the two sets written by the priest and by the schoolteacher or parish clerk, stored apart and meant to agree; the moves lists until 1854 in towns and 1875 in the countryside, mostly servants and poor people; the contents of baptism, confirmation, marriage and burial entries.","entry_sha256":"c8c1379f82af2d4308402d991de8396cedb72283e1b861b3186e9030c35e0c58","claims":["C-04","C-07","C-08"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/kirkeboger-borgerlige-vielser-m-m/borgerlige-vielser-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's civil-marriage guide. Used who could marry civilly from 1851 and from 1923; the authorities and series for 1851–1919, 1919–1922, 1923–1970 and from 1971; the Copenhagen and South Jutland exceptions; the note at the back of the church book, up to 1922 in the bride's parish; town magistrate archives; the 50-year access period.","entry_sha256":"85c00ce02ed6a69a3ad68a78ce4b991eff6a35bf891b0fef6cfbe86337535c09","claims":["C-01","C-10","C-11","C-12","C-13"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/kirkeboger-borgerlige-vielser-m-m/soenderjyske-kirkeboeger-og-personregistrering-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's guide to South Jutland church books and civil registers. Used the oldest books, fixed forms from 1763 and two copies from 1775; Prussian civil registration from 1874 and the church books as secondary sources for 1874–1925; the return of marriages to the priests from 1926; the registration districts; the period routes to 1973.","entry_sha256":"7397739e60cbad98bd269294c93f53592736b010635935eeee9cd39dfc4d4e79","claims":["C-14","C-15","C-16","C-17"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/skiftearkivalier-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's probate guide. Used the oldest probates; the authorities by status before 1851, including the 1793, 1817 and 1776 changes and the North Jutland place index; private probates; the death registers from about 1820; the routes for 1851–1919 and from 1919, including executor estates to 1933; the scan and reading-room split; the Copenhagen and South Jutland exceptions and the South Jutland probate register; the 75-year access period.","entry_sha256":"ef93a286d1acf621ae85570944c069ac74373919213b660921955709dd73796e","claims":["C-01","C-18","C-20","C-21","C-22","C-23","C-24","C-25","C-26"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/gejstlige-skifter-foer-1807-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the provosts' probate for clergy, parish clerks, bell-ringers, schoolmasters and grammar-school teachers, and the changes after 1771 and 1807.","entry_sha256":"a13dfdbe42dd9a8059e10d67ef57c021be03108678b125f48949bf1e60a40436","claims":["C-27"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/haerens-og-flaadens-skifter-foer-1864-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the army auditors and their transfer to civil courts, with the Christiansø and Schleswig-Holstein exceptions; the reading-room access for army probate; the navy's Underadmiralitetsret from 1659 to 1771 and its scanned probate books with registers.","entry_sha256":"417a73e5ff275833eb51341578245601b2b0bdf24f525589ee89d9b8e3ba2757","claims":["C-27"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/joediske-skifter-foer-1814-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used Det Mosaiske Troessamfund's probate until 1814, survival from 1760 and the four chronological series without finding aids.","entry_sha256":"0a1123d82838f1a5ca05916735e07babafd3b17b13d1b8ad1423d9475159443d","claims":["C-27"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://en.rigsarkivet.dk/guide/from-the-danish-demographic-database-to-search-the-collections/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used DDD's phase-out and the move of its data to Search the Collections, the warning that DDD searches may fail, and Link Lives' parish-register transcriptions for 1814–1891.","entry_sha256":"0cc129b149d4ef5b0aaff26028ad375ff5441a5457b9dc9d35e899754f5aabcd","claims":["C-06","C-19"],"review":"reviewed"}
  - {"id":"S10","kind":"catalogue","urls":["https://www.ddd.dda.dk/skifteregister/soeg_skifte.asp"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Only the search form was seen (surname, given names, position, place, year and archive creator); no search was run. Used that the register's search page answered on that date.","entry_sha256":"2e620dd61c57218796a5f4d5845f0223b99dffa1b62c4da84a79b17f4099d0cf","claims":["C-19"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"custody","anchor":"Rigsarkivet's guides find church books by parish, and probates and civil marriages by the authority that created them: the market town's byfoged (town judge), the herredsfoged (rural district judge), the birk, the amt, the estate or, later, the court district. When you know the place but not the parish or district name, the guides point to DigDag, the historical administrative map. [S1 @2026-11-18], [S3 @2026-11-18], [S5 @2026-11-18]","sources":["S1","S3","S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"historical","anchor":"Royal letters of 1645 and 1646 ordered priests throughout the country to register baptisms, betrothals or marriages, and deaths, but far from every parish has a church book from the 1600s. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"historical","anchor":"Before about 1814 a parish kept one book, the enesteministerialbog. It was written in date order, not on fixed forms, and its basic entries are births, confirmations (from 1736), marriages and deaths. Some priests also entered mothers' churchings (introduktion), communion, betrothals (until 1799) and public confessions. Some of these single books were lost in rectory fires. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"historical","anchor":"A rescript of 11 December 1812 brought preprinted forms from about 1814 and two copies of each book: the hovedministerialbog, kept by the priest, and the kontraministerialbog, kept by the parish clerk (degn); the two were to be stored under separate roofs against loss by fire. [S1] Rigsarkivet's leaflet on nineteenth-century church books dates the forms and the two sets from about 1812, names the schoolteacher or the parish clerk as the second writer, and says the two copies were meant to hold the same information. [S2] From about 1814 the entries run by event type in the order born, confirmed, married, arrivals, departures and dead, and births, confirmations and deaths list males before females. [S1]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"portal-availability","anchor":"Rigsarkivet holds church books from the whole country from the 1600s to about 2000. Its guide sends you to the scans on Arkivalieronline, by parish, for the single books before about 1814 and for both copies from about 1814 to 1960. From 1961 it routes you to the kontraministerialbog through Søg i Samlingerne: death lists up to 1969 may be scanned there, and the rest is ordered for the reading room. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"portal-availability","anchor":"Rigsarkivet says Link Lives searches transcriptions of Danish parish registers for 1814–1891. [S9 @2026-11-18] Treat a Link Lives hit as a pointer to the scanned page and read the entry there.","sources":["S9"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"historical","anchor":"Some parishes kept lists of people moving in and out (af- og tilgangslister) in about 1814–1875. [S1] The leaflet says the lists were kept until 1854 in towns and 1875 in the countryside, and often record only servants and poor people. [S2] A missing arrival or departure entry does not show that the family stayed put.","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"historical","anchor":"Use the other entries to link people. A baptism names the child, the parents and their residence; the godparents were often relatives of the parents. A confirmation names the confirmand, the parents or the master (husbond) and their residence, often says whether a parent was dead, and in older books gives grades. A marriage names the couple, their parents and residence, and the sureties (forlovere), normally close male relatives. A newer burial entry may name the parents and spouse and the couple's last common residence. A confirmand described as the child of a late (\"afdøde\") parent dates that parent's death before the confirmation, so search the burials backwards from it. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"Church books after 1925 can contain CPR (personal identity) numbers and fall under a 100-year access period. In the books on Arkivalieronline, CPR numbers are blurred, and from 1892 the remarks column of the birth lists is blurred. [S1 @2026-11-18] A blurred field is withheld and an unscanned book is offline; neither is missing, so do not record either as a nil.","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"historical","anchor":"Before 1851 only a priest could marry a couple. From 1851 civil marriage was allowed when one or both partners belonged to no recognised faith, or when the two belonged to different faiths; from 1923 anyone could choose it. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"portal-availability","anchor":"Civil marriages are filed under the civil authority, not the parish. For 1851–1919 look under the byfoged, herredsfoged or birk, in the marriage book (ægteskabsbog or ægteskabsprotokol) or, where none was kept, the notarial protocol (notarialprotokol). For 1919–1922 look under the police district in the countryside and the town council (kommune) in market towns. For 1923–1970 look under the sognefoged (parish bailiff) in the countryside and the market-town council in towns, starting from the register to the marriage book. From 1971 look under the kommune; those books are not scanned. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"portal-availability","anchor":"In Copenhagen the 1851–1922 originals are at Københavns Stadsarkiv, and the 1923–1970 marriage books are scanned under Københavns kommune. In South Jutland every marriage from 1874 to 1925 is in the civil registers (personregistre). [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"custody","anchor":"Rigsarkivet says a civil marriage is often noted at the back of the church book, up to 1922 in the bride's parish, and that in some market towns civil marriages are found in the magistrate or town-hall archives. [S3 @2026-11-18] Check both before you call a marriage missing.","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"historical","anchor":"South Jutland's church books reach back further than the rest of the country's: the oldest is from 1573. Fixed forms began there in 1763, and from 1775 the books were to be kept in two copies. [S4] Do not apply the dates for the rest of the country there.","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"historical","anchor":"After South Jutland became part of Prussia in 1864, civil registration of births, marriages and deaths began in 1874, kept by the Standesamt (in Danish, personregister) under a registrar (personregisterfører). Rigsarkivet calls the church books for 1874–1925 secondary sources. The personregister covered births, marriages and deaths; confirmations stayed in the church book. [S4] For a South Jutland birth, marriage or death in 1874–1925, search the personregister first, then the church book.","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"historical","anchor":"From 1926 priests again married couples, and church weddings were entered as in the rest of the country, while births and deaths stayed in the personregistre. [S4] For a church wedding from 1926 use the church book; for a civil wedding use the civil-marriage section above.","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-17","kind":"portal-availability","anchor":"The personregistre are scanned on Arkivalieronline by registration district, which is roughly the parish, up to 1960/61, and the 1926–1960/61 church books are scanned as kontraministerialbøger. For 1960/61–1973, deaths are online up to about 1970, and the rest is ordered through Søg i Samlingerne for the reading room in Aabenraa. Rigsarkivet's guide gives separate routes from 1974. [S4 @2026-11-18]","sources":["S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-18","kind":"custody","anchor":"For South Jutland probate before 1864, Rigsarkivet names the herredsfoged or birkefoged in the countryside and the byfoged in towns, and for 1867–1920 the archives of the Prussian district courts (amtsretter). Private probate was easier to arrange in Schleswig, so fewer probates survive than elsewhere in Denmark. Rigsarkivet's index to them is the Register over sønderjyske skifter op til 1920 in DDD; it says all probates are entered there with the series and the protocol page. [S5 @2026-11-18] The guide names no authority for 1864–1866: treat a probate from those years as unresolved rather than following another period's route.","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-19","kind":"portal-availability","anchor":"The register's search page answered on 18 November 2026. [S10 @2026-11-18] Rigsarkivet is phasing DDD out, is moving its data to Søg i Samlingerne and warns that DDD searches may fail. [S9 @2026-11-18] If the DDD search fails or the register has gone, try Søg i Samlingerne, and record the probate search as incomplete. Record an empty result as no hit in that index, not as proof that no probate was held.","sources":["S10","S9"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20","kind":"historical","anchor":"A probate (skifte) lists the deceased's property and heirs. The oldest surviving probates are from about 1650, and older protocols may be lost. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-21","kind":"historical","anchor":"Until 1851 the deceased's status decided which authority held the probate. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-22","kind":"custody","anchor":"- **Market-town residents (købstadsbeboere):** the town's byfoged, in the probate protocol (skifteprotokol). [S5 @2026-11-18]\n- **Tenants (fæstere) and employees of an estate:** the estate's own archive. From 1817 the tenants of smaller estates went to the herredsfoged or birkefoged. Tenants in a cavalry district (rytterdistrikt) went to the district or its birk; the cavalry districts were abolished in 1776. For North Jutland, the Stedregister til Nørrejyske Godsarkiver helps you find the estate from the parish. [S5 @2026-11-18]\n- **Estate owners, freeholders (selvejere) and other rural people without tenant status:** the amt before 1793, then the herredsfoged or birk until 1851. [S5 @2026-11-18]\n- **Private probates** (samfrændeskifte, kommissionsskifte, eksekutorskifte, eksekutorbo), settled outside the authorities: the amt's archive, in series for probates or executors. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-23","kind":"custody","anchor":"From 1851 to 1919 ordinary probates went to the byfoged, herredsfoged or birk, and private (executor) probates were filed with the amt once settled. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-24","kind":"portal-availability","anchor":"Before 1919, open the name register to the probate protocol first where one exists; it gives the protocol page. If the probate is not in the protocol, search the death register (dødsanmeldelsesprotokol), kept from about 1820. It records deaths with nothing to divide, surviving spouses who kept the estate undivided (uskiftet bo) and private probates. Most of this material is scanned on Arkivalieronline and reached through Søg i Samlingerne; the rest is ordered for the reading room. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-25","kind":"portal-availability","anchor":"From 1919 each court district's probate court (skifteret) handled probates. Start from the register to the case list where one exists; otherwise take the case number from the death register or the case list (skiftesagliste), then open the case documents, which are filed by that number. Executor estates were filed with the amt until about 1933 and with the probate court afterwards. Most of this material is ordered for the reading room, and Søg i Samlingerne links any scanned part. Probate records are closed for 75 years. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-26","kind":"historical","anchor":"Copenhagen kept its probate protocols in a system of its own; use Rigsarkivet's separate guide to Copenhagen probates. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-27","kind":"portal-availability","anchor":"- **Clergy, parish clerks, bell-ringers, schoolmasters and grammar-school teachers before 1807:** the deanery (provsti) as archive creator, series skift. Copenhagen's clergy went to the Copenhagen probate court after 1771, and the rest of the country's to the byfoged, herredsfoged or birkefoged after 1807. [S6 @2026-11-18]\n- **Soldiers, officers and their families before 1864:** each regiment's auditor. Copenhagen's regiments went to the Copenhagen court (Hof- og Stadsret) in 1771, and units elsewhere to the civil courts in 1805, except Christiansø (until 1856) and the Schleswig and Holstein regiments (until 1864). Almost none of the regimental auditors' probates from before 1771 survive. The military probate series are not digitised and are seen in the reading room. [S7 @2026-11-18]\n- **Navy crews, their spouses and children, 1659–1771:** the Underadmiralitetsretten, whose oldest surviving probates are from 1659. Its probate books and their registers are scanned; its other series are seen in the reading room. After 1771 navy probates were handled like other citizens'. [S7 @2026-11-18]\n- **Jewish citizens before 1814:** Det Mosaiske Troessamfund. Its probates survive from 1760, without finding aids, in four series kept in date order. [S8 @2026-11-18]","sources":["S6","S7","S8"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
