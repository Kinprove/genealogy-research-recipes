sources:
  - {"id":"S1","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/kirkeboger-borgerlige-vielser-m-m/kirkeboeger-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's church-book guide. Used the holdings range; the royal letters of 1645 and 1646; the 1812 rescript, preprinted forms from about 1814 and the two copies kept by the priest and the parish clerk; the period routes before about 1814, about 1814–1960 and from 1961; the optional pre-1814 entries; the event order and the males-first rule; the moves lists in some parishes; the 100-year access period, blurred CPR numbers and blurred birth-list remarks from 1892; DigDag for finding the parish; the pointer to a separate guide for recognised faith communities.","entry_sha256":"8550d782af35b55e43d91790f9441a9c25c3f78aafc30d4c04ed203fd54942dc","claims":["C-01","C-02","C-03","C-04","C-05","C-06","C-08","C-10"],"review":"reviewed"}
  - {"id":"S2","kind":"pdf","urls":["https://www.rigsarkivet.dk/wp-content/uploads/2022/03/Kirkeboeger-fra-1800-tallet-Det-finder-du-i-dem.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's leaflet on nineteenth-century church books. Used the special forms from about 1812; the two sets written by the priest and by the schoolteacher or parish clerk, stored apart and meant to agree; the moves lists until 1854 in towns and 1875 in the countryside, mostly servants and poor people; the contents of baptism, confirmation, marriage and burial entries.","entry_sha256":"c8c1379f82af2d4308402d991de8396cedb72283e1b861b3186e9030c35e0c58","claims":["C-05","C-08","C-09"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/kirkeboger-borgerlige-vielser-m-m/borgerlige-vielser-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's civil-marriage guide. Used who could marry civilly from 1851 and from 1923; the authorities and series for 1851–1919, 1919–1922, 1923–1970 and from 1971; the Copenhagen and South Jutland exceptions; the note at the back of the church book, up to 1922 in the bride's parish; town magistrate archives.","entry_sha256":"be073c50e91cc1a03174bd4cf4bc3a93d782e192245128f24c374fabf145290a","claims":["C-01","C-11","C-12","C-13","C-14","C-18"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/kirkeboger-borgerlige-vielser-m-m/soenderjyske-kirkeboeger-og-personregistrering-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's guide to South Jutland church books and civil registers. Used the oldest books, fixed forms from 1763 and two copies from 1775; Prussian civil registration from 1874 and the church books as secondary sources for 1874–1925; the return of marriages to the priests from 1926; the registration districts; the period routes to 1973.","entry_sha256":"7397739e60cbad98bd269294c93f53592736b010635935eeee9cd39dfc4d4e79","claims":["C-15","C-16","C-17","C-18","C-19"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/skiftearkivalier-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Rigsarkivet's probate guide. Used the oldest probates; the authorities by status before 1851, including the 1793, 1817 and 1776 changes and the North Jutland place index; private probates; the death registers from about 1820; the routes for 1851–1919 and from 1919, including executor estates to 1933; the scan and reading-room split; the Copenhagen and South Jutland exceptions and the South Jutland probate register; the 75-year access period.","entry_sha256":"ef93a286d1acf621ae85570944c069ac74373919213b660921955709dd73796e","claims":["C-01","C-18","C-20","C-22","C-23","C-24","C-25","C-26","C-27","C-28"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/gejstlige-skifter-foer-1807-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the provosts' probate for clergy, parish clerks, bell-ringers, schoolmasters and grammar-school teachers, and the changes after 1771 and 1807.","entry_sha256":"a13dfdbe42dd9a8059e10d67ef57c021be03108678b125f48949bf1e60a40436","claims":["C-29"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/haerens-og-flaadens-skifter-foer-1864-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the army auditors and their transfer to civil courts, with the Christiansø and Schleswig-Holstein exceptions; the surviving army probate archives of the Copenhagen garrison auditor, the Rendsborg fortress auditor and the Generalauditøren for 1688–1771; the reading-room access for army probate; the navy's Underadmiralitetsretten from 1659 to 1771 and its scanned probate books with registers.","entry_sha256":"6e3a771f132fd88ec4cd0f9500a74a91974817f267224fe4196fd6f6bdb2b161","claims":["C-18","C-29"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/skifter-og-testamenter/joediske-skifter-foer-1814-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used Det Mosaiske Troessamfund's probate until 1814, survival from 1760 and the four chronological series without finding aids.","entry_sha256":"0a1123d82838f1a5ca05916735e07babafd3b17b13d1b8ad1423d9475159443d","claims":["C-29"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://en.rigsarkivet.dk/guide/from-the-danish-demographic-database-to-search-the-collections/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used DDD's phase-out and the move of its data to Search the Collections, the warning that DDD searches may fail, and Link Lives' parish-register transcriptions for 1814–1891.","entry_sha256":"0cc129b149d4ef5b0aaff26028ad375ff5441a5457b9dc9d35e899754f5aabcd","claims":["C-07","C-21"],"review":"reviewed"}
  - {"id":"S10","kind":"catalogue","urls":["https://www.ddd.dda.dk/skifteregister/soeg_skifte.asp"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Only the search form was seen (surname, given names, position, place, year and archive creator); no search was run. Used that the register's search page answered on that date.","entry_sha256":"2e620dd61c57218796a5f4d5845f0223b99dffa1b62c4da84a79b17f4099d0cf","claims":["C-21"],"review":"reviewed"}
  - {"id":"S11","kind":"web-page","urls":["https://blog.myheritage.com/2022/10/myheritage-publishes-30-new-historical-record-collections-and-31-million-records-in-september-2022/"],"published":"2022-10-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Community discovery source. Read the section on the Danish Gazette collection, its start year, its typical index fields and its description of an estate notice. The publisher gives a lawyer as its estate-contact example. S13 and S14 establish the notice's purpose and the distinction between estate roles.","entry_sha256":"ba65419cc626b2f10ab1a55ba7c9e4454a28cf4cfe1f6042c075614da5e621a9","claims":["C-35","C-37"],"review":"reviewed"}
  - {"id":"S12","kind":"catalogue","urls":["https://www.myheritage.dk/research/collection-20181/danmarks-statstidende-dodsoptegnelser"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the public collection search form and description of coverage starting in 1918 and typical deceased and spouse fields. No signed-in search or individual result was inspected.","entry_sha256":"2813f758ca277eb5072054f514bc78abf1c36f8d575e32666acbfbc01b1271f7","claims":["C-35"],"review":"reviewed"}
  - {"id":"S13","kind":"help-page","urls":["https://domstoldk.euwest01.umbraco.io/selvbetjening/blanketter-og-vejledninger/minskiftesagdk/vejledninger/doedsbo/spoergsmaal-og-svar/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the question on proklama for the notice's purpose and the boudlæg exception in the current court procedure.","entry_sha256":"1821e56888d82c769829a94b6e611c3db4a9a59bb3cac110d6e398dc450f850c","claims":["C-37"],"review":"reviewed"}
  - {"id":"S14","kind":"web-page","urls":["https://www.ft.dk/samling/20241/almdel/reu/spm/1485/svar/2168273/3077024/index.htm"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used Civilstyrelsen's account of the contact person in a private estate and the separate administrator role in an estate handled by a bobestyrer.","entry_sha256":"f70c4c7cdba8dda773e3df4e5617130d672ffe868f8ce0ff4d40c6b26a692f94","claims":["C-37"],"review":"reviewed"}
  - {"id":"S15","kind":"pdf","urls":["https://www.kb.dk/find-materiale/samlinger/avissamlingen/lister/liste-over-dagblade/liste-over-dagblade.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the Statstidende entry in the Copenhagen list on printed page 102 for the dated print holdings. No individual issue was inspected.","entry_sha256":"bafc97362d28e957f4afc8152ec014a027020a440910327060c009c9123fd2b5","claims":["C-36"],"review":"reviewed"}
  - {"id":"S16","kind":"pdf","urls":["https://slaegtsbibliotek.dk/2024/925420.pdf#page=5"],"published":null,"retrieved":"2026-11-22","access":"read","rights":"The library restricts reproduction and distribution.","basis":"Read 2026-11-22. Community discovery source. Used the article's archival sections on local inquiry records, the distinction between those records and returns to Danmarks Statistik, and medico-legal death certificates. The archive listings and guide in S17–S22 establish the search routes and access. The library copy carries a reproduction restriction.","entry_sha256":"5a21c2c81d88332d5c6edbef8cd91dca9806991e9c566384aa217899b2d588a2","claims":["C-31","C-33"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/doedsattester-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the search inputs, medical districts, death-certificate series and rural medico-legal route from 1871, separate South Jutland coverage, reading-room ordering, and 75-year access period.","entry_sha256":"7ff4f4ff55e5b9dbe40b80075e182d15c3f533e11fa6bcacd436e4482e0f4144","claims":["C-30","C-34"],"review":"reviewed"}
  - {"id":"S18","kind":"catalogue","urls":["https://daisy.rigsarkivet.dk/arkivskaber_eller_arkivserie_liste?c=d%C3%B8dfundne+personer&d=1&e=2016"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the returned local police creators and series for inquiries into deaths. The results identify series, with coverage specific to each creator and period.","entry_sha256":"4d61056ab3568df89da7783a71e2e5a8118323e27ac2ffa10cc3311cad2e14df","claims":["C-31"],"review":"reviewed"}
  - {"id":"S19","kind":"web-page","urls":["https://www.rigsarkivet.dk/vejledning/straffesager-i-underretterne-kom-godt-i-gang/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the period-based route to local judicial creators and their police protocols, and the reading-room order route for unscanned material.","entry_sha256":"b02b0adeeab47772365d4b60efced077cc180c2a80b42d892e65139e800c893a","claims":["C-31","C-34"],"review":"reviewed"}
  - {"id":"S20","kind":"catalogue","urls":["https://arkivalieronline.rigsarkivet.dk/da/other/other-collection/64"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the entries linking to Danmarks Statistik's report series.","entry_sha256":"93a60a8344b9e97eb18066f32a858def8771047720c0e20bb98f747b313195fd","claims":["C-32"],"review":"reviewed"}
  - {"id":"S21","kind":"catalogue","urls":["https://arkivalieronline.rigsarkivet.dk/da/other/index-creator/64/347781/23970309"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the digital bundle list, which gives year and journal-number ranges from 1895 through 1904. No individual report was used.","entry_sha256":"38bd60e9b2df00d6c5cb59fc281387be7472671cb6b1d09e3d73ee1f96a53933","claims":["C-32"],"review":"reviewed"}
  - {"id":"S22","kind":"catalogue","urls":["https://daisy.rigsarkivet.dk/fysiske_enheder_liste?a=danmarks+statistik&b=&c=&d=1&dir=&e=2026&ed=&ep=&epid=23745163&es=&f=&faid=11&g=&gsc=&h=&heid=23745161&henid=23745164&int=&m2rid=&meid=&ngid=347781&ngnid=347784&side=1&sort="],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the year and journal-number ranges, scan links through 1904 and order links for 1905–1924. No bundle was ordered.","entry_sha256":"6722a46be4dbf85384bc8ca947a744e816c894a52f0bbdd5da44501a5ce339cb","claims":["C-32","C-34"],"review":"reviewed"}
  - {"id":"S23","kind":"web-page","urls":["https://www.dst.dk/da/Statistik/udgivelser/VisPub?pid=1698"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the publisher's description of the historical publications as tables summarised by period and category.","entry_sha256":"2c9cba104f85d2b0250a017ef0917500740781d6aec6ba6ce25a8a629b0ad712","claims":["C-33"],"review":"reviewed"}
  - {"id":"S24","kind":"catalogue","urls":["https://arkivalieronline.rigsarkivet.dk/da/other/index-creator/64/347781/23756064"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the labels giving year, region and number ranges for digital bundles. No individual report was used.","entry_sha256":"9a5213575ccfe9b95b051bae436ed2c683f2fda8dd70cffac53affc232e66979","claims":["C-32"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"custody","anchor":"Rigsarkivet's guides find church books by parish, and probates and civil marriages by the authority that created them: the market town's byfoged (town judge), the herredsfoged (rural district judge), the birk, the amt, the estate or, later, the court district. When you know the place but not the parish or district name, the guides point to DigDag, the historical administrative map. [S1 @2026-11-18], [S3 @2026-11-18], [S5 @2026-11-18]","sources":["S1","S3","S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"historical","anchor":"Rigsarkivet's guide says special rules apply to the church books of recognised faith communities (anerkendte trossamfund), which have a guide of their own. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"historical","anchor":"Royal letters of 1645 and 1646 ordered priests throughout the country to register baptisms, betrothals or marriages, and deaths, but far from every parish has a church book from the 1600s. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"historical","anchor":"Outside South Jutland, before about 1814 a parish kept one book, the enesteministerialbog. It was written in date order, not on fixed forms, and its basic entries are births, confirmations (from 1736), marriages and deaths. Some priests also entered mothers' churchings (introduktion), communion, betrothals (until 1799) and public confessions. Some of these single books were lost in rectory fires. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"historical","anchor":"Outside South Jutland, a rescript of 11 December 1812 brought preprinted forms from about 1814 and two copies of each book: the hovedministerialbog, kept by the priest, and the kontraministerialbog, kept by the parish clerk (degn); the two were to be stored under separate roofs against loss by fire. [S1] Rigsarkivet's leaflet on nineteenth-century church books dates the forms and the two sets from about 1812, names the schoolteacher or the parish clerk as the second writer, and says the two copies were meant to hold the same information. [S2] From about 1814 the entries run by event type in the order born, confirmed, married, arrivals, departures and dead, and births, confirmations and deaths list males before females. [S1]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"portal-availability","anchor":"Rigsarkivet holds church books from the whole country from the 1600s to about 2000. Its guide sends you to the scans on Arkivalieronline, by parish, for the single books before about 1814 and for both copies from about 1814 to 1960. From 1961 it routes you to the kontraministerialbog through Søg i Samlingerne: death lists up to 1969 may be scanned there, and the rest is ordered for the reading room. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"portal-availability","anchor":"Rigsarkivet says Link Lives searches transcriptions of Danish parish registers for 1814–1891. [S9 @2026-11-18] Treat a Link Lives hit as a pointer to the scanned page and read the entry there.","sources":["S9"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"historical","anchor":"Some parishes kept lists of people moving in and out (af- og tilgangslister) in about 1814–1875. [S1] The leaflet says the lists were kept until 1854 in towns and 1875 in the countryside, and often record only servants and poor people. [S2] A missing arrival or departure entry does not show that the family stayed put.","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"historical","anchor":"Use the other entries to link people. A baptism names the child, the parents and their residence; the godparents were often relatives of the parents. A confirmation names the confirmand, the parents or the master (husbond) and their residence, often says whether a parent was dead, and in older books gives grades. A marriage names the couple and their residence, may name their parents, and names the sureties (forlovere), normally close male relatives. A newer burial entry may name the parents and spouse and the couple's last common residence. A confirmand described as the child of a late (\"afdøde\") parent dates that parent's death before the confirmation, so search the burials backwards from it. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"portal-availability","anchor":"Church books after 1925 can contain CPR (personal identity) numbers and fall under a 100-year access period. In the books on Arkivalieronline, CPR numbers are blurred, and from 1892 the remarks column of the birth lists is blurred. [S1 @2026-11-18] A blurred field is withheld and an unscanned book is offline; neither is missing, so do not record either as a nil.","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"historical","anchor":"Before 1851 only a priest could marry a couple. From 1851 civil marriage was allowed when one or both partners belonged to no recognised faith, or when the two belonged to different faiths; from 1923 anyone could choose it. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"portal-availability","anchor":"Civil marriages are filed under the civil authority, not the parish. For 1851–1919 look under the byfoged, herredsfoged or birk, in the marriage book (ægteskabsbog or ægteskabsprotokol) or, where none was kept, the notarial protocol (notarialprotokol). For 1919–1922 look under the police district in the countryside and the town council (kommune) in market towns. For 1923–1970 look under the sognefoged (parish bailiff) in the countryside and the market-town council in towns, starting from the register to the marriage book. From 1971 look under the kommune; those books are not scanned. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"portal-availability","anchor":"In Copenhagen the 1851–1922 originals are at Københavns Stadsarkiv, and the 1923–1970 marriage books are scanned under Københavns kommune. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"custody","anchor":"Rigsarkivet says a civil marriage is often noted at the back of the church book, up to 1922 in the bride's parish, and that in some market towns civil marriages are found in the magistrate or town-hall archives. [S3 @2026-11-18] Check both before you call a marriage missing.","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"historical","anchor":"South Jutland's church books reach back further than the rest of the country's: the oldest is from 1573. Fixed forms began there in 1763, and from 1775 the books were to be kept in two copies. [S4] Do not apply the dates for the rest of the country there.","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"historical","anchor":"After South Jutland became part of Prussia in 1864, civil registration of births, marriages and deaths began in 1874, kept by the Standesamt (in Danish, personregister) under a registrar (personregisterfører). Rigsarkivet calls the church books for 1874–1925 secondary sources. The personregister covered births, marriages and deaths; confirmations stayed in the church book. [S4] For a South Jutland birth, marriage or death in 1874–1925, search the personregister first, then the church book.","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-17","kind":"historical","anchor":"From 1926 priests again married couples, and marriages were again entered as in the rest of the country, while births and deaths stayed in the personregistre. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-18","kind":"custody","anchor":"- **Births and deaths:** the church book before 1874; the personregister first for 1874–1925, with the church book as a secondary source; from 1926 the guide gives both the personregister and the church book. [S4 @2026-11-18]\n- **Confirmations:** the church book in every period. [S4 @2026-11-18]\n- **Marriages before 1874:** the church book; the guide names no civil-marriage route for South Jutland before 1874. [S3 @2026-11-18], [S4 @2026-11-18]\n- **Marriages in 1874–1925:** the civil registers (personregistre), which hold every marriage of those years; the church book is secondary. [S3 @2026-11-18], [S4 @2026-11-18]\n- **Marriages from 1926:** a church wedding in the church book; Rigsarkivet says marriages were then entered as in the rest of the country, so a civil wedding follows the general civil-marriage routes. [S4 @2026-11-18]\n- **Probates up to 1920, ordinary or private:** start with the Register over sønderjyske skifter op til 1920 (below); then the authority for the date: the herredsfoged or birkefoged in the countryside and the byfoged in towns before 1864, none named for 1864–1866 (see the rule below), and the Prussian district courts (amtsretter) for 1867–1920. The guide names no other South Jutland authority for ordinary or private probates, so do not route a South Jutland probate to an estate or an amt by the deceased's status. For a soldier or officer, also check the army row below. [S5 @2026-11-18]\n- **Probates after 1920:** the guide's South Jutland rules stop at 1920, so use the general probate routes. [S5 @2026-11-18]\n- **Soldiers, officers and their families in South Jutland before 1864:** also check the army rule in the probate section; the Schleswig and Holstein regiments stayed with their auditors until 1864. [S7 @2026-11-18]","sources":["S4","S3","S5","S7"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-19","kind":"portal-availability","anchor":"Before 1874 the parish's hovedministerialbog or kontraministerialbog is scanned on Arkivalieronline. The personregistre are scanned on Arkivalieronline by registration district, which is roughly the parish, up to 1960/61, and the 1926–1960/61 church books are scanned as kontraministerialbøger. For 1960/61–1973, deaths are online up to about 1970, and the rest is ordered through Søg i Samlingerne for the reading room in Aabenraa. Rigsarkivet's guide gives separate routes from 1974. [S4 @2026-11-18]","sources":["S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20","kind":"custody","anchor":"Private probate was easier to arrange in Schleswig, so fewer probates survive than elsewhere in Denmark. Rigsarkivet's index to South Jutland probates up to 1920 is the Register over sønderjyske skifter op til 1920 in DDD; the guide says all probates are entered there with the series and the protocol page. [S5 @2026-11-18] If the register gives no authority for a probate from 1864–1866, treat its route as unresolved rather than following another period's route.","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-21","kind":"portal-availability","anchor":"The register's search page answered on 18 November 2026. [S10 @2026-11-18] Rigsarkivet is phasing DDD out, is moving its data to Søg i Samlingerne and warns that DDD searches may fail. [S9 @2026-11-18] If the DDD search fails or the register has gone, try Søg i Samlingerne, and record the probate search as incomplete. Record an empty result as a nil for that index only, not as proof that no probate was held.","sources":["S10","S9"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-22","kind":"historical","anchor":"A probate (skifte) lists the deceased's property and heirs. The oldest surviving probates are from about 1650, and older protocols may be lost. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-23","kind":"historical","anchor":"Until 1851 the deceased's status decided which authority held the probate. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-24","kind":"custody","anchor":"- **Market-town residents (købstadsbeboere):** the town's byfoged, in the probate protocol (skifteprotokol). [S5 @2026-11-18]\n- **Tenants (fæstere) and employees of an estate:** the estate's own archive. From 1817 the tenants of smaller estates went to the herredsfoged or birkefoged. Tenants in a cavalry district (rytterdistrikt) went to the district or its birk; the cavalry districts were abolished in 1776. For North Jutland, the Stedregister til Nørrejyske Godsarkiver helps you find the estate from the parish. [S5 @2026-11-18]\n- **Estate owners, freeholders (selvejere) and other rural people without tenant status:** the amt before 1793, then the herredsfoged or birk until 1851. [S5 @2026-11-18]\n- **Private probates** (samfrændeskifte, kommissionsskifte, eksekutorskifte, eksekutorbo), settled outside the authorities: the amt's archive, in series for probates or executors. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-25","kind":"custody","anchor":"From 1851 to 1919 ordinary probates went to the byfoged, herredsfoged or birk, and private (executor) probates were filed with the amt once settled. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-26","kind":"portal-availability","anchor":"For an ordinary probate before 1919, open the name register to the probate protocol first where one exists; it gives the protocol page. If the probate is not in the protocol, search the death register (dødsanmeldelsesprotokol), kept from about 1820. It records deaths with nothing to divide, surviving spouses who kept the estate undivided (uskiftet bo) and private probates. For a known private probate, go to the amt's series for probates or executors; some amter kept registers of their private probates. Most of this material is scanned on Arkivalieronline and reached through Søg i Samlingerne; the rest is ordered for the reading room. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-27","kind":"portal-availability","anchor":"From 1919 each court district's probate court (skifteret) handled probates. Start from the register to the case list where one exists; otherwise take the case number from the death register or the case list (skiftesagliste), then open the case documents, which are filed by that number. Executor estates were filed with the amt until about 1933 and with the probate court afterwards. Most of this material is ordered for the reading room, and Søg i Samlingerne links any scanned part. Probate records are closed for 75 years. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-28","kind":"historical","anchor":"Copenhagen kept its probate protocols in a system of its own; use Rigsarkivet's separate guide to Copenhagen probates. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-29","kind":"portal-availability","anchor":"- **Clergy, parish clerks, bell-ringers, schoolmasters and grammar-school teachers before 1807:** the deanery (provsti) as archive creator, series skift. Copenhagen's clergy went to the Copenhagen probate court after 1771, and the rest of the country's to the byfoged, herredsfoged or birkefoged after 1807. [S6 @2026-11-18]\n- **Soldiers, officers and their families before 1864:** each regiment's auditor. Copenhagen's regiments went to the Copenhagen court (Hof- og Stadsret) in 1771, and units elsewhere to the civil courts in 1805, except Christiansø (until 1856) and the Schleswig and Holstein regiments (until 1864). Almost none of the regimental auditors' probates from before 1771 survive; for 1688–1771, look under the auditor of the Copenhagen garrison command, the auditor of Rendsborg fortress and the Generalauditøren. The military probate series are not digitised and are seen in the reading room. [S7 @2026-11-18]\n- **Navy crews, their spouses and children, 1659–1771:** the Underadmiralitetsretten, whose oldest surviving probates are from 1659. Its probate books and their registers are scanned; its other series are seen in the reading room. After 1771 navy probates were handled like other citizens'. [S7 @2026-11-18]\n- **Jewish citizens before 1814:** Det Mosaiske Troessamfund. Its probates survive from 1760, without finding aids, in four series kept in date order. [S8 @2026-11-18]","sources":["S6","S7","S8"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-30","kind":"custody","anchor":"Take the death date and any recorded residence or place of death to Rigsarkivet's death-certificate guide. Use the residence at death to identify the medical district, then search Dødsattester under the creator the guide specifies. For a sudden or unexplained death, check the medico-legal certificates. The guide routes rural medico-legal certificates from 1871 to Sundhedsstyrelsen and lists South Jutland separately, with no surviving certificates noted for 1864–1920 and Sundhedsstyrelsen coverage from 1921. [S17 @2026-11-22]","sources":["S17"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-31","kind":"custody","anchor":"Use the place of death or discovery and the date to identify the local police or judicial authority that could have investigated. In the catalogue, look for series under that creator using dødfundne personer or selvmord, and check its forhørsprotokol (inquiry register) or politiprotokol where applicable. [S16 @2026-11-22], [S18 @2026-11-22], [S19 @2026-11-22]","sources":["S16","S18","S19"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-32","kind":"portal-availability","anchor":"For a suspected suicide, also search Danmarks Statistik's Rapporter over selvmord by year and open the exact bundle, using the region or journal-number range where listed. [S20 @2026-11-22], [S24 @2026-11-22] Check the bundle's access in the catalogue. The Arkivalieronline list headed 1895–1924 ends at 1904, and Daisy lists the 1905–1924 bundles for ordering. [S21 @2026-11-22], [S22 @2026-11-22]","sources":["S20","S24","S21","S22"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-33","kind":"method","anchor":"Compare the statistical return with the underlying local investigation and the death certificate. Identify each by record type and locator, and use published aggregate tables for context only. [S16], [S23]","sources":["S16","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-34","kind":"custody","anchor":"For a relevant unit with no scan, check the series' access rules and use Rigsarkivet's reading-room order route for that exact unit. Death certificates have a 75-year access period. [S17 @2026-11-22], [S19 @2026-11-22], [S22 @2026-11-22]","sources":["S17","S19","S22"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-35","kind":"portal-availability","anchor":"For a death from 1918 onward, search the deceased's name in MyHeritage's *Denmark, Deaths Published in National Gazette* index to Statstidende. Record the birth date or year, residence, death date, publication date and spouse as given. Use only the deceased's details in the search. [S11 @2026-11-22], [S12 @2026-11-22]","sources":["S11","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-36","kind":"custody","anchor":"Use the publication date to locate and read the original notice. Record its issue and page or notice number when available. For a print issue, check the Statstidende holdings at Det Kgl. Bibliotek by that date. [S15 @2026-11-22]","sources":["S15"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-37","kind":"method","anchor":"Read a dødsbo notice (proklama) as a call for claims against the estate. [S13 @2026-11-22] When the notice names an estate contact or a bobestyrer, record the role as printed. [S11 @2026-11-22], [S14 @2026-11-22] A private estate's contact may be a relative. [S14 @2026-11-22] Use any named court or case reference to follow the probate route above. If the index is empty, continue with the death register or the relevant probate series. Danmarks Domstole gives boudlæg, a way to settle small estates, as an example where no proklama is published. [S13 @2026-11-22]","sources":["S13","S11","S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
