claims:
  - {"id":"C-ebf6cadc621a","kind":"method","anchor":"According to Kyläkoski’s 1819 example, extend the date window into later Finnish-language coverage when the event precedes the newspaper’s run [S1†]. *Turun Wiikko-Sanomat* began in 1820. If it is your expected title for an 1819 event, search contemporaneous Swedish-language reporting in Finland and check the later Finnish run [S2], [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-30d3a01dd702","kind":"method","anchor":"According to Kyläkoski, check where the 1827 run of *Turun Wiikko-Sanomat* ends before assigning a missed report to OCR [S5†]. The fire interrupted publication in 1827, and the title returned in 1829. For events after the last 1827 issue, switch to another title or later coverage [S2].","sources":["S5","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6c3e73784e01","kind":"example","anchor":"According to Kyläkoski, a later poem describes the 1819 grain relief [S1†]. Use *Kalliista Ajasta vuonna 1819* in *Turun Wiikko-Sanomat*, no. 15, 15 April 1820, to find the retrospective account and keep the event year separate from the issue date [S7].","sources":["S1","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e0bd0fc31abe","kind":"portal-availability","anchor":"According to Kyläkoski, browse in the respective national-library newspaper portals [S1† @2026-11-22]. Start in the National Library of Finland’s Digi for papers published in Finland, including Swedish-language titles. For a title published in Sweden check Svenska tidningar separately. Verify the title and issue in the relevant portal and use [newspaper title coverage](newspaper-finder-title-coverage.md) when the expected issue is missing [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S1","S3","S4"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f76d630b3369","kind":"portal-availability","anchor":"For a subject search in 1771–1890, check the old newspaper article index by topic in Digi. Keep its response separate from full-text results. If the exact issue has an access restriction, log the restriction and the catalogue or microfilm locator. Use [newspaper section search](historical-newspaper-section-search.md) when you have the issue but the item is still missing [S3 @2026-11-22].","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-16ce4fa13f0c","kind":"method","anchor":"When a later item refers to the paper’s own earlier report, count back from the later issue date using the stated interval. Browse the resulting range by title and issue even if a name or subject search missed it. Record the later reference as a lead and leave the earlier item unresolved until recovered. Use [evidence and proof](evidence-proof-judgment.md) to compare the accounts if you find both [S6].","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
