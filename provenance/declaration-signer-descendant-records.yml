claims:
  - {"id":"C-000000000001","kind":"custody","anchor":"Search for Frank Willing Leach’s *A genealogy of the signers of the Declaration of Independence*. Follow the society’s FamilySearch catalogue route or use Microfilm 4498 at the Library of Congress. Record the edition, reel or image group and page actually used [S2 @2026-11-22] [S3 @2026-11-22]. Check the film’s access in the user’s account.","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"Use the signer’s name and state to select the relevant part and trace the candidate branch. Leave the relationship open when a descendant is missing from the compilation. The Library of Congress guide documents gaps [S2] [S3].","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"method","anchor":"Use Frederick Wallace Pyne’s 2004 *Signers of the Declaration* index with the three accompanying CDs. Choose the index access point that matches the signer’s name, a deceased member’s name or that member’s number. Retrieve the cited application and its attachments. Treat the 2004 publication as a historical set and leave later applications outside its coverage [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"Based on the available excerpt, the presenter suggests using the Leach manuscript and the application files together when assembling the descent [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
