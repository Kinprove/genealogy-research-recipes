claims:
  - {"id":"C-03e274ca17ab","kind":"portal-availability","anchor":"According to the presenter, compare hosts when the target roll is missing [S1† @2026-11-21]. Start with RG 127, T1118 for 1798–1892 or T977 for the 1893–1940 set described by FamilySearch. In FamilySearch check the separately listed indexed and unavailable rolls. If the roll is present but unindexed, browse by roll and month, then by post, station, ship or unit. Check Ancestry if the roll is absent, including for 1940–1958 dates beyond the FamilySearch coverage. When both carry the same page, use the copy that preserves the remarks most legibly and retain its locator. [S3 @2026-11-21] [S4 @2026-11-21]","sources":["S1","S3","S4"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fc46cfef2f86","kind":"method","anchor":"Establish the Marine’s unit for the date at issue before using a unit history to interpret individual service. According to the presenter, keep the regimental machine-gun companies apart from the Sixth Machine Gun Battalion and follow dated changes of assignment [S2†]. Check the 5th and 6th Marine Regiments and 6th Machine Gun Battalion under the 4th Brigade and the 2nd Division. Use the 5th Regiment’s listing for the 8th Machine Gun Company and the 6th Regiment’s for the 73rd Machine Gun Company. McClellan traces the 11th and 13th Regiments and Fifth Brigade Machine Gun Battalion separately under the 5th Brigade and describes its duties in the Services of Supply. Use their unit records and dated remarks before attributing an engagement or duty to the Marine. [S5] [S6]","sources":["S2","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2b0e1bae994b","kind":"custody","anchor":"According to the presenter, use a compiled death entry to locate the register and distinguish the register entry from details added from other reports [S2† @2026-11-21]. In RG 127, look for the Register of Deaths of Marine Corps Personnel during World War I, 1918–19. Check it separately from the longer death registers for enlisted Marines. [S5 @2026-11-21]","sources":["S2","S5"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
