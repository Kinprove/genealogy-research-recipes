claims:
  - {"id":"C-e4f142b0e86c","kind":"unclassified","anchor":"1. Record whether the target meeting falls within Hinshaw's *Encyclopedia of American Quaker Genealogy*. This is a six-volume work compiled by William Wade Hinshaw and published 1936–1950. A separate index volume followed in 1999. It covers mainly meetings east of the Mississippi River, not the whole United States [S1]. The printed volumes are North Carolina (v. 1), Pennsylvania and New Jersey (v. 2), New York (v. 3), Ohio (v. 4–5) and Virginia (v. 6). Indiana is not in the printed set; Willard Heiss abstracted Indiana separately.\n2. Keep the printed Encyclopedia and Ancestry's *Hinshaw Index to Selected Quaker Records, 1680–1940* apart. The reported figure of 197 meetings in 17 states was not verified against Ancestry's current collection description; confirm coverage there before relying on that count. The presenter demonstrates an index entry for Walnut Ridge, Indiana, a meeting outside the printed volumes [S1]. Record which of the two you checked.\n3. If the meeting is outside the work you checked, or you cannot confirm it is inside, do not read an empty Hinshaw result as a negative. Record the result as \"not covered\" or \"coverage unconfirmed,\" not \"no record.\"\n4. Even inside its coverage, treat a Hinshaw abstract as a pointer back to the monthly-meeting books. It is not a substitute for them [S1].\n5. For Ancestry's Quaker minutes (titled U.S. Quaker meeting records, 1681–1935), read the database description before searching. The 2017 presenter reports that the description gives date-style tips and notes the 1827 split that affected record-keeping. In 2017 she gave the coverage as 20 states plus the District of Columbia, with nearly 6.5 million names indexed and many more people in the images left unindexed [S2]. Record the current description's coverage and name counts in your packet, and use those figures.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d227a038e8b1","kind":"unclassified","anchor":"1. Read the meeting code at the top of each Hinshaw index entry. Translate it with the index's own key before you assign the entry to a meeting. In the presenter's demonstration, the key was on the first card, and the code resolved to Walnut Ridge Monthly Meeting, Indiana [S1]. Do not guess a meeting from the surname's state distribution or from a nearby entry.\n2. On Ancestry, find the Hinshaw items through the Card Catalog keyword search. Several Hinshaw-related titles turn up, including the *Hinshaw Index to Selected Quaker Records, 1680–1940*, a cross-index to it, and the Encyclopedia itself [S1]. Note which one you actually searched.\n3. Once the meeting is decoded, search the meeting name together with the surname to gather every entry for that family in that meeting [S1]. Keep these entries as leads. A shared surname within one meeting does not establish one household or kinship.\n4. Keep the literal code, the decoded meeting name, and the key you used side by side, so that another researcher can check a misread code.\n5. Before you read an event from an entry, decode its abbreviations with the list at the front of the Hinshaw volume (Volume I, page xv) [S7], [S8]. Common ones: rocf = received on certificate from; gct = granted certificate to; rq = requested; rqct = requested certificate to; dis = disowned (for); mou = married out of unity (one partner not a Friend, or of another branch); mcd = married contrary to discipline; con = condemned (the member acknowledged his or her own misconduct); rmt = reported married to; d = died; dec = deceased; dt = daughter. \"dis mou\" records a disownment for marrying out of unity, not a death or a move. Copy the abbreviation literally and put your expansion beside it.","sources":["S1","S7","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-51bd6bd514e7","kind":"unclassified","anchor":"1. Men and women met separately, and each kept its own minutes. Search both the men's minutes and the women's minutes for every meeting. Search the removal certificates for both men and women, in every series the custodian's finding aid sets out, whether arranged by sex, by branch or both [S1]. List each series you inspected, with its date span. A search of only one sex's series is partial, and so is a search of only one branch's where both branches existed for the target place and period.\n2. Expect marriages and removal certificates to be the main records. The presenter says births and deaths are often incomplete and birthplaces were usually not recorded [S1]. A missing birth, death or birthplace is not negative evidence.\n3. The presenter says that when a new meeting was set off, no membership list was made: Friends already living within its boundary became its members automatically. For someone who later moved, a removal certificate to the next meeting is the clearest proof of membership in the earlier meeting. For someone who never moved, she points to marriage records and disciplinary minutes as the places the person appears [S1]. Search for the outgoing certificate in the earlier meeting and the matching receipt in the receiving meeting. Some meetings did keep membership lists in later periods (for example, Goshen from 1828), so check whether a list survives for your meeting and years. Never assign membership from residence within the boundary alone.\n4. Read the full image of each marriage minute or certificate for the witness list. The 2017 presenter reports that witnesses appear in the records but were not indexed [S2]. Transcribe the witnesses and other associates from the image. Never infer them from the name index.\n5. For any entry dated after the Hicksite/Orthodox separation in the meeting's own yearly meeting, record which branch kept it. The 2017 presenter notes that the split affected record-keeping [S2]. New York Yearly Meeting's historical statement dates the separation to 1827 for Philadelphia, and to 1828 for New York, Ohio, Indiana and Baltimore. It also records later Wilburite/Conservative separations of yearly meetings, in New England in 1845 and New York in 1853 [S5]. In New York the Orthodox quarterly meetings began to divide earlier: Scipio and several others split in 1847, and the Wilburite yearly meeting at Poplar Ridge was founded in 1853. The Wilburites divided again in 1859, into Otisite and Kingite branches [S6]. So a New York meeting can have a Wilburite branch from 1847. Take the keeping meeting's affiliation and dates from the custodian's finding aid, not from the date alone. Where both branches had a meeting in the area, search both sets of books. A gap in one branch's books is not absence from the Society.","sources":["S1","S2","S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-698f06a3428a","kind":"unclassified","anchor":"6. For an emigrant from Britain or Ireland, start from the removal certificate received in the American meeting: it normally names the issuing meeting and its date. It may be copied into a separate book of recorded certificates, or kept as an original, rather than noted in the minutes. Early minutes seldom record a receipt [S9]. Then search that meeting's records:\n   - **England and Wales:** the Quaker registers surrendered to the Registrar General (TNA RG 6, 1578–1841), searchable on TheGenealogist, Ancestry and Findmypast. Friends House Library in London holds the digest registers that Friends compiled from them by surname, on microfilm, and a later digest sequence from 1837. Most meeting minutes are in local record offices, not at Friends House. [S10], [S11]\n   - **Ireland:** Friends Historical Library, Dublin, holds the archives of Quakers in Ireland. Documents from 1670 to 1914, including migration records naming the origin and destination meetings, are on Findmypast. [S12]","sources":["S9","S10","S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7a2891165d4f","kind":"unclassified","anchor":"If early minutes for the target meeting are unavailable, use its locality and period to look for court proceedings concerning Quaker gatherings, then inspect whom they name as attending. Ruane's Salem account motivates this fallback; keep a described gathering separate from the identified monthly-meeting unit, and do not treat an accusation or reported attendance as proof of membership. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8f6fba1a9c0c","kind":"unclassified","anchor":"1. Copy each date exactly as written: day, numbered month (Roman or Arabic numerals), and year. Put the converted modern date in square brackets after it, for example \"27 IV 1731 [June 1731]\" [S1]. Never replace the literal value with the conversion.\n2. Before 1752, First Month is March, not January. The year began on 25 March until the 1752 change, and Friends numbered the months instead of using names derived from pagan gods [S1]. Swarthmore College's Friends Historical Library \"Quaker Calendar\" page (<https://www.swarthmore.edu/friends-historical-library/quaker-calendar>) confirms this in its worked examples: before 1752, 1st month is March and 4th month (iv) is June. From 1752 on, First Month is January. Use the Swarthmore page and its converter for conversions. The presenter's spoken explanation wavers on this point, so do not rely on it [S1].\n3. Flag any single-dated entry from January to 24 March before 1752 as year-ambiguous. The presenter says such a writer was usually, but not always, anticipating the new year [S1], and Swarthmore's examples treat it the same way. Record both candidate years, and send the choice to the evidence/proof recipe linked above.\n4. Search online indexes with the modern form, which the presenter says most systems expect. Keep the literal form in your notes. Do not add an \"O.S.\" suffix inside search fields, because the presenter warns it can confuse search algorithms [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
