claims:
  - {"id":"C-a56648ec5793","kind":"custody","anchor":"Start with the port that created the record and the date of the voyage or application. According to\nthe presenter, check customs records for early protection applications [S1† @2026-11-22]. In RG 36,\nuse Entry UD 60 to identify the particular port’s holdings. Look separately for an application, proof\nof citizenship, certificate register and quarterly abstract. Read any witness statements or\nattachments for a stated birthplace, citizenship and relationship [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-398b03ed3ba3","kind":"method","anchor":"According to the presenter, use Ruth Priest Dixon’s indexes to get to the underlying application\n[S1†]. For Philadelphia, use the Dixon and Eberly index for 1796–1823 and its supplement through 1861.\nCarry the port, application or certificate number and date to the original record when available [S2],\n[S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0caa4a71e8a3","kind":"custody","anchor":"For an application from 1916–1940, check RG 41, Entry UD 159, National Archives Identifier 2788575.\nUse the port to check the regional exceptions for Philadelphia and Boston. The application can carry a\nbirth date and place, vessel, rating, signature, photo and citizenship attachments [S2 @2026-11-22],\n[S7 @2026-11-22]. According to the presenter, this later application series is the place to look for\nattached photos [S1† @2026-11-22]. Use documentary identifiers to test identity and record any\npersonal recognition as an attributed claim.","sources":["S2","S7","S1"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-3893db1699eb","kind":"custody","anchor":"According to the presenter, start with a known home-port clue for crew lists [S1† @2026-11-22]. Follow\nit to the customs district or port that received the voyage record. Use the vessel, port and arrival\nor clearance date to check the relevant RG 36 or RG 41 holdings. Read the series scope before treating\nan absent listing as a miss [S4 @2026-11-22].","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d8101e9b93f6","kind":"custody","anchor":"Use the seaman’s port clue to identify the shipping commissioner’s port for the voyage. In the\nshipping articles, search by the vessel and voyage date. Start with the New York series for 1872–1937\nif the voyage fits. Check the dates and filing arrangement separately for another port\n[S5 @2026-11-22]. According to the presenter, shipping articles are a separate search from crew lists\n[S1† @2026-11-22].","sources":["S5","S1"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2930f8cab9fc","kind":"custody","anchor":"For reported impressment, check the Department of State’s RG 59 series. Use M2025’s indexes and\nregisters of applications for release for 1793–1802. For dates outside that span, check the other RG\n59 series in the finding aid. Keep the date of the application for release separate from the\nimpressment date [S6 @2026-11-22]. According to the presenter, this State Department route can\nsupplement the protection search [S1† @2026-11-22].","sources":["S6","S1"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
