claims:
  - {"id":"C-85a4bc2666fa","kind":"portal-availability","anchor":"Start with the province governing the place when the person was reported missing or the court ordered the search. Search by office, year and the terms *kuulutus* and *kungörelse* in the National Library of Finland catalogue, then follow the individual record to its copy. National Library records identify the Turku and Pori and Vaasa chanceries separately [S3 @2026-11-22] [S4 @2026-11-22]. Check whether the copy preserves the whole notice before using any omission. The entry for the Turku notice of 29 November 1800 describes only a surviving final leaf [S4 @2026-11-22].","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9d67ececa157","kind":"method","anchor":"Carry the court order's date forward into the notice search. For an unlocated notice, widen from the reported departure to later months and search other provinces named in the case. The notices could be sent to parishes for reading in church [S2]. In the reported 1798 case, two provinces issued a notice for the same person on different dates. Use the Vaasa entry of 7 March and look for the Turku and Pori notice of 13 March [S1] [S3].","sources":["S2","S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2cfccfb9e872","kind":"method","anchor":"Record the issuing office, the notice number and issue date, and the date of departure only if stated. Extract any identifying age with its qualifier, kin or associates, home or employer, appearance, language, and clothing actually reported. Keep suspicion, accusation and any stated judgment in separate fields. When a notice gives an uncertain alias or refers to an earlier search, retrieve the earlier notice and compare the reported age, origin and companions before linking the people. Omit dress from matching when the notice gives no distinguishing outfit [S1] [S2] [S5].","sources":["S1","S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4802b93f50c3","kind":"method","anchor":"Use the names, places and dates to resume the [parish household chain](scandinavian-parish-record-recovery.md). Record the named court, any case reference and the hearing date. Use the court and year to look for its minutes in the Finnish archive catalogue. If the notice gives only the place, establish which court served it at the time before selecting a series. Record a missing outcome as open and keep what the notice explicitly alleges separate from the result of each follow-up [S1] [S2] [S5].","sources":["S1","S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-01697a4d51b2","kind":"method","anchor":"If the notice directs a return, record who asked for the search, the stated reason, the intended recipient or place, and the named payer. The directions tell you whom and where to look for in follow-up records [S2] [S8] [S9].","sources":["S2","S8","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d0cd4c7d814f","kind":"example","anchor":"In the reported Kauvatsa case, the 5 January 1788 chancery notice describes a departure without dating it, while the communion book gives Ulvila as a destination and omits the circumstances. Keep the two observations separate [S8] [S9].","sources":["S8","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e34b2f6976ae","kind":"custody","anchor":"Check *Lääninhallituksen kuulutukset* through the National Archives of Finland in Turku. Östman's source notes identify the bound series by that title, including Turku provincial chancery notice 59 of 20 September 1813 [S2 @2026-11-22]. Kyläkoski reports that in April 2026 the branch directed her to its library volumes and a free-form on-site order after the Astia search missed. Check the branch's reading-room calendar and confirm the ordering route for the bound series before relying on that procedure [S6 @2026-11-22] [S7 @2026-11-22].","sources":["S2","S6","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
