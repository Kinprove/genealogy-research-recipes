claims:
  - {"id":"C-5cde6b3b5fcc","kind":"unclassified","anchor":"Use this recipe when an ancestor disappears from records and you suspect arrest, trial or imprisonment. It also applies when a census institution entry, newspaper report or family story names a prison. Before choosing where to search for court files, establish which court tried the case and who holds the records now. For U.S. cases distinguish federal, territorial and state jurisdiction; use the separate England and Wales branch for a no-fixed-abode lead in those jurisdictions. If the prison is already known, open that prison's admission record first to find the trying court: the Idaho convict description in S4 records the county (Washington County) and the court term (May 1896) [S4]. Then work out which prison series survive and what access rules apply to them. Use [newspaper search recovery](newspapers-com-search-recovery.md) to find the arrest or trial report, and [census workflows](us-census-practical-workflows.md) to recover the institution enumeration. Identity and conflict rulings belong in [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c44c9fb038a","kind":"unclassified","anchor":"- Gather the triggers: a census line in a prison or asylum [S1], newspaper arrest, trial or incarceration reports [S1], [S3], and family accounts. Keep every family kernel, even ones that later prove wrong, and test each one [S3]. Some families avoid the subject, so a family's silence is not a negative [S1], [S3].\n- Start with the location and approximate period, but check available **name indexes before requiring a date or inmate number**. Sing Sing admission registers (B0143) are searchable on Ancestry as *New York, U.S., Sing Sing Prison Admission Registers, 1865–1939*. The New York partnership offers free access to New York State residents with a free account; others need an applicable subscription or library access. Verify each result on the register image. [S14]\n- For foreign-born Sing Sing prisoners, also search the Archives' name index to **B0146, List of Foreign Born Prisoners, 1919–1944**. It can supply an admission date and inmate number; it is not a general index to all admissions. [S15]\n- For later, unindexed registers (including the 1940–1970 period), obtain a conviction/admission date window or inmate number before chronological browsing or a staff search. The 1940 census can supply inmate numbers. One presenter's five-year browsing window is an example of that route [S3], not a prerequisite for searching the earlier online name index. Record which index and years you searched, or the window/number and pages browsed. A failed name search is not proof that the prisoner was never admitted. [S14], [S15]\n- Imprisonment did not always follow a crime. The presenter's example is imprisonment for debt [S1]. Polygamy/cohabitation prisoners are a different case: the presenter notes they were convicted under the law of the time [S1]. Do not assume the offence category from the institution alone.\n- Do not assume jurisdiction from the offence label either. The same conduct (for example, liquor selling) could be prosecuted under state or federal law. Take the jurisdiction from the court of conviction, not from the type of crime.","sources":["S1","S3","S14","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fe597866878c","kind":"unclassified","anchor":"- Find out which court actually tried the case before you search local county records. Tanner reports that his ancestor Samuel Linton was arrested for unlawful cohabitation in 1887 and was convicted \"not in a Utah court but in the district court\". He found those district court records at the National Archives branch in Denver and obtained them by a paid request [S1]. In practice this means the federally appointed territorial district court, which sat in Utah. It does not mean a court outside the territory.\n- For territorial-era cases, search two custodians. Utah district court records (Record Group 21) are at NARA Denver, and the territorial case files for 1870–1896 are filmed as NARA M1401, which can be searched on FamilySearch and Fold3. For the First District's separate state-archive holdings, seek the appropriate division's **criminal case files**, Series 1521 (southern) or 1529 (northern). Series 28377 is an unlawful-cohabitation **register of actions**, not the loose case files. Confirm its current loan/access status with the Archives before planning to inspect it; an older catalogue's public designation does not guarantee reading-room availability. Check M1401 and the applicable state-archive case series independently. [S16]\n- Learn the procedural stages: arrest, charge or indictment, preliminary actions, trial or plea, sentencing, place of sentence [S1]. The court case file and the prison file are separate records, and each has to be traced on its own [S1].\n- Do not assume the prison was in the home state. A federal prisoner could be held in any federal prison with space [S1]. Alcatraz, for example, held federal inmates convicted across the country.\n- Write one routing row per lead: the court, its jurisdiction level, the evidence for that level, the current custodian of the court records, and the likely custodian of the prison records.","sources":["S1","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-88cddab7a63a","kind":"unclassified","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> A Bureau of Prisons, department of corrections or state archives request asks for a file about an inmate who may be living, and it may name living relatives. Before any request below, answer the privacy gate in `SKILL.md` first. This includes clemency or parole requests to a governor's office or parole board, and pardon-file requests to NARA or the responsible pardon office.\n- **Federal conviction:** start with the series NARA still holds. A NARA History Hub reply says most individual federal inmate case files were temporary records and are not held by NARA. The exceptions include Alcatraz, Leavenworth, Atlanta and McNeil Island, and the notorious-offenders files. Check whether your inmate was held at one of those penitentiaries or falls in the notorious-offenders series before you file any Bureau of Prisons request. If none applies, file the request anyway, log the reply and classify the series from it.\n  - A listener's 2007 account shows the request route [S2]. A county society redirected her to the Oklahoma corrections department, which sent her on to the Bureau of Prisons because, she reports, \"bootlegging was a federal crime\" [S2].\n  - The Bureau's emailed public-information reply was a bare-bones extract of the file [S2]. Do not file such a reply as the prison record.\n  - Clarifying the extract required a FOIA request form and a copy of the death certificate [S2].\n  - The Bureau then said it no longer held the records and referred her to NARA with a specific file number [S2]. Log that number.\n  - NARA required written consent from the inmate's family, or else the copy would be redacted. She accepted a redacted copy [S2].\n  - The request ran from 20 May 2007 to about mid-February the following year [S2]. The host describes the resulting packet as thick, with photographs and psychological testing [S2].\n- **State conviction:** start with that state's department of corrections [S2], then check the state archives. Historical state prison series often end up there: the Sing Sing admission registers are at the New York State Archives [S3], and the Old Idaho State Penitentiary records (AR 42/2, 1872–1973, including \"description of convicts\" volumes) are at the Idaho State Archives. Find the prison series in that state archives' finding aid.\n- **State clemency and parole:** check the governor's clemency papers and parole-board records as separate series, including when the prison file is missing. Establish the responsible authority, period and current custodian through the state archives or agency. New York's A0597 clemency files, for example, can contain petitions from prisoners and relatives; Utah's Series 328 pardon applications can include court and biographical material. Record an application, recommendation and actual grant or denial separately. A petition does not show that clemency or parole was granted. [S17]\n- **Federal pardon or commutation:** search federal pardon applications separately in **NARA RG 204, Office of the Pardon Attorney**. Its historical guide describes pardon case files for 1853–1963, dockets and indexes, with some indexes retained by the pardon office. Use the particular series' current catalogue entry to establish custody, coverage and access before requesting a file. Do not assume the prison's NARA facility holds it, or that an application establishes a pardon. [S18]\n- Record in the request log: agency, form, date sent, date answered, file number quoted, documents supplied (death certificate, kinship proof), whether you gave consent or accepted redaction, and what you actually received (extract, redacted copy or full file).\n- Death status matters for access. Note whether the inmate is dead, how long ago, and whether the children are living [S2].","sources":["S2","S3","S17","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0908b9db8953","kind":"unclassified","anchor":"- Ask the custodian which series survive. Do not assume a case file exists. For Sing Sing:\n  - The presenter says the general inmate case files were destroyed years ago [S3]. The New York State Archives says only that it holds no Sing Sing inmate case files apart from some for executed inmates. Record that series as \"not held by the State Archives\", not as destroyed, unless you find a destruction record.\n  - The admission registers survive at the State Archives in Albany [S3]. Start with the online 1865–1939 name search and the population-specific B0146 index where applicable; use a date or inmate number for unindexed chronological browsing (see above). [S14], [S15]\n  - Case files for inmates sentenced to electrocution survive as series B0145 (1939–1963). The Archives' description lists warrants of execution, investigation reports and post-mortem/remains reports. The presenter says some files also include visitor lists, last-meal requests, family letters and photographs [S3]. Expect the listed contents, and treat the rest as possible.\n- Check closure rules before you search. One presenter says some states open prison and jail records after a period while others say \"never\" [S4]. Idaho, for example, restricts some penitentiary records. Another presenter says rules vary by repository and record type, and that different federal agencies gave her conflicting access answers for the same record [S3]. Get the ruling in writing from the office that actually holds the series [S3].\n- Classify each series as **inspected**, **restricted**, **destroyed**, **not held by custodian**, **referred elsewhere** or **not yet asked**. A restricted, unheld or destroyed series does not mean \"no record\".\n- Check index numbers for gaps. The NYC Municipal Archives holds NYPD Bertillon identification cards, and the presenter used digitized cards from the city's records access website [S5]. A friend's index of the cards jumped from card 14885 to 14889, and he treated that as a possible indexing gap rather than lost cards. He arranged for someone to check the originals on site [S5]. He tied card 14885 to his relative by matching its arrest date (7 January 1908) and charge to a newspaper report dated the next day [S5].","sources":["S3","S14","S15","S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-71dbfe7d1f7e","kind":"unclassified","anchor":"Use this branch for a Victorian person described as having *no fixed abode* or recorded through a criminal-justice or welfare encounter. Keep the household census search open through [UK census interpretation](uk-census-and-1939-register-interpretation.md), including the actual institution and open-air-return coverage for the census year. Do not infer exclusion from all pre-1911 censuses. GenealCymru's historical account motivates the newspaper, prisoner-calendar, police and workhouse leads below [S8]; it does not verify a person's identity or a complete life history.","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-928fe0c65104","kind":"unclassified","anchor":"1. From a newspaper report or police-register entry, retain the literal name and aliases, occupation, stated age or birthplace, incident date and place, named court, prison and institution. Search supported name forms in the local press, including Welsh-language papers for Welsh cases. Keep reported arrest, accusation, trial, sentence and request for relief as separate events; a report that someone asked for admission does not establish admission.\n2. Use the named court and trial year to select a relevant prisoner calendar; use the named prison and date to seek its register. The National Archives describes calendars for assizes and quarter sessions and notes that prisoner records are divided between national, prison and local archives [S9]. Check each series' actual court, year and institutional coverage before searching. Copy the calendar's court/date and any references into the court-file queue; retain the calendar and retrieved proceeding separately. A calendar is not the person's whole criminal history.\n3. Treat a constabulary register or police return as its own series. Establish the responsible force, period, custodian and fields actually indexed; a census-night police return is a different target from a criminal register. Follow any named court or institution with its recorded date, rather than assuming every police record implies conviction.\n4. For a reported workhouse encounter after 1834, identify the dated poor-law union through [English and Welsh nonregister routing](english-nonregister-record-recovery.md#1-build-the-dated-jurisdiction-table-before-choosing-a-series). Seek surviving admission/discharge records at the local or county archive [S10]. Keep a refusal or relief request distinct from an inmate entry. Central poor-law correspondence can mention exceptional individual cases, but does not replace the workhouse's everyday records [S10]. If another institution is named, establish its own custodian and surviving admission series separately.","sources":["S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f28bc8831b56","kind":"unclassified","anchor":"**Return:** one incident-to-record chain, retaining each source's date, descriptors, procedural stage, selected custodian/series, retrieved locator and result. Compare those fields before linking appearances, preserve conflicting namesakes, and quote punitive labels as the record's descriptions. Report missing or uninspected series explicitly; neither an institutional record nor its absence supplies a complete account of the person's life.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d196f759f418","kind":"unclassified","anchor":"Use this branch when a Swedish prison-roll index hit gives a name or alleged offence\nbut leaves the court, proceeding date or next destination unclear. ArkivDigital's\nSeptember 2024 demonstration opens monthly returns sent to *Justitiekanslern* and\nreads columns that its name index does not expose [S7]. The index is an entry point,\nnot an abstract of every procedural or movement note.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c9922152990","kind":"unclassified","anchor":"1. Open the linked original roll image and retain the prison, return month/year,\n   archive, volume, printed page and image locator. Read the whole entry across its\n   columns and any continuation. Copy the literal name and abbreviation, occupation,\n   stated origin and custody details; leave an uncertain expansion unresolved.\n   Check the actual index and volume's date and institution coverage before treating\n   a miss as informative. The demonstration's index counts and coverage are historical.\n2. Separate the dates and roles before choosing the next record. Keep the roll's\n   reporting month apart from admission, release, hearing, order and transport dates.\n   Copy each action's wording and status: awaiting a decision, undergoing proceedings,\n   ordered to leave and reported sent are different observations. An offence label or\n   pending proceeding does not establish conviction or the final outcome. [S7]\n3. Build a separate retrieval target for each authority or destination actually named,\n   using the routing rows below. Identify its historical jurisdiction, surviving series\n   and current custodian before requesting records. Preserve the roll reference beside\n   each target so a failed lookup does not erase the original lead.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f910a7f3b011","kind":"unclassified","anchor":"| Annotation in the inspected roll | Next retrieval target and limit |\n| --- | --- |\n| Named court, proceeding date and action | Locate that court's relevant minute or case series for the stated date/term; compare the retrieved entry's person and procedural stage. A hearing court or higher-court decision still awaited is not automatically a court of conviction. |\n| Governor's office or other administrative authority | Preserve the authority, locality, date and action actually attributed to it. Ask its custodian whether corresponding interrogation or administrative papers survive. A release or passport statement alone does not show that an interrogation file exists or that the governor personally questioned the prisoner. |\n| Onward transport, destination and date | Retain whether transport was ordered or reported as carried out. Follow the named receiving court or institution for the bounded destination/date question; request a cited transport document separately when a reference or finding aid identifies one. Do not invent a receiving prison from a court-district name. |","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-229ab3668e25","kind":"unclassified","anchor":"The demonstration's September 1826 example supplies both a dated court proceeding and\na later transport to another district [S7]. These are separate retrieval leads. A\ntransport annotation does not retrieve a transport order, prove arrival or establish\nwhat happened in the receiving court. Keep a missing date, document reference or\nreceiving institution unresolved rather than filling it from the next plausible hit.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fa2d1c79d259","kind":"unclassified","anchor":"1. Compare other monthly hits only as candidate observations. Record the literal name,\n   descriptors, institution and event dates for each, then test a proposed connection\n   against those fields and the retrieved court or administrative record. The presenter\n   explicitly warns that repeated hits for the same name need not be one person [S7].\n   Retain conflicting or insufficiently identified rows separately; the reporting month\n   alone neither dates a new imprisonment nor proves continuous custody between returns.\n2. Add each followed reference to the existing routing row and request log. Record the\n   source annotation, exact court/authority/destination, dated action, target series,\n   requested item, retrieved locator and comparison result. Distinguish an inspected\n   no-hit from an unsearched month, unindexed field, unavailable volume or unlocated\n   administrative/transport paper. Pass identity and conflict rulings to the evidence\n   workflow, preserving both the allegation and the procedural stage.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-489059cf3502","kind":"unclassified","anchor":"Use this branch for a Swede in police contact between 1878 and 1950. Search ArkivDigital's *Polisunderrättelser* (police gazette) name register, indexed for 1878–1950, by name and its variants [S11], [S12]. Check each hit's birth date against the person.","sources":["S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35852e663949","kind":"unclassified","anchor":"- Open each hit's page image. Record the year, issue number, section and the literal entry. The sections are A (wanted persons), B (detained persons and cancelled notices), C (miscellaneous notices), D (released prisoners) and E (stolen and lost property) [S13].\n- Follow every back-reference in the remarks column to an earlier volume and section by hand, even where ArkivDigital has linked it; it links them only as far as possible [S12]. The presenter's example points to issue 104 of 1907, section D1 [S11]. Open that year, issue and section, and record the earlier entry as a separate observation.\n- Do not treat the register's hit list as complete. Indexing errors and name variants can hide appearances that the back-references reveal. Log each one found only by following a reference.\n- A gazette entry is a lead to the trying court, not proof of conviction. Add the named court, conviction date or prison to the routing row.","sources":["S13","S12","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-acc7d7d3e1e0","kind":"unclassified","anchor":"Use this branch when an identified Swedish proceeding has an incomplete *dombok* entry.\nRetain the court, year, term, paragraph and inspected page/image extent from the actual\nrecord. A missing conclusion in one volume does not establish the case's outcome. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9c6ec0a3dddc","kind":"unclassified","anchor":"1. Compare the book's pagination and text with the image sequence. Record whether the gap\n   appears to be an omitted image, a missing leaf or an uncertain continuation. Inspect the\n   available volume for displaced continuations before describing the original as lost;\n   consecutive viewer images do not establish consecutive surviving leaves.\n2. Ask the custodian whether a matching *renovation* (a court-book copy sent to the\n   *hovrätt*) survives. ArkivDigital points to the appellate court's *advokatfiskal* archive\n   for this route, while warning that a copy may be unavailable for a late-nineteenth-century\n   case. Establish the appropriate appellate authority and its actual court/year coverage\n   before requesting a volume; the suggested archive name is not a surviving-copy locator.\n3. If a docket, judgment or other inspected record establishes an appeal, retain its higher\n   authority and case reference, and request that separate file. Look for transmitted copies\n   of the lower court's papers and protocols. Follow a further appeal only when the records\n   supply that link; an incomplete trial entry alone does not establish any appeal.\n4. Inventory each recovered copy separately from the incomplete book. Compare the case,\n   dates, paragraph and surviving overlap before using it to fill the gap; preserve differences\n   and any missing ending. A copied judgment is not the missing original leaf. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd24c924d818","kind":"unclassified","anchor":"- An archivist's statement that someone is \"not on the list\" describes that list, not whether the person was held. NARA San Bruno holds the Alcatraz inmate files (1934–1963). The presenter reports that Irving Wexler was missing from its Alcatraz inmate list, even though a California death certificate and a New York Times article put his death at Alcatraz [S3]. Contemporary wire reports also place his death there, in June 1952. His file turned up in the Bureau of Prisons notorious-offenders series (RG 129) at NARA College Park [S3].\n- Write a conflict list: each list or index searched with its scope, and each item of contrary evidence (death certificate, newspaper report, census line). If a list misses the person while such evidence places them in the institution, search the next series whose documented coverage could include them: for a federal inmate, the institution's series at other branches, and the notorious-offenders series (RG 129, College Park) only when the inmate was a prominent offender of the kind it covers, as Wexler was [S3]. Name the next series or branch to search.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd47237e973f","kind":"unclassified","anchor":"- From a convict description, keep each field literally: name as written, alias field, age at admission, birthplace, occupation, parents living or dead, age when the inmate left home, religion, literacy, prior imprisonment, and nearest relative with residence [S4].\n- Mark every field as given by the inmate or an unknown informant. Birth year is calculated from admission age, so record it as a range.\n- A ticked alias box with no alias written means the recorded name may itself be an alias [S4].\n- In the presenter's Idaho example, a nearest relative named as the father with a residence, together with a North Carolina birthplace, pointed the search to the previous generation in another state [S4]. Use such fields to target records. They do not establish parentage by themselves. The originals of this record type are at the Idaho State Archives (AR 42/2).","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ce0caa2e62e2","kind":"unclassified","anchor":"- the jurisdiction-and-custodian routing row\n- the request log\n- the surviving-series inventory with each series' status\n- the conflict list on whether the person was held\n- the admission-field lead table, with the informant marked for every field\n- when monthly Swedish rolls are used, the dated annotation-to-record chain, with unresolved identities and transport targets kept separate","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1b23ca312629","kind":"unclassified","anchor":"Name the next custodian, series or on-site check for every open gap.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3ffaff7e2eed","kind":"custody","anchor":"When the charge was too serious for quarter sessions, look for the trial at the assizes [S19 @2026-11-12]. The National Archives files assize records by circuit, each with its own ASSI series, from 1559 for England and from 1831 for Wales; take the county's series from its guide's county appendix for the trial year, not from a fixed circuit list, because the six circuits of the period up to 1876 were later regrouped [S20 @2026-11-12]. Cheshire joined the assizes only in 1830, and Durham and Lancashire in 1876: search their earlier trials in the palatinate court records, and Welsh trials of 1543–1830 in the National Library of Wales's Crime and Punishment database [S20 @2026-11-12]. Start with the crown and gaol books for the charge, plea, verdict and sentence. Expect depositions to survive mainly for capital cases such as murder and riot, and expect to use the originals at Kew or order copies, because the assize records are not online [S20 @2026-11-12]. Look for London and Middlesex trials at the Old Bailey instead: from 1834, as the Central Criminal Court, its records are in TNA's CRIM series, and the earlier London and Middlesex sessions records are at the London Archives [S21 @2026-11-12]. An entry in Ancestry's criminal registers gives the court and trial date to follow; it is not the assize record (see [the convict transportation chain](convict-transportation-record-chain.md)).","sources":["S19","S20","S21"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f7c1c205e390","kind":"custody","anchor":"**Federal pardons outside RG 204's case files:** RG 204's pardon case files begin in 1853. From 1789 to 1853 the Secretary of State and the Attorney General shared responsibility for exercising the President's pardon power, and the State Department issued pardon warrants until 1893. Search the State Department's pardon files, 1789–1893, in RG 59, and RG 204's abstracts of State Department pardon cases, 1793–1853. Applications for amnesty, Civil War and later, are in RG 94 [S18 @2026-11-13].","sources":["S18"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-abcb00b7fc3b","kind":"method","anchor":"A man missing from his family's household in a census is also a trigger: he may have been in prison that year [S22]. Look for him in that census's enumeration of institutions, where the institution's name heads the return; not everyone listed there as an inmate was a prisoner, because orphanages and hospitals also listed inmates [S23]. If he was imprisoned, search the county court records for a divorce filed during or after the sentence [S22]: early in the 20th century, imprisonment was a legal ground for divorce in 39 of the 49 U.S. divorce jurisdictions [S24]. Use [court case-file recovery](court-case-file-recovery.md) for that file.","sources":["S22","S23","S24"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-79ac98a6b8ac","kind":"historical","anchor":"**Read \"no bill\" beside a charge as the grand jury's refusal to indict.** A grand jury wrote \"a true bill\" on an indictment it found supported and \"not a true bill\", or *ignoramus*, on one it did not; that bill was thrown out, and a grand jury could throw out one count or one defendant's bill and find a true bill on another [S28]. A history of the Irish grand juries counts the \"no bill\" findings in an 1811 County Monaghan grand jury book as acquittals [S29], but no trial jury gave a verdict. Do not look for a trial on that bill, and do not record an acquittal at trial or innocence. Check each charge and each co-accused separately. A presenter reading an 1822 Cork prison register attributes one prisoner's \"no bill\" to witnesses who were afraid to testify [S27]; that is his explanation for that case, not what the term means.","sources":["S28","S29","S27"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3e1ce55db4d5","kind":"method","anchor":"**When the court record gives a death sentence or an execution order but no date it was carried out, search the newspapers after the order.** In a 1787 Delaware case, the session docket recorded the order of execution, and only the newspaper reports gave the date of the hanging [S25]. Take the date from the page image, not the database: that issue was indexed under the wrong date [S25], and a researcher reports issue dates and page numbers in several newspaper databases that differ from the page images [S26]. Read the page header, or the front page of the issue.","sources":["S25","S26"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1ef61f120c50","kind":"portal-availability","anchor":"For a trial at the Old Bailey up to 1913, search the Old Bailey Proceedings Online by the names of victims and witnesses as well as defendants. It is a full-text edition of the published accounts of trials at London's central criminal court from 1674 to 1913, with names, occupations, places and dates tagged [S34 @2026-11-14]. An entry for a victim can give an address and a father's name and occupation [S30 @2026-11-14]. The accounts are not verbatim transcripts: before the 1720s they hold little testimony, until the early 19th century they leave some testimony out, and the 19th-century accounts, though fuller, omit sexual details, particularly in rape and sodomy trials [S34 @2026-11-14]. Cite a quoted statement as the published account's wording, not as a transcript of what the witness said.","sources":["S34","S30"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2a64f28c270e","kind":"method","anchor":"Search newspapers for notices about men who absconded. The *Poor Law Unions' Gazette* advertised men who had left their families chargeable to the poor-law union, with a reward for information, and its notices describe a man more fully than most records: height, complexion, hair, eyes, marks and tattoos, his work and where he was believed to be [S35]. One man was advertised in it at least 60 times between 1858 and 1863 [S35]. An 1867 absconder notice of this kind also described the young woman and the child who went with him [S30]. Use the description and the companions to tell the man from namesakes.","sources":["S35","S30"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-82b0731cb0b8","kind":"example","anchor":"Also search the *Illustrated Police News*, a weekly of sensational crime reports and pictures published from 1864 to 1938 [S36]. A 2015 Findmypast article and the 2023 post both used it in Findmypast's newspapers [S30], [S37]. Treat its reports as sensational journalism, and confirm each fact in the court record.","sources":["S36","S30","S37"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-88b53b52364f","kind":"custody","anchor":"To find a prosecution of a man for sex with another man, search The National Archives' Discovery catalogue by the period's charge words, adding a name, county or court. TNA lists among them sodomy, buggery, gross indecency, indecency, importuning, soliciting, unnatural act and unnatural offences [S39 @2026-11-14]. Quarter sessions records are held in local archives: search \"quarter sessions\" with the county and choose the \"Other archives\" filter [S40 @2026-11-14]. Expect the records to concern men: female homosexuality was never explicitly criminalised, so lesbian relationships are generally absent from criminal records [S39 @2026-11-14]. Many 20th-century criminal records at TNA are still closed under the Data Protection Act; you can ask for a Freedom of Information review of a closed record [S39 @2026-11-14].","sources":["S39","S40"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b3640cb30743","kind":"method","anchor":"Read such a record as a record of a charge. An indictment names the accused and the offence, and depositions record the evidence; trial transcripts are very rare [S39]. A charge does not establish a relationship between men accused together, or either man's sexual orientation: a Kent quarter sessions certificate against two men for lewd behaviour leaves their relationship uncertain [S38]. Treat the record as a sensitive finding. Keep a possibly living person's name and charge in the user's private research notes, and never publish or share them (privacy gate and Living people, in `SKILL.md`).","sources":["S39","S38"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0d86404da9a0","kind":"custody","anchor":"**Read \"detained during His Majesty's pleasure\" as an indefinite term.** The sentence sets no release date; under a queen, such as Victoria, the wording is \"Her Majesty's pleasure\" [S31 @2026-11-14]. Under the Criminal Lunatics Act 1800, a person found insane at the time of the offence was kept in custody \"until His Majesty's pleasure shall be known\" [S32 @2026-11-14]; today the sentence is used most often for juveniles, such as a person under 18 convicted of murder [S31 @2026-11-14]. For a person held as insane, look for the asylum rather than a prison release: TNA's guide points to HO 20 (1820–1843), HO 8 (1862–1875), HO 144 (1869–1941) and HO 145 (1882–1921) for criminals confined at Broadmoor and Bethlem after being certified insane at court or after imprisonment [S33 @2026-11-14].","sources":["S31","S32","S33"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
