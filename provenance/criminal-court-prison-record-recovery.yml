claims:
  - {"id":"C-5cde6b3b5fcc","kind":"method","anchor":"Use this recipe when an ancestor disappears from records and you suspect arrest, trial or imprisonment. It also applies when a census institution entry, newspaper report or family story names a prison. Before choosing where to search for court files, establish which court tried the case and who holds the records now. For U.S. cases distinguish federal, territorial and state jurisdiction; use the separate England and Wales branch for a no-fixed-abode lead in those jurisdictions. If the prison is already known, start with its admission record and copy the county and court term into the court-file search [S4]. Then work out which prison series survive and what access rules apply to them. Use [newspaper search recovery](newspapers-com-search-recovery.md) to find the arrest or trial report, and [census workflows](us-census-practical-workflows.md) to recover the institution enumeration. Identity and conflict rulings belong in [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5c44c9fb038a","kind":"method","anchor":"- Gather the triggers: a census line in a prison or asylum [S1], newspaper arrest, trial or incarceration reports [S1], [S3], and family accounts. Keep every family kernel, even ones that later prove wrong, and test each one [S3]. Some families avoid the subject, so a family's silence is not a negative [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fe597866878c","kind":"method","anchor":"- **Identify the court that sat in the place at the time.** Tanner reports retrieving Samuel Linton’s 1887 Utah cohabitation case from NARA Denver [S1]. For the federal territorial district court, use RG 21, M1401 (1870–1896) [S53].","sources":["S1","S53"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-88cddab7a63a","kind":"method","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> A Bureau of Prisons, department of corrections or state archives request asks for a file about an inmate who may be living, and it may name living relatives. Before any request below, answer the privacy gate in `SKILL.md` first. This includes clemency or parole requests to a governor's office or parole board, and pardon-file requests to NARA or the responsible pardon office.\n- **Federal conviction:** identify the penitentiary and conviction date. Check NARA’s RG 129 series descriptions and prison guide for Alcatraz, Atlanta, Leavenworth or McNeil Island [S58]. Check whether your inmate was held at one of those penitentiaries or falls in the notorious-offenders series before you file any Bureau of Prisons request. For a notorious-offender file, look for the Bureau identifier [S54]. If your date or prison falls outside the identified series, ask the Bureau about retention and referral [S2].\n  - Carry the file number through each referral and record what the office actually supplied. In a reported request the Bureau’s first reply was an extract, and it later referred the researcher to NARA with a file number [S2]. Ask the custodian which proof of death, consent or redaction options apply to that file. Keep a redacted copy identified as such.\n- **State conviction:** start with that state's department of corrections [S2], then check the state archives. The Old Idaho State Penitentiary’s historical records include description-of-convicts volumes (AR 42/2) [S4]. For Sing Sing in New York, use the series distinctions below [S49].\n- **State clemency and parole:** check the governor's clemency papers and parole-board records as separate series, including when the prison file is missing. Establish the responsible authority, period and current custodian through the state archives or agency. New York's A0597 clemency files, for example, can contain petitions from prisoners and relatives; Utah's Series 328 pardon applications can include court and biographical material. Record an application, recommendation and actual grant or denial separately. A petition does not show that clemency or parole was granted. [S17], [S52]\n- **Federal pardon or commutation:** search federal pardon applications separately in **NARA RG 204, Office of the Pardon Attorney**. Its historical guide describes pardon case files for 1853–1963, dockets and indexes, with some indexes retained by the pardon office. Use the particular series' current catalogue entry to establish custody, coverage and access before requesting a file. Do not assume the prison's NARA facility holds it, or that an application establishes a pardon. [S18]\n- Record in the request log: agency, form, date sent, date answered, file number quoted, documents supplied (death certificate, kinship proof), whether you gave consent or accepted redaction, and what you actually received (extract, redacted copy or full file).\n- Death status matters for access. Note whether the inmate is dead, how long ago, and whether the children are living [S2].","sources":["S58","S54","S2","S4","S49","S17","S52","S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0908b9db8953","kind":"method","anchor":"Use the series descriptions to record what survives for Sing Sing and how it can be searched [S49].","sources":["S49"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-71dbfe7d1f7e","kind":"unclassified","anchor":"Use this branch for a Victorian person described as having *no fixed abode* or recorded through a criminal-justice or welfare encounter. Keep the household census search open through [UK census interpretation](uk-census-and-1939-register-interpretation.md), including the actual institution and open-air-return coverage for the census year. Do not infer exclusion from all pre-1911 censuses. GenealCymru's historical account motivates the newspaper, prisoner-calendar, police and workhouse leads below [S8]; it does not verify a person's identity or a complete life history.","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-928fe0c65104","kind":"unclassified","anchor":"1. From a newspaper report or police-register entry, retain the literal name and aliases, occupation, stated age or birthplace, incident date and place, named court, prison and institution. Search supported name forms in the local press, including Welsh-language papers for Welsh cases. Keep reported arrest, accusation, trial, sentence and request for relief as separate events; a report that someone asked for admission does not establish admission.\n2. Use the named court and trial year to select a relevant prisoner calendar; use the named prison and date to seek its register. The National Archives describes calendars for assizes and quarter sessions and notes that prisoner records are divided between national, prison and local archives [S9]. Check each series' actual court, year and institutional coverage before searching. Copy the calendar's court/date and any references into the court-file queue; retain the calendar and retrieved proceeding separately. A calendar is not the person's whole criminal history.\n3. Treat a constabulary register or police return as its own series. Establish the responsible force, period, custodian and fields actually indexed; a census-night police return is a different target from a criminal register. Follow any named court or institution with its recorded date, rather than assuming every police record implies conviction.\n4. For a reported workhouse encounter after 1834, identify the dated poor-law union through [English and Welsh nonregister routing](english-nonregister-record-recovery.md#1-build-the-dated-jurisdiction-table-before-choosing-a-series). Seek surviving admission/discharge records at the local or county archive [S10]. Keep a refusal or relief request distinct from an inmate entry. Central poor-law correspondence can mention exceptional individual cases, but does not replace the workhouse's everyday records [S10]. If another institution is named, establish its own custodian and surviving admission series separately.","sources":["S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f28bc8831b56","kind":"unclassified","anchor":"**Return:** one incident-to-record chain, retaining each source's date, descriptors, procedural stage, selected custodian/series, retrieved locator and result. Compare those fields before linking appearances, preserve conflicting namesakes, and quote punitive labels as the record's descriptions. Report missing or uninspected series explicitly; neither an institutional record nor its absence supplies a complete account of the person's life.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d196f759f418","kind":"method","anchor":"Use this branch when a Swedish prison-roll name index leaves the court, proceeding date or next destination unclear. Open the original monthly return sent to *Justitiekanslern* and read the procedural and movement columns omitted from the index [S7].","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5c9922152990","kind":"unclassified","anchor":"1. Open the linked original roll image and retain the prison, return month/year,\n   archive, volume, printed page and image locator. Read the whole entry across its\n   columns and any continuation. Copy the literal name and abbreviation, occupation,\n   stated origin and custody details; leave an uncertain expansion unresolved.\n   Check the actual index and volume's date and institution coverage before treating\n   a miss as informative. The demonstration's index counts and coverage are historical.\n2. Separate the dates and roles before choosing the next record. Keep the roll's\n   reporting month apart from admission, release, hearing, order and transport dates.\n   Copy each action's wording and status: awaiting a decision, undergoing proceedings,\n   ordered to leave and reported sent are different observations. An offence label or\n   pending proceeding does not establish conviction or the final outcome. [S7]\n3. Build a separate retrieval target for each authority or destination actually named,\n   using the routing rows below. Identify its historical jurisdiction, surviving series\n   and current custodian before requesting records. Preserve the roll reference beside\n   each target so a failed lookup does not erase the original lead.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f910a7f3b011","kind":"unclassified","anchor":"| Annotation in the inspected roll | Next retrieval target and limit |\n| --- | --- |\n| Named court, proceeding date and action | Locate that court's relevant minute or case series for the stated date/term; compare the retrieved entry's person and procedural stage. A hearing court or higher-court decision still awaited is not automatically a court of conviction. |\n| Governor's office or other administrative authority | Preserve the authority, locality, date and action actually attributed to it. Ask its custodian whether corresponding interrogation or administrative papers survive. A release or passport statement alone does not show that an interrogation file exists or that the governor personally questioned the prisoner. |\n| Onward transport, destination and date | Retain whether transport was ordered or reported as carried out. Follow the named receiving court or institution for the bounded destination/date question; request a cited transport document separately when a reference or finding aid identifies one. Do not invent a receiving prison from a court-district name. |","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-229ab3668e25","kind":"method","anchor":"A September 1826 return in the ArkivDigital demonstration records a proceeding and a later dispatch by extra prisoner transport to another court district [S7]. Follow each dated event in the corresponding court. A dispatch entry alone does not establish the receiving institution, arrival or verdict.","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fa2d1c79d259","kind":"unclassified","anchor":"1. Compare other monthly hits only as candidate observations. Record the literal name,\n   descriptors, institution and event dates for each, then test a proposed connection\n   against those fields and the retrieved court or administrative record. The presenter\n   explicitly warns that repeated hits for the same name need not be one person [S7].\n   Retain conflicting or insufficiently identified rows separately; the reporting month\n   alone neither dates a new imprisonment nor proves continuous custody between returns.\n2. Add each followed reference to the existing routing row and request log. Record the\n   source annotation, exact court/authority/destination, dated action, target series,\n   requested item, retrieved locator and comparison result. Distinguish an inspected\n   no-hit from an unsearched month, unindexed field, unavailable volume or unlocated\n   administrative/transport paper. Pass identity and conflict rulings to the evidence\n   workflow, preserving both the allegation and the procedural stage.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-489059cf3502","kind":"unclassified","anchor":"Use this branch for a Swede in police contact between 1878 and 1950. Search ArkivDigital's *Polisunderrättelser* (police gazette) name register, indexed for 1878–1950, by name and its variants [S11], [S12]. Check each hit's birth date against the person.","sources":["S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35852e663949","kind":"method","anchor":"- Open each hit's page image. Record the year, issue number, section and the literal entry. The sections are A (wanted persons), B (detained persons and cancelled notices), C (miscellaneous notices), D (released prisoners) and E (stolen and lost property) [S13].\n- Follow every back-reference in the remarks column to an earlier volume and section by hand, even where ArkivDigital has linked it; it links them only as far as possible [S12]. For a reference such as 1907 issue 104, section D1 [S11], open that year, issue and section and record the earlier entry as a separate observation.\n- Do not treat the register's hit list as complete. Indexing errors and name variants can hide appearances that the back-references reveal. Log each one found only by following a reference.\n- A gazette entry is a lead to the trying court, not proof of conviction. Add the named court, conviction date or prison to the routing row.","sources":["S13","S12","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-acc7d7d3e1e0","kind":"unclassified","anchor":"Use this branch when an identified Swedish proceeding has an incomplete *dombok* entry.\nRetain the court, year, term, paragraph and inspected page/image extent from the actual\nrecord. A missing conclusion in one volume does not establish the case's outcome. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9c6ec0a3dddc","kind":"unclassified","anchor":"1. Compare the book's pagination and text with the image sequence. Record whether the gap\n   appears to be an omitted image, a missing leaf or an uncertain continuation. Inspect the\n   available volume for displaced continuations before describing the original as lost;\n   consecutive viewer images do not establish consecutive surviving leaves.\n2. Ask the custodian whether a matching *renovation* (a court-book copy sent to the\n   *hovrätt*) survives. ArkivDigital points to the appellate court's *advokatfiskal* archive\n   for this route, while warning that a copy may be unavailable for a late-nineteenth-century\n   case. Establish the appropriate appellate authority and its actual court/year coverage\n   before requesting a volume; the suggested archive name is not a surviving-copy locator.\n3. If a docket, judgment or other inspected record establishes an appeal, retain its higher\n   authority and case reference, and request that separate file. Look for transmitted copies\n   of the lower court's papers and protocols. Follow a further appeal only when the records\n   supply that link; an incomplete trial entry alone does not establish any appeal.\n4. Inventory each recovered copy separately from the incomplete book. Compare the case,\n   dates, paragraph and surviving overlap before using it to fill the gap; preserve differences\n   and any missing ending. A copied judgment is not the missing original leaf. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd24c924d818","kind":"method","anchor":"- An inmate-list miss describes the list searched. A researcher reported that an Alcatraz list omitted Irving Wexler although his death certificate placed him there [S3]. The Bureau of Prisons’ released notorious-offenders list names Irving Wexler with identifiers 49345-I and 62691 and identifies NARA as the permanent custodian [S54]. Keep those identifiers with the separate file search.\n- Write a conflict list: each list or index searched with its scope, and each item of contrary evidence (death certificate, newspaper report, census line). If a list misses the person while such evidence places them in the institution, search the next series whose documented coverage could include them: for a federal inmate, the institution's series at other branches, and the notorious-offenders series (RG 129, College Park) only when the inmate was a prominent offender of the kind it covers, as Wexler was [S3]. Name the next series or branch to search.","sources":["S3","S54"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dd47237e973f","kind":"method","anchor":"- From a convict description, keep each field literally: name as written, alias field, age at admission, birthplace, occupation, parents living or dead, age when the inmate left home, religion, literacy, prior imprisonment, and nearest relative with residence [S4].\n- Mark every field as given by the inmate or an unknown informant. Birth year is calculated from admission age, so record it as a range.\n- A ticked alias box with no alias written means the recorded name may itself be an alias [S4].\n- Use the named relative, the relative’s stated residence and the inmate’s birthplace to search the previous generation in that place [S4]. Confirm the suggested relationship in an independent record. For the Idaho example, consult the Idaho State Archives’ inmate files and convict descriptions (AR 42/2).","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ce0caa2e62e2","kind":"unclassified","anchor":"- the jurisdiction-and-custodian routing row\n- the request log\n- the surviving-series inventory with each series' status\n- the conflict list on whether the person was held\n- the admission-field lead table, with the informant marked for every field\n- when monthly Swedish rolls are used, the dated annotation-to-record chain, with unresolved identities and transport targets kept separate","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1b23ca312629","kind":"unclassified","anchor":"Name the next custodian, series or on-site check for every open gap.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3ffaff7e2eed","kind":"custody","anchor":"When the charge was too serious for quarter sessions, look for the trial at the assizes [S19 @2026-11-12]. The National Archives files assize records by circuit, each with its own ASSI series, from 1559 for England and from 1831 for Wales; take the county's series from its guide's county appendix for the trial year, not from a fixed circuit list, because the six circuits of the period up to 1876 were later regrouped [S20 @2026-11-12]. Cheshire joined the assizes only in 1830, and Durham and Lancashire in 1876: search their earlier trials in the palatinate court records, and Welsh trials of 1543–1830 in the National Library of Wales's Crime and Punishment database [S20 @2026-11-12]. Start with the crown and gaol books for the charge, plea, verdict and sentence. Expect depositions to survive mainly for capital cases such as murder and riot, and expect to use the originals at Kew or order copies, because the assize records are not online [S20 @2026-11-12]. Look for London and Middlesex trials at the Old Bailey instead: from 1834, as the Central Criminal Court, its records are in TNA's CRIM series, and the earlier London and Middlesex sessions records are at the London Archives [S21 @2026-11-12]. An entry in Ancestry's criminal registers gives the court and trial date to follow; it is not the assize record (see [the convict transportation chain](convict-transportation-record-chain.md)).","sources":["S19","S20","S21"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f7c1c205e390","kind":"custody","anchor":"**Federal pardons outside RG 204's case files:** RG 204's pardon case files begin in 1853. From 1789 to 1853 the Secretary of State and the Attorney General shared responsibility for exercising the President's pardon power, and the State Department issued pardon warrants until 1893. Search the State Department's pardon files, 1789–1893, in RG 59, and RG 204's abstracts of State Department pardon cases, 1793–1853. Applications for amnesty, Civil War and later, are in RG 94 [S18 @2026-11-13].","sources":["S18"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-abcb00b7fc3b","kind":"method","anchor":"A man missing from his family's household in a census is also a trigger: he may have been in prison that year [S22]. Look for him in that census's enumeration of institutions, where the institution's name heads the return; not everyone listed there as an inmate was a prisoner, because orphanages and hospitals also listed inmates [S23]. If he was imprisoned, search the county court records for a divorce filed during or after the sentence [S22]: early in the 20th century, imprisonment was a legal ground for divorce in 39 of the 49 U.S. divorce jurisdictions [S24]. Use [court case-file recovery](court-case-file-recovery.md) for that file.","sources":["S22","S23","S24"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-79ac98a6b8ac","kind":"historical","anchor":"**Read “no bill” as the grand jury’s refusal to indict on that bill.** A grand jury could return a true bill on one count or defendant and ignore another [S28]. A history counts 1811 Monaghan no-bills as acquittals despite the absence of a trial verdict [S29]. Read the finding for each charge and defendant. The notation alone gives no reason for it, including whether witnesses were unwilling to testify [S27].","sources":["S28","S29","S27"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3e1ce55db4d5","kind":"method","anchor":"**Distinguish an execution order from evidence it was carried out.** Search the newspapers following the order, then read the issue date on the page or masthead [S26]. The account of Sarah Kirk’s 1787 Delaware case cites the *Delaware Gazette* of 19 December, indexed as 9 December [S25]. Record the issue date separately from the date reported for the event.","sources":["S26","S25"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1ef61f120c50","kind":"portal-availability","anchor":"For a trial at the Old Bailey up to 1913, search the Old Bailey Proceedings Online by the names of victims and witnesses as well as defendants. It is a full-text edition of the published accounts of trials at London's central criminal court from 1674 to 1913, with names, occupations, places and dates tagged [S34 @2026-11-14]. Extract stated kinship, addresses and occupations for victims and witnesses as well as defendants [S30 @2026-11-14]. The accounts are not verbatim transcripts: before the 1720s they hold little testimony, until the early 19th century they leave some testimony out, and the 19th-century accounts, though fuller, omit sexual details, particularly in rape and sodomy trials [S34 @2026-11-14]. Cite a quoted statement as the published account's wording, not as a transcript of what the witness said.","sources":["S34","S30"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2a64f28c270e","kind":"method","anchor":"Search newspapers for notices about men who absconded. In the *Poor Law Unions’ Gazette*, look for descriptions of men whose families were chargeable to the union. Compare identifying marks, occupation, suspected whereabouts and companions [S35], [S30]. Repeated advertisements may refer to the same disappearance.","sources":["S35","S30"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-82b0731cb0b8","kind":"example","anchor":"Also search the *Illustrated Police News* (1864–1938), including the digitised examples described by Findmypast and an independent researcher [S36], [S37], [S30]. Use its reports and illustrations as leads to the original court proceedings.","sources":["S36","S37","S30"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-88b53b52364f","kind":"custody","anchor":"To find a prosecution of a man for sex with another man, search The National Archives' Discovery catalogue by the period's charge words, adding a name, county or court. TNA lists among them sodomy, buggery, gross indecency, indecency, importuning, soliciting, unnatural act and unnatural offences [S39 @2026-11-14]. Quarter sessions records are held in local archives: search \"quarter sessions\" with the county and choose the \"Other archives\" filter [S40 @2026-11-14]. Expect the records to concern men: female homosexuality was never explicitly criminalised, so lesbian relationships are generally absent from criminal records [S39 @2026-11-14]. Many 20th-century criminal records at TNA are still closed under the Data Protection Act; you can ask for a Freedom of Information review of a closed record [S39 @2026-11-14].","sources":["S39","S40"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b3640cb30743","kind":"method","anchor":"Read such a record as a record of a charge. An indictment names the accused and the offence, and depositions record the evidence; trial transcripts are very rare [S39]. A charge does not establish a relationship between men accused together, or either man's sexual orientation. A reported Kent quarter sessions certificate names two accused men but leaves their relationship unresolved [S38]. Treat the record as a sensitive finding. Keep a possibly living person's name and charge in the user's private research notes, and never publish or share them (privacy gate and Living people, in `SKILL.md`).","sources":["S39","S38"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0d86404da9a0","kind":"custody","anchor":"**Read \"detained during His Majesty's pleasure\" as an indefinite term.** The sentence sets no release date; under a queen, such as Victoria, the wording is \"Her Majesty's pleasure\" [S31 @2026-11-14]. Under the Criminal Lunatics Act 1800, a person found insane at the time of the offence was kept in custody \"until His Majesty's pleasure shall be known\" [S32 @2026-11-14]; today the sentence is used most often for juveniles, such as a person under 18 convicted of murder [S31 @2026-11-14]. For a person held as insane, look for the asylum rather than a prison release: TNA's guide points to HO 20 (1820–1843), HO 8 (1862–1875), HO 144 (1869–1941) and HO 145 (1882–1921) for criminals confined at Broadmoor and Bethlem after being certified insane at court or after imprisonment [S33 @2026-11-14].","sources":["S31","S32","S33"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-70c57b7d8239","kind":"portal-availability","anchor":"Search MyHeritage's *Australia, New South Wales, Gaol Inmates & Photos, 1870–1930* for an inmate held in New South Wales. It draws on photographic description books from several gaols [S42 @2026-11-18]. Check the individual gaol's coverage before drawing conclusions from a miss [S43 @2026-11-18]. Treat a hit as evidence of a gaol record and require separate evidence of transportation [S41 @2026-11-18].","sources":["S42","S43","S41"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9ae46c12f8e8","kind":"method","anchor":"Read the full card for the gaol and prisoner or portrait number, birthplace, recorded birth date or year, occupation, physical description and convictions [S41], [S42], [S44]. Establish identity from the written identifiers and corroborating records. Never use facial resemblance as identity evidence.","sources":["S41","S42","S44"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6bc70627e4ff","kind":"method","anchor":"If the convictions field cites a previous report, record the earlier count with that reference and list each conviction itemized on the card separately. Keep the earlier convictions unresolved until you recover the earlier report or the individual conviction records [S41], [S44].","sources":["S41","S44"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03286c7a1d21","kind":"historical","anchor":"In the education field, transcribe `R & W` as written and record its meaning separately as the gaol's statement that the inmate could read and write [S41], [S45].","sources":["S41","S45"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e3c51c75681b","kind":"method","anchor":"In the marks or special features field, transcribe the wording of tattoos, including personal names. Keep a name as a lead in the private notes and require separate evidence of the relationship [S41], [S46].","sources":["S41","S46"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8b893bd9b2b9","kind":"method","anchor":"**Check:** In the reported Arjeplog search, consecutive photographs did not settle whether the book lacked leaves; the presenter suggested checking for an appellate copy [S6]. Establish the survival of that copy, the existence of any appeal and its outcome from the corresponding records. This branch does not identify a civil or military authority for an\nunlocated death inquiry, or establish criminality from a death or prison reference.","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-29eb6aeab316","kind":"portal-availability","anchor":"- The New York State Library lists the Ancestry collection *New York, U.S., Sing Sing Prison Admission Registers, 1865–1939* [S14 @2026-11-19]. The provider’s listing was partially read [S48 @2026-11-19]. The partnership offers eligible New York residents access with a free account [S47 @2026-11-19]. Check your subscription or library’s access if using another route.","sources":["S14","S48","S47"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b4b762829ca4","kind":"method","anchor":"- Start with the approximate period and check available **name indexes before requiring a date or inmate number**. Verify the result on the B0143 register image. For foreign-born prisoners, also search the Archives' name index to B0146 (1919–1944) for a date and consecutive number [S14], [S15].\n- For later volumes without a name index, obtain a conviction/admission date window or inmate number before chronological browsing or a staff search. The 1940 census can supply prisoner numbers [S49]. Record the register, years and pages checked. A miss in the earlier online index does not cover later admissions [S14], [S15].\n- Check the basis for confinement in the order or admission record. A prison could hold a debtor as well as a person convicted of an offence [S1].\n- Do not assume jurisdiction from the offence label either. The same conduct (for example, liquor selling) could be prosecuted under state or federal law. Take the jurisdiction from the court of conviction, not from the type of crime.","sources":["S14","S15","S49","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-19ea51a683b4","kind":"portal-availability","anchor":"- NARA’s digitisation-partner list identifies the online M1401 collection [S55 @2026-11-19]. FamilySearch provides a name index and cites Fold3 for the territorial case files [S56 @2026-11-19].","sources":["S55","S56"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-84be47445f26","kind":"method","anchor":"- For Utah’s First District, match the division to the case files: southern Series 1521 or northern Series 1529 [S50], [S51]. The register of unlawful-cohabitation actions, Series 28377, covers 1889–1891 and cannot contain an 1887 arrest [S16], [S51]. The inventory records a January 2025 loan to the Museum of Utah. Confirm where to request it before a visit [S51].\n- Trace arrest, charge or indictment, preliminary proceedings, trial or plea, sentence and place of confinement. Search for the court and prison files separately [S1].\n- Do not assume the prison was in the home state. A federal prisoner could be held in any federal prison with space [S1]. Alcatraz, for example, held federal inmates convicted across the country.\n- Write one routing row per lead: the court, its jurisdiction level, the evidence for that level, the current custodian of the court records, and the likely custodian of the prison records.","sources":["S50","S51","S16","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0f9271c14ac0","kind":"custody","anchor":"- The New York State Archives reports holding B0143 admission registers and no general inmate case files apart from files of some executed prisoners [S49 @2026-11-19]. Its B0145 series describes case files for inmates sentenced to electrocution, 1939–1963 [S57 @2026-11-19].","sources":["S49","S57"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7ab0176e9d6f","kind":"method","anchor":"- An archive’s statement about its holdings leaves destruction unresolved. Seek a disposal record before treating the presenter’s report of destroyed files as established [S3], [S49]. For an admission, check the indexes above before requesting a chronological search [S14], [S15].\n- B0145 describes warrants, investigations and reports on the execution and remains [S57]. A presenter also mentions visitor lists, family letters, photographs and last-meal requests. Check the individual file for those items [S3].\n- Record access by series, repository and date. Ask the holding office what is available and keep its written response [S3], [S4]. A restriction on one kind of record does not establish that the entire prison collection is closed.\n- Classify each series as **inspected**, **restricted**, **destroyed**, **not held by custodian**, **referred elsewhere** or **not yet asked**. A restricted, unheld or destroyed series does not mean \"no record\".\n- Check gaps in an index against the original cards. In a reported NYPD Bertillon-card search the index jumped from 14885 to 14889; the researcher sought an on-site check of the missing numbers [S5]. Compare the card’s arrest date and charge with contemporaneous newspaper coverage before linking it to a relative.","sources":["S3","S49","S14","S15","S57","S4","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8f7315432577","kind":"method","anchor":"If no mugshot turns up, read the prison admission register for a written physical description [S59]. For an early Sing Sing admission, check the B0143 register entry for height, complexion, hair and eye color, and other physical characteristics [S60]. Transcribe any recorded scars, tattoos and notes on teeth, and keep the admission date and register locator with the description [S61].","sources":["S59","S60","S61"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9ee7ee1e81a0","kind":"method","anchor":"**Ohio county jails, 1852–1855.** Browse the county returns in the Ohio Secretary of State’s jail-report compilation (ISBN 9781556131035) [S62], [S63]. For Belmont County, use Appendix C, p. 18, of the report for 1855 (printed 1856) for the return covering November 1, 1853, to November 1, 1854 [S64]. Check the county and the dates printed on the return before interpreting a miss. If the county or period is missing from the printed returns, check county jail registers and court records [S64].","sources":["S62","S63","S64"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cb2b454184ac","kind":"portal-availability","anchor":"**Indiana and Nebraska.** For an Indiana Department of Correction lead, search MyHeritage's *Indiana, Incarcerations* index (1850–1950). Copy the facility, offence, conviction date, arrival and discharge as separate fields [S72 @2026-11-22], [S73 @2026-11-22].","sources":["S72","S73"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e4e59307482e","kind":"portal-availability","anchor":"For a Nebraska lead from 1935 onward, search MyHeritage's *Nebraska, Incarcerations*. Keep sentence start, minimum and maximum term, earliest possible release, recorded official release and parole in separate fields. Leave actual release undated when the only date is the earliest possible release [S72 @2026-11-22], [S92 @2026-11-22]. Use the Nebraska State Historical Society's General Index to Inmates and Descriptive Record to Inmates (RG0086) to follow a gap. Its separate Prisoner Records Database covers only people who appeared before the Board of Pardons and Parole [S74 @2026-11-22].","sources":["S72","S92","S74"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a30089dc99e5","kind":"portal-availability","anchor":"**Scotland.** Search MyHeritage's *Scotland, Prison Registers* for the institution and date of custody, then copy the reported residence and birth year and place. Its 1791–1965 span covers selected prisons [S69 @2026-11-22], [S70 @2026-11-22]. For original images or a miss, compare the prison and admission year with Scotland's People's coverage and the National Records of Scotland holdings. For Perth in 1867–1879, HH21/47/1–4 covers people sentenced to penal servitude in convict prisons in southern England. Check the corresponding prison series before drawing a conclusion from a miss in these journals [S71 @2026-11-22].","sources":["S69","S70","S71"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4dd6c9bdb5e1","kind":"portal-availability","anchor":"**Middlesex and Westminster Sessions of the Peace.** Look up the defendant in the MyHeritage index described for 1836–1889. Copy the actual court, trial date and age, along with occupation, previous convictions, charge, verdict and sentence where recorded [S65 @2026-11-22], [S92 @2026-11-22]. The Westminster court sat through 1844. Middlesex Sessions of the Peace handled misdemeanours and some felonies. Use the calendar of indictments to find the session and indictment number for the sessions roll. Check the calendar type before treating an entry as a trial lead, since examinations and recognizances have their own calendars. Use MJ/SR for the Middlesex rolls and check MJ/SR and WJ/SR for Westminster [S66 @2026-11-22].","sources":["S65","S92","S66"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3ec6cca60355","kind":"portal-availability","anchor":"**Metropolitan Police Register of Habitual Criminals.** Search the register for repeat convictions, including leads after the published Old Bailey Proceedings end in 1913. MyHeritage describes coverage for 1881–1925 [S67 @2026-11-22], [S66 @2026-11-22], [S93 @2026-11-22]. Use the conviction date, place and offence to trace each earlier London case to its own court record. Search the Old Bailey Proceedings when the court and year fit. Compare aliases, birth details, prison and any physical description before linking. In MEPO 6, use the registers in pieces 1–46, arranged by weekly discharges, with indexes in pieces 11 and 24 [S67 @2026-11-22], [S68 @2026-11-22].","sources":["S67","S66","S93","S68"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dd439999f518","kind":"portal-availability","anchor":"**Quarterly returns of prisoners, 1824–1876.** Search the name index described by MyHeritage when the prison is unknown, then read the HO 8 return. The series includes hulks through 1861, convict prisons from 1848 and criminal lunatic asylums from 1862. Record the institution, return date and piece reference separately from the conviction place and date. Copy the recorded age or birth year and any explicit death date. For a miss, use the known institution or conviction period to locate the returns for that institution, and read across both pages [S75 @2026-11-22], [S76 @2026-11-22], [S77 @2026-11-22].","sources":["S75","S76","S77"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e7a4452f9d85","kind":"portal-availability","anchor":"For Sweden and places then under Swedish rule, including Finland, search ArkivDigital's *Fängelserullor* name index across prisons for monthly returns in 1750–1850. Use title or occupation, place and admission date to distinguish candidates before narrowing to one prison [S78 @2026-11-22], [S79 @2026-11-22].","sources":["S78","S79"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e955c1af8ea0","kind":"method","anchor":"Open *Justitiekanslern –1974, Huvudarkivet*, series EIIIcc (NAD SE/RA/1340101), by volume and Bild number or by AID. Check the prison and volume even where two references give the same year [S79], [S82].","sources":["S79","S82"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-85a0f3f77da2","kind":"method","anchor":"**Bridge a gap in the monthly returns.** Check the next surviving list for a carried-forward admission date, including across a year boundary. For Turku Castle when the 1761 returns are missing from the sequence, start with January 1762, EIIIcc:35, Bild 1810 (AID v567635.b1810). If the departure remarks are blank, keep the reason open and check subsequent months for return, a named court or a disposition [S80], [S81].","sources":["S80","S81"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fe22bf24eb95","kind":"method","anchor":"**Read the reason for each custody change.** Distinguish detention for a pending district-court case, detention after a verdict awaiting review, and detention awaiting implementation. Record liberty pending proceedings for each person separately from co-defendants still held. Check the margin when the body only says the prisoner awaits execution of sentence. The wording can mean carrying out a corporal penalty [S79], [S81]. Date an authorization to release from the cited letter and use the departure entry to date actual release. Where a departure accompanies a punishment, log the stated purpose and seek evidence that the punishment occurred. If the explanation explicitly records death, keep the date as a recorded death in custody [S79], [S80], [S81].","sources":["S79","S81","S80"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a2b368d616e3","kind":"example","anchor":"A reported Turku Castle case ended in death in custody after illness prevented a punishment that had been confirmed on appeal [S80].","sources":["S80"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-710befbc568e","kind":"method","anchor":"**Separate hearing trips, resumed transfers and arrival.** Follow each dated court trip to the court named for that hearing. If another court interrupts a planned transfer, look for the later departure. For a Turku-to-Viapori route, check renewed Turku custody, the Helsinki transit roll and entries or notices placing the person at Viapori. A documented escape from the fortress supports presence there. If a later remand and an intervening escape are documented but the escape point is unclear, keep both transit and the fortress open. Leave arrival unresolved on a Helsinki miss alone [S79], [S82].","sources":["S79","S82"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b3775943005c","kind":"method","anchor":"**Narrow an unnamed hearing district.** Compare the prisoner's departure and return dates for each trip. Look for another prisoner with both dates in common and for village or parish clues in admissions explicitly tied to the same case. Use these clues to choose which court terms to check first. A shared itinerary is a lead to jurisdiction [S81].","sources":["S81"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-23ca8b9f446d","kind":"method","anchor":"**Match people across entries.** Compare village or farm and occupation with the parish communion book, and test a switch from a farm name to a patronymic against the sequence of the same case. A blank criminal annotation in the parish book or a miss in the copied court minutes leaves the prison evidence in place. Keep an accompanying child's last mention and any changes in the number of children separate from the parent's movements. Leave the child's destination open where a transfer names only the parent [S81], [S83].","sources":["S81","S83"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d5613ec63c8d","kind":"method","anchor":"**Follow a hospital transfer.** Check later rolls for a documented return to custody. Look for the hospital's patient list in the press. The reported Turku lead points to *Inrikes Tidningar*, 10 March 1763. Log the hospital event, any reported condition and the return to prison with their own dates [S81], [S95].","sources":["S81","S95"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e24d5b04402f","kind":"method","anchor":"For a roll that cites a ruling, copy the authority and each decision date, including earlier rulings and uncertain dates. Retrieve the district-court ruling, the *hovrätt* decision and any recorded further review in order. If a referral to the king gives no outcome, carry that referral into the judicial-review search. For a fortress-court judgment, follow the royal confirmation or military higher court named in the roll. Keep each penalty, duration and ordered place alongside the corresponding decision [S79], [S82], [S83], [S84].","sources":["S79","S82","S83","S84"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-99814bd27576","kind":"method","anchor":"For eighteenth-century cases concerning alleged speech against the monarch, use the Riksarkivet finding aid term *kortregistret högmålsbrott*. Use the date on the card to locate *Nedre justitierevisionen, Högsta domstolen Prot* (NAD SE/RA/1311). Confirm the decision date in the record and retain the dated volume, Bild, printed page and AID. Request related *utslagshandlingar* separately by decision date and file number where given, especially for papers from the lower court [S84], [S85], [S86], [S87], [S97].","sources":["S84","S85","S86","S87","S97"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cdd5663a2deb","kind":"method","anchor":"Read through the vote to the adopted decision. If the king personally reviewed it again, record his ruling and stated grounds. Keep the appeal sentence, proposed review penalties and each adopted decision as distinct entries. A reported 1725 case replaced a death sentence at review with corporal punishment and lifelong fortress labour [S85], [S86], [S97].","sources":["S85","S86","S97"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ea3992deaa27","kind":"method","anchor":"For a Stockholm city-prison lead, look for the monthly prison list in *Dagligt Allehanda*. Record the month covered apart from the issue date, then use the reported occupation, grounds for detention and court referral to target the prison roll and court file. In the reported December 1769 case, the list ran on 11 January 1770. Use that issue as a starting point for the dated EIIIcc entries and court referral [S90], [S94].","sources":["S90","S94"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-515584645b6e","kind":"method","anchor":"If a passenger list in *Stockholms Weckoblad* also names the person, log the arrival date and lodging apart from the later arrest and prison admission. Establish which movement the custody record actually describes [S90], [S96].","sources":["S90","S96"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05bbd4858247","kind":"portal-availability","anchor":"Check the title and issue against the digitised holdings list for *Svenska tidningar* before drawing conclusions from a search miss [S91 @2026-11-22].","sources":["S91"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e11d3709c31e","kind":"portal-availability","anchor":"For Stockholm city-court cases, check the printed *Stockholms stads tänkeböcker* for the hearing year. Stockholmskällan links selected editions including 1601–1603, 1616–1617 and 1629. Record the edition and page, then use the date and court to locate the original where needed [S88 @2026-11-22], [S89 @2026-11-22].","sources":["S88","S89"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f96a36062424","kind":"method","anchor":"**Kuopio provincial prison.** If other records omit the terms of imprisonment, check the prison parish's own *rippikirja* (communion book) in series I Aa for the custody period. Extract the recorded offence, sentencing date, authority and duration, then use those details to find the decision [S100], [S101].","sources":["S100","S101"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a650df9b278e","kind":"method","anchor":"If an account points to a separately printed Swedish judgment, search national library catalogues by issuing court or commission, decision year and *dom* (judgment). Use the printed judgment as its own target, alongside the archival case file [S98], [S99].","sources":["S98","S99"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-montana-prison-description-sheets","kind":"portal-availability","anchor":"**Montana.** Use the Montana History Portal when an older reference names the *Montana Memory Project* [S102 @2026-11-23], [S104 @2026-11-23]. Search the portal's *Montana State Prison Records* collection by name [S103 @2026-11-23]. Start with the digitized 1910–1955 description sheets. Open the sheet to check for a mug shot and, in post-1932 records, an accompanying FBI arrest sheet [S105 @2026-11-23]. For a miss or an earlier or later year, check the prisoner records in the Montana Historical Society's RS-197 finding aid [S106 @2026-11-23].","sources":["S102","S104","S103","S105","S106"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-turku-provision-accounts","kind":"portal-availability","anchor":"**Check Turku Castle provision accounts.** When a Chancellor of Justice return omits the person or gives only a patronymic, look for the same period in Astia under *Turun ja Porin läänin tilejä* [S107 @2026-11-23], [S108 @2026-11-23]. For 1765, start at the reported reference KA 7634:2105. Copy any village as written, leave a missing village unresolved, and log a ration entry under its own date and wording [S107 @2026-11-23].","sources":["S107","S108"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-turku-provision-accounts-omission","kind":"example","anchor":"In one reported Turku Castle comparison, the provincial accounts named a recipient of prisoners' rations who was absent from the Chancellor of Justice returns [S107].","sources":["S107"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-finnish-notice-to-renovated-minutes","kind":"portal-availability","anchor":"If a seventeenth- or eighteenth-century wanted notice names the trying court and judgment date, use the court and year to locate its renovated *tuomiokirjat* (court-book copies) in the National Archives of Finland's Astia catalogue. Browse the volume to the judgment date. For the Rauma lead, start with the Rauma town court's copied minutes for 29 January 1774 [S109 @2026-11-23], [S110 @2026-11-23].","sources":["S109","S110"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rauma-wanted-notice-patronymics","kind":"example","anchor":"Compare given names, any shared patronymic and the court, date and offence across the notice and the minutes. Keep a candidate whose surname drops out if those details support a match. In the reported Rauma comparison, the wanted notice supplied surnames while the copied minutes identified both men by given name and patronymic [S109].","sources":["S109"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dahlstrom-complaint-index-miss","kind":"method","anchor":"Keep a Turku complaint open after a miss in Dahlström's card index, which was compiled chiefly from the magistrate's and town court's minutes [S112]. Follow the named court and year in the notice. For the reported 1796 bigamy complaint, check the Turku and Pori proclamation dated 14 September 1796 (binding 2994943) and follow the lead to the Turku *kämneerinoikeus* [S111].","sources":["S112","S111"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-finnish-stocks-decree-publication","kind":"historical","anchor":"Find the Finnish text of the 15 May 1848 abolition provisions in *Suometar*, no. 23, 9 June 1848, under *Jalkapuun-rangastuksen lakkaaminen Suomessa* [S113], [S114].","sources":["S113","S114"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-stocks-replacement-scope","kind":"historical","anchor":"If a case once punishable by stocks falls under the decree, trace the applicable replacement measure in the parish or secular proceedings. For earlier stocks sentences, assess seriousness from the recorded offence. The decree describes earlier provisions prescribing the stocks for some minor faults, transgressions and omissions [S114], [S115].","sources":["S114","S115"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-stocks-parish-discipline","kind":"historical","anchor":"**Parish discipline.** Look for a formal warning before the church council and record any fine prescribed for the offence alongside it. For a more serious offence that could set a bad example, look for the accompanying church announcement. Extract the person's name, the brief statement of the offence and the confirmation that the formal warning was given [S114], [S115].","sources":["S114","S115"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-stocks-child-cursing","kind":"historical","anchor":"**A child's cursing in a secular judgment.** Read *Pahanteon kaari*, chapter 3, § 2, paragraph 1 for the prescribed discipline by a parent or guardian according to the child's age and misconduct. Apply that route even to the repeated cursing described in paragraph 2 [S114], [S115].","sources":["S114","S115"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-stocks-fishing-place-fine","kind":"historical","anchor":"**Petty theft at a fishing place.** For a fine imposed under the Harbour Regulations of 24 January 1771, check whether distraint found insufficient means to pay. If it did, trace the conversion to imprisonment under the general law's rules for petty-theft fines. Look for the prison entry to establish actual custody [S114], [S115].","sources":["S114","S115"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-stocks-secular-proclamation","kind":"historical","anchor":"**Church proclamation of a secular judgment.** Identify the underlying court and judgment before interpreting a church announcement. For either secular case above, or where stocks formerly accompanied another penalty or stood in for church punishment for an adherent of another faith, the decree prescribed proclamation in the relevant parish church after the judgment became final and the punishment was carried out. Use the proclamation date to bound both events and look to the court and enforcement records for their exact dates [S114], [S115].","sources":["S114","S115"],"checked":null,"stated_as":"fact","review":"reviewed"}
