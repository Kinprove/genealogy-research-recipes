claims:
  - {"id":"C-myheritage-online-parent-relationships-01","kind":"platform-ui","anchor":"Open More → Manage parents from the child’s profile. On the tree card, +1 and +2 count additional parent sets. Select the badge to open the manager and read the assigned type for each set, including either adoptive or foster for a dashed line [S1 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-online-parent-relationships-02","kind":"platform-ui","anchor":"For a temporary view, select Show in tree on the required parent card. To make adoptive parents the default display, use the Settings cog, open Other options and enable Display adoptive parents by default. Confirm the setting in the user’s tree before relying on the display [S1 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-online-parent-relationships-03","kind":"platform-ui","anchor":"Add a parent set from Manage parents → Add more parents, select its documented type and enter the known name or names. Leave an unknown second card empty and select Done [S1 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-online-parent-relationships-04","kind":"platform-ui","anchor":"Correct the assigned parent type with the dropdown above the parent cards and select Done. If the chosen type already belonged to another set, reopen the manager and check every affected set for automatic reassignment [S1 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-online-parent-relationships-05","kind":"platform-ui","anchor":"Link an existing parent profile from the child’s profile panel via More → Connect to an existing person → Connect to a parent. Pick the intended profile and select OK. Reopen Manage parents to confirm the assigned type and affected sets [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
