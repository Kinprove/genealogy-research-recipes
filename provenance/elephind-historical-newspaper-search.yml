claims:
  - {"id":"C-03","kind":"portal-availability","anchor":"Check Elephind’s Newspaper Collections list for the title or the participating collection. If the title is outside the list, seek it through a different host. A search miss is bounded by the titles, issues, filters and queries you checked [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"Choose **Keyword Search** for a known term or distinctive name. Choose **Smart Search** for an event or subject that may appear under different period vocabulary. Phrase the topic as a question or in modern words, rephrase if needed, and try literal period terms from promising articles. Filter by publication, collection or date to inspect one bounded set at a time [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Follow a result to the contributing library or archive. Check the issue and the printed article before drawing a conclusion, and cite the host's issue, date and page [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
