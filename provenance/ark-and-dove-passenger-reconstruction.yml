claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter’s advice, use the Russells’ compilation to identify the relevant part and follow the record references behind a passenger or descent claim. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Use Part One of *The Ark and the Dove Adventurers* for Lord Baltimore’s family. Use Part Two for passengers with families and documented descendant treatments. Check Part Three before accepting a tradition, especially one about a later settler or a passenger with no known descendants. The publisher identifies the roster as reconstructed from other records. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"portal-availability","anchor":"Read the cited original colonial court and assembly records, then check the original county’s land, probate and church material for the identity and link in question. Use the Society’s adventurer citations and the Maryland State Archives’ *Early Settlers* entries as locators. Record exactly what the underlying document says about the voyage or arrival. A later land or probate record can establish early presence and still leave the vessel unresolved. [S2 @2026-11-18], [S3 @2026-11-18], [S4 @2026-11-18]","sources":["S2","S3","S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
