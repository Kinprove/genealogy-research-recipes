claims:
  - {"id":"C-66feb7445e26","kind":"unclassified","anchor":"- **Why soldier names exist, men who kept them, intervening regimental rolls, *underhåll* referrals and *rusthållare* fees:** [patronymic, farm and soldier names](scandinavian-patronymic-farm-name-record-recovery.md).\n- **Following the household and the moving registers:** [Swedish parish record recovery](scandinavian-parish-record-recovery.md).\n- **Identity rulings:** [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1796acd7181c","kind":"method","anchor":"- **Branch and recruitment.** The title fixes the branch, and the titles are not interchangeable: *soldat* is infantry, *ryttare* cavalry, and *dragon*, *husar* and *artillerist* name their own regiment types [S8]. *Båtsman* is navy. Between 1682 and 1901 a regiment was either allotted (*indelt*: the soldier was kept by a *rote* of farms, usually with a croft) or enlisted (*värvat*: paid recruits garrisoned in towns or fortresses) [S21]. Decide by residence: a soldier who served while living in a country parish was allotted, and enlisted units were garrisoned in towns and fortresses [S21]. For an allotted man, look up his parish in Riksarkivet's Indelningsverket (Grill) database to get his company, regiment and *rote* [S19], [S21]. Grill was published in the 1850s, so for a regiment divided before then, such as the Närke-Värmland regiment, map the parish to the older unit separately [S21].\n- **Rank class.** Private or corporal; NCO (for example *rustmästare*, *furir*, *sergeant*, *fältväbel*); or officer. The series differ by rank class (steps 2 and 6).\n- **Period.**\n  - Before 1683: the army rolls of 1620-1723 (step 4).\n  - Main general-muster period, 1683-1883: check the regiment's dated rolls (steps 2 and 3).\n  - 1884-1901: check for late general musters under the specific regiment and year, then use the regiment's own rolls, including *stamrullor* (steps 2 and 3).\n  - Conscripts 1812-1901 (*beväring*) and 1902 onward: enrolment records and cards (step 7).","sources":["S8","S21","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c3a4951593c6","kind":"portal-availability","anchor":"| Index or archive | What it covers | A miss there does not cover |\n| --- | --- | --- |\n| ArkivDigital name index to the general muster rolls (*generalmönsterrullor*) | The October 2024 catalogue gives the Krigsarkivet series 1683-1883, 4.4 million records [S17 @2026-11-16]; from the inspected excerpt of each video transcript, the presenters describe army regiments, both allotted and enlisted, from privates to officers, and the Finnish regiments until 1809 [S5 @2026-11-16], [S9 @2026-11-16], [S4 @2026-11-16], [S8 @2026-11-16] | From the inspected excerpt of each video transcript: rolls kept in regimental archives, including the rolls between musters and those after 1883 [S5 @2026-11-16], [S13 @2026-11-16]; the navy [S14 @2026-11-16] |\n| Centrala soldatregistret (soldatreg.se), run from Axvall | About 500,000 records of allotted soldiers [S23 @2026-11-16]; men enrolled 1682-1901, privates, corporals and *båtsmän*, no NCOs or officers, only a few enlisted units, and not complete [S22 @2026-11-16] | Most enlisted units, NCOs, officers; from the inspected excerpt of each video transcript, corporals are in scope but often missing, so a corporal's miss is not a negative [S2 @2026-11-16], and this is a separate database from ArkivDigital's: search both [S4 @2026-11-16] |\n| ArkivDigital index to conscription cards (*värnpliktskort*, *stamkort*) | The October 2024 catalogue describes men enrolled 1902-1950, born 1881-1930, about 2.4 million cards [S17 @2026-11-16] | Men enrolled before 1902; from the inspected excerpt of each video transcript, whole companies and regiments of cards are missing [S5 @2026-11-16], [S6 @2026-11-16] |\n| Riksarkivet archive: *Värnpliktskort. Stamkort och läkarhandlingar, avregistrerad* | The October 2026 copy of its military guide lists conscripts born about 1888-1921, from enrolment to discharge; search Riksarkivet by that title [S19 @2026-11-16] | Other birth years |\n| ArkivDigital boatswain active list | The October 2024 catalogue describes per-man *båtsman* books of the late 1800s, more than 4,600 men born 1816-1877 [S17 @2026-11-16] | Earlier *båtsmän*, other navy rolls (step 8) |","sources":["S17","S5","S9","S4","S8","S13","S14","S23","S22","S2","S6","S19"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1c2571b6dcc0","kind":"method","anchor":"- **Use each general muster as a dated snapshot.** Check the regiment’s own interim rolls and commanders’ papers for detachments, punishments or deaths between musters [S20], [S9], [S5].\n- **Narrow the search by regiment.** Start with the given and soldier names, then add the regiment [S2]. Try abbreviated given names (*J:*, *J.*) and alternative spellings [S8]. Early rolls commonly give age and province. A birth parish or exact date can exclude the right entry, particularly before the rolls became more detailed around 1850 [S20], [S13].\n- **Search the *rote* or farm name to list everyone who served it** [S11]. This gives you the succession of soldiers for that number, which step 5 needs.\n- **Record the predecessor’s discharge, the replacement’s hiring and his formal approval separately.** At Sunnerbo company no. 120, the roll dates Peter Lind’s discharge to June 1838 and Salomon Trofast’s hiring to November. Trofast was approved at the 1841 muster [S2].\n- **Read the remarks and any enclosures.** Copy the exact wording for campaigns, wounds, absence abroad or discharge for conduct [S20], [S9], [S11]. A former civil name can identify the man [S4]. Look for a priest’s certificate pasted into the roll to explain an absence [S16] and for a pension amount in the appended list of *gratialister* [S2].\n- **Before 1860, trace an absent soldier to the place of burial.** A parish recorded burials in its own church or churchyard, and could omit a resident buried elsewhere [S31]. In a reported 1808 death the home-parish search failed and the burial place remained unknown [S10]. Read the muster remarks for illness abroad or capture [S9], [S12]. A detachment for canal or lock construction can point to another parish’s burial book [S5], [S9]. If the place is unclear, check the regiment’s or company commander’s notes [S10].\n- **From 1860, search the home parish's death register first.** From 1860 a death was to be entered in the parish where the man was last registered, and also in the parish of burial if that was another parish [S31].\n- **Identify the copy you searched.** The War Office, county governor and regimental commander received copies. A fourth was divided among company commanders [S20]. The name index in the ArkivDigital demonstration used the War Office copy. A miss leaves other copies to check [S5].\n- **After the last general muster for the regiment.** For the transition to 1901, look in the regiment’s records for *stamrullor*, introduced at enlisted regiments in 1885 and allotted regiments in 1889 [S20], [S33].","sources":["S20","S9","S5","S2","S8","S13","S11","S4","S16","S31","S10","S12","S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2f0dba2aa115","kind":"portal-availability","anchor":"**War years: also search *Rullor 1724–*.** Besides the rolls of 1620-1723, Riksarkivet's Arméns rullor database has the series *Rullor 1724–*: rolls of Swedish army units from 1724 to about 1865. Riksarkivet says this series holds almost the same information as the general muster rolls. Those are often incomplete in war years, so this series is often the only place to find a man, especially in the war of 1808-1809. Search it by regiment and year before you read a war-year gap as a negative. [S34 @2026-11-13]","sources":["S34"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a257d7524451","kind":"unclassified","anchor":"- The army rolls of 1620-1723 (*Rullor 1620-1723*) are the main source for the period, with large gaps [S20]. Riksarkivet offers them as the Arméns rullor database [S19]. Open the volumes for the year itself before you call a war year lost: volumes survive for 1709, for example SE/KrA/0022/1709/8 [S32]. For officers, open the series' personnel register first [S2].\n- For losses and prisoners in the Great Northern War (1700-1721), search ArkivDigital for the Defensionskommissionen archive (rolls sent home from the field) and for the war-document collections titled *Krigshandlingar ... Stora nordiska kriget*, which include prisoners. There is no name index: you need the regiment and the period [S1].","sources":["S20","S19","S32","S2","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d52cc1dc5acb","kind":"method","anchor":"- **Follow the holders of a name by *rote* and date.** A soldier name could stay with the croft or *rote* [S29]. Two consecutive roll entries can therefore name different men identically. Use the discharge and replacement entries to separate their service, then establish any family relationship from other records [S6], [S5].\n- **Search the pension and parish records under the soldier name and the patronymic.** A discharged man could resume his patronymic, including in the pension ledger [S29], [S18].\n- **Separate the holders by dates, not by name.** For each roll entry under a soldier name and number, record the age, the province of birth, and the approval and discharge dates. A roll that gives a former civil name (*förut kallad*, \"formerly called\") links the soldier name to the man [S4].\n- **Search court records beyond the home *rote*.** A witness to a fire at Åhus identified himself in court as the soldier for Vittaryd. Compare that place with the roll when a soldier name appears far from home [S12].","sources":["S29","S6","S5","S18","S4","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c677365590d1","kind":"method","anchor":"- **Officers and NCOs are in the general muster rolls.** Regimental officers are listed at the start of the roll and company officers at the start of their company [S20], [S9].\n- **Army pension fund (Arméns pensionskassa), 1757-1937.** Officers, NCOs and civilian military staff paid into it [S18]. Before 1757 their pensions came from the Vadstena krigsmanshuskassa, which from then on served only privates and corporals [S18].\n  - Officers and NCOs sent merit records (*meritförteckningar*: appointments, promotions, detachments, training) to the fund throughout their service. They are bound as *meritband* in series EV [S18].\n  - Read the first submission for an age certificate or parents’ names and the last for the career up to that date [S18]. A pastor’s certificate accompanying a 1771 submission identifies the member’s birth in Saxony in 1714. Use the certificate’s locality to find the corresponding parish entry [S7].\n  - ArkivDigital’s October 2024 catalogue lists merit books for 1757–1883 [S17]. For 1884–1895, use the fund’s person register, which covers 1757–1895. For 1896–1937, consult the finding aid for Arméns pensionskassa at Krigsarkivet and check the surviving series EV volumes by date [S18].\n  - Pension decisions: series C III (1757-1783) and D (1784-1914). Pension applications: series E II, with a person register for each year [S18].\n- **Other merit series.** Krigsarkivet also has a collection of army officers' merit records [S19], and regiments kept their own series [S1], [S3]. Navy officers' merit lists are a separate series [S17].\n- **Printed and inspection sources.**\n  - For officers under Charles XII, look up the officer alphabetically in Adam Lewenhaupt’s *Karl XII:s officerare* [S30]. For another person named in his biography, including a wife, consult the Riddarhuset card index [S3].\n  - Regimental histories carry biographies of regimental officers (major and above) [S1].\n  - Look up inspections (*husesyn*) of officers’ and NCOs’ official farms (*boställen*) by holder in the typed register, then read the inspection at the change of occupant to date the handover [S7], [S9].\n- **After 1885** the *stamrulla* replaced the general muster rolls for officers and NCOs. From 1945 the *tjänstekort* (service record card) replaced it [S20].","sources":["S20","S9","S18","S7","S17","S19","S1","S3","S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e56d4ed997b8","kind":"method","anchor":"- **Before 1902.** Conscripts (*beväring*) were enrolled from 1812. From 1885 the three-part number in the parish book records the serial number, roll-keeping area and enrolment year. Use it to identify the enrolment roll [S25]. ArkivDigital’s October 2024 catalogue dates the conscription-card index to 1902–1950 [S17].\n- **Find the card by name and birth date.** Clerks wrote the enrolment number in several forms, so an exact-number search can miss [S2], [S6]. Copy it from the parish book’s *värnplikt* or remarks column and use it to identify the roll-keeping area and year [S4], [S24]. Enrolment was at 21, or at 20 from 1914 [S17]. The personal identity number replaced the enrolment number in 1953 [S25].\n- **The card moved with him.** Cards were introduced in 1918, replacing the *stamrulla*, and earlier service was copied onto them [S24]. When he moved to another enrolment area, his card was sent there. It was archived in the area where he lived when his liability ended (age 40 under the 1901 law, rising to 47 from 1942), or when he died, emigrated or was exempted [S24]. Look for an unindexed card in the area of his last residence, not the area of his birth. The cards are spread over many archive creators [S17].\n- **Read both sides.** The front gives regiment codes (I 6, I 7 and so on), companies, training periods and days served. The back can record punishments, exemptions, and permission to leave the country [S2], [S4], [S6]. For where a company was stationed, go to the regiment's archive [S2].\n- **Separate permission, travel and service abroad.** A Swedish draftee needed leave to go to Finland in 1939–1940 [S27]. Copy the card’s wording for permission to leave Sweden or a recorded stay in Spain, then seek a dated unit entry for service [S1], [S2]. One volunteer registered in Sweden but the war ended before he left, so searching field rolls alone missed the enlistment [S1].\n  - The Winter War corps was the Svenska frivilligkåren, and the Finland Committee (*Finlandskommittén*) ran its enlistment [S27].\n  - *Svenska brigaden* was the volunteer unit of the 1918 Finnish Civil War [S28]. Do not file a 1939-1940 volunteer under it.\n  - Search the archive creators by their names. *Frivilliga i Finland, Finlandskommittén* covers the 1939–1940 recruitment and *Svenska brigaden i Finland* the 1918 brigade [S3].","sources":["S25","S17","S2","S6","S4","S24","S27","S1","S28","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2ef82a1f9318","kind":"unclassified","anchor":"- **Navy rolls are not in the army general-muster index** [S8], [S14]. Search the navy series: *Rullor flottan* 1635-1915, which includes the navy general muster rolls [S26], [S17].\n- **Each *båtsman* company belonged to a naval station**, and the rolls are arranged by station: Karlskrona (series IV) or Stockholm (series XIIIc). A Norrland company, for example Medelpad's, is filed under Stockholm [S26]. Search the station's series, not the home province [S26], [S15].\n- **Late 1800s:** per-man *båtsmansrullor* (books) exist; use the ArkivDigital boatswain list to find them [S17], [S26].\n- **Pensions:** *båtsmän* and navy officers and NCOs all belonged to the navy pension fund (Flottans pensionskassa), 1642-1937 [S18].\n- **A *sjöman* on a merchant ship is a civilian.** He is in the seamen's house (*sjömanshus*) records, not the *båtsman* rolls [S3], [S15].","sources":["S8","S14","S26","S17","S15","S18","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-223681d624df","kind":"method","anchor":"- Surviving general muster rolls of enlisted regiments cover those garrisoned in Sweden, Finland or Swedish Pomerania [S20]. Open the roll image for a former surname, birth date and parish. The entry for a hussar recruited in 1880 gives his former name as Christian Johansson and his birthplace as Sövde, enough to check the parish register [S4].\n- Do not compute a birth year from an enlisted roll's age. Recruits older than about 20-23 were not normally accepted, which gave older men a reason to state a lower age [S20]. Take the birth year from the baptism or household entry.\n- **Contracts.** Search the National Archival Database (NAD) under the regiment’s archive for enlistment and soldier contracts, including those of Skåne regiments [S1], [S15]. If the inventory lists none, record the regiment, years and series examined.\n- For a recruit thought to have enlisted between 1912 and 1920, seek the conscription or service card. If the regiment is unknown, follow the man through parish books. A residence entry on regimental grounds may identify the regiment and company [S3].","sources":["S20","S4","S1","S15","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-87defce53849","kind":"unclassified","anchor":"- **Classification row:** branch, allotted or enlisted, rank class and period, each with the entry that supports it; parallel rows where uncertain.\n- **Series rows:** for each search, the index or series, its coverage, the fields searched, the locator (regiment, company, number, year, volume and page, or card archive), and the status: *found*, *not found within coverage*, *outside coverage*, *not indexed (browse needed)* or *not listed in NAD*.\n- **Soldier-name table:** each roll entry under the name and number, with age, province of birth, approval and discharge dates, and the man you assign it to.\n- **Officer file:** the *meritband* used, first and last merit record, any birth proof, and the pension series and decision references.\n- **Gaps:** years between musters, 1884-1901, lost cards, unindexed navy rolls and unphotographed regimental archives, each with its custodian.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-muster-index-unit-years","kind":"portal-availability","anchor":"**Check the exact regiment and muster year in the name index.** The October 2024 catalogue gives 1683–1883. ArkivDigital's 2023 completion notice gives 1660–1887 and lists individual years for nine Finnish regiments. Use the unit's year list before logging a miss, including at either edge of the catalogue range. If the year is missing from the list, browse the surviving rolls. [S17 @2026-11-22] [S36 @2026-11-22] [S37 @2026-11-22]","sources":["S17","S36","S37"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-muster-quick-find","kind":"platform-ui","anchor":"**Use Quick Find when you know the unit.** Open ArkivDigital's *Quick Find: General Muster Rolls* by regiment, year and company for allotted regiments within present-day Sweden. Use those hits as page locators. For a person's name, or for enlisted or pre-1809 Finnish regiments, start with the main name index and browse by regiment and year if needed. [S17 @2026-11-22] [S35 @2026-11-22]","sources":["S17","S35"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-browse-dated-musters","kind":"method","anchor":"**Browse surviving musters by regiment and year.** When a name search misses, use *Generalmönsterrullor*, Krigsarkivet finding list 23, to locate the regiment's volumes. Start at the known muster and work backward through the dated rolls. Use the rank to find the right part of the roll, and retain the volume and page for each hit. [S35] [S38] [S39]","sources":["S35","S38","S39"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-muster-event-dates","kind":"method","anchor":"**Date the event and the roll separately.** Read later rolls for an explicit appointment date in the rank you are tracing. In a reported name-card lookup, a skipped 1684 entry dated an officer's appointment to 1678. If an entry says only that he was married, use the muster date as an upper bound and leave the spouse's identity open until a record identifies her. [S38] [S39]","sources":["S38","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-early-roll-card-references","kind":"method","anchor":"**Follow every roll reference on the name card.** For officers and NCOs in *Rullor 1620–1723*, look up the surname alphabetically in *Registerkort över namn i rullorna (1620–1723)*. Open each cited entry, including years you already searched. If the name card is absent, use the regiment or regimental commander's register to locate the rolls. [S38] [S39]","sources":["S38","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-lewenhaupt-family-leads","kind":"method","anchor":"**Follow officers and their children across Lewenhaupt entries.** Copy the rank, regiment and entry or departure date where given, and record any approximate birthplace, parentage and dated list of children as separate leads. Look up a child who also served under the child's own name and verify those leads in the relevant rolls and parish books. [S37] [S39] [S40]","sources":["S37","S39","S40"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-wirilander-postings","kind":"method","anchor":"**Trace Finnish postings through official residences.** Use the surname index to Kaarlo Wirilander's *Suomen armeijan upseeristo ja aliupseeristo 1718–1810: Virkatalonhaltijain luettelot*. Follow the entries through each rank, regiment, parish and named *boställe*. Copy the start and end dates and any stated transfer or resignation. Use the date and regiment to locate the rolls, and the named property to locate the parish books. Record the appointment to the property and the household's residence separately. If Wirilander has no match, search the regiment's rolls under variants of the given names and keep each hit provisional until the entries link. [S37] [S41] [S42] [S43]","sources":["S37","S41","S42","S43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-officer-widow-grace-year","kind":"method","anchor":"**Follow a widow's grace-year grant back to the register.** In a Swedish-era Finnish case, use a dated citation from Yrjö Kotivuori's *Ylioppilasmatrikkeli 1640–1852* to identify the grant in the *valtakunnanregistratuura*. Retrieve the cited date and folio. Extract the widow's name and her late husband's name, rank and regiment where given, then use the unit to find his rolls. [S39] [S44]","sources":["S39","S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-garrison-company-notices","kind":"platform-ui","anchor":"**Check newspaper notices for departures from a garrisoned company.** In *Svenska tidningar*, select the newspaper title and search the relevant dates by garrison and the regiment's name at the time. Record each man's stated birthplace, age, departure date and reason where given. The transcribed Lovisa (Loviisa) notice in the 3 April 1776 issue of *Dagligt Allehanda* gives separate dates for deaths, removals at a muster and desertions. Use the event wording to choose the next record. [S45 @2026-11-22] [S47 @2026-11-22]","sources":["S45","S47"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-garrison-regiment-aliases","kind":"portal-availability","anchor":"**Check commander names against the unit's aliases.** For *Kongl. Skyttiska Regementet* in the Lovisa notice, look up HisKi entry 690 under *Jägerhornska regementet*. Use the successive names and dates there to search the rolls. Compare the date and garrison before accepting a match. [S45 @2026-11-22] [S46 @2026-11-22]","sources":["S45","S46"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-officer-title-after-discharge","kind":"method","anchor":"**Check a civil record's title against the last dated service evidence.** A reported 1731 court entry still styles one officer as an ensign of a commander's regiment, although a published account dates his discharge to 1722. Compare the unit and commander's tenure with the rolls. Keep conflicting discharge dates by source until the rolls resolve the discrepancy. [S48] [S49] [S50]","sources":["S48","S49","S50"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-retrospective-death-note","kind":"method","anchor":"**Check the next surviving muster for a death away from home.** Follow the soldier's entry to the next muster and copy any earlier death date and place into the event record. A reported 1775 Österbottens regemente entry dates a death at Sveaborg (Viapori) to 1773. Use the place in the remark to choose the burial register. [S51]","sources":["S51"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-finnish-childrens-book-unit","kind":"method","anchor":"**Look for the regiment in the Finnish children's book.** If a pre-1809 baptism calls the father an enlisted soldier and leaves the unit unstated, find the family in the parish's *lastenkirja* where one survives. Copy the regiment and the volume and page before searching the musters. Give the stated recruitment type precedence over the household's location. [S52] [S53] [S54]","sources":["S52","S53","S54"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-muster-departure-age","kind":"method","anchor":"**Compare the age column with the departure remark.** When the two give different ages for the same entry, log both with their fields and any stated dates. Carry both into the candidate comparison with the preceding or following muster and the parish evidence. In a reported 1782 search, the departure remark and age column in the same roll gave different ages. [S52]","sources":["S52"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-muster-neighbor-birthplace","kind":"method","anchor":"**Read the birthplace cells immediately above and below the candidate.** If the same birthplace repeats, keep the candidate's birthplace provisional and check it against another muster and the parish records before using it to exclude the man. In a reported 1804 Asikkala company muster, the neighboring entries repeated the province. [S52]","sources":["S52"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-finnish-veteran-notice","kind":"method","anchor":"**Use the 1858 survivors' notice for missing unit leads.** For a possible survivor of the 1808 campaign, consult *Sanan-Lennätin*, 30 July 1858, no. 30, under *Vanhoja soturia 1808 vuoden sodasta*. Record the reported unit, rank, residence, birth and enlistment dates, battles and wounds where given. Search the rolls under the reported unit and dates. Follow the notice's regional credits. Try *Helsingfors Tidningar* for Espoo, *Wasabladet* for the Vaasa area and *Suomen Julkisia Sanomia* for northern Savonia. Search by veteran and locality in issues up to the reprint date and compare the text before assigning the source. Preserve the stated speaker when comparing accounts. In the transcribed Iisalmi account, *niinkuin itse sanoo* identifies the veteran himself as the source for the reported Norway service. Test that lead in dated unit records. [S59] [S60] [S65] [S66] [S67]","sources":["S59","S60","S65","S66","S67"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-seamens-house-record-route","kind":"method","anchor":"**Choose the seamen's house from the parish registration.** Start with the district serving the seaman's parish at the time of enrolment. Check the house and the years of its surviving series in the regional archive guide. Copy the house, enrolment number, birthplace and parish of registration from the enrolment register (*inskrivningsregister*) where given. Follow its references to the signing-on and signing-off ledgers (*på- och avmönstringsliggare*) and the crew roll (*sjömansrulla*). Record the vessel and each signing date and port separately from the house enrolment. [S61] [S63] [S64]","sources":["S61","S63","S64"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-seamens-house-lead","kind":"portal-availability","anchor":"**Use the MyHeritage collection as a lead for a deceased merchant seaman.** The 2023 announcement for *Sweden, Sailors and Seamen’s House Enrollments* gives an overall span of 1752–1941 and labels the two record types *Tjänstematrikel* (enrolment register) and *Mönstringsliggare* (signing ledgers). Check access and the specific house and year in the user's account before interpreting a miss. Verify birth and residence details in the enrolment record and the ship, signing dates and ports in the ledgers or crew roll. [S61 @2026-11-23] [S62 @2026-11-23] [S64 @2026-11-23]","sources":["S61","S62","S64"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-enlisted-unit-aliases","kind":"method","anchor":"**Search Finnish enlisted units under their dated names.** Use the Finnish National Archives' Arkistojen Portti guide to match the name in the parish book to the unit's name at the muster date. For Adlercreutz's regiment before the 1804 name change, include *Uusi jääkärirykmentti* and *Suomalainen värvätty jalkaväkirykmentti*. Try *Adlercreutzka värvade regementet*, the Swedish heading in ArkivDigital's 2023 index announcement. Check the company and year in the roll before assigning the entry. [S52] [S55] [S56]","sources":["S52","S55","S56"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-garrison-communion-books","kind":"method","anchor":"**Check the garrison's communion books alongside civilian baptisms.** When a pre-1809 Finnish civilian baptism gives a military rank, use the likely posting to identify the military parish and check it for a household entry. At Viapori (Sveaborg), distinguish the fortress parish's 1796–1808 book from the Dowager Queen's Life Regiment's 1798–1808 book, *Viaporin seurakunnan arkisto*, I Aa:2. Record any dated communion entries separately from the civilian baptism. Leave the household's precise residence open when the books establish church affiliation or attendance alone. [S55] [S57] [S58]","sources":["S55","S57","S58"],"checked":null,"stated_as":"fact","review":"reviewed"}
