claims:
  - {"id":"C-c28523399395","kind":"method","anchor":"For a panorama, establish the camera position and direction of each frame before assigning names to buildings. Scan the horizon and outer edges at usable resolution. Carry a fixed landmark into any overlapping frame and compare which features appear to either side and in front of it [S3].","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6d6f0f41bebf","kind":"example","anchor":"Check a legible building number against a dated map or catalogue description, including numbers on structures at the edge. Start with Brander’s 1908 *Berga 13* record for the camera direction [S2]. Kyläkoski locates its number on the small white building at the right edge of the view [S1].","sources":["S2","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7ab2caa786b0","kind":"method","anchor":"Match two landmarks in the background to their mapped positions and check which candidate building falls along the resulting line of sight. Keep the match provisional if more than one candidate fits. For the rear Berga building, Kyläkoski tests Berga 14 using Strömsten 1 and Taipale 7 as background landmarks [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-37eee4997435","kind":"method","anchor":"Before treating a missing building as a date clue, plot the sightline from the camera to its site. Check the frame edge and intervening terrain, vegetation and structures. A hidden site supplies no evidence that its building was absent. Kyläkoski reports that a rock hides the largest Berga building in Brander’s National Museum tower view [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-244cbf7bd302","kind":"method","anchor":"When the view shows a structure the caption leaves unidentified, search the period street or site name in newspapers around the image date. Compare the reported location and use with what the photograph shows. Kyläkoski reads the frames in the Temppeliaukio photograph against the clothes-drying racks described in *Helsingin sanomat* on 22 July 1927 [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6ab19f197d64","kind":"method","anchor":"Use dated guides, planning histories and reports of changes to bound the visible state of an identified structure [S5], [S6]. Check whether an account describes construction, a conversion or completed demolition. For the Töölö pavilion, find its position on the walk and the occasion for its construction in *Helsinki ympäristöineen*, 1889, p. 81 [S7]. Read the construction and conversion account in Helsinki planning report 2013:2 and compare the pavilion photograph with Fig. 161 on p. 126 for the later view of the site [S6]. Check the replacement landscaping Kyläkoski cites from *Isänmaan ystävä* on 9 July 1897 for a latest bound on removal [S5].","sources":["S5","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
