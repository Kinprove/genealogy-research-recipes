claims:
  - {"id":"C-5363e5b76151","kind":"method","anchor":"Start with the date, route and historical place of issue. Record the traveler for a personal passport or the vessel and issuing port for a sea passport. If the issuer is uncertain, keep the provincial chancery and port magistrate as separate candidates [S1], [S2]. Use [historical place-name resolution](historical-place-name-resolution.md) for an uncertain place of issue.","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2e06a5e71346","kind":"example","anchor":"In the Helsinki magistrate’s *Päiväkirjat, passit 1756–1875*, browse past the opening private journeys to check for crew departures later in the volume, as Kyläkoski reports finding [S1]. Inspect the heading and named parties on the entry you use.","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ff561424e62b","kind":"custody","anchor":"For Kymenkartano, look under the provincial chancery’s incoming documents, series Ee *Passiasiakirjat* (1751–1831). Select the listed file by year and check the numbered and unnumbered papers. Look for passport slips, papers concerning travelers to Sweden on the governor-general’s passport and the separately grouped ship free letters. For passport diaries, check the separate series Bb *Passiluettelot* as well [S1 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09198b7c2e47","kind":"method","anchor":"If the passport search misses a stop along the route, check posting-inn or relay records under the provincial chancery’s transport files. For the Kymenkartano lead, use *Kulkuyhteyksiä ja kyytilaitosta koskevat asiakirjat* (1775–1831) as the unit locator. Record the dates of the journal you actually find [S1], [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-df9260ec9bbc","kind":"method","anchor":"Search lost-property notices for a missing travel passport. Browse general lists of lost belongings as well as notices warning against use of the document. Use the notice to identify the passport to seek and keep the notice date separate from evidence of travel [S1]. For the rest of the newspaper search, use [newspaper section search](historical-newspaper-section-search.md).","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c56a396a3001","kind":"method","anchor":"For a crew member, look for the issuing magistrate’s *meripassi* under the ship. Read the crew names, positions, wages, infractions and port calls where entered. For a completed voyage, look in the magistrate’s papers for a returned passport. Also check the magistrate’s and seamen’s office drafts and label the document form you found [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e4729ee64a1b","kind":"method","anchor":"Treat the surviving passports as sporadic. Record the port, ship, dates and record forms covered, and use [image coverage verification](archival-image-coverage-verification.md) to distinguish an uninspected or unscanned file from a completed search [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
