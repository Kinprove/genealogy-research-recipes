claims:
  - {"id":"C-3ccafba85f44","kind":"portal-availability","anchor":"Search the Arolsen Archives’ effects collection, DE ITS 1.2.9, for the prisoner. Check the item or its catalogue image and the status of any return. Try the name without a nationality filter when a restricted search fails [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e7481d7aad28","kind":"example","anchor":"The published restitution case describes a Belgian prisoner’s effects surfacing among records associated with Dutch prisoners. When a nationality-filtered search fails, also check the documented transfer destination for the effects [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09fbe941c08e","kind":"method","anchor":"Keep the surviving object, the camp’s property register entry and the ITS individual document envelope as separate records. The last is an archival wrapper for documents. Read the description and check whether it identifies belongings or describes paperwork [S2], [S4], [S6].","sources":["S2","S4","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9f0c192e72f3","kind":"method","anchor":"When the name on an effects envelope is hard to read, start from the birth date as written and cross-check it with the prisoner number, camp or other legible identifiers. Compare any signature or named papers with the detention records before attaching the item to a person [S1], [S3], [S4].","sources":["S1","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15cb84870af9","kind":"method","anchor":"For a return case, identify the captive’s family from documented relationships. If the person had no children, follow siblings’ descendants and other collateral branches using [descendancy gap worklists](descendancy-gap-worklist.md). Treat an online tree as a lead to historical evidence. Apply the [Living people rule](../SKILL.md#living-people) to any living relative [S1], [S3], [S5].","sources":["S1","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bc686f9e307c","kind":"portal-availability","anchor":"Contact the Arolsen Archives restitution team before starting a volunteer search on a specific item. If a family connection emerges, check it with the team before any approach to the family and let the team arrange the return. Use the consent and disclosure rules in [outreach staging](dna-match-outreach-staging.md) if contact with a living person is proposed [S3 @2026-11-22].","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
