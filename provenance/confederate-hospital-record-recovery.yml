sources:
  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=7v6-k4_4gtw"],"published":"2022-11-29","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the presenter’s advice to identify the hospital through the National Archives finding aids and search outside Record Group 109.","entry_sha256":"19b482c9920d3bfe887162b4e418efec097fe6e3e1a463f48143fc289010d6d2","claims":["C-01","C-03"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://www.archives.gov/research/guide-fed-records/groups/109.html"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the named finding aids and the inventory of hospital registers, case records and correspondence.","entry_sha256":"fdb6a6e9df90de13270ed2b9c1814fc147abc7948b05973f0f4cb1e149d8bf45","claims":["C-02","C-05"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://narations.blogs.archives.gov/?p=4937"],"published":"2011-04-22","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Agency archivist describes the service-file lead, hospital registers and uneven survival.","entry_sha256":"ef88091adae3d5b44250dfbd75d66042e9cb41c04a62f3307310b758c0521a54","claims":["C-02","C-04","C-05"],"review":"reviewed"}
  - {"id":"S4","kind":"pdf","urls":["https://nursing.virginia.edu/media/2007may_windows_in_time-.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the reference to Charlottesville’s two General Hospital volumes and their separately numbered index in Chapter VI.","entry_sha256":"0d192c401de3a2d22b187d95bac54baf9ca1b4a0cd54cc74e5ed61e65c0c5a32","claims":["C-04"],"review":"reviewed"}
  - {"id":"S5","kind":"catalogue","urls":["https://arvasarchive.org/catalog/viu_viu00031_c01_c02"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The Chancellor papers finding aid identifies a separately held surgical case book and its date span.","entry_sha256":"6aad6c0d7ba56694063f75f14bf211c187f17a40f12b927d8826fc2eae7a6f55","claims":["C-06"],"review":"reviewed"}
  - {"id":"S6","kind":"pdf","urls":["https://static1.squarespace.com/static/58092328579fb31efea7a49e/t/60fed23eccfca113fce7b2fd/1627312703003/RG_326.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Consulted the collection scope and container list for orders, correspondence, furloughs and discharges. Use the item description rather than attributing every volume in this collection to Charlottesville.","entry_sha256":"38948df62b0d4c2bcd6ab9f2ea985562a5dd19c8c32aae526af385228fe691db","claims":["C-06"],"review":"reviewed"}
  - {"id":"S7","kind":"video","urls":["https://www.youtube.com/watch?v=HIkfKnbnVCI"],"published":"2022-09-04","retrieved":"2026-11-21","access":"unknown","rights":null,"basis":"Attempted to open the video URL on 2026-11-21. The video and full transcript were unavailable through the web check. The supplied excerpt names Driver’s book and its Farmville Hospital death coverage.","entry_sha256":"f4ac876dfd9721a4eed02da20ce3845c08b74abf117a7558e0ab4498b36210a8","claims":["C-07"],"review":"reviewed"}
  - {"id":"S8","kind":"catalogue","urls":["https://heritagebooks.com/products/101-d2697"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read the publisher’s catalogue entry on 2026-11-21. The description identifies Driver’s volume by ISBN and distinguishes the county roster from the separate April 1862–April 1865 hospital death list. The book itself was not inspected.","entry_sha256":"68b0e195c2773c364677e04c9c0e4d3909f6aa29b718efa023466986052b07a4","claims":["C-07"],"review":"reviewed"}
  - {"id":"S9","kind":"video","urls":["https://www.youtube.com/watch?v=nQXmnfDfh9I"],"published":"2022-04-08","retrieved":"2026-11-22","access":"unknown","rights":null,"basis":"Attempted the video URL on 2026-11-22. Playback and the full transcript were unavailable through the web check. The supplied excerpts describe medical cards in service jackets, named transfer stops, hospital names, a name discrepancy between a service jacket and a published case, and apparent improvement followed by death. The presenter suggests searching the published volumes by name. The case identity and the specific NLM download options were not verified.","entry_sha256":"22d5fee2c0778aaaa24d95ec432628b5b89657f207095a27d2dcf9c6ced8b950","claims":["C-08"],"review":"reviewed"}
  - {"id":"S10","kind":"web-page","urls":["https://www.archives.gov/research/military/army/carded-medical-records"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The National Archives specifies that Confederate volunteer medical cards are filed with their compiled military service records.","entry_sha256":"0468c86286bddba1d144c618ec1cd98758f5f942a710f489df258f2dbec0b2d9","claims":["C-09"],"review":"reviewed"}
  - {"id":"S11","kind":"web-page","urls":["https://www.archives.gov/digitization/digitized-by-partners"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The list names Fold3 as a partner for Confederate service-record publications organized by state or organization. The list shows different digitization statuses by publication. Fold3 account access was not tested.","entry_sha256":"be9468327e90ba7b5d55c08342af15d9e56ee329b12c44b909971095064371a0","claims":["C-09"],"review":"reviewed"}
  - {"id":"S12","kind":"pdf","urls":["https://www.archives.gov/files/calendar/know-your-records/handouts-presentations/sharp-civil-war-medicine-presentation.pdf"],"published":"2015-06-03","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the Carded Medical Files slides on 2026-11-22. The reproduced Union medical cards illustrate how dated entries and remarks name a hospital steamer, a transfer origin and a destination. They demonstrate the record fields, independently of the Confederate example in S9.","entry_sha256":"b265369220f02c06cdbdb1cca9e3cf4bb92cb496fd6c6eff38530005904cca52","claims":["C-10"],"review":"reviewed"}
  - {"id":"S13","kind":"web-page","urls":["https://news.maryland.gov/dnr/2016/12/21/freedom-war/"],"published":"2016-12-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the Point Lookout section on 2026-11-22. It identifies Hammond General Hospital and locates the later Camp Hoffman prison north of the hospital grounds.","entry_sha256":"71bf906dec89ae52ad99cde0c8f7628d32aeeba438dc7f75d4020ffd42e41bed","claims":["C-11"],"review":"reviewed"}
  - {"id":"S14","kind":"web-page","urls":["https://civilwarrichmond.com/hospitals/general-hospitals/general-hospital-9/5602-1864-01-04-richmond-enquirer-list-of-hospitals-in-richmond-and-to-which-hospitals-soldiers-various-states-are-sent"],"published":"1864-01-04","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the Civil War Richmond transcription on 2026-11-22. The directory calls No. 9 the Receiving and Wayside Hospital and gives its street corner.","entry_sha256":"5bbd3278e11ea8e1d35f5c98968580eae520cbedcb35c954d926f0903445605a","claims":["C-12"],"review":"reviewed"}
  - {"id":"S15","kind":"web-page","urls":["https://www.civilwarrichmond.com/hospitals/general-hospitals/general-hospital-11/2971-1863-09-21-richmond-sentinel-list-of-hospitals-in-richmond-and-to-which-hospitals-soldiers-from-the-various-states-are-sent"],"published":"1863-09-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the Civil War Richmond transcription on 2026-11-22. The directory separately lists the Wayside Hospital as No. 12 and the Receiving Hospital as No. 9.","entry_sha256":"422dbc281fe8f6b1a83037afaeb28963587039b3c39ff3dad93b56b8dae8f9f1","claims":["C-12"],"review":"reviewed"}
  - {"id":"S16","kind":"video","urls":["https://www.youtube.com/watch?v=U9sPhj4q78k"],"published":"2022-04-18","retrieved":"2026-11-22","access":"unknown","rights":null,"basis":"Attempted the video URL on 2026-11-22. Playback and the full transcript were unavailable through the web check. The supplied excerpt recommends looking in Preliminary Inventory 101 for records of Union patients treated in Confederate hospitals.","entry_sha256":"b4c2b4890a61d5f8629af6713e03ad8cc4f90dfdc5762e6235ef0c4161321492","claims":["C-13"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://www.civilwarrichmond.com/written-accounts/archival-sources/national-archives/4305-national-archives-general-hospital-21"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the online transcription on 2026-11-22. It identifies RG 109, Chapter VI, Union patient registers by ward and date, and describes volume 162 as a copy of volume 165. The inventory volumes and original registers were not inspected.","entry_sha256":"5107d01efe024a1f948c65d61cac8c82da850c037fa0a3ba90b790ed5faefbd2","claims":["C-14"],"review":"reviewed"}
  - {"id":"S18","kind":"web-page","urls":["https://www.archives.gov/research/guide-fed-records/groups/249.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Section 249.3.2 lists the Danville prison hospital register for 1863–1865 under records relating to individual federal prisoners of war.","entry_sha256":"0072d7419789fd60070e9d5aa0813e200b12dd562993ecee0dc50d4014baee99","claims":["C-15"],"review":"reviewed"}
  - {"id":"S19","kind":"web-page","urls":["https://www.mcgill.ca/medicalmuseum/exhibits/warbones/amm/mshwr"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the exhibit page on 2026-11-22. Used its six separately labeled Internet Archive scan links and its examples of figures in the medical and surgical parts.","entry_sha256":"c775d4de010822bb922ba8e02a2e6ba34fef0f1add1fedf8e48d8ad35faf742d","claims":["C-16","C-18"],"review":"reviewed"}
  - {"id":"S20","kind":"web-page","urls":["https://civilwardc.org/texts/cases/about.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The University of Nebraska–Lincoln digital edition documents its use of the Internet Archive scans and OCR text, the organization of the original parts by illness and wound, and the editors’ selection of cases.","entry_sha256":"d256ce511db80b49f02698bdfbd054aeabccf40406239e46b75aec4f90892cbb","claims":["C-16"],"review":"reviewed"}
  - {"id":"S21","kind":"pdf","urls":["https://www.fold3.com/pdf/M270.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the introductory description on 2026-11-22. It identifies cross-reference cards for variant spellings and hospital and Union prison entries abstracted into service jackets.","entry_sha256":"0b7f897dc7ec162f44d69b276978e60abb67633e33af22dd46f67cff234f6915","claims":["C-17"],"review":"reviewed"}
  - {"id":"S22","kind":"web-page","urls":["https://civilwardc.org/texts/cases/med.d1e41360.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the Civil War Washington transcription on 2026-11-22. The case records the patient’s company and regiment, hospital, admission, treatment, apparent improvement on October 15, death on October 23, and autopsy. This independently documented case illustrates the same reading rule as the example discussed in S9.","entry_sha256":"3d4f9b83ffe697016072de1354f66ad6465502b1e1975b2a0c0e289950970422","claims":["C-17","C-18"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter, begin a Charlottesville search with the General Hospital and use the Confederate preliminary inventory and Beers’s guide to look for records by hospital. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"Check Elizabeth Bethel’s Preliminary Inventory 101 and Henry Putney Beers’s guide for hospital records listed under Record Group 109. Search the hospital name and the place. Use the dated service entry to narrow the likely register runs, then compare the runs with the gaps in surviving hospital records. [S2 @2026-11-18], [S3 @2026-11-18]","sources":["S2","S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"According to the presenter’s advice, use the General Hospital patient index and the two register volumes for a named Charlottesville admission. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"custody","anchor":"For Charlottesville General Hospital, use the separate patient index in Chapter VI, volume 216, and follow its entry into the register volumes 214 and 215. Record the admission entry with its own volume and page. [S3 @2026-11-18], [S4 @2026-11-18]","sources":["S3","S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"When opening a hospital’s records, distinguish a patient register from case accounts or statistical returns. A name search in a statistical return supplies no named patient coverage. Use a dated register entry to tie treatment to a patient and a unit. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"custody","anchor":"Alongside the Charlottesville register, check the James Edgar Chancellor papers at the University of Virginia for the 1862–1863 surgical cases. For Louisiana State Museum leads, check RG 326 at item level for surviving furlough, discharge and orders material for the relevant hospital. Keep these series separate when recording which dates and patients you searched. [S5 @2026-11-18], [S6 @2026-11-18]","sources":["S5","S6"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Robert J. Driver Jr.’s Prince Edward County volume covers Farmville Hospital deaths, according to the presenter’s book roundup. [S7†] For a death at Farmville General Hospital from April 1862 through April 1865, look up the name in the volume’s separate hospital death list (ISBN 9780788426971). Check the death list even if the county soldiers’ roster has no entry for the patient. [S8]","sources":["S7","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"According to the presenter, the medical cards in the service jacket can supply separate stops along a soldier’s treatment route. [S9†]","sources":["S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"Look for Confederate volunteer medical cards inside the full compiled military service record (CMSR) jacket. Use the National Archives digitization list to identify the microfilm publication for the soldier’s state or organization, then follow a listed Fold3 or other provider link if available. Read every medical card, including any grouped in an inner envelope. [S10 @2026-11-22], [S11 @2026-11-22]","sources":["S10","S11"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"Put the dated entries in event order. Log the origin, destination and record locator for each transfer, including any transfer point, hospital steamer or prison named in the file. Use the next recorded admission to check where the patient went after a stop in transit. [S12]","sources":["S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"historical","anchor":"For a transfer to the general hospital at Point Lookout, Maryland, search under Hammond General Hospital. For a bare Point Lookout entry, use the dated record to distinguish the hospital from the nearby Camp Hoffman prison. [S13]","sources":["S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"historical","anchor":"For a Richmond entry naming the Receiving and Wayside Hospital, check General Hospital No. 9 at 17th and Grace streets, listed under both names in January 1864. For a bare Wayside entry, check the date and address before assigning a hospital number. The September 1863 Richmond directory lists Wayside Hospital as No. 12 and Receiving Hospital as No. 9. [S14], [S15]","sources":["S14","S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"According to the presenter’s advice, check the Confederate inventory when a Union soldier was treated at a Confederate hospital. [S16†]","sources":["S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-14","kind":"custody","anchor":"For a Union patient, search by treating hospital in Chapter VI of Preliminary Inventory 101 (RG 109). At Richmond General Hospital No. 21, check the Union patient registers by ward and date. The Ward D register for 1863–1865 is listed in volume 165 and its copy in volume 162. [S17 @2026-11-22]","sources":["S17"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"custody","anchor":"For a Union prisoner, also check RG 249, Records of the Commissary General of Prisoners. Use its Danville prison hospital register for a Danville admission in 1863–1865. [S18 @2026-11-22]","sources":["S18"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"portal-availability","anchor":"For a wound or illness, open the six-part scan list for *The Medical and Surgical History of the War of the Rebellion* at McGill’s Maude Abbott Medical Museum. Search a local copy of the OCR text for the soldier’s name in each relevant part. If the text search misses, browse the chapter for the disease or wound location. Limit any negative finding to the published cases and parts you searched. [S19 @2026-11-22], [S20 @2026-11-22]","sources":["S19","S20"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-17","kind":"method","anchor":"Carry alternate initials and surname spellings from any CMSR cross-reference card into the published-case search. Compare the case’s company, regiment, hospital and admission date with the service file before accepting a variant-name match. [S21], [S22]","sources":["S21","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-18","kind":"method","anchor":"Record the part, volume, printed page and case number. Read through the treatment, later dated entries, any autopsy and any cited illustration. Record the final disposition the case gives. In Part II, Volume I, case 443 records apparent improvement on 15 October 1863 and death on 23 October (p. 188). [S19], [S22]","sources":["S19","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
