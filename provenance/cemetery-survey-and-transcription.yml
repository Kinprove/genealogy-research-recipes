sources:
  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=DFDdgEbrMYk"],"published":"2025-10-03","retrieved":"2026-11-22","access":"snippet-only","rights":null,"basis":"Reviewed 2026-11-22 (video, snippet-only). The video page could not be opened. The available interview excerpt covers natural rows, monument numbering, matching audio to the map, indexing, deposit and later updates. The Texas Historical Commission guide independently supports the map and identifier workflow.","entry_sha256":"b09c5ea4a7b73ac24f7d90f6b3924b2fd49d9554579ae0b3bd6c07484eb6b4d5","claims":["C-0aed2a8bd050","C-6f0ce877dc5f","C-6114581acd18"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://thc.texas.gov/preserve/preservation-programs/cemetery-preservation/what-you-can-do"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reviewed 2026-11-22 (help-page, read). Cemetery survey instructions for permanent landmarks, systematic row coverage, control numbers and survey records.","entry_sha256":"ee45dc9e9fb0ade9035a3746b792aada1564f433be2732509d9869e4088e8fe2","claims":["C-b1fd852f7137","C-0e9d6c970a78","C-6114581acd18"],"review":"reviewed"}
claims:
  - {"id":"C-b1fd852f7137","kind":"method","anchor":"Sketch the boundaries, access paths and fixed landmarks. Divide the site into recognizable sections and rows. Choose a starting corner and record the direction of each pass. Assign each physical marker a unique identifier even if it names several people. Put that identifier on the sketch, transcription and image labels [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0aed2a8bd050","kind":"method","anchor":"According to the available interview excerpt, label both ends of a row with its first and last monument numbers and speak the same marker identifier into any audio recording [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0e9d6c970a78","kind":"method","anchor":"Check each completed row against the sketch and labelled photos before leaving the section. Record inaccessible ground and illegible markers as separate limits on coverage [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6f0ce877dc5f","kind":"method","anchor":"According to the available interview excerpt, compare a resurvey with the previous version to account for new, broken or missing stones [S1†]. Carry a vanished marker forward under the earlier survey’s date and locator. Give any new inspection date its own status so the old text is never mistaken for a new reading.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6114581acd18","kind":"method","anchor":"Index the names to marker identifiers and redraw the finished map with the same labels and a north arrow. Spot-check that a second person can use the map to locate a sampled marker [S2]. According to the available interview excerpt, Gorr usually gives the finished survey to a local genealogy society or library [S1†]. If the user chooses to deposit the finished survey with a local genealogy society or library, confirm that it accepts the material.","sources":["S2","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
