sources:
  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=cScq6NGXsw0"],"published":"2022-02-03","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the presenter’s advice on family-paper folders, flat storage, isolating newsprint, album enclosures and cushioning folded textiles.","entry_sha256":"5ff37555d1852be97918cb63dd0d481b51da69b58db3d7f653ccaaa14f57d0c4","claims":["C-01","C-04","C-08"],"review":"reviewed"}
  - {"id":"S2","kind":"video","urls":["https://www.youtube.com/watch?v=yFTJ_vF6x3E"],"published":"2024-01-14","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the interview’s advice on storing, handling and repairing family Bibles and bound albums.","entry_sha256":"90dab6f43e03ad78c5139b3ddcde8e372ea4bff11beb9098bcda0722033338b0","claims":["C-06"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.archives.gov/preservation/family-archives/storing"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-18. Archival enclosure sizing, flat and rolled storage, sleeves and protection of albums. Rechecked 2026-11-20 for shelving away from damp basements and garages, and for the formats and packaging discussed under cold storage.","entry_sha256":"5beab580f05e5d4c9a37d9eefd2fecac20fc28cd2b187f42696c96c1363895f1","claims":["C-02","C-03","C-05","C-10","C-11"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://www.archives.gov/preservation/holdings-maintenance/newspaper.html"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Separate flat housing for newsprint and copying where content matters more than the artifact.","entry_sha256":"b25e15caee614fe15b110a3bc62d0684765d7f11c389073546a5f425c2ae8b7f","claims":["C-03"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://ask.loc.gov/preservation/faq/422212"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Enclosure standards and distinctions between types of prints, slides and film negatives.","entry_sha256":"4b9f50c208422eb57313fa39f7032b45e9cfcfe991d66e13ef12da84acaf644b","claims":["C-05"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://guides.loc.gov/preserving-your-books/handling"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Staff guidance for removing a book from a shelf with support at mid-spine.","entry_sha256":"526ee622f5bf3b542fde0d3b293f16c74d56be9033ff04bd861ad1b99e4da14a","claims":["C-07"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://guides.loc.gov/preserving-your-books/storing"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Staff guidance on boxes, stable conditions, upright storage and exceptions for fragile and oversized books.","entry_sha256":"12e99500d5f31e929afd360903c88d97b856e066a94f4ff4b742c0b0be363e0c","claims":["C-07"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://guides.loc.gov/preserving-your-books/repairing"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Staff guidance on boxing fragile books and qualified conservation treatment.","entry_sha256":"0b4d847408daece4484f1c21beab38ebc7099397c2baa8f131b5069066433416","claims":["C-07"],"review":"reviewed"}
  - {"id":"S9","kind":"pdf","urls":["https://nmaahc.si.edu/sites/default/files/2022-05/family_treasures_toolkit_individuals_20220520.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Museum staff guidance for boxing textiles and supporting folds with unbuffered acid-free tissue.","entry_sha256":"07c56ff21aac713e420a080386efa762ceaa0666a63068b8caac12dc4cb247d4","claims":["C-09"],"review":"reviewed"}
  - {"id":"S10","kind":"web-page","urls":["https://familytreemagazine.com/photos/a-guide-to-photography-for-genealogy-research-and-projects/"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The author advises dry, stable storage and clean hands for albums, suggests gloves and card stock, and warns against using heat or other home methods to remove a photograph stuck to glass.","entry_sha256":"e839902cc0be6aa7aef1727da73493e285e78a4ce9433800d2361b687f563e05","claims":["C-10","C-12","C-13","C-14"],"review":"reviewed"}
  - {"id":"S11","kind":"web-page","urls":["https://www.loc.gov/preservation/care/photo.html"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Preservation staff guidance on cool, relatively dry, stable conditions, lower temperatures for color photographs and film negatives, and handling by the edges.","entry_sha256":"24d88091a247fe4c63d8ad87cbd6d96ea3d2205e71cd3f7f0201959bbc9664fd","claims":["C-10","C-13"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://www.archives.gov/preservation/holdings-maintenance/general-guidance.html"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Preservation staff recommend interior closets above ground and specify acid-free, lignin-free paper and the Photographic Activity Test for materials used to house photographs.","entry_sha256":"2edb58248ca1f0c3869f20000c4c9b90f7ac1afe5cf8dd9ca1339d91d1f42e6e","claims":["C-11","C-12"],"review":"reviewed"}
  - {"id":"S13","kind":"web-page","urls":["https://familytreemagazine.com/strategies/genealogy-crimes/"],"published":null,"retrieved":"2026-11-20","access":"snippet-only","rights":null,"basis":"The publisher returned HTTP 403 on 2026-11-20. The search extract showed the interior-room and off-floor advice. The supplied excerpt is the basis for attributing the advice to move papers before scanning.","entry_sha256":"8010b420e929c575ffadc9085cd2274dfd40eb1efeef667258f16394ff6647b0","claims":["C-11"],"review":"reviewed"}
  - {"id":"S14","kind":"web-page","urls":["https://loc.gov/preservation/about/faqs/photographs.html"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-20. Preservation staff advise well-fitting gloves when handling photographs and film and explain the risk of serious damage when detaching photographs stuck to glass. Rechecked 2026-11-21. The album and marking guidance recommends photo corners or stable sleeves and specifies permanent pens that pass the Photographic Activity Test for marking plastic sleeves.","entry_sha256":"73dc1e6c853a6f64439ab853d3095675f03371e3d1de09af4522f8bbec5ab704","claims":["C-13","C-14","C-19"],"review":"reviewed"}
  - {"id":"S15","kind":"web-page","urls":["https://www.archives.gov/preservation/family-archives/handling.html"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Preservation staff distinguish bare-handed handling of paper with freshly washed hands from gloved handling of photographs and negatives.","entry_sha256":"baf2ad1007b2ebbd7fdfe901cb809442c8e6e682c4f379445b53c9875c09363e","claims":["C-13"],"review":"reviewed"}
  - {"id":"S16","kind":"web-page","urls":["https://blog.myheritage.com/2023/08/7-reasons-you-need-the-reimagine-app/"],"published":"2023-08-22","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The author advises displaying scanned photographs and storing the original album where it will be handled less often.","entry_sha256":"24c0356f4af0e8912500949a620d9e82cb2490cd38d151dc5346c74a64f9c08f","claims":["C-15"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://www.archives.gov/preservation/family-archives/displaying"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Preservation staff recommend displaying copies made from scans and keeping the originals boxed to limit light exposure.","entry_sha256":"794b0278492e57d55caed1075c29a91a52bd3bdc764ac425301a00e513002b05","claims":["C-15"],"review":"reviewed"}
  - {"id":"S18","kind":"web-page","urls":["https://familytreemagazine.com/projects/scraps-of-history-scrapbooking-family-history/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Morton advises using copies, checking scrapbook materials beyond the archival label and keeping unedited files. She cautions that inexpensive prints may fade or shift in color.","entry_sha256":"b3f6a232d1f09bf08bda77943c7c0b80e27a4781e16485d99b41552df88de274","claims":["C-19","C-20"],"review":"reviewed"}
  - {"id":"S19","kind":"pdf","urls":["https://www.archives.gov/files/calendar/genealogy-fair/2021-05-04-handout.pdf"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The handout recommends stable plastic sleeves and photo corners, identifies the Photographic Activity Test as a selection criterion, and advises avoiding self-stick pages and damaging adhesives.","entry_sha256":"92afa2eaebd023f53aa5cdc62571f288ccce438c25d59a6780665b0837d2913c","claims":["C-19"],"review":"reviewed"}
  - {"id":"S20","kind":"pdf","urls":["https://www.loc.gov/preservation/resources/educational/bookmarks/preserveyour/images/BookPaperPhotoDigital.pdf"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The digital pictures panel recommends pigment ink on paper matched to the ink and printer when the goal is a long-lasting print.","entry_sha256":"398597ba75664543f865624d86f0078cdd4ec1b28a1a464eafda456543c32321","claims":["C-20"],"review":"reviewed"}
  - {"id":"S21","kind":"video","urls":["https://www.youtube.com/watch?v=cxnvw-N5f1o"],"published":"2023-10-10","retrieved":"2026-11-21","access":"snippet-only","rights":null,"basis":"Tried opening the video on 2026-11-21 without access to playback or captions. The search listing identifies Gena Philibert-Ortega as the guest in the recipe preservation segment. The supplied transcript excerpt attributes the advice to sleeve cards or clippings, store originals away from the kitchen and cook from a phone image or printout to that segment.","entry_sha256":"61eb74d0d4100e880a172ff1dbc738f783808eb4932c629d9343aafebf06e3e0","claims":["C-16","C-17"],"review":"reviewed"}
  - {"id":"S22","kind":"web-page","urls":["https://www.archives.gov/publications/prologue/2016/fall/family-archives-recipes"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The preservation guidance covers polyester sleeves for weak recipe papers and for handling newsprint clippings, and suggests using scans while the originals stay in storage.","entry_sha256":"164ebcd10dac0dfd340e7e0c1eae24727f7f4e63cf820cbd4e1dcd9bdd7febbf","claims":["C-16","C-17"],"review":"reviewed"}
  - {"id":"S23","kind":"web-page","urls":["https://getlibraryhelp.highlands.edu/c.php?g=1510015&p=11291590"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The archive staff recommend a phone image and storing older handwritten recipes away from dust and light. They advise using copies in the kitchen and storing the originals separately.","entry_sha256":"e32c07e8d9232f59a366dedda6fd148e84c062f5e3594aa0f798309b849b9e00","claims":["C-17"],"review":"reviewed"}
  - {"id":"S24","kind":"video","urls":["https://www.youtube.com/watch?v=0tmOuApE-qc"],"published":null,"retrieved":"2026-11-21","access":"unknown","rights":null,"basis":"Tried the video on 2026-11-21 and confirmed the title through the short-link redirect. Playback and captions were inaccessible. The supplied transcript excerpt is the basis for attributing the presenter’s advice to separate loose prints from papers.","entry_sha256":"e7aedd9626f0fd7db43b4c7d4609e2ab1f45458cf2b99178d2ca9cb4362db309","claims":["C-18"],"review":"reviewed"}
  - {"id":"S25","kind":"web-page","urls":["https://www.archives.gov/preservation/holdings-maintenance/photographs"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Preservation staff specify acid-free, lignin-free enclosures and stable sleeve plastics. They recommend considering individual enclosures for small interspersed photographs that might slip out and allow photographs to stay with associated records.","entry_sha256":"5be6555fa4990148a025685560fe589421e9d55d024cd7abc2e868fe91c36f54","claims":["C-18","C-19"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter’s advice, house family papers in archival folders and separate retained newsprint from other originals. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Use acid-free, lignin-free folders and boxes large enough to support loose records. House oversize sheets flat if they open without resistance. Leave brittle or tightly rolled material supported as found pending conservation advice. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"If a news clipping came out of a Bible, photograph or note where it lay before moving it. File the original separately in flat housing and keep the clipping locator with the Bible. A flat copy can preserve the association without placing a stiff sleeve inside the binding. [S3], [S4]","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"According to the presenter, choose boxes that fit the prints or film and preserve the grouping of albums or originals. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Use sleeves or folders that pass the Photographic Activity Test for prints. Choose a box that supports the size and format, and use archival pages in albums. Identify a film negative’s base before choosing a sleeve, and use suitable paper enclosures for nitrate, acetate or glass plate negatives. Preserve labels when moving slides or negatives into new housing. [S3], [S5]","sources":["S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"According to the interview, use an enclosure for a family Bible or album on a stable shelf, protect the spine during removal and keep household adhesive tape off a tear. [S2†]","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Box fragile Bibles and albums. For shelving, support sound volumes upright and lay oversized or weak volumes flat. Grip both sides near the middle when removing a book. For a torn or unstable binding, protect it in its box and choose professional conservation for treatment. [S6], [S7], [S8]","sources":["S6","S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"According to the presenter, cushion a folded quilt or garment with suitable tissue when boxing it. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"Box a folded family textile in a cool, dark storage area. Pad garment sleeves and unavoidable folds of a dress or quilt with unbuffered acid-free tissue. [S9]","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"Keep photographic prints and albums in a cool, dry place with little variation in temperature or humidity. For acetate negatives and color negatives, slides or prints, consider cold storage with protective packaging. [S3], [S10], [S11]","sources":["S3","S10","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"Move boxes of family papers off garage or basement floors and onto shelves in a climate-controlled interior room. [S3], [S12] Move them even if scanning has to wait, according to Family Tree Magazine’s advice. [S13†]","sources":["S3","S12","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"If using card stock as a protective cover for prints, choose acid-free, lignin-free stock that passes the Photographic Activity Test. [S10], [S12]","sources":["S10","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"Turn paper album pages with clean, dry hands. When handling loose prints or negatives directly, wear clean, fitted nitrile gloves and hold the item by its edges. [S10], [S11], [S14], [S15]","sources":["S10","S11","S14","S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"Leave a photograph stuck to glass in place. Avoid heat, prying and other DIY removal methods. [S10], [S14]","sources":["S10","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"method","anchor":"Use existing scans for routine viewing and display on the user's own device. Keep the original album boxed to limit handling and light exposure. [S16], [S17]","sources":["S16","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"method","anchor":"Protect weak original recipe cards and loose recipe clippings in sleeves when they still need handling, according to the episode’s advice. [S21†] Choose preservation-quality polyester. [S22]","sources":["S21","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-17","kind":"method","anchor":"When a family recipe is still used, keep the housed original outside the kitchen and cook from a scan or photo kept on the user's device or a printout made at home, according to the episode’s advice. [S21†], [S22], [S23]","sources":["S21","S22","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-18","kind":"method","anchor":"When a loose print could slip out of a mixed paper folder, separate it from direct contact with the papers, according to the organizing talk’s advice. [S24†] Give it its own photo enclosure and keep it with the associated papers if the enclosure fits safely. If it must move, record where it lay and leave the new locator with the papers. [S25]","sources":["S24","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-19","kind":"method","anchor":"Mount copies with photo corners. Avoid self-stick pages, tape and glue. Choose acid-free, lignin-free pages and inert polypropylene or polyester sleeves. Check that materials touching photographs pass the Photographic Activity Test even if the packaging says “archival.” Use a permanent pen that passes the same test to label plastic sleeves. [S14], [S18], [S19], [S25]","sources":["S14","S18","S19","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20","kind":"method","anchor":"Treat budget color prints with unspecified materials as replaceable copies. For durable inkjet copies, choose pigment ink and paper matched to the ink and printer. Keep the unedited scan on the user's device so a faded print can be replaced. [S18], [S20]","sources":["S18","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
