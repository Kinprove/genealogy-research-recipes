  - {"id":"S46","kind":"video","urls":["https://www.youtube.com/watch?v=pa2iB6AoyJo"],"published":"2025-02-08","retrieved":"2026-11-22","access":"snippet-only","rights":null,"basis":"Tried opening the video on 2026-11-22. The listing confirmed the episode. Playback and the full transcript were inaccessible. The supplied transcript attributes the advice on selective print sleeving and keeping glass negatives off high shelves to Taylor.","entry_sha256":"d6a5514e3ee0c9203014a235c9b1c822aafabdd65a1b9330e558f40447ca33b5","claims":["C-25","C-28"],"review":"reviewed"}
  - {"id":"S47","kind":"video","urls":["https://www.youtube.com/watch?v=B7UUP5O8OQ8"],"published":"2022-05-27","retrieved":"2026-11-22","access":"unknown","rights":null,"basis":"Tried opening the video on 2026-11-22. Playback and the full transcript were inaccessible. The supplied preservation segment advises cleaning shelves and using reduced suction around old books.","entry_sha256":"f0480fd46c53a7bad3c9f2f42cf40b02151ca0a0790f00a4e3bd2147747f8219","claims":["C-32"],"review":"reviewed"}
  - {"id":"S48","kind":"web-page","urls":["https://www.canada.ca/en/conservation-institute/services/preventive-conservation/guidelines-collections/photographic-materials.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Staff describe keeping photos accessible in protective sleeves and avoiding plastic sleeves for friable image surfaces because static can dislodge the image material.","entry_sha256":"6b831dfabeceff04d6dd01fd34898915c0f155593bb9b0a9caa3d343eaceb48c","claims":["C-25"],"review":"reviewed"}
  - {"id":"S49","kind":"web-page","urls":["https://www.canada.ca/en/conservation-institute/services/preventive-conservation/guidelines-collections/paper-objects.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The guidance calls for acid-free protective folders and isolation of acidic paper objects from adjacent papers.","entry_sha256":"99ae80cc767c10d9813d3d86b331066f0aa9917b9fd8cc40fc0d9527a4846d2c","claims":["C-23"],"review":"reviewed"}
  - {"id":"S50","kind":"web-page","urls":["https://www.canada.ca/en/conservation-institute/services/conservation-preservation-publications/technical-bulletins/products-used-preventive-conservation.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The technical bulletin describes contact staining from flexible PVC and distinguishes it from suspected off-gassing under normal museum conditions.","entry_sha256":"0f77c47ec728808b65297fdade3ef20833850f96e5a605516f569708caa3708e","claims":["C-41"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter’s advice, house family papers in archival folders and separate retained newsprint from other originals. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Use acid-free, lignin-free folders and boxes large enough to support loose records. House oversize sheets flat if they open without resistance. Leave brittle or tightly rolled material supported as found pending conservation advice. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"If a news clipping came out of a Bible, photograph or note where it lay before moving it. File the original separately in flat housing and keep the clipping locator with the Bible. A flat copy can preserve the association without placing a stiff sleeve inside the binding. [S3], [S4]","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"According to the presenter, choose boxes that fit the prints or film and preserve the grouping of albums or originals. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Use sleeves or folders that pass the Photographic Activity Test for prints. Choose a box that supports the size and format, and use archival pages in albums. Identify a film negative’s base before choosing a sleeve, and use suitable paper enclosures for nitrate, acetate or glass plate negatives. Preserve labels when moving slides or negatives into new housing. [S3], [S5]","sources":["S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"According to the interview, use an enclosure for a family Bible or album on a stable shelf, protect the spine during removal and keep household adhesive tape off a tear. [S2†]","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Box fragile Bibles and albums. For shelving, support sound volumes upright and lay oversized or weak volumes flat. Grip both sides near the middle when removing a book. For a torn or unstable binding, protect it in its box and choose professional conservation for treatment. [S6], [S7], [S8]","sources":["S6","S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"According to the presenter, cushion a folded quilt or garment with suitable tissue when boxing it. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"Box a folded family textile in a cool, dark storage area. Pad garment sleeves and unavoidable folds of a dress or quilt with unbuffered acid-free tissue. [S9]","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"Keep photographic prints and albums in a cool, dry place with little variation in temperature or humidity. For acetate negatives and color negatives, slides or prints, consider cold storage with protective packaging. [S3], [S10], [S11]","sources":["S3","S10","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"Move boxes of family papers off garage or basement floors and onto shelves in a climate-controlled interior room. [S3], [S12] Move them even if scanning has to wait, according to Family Tree Magazine’s advice. [S13†]","sources":["S3","S12","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"If using card stock as a protective cover for prints, choose acid-free, lignin-free stock that passes the Photographic Activity Test. [S10], [S12]","sources":["S10","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"Turn paper album pages with clean, dry hands. When handling loose prints or negatives directly, wear clean, fitted nitrile gloves and hold the item by its edges. [S10], [S11], [S14], [S15]","sources":["S10","S11","S14","S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"Leave a photograph stuck to glass in place. Avoid heat, prying and other DIY removal methods. [S10], [S14]","sources":["S10","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"method","anchor":"Use existing scans for routine viewing and display on the user's own device. Keep the original album boxed to limit handling and light exposure. [S16], [S17]","sources":["S16","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"method","anchor":"Protect weak original recipe cards and loose recipe clippings in sleeves when they still need handling, according to the episode’s advice. [S21†] Choose preservation-quality polyester. [S22]","sources":["S21","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-17","kind":"method","anchor":"When a family recipe is still used, keep the housed original outside the kitchen and cook from a scan or photo kept on the user's device or a printout made at home, according to the episode’s advice. [S21†], [S22], [S23]","sources":["S21","S22","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-18","kind":"method","anchor":"When a loose print could slip out of a mixed paper folder, separate it from direct contact with the papers, according to the organizing talk’s advice. [S24†] Give it its own photo enclosure and keep it with the associated papers if the enclosure fits safely. If it must move, record where it lay and leave the new locator with the papers. [S25]","sources":["S24","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-19","kind":"method","anchor":"Mount copies with photo corners. Avoid self-stick pages, tape and glue. Choose acid-free, lignin-free pages and inert polypropylene or polyester sleeves. Check that materials touching photographs pass the Photographic Activity Test even if the packaging says “archival.” Use a permanent pen that passes the same test to label plastic sleeves. [S14], [S18], [S19], [S25]","sources":["S14","S18","S19","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20","kind":"method","anchor":"Treat budget color prints with unspecified materials as replaceable copies. For durable inkjet copies, choose pigment ink and paper matched to the ink and printer. Keep the unedited scan on the user's device so a faded print can be replaced. [S18], [S20]","sources":["S18","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-21","kind":"method","anchor":"Inspect stored papers, photos and the surrounding shelves for pest activity. For books and magazines, check monitoring traps near the shelves regularly. [S32], [S34], [S19]","sources":["S32","S34","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-22","kind":"method","anchor":"Record the order of loose papers and photos before removing fasteners. Keep historic or binding fasteners in place. Remove loose clips and rubber bands from photos if they lift freely. On paper, remove office fasteners only if they cause damage or obstruct unique information. Use folders to keep the group together. [S38], [S39], [S25]","sources":["S38","S39","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-23","kind":"method","anchor":"For acidic flyers, posters or tickets, use individual acid-free, lignin-free folders as a barrier between items, according to Levenick’s advice. [S28†] Size the folders to support the sheets without bending them. [S3], [S49]","sources":["S28","S3","S49"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-24","kind":"method","anchor":"For a retained whole newspaper, use a shallow archival box big enough to store the issue flat, according to Levenick’s advice. [S28†] Leave brittle folds supported as found. If the information is the reason to keep the issue, copy the relevant pages onto permanent-quality acid-free paper and keep the page and issue details with the copy. [S4], [S35]","sources":["S28","S4","S35"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-25","kind":"method","anchor":"Sleeve selected prints individually, according to Taylor’s advice. [S46†] Prioritize significant or frequently handled prints. Use uncoated polyester that passes the Photographic Activity Test for sound prints that need to be visible through the sleeve. For a friable image layer, choose a supportive photo-safe paper enclosure. [S25], [S48]","sources":["S46","S25","S48"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-26","kind":"method","anchor":"Label the empty enclosure before putting in the original. [S38], [S25] If a print itself needs an identifier, distinguish paper from resin-coated stock, according to the episode’s advice. [S40†] Use a No. 2 pencil or softer on the reverse edge of a paper print. For resin-coated stock, use a waterproof, fade-resistant, nonacidic photo-marking pen with the ACMI AP Seal on the reverse edge. [S25]","sources":["S38","S25","S40"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-27","kind":"method","anchor":"For stable film that can be stored in plastic, use photo-tested pockets that fit the strip or a sleeve sized to the sheet negative, according to the episode’s advice. [S43†], [S44] If prints and their negatives came together, preserve the roll grouping, according to the episode’s advice. [S43†] Put matching locators on the separate print and film enclosures. [S44], [S25]","sources":["S43","S44","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-28","kind":"method","anchor":"Store intact glass plate negatives upright, according to the negative-storage segment. [S43†] Give them individual photo-safe paper enclosures in a rigid box with support between plates. Keep the box unstacked on a low, sturdy shelf above the floor, according to Taylor’s advice to avoid high shelves for glass. [S46†], [S25], [S45]","sources":["S43","S46","S25","S45"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-29","kind":"method","anchor":"For a magnetic album, photograph each safely opened page in full before moving anything, according to the episode’s advice. [S40†] Keep the images on the user's device in page order and use them to preserve the original arrangement. [S42]","sources":["S40","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-30","kind":"method","anchor":"Adhesive on magnetic pages can stain prints and hold them fast. Leave adhered items in place and box the album flat. [S41] If prints are already detached, retain each page locator and rehouse them in a nonadhesive, acid- and lignin-free album with photo-tested sleeves or corners, according to the episode’s advice on replacement housing. [S40†], [S3], [S19], [S41]","sources":["S41","S40","S3","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-31","kind":"method","anchor":"When a sound volume is crowded on a shelf, move its neighbors aside before gripping the covers. Keep any horizontal stack short. Give fragile or special books a fitted acid-free box when they need structural support, or a protective polyester jacket for a sound binding that needs a dust cover. To view pages in a tight binding, support both covers with a cradle and stop at the opening the binding allows. [S32], [S6], [S7]","sources":["S32","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-32","kind":"method","anchor":"For a dusty volume with a stable binding and surface, keep it closed and use a soft brush with a low-suction HEPA vacuum, brushing away from the spine. Clean the shelf before returning the book, according to the interview’s advice. [S47†], [S32], [S33]","sources":["S47","S32","S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-33","kind":"method","anchor":"House loose magazine issues flat in a fitted acid-free box. Use a polyester sleeve for an issue that needs extra handling protection. Leave binding staples in place. Keep glossy issues dry and prioritize them for salvage if they get wet, before the coated pages stick. [S32], [S7], [S39], [S37]","sources":["S32","S7","S39","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-34","kind":"method","anchor":"When displaying a page from a family book or magazine, make a copy on the user's own equipment and frame it. Keep the original page free of laminate and resin. [S32], [S17]","sources":["S32","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-35","kind":"method","anchor":"Support the crown of an inherited cap or hat in its natural shape before boxing it, according to Levenick’s advice. [S28†] Pad a soft crown lightly with unbuffered acid-free tissue and support a shaped brim without forcing the hat to fit. [S31]","sources":["S28","S31"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-36","kind":"method","anchor":"Isolate papers or photographs with suspected mold from the rest of the collection. Leave treatment of valuable items to a conservator. Use gloves and a particulate respirator if handling is necessary. Avoid freezing old photographs or negatives and set aside wet photographs made by an unidentified process for professional assessment. [S35], [S36], [S37]","sources":["S35","S36","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-37","kind":"method","anchor":"Keep metal pin-back buttons dry and separate them in a divided tray so that pins cannot scratch adjacent objects, according to Levenick’s advice. [S28†], [S29]","sources":["S28","S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-38","kind":"method","anchor":"Keep solvents away from old plastic buttons, according to Levenick’s advice. [S28†] For a sound, identified surface, start with gentle dry cleaning. Leave degrading or unidentified plastics untreated pending conservation assessment. [S30]","sources":["S28","S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-39","kind":"method","anchor":"Store CDs and DVDs upright in individual center-hub jewel cases. Put the identifier on the case insert and keep stickers, slip-in sleeves and wallets away from discs held for preservation. [S26], [S27]","sources":["S26","S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-40","kind":"method","anchor":"Put loose SD cards in a dedicated protective card case so each small carrier stays with its collection. [S26]","sources":["S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-41","kind":"method","anchor":"Store vinyl bumper stickers in a separate enclosure from photographs and papers, according to Levenick’s advice. [S28†] Keep flexible PVC out of direct contact with other objects. [S50]","sources":["S28","S50"],"checked":null,"stated_as":"observation","review":"reviewed"}
