  - {"id":"S37","kind":"web-page","urls":["https://www.archives.gov/preservation/conservation/flood-damage.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The guidance identifies wet glossy paper as a salvage priority and warns against freezing old photographs and negatives, especially when the process is unidentified.","entry_sha256":"5c9abef75a2511945da249120a53fbc31519e837296765702a1885637d34e3c8","claims":["C-33","C-36"],"review":"reviewed"}
  - {"id":"S38","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/how-can-you-find-and-preserve-old-family-photos-and-documents/"],"published":"2025-06-06","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The post advises labeling the housing instead of writing on originals and avoiding use of staples, clips and rubber bands on papers and photographs.","entry_sha256":"a472a42811d42026606b0fa41b188f4d527767ac66b36e8376ebf1ecb1eea618","claims":["C-22","C-26"],"review":"reviewed"}
  - {"id":"S39","kind":"web-page","urls":["https://www.archives.gov/preservation/holdings-maintenance/paper"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Staff distinguish historic fasteners from office fasteners and advise keeping safe fasteners in place, preserving original order when removing a damaging fastener and avoiding fasteners on photographs and artwork.","entry_sha256":"929192402ac0f1534d365bc0cf5c81c00640d203f38d2e9f072a03e4f905c720","claims":["C-22","C-33"],"review":"reviewed"}
  - {"id":"S40","kind":"video","urls":["https://www.youtube.com/watch?v=JiquRf-PJUY"],"published":"2023-05-02","retrieved":"2026-11-22","access":"unknown","rights":null,"basis":"Tried opening the video on 2026-11-22. Playback and the full transcript were inaccessible. The supplied preservation segment advises marking paper and resin-coated prints differently, capturing complete magnetic album pages before any move and using a nonadhesive replacement housing.","entry_sha256":"bb94eee4cabcc6c2ee22e9c1b646002ea6fca63a63d96eac583d9f36cf429b2c","claims":["C-26","C-29","C-30"],"review":"reviewed"}
  - {"id":"S41","kind":"web-page","urls":["https://www.archives.gov/preservation/holdings-maintenance/bound"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Staff explain how magnetic album adhesive stains and holds contents, recommend leaving stuck material in place and outline housing and cross-filing detached items.","entry_sha256":"0dcd5c6cea396f83f7cd51cac58c046dd079bae5dabf29924a594672d0573855","claims":["C-30"],"review":"reviewed"}
