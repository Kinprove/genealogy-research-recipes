  - {"id":"S43","kind":"video","urls":["https://www.youtube.com/watch?v=oWBn-KaRXlU"],"published":"2022-12-01","retrieved":"2026-11-22","access":"snippet-only","rights":null,"basis":"Tried opening the video on 2026-11-22. The listing confirmed the episode. Playback and the full transcript were inaccessible. The supplied preservation segment advises fitting storage to negative strips and sheets, retaining known print-to-negative associations and storing glass plates upright.","entry_sha256":"64f2c2d6e885cc130914d03cc07ba59d1682451a5603ad3b2af6d914be08c4dd","claims":["C-27","C-28"],"review":"reviewed"}
