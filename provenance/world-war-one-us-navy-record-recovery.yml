claims:
  - {"id":"C-000000000001","kind":"custody","anchor":"For a World War I U.S. Navy vessel or shore unit, use RG 24, *Muster Rolls of Ships and Shore Establishments, 1898–1939*, PI-123 Entry 134, NAID 572847. Choose the 1898–1930 segment and browse by vessel or shore unit. A miss in the separate 1938–1949 World War II collection leaves World War I assignment open. [S2 @2026-11-22] [S5 @2026-11-22]","sources":["S2","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"Read the rolls for the dates around the event. Log each dated report, change of assignment or transfer naming the sailor and continue in the receiving ship or station’s rolls. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"method","anchor":"According to the presenter, compare a vessel’s type and dated names, operators and roles to link its successive designations and distinguish same-named ships [S1†]. Search under the name used on the event date and retain later names and designations as cross-references.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"According to the presenter, check the published Navy death roster for the individual [S1†]. Use *Officers and enlisted men of the United States Navy who lost their lives during the World War* for deaths from April 6, 1917, through November 11, 1918. Record each entry under its own event date and use any named ship or hospital for the next search. [S3]","sources":["S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000005","kind":"custody","anchor":"For naval medical documentation, check RG 52’s medical certificates and casualty lists, then check its registers of patients when the report names a naval hospital. Record the hospital and the record series independently of the ship assignment. [S4 @2026-11-22]","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
