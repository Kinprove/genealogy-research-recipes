claims:
  - {"id":"C-0a993261ae20","kind":"custody","anchor":"Start with the likely traveler and travel window. The National Archives holds applications from October 1795 through March 1925 in RG 59. An index covering 1795–1925 cannot test issuance in 1789–1794, and issuance began in 1789. Use MyHeritage’s United States Passport Applications, 1795–1925 or the index and image routes in the archive’s guide. Check which film or application series covers the target date. Nineteenth-century overseas travel generally did not require a passport. Check the requirement in force for the specific trip, including the temporary Civil War and First World War rules. A miss leaves travel unresolved. [S1 @2026-11-21] [S2 @2026-11-21] [S3 @2026-11-21] [S5 @2026-11-21]","sources":["S1","S2","S3","S5"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-396360549ff7","kind":"method","anchor":"Search around each known trip for a first application, renewal or application made abroad. Keep a separate row per document. Extract birthplace, residence, occupation, travel purpose, stated destination and the person who vouched for the applicant. Treat the identifier as a possible associate or relative and test the relationship separately. An application can describe proposed travel. Verify the trip in travel records. [S1] [S2] [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d2f87444383c","kind":"method","anchor":"Inspect the whole application photograph for other people and check their roles against the document text. Use the original attached image for visual details and label any colorized or enhanced derivative separately. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
