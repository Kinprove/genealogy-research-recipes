claims:
  - {"id":"C-5705472e3a9e","kind":"method","anchor":"Use this recipe at the start of county research in the states covered in step 1, before you search deeds, wills, court orders or marriage bonds, and again when an online search of the county finds nothing. Read the state archives' guide to its county holdings first [S2 @2026-11-16], [S10 @2026-11-16], [S14 @2026-11-16]. Build a table of the series it lists for the county, with the format of each, and let that format choose the retrieval route for each series.","sources":["S2","S10","S14"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4b7e2a91c0d3","kind":"custody","anchor":"- Reading a county guide as a list of what survives. A guide lists what that archives holds. It is not a list of what survives. The Library of Virginia says many county and city records remain in the locality [S2 @2026-11-16], and the Pennsylvania State Archives says county records are in general still held by the counties [S13 @2026-11-16].\n- Searching only the county as it exists now. When Virginia formed a new locality, the records for its area stayed with the parent locality [S2 @2026-11-16].\n- Trusting a printed guide's format entries. North Carolina's State Archives says its holdings of original and microfilmed records change constantly [S10 @2026-11-16]. The Library of Virginia switched its chancery project from microfilming to digitizing in 2004 [S7 @2026-11-16], ten years after its printed county guide [S8 @2026-11-16]. An entry that showed only originals may now be filmed or online.\n- Reading \"microfilm\" as \"online\", or \"original\" as \"not online\". Check each series against current catalogues (§4).","sources":["S2","S13","S10","S7","S8"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9f13c6e05a28","kind":"method","anchor":"Use the archives' current online guide first, and its printed edition for detail the online guide lacks. Record the title and edition, or the web page and the date you read it. Just Genealogy's presenter opens these guides at the county's entry and reads its original records and its microfilm as separate lists; he names the Virginia and North Carolina guides, and John T. Humphrey's guide for Pennsylvania (from transcript excerpts, not independently verified) [S1†].","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2d84b17fe960","kind":"custody","anchor":"**Virginia.** The Library of Virginia was the Virginia State Library and Archives until 1994 [S9 @2026-11-16]. Its printed guide is *A Preliminary Guide to Pre-1904 County Records in the Virginia State Library and Archives* (Suzanne Smith Ray and others, 1994) [S8 @2026-11-16]; cite it by that title, not as a guide to \"county court records\". Online, the Library's county and city records page links each locality to its formation date, its parent localities and whether the Library holds its microfilm and its original records [S2 @2026-11-16], [S3 @2026-11-16]. The microfilm link opens the locality's reel list, arranged by record category [S3 @2026-11-16], [S4 @2026-11-16]. The online pages say only whether the Library holds originals; for original locality records the Library refers researchers to its Archives Reference Services [S3 @2026-11-16].","sources":["S9","S8","S2","S3","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-71c0a5d3e2b9","kind":"custody","anchor":"**North Carolina.** Use the State Archives of North Carolina's County Records Guide. It sorts each county's records into original records and microfilm copies, groups them by series (bonds, courts, estates, land, marriage and vital statistics, tax and fiscal, wills and others) and links each county to a catalogue page [S10 @2026-11-16]. The printed predecessor is *Guide to Research Materials in the North Carolina State Archives, Section B: County Records*, issued in several editions, among them a 9th revised edition of c1979 [S12 @2026-11-16]. Prefer the online guide: the Archives keeps adding county records and microfilm reading copies [S10 @2026-11-16].","sources":["S10","S12"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c5e98f2041a7","kind":"custody","anchor":"**Pennsylvania.** The State Archives does not have copies of all county records, and county records are in general still held by the counties [S13 @2026-11-16]. Its Digitized County Records Guide lists, county by county in PDF files, the digitized county records viewable in its public search room [S14 @2026-11-16]. Humphrey's guide is *Pennsylvania Research: County and Township Records* (PA Genealogy Books, 2006); only its catalogue record was checked, not its contents [S15 @2026-11-16].","sources":["S13","S14","S15"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fde5c47e2677","kind":"platform-ui","anchor":"**Illinois.** Start with the Illinois State Archives for probate, military, vital and land research [S17 @2026-11-22]. For county series, select the county in the Illinois Regional Archives Depository (IRAD) Local Government Records Database. Leave **Title** blank for a county inventory or narrow it with a series term such as `PROBATE` [S18 @2026-11-22]. Try `birth`, `death` or `marriage` for local vital series [S21 @2026-11-22]. Copy the series title, accession number, date span and holding depository into the table [S19 @2026-11-22]. If the entry gives no format, mark it unknown and check in step 4.","sources":["S17","S18","S21","S19"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b175b8bef345","kind":"portal-availability","anchor":"On the Illinois State Archives' Databases page, choose a military collection by conflict or open a statewide death or marriage index [S20 @2026-11-22]. For an initial public-land sale, use the Public Domain Land Tract Sales Database [S20 @2026-11-22], [S21 @2026-11-22]. For a later transfer, search IRAD for `deed` in the county and add the county recorder's deed holdings to the plan if IRAD lacks the relevant series [S21 @2026-11-22].","sources":["S20","S21"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0a6d3b9c71e4","kind":"custody","anchor":"Take the county's formation date and parent counties from the guide before choosing records. For an event before that date, search the parent county: in Virginia the records for a new locality's area stayed with the parent locality [S2 @2026-11-16]. Highland County, for example, was formed in 1847 from Bath County and from Pendleton County, now in West Virginia [S3 @2026-11-16], so a family there before 1847 belongs in Bath or Pendleton records.","sources":["S2","S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b2428ecca326","kind":"portal-availability","anchor":"For Illinois, open the county under **County Fact Sheets** on the IRAD regional map [S22 @2026-11-22].","sources":["S22"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e3f1072bd58c","kind":"portal-availability","anchor":"Copy one row per series from the county entry: series title, volume or box, date span, format (original or microfilm), reel number, holding archives, and the guide you read with its edition or date. Keep original and microfilm rows apart, as the guides do [S3 @2026-11-16], [S10 @2026-11-16]. On a Library of Virginia microfilm page, also record the ILL mark, which shows that a copy of the reel can be lent [S4 @2026-11-16]. Gaps between a series' date spans are years to account for in step 5.","sources":["S3","S10","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-58b2d4e9a0f6","kind":"method","anchor":"Let the format the guide gives choose the first route, then check whether that format is still the only one. Just Genealogy's presenter reads a microfilm entry as material he may find online, and an original-records entry as material that may since have been filmed or digitized, or that calls for a visit, a finding aid or a publication about it (from transcript excerpts, not independently verified) [S1†].","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b19a6c3f8d27","kind":"portal-availability","anchor":"- **Microfilm.** Look for the same volumes in the FamilySearch catalogue under the county. FamilySearch reported in September 2021 that it had digitized its whole microfilm collection of more than 2.4 million rolls; some images can be viewed only at the Family History Library, a FamilySearch center or a partner website [S16 @2026-11-16]. Many of the Pennsylvania State Archives' digitized county records are also on FamilySearch [S14 @2026-11-16]. A library can borrow Library of Virginia microfilm through interlibrary loan, the only way the Library circulates microfilm [S5 @2026-11-16].\n- **Original.** Check first whether the originals have been digitized since the guide appeared. For Virginia chancery causes, search the Library of Virginia's Chancery Records Index, which holds scanned images or index entries from over 100 of the state's 133 localities and concentrates on causes before 1913 [S6 @2026-11-16]. For a North Carolina county, open the county's catalogue page and its \"Child Records\", and any container list on the Archives' county records box-lists page [S11 @2026-11-16]. If nothing is online, list the series for a reading-room visit by the user.","sources":["S16","S14","S5","S6","S11"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6e40f8a2c1d5","kind":"custody","anchor":"When no guide lists a series or the years you need, record \"not listed in [guide, date]\", not \"not held\" or \"lost\": a guide can cover only part of the holdings, as Pennsylvania's lists only digitized records. Record the archives as not holding the series only after its general catalogue or its staff confirm it. Then add the county's own offices to the plan: many Virginia county records remain in the locality [S2 @2026-11-16], and for a record the Pennsylvania State Archives lacks, it sends researchers to the county courthouse, county archives or municipal office [S13 @2026-11-16]. Add the parent county for years before the formation date (§2).","sources":["S2","S13"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
