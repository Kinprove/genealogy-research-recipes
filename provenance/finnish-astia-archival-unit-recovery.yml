claims:
  - {"id":"C-bbd4c7b5fde9","kind":"platform-ui","anchor":"For a citation with a call number (*signum*), search Astia with the archive title and the exact call number together. If the combined query misses, try the archive title alone and verify each hit's parent collection before using it. [S1 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bf3f3b2b87ae","kind":"platform-ui","anchor":"When the citation lacks the unit title, find the creator or collection in **Selaa aineistoja** (browse holdings). Expand the collection, series and subseries to the target unit. Check the unit card's identifier and inclusive dates before opening its images. Use the record-type finding aid in Arkistojen Portti to identify the creator or series when the archive name is uncertain. [S2 @2026-11-22] [S4 @2026-11-22]","sources":["S2","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3a5d9b806aef","kind":"platform-ui","anchor":"An empty digital-only search leaves the archival unit's availability unresolved. Remove the digital and year filters, open the parent collection or creator card, and inspect the relevant series and unit cards. Use each card's date range and access information to decide what to inspect. Apply a digital filter again only after identifying the collection. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9b029f47c022","kind":"portal-availability","anchor":"Check Digihakemisto for a contributed contents list before browsing an Astia image set. Use its entries to reach a candidate image, then cite the archive unit and the page or image you actually inspected. For parish books, distinguish a microfilm-derived scan from images made from the paper original when the description identifies the source. [S7 @2026-11-22] [S9 @2026-11-22]","sources":["S7","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-17cf1d1a2c3d","kind":"portal-availability","anchor":"On the unit card, distinguish a public image, a restricted digital image and an undigitized holding. If earlier image links fail, look up the unit again by call number. Check the archive's microfilm and microfiche lists for a surviving surrogate while replacement images are pending, and note the format and reading-room route that remain available. Use the access instructions for that unit when a permit or on-site consultation is required. Digitized or microfilmed material is generally supplied through the available surrogate. [S5 @2026-11-22] [S6 @2026-11-22] [S8 @2026-11-22] [S9 @2026-11-22]","sources":["S5","S6","S8","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b9aaeb430c62","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: request --> An Astia record request sends the user's account details and any subject identifiers in the request to the National Archives of Finland. For anyone who may be living, keep the draft local until the [record-request gate](../SKILL.md#record-requests) is cleared. [S5 @2026-11-22]","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6437d44a2396","kind":"portal-availability","anchor":"If a reading-room consultation or a copy is needed, submit the Astia request with the exact archival unit reference and only the details the archive requires. [S5 @2026-11-22]","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
