claims:
  - {"id":"C-000000000001","kind":"method","anchor":"Ask the eldest available relative or lineage custodian whether the family keeps a *gia phả*. Ask which branch the book covers and whether the custodian holds a branch copy or knows where the lineage’s main copy is kept. Record which copy you read and how it passed to its holder. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"If the household copy is missing, check whether another branch retained a copy. Compare a later reconstruction with any surviving earlier copy before treating a changed lineage or an omitted person as established. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"custody","anchor":"Use the bibliography and list appendices in the catalogue of genealogical manuscripts at the Institute of Hán-Nôm Studies and the National Library of Vietnam. Search the family name with the ancestral locality and preserve the title and shelfmark. Treat a miss in the catalogue as bounded by its collected manuscripts, which favor northern localities. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"Use the manuscript description’s locality and branch information to distinguish candidates with the same surname. Record names in the written forms, including Hán or Nôm where visible. Preserve statements about each generation and compare the links with dated family or locality records. [S2] [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
