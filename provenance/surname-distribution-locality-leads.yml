claims:
  - {"id":"C-e451b5b86f92","kind":"unclassified","anchor":"- German surname maps such as verwandt.de, the one the presenter showed, are built from telephone-book entries, so they show a modern distribution [S4]. verwandt.de has since been shut down (its heise.de download entry was updated 26 May 2024 to say so). Geogen, another phonebook-based German map, uses data dated 31 December 2002. A \"modern\" phonebook map can therefore be twenty or more years old. Record the phonebook date, not just \"modern\".\n- Black's *The Surnames of Scotland* is built from medieval and manuscript attestations [S2].\n- Geneanet's surname timeline divides the distribution into periods using a slider. In the presenter's 2023 demonstration it started at about 1500 [S3]. Current Geneanet surname pages describe the distribution \"from 1600 to the present day\", so check the earliest slice on the live page and record what it shows.","sources":["S4","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-42797a6b3451","kind":"method","anchor":"Use the time slice nearest the target generation, and save the location, period and source behind each dot. Gunther’s 2023 Geneanet demonstration showed a French cluster in the 1500s, a wider spread in the 1700s, and London and the Netherlands as well as France in the 1800s [S3]. Those later places suggest records to search for that period. A changing map alone cannot trace a particular household between them.","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-50e142160aa2","kind":"method","anchor":"Look up both spouses’ surnames in the same dated distribution source. If at least one is uncommon, map the places where both occur. Sinickas used three nearby Lithuanian villages to narrow the parish search [S1]. Her demonstration does not establish the reference period of the underlying data. Keep the locations as leads and search the registers covering each village in the couple’s lifetime. Shared markets or churches can suggest where to look next.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5e317c6f0e06","kind":"unclassified","anchor":"Limits [S1]:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4cdb547ae92e","kind":"unclassified","anchor":"Before you conclude that a name or place is absent, read the list in the source's own sort order. In the official Lithuanian alphabet, **y** comes after i and į (i with ogonek) and before j (…I, Į, Y, J…). Letters with a háček sort after the plain letter: č after c, š after s, ž after z. Computer collation that follows the Unicode proposal for Lithuanian treats y as a variant of i, so a list sorted that way files y-names among the i-names. Check both positions: after į, and among the i-names. (The presenter says y comes straight after i, which leaves out į [S1].) Follow the source's abbreviation sequence. It does not match the alphabetical order of the village names, so scanning by village name will miss entries [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-095c68513120","kind":"method","anchor":"Record the spelling, date and parish in each surname-dictionary attestation, then locate the parish in a contemporary or historical gazetteer. Brady read an entry in Black for Thomas Garmach, a minister associated with three parishes, and chose Tarves to look up [S2]. Groome’s *Ordnance Gazetteer* identifies Tarves as both a village and a parish in central Aberdeenshire [S22]. The place is established; a posting there alone does not determine the minister’s birthplace or the origin of other bearers.","sources":["S2","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2eae6d106538","kind":"method","anchor":"- Resolve **every** attested parish, not just the first.\n- If several places share a name, keep each candidate until the department or parish, neighbouring places or another contemporary reference distinguishes it. A place-derived French surname can point to several localities with the same place name [S3]. Record why the chosen locality fits.","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09ad26189159","kind":"unclassified","anchor":"Below its phonebook map, the German site the presenter showed listed the top counties for the surname [S4]. Copy any such list as a ranked queue, with the source and the date of its phonebook data. Search the first district's registers. If they yield nothing, move to the next district rather than widening to the whole country [S4]. The presenter suggests that present-day bearers in the family's area may be cousins [S4]. Do not adopt that: a shared surname in a district is a contact or search lead, not kinship.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f07a8a031d6e","kind":"method","anchor":"Keep each dated attestation separate. A forum contributor transcribed a Perfiley Petrov Tenigin, aged 23, in Shadrinsk sloboda in 1710 (RGADA, f. 214, op. 1, d. 1525). The same contributor quoted a Perfiley Petrov Ustyuzhanin, aged 35, in Mogilnaya village of the sloboda in 1719 (d. 1527). The byname makes Ustyug an origin lead dated to 1719. The earlier surname occurrences reported for 1677–78 in part of Ustyug district have their own locator (RGADA, f. 1209, op. 1, d. 15047, fols. 332–363v) [S7]. All three references were taken from the forum; the manuscripts were not inspected.","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-285116331c38","kind":"method","anchor":"To test the proposed identification, compare the household members in the original entries. The 1710 transcription names a wife Natalia, daughter Katerina and brother Arkhip. The two reported ages advance twelve years over a nine-year interval. The shared forename, patronymic and district leave the identity open. The contributor likewise treated the earlier Ustyug material as fragments [S7].","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-823572448948","kind":"method","anchor":"Record the date, spelling, geographic filters and result total for each search. Tanner’s 2016 UK-wide Findmypast exercise returned about ten records on one search and up to about eighteen as he varied the spelling [S5]. Inspect the places and repeated individuals in the results. A portal hit count measures that search’s indexed records and supplies no national count of surname bearers.","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b83d0aafe3b1","kind":"unclassified","anchor":"- The count measures that site's indexed coverage, not the historical population. The presenter notes that many parishes in his target period (late 1600s to early 1700s) were not recording baptisms [S5]. English parishes had been required to keep registers since 1538. The real problem is gaps in the later 1600s, plus nonconformist baptisms that often never reached the parish register.\n- He also claims that if the bearers are all in one place he is related to every one of them [S5]. Do not adopt that. A small, clustered pool shortens the matching list but proves no relationship.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e33a72ea15a3","kind":"unclassified","anchor":"**For Spain, use the INE count.** The surname tool of the INE (Instituto Nacional de Estadística, the national statistics office) counts bearers separately as first surname, as second surname and with the surname in both positions. It maps them by province or municipality of residence, by province or municipality of birth, or by nationality [S8], [S9]. Use a birth mode for origin leads, and record which mode and which count you used. Counts below 5 are not shown, so a blank cell is not zero [S9]. Read the data source and reference date in the query form's notes and record them with the result. On 2026-11-04 the form gave the Censo anual de población (annual population census) at 1 January 2025 [S10].","sources":["S8","S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4bba7f1b6253","kind":"unclassified","anchor":"**For the Netherlands, use the CBG Nederlandse Familienamenbank** (cbgfamilienamen.nl). It gives a surname's count and distribution for two years: the census of 31 May 1947 and the population register of 2007 [S11], [S12]. The 2007 figure covers only people with Dutch nationality living in the Netherlands, and counts below 5 are not shown, so a blank is not zero [S11]. Label the result with the year you read.","sources":["S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eee9197db146","kind":"unclassified","anchor":"**For France, use the INSEE surname file.** INSEE's *Fichier des noms* counts surnames given at birth by decade from 1891 to 2000, for France and for each département of birth (overseas départements from 1900) [S13]. It lists only names given at least 30 times over the whole period. In the département file, a name given fewer than 30 times in a département is grouped under the code \"XX\" [S13]. So a département missing for a surname is suppressed, not zero. In the overlap step above, keep such a département as unknown; do not drop it. The file also leaves out people born before 1946 who died before 1972, so for births before 1946 it counts only people still alive in 1972 [S13]. Record the decade, the département and that limit with the result.","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-882476ec59bd","kind":"unclassified","anchor":"Geopatronyme is no longer a separate site: geopatronyme.com now redirects to Filae [S14]. A Filae surname page shows births in France in four 25-year periods from 1891 to 1990 and names INSEE's surname file as their source [S14], [S15]. The same page also lists département and commune counts; they are larger than the births total, and the page does not define them [S15]. Use only the births block as a dated count, and label the other lists \"Filae record set, period unknown\".","sources":["S14","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e2a2a03fb5e","kind":"unclassified","anchor":"**For Denmark, Norway and Sweden, the official counts are national totals.** Danmarks Statistik's *Hvor mange hedder…?* counts people living in Denmark on 1 January each year. It uses only the first given name and the last surname, and does not show an exact count below 3 [S16]. Statistics Norway (SSB) counts people registered in Norway and finds a name only when more than three people bear it [S17]. Statistics Sweden (SCB) stopped its name statistics in 2024. Use the Swedish Tax Agency's (Skatteverket's) search instead: it counts registered residents, is updated weekly and matches only the exact spelling [S18]. Record the date each figure refers to. None of these breaks a surname down by region, so use them to size the pool and to qualify a surname as uncommon, not to rank localities. Many Nordic surnames were fixed only in the late 1800s or later, often from a patronymic or a farm name, so a modern count says nothing about earlier generations (see [Scandinavian patronymic and farm names](scandinavian-patronymic-farm-name-record-recovery.md)).","sources":["S16","S17","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dbf59d07b963","kind":"method","anchor":"Use the displayed variants as search terms and the listed localities to select registers. Gunther suggested Huguenot migration as one explanation for French surname hits in London and the Netherlands, and said she had not established it for that family [S3]. Look for a record connecting the named person to a congregation or movement. Trace any user-submitted tree claim to its underlying evidence before assigning religion, origin or kinship.","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-928456897556","kind":"method","anchor":"**If a candidate village’s registers are missing, look for namesakes in neighbouring settlements.** A researcher reported an unlocated birthplace written as Рбинское in a civil-registry reply. A suggestion of Зябень and a reported gap in its metrical books prompted a search for Силкин in service records. She found two namesakes associated with Зябенская Дубровка in Pamyat Naroda and another database she called «Гвара» [S19]. These are leads to a different locality. Check the original entries, their dates and place fields, and the register inventory before linking either man to the family. See [military and Soviet-repression record episodes](russian-military-repression-record-episodes.md#start-from-the-event-and-source-scope).","sources":["S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04d09f6617fb","kind":"platform-ui","anchor":"**For Belgium, use Familienaam.be's population-register maps for 1998 or 2008.** Select the year nearer the target period under the time-slice rule above. Compare relative frequencies to rank concentrations and absolute counts to read numbers of bearers. Keep the selected spelling, capitalisation, spaces and accents with the result, and rank it as a population-register observation for that reference year. [S20 @2026-11-17], [S21 @2026-11-17]","sources":["S20","S21"],"checked":"2026-11-17","stated_as":"fact","review":"reviewed"}
  - {"id":"C-315087286773","kind":"platform-ui","anchor":"Ask the user to run the Mapa Nazwisk lookup manually for personal research. The site's terms restrict automated access [S25 @2026-11-20]. Have the user enter the nominative singular with Polish diacritics, using the masculine form where the surname has gendered endings [S24 @2026-11-20]. Use clusters for an uncommon surname to rank regions for register searches [S23 @2026-11-20]. Label the map as a distribution from Poland's 2000 telephone directories [S24 @2026-11-20].","sources":["S23","S24","S25"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0dba9840d02d","kind":"platform-ui","anchor":"Look up the surname in Nazwiska polskie (nazwiska-polskie.pl) for approximate national and local counts and use the listed places as leads [S26 @2026-11-20], [S27 @2026-11-20], [S28 @2026-11-20]. Keep unlisted places open because the site may omit localities [S28 @2026-11-20]. Without a fixed reference date, log \"period unknown\" and rank these leads last. Establish rarity from a dated nationwide source before narrowing the search.","sources":["S26","S27","S28"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
