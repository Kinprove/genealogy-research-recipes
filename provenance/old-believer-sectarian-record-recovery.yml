claims:
  - {"id":"C-35bd60c515fe","kind":"unclassified","anchor":"- Before you search, write down three things: the years, the settlement, and the **Orthodox parish the settlement was attached to**. In the Ekaterinburg example, the Old Believer births, marriages and deaths of Shartash were kept for Old Believers \"числящихся в приходе\" of the Ekaterina cathedral (Екатерининский собор), not under a church of their own. [S1]\n- Do the same for the Edinoverie parish, and give it its own row even when the village also belongs to an Orthodox parish. In the Shadrinsk example, a village belonged to the Nikolaevskaya church's parish (GASO f.6 op.1 d.421 for 1812) and also to the Preobrazhensky cathedral's, while its Edinoverie households belonged to the Troitskaya Edinoverie church. Use the Edinoverie church's clergy registers (клировые ведомости; GASO f.37 op.4 d.89 for 1870–1871) to see which villages and how many households it served. [S4]\n- Find out when the Edinoverie parish was founded. The 1902 diocesan parish history *Приходы и церкви Екатеринбургской епархии* says Shadrinsk Edinoverie believers first went to the Ekaterinburg Edinoverie church, then to Sosnovskoe village, and formed their own parish only in 1839. Add those earlier churches' books for the earlier years to the checklist. [S4]","sources":["S1","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1078af9f808a","kind":"unclassified","anchor":"Survival and arrangement vary by region and fond. The Ekaterinburg/Shartash series below are **worked examples**. Use them to know what kinds of series to look for, then confirm each one against the inventory (опись) of your own regional archive. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9d230431fc34","kind":"unclassified","anchor":"| Series (worked example) | Example locator | What it records |\n| --- | --- | --- |\n| 1727 commission roll / poll-tax account with a separate raskol levy, re-examined 1734 | GASO f.34 op.1 d.14 (l.53, l.55об) | Raskolniki registered by the 1727 commission, ages, the poll tax plus 70 kopecks \"за раскол\", the 1734 re-examination, arrears [S1] |\n| 1742 census of raskolniki by Lieutenant-Colonel Shishkov, copying the 1735 roll | GASO f.24 op.1 d.1000 (l.11 ff.) | Separate groups \"с пашпортами\" and \"записные по комисии\"; a note on how and when each person \"в раскол впал\" [S1] |\n| 1747 revision skazki | GASO f.24 op.1 d.548a (l.16, l.22); parallel register RGADA f.350 op.2 d.899 | \"положен в двойной оклад\"; a man entered \"в подушны и расколническии оклады\" by the 1727 commission and again in 1735 [S1] |\n| 1752 roll of raskolnik children born after the revision | GASO f.24 op.1 d.1370 l.148 | Children by father, with ages [S1] |\n| Raskol skazki in a delo titled for 1765, with a copy of the order for unregistered \"потаенным раскольникам\" to submit skazki and be put \"в двойной расколнической оклад\" | GASO f.34 op.1 d.187 (order l.201, with a receipt note dated 7 June 1764; Shartash from l.216) | Whole households with ages [S1] |\n| Confession rolls: \"не исповедался\" rolls and \"старообрядцы\" sections | GASO f.24 op.23 d.6987 (1793), d.7078а (1807), d.7081 (1812) | Household lists. The 1812 roll has a \"Купцы и мещане старообрядцы\" section (l.44) and a separate roll of Shartash merchants and meshchane \"состоящих в старообрядчестве\" (l.51об) [S1] |\n| Yearly district registers of non-confessants (ведомость ... о неисповедавшихся) | GASO f.24 op.1 d.2293 (1768–1770, Ekaterinburg zakaz) | Households with ages, village by village, between revisions [S3] |\n| 1838 опись раскольникам Шарташского селения и их женских скитов | GASO f.6 op.2 d.479 ч.2 | Columns \"время уклонения в раскол\" and \"какого толка\" [S1] |\n| \"Книги записные перемен\" / metrical books of Old Believer villages, filed under the Orthodox parish | GASO f.6 op.1 d.8 (1805), d.45 (1809), d.48 (1816), d.50 (1818); f.6 op.3 d.147ст=d.287нов (1807), d.306 (1814), d.311 (1819), d.318 (1821) | Old Believer births, marriages and deaths [S1], [S2] |\n| Edinoverie church metrical books | GASO f.6 op.1 d.101 (1845); f.6 op.3 d.224 (1849–1850); f.6 op.1 d.197 (sixteen Edinoverie churches, 1862–1866) | \"единоверческаго вероисповедания\"; \"вновь присоединившийся из раскола\" [S1], [S2] |\n| Orthodox metrical books, \"присоединившаяся\" entries in the baptism section | GASO f.6 op.7 d.228 (Свято-Троицкая church, Shartash, 1886, l.65об, l.70об) | Reception from a named толк by chrismation [S1] |\n| Police raskol metrical registers, 1874 to the 1906 ukaz | Not in the worked example; see step 3 | Births, marriages and deaths of raskolniki |\n| Register of people converted from raskol to Edinoverie, 1836 | GASO f.6 op.1 d.76 l.27 (in the delo of Edinoverie church metrical books, 1836–1841) | Conversions [S2] |","sources":["S1","S3","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-835700202e4b","kind":"unclassified","anchor":"Inventory-reading rules from GASO f.6 op.1 [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7239460fc5f9","kind":"unclassified","anchor":"- In this fond, Old Believer village books sit inside dela whose headings name ordinary churches. d.8 is headed as the 1805 metrical book of the Предтеченская church of Щелкунская слобода, and the second line of its description adds the Екатерининская church's \"записные книги\" for the Old Believer villages of Shartash, Stanovaya and Sarapulka for 1805. In d.45 the 1809 \"записные книги\" for the Old Believer villages of Sarapulka and Stanovaya come first (l.1), ahead of the town churches' 1809 books. Read the whole delo description, not just the heading. In other regions, check whether the same arrangement holds.\n- In this fond, Edinoverie books are gathered into multi-year, multi-church dela outside the year-by-year volumes (d.197 covers sixteen Edinoverie churches for 1862–1866). Search the inventory for \"единоверческ\" and do not stop at the volume for your year.\n- A place appears under different church forms over time. The 1840 volume d.93 has a \"Часовни Шарташского селения\" (l.779), and later volumes have the Свято-Троицкая church of Shartash (d.192 for 1862, d.258 for 1873). Give each one a separate row.\n- Record old and new delo numbers together where the transcription gives both. The 1807 book is cited as f.6 op.3 d.147ст=d.287нов. [S1]\n- Look at what is attached to revision skazki. The 1857 skazka (GASO f.8 op.1 d.1777, ll.530–531) has certificates from the Spasskaya and Troitskaya Edinoverie churches filed with it, giving births and baptisms, including baptisms one or two years after the birth. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6cf8f7cd7e88","kind":"unclassified","anchor":"- The law of 19 April 1874 required the police to keep metrical books of the births, marriages and deaths of raskolniki. For any event from 1874 up to the 17 October 1906 ukaz on Old Believer and sectarian communities, give its own row to the police raskol metrical register of the town or uezd where the family lived. Look for it in the police fonds of the regional archive, not only in the consistory fond. Keep the Orthodox and Edinoverie books in the search too: the worked examples include reception from Old Belief in Orthodox books, and registration practice and survival must be checked locally. [S1] A marriage was recorded only at the couple's request, and only for people who belonged to raskol from birth; anyone baptised in the Orthodox Church was excluded. A child could be entered only if the parents' marriage had been entered, and the law set no penalty for failing to declare an event. [S6], [S7] Do not expect this system to include every family, particularly where the parents' marriage was never registered. A church-law writer reported in 1895 that Old Believers still made little use of the law. [S8] So absence from the police register is expected: give it one row beside the Edinoverie and Orthodox books, not ahead of them. A no-hit is not evidence that the family was absent or that the event did not occur.\n- For an event after the 17 October 1906 ukaz, do not assume the police still kept the register. Keep the police row, add rows for the community registers and for the town-board and volost-board registers named in the first lead of step 8, and read the ukaz's registration clauses before you rank them.\n- A participant in the Subbotniks thread [S5] cited cases on keeping metrical books for raskolniki in TsGIA SPb: f.960 op.1 d.128 (described as a district police fond) and f.254 op.1 d.7822. These are participant-reported examples. Check them in the TsGIA SPb inventories before you cite them.","sources":["S1","S6","S7","S8","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c04ba3f88b8","kind":"method","anchor":"- At the end of each year the uezd police sent the police raskol metrical registers to the guberniya board (губернское правление) to be revised and kept; in St Petersburg and the other gradonachalstva they went to the gradonachalnik's administration, and in Moscow to the ober-politsmeister's chancellery. [S6] In the Baltic guberniyas the uezd chiefs and the police chiefs revised and kept them, and in Narva the town police administration did. [S6] ESBE says the raskol registers were kept in the guberniya board, apparently in a single copy. [S7] So, outside the Baltic guberniyas, look for a police raskol register in the guberniya-board fond of the regional archive as well as in the police fonds.","sources":["S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-615c24ded3ae","kind":"unclassified","anchor":"For every row, record: series, archive and fond/opis/delo with leaf, the registrar (Orthodox clergy, Edinoverie clergy, district office, commission, revision, police), the years covered, and the status: **searched, with result**, **searched, nothing found** or **not searched / not located**. A series you did not open, or that you could not find in the inventory, is a gap. It is not a negative result. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35fbe393d60e","kind":"unclassified","anchor":"- Link entries by the head's name and patronymic, ages, the wife's name and patronymic, children, and in-laws named in the household. Ages drift between series. A mismatch ranks a candidate lower but never excludes it. [S1], [S3]\n- Keep later annotations separate. In the example, the 1834 skazka (GASO f.8 op.1 d.712) carries pencil additions made in 1850. Date them as 1850 statements, not 1834 ones. [S1]\n- Follow the family from the raskol series into town and estate series as its status changes. In the example, the same households appear in a separate 1793 return of Shartash posad people (GASO f.24 op.23 d.6987 l.86), as meshchane in the 1811 revision (GASO f.8 op.1 d.451) and in town inhabitant lists (d.493, 1816–1818). A merchant's move into the meshchane is recorded in the 1834 merchants' skazka (GAPK f.111 op.1 d.2463). [S1]\n- When the ordinary confession roll misses a family, use the non-confessant registers to fill the gaps between revisions. [S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7fd6e18afe38","kind":"unclassified","anchor":"- Quote, for each person and date, the confession wording, the толк and any \"time of joining\" exactly as written. Never turn them into one fixed identity for the person.\n- Clerks applied labels to everyone at once. In the 1838 опись every family gets the same two entries: \"Из давна состоят в расколе\" and \"Беглопоповщинской секты\". That is the inventory's formula, not each family's own testimony. [S1]\n- Expect a household to be split. One 1857 skazka says one son with his wife and son were Edinoverie and \"а прочие все старообрядцы\". Another names two sons with their wives and children as Edinoverie and the rest as Old Believers. Record confession **per member**, not per household. [S1]\n- One person can carry different labels over time. The 1742 census says a man fell into raskol as a child under his parents' teaching. An 1849 Edinoverie marriage calls the groom \"вновь присоединившийся из раскола\". An 1886 Orthodox baptism-section entry describes a woman as a \"раскольница беглопоповщинской секты\" received by chrismation, and the marriage entry for the same day calls her \"из раскола\". Keep each label with its date and registrar. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0694411dd09a","kind":"unclassified","anchor":"Not confessing does not show Old Belief. The district non-confessant registers list households that did not come to confession, and they give no толк [S3]. A roll titled \"не исповедался\" does not name a confession either. In the 1812 roll the Old Believers sit under their own \"старообрядцы\" heading, and that heading is what identifies them [S1]. Record the listing as \"listed as non-confessant, year N\". Before you call the family Old Believer, find a dated entry that classifies it explicitly as Old Believer or raskolnik, such as a \"старообрядцы\" heading, a raskol levy or a raskol census. Record the толк only where the record states one.","sources":["S3","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-df1b62dcf863","kind":"unclassified","anchor":"A long discussion of the vital registration of Subbotniks and other sectarians [S5] reaches no settled answer, and participants themselves said the question stayed open. Keep these only as **unverified forum leads**. Check each against the legislation for the event year and against the inventories that actually survive:","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
