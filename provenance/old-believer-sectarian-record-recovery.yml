claims:
  - {"id":"C-35bd60c515fe","kind":"method","anchor":"- Fix the years, settlement and **Orthodox parish the settlement was attached to**. The 1816 Shartash register names Old Believers “числящихся в приходе” of Ekaterinburg’s Ekaterininsky Cathedral (GASO f.6 op.1 d.48) [S1]. Search the Orthodox parish inventory for separate Old Believer books under the village name.\n- Give the Edinoverie parish its own row. For Khlyzova near Shadrinsk, a forum transcription lists the village under the Nikolaevskaya church in 1812 (GASO f.6 op.1 d.421) and also names the Preobrazhensky cathedral. The 1870–1871 clergy register of the Troitskaya Edinoverie church (GASO f.37 op.4 d.89) lists its own households by village. Use it to identify which church served the Edinoverie households [S4].\n- Find out when the Edinoverie parish was founded. The 1902 diocesan parish history *Приходы и церкви Екатеринбургской епархии* says Shadrinsk Edinoverie believers first went to the Ekaterinburg Edinoverie church, then to Sosnovskoe village, and formed their own parish only in 1839. Add those earlier churches' books for the earlier years to the checklist. [S4]","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1078af9f808a","kind":"unclassified","anchor":"Survival and arrangement vary by region and fond. The Ekaterinburg/Shartash series below are **worked examples**. Use them to know what kinds of series to look for, then confirm each one against the inventory (опись) of your own regional archive. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9d230431fc34","kind":"method","anchor":"| Series (worked example) | Example locator | What it records |\n| --- | --- | --- |\n| 1727 commission roll / poll-tax account with a separate raskol levy, re-examined 1734 | GASO f.34 op.1 d.14 (l.53, l.55об) | Raskolniki registered by the 1727 commission, ages, the poll tax plus 70 kopecks \"за раскол\", the 1734 re-examination, arrears [S1] |\n| 1742 census of raskolniki by Lieutenant-Colonel Shishkov, copying the 1735 roll | GASO f.24 op.1 d.1000 (l.11 ff.) | Separate groups \"с пашпортами\" and \"записные по комисии\"; a note on how and when each person \"в раскол впал\" [S1] |\n| 1747 revision skazki | GASO f.24 op.1 d.548a (l.16, l.22); parallel register RGADA f.350 op.2 d.899 | Compare the double assessment with the earlier commission rolls. One entry refers back to inclusion in both the poll-tax and raskol assessments in 1727 and 1735 [S1] |\n| 1752 roll of raskolnik children born after the revision | GASO f.24 op.1 d.1370 l.148 | Children by father, with ages [S1] |\n| Raskol skazki in a delo titled for 1765, with a copy of the order for unregistered \"потаенным раскольникам\" to submit skazki and be put \"в двойной расколнической оклад\" | GASO f.34 op.1 d.187 (order l.201, with a receipt note dated 7 June 1764; Shartash from l.216) | Whole households with ages [S1] |\n| Confession rolls: \"не исповедался\" rolls and \"старообрядцы\" sections | GASO f.24 op.23 d.6987 (1793), d.7078а (1807), d.7081 (1812) | Household lists. The 1812 roll has a \"Купцы и мещане старообрядцы\" section (l.44) and a separate roll of Shartash merchants and meshchane \"состоящих в старообрядчестве\" (l.51об) [S1] |\n| Yearly district registers of non-confessants (ведомость ... о неисповедавшихся) | GASO f.24 op.1 d.2293 (1768–1770, Ekaterinburg zakaz) | Households with ages, village by village, between revisions [S3] |\n| 1838 опись раскольникам Шарташского селения и их женских скитов | GASO f.6 op.2 d.479 ч.2 | Columns \"время уклонения в раскол\" and \"какого толка\" [S1] |\n| \"Книги записные перемен\" / metrical books of Old Believer villages, filed under the Orthodox parish | GASO f.6 op.1 d.8 (1805), d.45 (1809), d.48 (1816), d.50 (1818); f.6 op.3 d.147ст=d.287нов (1807), d.306 (1814), d.311 (1819), d.318 (1821) | Old Believer births, marriages and deaths [S1], [S2] |\n| Edinoverie church metrical books | GASO f.6 op.1 d.101 (1845); f.6 op.3 d.224 (1849–1850); f.6 op.1 d.197 (sixteen Edinoverie churches, 1862–1866) | \"единоверческаго вероисповедания\"; \"вновь присоединившийся из раскола\" [S1], [S2] |\n| Orthodox metrical books, \"присоединившаяся\" entries in the baptism section | GASO f.6 op.7 d.228 (Свято-Троицкая church, Shartash, 1886, l.65об, l.70об) | Reception from a named толк by chrismation [S1] |\n| Police raskol metrical registers, 1874 to the 1906 ukaz | Not in the worked example; see step 3 | Births, marriages and deaths of raskolniki |\n| Register of people converted from raskol to Edinoverie, 1836 | GASO f.6 op.1 d.76 l.27 (in the delo of Edinoverie church metrical books, 1836–1841) | Conversions [S2] |","sources":["S1","S3","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-835700202e4b","kind":"unclassified","anchor":"Inventory-reading rules from GASO f.6 op.1 [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7239460fc5f9","kind":"method","anchor":"- In this fond, Old Believer village books sit inside dela whose headings name ordinary churches. d.8 is headed as the 1805 metrical book of the Предтеченская church of Щелкунская слобода, and the second line of its description adds the Екатерининская church's \"записные книги\" for the Old Believer villages of Shartash, Stanovaya and Sarapulka for 1805. In d.45 the 1809 \"записные книги\" for the Old Believer villages of Sarapulka and Stanovaya come first (l.1), ahead of the town churches' 1809 books. Read the whole delo description, not just the heading. In other regions, check whether the same arrangement holds.\n- In this fond, Edinoverie books are gathered into multi-year, multi-church dela outside the year-by-year volumes (d.197 covers sixteen Edinoverie churches for 1862–1866). Search the inventory for \"единоверческ\" and do not stop at the volume for your year.\n- A place appears under different church forms over time. The 1840 volume d.93 has a \"Часовни Шарташского селения\" (l.779), and later volumes have the Свято-Троицкая church of Shartash (d.192 for 1862, d.258 for 1873). Give each one a separate row.\n- Record old and new delo numbers together where the transcription gives both. The 1807 book is cited as f.6 op.3 d.147ст=d.287нов. [S1]\n- Inspect the leaves attached to an 1857 revision. GASO f.8 op.1 d.1777, ll.530–531 includes certificates from the Spasskaya and Troitskaya Edinoverie churches. One distinguishes a June 1848 birth from a June 1849 baptism [S1]. Copy both dates and follow each certificate back to the issuing church’s register.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6cf8f7cd7e88","kind":"historical","anchor":"- The law of 19 April 1874 required the police to keep metrical books of the births, marriages and deaths of raskolniki. For any event from 1874 up to the 17 October 1906 ukaz on Old Believer and sectarian communities, give its own row to the police raskol metrical register of the town or uezd where the family lived. Look for it in the police fonds of the regional archive, not only in the consistory fond. Keep the Orthodox and Edinoverie books in the search too: the worked example from the inspected section includes reception from Old Belief in Orthodox books, and registration practice and survival must be checked locally. [S1] A marriage was recorded only at the couple's request, and only for people who belonged to raskol from birth; anyone baptised in the Orthodox Church was excluded. [S6], [S7] In general, a child could be entered only if the parents' marriage had been entered. Exceptions covered children born after the tenth revision to couples listed there as husband and wife (1874 opinion II.1–2), children of pre-1874 lasting unions under the parents' rite, not barred by the cited civil-law rules, when one or both spouses had died and their marriage could not be entered (II.4), and births before 19 April 1876 preceding a later-entered marriage (§15 note), subject to the respective provisions' declarations and proof by at least two witnesses of descent and birth date, including the children's belonging to raskol from birth in II.2 and II.4 and the qualifying union and death in II.4. [S6] The law set no penalty for failing to declare an event. [S7] Do not expect this system to include every family. Not finding the marriage entry does not prove it was never entered: §18 allows an extract from the marriage register, and the exceptions also permit some children to be entered without a prior police marriage entry. [S6] Within the inspected section of an 1895 article, a church-law writer reported that Old Believers still made little use of the law. [S8] So absence from the police register is expected: give it one row beside the Edinoverie and Orthodox books, not ahead of them. A no-hit is not evidence that the family was absent or that the event did not occur.\n- For an event after the 17 October 1906 ukaz, do not assume the police still kept the register. Keep the police row, add rows for the community registers and for the town-board and volost-board registers named in the first lead of step 8, and read the ukaz's registration clauses before you rank them.\n- In post 65 on page 4 of the Subbotniks thread, a participant gives two TsGIA SPb leads: f.960 op.1 d.128 on entering information about raskolniki in the registers, and f.254 op.1 d.7822 on keeping their registers [S5]. Check the inventories for the file titles and dates. The descriptions concern registration practice; the presence of a register for a specific Subbotnik family still needs verification.","sources":["S1","S6","S7","S8","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20105afe5849","kind":"method","anchor":"- At the end of each year the uezd police sent their raskol metrical registers to the guberniya board (губернское правление) to be revised and kept; in St Petersburg and the other gradonachalstva they went to the gradonachalnik's administration, and in Moscow to the ober-politsmeister's chancellery. [S6] In the Baltic guberniyas the uezd chiefs and the police chiefs revised and kept them, and in Narva the town police administration did. [S6] The Brockhaus and Efron encyclopedia says the raskol registers were kept in the guberniya board, apparently in a single copy. [S7] So look for a police raskol register in the fond of the body that kept it, usually the guberniya board, as well as in the police fonds.","sources":["S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-615c24ded3ae","kind":"unclassified","anchor":"For every row, record: series, archive and fond/opis/delo with leaf, the registrar (Orthodox clergy, Edinoverie clergy, district office, commission, revision, police), the years covered, and the status: **searched, with result**, **searched, nothing found** or **not searched / not located**. A series you did not open, or that you could not find in the inventory, is a gap. It is not a negative result. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35fbe393d60e","kind":"method","anchor":"- Link entries by the head's name and patronymic, ages, the wife's name and patronymic, children, and in-laws named in the household. Ages drift between series. A mismatch ranks a candidate lower but never excludes it. [S1], [S3]\n- Date later annotations separately. Beside a household in the 1834 return (GASO f.8 op.1 d.712, ll.39–40об), pencil additions attributed to 1850 include a death in 1849 [S1]. Distinguish the household as recorded in 1834 from the later update.\n- Follow changes in estate as well as confession. For Shartash, compare the 1793 posad return (GASO f.24 op.23 d.6987 l.86), the 1811 meshchane revision (GASO f.8 op.1 d.451) and the 1816–1818 inhabitant lists (d.493). The 1834 merchants’ return (GAPK f.111 op.1 d.2463) records a transfer to the meshchane [S1]. Use the transfer to identify the next estate series.\n- When the ordinary confession roll misses a family, use the non-confessant registers to fill the gaps between revisions. [S3]","sources":["S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7fd6e18afe38","kind":"method","anchor":"- Quote, for each person and date, the confession wording, the толк and any \"time of joining\" exactly as written. Never turn them into one fixed identity for the person.\n- Compare neighbouring entries before treating a label as family testimony. The Shartash inventory of 1838 repeats “Из давна состоят в расколе” and “Беглопоповщинской секты” across households [S1]. Attribute the wording to the inventory.\n- Record confession **per member**. In an 1857 return the elder Petr Shaposhnikov, his wife and their son are identified as Edinoverie and the others as Old Believers. A second return assigns Edinoverie to two sons and their families [S1]. Keep the scope of each qualification with the named people.\n- Keep the date, registrar and person with each label. A 1742 census describes childhood instruction by parents. An 1849 Edinoverie marriage calls the groom “вновь присоединившийся из раскола”. In 1886 one woman’s reception by chrismation and her marriage on the same day occur in different sections (GASO f.6 op.7 d.228, ll.65об, 70об) [S1]. Compare both entries before interpreting the shorter marriage wording “из раскола”.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0694411dd09a","kind":"method","anchor":"Not confessing does not show Old Belief. The district non-confessant registers list households that did not come to confession, and they give no толк [S3]. A roll titled \"не исповедался\" does not name a confession either. Check the heading on the leaf itself: the 1812 roll distinguishes Old Believer merchants and meshchane at l.44 and the Shartash return at l.51об (GASO f.24 op.23 d.7081) [S1]. Record the listing as \"listed as non-confessant, year N\". Before you call the family Old Believer, find a dated entry that classifies it explicitly as Old Believer or raskolnik, such as a \"старообрядцы\" heading, a raskol levy or a raskol census. Record the толк only where the record states one.","sources":["S3","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-df1b62dcf863","kind":"unclassified","anchor":"A long discussion of the vital registration of Subbotniks and other sectarians [S5] reaches no settled answer, and participants themselves said the question stayed open. Keep these only as **unverified forum leads**. Check each against the legislation for the event year and against the inventories that actually survive:","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5cf2057ffc59","kind":"method","anchor":"- A participant quoted a wiki summary saying that from 1905–06 the communities' own clergy, or town boards and volost boards, took over the metrical registration of raskolniki and sectarians. Another participant called the summary unclear.\n- A participant suggested that deaths of sectarians may have been certified by different officials from births and marriages, so they may sit in another fond. The participant said they were not sure.\n- A participant suggested RGIA fonds 796, 797, 821 and 1284, plus governor's chancery and police fonds, for case files on sects. The same participant warned that these bodies did not necessarily keep name lists.\n- Follow the registrar named in an entry. The forum reports a synagogue register using “из сектантов субботников”, a marriage certificate from the spiritual board at stanitsa Mikhailovskaya, and an 1839 consistory enquiry that collected papers from the parties’ former places of residence [S5]. Verify the wording, issuing body and prior locality against each original before attributing a confession.","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
