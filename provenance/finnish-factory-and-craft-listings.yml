claims:
  - {"id":"C-01","kind":"method","anchor":"For named establishments around the end of 1843, open *Finlands Allmänna Tidning* on 31 December 1845 and both *Borgå Tidning* installments on 15 and 18 January 1845. In *Borgå Tidning*, look for businesses, worker counts and production values. Keep the dates in the tables separate from the issue dates [S1] [S2] [S3] [S4].","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For Hall-Rätten totals, consult the summaries in *Finlands Allmänna Tidning* on 10 October 1848 and 9 December 1850. For the latter, also check the Manufakturdirektionen report in the same issue. Read the table headings for the reporting year and scope before using a total in a named-factory search [S1] [S5] [S6].","sources":["S1","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"For a factory in 1850, open the 1853 first part of Gabriel Rein’s *Statistisk teckning af storfurstendömet Finland* at printed page 149. In the Uusimaa returns look for the permit date, number of masters and workers, and production value. Log which details the return gives for the province you are tracing [S1] [S18].","sources":["S1","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For Helsinki and nearby establishments at the end of 1851, read both *Maamiehen Ystävä* issues on 1 and 8 May 1852. For establishments under the Helsinki Hallrätten in 1852, use *Teknisk tidskrift*, issue 5 of 1853. For a Helsinki owner in 1855, check *Finlands Allmänna Tidning* of 12 December 1856 [S1] [S7] [S8] [S9] [S10].","sources":["S1","S7","S8","S9","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"In the 1864 *Beskrifning öfver storfurstendömet Finland*, browse past the totals to the list of largest factories. For a directory lead, search *Finlands handelskalender* in its 1871, 1876 and 1883 editions, tracking the result for each edition separately [S1] [S14] [S15] [S16] [S17].","sources":["S1","S14","S15","S16","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"For industrial context in 1856–1857, follow the *Sanomia Turusta* account of 1 February 1859 to both *Finlands Allmänna Tidning* installments of 14 and 15 January 1859 and then to the Manufakturdirektionen annual report. Record the source chain before counting the newspaper accounts as independent evidence [S1] [S11] [S12] [S13].","sources":["S1","S11","S12","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"portal-availability","anchor":"For 1858–1860 and 1871–1873, use the respective Manufakturdirektionen report records in Statistics Finland’s Otos repository. Open the linked report for the period and check the table headings before using a figure [S1 @2026-11-23] [S19 @2026-11-23] [S20 @2026-11-23].","sources":["S1","S19","S20"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"Use Bergh and Forsgren’s 1904 *Helsingin käsityö- ja tehdasolojen matrikkeli* for its review of early Helsinki factories. Search for a nineteenth-century practitioner within pages 153–335, including the additions beginning on page 301. Keep activity and its end date open when the register omits the person or the date [S1] [S21].","sources":["S1","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"For someone who held office in the Helsinki Craft and Factory Association, check the separate biographical section on pages 245–300 [S1] [S21].","sources":["S1","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
