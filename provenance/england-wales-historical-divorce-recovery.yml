claims:
  - {"id":"C-cf4c18e5632a","kind":"historical","anchor":"For cases under the 1857 Act, look for a civil court petition from 1858 onward. Record the remedy sought. Distinguish a petition for judicial separation from one seeking dissolution and look for the court's decision on the particular remedy. [S3] [S5]","sources":["S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bea029576a6f","kind":"platform-ui","anchor":"Search the MyHeritage index for 1858–1937 by a spouse’s name and approximate year, then try the other spouse or add the spouse field to distinguish hits. Copy the listed names, stated year and any reference. Record any named corespondent as a separate party. [S1 @2026-11-22] [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6f43ce4a9fdb","kind":"platform-ui","anchor":"Search Ancestry’s J 77 collection for cases in its stated 1858–1918 range. Use the court file number if the index gives one. Record the full archival reference and compare the parties and case dates when opening the papers. [S6 @2026-11-22]","sources":["S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-52d4c59f47c4","kind":"historical","anchor":"Carry gaps in that search to the relevant year in the original archive series J 77 and check the limited index in J 78. When only a newspaper report or petition is available, record the case as unresolved and carry its date and parties forward to look for the decree. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-876748500b61","kind":"method","anchor":"Record the petitioner, respondent and any corespondent separately. A corespondent named under the 1857 Act is a party accused of adultery. Capture the allegation and the court's finding separately. Date the petition, decree nisi and decree absolute from the papers that establish each stage. [S3] [S5]","sources":["S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-58c527003fd0","kind":"historical","anchor":"For a wife’s early petition under the 1857 Act, read the pleaded grounds against section 27 as enacted. For petitions relying on the 1923 Act, check whether the alleged adultery was after both the marriage and the passing of that Act. The 1923 Act allowed qualifying adultery alone as a ground for a wife. Keep the facts alleged and the disposition separate. [S3] [S4] [S5]","sources":["S3","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
