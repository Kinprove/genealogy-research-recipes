claims:
  - {"id":"C-af3690793431","kind":"portal-availability","anchor":"Open the Massachusetts Archives trial collection for the relevant warrant, examination, deposition and other surviving records. Separate a witness's claimed apparition from a witness's account of the accused in person and from the accused's confession. Check which type of evidence the court heard and where the record shows it being accepted or acted on. [S2 @2026-11-22]","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-604f9c9dcd24","kind":"method","anchor":"According to the presenter in the available excerpt, test whether children reporting apparitions heard suspicions from adults or other children first [S1†]. Date the statements and look for shared information before treating them as independent corroboration.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7bd710e09ea5","kind":"method","anchor":"Read an examination for any claimed bodily marks as an examiner's observation and a period belief. For a confession, check the conditions of the examination and compare any later statement by the person about coercion, fear or retraction. The declaration of the Andover accused gives their account of how fear and questioning affected their confessions. [S2] [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-331c6f64380e","kind":"method","anchor":"When a later account calls an execution a burning, verify the disposition for the individual. For Salem, distinguish an execution by hanging, the recorded death by pressing, and deaths in custody. Search for the record of the outcome even if a sentence survives. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
