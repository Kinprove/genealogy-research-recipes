claims:
  - {"id":"C-c86a7057b981","kind":"custody","anchor":"Look in *Channel Islands, Jersey, Occupation Registration Cards* for an index lead, then use Jersey Archive’s guide for the registration cards, series D/S/A. The title refers to German occupation. Read the resident’s occupation as a separate entry. Record birth date and place, residence and occupation as given, keeping any updates distinct from the initial entry. [S1 @2026-11-21] [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1d8905eb2eba","kind":"historical","anchor":"Search for a child under fourteen on the father’s card before treating a missing card as a residence gap. Children below the registration age could appear on the back of the father’s card. Check for a separate card after the child turned fourteen. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
