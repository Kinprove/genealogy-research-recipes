  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/websites/fact-check-find-a-grave/"],"published":"2025-10-16","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s distinction between suggestions and a request to take over management.","entry_sha256":"a3648709ab1acfba014a9e4900bc4e6c22eb2eb9874f378a11bcdb6e6442d314","claims":["C-01","C-02"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933460430995-Sending-Suggest-Edits-and-Notes"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Site instructions for proposing edits, providing a note and sending a suggestion to the manager.","entry_sha256":"b469ba53ec0e0ff07e98274ae7578c82f41f49fb38c6be86267d476f4bb79eb6","claims":["C-01"],"review":"reviewed"}
  - {"id":"S3","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933435435283-Request-to-Manage"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Site instructions distinguish member-managed memorials and those managed by Find a Grave and describe transfer guidelines.","entry_sha256":"a8e6a9a43c756a8af1bd94cd8f67497369e666c68f7f2f2dd45c364622b66706","claims":["C-02","C-03"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Open **Suggest Edits** on the memorial. Fill in the affected fields and use **Save Suggestions** to send the proposed changes to the manager. Keep the proposed fact, evidence and submission status distinct from the memorial’s displayed content. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"For a member-managed memorial, open **Suggest Edits** and use **Contact Manager** to request transfer, after checking the site’s transfer guidelines for the relationship. Give the relationship and reason through that route. [S1 @2026-11-18], [S3 @2026-11-18]","sources":["S1","S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"For a non-famous memorial managed by Find a Grave itself, use **Request to Manage** from **Suggest Edits**. Keep the two routes distinct when deciding where to make the request. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
