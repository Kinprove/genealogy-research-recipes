sources:
  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/websites/fact-check-find-a-grave/"],"published":"2025-10-16","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s distinction between suggestions and a request to take over management.","entry_sha256":"a3648709ab1acfba014a9e4900bc4e6c22eb2eb9874f378a11bcdb6e6442d314","claims":["C-01","C-02"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933460430995-Sending-Suggest-Edits-and-Notes"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Site instructions for proposing edits, providing a note and sending a suggestion to the manager.","entry_sha256":"b469ba53ec0e0ff07e98274ae7578c82f41f49fb38c6be86267d476f4bb79eb6","claims":["C-01"],"review":"reviewed"}
  - {"id":"S3","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933435435283-Request-to-Manage"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Site instructions distinguish member-managed memorials and those managed by Find a Grave and describe transfer guidelines.","entry_sha256":"a8e6a9a43c756a8af1bd94cd8f67497369e666c68f7f2f2dd45c364622b66706","claims":["C-02","C-03"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://familytreemagazine.com/cemeteries/the-dos-and-donts-of-find-a-grave/"],"published":"2025-09-23","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The author recommends using memorial IDs to link relatives and keeping a contact route open for transfer requests. Find a Grave’s help describes the link direction and distinguishes profile contact settings from the memorial’s Contact Manager form.","entry_sha256":"208dd64ecdb3744a6f1c7542ec7ee903070113734c634f7cb6050c66bca82247","claims":["C-06","C-10"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933375214355-Family-Members"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Site instructions identify the Memorial ID, the parent and spouse fields, the direct and suggested edit paths, and how child links and spouse links display reciprocally.","entry_sha256":"d8e5d9e22905ae38c05839c584e76839a1550ecc5149ae10bf2c3de8fb3e2121","claims":["C-06","C-07"],"review":"reviewed"}
  - {"id":"S6","kind":"video","urls":["https://www.youtube.com/watch?v=Ruj0khFhjYQ"],"published":"2025-09-26","retrieved":"2026-11-22","access":"partial","rights":null,"basis":"Read supplied transcript excerpts 2026-11-22. The video page did not open. The excerpts show Sunny Jane Morton demonstrating family links, document images through Add Photos and the Contribute route to sent edits. Find a Grave’s help documents the current procedures.","entry_sha256":"22b91a5439c7527368c27139a57c7df8ef1edc353fffbec9c0d1c572d55921d1","claims":["C-05"],"review":"reviewed"}
  - {"id":"S7","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933424659475-Suggest-Edits"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Site instructions cover suggested field changes, Save Suggestions and the sent-edit queue, including lookup by memorial ID.","entry_sha256":"2b3312f489c40e70c9c59bfccb267422d3d81dd84502c70a2018829ca4b88940","claims":["C-04","C-06"],"review":"reviewed"}
  - {"id":"S8","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933343565459-Management-Questions"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Site instructions locate the Suggested Edits screen on Contribute and at the pencil icon.","entry_sha256":"742c6bc0b3c0eb3fe055b24a0f4d2658cf048e4f4af4343ba2e8c075f76339be","claims":["C-04"],"review":"reviewed"}
  - {"id":"S9","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933375335059-Add-a-Photo"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Site instructions cover selecting and uploading an image from a memorial page and explain how the contributor is credited.","entry_sha256":"5051b387f32de75ded20105ae8aad967f677bb3625197ccb82d8a96b3178c907","claims":["C-08"],"review":"reviewed"}
  - {"id":"S10","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933315325459-Types-of-Photos"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The site lists documents related to the person under the Other photo type.","entry_sha256":"0655513b7c97d346534bac63eaa47af51a2f38e82ab9943f29d97d552aadf82c","claims":["C-08"],"review":"reviewed"}
  - {"id":"S11","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933329123731-Account-Settings"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Site instructions cover enabling profile messages, changing the account email and controlling its display.","entry_sha256":"eaba2fd0acb7fd841447551bbd88bf0d4bb7325edb6503c2c66939ef5c6a2190","claims":["C-10"],"review":"reviewed"}
  - {"id":"S12","kind":"help-page","urls":["https://support.findagrave.com/hc/en-us/articles/53933408684947-Profile-Pages"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Site instructions distinguish profile messaging and optional email display from the memorial’s Contact Manager form, which can still carry a transfer request when both profile routes are off.","entry_sha256":"db136ed71fb6385e391b5fe4eb3f336d016075490faed94f0dace33747e9d607","claims":["C-09","C-10"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Open **Suggest Edits** on the memorial. Fill in the affected fields and use **Save Suggestions** to send the proposed changes to the manager. Keep the proposed fact, evidence and submission status distinct from the memorial’s displayed content. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"For a member-managed memorial, open **Suggest Edits** and use **Contact Manager** to request transfer, after checking the site’s transfer guidelines for the relationship. Give the relationship and reason through that route. [S1 @2026-11-18], [S3 @2026-11-18]","sources":["S1","S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"For a non-famous memorial managed by Find a Grave itself, use **Request to Manage** from **Suggest Edits**. Keep the two routes distinct when deciding where to make the request. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"Before resubmitting, open **Suggested Edits** from **Contribute** or from the pencil icon. Choose **Suggestions I’ve Sent** and locate the edit by memorial ID under **More options**. Check its status there. [S7 @2026-11-22], [S8 @2026-11-22]","sources":["S7","S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"example","anchor":"The tutorial example from the available excerpt starts at **Contribute**. [S6]","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"For a supported parent or spouse relationship, copy the destination **Memorial ID** from its burial details. On the memorial to update, open **Edit** if you manage it or **Suggest Edits** if someone else manages it. Enter that ID in the appropriate parent or spouse field under **Family Members**. Use **Save Changes** on a memorial you manage or **Save Suggestions** to send the link to the manager. [S4 @2026-11-22], [S5 @2026-11-22], [S7 @2026-11-22]","sources":["S4","S5","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"platform-ui","anchor":"To show children on a parent’s memorial, enter the parent’s ID on each child’s memorial. Find a Grave displays the link on the parent’s memorial once the child’s memorial links to it. A single spouse link appears on both spouses’ memorials. [S5 @2026-11-22]","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"platform-ui","anchor":"For a relevant document image you have permission to publish, open **Add Photos** on the memorial. Select the image, choose **Other** as the photo type and select **Add**. [S9 @2026-11-22], [S10 @2026-11-22]","sources":["S9","S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"platform-ui","anchor":"Members can use **Contact Manager** from the memorial even when your profile has neither messaging nor a displayed email address. [S12 @2026-11-22]","sources":["S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"platform-ui","anchor":"To offer an additional route for transfer requests, enable **Messages** under **Account Settings → Notifications** and keep **Display my Email** off in **Edit Profile** if you want to keep the address private. If you choose to list a dedicated email address, update it under **Account Settings → Email** and turn on **Display my Email** in **Edit Profile**. [S4 @2026-11-22], [S11 @2026-11-22], [S12 @2026-11-22]","sources":["S4","S11","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
