claims:
  - {"id":"C-8673e21e4661","kind":"portal-availability","anchor":"Search MyHeritage’s England, Durham Home Guard index for service in the county in 1940–1945. Compare the birth date, birthplace and battalion if indexed [S1 @2026-11-22]. Search the identified candidate in The National Archives’ Discovery catalogue within WO 409 and retain the full item reference [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-82ae9989b466","kind":"custody","anchor":"For a unit outside Durham, follow the general Home Guard route linked by the Ministry of Defence. The Durham index covers service in that county, so a miss there leaves other Home Guard service open [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b7166fd1255a","kind":"method","anchor":"Check the enrolment form’s birth information, service address, enlistment, battalion and earlier military service where given. Record each service episode under its own unit. The enrolment material can identify a posting but leaves day-to-day duties unresolved [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
