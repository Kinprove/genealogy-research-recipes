claims:
  - {"id":"C-517d0ed6ff79","kind":"unclassified","anchor":"Where Geneteka supplies a **SKAN** link, follow it and inspect the destination's register\ndescription and actual entry. If the link is absent or fails, keep the row as an index lead and\nrecord the failure. The absence of that link establishes no absence in other image portals or\nthe holding archive. The Polish-records guide demonstrates both Geneteka's scan links and a\nsubsequent Search the Archives route. [P1]","sources":["P1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc5b418e068c","kind":"unclassified","anchor":"Before you trust a Geneteka row or a miss, set the search to fit the lead. For the former eastern\nlands, select the **Ukraina**, **Białoruś** and **Litwa** territories as well as the modern\nvoivodeships, and check coverage for each act type. To find a person as a parent, leave\n**Nie wyszukuj w rodzicach** (do not search parents) unticked; a child's birth row is not the\nparent's birth. Use **Wyszukaj jako para** (search as a couple) for a couple.\n**Wyszukaj również w pobliskich parafiach (15km)** adds nearby parishes; a hit there does not place\nthe person in that parish. Some indexed data has no available scans. [O2], [O3], [O4]","sources":["O2","O3","O4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3d0ca781b51d","kind":"unclassified","anchor":"A results page read with a fetch or HTML tool can show the column headers and no rows, even for a\nvery common surname; one such fetch on 2026-11-02 also showed no result counter. Check the loaded\nrows and the counter in a real browser, and never log NIL from such a fetch. [O3]","sources":["O3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4bbbb2bc8842","kind":"unclassified","anchor":"A Geneteka miss does not exhaust the Polish indexes. Search the regional projects whose area fits\nthe parish: Poznań Project (Wielkopolska marriages, 1800–1899), BaSIA (western Poland), Lubgens\n(Lublin region), Projekt Podlasie (Podlasie and Mazovia), GENEO at JZI (Suwałki and Augustów\narea), Świętogen (Kielce region), PomGenBaza (Pomerania) and JRI-Poland (Jewish records).\nGeneszukacz checks a surname only across Geneteka and three other Polskie Towarzystwo\nGenealogiczne lists (1918–1920 soldier lists and the 1926 Polish declaration for the United\nStates); it does not search the regional projects. Log each project searched and its coverage for\nthe parish before you record NIL. [O5], [O6], [O7], [O8], [O9], [O10], [O11], [O12], [O13]","sources":["O5","O6","O7","O8","O9","O10","O11","O12","O13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5904dba4ee68","kind":"unclassified","anchor":"Search every form of a woman's surname. A surname ending in a consonant other than -g takes -owa for a wife and\n-ówna for a daughter (Nowakowa, Nowakówna); one ending in a vowel or -g takes -ina/-yna and -anka\n(Konopczyna, Konopczanka); -ski becomes -ska. [P4], [P6] A maiden name is written z + genitive\nplural: \"z Kowalskich\" means née Kowalska. The same construction can name a place of origin, so\nread the plural family-name form before taking it as a maiden name. [P5] If an indexed maiden name\nmatches no known surname, open the image for a misread \"z …\" phrase, then search the rebuilt base\nform and the indexed form as separate lanes.","sources":["P4","P6","P5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a5971acaa1be","kind":"unclassified","anchor":"A name joined by \"vel\" or \"alias\" (Nowak alias Vilk) is a second name of the same person, not a second\nperson, and records may show either name alone. Search each element and the compound, copy the\ncompound as written, and do not treat a switch from one element to the other as a new family\nwithout looking for the joined form. [P5], [P6], [P7]","sources":["P5","P6","P7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8980b5f2b74c","kind":"unclassified","anchor":"In Szukaj w Archiwach, use **Search vital records** to investigate the relevant registration\nlocality. Inspect the returned years, confession, record type and holding archive. A parish or\nregistry-office seat can be the catalog locality even when the person lived elsewhere. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c4a3a696f666","kind":"unclassified","anchor":"Alternatively, the documented direct search uses **Akta stanu cywilnego** plus locality, with\nthe parish or synagogue district where supported. The official examples distinguish a Roman\nCatholic parish from an **Okręg Bożniczy**, a synagogue district. Select the series that fits\nthe lead; do not substitute a modern municipal name for the record creator. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7dc7bd12a855","kind":"unclassified","anchor":"Treat PRADZIAD as a finding aid. Search it inside Szukaj w Archiwach: choose **PRADZIAD**\nin the document-type list, or use **Search vital records**, whose rows carry PRADZIAD description\nfields. Its descriptions can identify locality, confession, years, record type and archive;\n**PRADZIAD does not contain scans**. To investigate scans, follow\nthe supplied reference code into the archival fonds, then open **List of files**. The official\ninstructions say that the file list shows available units and scan counts. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-54b4e9d71a72","kind":"unclassified","anchor":"For the Akta Stanu Cywilnego (ASC, the civil-status registers kept by each confession) that AP\nKatowice describes, the duplicates went to the competent local courts from the early nineteenth\ncentury, and the state archive now holds them. [O14] Record which copy an\nimage or index row comes from. Before you call an entry unreadable or unannotated, look for the\nother copy and record its custodian.","sources":["O14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f51860130030","kind":"unclassified","anchor":"Do not infer the parish's location from the city of the holding archive. A [Polish\narchive-holdings discussion](https://forum.j-roots.info/viewtopic.php?f=165&t=470) shows that a\nregister answered by a Warsaw archive came from an Archiwum Główne Akt Dawnych (AGAD) inventory of\nregisters from the \"eastern territories\", not from a Warsaw parish. Identify the fonds, its\ninventory and the unit signature, and treat the parish's location as unresolved until that\ndescription or another source places it. Record whether the signature has scans. The source covers\nonly this inventory, not AGAD's full scope or current scan coverage. [C1] For Eastern Galician\nmetrical books in Lviv (TsDIAL) and Warsaw (AGAD), see\n[Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).","sources":["C1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8053df1151c9","kind":"unclassified","anchor":"For a marriage in an ASC fonds from the Congress Poland civil-status system, check the fonds'\n**List of files** for a separate annexes unit (alegata) for the same year as well as the\nregister. The annexes hold the dated supporting papers, such as birth extracts and banns\ncertificates, whose content the register entry leaves out. Cite each paper as its own source with\nits own date, and do not use any of them as the marriage date. Where the parish kept only church\nmetrical books, as in the former Russian western provinces, do not expect an alegata unit.\n[O16], [P10], [P11], [P12]","sources":["O16","P10","P11","P12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f6b48b44aff5","kind":"unclassified","anchor":"When Metryki covers the relevant register, the demonstrated route is region → parish → available\nyears/record type → scans. The tutorial follows those choices into a register image; this is\na second retrieval route, not a promise that every Polish parish is included. [P2]","sources":["P2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a0d3b2e91446","kind":"unclassified","anchor":"If the central portal does not expose the image, check the holding archive's own digital portal.\nThe Eastern European research interview specifically describes regional Polish archival portals\nwith digitized material not yet integrated into the central portal. Check the current regional\ncatalog rather than assuming that this historical observation applies to every archive. [P3]","sources":["P3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-28f95b43f47b","kind":"unclassified","anchor":"In Szukaj's vital-record results, **no fonds** means that the fonds is currently unavailable on\nthat website. It does not mean the archival documents never existed. If the needed unit has no\nonline image, preserve its reference and prepare an image/copy request to the identified holder;\ncontact remains a separately authorized action. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-973307078982","kind":"unclassified","anchor":"For a 20th-century civil-status register, do not assume the state archive is the holder. A\n[civil-registry custody discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) reports\nthat many such books are still held by the local civil registry office (Urząd Stanu Cywilnego).\nWhen the archive's catalog shows no unit for a recent year, check the current USC custody for that\nlocality before sending the request. Do not label the record missing. [C2]","sources":["C2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cbcc73fcf744","kind":"unclassified","anchor":"The Civil Status Records Act (Prawo o aktach stanu cywilnego, Dz.U. 2014 poz. 1741) sets the\ntransfer rule for books kept before 1 March 2015. The USC passes a book to the competent state\narchive 100 years after the birth book was closed, and 80 years after the marriage or death book was\nclosed. When one volume holds several books, the period runs from the closing of the last of them\n(art. 128(1)). A book whose period ended after 1 March 2015 goes to the archive within two years after\nits period ends (art. 129(3)). A birth or marriage book stays at the USC longer while a person entered in\nit has no death act or registered death; if that person has no PESEL number, the USC may transfer\nthe book anyway (art. 128(1a)–(1b)). [O17]","sources":["O17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c43e3cc5bab1","kind":"unclassified","anchor":"So a book older than 100 or 80 years can still be at the USC. Once the period, including that\nextension, has run out, the USC issues no certificate (odpis) from the book. Until it transfers the\nbook, it gives access under the archives act (art. 130(3)–(4)). [O17]","sources":["O17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d8defb4eb7ea","kind":"unclassified","anchor":"Ask the USC that holds the book for access to the named book and entry, and record whether it\ngranted access or refused. [O17]","sources":["O17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ead86ef3d59d","kind":"unclassified","anchor":"For a Congress Poland (Kingdom of Poland) civil-registration register, expect Polish entries until the end of 1867.\nA regulation required Russian from 1 January 1868, so expect Russian from 1868 and confirm it\nfrom the language of each transition year's entries and its index. Do not expect a Latin-to-Russian switch in these registers. [P8], [P9] Use the year's language to choose the search spelling\nand to judge whether a Cyrillic or index spelling re-transliterates a Polish original.","sources":["P8","P9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3183b3533ba2","kind":"unclassified","anchor":"When preparing the request, give the surname in both Polish and Russian (Cyrillic) forms. List the\nknown spelling variants and ask explicitly for similar-sounding names to be checked. A [Polish\narchive-request discussion](https://forum.j-roots.info/viewtopic.php?f=165&t=470) advises explicitly\nasking for those variants, from one participant's exchanges with three archives; this is not a\nuniversal archive policy. Treat a match on a variant as a candidate, not as an\nidentity. [C1]","sources":["C1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a545b6be9fb3","kind":"unclassified","anchor":"When the vital-record route stops and you turn to printed context, Polona, the National Library of\nPoland's digital library, holds digitised books, periodicals and daily newspapers (browsable by\ndate in its press panel), maps, flyers and posters. Treat its OCR text layer as a lead and cite the\npublication and page from the image. [O15]","sources":["O15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c2e0f85a817","kind":"example","anchor":"In civil-status acts from the Russian partition, the witnesses of the declaration (świadkowie) and the\ngodparents (rodzice chrzestni) are separate roles, although the same people could fill both. In a 1913\nact shown by the State Archive in Kalisz, two men are named as witnesses and two other people as\ngodparents; in an 1861 Evangelical act, two of the four godparents were also witnesses. [P13] Record\neach name with the role the act gives it, and do not infer godparenthood or kinship from witness\nstatus alone.","sources":["P13"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
