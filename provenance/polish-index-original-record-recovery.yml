  - {"id":"O30","kind":"help-page","urls":["https://www.gov.pl/web/gov/odpis-aktu-stanu-cywilnego-informacje-ogolne"],"published":null,"retrieved":"2026-11-22","access":"read","rights":"CC BY-SA 4.0 for text","basis":"read 2026-11-22. The government guide distinguishes the modern abridged and full certificates, including for marriage.","entry_sha256":"c84fd08e5df324f69770bb40d2d31a00ad2b63eed5f0b912033fb1fa30c5acea","claims":["C-compare-marriage-copy-with-act"],"review":"reviewed"}
  - {"id":"O31","kind":"help-page","urls":["https://geneteka.genealodzy.pl/clanek/jak-indeksowac-M.php"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22. The instructions distinguish a short marriage index from an expanded one that includes parents and explain when the expanded version replaces the short one.","entry_sha256":"a27aa44edff56906e5c5381a17e9f5e627f3bef33c986a750f6c9fb738767daa","claims":["C-geneteka-marriage-index-parent-fields"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://danielpaczkowski.blogspot.com/2026/03/gidle-no-przeciez.html"],"published":"2026-03-15","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Post text read 2026-11-23 in the author's March 2026 blog archive.","entry_sha256":"53a2762b21046061f3d62a7254980eb7b6fabd35cdeef1f2a86744d47873c2d6","claims":["C-tabular-birth-act-paternal-grandparents"],"review":"reviewed"}
  - {"id":"O32","kind":"pdf","urls":["https://agad.gov.pl/wp-content/uploads/2020/12/poradnikgenealoga.pdf"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"pp. 20–21 read 2026-11-23.","entry_sha256":"44a307138210f5b32dba6e1b7edb663c6da71555da4f6694aa0c070c69c80980","claims":["C-tabular-birth-act-paternal-grandparents"],"review":"reviewed"}
  - {"id":"O33","kind":"catalogue","urls":["https://www.basia.famula.pl/content-all.php?lang=pl"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23. The listing separates years by locality, record creator and event type.","entry_sha256":"bb9048618db3464323bc43e0c7e30da8289b20f82d7501bbde87d5a3afb3c326","claims":["C-basia-indexed-volume-coverage"],"review":"reviewed"}
  - {"id":"O34","kind":"web-page","urls":["https://www.basia.famula.pl/pl/profile/6564"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23. The public indexing summary links to **Pełna lista jednostek**.","entry_sha256":"7565f755a9d7ae86d00ab0c9c4847ae3dc2b5692f29d71e5063910c29fcca764","claims":["C-basia-indexed-volume-coverage"],"review":"reviewed"}
  - {"id":"O35","kind":"catalogue","urls":["https://www.basia.famula.pl/en/units/6564"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23. The list gives volume titles, archival references and indexed entry counts.","entry_sha256":"fa7059426193f5c22883aabbb4ffaa1567f0dfd98a398c95a186c9caaedd29cc","claims":["C-basia-indexed-volume-coverage"],"review":"reviewed"}
claims:
  - {"id":"C-517d0ed6ff79","kind":"unclassified","anchor":"Where Geneteka supplies a **SKAN** link, follow it and inspect the destination's register\ndescription and actual entry. If the link is absent or fails, keep the row as an index lead and\nrecord the failure. The absence of that link establishes no absence in other image portals or\nthe holding archive. The Polish-records guide demonstrates both Geneteka's scan links and a\nsubsequent Search the Archives route. [P1]","sources":["P1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc5b418e068c","kind":"unclassified","anchor":"Before you trust a Geneteka row or a miss, set the search to fit the lead. For the former eastern\nlands, select the **Ukraina**, **Białoruś** and **Litwa** territories as well as the modern\nvoivodeships, and check coverage for each act type. To find a person as a parent, leave\n**Nie wyszukuj w rodzicach** (do not search parents) unticked; a child's birth row is not the\nparent's birth. Use **Wyszukaj jako para** (search as a couple) for a couple.\n**Wyszukaj również w pobliskich parafiach (15km)** adds nearby parishes; a hit there does not place\nthe person in that parish. Some indexed data has no available scans. [O2], [O3], [O4]","sources":["O2","O3","O4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3d0ca781b51d","kind":"unclassified","anchor":"A results page read with a fetch or HTML tool can show the column headers and no rows, even for a\nvery common surname; one such fetch on 2026-11-02 also showed no result counter. Check the loaded\nrows and the counter in a real browser, and never log NIL from such a fetch. [O3]","sources":["O3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4bbbb2bc8842","kind":"unclassified","anchor":"A Geneteka miss does not exhaust the Polish indexes. Search the regional projects whose area fits\nthe parish: Poznań Project (Wielkopolska marriages, 1800–1899), BaSIA (western Poland), Lubgens\n(Lublin region), Projekt Podlasie (Podlasie and Mazovia), GENEO at JZI (Suwałki and Augustów\narea), Świętogen (Kielce region), PomGenBaza (Pomerania) and JRI-Poland (Jewish records).\nGeneszukacz checks a surname only across Geneteka and three other Polskie Towarzystwo\nGenealogiczne lists (1918–1920 soldier lists and the 1926 Polish declaration for the United\nStates); it does not search the regional projects. Log each project searched and its coverage for\nthe parish before you record NIL. [O5], [O6], [O7], [O8], [O9], [O10], [O11], [O12], [O13]","sources":["O5","O6","O7","O8","O9","O10","O11","O12","O13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5904dba4ee68","kind":"unclassified","anchor":"Search every form of a woman's surname. A surname ending in a consonant other than -g takes -owa for a wife and\n-ówna for a daughter (Nowakowa, Nowakówna); one ending in a vowel or -g takes -ina/-yna and -anka\n(Konopczyna, Konopczanka); -ski becomes -ska. [P4], [P6] A maiden name is written z + genitive\nplural: \"z Kowalskich\" means née Kowalska. The same construction can name a place of origin, so\nread the plural family-name form before taking it as a maiden name. [P5] If an indexed maiden name\nmatches no known surname, open the image for a misread \"z …\" phrase, then search the rebuilt base\nform and the indexed form as separate lanes.","sources":["P4","P6","P5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a5971acaa1be","kind":"unclassified","anchor":"A name joined by \"vel\" or \"alias\" (Nowak alias Vilk) is a second name of the same person, not a second\nperson, and records may show either name alone. Search each element and the compound, copy the\ncompound as written, and do not treat a switch from one element to the other as a new family\nwithout looking for the joined form. [P5], [P6], [P7]","sources":["P5","P6","P7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4c9a47ca3859","kind":"method","anchor":"Search Zaręba, Zaremba and Zareba separately: the nasal vowel before *b* can sound like *em*, and an index may omit the diacritic [P14]. If those searches stall, look for the wife’s maiden surname without a parish filter. One researcher reports that this recovered the couple’s 1829 Glinojeck marriage under Zareba [P15]. Verify both spouses in the act before linking them.","sources":["P14","P15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8980b5f2b74c","kind":"unclassified","anchor":"In Szukaj w Archiwach, use **Search vital records** to investigate the relevant registration\nlocality. Inspect the returned years, confession, record type and holding archive. A parish or\nregistry-office seat can be the catalog locality even when the person lived elsewhere. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c4a3a696f666","kind":"unclassified","anchor":"Alternatively, the documented direct search uses **Akta stanu cywilnego** plus locality, with\nthe parish or synagogue district where supported. The official examples distinguish a Roman\nCatholic parish from an **Okręg Bożniczy**, a synagogue district. Select the series that fits\nthe lead; do not substitute a modern municipal name for the record creator. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7dc7bd12a855","kind":"unclassified","anchor":"Treat PRADZIAD as a finding aid. Search it inside Szukaj w Archiwach: choose **PRADZIAD**\nin the document-type list, or use **Search vital records**, whose rows carry PRADZIAD description\nfields. Its descriptions can identify locality, confession, years, record type and archive;\n**PRADZIAD does not contain scans**. To investigate scans, follow\nthe supplied reference code into the archival fonds, then open **List of files**. The official\ninstructions say that the file list shows available units and scan counts. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-54b4e9d71a72","kind":"unclassified","anchor":"For the Akta Stanu Cywilnego (ASC, the civil-status registers kept by each confession) that AP\nKatowice describes, the duplicates went to the competent local courts from the early nineteenth\ncentury, and the state archive now holds them. [O14] Record which copy an\nimage or index row comes from. Before you call an entry unreadable or unannotated, look for the\nother copy and record its custodian.","sources":["O14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f51860130030","kind":"method","anchor":"Distinguish the archive that answered from the parish that created the entry. A Warsaw archive answered one researcher about a Greek Catholic parish. A forum respondent identified the linked inventory as AGAD’s eastern-territory registers [C3]. Check the fonds, unit signature, parish, denomination and whether the description covers a register, extract or correspondence. AGAD’s own place index includes Ostrava because a postcard from that parish was inserted in the Wiśniowczyk register, fonds 301, signature 1653 [O20]. Check the actual unit for the requested parish, dates and scans. For Eastern Galician metrical books in Lviv or Warsaw, see [Galician or Bukovinian record routing](galicia-bukovina-habsburg-record-routing.md).","sources":["C3","O20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8053df1151c9","kind":"unclassified","anchor":"For a marriage in an ASC fonds from the Congress Poland civil-status system, check the fonds'\n**List of files** for a separate annexes unit (alegata) for the same year as well as the\nregister. The annexes hold the dated supporting papers, such as birth extracts and banns\ncertificates, whose content the register entry leaves out. Cite each paper as its own source with\nits own date, and do not use any of them as the marriage date. Where the parish kept only church\nmetrical books, as in the former Russian western provinces, do not expect an alegata unit.\n[O16], [P10], [P11], [P12]","sources":["O16","P10","P11","P12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f6b48b44aff5","kind":"unclassified","anchor":"When Metryki covers the relevant register, the demonstrated route is region → parish → available\nyears/record type → scans. The tutorial follows those choices into a register image; this is\na second retrieval route, not a promise that every Polish parish is included. [P2]","sources":["P2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a0d3b2e91446","kind":"unclassified","anchor":"If the central portal does not expose the image, check the holding archive's own digital portal.\nThe Eastern European research interview specifically describes regional Polish archival portals\nwith digitized material not yet integrated into the central portal. Check the current regional\ncatalog rather than assuming that this historical observation applies to every archive. [P3]","sources":["P3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-28f95b43f47b","kind":"unclassified","anchor":"In Szukaj's vital-record results, **no fonds** means that the fonds is currently unavailable on\nthat website. It does not mean the archival documents never existed. If the needed unit has no\nonline image, preserve its reference and prepare an image/copy request to the identified holder;\ncontact remains a separately authorized action. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-973307078982","kind":"unclassified","anchor":"For a 20th-century civil-status register, do not assume the state archive is the holder. A\n[civil-registry custody discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) reports\nthat many such books are still held by the local civil registry office (Urząd Stanu Cywilnego).\nWhen the archive's catalog shows no unit for a recent year, check the current USC custody for that\nlocality before sending the request. Do not label the record missing. [C2]","sources":["C2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cbcc73fcf744","kind":"unclassified","anchor":"The Civil Status Records Act (Prawo o aktach stanu cywilnego, Dz.U. 2014 poz. 1741) sets the\ntransfer rule for books kept before 1 March 2015. The USC passes a book to the competent state\narchive 100 years after the birth book was closed, and 80 years after the marriage or death book was\nclosed. When one volume holds several books, the period runs from the closing of the last of them\n(art. 128(1)). A book whose period ended after 1 March 2015 goes to the archive within two years after\nits period ends (art. 129(3)). A birth or marriage book stays at the USC longer while a person entered in\nit has no death act or registered death; if that person has no PESEL number, the USC may transfer\nthe book anyway (art. 128(1a)–(1b)). [O17]","sources":["O17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c43e3cc5bab1","kind":"unclassified","anchor":"So a book older than 100 or 80 years can still be at the USC. Once the period, including that\nextension, has run out, the USC issues no certificate (odpis) from the book. Until it transfers the\nbook, it gives access under the archives act (art. 130(3)–(4)). [O17]","sources":["O17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d8defb4eb7ea","kind":"unclassified","anchor":"Ask the USC that holds the book for access to the named book and entry, and record whether it\ngranted access or refused. [O17]","sources":["O17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ead86ef3d59d","kind":"unclassified","anchor":"For a Congress Poland (Kingdom of Poland) civil-registration register, expect Polish entries until the end of 1867.\nA regulation required Russian from 1 January 1868, so expect Russian from 1868 and confirm it\nfrom the language of each transition year's entries and its index. Do not expect a Latin-to-Russian switch in these registers. [P8], [P9] Use the year's language to choose the search spelling\nand to judge whether a Cyrillic or index spelling re-transliterates a Polish original.","sources":["P8","P9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3183b3533ba2","kind":"method","anchor":"For an archive request, list each known Polish and Cyrillic spelling and specify whether to search similar-sounding forms. Record which variants the reply says were checked [C1]. Test any candidate against the act’s date, household and place before assigning it to the family.","sources":["C1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a545b6be9fb3","kind":"unclassified","anchor":"When the vital-record route stops and you turn to printed context, Polona, the National Library of\nPoland's digital library, holds digitised books, periodicals and daily newspapers (browsable by\ndate in its press panel), maps, flyers and posters. Treat its OCR text layer as a lead and cite the\npublication and page from the image. [O15]","sources":["O15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c2e0f85a817","kind":"example","anchor":"Transcribe the declaration witnesses (*świadkowie*) and godparents (*rodzice chrzestni*) from their own clauses. The Kalisz archive shows distinct pairs in a 1913 act and two witnesses who also served among four godparents in an 1861 Evangelical act [P13]. Enter both roles only for a person named in both capacities. Neither role by itself establishes kinship.","sources":["P13"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b29257f5c577","kind":"method","anchor":"Separate the opening date and hour of the declaration from the date and hour in the clause describing the birth. In Danko’s 1862 Szwelice transcription, the birth is dated to the preceding day at nine in the morning, while the baptism was on the day of declaration [P16]. Keep relative wording and both written forms of a Julian/Gregorian date. The calendars differed by 12 days for most of the nineteenth century and by 13 after the 1900 change [P17]. In the Pułtusk transcription, the declaration is 6/18 April 1890 at 3 p.m., the birth 5/17 February at 6 p.m. [P18]. Record a time only where the text supplies it [P19]. Copy each witness’s stated age and occupation and all the child’s given names.","sources":["P16","P17","P18","P19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4340abbbe225","kind":"platform-ui","anchor":"For Volhynia, also search wolyn-metryki.pl. AGAD's leaflet on metrical books names it, with Geneteka\nand a printed index of persons from the parish records of the Lutsk diocese, as an aid to searching.\n[O19 @2026-11-15] Its English page says it is built from microfilms of 19th-century Roman Catholic\nparish registers of the dioceses of Lutsk and Lviv, that entries from 1848 are in Russian and\nsometimes Ukrainian, and that its search takes a first name, a last name or part of one, or a town,\nbut not a first and last name together. [O18 @2026-11-15] A genealogist lists it among the online\naids for Ukrainian metrical books. [P20 @2026-11-15] A miss there says nothing about Orthodox, Greek\nCatholic or Jewish families: search the surname and the town as separate lanes, and log its coverage\nas Roman Catholic only.","sources":["O19","O18","P20"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-73fbc075ca50","kind":"platform-ui","anchor":"For a BaSIA hit, follow its scan link when supplied and keep the archival reference\nfrom the hit. [P21 @2026-11-20], [O21 @2026-11-20] If the link is missing or broken,\nor the surname search comes up empty, look up the register locality in BaSIA's\n**Mapa jednostek do indeksacji**. Open the matching unit by its *sygnatura* (archival\nreference) to reach its scans in Szukaj w Archiwach. [O22 @2026-11-20]","sources":["P21","O21","O22"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b736178568a6","kind":"platform-ui","anchor":"For a map, photograph or technical drawing named in an archival lead, use Szukaj w Archiwach's\nmain search and select **Mapy**, **Fotografie** or **Projekty techniczne** under the document-type\nfilters. [P21 @2026-11-20], [O23 @2026-11-20] If the vital-record search or scan viewer stalls,\nopen **Filmy instruktażowe**. Choose **Wyszukiwarka akt metrykalnych** for the vital-record search\nor **Jak korzystać ze skanów na Szukaj w Archiwach** for the scan viewer. [O24 @2026-11-20]","sources":["P21","O23","O24"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5de48eb0bfa6","kind":"platform-ui","anchor":"If a Geneteka hit has no working **SKAN** link, carry its year or volume into Skanoteka.\n[P21 @2026-11-20] Use **Szukaj** with the parish or registry office that created the\nregister, or choose **przeglądaj archiwa** if you know the holding archive. [O25 @2026-11-20]\nIn the matching fonds, choose the unit that covers the indexed year or volume and event type\nbefore looking for the act in its scans. [O26 @2026-11-20]","sources":["P21","O25","O26"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-geneteka-rerun-coverage","kind":"platform-ui","anchor":"When revisiting a Geneteka miss, compare the years in [indexed holdings](https://geneteka.genealodzy.pl/rejestry.php?lang=pol)\nand the locality and act type in the [update list](https://geneteka.genealodzy.pl/news.php)\nwith the coverage in the search log. Check the target village and year before relying on a\nparish-wide range. [O27 @2026-11-22], [O28 @2026-11-22] Rerun the search for newly indexed years.\nIf the earlier search stopped at the home parish, include nearby parishes with newly indexed\ncoverage for the event. [S2 @2026-11-22]","sources":["O27","O28","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-trzesowka-index-gap-counterexample","kind":"example","anchor":"Leave a death or remarriage inferred from a birth-index gap unresolved. In a Trzęsówka case,\nnewly indexed births from Ostrowy Baranowskie named the same couple after the father's presumed\ndeath, prompting the researcher to drop the inferred death and remarriage. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-poznan-project-original-record","kind":"platform-ui","anchor":"On a Poznań Project marriage hit, open **Original record** to identify the archive for that\nentry. [O29 @2026-11-22] In a remarriage act, compare the groom's stated village, home parish,\nmarital status and age with the candidate's earlier records before linking the act. Keep the\nhome parish separate from the parish that recorded the marriage. [S3 @2026-11-22]","sources":["O29","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-compare-marriage-copy-with-act","kind":"method","anchor":"If you start with a civil marriage copy (*odpis*), record its type when known: abridged\n(*odpis skrócony*) or full (*odpis zupełny*) for modern certificates. [O30] Use the event place,\ndate and any act number on the copy to find the register entry. Check the entry for the bride's\nmother's maiden surname even if the copy names both parents. [S4]","sources":["O30","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-geneteka-marriage-index-parent-fields","kind":"platform-ui","anchor":"Geneteka's basic marriage-index format can omit parent details found in the act. [O31 @2026-11-22]\nRecord a blank parent field as an omission in the index. Read the act before stating whether it\nnames the parents, and leave that question open if the act is inaccessible. [S5 @2026-11-22]","sources":["O31","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-birth-outside-village-index-range","kind":"method","anchor":"If earlier children of proposed parents are indexed but the target birth falls beyond the\nindexed years for the village, keep the parentage provisional. Log the missing index coverage\nand check the register listings for the target village and year. Leave the survival of the later\nbooks open until you have evidence about the books themselves. [S5]","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-basia-indexed-volume-coverage","kind":"platform-ui","anchor":"In BaSIA's [alphabetical coverage list](https://www.basia.famula.pl/content-all.php?lang=pl),\nfind the parish or civil registry office that served the village and check the event type and\nyear. [O33 @2026-11-23], [S3 @2026-11-23]\nTo confirm coverage of a specific volume, open a listed indexer's **Pełna lista jednostek**.\n[O34 @2026-11-23] Match the volume title and archival reference and log the index coverage\nat the volume level. Verify the individual act in the original.\n[O35 @2026-11-23]","sources":["O33","S3","O34","O35"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-tabular-birth-act-paternal-grandparents","kind":"method","anchor":"Read a tabular birth act by its column headings. In the father's field, transcribe any names\nexplicitly given as his parents and record the relationship wording. [O32] A reported 1916 Gidle\nbirth act named the father's parents in a table despite the researcher's expectation of a\nnarrative entry. [S6]","sources":["O32","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
