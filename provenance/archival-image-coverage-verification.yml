claims:
  - {"id":"C-f212b1267c24","kind":"unclassified","anchor":"If an original register is unavailable but separately prepared transcriptions are available,\ncompare their entries and stated record-type coverage for the same target name and period.\nRetain both derivative locators, their claimed common original and unresolved discrepancies\nor bindings. One transcript's silence does not establish that the original omitted an event;\nagreement between copies is not independent corroboration. Family Locket's example describes\na marriage present in a handwritten transcription but absent from a typed one, while the\none-person-or-two question remained open. [S26]","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e656a36f41f5","kind":"unclassified","anchor":"FamilySearch distinguishes image numbers, record pages, household numbers and family numbers. Its item-grouping instructions allow multiple books on a film and a book split across films. A film's image count therefore cannot establish a particular case's boundaries. [S1, S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35fa6018add8","kind":"unclassified","anchor":"When an archive sends copies it selected from a case file, list the archival sheet numbers actually received. The highest number shows only that the file was at least that long; gaps in the foliation mark sheets not supplied. Record the packet as an excerpt with its known minimum extent, not as the case. Request the remaining sheets, citing the sheet numbers already received, and record whether the archive supplied them or withheld them. The [repression-file copy reports](https://forum.j-roots.info/viewtopic.php?f=64&t=561) motivate this. Sheet numbers do not show what omitted sheets contain or whether they can be released, and an unexplained gap is not evidence that nothing more was recorded.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8b4fbd58597f","kind":"unclassified","anchor":"When reading a case file in a reading room, record three categories by sheet number: sheets inspected, sheets kept in sealed envelopes or otherwise withheld, and sheets shown without permission to copy and noted only by hand. Withheld is not missing, and neither status shows what those sheets contain. Note the viewing date and any further release after a request, because access to the same file can change. Originals released to the family may have been replaced by copies with receipts. The [sealed-envelope reports](https://forum.j-roots.info/viewtopic.php?f=64&t=561) and a [quoted access regulation](https://forum.j-roots.info/viewtopic.php?f=64&t=564) motivate this. They do not establish any archive's current practice.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4099514627fc","kind":"unclassified","anchor":"When a supplied archival image package includes a repository-produced HTML companion, retain\nit beside the images. It may preserve the archival signature, reported image count, repository\nlink and received usage statement that image filenames omit. Bind it to the stated unit and\napply the existing extent checks separately. The [NRW archive download description](https://www.compgen.de/2025/10/landesarchiv-nrw-mit-neuen-digitalisaten-und-downloadmoeglichkeiten/)\nmotivates retaining that source object; a stated count does not establish complete coverage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-009acfcfd934","kind":"unclassified","anchor":"If a copy-holder's short catalogue description leaves several possible originating files,\ninspect an actually available fuller catalogue representation and the copy's title board.\nKeep the copy item/film key and proposed original repository/signature separate; bind only\nthe supported original unit and inspected copy extent. The [CAHJP copy example](https://forum.j-roots.info/viewtopic.php?f=153&t=1225)\ndescribes a fuller MARC record, without establishing current fields or controls. A selected-city\ncopy can be a fragment of the original case; leave an unsupported binding unresolved.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d18ea0a6ccb7","kind":"unclassified","anchor":"Treat a fund/inventory/case citation from older notes or a publication as a dated, second-hand lead recorded with its citing source, not as a current locator. If it does not match the current inventory or cover label, check for renumbering, splitting during restoration, or parts moved into separate units. Map it through an archive conversion table where one is available, then read the sheet numbers again and keep the old and new locators. Recheck 'lost' conclusions made under the old numbering. The [renumbered-inventory discussion](https://rodgersforum.borda.ru/?1-3-0-00000102-000-0-0-1780133454=), [separated-lists note](https://rodgersforum.borda.ru/?1-36-0-00000063-000-0-0-1769266561=) and [secondary-citation caution](https://forum.j-roots.info/viewtopic.php?f=181&t=4753) motivate this. They do not supply a conversion table.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e63b143eed7","kind":"unclassified","anchor":"Before jumping through an unindexed group, inspect title/end cards and readable internal\nlabels to establish its arrangement and direction. An end-of-roll card at the first image\nis a clue to check for reversed order. Within a section whose observed labels support an\nordered run, retain the labeled positions and use progressively smaller forward/backward\njumps toward the target label. Recheck the arrangement at section changes; if labels are\ninconsistent or the material is loose, use a bounded sequential inspection instead. Save\nthe anchor locators and ranges actually inspected: jumping over images does not search\nthem or establish that a target is absent. The map-roll demonstration motivates this\nnavigation aid, without verifying the original roll or any household location. [S25]","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9f1887fd4c96","kind":"unclassified","anchor":"When a folded letter, card or overlay conceals part of an entry, inspect adjacent frames\nfor another exposure with it opened or lifted. Confirm that both images show the same\nitem, retain both locators and distinguish the as-found view from the revealed text.\nA repeated exposure is a possibility to check, not a guarantee that hidden text was\ncaptured. If none is available, retain the obscured area as an inspection gap. [S24]","sources":["S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-243e9c31af3e","kind":"unclassified","anchor":"For an unnumbered verso, inspect the actual preceding recto and surrounding sequence before\nassigning a leaf/verso binding; leave it unresolved when that context is missing. A film-end\ncard directing continuation on another reel leaves that part queued until inspected. Keep\nprinted page, original folio and viewer frame separate rather than deriving one with a fixed\nratio. The [evacuation-film examples](https://forum.j-roots.info/viewtopic.php?f=197&t=1199)\nsharpen the sequence check without establishing that the reported images are complete.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7533743558a8","kind":"unclassified","anchor":"When an index points into an earlier image set, locate a known entry or heading in both\nversions and retain its old/new coordinates before reusing the pointer. Added or removed blank\nand duplicate frames can break a fixed offset. Leave the conversion unresolved if the needed\nversion is unavailable; an absent film field does not prove that no film exists. The\n[Lithuanian image-set example](https://forum.j-roots.info/viewtopic.php?f=164&t=1202)\nmotivates this version-specific anchor check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-10788a8e0217","kind":"unclassified","anchor":"Do not take an image's record type, denomination or jurisdiction from the collection title. Open the image's own citation or information panel and the volume's headings. Record which parishes, chapels and event types it actually contains; a volume can interleave several. When one image differs from its neighbours, compare the adjacent images and identify it by its printed form heading. The [mislabelled register](https://www.youtube.com/watch?v=jfWVACjBbbM) and [burial-permit](https://www.youtube.com/watch?v=WO4b4eUWm2s) examples motivate this. They do not establish how common mislabelling is or why an item was filed there.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0e4d5bffff18","kind":"unclassified","anchor":"An inventory line, file title or online catalogue heading can describe only the first document bound into a composite file, use vague wording such as \"various villages\", carry a wrong year, or lag behind an approved revised inventory. Before ruling a file in or out, inspect it or a published contents list. Record each bound part with its district, year, record type and leaves, and keep the title and inventory version used beside what the file shows. An archive reply based on titles does not establish what a fond lacks. Before reporting a church's year missing, check later-added inventory entries and cases titled for related churches of the same place. The [composite revision-file listing](https://rodgersforum.borda.ru/?1-7-0-00000156-000-0-0-1768979291=), [misdated confession-list report](https://rodgersforum.borda.ru/?1-7-0-00001243-000-0-0-1778141289=), [catalogue-heading note](https://rodgersforum.borda.ru/?1-29-0-00000095-000-0-0-1681915156=) and [inventory-title discussion](https://rodgersforum.borda.ru/?1-14-0-00000075-000-0-0-1768980711=) motivate this. None shows how common such errors are.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a79dcd7df5e6","kind":"unclassified","anchor":"A scanned or user-transcribed inventory can itself be incomplete. Read its heading notes for sheets skipped during scanning, and note any superseded inventories it lists. Treat a gap in file numbers in such a copy as an uninspected stretch of the inventory, not as an absent file. Confirm against the archive's full current inventory before reporting a file or parish-year missing. The [scanned-inventory transcriptions](https://rodgersforum.borda.ru/?1-3-0-00000104-000-0-0-1731557574=) and [their earlier part](https://rodgersforum.borda.ru/?1-3-0-00000101-000-0-0-1701788730=) motivate this. They do not show what the skipped sheets listed or whether the missing numbers exist.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1b31fc164ee1","kind":"unclassified","anchor":"After a jump to the expected date in a chronological roll or image group, and before reporting an entry absent, inspect the group's final images for out-of-sequence additions and any roll index, and record in the coverage statement that the end was checked. A roll index is a finding aid; still read the original entry it points to. The [microfilm rule of thumb](https://www.youtube.com/watch?v=5Rcm-OakCes) motivates this check. It does not establish how often appended images or indexes occur, or that every digitized image group keeps its roll ending.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-703a644f4409","kind":"unclassified","anchor":"In a revision list or other listing of several places, a place need not form one continuous block. It can have a main section, a separate section for those who died or departed since the previous count, or a short later entry under its heading that continues another place's numbering. Before reporting a household absent or counting a place's households, read the case's full leaf sequence and record every leaf range bearing its heading. A compiler's place index is a finding aid; verify its ranges on the images. In the coverage statement, record a missing beginning or end, or missing old-numbered leaves, as ranges in both old and current leaf numbering. The [revision-list leaf discussion](https://rodgersforum.borda.ru/?1-14-0-00000057-000-0-0-1768992933=) and [1744 revision-list place index](https://rodgersforum.borda.ru/?1-7-0-00001243-000-0-0-1778141289=) motivate this. Each concerns one case, and the index's leaf numbers were not checked against images.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7f43ab82c3a0","kind":"unclassified","anchor":"When one parish's registers for successive years sit in different files, keep a per-year row: file locator, the first image of each part (births, marriages, deaths), and what that year's book actually covers and records. Note a part that stops mid-year, poor legibility, a viewer binding that differs from the file label, and the first year a field such as surname or mother's name appears. A field missing before that year, or an event after a part stops, is a coverage gap, not negative evidence. A [metrical-book year ledger](https://rodgersforum.borda.ru/?1-7-0-00001315-000-0-0-1780134215=) motivates this. It covers one parish; its starting years do not transfer elsewhere, and it does not explain the gaps.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5da0ed577c6a","kind":"unclassified","anchor":"In a volume covering several settlements, check the end of each settlement's section, not only the front or back of the volume, for a surname list compiled for that section. Record for each section whether one was found. The [multi-settlement revision-volume tip](https://forum.j-roots.info/viewtopic.php?f=152&t=36) reports such lists in only some sections of one volume. Treat a list as a finding aid: it does not replace reading the entries. A section without a list is not thereby incomplete, and a name missing from a list is not an absence.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1e2ffac82d30","kind":"unclassified","anchor":"When an archival file sits on Wikimedia Commons as one PDF, download the original file under the site's rules and extract its embedded page images in their native format, for example with poppler's `pdfimages -all` (this catalog ships no script for it). Keep the page-to-image map (`pdfimages -list`, or `-p` for page numbers in file names) and the file's licence statement. Commons serves page renders only at standard widths and throttles thumbnail rendering under load, so a render is a resampled derivative: transcribe from the extracted images, and use renders or thumbnails only to find the cover and contents. [S30, S31, S32] The model reading an image may itself receive a downscaled copy; see [ai-for-documentary-records.md](ai-for-documentary-records.md).","sources":["S30","S31","S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-064ec4b1b9ac","kind":"unclassified","anchor":"An archive download can be a multi-page TIFF holding several sheets in one file. Pillow, for one, opens such a file at frame 0 without any error and saves only that frame unless told to save all frames. [S39] Count the frames (`n_frames`), extract every one and record which frame is which sheet before you read anything or call a page absent from the file. A JPEG's EXIF orientation tag can make the displayed image differ from the stored pixels; Pillow's `ImageOps.exif_transpose` exists to apply it. [S40] State whether crop and OCR coordinates refer to the stored or the oriented pixels, and apply the orientation only to a recorded derivative copy.","sources":["S39","S40"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-798af295f96a","kind":"unclassified","anchor":"Before reading a conflict into a field, confirm the image reaches the record's outer edges. A tile assembly or stitched download with no internal gaps can still miss an edge strip, such as the right-hand column of tiles: check its outer bounds against the viewer's or source's stated dimensions, record the region and zoom level, and never call a partial assembly the full original. If one provider's scan looks cropped, shaved or distorted, open the same record at another provider. Record which image supplied each reading. A second scan of the same original completes the reading; it is not independent corroboration. The [draft-card example](https://www.youtube.com/watch?v=mTyYpO_3uPs), where a cut-off edge hid the stated age, motivates this check. It does not explain the remaining birth-year discrepancy.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e6ce639e362","kind":"unclassified","anchor":"If a viewer publishes a IIIF manifest, save it. Its canvases give the publisher's image order and canvas IDs. Canvas width and height have no unit and fix only the aspect ratio, so take pixel dimensions from the image's `info.json` [S42]. Fetch images through the Image API at `full/max` rather than taking viewer screenshots. `max` is the largest size the server will deliver, and `maxWidth`, `maxHeight` or `maxArea` in `info.json` can cap it below the stored master [S41]. Record the width, height and any of those caps, and do not call a capped image native resolution. If the cap prevents a reading, look for an official original-file download or order a copy. Compare any PDF download from the same viewer, and record which rendition supplied each reading. A canvas label is the publisher's display string, not a verified folio number: the frame/folio separation above still applies.","sources":["S42","S41"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c28b46cf1835","kind":"unclassified","anchor":"When register entries carry numbers in the margin, search the same volume for a section keyed to those numbers, for example at the back, before treating the front entry as complete. Extract both parts with their own image locators and cite them together, keeping each reading bound to its part. The [English Jewish birth-register example](https://www.youtube.com/watch?v=BivX3fFXJRw) motivates this check. It does not establish that other registers use the same layout, and failing to find a keyed section in pages not yet inspected is not evidence that none exists.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9c5202dd911a","kind":"unclassified","anchor":"A catalogue entry, a working scan and a searchable name index establish different things. Verify the actual file and case/part correspondence; a repository page or predicted filename alone does not prove scan availability. A failed retrieval leaves availability unknown. In Russian archive catalogues, an оцифровано (digitised) or ЭФП (электронный фонд пользования, the electronic use copy) flag shows that a use copy exists, not how it can be viewed: in the reading room only, by paid remote viewing (see the RGADA example in [muscovite-census-settler-origin-recovery.md](muscovite-census-settler-origin-recovery.md)) or free. [S33] Check that file's access terms before telling the user it is online; until then, keep the cipher and continue with open catalogues and other copies.","sources":["S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-77906250d271","kind":"unclassified","anchor":"Before calling a Ukrainian archive file (справа, file) undigitised, or drafting an archive request for it, look up its fond/opys/sprava (fund/inventory/file) cipher in Duck Inspector (Качиний Інспектор, `inspector.duckarchive.com`). It is a volunteer, non-commercial cross-index of where digitised Ukrainian case files are already published online, such as on FamilySearch, ARCHIUM and Ukrainian Wikisource, with links to them. [S27] Also check the Ukrainian Wikisource page `Архів:<archive>/<fond>/<opys>/<sprava>` (the Архів, \"Archive\", namespace): its labels link a FamilySearch copy, an archive-site copy and a Commons copy. [S28] Search the Wikimedia Commons File namespace by the cipher too: oblast-archive inventories have been uploaded there as PDFs. [S29] A link label is not an accessible copy; on one checked file page, the Commons label led only to the Commons home page. [S28] Open the copy, then verify the DGS and the target frames on the host itself before citing. Read the cover against the title, as in the composite-file check above, and record each file's licence separately. A miss in any cross-index does not prove that no scan exists. Coverage varies by fond, so a hit or a miss for one fond says nothing about another fond of the same archive or guberniya. Read the tool's terms and do not bulk-query it; for bulk use, the site links a public database copy for developers. [S27]","sources":["S27","S28","S29"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b119e341336c","kind":"unclassified","anchor":"For Ukrainian parishes, also check OpenHeritage (`openheritage.online`). Its catalogue of metrical books and archival sources by settlement (`/uk/metrical-books`, `/en/sources/coverage`) shows, for up to 20 chosen places, which record types are catalogued (metrical books, confession lists, revision lists, censuses), by decade and archive. [S43] Each count is a number of distinct sources. A register spanning several decades appears in every decade cell it covers but only once in the row total, so never add decade cells together to count surviving registers. The matrix includes possible place matches unless you exclude them, and each result is flagged as an exact or a possible match. [S44] A possible match is not a confirmed parish-to-village link: record whether possible matches were included. An empty cell may only mean that nothing has been catalogued yet, not that the records were lost. If search hits come grouped by document, request all matching pages before you call a register searched, and open each hit on the host image.","sources":["S43","S44"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-503e97056354","kind":"unclassified","anchor":"For Estonian and Latvian church books, check the national archives' image portals. The Rahvusarhiiv (National Archives of Estonia) has digitised Lutheran and Orthodox parish registers in Saaga; family research there is free but needs user registration, and its AIS catalogue links digitised items to Saaga. Saaga's record titles are usually in the language of the records, such as German, Russian or Estonian. [S45] Raduraksti (Latvian State Historical Archives) hosts parish registers of several confessions, with revision lists and the 1897 census. [S46] Search German, Russian and local name forms, and browse by parish where there is no index. Before converting a date, check whether that book uses Julian, Gregorian or double dates; do not assume one calendar for a whole province or period. Apply the offsets in [evidence-proof-judgment.md](evidence-proof-judgment.md), and for revision lists see [russian-revision-list-household-chaining.md](russian-revision-list-household-chaining.md).","sources":["S45","S46"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e6bcf395ac84","kind":"unclassified","anchor":"For JewishGen Ukraine, follow the current Ukraine RD FAQ to its monthly/cumulative upload listings. Compare the actual file reference, years, locality and record type; retain the inspected row and listing date. The FAQ describes periodically updated upload lists, not a guarantee of complete transcription of every case subsection. A missing row does not establish permanent non-indexing. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ee58cbc0efcb","kind":"unclassified","anchor":"An upload for a case does not establish that its supplementary, merchant or other subsection was completely indexed. Resolve that narrower question against a stated coverage scope or the relevant source entries. Index records, people, households and scan pages have different denominators; equal totals do not prove completeness. Preserve the original's locator for each indexed entry, as JewishGen's transcription guidance requires. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-92c3bf41888b","kind":"unclassified","anchor":"Before ordering or citing a file by an index's fund/inventory/file reference, query an archive holdings database or published inventory by place, year and record type. Compare the returned file number and description with the citation. A file of a different record type at the cited number signals a likely citation error; keep both references until the file is opened. A holdings database lists surviving files and their references, not their entries. A surname search there therefore fails, and a matching file does not show that the person's entry exists. The [Vilnius holdings-database exchange](https://forum.j-roots.info/viewtopic.php?f=164&t=5924) motivates this from one example.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-713f4a2d4541","kind":"unclassified","anchor":"A compiled reference database or online fond list can omit a fond it never processed, or fail to display one. Before reporting a fond or file as not held, establish whether that finding aid covers the fond at all, and consult the archive's own inventories. A [fond-coverage exchange](https://forum.j-roots.info/viewtopic.php?f=164&t=5924) motivates this. In it, a database lacked a fond's signatures because the fond was unprocessed, and another user contradicted an apparent jump in the online fond list. It does not show what the fond contains or whether the cited files survive.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2f20a70fce54","kind":"unclassified","anchor":"A later volunteer surname index to a census can state what its compilers skipped, such as\nmilitary lists, households whose first-listed resident was outside the target group, or\nattached workforce lists. Keep those omissions with the index; its no-hit is not a search of\nthe whole census. An index compiled by the original enumerators belongs to the same census:\nuse it to locate an entry or check a reading, cite it separately and verify the entry on the\ncensus sheet itself. The [Dvinsk census indexing thread](https://forum.j-roots.info/viewtopic.php?f=168&t=289)\nmotivates both checks without establishing that the enumerators' index survives complete.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cceb03e8cf27","kind":"unclassified","anchor":"Record which sides of loose documents an image copy shows; filming can miss a page or a reverse side, and a published abstract may exclude whole categories of entries, so read a derivative's front matter for stated exclusions. Report an absent page, side or entry as missing from the inspected copy and queue a check of the original or another filming at the holding archive. The [territorial-census example](https://www.youtube.com/watch?v=Eh06QweqW3g), [unfilmed-reverse remark](https://www.youtube.com/watch?v=t70iQZdquD0) and [parish-register abstract example](https://www.youtube.com/watch?v=t7TW9qyShIU) motivate this. None establishes a filming practice or how often omissions occur.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6b0400144aee","kind":"method","anchor":"A frame seen only at thumbnail size, in a gallery grid, contact sheet or reduced montage, stays unavailable or not inspected: handwriting legible on the full image may not be legible at that size. Exclude a candidate or report an entry absent only after opening each frame of the range singly at a size where the script can be read. FamilySearch's 2015 viewer announcement offers its thumbnail gallery as a way to browse a collection, with any thumbnail opening the single image view [S48].","sources":["S48"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-450748dcfdf4","kind":"portal-availability","anchor":"Raduraksti's home page, checked 2026-11-08, also links to Riga house registers (late 19th century to 1918) and to separate databases of passports of residents of Latvia (1918–1940), University of Latvia students (1919–1944) and deportees (1941–1953) [S47 @2026-11-08]. For a person in interwar Latvia, search the passport collection; the house registers end in 1918. The only census on the list is the 1897 one: do not assume the 1935 census is online there.","sources":["S47"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3422a9946fec","kind":"platform-ui","anchor":"Duck Inspector is also a finding aid, not only a cipher lookup. Its search covers case titles, identifiers, author, location, years and tags [S49 @2026-11-12]. Translate the name, community, church, synagogue, event or group into Ukrainian and search the titles. Vera Miller's sample searches reach pogroms, nobility, student lists, Volksdeutsche and trade unions, well beyond vital records and censuses [S50 @2026-11-12]. She found that a result list seems to stop at about 50, so add a keyword or a year range and search again instead of reading the first list as complete [S50 @2026-11-12]. A title hit is a lead to a case: open the linked copy and read it before attaching it to a person.","sources":["S49","S50"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-56c409761a0b","kind":"portal-availability","anchor":"To search the finding aids of several Ukrainian archives at once, use the ARCHIUM inter-archive\nportal (searcharchives.net.ua). It searches the full text of the finding aids on ARCHIUM-based archive\nsites, among them ЦДАВО, ЦДІАК and the Poltava, Lviv, Kyiv and Kirovohrad oblast archives: fond titles,\nhistorical notes, fond and inventory annotations, file and document titles where present, and index\nentries, and it can limit the results to digitised files. [S51 @2026-11-13], [S52 @2026-11-13] A miss\ncovers only those archives and that finding-aid text, not names inside page images.","sources":["S51","S52"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
