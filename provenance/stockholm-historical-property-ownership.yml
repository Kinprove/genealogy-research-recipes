claims:
  - {"id":"C1","kind":"historical","anchor":"Copy the ward, block, number and street wording as written. In Gamla stan, check which numbering system applies. The 1729 numbers run by district, and the 1810 numbers run within each block. Compare the two maps and keep both numbers where you find a match. Keep all candidate old lots when a newer lot combines them [S2], [S3].","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C2","kind":"method","anchor":"According to the author’s case, carry the block and historic lot number into the *1729 och 1810 års tomtnummer* comparison to look for its street address [S4†]. Verify the result against the map and property wording [S2], [S3].","sources":["S4","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C3","kind":"method","anchor":"Use *Fastighetsregister 1675–1875* at Stockholm City Archives to identify the property’s card, then follow the card into the transaction protocol or underlying contract. Compare the acquired share and lot wording, and keep purchase, registered title and sale dates separate [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C4","kind":"method","anchor":"Establish residence and ownership from their own dated records. Compare the probate inventory’s address and property list with the historical poll-tax roll and the dated title record. If a roll appears to show tenancy, test the tenure reading against the title date for the same lot. In the reported Stockholm case, the title predated the roll that had been read as tenancy [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C5","kind":"method","anchor":"According to the author’s household example, compare the address in the estate inventory with the spouse’s separate entries in earlier and later population registers [S5†].","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C6","kind":"method","anchor":"If a later sale names heirs of a much earlier owner, compare the intervening beneficiary’s death date with the earlier will. Check for a clause returning the property to the former estate. Carry the old and new lot identifiers into the title and estate documents [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
