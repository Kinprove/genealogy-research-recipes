claims:
  - {"id":"C-98e3afeabea2","kind":"unclassified","anchor":"Record each of these as its own field: townland, civil parish, Roman Catholic parish, poor law union / registration district, barony and county (add the province if known). Do not copy one unit's name into another field. Names and boundaries differ between these units, and different record series are arranged by different units. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9657498b241e","kind":"method","anchor":"- **Civil and ecclesiastical parishes.** Match the townland to the parish of the right denomination at the event date. For Clonfert civil parish, County Cork, Lewis lists Kanturk and Newmarket as Catholic districts in 1837 [S4]. Brady’s later map shows Newmarket and Rock and Meelin across the civil parish [S3]. For a Church of Ireland entry, check Lewis or the parish register list. Disestablishment took effect on 1 January 1871 [S25]. That date alone does not establish a local boundary.\n- **Barony.** Keep the barony and its county in separate fields. In Brady’s Cork example, Duhallow is the barony and Clonfert the civil parish [S3]. Check which unit the finding aid actually indexes.\n- **Townland.** Never identify a townland from its name alone. Townland names repeat across Ireland, sometimes within one county. Accept a townland only if it appears in the townland list of the parish you already support. Otherwise, record it as unresolved. [S3]","sources":["S4","S3","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-townland-unit-fields","kind":"platform-ui","anchor":"On the documented townland’s Townlands.ie page, copy the listed electoral division, civil parish, barony and county into separate fields [S16 @2026-11-16]. Follow the [Irish census recipe](irish-1901-1911-census-returns.md) for census searching. Only a transcript excerpt was inspected for the video’s place-name suggestion [S21 @2026-11-16].","sources":["S16","S21"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2243d22fdf1d","kind":"unclassified","anchor":"The registration district is the key field for a civil search. The district named in the indexes is the superintendent registrar's district, which has the same boundaries as the poor law union. [S1] Registrars' (dispensary) districts are smaller subdivisions of it. Do not put a registrar's district name in the district field. Get the district in one of two ways:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7002155a330","kind":"unclassified","anchor":"- **From a civil-registration index entry.** Search IrishGenealogy.ie first. It is free and needs no registration. It covers the whole island to the end of 1921 and the Republic only from 1922: births 1864–1925, marriages 1845–1950 (Catholic marriages from 1864) and deaths 1864–1975, with one more year added each spring. Most index entries open the register image free; deaths before 1871 are index only. [S8] Findmypast, Ancestry and FamilySearch also carry the indexes. If one site returns no hit, search the others before treating the index as silent.\n- **From the event's townland or parish.** Use a townland database or a genealogical atlas. Brian Mitchell's *A New Genealogical Atlas of Ireland* (2nd edition) maps poor law unions alongside civil parishes, Catholic parishes and baronies. Either route requires a supported townland or parish first. [S1]","sources":["S8","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-myheritage-birth-death-index-coverage","kind":"portal-availability","anchor":"**MyHeritage birth and death indexes.** Check the event year and jurisdiction first. MyHeritage’s *Ireland Births, 1864–1958* and *Ireland Deaths, 1864–1958* cover all 32 counties from 1864 through 1921 and only the Republic of Ireland from 1922 through 1958. [S27 @2026-11-21] [S28 @2026-11-21] [S29 @2026-11-21] Within those bounds, search the matching MyHeritage index by name, event year and place if IrishGenealogy.ie yields no hit or if a Republic birth falls beyond its public birth range.","sources":["S27","S28","S29"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-de876f1ace4c","kind":"method","anchor":"Carry the registration district from an index hit to the register search, along with name, year and event type. In Johnson’s 1871 example, Kilrush was the district that led from the Findmypast index to the IrishGenealogy register image [S1]. Transcribe the residence from the entry under its own field.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-prefix-omission","kind":"method","anchor":"Search relevant O’ and Mac surnames with and without their prefix. Matheson recorded prefixed and unprefixed forms in the same record [S18]. Log each form separately and compare the person, place and event before linking hits [S23].","sources":["S18","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-62b83eb09aa8","kind":"unclassified","anchor":"From the index entry, copy these fields exactly: year, quarter (from 1878 only), registration district, volume, page and mother's maiden name if shown. [S1] The national indexes for 1864–1877 are annual and have no quarter. For those years, record the year only and leave the quarter field empty rather than guessing one.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8c52b294d258","kind":"portal-availability","anchor":"- **Prefer the online image.** Where IrishGenealogy.ie opens the register image, cite that image. The next two bullets, on certificate films, apply only to an entry it shows without an image (such as a death of 1864–1870) or to a FamilySearch film locator you already hold. [S26 @2026-11-19]\n- **Don't use the index film number.** It belongs to the index, not the certificates. Ignore it when choosing the certificate film. [S1]\n- **Check the volume first.** Confirm you are in the correct volume before going to the page; the presenter notes that one certificate film can hold several volumes. [S1]\n- **Separate registration quarter and birth date.** Births are registered after they happen, so put the quarter in its own field. Take the event date only from the certificate. Johnson reports a March 1942 birth indexed in April–June 1942 [S1 @2026-11-19]. Include the following quarter when searching near a quarter boundary.\n- **Check the remaining results.** Page through the entire result set and compare the mother’s maiden surname where the index supplies it. Johnson located a candidate on page two and checked the maiden surname there [S1 @2026-11-19].","sources":["S26","S1"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4b16271f98c1","kind":"unclassified","anchor":"Where the actual search expands name variants only for the primary party and treats the second-party name literally, rerun the marriage search with the parties exchanged, even after a plausible hit. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-myheritage-marriage-potential-spouses","kind":"platform-ui","anchor":"**Marriage spouse lists.** MyHeritage's Ireland Marriages, 1845-1958 index gives the bride and the groom separate entries. [S11 @2026-11-16] It then links every name indexed under the same reference, so an entry's potential spouses are everyone on that register page, not the confirmed spouse (collection page as captured 19 July 2026). [S12 @2026-11-16] Do not record a potential spouse as the spouse. Search each party under their own name, pair two entries only when their locators agree, and take the spouse from the register entry.","sources":["S11","S12"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-index-coverage-to-1958","kind":"portal-availability","anchor":"**Marriages after the IrishGenealogy.ie range.** The MyHeritage index covers all 32 counties from 1845 to 1921 and the Republic of Ireland to 1958. [S12 @2026-11-16] FamilySearch's Ireland, Civil Registration Indexes, 1845-1958 also indexes marriages to 1958 and leaves out Northern Ireland from 1922. [S13 @2026-11-16] For a Republic marriage later than the last year IrishGenealogy.ie shows, search one of these indexes before reporting the index as silent. Neither includes Northern Ireland after 1921.","sources":["S12","S13"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f1de56efc637","kind":"unclassified","anchor":"**Coverage.** Civil registration of non-Catholic marriages began in 1845. Registration of all births, deaths and marriages began in 1864. [S1] IrishGenealogy.ie releases records under a 100/75/50-year rule (births older than 100 years, marriages older than 75, deaths older than 50) and adds about one more year each year. Work out the current cutoff for the event type before you report a search as complete.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-42470433ba15","kind":"unclassified","anchor":"**Northern Ireland after 1921.** IrishGenealogy.ie holds no Northern Ireland civil records after 1921, so a nil result there is not a negative search. [S1] The presenter described FamilySearch films of Northern Ireland indexes and certificate images for 1922–1959 as restricted. Record that as an access status, not as \"no record\". [S1] Search GRONI (General Register Office Northern Ireland) instead. It holds the registrations for what is now Northern Ireland from the start, births and deaths from 1864 and marriages from 1845 (non-Catholic) and 1864 (all), so it also covers six-county events before 1922. [S7] GRONI Online shows births over 100 years old, marriages over 75 and deaths over 50. [S6] Its free name search shows only how many matches exist. Viewing results needs an account holding credits (£0.50 each): the basic index is then free, the enhanced index costs 1 credit and the full entry or register image 5 credits, as of 7 November 2026. [S9]","sources":["S1","S7","S6","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b22444168c8e","kind":"unclassified","anchor":"**Privacy gate:** <!-- privacy-gate: request --> An entry younger than those limits can name people who may be living; answer the privacy gate in `SKILL.md` before viewing or ordering one. For a later entry, book GRONI's Public Search Room in Belfast, which shows records up to the present at the same credit prices, or order a certificate. [S6], [S9] PRONI's search room also has GRONI terminals for the indexes and some scanned certificates. [S10]","sources":["S6","S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-full-age-threshold","kind":"method","anchor":"Record a nineteenth-century Irish marriage’s \"full age\" as the reported status of 21 or over, retaining the literal wording. The CSO describes full-age/minor entries in the 1864 registers [S14], and the historical full-age threshold was 21 [S15]. Use it as a reported lower bound, not an exact age or calculated birth year [S20].","sources":["S14","S15","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-maternal-surname-index","kind":"method","anchor":"When a birth-index entry supplies the mother’s maiden surname, search the two parents’ surnames with the district and date range for other children. IrishGenealogy’s learning module demonstrates this search [S17]. Compare the parents and residence on each candidate’s register image before grouping the children, and leave the maiden-name field unrestricted when the index does not supply it. Only a transcript excerpt was inspected for the video’s search suggestion [S22].","sources":["S17","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-birth-baptism-discrepancy","kind":"method","anchor":"When the civil birth date is later than a baptism attributed to the same child, retain both dates and the registration date. Establish the child’s identity and check the dates of both events. An established baptism date gives a latest possible birth date; a later civil birth date conflicts with that bound. Santry discusses parents declaring a later birth to avoid a late-registration fine [S19]; keep that as a possible explanation, not a motive proved for this family. Do not turn the baptism date into the birth date [S20].","sources":["S19","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bfb0de8ee4f5","kind":"method","anchor":"Look up the Church of Ireland parish in the RCB Library’s *List of Church of Ireland Parish Registers* [S24]. Read the colour key and the full parish entry, including separate lines for losses and surviving material as Johnson demonstrates [S2]. Record the date range and the disposition that applies to the register you need:","sources":["S24","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7374c136fb97","kind":"unclassified","anchor":"- held by the Representative Church Body (Dublin)\n- held by PRONI (Belfast)\n- lost, but some material later recovered and now held by the RCB or PRONI\n- lost in 1922\n- still in local custody\n- deposited in whole or in part in the former Public Record Office of Ireland","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-221c74770d9f","kind":"unclassified","anchor":"Most surviving registers are at the RCB Library (about 1,100 collections) or PRONI, but about 500 collections are still in local custody. [S2] In a \"local custody\" parish the incumbent holds the originals. PRONI has microfilmed virtually all Church of Ireland registers in Northern Ireland, and its collection also covers Cavan, Donegal and Monaghan (Irish Ancestors), so check PRONI's copy first. Ask the incumbent only when no archive copy exists. Also note any online transcriptions the list mentions, such as RootsIreland or Findmypast. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4032f0ee5e4b","kind":"unclassified","anchor":"Many Church of Ireland registers were destroyed in the 1922 Four Courts fire. [S2] Rely on the parish-level entry in the list, not on any overall loss figure. If the list marks a parish's registers as lost, do not request them. Record the loss, and name any recovered material, abstracts or transcripts as the next route.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-36d067fd2d77","kind":"unclassified","anchor":"For Northern Ireland, and for Presbyterian records, use PRONI's guide to church records. Before visiting, identify the denomination and the year ranges held. PRONI holds records for most Northern Ireland Presbyterian congregations (originals and microfilm). [S2] PRONI also holds church records for five border counties: Monaghan, Cavan, Donegal, Leitrim and Louth. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-08d0eea244ec","kind":"unclassified","anchor":"- the jurisdiction table, with each unresolved field marked\n- how the district was identified (index entry or atlas/database lookup)\n- the certificate locator: year, quarter (or \"annual index\" for 1864–1877), district, volume and page\n- the certificate film/volume or image actually opened\n- the registration quarter and the certificate's event date, kept as separate fields\n- for church registers, the parish disposition and the custodian chosen","sources":[],"checked":null,"stated_as":null,"review":"pending"}
