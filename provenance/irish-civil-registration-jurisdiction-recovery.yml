claims:
  - {"id":"C-98e3afeabea2","kind":"unclassified","anchor":"Record each of these as its own field: townland, civil parish, Roman Catholic parish, poor law union / registration district, barony and county (add the province if known). Do not copy one unit's name into another field. Names and boundaries differ between these units, and different record series are arranged by different units. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9657498b241e","kind":"unclassified","anchor":"- **Civil parish vs Catholic parish.** Keep them separate. In County Cork, the civil parish of Clonfert (barony of Duhallow) is divided between two present-day Catholic parishes, Newmarket and Rock and Meelin, and their boundaries do not match the civil parish. [S3] Lewis's 1837 *Topographical Dictionary* instead gives Kanturk and Newmarket as its Catholic parochial districts [S4], so match the Catholic parish to the date of the record. Civil parishes generally, though not always, shared boundaries with Church of Ireland parishes until disestablishment (Irish Church Act 1869, in force 1 January 1871). For a record before 1871, confirm the match against Lewis's entry for the parish or the RCB register list before treating the two as one unit. After that date, do not assume they match.\n- **Barony.** A barony name may also appear as the name of another unit with different boundaries. The presenter's example is Duhallow. Do not assume the matching unit is the same place. [S3]\n- **Townland.** Never identify a townland from its name alone. Townland names repeat across Ireland, sometimes within one county. Accept a townland only if it appears in the townland list of the parish you already support. Otherwise, record it as unresolved. [S3]","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2243d22fdf1d","kind":"unclassified","anchor":"The registration district is the key field for a civil search. The district named in the indexes is the superintendent registrar's district, which has the same boundaries as the poor law union. [S1] Registrars' (dispensary) districts are smaller subdivisions of it. Do not put a registrar's district name in the district field. Get the district in one of two ways:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7002155a330","kind":"unclassified","anchor":"- **From a civil-registration index entry.** Search IrishGenealogy.ie first. It is free and needs no registration. It covers the whole island to the end of 1921 and the Republic only from 1922: births 1864–1925, marriages 1845–1950 (Catholic marriages from 1864) and deaths 1864–1975, with one more year added each spring. Most index entries open the register image free; deaths before 1871 are index only. [S8] Findmypast, Ancestry and FamilySearch also carry the indexes. If one site returns no hit, search the others before treating the index as silent.\n- **From the event's townland or parish.** Use a townland database or a genealogical atlas. Brian Mitchell's *A New Genealogical Atlas of Ireland* (2nd edition) maps poor law unions alongside civil parishes, Catholic parishes and baronies. Either route requires a supported townland or parish first. [S1]","sources":["S8","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-de876f1ace4c","kind":"unclassified","anchor":"Record the district under its own name, separately from the parish and town fields. In the presenter's example, a Findmypast index hit for 1871 gave Kilrush as the district. He then searched the civil records on IrishGenealogy.ie by name, district, year and event type, passed the CAPTCHA, and opened the register image. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-62b83eb09aa8","kind":"unclassified","anchor":"From the index entry, copy these fields exactly: year, quarter (from 1878 only), registration district, volume, page and mother's maiden name if shown. [S1] The national indexes for 1864–1877 are annual and have no quarter. For those years, record the year only and leave the quarter field empty rather than guessing one.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8c52b294d258","kind":"unclassified","anchor":"- **Prefer the online image.** Where IrishGenealogy.ie opens the register image, cite that image. The next two bullets, on certificate films, apply only to an entry it shows without an image (such as a death of 1864–1870) or to a FamilySearch film locator you already hold. [S8]\n- **Don't use the index film number.** It belongs to the index, not the certificates. Ignore it when choosing the certificate film. [S1]\n- **Check the volume first.** Confirm you are in the correct volume before going to the page; the presenter notes that one certificate film can hold several volumes. [S1]\n- **Don't treat the quarter as the birth date.** In the presenter's example, the index showed a registration quarter of April–June 1942, but the child was born in March 1942. Births are registered after they happen, so put the quarter in its own field. Take the event date only from the certificate. [S1]\n- **Page through every result.** Do not stop at the first page of index hits. In the presenter's example, the target was on the second page. [S1]","sources":["S8","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4b16271f98c1","kind":"unclassified","anchor":"Where the actual search expands name variants only for the primary party and treats the second-party name literally, rerun the marriage search with the parties exchanged, even after a plausible hit. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f1de56efc637","kind":"unclassified","anchor":"**Coverage.** Civil registration of non-Catholic marriages began in 1845. Registration of all births, deaths and marriages began in 1864. [S1] IrishGenealogy.ie releases records under a 100/75/50-year rule (births older than 100 years, marriages older than 75, deaths older than 50) and adds about one more year each year. Work out the current cutoff for the event type before you report a search as complete.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-42470433ba15","kind":"unclassified","anchor":"**Northern Ireland after 1921.** IrishGenealogy.ie holds no Northern Ireland civil records after 1921, so a nil result there is not a negative search. [S1] The presenter described FamilySearch films of Northern Ireland indexes and certificate images for 1922–1959 as restricted. Record that as an access status, not as \"no record\". [S1] Search GRONI (General Register Office Northern Ireland) instead. It holds the registrations for what is now Northern Ireland from the start, births and deaths from 1864 and marriages from 1845 (non-Catholic) and 1864 (all), so it also covers six-county events before 1922. [S7] GRONI Online shows births over 100 years old, marriages over 75 and deaths over 50. [S6] Its free name search shows only how many matches exist. Viewing results needs an account holding credits (£0.50 each): the basic index is then free, the enhanced index costs 1 credit and the full entry or register image 5 credits, as of 7 November 2026. [S9]","sources":["S1","S7","S6","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b22444168c8e","kind":"unclassified","anchor":"**Privacy gate:** <!-- privacy-gate: request --> An entry younger than those limits can name people who may be living; answer the privacy gate in `SKILL.md` before viewing or ordering one. For a later entry, book GRONI's Public Search Room in Belfast, which shows records up to the present at the same credit prices, or order a certificate. [S6], [S9] PRONI's search room also has GRONI terminals for the indexes and some scanned certificates. [S10]","sources":["S6","S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bfb0de8ee4f5","kind":"unclassified","anchor":"For Church of Ireland parishes, look up the parish in the RCB Library's published list of Church of Ireland parish registers first. The presenter reached it by searching for \"list of Church of Ireland registers\". The list is colour-coded. Record the parish's disposition as one of the following: [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7374c136fb97","kind":"unclassified","anchor":"- held by the Representative Church Body (Dublin)\n- held by PRONI (Belfast)\n- lost, but some material later recovered and now held by the RCB or PRONI\n- lost in 1922\n- still in local custody\n- deposited in whole or in part in the former Public Record Office of Ireland","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-221c74770d9f","kind":"unclassified","anchor":"Most surviving registers are at the RCB Library (about 1,100 collections) or PRONI, but about 500 collections are still in local custody. [S2] In a \"local custody\" parish the incumbent holds the originals. PRONI has microfilmed virtually all Church of Ireland registers in Northern Ireland, and its collection also covers Cavan, Donegal and Monaghan (Irish Ancestors), so check PRONI's copy first. Ask the incumbent only when no archive copy exists. Also note any online transcriptions the list mentions, such as RootsIreland or Findmypast. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4032f0ee5e4b","kind":"unclassified","anchor":"Many Church of Ireland registers were destroyed in the 1922 Four Courts fire. [S2] Rely on the parish-level entry in the list, not on any overall loss figure. If the list marks a parish's registers as lost, do not request them. Record the loss, and name any recovered material, abstracts or transcripts as the next route.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-36d067fd2d77","kind":"unclassified","anchor":"For Northern Ireland, and for Presbyterian records, use PRONI's guide to church records. Before visiting, identify the denomination and the year ranges held. PRONI holds records for most Northern Ireland Presbyterian congregations (originals and microfilm). [S2] PRONI also holds church records for five border counties: Monaghan, Cavan, Donegal, Leitrim and Louth. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-08d0eea244ec","kind":"unclassified","anchor":"- the jurisdiction table, with each unresolved field marked\n- how the district was identified (index entry or atlas/database lookup)\n- the certificate locator: year, quarter (or \"annual index\" for 1864–1877), district, volume and page\n- the certificate film/volume or image actually opened\n- the registration quarter and the certificate's event date, kept as separate fields\n- for church registers, the parish disposition and the custodian chosen","sources":[],"checked":null,"stated_as":null,"review":"pending"}
