claims:
  - {"id":"C-49e87bf33633","kind":"unclassified","anchor":"- If the user is helping someone else (a client, relative or adoptee), do not draft a message for sending until the tester has explicitly agreed to all of the following, and record each answer:\n  - who makes the first contact (the helper or the tester);\n  - which matches the helper may contact;\n  - what may be disclosed: the case question, the adoptee's or NPE status, names, birth details and tree links.\n- Require a written informed-consent agreement. It must state that the helper does not discuss the case with others, and does not contact matches, without the tester's permission. The reason: that contact may be the only one the tester ever gets with that person [S1]. Treat a first message as final: you cannot revise it later.\n- If consent is missing or unclear, stop at the contact plan and a draft for the tester to review. Do not choose recipients yourself.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c5c27cc91c08","kind":"method","anchor":"- **Distant cousins (second cousin or further, where the match is not itself evidence of the parentage question).**\n  - With the tester's permission, a helper may write in the helper's own name.\n  - Ask for something factual and limited, such as sharing a locked or missing tree (\"I'm helping someone; could you please share your tree with us?\").\n  - Source: Eberle's practice in client cases [S4].\n- **Possible birth parent, half-sibling or another immediate relative implicated in the question.**\n  - The tester sends the message, not the helper. The helper only supports, for example by drafting the message and keeping the log. [S4]\n  - Use a contact route the tester already has, the testing site's messaging, or a relative who agrees to pass the message on. Do not search for the recipient's address, phone number, email or online accounts (Living people, in `SKILL.md`).\n  - Use a fill-in template that sets out facts only:\n    - the sender is an adoptee (or describe the situation);\n    - the sender has DNA tested and has these matches;\n    - the sender was born in this place in this year;\n    - if known and permitted, the birth mother's name.\n  - Then ask for help. The letter must not state the conclusion. Leave the recipient to work it out and decide whether and how to reply. [S4]\n  - Eberle credits this kind of model letter to a template a genetic genealogist published in 2017, and points to The DNA Geek blog [S4]. Leah Larkin published the template as *Letter to a Birth Parent* in 2017 [S22]. Read the published template before using it. Do not reconstruct it from memory.\n- **First cousins, aunts, uncles and anyone in between.** Put them in the sensitive tier unless the tester decides otherwise. A close relative's reply can itself reveal the parentage answer.\n- **A close relative does not reply.** Stop sending follow-ups. With the tester's permission, use Jones's alternative [S3]. Write instead to a second cousin on the same line. Ask only for a place, date or family connection. Keep the close match's identity and the parentage question private.\n- **A previously responsive match goes quiet.** A participant reported that a 570 cM match initially discussed the connection and then stopped replying. Record the last exchange and any contact preference. If the person asked for no further contact, stop there. If the tester chooses to write again, Bardige recommended the following approach [S8]. Wait at least a year, then send a new sensitive-tier message, not a reminder.","sources":["S4","S22","S3","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-947769f315cb","kind":"unclassified","anchor":"Address the message so that it works whether the recipient is the tester or someone managing the kit. Rossi manages several kits and warns against assuming that the reader is the matching tester, or that you are matching their own kit [S5]. Include:","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-05e2fcca13e9","kind":"unclassified","anchor":"1. Who you are, whose kit you are writing about (your own or one you manage), and what the research is for.\n2. The exact kit pair: your managed kit's name, and their kit name or username.\n3. The site where the two kits match. Testers may have uploaded to several sites [S5].\n4. Shared cM and the longest segment, copied from that site's display for that pair [S5]. If a value is not displayed, leave it out. Never estimate it.\n5. One hypothesis, if you have one, such as a surname or town you saw in their tree [S5]. Label it as a hypothesis and keep it to a single sentence.\n6. A link to your online tree, if one exists. Do not write out the whole tree [S5].\n7. One specific question.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b3b9f7e72506","kind":"unclassified","anchor":"Keep it short. The aim is that the recipient does not have to move from website to website to find the match, and has enough to form their own hypothesis [S5]. Some testers care only about ethnicity results and may have no genealogical information [S5], so make the question answerable without genealogical knowledge.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-04686a87e6ee","kind":"unclassified","anchor":"Check the match's linked tree for signs that someone other than the tester runs the kit, sometimes the family's genealogist [S9]. If so, write to that person. In the sensitive tier, the tester decides first whether that person may be contacted (step 1).","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2d814b1aeecd","kind":"unclassified","anchor":"Do not make the one question a request for access to the recipient's test results. Ask for that only after they have replied. Legacy Tree lists results access among useful requests to a genetic cousin [S6]. This governs what a message asks; a site's own connection or sharing request, such as 23andMe's, follows that site's recipe.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3aaaff311129","kind":"method","anchor":"Ask a question the recipient can answer from their records. Milgrom reports that questions to Iberian matches about Jewish lineage drew no replies. After she asked whether their family records reached the 1400s or 1500s, some matches could answer [S10]. Ask about a person, place or period without assigning an ancestry to the recipient. Milgrom sent short versions in English and Spanish; choose languages the recipient is likely to use [S10].","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6c7cdc9a6526","kind":"unclassified","anchor":"- **Privacy gate:** <!-- privacy-gate: contact, publish --> The invitation, and any tree snapshot or family photos sent with it, reach a living person and may show other living relatives; answer the privacy gate in `SKILL.md` first.\n- **Channel and identity.** Reach the relative through a route the tester already has, or through a relative who knows them and agrees to pass the message on. Do not search for their email address, phone number or social-media accounts. Write from an identity the recipient can look up and confirm is real; when the route is email or social media, the presenter prefers social media for that reason. Do not cold call or send unsolicited postal letters: strangers' contact raises scam worries, and the recipient has to trust that you are real before you can persuade them to test [S2].\n- **Say what the test would resolve.** Name the specific question, such as which ancestor or which brick wall, and why the answer is good for the recipient. \"If you can DNA test, we can learn so much more about the family\" is the vague form the presenter criticises [S2].\n- **Help them recognise the connection.** Offer a tree snapshot, or photos of relatives you share or of their own family. Second cousins of a grandparent may still know people you know. [S2] The presenter warns to be careful with attachments [S2]. Since the barrier at this point is scam suspicion, put the snapshot in the message body or send a tree link rather than an unsolicited file.\n- **Privacy.** If asked, describe the privacy risks plainly. Do not sugarcoat them or lie [S2]. Do not assert any company's current privacy terms unless you have checked them.\n- **Kits.** If the user is supplying kits, say up front that the recipient will not pay. The presenter treats a prepaid kit as removing a major barrier [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e5f662fabea0","kind":"unclassified","anchor":"Before the first message to any match, and before posting about the case online, save dated screenshots of the match entry (kit names, shared cM, longest segment) and of any tree linked to the match. Keep them with the log. Matches may later make their profiles private or remove their trees [S7].","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-288c123fd985","kind":"method","anchor":"Record a missing reply as **no response as of [date]**, never as “refused” or “declined”. Jones describes a parentage search that narrowed to six brothers. More than a year after contact, the family had not replied [S3]. Leave the reason for the silence and the identity of the father unresolved. A contact log establishes only what was sent, received or expressly declined.","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f503a381b358","kind":"unclassified","anchor":"Record a reply such as \"no, I don't recognise those names\" as **does not recognise**, never as \"no connection\". Bardige notes that this is the usual answer to a list of surnames and towns. It means only that the names are not in the recipient's documented tree, so it does not count against the hypothesis [S8].","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e6e12947fd7e","kind":"method","anchor":"For a line from France, recruit testers among descendants of emigrants, such as Québécois or Acadian families, and expect few testers living in France [S11]. French law permits genetic examination of a person for medical or scientific-research purposes and for anti-doping, not for genealogy, and fines a person who requests one outside the legal conditions €3,750 (articles in force when checked on 2026-11-12) [S12], [S13]. Some people in France test anyway: a French law firm cited an estimate of three million in July 2026 [S14]. Do not read a lack of France-resident matches as evidence against a French origin.","sources":["S11","S12","S13","S14"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ee5687cd44be","kind":"method","anchor":"When two close matches point to the same paternal family, ask a relative you can already reach which brothers were in that family [S17]. Keep the question to family structure and use the replies to build a candidate list. Agreement on a surname does not identify the father.","sources":["S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-098e3377db82","kind":"method","anchor":"If records point to a possible connection through enslavement, offer the match the relevant historical records in place of the checklist question and say explicitly that you expect no reply or information in return [S15] [S16]. Leave ancestry estimates out of the outreach decision. Send cleared excerpts if the match accepts the offer.","sources":["S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-49e681669f7a","kind":"method","anchor":"Ask the match whether an older relative who may have known the person would be willing to look at the photograph. After clearing the photo for both recipients, share it through the match and ask who the relative recognizes without suggesting an identity [S18] [S19]. Log any recognition as that relative's attributed claim. Never use facial resemblance as identity evidence.","sources":["S18","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-33f2362854e1","kind":"method","anchor":"When following up on an unexpected match, share a birth surname of the tester's parent if the parent later used another surname and the disclosure is cleared. Ask whether the match recognizes the birth surname from their family's papers [S20]. Treat a mention as a lead to check before assigning a relationship.","sources":["S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ebfa7f5c931d","kind":"method","anchor":"If shared matches point to a common ancestral line and a private descendants' group already exists, offer the tester an invitation and let them decide whether to join [S21]. With permission for that audience, ask the group for family-branch information and for volunteers to test. Keep candidate parents' names and individual DNA results out of the group post.","sources":["S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
