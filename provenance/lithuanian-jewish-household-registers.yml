sources:
  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2023/11/myheritage-adds-4-7-million-historical-records-in-october-2023/"],"published":"2023-11-08","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the provider credit, field description, historical geographical scope and explicit account of missing originals. The source check used the public description.","entry_sha256":"25bd5f6c72438b983573b3a66861e0d089ead7917514f3df4d198874912dacde","claims":["C-01","C-02","C-03"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://www.litvaksig.org/welcome-to-myheritage-visitor/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The data provider directs users to its All Lithuania Database and the separate Vilnius project.","entry_sha256":"0fe0cb6f06791859f681a716638d1f065385b37886e292ff85d6c08147206e58","claims":["C-02"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.litvaksig.org/research/special-projects/vilnius-household-registers"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Read the geographic and chronological scope and project’s batch-based indexing instructions.","entry_sha256":"78ce2c81c09f4971ff72b38144b30062bd47c81fd3361287bb518b038a0f6a5d","claims":["C-02","C-03"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://www.litvaksig.org/information-and-tools/archives-and-repositories/lithuanian-central-state-archives"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Provider describes LCVA custody of the Vilnius household registers and the historical jurisdiction.","entry_sha256":"293f8b229846db735c664f44f6a709e7078f93abcf505227b25fbd78aeb0c95b","claims":["C-03"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://blog.myheritage.com/2023/10/myheritage-adds-43-million-historical-records-in-september-2023/"],"published":"2023-10-03","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Esther Shuman’s collection announcement describes the household-register and revision-list indexes, their usual fields, gaps in the available years and their historical geographic scope.","entry_sha256":"dba5131fbf3b47cab9cd7d2690abe3f2617e0f6b36198891a09e329d46c44b62","claims":["C-01","C-04"],"review":"reviewed"}
  - {"id":"S6","kind":"catalogue","urls":["https://www.myheritage.pl/research/collection-20672/lithuanian-jewish-household-registers-from-litvaksig-1835-1946?legacyCategoryCollectionUrl=1"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The public collection page opened in Polish and confirmed the provider, advertised span, birth and residence fields, parents’ names and geographic scope. The source check used the collection description.","entry_sha256":"fbbeeffede6422fa363db7f3a2213036f32027aabd40aac9f5e8ac4ab5bb9ee5","claims":["C-01"],"review":"reviewed"}
  - {"id":"S7","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-20670/lithuanian-jewish-revision-lists-from-litvaksig-1795-1942"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The public collection page confirmed the provider, advertised span, indexed birth and residence details and father’s name. The source check used the collection description and public search form.","entry_sha256":"5d58e932eee8d523d80e9dc2d076d36f9241b884a76c70c9598ae170dd5b5088","claims":["C-04"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://www.litvaksig.org/information-and-tools/archives-and-repositories/revision-lists-and-other-census-lists"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The data provider identifies 1858 as the final imperial revision, describes later family lists and explains that official registration and physical residence could differ.","entry_sha256":"cc6490155cd9aca2a9908083107b21ad53ce258468b9cde61ad845a032734db2","claims":["C-05"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"portal-availability","anchor":"Use MyHeritage’s Lithuanian-Jewish Household Registers from LitvakSIG (1835–1946) as a starting index. Record the birth date, birthplace and parents’ names as shown. Log residence with its own place and date. Check the locality under its period jurisdiction, including relevant places that now fall outside Lithuania. [S1 @2026-11-22], [S5 @2026-11-22], [S6 @2026-11-22]","sources":["S1","S5","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"portal-availability","anchor":"From the MyHeritage collection, go to the provider’s All Lithuania Database and the Vilnius Household Registers project. For interwar Vilnius, check the list of released batches separately from the name query. [S1 @2026-11-18], [S2 @2026-11-18], [S3 @2026-11-18]","sources":["S1","S2","S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"custody","anchor":"Distinguish destruction of the original from a surviving but unindexed register. The Lithuanian Central State Archives holds the interwar Vilnius registers, and LitvakSIG indexes them in batches. When the locality, street or year is outside what you inspected, leave residence in that interval unresolved. [S1 @2026-11-18], [S3 @2026-11-18], [S4 @2026-11-18]","sources":["S1","S3","S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"portal-availability","anchor":"Search MyHeritage’s Lithuanian-Jewish Revision Lists from LitvakSIG (1795–1942) as a companion index for the historical locality. Record the birth date or year, the father’s name and the place and date indexed as residence when shown. [S5 @2026-11-22], [S7 @2026-11-22]","sources":["S5","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"historical","anchor":"The last imperial revision was compiled in 1858. For later hits, identify the underlying list type before citing it. A family could be registered in one town and live in another. Corroborate the stated residence with a household register or another record that places the person there. [S8]","sources":["S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
