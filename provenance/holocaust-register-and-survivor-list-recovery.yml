claims:
  - {"id":"C-lodz-register","kind":"method","anchor":"For an apparent Łódź ghetto resident, search the Łódź Ghetto List and record the apartment and any former address, occupation, birth, deportation or death detail. Carry the apartment into the original address-arranged register. The register stopped before it could record the fate of people deported to Auschwitz in the ghetto's last days [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-flossenburg-index","kind":"method","anchor":"For Flossenbürg, record the prisoner number, nationality and admission date in the named list. Cite it as a postwar evidentiary compilation prepared for a war-crimes trial. Carry the result to USHMM RG 30.005M. Read any death date in the scope of deaths at the camp. If it is blank, investigate later records for transfer or fate [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dachau-index","kind":"method","anchor":"For Dachau, record the prisoner number, category, residence, arrival and any disposition. Decode category and disposition using the index's abbreviation glossary. Carry the identifying details to the captured German records. A blank or illegible disposition leaves the outcome unresolved [S1] [S6].","sources":["S1","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pinkas-one","kind":"method","anchor":"For *Pinkas HaNitzolim*, Volume I, capture the name, age or birth year, places of residence and any father's name or occupation. Use the index's source-list references and the list table to locate the relevant pages. Interpret residence against the heading and date of that particular list before assigning a home or postwar location [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-yizkor","kind":"method","anchor":"On a Yizkor Book Name Index hit, capture the town, book title, list description and page. Open the passage before using the name. Its heading determines whether the entry is a survivor list, memorial list, historical roster or another kind of mention [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pinkas-two","kind":"method","anchor":"In *Pinkas HaNitzolim*, Volume II, use name and place of last registration to identify the entry. Read that place as a registration observation and trace it to the underlying Jewish Local Council material described in the register's introduction [S1] [S8].","sources":["S1","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-sharit","kind":"method","anchor":"For *Sharit haPlatah*, record the surname, given name, any maiden surname, birthplace, birth year and reported 1945–1946 location. Use the page and line number to find the entry in the revised first volume [S1] [S9].","sources":["S1","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-tashkent","kind":"method","anchor":"Search the Tashkent refugee index for name and birth year, then read the recorded residence independently of the evacuation destination. Record the card's registry list and page. The index describes people registered after arriving directly in Tashkent. Keep other arrival routes into Uzbekistan and other Soviet republics open after a miss [S1] [S7].","sources":["S1","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-auschwitz-index-fee","kind":"fee","anchor":"For a possible death at Auschwitz in 1941–1943, search MyHeritage's *Auschwitz Death Certificates, 1941–1943*, listed as a free index [S10 @2026-11-21] [S11 @2026-11-21].","sources":["S10","S11"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-auschwitz-death-books","kind":"method","anchor":"Open the matching result and cite it as an index entry [S11] [S12]. Use the indexed name and death date to locate the underlying *Sterbebücher* certificate and record its number when found [S11] [S13]. Keep fate open after a miss because the surviving Death Books cover only recorded deaths of registered prisoners from 29 July 1941 through 31 December 1943 [S13].","sources":["S11","S12","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-jewishgen-holocaust-search","kind":"portal-availability","anchor":"Search the JewishGen Holocaust Database when the person’s wartime or postwar record type is unclear [S14 @2026-11-22] [S15 @2026-11-22]. Open each relevant component description and record its title and coverage before deciding whether a hit records residence, transport, imprisonment, survival or commemoration [S15 @2026-11-22].","sources":["S14","S15"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bergen-belsen-book","kind":"method","anchor":"For a Jewish prisoner at Bergen-Belsen, search the JewishGen index to the Bergen-Belsen Memorial’s *Book of Remembrance*. Carry the name and any birth, liberation or death detail to the 2005 book entry [S16] [S17] [S18]. Check a locality entered as birthplace against a birth record or an independently documented address before assigning it to either field. The book’s introduction allows for the last address in that position [S16] [S17] [S18].","sources":["S16","S17","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-camp-transfer-alternate-spellings","kind":"method","anchor":"After a miss under the family surname, carry each spelling found on a camp record into the search for the receiving camp. In ITS files, follow cross-reference cards to the spelling used for filing and compare birth date and the prisoner number for the relevant camp before joining entries [S24] [S25].","sources":["S24","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gross-rosen-lists","kind":"method","anchor":"For Groß-Rosen, browse Arolsen Archives’ List Material Groß-Rosen, series 1.1.11.1. Start with group 2616000 for prisoner and number lists if the known camp and dates fit its description [S27]. When an IPN response includes ITS Arolsen copies, separate municipal residence entries from prisoner-list entries and record each document’s date and provenance [S26].","sources":["S27","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-resistance-missing","kind":"method","anchor":"When a posthumous Belgian Resistance Order of the Day records a prisoner as reported missing, cite the named camp and the reported disappearance. Keep the prisoner’s later fate open [S24].","sources":["S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-claims-conference-romania","kind":"method","anchor":"For a Romanian Claims Conference hit, use the JewishGen index to capture the name, any birth date and place, internment place and list code. Leave internment unresolved when the field is blank [S16] [S19] [S20]. Keep the complete code with the citation. For the underlying list, distinguish the JM documents from the Romanian Ministry of Defence collection and the M39 documents from the Odessa Oblast Archives in the compilation based on records at the Central Zionist Archives and Yad Vashem [S20].","sources":["S16","S19","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-claims-conference-hungary","kind":"method","anchor":"For a Hungarian Claims Conference hit, capture the name, alternate surname, any birth details, the recorded address and the *Doc Code*. Read the address as the place recorded when the list was prepared and check the underlying record before assigning it as a place of internment. Use that code in JewishGen’s *Source List* to identify the underlying archival list, distinguishing the Central Zionist Archives and Yad Vashem references [S21] [S22] [S23]. Require separate claim or decision evidence before recording claimant status or approval [S21] [S22].","sources":["S21","S22","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-prignano-cards","kind":"method","anchor":"Start with Paola Trevisan’s transcription of the undated Prignano sulla Secchia municipal cards. Search by name and check the occupation field for *giocoliere* or *ginnasta* when the cards carry no explicit internment label. Check the town’s 1940–1942 birth, marriage and death acts for independent evidence of residence and family relationships [S29]. According to the community account, the cards are filed alphabetically after the wartime evacuee list [S28†] [S42].","sources":["S29","S28","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-prignano-internment-order","kind":"historical","anchor":"For internment under Bocchini’s 11 September 1940 circular no. 63442/10, read records of confinement by municipality. Keep movement within town compatible with internment and look for permission to leave when interpreting movement outside the municipality [S29] [S30]. Use individual entries to establish who was confined [S29].","sources":["S29","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-prignano-chronology","kind":"method","anchor":"Keep the 79 names in the undated Prignano cards separate from the 25 internees recorded in the 31 July 1942 podestà deliberation. Use the podestà’s *condizioni dello spirito pubblico* reports cited under Archivio di Stato di Modena, Prefettura, Gabinetto, to date conditions mentioned in the municipal records [S29]. If the start date affects an individual timeline, retain both dates as attributed options. Trevisan’s *Internment in Localities (Italy)* dates Prignano’s start to 11 November 1940 and her Lucchesi entry gives 18 November 1940 [S30] [S31].","sources":["S29","S30","S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-prignano-site","kind":"method","anchor":"Use the 17 April 1943 garden deliberation in Archivio di Stato di Modena, Prefettura, Atti Generali, 1943, busta 502, to date the change of use of the sports ground. Keep individual release dates and any continued detention open [S29].","sources":["S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-kleszczele-memorial-plaques","kind":"method","anchor":"At the Kleszczele Jewish cemetery memorial, read both plaques before assigning a fate. Its dedication commemorates murdered Jews, while a separate plaque names people remembered as survivors of the ghetto [S35] [S36]. Cite the wording of the plaque on which the person appears [S36].","sources":["S35","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-zakynthos-list-omission","kind":"historical","anchor":"Keep Jewish residence on Zakynthos open after a miss in the list supplied to the German occupiers in late 1943, which contained only the names of the mayor and the metropolitan [S37] [S38].","sources":["S37","S38"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-szeged-station-cards","kind":"method","anchor":"For a possible return to Szeged in 1945, start with the *Szeged, Hungary Survivor List* and follow the hit to the Jewish Community’s station-arrival report card [S32] [S33] [S34]. If a child is missing from the index, check relatives’ cards. Record each person’s stated outcome separately because a returning survivor’s card can also name relatives who died or disappeared [S33].","sources":["S32","S33","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-unrra-sweden","kind":"method","anchor":"For a Polish citizen transported to Sweden from a German concentration camp from late June through November 1945, browse Arolsen Archives series 3.1.1.3, list 2746000, and record the document ID of the matching page [S39] [S40]. Capture parents’ names and exact birth date and place where the entry gives them [S39]. For an April or May 1945 evacuation, check the Swedish Red Cross list identified in the Lund University Library finding aid, volume 34 [S41].","sources":["S39","S40","S41"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-prignano-card-editions","kind":"method","anchor":"Compare the 2003 and 2010 printed tables when a card date conflicts. Use the birthplace column in the 2003 table to locate the civil birth act, and cite the act for the date it records [S29] [S42].","sources":["S29","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-thessaloniki-iosepos-search","kind":"platform-ui","anchor":"For a wartime or postwar lead tied to Thessaloniki, search Iōsēpos by name [S43 @2026-11-23] [S45 @2026-11-23]. To narrow the results, select the relevant collection in Advanced Search and use fields such as title or keywords [S44 @2026-11-23] [S45 @2026-11-23]. Open the item and inspect the document in the viewer. Cite the item identifier and distinguish the document’s creation date from the event it describes. Check whether the name identifies the subject or someone mentioned in the document [S45 @2026-11-23] [S46 @2026-11-23].","sources":["S43","S44","S45","S46"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bialystok-artist-testimony","kind":"method","anchor":"For a Jewish artist who may have been in the Białystok ghetto, use the names attributed to Izaak Celnikier as leads [S47]. Follow the citation to his postwar account *Izaak Celnikier z Warszawy*, Jewish Historical Institute 301/4995. Record the spelling and cite the passage that places the person in the ghetto [S48] [S49]. Compare the name and any identifying details with Jewish Council records in the Białystok Ghetto Archive, fonds 204 [S50], or with a deportation list independent of the recollection. Keep workshop participation and later fate open when the account only places the person in the ghetto [S48].","sources":["S47","S48","S49","S50"],"checked":null,"stated_as":"observation","review":"reviewed"}
