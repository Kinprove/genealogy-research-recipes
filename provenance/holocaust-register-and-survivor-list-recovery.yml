claims:
  - {"id":"C-lodz-register","kind":"method","anchor":"For an apparent Łódź ghetto resident, search the Łódź Ghetto List and record the apartment and any former address, occupation, birth, deportation or death detail. Carry the apartment into the original address-arranged register. The register stopped before it could record the fate of people deported to Auschwitz in the ghetto's last days [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-flossenburg-index","kind":"method","anchor":"For Flossenbürg, record the prisoner number, nationality and admission date in the named list. Cite it as a postwar evidentiary compilation prepared for a war-crimes trial. Carry the result to USHMM RG 30.005M. Read any death date in the scope of deaths at the camp. If it is blank, investigate later records for transfer or fate [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dachau-index","kind":"method","anchor":"For Dachau, record the prisoner number, category, residence, arrival and any disposition. Decode category and disposition using the index's abbreviation glossary. Carry the identifying details to the captured German records. A blank or illegible disposition leaves the outcome unresolved [S1] [S6].","sources":["S1","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pinkas-one","kind":"method","anchor":"For *Pinkas HaNitzolim*, Volume I, capture the name, age or birth year, places of residence and any father's name or occupation. Use the index's source-list references and the list table to locate the relevant pages. Interpret residence against the heading and date of that particular list before assigning a home or postwar location [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-yizkor","kind":"method","anchor":"On a Yizkor Book Name Index hit, capture the town, book title, list description and page. Open the passage before using the name. Its heading determines whether the entry is a survivor list, memorial list, historical roster or another kind of mention [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pinkas-two","kind":"method","anchor":"In *Pinkas HaNitzolim*, Volume II, use name and place of last registration to identify the entry. Read that place as a registration observation and trace it to the underlying Jewish Local Council material described in the register's introduction [S1] [S8].","sources":["S1","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-sharit","kind":"method","anchor":"For *Sharit haPlatah*, record the surname, given name, any maiden surname, birthplace, birth year and reported 1945–1946 location. Use the page and line number to find the entry in the revised first volume [S1] [S9].","sources":["S1","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-tashkent","kind":"method","anchor":"Search the Tashkent refugee index for name and birth year, then read the recorded residence independently of the evacuation destination. Record the card's registry list and page. The index describes people registered after arriving directly in Tashkent. Keep other arrival routes into Uzbekistan and other Soviet republics open after a miss [S1] [S7].","sources":["S1","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
