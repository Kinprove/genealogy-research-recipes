claims:
  - {"id":"C-74db2895bb58","kind":"method","anchor":"Keep the village in the place field, then identify the town that recorded the event at that date. Check the register description or a dated town guide. For Avis Stone of Assonet, Rose cites Freetown’s Register of Births, 1843–1855, book 9, page 3 [S6].","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-284aef7e33ed","kind":"method","anchor":"Do not search only the town as it exists today. Look the town up in a New England town guide and record three things: when it was incorporated or established, any parent town, and any daughter towns. New England towns were often carved out of a larger original town, and the presenter says the records did not move to the new town, so they might be with the older one [S4], [S5]. Her example is Abington, Massachusetts, established in 1712, now in Plymouth County, formerly part of Bridgewater [S4], [S5]. The Massachusetts Historical Commission's 1981 [town report for Abington](https://www.sec.state.ma.us/divisions/mhc/preservation/survey/town-reports/archives/abi.pdf) gives the date as 10 June 1712 (o.s.), when Abington was established from part of Bridgewater. It also lists the later changes: part was ceded to the new town of Hanover in 1712, part became Rockland on 9 March 1874 and part went to South Abington on 4 March 1875 [S7]. Early Abington residents must also be searched in Bridgewater.","sources":["S4","S5","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e7398546674e","kind":"unclassified","anchor":"- For any event dated before the daughter town was set off, search the parent town's books. For any residence after the set-off on land that became a daughter town, search the daughter town's books.\n- Add adjoining towns and counties. A resident might marry across a county line [S4], [S5], and after reading a whole book a researcher may find the family actually lived in the next town [S1].\n- Reference aids:\n  - *Genealogist's Handbook for New England Research*, now in its sixth edition (ed. Rhonda R. McClure, American Ancestors, December 2021), which gives dates established, parent counties, and parent and daughter towns for each state ([publisher page](https://americanancestors.org/genealogists-handbook-new-england-research-6th-edition)). The presenters used the fifth edition [S4], [S5].\n  - The American Ancestors town guides. The [town-guide page](https://AmericanAncestors.org/node/1535) lists seven state guides, including a Vermont Town Guide. The presenter described them as free [S4].\n  - For Massachusetts, the presenter recommends *Historical Data Relating to Counties, Cities and Towns in Massachusetts* [S4]. The linked [Secretary of the Commonwealth page](https://www.sec.state.ma.us/divisions/cis/historical/information-data.htm) returned no readable text; the stated fifth edition (1997, NEHGS) and its town-chronology contents were not confirmed from that page [S10].","sources":["S4","S5","S1","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-250246720322","kind":"unclassified","anchor":"Most town books are the clerk's running minutes [S3]. Treat such a book as a continuous narrative of town business, not as a register sorted by record type. There is no separate section for births, deaths or probates, and marriages, deaths and land sales appear among other business [S1], [S3]. Where a town also kept a separate book of births, marriages and deaths, read that book whole as well. Check each volume for its own index. The [New London, Connecticut catalog entry](https://www.familysearch.org/search/catalog/192308) is a lead to check for volume indexes: the source check reached only a sign-in page, so its reported index note was not confirmed [S11]. The presenter found that indexes almost never exist [S3]. Use an index to find entries quickly, then read the whole volume anyway: an index covers only its own series, not everything in the book [S1].","sources":["S3","S1","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bbf0751643fc","kind":"method","anchor":"- Do not stop at the pages around the expected date. Clerks sometimes recorded a family's remaining children together at a later date, after an earlier birth or marriage entry, so you cannot be sure nothing was missed unless the whole record is read [S2].\n- For each entry you extract, record the volume and the page. Mark it **contemporaneous** or **retrospective** only on evidence of when it was written or copied relative to the event: for example, a clerk's note that it was entered later, ink or hand that matches the surrounding entries, or a statement that the volume is a copy. Arrangement alone, whether date order or family grouping, does not decide the label; when only the arrangement is known, mark the timing **undetermined**. Note the page of a retrospective entry even if a contemporaneous entry for the same event also exists.\n- Compiled extracts, such as James N. Arnold's *Vital Record of Rhode Island, 1636–1850* (21 vols.), are useful but can contain transcription errors and may be too brief to identify a person (e.g. only a child's name and parents' names) [S2]. Use them to find the original page, then read that original.\n- Transcribe a narrative in the birthplace column before assigning an event place or naming a parent. Rose reports that Avis Stone’s Freetown entry says the birthplace was unknown, identifies Levi N. Baker’s doorstep and gives Dr. Sturtevant’s estimate that the child was two hours old [S6]. Record the finding place, stated date and estimated age separately. The name attached to the doorstep establishes neither who found her nor who her parents were.\n- Originals may also be held in historical societies or university special collections, and some may be unreadable because of their condition [S1], [S3]. Record a volume you could not read as **unread**, not as read with no result.","sources":["S2","S6","S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a99d094da89b","kind":"unclassified","anchor":"Clarence Almon Torrey's *New England Marriages Prior to 1700* lists couples married in New England before 1700, sometimes on Long Island, plus parts of Westchester and New Jersey and New Englanders' marriages before they emigrated. It is searchable on American Ancestors, with transcription and manuscript images. Decode the notation with Torrey's own key, as quoted in the [FamilySearch Wiki](https://www.familysearch.org/en/wiki/Torrey's_New_England_Marriages_Prior_to_1700). Decode the wife's whole surname sequence and the notes under her name before you fill in any name field.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bf5f21d3c8b2","kind":"method","anchor":"- **Unbracketed surname:** usually taken from an actual marriage record.\n- **Bracketed surname:** usually inferred with confidence from another source such as a deed or will, not from a marriage record. Brackets tell you how the surname was established, not which marriage it belongs to; its position in the sequence decides that. Only a bracketed surname in the maiden-name position goes in the maiden-name field, marked *inferred*. Then find the deed, will or other source it rests on.\n- **Parentheses and earlier marriages:** a surname after a parenthesized maiden name is her previous married name, so a later surname in the sequence is not a maiden name. If this is not her first marriage, her former husband's first name is shown under her name, and **w** marks a widow. Pass any earlier marriage to the successive-unions step in [evidence/proof judgment](evidence-proof-judgment.md).\n- **Earlier married surname.** In the Walter Dean demonstration the presenter treats brackets as the sign of a previous marriage [S4, S5]. The published key instead uses brackets to flag a surname derived from evidence other than a marriage record [S23]. Use its position among the wife’s names and any widow or prior-husband notation to determine which union it belongs to.\n- **Question mark:** the item is uncertain (the identification is less certain or the source may be questionable). Keep the \"?\" in your transcription and label that item uncertain.\n- **Source abbreviations** at the end of an entry are a short form plus volume and page: \"Snow-Estes 1:387\" is vol. 1, p. 387 of the work abbreviated Snow-Estes, and \"TAG\" is *The American Genealogist* [S4], [S5]. The 2011 edition’s bibliography begins at volume 3, page 1739 [S26]. If a volume or page seems wrong, compare the database transcript with Torrey’s manuscript. Child found that one TAG reference transcribed as volume 2 actually read 22 [S13]. Expand each abbreviation, then go to the cited work itself. An abbreviation you have not expanded is not a citation.\n- **Cut-off.** Torrey compiled his material before his death in 1962. Follow his citations and check later finding aids. For emigrants from Europe in 1607–1657, the Newberry Library lists Meredith B. Colket Jr.’s *Founders of Early American Families* in the 1985 revised edition [S24]. The Ohio Genealogical Society also lists the 2002 second revised edition [S25].","sources":["S4","S5","S23","S26","S13","S24","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-goldie16-a56881c7c0","kind":"method","anchor":"For Connecticut’s Barbour Collection, copy the town, volume and page locator and establish what it points to before retrieving an original. The statewide slips and bound town volumes are transcriptions or abstracts; bound volumes standardise surname spellings and can add another copying stage. Some towns’ slips were made from published compilations, so their page references lead to the printed book rather than a manuscript. Use the town volume’s introduction and abbreviation key, then inspect the identified source for context and transcription accuracy. [S15], [S16]","sources":["S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie16-f29b7c878e","kind":"method","anchor":"Treat Massachusetts Vital Records to 1850, the Tan Books, as compiled evidence drawn from town, church and private records, gravestones and newspapers. Decode the source label for the particular entry and seek that underlying record. Do not describe every Tan Book entry as a transcription of a town clerk’s original, or add a family Bible to its provenance unless the volume identifies one. [S15], [S17]","sources":["S15","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie16-2c16336d86","kind":"method","anchor":"For Massachusetts land, separate the town’s original allotment from the later conveyance record. Search town records for the distribution, then use the county or land district’s Registry of Deeds for recorded transfers. Select the registry that covers the town, rather than assuming the town clerk’s book contains the whole title chain. [S15], [S18]","sources":["S15","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-boston-holbrook-entries","kind":"method","anchor":"For a seventeenth-century Boston resident, search the alphabetical entries in Jay Mack Holbrook’s *Boston Beginnings, 1630–1699* (1980). Copy the name as printed, the record year, the purpose of the entry and the cited source. Check the cited source before using the row’s year as an event date. [S19], [S20]","sources":["S19","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-boston-commissioners-volumes","kind":"method","anchor":"Choose the Boston Record Commissioners’ report by record type. Use volumes 2 and 7 for seventeenth-century town business and volume 9 for early Boston births, baptisms, marriages and deaths. Use the Boston Public Library’s volume guide to identify the report before searching it. [S19], [S21]","sources":["S19","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-boston-birth-coverage","kind":"method","anchor":"If a Boston birth search comes up empty in 1647–1650 or 1675, flag the incomplete town birth coverage identified in the ninth report’s preface. Check the separately labelled First Church baptisms and record any baptism under its own event type. [S19], [S22]","sources":["S19","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-boston-marriage-coverage","kind":"method","anchor":"For a Boston marriage, note the municipal marriage register runs described in the ninth report’s preface for 1651–1662 and 1689–1699. For the intervening years, scan the surrounding town entries, including pages headed *Births and Baptisms*. A marriage appears among the town births on printed page 182. For 1699, also check the two marriage entries added in the preface. [S19], [S22]","sources":["S19","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
