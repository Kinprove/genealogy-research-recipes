claims:
  - {"id":"C-74db2895bb58","kind":"unclassified","anchor":"If the supplied place is a village or another local place name, first identify the town whose register covered it at the event date. Keep the recorded village name and the recordkeeping town as separate fields; do not assume the village has its own clerk or vital-record series. Confirm the relationship from a dated town guide or the actual register description before selecting the books. The Assonet/Freetown register lead illustrates this distinction. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-284aef7e33ed","kind":"method","anchor":"Do not search only the town as it exists today. Look the town up in a New England town guide and record three things: when it was incorporated or established, any parent town, and any daughter towns. New England towns were often carved out of a larger original town, and the presenter says the records did not move to the new town, so they might be with the older one [S4], [S5]. Her example is Abington, Massachusetts, established in 1712, now in Plymouth County, formerly part of Bridgewater [S4], [S5]. The Massachusetts Historical Commission's 1981 [town report for Abington](https://www.sec.state.ma.us/divisions/mhc/preservation/survey/town-reports/archives/abi.pdf) gives the date as 10 June 1712 (o.s.), when Abington was established from part of Bridgewater. It also lists the later changes: part was ceded to the new town of Hanover in 1712, part became Rockland on 9 March 1874 and part went to South Abington on 4 March 1875 [S7]. Early Abington residents must also be searched in Bridgewater.","sources":["S4","S5","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e7398546674e","kind":"unclassified","anchor":"- For any event dated before the daughter town was set off, search the parent town's books. For any residence after the set-off on land that became a daughter town, search the daughter town's books.\n- Add adjoining towns and counties. A resident might marry across a county line [S4], [S5], and after reading a whole book a researcher may find the family actually lived in the next town [S1].\n- Reference aids:\n  - *Genealogist's Handbook for New England Research*, now in its sixth edition (ed. Rhonda R. McClure, American Ancestors, December 2021), which gives dates established, parent counties, and parent and daughter towns for each state ([publisher page](https://americanancestors.org/genealogists-handbook-new-england-research-6th-edition)). The presenters used the fifth edition [S4], [S5].\n  - The American Ancestors town guides. The [town-guide page](https://AmericanAncestors.org/node/1535) lists seven state guides, including a Vermont Town Guide. The presenter described them as free [S4].\n  - For Massachusetts, the presenter recommends *Historical Data Relating to Counties, Cities and Towns in Massachusetts* [S4]. The linked [Secretary of the Commonwealth page](https://www.sec.state.ma.us/divisions/cis/historical/information-data.htm) returned no readable text; the stated fifth edition (1997, NEHGS) and its town-chronology contents were not confirmed from that page [S10].","sources":["S4","S5","S1","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-250246720322","kind":"unclassified","anchor":"Most town books are the clerk's running minutes [S3]. Treat such a book as a continuous narrative of town business, not as a register sorted by record type. There is no separate section for births, deaths or probates, and marriages, deaths and land sales appear among other business [S1], [S3]. Where a town also kept a separate book of births, marriages and deaths, read that book whole as well. Check each volume for its own index. The [New London, Connecticut catalog entry](https://www.familysearch.org/search/catalog/192308) is a lead to check for volume indexes: the source check reached only a sign-in page, so its reported index note was not confirmed [S11]. The presenter found that indexes almost never exist [S3]. Use an index to find entries quickly, then read the whole volume anyway: an index covers only its own series, not everything in the book [S1].","sources":["S3","S1","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bbf0751643fc","kind":"unclassified","anchor":"- Do not stop at the pages around the expected date. Clerks sometimes recorded a family's remaining children together at a later date, after an earlier birth or marriage entry, so you cannot be sure nothing was missed unless the whole record is read [S2].\n- For each entry you extract, record the volume and the page. Mark it **contemporaneous** or **retrospective** only on evidence of when it was written or copied relative to the event: for example, a clerk's note that it was entered later, ink or hand that matches the surrounding entries, or a statement that the volume is a copy. Arrangement alone, whether date order or family grouping, does not decide the label; when only the arrangement is known, mark the timing **undetermined**. Note the page of a retrospective entry even if a contemporaneous entry for the same event also exists.\n- Compiled extracts, such as James N. Arnold's *Vital Record of Rhode Island, 1636–1850* (21 vols.), are useful but can contain transcription errors and may be too brief to identify a person (e.g. only a child's name and parents' names) [S2]. Use them to find the original page, then read that original.\n- A column can contain a narrative instead of its expected value. In the foundling entry reported in S6, the birthplace column describes where the child was found and gives a physician's estimated age. Preserve such wording rather than forcing it into a birthplace field. Keep the finding place, finder if expressly identified, opinion or estimate, and stated date separate. The finding place is not thereby the birthplace, and neither the finder nor the household head is thereby a parent. Unknown parents remain unknown. [S6]\n- Originals may also be held in historical societies or university special collections, and some may be unreadable because of their condition [S1], [S3]. Record a volume you could not read as **unread**, not as read with no result.","sources":["S2","S6","S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a99d094da89b","kind":"unclassified","anchor":"Clarence Almon Torrey's *New England Marriages Prior to 1700* lists couples married in New England before 1700, sometimes on Long Island, plus parts of Westchester and New Jersey and New Englanders' marriages before they emigrated. It is searchable on American Ancestors, with transcription and manuscript images. Decode the notation with Torrey's own key, as quoted in the [FamilySearch Wiki](https://www.familysearch.org/en/wiki/Torrey's_New_England_Marriages_Prior_to_1700). Decode the wife's whole surname sequence and the notes under her name before you fill in any name field.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bf5f21d3c8b2","kind":"unclassified","anchor":"- **Unbracketed surname:** usually taken from an actual marriage record.\n- **Bracketed surname:** usually inferred with confidence from another source such as a deed or will, not from a marriage record. Brackets tell you how the surname was established, not which marriage it belongs to; its position in the sequence decides that. Only a bracketed surname in the maiden-name position goes in the maiden-name field, marked *inferred*. Then find the deed, will or other source it rests on.\n- **Parentheses and earlier marriages:** a surname after a parenthesized maiden name is her previous married name, so a later surname in the sequence is not a maiden name. If this is not her first marriage, her former husband's first name is shown under her name, and **w** marks a widow. Pass any earlier marriage to the successive-unions step in [evidence/proof judgment](evidence-proof-judgment.md).\n- **Trap:** in her Walter Dean example the presenter states a general rule: a bracketed surname is a first married name, and an unbracketed one is the maiden name [S4], [S5]. That rule conflicts with Torrey's key. Do not apply it. Classify each surname by its position and the notes under her name, as above.\n- **Question mark:** the item is uncertain (the identification is less certain or the source may be questionable). Keep the \"?\" in your transcription and label that item uncertain.\n- **Source abbreviations** at the end of an entry are a short form plus volume and page: \"Snow-Estes 1:387\" is vol. 1, p. 387 of the work abbreviated Snow-Estes, and \"TAG\" is *The American Genealogist* [S4], [S5]. A full abbreviation list is available as a PDF on American Ancestors, and the alphabetical source list begins at vol. 3, p. 1739 of the database ([NEHGS Vita Brevis](https://vitabrevis.americanancestors.org/2021/01/torreys-new-england-marriages)). Expand each abbreviation, then go to the cited work itself. An abbreviation you have not expanded is not a citation.\n- **Cut-off:** Torrey died on 5 February 1962 in Newton, Massachusetts, and his sources run to about 1960. Anything published since needs later finding aids. One of these is *Founders of Early American Families* by Meredith B. Colket Jr. The [HSP catalog lead](https://opac.hsp.org/Record/marc-293543) gives a scope of emigrants from Europe, 1607–1657, with revised editions in 1985 and 2002; its fetch returned HTTP 403, so those bibliographic details remain unconfirmed [S14]. Search it when Torrey has no entry for your couple; the presenter says it covers settlers in all 13 colonies, not only New England [S4], [S5].","sources":["S4","S5","S14"],"checked":null,"stated_as":null,"review":"pending"}
