claims:
  - {"id":"C1","kind":"historical","anchor":"According to the presenter, start with the five-volume *Spanish Land Grants in Florida* [S1†]. Use the State Library Board’s 1942 WPA edition. Search volume 1 for unconfirmed claims and volumes 2–5 for confirmed claims. If the result is unknown, search both sets. Treat the unconfirmed label as a result of U.S. review of the claim. An unconfirmed claim can still contain evidence about people and land. [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C2","kind":"historical","anchor":"Read the numbered papers for witnesses, attorneys, notaries, surveyors and chain bearers as well as the claimant. Copy the name spelling used in the edition and read any indicated marginal annotation. The editor approximated the manuscript arrangement. Keep the edition’s document number distinct from the manuscript locator. The letter after a document number marks its language: S for Spanish and E for English [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C3","kind":"method","anchor":"When the claim volume lacks the decree, follow its citation into *American State Papers: Public Lands*. Keep the cited edition with the locator: G&S is Gales and Seaton, and DG is Duff Green. Starting with a tabular abstract in *American State Papers*, return to the claim volume for the supporting papers. If *American State Papers* printed the claim in full, check it alongside the edition’s shorter treatment [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
