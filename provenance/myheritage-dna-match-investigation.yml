  - {"id":"S81","kind":"web-page","urls":["https://journals.plos.org/plosgenetics/article?id=10.1371/journal.pgen.0020041"],"published":"2006-03-24","retrieved":"2026-11-22","access":"read","rights":"CC BY","basis":"reviewed web page read 2026-11-22","entry_sha256":"0457ada8c3cbff0a367ce816096fea91bee5ef9017190b4e6eeafc0ac0e5e0f9","claims":["C-compare-full-sibling-lists"],"review":"reviewed"}
  - {"id":"S82","kind":"web-page","urls":["https://education.myheritage.com/article/using-your-inbox-on-the-myheritage-mobile-app/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"reviewed web page read 2026-11-22","entry_sha256":"94df11f38197ed14cd65ba9761f4b0aef8751ce5c55c0025b6fab8684bde2456","claims":["C-check-unexpected-kinship-message"],"review":"reviewed"}
  - {"id":"S83","kind":"web-page","urls":["https://blog.myheritage.com/2025/02/getting-the-most-out-of-your-dna-results/"],"published":"2025-02-27","retrieved":"2026-11-22","access":"read","rights":null,"basis":"reviewed web page read 2026-11-22","entry_sha256":"78804e9adcaa2a6b1499cefb52e041c7145cce80a52d142a33d19ed6b9784e10","claims":["C-check-missing-match-coverage"],"review":"reviewed"}
  - {"id":"S84","kind":"web-page","urls":["https://blog.myheritage.com/2025/03/third-cousins-explained-a-genealogists-guide-to-distant-kin/"],"published":"2025-03-09","retrieved":"2026-11-22","access":"read","rights":null,"basis":"reviewed web page read 2026-11-22","entry_sha256":"aaa26819d4de8f940aaa36765e78943d859520300a720b751e035852b272a8b2","claims":["C-retain-third-cousin-without-genetic-match"],"review":"reviewed"}
  - {"id":"S85","kind":"web-page","urls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC3317976/"],"published":"2012-04-03","retrieved":"2026-11-22","access":"read","rights":"CC BY","basis":"reviewed web page read 2026-11-22","entry_sha256":"4fa2eafcdf5d473f229b1154af9b4c288dd12e13e7d65b28be4c5754d0e1b813","claims":["C-retain-third-cousin-without-genetic-match"],"review":"reviewed"}
claims:
  - {"id":"C-a6e184308901","kind":"unclassified","anchor":"1. Select the tested person's kit. Record the tested person, kit identifier as displayed, manager,\n   linked tree/profile URL, and research question. Keep manager and tested person separate.\n2. Inspect the linked profile before interpreting surnames or theories. Compare its identity,\n   parents and tree context with the intended tested person; a matching display name is insufficient.\n3. Record which tools this kit can open. An inaccessible tree, Shared DNA Matches panel or theory\n   is an access limitation, not an empty result. Advanced-tool access depends on the current\n   subscription or the kit's existing unlock status; check the current entitlement page.\n4. Before correcting a wrong assignment, save every theory you need: match URL, proposed\n   relationship, each path and its component links, displayed confidence, review status and date.\n   **MyHeritage says reassignment permanently deletes existing Theory of Family Relativity data.**\n5. **Privacy gate:** <!-- privacy-gate: link --> Reassignment links a living relative's DNA kit\n   to a tree profile; answer the privacy gate in `SKILL.md` first. For a genealogy kit, use Manage DNA kits → kit menu → Re-assign kit to a different person,\n   selecting the correct existing profile where available. Before the final Save, verify that\n   you have that person's permission to manage their DNA data and check the permission box.\n   Stop if permission is missing. Record the permission reference and attestation date in the\n   session header, then save and recheck the association.\n   The documented reassignment procedure does not apply to DNA Health kits.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ae5ddec2f5ed","kind":"unclassified","anchor":"If one tested person has several MyHeritage kits (for example an upload and a lab-processed test),\nrecord each kit's identifier and processing type before comparing their match lists or cM values.\nMyHeritage's FAQ, as read in [GeneaVlogger's review](https://www.youtube.com/watch?v=arP83dD_7a0),\nsays the downloaded raw-file header states the processing used and that array-processed kits are\nnot reprocessed. Take the type from the header, otherwise record `not_observed`; do not infer it\nfrom purchase date. This source does not measure how results differ between kit types.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7c4e8315462d","kind":"unclassified","anchor":"An uploaded kit can only be an earlier one: MyHeritage's help (page dated 21 July 2026) says\nDNA uploads are no longer supported. It says nothing about kits uploaded before the change, so record\nwhat such a kit currently shows in the account rather than assuming its matches are gone or\ncomplete.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f10244cb3657","kind":"unclassified","anchor":"This preflight addresses the tree-replacement question in [MyHeritage's 2022 Q&A](https://www.youtube.com/watch?v=0TUlka43n2I).\nIt supplies no guarantee that replacing a tree preserves links or deleted theories.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1578d1fe6171","kind":"method","anchor":"Outside the DNA Matches list, MyHeritage's tree-based Cousin Finder lists relatives found through\nfamily trees, including people who may never have tested. Record each entry as a tree assertion\nthat is only as good as the trees behind it. Do not treat it as a DNA match or a DNA-supported\nrelationship, and do not give it shortlist cM fields. In one Cousin Finder comparison, relatives who had tested only elsewhere appeared without the “DNA Match” marker. Relatives with a MyHeritage test or upload could carry it [B18]. For an unmarked person, check other companies, or ask the relative when contact is authorized, before planning a test.","sources":["B18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d244fa781f9d","kind":"method","anchor":"When working from an exported segment file rather than the browser, keep the unfiltered export and\nanalyse a copy sorted by chromosome, then start position. Matches overlapping a documented\nrelative's long segment are only candidates. Overlap at one position fits either parent's copy of\nthat chromosome. Check each candidate against that relative's shared-match list. Put overlapping\nnon-shared matches in a provisional other-side group to test against an anchor from that side.\nShared-match status is not triangulation, and a missing shared match may reflect a display\nthreshold. If a cM cutoff removes a candidate from the working copy, repeat the comparison in the unfiltered export. In Baker’s chromosome 13 example, sorting overlapping segments helped select candidates; the sort alone could not assign them to a branch [B16].","sources":["B16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a686eb57c961","kind":"unclassified","anchor":"1. Save the proposed relationship, common ancestor, complete path and alternative paths before\n   changing its review state. Overall displayed confidence is the lowest confidence of the\n   component Smart/Record Match links, not a probability that the relationship is true.\n   Record confidence at the connection it describes. Alternative path tabs are different\n   evidence routes for the summarized theory; they are not automatically independent proof.\n2. Follow every connection into its underlying tree or record. Distinguish a tree-to-tree identity\n   match from a parent–child relationship: inspect identity evidence and the parentage asserted\n   on either side of the join. Smart Matches and Record Matches can be wrong.\n3. Create one row per connection with person/profile links, claim, underlying source, disposition\n   (`supported`, `unresolved`, `contradicted`) and the exact next check. A copied claim in two\n   trees is one assertion repeated, not two independent records.\n4. Compare the proposed relationship with the observed DNA using the judgment recipe; do not\n   replace a missing record with the theory's displayed confidence. An unresolved connection\n   leaves that path provisional; inspect alternative paths separately.\n   A path with every connection `supported` still does not show that the shared DNA came through\n   it; the DNA may come from another line, as a\n   [Legacy Tree review of these theories](https://www.legacytree.com/blog/myheritage-dna-theories-of-family-relativity)\n   notes. Test the line against the match's shared matches and its AutoClusters cluster (run\n   through the companion clustering procedure), looking for relatives documented to the proposed\n   couple. Without that support, record the DNA source as unresolved.\n5. Confirm or reject only after review. Save the reason in the packet. Confirmation tracks your\n   assessment; it neither supplies documentary proof nor automatically updates the family tree.\n   No theory means no generated suggestion currently visible, not no biological relationship.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-08418e9c8143","kind":"unclassified","anchor":"Before the first approved message to a close match, preserve its minimal visible basis in the\nprivate `selected_matches` packet: kit/match identifiers, observation date, and the relevant\nprofile/tree or shared-match observations and links. This fixes the basis of the question if\naccess later changes; it neither establishes why a row disappeared nor turns it into a measured\nzero. The [2024 Q&A](https://www.youtube.com/watch?v=Nsir-VBEhWg) motivates this timing;\nthe limited packet reuses workflow 9's preservation controls.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d54f0d5cdf39","kind":"platform-ui","anchor":"Keep your account password private when a helper such as a DNA coach works a kit\n[S1 @2026-11-21], [S3 @2026-11-21]. Use **DNA → Manage DNA kits** → the kit's three-dot menu →\nShare DNA results with a collaborator; only someone allowed to\ninvite members to the kit's family site can send the invitation [S2 @2026-11-21],\n[S3 @2026-11-21]. Use this workflow for an adult tester and adult collaborator. Verify that\nthe collaborator has two-factor authentication on their own account before they open the\nresults [S1 @2026-11-21]. With the gate cleared, enter the collaborator's email address and\nclick **Share**. MyHeritage prompts invitees without an account to create one upon acceptance\n[S2 @2026-11-21].","sources":["S1","S3","S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1bf3a0fea811","kind":"portal-availability","anchor":"Do not read few or no Russia-resident matches, or Russian matches missing from an older list,\nas evidence about relatives living in Russia. MyHeritage stopped selling DNA kits in Russia at\nthe end of February 2020 [S4 @2026-11-12]. In emails reported on 31 December 2024, it told Russian users\nthat their accounts and associated data would be permanently deleted by 1 February 2025\n[S5 @2026-11-12], [S6 @2026-11-12]. According to the published exchange, the company said that earlier messages would remain with the sender identified as a deleted member [S6 @2026-11-12]. Log the change in account or message status separately from any inference about the family.","sources":["S4","S5","S6"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b31faa0831ba","kind":"platform-ui","anchor":"MyHeritage removed its export of segment data for all DNA matches in October 2023\n[S7 @2026-11-12]. To get a segment file, select the matches in the One-to-Many Chromosome\nBrowser, scroll below the chromosomes and use Advanced options → Download shared DNA info. The\nCSV lists any triangulated segments first, then the segments each selected match shares with\nthe focal kit, and it covers only the selected matches [S8 @2026-11-12]. Record its scope as\n`selected_matches` (workflow 9). If DNA pages are refused, check that two-factor\nauthentication is on: MyHeritage made it mandatory for viewing DNA results by March 2024\n[S1 @2026-11-12].","sources":["S7","S8","S1"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9a20356139e4","kind":"platform-ui","anchor":"MyHeritage adds theories in periodic runs, not as trees or matches change [S9 @2026-11-12],\n[S10 @2026-11-12]. Its 2022 conditions are a tree that includes at least the tester, the\nparents and the grandparents, and a plan with the advanced DNA features or the one-time unlock\nof an uploaded kit; its 2025 update names Premium, PremiumPlus, Complete and Omni as the plans\nthat show a full theory [S11 @2026-11-12], [S12 @2026-11-12]. Check every authorized kit separately. One tester’s older kit already had theories while her new whole-genome kit had none [S14 @2026-11-12]. Record “no theory” with the kit and the\ndate checked, and look again after a later run. Theories from\nthe last 30 days carry a NEW badge, and the Has Theory of Family Relativity option under the\nTree details filter (All tree details in some views) lists the matches that have one\n[S10 @2026-11-12], [S13 @2026-11-12], [S12 @2026-11-12], [S19 @2026-11-12].","sources":["S9","S10","S11","S12","S14","S13","S19"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-93de04702725","kind":"platform-ui","anchor":"To give later runs more people to join on, extend the tree: MyHeritage says the number of\ntheories depends on the size and detail of the tree [S15 @2026-11-12]. Estes extends each ancestor's line\nthrough the grandchildren where she can [S16 @2026-11-12]; do this with deceased people only.","sources":["S15","S16"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2a32ef13c8ad","kind":"platform-ui","anchor":"When a match at another company has no tree there or only a small one, look for the same\nperson in this kit's DNA Matches and in Cousin Finder, which finds relatives through matches\nbetween family trees and labels those who are DNA matches [S17 @2026-11-12]. Estes found Cousin Finder trees for people whose match profiles at other companies had no tree [S18 @2026-11-12]. Compare the tree’s people and the shared matches before linking the profiles. A name match alone leaves their identity open.","sources":["S17","S18"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-36e7eca3c347","kind":"method","anchor":"**Sort by side in one direction only when your anchor is on one side.** If a known relative on one\nside, such as a maternal aunt, is your only anchor there, a match or cluster she shares is a lead to\nthat side; one she does not share stays unassigned, not paternal. You can carry DNA from your mother\nthat the aunt did not inherit, so some maternal matches are not shared with her (Price\nGenealogy, 2023-07-28 [S20]; Legacy Tree, 2019-06-04 [S21]), and two sisters can carry different grandparents' DNA at the\nsame position (Perl, DNA Painter blog, 2021-07-28 [S22]). Move an unassigned cluster to the other\nside only through an anchor from that side. Workflow 5's provisional other-side group is narrower:\nit holds matches that overlap the anchor's own shared segment.","sources":["S20","S21","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6785fd11e1fe","kind":"platform-ui","anchor":"**Check the family group behind each connection, not only the join.** Test the family the\nunderlying tree shows against your records and against plausibility. Kessler found two near-namesakes born in 1796 and 1848 recorded as brothers in a theory. The 52-year gap suggested that the younger man might instead be a grandson [S23 @2026-11-14]. Mark the unsupported link `contradicted` or `unresolved`, consider where a generation may have been missed,\nand keep the connections your records support. Two siblings with\none given name are only a warning sign: in many families the later child was named after one who\nhad died (Hoitink, Dutch Genealogy, 2014-07-16 [S25 @2026-11-14]). MyHeritage lets you confirm or\nreject a theory as a whole, and its wiki says to confirm one that is accurate through any path\n[S24 @2026-11-14], so keep the per-connection results in the connection ledger and decide on the\npaths that survive.","sources":["S23","S25","S24"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-763d484d2801","kind":"platform-ui","anchor":"Copy a predicted relationship in the direction MyHeritage gives it: the label says what the match\nis to the tested person, so \"Aunt\" means the match is the tester's aunt, not the reverse\n[S26 @2026-11-16]. Keep a directional label as written, such as \"parent's first cousin\" or \"first\ncousin's child\", rather than collapsing it to \"first cousin once removed\" (MyHeritage blog,\n2023-03-02 [S27 @2026-11-16]). The top label is one estimate among several. Clicking it on the\nmatch card opens every estimated relationship with its probability, while Review DNA Match →\nPossible relationships lists only the top four until you click Show more relationships plus\ndiagram, which adds the less likely ones and their paths [S26 @2026-11-16], [S28 @2026-11-16].\nOpen the full list before recording that a relationship is not among the predictions.","sources":["S26","S27","S28"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a37a980c42fe","kind":"platform-ui","anchor":"Before adding or comparing probabilities in the diagram, set its top-right drop-down to all\nrelationships: only then do the probabilities total 100%, and a full-only or half-only view hides\nthe rest [S26 @2026-11-16]. The MRCA-probabilities checkbox gives the overall probability that the\npair shares each possible most recent common ancestor. That ancestor's generation is named relative\nto the tested person; the same couple can sit further back in the match's tree, for example as\ngreat-great-grandparents where the tester's label says great-grandparents, so do not assume the\nsame generation on the match's side [S26 @2026-11-16].","sources":["S26"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6ba5952e7144","kind":"platform-ui","anchor":"Read the explanation below the list before trusting its order: it says whether both ages, one or\nneither informed the prediction, and predictions are most accurate with both [S26 @2026-11-16].\nThe ages come from the dates of birth on file for the kits. MyHeritage says a missing, year-only or\nwrong date of birth, a kit assigned to the wrong profile, or a wrong gender on a profile can give\nthe wrong label, show both \"Father\" and \"Son\", or swap aunt and uncle or mother and father labels\n[S28 @2026-11-16]. Record which ages were used. When one is missing or doubtful, record the whole\nlist rather than the top label, and check the tester's own profile as in workflow 1.","sources":["S26","S28"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fbd856544588","kind":"platform-ui","anchor":"Read the probabilities as estimates for a single line of descent. MyHeritage's 2023 introduction\nsays cM Explainer assumes neither endogamy nor pedigree collapse, though DNA shared through several\ncommon ancestors raises the cM above what one relationship gives (MyHeritage blog, 2023-03-02\n[S27 @2026-11-16]). Its April 2023 update adjusts only for Ashkenazi Jewish ethnicity, only for\nmatches under 200 cM, and not in the standalone tool, which has no ethnicity data (MyHeritage\nblog, 2023-04-24 [S29 @2026-11-16]). For other endogamous communities, pedigree collapse or a\nknown double relationship, expect the top predictions to be too close, read the more distant\nentries too, and take the analysis to DNA research judgment.","sources":["S27","S29"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ac1abcd8ebc9","kind":"platform-ui","anchor":"When a date of birth is doubtful, get a DNA-only reading: MyHeritage's help says to open cM\nExplainer and enter the cM value without ages [S28 @2026-11-16]. Its standalone page,\nmyheritage.com/cm, takes the shared cM and, optionally, both ages, and also serves pairs tested at\nother companies (MyHeritage blog, 2023-03-02 [S27 @2026-11-16]; Mohler, Your DNA Guide,\n2023-03-02 [S30 @2026-11-16]). Enter numbers only, never names or kit identifiers.","sources":["S28","S27","S30"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20b74b17032b","kind":"method","anchor":"If a match's age is missing or marked private and the question needs it, ask the match in\nworkflow 8's approved message, as the 2023 introduction suggests for a match you are in touch with\n[S27]. Record the answer as the age the match reported, with its date. Do not look up a match's\nage or date of birth anywhere else.","sources":["S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9a71e6fd435c","kind":"platform-ui","anchor":"Keep checking an earlier array kit or a previously uploaded kit for new matches\n[S42 @2026-11-18]. MyHeritage's whole-genome sequencing FAQ says both can match testers whose\nsamples were sequenced [S31 @2026-11-18]. A new test is unnecessary just to keep looking for matches.","sources":["S42","S31"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4cb50581b73c","kind":"platform-ui","anchor":"Return to the kit’s DNA Matches list when AutoClusters leaves a lead out of the chart. Its thresholds select only a subset of the kit’s matches [S33 @2026-11-18]. One researcher’s only promising match shared 2.3% and did not appear in the chart [S32 @2026-11-18]. Keep that match on the shortlist.","sources":["S33","S32"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c947907e934c","kind":"method","anchor":"A failure-to-pay maintenance warrant gave Fuller a possible father’s surname to search in DNA Matches. She reports that his First World War personnel file held court papers in which he admitted paternity and agreed to maintenance [S37]. Compare identifying details such as occupation and next of kin in the personnel file with the warrant and other records [S38]. Record the documentary admission separately from the surname hit.","sources":["S37","S38"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fe3d7ef47b4f","kind":"method","anchor":"Place documented shared matches in the tester’s tree. In the published case, their lines converged on the tester’s great-grandparents, giving the family a couple whose descendants they could trace [S34], [S35]. Record how the unplaced match might descend from the couple, and leave that connection provisional until documents support it. Use workflow 5 to investigate the segment.","sources":["S34","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6323022b67bd","kind":"platform-ui","anchor":"If the purple banner on DNA Matches offers **View theories**, use it to show all matches with a\ntheory [S36 @2026-11-18], [S10 @2026-11-18]. Use the Tree details filter below when the banner\nis absent. On an individual match card, choose **View theory** and open each path tab in the\ndiagram [S36 @2026-11-18], [S12 @2026-11-18].","sources":["S36","S10","S12"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-767031f55440","kind":"method","anchor":"Use the approved first-message procedure for an unclustered match when you have one question they can answer. A 2.3% match outside the chart provided the researcher’s only promising lead [S32].","sources":["S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b1c1196c32cd","kind":"platform-ui","anchor":"Recheck the same kit when new matches arrive after an unproductive review [S39 @2026-11-18]. In one case a strong-match email followed a list of distant cousins. The tester opened the account and found a first-cousin match [S40 @2026-11-18], [S41 @2026-11-18]. Read the card and log its relationship estimate before adding it to the shortlist.","sources":["S39","S40","S41"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-shared-surname-filter","kind":"platform-ui","anchor":"Use **Tree details → Has shared surnames** for a pass looking for any ancestral surname the two\ntrees share [S51 @2026-11-20], [S52 @2026-11-20]. To look for a particular surname, run a separate\nancestral-surname search with that filter cleared, especially if the name is still missing from\nthe tester's tree.","sources":["S51","S52"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-match-name-transliteration","kind":"platform-ui","anchor":"When a match card shows a name in brackets after the original, use the Global Name Translation\nrendering as a spelling lead. Save both forms with the match's identifier and verify the person's\nidentity before joining records across scripts [S47 @2026-11-20], [S49 @2026-11-20].","sources":["S47","S49"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cross-provider-review","kind":"method","anchor":"If the first company's list stalls and relatives on the target branch are reported to use\nMyHeritage, review an existing authorized MyHeritage kit for the same tester. If a parent helped\nsort the first list, include that parent's authorized kit when available. Compare the tester's\nresults across services for new leads. Log each match under the kit and service that returned it\n[S53], [S54].","sources":["S53","S54"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-new-test-for-matches","kind":"platform-ui","anchor":"If there is no existing kit and the tester chooses this search, use a new MyHeritage DNA test\nfor the tester who needs matches [S55 @2026-11-20]. Treat the reported use of the site as a\nreason to check that database. Leave relatives' testing status open until you have evidence.","sources":["S55"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-review-match-labels","kind":"platform-ui","anchor":"When resuming from a match review, look for its labels at the top of **Review DNA Match** and\nfor each shared match's labels on its row. Open the label manager to read the full names and any\nlabels hidden from the row's display [S43 @2026-11-20], [S46 @2026-11-20], [S60 @2026-11-20].","sources":["S43","S46","S60"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-shared-match-indicators","kind":"platform-ui","anchor":"In **Shared DNA Matches**, hover over the tree icon on B's row and choose **View tree** if offered.\nHover over the note icon to read your existing note before repeating research\n[S43 @2026-11-20], [S44 @2026-11-20]. If the tree cannot be opened, record the access state.","sources":["S43","S44"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-shared-match-sort","kind":"platform-ui","anchor":"Use the **Shared DNA Matches** sort menu to rank B by DNA shared with A when looking for A's\nstrongest matches. Choose DNA shared with the focal kit when looking for the tester's strongest\nmatches. The default ranks by the sum of both amounts. Record which pair drove each pass\n[S47 @2026-11-20], [S48 @2026-11-20].","sources":["S47","S48"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-theory-status-and-undo","kind":"platform-ui","anchor":"Use **Confirm** or **Reject** above the full theory path and check the resulting status on the\nDNA Match card. If new evidence reopens the question, select **View theory** and undo the decision\nto return that theory to pending. When a card has several theories, record status in each theory's\nown view. A card can show confirmed when only one theory is confirmed\n[S11 @2026-11-20], [S50 @2026-11-20].","sources":["S11","S50"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-theory-run-scope","kind":"historical","anchor":"Compare a visible theory with the saved path before recording it as revised. The June 2022 run\nadded theories without revising earlier ones [S11].","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-extend-direct-lines","kind":"method","anchor":"Before the next run, check for documented deceased great-grandparents and great-great-grandparents\nmissing from the linked tree. List them for the deceased-only extension above [S11].","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-compare-genetic-groups","kind":"platform-ui","anchor":"For a geography question, compare the tester's and match's **Genetic Groups** on **Review DNA\nMatch** if that panel is visible. Use a shared group to choose a place to investigate and check it\nagainst the pedigrees. Keep the branch unassigned until you have evidence for it\n[S43 @2026-11-20], [S45 @2026-11-20].","sources":["S43","S45"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-surname-in-match-and-manager-trees","kind":"method","anchor":"If the target surname is missing from the match names, search the match's accessible tree and\nany relevant tree already available from the kit manager. Include the target ancestor's birth\nsurname. Record where it occurs and which connecting people remain to be found [S56], [S57].","sources":["S56","S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-smart-match-pedigree","kind":"platform-ui","anchor":"When the connection remains open and a **Smart Match** places a known relative in another tree,\nuse **Discoveries → Matches by people → Review Match** to inspect the overlap [S58 @2026-11-20].\nCompare that branch with the DNA match's tree for the missing person. Check whether a candidate's\nchild in one tree appears as the match's grandparent in the other, and verify each link before\nrecording the relationship [S57 @2026-11-20].","sources":["S58","S57"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-smart-match-manager-contact","kind":"platform-ui","anchor":"If a specific link is still missing, use workflow 8's approved first-message procedure to ask\nthe Smart Match tree manager where that match offers **Contact**. Ask only for the missing\nrelationship or its source [S57 @2026-11-20], [S59 @2026-11-20].","sources":["S57","S59"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-retained-match-list-labels","kind":"method","anchor":"If a retained MyHeritage match-list export contains labels, use those values to reconstruct\nthe groupings as of the export date. Check the match's live labels before treating the old\ngrouping as current [S43], [S46].","sources":["S43","S46"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-profile-dna-results","kind":"platform-ui","anchor":"On desktop, open the **DNA** tab if it appears on your own tree profile or on a relative's\nprofile for a kit you manage. Select the tested person's available results [S61 @2026-11-21].\nIf the tab is missing, open **DNA → Overview** and check which tester is selected\n[S62 @2026-11-21].","sources":["S61","S62"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-collaborator-tree-permissions","kind":"platform-ui","anchor":"Before inviting a collaborator, review the linked family site's tree permissions. Acceptance\ngives the collaborator family-site membership [S1 @2026-11-21], [S2 @2026-11-21]. For view-only\ntree access, open **Family Tree → Manage trees → Edit tree settings → Permissions**. Restrict\nediting to the webmaster, or allow the webmaster and site managers if the collaborator is a\nregular site member [S1 @2026-11-21], [S63 @2026-11-21].","sources":["S1","S2","S63"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-collaborator-invitation-status","kind":"platform-ui","anchor":"Check the arrow beside the kit number in **Manage DNA kits** before assigning any kit work.\nYellow means the invitation is pending, and green means the collaborator accepted\n[S2 @2026-11-21]. Hover over the arrow to verify the collaborator's name if shown\n[S1 @2026-11-21].","sources":["S2","S1"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-collaborator-kit-selector","kind":"platform-ui","anchor":"After accepting an invitation, choose the tester's entry with the shared-kit label in the DNA\nkit selector. Verify the selected tester before reviewing **DNA Matches**, **Ethnicity Estimate**\nor **Genetic Groups** [S1 @2026-11-21], [S2 @2026-11-21]. The collaborator can contact matches\nand view or edit the tree as its settings allow. The collaborator cannot download raw data,\ndelete, reassign or reshare the kit, or change its DNA privacy preferences, and does not see\nthe notes and labels already on the matches [S2 @2026-11-21], [S1 @2026-11-21].","sources":["S1","S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-replace-kit-collaborator","kind":"platform-ui","anchor":"To change collaborators, check who already has access in **Manage DNA kits**. MyHeritage's\nsharing announcement describes one collaborator per kit [S1 @2026-11-21]. In the kit's\nthree-dot menu choose **Remove results sharing** and confirm. Check that sharing has ended,\nthen send the replacement invitation through the privacy gate above for the new recipient\n[S1 @2026-11-21], [S2 @2026-11-21], [S3 @2026-11-21].","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-former-collaborator-membership","kind":"platform-ui","anchor":"If the former collaborator should also lose tree access, check their membership separately in\n**Home → Site members** [S64 @2026-11-21].","sources":["S64"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-end-collaborator-kit-access","kind":"platform-ui","anchor":"To end your own access as a collaborator, find the kit at the bottom of **Manage DNA kits** and\nchoose **Remove shared kit** from its three-dot menu. This removes the kit from your access list\n[S1 @2026-11-21], [S3 @2026-11-21].","sources":["S1","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-living-match-site-memberships","kind":"platform-ui","anchor":"Apply the [Living people rule](../SKILL.md#living-people) and skip **Site memberships** on a\nliving match's member profile [S61 @2026-11-21]. Use the match's accessible tree or a relevant\nshared match's pedigree for the family-history lead [S65 @2026-11-21].","sources":["S61","S65"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-collaborator-privacy-gate","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: publish --> Sharing a kit's results gives another person a\nliving tester's DNA matches, ethnicity estimate, Genetic Groups and family-site access\n[S2 @2026-11-21]. That can expose living people in the matches and tree. The invitation sends\nthe collaborator's email address to MyHeritage [S2 @2026-11-21]. Answer the privacy gate in\n`SKILL.md` first.","sources":["S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-missing-transliteration","kind":"platform-ui","anchor":"If a name has no transliteration in **Shared DNA Matches**, check **Review DNA Match** for the\nbracketed form. If a new-match email shows a transliteration, flag it as a spelling lead and\ncheck it against the match card. Respect a private name and leave its translation unobserved\n[S49 @2026-11-22].","sources":["S49"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-shortlist-unplaced-match","kind":"method","anchor":"For an unknown branch, keep documented matches as anchors and make a separate shortlist of\nunplaced matches. Start with a strong unplaced match whose tree or shared matches can move\nthe question forward. Leave its side open while you test whether it connects to a branch already\ndocumented [S68].","sources":["S68"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-compare-existing-match-lists","kind":"method","anchor":"If the first service gives no usable lead, review any other authorized kit already available for\nthe same tester, even before you know whether the target branch uses that database. Record the\nkit and service that yielded each lead [S68].","sources":["S68"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-compare-full-sibling-lists","kind":"method","anchor":"When two full siblings' authorized kits are available, run the same shortlist pass for both.\nKeep useful matches seen on either list, recording which kit returned each one. Siblings can\ninherit different segments and have different matches [S69], [S81].","sources":["S69","S81"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-save-confirmed-dna-relationship","kind":"platform-ui","anchor":"Keep the evidence for the established relationship in the private packet. Once the gate is\ncleared, verify the kit. On the match card, open the relationship label and choose **Select\nrelationship**, or use the pencil beside the relationship on desktop or on\n**Review DNA Match** [S66 @2026-11-22], [S67 @2026-11-22]. Choose the documented relationship\nfrom the list and select the family side if established, then click **Save relationship**.\nIf the supported relationship is absent from the list, retain it in the packet. If MyHeritage\ninstead asks a direct parent, child or full-sibling question, choose **Yes** only when you\nhave established that relationship [S67 @2026-11-22].","sources":["S66","S67"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-confirmed-dna-relationship","kind":"platform-ui","anchor":"Read the blue checkmark on the match card, **Review DNA Match** or in **Shared DNA Matches**\nas a relationship entered by the user for their own view. Record it as a user assertion and\nkeep its supporting evidence separately. If only a family side was entered, the underlying\nrelationship label remains an estimate. Review any Theory of Family Relativity separately\n[S66 @2026-11-22], [S67 @2026-11-22].","sources":["S66","S67"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-stronger-shared-pair","kind":"platform-ui","anchor":"Compare focal–B and A–B for the same shared match [S65 @2026-11-22]. When A–B is much stronger,\nstart by tracing the connection between A and B, then look for where the tester might join\ntheir pedigree. Keep the three pair measurements distinct and test the proposed branch with\nworkflow 5 [S68 @2026-11-22].","sources":["S65","S68"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-branch-label-pattern","kind":"method","anchor":"On an unplaced match's shared-match rows, look for recurring documented branch labels.\nUse a recurring label to choose a pedigree to inspect. If labels point to more than one\nbranch, record each as a candidate and test the connections separately [S71].","sources":["S71"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-keep-parental-side-open","kind":"method","anchor":"Test both parental sides when a new close match appears during a search for one parent. In one\npaternity search, a half-sibling match belonged to the maternal line [S73].","sources":["S73"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-trace-half-cousin-connection","kind":"method","anchor":"When a second-cousin estimate leads to the two grandfathers, trace both men to their parents.\nCheck whether they shared one parent or two before assigning a side or a full-cousin\nrelationship. In one case the match's grandfather was a half-brother of the tester's maternal\ngrandfather, despite the initial paternal placement [S74].","sources":["S74"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-test-niece-connecting-parent","kind":"method","anchor":"For a niece or half-niece lead, check which of the match's parents connects to the tester and\nwhether that parent and the tester share one parent or two. Keep an unidentified half-sibling\namong the possibilities [S76]. In one account the match labeled **Niece** was the daughter\nof a half-brother [S75].","sources":["S75","S76"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-compare-archived-low-cm-predictions","kind":"historical","anchor":"When comparing saved low-cM predictions across April 2023, check the dates against the model\nrevision. MyHeritage reported that its revision moved some predictions toward more distant\nrelationships and introduced **Estimated relationship** for matches at 100 cM or less.\nCompare the recorded DNA amounts independently of the labels [S29].","sources":["S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-resume-after-theory-email","kind":"platform-ui","anchor":"Use a new-theory email as a cue to recheck the relevant kit and reopen unresolved matches.\nTheory emails depend on notification preferences, so use the in-account theory list after a\nlater run even if no email arrived [S12 @2026-11-22], [S79 @2026-11-22].","sources":["S12","S79"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-ancestral-place-with-unfamiliar-names","kind":"method","anchor":"When none of the surnames in the match's tree are familiar, make a pass for ancestors who\nlived in the target locality at the relevant time. Keep candidates from that pass even if the\nmatch lives abroad. In one case the productive locality lead was in an overseas match's tree\nunder an unfamiliar surname [S72].","sources":["S72"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-trace-ancestor-repeated-in-match-trees","kind":"method","anchor":"When matches placed on a side give no usable lead to an expected great-grandparent's family,\ncompare their accessible trees for a recurring ancestor, including unfamiliar names. Verify\nthat the repeated profiles describe the same person and trace how each match descends from\nthat person. Keep the genetic connection to the expected line open while testing the new\ncandidate [S80].","sources":["S80"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-unexpected-kinship-message","kind":"platform-ui","anchor":"When an unsolicited message claims a DNA relationship, sign in to MyHeritage directly and look\nin the correct kit's DNA Matches and the account's Inbox for the claimed match and any earlier\nthread. Compare the displayed pair with the claim and record what you can corroborate before\nreplying [S77 @2026-11-22], [S78 @2026-11-22], [S82 @2026-11-22].","sources":["S77","S78","S82"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-missing-match-coverage","kind":"platform-ui","anchor":"If an expected tester is missing after clearing the filters, check whether you have evidence\ntheir kit is in the MyHeritage database [S42 @2026-11-22], [S83 @2026-11-22]. Check whether\nDNA Matching is enabled for the kit you manage. Leave the other person's participation unknown unless established. Opting out can\nkeep an eligible kit off the match list [S69 @2026-11-22], [S70 @2026-11-22].","sources":["S42","S83","S69","S70"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-retain-third-cousin-without-genetic-match","kind":"method","anchor":"If the pedigrees point to third cousins and both kits are eligible for matching, keep the\ndocumented relationship under consideration when the match is missing. Even tested cousins\ncan share too little DNA to be reported. Keep the pedigree evidence and the negative list\nresult together in the packet [S84], [S85].","sources":["S84","S85"],"checked":null,"stated_as":"fact","review":"reviewed"}
