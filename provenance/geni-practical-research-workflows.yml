  - {"id":"S5","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/09/henrik-laitinen-mainittava-mies.html"],"published":"2024-09-22","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2024-09-22 weekly archive. Kyläkoski reports using a patronymic from an 1859 newspaper account of Liminka to locate a candidate profile.","entry_sha256":"255ac981478043f93fcffd3aed5683ff7b3cca333e907d8e7aeb2fbc808038be","claims":["C-96e7b5402c79"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/08/aaaaaa-dna.html"],"published":"2023-08-08","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2023-08-06 weekly archive. Kyläkoski reports locating a couple after a Lappajärvi communion book (1752–1774, p. 147) resolved the farm name.","entry_sha256":"c3dc1347595d6175f4d473ed9b631655c3b3af174cf61c185559a7a5ce27a55c","claims":["C-96e7b5402c79"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2022/03/etunimella-rippikirjasta-haku-on.html"],"published":"2022-03-02","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2022-02-27 weekly archive. Kyläkoski reports that searching the Lukkari farm and Hauhula village together led to a Geni profile.","entry_sha256":"6b0f73b4548537372828a3af70753aa0a476ea818de8c5182d2eeb4951fc1017","claims":["C-96e7b5402c79"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://www.genealogia.fi/en/genealogy/sources-for-genealogists/personal-names/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The guide distinguishes historical patronymics, hereditary surnames and names associated with farms.","entry_sha256":"af0a0ef57f1b6d8c99dda77f13c529ed13b91494d45b12978f1215ebe2dafe50","claims":["C-96e7b5402c79"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/11/takaisin-toolon-varhaisiin-karttoihin-12.html"],"published":"2023-11-20","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Kyläkoski reports that the mother’s 1814 estate inventory (Helsinki City Archives, HKA 110 and 130) named a son she did not see on the father’s profile. The inventory and profile were not independently inspected.","entry_sha256":"d384eda11d4e6d51d245df798355c633bd5a0af3b3bd2b62a56c626045f2c196","claims":["C-746893297ba0"],"review":"reviewed"}
  - {"id":"S10","kind":"web-page","urls":["https://portti.kansallisarkisto.fi/arkistojen-portti/perukirjat"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The guide describes the heirs typically named in Finnish estate inventories.","entry_sha256":"b989a89d7dab5f407d5cc7fa1716297bdd853f1457cb07ca7d7a1b84cde258c4","claims":["C-746893297ba0"],"review":"reviewed"}
  - {"id":"S11","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/09/lyhyesti-lukkarin-pojasta.html"],"published":"2025-09-27","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2025-09-21 weekly archive. Kyläkoski reports several omissions in a Vampula sibling group and suggests unfinished research as an explanation. The post does not establish anyone’s intent.","entry_sha256":"013582320eac4538e19f53851bba56e86f52850236732251079912edbced1e17","claims":["C-746893297ba0"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/06/ingridin-kolme-avioliittoa.html"],"published":"2024-06-20","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2024-06-16 weekly archive. Kyläkoski reports seeing one marriage in a profile and reconstructs three in Paltamo and Kajaani. The profile count is the author’s observation when writing.","entry_sha256":"45219e00b24c5357f3b49c7cc7c1b484e5a34f241b18fbd83f7c675bf053dae4","claims":["C-746893297ba0"],"review":"reviewed"}
  - {"id":"S13","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/07/1832-kaksi-hyljattya-lasta.html"],"published":"2023-07-02","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2023-07-02 weekly archive. Kyläkoski tentatively connects a mother’s age in an Oulu baptism to a Geni profile that showed a daughter from a later marriage. The age comparison yielded a candidate.","entry_sha256":"e0dfe4df597227c94d0f95e4160a84e47e3a6b5f886f0d0e3dd9a9890b52a984","claims":["C-746893297ba0"],"review":"reviewed"}
  - {"id":"S14","kind":"web-page","urls":["https://www.genealogia.fi/en/genealogy/sources-for-genealogists/parish-registers/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The guide describes successive confirmation books, separate move records, and what baptism and marriage lists can record.","entry_sha256":"03904c7765475d950dec0bbfc78ee8fe6ec245bd8a7f136166f7d318b0aa8c41","claims":["C-746893297ba0","C-a45db1dc752c","C-439aa1d2d9d1"],"review":"reviewed"}
  - {"id":"S15","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/02/viela-burtzin-perijoista.html"],"published":"2023-02-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Kyläkoski distinguishes the travelers in an 1810 move using a Helsinki communion book, separate Geni profiles and Lars Lilja’s compiled genealogy. The profile and compilation are leads for checking each traveler against the records.","entry_sha256":"e9e6ae0cf469ac2aa2bc1a9ed3053d3ffa25a5420a45336c343d3069fdabbadf","claims":["C-a45db1dc752c"],"review":"reviewed"}
  - {"id":"S16","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/01/sunnuntain-suomalainen-tukholmassa_0224181205.html"],"published":"2024-01-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2024-01-21 weekly archive. Kyläkoski reports no clear departure notation in Lokalahti and credits a profile contributor with finding another appearance in the 1769–1774 book after the author found the 1763–1768 volume.","entry_sha256":"79cf3a12d7b4c72db57fba4a10799ad96941f41b56c291ebcf8a7b5d8938c115","claims":["C-a45db1dc752c"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/01/abel-vartiaisen-elamasta-ja.html"],"published":"2025-01-14","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2025-01-12 weekly archive. Kyläkoski describes her earlier Abel Vartiainen post being adapted on Finnish Wikipedia and that text being copied to Geni. The linked versions could not be inspected, so the workflow requires establishing dependence before counting them as one chain.","entry_sha256":"97b486ddd89c120734d88fba96bf64569488d38e87b98588910b562633a66ac8","claims":["C-b961a1784265"],"review":"reviewed"}
  - {"id":"S18","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/01/sokos-trilogian-3-osa-heikinkatu-13.html"],"published":"2025-01-11","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2025-01-05 weekly archive. Kyläkoski contrasts the sale parties and price reported by Suometar on 4 August 1865 with profile allegations about employment and debt. The post is the basis for the distinction, not independent verification of the sale or allegations.","entry_sha256":"e2b9ad6c43f973fc1999a6eaad9dcc78ca4f817f635baef9f932d93213b513d1","claims":["C-6f0c3a41ec8f"],"review":"reviewed"}
  - {"id":"S19","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/12/kysymyksia-hedvig-eleonora-ahlgrenin.html"],"published":"2023-12-08","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2023-12-03 weekly archive. Kyläkoski reports finding a 1762 royal decision (Turku Cathedral Chapter, E I 9:101) naming the woman as alive after the proposed death year. She suggests the year may have been inferred from the end of the child list.","entry_sha256":"371b9e0382a70451790ae0721a0c638a6fdfad9407f975a30f5c06e215054af1","claims":["C-d58042fdf571"],"review":"reviewed"}
  - {"id":"S20","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/01/taalla-hanta-ei-kukaan-kaipaa.html"],"published":"2025-01-23","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2025-01-19 weekly archive. Kyläkoski used the farmholder list linked from the Valkealuomi project in Jämsä (project 57070) for a tenure and farm-division lead. The live project body was unavailable, so the step applies where the researcher can see a list.","entry_sha256":"1483fa2898ba31466c917e414f24e79d71a1f635425106d87737842ea6f0df9c","claims":["C-04fbf0378160"],"review":"reviewed"}
  - {"id":"S21","kind":"web-page","urls":["https://portti.kansallisarkisto.fi/arkistojen-portti/henkikirjat"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The guide describes how Finnish tax rolls organize rural households by village and record farm names where available.","entry_sha256":"0d1de8af5a5da22998fbeca352d3d0d899301dde183232ed0a9333bdb4e4dbaf","claims":["C-04fbf0378160"],"review":"reviewed"}
  - {"id":"S22","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/10/pateva-syy-avioeroon-1765.html"],"published":"2023-10-28","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 in the blog’s 2023-10-22 weekly archive. Kyläkoski proposes that two same-named men were conflated after comparing Paltamo communion books (1761–1766 and 1786–1791, p. 165), a 1763 marriage and a 1765 royal divorce decision (Turku Cathedral Chapter, E I 9:394). The proposed separation was the author’s inference.","entry_sha256":"4580a77f14a462ddcdc5540476ebcd7fa4368b09d4284ec8307e11dbf8456b25","claims":["C-439aa1d2d9d1"],"review":"reviewed"}
  - {"id":"S23","kind":"web-page","urls":["https://bcgcertification.org/skillbuilding-proof-arguments"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The article describes documenting and correlating evidence, including indirect and conflicting evidence.","entry_sha256":"dbded8525bb7f95d80829712febba67a5aa647751c1a0438eb7bdf00ab0e0e67","claims":["C-b961a1784265","C-6f0c3a41ec8f","C-439aa1d2d9d1"],"review":"reviewed"}
  - {"id":"H25","kind":"web-page","urls":["https://www.geni.com/company/terms_of_use"],"published":"2026-08-05","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Section 8 bars AI tools from accessing Geni, gathering its data, operating its features or using an account as a proxy.","entry_sha256":"472a875cc9b04e0f2e90ae0c1fe5c79eb98ddf37c452e13704cfa9e7fcccdc5d","claims":["C-fb60e8803f8e"],"review":"reviewed"}
claims:
  - {"id":"C-bd289b0f310e","kind":"unclassified","anchor":"1. Search for the recorded name and then its supported birth, later, transliterated and\n   original-script forms. Inspect parents, partners, children, dates and places on every plausible\n   candidate. Search existing profiles before creating a branch. [S1, S2, H1]\n2. Record each spelling with the record that actually uses it. Keep candidates separate until the\n   family and records discriminate them; a search miss does not establish that a profile is absent.\n3. For a profile you can edit, open **Edit Profile → Add Language** to put names in separate\n   language entries. Geni uses English as the default name language; the displayed name may change\n   with the viewer's selected language. Preserve that setting in a before/after comparison. [H2]\n4. Keep the birth name, later name and **Also Known As** entries distinguishable. Use aliases for\n   supported alternatives instead of packing every spelling into one surname. Explain a\n   patronymic or title in the notes rather than inventing a hereditary surname. [S2]\n5. Reopen the saved profile and verify the entered forms and profile URL. Try a search with a\n   supported alternate name and record the result; do not promise that every language entry is\n   indexed by every search route.","sources":["S1","S2","H1","H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aeea08963153","kind":"unclassified","anchor":"1. Open person A's profile and select its green pushpin as the relationship focus. Open person B\n   and use the relationship button, documented as **How are they related?** Save both URLs and\n   verify that A remains the displayed focus. [S3, H3]\n2. Inspect the blood and in-law results separately. Geni seeks the closest path in each category;\n   the feature is not an enumeration of every common ancestor or every transmission route. A\n   cached result or a pending/recent merge can affect what is shown. [S3, H4]\n3. Expand the path and save its ordered profile URLs. Use the path's **Consistency Check** link to\n   identify structural problems. Check the documentary support for each parent-child or partner\n   link needed by the proposed connection. An empty inconsistency list is not a proof of those\n   links. [H5]\n4. For a suspected stale path, record the displayed calculation information and use the available\n   refresh control. The help page documents refresh eligibility after a week and curator help for\n   an earlier recalculation. Do not edit correct relationships just to force a different label. [H4]\n5. Save the result and remaining unsupported links. Reset the pushpin to your own profile after\n   the comparison so the next task does not silently use A as its focus. [H3]","sources":["S3","H3","H4","H5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-147dbd65a830","kind":"unclassified","anchor":"1. **Privacy gate:** <!-- privacy-gate: upload --> An uploaded document can name or show family\n   members who may be living; answer the privacy gate in `SKILL.md` before uploading it.\n   On the relevant profile, open **Sources → Add Source**. Select an existing document or add one\n   you are authorized to upload. If an existing upload is missing from the selection, use **Show\n   all documents**; the default selection is restricted to documents already tagged to that\n   profile. [H6]\n2. On **Basic Information**, select only the facts the document supports. Enter the value as it\n   appears in the document and a fact-specific note, including uncertainty or a conflicting value.\n   Preserve a record citation and locator beside the source. [H6]\n3. On **Relationships**, select the particular immediate-family relationship and its supported\n   facts. Saving relationship sources also tags the related profiles to the document. Merely\n   uploading or tagging a document is not the same operation as citing a relationship. [H6]\n4. Save, reopen **Sources** and use **View Facts** to inspect the linkage. Compare the displayed\n   profile value with the source information. Record discrepancies rather than silently rewriting\n   the document's wording to agree with the profile. [H6]","sources":["H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0cb720743976","kind":"unclassified","anchor":"1. Search existing projects for the town, community, institution or research topic before creating\n   another. Inspect its scope, documents, discussions and attached profiles. A locality project\n   can expose related families under different surnames. [S1, S4, H7]\n2. **Privacy gate:** <!-- privacy-gate: contact --> A collaboration request or project invitation\n   contacts other profiles' managers about family profiles; answer the privacy gate in `SKILL.md`\n   before sending it.\n   For a public project, join or request collaboration as appropriate. On an eligible existing\n   profile, use **Actions → Add to Project**; where you lack the applicable rights, the documented\n   **Invite to Project** route requests the managers' participation. Record whether the profile was\n   added or a request remains pending. [H8]\n3. Keep unpublished hypotheses in a local register or, with an active Geni Pro subscription, a\n   **Pro Workspace** note, to-do or private project. Private projects can be tagged with public or\n   private profiles, but tagging does not grant new viewing or editing permissions. [H9, H10]\n4. Record the project's actual public/private type before adding research material. The older\n   project tutorial's statement that all projects are public predates Pro Workspace; it does not\n   describe private projects. [H7, H9, H10]\n5. Give each lead a concrete next action and supporting record URL. Project membership is a\n   research grouping, not evidence that its members belong to one family.","sources":["S1","S4","H7","H8","H9","H10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb9ca1866a58","kind":"platform-ui","anchor":"Who can complete a merge decides what step 3 records. Geni completes a merge at once when you have\npermission on both profiles: profiles you manage, profiles managed by someone in your Family Group,\nor a collaborator's public profiles. Otherwise Geni sends a merge request, and every other manager\nmust accept it; you can never complete a merge when one of the profiles has been claimed. Curators\ncan approve merges. Pending merges can be viewed, completed or undone in the Match Center.\n[H19 @2026-11-12], [H20 @2026-11-12], [H21 @2026-11-12], [H22 @2026-11-12], [H24 @2026-11-12]","sources":["H19","H20","H21","H22","H24"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-14f21f115c0b","kind":"unclassified","anchor":"1. Preserve both candidate URLs, immediate families and sources. Open the second candidate before\n   starting **Actions → Merge This Profile** on the first; the documentation recommends this to\n   populate the recently viewed selection. [H11]\n2. Select the other profile and open **Compare Profiles**. Decide identity from the family and\n   records. Use the different-person or decide-later option when identity is contradicted or\n   unresolved. Do not create a duplicate merely to acquire control of an existing profile. [H1, H11]\n3. **Privacy gate:** <!-- privacy-gate: contact --> A merge request goes to the other managers of\n   both profiles; answer the privacy gate in `SKILL.md` before submitting it.\n   If identity is supported, perform the merge or submit the permitted request. Record the actual\n   state; a requested merge has not yet combined the profiles. Save the surviving URL after a\n   completed merge. [H11]\n4. Handle field disagreements through **Actions → Resolve Conflicting Data** or the Match Center's\n   **Data Conflicts** view. Choose the supported value for each field and retain the rejected\n   alternative and its source in the register. Editing rights are required; for a claimed profile,\n   its owner handles the conflicting information. If a field will not change, check whether a\n   curator has made the profile a Master Profile and locked that field or the whole profile; ask\n   that curator, then recheck the field. [H12, H23]\n5. Reopen the combined profile and review the immediate family as well as the saved fields. A\n   completed merge and resolved dates do not establish that duplicate relatives or competing\n   parents have been resolved; use the next procedure for those structural conflicts.","sources":["H11","H1","H12","H23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ae6e616e3c60","kind":"platform-ui","anchor":"1. Open a **Tree Conflict** from the Match Center, the profile notification or the tree's yellow\n   triangle. Inspect the immediate family before acting. Tree conflicts can involve duplicate\n   relatives, competing parents or multiple spouses; they are distinct from field conflicts.\n   [H13 @2026-11-12]\n2. Stack only relatives demonstrated to be duplicates and use **Merge Duplicates** to reach the\n   comparison page. Before completing the merge, an accidentally stacked pair can be unstacked\n   with **unlink**. This is not an undo for a completed merge. [H13 @2026-11-12]\n3. For competing parent sets or non-biological links, open **edit this profile's relationships**\n   and compare the records for each relationship. Several spouses can be legitimate; the help\n   page describes **Cancel** for clearing that notification when there are no duplicates.\n   Preserve unresolved parentage instead of removing an inconvenient candidate to clear a\n   warning. [H13 @2026-11-12]\n4. For a suspected bad completed merge, open **Revisions**, locate the merge event and select\n   **view**. Inspect both profiles and their immediate families as shown at the merge. From that\n   page, use **View revision history** for the profile merged into the primary one; its older\n   history is not all visible on the combined profile's ordinary revision list. [H14 @2026-11-12]\n5. **Privacy gate:** <!-- privacy-gate: contact --> A curator request through a public assistance\n   discussion exposes profile URLs and family details of people who may be living; answer the\n   privacy gate in `SKILL.md` before posting it.\n   If the merge is still pending, undo it in the Match Center; no curator is needed. Otherwise\n   prepare a curator request containing the merge event, profile URLs, the demonstrated mismatch,\n   source locators and the intended separation. Geni documents curator assistance to undo a bad\n   merge through its linked assistance discussion. Keep private details out of a public request.\n   After the curator acts, recheck family links and fields and record any remaining conflicts.\n   [H15 @2026-11-12], [H21 @2026-11-12]","sources":["H13","H14","H15","H21"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c6018dda042e","kind":"unclassified","anchor":"1. **Privacy gate:** <!-- privacy-gate: upload --> Importing a GEDCOM uploads its people, possibly\n   including living relatives, into Geni's tree; answer the privacy gate in `SKILL.md` before\n   importing.\n   Preserve the original GEDCOM and identify its intended focus person. Before creating a branch\n   or launching an import, check the current restrictions: the focus must be you or a person born\n   after 1800, and Geni will not continue into branches for people born before 1600. If the intended\n   focus does not qualify, choose an eligible person represented in the file or plan manual entry\n   for the older data. Search Geni for the eligible focus first. When that person already exists\n   and your permissions allow it, begin **Import GEDCOM** from that profile's Actions menu; match\n   the correct GEDCOM record to the selected Geni profile. [H16]\n2. **Privacy gate:** <!-- privacy-gate: upload --> A GEDCOM imported as a new branch can carry\n   living people's details onto Geni; answer the privacy gate in `SKILL.md` before saving the form.\n   For a genuinely new, unconnected branch, use **Research → Create a Branch**. Enter the focus\n   person's details, tick **Import a GEDCOM for this person**, and save the form. In the importer,\n   select the GEDCOM record corresponding to that new profile. Use an existing tree location when\n   the connection is already established. Creating a branch does not make its contents private;\n   check the profile settings and keep speculative notes in the separate private register or\n   Workspace. [H1, H9, H16]\n3. Record the offered generation scope before confirming the import. Geni stops a branch when it\n   finds candidate matches already in the tree. An import need not load the entire file in one\n   operation. [H16]\n4. Inspect each stopped match. Merge only supported duplicate identities; reject a match only when\n   the evidence supports different people. Record unresolved matches and permissions that prevent\n   progress. Do not reject a plausible duplicate merely to make the importer continue. [H16]\n5. Compare the resulting family against the original file, including sources, notes and\n   relationships. Save an exception list of omitted, changed or unresolved material; do not assume\n   that a completed import preserves every field or media attachment.","sources":["H16","H1","H9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4ddc3c57f77e","kind":"unclassified","anchor":"1. **Privacy gate:** <!-- privacy-gate: export, publish --> A GEDCOM export or sharing copy can hold\n   living relatives' and private profiles' details; answer the privacy gate in `SKILL.md` before\n   exporting or sharing it.\n   Decide whether the output must be a portable tree file or a readable report. For native GEDCOM,\n   use your own profile, a profile you added, or an eligible immediate-family profile as the focus,\n   then its **Actions → Export GEDCOM** route. The export FAQ includes immediate-family profiles\n   unless blocked by the person or manager; the overview gives the narrower added-profile rule.\n   Check the offered export on the intended focus. Viewing or managing a profile alone does not\n   establish export eligibility. Basic and Pro accounts have limits tied to additions. [H16, H18]\n2. Choose the offered export group and primary-name language. **Blood Relatives** and **DNA\n   Relatives** are tree-based groups, not measured DNA-match lists; the FAQ includes adopted\n   relatives in the former and excludes them from the latter. For a sharing copy, consider\n   **Obscure private profiles** and still inspect the resulting file. Record the focus, offered\n   scope, selected options and retrieval date. [H18] Save the resulting file\n   unchanged. Open a copy in a trusted local genealogy program and inspect the focal person,\n   representative parent-child and partner links, and source/note coverage. Preserve the original\n   export if the receiving program normalizes or modifies it.\n3. **Privacy gate:** <!-- privacy-gate: export --> An ancestor or descendant PDF can name living\n   relatives; answer the privacy gate in `SKILL.md` before exporting it.\n   For a readable list, use **Actions → Ancestor Report** or **Descendant Report**, choose the\n   generations and select **Export PDF**. Record the chosen depth and report direction. The report\n   is not a GEDCOM and is not a complete export of the surrounding World Family Tree. [H17]\n4. Reconcile the output with the chosen scope and the live profiles. Record restrictions or missing\n   people as export exceptions, not as evidence that the relationship is absent. Retain the source\n   URLs for links whose documentation must still be retrieved.\n5. **Privacy gate:** <!-- privacy-gate: publish --> Before sharing either artifact, inspect its\n   actual contents for living/private people and private notes, and answer the privacy gate in\n   `SKILL.md`. A viewable report or a successful export does not establish that every contained\n   fact should be republished.","sources":["H16","H18","H17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fb60e8803f8e","kind":"portal-availability","anchor":"Have the researcher operate Geni directly, including opening profiles and source links and using\nthe account controls. Geni's terms prohibit AI tools from accessing the site, collecting its data,\ninteracting with its features or using Geni content to operate an AI model. Use independent records\nand notes free of Geni content for AI-assisted analysis. [H25 @2026-11-22]","sources":["H25"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-96e7b5402c79","kind":"method","anchor":"For a deceased person, retry the profile search with a patronymic from a contemporary notice or a\nfarm name from the parish register. If the name search stalls, search the public web for the\ndocumented farm and village together to find candidate Geni profiles. Compare the candidate's\nhousehold and dates with the records before accepting the identity. [S5, S6, S7, S8]","sources":["S5","S6","S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-746893297ba0","kind":"method","anchor":"When a profile shows only one marriage or an incomplete set of children, use dated marriage,\nbaptism and household entries to reconstruct each household. Use the mother's age in an earlier\nbaptism to screen a candidate and corroborate her identity before adding the child to the local\nreconstruction. For a child missing from the father's profile, look for named heirs and their\nstated relationships in the mother's estate inventory. Compare the full documented sibling group\nwith the profile before attributing an omission to an editor. [S9, S10, S11, S12, S13, S14]","sources":["S9","S10","S11","S12","S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a45db1dc752c","kind":"method","anchor":"If a household entry gives no clear departure, check the next volume at that locality. Use a\nlater appearance cited on the profile to locate the entry. For a proposed family move, use both\nspouses' profiles and any compiled genealogy covering the family to locate dated entries on each\nside of the move. Record which people each entry actually places there. [S14, S15, S16]","sources":["S14","S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b961a1784265","kind":"method","anchor":"When a profile biography repeats a Wikipedia article, trace the article's references and the\nprofile's attribution back to the text they drew on. Count demonstrated copies or adaptations\nas one evidence chain and cite the earliest version you can inspect. [S17, S23]","sources":["S17","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6f0c3a41ec8f","kind":"method","anchor":"For a profile's account of a property sale, check the contemporary notice for the parties, date\nand price. Track claims about the parties' prior dealings or motives separately. Assign them\nevidentiary weight only when a source addresses them. [S18, S23]","sources":["S18","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d58042fdf571","kind":"method","anchor":"When a proposed death year follows the last listed child, look for a later dated record placing\nthe parent alive. Kyläkoski reports that a royal decision placed a mother alive after her\nprofile's proposed death year. [S19]","sources":["S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04fbf0378160","kind":"method","anchor":"For farm succession, inspect any farmholder list in the locality project for changes of holder,\ntenure dates and farm divisions or reunifications. Use those clues to identify which dated tax\nrolls and land records to compare. Keep succession and ownership provisional until the records\nsupport them. [S20, S21]","sources":["S20","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-439aa1d2d9d1","kind":"method","anchor":"When same-name candidates share a birth year, identify the spouse in the later household entry\nand compare their marriage date with the dated end of the earlier marriage. If the dates overlap,\ntest the two-person explanation before deciding whether to merge. [S14, S22, S23]","sources":["S14","S22","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
