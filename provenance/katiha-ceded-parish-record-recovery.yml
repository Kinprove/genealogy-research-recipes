claims:
  - {"id":"C-katiha-ceded-parish-record-recovery-01","kind":"portal-availability","anchor":"Use the National Archives’ public Katiha form for eligible records from the ceded parishes. Look for the parish and available birth, death, moving and marriage series. Include Petsamo when the parish or event belongs there [S4 @2026-11-22] [S2 @2026-11-22] [S6 @2026-11-22] [S7 @2026-11-22] [S8 @2026-11-22].","sources":["S4","S2","S6","S7","S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-katiha-ceded-parish-record-recovery-02","kind":"portal-availability","anchor":"Use the National Archives’ web interface for personal data more than 100 years old. Check the separately available death data, for which the archive gives a 50-year threshold. For restricted material, use Katiha Windows at a National Archives reading room under its access-permission procedure [S5 @2026-11-22] [S2 @2026-11-22].","sources":["S5","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-katiha-ceded-parish-record-recovery-03","kind":"platform-ui","anchor":"Search Katiha by surname, parish and record type. Compare patronymics and titles across burial and communion-book hits. To see who else is indexed on a communion-book page, run Tarkennettu haku with the Sidos (volume) and Sivu (page) fields from the hit. Leave the personal name fields empty and check the matching parish and record type [S1 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-katiha-ceded-parish-record-recovery-04","kind":"method","anchor":"If the hit omits the volume’s years, find the parish’s communion books in Digihakemisto or the National Archives catalogue. Match the volume identifier before using its year range. Keep the page reference, transcription and original-image access as separate observations [S1] [S7] [S2].","sources":["S1","S7","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-katiha-ceded-parish-record-recovery-05","kind":"portal-availability","anchor":"A sparse result leaves another person’s presence and any explicit earlier-page reference unresolved. Check the archive’s omitted-materials list and follow the reference in the original series. The National Archives says it makes no regular corrections to the database. Keep an index miss open while the register page remains unexamined [S1 @2026-11-22] [S8 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S1","S8","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-katiha-ceded-parish-record-recovery-06","kind":"method","anchor":"If the burial and communion-book entries together supply a father’s given name and trade, search historical newspapers for the name and occupation together. Use an appointment or transfer notice to check whether a candidate worked in the parish at the relevant time [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
