  - {"id":"S7","kind":"web-page","urls":["https://blog.myheritage.com/2026/04/tracing-migration-waves-from-the-u-k-and-ireland-to-the-u-s/"],"published":"2026-04-16","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the colonial migration section on 2026-11-22. The post uses the split Brewster crossings as an example of a family arriving in stages. The later ship assignments come from the Society profile.","entry_sha256":"a75fc7f8eb1e29173bca04a6b19eed2096c36c1a7f057dedc72fb96575ad436c","claims":["C-08"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://www.pilgrimhall.org/the-fortune/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the passage about passenger identification on 2026-11-22. The museum describes the missing original passenger list and gives the locator in Plymouth Colony Records for the 1623 Division of Land used to reconstruct arrivals.","entry_sha256":"9e5ecc8f72e0b5b4c2c0d6a1adec6a276a5760e2cc7f6bc6282b1eeae5206728","claims":["C-08"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://themayflowersociety.org/passenger-profile/passenger-profiles/the-brewster-family/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the profile passages on the three crossings and the 1623 land allotments on 2026-11-22. The profile identifies Jonathan on the Fortune and Patience and Fear on the Anne, with the respective years.","entry_sha256":"f9276469b4ff31fdea0e31ec1b63ecc6cc062c2f7989363a6e6686ee73feb572","claims":["C-08"],"review":"reviewed"}
  - {"id":"S10","kind":"web-page","urls":["https://heritagebooks.com/products/101-b2021"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the reprint description on 2026-11-22 for the four named voyages, the organization by ship, and the English residence and family details in the sketches.","entry_sha256":"c64aa56eeaa646746c9278d3e646c049d089f61e13ee029679e981087a0e3233","claims":["C-09"],"review":"reviewed"}
  - {"id":"S11","kind":"web-page","urls":["https://shop.americanancestors.org/products/the-winthrop-fleet-massachusetts-bay-company-immigrants-to-new-england-1629-1630?pass-through=true"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the publisher's description on 2026-11-22. It distinguishes the Winthrop Migration from the 1630 fleet and describes the arrival evidence in Anderson's sketches.","entry_sha256":"5361dbf89bfe8f06455f2072200da892d57dbc8e9afe95ff64046b7caeccdd92","claims":["C-11","C-12"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://heritagebooks.com/products/101-b2058"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the reprint description on 2026-11-22 for Banks's scope, passenger names, origins and bibliographic references.","entry_sha256":"f87be9260f78a5b1e264ddf2b8cef5c02c6d8fe41c14e0255a9d0043a5a8259b","claims":["C-12"],"review":"reviewed"}
  - {"id":"S13","kind":"video","urls":["https://www.youtube.com/watch?v=LBlDBf8BXkw"],"published":"2022-06-12","retrieved":"2026-11-22","access":"unknown","rights":null,"basis":"Attempted to open the video URL on 2026-11-22 and the fetch was throttled. Used the supplied transcript excerpt for the presenter's suggestion to consult Young for later early arrivals. The book's contents and index support a search of documents, with no assumed coverage of specific arrival waves.","entry_sha256":"e7cef7f1edcb97499dba3f400b0c50db99b8cc20fb7aa4fd0a9aa6986c948178","claims":["C-13"],"review":"reviewed"}
  - {"id":"S14","kind":"web-page","urls":["https://books.google.com/books/about/Chronicles_of_the_First_Planters_of_the.html?id=9HEFAAAAQAAJ"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the digitized 1846 edition's contents listing and index locator on 2026-11-22. Used the entries for the Massachusetts Bay Company records, company correspondence and Francis Higginson's voyage journal.","entry_sha256":"d7274caf4089334955d0a98ad0a67abeb30dcd31b54108cf39233f7dfc0e1baf","claims":["C-13"],"review":"reviewed"}
  - {"id":"S15","kind":"video","urls":["https://www.youtube.com/watch?v=UUZ6LIOSHao"],"published":"2023-03-30","retrieved":"2026-11-22","access":"unknown","rights":null,"basis":"Attempted to open the video URL on 2026-11-22 and the fetch was throttled. Used the supplied transcript excerpts for the discussion of Farmer, Savage's expansion and Banks's two voyage-related books. Consulted the book records and publisher descriptions for scope.","entry_sha256":"8aad8ca208f348dd9c8578a26ed7648299dd06237ba14d5e9c1f43f5417a421b","claims":["C-09","C-12","C-14"],"review":"reviewed"}
  - {"id":"S16","kind":"web-page","urls":["https://www.historicnewengland.org/explore/collections-access/gusn/?gusn=151342"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the catalogue record on 2026-11-22 for the title's arrival cutoff before May 1692, its stated basis in Farmer's Register and the four volumes' surname ranges.","entry_sha256":"2b4007f93244d6613c1fde9b0077d5027401b0aadf48578ab4c8403e41b738da","claims":["C-14"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://books.google.com/books/about/A_Genealogical_Register_of_the_First_Set.html?id=jM4UAAAAYAAJ"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the digitized edition's bibliographic page on 2026-11-22 to verify the title, author and 1829 publication date.","entry_sha256":"6ca4e17d489fef3ed7266d9e24c632683d80ba8a37622607f257771a17eb1208","claims":["C-14"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter, use the passenger’s Silver Books line as the first compiled check, and consult the Great Migration sketch if details of the immigrant’s family are missing. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Use the Mayflower Society’s volume guide to pick the part that covers the child branch and generation. For Desire Howland, search for the separately published Picton Press descendant volume and check the Society’s edition guide for its branch coverage. Look for George Soule in the pink *Mayflower Families in Progress* series and for the relevant Philip Delano lines in that guide’s green softcover sequence. Search a library catalogue by the exact volume or part when you need a copy. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"According to the presenter, choose between the two Great Migration series by arrival year and find the surname within that series. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Look up 1620–1633 arrivals in the three volumes of *The Great Migration Begins*, including Mayflower arrivals where a Silver Books entry leaves a gap in the immigrant’s household. For 1634 or 1635, use the seven-volume *The Great Migration* series and select the alphabetical volume for the surname. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"According to the presenter, compare the immigrant sketches when a surname could lead either to John Howland or to his brother Henry. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Work from the established descendant line to the matching child. Use the immigrant’s child list and sibling notes together. For a claimed John Howland descent, compare the candidate child with John’s listed children and investigate the brother’s line separately if the parent-child chain leads there. [S3], [S4]","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"According to the presenter, use Robert Charles Anderson’s *The Mayflower Migration: Immigrants to Plymouth, 1620* to look up a claimed passenger. [S5†], [S6] For a Plymouth Colony settler through 1633, including a later arrival, use Anderson’s broader *The Pilgrim Migration: Immigrants to Plymouth Colony, 1620–1633*. [S3]","sources":["S5","S6","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"If a relative is absent from the Mayflower list, check later Plymouth voyages before ruling out the child branch. [S7] Use the 1623 Division of Land (*Plymouth Colony Records*, 12:5) to check a reconstructed passenger list such as the *Fortune*’s. [S8] Jonathan Brewster came on the *Fortune* in 1621 and his sisters Patience and Fear on the *Anne* in 1623, after their parents’ Mayflower crossing. [S9]","sources":["S7","S8","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"According to the presenter, use Charles Edward Banks’s *The English Ancestry and Homes of the Pilgrim Fathers* for a passenger’s English origins. [S15†], [S10] Look up the passenger under the *Mayflower* (1620), *Fortune* (1621), *Anne* (1623) or *Little James* (1623). Treat the places and relationships in the sketch as leads to verify in English records. [S10]","sources":["S15","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"According to the presenter, use *The Great Migration Directory: Immigrants to New England, 1620–1640* to look up immigrants across the full period. [S5†], [S3] When the arrival year is uncertain or you lack a full sketch, search under the likely household head. Use the entry’s origin, migration date, New England residences and bibliography to locate a sketch or the cited evidence. For a 1636–1638 arrival, check the publisher’s Third Series list for a volume that covers the surname. [S3]","sources":["S5","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"According to the presenter, check Anderson’s *The Winthrop Fleet: Massachusetts Bay Company Immigrants to New England, 1629–1630* for a fleet claim. [S5†], [S11] Check the sketch’s arrival evidence for the particular voyage before assigning the immigrant to the 1630 fleet. The book covers the broader company migration of 1629 and 1630. [S11]","sources":["S5","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"According to the presenter, check Banks’s *The Winthrop Fleet of 1630* for a 1630 fleet claim. [S15†], [S12] Look up the immigrant’s name and any English home, then use Banks’s references and Anderson’s sketch to test any vessel assignment before recording it. [S12], [S11]","sources":["S15","S12","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"According to the presenter, look in Alexander Young’s *Chronicles of the First Planters of the Colony of Massachusetts Bay* for people who arrived after the first settlers. [S13†] Within the volume’s 1623–1636 scope, search its index for the person and follow hits to the specific company record, letter or voyage account, such as Francis Higginson’s journal. Cite that document and page. An index miss leaves the arrival question open. [S14]","sources":["S13","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"When a pedigree cites John Farmer’s 1829 *A Genealogical Register of the First Settlers of New England*, find the entry the claim relies on. [S17] According to the presenter, James Savage’s *A Genealogical Dictionary of the First Settlers of New England* expands Farmer’s work. [S15†], [S16] Compare what each author actually says and verify the proposed link against the records. For a settler outside Great Migration coverage, use Savage’s four alphabetical volumes for arrivals before May 1692. [S16], [S3]","sources":["S17","S15","S16","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
