  - {"id":"S5","kind":"video","urls":["https://www.youtube.com/watch?v=cgouH-hlwcI"],"published":"2022-11-27","retrieved":"2026-11-22","access":"unknown","rights":null,"basis":"Attempted to open the video URL on 2026-11-22 and the fetch was throttled. Used the supplied transcript excerpts for the presenter's book suggestions. The publisher's descriptions establish that the Plymouth book includes Mayflower settlers, the Directory guides research beyond the first two series, and Anderson's Winthrop volume covers the broader company migration.","entry_sha256":"9ab056f5afbcd3a50e86306d7fcd6ce2bb0bdfd221e9f56060e6ab39c063e024","claims":["C-07","C-10","C-11"],"review":"reviewed"}
