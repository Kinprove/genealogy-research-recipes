sources:
  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=WOndbgCA4Ek"],"published":"2022-07-30","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the presenter’s advice to use both series and compare John and Henry Howland; checked the treatment of Desire and early edition colors against the publisher.","entry_sha256":"eae3cc2446cbfc3d5c4b57681808ce90e5f9fd8f38999d9c947b875b24ba5de6","claims":["C-01","C-03","C-05"],"review":"reviewed"}
  - {"id":"S2","kind":"pdf","urls":["https://themayflowersociety.org/wp-content/uploads/2024/02/REFERENCE-GUIDE-TO-THE-GSMD-SILVER-BOOK-SERIES.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. 2024 edition guide. Used the separate Picton Press Howland volumes and the guide’s descriptions of George Soule and Philip Delano MFIP coverage.","entry_sha256":"9ebb1d62bf473ebec22591b74835c096fa4928293011fb2c637015ba2546a64b","claims":["C-02"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.americanancestors.org/projects/great-migration-study-project"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Publisher documents arrival-year splits, alphabetical sketches and the books in each series.","entry_sha256":"22b8b93d068b720875983f455e03e1fb1a8a77122488c42fb3be649775d13a94","claims":["C-04","C-06"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://mayflower.americanancestors.org/john-howland-biography"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The passenger sketch records his children and identifies his brothers.","entry_sha256":"baead676aa82a32812c79a7f59795f998fe21dd5e2e6aadef45cd4046ce2f261","claims":["C-06"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter, use the passenger’s Silver Books line as the first compiled check, and consult the Great Migration sketch if details of the immigrant’s family are missing. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Use the Mayflower Society’s volume guide to pick the part that covers the child branch and generation. For Desire Howland, search for the separately published Picton Press descendant volume and check the Society’s edition guide for its branch coverage. Look for George Soule in the pink *Mayflower Families in Progress* series and for the relevant Philip Delano lines in that guide’s green softcover sequence. Search a library catalogue by the exact volume or part when you need a copy. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"According to the presenter, choose between the two Great Migration series by arrival year and find the surname within that series. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Look up 1620–1633 arrivals in the three volumes of *The Great Migration Begins*, including Mayflower arrivals where a Silver Books entry leaves a gap in the immigrant’s household. For 1634 or 1635, use the seven-volume *The Great Migration* series and select the alphabetical volume for the surname. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"According to the presenter, compare the immigrant sketches when a surname could lead either to John Howland or to his brother Henry. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Work from the established descendant line to the matching child. Use the immigrant’s child list and sibling notes together. For a claimed John Howland descent, compare the candidate child with John’s listed children and investigate the brother’s line separately if the parent-child chain leads there. [S3], [S4]","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
