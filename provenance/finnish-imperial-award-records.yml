claims:
  - {"id":"C-find-the-notice-under-both-newspaper-languages-1","kind":"portal-availability","anchor":"Start with the date span and locality at the National Library of Finland’s digitized newspaper service. Use the catalogue record for Finlands Allmänna Tidning (FAT) to enter the Swedish run by title and issue. [See historical newspaper section search](historical-newspaper-section-search.md) for image browsing and OCR gaps. [S13 @2026-11-22] [S14 @2026-11-22]","sources":["S13","S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-find-the-notice-under-both-newspaper-languages-2","kind":"method","anchor":"Search FAT first for the decision. Check Helsingfors Tidningar and local Swedish and Finnish papers for a fuller account or a separate presentation. Titles to test include Wasa Tidning, Åbo Tidningar, Åbo Underrättelser, Maamiehen ystävä, Suometar and Turun Wiikko-Sanomat. Search the recipient and locality alongside Swedish and Finnish award terms, including period forms of mitali such as medalja and medaljat. Browse the image for a known issue when OCR has no hit. Extend the issue search beyond the deed year and across New Year after a late December notice. [S1] [S2] [S3] [S4] [S5] [S6] [S7] [S8] [S9] [S10] [S11] [S12] [S13] [S14]","sources":["S1","S2","S3","S4","S5","S6","S7","S8","S9","S10","S11","S12","S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-find-the-notice-under-both-newspaper-languages-3","kind":"method","anchor":"If the lead comes from an imperial visit, read to the end of promotions and appointments for gifts and then check the next issue for a separate recipient list organized by province. In any transcription of a grouped award, establish the scope of editorial symbols from the transcriber’s key and verify the delivery wording in the printed issue. [S5] [S7]","sources":["S5","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-decision-one-person-at-a-time-4","kind":"method","anchor":"Give each named person a row with role, occupation and locality as printed, the deed or grounds, medal metal, inscription language, ribbon, wearing instructions and any money or other object. Mark whose role was only mentioned, whose reward was cash or a gift and who received more than one kind of reward. Check the corresponding notice in the other language on its own issue date. Preserve a translated motto separately from the wording attributed to the medal. [S2] [S3] [S4] [S7] [S10] [S11]","sources":["S2","S3","S4","S7","S10","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-decision-one-person-at-a-time-5","kind":"method","anchor":"For a broadly worded award such as service to the public good, run the recipient’s name and locality through contemporary local reporting and a published town history for the dated office, project or service that might explain it. Keep that explanation provisional unless a notice or file explicitly connects the work to the award. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-decision-one-person-at-a-time-6","kind":"method","anchor":"Check contemporary award notices even when a tree, career memorial or probate inventory omits the medal. Use a detailed probate inventory to check what metals and quantities were actually listed among the person’s possessions. If comparing an award to one painted in a portrait, check its metal, ribbon and the sitter’s name attribution against the notice and independently verify the given name. [S1] [S2] [S4] [S8] [S9] [S12]","sources":["S1","S2","S4","S8","S9","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-find-the-presentation-and-file-behind-the-notice-7","kind":"method","anchor":"Search the local meeting or ceremony report for the handover date, venue and presenter. For a delegation, check the attendee list, the people admitted to an audience and the actual recipients separately. Require a separate account of an audience before recording that the emperor personally presented an award. [S1] [S2] [S3] [S10]","sources":["S1","S2","S3","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-find-the-presentation-and-file-behind-the-notice-8","kind":"custody","anchor":"In Astia, enter the Kenraalikuvernöörinkanslia by fonds and search the Finnish finding lists for general and departmental acts by year and subject. Carry in the award or presentation date, the recipient’s office or place and the exact grounds from the notice. Use archive list 305 to convert an old general-act identifier to the present unit identifier. If the catalogue is silent, work from the registers and find the act or rescript it references. Keep a lead from a newspaper distinct from an archival file you have opened. [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22] [S5 @2026-11-22] [S6 @2026-11-22] [S7 @2026-11-22] [S8 @2026-11-22] [S9 @2026-11-22] [S10 @2026-11-22] [S11 @2026-11-22] [S12 @2026-11-22] [S15 @2026-11-22]","sources":["S2","S3","S4","S5","S6","S7","S8","S9","S10","S11","S12","S15"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
