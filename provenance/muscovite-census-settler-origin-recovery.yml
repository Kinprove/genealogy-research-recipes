claims:
  - {"id":"C-24fd9b394c3b","kind":"method","anchor":"- **Census books (переписные книги).**\n  - Tobolsk uezd, L. Poskochin: RGADA f. 214, op. 5, d. 261. The inventory calls it a Tobolsk cadastral book and dates it 1683 [S35]. Posted extracts give its working years as 189–191 (1680/81–1682/83) [S1], [S2], [S5], [S7], [S19]. Use op. 5 when ordering; one thread prints op. 15 [S10].\n  - Verkhoturye uezd, Poskochin, 1680: f.214 op.1 d.697. [S18]\n  - Tobolsk uezd 1710: the Tomilov book, f.214 op.1 d.1524 [S1]; Maslyanskaya and Barnevskaya slobodas, d.1525 [S5], [S10]; the Turskiy book, d.1526 [S5], [S11].\n  - Verkhoturye uezd 1710: d.1539. [S18]\n  - Tobolsk uezd 1719: f.214 op.1 d.1587. [S5], [S7], [S10], [S17], [S19]\n  - Tobolsk town and uezd 1720: f.214 op.1 d.1617. [S24]\n  - Aramashevskaya sloboda 1721: f.271 op.1 d.617, described in the posted transcription as an original. [S18]\n- **Earlier Verkhoturye books.** These are a 1621 dozor book (f.1111 op.4 d.1), the 1624 Tyukhin cadastral book (f.214 kn.5), the 1632 tithe-ploughland book (f.214 op.1 d.35), the 1645–46 oath-of-allegiance book (f.214 op.1 d.194) and the 1659 census (f.1111 op.4 d.40). [S1], [S18]\n- **Fiscal books.**\n  - Tobolsk uezd peasant books: 1687 (f.214 op.1 d.857) [S2] and 1702 (d.474) [S7]. Check d.474 against the inventory before you order.\n  - Verkhoturye income books: 1702 (d.1346) and 1703 (d.5a) [S3].\n  - The 1700 Novopyshminskaya customs books (d.1236) [S3].\n  - Service lists can also help, such as the 1700 Tobolsk dragoon lists (d.1248). [S11]\n- **Post-1719 bridges.**\n  - The 1735 Katay revision (GASO f.42 op.1 d.86) and the 1743 revision (GASO f.38 op.1 d.29). [S7]\n  - The 1744 Shadrinsk district revision, cited as RGADA f.614 op.1 d.73. [S1], [S2] Both threads work from this case, and S1 gives its folio index. Verify the fond number in the inventory when you order.\n  - Ekaterinburg department: forum extracts give RGADA f. 350, op. 2, dd. 900 and 901 [S18], [S24]. The inventory dates both to 1748 and lists different settlements: Katai and Kamensk in d. 900, Aramashevskaya and Nevyanskaya in d. 901 [S36].\n  - Tobolsk uezd, GATO f. И47, op. 1, d. 556: the posted extract gives “1726?” [S19]. Check the inventory or title leaf before assigning the household to 1726.\n- **On the European departure side,** use RGADA f.1209 for 17th-century census and cadastral books and the 1710 censuses. Examples are Solvychegodsk 1710 (d.1082), Vyatka 1710 (d.1098), Ustyug Utmanovskaya volost 1677–78 (d.15047), Urzhum 1646 (d.6468), Vyatka 1678 (d.521) and the Kadyy volosts (d.10958–10996). [S2], [S8], [S11], [S14], [S6] Use RGADA f.350 for the 1716–17 landrat censuses, for example Urzhum (op.1 d.136) and the Arskaya doroga (op.1 d.147). [S8], [S25]\n- **Holders outside the state fond.** [S4], [S9]\n  - Estate books (сотные) for the Stroganov estates are in the Stroganov fond at RGADA.\n  - A sound 18th-century copy of the 1623/24 Solikamsk census is in GASO f.111.\n  - For Stroganov estates, seek the 1735 copy of the 1678 Belsky census in the Dmitriev personal fond at GAPO. A researcher reported receiving an extract after a request to copy the whole Kishert estate section was refused [S4]. Confirm current copying terms for the material you need.\n  - The 1623/24 Kaysarov cadastral book for Cherdyn and Solikamsk is in ОР РГБ, cited as f.256 d.308.","sources":["S35","S1","S2","S5","S7","S19","S10","S18","S11","S17","S24","S3","S36","S8","S14","S6","S25","S4","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-46fd69bc9c29","kind":"method","anchor":"For each copy, record its date, holder and the part of the territory it covers. The GAPO copy covers only the Stroganov estates, not Solikamsk. [S4]\n- **Boyar and town books (RGADA f. 137).** If the territorial inventory misses a known book, check alternative inventory headings. A researcher reports the 1645/46 Dvina uezd census under Klin [S9]. Verify the book’s own heading before assigning its entries to either place.\n- **Later copies of land grants.** According to a posted GASO inventory, f.733 op.1 d.1 holds petitions and land grants of Irbit uezd state peasants. They are 1831 copies of 17th–18th-century documents, not originals. [S22]","sources":["S4","S9","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9b7fb60b123a","kind":"unclassified","anchor":"- A participant reports that RGADA has posted typed f.214 inventories as PDFs with a text layer (op.1 parts 2 and 4, op.4, op.5, op.6). [S21] Use them to find cases, and record the opis and item before you order.\n- If an f.1209 alphabetical list gives only a column (столбец) reference, open the register volumes of the same opis that key that alphabet. In the worked case a participant pointed from an op.85 alphabet to the register volumes d.1195i and d.1196i of RGADA f.1209 op.85, which gave each name its column, year and folio. Resolve each name to its column, year and folio, and log which names you left unresolved. [S13]\n- RGADA cases can be viewed remotely through online.archives.ru with a Gosuslugi login. Access is billed by time: 90 rubles per hour (350 rubles per day) under government resolution No. 982 of 30 June 2025, in force from 10 July 2025.\n- A note forwarded on the forum adds that you must order every case you want before paying, because no other case can be opened once the session is paid for. [S21] Plan your case list first. The paid time starts when the first case is opened, not at payment, so open the cases only when you are ready to read them. [S26], [S27]","sources":["S21","S13","S26","S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c678e2be5bd6","kind":"unclassified","anchor":"For a village founded after 1719, search the parent sloboda's books first. The 1744 revision lists such villages as newly founded and names households as moved there from the sloboda or another village. Only then turn to the village's own church fond. [S1], [S10]","sources":["S1","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c1437ac0373","kind":"unclassified","anchor":"[S2], [S5], [S15], [S19]","sources":["S2","S5","S15","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0641b30829c9","kind":"unclassified","anchor":"Note the section heading as well. Siberian books group newcomers under headings such as захребетники newly charged obrok, or men newly enrolled to plough without exemption. [S1], [S5] Headings in 1719–1720 books can also place a household by registration unit ('чертежу X слободы') while it lived elsewhere. Record both places. [S24]","sources":["S1","S5","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d71a78b006f5","kind":"method","anchor":"- **Short anno-mundi years.** Before 1700, '189' means 7189. The year began on 1 September, so 7189 = September 1680 to August 1681. Write it as \"189 [7189 = 1680/81]\". If the month is given, subtract 5509 for September–December and 5508 for January–August (for example, 7206 in September = 1697). [S1], [S3], [S15]\n- **Letter numerals.** Fugitive-inquiry files write years as letter numerals. Examples: РПЗ = 187, РПИ = 188, РПѲ/РЧ/РЧА = 189/190/191, РЧЕ = 195, СS = 206, ҂АѰГ = 1703. [S17] Transcribe the letters and give the value in brackets. Three-letter values of this kind are short anno-mundi years and are converted as above. A ҂ multiplies the letter after it by a thousand and does not mark the era, so read the full value: ҂АѰГ = 1703 is a Nativity year, but a full anno-mundi form such as ҂ЗРПѲ = 7189 is converted as above.\n- **From 1700 the books count from the Nativity.** These are the 1700 customs book, the 1702 and 1703 income books, and later short forms such as 700, 720, 724, 742. A 1710 entry can put a death 'в 202-м году' (7202 = 1693/94) next to one 'в 700-м году' (1700). [S3], [S4], [S7], [S18] Never subtract 5508 from a three-digit year of 700 or more.\n- **Separate folios from years.** Look for a leaf boundary or «л.» and read the surrounding sentence. In one transcription «698)» was the folio, while 186 and 190 were the survey years [S2]. Confirm a bare number against the image or neighbouring folios before treating it as a date.","sources":["S1","S3","S15","S17","S4","S7","S18","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a12bc7fb0242","kind":"method","anchor":"- **Test the stated arrival against earlier books.** A Beloslud resident appears in the 1659 census despite a later statement dating his arrival to 1662/63 [S16]. Keep the reported arrival and earliest documented presence in separate fields. Leave the reason for the conflict open.\n- **Test birthplace formulas.** If an entry calls someone native to the ostrog, check named relatives and earlier returns with known coverage. In one 1743 case the family was missing from the 1683 and 1695 censuses [S7]. That raises a question about the birthplace formula without identifying another birthplace.\n- **Compare ages across copies.** In a reported Katai comparison some adults’ ages differed by five to ten years, and even a child’s age differed by three [S7]. Keep both figures, compare relatives and household structure, and avoid a fixed age cut-off.\n- **Check for children omitted from the household.** A 1680 Shadrinsk extract names sons whose stated ages imply they were already born when the 1677–78 Ustyug list omitted them [S14]. Verify the household link, ages and coverage before using an absence against a proposed son.\n- **Retain conflicting readings.** An approximate age or stated arrival year can justify a lower ranking. Test the conflict against independent dated records before accepting or excluding the candidate [S7], [S16].","sources":["S16","S7","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b7b2c36da09e","kind":"method","anchor":"- **Use the uezd to test a distorted place name.** A reported Siberian entry gave «Кудская волость города Кадуя» [S6]. A 1710 estate return places the named households in Куская волость, Кадыевская осада, Kostroma uezd [S37]. Check the period jurisdiction before selecting the modern Vologda place called Kaduy.\n- **Trace the specific volost through boundary changes.** Start with Kadyevskaya osada of Kostroma uezd [S6], [S37]. Kadyy became an uezd town of the Kostroma namestnichestvo in 1778 and belonged to Makaryev uezd after 1796 [S38]. For the former uezd’s villages, check the Galich, Kineshma and Makaryev successors against a dated map or inventory before searching the books [S39]. See [evidence/proof judgment](evidence-proof-judgment.md).\n- **Separate birthplace, intermediate residence and arrival.** A settler’s statement named a Vyatka village between his flight from the landowner and his arrival in the Siberian sloboda [S6]. Preserve each place with the words that identify its role.\n- **Do not infer an origin from a surname alone.** Carry the stated birth uezd to its own records. [S19]\n- **If no origin is stated, test surname clusters.** Tabulate every family of the destination village. Check each family against the 1710 and 1719 books of candidate source slobodas. Search first and deepest where a cluster appears, but do not require a cluster: a lone household from a more distant place can still be traced on its own. Allow for surnames that changed. [S11] One participant held that the Middle Urals were settled from the west and the southern Trans-Urals from the north, not the east. Use that to order the search, not to exclude a source area. [S11]","sources":["S6","S37","S38","S39","S19","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-12b1d79a547e","kind":"method","anchor":"- **Look for the departure note.** Search the origin-side census or cadastral book for a deserted-homestead note naming the same man.\n  - Match the departure interval, direction of travel, household, parish and village against the arrival statement. In the posted Solvychegodsk extract (RGADA f. 1209, op. 1, d. 1082), the two surveys bracket a family’s departure for Siberia between 186 and 190 (1677/78–1681/82). The Maslyanskaya entry gives arrival in 189, the origin village and a diminutive of the given name [S2]. Record the two folios separately.\n- **Match one household at a time.** Two Maslyanskaya households gave the same origin village, but only one could be linked to that departure note [S2]. Keep the second household open.\n- **Extract explicit dates of departure.** Check the 1646 Yarensk census, cited as RGADA f. 1209, op. 1, kn. 143, for «сшел в Сибирь» and the year that follows [S12]. Use the wording to date departure. Search the destination separately for arrival.\n- **Distinguish a mention in the old village from presence there.** In the 1710 Shutovo return, Agapit Vasilyev is listed with his family, while Roman Vasilyev is named in an empty-household entry that dates his flight to 1708 (RGADA f. 350, op. 1, d. 133, fols. 170–170v) [S37]. Trace the earlier osada in its census and cadastral books [S6].","sources":["S2","S12","S37","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-aa781f36a3b7","kind":"method","anchor":"- **Extract retrospective statements in 1710–1711 books.** Look for the previous householder, a father’s or grandfather’s house, a deserted dwelling and a dated death [S4], [S17]. If a later clerk amends an earlier entry, retain the old wording alongside the correction and locate the earlier folio.\n- **Follow empty-household notes to the heirs.** If a census marks a house empty and says the heirs live on a named new settlement (починок), go to that починок in the same census. Match the sons by name and age to the earlier household listing. [S20]\n- **Use the explicit back-references in landrat books (1716–17).** They record each household's entry in the 1710/1711 census, a split from a father's or uncle's household, a move from another village of the same hundred, and deaths and flights with year and destination. Link across the two censuses by these references, not by name. [S25]\n- **Date a settler's arrival from fiscal books.**\n  - Find the income-book section for peasants newly charged obrok after leaving the settler exemption ('вышли изо льготы').\n  - Compare a dated placement with the first tax assessment in the same sloboda. A September 7206 (1697) placement and a 1698/99 entry leaving exemption prompted an estimate of one year at Novopyshminskaya [S3]. Use the local dates and any stated terms before estimating another settler’s arrival.\n  - Customs books record sales between named peasants and can give an earlier attestation. [S3]\n  - Peasant books were obrok assignments, not censuses. A man could still be listed at his old place after moving to the works. [S16]\n- **Look for a fugitive inquiry (сыск).** A posted 1703 extract (RGADA f. 214, op. 1, d. 1314) quotes the 189–191, 195 and 206 books and a copy of the 187 estate census, alongside testimony about origin, flight and marriages [S17]. Extract the speaker and locator for each statement and check each quoted entry against its book.\n- **Identify the person being questioned.** In that inquiry the witness was the son of the household head in the books, and the name forms differed between records [S17]. Compare the named father, household and route before linking the testimony.\n- **Check whether the enumerator named dependants.** The reported 1659 Beloslud entries name householders alone [S16]. Use another series to look for their spouses or children.","sources":["S4","S17","S20","S25","S3","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0729f5d97611","kind":"method","anchor":"For the 1719 Katai ostrog, compare RGADA f. 214, op. 1, d. 1587 with D. Rukin’s household book, GASO f. 24, op. 2, d. 74. The local version reportedly names women and records taxes absent from the central version [S7]. Compare ages, surname spellings and village grouping row by row. A village can be folded into a selo or its inhabitants listed under the ostrog’s posad. A child’s differing ages may prompt a check of the two dates, but cannot date the copies by themselves.","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-20bbd2aea7c4","kind":"unclassified","anchor":"- **Test each link against what the entries show.** Use ages, relatives, patronymics, nicknames and household splits, and log every spelling variant. Clerks wrote by ear, so the same surname can change a vowel or a consonant between books. [S1], [S3], [S7], [S2]\n- **Search beyond the indexed surname.** In 17th-century books, also check:\n  - entries recorded only with a patronymic or a nickname (прозвище)\n  - householders without a surname in a village whose alternative name ('… тож') matches the surname\n  - letter confusions such as Т/М","sources":["S1","S3","S7","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-78cc3acec600","kind":"method","anchor":"Keep a proposed child-to-adult link open if only the name and patronymic agree across the interval [S12]. Preserve the earlier name and baptismal name separately when a later return supplies both [S20], [S23].\n- **Track occupational and family names separately.** One posted comparison links a church clerk’s son named Хомяков at origin with a Siberian entry under Попов and reports that his children later used Хомяков [S14]. Test the link through birthplace, household and patronymics before adopting either surname.\n- **Follow a surname dictionary’s citation to the record.** In a reported check the surname reading differed from the manuscript extract, and another cited person turned up in a neighbouring починок [S9]. Inspect the original page when possible, including nearby settlements, and retain the dictionary’s reading separately.\n- **Check each generation across a gap.** Even if only one household of the surname appears in a village in 1747, compare each later household’s patronymics and relatives before connecting it to the early-19th-century metrical books [S18]. Use [evidence/proof judgment](evidence-proof-judgment.md) for the identity ruling.","sources":["S12","S20","S23","S14","S9","S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6e89e464e971","kind":"method","anchor":"- **The book did not record departures.** Treat the 1719 books as not showing those who left. A participant states this and points to a transcribed 1719 book [S11]. It fits the 1719 census's place as the first poll-tax census. The 1744 Shadrinsk revision, which had 1719 to count against, has a separate dead-and-departed section for each village. [S1] A family missing from a 1719 village has therefore not been shown to have left.\n- **Record missing leaves and settlements.** The posted description of the 1744 Shadrinsk book identifies missing ends and town leaves 1–33, and gives no Techenskaya sloboda or entry for one village known in 1719 [S1]. A separate report describes the Chumlyak book for 1719 as missing [S11]. Distinguish a missing part of a book from a whole volume you have yet to locate.\n- **The book is a copy limited to part of the territory,** such as the GAPO copy covering estates only. [S4]\n- **The book may be misfiled** under another territory's inventory. [S9]\n- **The household was hidden or recorded under another household or name.** [S14], [S20]","sources":["S11","S1","S4","S9","S14","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-acd0035e551d","kind":"method","anchor":"- **Search a father’s worldly and baptismal names separately.** One person could use both [S29]. A 1624 Venev cadastre names Завьялко, while a 1646 census gives two householders the form «Игнатов сын Завьялов» [S28]. The blogger attributes Игнатий as the father’s baptismal name to unidentified later records. Test the father’s worldly name as the sons’ surname and the baptismal name as the source of their patronymic.","sources":["S29","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-85df04833872","kind":"portal-availability","anchor":"**1710 books online, and what they record.** The census1710.narod.ru site indexes 1710 census books and summaries for eight guberniyas (Azov, Archangel, Kazan, Kiev, Moscow, St Petersburg, Smolensk and Siberia); cite the archive's locator for a book, not the index page. [S32 @2026-11-15] A household entry in a full 1710 book names men and women with their ages and kinship, and sometimes the place and year the household came from [S34 @2026-11-15]; the Siberian books also say who died in which year (step 7). Some regions counted only part of the population: M. Klochkov's study of 1911 gives Kungur's figures for males and females and a Kiev table of people «обоих полов с летами» (of both sexes, with ages), but a Moscow count of males aged 10 to 60 only. [S33 @2026-11-15] So take a book's coverage from its heading before you read a missing woman or age as a gap.","sources":["S32","S33","S34"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bbffb34bb61e","kind":"method","anchor":"- **Check whom the 17th-century book names.** Taxed-household lists could concentrate on males [S30]. A published 1678 example uses male diminutives such as Якушко and Ивашка [S31], but extracts from the 1646 Yarensk census name widows as householders with their sons [S12]. Read the heading and household roles before interpreting a missing wife or daughter. Search diminutives alongside full given names.","sources":["S30","S31","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
