claims:
  - {"id":"C-96c354fb8394","kind":"portal-availability","anchor":"Start with [Translocalis](https://digi.kansalliskirjasto.fi/collections?id=742) for reader letters in digitized Finnish-language press from 1775 through 1885. If the locality is missing from keyword suggestions, look it up in the old newspaper article directory under towns, regions or parishes. Open an entry and look for its Translocalis clipping to recover the full locality keyword. Compare the directory's dated references and recurring signatures with the clipping results. [S1 @2026-11-22] [S2 @2026-11-22] [S7 @2026-11-22]","sources":["S1","S2","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-01d712bbd487","kind":"example","anchor":"In Kyläkoski's 2023 Rautalampi search, typing the place directly after the keyword prefix missed entries tagged `translocalis_101:1860: Rautalampi` or `translocalis_102:1885: Rautalampi`. Test the complete tag, including the intervening year and space, in your own session and check both locality tags when the clipping lists them. [S3]","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-701b08ae3242","kind":"method","anchor":"A Translocalis miss leaves the newspaper run to be searched. Open the full page and scan the neighboring items. If one part of a letter is clipped, trace the other installments by title, date and issue number in the directly browsed run. Search other titles if a printed notice points to a reprint. Check the full text for genre and keep the collection label and published heading separate. The heading *Lähetetty* alone is insufficient to classify a local letter. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a0491be0b6bc","kind":"method","anchor":"Copy the printed signature and any identified-author metadata into separate fields. Follow a recurrent signature across issues and compare names in the printed items with the clipping descriptions. Use occupation and place metadata as leads for testing a proposed attribution. [S1] [S4] Kyläkoski's 2023 search showed the identified writer under `translocalis_105:`. Inspect a clipping's tags in your own session before using that prefix to group writers. [S3]","sources":["S1","S4","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ee89dcdace87","kind":"portal-availability","anchor":"For a pen-named contribution, look up the signature or writer in Kallio's *Fennica-kirjallisuuden salanimiä ja nimimerkkejä vuoteen 1885*, starting from the National Library's catalogue entry. Carry the attributed signature into the clipping and newspaper text searches. [S1 @2026-11-22] [S5 @2026-11-22] [S6 @2026-11-22] [S8 @2026-11-22] [S9 @2026-11-22]","sources":["S1","S5","S6","S8","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d6e26820f876","kind":"method","anchor":"Read the work's full credit to distinguish a translator or adapter from the original author. Seek a named attribution in contributor memoirs or coverage of a court case when those leads are available. Keep the credit attached to the specific work or issue it identifies. [S5] [S9]","sources":["S5","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-686d1bdf47e4","kind":"method","anchor":"Verify a byline advertised for a forthcoming volume by opening its published issues. If a dated objection identifies competing use of a byline, record the objection as a claim and require issue-specific support before assigning later contributions. [S9]","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
