  - {"id":"C-000000000001","kind":"portal-availability","anchor":"Search Digitalarkivet’s refugee index by name and open the linked main-register card of the Norwegian Refugee Office. Copy the refugee number and the recorded arrival and reception information. If the name or card is missing, keep the refugee’s presence open and check the relevant register range. [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"custody","anchor":"Use the refugee number to find the interview reports in the Norwegian legation’s Stockholm archive. Check the recorded place and date of the interview independently of the reception card. [S2 @2026-11-22]","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"method","anchor":"Use the crossing date and interview locality to look for a Swedish personal refugee file, a source located in the published account [S1]. Read any file found for the border crossing, police interview and onward placement, and verify their dates against the Norwegian records.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
