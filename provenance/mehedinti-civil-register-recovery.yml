claims:
  - {"id":"C-01","kind":"portal-availability","anchor":"Open the Mehedinți inventory, find the commune heading and select the locality link for the event. For Crivina start under Burila Mare. If the map loads in your browser, use the county-filtered map to orient candidate localities, then return to the locality listing to get the register references. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"portal-availability","anchor":"Check both the historical and current locality labels. The inventory lists *Pătuele* and *Pătulele* with different year ranges but sends both to the same locality page. Read both rows and verify the linked entries for the target year and event. [S1 @2026-11-22], [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"portal-availability","anchor":"Treat an omitted year as a gap in listed coverage. In the locality’s external resources, identify the intended event series, inspect the title and date span of its eANR reference, and distinguish an original from a transcription. Include adoption or divorce only when the specific listing supports that event type. [S1 @2026-11-22], [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
