claims:
  - {"id":"C-93b8c1adfa14","kind":"method","anchor":"Compare the years in the online set with the archive's series guide. A search in New Garden, Chester County, jumped from 1838 to 1875 [S15]. Mark 1839–1874 uninspected in that set. The county archive's digital guide lists provincial taxes as early as 1715 and includes 1871–1900 under County Taxes, RG2040.003 [S60]. Check the township in those additional rolls before logging a miss. Even an inspected tax list covers only the people liable in that place and year [S9].","sources":["S15","S60","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5cf0693cc9be","kind":"unclassified","anchor":"A name index is also a finding aid, not an inspection. FamilySearch's \"Texas, County Tax Rolls, 1837–1910\" indexes only selected years: the first year before 1845, then 1845, 1855, 1865, 1875, 1885, 1890, 1895 and 1905. It covers 231 of 254 counties and is about 13% complete. A miss in an index like that is \"not inspected\" for the year and county concerned. It becomes \"inspected – no hit\" only after you have read the images. Treat a list you find through a county guide or an abstract card the same way: record it as a finding aid, not as the inspected list [S16].","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f2dbf7e34cc","kind":"method","anchor":"1. the list's preamble or column headings, which can state who and what was taxed and the age range [S1]\n2. the session statutes in force for that place and year, for taxable ages, taxable property, exemptions and form layout [S2], [S3]\n3. a published tax-law summary for that jurisdiction, used to identify the legislation for the list's year [S3]\n4. an archivist at the state archives [S6]","sources":["S1","S2","S3","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0dbb41a1688a","kind":"unclassified","anchor":"If the statute book gives no assessment rate, search contemporary newspapers for it [S2]. When columns or check marks have no headings, do not guess what they taxed. Find the governing law first [S3].","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b8919521e0c4","kind":"method","anchor":"Verify the poll-tax age for the jurisdiction, period and person's category [S6]. The State Library of North Carolina's table lists free men aged 21 and over in 1784, 21–50 in 1801 and 21–45 in 1817 [S61]. Section 8 of the Republic of Texas act of 12 June 1837 specified white males aged 21 to 55 [S62]. Cite the applicable rule, or mark the age range **not determined**.","sources":["S6","S61","S62"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f2f3691d21e3","kind":"unclassified","anchor":"Search the land series and the personal-property or poll series separately, and keep a separate register for each. A man without land can still appear on a personal-property list as a single taxable poll or because of a taxable item such as a horse or a watch [S5]. On Virginia lists, horses were taxed from 1782 and watches had their own columns in the 1850s.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-027ba5d328b8","kind":"unclassified","anchor":"On Virginia personal-property lists, enslaved people were taxed under the enslaver. The presenter describes them as listed by first name, in age groups that varied by county [S5]. The Library of Virginia's guide narrows this. Names appear only on the 1782–1786 lists, and later lists give counts. The age categories (above or below 16, with a 12–16 band in later years) were set by state statute and changed over time; they did not vary by county. Do not expect names on lists after 1786. Record the counts and age categories exactly as the list in hand gives them.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2b8e6f3accf","kind":"unclassified","anchor":"In Pennsylvania township lists, \"inmates\" are renters or lodgers on someone else's land who were taxed on personal property. They are not prisoners. Exact definitions vary by county and period [S4], so record which section of the list each entry is in. The same presenter says Pennsylvania taxed some personal property, such as cattle and horses, up to the 1840s. Livestock appears on county lists from the 1780s and 1790s. For later years, take livestock liability from the list's column headings or the assessment law for that year, not from the 1840s date [S4].","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12fe4d3ea2f8","kind":"method","anchor":"Use the volume's headings and a contemporary township/range map to find the sequence before browsing. Chester Ward's 1845 Genesee County, Michigan, entry was in section 2, township 8, range 7 [S2]. Check the next headings to establish which direction this particular roll runs. For a Pennsylvania list arranged by township, locate the family's land first [S16].","sources":["S2","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-83b8b2206caf","kind":"unclassified","anchor":"When a parish is known from church records but the tax archive uses unfamiliar administrative divisions, look for a parish/year contents index rather than guessing the tax district. ArkivDigital's 7 February 2024 demonstration used *Innehållsförteckningar till mantalslängder* to reach the parish's section of the original roll [S25]. This is a contents index, not a person index.","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-85329232c5b6","kind":"method","anchor":"1. Fix the parish and bounded years from the household research. In the demonstrated route, choose the tax-roll contents index under register search, enter the parish and year range, and inspect the returned roll references. Locate the corresponding finding aid in the current service; the demonstration does not guarantee today's menu or coverage.\n2. List every roll returned for the same parish and year. An ArkivDigital contents search yielded two rolls for a single year [S25]. Keep the archive, volume, stated year and parish-section locator for each until its images establish what it covers.\n3. Follow the image link to the original roll and verify its parish heading and year. Then locate the recorded farm or residence within that section. The contents hit establishes a browsing entry point; it does not establish that the household is present.\n4. Check the first page for the original column key before interpreting ticks or counts [S25]. Record the heading and its locator with that year's entries. Where a label stays unreadable, leave the column unresolved.\n5. Repeat for the next inspected year, retaining the same farm/residence clue alongside the names, household categories and counts actually recorded. Recheck headings and liability rules rather than carrying a column meaning or age threshold across years automatically.\n6. Apply the interval and competing-explanation checks below. The presenter describes annual farm tracking and warns that a child's appearance can reflect the applicable taxable age, while an adult's disappearance can reflect exemption from tax [S25]. Neither change dates a birth or death. A missing or uninspected roll remains a gap in the chain.","sources":["S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e62f1ab62c13","kind":"unclassified","anchor":"- the literal name form and any Jr./Sr. designation, as written; it describes the entry and is not a parent–child link [S14]\n- the capacity, exactly as written: *agent for*, *guardian for heirs of*, *administrator of*, *estate of*, *widow* [S12], [S7], [S11]\n- the parcel details: acreage, section/range or location, valuation, and any named original grantee or owner [S12], [S14]\n- any paid or delinquent mark, plus the list section (land, personal, inmates, poll)\n- the image or volume locator","sources":["S14","S12","S7","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b527964b99cd","kind":"method","anchor":"Trace changes in capacity on the same tract back from the last identified taxpayer. In Rusk County, Texas, the 400-acre tract links entries under different names [S12]. Read the following observations in date order and keep years without an inspected roll open.","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-840d4140f8b4","kind":"unclassified","anchor":"Link the years through the repeated tract description, because the name and capacity change from year to year. Then trace an unusual acreage in deeds, where a nominal sale price is a lead and not proof of kinship [S14].","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-983ac12f1fce","kind":"unclassified","anchor":"Moving away, death and ageing out of liability are competing explanations for someone dropping off a run of lists [S17], [S7], [S11], [S23]. Not appearing does not show that the person had left the area or was avoiding the tax. He may simply have met an exemption [S1], [S6], [S9].","sources":["S17","S7","S11","S23","S1","S6","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5f4b57eb3a67","kind":"unclassified","anchor":"- If the family stays on the roll on the same land, favour death in place over removal [S13]. A later *widow* entry [S11], an *estate of* entry [S7], or the tract passing to an administrator or heir, as in the Rusk County sequence, strengthens that reading.\n- Probate, court, jury and deed activity: buying or selling land after the gap rules out death in the gap [S7].\n- Census presence [S13].\n- The next jurisdiction, for a candidate move [S20], [S19].","sources":["S13","S11","S7","S20","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-70eef64e657f","kind":"method","anchor":"Bound a change by the last inspected roll on one side and the first inspected roll on the other [S18], [S20]. Two consecutive inspected annual rolls give an interval of about a year. Missing or uninspected years widen it. A Rhode Island-to-New York move was reportedly narrowed using monthly town lists [S20]. Use a month-level interval only if your series register identifies the two inspected monthly rolls and their actual dates.","sources":["S18","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6cd8e9351c65","kind":"unclassified","anchor":"A son's first entry as a separate taxpayer is a bounded clue to his coming of age or to a separate household [S18]. It is not an exact birthday. If you estimate a birth year from a liability age, give a range and cite the specific rule you used [S8]. Without a documented age band, give no estimate. Same-surname men taxed next to an older householder are only candidate sons. Send them, and every identity question, to [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S18","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5b163f808154","kind":"method","anchor":"To test whether a Virginia county taxed males aged 16–21 after 1783, do not stop at the state statutes: read that county court's order books, where county levies can appear [S26], [S32]. Section IX of the May 1783 act left county courts free to list free male tithables of those ages and tax them for county or parish levies, but it does not require a specific order, and clerks varied [S26], [S33]. An order found shows the county levied the tax; no order found leaves the county's practice undetermined [S26], [S33].","sources":["S26","S32","S33"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d7d31363499f","kind":"historical","anchor":"For Virginia colonial tithables, do not assume a minimum age of 21 or a white-male-only rule: the March 1642/3 law set 16 for youths and also named Black women at 16, and 16 continued for white males through the October 1748 act [S26], [S27], [S28]. A state poll tax at 21 was levied by October 1777 and the November 1781 act taxed free males above 21, but the Library of Virginia says counties could still choose to tax everyone over 16 in 1782–1787 [S29], [S30], [S31].","sources":["S26","S27","S28","S29","S30","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-27fb1f5256a9","kind":"historical","anchor":"In seventeenth- and eighteenth-century Virginia records, read \"tithable\" as a person who paid one of the taxes imposed by the General Assembly, or for whom someone else paid it, and do not assume each tithable paid personally; enslavers, for example, paid the taxes levied on their enslaved workers and servants [S26], [S34], [S35]. The tax was laid by law, so do not read a tithable as a voluntary church tithe-payer [S34].","sources":["S26","S34","S35"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a0233e83e75","kind":"historical","anchor":"On Virginia personal-property lists from the May 1783 act (in force 1 July 1783) to the 1793 change, do not read a first listing as age 21 without checking that county's practice, because county courts could still list free male tithables aged 16–21 for county or parish levies [S26], [S33]. The Library of Virginia gives 21 as the taxable age for 1782–1787, with counties able to tax everyone over 16, and 16 as the taxable age statewide from 1793, so from that year test a first listing against 16, with no county-by-county inquiry [S31].","sources":["S26","S33","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3af8b4626038","kind":"historical","anchor":"Do not read homestead land as permanently exempt, as one community post implies [S43]. Land entered under the federal land laws could not be taxed by the state or county until the entrant had a perfect equity, at final proof and payment, or until the patent issued, so a homestead or other unpatented entry can be missing from the county land roll for years after settlement [S42]. In *Duncan v. Newcomer* (1896), the South Dakota Supreme Court held a homestead untaxable until the settler's final proof, and cited the rule that land became taxable after entry, payment and final certificate, before the patent [S42]. Check the land-office entry, final-proof and patent dates before you read a settler's absence from the land roll.","sources":["S43","S42"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-627b365c2657","kind":"portal-availability","anchor":"Search the federal internal revenue assessment lists as a series of their own. The National Archives' filmed lists (Record Group 58) are mostly for 1862–1866; only Arizona, Arkansas, Colorado, Idaho, Montana, New Mexico, Oregon and Wyoming have later years, up to 1874 or beyond [S36 @2026-11-14]. Ancestry titles its collection \"U.S. IRS Tax Assessment Lists, 1862-1918\", so do not take the title as its coverage; the National Archives names Ancestry, by subscription or free at its own facilities, and FamilySearch, free, as hosts of the filmed lists [S36 @2026-11-14], [S37 @2026-11-14], [S38 @2026-11-14]. The lists are arranged by state, collection district and division, and a division generally corresponds to a county, so find where the person lived first [S37 @2026-11-14]. Lists from 1867 on are at the National Archives facility that holds the state's federal records; some states, such as Ohio, Wisconsin and Massachusetts, were never filmed, and their 1862–1866 lists are at the National Archives at Kansas City [S37 @2026-11-14]. Mark a year or place outside the filmed coverage \"not inspected\", not \"inspected – no hit\".","sources":["S36","S37","S38"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a4e486821c7a","kind":"method","anchor":"A land-tax entry in a person's own name shows that the person had a taxable interest in land there; it does not show that they lived there [S41]. An entry that names someone as agent, guardian or administrator records that capacity for another's land, not that person's own interest: record the capacity and keep the representative apart from the assessed owner, as in the McClure entries in section 5. Many rolls listed non-residents' land separately: Texas county rolls often carry a heading for property in the county owned by non-residents, and Mississippi kept non-resident land tax lists from 1844 to 1895 [S39], [S40]. Record which section an entry is in. For an owner who may not have lived there, test the alternatives Genealogy Tip of the Day names, land speculation, a former residence, inherited land and military bounty land, before you place them in the county [S41].","sources":["S41","S39","S40"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-511409634a44","kind":"method","anchor":"Treat an alphabetical list as a probable recopy. Some tax lists were rewritten in alphabetical order, which loses the original order [S38], and Genealogy Tip of the Day warns that copying a list into alphabetical order could introduce transcription errors [S44]. Look for the earlier list in its original order, or a duplicate, and check doubtful entries against it.","sources":["S38","S44"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d469a1acf04c","kind":"method","anchor":"Where a list names a head of household and counts the taxables under him, track the count as well as the names. On Virginia and North Carolina tithable lists, the person responsible for a family's tax was listed with the names or the number of the taxable persons for whom he paid, sons over 16 among them, while a free male of 21 or over was responsible for his own tax and should be listed separately [S45]. A rise in the head's count is therefore a second bounded clue that a son may have reached the lower taxable age, before his own entry appears [S43], [S45]. Record both changes as intervals against the age band documented for that place and year.","sources":["S45","S43"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-18c4f92b5dd8","kind":"method","anchor":"To find candidate fathers for a man whose parents are unknown, list every taxpayer with his surname or a variant in the place where he came of age, over a run of years around his first appearance [S38]. On Kentucky lists, a son who had turned 21 was usually listed with his father [S46]. Treat each older same-surname man only as a candidate, and test him in other records.","sources":["S38","S46"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6ea2e8ac8f88","kind":"portal-availability","anchor":"Use MyHeritage's *England and Wales, Hearth Tax, 1662–1674* index for household-head names and residence dates and places [S47 @2026-11-18], [S49 @2026-11-18]. Check the collection's county list before searching. Pembrokeshire is the only Welsh county listed [S49 @2026-11-18].","sources":["S47","S49"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07d19322bc83","kind":"portal-availability","anchor":"Use MyHeritage's Chester County septennial census index for name and residence leads from 1793 to 1863 [S50 @2026-11-18], [S52 @2026-11-18]. Consult the Chester County Archives' missing-township list for the target township and enumeration year before interpreting an index miss [S51 @2026-11-18], [S58 @2026-11-18].","sources":["S50","S52","S51","S58"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3e368674ff9a","kind":"method","anchor":"For a household missing from a hearth-tax payment list, test whether it was exempt [S47]. Look for a non-chargeable entry or an exemption certificate for the place and term. Check the grounds in force, including whether the householder was excused from church and poor rates because of limited means or met the applicable rent and property limits [S48].","sources":["S47","S48"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9d248294895e","kind":"historical","anchor":"For a free Black woman on a colonial Virginia tithables list, check the law in force before assigning liability. The Just Genealogy presenter reports that free women of color could be liable in Virginia [S53]. The September 1668 act confirmed that Black women who had been freed remained liable [S56].","sources":["S53","S56"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-8550f57829dc","kind":"method","anchor":"Read a Pennsylvania septennial census as a seven-year enumeration of taxable inhabitants first authorized in 1779 [S50], [S51]. Look for the person's name, township and occupation in the return [S51], [S59]. Treat an absence as a residence clue only after verifying that the inclusion rule for that enumeration covered the person [S51].","sources":["S50","S51","S59"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dc4fd75c9ad4","kind":"historical","anchor":"Read *chimney money* in England and Wales as the hearth tax introduced in 1662 and assessed per hearth or stove [S47], [S48]. Its two equal installments fell due at Lady Day (25 March) and Michaelmas (29 September) [S47], [S48]. Record the stated collection term as well as the year and keep the two terms separate in the series register.","sources":["S47","S48"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-94aad61e513b","kind":"method","anchor":"Transcribe *LF* before expanding the abbreviation. In the 1813 Charlotte County, Virginia, transcription, Peggy Bird's entry includes an explicit gloss of *Lf* as *levy free* [S54]. Where an exemption could be granted individually, check the county order book [S53]. The St. Peter's Parish vestry recorded Peter Maye presenting a court order for levy-free status [S55]. Cite the minute as evidence he produced it, and look for the order itself to establish its date and scope.","sources":["S54","S53","S55"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ae5238735bc1","kind":"method","anchor":"If a Virginia tithables list names an overseer, record that capacity alongside the enslaved people listed and the person charged with the levy. The Just Genealogy presenter reports that an overseer could be involved in the levy [S53]. Under Virginia's October 1748 act, an overseer could file the list for an absent or nonresident owner, who still owed the levy on tithables the overseer failed to list [S57].","sources":["S53","S57"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c05edead1856","kind":"method","anchor":"- In 1850–1852 James McClure was taxed on 400 acres. The 1850 entry names James as original owner, while 1851–1852 name James M. Johnson [S12].\n- In 1853 Susan McClure appears with matching property. In 1854 S. W. McClure, administrator of “J.” McClure, appears below F. M. McClure [S12].\n- In 1855 F. M. McClure is guardian for the heirs of McClure. The 1859 roll identifies Francis M. McClure as an agent and the 1860 entry names F. M. McClure [S12]. Check probate and deeds before equating the taxpayers, the decedent or their relationships.","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5ffefc082b1f","kind":"platform-ui","anchor":"Search MyHeritage's *Hungary, Property Tax Census, 1828 From JewishGen* by given name, surname and place [S64 @2026-11-20]. Search with the 1828 Hungarian place names and record both town and county from the hit [S63 @2026-11-20], [S64 @2026-11-20].","sources":["S64","S63"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-aba5321ed5f6","kind":"method","anchor":"Leave residence unresolved after a miss in this index. JewishGen extracted entries identified as Jewish or judged likely to be Jewish from a census limited to people with taxable property [S65]. Use the town and county to locate the original return. For a JewishGen hit, use its microfilm and entry numbers to find the census line [S65].","sources":["S65"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-72c31688c318","kind":"historical","anchor":"For a place now in Highland County, Virginia, identify which county covered it before Highland was formed in 1847, then search the personal-property tax lists for Pendleton (now in West Virginia) or Bath accordingly [S69].","sources":["S69"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c0391e61f4f7","kind":"portal-availability","anchor":"For Highland County's 1847–1850 personal-property tax lists, open FamilySearch Catalog entry 776302 (film 2024589, DGS 8707155) [S67 @2026-11-20]. Check **Film/Digital Notes** in the user's signed-in account and use the camera if it opens the images [S66 @2026-11-20], [S67 @2026-11-20]. If the images are unavailable, use Library of Virginia reel 177 for those years [S68 @2026-11-20].","sources":["S67","S66","S68"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9451973bb648","kind":"custody","anchor":"Treat 1850 as the end of that catalog entry and continue with the Library of Virginia's Highland County microfilm, starting with reel 574 for 1851–1854 [S67 @2026-11-20], [S68 @2026-11-20].","sources":["S67","S68"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2059cd414180","kind":"portal-availability","anchor":"If MyHeritage's *Pennsylvania, Chester County Tax Registrations, 1715–1890* opens in the user's account, use it for the name, year, place and property size when indexed [S70 @2026-11-21]. Check the township and year against the county's tax series. Use the Chester County Archives' 18th-century tax indexes and 19th-century assessment guide as alternate routes [S71 @2026-11-21], [S72 @2026-11-21]. Keep this search separate from the septennial census and leave gaps open until the underlying rolls are inspected.","sources":["S70","S71","S72"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3be74e4d8e68","kind":"portal-availability","anchor":"For a deceased person in Finland, search the matching MyHeritage *Finland, Population Tax Lists* collection for 1890 [S78 @2026-11-21], 1900 [S79 @2026-11-21] or 1910 [S80 @2026-11-21]. Record the name, birth year, household relationships and residence when given [S77 @2026-11-21], [S78 @2026-11-21], [S79 @2026-11-21], [S80 @2026-11-21]. For intervening years or a missed index entry, look up the *henkikirjat* by province and year in the National Archives of Finland's Astia catalogue [S81 @2026-11-21]. Leave the interval open until the relevant annual rolls have been inspected.","sources":["S78","S79","S80","S77","S81"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b683b1ff4ace","kind":"method","anchor":"Use volume 3 of *The 1787 Census of Virginia* as the index to the compiled personal-property tax lists [S82], [S83]. For a search in one county, look for its separately published edition, including under the county's historical Virginia name if it is now in West Virginia [S82], [S84]. Cite the underlying personal-property tax list and its actual year. Read the county edition's introduction and headings before assigning a year. The Monongalia County edition contains lists for 1786 and 1788 alongside a partial 1787 list [S84]. Keep each list in its own year in the series register.","sources":["S82","S83","S84"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1b5d6aca743e","kind":"custody","anchor":"For Loudoun County, check the separately published editions for 1787, 1788 and 1789 [S82 @2026-11-21], [S85 @2026-11-21], [S98 @2026-11-21]. For the original rolls for all three years, use Library of Virginia reel 208 (1787–1797) [S86 @2026-11-21].","sources":["S82","S85","S98","S86"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5e6d6ec8e66c","kind":"method","anchor":"Use the list heading, levy year and payment terms to identify the act. For a Virginia payment dated 1782, check whether it belongs with the November 1781 commodity levy, a land assessment or a personal-property assessment [S88], [S94], [S96], [S97]. The personal-property tax could also be paid with receipts for specified commodities, including tobacco, hemp or flour. The land tax had its own payment terms [S96]. Keep each payment with the assessment named in the record.","sources":["S88","S94","S96","S97"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-30840982dffd","kind":"historical","anchor":"Under the May 1779 act, check liability for men over 16 and enslaved women over 16. Look for a county court discharge from the levy or a tax commissioner's finding of incapacity for work due to age or infirmity [S88], [S89]. Read the payment alternatives per taxable person as 1 bushel of wheat, 2 bushels of Indian corn, rye or barley, 10 pecks of oats, 15 pounds of hemp, or transfer notes for 28 pounds of inspected tobacco. Check the deficiency account for shortfalls charged in money [S89].","sources":["S88","S89"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8f621793fca8","kind":"historical","anchor":"Separate the original schedule, March 1780 and the four succeeding years, from the date of a receipt [S89]. Keep the 1779 tax in scope after 31 December 1780. The October 1780 act expressly spared the specific taxes from the discontinuance [S88], [S90].","sources":["S89","S88","S90"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-082ad6e0c977","kind":"historical","anchor":"For a late payment under the May 1779 act, check the extensions for delinquents to 1 October 1780 and then 1 March 1781 [S88], [S91], [S92]. In counties with grain still uncollected, check the further extension to 1 August 1781. The May 1781 act treated militia service as a cause of delayed collection [S87], [S93]. For a taxpayer away on military service, check the applicable act for an extension or exemption before treating the absence as a change in liability [S87], [S93].","sources":["S88","S91","S92","S87","S93"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-54fb4851db45","kind":"historical","anchor":"For the November 1781 levy, check the grain charge on free men over 21 and enslaved people over 16, with county court exemptions for age or infirmity. Check the bacon clause separately for free persons over 21 and enslaved people over 16 [S88], [S94]. The act calls for 2 pounds of bacon plus one of the listed grain options. Use ½ bushel of wheat, 1 bushel of Indian corn, rye or barley, or 5 pecks of oats. The optional coin rates were 3 shillings per bushel of wheat and 6 pence per pound of bacon [S94].","sources":["S88","S94"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-39a78f0dc7be","kind":"historical","anchor":"Distinguish the November 1781 act's collection and reporting dates. Commissioners were to list deficiencies on 1 May 1782 and report to the executive by 1 June. May 1782 legislation then allowed payment in commodities before 1 September [S88], [S94], [S95]. Apply the separate extension to 1 April 1782 to sheriffs' and collectors' accounts for taxes already due for 1781 [S94]. Keep the levy and the payment or return date in separate fields.","sources":["S88","S94","S95"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1e8736e07166","kind":"method","anchor":"For Chester County, compare the index's *Property holder type* with the original roll. Under the county archive's 18th-century categories, *Landholder* includes people holding land by lease or deed, *Inmate* denotes a landless contract laborer who was married or widowed, and *Nonresident Landowner* points to unoccupied land [S70], [S71]. Check for a lease before inferring deed ownership, and keep the parcel's location separate from the owner's residence. An early inmate can be listed among landholders, so check the roll's grouping before assigning a status [S71].","sources":["S70","S71"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ad4308f4237b","kind":"method","anchor":"For a Chester County entry labelled *Freeman*, check the year and heading before inferring age or marital status. The county guide defines the 18th-century category, from 1718, as single free men at least 21 who had been out of servitude or apprenticeship for at least six months [S70], [S71]. Check the roll for the category before interpreting a miss. Assessment of freemen was uneven, and later 19th-century rolls replaced *Freeman* and *Inmate* with broader divisions [S71], [S72].","sources":["S70","S71","S72"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6e0050ed94fc","kind":"portal-availability","anchor":"Use MyHeritage's *Sweden, Stockholm Census Registers, 1800–1884* for a name and residence lead [S70 @2026-11-21], [S73 @2026-11-21]. For a man in 1909, use *Sweden, Stockholm Census Register of Males, 1909* and record the birth date when given along with the residence [S70 @2026-11-21], [S74 @2026-11-21]. For a female target in 1909, go directly to the annual roll. Find the property in the *mantalslängd*, series G 1 BA, through the Stockholm City Archives' guide to Riksarkivet's *Mantals- och kronotaxeringslängder Stockholm stad* search [S76 @2026-11-21].","sources":["S70","S73","S74","S76"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c2ff01954610","kind":"historical","anchor":"Keep the year on the household declaration (*mantalsuppgift*) separate from the year of the roll. Household heads submitted declarations to the tax authority, and Stockholm's Governor's Office used them to compile the following year's roll [S70], [S75]. Read the property entry for the household members actually listed, including people other than the declarant [S76]. Keep a person-index miss open until the roll and its inclusion rules have been checked.","sources":["S70","S75","S76"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-00575c9baa08","kind":"method","anchor":"Before treating a county hit in *The 1787 Census of Virginia* as the only candidate, use volume 3 to collect same-name entries across the compilation [S83], [S87]. Compare their county, actual roll year and entry fields. Limit any uniqueness conclusion to the lists the compilation covers.","sources":["S83","S87"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finland-1870-1880","kind":"portal-availability","anchor":"For a deceased person in Finland, also check the user's MyHeritage account for *Finland, Population Tax Lists, 1870* and *Finland, Population Tax Lists, 1880* [S102 @2026-11-22], [S103 @2026-11-22]. Record the name, birth year, stated household relationships and residence when indexed. Check the image for any household charges. Use the annual Astia route above if the collection or image does not open.","sources":["S102","S103"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-boston-tax-index","kind":"portal-availability","anchor":"For a deceased person in Boston, use MyHeritage's *Massachusetts, Suffolk, Boston Tax Registrations, 1822–1918* for a name, year and place lead [S104 @2026-11-22], [S105 @2026-11-22]. Use the matching FamilySearch collection to inspect the Boston City Archives tax books, transfers or assessors' lists [S106 @2026-11-22]. Record the source book and year before using the residence lead.","sources":["S104","S105","S106"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bohemian-berni-rula","kind":"custody","anchor":"For 1654 Bohemia, search the *berní rula* by historical region. The Czech National Archives identifies the survey as *Popis Čech 1654* and lists regional editions [S99 @2026-11-22], [S101 @2026-11-22]. Use fonds 0053 to check the records for the target locality and year. The fonds' dates extend beyond the 1654 survey, so check what each volume covers [S100 @2026-11-22].","sources":["S99","S101","S100"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bielsk-poll-tax-locator","kind":"custody","anchor":"For the Bielsk Land poll tax, find *Księgi grodzkie brańskie*, fonds 87, unit 52, in Warsaw's Central Archives of Historical Records. Browse folios 2–340 for 1692 and 341–434 for 1712 [S119 @2026-11-22]. For Klepacze, use Paczkowski's transcriptions to locate the village section in each year [S118 @2026-11-22].","sources":["S119","S118"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-hardy-vol-1","kind":"method","anchor":"For Hardy County, now in West Virginia, use Thomas Allen Lahman III's *Personal Property Tax Lists, 1786–1795, Quick Reference List*, volume 1 [S111], [S112]. Search given names and surnames separately. Log the year and list for each candidate, then scan that list before interpreting a miss.","sources":["S111","S112"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-loudoun-land-index-volumes","kind":"custody","anchor":"For Loudoun County land tax, use Patricia Duncan's 1782–1802 and 1803–1817 indexes to locate candidate entries [S113 @2026-11-22], [S114 @2026-11-22], [S115 @2026-11-22], [S116 @2026-11-22]. Check the underlying land lists on Library of Virginia reels 169 (1782–1799), 170 (1800–1815) and 171 (1816–1823) [S117 @2026-11-22]. Keep personal property and tithables in their own series.","sources":["S113","S114","S115","S116","S117"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-essex-land-index-volumes","kind":"method","anchor":"For Essex County land tax, start with Wesley E. Pippenger's 1782–1814 volume. For 1783–1786, check the prior list and carry forward entries the alterations leave in place [S107], [S108]. For 1814–1850 use his continuation, which groups annual abstracts under each owner or taxpayer. Check its separate town-lot appendix for Tappahannock and Laytons, 1782–1850 [S107], [S109]. Verify wording and layout in the underlying list.","sources":["S107","S108","S109"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-essex-1827-gap","kind":"historical","anchor":"Leave an Essex County land-tax miss unresolved where it depends on the damaged part of an 1827 list [S107], [S109]. Record which part you could inspect.","sources":["S107","S109"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-essex-1844-page-gap","kind":"custody","anchor":"Use Library of Virginia reels 89 (1782–1805), 90 (1806–1828) and 91 (1829–1850) to find the Essex land lists [S110 @2026-11-22]. For the 1844 list, check page 16 in the original at the Library of Virginia. The publisher records that the page is missing from the film and the compiler used the original [S107 @2026-11-22], [S109 @2026-11-22].","sources":["S110","S107","S109"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-ledger-index","kind":"portal-availability","anchor":"For a deceased Helsinki taxpayer, open *Rahatoimisto kunnallisverojen kantokirjat* (1875–1915) through Helsinki City Archives' digitized holdings guide. Browse pre-1886 volumes by place. From 1886 use the alphabetical *kunnallisverojen rekisteri*. Follow district and page references in 1886–1890 or the taxpayer number in 1891–1915. Record the full ledger locator and address as written [S120 @2026-11-22], [S121 @2026-11-22], [S125 @2026-11-22].","sources":["S120","S121","S125"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-addresses","kind":"method","anchor":"In the geographically arranged Helsinki books, check each known address where the person held property or did business. Keep separate hits until the entries show whether they refer to the same assessment, and verify the home address separately [S120], [S122].","sources":["S120","S122"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-newspapers","kind":"method","anchor":"Use the issue-by-year leads in the Helsinki newspaper survey [S123]. Record the assessment year separately from the issue date. Read the published minimum in tax units or assessed income before logging a miss, and try another newspaper covering the same Helsinki assessment year with a lower minimum. A keyword miss leaves publication coverage open [S123].","sources":["S123"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-notice","kind":"historical","anchor":"If the Helsinki newspaper search misses the list, search for the assessment-inspection announcement. Section 56 of the municipal decree called for the list to be available for 14 days and an announcement in the local newspaper where there was one. Use the announcement to date and locate the list, then look for the roll itself [S120], [S122].","sources":["S120","S122"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finland-household-roles","kind":"method","anchor":"In an 1880 Finnish population tax list, record each relative, farmhand or domestic worker under the role the image actually gives. Leave the relationship open if a person appears in the group without a relationship label [S102].","sources":["S102"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bielsk-household-counts","kind":"example","anchor":"For Klepacze in 1692, verify the figures against the original list and record them as poll counts where the entries support that reading. Look to other records for women's given names where the tax list supplies only counts. In 1712, record stated wives, daughters and sisters even if unnamed, distinguish a farmhand from a relative, and read separately numbered entries for co-residence wording [S118].","sources":["S118"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-helsinki-assessed-income","kind":"historical","anchor":"For a Helsinki municipal total, use the collection book to separate income from city or district property, local trade or business, and wages, pension or other income assessed on the basis of a home in the municipality. Record assessed income separately from verified earnings and check the payment and arrears columns separately [S120], [S122], [S123].","sources":["S120","S122","S123"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-local-unit","kind":"historical","anchor":"Before converting *veroäyri* to assessed income under the 1883 municipal amendment, find the rate in force for the assessment year in the general municipal meeting's decisions. Multiply the units by that locally fixed mark value and label the result as an assessment equivalent. Section 54 allowed 200–400 marks per unit, so leave the exact conversion open if the year's local rate is unverified [S122], [S123].","sources":["S122","S123"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-tax-v-residence","kind":"method","anchor":"For a gap in Helsinki municipal tax, compare the assessment period and the population covered with the corresponding *henkikirja* before inferring a move or nonpayment. Check whether the taxpayer had a property or business basis for the assessment and verify where the person was registered [S122], [S123].","sources":["S122","S123"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-statistical-denominator","kind":"historical","anchor":"To test the reach of the Helsinki municipal assessment series, compare the assessed headcount with the city population in table 221, page 276, of the 1905 statistical yearbook (1885–1905). Use the result to scope the list, then check the individual against the liability rule [S123], [S124].","sources":["S123","S124"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-specific-tax-roster","kind":"custody","anchor":"For a Virginia Specific Tax search by county, start with the Auditor of Public Accounts papers, *Provision Law and Specific Tax*, APA 640, and use the county inventory to choose the return [S126 @2026-11-22], [S127 @2026-11-22]. Record the county, levy year, commissioner, named payer and each item and quantity credited. Keep delinquents and other returns separate. Use the roster only for the people and liabilities covered by that return.","sources":["S126","S127"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-specific-tax-transcriptions","kind":"historical","anchor":"Check the *Magazine of Virginia Genealogy* for a transcription by county. For Chesterfield's 1782 Specific Tax, look for Minor T. Weisiger's transcription of Matthew Branch's list in volume 48, issue 2 (2010), pages 89–93. Use its underlying return and levy heading when citing a payment [S126], [S127].","sources":["S126","S127"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-specific-tax-dar","kind":"method","anchor":"For a DAR patriotic-service question, verify that the entry records payment of a qualifying supply tax. Check the act and the return's headings, and distinguish a payment from a name on an assessment, deficiency or delinquent list. DAR recognizes supply-tax payments as patriotic service [S126 @2026-11-22], [S127 @2026-11-22], [S128 @2026-11-22].","sources":["S126","S127","S128"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finland-say-find-holding","kind":"platform-ui","anchor":"To trace a Finnish holding, search Astia for *asutuksen yleisluettelo* and the historical parish. Choose the *Suomen asutuksen yleisluettelo* (SAY) unit whose dates cover the target year. Use its village index to locate the page before browsing to the holding [S129 @2026-11-23], [S130 @2026-11-23].","sources":["S129","S130"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finland-say-child-units","kind":"example","anchor":"If Astia marks a parent entry as undigitized or shows child links with the same place name, open the child entries in the user's Astia view. Confirm the full date range on each destination page and check for images there [S129], [S131]. An April 2025 account describes finding image links in the 1634–1653 and 1654–1673 child entries below the undigitized notice at *266 Kokemäki (1634–1673)* [S129], [S131].","sources":["S129","S131"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-helsinki-henkikirja-property","kind":"method","anchor":"For a nineteenth-century Helsinki property known by a field or villa name, check each recorded name in a contemporary address directory. Browse the corresponding *henkikirja* by the district, block and lot used at the time. For a site outside the city plan of that year, check the villas, islands and other places section near the end of the roll. When an entry groups several villas, record the owners against the group until another record ties an owner to a particular building [S133], [S134], [S135].","sources":["S133","S134","S135"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finland-say-headship","kind":"method","anchor":"If the SAY shows a change of head, record separate runs of headship by year and follow the same holding into the next volume to check whether the former head returns [S132]. Read the year in the column heading. Use the ink colour as a lead to the source series and consult the volume's colour key where available. Verify each change in the underlying annual return and mark uninspected years in the series register [S130].","sources":["S132","S130"],"checked":null,"stated_as":"fact","review":"reviewed"}
