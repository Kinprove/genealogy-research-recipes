claims:
  - {"id":"C-93b8c1adfa14","kind":"unclassified","anchor":"First find out which years survive, and separately which years are in the set you are actually viewing. In the teaching example, the presenter's online Chester County set has an 1838 list and then nothing until 1875 [S15]. That gap leaves 36 years (1839–1874) with no list in that set. It does not give you 36 observed absences. The Chester County Archives reports holding tax records from 1715 onward, so treat the gap as a limit of the set viewed, not as loss: mark 1839–1874 \"not inspected\" and check the Archives' holdings for those years. Treat absence as informative only where you have evidence that the locality's lists were comprehensive for the person's category, and record where that evidence comes from [S15]. A tax list covers only part of the community, mostly men. It leaves out groups such as exempted men, so it is not a full census substitute [S9].","sources":["S15","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5cf0693cc9be","kind":"unclassified","anchor":"A name index is also a finding aid, not an inspection. FamilySearch's \"Texas, County Tax Rolls, 1837–1910\" indexes only selected years: the first year before 1845, then 1845, 1855, 1865, 1875, 1885, 1890, 1895 and 1905. It covers 231 of 254 counties and is about 13% complete. A miss in an index like that is \"not inspected\" for the year and county concerned. It becomes \"inspected – no hit\" only after you have read the images. Treat a list you find through a county guide or an abstract card the same way: record it as a finding aid, not as the inspected list [S16].","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f2dbf7e34cc","kind":"unclassified","anchor":"1. the list's preamble or column headings, which can state who and what was taxed and the age range [S1]\n2. the session statutes in force for that place and year, for taxable ages, taxable property, exemptions and form layout [S2], [S3]\n3. a published summary of the period's tax laws; one presenter used a summary of Tennessee tax law [S3]\n4. an archivist at the state archives [S6]","sources":["S1","S2","S3","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0dbb41a1688a","kind":"unclassified","anchor":"If the statute book gives no assessment rate, search contemporary newspapers for it [S2]. When columns or check marks have no headings, do not guess what they taxed. Find the governing law first [S3].","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b8919521e0c4","kind":"unclassified","anchor":"Do not apply a poll-tax age from memory (21, 45, 50, 55). Each of these is tied to a particular state and period. In North Carolina, the State Library of North Carolina's guide gives poll-tax liability for freemen and male servants aged 21 and over by 1784, an exemption for men over 50 by 1801, and a limit lowered to 45 in 1817. Texas's first poll tax (1837) fell on white males aged 21 to 55. One presenter uses an over-55 exemption as an example [S6]. Cite the rule for your place and year, or mark the scope **not determined**.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f2f3691d21e3","kind":"unclassified","anchor":"Search the land series and the personal-property or poll series separately, and keep a separate register for each. A man without land can still appear on a personal-property list as a single taxable poll or because of a taxable item such as a horse or a watch [S5]. On Virginia lists, horses were taxed from 1782 and watches had their own columns in the 1850s.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-027ba5d328b8","kind":"unclassified","anchor":"On Virginia personal-property lists, enslaved people were taxed under the enslaver. The presenter describes them as listed by first name, in age groups that varied by county [S5]. The Library of Virginia's guide narrows this. Names appear only on the 1782–1786 lists, and later lists give counts. The age categories (above or below 16, with a 12–16 band in later years) were set by state statute and changed over time; they did not vary by county. Do not expect names on lists after 1786. Record the counts and age categories exactly as the list in hand gives them.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2b8e6f3accf","kind":"unclassified","anchor":"In Pennsylvania township lists, \"inmates\" are renters or lodgers on someone else's land who were taxed on personal property. They are not prisoners. Exact definitions vary by county and period [S4], so record which section of the list each entry is in. The same presenter says Pennsylvania taxed some personal property, such as cattle and horses, up to the 1840s. Livestock appears on county lists from the 1780s and 1790s. For later years, take livestock liability from the list's column headings or the assessment law for that year, not from the 1840s date [S4].","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12fe4d3ea2f8","kind":"unclassified","anchor":"Before paging through an unindexed volume, read its township or section headings and plot their order on a contemporary township/range map. One presenter, working in Ohio and Michigan volumes, found them arranged by township/range position rather than alphabetically, and the direction of travel was not consistent [S2]. Pennsylvania lists are organised by township, so use land records first to find the family's township [S16].","sources":["S2","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-83b8b2206caf","kind":"unclassified","anchor":"When a parish is known from church records but the tax archive uses unfamiliar administrative divisions, look for a parish/year contents index rather than guessing the tax district. ArkivDigital's 7 February 2024 demonstration used *Innehållsförteckningar till mantalslängder* to reach the parish's section of the original roll [S25]. This is a contents index, not a person index.","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-85329232c5b6","kind":"unclassified","anchor":"1. Fix the parish and bounded years from the household research. In the demonstrated route, choose the tax-roll contents index under register search, enter the parish and year range, and inspect the returned roll references. Locate the corresponding finding aid in the current service; the demonstration does not guarantee today's menu or coverage.\n2. Keep each returned volume separate. The example returned two rolls for one year [S25]; one result is not necessarily the whole annual set. Copy the archive, volume, stated year and parish-section locator supplied by each result into the series register.\n3. Follow the image link to the original roll and verify its parish heading and year. Then locate the recorded farm or residence within that section. The contents hit establishes a browsing entry point; it does not establish that the household is present.\n4. Read the volume's opening pages and original column headings before extracting counts or marks. In the demonstration, the presenter returns to the first page to explain the columns and stresses that their meanings vary by period [S25]. Keep the heading locator and literal labels with that year's entries; leave an unexplained column unresolved.\n5. Repeat for the next inspected year, retaining the same farm/residence clue alongside the names, household categories and counts actually recorded. Recheck headings and liability rules rather than carrying a column meaning or age threshold across years automatically.\n6. Apply the interval and competing-explanation checks below. The presenter describes annual farm tracking and warns that a child's appearance can reflect the applicable taxable age, while an adult's disappearance can reflect exemption from tax [S25]. Neither change dates a birth or death. A missing or uninspected roll remains a gap in the chain.","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e62f1ab62c13","kind":"unclassified","anchor":"- the literal name form and any Jr./Sr. designation, as written; it describes the entry and is not a parent–child link [S14]\n- the capacity, exactly as written: *agent for*, *guardian for heirs of*, *administrator of*, *estate of*, *widow* [S12], [S7], [S11]\n- the parcel details: acreage, section/range or location, valuation, and any named original grantee or owner [S12], [S14]\n- any paid or delinquent mark, plus the list section (land, personal, inmates, poll)\n- the image or volume locator","sources":["S14","S12","S7","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b527964b99cd","kind":"unclassified","anchor":"Capacity notations carry dating information. In the teaching example, the presenter worked backward one year at a time from the 1860 Rusk County, Texas roll [S12]. Put in chronological order, her reported sequence is:","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-840d4140f8b4","kind":"unclassified","anchor":"Link the years through the repeated tract description, because the name and capacity change from year to year. Then trace an unusual acreage in deeds, where a nominal sale price is a lead and not proof of kinship [S14].","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-983ac12f1fce","kind":"unclassified","anchor":"Moving away, death and ageing out of liability are competing explanations for someone dropping off a run of lists [S17], [S7], [S11], [S23]. Not appearing does not show that the person had left the area or was avoiding the tax. He may simply have met an exemption [S1], [S6], [S9].","sources":["S17","S7","S11","S23","S1","S6","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5f4b57eb3a67","kind":"unclassified","anchor":"- If the family stays on the roll on the same land, favour death in place over removal [S13]. A later *widow* entry [S11], an *estate of* entry [S7], or the tract passing to an administrator or heir, as in the Rusk County sequence, strengthens that reading.\n- Probate, court, jury and deed activity: buying or selling land after the gap rules out death in the gap [S7].\n- Census presence [S13].\n- The next jurisdiction, for a candidate move [S20], [S19].","sources":["S13","S11","S7","S20","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-70eef64e657f","kind":"unclassified","anchor":"The bound you report runs from the last inspected list on one side of the change to the first inspected list on the other. Annual lists give a one-year interval only when those two years are consecutive and both are inspected – hit or inspected – no hit. Across a run of missing or uninspected years, the interval covers the whole run. With annual lists, one year is the tightest bound. One presenter says some town lists were made monthly and that he timed a Rhode Island-to-New York move to the month from them [S20], [S18]. Claim month-level precision only where your own register shows consecutive inspected monthly lists.","sources":["S20","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6cd8e9351c65","kind":"unclassified","anchor":"A son's first entry as a separate taxpayer is a bounded clue to his coming of age or to a separate household [S18]. It is not an exact birthday. If you estimate a birth year from a liability age, give a range and cite the specific rule you used [S8]. Without a documented age band, give no estimate. Same-surname men taxed next to an older householder are only candidate sons. Send them, and every identity question, to [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S18","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5b163f808154","kind":"method","anchor":"To test whether a Virginia county taxed males aged 16–21 after 1783, do not stop at the state statutes: read that county court's order books, where county levies can appear [S26], [S32]. Section IX of the May 1783 act left county courts free to list free male tithables of those ages and tax them for county or parish levies, but it does not require a specific order, and clerks varied [S26], [S33]. An order found shows the county levied the tax; no order found leaves the county's practice undetermined [S26], [S33].","sources":["S26","S32","S33"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d7d31363499f","kind":"historical","anchor":"For Virginia colonial tithables, do not assume a minimum age of 21 or a white-male-only rule: the March 1642/3 law set 16 for youths and also named Black women at 16, and 16 continued for white males through the October 1748 act [S26], [S27], [S28]. A state poll tax at 21 was levied by October 1777 and the November 1781 act taxed free males above 21, but the Library of Virginia says counties could still choose to tax everyone over 16 in 1782–1787 [S29], [S30], [S31].","sources":["S26","S27","S28","S29","S30","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-27fb1f5256a9","kind":"historical","anchor":"In seventeenth- and eighteenth-century Virginia records, read \"tithable\" as a person who paid one of the taxes imposed by the General Assembly, or for whom someone else paid it, and do not assume each tithable paid personally; enslavers, for example, paid the taxes levied on their enslaved workers and servants [S26], [S34], [S35]. The tax was laid by law, so do not read a tithable as a voluntary church tithe-payer [S34].","sources":["S26","S34","S35"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a0233e83e75","kind":"historical","anchor":"On Virginia personal-property lists from the May 1783 act (in force 1 July 1783) to the 1793 change, do not read a first listing as age 21 without checking that county's practice, because county courts could still list free male tithables aged 16–21 for county or parish levies [S26], [S33]. The Library of Virginia gives 21 as the taxable age for 1782–1787, with counties able to tax everyone over 16, and 16 as the taxable age statewide from 1793, so from that year test a first listing against 16, with no county-by-county inquiry [S31].","sources":["S26","S33","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
