  - {"id":"S57","kind":"statute","urls":["https://usgenwebsites.org/vagenweb/hening/vol06-02.htm"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Sections V and X of the act transcription read 2026-11-18.","entry_sha256":"bdf97324f84248ec70b88b4896551bc7051d23d5a233d023493dd4960576dd92","claims":["C-ae5238735bc1"],"review":"reviewed"}
  - {"id":"S58","kind":"pdf","urls":["https://www.chesco.org/DocumentCenter/View/4160"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"One-page coverage table read 2026-11-18.","entry_sha256":"4b3c9515386649f8735946dace770149f49e2549765fbf888a643a13b841e870","claims":["C-07d19322bc83"],"review":"reviewed"}
  - {"id":"S59","kind":"catalogue","urls":["https://www.pa.gov/agencies/phmc/pa-state-archives/research-online/research-guides/census-records"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Overview and state census table read 2026-11-18.","entry_sha256":"9e9982044992b51501fd9f6c9a07fb9fb7a070e840e0589606439eb2c08aeca9","claims":["C-8550f57829dc"],"review":"reviewed"}
  - {"id":"S60","kind":"pdf","urls":["https://www.chesco.org/DocumentCenter/View/77820/A-Guide-to-the-Digital-Collections_20241115"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Read 2026-11-19 for the Provincial Taxes and County Taxes rows, including RG2040.003","entry_sha256":"8ecc6cb0e34028506fcb36f5c0589fb2e0deb76ef8285c42b0c3ed3fdb8523ed","claims":["C-93b8c1adfa14"],"review":"reviewed"}
  - {"id":"S61","kind":"web-page","urls":["https://libraryofnc.libguides.com/nctaxrecords/records"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Read 2026-11-19 for the taxable-age rows for 1784, 1801 and 1817","entry_sha256":"25fa5b5e844a8a98bf245d297873801c8490c71e54e13618a49192c568623203","claims":["C-b8919521e0c4"],"review":"reviewed"}
  - {"id":"S62","kind":"web-page","urls":["https://www.texasslaveryproject.org/sources/LawsOfTexas/display.php?f=TSP0149.xml"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Read 2026-11-19 for section 8 and the 21–55 range","entry_sha256":"16270fd2f4f5a8f13157ced427738027bdbcffbdace560434c250e1adca0fe3c","claims":["C-b8919521e0c4"],"review":"reviewed"}
claims:
  - {"id":"C-93b8c1adfa14","kind":"method","anchor":"Compare the years in the online set with the archive's series guide. A search in New Garden, Chester County, jumped from 1838 to 1875 [S15]. Mark 1839–1874 uninspected in that set. The county archive's digital guide lists provincial taxes as early as 1715 and includes 1871–1900 under County Taxes, RG2040.003 [S60]. Check the township in those additional rolls before logging a miss. Even an inspected tax list covers only the people liable in that place and year [S9].","sources":["S15","S60","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5cf0693cc9be","kind":"unclassified","anchor":"A name index is also a finding aid, not an inspection. FamilySearch's \"Texas, County Tax Rolls, 1837–1910\" indexes only selected years: the first year before 1845, then 1845, 1855, 1865, 1875, 1885, 1890, 1895 and 1905. It covers 231 of 254 counties and is about 13% complete. A miss in an index like that is \"not inspected\" for the year and county concerned. It becomes \"inspected – no hit\" only after you have read the images. Treat a list you find through a county guide or an abstract card the same way: record it as a finding aid, not as the inspected list [S16].","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f2dbf7e34cc","kind":"method","anchor":"1. the list's preamble or column headings, which can state who and what was taxed and the age range [S1]\n2. the session statutes in force for that place and year, for taxable ages, taxable property, exemptions and form layout [S2], [S3]\n3. a published tax-law summary for that jurisdiction, used to identify the legislation for the list's year [S3]\n4. an archivist at the state archives [S6]","sources":["S1","S2","S3","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0dbb41a1688a","kind":"unclassified","anchor":"If the statute book gives no assessment rate, search contemporary newspapers for it [S2]. When columns or check marks have no headings, do not guess what they taxed. Find the governing law first [S3].","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b8919521e0c4","kind":"method","anchor":"Verify the poll-tax age for the jurisdiction, period and person's category [S6]. The State Library of North Carolina's table lists free men aged 21 and over in 1784, 21–50 in 1801 and 21–45 in 1817 [S61]. Section 8 of the Republic of Texas act of 12 June 1837 specified white males aged 21 to 55 [S62]. Cite the applicable rule, or mark the age range **not determined**.","sources":["S6","S61","S62"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f2f3691d21e3","kind":"unclassified","anchor":"Search the land series and the personal-property or poll series separately, and keep a separate register for each. A man without land can still appear on a personal-property list as a single taxable poll or because of a taxable item such as a horse or a watch [S5]. On Virginia lists, horses were taxed from 1782 and watches had their own columns in the 1850s.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-027ba5d328b8","kind":"unclassified","anchor":"On Virginia personal-property lists, enslaved people were taxed under the enslaver. The presenter describes them as listed by first name, in age groups that varied by county [S5]. The Library of Virginia's guide narrows this. Names appear only on the 1782–1786 lists, and later lists give counts. The age categories (above or below 16, with a 12–16 band in later years) were set by state statute and changed over time; they did not vary by county. Do not expect names on lists after 1786. Record the counts and age categories exactly as the list in hand gives them.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2b8e6f3accf","kind":"unclassified","anchor":"In Pennsylvania township lists, \"inmates\" are renters or lodgers on someone else's land who were taxed on personal property. They are not prisoners. Exact definitions vary by county and period [S4], so record which section of the list each entry is in. The same presenter says Pennsylvania taxed some personal property, such as cattle and horses, up to the 1840s. Livestock appears on county lists from the 1780s and 1790s. For later years, take livestock liability from the list's column headings or the assessment law for that year, not from the 1840s date [S4].","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12fe4d3ea2f8","kind":"method","anchor":"Use the volume's headings and a contemporary township/range map to find the sequence before browsing. Chester Ward's 1845 Genesee County, Michigan, entry was in section 2, township 8, range 7 [S2]. Check the next headings to establish which direction this particular roll runs. For a Pennsylvania list arranged by township, locate the family's land first [S16].","sources":["S2","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-83b8b2206caf","kind":"unclassified","anchor":"When a parish is known from church records but the tax archive uses unfamiliar administrative divisions, look for a parish/year contents index rather than guessing the tax district. ArkivDigital's 7 February 2024 demonstration used *Innehållsförteckningar till mantalslängder* to reach the parish's section of the original roll [S25]. This is a contents index, not a person index.","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-85329232c5b6","kind":"method","anchor":"1. Fix the parish and bounded years from the household research. In the demonstrated route, choose the tax-roll contents index under register search, enter the parish and year range, and inspect the returned roll references. Locate the corresponding finding aid in the current service; the demonstration does not guarantee today's menu or coverage.\n2. List every roll returned for the same parish and year. An ArkivDigital contents search yielded two rolls for a single year [S25]. Keep the archive, volume, stated year and parish-section locator for each until its images establish what it covers.\n3. Follow the image link to the original roll and verify its parish heading and year. Then locate the recorded farm or residence within that section. The contents hit establishes a browsing entry point; it does not establish that the household is present.\n4. Check the first page for the original column key before interpreting ticks or counts [S25]. Record the heading and its locator with that year's entries. Where a label stays unreadable, leave the column unresolved.\n5. Repeat for the next inspected year, retaining the same farm/residence clue alongside the names, household categories and counts actually recorded. Recheck headings and liability rules rather than carrying a column meaning or age threshold across years automatically.\n6. Apply the interval and competing-explanation checks below. The presenter describes annual farm tracking and warns that a child's appearance can reflect the applicable taxable age, while an adult's disappearance can reflect exemption from tax [S25]. Neither change dates a birth or death. A missing or uninspected roll remains a gap in the chain.","sources":["S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e62f1ab62c13","kind":"unclassified","anchor":"- the literal name form and any Jr./Sr. designation, as written; it describes the entry and is not a parent–child link [S14]\n- the capacity, exactly as written: *agent for*, *guardian for heirs of*, *administrator of*, *estate of*, *widow* [S12], [S7], [S11]\n- the parcel details: acreage, section/range or location, valuation, and any named original grantee or owner [S12], [S14]\n- any paid or delinquent mark, plus the list section (land, personal, inmates, poll)\n- the image or volume locator","sources":["S14","S12","S7","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b527964b99cd","kind":"method","anchor":"Trace changes in capacity on the same tract back from the last identified taxpayer. In Rusk County, Texas, the 400-acre tract links entries under different names [S12]. Read the following observations in date order and keep years without an inspected roll open.","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-840d4140f8b4","kind":"unclassified","anchor":"Link the years through the repeated tract description, because the name and capacity change from year to year. Then trace an unusual acreage in deeds, where a nominal sale price is a lead and not proof of kinship [S14].","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-983ac12f1fce","kind":"unclassified","anchor":"Moving away, death and ageing out of liability are competing explanations for someone dropping off a run of lists [S17], [S7], [S11], [S23]. Not appearing does not show that the person had left the area or was avoiding the tax. He may simply have met an exemption [S1], [S6], [S9].","sources":["S17","S7","S11","S23","S1","S6","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5f4b57eb3a67","kind":"unclassified","anchor":"- If the family stays on the roll on the same land, favour death in place over removal [S13]. A later *widow* entry [S11], an *estate of* entry [S7], or the tract passing to an administrator or heir, as in the Rusk County sequence, strengthens that reading.\n- Probate, court, jury and deed activity: buying or selling land after the gap rules out death in the gap [S7].\n- Census presence [S13].\n- The next jurisdiction, for a candidate move [S20], [S19].","sources":["S13","S11","S7","S20","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-70eef64e657f","kind":"method","anchor":"Bound a change by the last inspected roll on one side and the first inspected roll on the other [S18], [S20]. Two consecutive inspected annual rolls give an interval of about a year. Missing or uninspected years widen it. A Rhode Island-to-New York move was reportedly narrowed using monthly town lists [S20]. Use a month-level interval only if your series register identifies the two inspected monthly rolls and their actual dates.","sources":["S18","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6cd8e9351c65","kind":"unclassified","anchor":"A son's first entry as a separate taxpayer is a bounded clue to his coming of age or to a separate household [S18]. It is not an exact birthday. If you estimate a birth year from a liability age, give a range and cite the specific rule you used [S8]. Without a documented age band, give no estimate. Same-surname men taxed next to an older householder are only candidate sons. Send them, and every identity question, to [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S18","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5b163f808154","kind":"method","anchor":"To test whether a Virginia county taxed males aged 16–21 after 1783, do not stop at the state statutes: read that county court's order books, where county levies can appear [S26], [S32]. Section IX of the May 1783 act left county courts free to list free male tithables of those ages and tax them for county or parish levies, but it does not require a specific order, and clerks varied [S26], [S33]. An order found shows the county levied the tax; no order found leaves the county's practice undetermined [S26], [S33].","sources":["S26","S32","S33"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d7d31363499f","kind":"historical","anchor":"For Virginia colonial tithables, do not assume a minimum age of 21 or a white-male-only rule: the March 1642/3 law set 16 for youths and also named Black women at 16, and 16 continued for white males through the October 1748 act [S26], [S27], [S28]. A state poll tax at 21 was levied by October 1777 and the November 1781 act taxed free males above 21, but the Library of Virginia says counties could still choose to tax everyone over 16 in 1782–1787 [S29], [S30], [S31].","sources":["S26","S27","S28","S29","S30","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-27fb1f5256a9","kind":"historical","anchor":"In seventeenth- and eighteenth-century Virginia records, read \"tithable\" as a person who paid one of the taxes imposed by the General Assembly, or for whom someone else paid it, and do not assume each tithable paid personally; enslavers, for example, paid the taxes levied on their enslaved workers and servants [S26], [S34], [S35]. The tax was laid by law, so do not read a tithable as a voluntary church tithe-payer [S34].","sources":["S26","S34","S35"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a0233e83e75","kind":"historical","anchor":"On Virginia personal-property lists from the May 1783 act (in force 1 July 1783) to the 1793 change, do not read a first listing as age 21 without checking that county's practice, because county courts could still list free male tithables aged 16–21 for county or parish levies [S26], [S33]. The Library of Virginia gives 21 as the taxable age for 1782–1787, with counties able to tax everyone over 16, and 16 as the taxable age statewide from 1793, so from that year test a first listing against 16, with no county-by-county inquiry [S31].","sources":["S26","S33","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3af8b4626038","kind":"historical","anchor":"Do not read homestead land as permanently exempt, as one community post implies [S43]. Land entered under the federal land laws could not be taxed by the state or county until the entrant had a perfect equity, at final proof and payment, or until the patent issued, so a homestead or other unpatented entry can be missing from the county land roll for years after settlement [S42]. In *Duncan v. Newcomer* (1896), the South Dakota Supreme Court held a homestead untaxable until the settler's final proof, and cited the rule that land became taxable after entry, payment and final certificate, before the patent [S42]. Check the land-office entry, final-proof and patent dates before you read a settler's absence from the land roll.","sources":["S43","S42"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-627b365c2657","kind":"portal-availability","anchor":"Search the federal internal revenue assessment lists as a series of their own. The National Archives' filmed lists (Record Group 58) are mostly for 1862–1866; only Arizona, Arkansas, Colorado, Idaho, Montana, New Mexico, Oregon and Wyoming have later years, up to 1874 or beyond [S36 @2026-11-14]. Ancestry titles its collection \"U.S. IRS Tax Assessment Lists, 1862-1918\", so do not take the title as its coverage; the National Archives names Ancestry, by subscription or free at its own facilities, and FamilySearch, free, as hosts of the filmed lists [S36 @2026-11-14], [S37 @2026-11-14], [S38 @2026-11-14]. The lists are arranged by state, collection district and division, and a division generally corresponds to a county, so find where the person lived first [S37 @2026-11-14]. Lists from 1867 on are at the National Archives facility that holds the state's federal records; some states, such as Ohio, Wisconsin and Massachusetts, were never filmed, and their 1862–1866 lists are at the National Archives at Kansas City [S37 @2026-11-14]. Mark a year or place outside the filmed coverage \"not inspected\", not \"inspected – no hit\".","sources":["S36","S37","S38"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a4e486821c7a","kind":"method","anchor":"A land-tax entry in a person's own name shows that the person had a taxable interest in land there; it does not show that they lived there [S41]. An entry that names someone as agent, guardian or administrator records that capacity for another's land, not that person's own interest: record the capacity and keep the representative apart from the assessed owner, as in the McClure entries in section 5. Many rolls listed non-residents' land separately: Texas county rolls often carry a heading for property in the county owned by non-residents, and Mississippi kept non-resident land tax lists from 1844 to 1895 [S39], [S40]. Record which section an entry is in. For an owner who may not have lived there, test the alternatives Genealogy Tip of the Day names, land speculation, a former residence, inherited land and military bounty land, before you place them in the county [S41].","sources":["S41","S39","S40"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-511409634a44","kind":"method","anchor":"Treat an alphabetical list as a probable recopy. Some tax lists were rewritten in alphabetical order, which loses the original order [S38], and Genealogy Tip of the Day warns that copying a list into alphabetical order could introduce transcription errors [S44]. Look for the earlier list in its original order, or a duplicate, and check doubtful entries against it.","sources":["S38","S44"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d469a1acf04c","kind":"method","anchor":"Where a list names a head of household and counts the taxables under him, track the count as well as the names. On Virginia and North Carolina tithable lists, the person responsible for a family's tax was listed with the names or the number of the taxable persons for whom he paid, sons over 16 among them, while a free male of 21 or over was responsible for his own tax and should be listed separately [S45]. A rise in the head's count is therefore a second bounded clue that a son may have reached the lower taxable age, before his own entry appears [S43], [S45]. Record both changes as intervals against the age band documented for that place and year.","sources":["S45","S43"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-18c4f92b5dd8","kind":"method","anchor":"To find candidate fathers for a man whose parents are unknown, list every taxpayer with his surname or a variant in the place where he came of age, over a run of years around his first appearance [S38]. On Kentucky lists, a son who had turned 21 was usually listed with his father [S46]. Treat each older same-surname man only as a candidate, and test him in other records.","sources":["S38","S46"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6ea2e8ac8f88","kind":"portal-availability","anchor":"Use MyHeritage's *England and Wales, Hearth Tax, 1662–1674* index for household-head names and residence dates and places [S47 @2026-11-18], [S49 @2026-11-18]. Check the collection's county list before searching. Pembrokeshire is the only Welsh county listed [S49 @2026-11-18].","sources":["S47","S49"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07d19322bc83","kind":"portal-availability","anchor":"Use MyHeritage's Chester County septennial census index for name and residence leads from 1793 to 1863 [S50 @2026-11-18], [S52 @2026-11-18]. Consult the Chester County Archives' missing-township list for the target township and enumeration year before interpreting an index miss [S51 @2026-11-18], [S58 @2026-11-18].","sources":["S50","S52","S51","S58"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3e368674ff9a","kind":"method","anchor":"For a household missing from a hearth-tax payment list, test whether it was exempt [S47]. Look for a non-chargeable entry or an exemption certificate for the place and term. Check the grounds in force, including whether the householder was excused from church and poor rates because of limited means or met the applicable rent and property limits [S48].","sources":["S47","S48"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9d248294895e","kind":"historical","anchor":"For a free Black woman on a colonial Virginia tithables list, check the law in force before assigning liability. The Just Genealogy presenter reports that free women of color could be liable in Virginia [S53]. The September 1668 act confirmed that Black women who had been freed remained liable [S56].","sources":["S53","S56"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-8550f57829dc","kind":"method","anchor":"Read a Pennsylvania septennial census as a seven-year enumeration of taxable inhabitants first authorized in 1779 [S50], [S51]. Look for the person's name, township and occupation in the return [S51], [S59]. Treat an absence as a residence clue only after verifying that the inclusion rule for that enumeration covered the person [S51].","sources":["S50","S51","S59"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dc4fd75c9ad4","kind":"historical","anchor":"Read *chimney money* in England and Wales as the hearth tax introduced in 1662 and assessed per hearth or stove [S47], [S48]. Its two equal installments fell due at Lady Day (25 March) and Michaelmas (29 September) [S47], [S48]. Record the stated collection term as well as the year and keep the two terms separate in the series register.","sources":["S47","S48"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-94aad61e513b","kind":"method","anchor":"Transcribe *LF* before expanding the abbreviation. In the 1813 Charlotte County, Virginia, transcription, Peggy Bird's entry includes an explicit gloss of *Lf* as *levy free* [S54]. Where an exemption could be granted individually, check the county order book [S53]. The St. Peter's Parish vestry recorded Peter Maye presenting a court order for levy-free status [S55]. Cite the minute as evidence he produced it, and look for the order itself to establish its date and scope.","sources":["S54","S53","S55"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ae5238735bc1","kind":"method","anchor":"If a Virginia tithables list names an overseer, record that capacity alongside the enslaved people listed and the person charged with the levy. The Just Genealogy presenter reports that an overseer could be involved in the levy [S53]. Under Virginia's October 1748 act, an overseer could file the list for an absent or nonresident owner, who still owed the levy on tithables the overseer failed to list [S57].","sources":["S53","S57"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c05edead1856","kind":"method","anchor":"- In 1850–1852 James McClure was taxed on 400 acres. The 1850 entry names James as original owner, while 1851–1852 name James M. Johnson [S12].\n- In 1853 Susan McClure appears with matching property. In 1854 S. W. McClure, administrator of “J.” McClure, appears below F. M. McClure [S12].\n- In 1855 F. M. McClure is guardian for the heirs of McClure. The 1859 roll identifies Francis M. McClure as an agent and the 1860 entry names F. M. McClure [S12]. Check probate and deeds before equating the taxpayers, the decedent or their relationships.","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
