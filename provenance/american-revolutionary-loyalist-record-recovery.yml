claims:
  - {"id":"C-6221a0d5067c","kind":"method","anchor":"If a source mentions an oath, read the text and record the government or authority to which allegiance was sworn. Search local repositories for civilian oaths under the jurisdiction and year, and use the oath as a dated act of the signer [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-459b872febd2","kind":"portal-availability","anchor":"Use the Library and Archives Canada Loyalist guide to identify the relevant regiment and search muster records under its unit name and dates. Check its War Office 28 Headquarters route and the Maritime Loyalists’ Muster Master’s Office collection where relevant. Record the roll’s unit and period before weighing a miss [S1 @2026-11-22] [S3 @2026-11-22]. For state confiscation and United States service searches, use [military service routing](us-military-service-type-record-routing.md) and [state legislative petitions](state-legislative-private-act-petitions.md).","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0c0650cbcd75","kind":"method","anchor":"For wartime New York City activity, use Timothy M. Barnes’s *Loyalist Newspapers of the American Revolution 1763–1783* to choose the title variant and the dates to search. In a property notice, record the person’s stated role alongside the house or lot. If the notice describes a planned sale or departure, look for a later conveyance or arrival before adding it to the chronology [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-36e72ebeb88b","kind":"portal-availability","anchor":"Search the Loyalist Claims Commission in both AO 12, the bound records, and AO 13, the unbound papers. For a missing or thin entry in one series, check the other using the claimant, residence and quoted evidence. Use the University of New Brunswick guide to select an index, then carry the reference into the relevant papers [S1 @2026-11-22] [S2 @2026-11-22] [S7 @2026-11-22].","sources":["S1","S2","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c3f3de4c1521","kind":"method","anchor":"Read the claimant, property, witness and decision separately, including when the claimed loss was rejected. Search widows and other women by their own names as possible claimants or witnesses. Record any explicit relationship in testimony with its speaker and context [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fb56ba6dcf9d","kind":"portal-availability","anchor":"For a possible Black evacuee from New York in 1783, search the British *Book of Negroes* through Nova Scotia Archives. Compare the separately made American version if a name, vessel or other detail is missing. Transcribe the description, vessel, status wording and any former enslaver as recorded, then identify the associated person before linking the entry. Check the embarkation point and date range against the proposed journey before drawing an inference from a miss [S1 @2026-11-22] [S6 @2026-11-22].","sources":["S1","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-96696ada2bb9","kind":"portal-availability","anchor":"For a family in postwar Upper or Lower Canada, search the appropriate land-petition index using the original applicant and descendants. Open the petition and associated certificates or affidavits. Look for wartime service or loyalty testimony, previous residence and stated relationships. Keep the petition, proof of eligibility and confirming grant or other disposition separate. Carry the reel, volume, bundle and page into the image search [S1 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S1","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
