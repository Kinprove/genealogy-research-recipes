claims:
  - {"id":"C-000000000001","kind":"method","anchor":"Extract the parish, both spouses and the dates of the last relevant marital-status entry and the next marriage or separation clue. When a baptism calls a named father *gifta karl*, record that the entry describes him as a married man. Identify his spouse independently before using that entry to bound a particular marriage [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"For cases before 1930, look for the chapter’s divorce certificate (*erokirja*) and associated papers alongside any secular court ruling. Trace the civil proceeding in the competent local court using the date or reference in the chapter papers. Leave the civil step open in cases where the file supplies no ruling [S3] [S5].","sources":["S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"custody","anchor":"Open the National Archives of Finland’s Turku Cathedral Chapter collection and search series E I for incoming royal letters, *Kuninkaalliset kirjeet*. Check the chapter minutes and letter books as additional routes for the eighteenth century, when the surviving series differ from the full original archive [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"Use the date and full archival reference together. For a paired-letter example, start with E I 9:35 and 67, dated 5 May and 9 August 1762. For a later decision that refers back to an earlier divorce, use the 9 August 1758 letter, E I 8:290 [S1] [S2] [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000005","kind":"method","anchor":"Read the petition and reply together. Transcribe the stated grounds as the applicant’s allegations, then capture the authority’s decision, date and any terms. Distinguish a letter acknowledging an earlier divorce from one granting permission for another marriage. Follow the parish wedding entry separately for evidence the marriage took place [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
