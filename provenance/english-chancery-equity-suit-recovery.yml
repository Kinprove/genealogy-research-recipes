sources:
  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/what-are-chancery-records-and-where-can-they-be-found/"],"published":"2025-06-16","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reviewed 2026-11-22 (web-page, read). Family disputes, parties in unfamiliar roles, records across volumes and dates, and separate testimony.","entry_sha256":"5dda43c0e75fa0ec64a17c91cb41cba72cec35704c3fc0174d713752de002c1a","claims":["C-587eae3bb715","C-d811c50249b6","C-484bcd02a9d1","C-490a2ac39263"],"review":"reviewed"}
  - {"id":"S2","kind":"pdf","urls":["https://cdn.nationalarchives.gov.uk/documents/research/women-in-chancery.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reviewed 2026-11-22 (pdf, read). Methods chapter and archival references for pleadings, country depositions, term indexes and decrees.","entry_sha256":"4197fe2b548e4fdd6dba9c19bc5fb739391a1c40ff83d5556719578d58aabc2a","claims":["C-587eae3bb715","C-d811c50249b6","C-95d87e3dbe46","C-484bcd02a9d1","C-490a2ac39263"],"review":"reviewed"}
claims:
  - {"id":"C-587eae3bb715","kind":"historical","anchor":"Where a will leaves a dispute over inheritance, a trust or a marriage settlement unexplained, search the Court of Chancery's equity records and keep the probate-grant search separate [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d811c50249b6","kind":"method","anchor":"Search the pleadings for the surnames on both sides. Check the candidate as plaintiff and defendant and transcribe any trustee or attorney under the role the paper gives. For another year or party combination, use the names from the pleading, place and disputed property to test whether the caption belongs to the same suit [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-95d87e3dbe46","kind":"custody","anchor":"For a late seventeenth-century suit, check the Six Clerks pleadings, C 5 through C 10 at The National Archives. For pleadings in 1714–1758, check C 11 [S2 @2026-11-22]. Log the clerk’s series and item reference with the names and date from the bill or answer.","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-484bcd02a9d1","kind":"custody","anchor":"Search for each record type separately. For country depositions in 1649–1714, check C 22. For decrees and orders, use the contemporary IND 1 indexes at The National Archives to reach C 33 [S2 @2026-11-22]. Follow both the initial filing and later years, retaining the term and volume for each order found [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S2","S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-490a2ac39263","kind":"method","anchor":"Extract the witness, any stated relationship to the parties, the place, and the dated events from each deposition. Distinguish what a witness claims to know from what the court orders. A proceeding can end before a final decree, so return each series and date range actually searched and leave the outcome open if the surviving papers do not establish it [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
