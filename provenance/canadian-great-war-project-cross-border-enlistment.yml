claims:
  - {"id":"C-b39212957356","kind":"platform-ui","anchor":"Treat birthplace and citizenship as separate questions. Start at the Canadian Great War Project search form with the known surname and forename. According to the presenter, try USA and United States separately when filtering by reported birthplace [S1† @2026-11-21]. Verify the available fields in the search form and retry without the birthplace constraint before interpreting a miss. Some U.S. volunteers gave a different name or birthplace on enlistment. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b8298098e4e2","kind":"portal-availability","anchor":"According to the presenter, when testing a co-enlistment lead, try the known enlistment date with the name fields blank, using birthplace as an optional constraint where those fields are available [S1† @2026-11-21]. Compare hometown, age and occupation. Carry each distinct candidate’s regimental number or officer rank into the Library and Archives Canada personnel search. Read the attestation and service file and require separate kinship evidence before linking two people who enlisted together. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
