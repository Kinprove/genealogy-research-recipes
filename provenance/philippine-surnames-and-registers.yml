  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=VojUgBPUtuw"],"published":"2022-08-24","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify Todd Lucero Sales’s advice on continuing Philippine church and civil searches past online restrictions and testing surname changes around 1849.","entry_sha256":"d6eba14b337aa77c59c11b1b8a0a6057f75d39b6bd66908e782aa0a63087e9c6","claims":["C-01","C-04"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://familytreemagazine.com/podcasts/tips-for-filipino-genealogy/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Publisher’s episode page identifies Sales’s interview and Philippine genealogy scope. The audio was not inspected through this page.","entry_sha256":"f2a422ce2d5aee015fd156b85b1438d986d805458939ba7fee6dc1035d9a5ac2","claims":["C-01"],"review":"reviewed"}
  - {"id":"S3","kind":"pdf","urls":["https://memory.nhcp.gov.ph/wp-content/uploads/2024/10/Tracing-your-Philippine-Ancestors-Volume-Two.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Read the discussion of Clavería’s decree, surname retention and locality-level allocation.","entry_sha256":"eb8dd55da8ff8798ef0551c707a4b4d2b40182359fe8c537bafe6fb0b09ed7ea","claims":["C-02"],"review":"reviewed"}
  - {"id":"S4","kind":"catalogue","urls":["https://qcpl.quezoncity.gov.ph/catalog/20982"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Catalogue entry identifies the 1849 work and its compiler.","entry_sha256":"f732939eb564c429e68cab9932d8f105e970d073cae517c4cc9f0ceef96bd669","claims":["C-02"],"review":"reviewed"}
  - {"id":"S5","kind":"catalogue","urls":["https://www.familysearch.org/en/search/collection/2861657"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Provider describes the Catholic parish records and the partial name indexing.","entry_sha256":"85a1be2c1f789df37bc356218d466ab90b3bfe031bf4b4a940f1dd2f298d215a","claims":["C-03"],"review":"reviewed"}
  - {"id":"S6","kind":"catalogue","urls":["https://www.familysearch.org/en/search/collection/1935452"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Provider describes the collection’s civil registration extracts and distinguishes historical parish returns from the originals.","entry_sha256":"ee81778a9b2cb7ebcaad1e0eca99563f7dd205f245ab1d9e2d7140d478836114","claims":["C-03"],"review":"reviewed"}
  - {"id":"S7","kind":"help-page","urls":["https://articles.familysearch.org/hc/en-us/articles/41818768912027-Why-do-historical-records-have-access-limitations"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Provider identifies restriction messages and their possible access routes.","entry_sha256":"60c08bacb7c56ebd6a15023e9d934b1931f19639a8054580c302bb0f61934284","claims":["C-05"],"review":"reviewed"}
  - {"id":"S8","kind":"help-page","urls":["https://www.familysearch.org/en/fieldops/familysearch-center-administrative-operations"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Provider distinguishes restricted digital images from a reel requiring a physical holding and documents the end of microfilm distribution.","entry_sha256":"c6385d95915b76016c1365eb0f063be6130d6e593709f4af70e0cab8efadac1d","claims":["C-05"],"review":"reviewed"}
  - {"id":"S9","kind":"pdf","urls":["https://cms-z-assets.familysearch.org/d2/bd/f25915764f2a96e231c3a5862b6a/syllabus-filipino-genealogy-101.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Read the course’s list of church and civil sources and the discussion of tracing names across the decree.","entry_sha256":"ad412b2cf4b6d474278d3ec2fb69320d05f88f7987398504c6fd4ac83f6ce292","claims":["C-02","C-03","C-06"],"review":"reviewed"}
  - {"id":"S10","kind":"web-page","urls":["https://blog.myheritage.com/2025/08/being-filipino-exploring-traditions-and-family-history/"],"published":"2025-08-09","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Lagan cautions against inferring Spanish ancestry from a surname and suggests checking the National Archives and local church records when online coverage is limited.","entry_sha256":"96aa980614d1dc98830192f3ed864744a3fbb5da42db99139af2b5bc2dd4dc8b","claims":["C-07","C-08"],"review":"reviewed"}
  - {"id":"S11","kind":"pdf","urls":["https://nhcp-nmp-stg.beesites.net/nhcpmp/wp-content/uploads/2023/03/THE-ART-OF-ANCESTOR-HUNTING-IN-THE-PHILIPPINES-LUCIANO-P.R.-SANTIAGO.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Appendix B reproduces the English translation of the 1849 decree, including surname allocation and retention in articles 1–4. The discussion of baptismal and marriage books describes the parent information used to link generations.","entry_sha256":"6184187dc2571c41996f96c184a01191edab2b37b1f1a2207f20d6ab9a0bfd3a","claims":["C-07"],"review":"reviewed"}
  - {"id":"S12","kind":"pdf","urls":["https://nationalarchives.gov.ph/wp-content/uploads/2025/04/2025_NAP-Citizens-Charter-updated2.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Reference Service entries 2 and 4 identify the Reference Service Unit for inquiries and list separate birth, marriage, death and baptismal forms. These entries do not specify coverage by town or year.","entry_sha256":"a5738918c8ce708fb91e825a37c24773de49412e7e80cd1b991d7142bff6ffa8","claims":["C-08"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the episode’s genealogy adviser, allow for adoption of a different surname around 1849, and keep same-surname families from different places separate until the records connect them. [S1†], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"The 1849 Clavería decree and accompanying *Catálogo alfabético de apellidos* can explain a surname change. Compare neighbouring baptism, marriage and burial entries for the same household and track names, relatives and places on either side of the change. Keep surname retention open. A catalogue match supplies a name lead to test within the locality. [S3], [S4], [S9]","sources":["S3","S4","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"portal-availability","anchor":"Check the town and its parish in both the FamilySearch Catholic church records and the appropriate civil registration collection. A name miss leaves unindexed images and parishes that the collection never acquired to be checked. For colonial-period civil returns, check the parish register separately. [S5 @2026-11-18], [S6 @2026-11-18], [S9 @2026-11-18]","sources":["S5","S6","S9"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"According to Sales’s advice in the interview, continue looking for the church record after an online restriction or miss and start with church and civil indexes where the records are searchable. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"Follow the access message for the specific image group. For restricted digital images, use the location class it identifies. For physical-only film, verify that the listed institution holds the reel and has a reader before arranging a visit. [S7 @2026-11-18], [S8 @2026-11-18]","sources":["S7","S8"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Ask the parish that served the town about the historical register series and years still held locally. Start with the denomination, town, record type and year range. [S9]","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"When a Philippine vital record gives a Spanish-sounding surname, test whether the household adopted it under the 1849 decree. Require records that link the generations and establish an ancestor’s origin independently of the surname before concluding Spanish ancestry. [S10], [S11]","sources":["S10","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"custody","anchor":"After an online miss, ask the Reference Service Unit of the National Archives of the Philippines whether its birth, marriage, death or baptismal holdings cover the town and year range. Keep names and identifiers local during the holdings inquiry. [S10 @2026-11-22], [S12 @2026-11-22]","sources":["S10","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
