claims:
  - {"id":"C-39ca889037b5","kind":"unclassified","anchor":"A failed search on WieWasWie or Open Archieven (openarchieven.nl) does not show that the event is missing from the municipality's records. WieWasWie covers the civil acts of most municipalities, not all, and Open Archieven also carries records from archives that do not take part in WieWasWie. [S19], [S20] Search both, then open the municipality's ten-year tables (tienjarige tafels). Within each ten-year block, the tables are grouped by event type (births, marriages, deaths), and each group is alphabetical by surname. How the letters are grouped varies from one archive to another. In the presenter's example, one filmed volume of about 170 pages covered 1812–1842. Use the page headings to jump between event groups and periods instead of reading page by page. [S3]","sources":["S19","S20","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d69fc8426375","kind":"unclassified","anchor":"- Read how the entries are laid out before you search. In the presenter's marriage example, the groom's name was written surname first and the bride's given name first. Check the name order in your own table before you search. [S3]\n- Copy each candidate line exactly as written: the names, the parent or spouse shown, and the date. In the birth tables the date is normally the date of the act (the registration), not the birth date. Get the actual birth date from the act. In the presenter's marriage and death examples, the date given was the event date. [S3]\n- Go to that year's register for that event type, browse to the date, and read the full act. Several candidates with the same name can turn up. Keep each one as a separate candidate until the full act ties it to your family. [S3]\n- If the event may fall outside the block you read (for example a death), repeat the search in the next decade's table. Record which blocks and event groups you read. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-751c643477ef","kind":"unclassified","anchor":"- **Zeeuws-Vlaanderen:** 1796. Registration became official on 1 July 1796, and separate civil registers began on 22 September 1796. Entries made before that date went into confiscated church registers, the provisionele burgerlijke stand (provisional civil registration). [S12], [S13]\n- **Limburg:** 1796 in most of the province. Check the first year of each Limburg municipality's registers. [S14]\n- **Vlissingen:** 1 April 1808. [S12]\n- **Everywhere else:** 1811. [S12] Take the first date of each municipality's own birth, marriage and death registers before you choose between civil and church records; they can start months into 1811. Schiedam's first civil marriage act is dated 23 June 1811, and its births and deaths start a month later. [S15]","sources":["S12","S13","S14","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d0f0a0c44b0b","kind":"unclassified","anchor":"The civil marriage act names the couple's parents and places of origin. The marriage supplements (huwelijksbijlagen) hold the proofs each spouse had to file: a birth or baptism proof, parental consent where it was required, and death proofs for parents who had died. If a spouse was born before civil registration began in the birthplace, the proof is a baptism extract. That extract names the church and its denomination, which tells you which register to search next. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7a86f1cc536c","kind":"unclassified","anchor":"Make an inventory of the supplements one document at a time: what kind of document it is, which person it concerns, who issued it, and its date. Do not infer a spouse's age from whether a consent document is present. The presenter suggested consent was needed under 21, which is not correct as a general rule. [S2] The French Code civil applied from 1811 (earlier in Zeeuws-Vlaanderen and Limburg) until the Dutch Civil Code took effect on 1 October 1838 (1 January 1842 in Limburg). Under it, a son under 25 and a daughter under 21 needed their parents' consent. An older child had to ask the parents' advice, or the grandparents' if the parents had died, by a formal acte respectueux. Up to age 30 for a son and 25 for a daughter, the act was repeated twice more, a month apart, if consent did not follow. [S16], [S18] Under the 1838 Dutch Civil Code, consent was required under age 23, and adults still had to ask for it up to age 30. [S17] These rules tell you which documents to expect in the supplements. In every period, read the consent document itself rather than applying an age rule.","sources":["S2","S16","S18","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1a78c6dddb30","kind":"unclassified","anchor":"A `huwelijkscontract` or `huwelijkse voorwaarden` is a prenuptial agreement, a separate target from the marriage act and its `huwelijksbijlagen`. Check the locality's finding aids for the relevant notarial or, where applicable, voluntary-court series. Known banns and wedding dates give a starting search window, not a reason to exclude other dates. Hoitink describes this route; the actual series must be established for the place and period. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c99cf69aa1b1","kind":"unclassified","anchor":"If a surviving parent remarried with minor children, also ask whether a separate agreement with the children's guardians survives. Keep it distinct from the couple's contract and ordinary guardianship appointments or accounts, each with its own locator. This is Hoitink's document lead, not a claim that an agreement was legally required or created in every case. For the wider guardianship search, use [probate case inventories](probate-case-document-inventory.md). [S7]","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1e8b528e8852","kind":"unclassified","anchor":"For a death from 1806 on, also look for the memorie van successie (estate-tax return) in the series of the tax office that covered the person's last place of residence. Record the years that office's series covers: the Zuid-Holland series runs 1806–1927, and other series differ. [S22], [S23] Heirs in the direct line paid no tax until 1878, so a return filed before then can be short. [S22], [S23] If no return turns up, record the result as \"not found in that series\".","sources":["S22","S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6cd49c80cf12","kind":"unclassified","anchor":"Before you search images, use a register repertorium to see which baptism, marriage and burial registers (DTB) survive for the place. A repertorium is an inventory arranged by town, denomination and year span. The standard printed reference is W. Wijnaendts van Resandt's *Repertorium DTB*. The presenter used a downloadable PDF of about 300 pages in Dutch and German. She searched it by town name with Ctrl+F, and it marked register types with letter codes (D for doop/baptism, T for trouw/marriage). Read the code key in the introduction of the edition you use before you search it. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12ba3b161836","kind":"unclassified","anchor":"A family may have been baptized or married in another town's church of their denomination. The presenter's Catholic ancestors had to go to another town for baptisms and marriages. Do not assume that a town had no church of a denomination: Leiden, her example, did have Catholic places of worship, including hidden churches and, from 1808, the Lodewijkskerk. Use the repertorium to list the registers of that denomination in the home town and in nearby towns. Search all of them before you conclude anything from the home town's registers alone. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-752fdd520a8c","kind":"unclassified","anchor":"Put the Mennonite (Doopsgezind) and Walloon Reformed registers on that list too, before you call a church-period event missing. Walloon Reformed registers are written in French, so read them with French record terms. [S8], [S10]","sources":["S8","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d77a12cd2ae4","kind":"unclassified","anchor":"- **Burial:** the date in a pre-1811 burial register is usually a burial date, not a death date. Many entries are really fee records (lists of amounts paid for the burial). Some entries do also give the date of death. Copy a death date only when the entry states one, and never put a burial date in a death field. [S2]\n- **Household-head search key:** if a married woman is missing from a burial or burial-fee book, also search under her husband's supported name; for a minor child, try the father's. Hoitink describes entries filed under the household head rather than the person buried. Read the actual entry and keep an unnamed wife or child unassigned until other evidence identifies the person. [S5]\n- **Unnamed child:** an entry such as \"a child of [father]\" often gives only the father. A baptism followed soon after by a child burial is an assumption, not an identification. Keep the burial unassigned unless other evidence names the child. [S2]\n- **Marriage:** the date in a church marriage register is usually the ondertrouw date (when the couple registered their intent to marry), not the wedding date. Read the register's heading or introduction, then label the date \"ondertrouw\". Use \"proclamation\" only when the heading or introduction says the entries are banns postings, and \"marriage\" only when the entry records the ceremony. [S2]\n- **Baptism:** a baptism date is not a birth date unless the entry records both. Typical gaps give an estimate only. Catholic baptisms usually took place within one or two days of birth, often on the day of birth. Reformed baptisms usually took place on the following Sunday, and in some northern provinces up to several weeks later. Record a birth date estimated this way as \"on or before [baptism date], estimated\", never as a calculated birth date. [S2]\n- **Mennonite baptism:** Doopsgezind congregations baptized only adults, so their baptism date is an adult baptism. Never use it as a birth or infant-baptism date. Find the birth in another source. [S8], [S9]","sources":["S2","S5","S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-583d671ba139","kind":"unclassified","anchor":"The 1811 decree under Napoleon made people take permanent surnames. Siblings could take different ones: children already married might keep the patronymic they were using, and those still at home did not always choose the same name. Before you reject a sibling link because the surnames differ, check the name-adoption registers (naamsaanneming). These were kept in rounds in 1811/12, 1813 and 1825/26, and FamilySearch catalogues the scanned volumes under the topic \"Names, personal\". Survival varies from one municipality to another. In the presenter's Groningen example, the Catalog showed an 1812 round and an 1826 volume. Then trace the family back to when all the children lived in the parents' household. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-555966b98ea4","kind":"unclassified","anchor":"A patronymic kept as a second name can point to the father's given name. These end in -sen, -szoon, -szen or -se for men and -dochter or -dr for women. Treat this as a search clue only, never as proof of parentage. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-49228a05106a","kind":"unclassified","anchor":"If an act says the mother was unmarried, or records the recognition (erkenning) of a child born before the marriage, do not adopt the father that compiled trees assign. In the presenter's session [S4], trees on several platforms named a father; the presenter suspected easy assignment, and her reading of that act is unverified. Read the recognition clause yourself. Separate \"recognized by\" from \"named as father\", and check the marriage supplements for both bride and groom before you name a father. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6151dcd6f8db","kind":"unclassified","anchor":"In the presenter's demonstration, she searched both spouses at once using \"begins with\" name fragments. She shortened the husband's given name to a prefix shared by Willem and Wilhelm, entered only an initial for the wife's given name, left the final ij off the wife's surname because it may be written ei, and skipped the patronymic middle name. She sorted the results by date and followed the index entry back to the holding archive's source. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a94e52a9fe64","kind":"unclassified","anchor":"Most municipalities began a bevolkingsregister (population register) in 1850, and some kept one earlier; take the first year from the municipality's inventory. [S21] After the bevolkingsregisters, many municipalities kept gezinskaarten (family cards). Persoonskaarten (personal record cards) replaced them from 1939. [S11]","sources":["S21","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2206147f512a","kind":"unclassified","anchor":"- **Death between 1939 and 1 October 1994:** the CBG holds the persoonskaart of almost everyone who died while registered in a Dutch municipality. [S11]\n- **Death after 1 October 1994:** the CBG holds the persoonslijst (personal record list). [S11]\n- **Where to ask:** request an extract from the CBG, not the regional archive. The cards and lists cannot be searched online. [S11]\n- **Gaps:** for a death between 1939 and 1 October 1994, a person who had emigrated is not in this register. A Dutch national who died abroad after 1 October 1994 can be in it as a non-resident registration, even after emigrating; a miss in those lists is not a negative. Grown children who had already left home in 1939 are often missing from their parents' card. [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-887e713c00d3","kind":"unclassified","anchor":"- the ten-year table blocks and event groups you read, with what each table date means (act date or event date)\n- each act locator (municipality, register type, year, date, act number if shown)\n- a supplements inventory\n- separate marriage-contract and guardian-agreement locators, with their document roles kept distinct\n- the repertorium entry and the church and denomination you chose, including any neighbouring-town registers you searched\n- every church date labelled with its role (burial/fee, ondertrouw/proclamation, baptism, estimated birth)\n- name-adoption register findings\n- the civil-registration start year used for the place, and any CBG card or list requested\n- the recognition wording, quoted literally\n- the questions still open: which spouse is meant, which child is buried, and who the father is","sources":[],"checked":null,"stated_as":null,"review":"pending"}
