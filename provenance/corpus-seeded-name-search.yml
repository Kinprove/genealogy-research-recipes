claims:
  - {"id":"C-1349eb35e2af","kind":"unclassified","anchor":"For each attested form, also record who produced it: family tradition, an enumerator or clerk, a\nformal document or the person's own signature. Add the record type, place and date range. Mark\nforms seen only once, or only in one record class or under one recorder. Check whether a spelling\nchange coincides with a new priest or clerk, or whether forms cluster by jurisdiction. These\npatterns guide later searches. They do not choose a 'correct' spelling, and they do not prove that\ndifferently spelled entries are one person. Examples from\n[Brady](https://www.youtube.com/watch?v=aL2BGQ7raRw),\n[Castillo](https://www.youtube.com/watch?v=qDW8dEp5mN0) and\n[Allen](https://www.youtube.com/watch?v=XJeAPcgLHpc) motivate this step. Allen's AI-generated\nspelling explanations were not verified.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c7ccee7a7069","kind":"unclassified","anchor":"An index may also have given a token the wrong role. A word repeated in every entry on a register\npage, such as a German 'died' formula, can be indexed as a first name. A copied tree may carry\nanother researcher's placeholder for an unknown name, such as Danish 'Ukendt'. The compiler of a\nsurname index to a Russian regional-history book cautions that headings formed from given names\nmay be patronymics rather than surnames. Before adding such a token to the\ninventory or searching it as a family surname, read the original entries or the indexed page. The\n[register-formula example](https://forum.ahnenforschung.net/forum/thread/928/) and\nthe compiler's caution in a\n[book surname-index thread](https://rodgersforum.borda.ru/?1-7-0-00000258-000-0-0-1776484154=)\nmotivate this check. They supply no list of formula words, placeholders or affected headings.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-365a11b1bb16","kind":"unclassified","anchor":"In some German registers, a person appears as 'X gnt. Y' (genannt). X is usually the birth or\nearlier surname and Y a farm or house name. A man who married onto a farm, or a later spouse of its\nwidow or widower, may take the farm name. Names can also stack ('X gnt. Y gnt. Z'). Record each\npart separately, and search the birth surname and every farm name as separate lanes. A shared farm\nname links people to a holding; by itself it does not show blood kinship. A\n[chain-marriage example](https://forum.ahnenforschung.net/forum/thread/928/)\nmotivates this step. It does not show how widespread the custom was or how consistently clerks\nwrote it.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f4b30a28332f","kind":"unclassified","anchor":"For local Hebrew/Yiddish text, Unicode normalization can reconcile some encoding differences. Decomposition followed by removal of selected Hebrew combining marks is an additional, lossy search transform; normalization alone does not strip points. Apply any such transform to both pattern and search text, preserve the originals and verify retrieved passages. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b92ecb951ddb","kind":"unclassified","anchor":"Hebrew final letters and Yiddish digraph characters are separately encoded. If needed for retrieval, explicitly test final-to-medial folding (`ךםןףץ` → `כמנפצ`) or digraph expansion (`װ/ױ/ײ` → `וו/וי/יי`) in a search copy. These are application choices, not effects guaranteed by NFC/NFKD or instructions to rewrite source spelling. They can merge distinct strings; inspect the resulting homographs. [S1, S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ce520ab542db","kind":"unclassified","anchor":"Pre-1918 Russian text needs a pre-reform spelling lane. OCR of pre-reform print and HTR\n(handwriting recognition) of manuscripts can keep the old letters, so a query in modern spelling\ncan miss the entry. The decree of 10 October 1918 replaced ять (ѣ) with е, фита (ѳ) with ф and і\nwith и, and dropped ъ at the end of words while keeping it inside words as a separator [S17]. The\nNarkompros (People's Commissariat for Education) decree of 23 December 1917 had set the same rules\n[S18]. Ижица (ѵ, izhitsa) is named in neither decree: it had become rare, fell out of use gradually\nand still turns up in some register names, so treat it as a rare variant [S17, S19]. Search both\nforms, for example Ѳома/Фома, Ѳеодоръ/Феодор (and the vernacular Фёдор), Тимоѳей/Тимофей and\nАѳанасій/Афанасий, and keep the forms the returned text actually holds. Confirm every hit on the\nimage. In a volume that binds several parishes, limit a negative to the target parish's section\nand to the years and pages that carry recognised text.","sources":["S17","S18","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9165b7b304c7","kind":"method","anchor":"In a transcribed index, search the given name and patronymic in reversed order. One LitvakSIG user reports finding Лейба Берков transcribed as Берк Лейбов and Йетта as Устина [S14]. A substituted given name can defeat even the reversed search. Browse by locality, year and relatives, then check the image before accepting either reading.","sources":["S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2d420e6d2517","kind":"unclassified","anchor":"When a record was written in a language or dialect other than the family's, search the recording\noffice's form of the name as a separate lane. Church entries may Latinize given names. A French\nadministration may write Jean for Johann. A court, military or district office in a High German\narea may give a Low German parish family's name in its High German form. In Lithuanian Lutheran\nrecords, different pastors, even in one church, may record the same person under very different\nGerman or Lithuanian name forms. Check where the recording office sat, not only the parish, and\nkeep the literal form in the inventory. The [Jensen](https://www.youtube.com/watch?v=g8pltErjQpU),\n[Minert](https://www.youtube.com/watch?v=cc8_6tNN8C4) and\n[Sinickas](https://www.youtube.com/watch?v=xoY83Sx3ANk) transcripts give examples, not a\nsystematic conversion table. A matching form is a candidate, not proof of identity. For Romanian\nand Russian name lanes in Bessarabian records, see\n[Route a Bessarabian or Moldovan record by date, district and bank of the Dniester](bessarabia-moldova-record-routing.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0cdc1f648f06","kind":"unclassified","anchor":"Grammatical endings need their own lanes. In German-language registers, a woman's surname may\ncarry a feminine -in suffix that is not part of the family name. When such a name is hard to read,\ndrop the suffix, keep uncertain first letters open, check the readings against a local family\nbook's surname variants and list of wives, then return to the original entry. In Ural and Siberian\nrecords an indeclinable -ских form may alternate with -ские or -ская for one family, and -ов/-ев\ncould be written inconsistently. Search each ending, including feminine and plural forms, and keep\neach literal ending in the inventory. A -ских form can also be the genitive plural of an owner's\n-ский surname, as in 'вотчина графинь X-ских' (the estate of the Countesses X-sky). Decide from\ngrammar and context before you create an indeclinable -ских peasant family. See the\n[family-book example](https://forum.ahnenforschung.net/forum/thread/17915/),\nthe [Ural Civil War thread](https://rodgersforum.borda.ru/?1-23-0-00000012-000-0-0-1714980847=)\nand the [genealogy terms thread](https://rodgersforum.borda.ru/?1-0-0-00000141-000-0-0-1701453218=).\nNone gives a rule for which form a clerk used. A family book is a compilation, and identity still\nneeds original entries and place and household evidence.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0680e9f46b7a","kind":"unclassified","anchor":"Latin inflection needs its own lanes too. A Latin church entry may name a child's father in the\ngenitive, so both the given name and a Latinized surname end in -i instead of the nominative form.\nAn indexer may misread such an ending as a new name. Early-modern university matriculations may\nLatinize the surname with an -us ending and add adjectival words for town or nation after it.\nSearch the nominative, the inflected Latin form and a reconstructed vernacular form as separate\nlanes. Keep the literal entry, and do not search origin adjectives as surnames. The\n[Latin register-name examples](https://forum.ahnenforschung.net/forum/thread/928/)\ngive two instances and no conversion rules. A reconstructed vernacular name is only a candidate.\nFor Polish-orthography and Latin given-name lanes in Galician registers, see\n[Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-44cce3493532","kind":"unclassified","anchor":"When the target name may be misread, try an independently known co-listed household member\nor participant whose name may have survived recognition. Test an optional place constraint\nseparately if the entry may omit it, keeping collection/year bounds explicit. Log the alternate\nquery, then return to the full entry and image to read the target. The [co-listed-name example](https://genery.com/ru/forum/viewtopic.php?t=4868)\nsupplies a retrieval tactic; co-occurrence corrects neither transcription nor kinship by itself.\nUse only syntax supported by the actual field, without transferring another database's controls.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-192da13adf01","kind":"unclassified","anchor":"If you build a word index from Tesseract's TSV output, parse it as raw tab-separated text, not as quoted CSV: Tesseract writes each word into its row with no quoting or escaping. [S23] A default reader, such as Python's `csv` module or pandas `read_csv`, uses `\"` as its quote character with `QUOTE_MINIMAL`. It treats a word token that begins with a double quote, such as an OCR'd opening quotation mark, as the start of a quoted field, and a quoted field can run across tabs and line ends. [S24, S25] The following rows are then swallowed into one cell, their words vanish from the index, and a name looks absent when it is not: a false negative. Parse with quoting disabled (`csv.QUOTE_NONE`, or `quoting=3` in pandas). Compare the parsed row count with the file's line count minus the header, and check that no text field contains the TSV header or runs of numeric columns.","sources":["S23","S24","S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6a8d10dde57d","kind":"unclassified","anchor":"A Belarusian or Ukrainian database may index names in that language's spelling, in Russian, or\nboth. Run each spelling as a separate lane, and calibrate each database's own convention before\ntrusting a zero. On 2026-11-02 the Virtual Museum of Soviet Repressions in Belarus (represii.net)\nreturned no hits for a common surname in Russian spelling and 194 for its Belarusian spelling\n[S20]. Zhnivo (db.zhnivo.com) covers the historical Belarusian lands and destinations of Belarusian\nmigration such as Siberia and the Baltics. Its search help asks for the surname in Russian,\nalthough the site is in Belarusian, with `|` between alternatives in one field and `*` as a\nwildcard. The help also warns that machine-read names can differ from the original by a letter or\ntwo, so confirm each hit on the document it points to. Its terms forbid automated bulk or partial\ndownload without the project's permission, so search it by hand in the user's browser. [S21]","sources":["S20","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4b3716efc509","kind":"unclassified","anchor":"A site search can silently drop one query term. Some engines ignore words outside a length range or\non a common-word list, then return results for the remaining words. A multi-word result list may\ntherefore not contain the target at all. Read any ignored-terms notice even if its stated reason\nlooks wrong, and compare each term with the engine's stated limits. Retry an over-long name as a\nshorter stem with a wildcard, and confirm that hits contain the target. The\n[forum-search test](https://forum.j-roots.info/viewtopic.php?f=181&t=9163) documents one\ninstallation's configurable limits. Other sites differ, and a stem can match unrelated words.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-55ffaa343025","kind":"method","anchor":"When an alphabetical index yields no match, inspect the order used on its own pages. Test native letters and normalized spellings in both positions, and record the ranges browsed. Check Scandinavian and Icelandic letters such as á, ð and þ [S5, S58], and Spanish ñ or traditional ll where the index files them separately [S59]. Browse adjacent surname cards, then compare dates, place and relatives with independent records. A Maryland search for Murphy turned up an Ethel May Murray card in the next surname group, but its January 1908 death date preceded the daughter’s reported birth in May 1909 [S6].","sources":["S5","S58","S59","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3fc041d5dc65","kind":"unclassified","anchor":"JewishGen's transcription rules allow hidden “Other Surnames” and “Other Towns” fields to make names in comments searchable in typed fields. Their existence does not show they were populated in a particular collection. Compare free-text and typed-field retrieval where supported. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f85f77bb7db8","kind":"unclassified","anchor":"Phonetic search is another candidate lane: JewishGen's Belarus instructions explicitly document name forms that it misses. It cannot replace searches for attested alternatives. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5ebba2f08023","kind":"method","anchor":"For Cyrillic or other non-ASCII names in a local database, match on case-folded keys built from\nboth the query and the stored text, for example with Python's `str.casefold()`, which its\ndocumentation offers for caseless matching, and keep the source spelling unchanged. [S30] SQLite's\n`NOCASE` collation folds only ASCII letters, and by default its built-in `lower()`, `upper()` and\n`LIKE` also handle case only for ASCII, so a miss from these is not a negative; its documentation\nnames the ICU extension for Unicode-aware `lower()` and `LIKE`. [S27, S28, S29] Also check each\nname for letters from a second script: Unicode's confusables data lists Cyrillic а, е, о, р, с and\nх as look-alikes of Latin a, e, o, p, c and x. [S31] Search each script form as a separate lane.","sources":["S27","S28","S29","S30","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9730b2e65028","kind":"example","anchor":"In Russian-language records an Armenian given name may appear as a Russian one. A 2024\nFamilio.Media article by Nina Galishnikova describes a list of Moscow Armenian community members\nof the 18th to early 20th centuries, compiled from Armenian-language documents of the Moscow\nArmenian Spiritual Board and checked against Russian-language records and Vagankovo Armenian\ncemetery epitaphs. It reports two kinds of pair: a Russian equivalent, as Akob/Yakov (Акоб/Яков)\nand Ovanes/Ivan (Ованес/Иван), and a similar-sounding name, as Arutyun/Artemy (Арутюн/Артемий)\nand Mkrtych/Nikita (Мкртыч/Никита). [S26] Search each form as a separate lane; the pairs were\nobserved in one community.","sources":["S26"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ae7d258abc6f","kind":"method","anchor":"In Pennsylvania German baptisms, search each given name separately. A family could reuse Johann or Anna for several siblings and use another name in daily life. Childs illustrates the pattern with Johan Georg, Johan Jacob and Anna Barbara, whose call names would be Georg, Jacob and Barbara [S33]. For a baptism with Johannes alone, also test John [S32]. Distinguish siblings with their parents, spouses and dates.","sources":["S33","S32"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7b2910684ba2","kind":"method","anchor":"In English-language records, a German surname may be translated by meaning, not only respelled:\nZimmermann as Carpenter, Schwarzwälder as Blackwelder, Becker as Baker [S34]. More often the\nEnglish form follows the sound, as Bentz to Pentz and Pence [S34], or Stehli to Staley and Bauman\nto Bowman, and given names take English forms, as Heinrich to Henry and Maria to Mary [S33]. Search\nthe translated surname as its own lane: a spelling-variant or Soundex search will often miss it\n(Zimmermann and Carpenter have different Soundex codes). Keep\nthe literal form in the inventory, and treat a translated-name hit as a candidate until place,\nfamily and dates connect it.","sources":["S34","S33"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-41f518517139","kind":"method","anchor":"An 18th-century Russian commoner's patronymic is usually the short possessive form, Иван Петров\n(сын), not Иван Петрович. The -ович form had been a privilege since the 16th century, and Catherine\nII's rules for officials gave it in official papers only to generals and the matching highest\nofficials [S35]. A woman's form adds -а, often with\nдочь (Петрова дочь), and a father's name ending in -а gives -ин, as Малина to Малинин; -овна was\nrare in the earlier period [S36]. When a transcribed or full-text index misses an 18th-century\nperson, search the short form (Петров, Петрова) as well as -ович and -овна, as Vera Miller also\nadvises [S37]. Do not file the short form as a surname. For reading such entries, see\n[the household-list audit](russian-household-list-transcription-audit.md).","sources":["S35","S36","S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-be0d834ae7c6","kind":"method","anchor":"Baltic surnames change with sex, and Lithuanian ones also with marital status. A Lithuanian man's\nsurname ends in -as, -is, -ys, -us, -ė or -a. An unmarried woman's replaces that ending with\n-aitė, -ytė, -utė or -iūtė, and a married woman's with -ienė, or sometimes -uvienė after a\ntwo-syllable name in -us [S38], as Briedis, Briedytė and\nBriedienė [S39]. Older records may write the maiden suffix as -kė instead of -tė [S38]. A Latvian\nsurname has a masculine and a feminine form, as Kalniņš and Kalniņa [S40] or Briedis and Briede\n[S39]. Search the man's form, each woman's form and a documented stem wildcard as separate lanes,\nand convert a woman's form back to the family name before comparing relatives [S38, S41].","sources":["S38","S39","S40","S41"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2495afd66357","kind":"method","anchor":"Search the church-calendar, local pre-reform and modern forms separately. For Алексій, include Алексѣй, the spelling listed by a pre-reform orthography handbook, and modern Алексей [S43]. A count of 1875 entries in Efremov uezd reports that the spelling with ѣ predominated there and that the registers also used Антон, Ефим and Захар alongside Антоний, Евфимий and Захарий [S42]. Copy the actual spelling from the image.","sources":["S43","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-75b7b253dc94","kind":"method","anchor":"In Tula records, test х, хв and хф for ф, ф for хв, and а for unstressed о as separate variants. Descriptions of regional speech document х or хв for ф and аканье in parts of the southern dialect area [S46]. A researcher connects Хамин in an 1895 Dedilovo godparent entry to a family otherwise recorded as Фомины [S45]. Search village names the same way. The reported Belev uezd headings for Коровьи Хвосты are Каровьих Фастов in 1795 and Коровьих Фостов in 1782. The same author cites Хвилип and Хилип for Филипп in Bogoroditsk uezd parish descriptions [S44]. Verify a proposed match by locality, household and date.","sources":["S46","S45","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-prefix-field-forms","kind":"method","anchor":"For a recorded surname prefix, test the joined, spaced and punctuation forms relevant to that name: IrishGenealogy lists O’Brien, O Brien and Obrien [S47]. Check whether a Dutch index files under the surname root or provides a separate prefix field; Hoitink explains the Raalte/van Raalte arrangement and discusses joined forms [S48]. Log each query and keep the literal record spelling rather than permanently stripping prefixes from the attestation inventory [S51] [S52].","sources":["S47","S48","S51","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-german-clipped-forenames","kind":"method","anchor":"For German given names, add supported clipped forms to the query inventory. Beidler lists Klaus/Nikolaus, Stina/Christina and Trin/Katharina, illustrating loss of the opening part of a name [S49]. Try the short and full forms separately in the given-name field and log which form produced each hit [S53].","sources":["S49","S53"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-swapped-name-fields","kind":"method","anchor":"When a supported spelling fails in separate given-name and surname fields, run a controlled trial with those fields exchanged. Ancestry’s collection guidance explicitly recommends this diagnostic [S50]. Inspect the displayed record and image to determine where the index put each name; preserve that field placement in the search log rather than changing the person’s name to fit the index [S54].","sources":["S50","S54"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-soundex-system-lanes","kind":"method","anchor":"Before relying on a Soundex or other sound-alike option, find out which code the field uses.\nAmerican Soundex, the census system the U.S. National Archives describes, always keeps the\nsurname's first letter as a letter [S55]. Spellings that sound alike but begin with different\nletters therefore never share its code: Auerbach is A-612, Ohrbach O-612. Daitch–Mokotoff Soundex\ncodes the first letter as a digit, and JewishGen's coding page gives both names 097500 [S56].\nUnder American Soundex, search each spelling with a different first letter as its own lane, and\nsearch a surname with a prefix such as Van, De or La both with and without it, since the census\nguide codes it both ways (VanDeusen: V-532 or D-250) [S55]. A shared code retrieves candidates;\nit is not evidence that two spellings are one name or that two entries are one person. A\ncommunity blog post offers a shared Soundex code as a way to find sound-alike surnames but names\nno Soundex system [S57].","sources":["S55","S56","S57"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-immigrant-name-inventory","kind":"method","anchor":"Before comparing an immigrant’s names across records, record the original spelling and\npronunciation. Add attested regional nicknames and relevant religious forms, such as Hebrew,\nGreek or Latin forms, to the query inventory [S60]. Use the pronunciation to propose spellings a\nrecorder might have written by ear. Keep those spellings and inferred transliterations in the\ncandidate column [S60, S61].","sources":["S60","S61"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-migration-surname-endings","kind":"method","anchor":"When tracing a surname across a move, build separate queries from the complete forms attested in\norigin and destination records. Use the literal Cyrillic spelling where Russian-language records\nattest it, and keep any added or replaced suffix in the destination spelling [S62, S63].","sources":["S62","S63"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-written-name-abbreviation","kind":"method","anchor":"In historical English-language records, search a written name abbreviation and its supported\nexpansion separately. For `Wm.` or `Wm`, try the written form and `William` [S64, S66]. Keep the\nabbreviation as written in the attestation inventory.","sources":["S64","S66"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-middle-name-field-trials","kind":"method","anchor":"When a search for a deceased person under their usual first and last names fails, keep the\ncollection, place and date filters fixed. Search with the known middle name or nickname as the\nonly given name, keeping the usual surname [S64, S65]. In a separate query, pair the usual given\nname with the known middle name in the surname field [S64, S65]. Check the full record before\nassigning a name role.","sources":["S64","S65"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-medieval-rose-forms","kind":"method","anchor":"When searching for the given name Rose in records from medieval England, test Roese and Rohese\nseparately [S64, S67]. In Latin records from the same period and place, also test Roesia and Rosa\n[S68].","sources":["S64","S67","S68"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-saved-html-encoding","kind":"method","anchor":"**Check damaged text in saved HTML.** When Cyrillic displays as garbled text or replacement\ncharacters, preserve the original bytes. Use a byte-order mark, the saved HTTP `Content-Type`\nif available, and the HTML charset declaration to choose how to decode a working copy [S69].\nCompare a known Cyrillic passage with the browser rendering or another verified reading before\nrerunning the search. If only the damaged text remains and you cannot verify a recovery, record\nthe search as incomplete.","sources":["S69"],"checked":null,"stated_as":"fact","review":"reviewed"}
