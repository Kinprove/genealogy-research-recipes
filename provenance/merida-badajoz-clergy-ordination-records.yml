claims:
  - {"id":"C-bd12f76439f0","kind":"custody","anchor":"Start in the Archivos Eclesiásticos de Mérida–Badajoz, Fondo Diocesano, Secretaría General, Expedientes de órdenes sacerdotales. Open the linked file-level inventory and search by the candidate’s name, then record the box, expediente, date and grade of every match. [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22]","sources":["S1","S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-577c6354f9e8","kind":"method","anchor":"Sweep every box whose date range covers the year, then search within each by expediente number. The box list places 1731–1733 before four boxes dated 1730 and gives both boxes 37 and 38 the range 1860–1862. Keep the box with the expediente number so a reused number selects the right file. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bc9f9d221c18","kind":"portal-availability","anchor":"For 1866–1902, cross-check the candidate in the Libro de órdenes identified in box 88 by the published study as well as in the individual expedientes. The archive’s posted consultation notice excludes expedientes after 1924. Keep any later inventory hit as a locator and check the applicable consultation rules before relying on access. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-37da0382ed0f","kind":"historical","anchor":"Date priestly ordination from the presbyterate entry. Keep each earlier grade and the petition as separate events. In the old Latin Church sequence, distinguish first tonsure, the minor orders of ostiario, lector, exorcista and acólito, and the higher grades of subdiaconado, diaconado and presbiterado. Group entries by identified person before counting clerics and retain individual grades in an event count. [S1], [S3], [S5]","sources":["S1","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c4118eb9a890","kind":"historical","anchor":"For records governed by Ministeria quaedam, effective 1 January 1973, date entry to the clerical state from the diaconate. Read lector and acólito as instituted ministries that can be entrusted to laypeople. Expect no first tonsure or major order of subdiaconate under these rules. Check any local use of subdiácono for an acolyte or separately authorized ministries before comparing sequences. [S1], [S5]","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-89769e464525","kind":"method","anchor":"Open each surviving packet for its baptismal entry, seminary or home-parish conduct certificates, and petition to the bishop. Read the request to present himself for the oposición as an application and look for evidence of the actual grade conferred. Compare attachments across grades and count a resubmitted baptismal entry or certificate as one evidence stream. [S1], [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d79ee1e6dac5","kind":"method","anchor":"After identifying the candidate, search the series for beneficios curados, congruas, retirement files and clergy statistics. Extract the appointment date, parish and type of action from the pertinent series. Use the ordination packet for the grade and the appointment record for where and when he served. [S1], [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
