claims:
  - {"id":"C-89e734312417","kind":"platform-ui","anchor":"Use the Wiki to select a record set. Search for the ancestor in the record set it identifies. According to the presenters, start with the place page and follow its links to the relevant smaller jurisdiction [S1† @2026-11-21]. Search for the historical locality or use the map. For a birth, marriage or death, check Guided Research where its country list includes the locality. Use the guide for the jurisdiction responsible on the event date. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d21fb4482ac1","kind":"platform-ui","anchor":"Open the location page’s record-type and local resources links. Use Online Genealogy Records for database leads and the repository or record-type pages for holdings that have no online link. Read the selected collection’s own scope or the custodian’s description before interpreting a gap. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
