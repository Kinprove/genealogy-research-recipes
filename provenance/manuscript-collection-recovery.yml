claims:
  - {"id":"C-7b200af74710","kind":"unclassified","anchor":"Archives arrange papers by creator or donor. They describe holdings by collection, series, extent and a brief summary, so they seldom index the people named inside the papers [S1], [S17], [S19]. A personal-name search that finds nothing is therefore not a finding. Never report \"no manuscripts exist\" or \"not in this archive\" because a name search failed [S1], [S3], [S21]. You may run the ancestor's name as one facet. Collection-level cataloguing gives name access mainly to creators, donors and prominent subjects, so a name search finds people who were famous or who created or donated a collection, and seldom anyone else [S3].","sources":["S1","S17","S19","S3","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b878d646fed4","kind":"unclassified","anchor":"- **Context register.** Record the ancestor's town, county and state (from smallest to largest); the record types sought, such as tax lists, account books, church records, Bibles or family papers; events the ancestor took part in; religion, ethnicity and occupation; and any agency the ancestor dealt with. Turn each life event into the body that would have made a record. For example, a sharp drop in census-reported wealth between two censuses points to a federal bankruptcy search for that state [S2], [S4], [S18].\n- **Creator register.** List everyone whose papers might hold the ancestor's material:\n  - correspondents, collateral relatives and neighbours;\n  - prominent local people the ancestor lived near;\n  - employers;\n  - congregations and societies the ancestor belonged to;\n  - relatives who moved away and may have kept letters;\n  - the compiler of any published family or local history. The compiler's research papers are a separate target from the book and can hold far more than the book printed [S5], [S9], [S10], [S12], [S15].","sources":["S2","S4","S18","S5","S9","S10","S12","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-429db18bce39","kind":"method","anchor":"Identify the congregation by its historical name and dates using residence or membership records, then look for its registers in the relevant denomination’s catalogue or finding aids. For a Latter-day Saint congregation, search the Church History Catalog by historical ward, branch or stake, record type and period. A person may appear on a page filed under the ward without appearing in the catalogue description [S21], [S66].","sources":["S21","S66"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8cec0a7bb235","kind":"method","anchor":"For a fraternal insurer, search its claim index by the member’s name, then record the claim, certificate and society numbers supplied. In the Polish Roman Catholic Union of America (PRCUA) index, the society number can separate namesakes. Check the claim number against the list of missing files [S67]. Request the whole surviving folder. One researcher found a son’s 1915 application naming his parents inside his later death-claim file [S29]. Cite the applicant and application date separately from the death claim.","sources":["S67","S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dd3f86f55181","kind":"unclassified","anchor":"For an identified Emigrant Industrial Savings Bank account, check whether the actual collection\nseparately describes deposit ledgers and test books. If it does, use the supplied account number\nto look for a test-book entry for that account, checking the entry's own heading and date. The\nACPL presentation distinguishes transaction-ledger material from test books used for security\nquestions; reading a transaction-only ledger does not exhaust that separate target. Keep any\ntest book not located or inspected outstanding. The narrated example does not establish\nstandard fields, identity or current availability. [S33]","sources":["S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a50c91a63395","kind":"method","anchor":"When a parish register ends, search the parish accounts (*Kirchenkassen-Rechnungen*) for the missing years and inspect their enclosures. In two articles on Canditten, Gegner-Sünkler reports that the 1822–1846 accounts named contributors and held an 1824 letter from the pastor to an administrative official [S30], [S31]. The original accounts and letter have yet to be verified. Record a payer only where the account records a payment. The letter reportedly discussed a proposed purchase [S31]. Look for a deed, receipt or other evidence of completion before recording a sale or debt. Keep the contributor list separate from any parish roster.","sources":["S30","S31"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5cd31723f936","kind":"unclassified","anchor":"For a property-change question tied to an identified early-Prussian territorial Amt and\nperiod, check whether the actual local muster-roll inventory includes relevant appendices:\nGegner-Sünkler describes reports of `Besitzveränderungen` among the rolls' `Beilagen`.\nIf the inventory supports that target, request the relevant dated papers rather than limiting\nthe request to names and equipment on the roster. The article's reported contents do not\nestablish ownership, a completed transfer, personal service or a legal duty. [S32]","sources":["S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-39e3a1c0b8a1","kind":"method","anchor":"- a congregation’s denomination, county and state for membership or baptism records [S2]\n- a law or administrative process, such as *Chinese exclusion*, for immigration case files [S1]\n- a jurisdiction and office function, such as *Essex County New Jersey tax*, for a tax-office account book [S4]\n- a record type such as *Bible*, narrowed by family name [S6]\n- an event, place and year such as *Crown Point expedition 1755* for lists of payments to officers [S24].","sources":["S2","S1","S4","S6","S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-415a56d810d6","kind":"unclassified","anchor":"If a town search is thin, widen it to the county and then the state [S4].","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cec0c87557b2","kind":"unclassified","anchor":"For a store or professional ledger, also try `account book`, `journal`, `daybook`, `business papers` and `business records` with the supported creator or place. These are alternate finding-aid labels, not a promise that every business-paper hit contains a ledger; check the description for the dated volume [S28].","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ee73685d9d7b","kind":"method","anchor":"Search without a repository-location filter first. Include the places where relatives settled, as well as the ancestor’s home, and follow a named donor, employer or collector across state lines [S3], [S5], [S9], [S14], [S15]. Apply a geographic filter only after recording the unrestricted query [S3], [S7].","sources":["S3","S5","S9","S14","S15","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f28d2fead57a","kind":"unclassified","anchor":"If a result set is large, switch ArchiveGrid to its summary view and narrow by people/family, place, archive location or topic. Write down the facet state with the result count [S3], [S6], [S7].","sources":["S3","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7c4acc89e5fc","kind":"unclassified","anchor":"- **ArchiveGrid** draws on two inputs: MARC records from WorldCat, and finding aids (EAD, HTML or PDF) harvested from contributing institutions. Any institution can contribute, so OCLC membership is not a condition of inclusion. It is still a mainly United States, non-exhaustive collection-level index, so a miss there says nothing about repositories that have not contributed [S12], [S16].\n- **PAARP**, the Philadelphia-area portal (now branded as the PACSCL finding aids site), includes only finding aids that are electronic and encoded in EAD. Older or unencoded finding aids are absent [S12].\n- **DPLA** holds item metadata and sends you to the contributor's site for the object. A DPLA search matches that metadata; do not count on it to match words inside a document's OCR text. Use its contributing-institution facets, then always repeat the search in each institution's own digital library and finding-aid portal (Archives West in the example) [S13].\n- **Minimally processed collections** are described at folder, series or family level, without lists of the individuals inside. An unlisted name there is \"uninspected\", not \"negative\" [S11].\n- **Regional state-archive catalogues still being filled in.** Forum participants report that Schleswig-Holstein's Arcinsys catalogue does not yet cover every district, so a miss there may be a gap in coverage. To see which record classes the archive holds, check a printed guide to its holdings arranged district by district. For Schleswig-Holstein, the thread names Harry Kunz's *Wegweiser zu den Quellen der Landwirtschaftsgeschichte Schleswig-Holsteins*, published by the Nordfriisk Instituut. A guide shows only that a record class exists, not what it says about anyone [S26].","sources":["S12","S16","S13","S11","S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-27d3d3ed7efe","kind":"unclassified","anchor":"A zero result applies only to that portal, its layer and the query. If a repository plausibly connects to the family's places, or to the places where children lived and died, contact it even if no portal shows anything [S12].","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc935771e11f","kind":"unclassified","anchor":"A catalogue hit tells you that a collection exists and who holds it. It does not tell you what is inside [S6], [S8], [S22]. From each hit, record:","sources":["S6","S8","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b07c356a552b","kind":"unclassified","anchor":"- holding repository and collection title;\n- creator or donor;\n- date span and extent (linear or cubic feet, leaves or items);\n- place covered;\n- surnames listed;\n- any typescript or transcript note;\n- related or digital links;\n- whether the holding is the original or a copy [S6], [S7], [S8], [S15], [S24].","sources":["S6","S7","S8","S15","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b97e80309c4","kind":"method","anchor":"Read the finding aid’s creator, scope and acquisition fields before assigning a role to a name in the title. DACS rule 2.3.23 illustrates a title naming the subject, Isadora Duncan [S34]. UCLA collection 1839 illustrates two other roles: Miriam Matthews collected the Los Angeles newspapers, and Charles Matthews donated them in 2009 [S68]. The lecture attributed the gift to Miriam [S3]. Use the repository’s acquisition note for the donor.","sources":["S34","S68","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c4154c59e0d2","kind":"method","anchor":"Compare each repository’s description of the actual materials. Utah’s *Mormon Settlement in Arizona* collection describes Tanner’s material as including photocopies and transcriptions. A presenter also reported consulting copies at Northern Arizona University [S69], [S15]. Record the holder, reference, extent and whether the particular diary or letter is an original, copy or transcript. Two collections bearing the same name can differ.","sources":["S69","S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b6af230fe5a1","kind":"custody","anchor":"Track custody through the receiving archive’s own notice. The Railroad Retirement Board inactive claims folders moved from Atlanta to Boston. NARA Boston identifies about 54,000 cubic feet of these folders (Storages 8–20) [S35 @2026-11-19]. Atlanta’s transfer notice says Storages 8–15 were unavailable there from April 2026 and directs future requests to Boston [S36 @2026-11-19]. Cite the specific storage and claim reference when known. Volume alone gives neither a headcount nor evidence that a name is indexed [S20 @2026-11-19], [S22 @2026-11-19].","sources":["S35","S36","S20","S22"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9ccaeccf521e","kind":"unclassified","anchor":"Use the union portal mainly to learn the repository's name. Then follow its contact link, or search for the repository's own site, and open its catalogue record or finding aid [S1], [S6], [S7], [S25]. There, read the arrangement, container list and folder or correspondent entries. Navigating finding aids is often not intuitive, so ask the archivist or reference librarian how the collection is arranged [S9].","sources":["S1","S6","S7","S25","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1c67519879de","kind":"unclassified","anchor":"Some finding aids use an unexpected sort key. The Record of Members collection (call number CR 375 8) is arranged alphabetically by unit name. Spell out ward numbers when you browse it: Rasmussen's tip is that a 15th Ward files under F [S23].","sources":["S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fb8ca3376e76","kind":"method","anchor":"Search the contents notes of larger volumes and read the full catalogue record as well as the hierarchy. In the Bavarian state archives database, a participant found Nürnberg council decrees (*Ratsverlässe*), 1520–1604, at folios 101–183r in a copybook’s *Enthält-/Darin* note after the series-name search had failed [S27]. Try the parent chancery, council minutes and inner council. For the Fünfergericht, check the city archive, state archive and special collections separately. Record the catalogue and description level searched for each.","sources":["S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d728e65e8da5","kind":"unclassified","anchor":"- whether the material is stored off site and how long retrieval takes;\n- how much relevant material there actually is, from one folder to many feet [S3];\n- hours, researcher registration, permission or fee requirements, and copy or camera rules. Stacks are closed, so items arrive only by request; NARA, for example, requires a researcher card and pulls records for you [S16], [S19], [S20].","sources":["S3","S16","S19","S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dc96a2e64cd9","kind":"unclassified","anchor":"The presenters describe items that are digital but sit behind a sign-in, and others that can be viewed only on site, or only after an access or digitisation request [S21], [S23]. Record of Members is also being indexed on FamilySearch (collection 3714676), which changes what a name search can reach for that collection. NEHGS holds the April 1755 list of payments to New Hampshire officers for the Crown Point expedition (Mss C 2051). The item is also listed in the free Digital Commonwealth portal. Check every free access route before you pay for a membership or a copy.","sources":["S21","S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0fc74a86a290","kind":"method","anchor":"Request items by collection or call number, box and folder. If staff say they do not hold a described item, give them the catalogue entry, check whether it describes a copy, and ask which department or storage location the reference belongs to. At Northern Arizona, a presenter reported obtaining materials after an initial desk enquiry failed [S15]. Record the repository’s reply and the items actually produced.","sources":["S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e306a6c073f4","kind":"unclassified","anchor":"For a ledger copy request, include the account heading and any linked continuation pages. The article in [S28] describes debit amounts that can continue on another page and a separate payment column. Check the actual volume's labels and page links before treating a partial page as the complete account; no particular debit/credit layout is assumed.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-beee270710b4","kind":"unclassified","anchor":"Keep every candidate in exactly one of three states: **catalogue hit**, **requested**, or **inspected**. Record which boxes or volumes were actually read. Anything unread stays unread, not negative [S17], [S19].","sources":["S17","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-59ee59595191","kind":"unclassified","anchor":"1. A dated query register showing portal, layer, terms, facet state and result counts.\n2. The creator register, with where each creator was searched.\n3. A candidate table: repository, title, creator/donor, dates, extent, place, listed surnames, digital link, original or copy status, and reasons for any exclusion.\n4. Locators for finding-aid entries, with the literal text and dates.\n5. Access conditions and request status, including the current custodian for any transferred series.\n6. A list of uninspected boxes and unrequested leads.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c0e64b621fd9","kind":"custody","anchor":"For a German-speaking family, above all in central Germany, search the compiled-genealogy holdings of the Deutsche Zentralstelle für Genealogie before treating earlier research as absent. In 1967 genealogical holdings from elsewhere were concentrated at the Zentralstelle in Leipzig, and since 2007 it has been Referat 33 of the Sächsisches Staatsarchiv, Staatsarchiv Leipzig [S39 @2026-11-12]. Two of them are finding aids to work done long ago:","sources":["S39"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-109f7354988a","kind":"custody","anchor":"- **Ahnenstammkartei des deutschen Volkes (ASTAKA, holding 21941).** About 1.1 million cards made from pedigree lists (Ahnenlisten), filed by surname in phonetic order and then by place of origin. About 40% concern central Germany, and the entries are densest between 1650 and 1800. It was filmed in 1992 and has had no additions since 1990 [S37 @2026-11-12].\n- **Gesamtkatalog der Personalschriften- und Leichenpredigtensammlungen (in holding 21957, Verein Roland, Dresden).** About 150,000 cards, usable on 16 mm microfilm, recording where funeral sermons and occasional prints are held, not the holdings themselves [S38 @2026-11-12].","sources":["S37","S38"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-58b5b6af3a2d","kind":"method","anchor":"For a family in Russia or the Soviet Union, search Прожито (Prozhito) by the place where a diary was written, then by each surname. Family-donated diaries and memoirs can supply local accounts [S40], [S43], [S44]. One researcher found a diary near her family’s settlement under a surname, but the link to a relative remained uncertain [S41]. The project’s March 2023 guide describes modernized spelling for pre-reform texts and a search mode that shows only matching entries for some recent books [S42]. Record which text you could see before interpreting a miss.","sources":["S40","S43","S44","S41","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-nara-context-within","kind":"platform-ui","anchor":"In NARA’s Catalog, use a known **Record Group Number** or **Collection Identifier** in Advanced Search [S45 @2026-11-16], or narrow results with **Part of Collections** or **Part of Record Groups**. Open the relevant description and use **Search within this** for the group, collection or series [S46 @2026-11-16]. Run a personal-name query alongside this context search when useful; a name miss does not search every described file. Copy each level’s actual reference rather than manufacturing a series number by adding a decimal to the record-group number [S47 @2026-11-16].","sources":["S45","S46","S47"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nucmc-printed-layer","kind":"portal-availability","anchor":"- **NUCMC**, the Library of Congress's National Union Catalog of Manuscript Collections. Its printed volumes, 1959–1993, describe about 72,300 collections reported by 1,406 repositories and index personal and family names [S49 @2026-11-16]. Its records in WorldCat start in 1986, and the 1959–1985 reports are not there, so a WorldCat or ArchiveGrid miss does not cover them [S50 @2026-11-16]. Search those years in the printed volumes, in the *Index to Personal Names in the National Union Catalog of Manuscript Collections, 1959–1984* [S49 @2026-11-16], or in ArchiveFinder, a subscription database that contains NUCMC from 1959 to 2006 [S51 @2026-11-16]. Look up each family surname there, not only the individual, to catch family-papers collections; a presenter in [S48 @2026-11-16] (partial read of a transcript extract) checks for family papers under the surname this way. A NUCMC entry reports a collection held by the reporting repository, not by the Library of Congress, so trace it to that repository [S50 @2026-11-16]. The Library sunset the program as of 31 May 2026 [S52 @2026-11-16], [S53 @2026-11-16].","sources":["S49","S50","S51","S48","S52","S53"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-antebellum-plantation-film","kind":"portal-availability","anchor":"For a family in the antebellum South, including enslaved people and overseers, search the microfilm edition *Records of Ante-Bellum Southern Plantations from the Revolution through the Civil War* (University Publications of America); a presenter in [S48 @2026-11-16] (partial read of a transcript extract) uses it routinely for Southern families. It reproduces selected collections from Southern state archives and university and historical-society libraries in lettered series, each drawn from one or more repositories. Most of the material comes from larger tobacco, cotton, sugar and rice plantations between the War of 1812 and the Civil War: business records, account books, slave lists, overseers' reports, diaries and private letters. Most records dated after 1865 were left out [S54 @2026-11-16]. Look up the county, the plantation name and each planter's surname in Jean L. Cooper's *Index to Records of Ante-Bellum Southern Plantations* (2nd ed., 2009), an index to the series guides by location, plantation, surname and collection title [S55 @2026-11-16]. Then read the printed guide for that series and part: its reel index gives each collection's contents and omissions, so note the reel there before requesting film [S54 @2026-11-16]. Cooper indexes the guides, not every name on the film, and each series is a selection from its repository, so a miss leaves both the film and the original repository's own finding aid unsearched. A library may hold only part of the set: the University of Arkansas owns one part, says reels may be requested through interlibrary loan, and lists no online option for the set [S56 @2026-11-16]. For the years after emancipation, check the separate microfilm set *Records of Southern Plantations from Emancipation to the Great Migration*; the library listing that names it gives no date range [S57 @2026-11-16]. Record the reel and the original repository's collection as separate holders, as for any copy.","sources":["S48","S54","S55","S56","S57"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-private-deed-of-gift","kind":"method","anchor":"For a possible lifetime land transfer, search the landholding family’s legal and financial papers under both parties to the gift. An unrecorded deed of gift was reported among one family’s private papers [S58], [S59]. Look for the dated instrument and compare the parties and parcel before recording the transfer.","sources":["S58","S59"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-pa-coal-company-guide","kind":"portal-availability","anchor":"For a Pennsylvania coal superintendent, use the employer named in the obituary to check the Pennsylvania State Archives' *Coal Miner Records* guide. Follow any matching company entry to its manuscript-group description [S64 @2026-11-18]. The livestream presenter suggests starting at the State Archives, according to the transcript [S60† @2026-11-18]. Check the company description for the relevant operation and employment years before treating it as a lead about the superintendent.","sources":["S64","S60"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-coal-company-successors","kind":"method","anchor":"Search the historical company name for mergers and successor names, then search catalogues under each documented name. The livestream presenter suggests tracing the company's ownership to find its business papers, according to the transcript [S60†]. Some of the Pennsylvania Coal Company's papers reached the archives through its parent railway [S65]. Confirm the collection and dates in the holding repository's own description before assigning custody from a company history.","sources":["S60","S65"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-plantation-auction-custody-lead","kind":"method","anchor":"For a missing plantation account book, search auction catalogues by estate, planter and the volume’s dates. Save the sale date, lot number and description [S61]. A recorded sale may be the last public locator when the buyer’s name is unavailable, as a researcher reported in the livestream transcript [S60†]. Check for a later donation or resale before assigning current custody.","sources":["S61","S60"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-virginia-plantation-repository-search","kind":"portal-availability","anchor":"For a plantation account book from Virginia's Fauquier–Loudoun area, search Duke's Rubenstein Library and the University of Virginia's Special Collections directly after an ArchiveGrid miss. The livestream presenter suggests both, according to the transcript [S60† @2026-11-18]. Search by planter and plantation in Duke's collection guides [S59 @2026-11-18], using its Virginia plantation account-book listing as a model [S62 @2026-11-18]. At the University of Virginia, also check its section of *Afro-American Sources in Virginia* for collection titles and accession numbers [S63 @2026-11-18]. Confirm a promising lead against the repository's own description.","sources":["S60","S59","S62","S63"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-private-community-papers","kind":"method","anchor":"If catalogues turn up little about a former local community, ask a town resident the user already knows whether they know of privately held books or papers from that community, including material found during renovations [S70], [S71]. Record the reported findspot and check inscriptions or other ownership marks before assigning earlier ownership.","sources":["S70","S71"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dday-veteran-correspondence","kind":"platform-ui","anchor":"For a U.S. D-Day veteran’s private letters, search the Library of Congress’s **Veterans History Project** by the veteran’s name. Also try the World War II limit with the known unit or campaign. Run the name search without a battle filter as well, since a collection description may omit battles [S73 @2026-11-20]. Open the veteran’s collection and check for correspondence and diaries alongside interviews [S74 @2026-11-20]. Check military archives, veterans’ organisations and hometown historical societies for personal papers as well [S72 @2026-11-20].","sources":["S73","S74","S72"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-store-ledger-library-probate","kind":"method","anchor":"Search the local library’s manuscript or local-history holdings for store ledgers, as Sheliga suggests according to the interview transcript [S75†]. Search by store and storekeeper, or by town when the creator is uncertain [S77]. Also look up the deceased storekeeper in the county probate index or register of actions, and use the case number to locate the full estate file [S76]. Inspect the inventory and supporting papers for itemised accounts of debts owed to the estate. Look for dated entries naming the customer and listing the goods [S77]. A balance alone leaves the goods unknown.","sources":["S75","S77","S76"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-genealogist-working-notes","kind":"method","anchor":"Use a genealogist’s deposited working notes as leads, as Jacobus advises according to the chapter transcript [S78†]. For each assertion, extract the source’s title and locator, then compare the assertion with the cited manuscript or printed record. Keep assertions without a traceable source open. Search by family and by record type. The *Jacobus Collection* (MSS 101) inventory lists family notes in Box XIV and describes the Stratford vital-record copy separately in folder E [S79].","sources":["S78","S79"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-member-meeting-minutes","kind":"method","anchor":"For a known member, search under the organisation’s historical name for meeting minutes covering their membership. Look for named motions, recorded votes and remarks attributed to the member [S80], [S81]. Record the meeting date and page. Attribute summaries to the minutes and leave the member’s position open when the entry gives only the group’s decision.","sources":["S80","S81"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-worldcat-manuscript-fallback","kind":"portal-availability","anchor":"After a WorldCat miss for a rare original, search manuscript catalogues, as Morton suggests according to the interview transcript [S86† @2026-11-21]. Search the likely repository’s own finding aids by creator, place and date, and try ArchiveGrid for its harvested finding aids [S88 @2026-11-21]. WorldCat includes manuscript records [S87 @2026-11-21]. Log the miss against the WorldCat query alone.","sources":["S86","S88","S87"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-farm-journals-harvest-entries","kind":"method","anchor":"When researching an enslaved person, check any available landholding family papers for farm journals, as Fulton suggests according to the interview transcript [S84†]. In harvest entries, look for the worker’s name alongside the crop or assigned work. Record the name as written, the crop or task, the entry date and the page [S85]. Keep farm-wide totals separate from the work recorded for named individuals.","sources":["S84","S85"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-tree-leads-through-marriage","kind":"example","anchor":"Keep the owner of a relevant tree on the list of possible holders even when the connection runs through a relative’s spouse. In one such case, a MyHeritage tree owner shared family photographs and documents [S82].","sources":["S82"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-tree-owner-private-contact","kind":"platform-ui","anchor":"Check whether the user’s MyHeritage account offers private messaging for that tree lead. If it does, ask the tree owner about photographs or papers relating to the deceased ancestor [S83 @2026-11-21].","sources":["S83"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-diary-local-context","kind":"method","anchor":"When the family’s own letters or diaries are missing, follow Family Tree Magazine’s suggestion to search for other writers from the same place and period [S89]. Match the writer’s community or occupation where it matters. Use the account for local context and leave the ancestor’s experience open.","sources":["S89"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-outgoing-letter-recipient-papers","kind":"method","anchor":"For a letter sent about a planned move or job change, search the recipient’s incoming correspondence by sender and date even after finding the sender’s papers [S93]. Kyläkoski traces Emil Vainio’s March 1899 plans to `Erkko, Eero Da:5:11` at Merkki [S92]. Look separately for evidence that the move or job change took place.","sources":["S93","S92"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-private-papers-relative-biography","kind":"example","anchor":"If the person has no biography of their own, check a close relative’s biography for manuscript citations. Copy the collection wording and any holder named, and treat that holder as a lead dated to the account. Kyläkoski traces a reference to Aina Gebhard’s letters and other papers through the sources of her brother’s biography [S91].","sources":["S91"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-archivegrid-boolean-procedure","kind":"platform-ui","anchor":"Refine the ArchiveGrid query as shown according to the supplied tour transcript [S94† @2026-11-22]. Quote a phrase only when adjacency and order matter. Use uppercase `AND` for required terms, `OR` for alternatives, and parentheses to group alternatives before applying uppercase `NOT` [S95 @2026-11-22]. Save the unrestricted search before excluding anything. Check that the exclusion preserves plausible hits, since a description can mention both the target and the excluded subject.","sources":["S94","S95"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-draper-guide-calendar-film","kind":"method","anchor":"For the Revolutionary-era Trans-Appalachian frontier, start with Josephine Harper’s *Guide to the Draper Manuscripts* and use the calendars and published documentary volumes as finding aids, as the presenter suggests according to the supplied transcript [S96†]. Use the guide to identify series, then search a matching calendar’s name or place index and follow the abstract to its series, volume and page [S97], [S98]. Check inside the *Calendar of the Frontier Wars Papers* for the David Shepherd, South Carolina, and South Carolina in the Revolution Miscellanies calendars [S107]. Follow the resulting locator to the manuscript film and distinguish Draper’s notes or interviews from original documents [S99]. *Warrior-Pioneers* includes selections from Boone Papers volumes 4C–13C [S100]. Search the Series C film for omitted material both within and outside that span [S99]. For a Mecklenburg Declaration lead, also check the Mecklenburg Declaration Papers (GG) and Miscellanies (HH) on the film after a published-extract miss [S99].","sources":["S96","S97","S98","S99","S100","S107"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-privately-published-history-inside-papers","kind":"method","anchor":"When a privately issued family history is absent from a repository’s main catalogue, follow Family Tree Magazine’s advice to search its local-history indexes and inventories of donated research collections and personal papers [S90]. Search under the compiler as well as the title and family, and trace the compiler’s papers or personal library. Look in the container list for the actual copy [S93].","sources":["S90","S93"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-incorporated-papers-donor-search","kind":"custody","anchor":"If a donor-name search misses, look in the recipient archive’s acquisition and scope notes under the original creators, correspondents and estates. According to Kyläkoski’s supplied account, the family archive was a way past a donor-name miss [S101† @2026-11-22]. The National Library of Finland’s *Gezelius-Olivecreutz-sukuarkisto* description identifies Tamelander’s donation there and names the Gezelius and Helena Arnell correspondence and the Qvistan estate papers [S102 @2026-11-22]. Record the enclosing collection and the actual series or item locator.","sources":["S101","S102"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-missing-inventory-entry-transfer-trail","kind":"example","anchor":"If an old inventory calls an item missing and a transfer account identifies a receiving archive, search the receiver’s own series and compare its acquisition note with the historical account. Kyläkoski traces a Godegård manuscript she describes as missing in the Vadstena inventory through the transfer account in *Akti* 1/2011 to the Finnish parchment collection and Astia reference `1510440344` [S103]. Record each asserted transfer with its source and leave gaps open.","sources":["S103"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-historical-employer-personnel-series","kind":"method","anchor":"For a former employee’s duties or career, look in the employer’s historical papers for a personnel series, as Genealogia Familiare suggests [S104]. Read its arrangement, then check the employee files for the relevant operation and years before treating the employer’s general correspondence as the whole search. One company finding aid separates those files from strike and performance records [S105].","sources":["S104","S105"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-draper-print-volume-boundaries","kind":"method","anchor":"Use separate Draper publications as finding aids, as the presenter suggests according to the supplied transcript [S96†]. Check each title’s volume boundary. For the Bedinger Papers and the *Georgia, Alabama, and South Carolina Papers*, the listed editions cover 1A and 1V, respectively [S106]. For the Pittsburgh and Northwest Virginia Papers, look for Karen Mauer Green’s Series NN index [S107]. Use the film for the underlying entry and for unindexed material [S106].","sources":["S96","S106","S107"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-peter-force-draper-alternative","kind":"method","anchor":"For a French and Indian War manuscript, check the Library of Congress’s *Peter Force Papers and Collection* as well as Draper, as the presenters suggest according to the supplied transcripts [S96†], [S108†]. Search within the Force finding aid for the campaign or place and check the French and Indian War entries. Search for descriptions without a personal name. The Lake George journal of an unidentified soldier is item `13.1` in Series VII, Box `VII E:4`, reel `3`, and is described in the transcripts series [S109].","sources":["S96","S108","S109"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-proxy-marriage-diary-subject","kind":"portal-availability","anchor":"For the context of an Italian emigrant’s proxy marriage, use the diary catalogue lead suggested by Genealogia Familiare according to the supplied excerpt [S110† @2026-11-22]. Search the Archivio Diaristico Nazionale catalogue under `Matrimonio per procura` for memoirs, diaries and premarital correspondence [S111 @2026-11-22]. Use those descriptions as leads to accounts of the marriage and verify registration separately.","sources":["S110","S111"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-engelbrecht-ledger-indexes-and-diary","kind":"method","anchor":"For a Frederick, Maryland lead, distinguish Engelbrecht’s printed ledgers from the diary, as the presenter advises according to the supplied transcript [S113†]. Use the marriage and death volumes’ name and place indexes. Read the death entry for the place actually recorded because the ledger includes events outside Frederick [S114]. In the property and almshouse volume, check the property section for transactions and the almshouse section for resident entries [S114]. For an early ledger entry, look up the same event in the diary and cite each version separately [S114], [S115].","sources":["S113","S114","S115"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-romanian-teacher-monograph-inventories","kind":"method","anchor":"For a Romanian village or school history, follow Genealogica’s lead into teachers’ professional papers. Search the village, school or teacher under `monografie` and `lucrare personală` in the education ministry inventories [S112]. In the ANIC list, check *Ministerul Culturii Naționale și al Cultelor*, inventories 1071–1074 and 2208 [S116]. In inventory 2208, file 2235 provides the Săvinești example [S117]. Search the school and village headings within each located text for names, occupations and local institutions.","sources":["S112","S116","S117"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-teacher-monograph-submission-context","kind":"method","anchor":"When an inventory or file identifies a village monograph as work submitted for a teaching grade, record that purpose beside the author and date [S112], [S117]. Check claims about the teacher’s work against the school or inspection records. Treat its description of the village as the teacher’s account.","sources":["S112","S117"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-chmielow-estate-transaction-series","kind":"portal-availability","anchor":"For a Chmielów household, search estate records, as Paczkowski suggests according to the supplied excerpt [S118† @2026-11-22]. Open the Chmielów subseries of *Akta obce. Chmielów i Mokrzyszów w rękach prywatnych*, fonds `29/639/0` at the National Archives in Kraków [S119 @2026-11-22]. In series `3.6`, check the named rows in the building-materials register (`1249`), meadow leases (`1251`), and the list of obligations cancelled for compensation in Alfredówka and Chmielów (`1255`) [S119 @2026-11-22]. Keep the meadow leases in scope even when the other units yield no name. Record which transaction types and years each search covered.","sources":["S118","S119"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-letter-survival-and-relationship","kind":"method","anchor":"Check a relationship suggested by correspondence against evidence of visits, shared activities or references in other papers before assigning closeness from the volume of surviving letters. The counterexample reported in Kyläkoski’s supplied excerpt is documented by Kokko’s comparison of Volter Kilpi’s sparse correspondence with his close friend Juhani Siljo and his abundant correspondence with the less close Kaarlo Atra [S120†], [S121].","sources":["S120","S121"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-berg-goteborg-surname-volume-fallback","kind":"method","anchor":"For a historical Göteborg family, use the surname index to trace entries in Wilhelm Berg’s *Genealogiska anteckningar om Göteborgs-släkter* [S122]. If the digital copy cannot be opened, match the surname against the volume ranges in both series of the `H 51` finding aid. Record each matching `H 51` volume number and check for the separate person index listed for Landsarkivet i Göteborg [S123].","sources":["S122","S123"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-finnish-economic-society-locality-descriptions","kind":"portal-availability","anchor":"For Finnish locality descriptions, start with Åbo Akademi’s introduction to the Finnish Economic Society archive and open its full catalogue [S125 @2026-11-23]. Check `D VII` (*Sockenbeskrivningar*) and also `D VI:3` under *Prisskrifter* for the locality [S124 @2026-11-23], [S126 @2026-11-23]. Match the unit reference in Doria’s digitised collection and keep catalogue units without a scan on the search list [S127 @2026-11-23].","sources":["S125","S124","S126","S127"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-economic-society-d-vii-7-title-mismatch","kind":"example","anchor":"Browse `D VII:7` from the opening pages and follow the locality headings inside the volume [S124 @2026-11-23]. The archive catalogue leads with *Beskrivning över Helsingfors samt andra städer*, while Doria’s record for the same unit names Padasjoki in its title [S126 @2026-11-23], [S128 @2026-11-23].","sources":["S124","S126","S128"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
