claims:
  - {"id":"C-02b42901be70","kind":"unclassified","anchor":"Use when a newspaper item, family paper or other lead suggests an ancestor was in a federal\nlawsuit, criminal case, bankruptcy or appeal. The task is to take that lead to the right federal\ncourt for the period, then to the National Archives record group and its index, and to request\nthe loose case file and the related series. Naturalization has its own court table and index\nroute in [immigration search recovery § 9](usa-immigration-search-recovery.md),\nso use that recipe for it. To build the newspaper lead, use [newspaper search recovery](newspapers-com-search-recovery.md).\nTo transcribe the papers with an AI tool, use [AI for documentary records](ai-for-documentary-records.md).\nIdentity rulings belong in [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-79479831e787","kind":"unclassified","anchor":"Decide whether the matter is federal before you search a county courthouse or a large genealogy\ndatabase. Under current law, bankruptcy is a federal matter: James Tanner says the federal\ngovernment \"has preempted all bankruptcy\", so \"now it's a federal action\" that cannot be filed in\na local court [S1]. He also says these files generally are not in Ancestry, FamilySearch or other\nlarge genealogy databases. In his account they are held by the National Archives or other\nrepositories and may be closed or hard to reach [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-223368a04629","kind":"unclassified","anchor":"Tanner describes the present position. Do not assume it held on every historical date. Before\nyou treat a county search as the wrong place, check whether a federal bankruptcy act was in\nforce on the date of the lead. Federal acts were in force from 1800 to 1803, from 1842 to 1843\nunder the act of 1841, from 1867 to 1878, and continuously from 1898 [S5], [S6]. The\npresenter's 1867 bankruptcy [S2] falls under the Bankruptcy Act of 1867. If a federal act\napplied, a failed bankruptcy search in county probate, civil indexes or a large database is a\nsearch of the wrong place, not a negative result. If no federal act applied on that date, the\ncounty search is not ruled out.","sources":["S5","S6","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-96f437444031","kind":"unclassified","anchor":"Record the lead's literal wording: the person, the other parties, the date, the city where the\ncourt sat and the type of action. A report that someone \"appeared in court\" in a city with a\nfederal court is not enough by itself. Confirm from the lead or the court's own records that the\ncourt was federal. In the teaching example, a newspaper report of a court appearance in Pittsburgh\nled to a suit in the federal Western District of Pennsylvania [S3].","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-23634d89c7ec","kind":"unclassified","anchor":"The federal courts had four levels [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f76be7252d4a","kind":"unclassified","anchor":"- **District courts** were the trial courts. Their jurisdiction included admiralty, equity,\n  bankruptcy and naturalization. Their start dates vary by area; the presenter ties each to the\n  creation of its state [S2]. Find the creation date for the district that covers the lead's place.\n- **Circuit courts** were established in 1789 and exercised appellate jurisdiction until 1891,\n  when it passed to the circuit courts of appeals. The presenter says they also heard federal\n  matters, especially criminal ones [S2]. They were abolished by the Judicial Code of 1911,\n  effective 1 January 1912, and their jurisdiction, records and pending cases passed to the\n  district courts.\n- **Circuit courts of appeals** were established in 1891 and heard appeals from both district and\n  circuit courts.\n- **The Supreme Court** was established in 1789.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2ac0f6eeb1be","kind":"unclassified","anchor":"For a matter before 1912, search both district and circuit court records unless the lead names\nthe court. An appeal does not stay with the trial file. Route it by the court that heard the\nappeal on its date. Before 1891 the circuit courts heard appeals themselves, and those records\nare in RG 21. From 1891 the circuit courts of appeals heard them, and their records are in\nRG 276. Appeals to the Supreme Court are in RG 267. The circuit courts of appeals had different\ngeographic jurisdictions from the trial courts [S2], so an appeal from 1891 on may be held for\nanother state. Look up the appellate circuit that covered the trial district on the appeal date\nbefore you name a custodian.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7a352a637488","kind":"unclassified","anchor":"Use this crosswalk [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-360b268865cc","kind":"unclassified","anchor":"The record group number is stable. What you must look up each time is the NARA facility that\nholds the specific district's records, because it is often not in the city where the court sat.\nWestern District of Pennsylvania records are held at NARA's Philadelphia facility, not in\nPittsburgh. That is where the teaching file, a suit, came from [S3]. Bankruptcy is the\nexception: NARA says all bankruptcy case files are at the National Archives at Kansas City\n[S4], in RG 21 or RG 578. That includes historical files. Kansas City's RG 21 lists include\ncases under the 1800, 1841 and 1867 acts, and NARA's finding aid for the Frankfort, Kentucky,\ncases from 1842 says they have moved to Kansas City [S7], [S8]. Some older NARA pages still\ngive the old location, so check the series' Catalog entry or Kansas City's list before you\norder. The presenter's Philadelphia bankruptcy retrieval [S2] shows where the file was then,\nnot where it is now. Treat the bankruptcy index as a separate request, because dockets and\nindexes can stay at another facility. NARA's RG 21 description lists the W.D. Pa.\nPittsburgh Division bankruptcy indexes and docket books among the Philadelphia textual\nrecords. Ask Philadelphia for the index first, then request the case file from Kansas City\nwith the reference copied from it. Kansas City asks for the court, the case number, the\nparties and the period; for a case filed in 1940 or later it also needs a Federal Records\nCenter transfer number, which comes from the court. If the court no longer has that number\nbecause the case is old, say so in the request [S4].","sources":["S3","S4","S7","S8","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-21eff9eceedb","kind":"unclassified","anchor":"Expect to work mostly with originals. The presenter says very little of this material was filmed\n[S2]. NARA does have a microfilm catalog for federal court records, and some RG 267 series are on\nfilm, so check that catalog before you plan a visit.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-060717c1966f","kind":"unclassified","anchor":"Do not ask for a case file by name. The presenter could not get a bankruptcy file in Philadelphia\njust by naming the person. He went through the finding aids, requested the index books, found the\nname, copied the file reference and then requested the file [S2]. Do the same:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-83adea40e5c7","kind":"unclassified","anchor":"1. Find the record group's finding aid and identify the index or docket that covers the court,\n   the type of action and the period. Check the dates covered: for the Western District of\n   Pennsylvania, Pittsburgh Division, NARA's RG 21 description lists bankruptcy indexes for\n   1898–1947 and 1969–80 and docket books for 1939–79. A date outside an index's span needs\n   another series.\n2. Search it, and copy the exact entry: case number, term, volume and page, and the spelling as\n   written.\n3. Request the case file with that reference.\n4. If the index and the file are in different record groups, make a separate request for each.\n   The presenter reported in 2019 that different record groups were pulled at separate pull\n   times [S2]. Ask the facility for its current retrieval schedule.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3062c226d110","kind":"portal-availability","anchor":"Book before you go. The presenter's 2019 description of walk-in, same-day service is out of date\nfor Philadelphia. Its page, checked 2026-11-07, lists the research room as appointment-only, Monday to Friday,\n9 a.m. to 4 p.m., and gives <philadelphia.archives@nara.gov> and 215-305-2044. [S9 @2026-11-07]\nRecheck those hours and contact details before booking. For any other facility,\ncheck its current page for appointment and remote-request rules.","sources":["S9"],"checked":"2026-11-07","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c143f47cb078","kind":"unclassified","anchor":"A docket entry tells you that a case existed. It does not hold the case papers. List each series\nthat applies and mark it retrieved, requested, not found or not yet searched [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ef058b19fab1","kind":"unclassified","anchor":"- **Docket** (court calendar): lists the cases heard.\n- **Minutes**: the clerk's brief daily record of court actions, such as appeals or appointments.\n- **Orders**: specific judgments, for example an order granting citizenship.\n- **Briefs**: the parties' written arguments.\n- **Mandates**: the presenter describes these as a criminal defendant's undertaking in exchange\n  for a suspended sentence [S2]. Do not rely on that as a definition. Read the series description\n  in the finding aid and record what the mandate series for your court actually contains.\n- **Loose case file**: the largest body of papers, sometimes tied in a bundle.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6678a6d1cb62","kind":"unclassified","anchor":"Keep each series' locator separate. In the teaching example, the loose file was handwritten on\nlined paper and covered a suit that started in the 1870s and ran until 1881 [S3]. Note the full\nspan of dates in the papers rather than only the filing date.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1aab9c4c4515","kind":"unclassified","anchor":"If the expected person is not in an index you searched from beginning to end, record the index\ntitle, the court, the date range covered and the spellings you searched. That is a bounded\nnegative. It does not show that no family member was involved. Search the same index for every\nrelative living in the same period. The presenter found no entry for the ancestor named in the\nnewspaper lead. He then found a bankruptcy for a different ancestor, a farmer who had briefly run\na general store [S2]. The file you find may belong to a different family member than the lead\nsuggested. Keep the new person's identity open until it is correlated through the proof recipe.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9e1f30158cb7","kind":"unclassified","anchor":"- **Bankruptcy schedules:** extract each creditor's name and street address, the amount owed and\n  the goods the debt was for. The presenter's schedule listed page after page of wholesale\n  creditors and a total of almost $10,000 in debt in 1867 [S2].\n- **Suits:** record each co-defendant and plaintiff. The teaching suit named a co-defendant and a\n  sewing-machine company as plaintiff [S3]. Also record any sureties or guarantors that appear in\n  the papers.","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6a8c272563ab","kind":"unclassified","anchor":"Use these entries to look for local records. The presenter found a business licence listed in a\nlocal newspaper, which gave the township where the store stood [S2]. Each associate gets a\nseparate search. A creditor or co-defendant is not a relative unless other evidence shows it.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-26d8e53eb9ef","kind":"unclassified","anchor":"If access is closed or the file is not found, the index entry is still a lead. Name the next\nseries or custodian to try.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb2013d45500","kind":"method","anchor":"- **A lead that names a judge but no court:** do not give up on the case or turn to state courts. If the judge was a federal judge nominated by the President and confirmed by the Senate, search the name in the Federal Judicial Center's Biographical Directory of Article III Federal Judges, whose entries give the federal court or courts served [S10], [S11], [S13]. Then use the National Archives' Guide to Federal Records to locate that court's records: RG 21 for district and circuit courts, RG 276 for courts of appeals and RG 267 for the Supreme Court [S12].","sources":["S10","S11","S12","S13"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-57ffbe7ccacb","kind":"custody","anchor":"In the Southwest, NARA splits a state between facilities by area. Riverside holds records of\nfederal courts and agencies in Arizona, southern California and Clark County, Nevada; San\nFrancisco holds northern and central California, Nevada outside Clark County, and Hawaii;\nDenver holds Colorado, New Mexico and Utah, as well as Montana, the Dakotas and Wyoming\n[S14 @2026-11-12], [S15 @2026-11-12], [S16 @2026-11-12], [S17 @2026-11-12]. NARA says the San\nFrancisco and Chicago facilities will close within the next few years. Its August 2026 plan\nsends San Francisco's court records (RG 21, RG 276 and RG 578) and Chicago's RG 21 and RG 578 to\nKansas City, and says the records stay open to researchers in their new locations\n[S16 @2026-11-12], [S18 @2026-11-12]. California sued on 14 October 2026 to\nblock the closure [S19 @2026-11-12]. For a case from a district that San Francisco or Chicago\nserved, do not route the request there by default: check the series' Catalog entry and NARA's\nResearcher Updates page for where the files are now [S18 @2026-11-12].","sources":["S14","S15","S16","S17","S18","S19"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
