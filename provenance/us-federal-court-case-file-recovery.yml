claims:
  - {"id":"C-02b42901be70","kind":"unclassified","anchor":"Use when a newspaper item, family paper or other lead suggests an ancestor was in a federal\nlawsuit, criminal case, bankruptcy or appeal. The task is to take that lead to the right federal\ncourt for the period, then to the National Archives record group and its index, and to request\nthe loose case file and the related series. Naturalization has its own court table and index\nroute in [immigration search recovery § 9](usa-immigration-search-recovery.md),\nso use that recipe for it. To build the newspaper lead, use [newspaper search recovery](newspapers-com-search-recovery.md).\nTo transcribe the papers with an AI tool, use [AI for documentary records](ai-for-documentary-records.md).\nIdentity rulings belong in [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-79479831e787","kind":"unclassified","anchor":"Decide whether the matter is federal before you search a county courthouse or a large genealogy\ndatabase. Under current law, bankruptcy is a federal matter: James Tanner says the federal\ngovernment \"has preempted all bankruptcy\", so \"now it's a federal action\" that cannot be filed in\na local court [S1]. He also says these files generally are not in Ancestry, FamilySearch or other\nlarge genealogy databases. In his account they are held by the National Archives or other\nrepositories and may be closed or hard to reach [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-223368a04629","kind":"historical","anchor":"Check whether a federal bankruptcy act covered the filing date. Federal acts operated from 1800 to 1803, from 1842 to 1843 under the act of 1841, from 1867 to 1878, and continuously from 1898 [S5], [S6], [S21], [S22]. The 1867 act permitted no petition before 1 June [S25]. During a federal act, search the federal court for the bankruptcy petition. Between acts, check state insolvency proceedings and the court that heard them.","sources":["S5","S6","S21","S22","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-96f437444031","kind":"method","anchor":"Transcribe the court name, parties, date, city and action from the newspaper notice. Where the notice names just a city, compare its parties and date with the court docket or case caption. Allen traced a Pittsburgh appearance to a federal suit in the Western District of Pennsylvania [S3].","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-23634d89c7ec","kind":"unclassified","anchor":"The federal courts had four levels [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f76be7252d4a","kind":"unclassified","anchor":"- **District courts** were the trial courts. Their jurisdiction included admiralty, equity,\n  bankruptcy and naturalization. Their start dates vary by area; the presenter ties each to the\n  creation of its state [S2]. Find the creation date for the district that covers the lead's place.\n- **Circuit courts** were established in 1789 and exercised appellate jurisdiction until 1891,\n  when it passed to the circuit courts of appeals. The presenter says they also heard federal\n  matters, especially criminal ones [S2]. They were abolished by the Judicial Code of 1911,\n  effective 1 January 1912, and their jurisdiction, records and pending cases passed to the\n  district courts.\n- **Circuit courts of appeals** were established in 1891 and heard appeals from both district and\n  circuit courts.\n- **The Supreme Court** was established in 1789.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2ac0f6eeb1be","kind":"unclassified","anchor":"For a matter before 1912, search both district and circuit court records unless the lead names\nthe court. An appeal does not stay with the trial file. Route it by the court that heard the\nappeal on its date. Before 1891 the circuit courts heard appeals themselves, and those records\nare in RG 21. From 1891 the circuit courts of appeals heard them, and their records are in\nRG 276. Appeals to the Supreme Court are in RG 267. The circuit courts of appeals had different\ngeographic jurisdictions from the trial courts [S2], so an appeal from 1891 on may be held for\nanother state. Look up the appellate circuit that covered the trial district on the appeal date\nbefore you name a custodian.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7a352a637488","kind":"unclassified","anchor":"Use this crosswalk [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-360b268865cc","kind":"custody","anchor":"Use the court, division and series to identify the facility. NARA’s RG 21 guide lists Pittsburgh Division civil files in Philadelphia and lists its bankruptcy indexes and docket books separately [S23 @2026-11-19]. For files accessioned as permanent records, NARA says all bankruptcy case files are at the National Archives at Kansas City [S4 @2026-11-19], in RG 21 or RG 578 [S20 @2026-11-19]. For example, the Frankfort, Kentucky, finding aid directs researchers to Kansas City for cases beginning in 1842 [S7 @2026-11-19], [S8 @2026-11-19]. Recent files may still be with the court or a Federal Records Center. Check the series entry and transfer status before ordering [S20 @2026-11-19].","sources":["S23","S4","S20","S7","S8"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-21eff9eceedb","kind":"unclassified","anchor":"Expect to work mostly with originals. The presenter says very little of this material was filmed\n[S2]. NARA does have a microfilm catalog for federal court records, and some RG 267 series are on\nfilm, so check that catalog before you plan a visit.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-060717c1966f","kind":"method","anchor":"If you have only a name, start with the finding aid for the court and filing period. Use its index or docket to obtain the case reference before requesting the papers [S2], [S20].","sources":["S2","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-83adea40e5c7","kind":"unclassified","anchor":"1. Find the record group's finding aid and identify the index or docket that covers the court,\n   the type of action and the period. Check the dates covered: for the Western District of\n   Pennsylvania, Pittsburgh Division, NARA's RG 21 description lists bankruptcy indexes for\n   1898–1947 and 1969–80 and docket books for 1939–79. A date outside an index's span needs\n   another series.\n2. Search it, and copy the exact entry: case number, term, volume and page, and the spelling as\n   written.\n3. Request the case file with that reference.\n4. If the index and the file are in different record groups, make a separate request for each.\n   The presenter reported in 2019 that different record groups were pulled at separate pull\n   times [S2]. Ask the facility for its current retrieval schedule.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3062c226d110","kind":"portal-availability","anchor":"Arrange the visit directly with the facility. Philadelphia lists its research room as appointment-only, Monday to Friday, 9 a.m. to 4 p.m., and gives <philadelphia.archives@nara.gov> and 215-305-2044 [S9 @2026-11-19]. Recheck the hours and booking instructions before travelling.","sources":["S9"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c143f47cb078","kind":"unclassified","anchor":"A docket entry tells you that a case existed. It does not hold the case papers. List each series\nthat applies and mark it retrieved, requested, not found or not yet searched [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ef058b19fab1","kind":"unclassified","anchor":"- **Docket** (court calendar): lists the cases heard.\n- **Minutes**: the clerk's brief daily record of court actions, such as appeals or appointments.\n- **Orders**: specific judgments, for example an order granting citizenship.\n- **Briefs**: the parties' written arguments.\n- **Mandates**: the presenter describes these as a criminal defendant's undertaking in exchange\n  for a suspended sentence [S2]. Do not rely on that as a definition. Read the series description\n  in the finding aid and record what the mandate series for your court actually contains.\n- **Loose case file**: the largest body of papers, sometimes tied in a bundle.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6678a6d1cb62","kind":"method","anchor":"Keep a distinct locator for each series. Record the dates on the first and last surviving papers as well as the date of filing. Allen describes a loose federal suit file that began in the 1870s and continued into 1881 [S3].","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1aab9c4c4515","kind":"method","anchor":"Record the title, jurisdiction, coverage and name variants for a complete index search. A miss covers only that search. Look up relatives active in the district and identify a different debtor independently. Michael Strauss reports that a newspaper lead produced no index hit for the expected man, but a separate search found a farmer in his family who had briefly operated a general store [S2].","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9e1f30158cb7","kind":"method","anchor":"- **Bankruptcy schedules:** copy each creditor’s name, address, occupation, amount, date and goods from the relevant columns. Percival L. Strauss’s reproduced Schedule A, no. 3, lists unsecured claims, including Philadelphia merchants and debts contracted in 1868 [S26]. Compare the dates with the filing docket: the show notes’ date of 27 May 1867 conflicts with those entries and predates the first permitted filing under the 1867 act [S24], [S25].\n- **Suits:** identify the plaintiff, every defendant and any surety or guarantor. Keep an individual co-defendant distinct from a company: Allen describes a sewing-machine company suing two named men [S3].","sources":["S26","S24","S25","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6a8c272563ab","kind":"method","anchor":"Search each business and associate in local records. The show notes identify a merchant’s licence for P. L. Strauss in the 18 May 1867 Berks & Schuylkill Journal, page 3, column 6, placing the store in Bethel Township [S24]. Search the notice under the initials and township, then correlate it with the debtor’s petition [S27]. A creditor or co-defendant alone does not establish kinship.","sources":["S24","S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-26d8e53eb9ef","kind":"unclassified","anchor":"If access is closed or the file is not found, the index entry is still a lead. Name the next\nseries or custodian to try.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb2013d45500","kind":"method","anchor":"- **A lead that names a judge but no court:** do not give up on the case or turn to state courts. If the judge was a federal judge nominated by the President and confirmed by the Senate, search the name in the Federal Judicial Center's Biographical Directory of Article III Federal Judges, whose entries give the federal court or courts served [S10], [S11], [S13]. Then use the National Archives' Guide to Federal Records to locate that court's records: RG 21 for district and circuit courts, RG 276 for courts of appeals and RG 267 for the Supreme Court [S12]. The directory lists only judges of the Article III courts and some former federal courts, and lists service on a territorial court only for a judge it already includes [S11]. So a miss does not show that the judge was not federal: a judge who sat only on a territorial court is not listed.","sources":["S10","S11","S12","S13"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-57ffbe7ccacb","kind":"custody","anchor":"In the Southwest, NARA splits a state between facilities by area. Riverside holds records of\nfederal courts and agencies in Arizona, southern California and Clark County, Nevada; San\nFrancisco holds northern and central California, Nevada outside Clark County, and Hawaii;\nDenver holds Colorado, New Mexico and Utah, as well as Montana, the Dakotas and Wyoming\n[S14 @2026-11-12], [S15 @2026-11-12], [S16 @2026-11-12], [S17 @2026-11-12]. NARA says the San\nFrancisco and Chicago facilities will close within the next few years. Its August 2026 plan\nsends San Francisco's court records (RG 21, RG 276 and RG 578) and Chicago's RG 21 and RG 578 to\nKansas City, and says the records stay open to researchers in their new locations\n[S16 @2026-11-12], [S18 @2026-11-12]. California sued on 14 October 2026 to\nblock the closure [S19 @2026-11-12]. For a case from a district that San Francisco or Chicago\nserved, do not route the request there by default: check the series' Catalog entry and NARA's\nResearcher Updates page for where the files are now [S18 @2026-11-12].","sources":["S14","S15","S16","S17","S18","S19"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1e0630ad5f5a","kind":"custody","anchor":"For a Pittsburgh Division bankruptcy covered by the Philadelphia index, ask for its entry and copy the case reference. Ask Philadelphia for the index first, then request the case file from Kansas City with the court, case number, parties and filing period [S23 @2026-11-19], [S20 @2026-11-19]. For cases filed in 1940 or later, obtain the Federal Records Center transfer number from the court or tell Kansas City that the court no longer has it [S20 @2026-11-19].","sources":["S23","S20"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dbd112b9fabe","kind":"method","anchor":"For the Amistad captives, go past the published decision to the depositions and testimony [S28]. Look in the 12 February 1841 certiorari return in Supreme Court case file no. 2161, *United States v. The Amistad* (RG 267, microfilm M2012), and check microfilm M1753 for the related Connecticut district and circuit court papers (RG 21) [S29].","sources":["S28","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7820a3cbbf8e","kind":"portal-availability","anchor":"Search the National Archives Catalog by identifier 561022 for the digitized M2012 [S30 @2026-11-20].","sources":["S30"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1f89978f46bc","kind":"method","anchor":"Record each name, language and place with its speaker. Use James Covey’s deposition as reported at 40 U.S. 518, 538 to trace what the captives told him about their voyage [S31]. Treat the names in Pedro Montez’s claim as leads, since the published account gives three Spanish names and four African names without matching them person by person (p. 524) [S31].","sources":["S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b8c6ef22e038","kind":"platform-ui","anchor":"For a Chinese Exclusion Act court case tied to arrival at or departure from San Francisco,\ncheck the court register for about 1883–1916 [S32 @2026-11-22], [S33 @2026-11-22].\nIn Ancestry collection 1242, check the NAID browse choices in the user’s account for the register\non NARA microfilm A3381 (National Archives Identifier 4477273) [S34 @2026-11-22], [S35 @2026-11-22].\nUse FamilySearch collection 2443318 as the alternate route and browse the court cards by\ncase number when you have it [S33 @2026-11-22]. Copy the court and court case number for the\nRG 21 file and keep any immigration agency case number as a separate RG 85 lead [S34 @2026-11-22], [S36 @2026-11-22].","sources":["S32","S33","S34","S35","S36"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5aa58b1dba1c","kind":"portal-availability","anchor":"For Fort Smith criminal cases (a collection tip from the available excerpt [S37 @2026-11-22]),\nsearch the Western District of Arkansas defendant jacket series for 1866–1900 by name in the\nNational Archives Catalog (identifier 201532), including for Indian Territory leads through\n1896 [S38 @2026-11-22].\nUse the jacket number to browse Ancestry collection 2117 and match the folder by defendant and\ncase date, since a jacket can hold papers for several defendants [S38 @2026-11-22], [S39 @2026-11-22].\nFor a victim, search the separate surname index in the NARA guide [S38 @2026-11-22].","sources":["S37","S38","S39"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cd4cab346184","kind":"portal-availability","anchor":"For a Maryland federal criminal case (a collection tip from the available excerpt [S40 @2026-11-22]),\nuse the Maryland portion of Ancestry’s *U.S., Circuit Court Criminal Case Files, 1790–1871*,\ncollection 1248. Its Maryland images cover 1795–1860 (RG 21, microfilm M1010) [S41 @2026-11-22].\nIf the name search misses, use the M1010 roll list to browse by court term and then by\ndefendant surname [S41 @2026-11-22], [S42 @2026-11-22].","sources":["S40","S41","S42"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
