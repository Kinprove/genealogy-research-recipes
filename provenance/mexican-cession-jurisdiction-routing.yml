claims:
  - {"id":"C-01","kind":"historical","anchor":"Place the locality on a map of the event year before choosing the record authority. Start with the 1848 Treaty of Guadalupe Hidalgo and the 1850 acts. Check California admission, the adjusted Texas boundary and the separate Utah and New Mexico territorial governments against the date the record was created. For a disputed Texas locality, keep the Texas claim and the treaty boundary distinct. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"historical","anchor":"If the locality is in present-day southern Arizona or southwestern New Mexico, compare it with the Gadsden tract. Check the amended boundary that took effect with the 1854 treaty and record the 1853 signing date separately. For a locality close to the line, identify the tract on both sides of the boundary change before assigning custody. [S1], [S4], [S5]","sources":["S1","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Date a land grant and any later claim, confirmation or patent separately. For a Spanish or Mexican grant later claimed in California, follow the private land claim, including court records when the case reached a court. For New Mexico distinguish the Surveyor General papers from the Court of Private Land Claims files. For an Arizona claim heard by that court, use the Arizona District collection. For a federal public-land entry, use [federal land-entry file recovery](us-federal-land-entry-file-recovery.md). For a Texas grant, use [Texas state land grants](georgia-texas-state-land-grant-recovery.md) to choose the Spanish, Mexican, Republic or state series. [S2], [S3], [S6], [S7], [S8]","sources":["S2","S3","S6","S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For a birth, marriage or death, use the period parish or civil authority for the event and date a later copy under its own creator. Use [Hispanic Catholic register recovery](hispanic-catholic-register-recovery.md) for church records, [U.S. vital registration coverage](us-vital-registration-coverage.md) for U.S. birth and death registration, and [historical map recovery](historical-map-record-recovery.md) to resolve a disputed plot or locality. [S1], [S2], [S3], [S4]","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
