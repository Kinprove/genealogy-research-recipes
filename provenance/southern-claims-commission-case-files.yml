sources:
  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=bc_TJeE_GRA"],"published":"2022-04-04","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the presenter’s suggested search across dispositions and use of witness testimony; the Archives guide corrects the explanations of barred and disallowed.","entry_sha256":"265f0214b48f740da16b7b8dd5c881b33e6aeaa1a0918c121521cef4c905883a","claims":["C-01","C-06"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://www.archives.gov/research/military/civil-war/southern-claims-commission"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Official case-file guide. Used the disposition definitions, consolidated index, file-series locators, payment evidence and descriptions of case-file testimony and exhibits. Verified the entry and catalog identifier for the RG 217 settled files, the transfer notation and docket lookup for Court of Claims cases, and the Fold3 listings for allowed and barred or disallowed files.","entry_sha256":"1c028b0ff07210e2a3a8967c6ee6ec57c51afbbc75b5dc3f2274bcc00cdf8006","claims":["C-02","C-03","C-04","C-05","C-07","C-08","C-09"],"review":"reviewed"}
  - {"id":"S3","kind":"video","urls":["https://www.youtube.com/watch?v=AVHOwyG6F-o"],"published":"2022-04-07","retrieved":"2026-11-21","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-21. The page displayed only site navigation. The supplied excerpt gives the presenter’s advice to check Fold3 for both groups. The Archives guide confirms the Treasury route for paid claims and limits the Court of Claims route to transferred cases.","entry_sha256":"94aaf267e44e954f51e6414d24d2990776be915a61c34a5bb53b52263ab355c1","claims":["C-09"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://www.archives.gov/legislative/research/getting-started/southern-claims-commission"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The Center for Legislative Archives guide treats an envelope-only disallowed House file as a clue to check for a Court of Claims referral.","entry_sha256":"e22f29fb8632553a949f78241b562f3f9887798d3d574f2c56f114d6ff2974dd","claims":["C-08"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://www.archives.gov/digitization/digitized-by-partners"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read the entries for M1407 and the RG 217 approved claims on 2026-11-21. Both entries name Fold3 as a digitization partner. The Fold3 collection pages returned HTTP 403 during direct checks. Used the Archives listings to match each Fold3 collection to its archival series.","entry_sha256":"8fd2a6c22eaa60414fa26e3d03f0d9248ad478c84faa2dfa0572f406aa17adec","claims":["C-09"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter’s advice for a Quaker claimant, search across allowed, disallowed and barred claims. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"Use the consolidated claimant index on M87 roll 14. Record the spelling, state, office number, report number and disposition before opening a file. Use the disposition to select the record group below. [S2 @2026-11-18]","sources":["S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"custody","anchor":"Read **barred** as submission after the 3 March 1873 deadline, so the claim did not receive consideration. Look in M1407 in surname order for the barred case file in Record Group 233. [S2 @2026-11-18]","sources":["S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"custody","anchor":"Read **disallowed** or **dismissed** as a denial. Read the commissioners’ recommendation for the reason. Look in M1407 by report number, then office number, for the disallowed case file in Record Group 233. [S2 @2026-11-18]","sources":["S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"custody","anchor":"Read **allowed** as approval and payment in whole or in part. Use the state, county and claimant’s name to find the *Settled Case Files for Claims Approved by the Southern Claims Commission, 1871–1880* in Record Group 217 (Entry A1-732, Archives identifier 566157). Capture the amounts claimed, allowed and receipted separately when the file gives them. [S2 @2026-11-21]","sources":["S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"According to the presenter, the witness statements are the place to look for accounts of Union sympathies and wartime events, and a claim file may omit the claimant’s Quaker affiliation. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Start with each deposition or testimony heading. Record the speaker, their relationship to the claimant if given, and what they say they saw or knew. Compare each account with the petition, exhibits and final recommendation. Keep religious affiliation open if the testimony does not state it. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"custody","anchor":"If a disallowed House file contains only an envelope, check it for a Court of Claims referral. [S4 @2026-11-21] If the House file documents a referral or M87 marks a barred or disallowed claim “C. of C.”, get the court case number from the M2007 docket cards. Use that number in the congressional jurisdiction case files in Record Groups 123 (Archives identifier 2734730) and 205 (3432865). [S2 @2026-11-21]","sources":["S4","S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"According to the presenter’s advice, check Fold3 for both paid and unpaid claims. [S3† @2026-11-21] Open *Southern Claims Commission Approved Claims, 1871–1880* for allowed claims and *Southern Claims – Barred and Disallowed* for M1407. If the online search comes up empty, use the archival series for the claim’s disposition. [S2 @2026-11-21] [S5 @2026-11-21]","sources":["S3","S2","S5"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
