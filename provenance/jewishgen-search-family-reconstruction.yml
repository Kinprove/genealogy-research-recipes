claims:
  - {"id":"C-88bd5b35abaa","kind":"unclassified","anchor":"Read the target collection's instructions: what is searchable, whose name each field represents, whether matching returns individuals or households, which years and populations are included, and how to reach the original. JewishGen [Global Search](https://www.jewishgen.org/search/Global_Search.php), which replaced Unified Search, is an entry point; preserve the collection name behind each result.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6c002c2206ca","kind":"platform-ui","anchor":"- **Exact does not always mean literal.** JewishGen's Search Guide says that Is Exactly \"still expands JewishGen's standard given-name synonym groups, so it is not literally letter-for-letter\": a search for one form also returns the other names in its group, for example Jankel, Jakob, Jacob and Jack. [N17 @2026-11-12] Record both the submitted form and the returned form.\n- **AND does not always mean the same person.** In Belarus Revision Lists, surname and given-name conditions can be satisfied by different members of one household, and the whole household is then returned. [N18 @2026-11-12] Inspect individual rows before treating the conjunction as a person's identity. [Belarus search instructions](https://www.jewishgen.org/databases/Belarus/BelarusRevisionLists.htm).\n- **A participant is not necessarily the record subject.** A birth's father field ordinarily describes the child's father; it is not automatically the mother's father. To find a woman as a mother, use the collection's maternal fields or inspect a broader extract. Verify labels before composing the query.","sources":["N17","N18"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1bae4f5ecfbc","kind":"unclassified","anchor":"**Do not substitute one phonetic pass for a variant matrix.** Hungarian census instructions distinguish Phonetically Like (Beider–Morse), Sounds Like (Daitch–Mokotoff) and fuzzy (Damerau–Levenshtein). Belarus instructions specifically warn that Chaia will not retrieve Khaika through the phonetic methods. Diminutives, religious/secular forms and double-name components need explicit passes. Build the matrix from attested name forms, preserving the source for each variant. [Hungarian methods](https://www.jewishgen.org/databases/Hungary/CensusOther.htm), [Belarus given names](https://www.jewishgen.org/databases/Belarus/BelarusRevisionLists.htm).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-63ba2bba4106","kind":"unclassified","anchor":"**Do not improvise Boolean or wildcard syntax.** JewishGen's Search Guide documents comma as OR and space as AND for every Search Type, while its How-to FAQ says the comma works with every type except Is Exactly. A multiword name is therefore not automatically a literal phrase. Wildcard availability varies: the Anglo-Jewry 1851 instructions permit `*` and `?` under Is Exactly, while Starts With uses a bare beginning. Check the chosen interface before reusing either convention. [Search Guide](https://jewishgen.org/HowToFAQ/searchguide.html), [How-to FAQ](https://jewishgen.org/HowToFAQ/howto.html), [1851 search instructions](https://www.jewishgen.org/jcr-uk/1851/How_to_use_the_Database.htm).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1e63b8449893","kind":"platform-ui","anchor":"**Test a pinned letter in the selected search type.** JewishGen’s Search Guide uses `Sch[w]artz` to exclude Schvartz in phonetic or fuzzy searches and reserves the asterisk for Is Exactly [N17 @2026-11-19]. Its How-to FAQ assigns brackets to Is Exactly [N22 @2026-11-19]. Run the same surname with and without brackets in the same collection and mode. Compare the actual spellings returned as well as row counts. An unchanged count alone cannot establish how the engine handled the brackets.","sources":["N17","N22"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7f70fadb60d0","kind":"unclassified","anchor":"These combinations are retrieval plans, not results from completed searches. Each combines two fields. Global Search joins two criteria with AND for every user; a third or fourth criterion, or OR between rows, needs JewishGen's Value-Added status, which comes with a donation. [Global Search](https://www.jewishgen.org/search/Global_Search.php), [Value-Added Services](https://www.jewishgen.org/JewishGen-erosity/valueadded.html). Use separate methods per field only where the interface supports them. Without Value-Added status, or where the interface does not support it, split the plan into two-field passes and compare the remaining values locally. Begin without an age or Town restriction when those are uncertain.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d86a2f0e2a76","kind":"method","anchor":"Keep separate fields for registration, residence, event place, birthplace and places in comments. The Belarus revision-list instructions distinguish the town of registration from residence [N18]. In an 1897 Odessa census result the family’s earlier town, Tulchin, appeared in comments [N2]. Compare surname + Town, surname + Any Field and surname alone. A place printed in comments can also have a hidden Other Towns index entry, so inspect the returned rows before concluding which query found it [N23].","sources":["N18","N2","N23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e0b3166a9607","kind":"unclassified","anchor":"The same indexing distinction applies to names: a surname mentioned inside free text is not automatically searchable phonetically as a surname. Hidden Other Surnames/Other GivenNames can supply that mapping. For a name in comments, compare an Any Field text query with the typed surname/name query before interpreting a negative; do not assume the collection populated those hidden fields. [Indexing guidelines](https://www.jewishgen.org/databases/%24transcription.html).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e6f2544d2c3d","kind":"unclassified","anchor":"Resolve ambiguous place names with historical jurisdiction, coordinates and nearby communities before applying a geographic restriction. Communities supplies historical Jewish names and jurisdictions; Gazetteer serves a broader set of localities. For vital records, also identify the community or registration office responsible for the village: a nearby settlement can hold its registers. An administrative catchment is a different search from an arbitrary radius. [Communities/Gazetteer](https://www.jewishgen.org/Communities/), [Polish records questions](https://jewishgen.org/InfoFiles/Poland/Questions.htm).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-724af5660d83","kind":"unclassified","anchor":"Before treating a region- or town-limited search as negative, open the [Records Catalog](https://www.jewishgen.org/catalog/) and filter by country, sub-region (historical gubernia) and town. Each dataset's page has an **At a Glance** block with its date range, total records and Last Updated date, as on [Ukraine Vital Records](https://www.jewishgen.org/databases/Ukraine/VitalRecs.htm). Use it to confirm that the dataset covers your years, and to choose which saved queries to re-run after a later update. For border or disputed territory, also run the search at country level, not only the sub-region. The [GeneaVlogger interview](https://www.youtube.com/watch?v=KWtdlADparw) motivates this check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-958a1ea57784","kind":"method","anchor":"1. **Previous and current revision ages.** Read the original headings and compute each age against its own revision year, particularly when checking a translation [N8]. The Bessarabian schema gives the previous-revision age only for men [N24].\n2. **Title year and later entries.** Check the date beside each addition. The 1874 Brest family list includes a daughter’s age entered for 1888. Subtracting that age from the year on the cover sends the birth search to the wrong decade [N7].\n3. **Event and registration dates.** Preserve both dates and their labels. Two dates in a Russian-Polish record can instead represent one event under the Julian and Gregorian calendars [N25].\n4. **Documentary and apparent age.** Where the form has both columns, transcribe each with its heading before assessing a discrepancy [N7].","sources":["N8","N24","N7","N25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-100932541f04","kind":"method","anchor":"**Search later registrations around a wedding or a sibling’s entry.** A contributor found a Kharkiv birth registered at age 22 and suggested an approaching marriage as a possible reason. Search later additions for the child and siblings, then record the stated birth date separately from the registration date [N7].","sources":["N7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-01176db90219","kind":"unclassified","anchor":"For an attested double name such as Abram Moshe, create distinct retrieval lanes for Abram, Moshe, Abram Moshe and Moshe Abram. JewishGen's name guidance documents component omission and order changes. This is a search expansion, not a rule that any Abram and any Moshe are the same person. [Double-name guidance](https://www.jewishgen.org/infofiles/givennames/slide16.html).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1fba0db7ec88","kind":"method","anchor":"When an index gives two name-like tokens, preserve both readings until the original identifies a compound given name or a given name and patronymic [N7]. Compare the mother’s name in all available children’s entries. In the Cherniakhiv births, Yokheved’s father was variously named Yosef, Yosef-Yitzhak and Yaakov-Moshe, so one entry could select the wrong paternal family [N9].","sources":["N7","N9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8b6365a7c279","kind":"unclassified","anchor":"For Polish women, a name-like surname can represent the father's given name, a grammatical form of a surname, or an andronym identifying her through her husband. JewishGen gives Avram Moshe → Sara Abramówna or Sara Moszkówna: either component of the father's double name may supply the patronymic. Retain both component-derived Polish search lanes where the records warrant them. Preserve each raw form and check additional records before choosing its role. [Polish women's names, question 6](https://jewishgen.org/InfoFiles/Poland/Questions.htm).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-574ce8bb27a4","kind":"unclassified","anchor":"If a metrical record has parallel Russian and Hebrew text, inspect the original names on both sides. J-Roots 4667 proposes this specifically when a woman's name changes between lists. A second language can supply another search form; it does not automatically resolve the identity or establish that the two halves agree. [Women's-name discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b3def864eb94","kind":"unclassified","anchor":"1. Collect her forms and ages from **all available children's births**, later household entries and death records. Record whether the father's name is explicitly written, inferred by an indexer, absent, or possibly another name role. One child's index entry must not dictate her patronymic. [J-Roots 3733](https://forum.j-roots.info/viewtopic.php?f=9&t=3733).\n2. Search her given-name variants plus each supported paternal-name variant, without a presumed maiden surname. Use a justified age window and separate natal-place, registration-place and residence searches. If the necessary maternal/paternal fields are not searchable, retrieve a bounded collection and filter locally.\n3. Search candidate fathers' households for a daughter with compatible forms and chronology. Compare siblings, mother, addresses, former household numbers and transfer notes. Search a brother's or sister's documented surname as a new candidate lane; keep the reason for the pivot.\n4. Return a candidate table: raw names; father's-name source; age basis; place role; siblings/household; direct support; conflicts; missing link; next record that would separate the candidates. A common given name + patronymic + approximate age alone does not choose a natal family.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5923747c8d3b","kind":"unclassified","anchor":"When those records do not name her natal family, pivot to siblings, residence/house books, a surviving work autobiography or an identified family file. J-Roots 5084 recommends these routes in a concrete missing-maiden-name question; the advice is not a reported successful identification. An alphabetic finding aid may show only a name while the underlying file contains family details. [Missing maiden-name discussion](https://forum.j-roots.info/viewtopic.php?f=20&t=5084), [citizenship-option dossiers](https://forum.j-roots.info/viewtopic.php?f=197&t=9279).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5730fb10995f","kind":"method","anchor":"If several mothers fit, look for the father’s given name and the house number in Kraków’s patronymic records [N26]. Compare them with the names repeated in the children’s entries [N9]. Leave the marriage unresolved while the proposed households still fit equally well.","sources":["N26","N9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5497c5305f8a","kind":"unclassified","anchor":"**Worked field plan, not an executed search:** suppose the earlier daughter is Sora, daughter of Abram; her married surname is unknown. The documented Belarus birth schema distinguishes Mother's Given Name and Mother's Patronymic from Father's Given Name and Father's Patronymic. Retrieve a covered, bounded birth collection using supported name/place fields, then locally select maternal given-name variants Sora/Sorka and a supported Abram patronymic. Group retained rows by the child's paternal names, maternal forms and locality. Two paternal groups remain two candidate households. A hit on Father's Patronymic=Abram identifies the child's paternal grandfather and does not satisfy the mother's paternal-name condition. A displayed maternal column is not a guarantee of a dedicated search selector. [Belarus birth schema](https://www.jewishgen.org/belarus/belarus_births.html).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c79fe6c0beb4","kind":"unclassified","anchor":"Before declaring the marriage missing, inspect how the original marriage index is arranged. Polish guidance describes indexes under the groom's surname, brides in later columns and some brides omitted from the index entirely. An unsuccessful bride-name query is therefore a reason to inspect the actual register or another index, rather than invent a husband. [Polish index guidance](https://jewishgen.org/InfoFiles/Poland/Questions.htm).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8842d0dd0fc2","kind":"unclassified","anchor":"When a family's births and deaths appear in its home-town registers but no marriages do, search the brides' places of residence. A [discussion of missing marriages](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) reports, with several confirming posters, that the ceremony and record were usually made there, while the couple might later live with the groom's family or in a third place. Treat this as a custom, not a rule: a missing local marriage opens a retrieval branch and is not evidence of a lost register or of no marriage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ebed973507e3","kind":"method","anchor":"- **Follow former household numbers.** Bessarabian lists can give a former registration number with its revision year. Follow the pair to the earlier entry and read the transfer or origin comments [N24].\n- **Follow the image reference.** Use the film, page or archive reference in a JewishGen index to browse a FamilySearch image even if a name search there misses it [N6]. For Bessarabian metrical originals, search ANA fond 211 by district opis as set out in [Route a Bessarabian or Moldovan record by date, district and bank of the Dniester § 4](bessarabia-moldova-record-routing.md#4-search-bessarabian-metrical-books-in-ana-fond-211-by-opis).\n- **Separate the original’s repository from the film holder.** Copy the archive, fond, opis and delo from an inventory entry when supplied. A Glusk discussion distinguishes an 1858 list cited as Minsk 333/9/1072 from an eighteenth-century census attributed to the Lithuanian State Historical Archive. A contributor interpreted the film code as a Jerusalem copy [N13]. Check the repository’s own inventory for the exact file. Compare fields and coverage in the regional project and each host copy. Matching rows drawn from one index supply one record reference [N1], [N5].","sources":["N24","N6","N13","N1","N5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0c4fc384b10b","kind":"unclassified","anchor":"For a supported family-separation lead in the relevant period, compare JewishGen's Gallery of\nMissing Husbands entries with the separate National Desertion Bureau Card Catalog. Keep the\nnewspaper reference and card locator distinct; compare the named couple, dates and case context\nbefore linking them. Retain the card's opening date, referring agency and case-file number when\npresent. The [project historian's interview](https://familylocket.com/rlp-378-the-jewish-boards-unique-collections-interview-with-gavin-beinart-smollan/)\ndescribes a card-to-YIVO file route: follow the holder's actual instructions and queue a request\nwithin the authorized research scope. A card does not guarantee a corresponding file; preserve\na missing or unavailable file separately from one inspected.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e83285246115","kind":"unclassified","anchor":"In the described catalog, the name search covers the couple, while a referring individual such\nas a rabbi may appear in a separate referred-by field. Check the actual field's availability and\nmeaning before querying it. A newspaper entry or card is not the full file. Keep stated causes\nand case outcomes attributed to their informants and record context; they do not independently\nestablish motives, accusations or identity. Current fees, form limits and access remain to check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-55c1de7cd36a","kind":"portal-availability","anchor":"- **Check the translated extent behind a Yizkor hit.** For a family or community lead in a memorial book, search the JewishGen Yizkor Book Database and linked community or regional translation project before starting a fresh translation. Inspect what is actually translated, including any translated contents list and linked chapter pages. The Lublin project, for example, provides a translated contents list while substantial content remains untranslated; record chapter-level coverage rather than labeling the whole book translated. [N19 @2026-11-16](https://www.beholdgenealogy.com/blog/?p=3874) [N20 @2026-11-16](https://www.jewishgen.org/Yizkor/faq.html) [N21 @2026-11-16](https://www.jewishgen.org/jewishgen-erosity/YizkorTr/YBLublin.html)","sources":["N19","N20","N21"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-86fb34204135","kind":"portal-availability","anchor":"- **Compare versions of the same index.** As checked on 2026-11-19, JRI-Poland labels its Legacy search fully functional and NextGen a limited test dataset [N27 @2026-11-19].","sources":["N27"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fe63cd85f9ff","kind":"method","anchor":"- **Compare the underlying lists before counting duplicate index rows.** For men in the 1874–75 census, check registration with the townspeople’s society, place of residence and liability for military service. One file can contain overlapping lists. The reported pair of rows and the significance of a lone previous-age entry remained unresolved. Use both references to locate the full household and read the original headings [N7].\n- **Check which people the index covers.** A demonstrated 1875 military list covered men [N4]. Check a memorial book’s translated chapters, full-text name index and separate necrology [N29], [N30]. For a burial search, check the cemetery inventory [N31].\n- **Measure how many records the town search actually covers.** Search without a surname under historical and modern forms, such as Zaslav and Izyaslav. Total the results by collection, keeping Family Finder and submitted family trees separate from indexed vital records. If few vital entries appear, check which registers survive and which volumes the index covers [N12].\n- **Compare volumes and years across fonds.** For a crown rabbi’s registers, list each fond, file, year and indexed extent. Where two copies survive, compare their coverage year by year. Indexing one fond can leave gaps covered only by another. The extent of overlap must be checked for the town in question [N13].\n- **Privacy gate:** <!-- privacy-gate: contact --> Messaging a JGFF researcher or FTJP tree submitter contacts a living stranger and can reveal the user's family details and research; answer the privacy gate in `SKILL.md` first.\n- **Use researcher and tree matches as leads.** JGFF records research interests [N32]. FTJP submissions are not validated by JewishGen. Ask for the underlying record only if contact is authorized. [N33]\n- **Repeat a saved query after a relevant update.** Preserve the earlier date, fields and scope. If a collection has changed, rerun the search against the added years or towns and record what changed [N3], [N1]. A 2012 release notice itemized files distributed to LitvakSIG district groups before their planned public release [N14].","sources":["N7","N4","N29","N30","N31","N12","N13","N32","N33","N3","N1","N14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f6aa46f61457","kind":"portal-availability","anchor":"- **Check for a district release before accepting a public-database miss.** LitvakSIG’s district page says qualifying contributors receive the district’s new translations at least 18 months before public release in the All Lithuania Database [N28 @2026-11-19]. Check the translated-record list for the series. Record the series and its public status. Obtain authorization before joining a group.","sources":["N28"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
