claims:
  - {"id":"C-4526af07fbc6","kind":"unclassified","anchor":"- Separate **documented facts, estimates and hypotheses** before constructing a query. Do not\n  require a guessed maiden name, calculated birth year or uncertain birthplace in every search.\n- Check the collection description and actual form. Categories and individual collections offer\n  different fields; a field offered by the general search is not a promise of complete indexing.\n- Names are optional search inputs. Use the offered spelling, initials and additional-field\n  controls deliberately; do not assume an old demonstration describes today's defaults. [H1]\n- Preserve the sparse baseline before tightening it. If a tighter query fails, relax one condition\n  at a time and record the reason; changing everything together conceals what excluded the record.\n- Verify original wording and the person's role. Transliterated results, OCR, extracted relatives,\n  inferred dates, trees and automated matches are finding aids, not independently established facts.\n- Route AI transcription/translation to `ai-for-documentary-records.md`, bounded Ashkenazi given-name\n  lookup to `beider-given-name-variants.md`, and identity/conflict/negative-evidence rulings to\n  `evidence-proof-judgment.md`. This recipe prepares candidates and search coverage, not a verdict.","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2049e297d11","kind":"unclassified","anchor":"Clear previous catalog filters, then try jurisdiction and record-type words in the collection\ntitle/description search: school, register, passport, probate, newspaper. These keywords locate\ncollections; they are not a search for every personal name inside their records. [S2, H2]","sources":["S2","H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7c016824bb39","kind":"unclassified","anchor":"For Jewish research, try Jewish-related descriptions alongside the relevant town and civil,\nreligious or national record groups. A neutral collection title may contain relevant material.\nNeither a keyword match nor its absence establishes complete coverage of a community. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b75033a591f","kind":"unclassified","anchor":"Use catalog type, location and time filters to discover plausible sets, then read their descriptions.\nCheck date span, locality, record type, source institution, image availability and update information.\nA broad title is not assurance that every town, year or surviving volume is included. [H2, H3]","sources":["H2","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e78de9ec267","kind":"unclassified","anchor":"Start sparsely, select a suitable collection, then add one supported event or relative.\nIf candidates disappear, remove the weakest condition first. [S1, S6, H1]","sources":["S1","S6","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8d422539407","kind":"unclassified","anchor":"Create a short variant list: native spelling, maiden and married surnames, familiar given name,\ninitials and middle names. Try fictional Anna Maria Weiss as Anna Weiss and Maria Weiss, then the\ndocumented married surname. Use offered initials matching or exact-spelling controls consciously. [H1]","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3666b16e59cc","kind":"unclassified","anchor":"An exact form can reduce a common-name result set, but also exclude abbreviated or reordered text.\nIn newspapers, a woman may appear under her husband's name or an honorific. Test those forms as\nseparate leads; do not turn a familiar name or shared surname into an identity conclusion. [S1, S3, H5]","sources":["S1","S3","H5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-94f348f05b18","kind":"unclassified","anchor":"MyHeritage's Global Name Translation can match name versions, nicknames and different alphabets,\nand transliterate returned names into the query language. That convenience can hide the precise\noriginal spelling. Save the native name alongside the displayed version. [S1, S4, H4]","sources":["S1","S4","H4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0bdcecf974cf","kind":"platform-ui","anchor":"In the search form, the filters under **+ More** include an option to show results from other\nlanguages [H1 @2026-11-12]. Record its state with each query. With the option off, a zero says\nnothing about records in other languages or scripts. With it on, a zero still does not prove\nabsence. In the Internet Archive capture of 2026-07-17 of a MyHeritage collection page, the search\nform's tooltip says a translation shown in square brackets is not in the original data and may be\ninaccurate [H12 @2026-11-12].","sources":["H1","H12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-853c577b71a3","kind":"unclassified","anchor":"Distinguish birth, marriage, death, residence and publication dates before choosing a field.\nCurrent search forms support year or full-date entry; use the precision the evidence warrants.\nIf a range control is unavailable, test neighboring years separately or omit the weak date. [H1]","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-950398d4b197","kind":"unclassified","anchor":"A school yearbook's publication year differs from a pupil's birth year. A birth year inferred from\ngrade or age remains an estimate. An obituary's publication date may follow the death; an article\ncan commemorate an event decades earlier. Do not force all those dates into birth-year search. [S3, S6]","sources":["S3","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ae8b1dbef46b","kind":"unclassified","anchor":"In a civil registration index, verify whether a quarter denotes registration rather than birth;\nkeep certificate volume/page locators. A pension file can be created years after military service:\ndo not restrict discovery to the war years alone. [S5, S9]","sources":["S5","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-794e4af35747","kind":"unclassified","anchor":"Identify birthplace, residence, event location, publication town and collecting jurisdiction.\nA fictional death in Millford may be reported by a newspaper published in nearby Ashbridge.\nTry Millford as a keyword while broadening the publication-place restriction. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b2f9e97c60e9","kind":"unclassified","anchor":"Check neighboring towns, historical spellings and jurisdictions created by border changes.\nSearch the countries under which the locality's records might be cataloged, then inspect the\ncollection description. A modern national filter can conceal records organized another way. [S1, S5]","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-72166c024680","kind":"unclassified","anchor":"The German-records tutorial uses a US census entry for someone born in Germany to explain why\na Germany place filter need not identify a German source: event geography does not establish\nsource custody. Likewise, an American who served with Canadian forces may appear\nin Canadian military records. Read the originating collection and recorded role separately. [S8, S9]","sources":["S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-136f92537ce7","kind":"unclassified","anchor":"Use the additional-fields control, currently labelled **+More**, for relatives, life events,\nkeywords or gender where offered. Test a known parent or spouse when the target's own name or\ndates are missing. Avoid filling every relative field with guesses. [S1, H1]","sources":["S1","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c1f4520e102c","kind":"unclassified","anchor":"Alternatively search the relative directly, then inspect their household or named associates.\nIn passenger records a person can appear as a destination contact or relative remaining abroad,\nas well as a traveler. Read the role and column: a name hit does not establish immigration. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4d0110c428ed","kind":"unclassified","anchor":"A property advertisement or legal notice may identify an address without naming the ancestor.\nUse period occupation terms, street-name variants and relevant local vocabulary. A contextual hit\nlocates a page to read; it does not establish who occupied the address at another date. [S2, S3, S6]","sources":["S2","S3","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bbe930028eab","kind":"unclassified","anchor":"For a documented local business, locality and period, consider an available local school yearbook\nfrom that period and inspect its actual advertising section, often near the back. The business\nowner need not be known as a pupil. Record the school, edition/year and page or image locator\nwith the advertisement's literal business name, address and any pictured premises, then seek\ncorroborating records. An advertisement alone does not establish ownership, school attendance\nor patronage. Keep an unavailable edition or uninspected section as a gap. [S10, S11]","sources":["S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c3030dfeffd3","kind":"unclassified","anchor":"Check whether the same material has a structured name index and a full-text counterpart.\nNames can be visible on a page but absent from the extracted name index. Search an available\ntext version with a surname, nickname, school or activity, then inspect the page. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-29b789392698","kind":"unclassified","anchor":"Compare a returned page with its OCR text when available. Look for damaged print, misread letters,\ncolumns read out of order and names split across lines. A printed Rosen- at one line's end and\nberg at the next can defeat a search that expects the joined spelling. [S1, S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6da78ffcd0ec","kind":"unclassified","anchor":"MyHeritage's **Names & Stories** collections offer structured records extracted from newspapers;\nOldNews offers newspaper material to search and read. For covered material, try structured event\nand relative fields. Follow the record's OldNews link or **View full newspaper page** control to\nread the printed article; record any access restriction. If one route fails, try the other with\nname variants or contextual words. [S7, H6, H7]","sources":["S7","H6","H7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-95104492714a","kind":"platform-ui","anchor":"These records were extracted by AI, and each carries an article summary that AI generated\n[H7 @2026-11-12]. MyHeritage's collection page, in its Internet Archive capture of 2026-07-17,\nwarns of mistakes such as incorrect relationships and advises reading the scanned page\n[H12 @2026-11-12]. Use the summary only to find the article, and quote and cite only the printed\narticle.","sources":["H7","H12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-743bd464b6f9","kind":"unclassified","anchor":"Read the whole article, continuation, page heading and surrounding entries. In censuses, inspect\nthe preceding and following pages for household continuation and nearby relatives. In yearbooks,\ninspect other pages and adjacent years for the same pupil's activities and name forms. [S1, S6]","sources":["S1","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e4f2a3eea48","kind":"unclassified","anchor":"When a tree-event map or locality list is available, retain its person/branch, event-type\nand date scope before choosing a place. Open the underlying people/events and preserve\ntheir references. Use that scoped list to choose the next locality and record series,\nkeeping uncertain locations and their source support visible. A shared pin establishes\nneither residence nor kinship. The [MyHeritage demonstration](https://www.youtube.com/watch?v=0v0fbjil9W8)\nillustrates this planning use; apply the controls actually available rather than assuming\na current map widget or export.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc34908a1f4a","kind":"unclassified","anchor":"If no image is supplied, save the collection citation, originating institution, reference number,\nvolume/page and original-source link that are actually provided. Use that locator to seek the image\nor request the record from its custodian. State explicitly when the original remains unavailable.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-064f78e181d5","kind":"unclassified","anchor":"Treat record matches, related-record suggestions and tree matches as new searches to evaluate.\nCompare names, roles, dates, places and relationships against the source; retain competing candidates.\nEnd with the coverage ledger and next discriminating search, not “MyHeritage has no such record.”\nUse the evidence/proof recipe for any proposed identity or negative-evidence conclusion. [S1, S5]","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9bc411f8eadb","kind":"unclassified","anchor":"If you copy information from a Smart Match or Record Match, review fields individually before\nsaving. Log the destination person, match/source link, previous value and copied value for each\nchange, keeping conflicting evidence visible. A fuller imported value is not necessarily a better\nsupported one. [S12, H9, H10]","sources":["S12","H9","H10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd3ec9a15fc6","kind":"unclassified","anchor":"For **Smart Matches**, undoing confirmation leaves already extracted and saved tree information\nin place. If a match later proves wrong, use the field log to revisit the affected person, facts\nand citations; check their other support before correcting or removing the imported assertions.\nVerify the resulting tree values separately from the match's status. Undoing confirmation alone\ndoes not repair the tree. [S12, H8]","sources":["S12","H8"],"checked":null,"stated_as":null,"review":"pending"}
