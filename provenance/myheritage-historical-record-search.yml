  - {"id":"S135","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-20275/netherlands-holland-america-line-passenger-lists"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"42c092985d2deea062ed67445b4833c5e1c767301fb7c8c031bd6bcd7c12610b","claims":["C-holland-america-booking"],"review":"reviewed"}
  - {"id":"S136","kind":"web-page","urls":["https://stadsarchief.rotterdam.nl/uitleg-zoeken-passagierslijsten"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"2abf43e4ddf0eb496c7eeccf68c510e2af075d411739b219c98274bd59995fd9","claims":["C-holland-america-booking"],"review":"reviewed"}
  - {"id":"S137","kind":"web-page","urls":["https://blog.myheritage.com/2022/10/myheritage-publishes-30-new-historical-record-collections-and-31-million-records-in-september-2022/"],"published":"2022-10-21","retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"a16a103f470127e9c26d7f53e629cc24f4bf9d25c4fbcf82c77ca3e6e94e040d","claims":["C-finnish-service-death"],"review":"reviewed"}
  - {"id":"S138","kind":"web-page","urls":["https://portti.kansallisarkisto.fi/arkistojen-portti/talvi-ja-jatkosodan-henkilohistorialliset-lahteet"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"ead39e25b3fe623cc5a954e699a6fd9d8fac5a76b92c8a37c637dcd0664d8072","claims":["C-finnish-service-death"],"review":"reviewed"}
  - {"id":"S139","kind":"web-page","urls":["https://blog.myheritage.com/2023/07/18-historical-record-collections-added-in-the-second-half-of-june-2023/"],"published":"2023-07-17","retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"c5b1afc739dedb8c7d56897b9acdfd9a7c8c9912fe2d6c9e4a8fc7806fe8c964","claims":["C-indiana-biography-index-card"],"review":"reviewed"}
  - {"id":"S140","kind":"catalogue","urls":["https://www.in.gov/library/collections-and-services/indiana/indiana-biography-index-list-of-sources/indiana-biography-index-list-of-sources-complete-list/"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"4e85177946825ee396dfc1e274b4f78985f4d7ff475701231f59a1869e80eb2f","claims":["C-indiana-biography-index-card"],"review":"reviewed"}
  - {"id":"S141","kind":"web-page","urls":["https://blog.myheritage.com/2023/06/i-retraced-the-journey-of-my-breton-ancestor-who-became-an-inventor-in-america/"],"published":"2023-06-27","retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"8103611a67d1115385e0c3fa51419112fc5f400ff04d9a92930cd74709413cb4","claims":["C-historical-patent-filing-date"],"review":"reviewed"}
  - {"id":"S142","kind":"catalogue","urls":["https://www.myheritage.com/research/collection/inventors-of-historical-patents/colid-10834"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"738678b891eaf03309dd7c17509ef1299a018067d93ba664b05e9914cc71c806","claims":["C-historical-patent-filing-date"],"review":"reviewed"}
  - {"id":"S143","kind":"web-page","urls":["https://patents.google.com/patent/US1003880A/en"],"published":"1911-09-19","retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"3bb1148b666ddba7f41f65cd45a3a3b5745a0382340cedfeb7707b0b0556f18c","claims":["C-historical-patent-filing-date"],"review":"reviewed"}
  - {"id":"S144","kind":"web-page","urls":["https://www.archives.gov/research/census/online-resources"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"read 2026-11-23","entry_sha256":"b90dd46624822f0dba1c3068ab7bfd650dc131743f05c91b17d9664ce8cf7be2","claims":["C-consolidated-census-gap-and-timeline"],"review":"reviewed"}
claims:
  - {"id":"C-4526af07fbc6","kind":"unclassified","anchor":"- Separate **documented facts, estimates and hypotheses** before constructing a query. Do not\n  require a guessed maiden name, calculated birth year or uncertain birthplace in every search.\n- Check the collection description and actual form. Categories and individual collections offer\n  different fields; a field offered by the general search is not a promise of complete indexing.\n- Names are optional search inputs. Use the offered spelling, initials and additional-field\n  controls deliberately; do not assume an old demonstration describes today's defaults. [H1]\n- Preserve the sparse baseline before tightening it. If a tighter query fails, relax one condition\n  at a time and record the reason; changing everything together conceals what excluded the record.\n- Verify original wording and the person's role. Transliterated results, OCR, extracted relatives,\n  inferred dates, trees and automated matches are finding aids, not independently established facts.\n- Route AI transcription/translation to `ai-for-documentary-records.md`, bounded Ashkenazi given-name\n  lookup to `beider-given-name-variants.md`, and identity/conflict/negative-evidence rulings to\n  `evidence-proof-judgment.md`. This recipe prepares candidates and search coverage, not a verdict.","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2049e297d11","kind":"unclassified","anchor":"Clear previous catalog filters, then try jurisdiction and record-type words in the collection\ntitle/description search: school, register, passport, probate, newspaper. These keywords locate\ncollections; they are not a search for every personal name inside their records. [S2, H2]","sources":["S2","H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7c016824bb39","kind":"unclassified","anchor":"For Jewish research, try Jewish-related descriptions alongside the relevant town and civil,\nreligious or national record groups. A neutral collection title may contain relevant material.\nNeither a keyword match nor its absence establishes complete coverage of a community. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b75033a591f","kind":"unclassified","anchor":"Use catalog type, location and time filters to discover plausible sets, then read their descriptions.\nCheck date span, locality, record type, source institution, image availability and update information.\nA broad title is not assurance that every town, year or surviving volume is included. [H2, H3]","sources":["H2","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e78de9ec267","kind":"unclassified","anchor":"Start sparsely, select a suitable collection, then add one supported event or relative.\nIf candidates disappear, remove the weakest condition first. [S1, S6, H1]","sources":["S1","S6","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8d422539407","kind":"unclassified","anchor":"Create a short variant list: native spelling, maiden and married surnames, familiar given name,\ninitials and middle names. Try fictional Anna Maria Weiss as Anna Weiss and Maria Weiss, then the\ndocumented married surname. Use offered initials matching or exact-spelling controls consciously. [H1]","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3666b16e59cc","kind":"unclassified","anchor":"An exact form can reduce a common-name result set, but also exclude abbreviated or reordered text.\nIn newspapers, a woman may appear under her husband's name or an honorific. Test those forms as\nseparate leads; do not turn a familiar name or shared surname into an identity conclusion. [S1, S3, H5]","sources":["S1","S3","H5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-94f348f05b18","kind":"unclassified","anchor":"MyHeritage's Global Name Translation can match name versions, nicknames and different alphabets,\nand transliterate returned names into the query language. That convenience can hide the precise\noriginal spelling. Save the native name alongside the displayed version. [S1, S4, H4]","sources":["S1","S4","H4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0bdcecf974cf","kind":"platform-ui","anchor":"In the search form, the filters under **+ More** include an option to show results from other\nlanguages [H1 @2026-11-12]. Record its state with each query. With the option off, a zero says\nnothing about records in other languages or scripts. With it on, a zero still does not prove\nabsence. In the Internet Archive capture of 2026-07-17 of a MyHeritage collection page, the search\nform's tooltip says a translation shown in square brackets is not in the original data and may be\ninaccurate [H12 @2026-11-12].","sources":["H1","H12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-853c577b71a3","kind":"unclassified","anchor":"Distinguish birth, marriage, death, residence and publication dates before choosing a field.\nCurrent search forms support year or full-date entry; use the precision the evidence warrants.\nIf a range control is unavailable, test neighboring years separately or omit the weak date. [H1]","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-950398d4b197","kind":"unclassified","anchor":"A school yearbook's publication year differs from a pupil's birth year. A birth year inferred from\ngrade or age remains an estimate. An obituary's publication date may follow the death; an article\ncan commemorate an event decades earlier. Do not force all those dates into birth-year search. [S3, S6]","sources":["S3","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ae8b1dbef46b","kind":"unclassified","anchor":"In a civil registration index, verify whether a quarter denotes registration rather than birth;\nkeep certificate volume/page locators. A pension file can be created years after military service:\ndo not restrict discovery to the war years alone. [S5, S9]","sources":["S5","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-794e4af35747","kind":"unclassified","anchor":"Identify birthplace, residence, event location, publication town and collecting jurisdiction.\nA fictional death in Millford may be reported by a newspaper published in nearby Ashbridge.\nTry Millford as a keyword while broadening the publication-place restriction. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b2f9e97c60e9","kind":"unclassified","anchor":"Check neighboring towns, historical spellings and jurisdictions created by border changes.\nSearch the countries under which the locality's records might be cataloged, then inspect the\ncollection description. A modern national filter can conceal records organized another way. [S1, S5]","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-72166c024680","kind":"method","anchor":"A Germany birthplace can appear in a U.S. census return [S8]. Follow the collection title and its creator to identify the source. Conversely, U.S. nationals who served with Canadian forces may appear in Canadian military records [S9]. Record the person’s role and the jurisdiction responsible for the record separately.","sources":["S8","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-136f92537ce7","kind":"unclassified","anchor":"Use the additional-fields control, currently labelled **+More**, for relatives, life events,\nkeywords or gender where offered. Test a known parent or spouse when the target's own name or\ndates are missing. Avoid filling every relative field with guesses. [S1, H1]","sources":["S1","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c1f4520e102c","kind":"unclassified","anchor":"Alternatively search the relative directly, then inspect their household or named associates.\nIn passenger records a person can appear as a destination contact or relative remaining abroad,\nas well as a traveler. Read the role and column: a name hit does not establish immigration. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4d0110c428ed","kind":"unclassified","anchor":"A property advertisement or legal notice may identify an address without naming the ancestor.\nUse period occupation terms, street-name variants and relevant local vocabulary. A contextual hit\nlocates a page to read; it does not establish who occupied the address at another date. [S2, S3, S6]","sources":["S2","S3","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bbe930028eab","kind":"unclassified","anchor":"For a documented local business, locality and period, consider an available local school yearbook\nfrom that period and inspect its actual advertising section, often near the back. The business\nowner need not be known as a pupil. Record the school, edition/year and page or image locator\nwith the advertisement's literal business name, address and any pictured premises, then seek\ncorroborating records. An advertisement alone does not establish ownership, school attendance\nor patronage. Keep an unavailable edition or uninspected section as a gap. [S10, S11]","sources":["S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c3030dfeffd3","kind":"unclassified","anchor":"Check whether the same material has a structured name index and a full-text counterpart.\nNames can be visible on a page but absent from the extracted name index. Search an available\ntext version with a surname, nickname, school or activity, then inspect the page. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-29b789392698","kind":"unclassified","anchor":"Compare a returned page with its OCR text when available. Look for damaged print, misread letters,\ncolumns read out of order and names split across lines. A printed Rosen- at one line's end and\nberg at the next can defeat a search that expects the joined spelling. [S1, S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6da78ffcd0ec","kind":"unclassified","anchor":"MyHeritage's **Names & Stories** collections offer structured records extracted from newspapers;\nOldNews offers newspaper material to search and read. For covered material, try structured event\nand relative fields. Follow the record's OldNews link or **View full newspaper page** control to\nread the printed article; record any access restriction. If one route fails, try the other with\nname variants or contextual words. [S7, H6, H7]","sources":["S7","H6","H7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-95104492714a","kind":"platform-ui","anchor":"These records were extracted by AI, and each carries an article summary that AI generated\n[H7 @2026-11-12]. MyHeritage's collection page, in its Internet Archive capture of 2026-07-17,\nwarns of mistakes such as incorrect relationships and advises reading the scanned page\n[H12 @2026-11-12]. Use the summary only to find the article, and quote and cite only the printed\narticle.","sources":["H7","H12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-743bd464b6f9","kind":"unclassified","anchor":"Read the whole article, continuation, page heading and surrounding entries. In censuses, inspect\nthe preceding and following pages for household continuation and nearby relatives. In yearbooks,\ninspect other pages and adjacent years for the same pupil's activities and name forms. [S1, S6]","sources":["S1","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e4f2a3eea48","kind":"unclassified","anchor":"When a tree-event map or locality list is available, retain its person/branch, event-type\nand date scope before choosing a place. Open the underlying people/events and preserve\ntheir references. Use that scoped list to choose the next locality and record series,\nkeeping uncertain locations and their source support visible. A shared pin establishes\nneither residence nor kinship. The [MyHeritage demonstration](https://www.youtube.com/watch?v=0v0fbjil9W8)\nillustrates this planning use; apply the controls actually available rather than assuming\na current map widget or export.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc34908a1f4a","kind":"unclassified","anchor":"If no image is supplied, save the collection citation, originating institution, reference number,\nvolume/page and original-source link that are actually provided. Use that locator to seek the image\nor request the record from its custodian. State explicitly when the original remains unavailable.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-064f78e181d5","kind":"unclassified","anchor":"Treat record matches, related-record suggestions and tree matches as new searches to evaluate.\nCompare names, roles, dates, places and relationships against the source; retain competing candidates.\nEnd with the coverage ledger and next discriminating search, not “MyHeritage has no such record.”\nUse the evidence/proof recipe for any proposed identity or negative-evidence conclusion. [S1, S5]","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9bc411f8eadb","kind":"unclassified","anchor":"If you copy information from a Smart Match or Record Match, review fields individually before\nsaving. Log the destination person, match/source link, previous value and copied value for each\nchange, keeping conflicting evidence visible. A fuller imported value is not necessarily a better\nsupported one. [S12, H9, H10]","sources":["S12","H9","H10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd3ec9a15fc6","kind":"unclassified","anchor":"For **Smart Matches**, undoing confirmation leaves already extracted and saved tree information\nin place. If a match later proves wrong, use the field log to revisit the affected person, facts\nand citations; check their other support before correcting or removing the imported assertions.\nVerify the resulting tree values separately from the match's status. Undoing confirmation alone\ndoes not repair the tree. [S12, H8]","sources":["S12","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-record-match-filter-recovery","kind":"platform-ui","anchor":"If expected Record Matches are not displayed, inspect **Settings**, the confidence slider and the record-type filters described by MyHeritage. Broaden one filter at a time and record what changes [S14 @2026-11-16]. Do not treat a filtered view as a search of every match, or assign an unverified numeric meaning to a slider position [S16 @2026-11-16].","sources":["S14","S16"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-record-match-tree-source","kind":"method","anchor":"Classify the source behind each Record Match before using it. MyHeritage identifies Geni, FamilySearch and WikiTree results as matches to other family trees [S15]. Follow their cited records and evaluate those separately; the Record Match label does not turn another user’s tree assertion into an independent historical record [S16].","sources":["S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-name-wildcards-help","kind":"platform-ui","anchor":"Do not type `*` or `?` into a MyHeritage name field to generate variants. MyHeritage's search-engine\nhelp documents exact-match, spelling-variation and initials options and no wildcard syntax\n[H1 @2026-11-12].","sources":["H1"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-name-wildcards-undocumented","kind":"platform-ui","anchor":"A Family Tree Magazine guide last updated in November 2026 reports that MyHeritage\nsupports neither character [S18 @2026-11-16], and MyHeritage's Knowledge Base says its own variant\nmatching should make wildcards unnecessary [S19 @2026-11-16]. A 2025 MyHeritage blog post gives `*`\na fixed letter range [S17 @2026-11-16]; neither that help page nor the Knowledge Base article\ndocuments the rule, so do not adopt it.\nAdmit variants with the spelling-variation option and enter each listed spelling as its own query.\nA wildcard query that returns nothing has not searched the variants.","sources":["S18","S19","S17"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-marriage-license-issue-date","kind":"method","anchor":"When a marriage index gives both a license issue date and a marriage date, log them separately.\nIf the entry gives only the issue date, leave the ceremony date open and look for a completed\ncertificate or return that records it. [S23, S24]","sources":["S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-nyc-vital-parent-search","kind":"platform-ui","anchor":"Run a parent-name search with the principal's name blank. In MyHeritage's **New York City Births,\n1866–1909**, start with the **Mother** field and inspect the child's recorded name in the hit\n[S20 @2026-11-18] [S21 @2026-11-18]. In **New York City Marriages, 1866–1949**, try a known parent\nof either spouse, since MyHeritage indexes parents as searchable people [S20 @2026-11-18].","sources":["S20","S21"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obituary-index-card-clippings","kind":"portal-availability","anchor":"For an obituary index hit, inspect the card image before moving on to the newspaper. In\nMyHeritage's **San Joaquin County Public Library Obituary Index, 1850–1991**, the card can carry\nthe newspaper clipping itself [S25 @2026-11-18] [S26 @2026-11-18] [S27 @2026-11-18]. Read the\nclipping separately from the card's annotations.","sources":["S25","S26","S27"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nyc-marriage-document-sets","kind":"platform-ui","anchor":"In MyHeritage's **New York City Marriages, 1866–1949**, page through the entire result. For\n1908–1937, both a Health Department certificate and a City Clerk license can document the same\nmarriage. MyHeritage groups them in one result when it has both [S20 @2026-11-18] [S22 @2026-11-18].\nWithin the City Clerk papers, check the officiant's completed certificate for witnesses\n[S20 @2026-11-18]. Record their names and any historical addresses or signatures on that page\nas leads for identifying them.","sources":["S20","S22"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nyc-death-reporter","kind":"platform-ui","anchor":"In MyHeritage's **New York City Deaths, 1866–1948**, check the scanned certificate for the person\nwho reported the death, even when the index has no reporter [S20 @2026-11-18]. Keep that role\ndistinct from the attending physician or the person who requested funeral services.","sources":["S20"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-france-deaths-coverage","kind":"portal-availability","anchor":"MyHeritage describes **France Deaths** as an index of INSEE data that can include births and deaths\nabroad [S33 @2026-11-20]. Keep those places eligible. The provider estimates that the index captures\nabout 8% of deaths in 1970 and about half in 1971 [S33 @2026-11-20]. After a zero in either year,\nleave the death unresolved and check the civil death register for the known locality. INSEE identifies civil\nregistration reports as the underlying source [S34 @2026-11-20].","sources":["S33","S34"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-latvia-jewish-birth-coverage","kind":"portal-availability","anchor":"In **Latvia, Jewish Birth Records from JewishGen**, check the town and year before interpreting\na miss. The index spans 1838–1921, with most entries from 1854–1909\n[S29 @2026-11-20] [S30 @2026-11-20]. Check coverage of the town's registers outside that concentration.","sources":["S29","S30"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scoped-research-form","kind":"platform-ui","anchor":"Run the target query from the category or subcategory form when you know the record type. For a\nsingle set, open its own form from the Collection Catalog or the category's collection list. Log\nthat scope before returning to global search [S28 @2026-11-20] [H1 @2026-11-20].","sources":["S28","H1"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-all-terms-exact-match","kind":"platform-ui","anchor":"Keep the all-terms exact-match switch off for the sparse baseline. Use field-level name matching\nwhen only the name should be exact. Turn on all-terms exact matching only when you intend to\nrequire exact matches on all the entered terms [S28 @2026-11-20] [H1 @2026-11-20].","sources":["S28","H1"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-pinsk-initials","kind":"platform-ui","anchor":"For a known deceased person in the **Index to Soviet Extraordinary Commission Pinsk Records from\nJewishGen**, try the surname alone or with the given-name initial. The index can reduce the given\nname to an initial, so a compulsory full name can hide a candidate [S29 @2026-11-20] [S31 @2026-11-20].","sources":["S29","S31"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-german-sanctions-geography","kind":"portal-availability","anchor":"Check **Germany, Revoked Citizenships and Property Seizures from JewishGen** for 1933–1945\ncitizenship, property or business sanctions. Keep former German residents and people in annexed parts of\nCzechoslovakia in scope. Read the type of action and last residence before interpreting the entry\n[S29 @2026-11-20] [S32 @2026-11-20].","sources":["S29","S32"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-spanish-exiles-title-dates","kind":"portal-availability","anchor":"For Spanish Civil War exile research, try **Spain, Migration to the Americas, 1880–1930** without\nrequiring the title's date range or a Spanish birthplace [S35 @2026-11-20] [S36 @2026-11-20].\nMyHeritage illustrates that exception with a 1942 Mexican immigration entry for an exile born in\nParis who had lived in Valencia [S35 @2026-11-20].","sources":["S35","S36"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-french-naturalization-decree","kind":"portal-availability","anchor":"In **France, Naturalizations**, use the decree date from the index to find the published decree.\nCheck both the *Bulletin des lois* and the *Journal officiel* for publication in 1924–1930.\nResidence in France leaves naturalization an open question\n[S37 @2026-11-20] [S38 @2026-11-20] [S39 @2026-11-20].","sources":["S37","S38","S39"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-newspaper-inferred-search-terms","kind":"platform-ui","anchor":"For a **Names & Stories** wedding search, try the documented marriage date in the event field.\nThe index can resolve relative wording using the issue date. For a wife named by given name only,\ntry her given name with her husband's surname as a separate query. Transcribe the words from the\nscan and label any date or surname that the index supplied [H7 @2026-11-20].","sources":["H7"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-newspaper-list-of-people","kind":"platform-ui","anchor":"Look below the **Names & Stories** snippet for other indexed people when a list is shown. Verify\neach person's role on the printed page before treating them as a relative [H7 @2026-11-20].","sources":["H7"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-french-newspaper-collection-routes","kind":"portal-availability","anchor":"For France, check both **France, Names & Stories in Newspapers** and **France, Names & Stories in\nNewspapers from OldNews.com**. Use the OCR and Gallica scan link for the first collection and the\nOldNews scan for the second. Log the newspaper, issue date and page to spot the same article in\nboth routes [S40 @2026-11-20] [S42 @2026-11-20] [S43 @2026-11-20] [S44 @2026-11-20].","sources":["S40","S42","S43","S44"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-barcelona-baptism-grandparents","kind":"portal-availability","anchor":"In **Spain, Catalonia, Barcelona Births and Baptisms, 1850–1923**, check both sets of grandparents\nand the parents' birthplaces and residence. Use the grandparents to distinguish similarly named\nparents and the birthplaces to choose which parish records to check next\n[S40 @2026-11-20] [S41 @2026-11-20].","sources":["S40","S41"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-filae-privacy-scope","kind":"portal-availability","anchor":"For **Filae Family Trees**, missing profiles may reflect the indexing rule. Filae limits sharing\nwith MyHeritage to non-confidential profiles treated as deceased, which restricts MyHeritage search\nresults and Record Matches [S45 @2026-11-20] [S46 @2026-11-20]. Leave the contents of the original\ntree unresolved when a profile is absent.","sources":["S45","S46"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-up-search-alert","kind":"platform-ui","anchor":"After an unproductive signed-in search, check the user's **Search Alert** settings and review any\nalert they supply against the saved query. MyHeritage documents exclusions for very common names\nand searches with too many results. Keep the manual follow-up on the worklist if no alert arrives\n[S47 @2026-11-20] [S48 @2026-11-20].","sources":["S47","S48"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-wills-notarial-collections","kind":"portal-availability","anchor":"For wills, check both **Wills & Probates** and **Court Records**. Try `notarial` in the catalog\nwith the relevant jurisdiction as well. **Netherlands, Notarial Records, 1600–1935** includes\nwills alongside other deeds, so a title search for `will` alone can miss a useful collection\n[S49 @2026-11-20] [S50 @2026-11-20] [S51 @2026-11-20].","sources":["S49","S50","S51"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-catalog-update-sort","kind":"platform-ui","anchor":"When revisiting an earlier search, set the Collection Catalog sort to **Last Updated**. Compare\nthe dates on relevant collections with the date of your earlier search and rerun the query in sets added\nor revised since then [S54 @2026-11-21] [S55 @2026-11-21]. A recent update by itself establishes\nnothing about the town or years added.","sources":["S54","S55"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scottish-civil-cases","kind":"platform-ui","anchor":"For a Scottish civil dispute, search **Scotland, Court of Session Processes, Acts and Decrees,\n1560–1930**. Use the case date and description to distinguish people with the same name\n[S61 @2026-11-21]. For criminal proceedings, start with the court or prosecution series instead\n[S62 @2026-11-21].","sources":["S61","S62"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scottish-crown-opinion","kind":"platform-ui","anchor":"Use **Scotland, Crown Counsel Procedure Books** to identify a possible prosecution\n[S56 @2026-11-21]. For a Crown Counsel opinion in the AD9 series, read the disposition.\nSome cases went to the High Court or Sheriff Court and others were dropped. Use the named court\nto look for trial papers and leave the trial unresolved until you find them [S57 @2026-11-21].","sources":["S56","S57"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scottish-prison-admissions","kind":"platform-ui","anchor":"For Scottish custody, check **Scotland, Prison Registers** for historical admissions of women\nand children as well as men. Keep the prison and admission year distinct from the person's\nresidence and birth details [S56 @2026-11-21] [S58 @2026-11-21] [S59 @2026-11-21].\nThe registers include untried prisoners. Verify any trial or conviction separately\n[S60 @2026-11-21].","sources":["S56","S58","S59","S60"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scotland-census-extract","kind":"portal-availability","anchor":"For an 1851 Scottish household, check the **1851 Scotland Census Extract** for a lead and\nconfirm access in the user's account [S52 @2026-11-21]. Use the locality and household details\nfrom a hit to find the return image on Scotland's People [S77 @2026-11-21].","sources":["S52","S77"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-piotrkow-jewish-births","kind":"portal-availability","anchor":"For a Piotrków Trybunalski birth, check **Piotrków Trybunalski Poland Births, 1808–1875**\nand verify access in the user's account [S52 @2026-11-21]. The collection indexes Jewish births.\nIf the community or year falls outside its scope, start with the appropriate local registers\n[S78 @2026-11-21] [S79 @2026-11-21].","sources":["S52","S78","S79"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-india-vital-coverage","kind":"portal-availability","anchor":"For India, match the event to **India, Births and Baptisms, 1786–1947**,\n**India, Marriages, 1792–1948**, or **India Deaths and Burials, 1719–1948**\n[S82 @2026-11-21] [S83 @2026-11-21]. Check coverage of the specific place and community.\nIf coverage is missing or unclear, follow the family to its local religious or community\nrecords or regional archives and keep the event unresolved [S82 @2026-11-21].","sources":["S82","S83"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-middle-name-keyword","kind":"platform-ui","anchor":"For a common first name and surname, try a documented, distinctive middle name as a separate\n**Keywords** query under **+ More**, if the form offers it [S66 @2026-11-21] [H1 @2026-11-21].\nCompare it with the baseline before requiring that middle name in later searches.","sources":["S66","H1"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-chemung-announcement-dates","kind":"platform-ui","anchor":"In **New York, Chemung County Births**, keep the child's birth date and the announcement's\npublication date in separate fields. Use the surname and parents to identify the intended\nnotice [S61 @2026-11-21]. Use the publication date to locate the issue in the Chemung County\nLibrary District's newspaper holdings. A missing notice leaves the civil birth entry open\n[S63 @2026-11-21].","sources":["S61","S63"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-batavian-french-studbooks","kind":"platform-ui","anchor":"Check **Netherlands, Batavian-French Army Studbooks, 1795–1813** when service may have\ncrossed Dutch and French commands [S58 @2026-11-21]. For the Dutch studbooks, use the\nNationaal Archief's inventory **2.01.15** and record the inventory item and folio. If a name\nis missing, check the supplementary extracts before drawing a conclusion about the person's\nservice [S64 @2026-11-21].","sources":["S58","S64"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-gothenburg-departure","kind":"platform-ui","anchor":"If an arrival search fails for a traveler who may have sailed from Gothenburg, try\n**Sweden, Gothenburg, Passenger Lists 1869–1951**. Use the departure date, transit port and\ndestination, where shown, to choose the next passenger list. Keep the Swedish departure\nand the eventual arrival as distinct events [S71 @2026-11-21] [S72 @2026-11-21].","sources":["S71","S72"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-netherlands-newspaper-ocr","kind":"platform-ui","anchor":"For the Netherlands, compare **Netherlands, Names & Stories in Newspapers** with the\nissue-level **Netherlands Newspapers from OldNews.com**. In the structured result, read the\nfull OCR text when shown and note the paper, publication place and issue date. If the name\nindex misses, search the issue collection for the notice or a relative, or browse an\nidentified issue [S73 @2026-11-21] [S74 @2026-11-21] [S75 @2026-11-21].","sources":["S73","S74","S75"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-paywall-locator","kind":"portal-availability","anchor":"Before treating a **Names & Stories** hit as verified, use its newspaper title, publication\nplace and date to locate the printed page. Check the user's access to full pages on OldNews\nthrough MyHeritage Omni or OldNews Pro. If the page is blocked, use the issue locator to seek\nthe same scan in another holding and keep the extract provisional\n[S73 @2026-11-21] [S76 @2026-11-21] [S80 @2026-11-21].","sources":["S73","S76","S80"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dutch-death-notices","kind":"portal-availability","anchor":"For a known deceased person in the Netherlands, check **Online Familieberichten (Dutch Death Notices)** in the\nuser's MyHeritage account and use the original Online Familieberichten project if the entry is unavailable.\nIdentify the item as a death announcement, funeral notice or memorial card before using its dates\n[S52 @2026-11-21] [S81 @2026-11-21].","sources":["S52","S81"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-british-obituary-locators","kind":"platform-ui","anchor":"In **England, Funeral Notices and Obituaries** and **Wales, Funeral Notices and Obituaries**,\nuse any last and former residences to distinguish candidates. To locate the original obituary,\nuse the newspaper title and its publication place and date. Keep those separate from the\ndeceased's residence and death date [S58 @2026-11-21].","sources":["S58"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-census-overseas-islands","kind":"portal-availability","anchor":"For the **1950 United States Federal Census**, include Canton (Kanton), Johnston, Midway\nor Wake when the research points to one of those islands. Open the corresponding schedule\nto verify the entry [S68 @2026-11-21] [S69 @2026-11-21] [S85 @2026-11-21].","sources":["S68","S69","S85"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-census-enumeration-district","kind":"method","anchor":"After a MyHeritage 1950 U.S. census name miss, use a map of the known 1950 residence to identify\nthe enumeration district. Browse the population schedules at the National Archives by district\nnumber. Check any sheets numbered from 71 onward for people enumerated out of order [S70].\nDo not attribute a miss to the initial state-by-state rollout [S67, S69].","sources":["S70","S67","S69"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-paywalled-result-list","kind":"portal-availability","anchor":"A MyHeritage search can run without the subscription that opens a result\n[S53 @2026-11-21]. When a hit is paywalled, check what the result list shows in the user's\nown account. Save any visible birth or marriage date, newspaper year or identifying image\ndetail as a lead. Use it to choose a register or newspaper issue to check elsewhere\n[S52 @2026-11-21]. Keep the blocked record unverified.","sources":["S53","S52"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-originating-tree-profile","kind":"platform-ui","anchor":"If a historical-record search returns a profile from a MyHeritage family tree, look at the bottom\nof its record page for the link to the originating tree. Inspect the profile and follow any\nrecord citations as leads [S65 @2026-11-21] [S84 @2026-11-21].","sources":["S65","S84"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-record-only-filter","kind":"platform-ui","anchor":"When tree profiles crowd out documentary results, select **Historical records** on desktop\nor **All Collections → Records** on mobile web if the filter is available [S95 @2026-11-22]. Log that\nscope. Search Connect lists other users’ queries under **Family Trees** [S97 @2026-11-22]. Switch\nback to **All Collections** for a separate pass if you need tree leads [S95 @2026-11-22].","sources":["S95","S97"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-search-connect-privacy","kind":"platform-ui","anchor":"Before running a sensitive query, check **My Privacy → My member preferences → Enable Search\nConnect**. Have the user clear that option if they want to keep their search terms out of Search\nConnect and disable recent searches [S95 @2026-11-22] [S96 @2026-11-22]. Search Connect can expose query details to\nother members [S97 @2026-11-22]. Keep the research log local if the query must stay private.","sources":["S95","S96","S97"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-recent-search-card","kind":"platform-ui","anchor":"If **Recent searches** is available, identify the card by the query’s name, birth year and place,\nthen reopen the query from that card. Log the filters you actually see before comparing the\nresults. Use the card’s **X** to remove it from the list. Check **Search Connect** separately\nwhen the goal is to stop future searches from appearing there [S95 @2026-11-22].","sources":["S95"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-retired-record-finder","kind":"portal-availability","anchor":"Use the historical-record search form when an older guide directs you to the original\n**AI Record Finder** Chat tab [S118 @2026-11-22]. MyHeritage retired that beta on 2024-08-09 [S117 @2026-11-22].","sources":["S118","S117"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nrw-registry-office","kind":"portal-availability","anchor":"For **Germany, North Rhine Westphalia, Deaths 1874–1938**, identify the specific registry office\n(*Standesamt*) and year. The 2022 district list and later Aachen-to-Rheydt office range describe\nindividual releases [S98 @2026-11-22] [S99 @2026-11-22]. The collection description includes parts of Düsseldorf and\nKöln [S100 @2026-11-22]. After a miss, use the office and year to check the Landesarchiv Nordrhein-Westfalen’s\nfinding aid for the duplicate death register [S101 @2026-11-22].","sources":["S98","S99","S100","S101"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cheshire-parish-and-copy","kind":"portal-availability","anchor":"For a Cheshire baptism, compare **Cheshire Parish Births and Baptisms** with **Cheshire Bishop’s\nTranscripts Baptisms**. For a marriage, use **Cheshire Bishop’s Transcripts Marriages** alongside\nthe parish register [S105 @2026-11-22]. The bishop’s transcript is an abbreviated copy. If the register is\nmissing or illegible, check the transcript for the same parish and year. Record which version\nyou examined and check the parish holdings through Cheshire Archives [S106 @2026-11-22].","sources":["S105","S106"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-france-banns","kind":"portal-availability","anchor":"In **France, Church Marriages and Civil Marriages**, open the image and identify whether it\nshows banns, a church marriage or a civil act [S110 @2026-11-22] [S108 @2026-11-22] [S109 @2026-11-22]. Use a banns entry to look for\nthe marriage act. Check departmental coverage and turn to the local registers after a miss [S109 @2026-11-22].","sources":["S110","S108","S109"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-litvaksig-district-and-year","kind":"portal-availability","anchor":"Include the **Lithuanian-Jewish Revision Lists from LitvakSIG** for a relevant locality now in\nPoland or Belarus. Check the historical district and nearby places of registration, even if the\nfamily lived elsewhere. Check which years survive before interpreting a gap in the results\n[S102 @2026-11-22] [S103 @2026-11-22] [S104 @2026-11-22].","sources":["S102","S103","S104"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-gravestone-transcription-keywords","kind":"platform-ui","anchor":"In **Canada, Gravestones and Memorials**, run a documented relative’s name in **Keywords**.\nThat searches the inscription transcription, where a person can be mentioned without being the\nprincipal name in the entry. Check the inscription before assigning the principal’s dates or\nburial place to the relative [S111 @2026-11-22] [S112 @2026-11-22].","sources":["S111","S112"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-newspaper-index-groups","kind":"portal-availability","anchor":"In the Collection Catalog, look up **OldNews** and the publication’s state or country. Open a\ngrouped **Names & Stories** collection when that state appears among several in its title.\nFor example, Ohio shares a collection with Indiana and Michigan. Check the newspaper’s city\nand years before treating a search in the group as coverage of that title [S86 @2026-11-22] [S87 @2026-11-22] [S88 @2026-11-22].","sources":["S86","S87","S88"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-separate-newspaper-name-index","kind":"portal-availability","anchor":"Alongside OldNews, try **Newspaper Name Index, USA, Canada, and Australia** for a U.S. or\nCanadian paper. This structured index has a **Spouse** field and applies synonym matching\ndifferently to given names and surnames. Use a known spouse as a separate pass, and try\ndocumented surname forms explicitly. Keep the publication title, place and date from a hit to\nretrieve the page [S86 @2026-11-22] [S89 @2026-11-22] [S90 @2026-11-22].","sources":["S86","S89","S90"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-title-coverage","kind":"platform-ui","anchor":"After a name-index miss, use **Browse by location** on OldNews. Drill down to the newspaper’s\npublication locality and check the listed titles and date spans [S86 @2026-11-22] [S91 @2026-11-22] [S92 @2026-11-22]. If the town’s\npaper is missing or the story might have been reported elsewhere, check nearby publications and\ntitles from towns where relatives lived at the time [S86 @2026-11-22]. Seek any uncovered title or year in\nanother holding.","sources":["S86","S91","S92"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-marriage-event","kind":"portal-availability","anchor":"For newspaper wedding leads, check the country’s **Marriages from Newspapers on OldNews.com**\ncollection for the United States, Australia, Canada or New Zealand [S86 @2026-11-22] [S87 @2026-11-22] [S93 @2026-11-22] [S94 @2026-11-22].\nRead the actual notice and classify it as a marriage report, engagement, license, divorce\nor advance announcement. Record a planned wedding date separately from publication and look\nfor evidence of the ceremony. If a couple-name query misses, try the known officiant or\nattendant as a separate text or **Keywords** query where available [S93 @2026-11-22] [S94 @2026-11-22].","sources":["S86","S87","S93","S94"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-australian-newspaper-images","kind":"portal-availability","anchor":"For a known Australian title, check **Australia Newspapers** alongside the OldNews indexes.\nThe scans for that OCR collection come from the National Library of Australia’s Trove. Use the\npaper, issue date and page from the hit to identify the same issue in Trove [S105 @2026-11-22] [S107 @2026-11-22].","sources":["S105","S107"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-poland-baltic-publication-scope","kind":"portal-availability","anchor":"Match the publication locality to the stated scope of the OCR collection. **Poland Newspapers\nfrom OldNews.com** uses modern Polish borders [S113 @2026-11-22] [S122 @2026-11-22]. **Baltic Newspapers from OldNews.com**\nlists coverage in Latvia and Estonia [S113 @2026-11-22]. For a historical locality outside those bounds,\nlook for the paper under the country that now contains the town or in another holding.","sources":["S113","S122"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-consolidated-census-variants","kind":"platform-ui","anchor":"Use **United States Consolidated Federal Censuses, 1790–1950** to find candidate appearances\nacross census years. An entry can represent one census or several [S114 @2026-11-22] [S115 @2026-11-22]. Open **See\nvariations from sources** to compare each recorded name and birth detail. Follow the linked\nreturns and check the named household and locality for each year [S114 @2026-11-22]. Follow a relative’s\nlinked consolidated entry when offered and verify that person against the returns too [S114 @2026-11-22].\nTreat each cross-year link as a candidate identification until the returns support it.","sources":["S114","S115"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-profile-initiated-search","kind":"platform-ui","anchor":"When an existing tree profile has no useful Record Match, use **Research this person** from the\nprofile page to open a historical-record search. Inspect the prefilled details, remove\nunsupported tree values and compare the result with a sparse search. Keep the automated\nmatch list open as a separate source of leads [S116 @2026-11-22] [S84 @2026-11-22].","sources":["S116","S84"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-obituary-indexes","kind":"portal-availability","anchor":"For a death notice, try the separate **Obituary Index from OldNews.com** for Australia, Canada\nor the United States. Choose the index by the newspaper’s publication country. Keep the death\nor burial details separate from the obituary’s publication place and date [S86 @2026-11-22] [S119 @2026-11-22] [S120 @2026-11-22] [S121 @2026-11-22].","sources":["S86","S119","S120","S121"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-service-death","kind":"portal-availability","anchor":"For a suspected death in Finnish military service, search **Finland, Second World War Casualties**\nwithin MyHeritage’s stated 1938–1944 scope. Record unit, rank, death date and place, and burial\nplace separately. If the entry mentions a disappearance, capture or wound, record it as a\nseparate event [S137 @2026-11-23]. When the death is uncertain or falls outside\nthe stated span, check the National Archives of Finland’s guide for the service card\n(*kantakortti*) and the series for the incident [S138 @2026-11-23].","sources":["S137","S138"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-holland-america-booking","kind":"portal-availability","anchor":"For a deceased traveler who may have booked with the Holland America Line, search MyHeritage\ncollection **20275, Netherlands, Holland-America Line, Passenger Lists**, for 1900–1969. Keep the\nbooking place, departure port and date, ship, and recorded arrival place in separate fields\n[S134 @2026-11-23] [S135 @2026-11-23]. Check the Rotterdam City Archives scan and its passenger\ncount. A group booking can carry only the booker’s name. If a suspected companion is missing\nfrom the list, try the booker in MyHeritage and check an arrival manifest for the voyage\n[S136 @2026-11-23].","sources":["S134","S135","S136"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-ocr-viewer","kind":"platform-ui","anchor":"In the OldNews page viewer, open the full-page OCR to compare a difficult hit with the scan.\nIf the print is faint, adjust the viewer’s contrast or brightness before marking the passage\nunreadable. Transcribe from the page image [H6 @2026-11-23] [S125 @2026-11-23].","sources":["H6","S125"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-publication-date-and-title","kind":"platform-ui","anchor":"In a standalone OldNews search, use **More options** under **Publication year**. Select\n**Match year exactly** for a known year or **Year range** for explicit bounds. For a known issue,\nchoose **Exact date** and enter its publication day, month and year. Broaden the bounds when the\npublication date is uncertain [S124 @2026-11-23]. The results also offer **Publication date**\nand **Publication name** filters. Use the latter to select the verified newspaper title and\ncheck the publication locality if titles are similar [H6 @2026-11-23] [S123 @2026-11-23] [S125 @2026-11-23].","sources":["S124","H6","S123","S125"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-publication-place","kind":"platform-ui","anchor":"Set **Publication place** to the newspaper’s locality or country. Use **Place must match**\nwhen the search requires that publication place. Clear it and widen the place for possible\ncoverage from other cities or countries. Put the event place in the terms if it helps identify\nthe story [H6 @2026-11-23] [S125 @2026-11-23] [S126 @2026-11-23].","sources":["H6","S125","S126"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nordic-newspaper-title-and-fraktur","kind":"portal-availability","anchor":"For a Nordic title, compare the title and year listed on OldNews with the coverage of\nMyHeritage’s **Nordic Newspapers from OldNews.com** before repeating a query. Record any issue\nfound through both routes once [S126 @2026-11-23] [S127 @2026-11-23]. For a Fraktur title in the\ncovered material, retry an earlier OCR miss on OldNews. Browse the likely issue if the text query still\nmisses [S126 @2026-11-23] [S128 @2026-11-23].","sources":["S126","S127","S128"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-viewer-page-navigation","kind":"platform-ui","anchor":"In the OldNews viewer, use the arrows or page selector to check other pages of the same issue\nfor a continuation or related material. Record the page number for each part\n[H6 @2026-11-23] [S129 @2026-11-23].","sources":["H6","S129"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-oldnews-local-page-export","kind":"platform-ui","anchor":"When keeping an OldNews copy, check the controls available in the user’s account. Use **Download**\nfor the full-page JPEG and the **Print** control for a paper copy. Keep the issue and page citation\nwith the copy. Mark the passage separately if needed. The downloaded image omits the search\nhighlights [H6 @2026-11-23] [S130 @2026-11-23] [S131 @2026-11-23].","sources":["H6","S130","S131"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-consolidated-census-gap-and-timeline","kind":"platform-ui","anchor":"For an omitted census year, search the corresponding single-year collection in MyHeritage or\nbrowse the schedules for the likely locality through the National Archives’ links by year.\nLeave the reason for the gap open [S114 @2026-11-23] [S144 @2026-11-23]. Check each year’s\nreported age before using an estimated birth year. For residence and occupation, record the\nvalue and return locator separately for each census year [S114 @2026-11-23].","sources":["S114","S144"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-indiana-biography-index-card","kind":"portal-availability","anchor":"Use **Indiana Biographies** (collection 20489) as a publication index. If the result supplies a\ncard image, use it to verify the publication title, date and any page reference. Locate that\nedition or issue before citing a biographical detail. For a difficult title, check the Indiana\nState Library’s biography index source list [S139 @2026-11-23] [S140 @2026-11-23].","sources":["S139","S140"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-historical-patent-filing-date","kind":"platform-ui","anchor":"Search **Inventors of Historical Patents** (collection 10834) by the candidate’s name. Use the\nindex’s publication country and date to find the patent. Open the patent’s first page and\nrecord the invention, patent number and application filing date separately from the publication\ndate [S141 @2026-11-23] [S142 @2026-11-23] [S143 @2026-11-23].","sources":["S141","S142","S143"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-discovery-preview","kind":"platform-ui","anchor":"In an existing tree, open **Photo Discoveries** and preview the offered photos with **View\nDiscovery** before using any of them. Note the source family site and any supplied title,\ndescription or tags. Open **View original photo** to inspect the uncropped image. Verify\nthe matched profile against documented dates and relationships. Record a person’s recognition\nas their attributed claim and leave identity unresolved if the only clue is resemblance\n[S132 @2026-11-23] [S133 @2026-11-23].","sources":["S132","S133"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
