  - {"id":"S41","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-20974/spain-catalonia-barcelona-births-baptisms-1850-1923"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"public collection description read 2026-11-20","entry_sha256":"395c013216b4219b61f6c3b0a9ea9834abdc9a242b11c752e7d70feb0c51a6bf","claims":["C-barcelona-baptism-grandparents"],"review":"reviewed"}
  - {"id":"S42","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/a-breakthrough-in-france-genealogy-myheritage-publishes-a-new-collection-of-731-million-records-extracted-from-french-newspapers/"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"read 2026-11-20","entry_sha256":"dbb57deb2573ff8bd98e88e61ec05f9262d067a24ec2de0d30870b57f2d8ff12","claims":["C-french-newspaper-collection-routes"],"review":"reviewed"}
  - {"id":"S43","kind":"catalogue","urls":["https://www.myheritage.nl/research/collection-12031/france-names-stories-in-newspapers?legacyCategoryCollectionUrl=1"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"public Dutch collection description read 2026-11-20","entry_sha256":"d044ced536e7c597deb3d3634847efa21d1cf1e10fe651c641702c6f90718e0e","claims":["C-french-newspaper-collection-routes"],"review":"reviewed"}
  - {"id":"S44","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-12033/france-names-stories-in-newspapers-from-oldnewscom"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"public collection description read 2026-11-20","entry_sha256":"576522947b0a9ada377cc8d6d2c5f6841ced72a8a5331f1dd5ac8d5489b7ac25","claims":["C-french-newspaper-collection-routes"],"review":"reviewed"}
  - {"id":"S45","kind":"web-page","urls":["https://blog.myheritage.com/2022/02/new-historical-records-added-in-january-and-february-2022/"],"published":"2022-02-27","retrieved":"2026-11-20","access":"read","rights":null,"basis":"read 2026-11-20","entry_sha256":"bb41242ffbd66be45ec03ee7bfa9c7177902ed91277ca523ec0dfa7ae52cbaa7","claims":["C-filae-privacy-scope"],"review":"reviewed"}
  - {"id":"S46","kind":"web-page","urls":["https://www.filae.com/ressources/terms-and-conditions/"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"tree indexing provision read 2026-11-20","entry_sha256":"193b06f352b7dc948747dc7334b2144f11b60294a1183e138a1918c3c619e851","claims":["C-filae-privacy-scope"],"review":"reviewed"}
  - {"id":"S47","kind":"web-page","urls":["https://blog.myheritage.com/2024/07/cousins-find-each-other-after-their-families-were-separated-for-100-years/"],"published":"2024-07-28","retrieved":"2026-11-20","access":"read","rights":null,"basis":"read 2026-11-20","entry_sha256":"cfd9c11335d1f1c5be00541d02fb81247ffd8e3846f2747ac7bee89e5bb12303","claims":["C-follow-up-search-alert"],"review":"reviewed"}
  - {"id":"S48","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852412-what-are-search-alerts"],"published":"2026-07-21","retrieved":"2026-11-20","access":"read","rights":null,"basis":"read 2026-11-20","entry_sha256":"ff0042a6a84a0390255d5936709633f16438412869de63ed75f45a07f2199b71","claims":["C-follow-up-search-alert"],"review":"reviewed"}
  - {"id":"S49","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/how-to-find-wills-online-and-why-theyre-so-valuable/"],"published":"2025-06-18","retrieved":"2026-11-20","access":"read","rights":null,"basis":"read 2026-11-20","entry_sha256":"b589b754c2055a003258f0d39f32845eee2b11501fd76706344052558cb57560","claims":["C-wills-notarial-collections"],"review":"reviewed"}
  - {"id":"S50","kind":"catalogue","urls":["https://www.myheritage.com/research/records-catalog/government-land-court-wills/catid-9000"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"public catalog read 2026-11-20","entry_sha256":"f756a3e55813ae8a31475764a858f6b818962bc96388fb26841b653a9ac832db","claims":["C-wills-notarial-collections"],"review":"reviewed"}
  - {"id":"S51","kind":"catalogue","urls":["https://www.myheritage.nl/research/collection-10754/netherlands-notarial-records-1600-1935"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"public Dutch collection description read 2026-11-20","entry_sha256":"69bf99877915021133edc9ba763f19de588e6d5992937bb03b489af5eb088b35","claims":["C-wills-notarial-collections"],"review":"reviewed"}
claims:
  - {"id":"C-4526af07fbc6","kind":"unclassified","anchor":"- Separate **documented facts, estimates and hypotheses** before constructing a query. Do not\n  require a guessed maiden name, calculated birth year or uncertain birthplace in every search.\n- Check the collection description and actual form. Categories and individual collections offer\n  different fields; a field offered by the general search is not a promise of complete indexing.\n- Names are optional search inputs. Use the offered spelling, initials and additional-field\n  controls deliberately; do not assume an old demonstration describes today's defaults. [H1]\n- Preserve the sparse baseline before tightening it. If a tighter query fails, relax one condition\n  at a time and record the reason; changing everything together conceals what excluded the record.\n- Verify original wording and the person's role. Transliterated results, OCR, extracted relatives,\n  inferred dates, trees and automated matches are finding aids, not independently established facts.\n- Route AI transcription/translation to `ai-for-documentary-records.md`, bounded Ashkenazi given-name\n  lookup to `beider-given-name-variants.md`, and identity/conflict/negative-evidence rulings to\n  `evidence-proof-judgment.md`. This recipe prepares candidates and search coverage, not a verdict.","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2049e297d11","kind":"unclassified","anchor":"Clear previous catalog filters, then try jurisdiction and record-type words in the collection\ntitle/description search: school, register, passport, probate, newspaper. These keywords locate\ncollections; they are not a search for every personal name inside their records. [S2, H2]","sources":["S2","H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7c016824bb39","kind":"unclassified","anchor":"For Jewish research, try Jewish-related descriptions alongside the relevant town and civil,\nreligious or national record groups. A neutral collection title may contain relevant material.\nNeither a keyword match nor its absence establishes complete coverage of a community. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b75033a591f","kind":"unclassified","anchor":"Use catalog type, location and time filters to discover plausible sets, then read their descriptions.\nCheck date span, locality, record type, source institution, image availability and update information.\nA broad title is not assurance that every town, year or surviving volume is included. [H2, H3]","sources":["H2","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e78de9ec267","kind":"unclassified","anchor":"Start sparsely, select a suitable collection, then add one supported event or relative.\nIf candidates disappear, remove the weakest condition first. [S1, S6, H1]","sources":["S1","S6","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8d422539407","kind":"unclassified","anchor":"Create a short variant list: native spelling, maiden and married surnames, familiar given name,\ninitials and middle names. Try fictional Anna Maria Weiss as Anna Weiss and Maria Weiss, then the\ndocumented married surname. Use offered initials matching or exact-spelling controls consciously. [H1]","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3666b16e59cc","kind":"unclassified","anchor":"An exact form can reduce a common-name result set, but also exclude abbreviated or reordered text.\nIn newspapers, a woman may appear under her husband's name or an honorific. Test those forms as\nseparate leads; do not turn a familiar name or shared surname into an identity conclusion. [S1, S3, H5]","sources":["S1","S3","H5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-94f348f05b18","kind":"unclassified","anchor":"MyHeritage's Global Name Translation can match name versions, nicknames and different alphabets,\nand transliterate returned names into the query language. That convenience can hide the precise\noriginal spelling. Save the native name alongside the displayed version. [S1, S4, H4]","sources":["S1","S4","H4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0bdcecf974cf","kind":"platform-ui","anchor":"In the search form, the filters under **+ More** include an option to show results from other\nlanguages [H1 @2026-11-12]. Record its state with each query. With the option off, a zero says\nnothing about records in other languages or scripts. With it on, a zero still does not prove\nabsence. In the Internet Archive capture of 2026-07-17 of a MyHeritage collection page, the search\nform's tooltip says a translation shown in square brackets is not in the original data and may be\ninaccurate [H12 @2026-11-12].","sources":["H1","H12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-853c577b71a3","kind":"unclassified","anchor":"Distinguish birth, marriage, death, residence and publication dates before choosing a field.\nCurrent search forms support year or full-date entry; use the precision the evidence warrants.\nIf a range control is unavailable, test neighboring years separately or omit the weak date. [H1]","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-950398d4b197","kind":"unclassified","anchor":"A school yearbook's publication year differs from a pupil's birth year. A birth year inferred from\ngrade or age remains an estimate. An obituary's publication date may follow the death; an article\ncan commemorate an event decades earlier. Do not force all those dates into birth-year search. [S3, S6]","sources":["S3","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ae8b1dbef46b","kind":"unclassified","anchor":"In a civil registration index, verify whether a quarter denotes registration rather than birth;\nkeep certificate volume/page locators. A pension file can be created years after military service:\ndo not restrict discovery to the war years alone. [S5, S9]","sources":["S5","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-794e4af35747","kind":"unclassified","anchor":"Identify birthplace, residence, event location, publication town and collecting jurisdiction.\nA fictional death in Millford may be reported by a newspaper published in nearby Ashbridge.\nTry Millford as a keyword while broadening the publication-place restriction. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b2f9e97c60e9","kind":"unclassified","anchor":"Check neighboring towns, historical spellings and jurisdictions created by border changes.\nSearch the countries under which the locality's records might be cataloged, then inspect the\ncollection description. A modern national filter can conceal records organized another way. [S1, S5]","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-72166c024680","kind":"method","anchor":"A Germany birthplace can appear in a U.S. census return [S8]. Follow the collection title and its creator to identify the source. Conversely, U.S. nationals who served with Canadian forces may appear in Canadian military records [S9]. Record the person’s role and the jurisdiction responsible for the record separately.","sources":["S8","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-136f92537ce7","kind":"unclassified","anchor":"Use the additional-fields control, currently labelled **+More**, for relatives, life events,\nkeywords or gender where offered. Test a known parent or spouse when the target's own name or\ndates are missing. Avoid filling every relative field with guesses. [S1, H1]","sources":["S1","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c1f4520e102c","kind":"unclassified","anchor":"Alternatively search the relative directly, then inspect their household or named associates.\nIn passenger records a person can appear as a destination contact or relative remaining abroad,\nas well as a traveler. Read the role and column: a name hit does not establish immigration. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4d0110c428ed","kind":"unclassified","anchor":"A property advertisement or legal notice may identify an address without naming the ancestor.\nUse period occupation terms, street-name variants and relevant local vocabulary. A contextual hit\nlocates a page to read; it does not establish who occupied the address at another date. [S2, S3, S6]","sources":["S2","S3","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bbe930028eab","kind":"unclassified","anchor":"For a documented local business, locality and period, consider an available local school yearbook\nfrom that period and inspect its actual advertising section, often near the back. The business\nowner need not be known as a pupil. Record the school, edition/year and page or image locator\nwith the advertisement's literal business name, address and any pictured premises, then seek\ncorroborating records. An advertisement alone does not establish ownership, school attendance\nor patronage. Keep an unavailable edition or uninspected section as a gap. [S10, S11]","sources":["S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c3030dfeffd3","kind":"unclassified","anchor":"Check whether the same material has a structured name index and a full-text counterpart.\nNames can be visible on a page but absent from the extracted name index. Search an available\ntext version with a surname, nickname, school or activity, then inspect the page. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-29b789392698","kind":"unclassified","anchor":"Compare a returned page with its OCR text when available. Look for damaged print, misread letters,\ncolumns read out of order and names split across lines. A printed Rosen- at one line's end and\nberg at the next can defeat a search that expects the joined spelling. [S1, S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6da78ffcd0ec","kind":"unclassified","anchor":"MyHeritage's **Names & Stories** collections offer structured records extracted from newspapers;\nOldNews offers newspaper material to search and read. For covered material, try structured event\nand relative fields. Follow the record's OldNews link or **View full newspaper page** control to\nread the printed article; record any access restriction. If one route fails, try the other with\nname variants or contextual words. [S7, H6, H7]","sources":["S7","H6","H7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-95104492714a","kind":"platform-ui","anchor":"These records were extracted by AI, and each carries an article summary that AI generated\n[H7 @2026-11-12]. MyHeritage's collection page, in its Internet Archive capture of 2026-07-17,\nwarns of mistakes such as incorrect relationships and advises reading the scanned page\n[H12 @2026-11-12]. Use the summary only to find the article, and quote and cite only the printed\narticle.","sources":["H7","H12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-743bd464b6f9","kind":"unclassified","anchor":"Read the whole article, continuation, page heading and surrounding entries. In censuses, inspect\nthe preceding and following pages for household continuation and nearby relatives. In yearbooks,\ninspect other pages and adjacent years for the same pupil's activities and name forms. [S1, S6]","sources":["S1","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e4f2a3eea48","kind":"unclassified","anchor":"When a tree-event map or locality list is available, retain its person/branch, event-type\nand date scope before choosing a place. Open the underlying people/events and preserve\ntheir references. Use that scoped list to choose the next locality and record series,\nkeeping uncertain locations and their source support visible. A shared pin establishes\nneither residence nor kinship. The [MyHeritage demonstration](https://www.youtube.com/watch?v=0v0fbjil9W8)\nillustrates this planning use; apply the controls actually available rather than assuming\na current map widget or export.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc34908a1f4a","kind":"unclassified","anchor":"If no image is supplied, save the collection citation, originating institution, reference number,\nvolume/page and original-source link that are actually provided. Use that locator to seek the image\nor request the record from its custodian. State explicitly when the original remains unavailable.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-064f78e181d5","kind":"unclassified","anchor":"Treat record matches, related-record suggestions and tree matches as new searches to evaluate.\nCompare names, roles, dates, places and relationships against the source; retain competing candidates.\nEnd with the coverage ledger and next discriminating search, not “MyHeritage has no such record.”\nUse the evidence/proof recipe for any proposed identity or negative-evidence conclusion. [S1, S5]","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9bc411f8eadb","kind":"unclassified","anchor":"If you copy information from a Smart Match or Record Match, review fields individually before\nsaving. Log the destination person, match/source link, previous value and copied value for each\nchange, keeping conflicting evidence visible. A fuller imported value is not necessarily a better\nsupported one. [S12, H9, H10]","sources":["S12","H9","H10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd3ec9a15fc6","kind":"unclassified","anchor":"For **Smart Matches**, undoing confirmation leaves already extracted and saved tree information\nin place. If a match later proves wrong, use the field log to revisit the affected person, facts\nand citations; check their other support before correcting or removing the imported assertions.\nVerify the resulting tree values separately from the match's status. Undoing confirmation alone\ndoes not repair the tree. [S12, H8]","sources":["S12","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-record-match-filter-recovery","kind":"platform-ui","anchor":"If expected Record Matches are not displayed, inspect **Settings**, the confidence slider and the record-type filters described by MyHeritage. Broaden one filter at a time and record what changes [S14 @2026-11-16]. Do not treat a filtered view as a search of every match, or assign an unverified numeric meaning to a slider position [S16 @2026-11-16].","sources":["S14","S16"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-record-match-tree-source","kind":"method","anchor":"Classify the source behind each Record Match before using it. MyHeritage identifies Geni, FamilySearch and WikiTree results as matches to other family trees [S15]. Follow their cited records and evaluate those separately; the Record Match label does not turn another user’s tree assertion into an independent historical record [S16].","sources":["S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-name-wildcards-help","kind":"platform-ui","anchor":"Do not type `*` or `?` into a MyHeritage name field to generate variants. MyHeritage's search-engine\nhelp documents exact-match, spelling-variation and initials options and no wildcard syntax\n[H1 @2026-11-12].","sources":["H1"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-name-wildcards-undocumented","kind":"platform-ui","anchor":"A Family Tree Magazine guide last updated in November 2026 reports that MyHeritage\nsupports neither character [S18 @2026-11-16], and MyHeritage's Knowledge Base says its own variant\nmatching should make wildcards unnecessary [S19 @2026-11-16]. A 2025 MyHeritage blog post gives `*`\na fixed letter range [S17 @2026-11-16]; neither that help page nor the Knowledge Base article\ndocuments the rule, so do not adopt it.\nAdmit variants with the spelling-variation option and enter each listed spelling as its own query.\nA wildcard query that returns nothing has not searched the variants.","sources":["S18","S19","S17"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-marriage-license-issue-date","kind":"method","anchor":"When a marriage index gives both a license issue date and a marriage date, log them separately.\nIf the entry gives only the issue date, leave the ceremony date open and look for a completed\ncertificate or return that records it. [S23, S24]","sources":["S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-nyc-vital-parent-search","kind":"platform-ui","anchor":"Run a parent-name search with the principal's name blank. In MyHeritage's **New York City Births,\n1866–1909**, start with the **Mother** field and inspect the child's recorded name in the hit\n[S20 @2026-11-18] [S21 @2026-11-18]. In **New York City Marriages, 1866–1949**, try a known parent\nof either spouse, since MyHeritage indexes parents as searchable people [S20 @2026-11-18].","sources":["S20","S21"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obituary-index-card-clippings","kind":"portal-availability","anchor":"For an obituary index hit, inspect the card image before moving on to the newspaper. In\nMyHeritage's **San Joaquin County Public Library Obituary Index, 1850–1991**, the card can carry\nthe newspaper clipping itself [S25 @2026-11-18] [S26 @2026-11-18] [S27 @2026-11-18]. Read the\nclipping separately from the card's annotations.","sources":["S25","S26","S27"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nyc-marriage-document-sets","kind":"platform-ui","anchor":"In MyHeritage's **New York City Marriages, 1866–1949**, page through the entire result. For\n1908–1937, both a Health Department certificate and a City Clerk license can document the same\nmarriage. MyHeritage groups them in one result when it has both [S20 @2026-11-18] [S22 @2026-11-18].\nWithin the City Clerk papers, check the officiant's completed certificate for witnesses\n[S20 @2026-11-18]. Record their names and any historical addresses or signatures on that page\nas leads for identifying them.","sources":["S20","S22"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nyc-death-reporter","kind":"platform-ui","anchor":"In MyHeritage's **New York City Deaths, 1866–1948**, check the scanned certificate for the person\nwho reported the death, even when the index has no reporter [S20 @2026-11-18]. Keep that role\ndistinct from the attending physician or the person who requested funeral services.","sources":["S20"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-france-deaths-coverage","kind":"portal-availability","anchor":"MyHeritage describes **France Deaths** as an index of INSEE data that can include births and deaths\nabroad [S33 @2026-11-20]. Keep those places eligible. The provider estimates that the index captures\nabout 8% of deaths in 1970 and about half in 1971 [S33 @2026-11-20]. After a zero in either year,\nleave the death unresolved and check the civil death register for the known locality. INSEE identifies civil\nregistration reports as the underlying source [S34 @2026-11-20].","sources":["S33","S34"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-latvia-jewish-birth-coverage","kind":"portal-availability","anchor":"In **Latvia, Jewish Birth Records from JewishGen**, check the town and year before interpreting\na miss. The index spans 1838–1921, with most entries from 1854–1909\n[S29 @2026-11-20] [S30 @2026-11-20]. Check coverage of the town's registers outside that concentration.","sources":["S29","S30"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scoped-research-form","kind":"platform-ui","anchor":"Run the target query from the category or subcategory form when you know the record type. For a\nsingle set, open its own form from the Collection Catalog or the category's collection list. Log\nthat scope before returning to global search [S28 @2026-11-20] [H1 @2026-11-20].","sources":["S28","H1"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-all-terms-exact-match","kind":"platform-ui","anchor":"Keep the all-terms exact-match switch off for the sparse baseline. Use field-level name matching\nwhen only the name should be exact. Turn on all-terms exact matching only when you intend to\nrequire exact matches on all the entered terms [S28 @2026-11-20] [H1 @2026-11-20].","sources":["S28","H1"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-pinsk-initials","kind":"platform-ui","anchor":"For a known deceased person in the **Index to Soviet Extraordinary Commission Pinsk Records from\nJewishGen**, try the surname alone or with the given-name initial. The index can reduce the given\nname to an initial, so a compulsory full name can hide a candidate [S29 @2026-11-20] [S31 @2026-11-20].","sources":["S29","S31"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-german-sanctions-geography","kind":"portal-availability","anchor":"Check **Germany, Revoked Citizenships and Property Seizures from JewishGen** for 1933–1945\ncitizenship, property or business sanctions. Keep former German residents and people in annexed parts of\nCzechoslovakia in scope. Read the type of action and last residence before interpreting the entry\n[S29 @2026-11-20] [S32 @2026-11-20].","sources":["S29","S32"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-spanish-exiles-title-dates","kind":"portal-availability","anchor":"For Spanish Civil War exile research, try **Spain, Migration to the Americas, 1880–1930** without\nrequiring the title's date range or a Spanish birthplace [S35 @2026-11-20] [S36 @2026-11-20].\nMyHeritage illustrates that exception with a 1942 Mexican immigration entry for an exile born in\nParis who had lived in Valencia [S35 @2026-11-20].","sources":["S35","S36"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-french-naturalization-decree","kind":"portal-availability","anchor":"In **France, Naturalizations**, use the decree date from the index to find the published decree.\nCheck both the *Bulletin des lois* and the *Journal officiel* for publication in 1924–1930.\nResidence in France leaves naturalization an open question\n[S37 @2026-11-20] [S38 @2026-11-20] [S39 @2026-11-20].","sources":["S37","S38","S39"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-newspaper-inferred-search-terms","kind":"platform-ui","anchor":"For a **Names & Stories** wedding search, try the documented marriage date in the event field.\nThe index can resolve relative wording using the issue date. For a wife named by given name only,\ntry her given name with her husband's surname as a separate query. Transcribe the words from the\nscan and label any date or surname that the index supplied [H7 @2026-11-20].","sources":["H7"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-newspaper-list-of-people","kind":"platform-ui","anchor":"Look below the **Names & Stories** snippet for other indexed people when a list is shown. Verify\neach person's role on the printed page before treating them as a relative [H7 @2026-11-20].","sources":["H7"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-french-newspaper-collection-routes","kind":"portal-availability","anchor":"For France, check both **France, Names & Stories in Newspapers** and **France, Names & Stories in\nNewspapers from OldNews.com**. Use the OCR and Gallica scan link for the first collection and the\nOldNews scan for the second. Log the newspaper, issue date and page to spot the same article in\nboth routes [S40 @2026-11-20] [S42 @2026-11-20] [S43 @2026-11-20] [S44 @2026-11-20].","sources":["S40","S42","S43","S44"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-barcelona-baptism-grandparents","kind":"portal-availability","anchor":"In **Spain, Catalonia, Barcelona Births and Baptisms, 1850–1923**, check both sets of grandparents\nand the parents' birthplaces and residence. Use the grandparents to distinguish similarly named\nparents and the birthplaces to choose which parish records to check next\n[S40 @2026-11-20] [S41 @2026-11-20].","sources":["S40","S41"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-filae-privacy-scope","kind":"portal-availability","anchor":"For **Filae Family Trees**, missing profiles may reflect the indexing rule. Filae limits sharing\nwith MyHeritage to non-confidential profiles treated as deceased, which restricts MyHeritage search\nresults and Record Matches [S45 @2026-11-20] [S46 @2026-11-20]. Leave the contents of the original\ntree unresolved when a profile is absent.","sources":["S45","S46"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-up-search-alert","kind":"platform-ui","anchor":"After an unproductive signed-in search, check the user's **Search Alert** settings and review any\nalert they supply against the saved query. MyHeritage documents exclusions for very common names\nand searches with too many results. Keep the manual follow-up on the worklist if no alert arrives\n[S47 @2026-11-20] [S48 @2026-11-20].","sources":["S47","S48"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-wills-notarial-collections","kind":"portal-availability","anchor":"For wills, check both **Wills & Probates** and **Court Records**. Try `notarial` in the catalog\nwith the relevant jurisdiction as well. **Netherlands, Notarial Records, 1600–1935** includes\nwills alongside other deeds, so a title search for `will` alone can miss a useful collection\n[S49 @2026-11-20] [S50 @2026-11-20] [S51 @2026-11-20].","sources":["S49","S50","S51"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
