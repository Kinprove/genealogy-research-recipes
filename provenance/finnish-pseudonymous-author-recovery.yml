claims:
  - {"id":"C-build-the-publication-sequence-1","kind":"portal-availability","anchor":"Run the printed signature as a search term in the National Library of Finland’s digitized publications. Group verified hits by title, place of publication, issue date and page. Transcribe the role credited in each item, including translator or adapter and the named work or author used as a source. Use the signature search even when a bibliography search for a candidate’s full name has turned up empty. [S2 @2026-11-22] [S5 @2026-11-22]","sources":["S2","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-resolve-the-name-then-test-the-person-2","kind":"portal-availability","anchor":"For a stated pen name, search Kanto (National Agent Data) for the name and record the authority entry’s identifier, preferred name and any dates or associated work. Carry the preferred name into an independent biographical search. If a birth year is absent, keep that field open until another record supplies it. [S1 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-resolve-the-name-then-test-the-person-3","kind":"platform-ui","anchor":"If education is a plausible lead, use Akatemiasampo’s documented People search syntax. Try the known first and last letters of the surname with successive lengths of the single-character wildcard `?` between them. Test the pattern on a documented name first. Use plausible life years and the given-name initials to screen the returns. Compare schooling and the dated publication places for each candidate, including candidates suggested by a separate credit in the publication. [S2 @2026-11-22] [S4 @2026-11-22]","sources":["S2","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-resolve-the-name-then-test-the-person-4","kind":"method","anchor":"When more than one person fits a recovered name, line up dated schooling, residence, occupation and career changes from biographical notices with the publication sequence. Use compatible details to rank follow-up, and seek a byline, credit or other link before settling authorship. For first-person fiction or a serial, test biographical details against independent records before using them as facts about the writer. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
