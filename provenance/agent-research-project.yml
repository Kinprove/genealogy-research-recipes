claims:
  - {"id":"C-31e2fd83c0f1","kind":"example","anchor":"Outside the whole-index reading workflow below, rules and figures without a public source are\nKinprove observations, according to Kinprove's own private project records [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cdb3745d8b7b","kind":"method","anchor":"- **Do not create one note per person in the tree.** Bulk conversion produces thousands of empty\n  notes that go stale. Write notes only for people and questions under real research.\n- **Give same-named people separate notes** with a fixed label in the name, such as life years or\n  parentage [S7]. Number namesakes. \"Cannot merge\" is a valid result.\n- **Treat a dated report as coverage, not knowledge.** Reconcile it into the living note statement\n  by statement, in the same piece of work. In one point-by-point comparison, a third of the\n  statements in ten reports had never reached the person's note.\n- **Put decisive findings where the next worker must pass.** A note does nothing because it exists\n  or is linked. In one measured vault, most notes were never opened.\n- **Keep run progress and tool instructions out of biographies.** Status sentences go false after\n  later repairs. Use a separate log, and state the real scope of every summary in its first line.\n- **Never cite a temporary folder, personal path or ignored directory.** Copy what a conclusion\n  relies on to durable storage first, and keep addresses and quotations in a durable note.\n- **Copy names and references exactly** from the owning note or image, never from a brief or file\n  name. Put normalised forms in separate fields. Record references as text, not screenshots.\n- **Read a note immediately before changing it.** The owner may have edited it during a long review.","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a183b0da704f","kind":"method","anchor":"- Before deleting, check what still cites the file. One cleanup removed the only authority for a\n  negative kinship conclusion that four notes still relied on.\n- Delete source files only with separate approval, from a frozen list, after the copies at the\n  destination are verified. Decide duplicates by hash, then by comparing images, and leave a choice\n  between differing copies to the researcher.\n- Before reorganising remote material, copy, verify and only then move.\n- Keep human judgments in the person or question note, where imports and regeneration cannot replace\n  them. One regeneration erased hand-entered people while reporting success.\n- Keep the original capture of every source on storage you control. An attachment on someone else's\n  site does not preserve the master [S5]. Map what each backup covers, keep one copy off-site, and\n  prove a restore works [S2, S3, S4, S6].\n- Assume research on real families will leak into shared files. Use opaque handles for living people\n  from the start. Treat exact dates, URLs and filenames as personal data, and never put a password\n  in a note.","sources":["S2","S3","S4","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-72a08ef07f6c","kind":"platform-ui","anchor":"Obsidian repairs links itself in one case: with its Automatically update internal links setting on,\nit updates the links to a file renamed in Obsidian or moved with its `move` command\n[S8 @2026-11-13], [S9 @2026-11-13]. Its help says nothing about a move made by a script, a shell\ncommand or git; after such a move, check every link as the rule on moving files above says.","sources":["S8","S9"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e74870432518","kind":"example","anchor":"According to the project report in issue 341, a whole-parish reconstruction in Kaluga guberniya,\n1870s–1920s, used two image-transcribed indexes of 2,982 and 6,435 entries, plus 2.5 million\ncharacters of older extraction passes and logs. Pattern-selected village lists included strangers:\n4 of 287 acts in one parish and 8 of 32 in the other, from a look-alike surname or village name.\nThe report also warns that a misread keyword can hide an entry from pattern search. These are\nreported observations from one project; the underlying records were not independently inspected\nhere. [S10]","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-168fe2043687","kind":"example","anchor":"The issue reports that its file-reading tool silently cut lines over 2,000 characters, losing the\n   tails of six entries in one probe. It recommends wrapping at 1,800 characters or less with a\n   continuation mark. Those limits describe that setup, not a guarantee for another tool. [S10]","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3c1966da6440","kind":"example","anchor":"The issue's known-act check found 280 of 287 under the same number. It attributes the other seven\n   to four errors in the earlier known list, two doubled act numbers and one fragment without parents.\n   This is a reconciliation of that list, not an independently established recall rate. [S10]","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-383338a2c5aa","kind":"example","anchor":"The reported full readings took 17 portions in seven minutes (six in parallel) and 35 portions in\nnine minutes, using 9.3 million input tokens together and returning 952 findings. These are one run\nper setting, and token figures depend on the framework; they are not throughput or accuracy\npromises. Treat the findings as leads to check on the images. [S10]","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-82af66f9157b","kind":"method","anchor":"Before tracing a \"female line\" (женская линия), ask which line is meant and write the answer into\nthe question note. It can mean the strict line from daughter to mother, which takes a new surname in\nevery generation, or the woman's mother's direct male line, a single surname line; a Russian\ngenealogist reports that requests for a grandmother's female line usually mean the second [S11]. In\nDNA usage the matrilineal line is the mother's mother's mother's line, with no surname to follow [S12].","sources":["S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3356eaf101e5","kind":"method","anchor":"**Several printed surnames for one person.** A peasant family's surname can change from record to\nrecord, and each printed form is a transcription from its own source. Keep every form as a separate\nname tied to the record that prints it. Never write \"X aka Y\" into one surname field, and never keep\none form and drop the others. Gramps keeps such forms as alternative names on the person's Names\ntab, and each can carry its own name type and date range [S14]. A family historian whose program\nallows only one surname per person leaves that field empty and records every form, with its source,\nin the person's notes [S13].","sources":["S14","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
