claims:
  - {"id":"C-31e2fd83c0f1","kind":"example","anchor":"Outside the whole-index reading workflow below, rules and figures without a public source are\nKinprove observations, according to Kinprove's own private project records [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cdb3745d8b7b","kind":"method","anchor":"- **Do not create one note per person in the tree.** Bulk conversion produces thousands of empty\n  notes that go stale. Write notes only for people and questions under real research.\n- **Give same-named people separate notes** with a fixed label in the name, such as life years or\n  parentage [S7]. Number namesakes. \"Cannot merge\" is a valid result.\n- **Reconcile each dated report with the current person or question note.** Check each finding against its source and carry over supported conclusions, uncertainties and conflicts.\n- **Put decisive findings where the next researcher will look.** State them in the current question note, with a reference back to the dated report.\n- **Keep run progress and tool instructions out of biographies.** Status sentences go false after\n  later repairs. Use a separate log, and state the real scope of every summary in its first line.\n- **Never cite a temporary folder, personal path or ignored directory.** Copy what a conclusion\n  relies on to durable storage first, and keep addresses and quotations in a durable note.\n- **Copy names and references exactly** from the owning note or image, never from a brief or file\n  name. Put normalised forms in separate fields. Record references as text, not screenshots.\n- **Read a note immediately before changing it.** The owner may have edited it during a long review.","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a183b0da704f","kind":"method","anchor":"- Before deleting a file, check which claims still depend on it. Include negative kinship conclusions: removing their only supporting record would leave the conclusion in circulation without its basis.\n- Delete source files only with separate approval, from a frozen list, after the copies at the\n  destination are verified. Decide duplicates by hash, then by comparing images, and leave a choice\n  between differing copies to the researcher.\n- Before reorganising remote material, copy, verify and only then move.\n- Store human judgments and hand-entered people outside any block that a generator replaces. Compare the identities present before and after regeneration.\n- Keep the original capture of every source on storage you control. An attachment on someone else's\n  site does not preserve the master [S5]. Map what each backup covers, keep one copy off-site, and\n  prove a restore works [S2, S3, S4, S6].\n- Assume research on real families will leak into shared files. Use opaque handles for living people\n  from the start. Treat exact dates, URLs and filenames as personal data, and never put a password\n  in a note.","sources":["S5","S2","S3","S4","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-72a08ef07f6c","kind":"platform-ui","anchor":"Obsidian repairs links itself in one case: with its Automatically update internal links setting on,\nit updates the links to a file renamed in Obsidian or moved with its `move` command\n[S8 @2026-11-13], [S9 @2026-11-13]. Its help says nothing about a move made by a script, a shell\ncommand or git; after such a move, check every link as the rule on moving files above says.","sources":["S8","S9"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e74870432518","kind":"example","anchor":"A Kaluga parish project reported that a pattern-based village list included outsiders whose surname or village resembled the search term [S10]. Read every index entry, including nonmatches, and check possible misreadings against the images.","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-168fe2043687","kind":"example","anchor":"The issue reports that its file-reading tool silently cut lines over 2,000 characters, losing the\n   tails of six entries in one probe. It recommends wrapping at 1,800 characters or less with a\n   continuation mark. Those limits describe that setup, not a guarantee for another tool. [S10]","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3c1966da6440","kind":"example","anchor":"The Kaluga project attributed seven known-act number mismatches to four errors in its comparison list, two duplicate act numbers and a fragment without parents [S10]. Reconcile each discrepancy before using the comparison as a measure of coverage.","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-383338a2c5aa","kind":"example","anchor":"Check reader findings against the corresponding images before using them in an identification [S10].","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-82af66f9157b","kind":"method","anchor":"Before tracing a “female line” (женская линия), ask which relatives the researcher wants. A request about a grandmother could mean her mother’s direct paternal line or the sequence from her to her mother, maternal grandmother and earlier mothers [S11]. Write the links explicitly. In DNA terminology the second is the matrilineal line; a surname search alone will not trace it [S12].","sources":["S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3356eaf101e5","kind":"method","anchor":"**Several printed surnames for one person.** A peasant family's surname can change from record to\nrecord, and each printed form is a transcription from its own source. Keep every form as a separate\nname tied to the record that prints it. Never write \"X aka Y\" into one surname field, and never keep\none form and drop the others. Gramps keeps such forms as alternative names on the person's Names\ntab, and each can carry its own name type and date range [S14]. If the program allows one surname only and the evidence does not select one, keep the field empty and record every documented form with its citation in the person’s notes [S13].","sources":["S14","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-894bbf2028d3","kind":"method","anchor":"- Settle a doubt by going up the chain. Never settle it between two copies.\n- Count repeated copies of a claim as one witness.\n- Treat the tree as an inventory and a source of leads. Trace each proposed identification to the record or reasoning that produced it. According to Kinprove’s private project records, an apparently established entry originated as the researcher’s own DNA hypothesis [S1†].\n- Treat a model-written summary, tag or \"key insight\" as a pointer. Open the source before writing\n  a claim.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3b5c73cd0bf1","kind":"method","anchor":"- **Generate the regular parts of notes.** Give the researcher or agent an explicit step for the evidence, reasoning and open questions that require judgment.\n- **Give every field and view a named reader.** Fields added for uniformity go stale or stay empty.\n- **Generate indexes from the inventory they describe.** Compare the generated list with that inventory. Keep generated blocks between markers and repair the generator when the lists differ.\n- **Put the question, current finding and next check at the top of the working map.** Place dated updates below them.\n- **Validate the destination of each link.** Qualify a repeated note name by its path and resolve wikilinks before passing them to a tool that needs a file path. According to Kinprove’s project account, a link opened a namesake note in another volume while passing the link check [S1†].\n- **When moving files,** resolve each link against the old layout and leave dated records unchanged.\n  A stale path finds nothing and reads as an absence of evidence.\n- **Keep frontmatter small and check its types.** Models write YAML that parses but means something\n  else: a list item ending in a colon becomes a mapping. Quote values that hold colons or quotation\n  marks, and check that a list holds only strings.\n- **Do not encode status in folders.** Moving a file each time its status changes means repairing\n  links each time. Organise by family, place or topic, and keep status in a field.\n- **Archiving closes nothing.** Keep an unresolved archived question linked from a live page.\n- **Keep what an agent must read in plain Markdown.** An agent reading the file sees a Dataview query,\n  not its result.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-74a03afc3b03","kind":"method","anchor":"- Keep separate states: not listed, unreachable, not inspected, not tested, query lost, true no\n  result. Show an unchecked field as \"not inspected\", never as blank.\n- Never turn a bare absence into a fact about a person. No record is not death. A missing family\n  section is not childlessness. No documented link is not \"unrelated\". Write \"unsupported\", not\n  \"disproven\", unless the negative-evidence gate in\n  [evidence-proof-judgment](evidence-proof-judgment.md) is met.\n- Treat any capped, lazy-loaded or paginated result as partial until unique record IDs match the\n  publisher's total. If the site shows no total, report the result as partial.\n- Before arguing from a person's absence from a list, read how the list was compiled: title page,\n  headers, footnotes and the household's own row.\n- Record the exact target list and filters behind a completed search. According to Kinprove’s project account, a late filter dropped one surname while the run still reported completion [S1†]. Compare the processed targets with the intended list before using a negative result.\n- Before naming a next source or calling a find new, search your notes for earlier readings, known\n  losses and old negatives. Make \"destroyed\" and \"already searched\" findable by reference number.\n- Before rebuilding a tree or table, inventory the existing artifacts and the extraction/version\n  each uses; flag those still based on superseded readings. See the\n  [village family reconstitution, step 5](russian-village-family-reconstitution.md#5-index-the-whole-village-in-every-role).\n- Record \"looked at and rejected for this question\" apart from \"used\", with the reason. Keep a\n  table of tested and dropped hypotheses at the head of a long investigation, with reasons and\n  report locators. Reopen a dropped hypothesis only with relevant new evidence; state what changed.\n- Decide before you check a claim what each outcome will do. \"Not found\" is not \"false\", and an\n  unconfirmed claim stays what its author reports.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-acf00aa64ad5","kind":"method","anchor":"- Transcribe the page before looking at the tree. A familiar surname can prime a reader to find a\n  person who is not on the page.\n- Call a re-read blind only if its brief held no candidate names, numbers or ranges. For a contested\n  reading, get a blind literal transcription first. If blind readings still disagree, find a better\n  image or another primary source. Do not vote, and do not ask again.\n- Test a PDF or OCR text layer against the page image before relying on it. Settle digits, dates and places on the image,\n  and record which layer each claim rests on.\n- Use indexes and keyword search to enter a source, not to prove identity, completeness or absence.\n  For discovery, run every surname in the tree against the source. Searching only for the people you\n  expect reconfirms known links.\n- Record three things separately: the source was read completely, the copy is complete, and what it\n  says is true.\n- Read the clause that supports or contradicts the proposed finding. According to Kinprove’s project account, a reviewer cited the refuting clause as support [S1†]. State what the passage says and which conclusion it bears on.\n- Use quotation marks only for exact text in a saved copy. Keep the source's own wording beside any\n  paraphrase, so that \"suggests looking\" does not become \"reports finding\".","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ef946d3e2199","kind":"method","anchor":"- Read approval at its literal scope, tied to the exact people and destination reviewed. \"Use your\n  judgement\" delegates what to propose, not permission to write.\n- While extracting, create a parent or spouse link only from what the source states. An extracting\n  agent's own identification never becomes a structured link, and if a source names one parent, the\n  child stays single-parent. A link proved by reasoning across sources needs the written argument in\n  [evidence-proof-judgment](evidence-proof-judgment.md) and the researcher's approval.\n- Derive every relationship by walking actual parent-child links to a named anchor, and count\n  generations from the anchor for both people in both directions.\n- Identify the tree and account before looking up a person ID, then verify the name and a second identifying detail. According to Kinprove’s project records, nearly all IDs shared by two tree files referred to different people [S1†].\n- Before creating anyone, check for duplicates in the local export and then in the live tree. A\n  person missing from an export is not a finding until the current tree has been checked.\n- Test new ways of updating a tree on a throwaway tree first. After adding a partner, check the existing children’s parent links. After editing an event with an empty date, check that the event still exists.\n- Read back each write field by field. After an ambiguous failure compare the live record, and never\n  resend blindly.\n- Do not add an unproved inferred link to the tree. Keep it, with its reasoning, in the research\n  notes or a separate worksheet ([evidence-proof-judgment](evidence-proof-judgment.md)). When the\n  tree already holds such a link, entered earlier or by someone else, mark it as tentative on the\n  tree itself and write the reason in the notes: removing it is a change to the tree that needs\n  approval, and an unmarked link reads as proved. Apply the mark only to that link, not to\n  descendants or to every source conflict.\n- Give uncertainty a dedicated place, such as a research note on the person, with a reason, author\n  and date. Name fields that hold research\n  notes, and invented people that hold gaps, are later read as facts. Label placeholders and exclude\n  them from counts of real ancestors.\n- Change an existing name only with approval. List conflicts with the old value, new value and source.\n- Close each bulk import with per-row receipts. Reconcile the links sent and acknowledged with the links stored. Reopen the relationships to check that each parent link survived.\n  Report a receipt check as exactly that: receipts matched against the plan show what was sent\n  and acknowledged, not what each person's page shows now. Report a read-back only for the people\n  whose pages you reopened.\n- When one field is empty for a whole imported group, check how the import was run before\n  treating the gap as missing from the records: an option or a column mapping can drop a field for\n  everyone.\n- Treat a full re-import as destructive replacement. Keep a restorable copy, confirm the file's\n  identity first, and never report zero people imported as success.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6afca0f91a51","kind":"method","anchor":"Have an independent reviewer re-read the original source, not your summary or transcription table.\nGive the reviewer a list that samples both flagged and apparently confident findings. According to Kinprove’s private project records, serious errors appeared among the unflagged findings [S1†]. Keep the reviewer’s verdict and the source for each item. Plan and code reviews cannot establish a genealogical conclusion.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-68fed7d3bb64","kind":"method","anchor":"Keep a short filing guide beside the project instructions. Record the filename pattern, folder\nlabels and tags in use. Consult the guide before filing new material after a break [S15].","sources":["S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
