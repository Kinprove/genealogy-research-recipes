claims:
  - {"id":"C-134fed3d6943","kind":"platform-ui","anchor":"Use Kohtalona Neuvostoliitto for confirmed-deceased research subjects. Try the advanced birthplace and registered-municipality fields separately, and retain the field used for each query. Open the matching person record and distinguish the birthplace, registration in Finland or abroad, border crossing, work, arrest, sentence and death. The project covers Finns in the Soviet Union in 1917–1964 and includes some people listed in Russia in 1917. Read its coverage notes before using a miss. [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22]","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-076f5d6b7ceb","kind":"platform-ui","anchor":"Open Ohjeet and use Lähdetunnukset to find the source list. Copy each card’s own source labels as written, including an item such as Geni if the card cites it. Check unexplained initials against the source list and the original record. Keep an unlisted or ambiguous code unresolved until you can identify what it refers to. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4fc1a2591d24","kind":"method","anchor":"Treat each card as a compilation. A grouped citation cannot assign a source to every field. If the card provides distinct groups for Lahti-Argutina and Gildi–Braudze on one hand and Ruusunen’s research on the other, compare their entries field by field and preserve disagreements. Trace each claim to the underlying document before promoting its attribution from group to specific record. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dfc057040fc8","kind":"custody","anchor":"For a card that points to EK-Valpo, inspect the police person card and look for Ptk or Akp references to the interrogation minutes. Keep the prefix, number and year together. Ptk refers to a headquarters protocol and Akp to one sent from a branch office. If the person card is missing, check the interrogation indexes by name and use the microfiche index to identify the document group. [S4 @2026-11-22], [S5 @2026-11-22]","sources":["S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
