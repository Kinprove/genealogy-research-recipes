claims:
  - {"id":"C-292ab93422bb","kind":"custody","anchor":"Identify the parish and its arciprestazgo for the visit year. In the diocesan fonds, start in Gobierno under Visitas pastorales and check the locality and year [S2 @2026-11-22]. For the cathedral chapter search its separate inventory at series 1.2.3.1 [S3 @2026-11-22]. For a place under the Order of Alcántara, check its own Gobierno inventory under Expedientes de visitas pastorales [S4 @2026-11-22]. Keep the fonds and the numbered box or expediente in the locator.","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-255ccd166fe0","kind":"method","anchor":"According to the available article excerpt, check the lists of visitadores when tracing an official’s career [S1†]. In the dossier, distinguish the named visitor from the priest or institution assessed. Record the role, parish and date separately for each mention [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ba3e392f34f6","kind":"method","anchor":"Check the diocesan listing for estadísticas-parroquias as a separate route when a visitation file is silent [S5]. According to the available article excerpt, the forms describe the parish at a particular date [S1†]. Read the date, reporting parish and categories actually filled in. Distinguish a questionnaire prepared before the visit from the record of the visit itself. Record any named clergy separately from parish-level accounts, worship or sacrament counts. Use a named act or register entry for an individual marriage or sacrament [S2].","sources":["S5","S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
