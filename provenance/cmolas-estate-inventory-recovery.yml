claims:
  - {"id":"C-688ae2e4ff09","kind":"portal-availability","anchor":"At the Central Archives of Historical Records in Warsaw, locate *Zbiór Aleksandra Czołowskiego*, PL 1/388, unit 658, *Inwentarze dóbr prywatnych*. The 1801–1817 span describes the unit. Locate the separately listed Cmolas section, indexed as 1810. Check adjacent unit 657 for the earlier Cmolas entries dated 1789 and 1790. [S2 @2026-11-22]","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8a949303270d","kind":"method","anchor":"Use 8 November 1810, the date of the circular cited on the cover, as a lower bound for compilation if the cover and its relation to the Cmolas section agree. Record any compiler’s date on the village pages separately. Keep the catalogue span as a locator until the section supplies a stronger bound. Preserve fractional entries in the *ćwiertniacy* column without decoding them from the fraction alone. Check the circular or a contemporary key for the meaning. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e0be4a176e1c","kind":"method","anchor":"Transcribe each named person within the inventory number and preserve any relationship between the named people. Give the recorded category, numbers under the sons and daughters columns, and sowing amount and unit their own fields. Check the village heading before treating a family from neighboring Hadykówka as a candidate for inclusion. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14a1fa36f1f1","kind":"method","anchor":"For similar names, build a separate parish chronology for each candidate. Compare the dated births and burials to the recorded counts of sons and daughters, excluding children already known to have died before the inventory. Test whether older children might have been counted elsewhere and whether a marriage or a child's age makes a proposed relationship possible. Keep the count as one test of the candidate. Use other members of the same numbered group or a spouse's birth surname as separate clues. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d6bfbcb3473f","kind":"method","anchor":"If a daughter remains unaccounted for and the parents' marriage is absent locally, test the mother's possible parish of origin for both records. Use the place hypothesis to direct the search. Keep it provisional until supported by an entry. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
