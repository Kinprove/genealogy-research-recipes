claims:
  - {"id":"C-step-01","kind":"portal-availability","anchor":"Search the issue date in *Svenska tidningar*. Check *Posttidningar*, *Post- och Inrikes Tidningar* and, where the date fits, *Posttidningar Ordinarie Stockholmske* against the dated title runs. Distinguish an absent issue from an issue whose viewer or text search fails [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-02","kind":"example","anchor":"A missing scan leaves the issue's survival open. For a dated lead such as 29 September 1685, check the exact issue in the user's current access. If a year expected from the former data.kb.se collection is missing, open a Wayback Machine capture of the old collection and its annual directory. Read the header to identify the copy. Kyläkoski reports a 1998 microfilm-based digitization and a separate 2017 digitization of KB holdings from 1645 to 1705 [S1], [S4].","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-step-03","kind":"method","anchor":"Use the directory's year and filenames to look separately for the images and the accompanying transcription. Where a captured TIFF can be retrieved, read the image and retain the issue locator and digitization credit with any permitted local copy. A surviving directory or transcription establishes only that item [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-04","kind":"custody","anchor":"If the images cannot be recovered, check the target date in each library's microfilm holdings. Include KB's newspaper reading room in Humlegården and Lund University Library's dated runs. Confirm the individual issue on the reel. If a catalogue gives only a span, record the reel as a lead [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
