claims:
  - {"id":"C-5a3d3fd6e2a3","kind":"method","anchor":"Keep the place of origin, birthplace and residence in separate fields. Read Heimatort, lieu d’origine or attested communal citizenship as a lead to the commune that registered the family. If the commune is unknown, start from an emigrant’s immigration, naturalization or death record. Record the town exactly as written and keep each identification tentative until you can connect it to the family. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d18b9c85f7b9","kind":"custody","anchor":"For family registration or citizenship, start with the archives of the commune and canton of origin. For a specific event, also identify the parish or civil office for the event locality. Check each series’ first year and the parish’s confession. In Vaud the archive guide directs church-register research to the Archives cantonales and distinguishes the Vaud cantonal period from federal civil registers beginning in 1876. [S2 @2026-11-21] [S3 @2026-11-21] [S4 @2026-11-21]","sources":["S2","S3","S4"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6a79fac37d97","kind":"custody","anchor":"For a Vaud family-register entry made from 1929 through the transition to digital civil registration, use the commune of origin and look for the family entry in the archive of that canton’s civil-status authority. Use the event register separately when the question turns on the original event entry. [S3 @2026-11-21]","sources":["S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d87394bee9ca","kind":"portal-availability","anchor":"For an uncertain origin lead, consult the Family Surname Book of Switzerland linked by the Swiss Federal Archives. Use each surname-and-commune pair as a candidate and compare it with the person’s own records. [S2 @2026-11-21]","sources":["S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
