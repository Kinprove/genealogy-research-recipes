claims:
  - {"id":"C-c6c47297a2cb","kind":"unclassified","anchor":"Don't rule out the state legislature just because the event sounds like county business. In early Tennessee, residents petitioned the General Assembly for private acts, including divorce, legitimation and name change. Brady explains that where a county was not yet organized, this was the only way to get the legal action done [S1], [S2]. The Acts of Tennessee index covers 1796–1850 [S2]. Brady advises anyone with family in Tennessee in roughly 1800–1830 to check it, even if the family only passed through [S1].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-90d56ae7718b","kind":"unclassified","anchor":"The legislature was not always the only route. The publisher's store description of Alan N. Miller's *[Nineteenth-Century Tennessee Adoptions, Legitimations, and Name Changes](https://genealogical.com/store/nineteenth-century-tennessee-adoptions-legitimations-and-name-changes/)*, read in a web-archive copy, reports that legitimation in Tennessee was done by private act until 1805, when the lower courts could also hear it, and that from 1827 the circuit courts could also change names [S5]. The book itself was not consulted. Use those dates as leads to check both the acts index and court minutes, and verify the applicable law before drawing a legal conclusion.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bac6acef0920","kind":"method","anchor":"For a Pennsylvania pension or gratuity, search the session laws by surname and county, then ask for the application in the House files. In Denyse Allen’s interview, archivist Aaron McWilliams describes following an Erie County index entry for John McWilliams to a special act and then to the application [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cdf234f39ea6","kind":"method","anchor":"Separate matters filed under the same name. Stephen Cantrell’s 1796 entry concerns an auditor for Davidson Academy (serial 4, chapter/section 4.2). His 1807 entry concerns funding for state academies (14, 104.11). Neither locator belongs to the 1803 family act [S6].","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9a4d191deb1d","kind":"method","anchor":"For the 1803 entry on the children, copy **serial 10, chapter 50** from the TSLA headings [S6]. Brady’s method was to collect every name on the page with the same year and numbers [S1], [S2]. Use the printed act to determine each person’s role. Chapter L names eight children of Molly Cantrell, formerly Molly Blakemore: Stephen, Sally, Alfred, Ota, William, Zebulon, Polly and Darby Henley. It changes their surnames to Cantrell and makes them lawful heirs of Stephen Cantrell senior [S22].","sources":["S6","S1","S2","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7725e815dcf4","kind":"unclassified","anchor":"Treat the index as a finding aid only [S2]. Retrieve the act from the session laws. Then look for the underlying petition or application in the legislature's own files. The Pennsylvania example used the House files [S3], [S4].","sources":["S2","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-958ac9f043c5","kind":"method","anchor":"- **Cantrell.** Transcribe the eight children and their mother from the printed act [S22]. Brady recalled about ten children and called their mother Mary Blakemore in one talk [S1]. In another she reported that the petition supplied the children’s birth dates and the parents’ marriage date and place [S2]. Those details still require the petition image or a copy.\n- **McWilliams.** Record Chester County and 1794 as the service lead attributed to the House application in Allen’s interview [S3], [S4]. Use Erie County separately to look for evidence connecting the applicant to the later resident.","sources":["S22","S1","S2","S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-eb9f1c07469d","kind":"method","anchor":"Brady obtained the Cantrell petition in person in Nashville [S2]. To request that file, give the archive the act’s year, chapter and names under both surnames [S6], [S22]. Keep the repository’s reply and any petition locator beside the session-law citation.","sources":["S2","S6","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-787a4c4d7448","kind":"portal-availability","anchor":"TSLA’s petitions guide indexes subjects and names in the petition text, excluding people listed only as signers. Most petitions went back to their petitioners, and the legislature retained some. The guide gives a route for ordering an indexed record [S7 @2026-11-19]. Record which index and spellings you searched and whether you obtained the petition.","sources":["S7"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d5bd9de9347e","kind":"method","anchor":"Transcribe the reason for relief separately from the service claimed in the application. McWilliams recalled broad Revolution or Indian Wars wording in the gratuity act and described the application as evidence of Whiskey Rebellion service from Chester County in 1794 [S3], [S4]. The two recordings reproduce the same interview. Cite each original when recovered and keep the discrepancy visible.","sources":["S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2f5364740fcf","kind":"method","anchor":"Test a same-name identification against an independent residence, tax or service record. McWilliams knew of one John McWilliams in Erie County at the relevant time [S3], [S4]. That narrows the search but leaves the link to the Chester County applicant open. For a name change, extract the legal relationship the act establishes and assess biological kinship separately [S22].","sources":["S3","S4","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-49eb43b529eb","kind":"method","anchor":"When Virginia land faced escheat, search the session laws for both the deceased and the petitioner. In October 1786 Mary Arvin obtained land left by her son John Askins, who died intestate and without issue. Reuben Coutts petitioned over a different interest: his father’s will had given him a life estate, and the reversion was at risk [S9]. Apply the descent law in force at the death. The act effective 1 January 1787 allowed inheritance through the mother and recognized paternal legitimation upon the parents’ subsequent marriage and the father’s recognition of the child [S8]. For a reported Bedford County petition over a 200-acre farm, use county, acreage and approximate date to seek the family and petition. Neill supplies neither the names nor a file reference [S10].","sources":["S9","S8","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c674ef638569","kind":"portal-availability","anchor":"The Library of Virginia's Legislative Petitions collection holds nearly 25,000 items from 1776 to 1865, searchable by name, locality and keyword, and petitions can include wills, deeds, affidavits and judgments. Its search is moving to a new platform, and Virginia Memory holds the full collection [S11 @2026-11-14].","sources":["S11"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2107a7fdd3c4","kind":"method","anchor":"Search Congress for a private bill even when the Pension Bureau rejected a widow’s application, then check later sessions for a renewed claim [S12], [S13]. Sarah Maynard’s petition listed eight children with birth dates. The House committee recommended H.R. 2550 on 24 April 1872, and the Senate rejected it on 6 February 1873 (42nd Congress, Senate Report 398). Look for exhibits in the claimant’s own file. Mary E. Wainwright’s separate file contains a notarized marriage record (43rd Congress, Accompanying Papers 43A-D1, RG 233) [S13].","sources":["S12","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-84a8ddf43fcc","kind":"historical","anchor":"Find the Congress, session and bill or report number first. The Serial Set's indexes of private claims, arranged by claimant, give the Congress and session, the committee, any reports, and the number and fate of related bills [S13]. The Library of Congress reported in July 2021 that it had loaded the text of over 30,000 bills and resolutions of 1799–1873 from its Century of Lawmaking site into Congress.gov; Senate bills start in 1819, and the 12th Congress is missing [S14].","sources":["S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8976a020fd5f","kind":"custody","anchor":"Ask the National Archives' Center for Legislative Archives for the papers, giving the claimant, the Congress and session, and the bill or report number. It holds the claims records of Congress, House and Senate alike [S13 @2026-11-14], [S15 @2026-11-14].","sources":["S13","S15"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0682fe0ed038","kind":"method","anchor":"For a Revolutionary-era Virginia Loyalist claim, take the presenter's advice from the available excerpt [S16] and check Virginia legislative petitions for a possible appeal to the General Assembly [S19]. Record any Virginia legislative petition and any application to Britain's Loyalist Claims Commission as separate proceedings [S21].","sources":["S16","S19","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-31f6720935c7","kind":"platform-ui","anchor":"Search the Library of Virginia website separately for “loyalist claims” and for the Revolutionary-era claimant's name [S20 @2026-11-18].","sources":["S20"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-82e9134bb00b","kind":"method","anchor":"When a North Carolina land grant may have followed a legislative petition, follow the presenter's suggestion from the available excerpt [S16] and look for the authorizing act alongside the petition. Start with the grant year and follow references to earlier acts [S17]. For the 1784 session laws, open volume 24 of the *State Records of North Carolina* [S18]. Choose by record type as well as by year. The *Colonial Records* (volumes 1–10) extend through 1776, and the *State Records* (volumes 11–26) also include laws from 1715 through 1776 in volume 23 [S18].","sources":["S16","S17","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b77d4772733d","kind":"method","anchor":"Search by surname and transcribe the printed headings. Tennessee’s acts index separates last name, first name, year, serial, chapter and section, and description [S6]. Record each field before opening the session laws.","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f5f71ea52a60","kind":"method","anchor":"When a War of 1812 widow did not qualify for a federal pension, follow Craig R. Scott’s advice from the available excerpt and search state session laws for a private relief act and state legislative papers for her petition [S23]. Search under both the widow’s and the veteran’s names. Record the state petition and any award separately from the federal claim.","sources":["S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bfbff4d8c8d0","kind":"method","anchor":"In Maryland, use Index 52 (MSA S1425) to trace state payments to the military pension roll [S24]. Search the General Assembly journals for the widow’s petition even if the payment index has no entry [S25]. Use the act cited on an index card to locate the session law [S26].","sources":["S24","S25","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
