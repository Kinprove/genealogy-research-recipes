claims:
  - {"id":"C-c6c47297a2cb","kind":"unclassified","anchor":"Don't rule out the state legislature just because the event sounds like county business. In early Tennessee, residents petitioned the General Assembly for private acts, including divorce, legitimation and name change. Brady explains that where a county was not yet organized, this was the only way to get the legal action done [S1], [S2]. The Acts of Tennessee index covers 1796–1850 [S2]. Brady advises anyone with family in Tennessee in roughly 1800–1830 to check it, even if the family only passed through [S1].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-90d56ae7718b","kind":"unclassified","anchor":"The legislature was not always the only route. The publisher's store description of Alan N. Miller's *[Nineteenth-Century Tennessee Adoptions, Legitimations, and Name Changes](https://genealogical.com/store/nineteenth-century-tennessee-adoptions-legitimations-and-name-changes/)*, read in a web-archive copy, reports that legitimation in Tennessee was done by private act until 1805, when the lower courts could also hear it, and that from 1827 the circuit courts could also change names [S5]. The book itself was not consulted. Use those dates as leads to check both the acts index and court minutes, and verify the applicable law before drawing a legal conclusion.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bac6acef0920","kind":"unclassified","anchor":"Also check the session laws when a person appears in a statute as the recipient of a gratuity or pension. The Pennsylvania legislature granted pensions and gratuities to individuals by special act. A Pennsylvania State Archives archivist found his ancestor named in the Laws of Pennsylvania this way [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cdf234f39ea6","kind":"unclassified","anchor":"One name can carry unrelated acts. In Brady's example, one of three Stephen Cantrell entries concerned funding for an academy in Davidson County [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9a4d191deb1d","kind":"unclassified","anchor":"Next, read every entry in the index that shares the same year and locator. In Brady's example, a \"children legitimized\" entry for Stephen Cantrell in 1803 carried the numbers 10 and 50. She read them as \"volume 10, page 50\" [S2], but the index has no volume or page columns, so the two numbers are probably the entry's serial number and chapter/section (likely serial 10, chapter 50). The other 1803 name-change entries with the same numbers turned out to be his children [S1], [S2]. The group of persons comes from this shared locator, not from the target's own line.","sources":["S2","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7725e815dcf4","kind":"unclassified","anchor":"Treat the index as a finding aid only [S2]. Retrieve the act from the session laws. Then look for the underlying petition or application in the legislature's own files. The Pennsylvania example used the House files [S3], [S4].","sources":["S2","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-958ac9f043c5","kind":"unclassified","anchor":"- **Tennessee (Cantrell):** about ten children with their birth dates or years, the mother (Mary Blakemore), and the parents' marriage date and place [S1], [S2].\n- **Pennsylvania (McWilliams):** a county of service and a year, Chester County in 1794 [S3], [S4].","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb9f1c07469d","kind":"unclassified","anchor":"The Cantrell document was the petition to the legislature, brought out to Brady at the archives in Nashville. The petition gave the children's birth dates, the mother, and the marriage date and place [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-787a4c4d7448","kind":"unclassified","anchor":"Record access status plainly. Brady says she could not get the Cantrell petition online and had it brought out to her at the archives in Nashville. She also says most of TSLA's online databases are indexes rather than images [S2]. TSLA's [legislative petitions guide](https://sos.tn.gov/tsla/guides/tennessee-legislative-petitions) indexes the petitions by subject and by the names in the petition text, not by signer. It says most original petitions went back to the petitioners, although the General Assembly kept many, and it points to TSLA's ordering instructions for a copy of an indexed record. TSLA also has an online name index to the acts for 1796–1850 ([FamilySearch Wiki](https://www.familysearch.org/en/wiki/Tennessee_Law_and_Legislation)). If you have only searched the index, report that the next step is an on-site visit or a copy request. Don't present the index description as the content of the petition.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d5bd9de9347e","kind":"unclassified","anchor":"Compare the service, event or relationship stated in the act with what the application says. In the Pennsylvania example, the law described McWilliams's gratuity as being for Revolution or Indian Wars service. His House-file application showed Whiskey Rebellion service out of Chester County in 1794 [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2f5364740fcf","kind":"unclassified","anchor":"The archivist linked the Erie County man to the act because he knew of only one man of that name there at the time [S3], [S4]. That is an identity hypothesis, so send it to evidence/proof judgment. A legitimation or name-change act establishes legal status. Send any question of biological kinship to evidence/proof judgment.","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
