claims:
  - {"id":"C1","kind":"method","anchor":"Search for the death notice with the estate papers. The community guide suggests checking multiple probate repositories, including the national archives [S1], [S5]. When using a National Automated Archival Information Retrieval System (NAAIRS) result, copy the depot, source code, volume, reference number, name and year. A probate index hit is a locator for the packet. Keep the depot with the complete reference when matching the result to an image group or archival inventory [S2].","sources":["S1","S5","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C2","kind":"portal-availability","anchor":"For Cape Probate Records on FamilySearch, check the collection’s 1834–1989 scope. Use the matching index fields, including death date and spouse where present, and carry the probate number to the packet cover [S3 @2026-11-22].","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C3","kind":"portal-availability","anchor":"For Bloemfontein, check the *Orange Free State, Estate Files, 1951–2006* image collection by year and surname initial. Keep the group’s actual year range and continue into later filings when the death-year group misses [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C4","kind":"method","anchor":"Look for the death notice, will, inventory and distribution account within the packet. Extract recorded parents, spouses and children from the notice, and distinguish that report from the information on a civil death certificate. Preserve the informant and notice date where the form supplies them [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
