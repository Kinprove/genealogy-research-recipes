  - {"id":"B7","kind":"unknown","urls":[],"published":null,"retrieved":null,"access":"unknown","rights":null,"basis":null,"entry_sha256":"f49f06f5eb602dbab95a05d6ba61ec097727e2017016e342d3ff5620b4aec87b","claims":[],"review":"pending"}
claims:
  - {"id":"C-3224a655a691","kind":"unclassified","anchor":"- **Copy the place exactly as written** in each record, with the record type, date and writer. Check every spelling before you search on it.\n  - One presenter reports a sample of 100 records from each of five large city churches. In that sample, 38.2% of the hometowns were not spelled correctly. [S1]\n  - A pastor or census taker from a different dialect or language area often wrote the name by ear. [S1], [S14]\n- **Generate candidate readings:**\n  - b/p, d/t and g/k consonant swaps [S1];\n  - a gazetteer wildcard query that keeps only the letters you trust, such as the first letter plus the ending. The Meyers site accepts asterisk wildcards. [S2], [S3]\n  - reverse-alphabetical place indexes searched by ending, such as Roger Minert's German place-name indexes, which are arranged by state or province [S1], [S2];\n  - alternate-language names. In one example the Sorbian name of Bautzen (Budyšin) was not in Meyers. The Saxon historical place register (Historisches Ortsverzeichnis von Sachsen) listed it as Bautzen's other name, and an 1871 map of Saxony showed both names. [S4]\n- **Treat every hit as a candidate.** Compare it with the handwriting before you accept it. [S3]\n- **Keep the case open if nothing fits.** The presenter says that, very occasionally, an expert team still could not identify a name. [S1]","sources":["S1","S14","S2","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c81867f52968","kind":"unclassified","anchor":"- **Choose the gazetteer that matches the area:**\n  - Meyers Orts- und Verkehrs-Lexikon (1912) for the German Empire at its pre-World War I extent, including areas now in Poland, France, Denmark and Lithuania [S3], [S12], [S13];\n  - GenTeam for Austrian, Czech, Slovak and Slovenian areas. It needs a free login and gives former and current names, the parish and archive information. [S3], [S6]\n  - Kartenmeister for places east of the Oder–Neisse, including East and West Prussia. It gives the modern name and the nearest parish. [S8], [S10]\n  - the 1905 Prussian municipality gazetteer (Gemeindelexikon) on Ancestry, which gives Protestant and Catholic parishes and the civil registry office. The presenter says its index gives a volume, page and line, and he warns that the Ancestry set is far from complete. [S8]\n  - GOV (Geschichtliches Ortsverzeichnis, gov.genealogy.net) to fix a place's Kreis, parish and state at the event year. Each place has a unique GOV ID, and its memberships in higher administrative and church units are recorded for historical periods. Use it beside Meyers for border and Kreis changes after 1912, since Meyers shows only the 1912 state. Cite the GOV ID as place context only, never as evidence of the event. [S46], [S47]\n- **Record the gazetteer and the entry you used.** The Meyers site shows the original Fraktur entry next to an indexed transcription, plus old and modern map views. [S3], [S13]\n- **Confirm the candidate against a correctly spelled related place.**\n  - Worked example: a wildcard query for W…heim returned 63 places. Filtering to Württemberg showed Weikersheim in Oberamt Mergentheim, the only W…heim place in that Oberamt. The emigrant's other place, Nassau in Oberamt Mergentheim, was spelled correctly and lay a couple of miles away. (Nassau is now part of Weikersheim.) [S2]\n  - Write the reason you chose the candidate in your notes, next to the rejected namesakes.","sources":["S3","S12","S13","S6","S8","S10","S46","S47","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a195128f0bc8","kind":"unclassified","anchor":"- **Narrow by the Kreis, Oberamt or state nesting.** Many towns share a name. [S13]\n  - In one case a gazetteer search returned five places called Haidekrug, in five counties. The researcher chose by county and then recorded the modern name (Šilutė, Lithuania) and the nearest Lutheran and Catholic parishes. [S9], [S10]\n- **Do not write to every candidate parish.** For each namesake, take from the gazetteer the towns that held its court, military district and district office. Then search those non-parish series in the FamilySearch catalogue. [S11]\n  - In a presenter's worked example with two places named Rosenthal, one had court marriage contracts and a military muster roll; the other had a district book of farmers and house owners. That house-owner book traced the family's house back to 1767 and settled which Rosenthal was right before any letter was sent. [S11]\n- **Use the office towns to place an unindexed village on a sheet** of the 674-sheet Karte des Deutschen Reiches (1:100,000). Meyers also lists the railway station and its distance. Find the station on the sheet and measure that distance as a radius. [S12]","sources":["S13","S9","S10","S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-553d00784b5e","kind":"unclassified","anchor":"Many smaller places had no parish of their own. One presenter estimates that the birth town and the baptism church match in only about one case in ten. [S6] Before you search anything, build a jurisdiction row from the gazetteer entry.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb2580ce6684","kind":"unclassified","anchor":"- **Read the office abbreviations in the Meyers entry:**\n  - evPfk: Protestant parish church;\n  - kathPfk: Catholic parish church;\n  - StdA: civil registry office (Standesamt);\n  - AG: lower court (Amtsgericht);\n  - BKdo: military district command (Bezirkskommando). [S7]\n- **Use the punctuation to tell who held each office.** The presenter's rule: an office followed by a comma or semicolon was held in the town itself. [S7] Build the jurisdiction row on it; before you conclude from it that a town lacked an office, confirm the rule in the gazetteer's own introduction.\n- **Do not read an absent church as a gap in the data.** The presenter says a church appears in the entry only if the town had one. [S7] For the civil, court and military offices, the gazetteer names the town that held them when the place did not. [S7]\n- **Record each office independently.** Worked example: Meyers showed that Hülshagen had its own civil registry office but no church. The parish to search was nearby Lauenhagen. [S5]\n- **Fix the Standesamt for the event year, and log what survives.**\n  - Civil registration did not start everywhere at once. Check which rule covered the place in the event year:\n    - Alsace and the annexed part of Lorraine (German 1871–1918): French civil registers from 1792; see [French departmental record routing, step 1](french-departmental-record-routing.md#1-route-by-département-not-by-a-national-index);\n    - left bank of the Rhine, including the Pfalz and Rheinhessen: French-style civil registers from 1798 (in some places 1796), kept until 1875 [S56], [S57], [S58];\n    - right bank of the Rhine in the Rhineland: from 1810 to 1875 [S56]. Westphalia went back to church-book duplicates in 1813/14 [S56], so do not extend this date to the Westphalian parts of the former Grand Duchy of Berg;\n    - Bremen and Lübeck: from 20 August 1811 to the end of 1875 (in Lübeck, after 1813 only the city and the areas just outside its gates) [S59], [S60];\n    - Hamburg: civil registers under French rule (the archive holds volumes of 1814), then its own civil registers from 1866 [S61], [S62];\n    - Frankfurt am Main: marriages from 1849, births and deaths from 1851 [S63];\n    - Baden: church-kept civil-status books from 1810, mayors as registrars from 1 February 1870 (section 6) [S48];\n    - Prussia: from 1 October 1874 [S64];\n    - the rest of the German Empire, Württemberg included: from 1 January 1876. [S64]\n  - For an event before your place's start date, search the church registers and any state copies (section 7).\n  - Use the Standesamt district that covered the place in the event year, not the later Kreis or the nearest town. [S26]\n  - Before you search an office, note which year ranges of its registers survive and where they are kept. Record a missing range as a coverage gap, not as evidence that the event did not happen. A civil death entry may cite the marriage office and its register number. [S27]\n  - For offices in the former eastern territories, Standesamt I in Berlin acts as the replacement registry office, and registers past their closure periods are generally at the Landesarchiv Berlin. [S28] One participant reports that a former Upper Silesian office's marriage registers are there and indexed on Ancestry. [S26]\n- **Do not assume one village means one register.**\n  - If the entry is missing from the official parish, open the place in Meyers' ecclesiastical view, which may list a nearer church village beside the parish. Kührsdorf belongs to Preetz parish, but a baptism turned up in Wankendorf, the nearest church village Meyers shows. [S31]\n  - Meimersdorf baptisms alternated between Flintbek and Kiel St. Nikolai. [S30]\n  - A home-parish entry may record only the banns. One transcribed Brandenburg entry records banns read locally and in Berlin, with the wedding in Berlin's Luisenstadtkirche. [S32]\n  - Mark each parish's role (banns, consent, wedding, baptism). Before you call an entry missing, search neighbouring parishes, hospital towns and the mother's home parish, and record which book held each entry.\n- **List a parish for each confession the family may have belonged to.** Regional tools give the nearest Lutheran and nearest Catholic church as separate targets. [S9], [S10]\n- **Search the holding town only for entries about your village.** Search its records under the holding town's name. [S7]\n- **Widen the year window.** A birth year worked out from an age at marriage or death is often rounded, so search several years either side. [S5], [S6]","sources":["S7","S5","S56","S57","S58","S59","S60","S61","S62","S63","S48","S64","S26","S27","S28","S31","S30","S32","S9","S10","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9e8e810b7967","kind":"unclassified","anchor":"- **Read a kingdom, duchy or province name as the place that applied when the person emigrated.** Many emigrants who left before the 1871 unification gave the state of origin as their birthplace. [S14]\n  - Prussia annexed the Duchy of Nassau in 1866. The province of Hessen-Nassau was created in 1868 from Nassau, Hesse-Kassel, Frankfurt and small areas taken from Bavaria and Hesse-Darmstadt. A family that left Nassau in 1845 reported \"Nassau\"; a later catalogue places the same villages in Hessen-Nassau. [S14]\n  - A change of jurisdiction name between records is not a migration. A piece of Bavaria was moved into Hessen-Nassau without anyone moving. [S14]\n- **Choose archives by the historical state, not the present Land.** Church, civil, town, district and state records for one village can sit in different archives. [S15], [S16]\n- **For territory lost after World War I or II, convert the German name.**\n  - Use a German-to-foreign locality register. It is arranged by country, with one section ordered by the German name and another ordered by the foreign name. [S16]\n  - If it lists several places with the same name, choose the one whose Kreis matches the Meyers entry. [S16]\n  - The presenter describes a post-WWII German-to-Polish register whose columns give the German name, the parish, the district, the Polish name and the Polish district name. He cites it as FamilySearch microfilm 824243 item 2, starting at image 124. A second lecture gives 82443; resolve the film-number discrepancy in the catalogue before you use or cite it. [S16], [S12]\n  - For the part of East Prussia that went to Russia, use the U.S. Board on Geographic Names gazetteer for the USSR and certain neighbouring areas (Gazetteer No. 42, 1959), in seven volumes. [S16]","sources":["S14","S15","S16","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1fff2ac3326b","kind":"unclassified","anchor":"- **For a town now in another country, search the FamilySearch catalogue twice:** once under the present foreign name and once under the historical German name. The catalogue's place database is good but not perfect. [S17]\n- **If the village is missing, search under its parish town** or the town that held the relevant office. [S6], [S7], [S17]\n- **Find the civil-register custodian through archive descriptions.** The Auprès de nos Racines article suggests searching the locality together with `Personenstandsbücher` in Archivportal-D and Deutsche Digitale Bibliothek. Treat this as a finding-aid search tactic; the article's Munich result and current search controls were not reproduced. [S40]\n  - Open the description and record its level (fonds, series or item), named archive, archival reference and link to the partner's catalogue. Archivportal-D searches partner-supplied archival descriptions as well as selected digitized material; an opened DDB civil-registration-related fonds description names its archive and partner-object links. [S41], [S42]\n  - Follow the partner reference to establish the register type, years and next retrieval step. A fonds description is a lead to the books, not an inspected entry or a promise of images. Keep image access unverified until the relevant book or entry is actually opened.\n- **Check the online portals by the archive that holds the parish, not by confession alone.** [S6] One parish's registers were available on Archion even though FamilySearch had not filmed them. [S7]\n  - Archion needs a paid, time-limited pass to open images. Its archives are mostly Protestant Landeskirchen and state archives, and include the Catholic dioceses of Hildesheim, Speyer and Trier. [S67], [S68]\n  - Matricula lists 19 German Catholic dioceses and the Landesarchiv Baden-Württemberg's state copies for Baden, Württemberg and Hohenzollern. The dioceses of Berlin, Erfurt, Freiburg, Görlitz, Hamburg, Köln, Speyer and Trier are not listed. [S69], [S70]\n  - A listed archive may still lack the parish or years. Open the parish page and note the years shown.\n  - Also search Ancestry and FamilySearch. Ancestry has Protestant sets for Baden, Württemberg and Hesse, and the Württemberg family tables; check whether a set shows images or only an index. [S66], [S71] FamilySearch has church-book duplicates of some Brandenburg and Posen parishes, with images. [S72]\n- **Hesse: open the civil-register second copies in Arcinsys Hessen.** The digitised Personenstandsnebenregister (the registry offices' second copies, now archive holdings) sit under Staatsarchiv Marburg > H Personenstandsarchiv Hessen, holdings HStAM 900–926. [S44]\n  - A thumbnail beside the archival reference marks a digitised volume. Open it with 'Digitalisate öffnen' or in the DFG-Viewer. LAGIS lists the online volumes by registry office. [S44]\n  - In January 2026 volumes were online up to births of 1900, marriages of 1930 and deaths of 1965; the death cut-off follows a 60-year rule (§ 9(2) sentence 3 HArchivG). [S44], [S64] So wartime deaths (1939–45) normally fall inside the online range and births after 1900 normally do not. Deaths up to 1980 were available on application, with a user form, to the Hessisches Staatsarchiv Marburg. [S64] Before you plan a request, check the archive's current cut-off and confirm coverage for the specific volume.\n  - A missing thumbnail means the volume is not yet digitised or not yet cleared for publication, not that it is lost. [S44]\n  - Check other Länder on their own official sites.\n- **North Rhine-Westphalia: check the Landesarchiv NRW's second registers before writing to a Standesamt or municipal archive.** Marriages 1874/1876–1899 and deaths 1874/1876–1938 are digitised; coverage is partial and growing, and birth registers are not on the list. Start from the Landesarchiv's [Digital family research](https://www.archive.nrw.de/en/landesarchiv-nrw/geschichte-erfahren/familienforschung/digital-family-research) page. Westphalia-Lippe registers open through the archive.nrw.de search; Rhineland volumes (PA 3102 marriages, PA 3103 deaths) open through the department's online pages. [S50], [S51]\n  - **Search the name index by birthplace, not only by surname.** The MyHeritage index of these registers is searchable in the Schlagwortsuche (keyword search) of the Archivportal NRW (archive.nrw.de). It holds the names and, where recorded, the birth date and birthplace of the people named on each certificate. Certificates are titled `Todesfall <name>`, so pair `Todesfall` with a place or region of origin (`Todesfall Pommern`, `Todesfall Kolberg`) to find migrants from the eastern provinces who died in Westphalia. Narrow the results with the Laufzeit (date range) filter, which uses the death date. [S52], [S53], [S54]\n  - So far only death registers (1874/76 to June 1938) of Regierungsbezirk Münster are indexed: Kreise Ahaus, Beckum, Borken, Coesfeld, Lüdinghausen, Landkreis Münster, Recklinghausen, Steinfurt, Tecklenburg and Warendorf; Städte Bocholt, Bottrop, Gelsenkirchen, Gladbeck, Münster and Recklinghausen; and Isselburg. Marriage registers (1874–1899) and other districts are to follow; check the [current list](https://www.archive.nrw.de/landesarchiv-nrw/geschichte-erfahren/familienforschung/familienforschung-digital/indexdaten-zu-den). The image link opens the register without marking the name, so find the certificate and read all of it. [S52], [S53]\n- **Baden 1810–1870: open the Standesbücher.** From 1 January 1810 the clergy, and the rabbis for Jewish communities, kept their registers as civil-status books and sent a second copy (Standesbuch) to the district office after each year's end. Mayors became civil registrars only from 1 February 1870. [S48]\n  - The second copies are at the Generallandesarchiv Karlsruhe (390) for northern Baden and at the Staatsarchiv Freiburg (L 10) for southern Baden, both fully digitised by the Landesarchiv Baden-Württemberg. [S48], [S49]\n  - For a Baden event of 1810–1870, check this copy as well as the parish original. Classify it as a church-kept duplicate (section 7), not a Standesamt record.\n- **Württemberg from 1808: check the parish Familienregister.** From 1 January 1808 the Protestant and Catholic parishes of Württemberg kept a Familienregister (family register) on printed forms, one sheet per couple with the couple's parents and children. [S65] Ancestry has a set called \"Württemberg, Germany, Family Tables, 1550-1985\". [S66] Classify a Familienregister line as a parish family register (section 7) and check it against the baptism, marriage and burial books.\n- **Recheck the portals before you mark a register access-pending.** In February 2026 the presenter said the Schaumburg-Lippe registers were not online, so a researcher with access made extracts for the Hülshagen case. [S5] Archion now hosts the registers of the former Ev.-luth. Landeskirche Schaumburg-Lippe (Niedersächsisches Landesarchiv, Abt. Bückeburg), and its list includes Lauenhagen with Hülshagen ([Archion collection page](https://www.archion.de/de/alle-archive/niedersachsen/niedersaechsisches-landesarchiv/kirchenbuecher-der-evangelisch-lutherischen-landeskirche-schaumburg-lippe/)). For this case, go to the Archion images and check the extracts against them. The extracts remain derivatives. Use \"access-pending\" only after you have checked Archion, Matricula, Ancestry and the FamilySearch catalogue and found no images.\n- **A no-hit in an online civil index is not absence.**\n  - One forum contributor counted 525 of 1,712 death entries for Standesamt Stralau (1874–1885) that Ancestry had not indexed. Many were hospital or asylum deaths written as side text on the entry. Browse the images for the year.\n  - If an online register stops partway through a year (for example, at entry 882 when you need 910), record the last number present and check whether the volume survives. A participant called the Berlin III volume concerned a war loss. Flag the range 'volume lost/unavailable', not 'searched, not found'. [S29]\n- **Date the parish, and treat a portal's year range as one custodian's holdings.**\n  - Check when the parish began and which parish served the place before. Danzig-Emaus dates only from 1906; St. Nikolai served the area before then. [S34]\n  - Behlendorf's books on Archion start in 1761, but a participant pointed to copies of the Nusse books for 1614/1618–1760 in the Lübeck city archive. [S33]\n  - Build a table of custodian, register type, years and serving parish. If every church copy has a gap, turn to the civil registers (the Standesamt step in section 4). [S34]","sources":["S17","S6","S7","S40","S41","S42","S67","S68","S69","S70","S66","S71","S72","S44","S64","S50","S51","S52","S53","S54","S48","S49","S65","S5","S29","S34","S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d760b01f8b25","kind":"unclassified","anchor":"- **Name the version for each image:**\n  - parish original;\n  - church-book duplicate (Kirchenbuchduplikat);\n  - later recopy;\n  - parish family register (Württemberg Familienregister);\n  - transcript, abstract or extract;\n  - periodical extract;\n  - compiled Familienbuch, Ortsfamilienbuch or Ortssippenbuch.\n- **Keep the original and the duplicate separate.** Two images of the same entry, one from each version, can differ: one may carry an entry number or page numbers added later, and stamps are later additions. [S18]\n  - Cite each version with its own repository and locators. Never merge them.\n  - Do not assume a duplicate exists. Requirements differed by state and period (Westphalia, for example, required them 1815–1874; for Baden 1810–1870 see the Standesbücher in section 6); check the rule for your state and years first. [S18], [S19]\n  - Beidler says duplicates were usually made at about the same time as the originals and are often nearly identical; use one when the original is unavailable. [S19]\n  - They can still disagree on substance. One forum participant found that the original and the duplicate (Zweitschrift) named different mothers for the same bride; two men of the same name had married in 1796 and 1798. List every couple that fits and settle the question with independent evidence. The poster favoured the original's couple without showing the evidence, so do not adopt that conclusion. [S35]\n- **Treat transcripts, abstracts and extracts as secondary gateways.** Check whether the original still exists and how to reach it; sometimes it no longer survives. [S19]\n- **Treat a civil name-index line as a locator; order the full entry and its Sammelakte.**\n  - A Standesamt Namensregister line (office, year, entry number) is not the entry. Ask for a complete, uncertified copy of the original register entry with all marginal notes, not an 'Urkunde', which archives read as an official certificate. [S36], [S39] In the same request, ask for the collected supporting file (Sammelakte or Beiakte); Landesarchiv Berlin catalogues these as separate units. If an online collection ends before your year, continue in the archive's own name indexes. [S36]\n  - Follow each marginal note by office, number and year rather than by name. A forum transcription of a Breslau III birth entry shows three marriage notes, each pointing to a Berlin-Charlottenburg entry. [S32]\n  - Participants say each office that posted the banns may keep its own marriage file, and one file held only the banns certificate. [S37] A birth certificate filed for the banns or a death registration can give the birth office and entry number. [S38]\n  - If the birth data rest only on an unsourced tree, get the civil marriage entry before you search for the baptism. [S31]\n  - For the Standesamt I registers from former eastern territories, Berlin's official service description says name indexes and supporting files survive only occasionally. [S73] Do not generalise that survival statement to every German registry office; record an unavailable file as a coverage gap, not as evidence.\n- **Read a 'Civil' christening in an index as a civil registration.** In a FamilySearch index, a 'christening' labelled 'Civil' is a Standesamt birth entry, and its date is the day the birth was registered; Ancestry searches return these entries too. Look for the church baptism separately, and check the image to see which date the index took. [S35]\n- **Check how the register is arranged.** A register ordered by family rather than by date may be a later recopy. Beidler reports that Pastor Johann Caspar Stöver's family-arranged register came from his recopying it late in life. Treat such a register as a derivative that may contain copying errors. [S20]\n- **Use periodical extracts as a guide only.** Find them through the periodical's place index and table of contents, then read the original entry. [S23]\n- **Use compiled lineage books to navigate, not as proof.**\n  - Find the family through the surname index. Each family has a number, and each spouse's entry ends with the number of that spouse's parents' family. Follow those numbers back one generation at a time. [S22]\n  - Note which parishes or villages the book says it covers. Find copies through the FamilySearch catalogue or WorldCat, since most are not online. [S21]\n  - Before you treat a person missing from an Ortsfamilienbuch (OFB) as absent, read its scope note. Record the registers used, the years the book actually contains and whether it was compiled systematically. A village book may extract only the parent-parish entries marked with the village name. The Rieden online OFB takes only the Sonthofen entries noted 'aus Rieden' (from Rieden) and mainly holds 1800–1860, though the Sonthofen books begin in 1610. In that case search the parent parish's registers directly, especially for the years before entries named the place. [S55]\n  - Check every entry against the parish images before you use it. [S21], [S22]","sources":["S18","S19","S35","S36","S39","S32","S37","S38","S31","S73","S20","S23","S22","S21","S55"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b169eecaedf","kind":"unclassified","anchor":"- **Keep a named sponsor separate from a proxy.** If a baptism names one sponsor and another person acting in that sponsor's place, record both people with their distinct roles and the literal clause. Do not merge them into one person or an undifferentiated list of co-sponsors. Keep an uncertain role reading explicit in the associate worklist. The article in [S43] supplies a reported translation with this distinction; the original and translation were not independently checked.\n- **Check illegitimate baptisms for a later note.** In the presenter's Württemberg example, a child born in 1841 was entered under the mother's surname. The father's name and a legitimation date about a year later (30 May 1842) were written at the bottom of the page. [S24], [S25]\n  - The presenter says this legitimation was done by the local Amt (lower court), not the church. Treat the court record as a separate retrieval lead. [S25]\n  - Search the child under both surnames. Later records, such as an emigration index, may use the father's name. [S24], [S25]\n- **Treat the presenter's legal dates as leads.** He links naming the father to an 1826 ordinance and links the child taking the mother's status to a 1677 law, framed in Bavarian and Prussian terms. Do not apply these rules to Württemberg, other states or other periods without checking the law that applied. [S24], [S25]\n- **Do not read a death cross beside a baptism as proof of death.** Confirm the death from a burial entry and later records. The cross may have been added decades after the baptism, some baptism books carry it beside every entry, and one child marked this way apparently married about thirty years later. [S35]","sources":["S43","S24","S25","S35"],"checked":null,"stated_as":null,"review":"pending"}
