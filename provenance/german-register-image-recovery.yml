claims:
  - {"id":"C-3224a655a691","kind":"method","anchor":"- **Copy the place exactly as written** in each record, with the record type, date and writer. Check every spelling before you search on it.\n  - Preserve each spelling as a search term. Compare readings across independent records before choosing a normalized form [S1].\n  - A pastor or census taker from a different dialect or language area often wrote the name by ear. [S1], [S14]\n- **Generate candidate readings:**\n  - b/p, d/t and g/k consonant swaps [S1];\n  - a gazetteer wildcard query that keeps only the letters you trust, such as the first letter plus the ending. The Meyers site accepts asterisk wildcards. [S2], [S3]\n  - reverse-alphabetical place indexes searched by ending, such as Roger Minert's German place-name indexes, which are arranged by state or province [S1], [S2];\n  - alternate-language forms from a regional place register and a map of the period. The Saxon historical gazetteer lists Bautzen under both Bautzen and Budyšin [S4], [S82].\n- **Treat every hit as a candidate.** Compare it with the handwriting before you accept it. [S3]\n- **Keep an unresolved reading open.** Save the literal string and the candidates the handwriting or jurisdiction could not distinguish [S1].","sources":["S1","S14","S2","S3","S4","S82"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c81867f52968","kind":"method","anchor":"- **Choose the gazetteer that matches the area:**\n  - Meyers Orts- und Verkehrs-Lexikon (1912) for the German Empire at its pre-World War I extent, including areas now in Poland, France, Denmark and Lithuania [S3], [S12], [S13];\n  - GenTeam for Austrian, Czech, Slovak and Slovenian areas. It needs a free login and gives former and current names, the parish and archive information. [S3], [S6]\n  - Kartenmeister for places east of the Oder–Neisse, including East and West Prussia. It gives the modern name and the nearest parish. [S8], [S10]\n  - the 1905 Prussian municipality gazetteer (Gemeindelexikon) on Ancestry, which gives Protestant and Catholic parishes and the civil registry office. The presenter says its index gives a volume, page and line, and he warns that the Ancestry set is far from complete. [S8]\n  - GOV (Geschichtliches Ortsverzeichnis, gov.genealogy.net) to fix a place's Kreis, parish and state at the event year. Each place has a unique GOV ID, and its memberships in higher administrative and church units are recorded for historical periods. Use it beside Meyers for border and Kreis changes after 1912, since Meyers shows only the 1912 state. Cite the GOV ID as place context only, never as evidence of the event. [S46], [S47]\n- **Record the gazetteer and the entry you used.** The Meyers site shows the original Fraktur entry next to an indexed transcription, plus old and modern map views. [S3], [S13]\n- **Confirm the candidate against a correctly spelled related place.**\n  - Narrow a wildcard such as W*heim by historical state and Oberamt, then compare the candidates’ distances from an independently identified place in the same record. In the lecture’s Weikersheim example, Nassau supplied that second location in Oberamt Mergentheim [S2].\n  - Write the reason you chose the candidate in your notes, next to the rejected namesakes.","sources":["S3","S12","S13","S6","S8","S10","S46","S47","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a195128f0bc8","kind":"method","anchor":"- **Narrow by the Kreis, Oberamt or state nesting.** Many towns share a name. [S13]\n  - Record the historical district before choosing a modern name or the nearest Lutheran and Catholic parishes. Namesakes in different counties can point to different books [S9], [S10].\n- **Do not write to every candidate parish.** For each namesake, take from the gazetteer the towns that held its court, military district and district office. Then search those non-parish series in the FamilySearch catalogue. [S11]\n  - Compare the records that survive for each office. Court marriage contracts, a muster roll or a district house-owner book can identify the family. For two Rosenthals, a house-owner book supplied a sequence for the house back to 1767 [S11]. Check its names against the known family.\n- **Use the office towns to place an unindexed village on a sheet** of the 674-sheet Karte des Deutschen Reiches (1:100,000). Meyers also lists the railway station and its distance. Find the station on the sheet and measure that distance as a radius. [S12]","sources":["S13","S9","S10","S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-553d00784b5e","kind":"method","anchor":"Before browsing baptisms, enter the birthplace and the serving parish as separate fields. A village may have no parish church, and the relevant church can depend on confession and year [S6].","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bb2580ce6684","kind":"method","anchor":"- **Read the office abbreviations in the Meyers entry:**\n  - evPfk: Protestant parish church;\n  - kathPfk: Catholic parish church;\n  - StdA: civil registry office (Standesamt);\n  - AG: lower court (Amtsgericht);\n  - BKdo: military district command (Bezirkskommando). [S7]\n- **Use the punctuation to tell who held each office.** The presenter's rule: an office followed by a comma or semicolon was held in the town itself. [S7] Build the jurisdiction row on it; before you conclude from it that a town lacked an office, confirm the rule in the gazetteer's own introduction.\n- **Do not read an absent church as a gap in the data.** The presenter says a church appears in the entry only if the town had one. [S7] For the civil, court and military offices, the gazetteer names the town that held them when the place did not. [S7]\n- **Record each office independently.** For Hülshagen, the gazetteer walkthrough identifies a local Standesamt; the church archive lists Hülshagen under Lauenhagen [S5], [S45]. Use the civil office for civil registration and the serving parish for church entries.\n- **Fix the Standesamt for the event year, and log what survives.**\n  - Civil registration did not start everywhere at once. Check which rule covered the place in the event year:\n    - Alsace and the annexed part of Lorraine (German 1871–1918): French civil registers from 1792; see [French departmental record routing, step 1](french-departmental-record-routing.md#1-route-by-département-not-by-a-national-index);\n    - left bank of the Rhine, including the Pfalz and Rheinhessen: French-style civil registers from 1798 (in some places 1796), kept until 1875 [S56], [S57], [S58];\n    - right bank of the Rhine in the Rhineland: from 1810 to 1875 [S56]. Westphalia went back to church-book duplicates in 1813/14 [S56], so do not extend this date to the Westphalian parts of the former Grand Duchy of Berg;\n    - Bremen and Lübeck: from 20 August 1811 to the end of 1875 (in Lübeck, after 1813 only the city and the areas just outside its gates) [S59], [S60];\n    - Hamburg: civil registers under French rule (the archive holds volumes of 1814), then its own civil registers from 1866 [S61], [S62];\n    - Frankfurt am Main: marriages from 1849, births and deaths from 1851 [S63];\n    - Baden: church-kept civil-status books from 1810, mayors as registrars from 1 February 1870 (section 6) [S48];\n    - Prussia: from 1 October 1874 [S64];\n    - the rest of the German Empire, Württemberg included: from 1 January 1876. [S64]\n  - For an event before your place's start date, search the church registers and any state copies (section 7).\n  - Use the Standesamt district that covered the place in the event year, not the later Kreis or the nearest town. [S26]\n  - Before you search an office, note which year ranges of its registers survive and where they are kept. Record a missing range as a coverage gap, not as evidence that the event did not happen. A civil death entry may cite the marriage office and its register number. [S27]","sources":["S7","S5","S45","S56","S57","S58","S59","S60","S61","S62","S63","S48","S64","S26","S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7e3b1c9d4a20","kind":"portal-availability","anchor":"**Open the place's GenWiki article for each confession's parish and for where the books are.** Search the place in CompGen's GenWiki (wiki.genealogy.net) [S77 @2026-11-16]. A place article usually gives a short history, notes on the church books and civil-registration records, where the church books are kept, and references to microfilms and digitised copies [S78 @2026-11-16]. Read *Kirchliche Einteilung/Zugehörigkeit* for the parish each confession belonged to and *Genealogische Quellen* for the books [S79 @2026-11-16]. Treat the article as a lead, not as the jurisdiction row: confirm the parish against Meyers and, for the event year, GOV (section 2), and confirm the holdings with the custodian or portal (section 6).","sources":["S77","S78","S79"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7e3b1c9d4a21","kind":"example","anchor":"Worked example, for the Weikersheim of section 2: the article (Internet Archive capture of 13 November 2025; page last edited 24 May 2024) assigns Catholic Weikersheim to Laudenbach parish and gives start years for the Protestant books of Weikersheim, Elpersheim, Nassau and Schäftersheim. It says the Württemberg Protestant books can be consulted on microfilm at the Landeskirchliches Archiv Stuttgart and, for many parishes, as images on Archion, and it links the digitised second copies of the Catholic books (1808–1875) in Staatsarchiv Ludwigsburg, holding F 901. [S79]","sources":["S79"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9e8e810b7967","kind":"method","anchor":"- **Read a kingdom, duchy or province name as the place that applied when the person emigrated.** Many emigrants who left before the 1871 unification gave the state of origin as their birthplace. [S14]\n  - Search under the name used at departure and the name under which the record was later catalogued. For the Duchy of Nassau, distinguish Prussia’s annexation in 1866 from formation of its Hessen-Nassau province in 1868 [S14].\n  - A change of jurisdiction name between records is not a migration. A piece of Bavaria was moved into Hessen-Nassau without anyone moving. [S14]\n- **Choose archives by the historical state, not the present Land.** Church, civil, town, district and state records for one village can sit in different archives. [S15], [S16]\n- **For territory lost after World War I or II, convert the German name.**\n  - Use a German-to-foreign locality register. It is arranged by country, with one section ordered by the German name and another ordered by the foreign name. [S16]\n  - If it lists several places with the same name, choose the one whose Kreis matches the Meyers entry. [S16]\n  - For the postwar Polish name, the *Amtliches Gemeinde- und Ortsnamenverzeichnis der Deutschen Ostgebiete unter fremder Verwaltung* gives German and Polish localities and districts. A BYU reference guide identifies FamilySearch film 824243, item 2 [S83]. The lecture places the German–Polish list at image 124 [S16], [S12]; check the title frames before citing an image.\n  - For the part of East Prussia that went to Russia, use the U.S. Board on Geographic Names gazetteer for the USSR and certain neighbouring areas (Gazetteer No. 42, 1959), in seven volumes. [S16]","sources":["S14","S15","S16","S83","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1fff2ac3326b","kind":"method","anchor":"- **For a town now in another country, search the FamilySearch catalogue twice:** once under the present foreign name and once under the historical German name. The catalogue's place database is good but not perfect. [S17]\n- **If the village is missing, search under its parish town** or the town that held the relevant office. [S6], [S7], [S17]\n- **Find the civil-register custodian through archive descriptions.** The Auprès de nos Racines article suggests searching the locality together with `Personenstandsbücher` in Archivportal-D and Deutsche Digitale Bibliothek. Treat this as a finding-aid search tactic; the article's Munich result and current search controls were not reproduced. [S40]\n  - Open the description and record its level (fonds, series or item), named archive, archival reference and link to the partner's catalogue. In the inspected DDB civil-registration fonds description, the archive name and partner links supplied the next catalogue to check. [S41], [S42]\n  - Follow the partner reference to establish the register type, years and next retrieval step. A fonds description is a lead to the books, not an inspected entry or a promise of images. Keep image access unverified until the relevant book or entry is actually opened.\n- **Check the portals by the holding archive.** A missing FamilySearch film leaves Archion, Matricula and the archive’s own catalogue to check. Record which repository covers the parish, confession, book type and years [S6], [S7].","sources":["S17","S6","S7","S40","S41","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7e3b1c9d4a22","kind":"portal-availability","anchor":"**Places now in Poland: also search Szukaj w Archiwach** (szukajwarchiwach.gov.pl), the Polish State Archives' portal of archival descriptions and scans, which includes the PRADZIAD data on parish and civil registers [S81 @2026-11-16]. Records are listed under the place that created them, the parish or the civil registry office (*urząd stanu cywilnego*), so search the seat you fixed in sections 4 and 5, not only the village [S80 @2026-11-16]. Search under the German name and again under the Polish name from section 5: not every result is listed under both [S77 @2026-11-16], [S80 @2026-11-16]. Separate same-named places by the gmina and the archive shown with each result, and record each unit's reference code [S80 @2026-11-16]. FamilySearch's January 2022 guide says the portal does not include church diocesan archives, so a miss there does not settle where a Catholic parish's books are [S80 @2026-11-16]. For the vital-records search, PRADZIAD and coverage gaps, use [Polish index-to-original recovery](polish-index-original-record-recovery.md).","sources":["S81","S80","S77"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d760b01f8b25","kind":"method","anchor":"- **Name the version for each image:**\n  - parish original;\n  - church-book duplicate (Kirchenbuchduplikat);\n  - later recopy;\n  - parish family register (Württemberg Familienregister);\n  - transcript, abstract or extract;\n  - periodical extract;\n  - compiled Familienbuch, Ortsfamilienbuch or Ortssippenbuch.\n- **Keep the original and the duplicate separate.** Two images of the same entry, one from each version, can differ: one may carry an entry number or page numbers added later, and stamps are later additions. [S18]\n  - Cite each version with its own repository and locators. Never merge them.\n  - Do not assume a duplicate exists. Requirements differed by state and period (Westphalia, for example, required them 1815–1874; for Baden 1810–1870 see the Standesbücher in section 6); check the rule for your state and years first. [S18], [S19]\n  - Beidler says duplicates were usually made at about the same time as the originals and are often nearly identical; use one when the original is unavailable. [S19]\n  - Transcribe conflicting fields from both versions. For one bride the original and duplicate reportedly named different mothers, and both proposed parental couples existed [S35]. Compare independent records for each couple before deciding.\n- **Treat transcripts, abstracts and extracts as secondary gateways.** Check whether the original still exists and how to reach it; sometimes it no longer survives. [S19]\n- **Treat a civil name-index line as a locator; order the full entry and its Sammelakte.**\n  - A Standesamt Namensregister line (office, year, entry number) is not the entry. Ask for a complete, uncertified copy of the original register entry with all marginal notes, not an 'Urkunde', which archives read as an official certificate. [S36], [S39] In the same request, ask for the collected supporting file (Sammelakte or Beiakte); Landesarchiv Berlin catalogues these as separate units. If an online collection ends before your year, continue in the archive's own name indexes. [S36]\n  - Follow every marginal reference by office, register number and year. A single birth entry can point to several later marriages; make a separate search for each referenced entry [S32].\n  - Check the supporting files at each office that posted the banns. One reported marriage file contained only the banns and left a previous spouse’s death unresolved [S37]. A birth certificate filed for the banns or a death registration may identify the birth office and entry number [S38].\n  - If the birth data rest only on an unsourced tree, get the civil marriage entry before you search for the baptism. [S31]\n  - For the Standesamt I registers from former eastern territories, Berlin's official service description says name indexes and supporting files survive only occasionally. [S73] Do not generalise that survival statement to every German registry office; record an unavailable file as a coverage gap, not as evidence.\n- **Read a 'Civil' christening in an index as a civil registration.** In a FamilySearch index, a 'christening' labelled 'Civil' is a Standesamt birth entry, and its date is the day the birth was registered; Ancestry searches return these entries too. Look for the church baptism separately, and check the image to see which date the index took. [S35]\n- **Check how the register was compiled.** For a register grouped by family, read the introduction, handwriting and entry sequence for signs of later recopying. Classify it as a recopy only when the evidence supports that description, and compare a contemporary version when available [S20].\n- **Use periodical extracts as a guide only.** Find them through the periodical's place index and table of contents, then read the original entry. [S23]\n- **Use compiled lineage books to navigate, not as proof.**\n  - Find the family through the surname index. Each family has a number, and each spouse's entry ends with the number of that spouse's parents' family. Follow those numbers back one generation at a time. [S22]\n  - Note which parishes or villages the book says it covers. Find copies through the FamilySearch catalogue or WorldCat, since most are not online. [S21]\n  - Before reporting a negative OFB result, record the compiler’s selection criteria and actual coverage. The Rieden OFB selected Sonthofen entries marked *aus Rieden* and chiefly covers 1800–1860, although the parent parish books start in 1610 [S55]. Browse the parent registers for unlabelled entries and earlier years.\n  - Check every entry against the parish images before you use it. [S21], [S22]","sources":["S18","S19","S35","S36","S39","S32","S37","S38","S31","S73","S20","S23","S22","S21","S55"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9b169eecaedf","kind":"method","anchor":"- **Keep a named sponsor separate from a proxy.** When a baptism names someone acting in the sponsor’s place, transcribe the clause, record each person’s role, and mark an uncertain reading for image review. A translated extract can suggest which words to check in the original [S43].\n- **Check illegitimate baptisms for a later note.** Read to the foot of the page for a father’s name, the later act and its date. If the note or another source identifies the local Amt, search its records for the legitimation separately [S24], [S25].\n  - Search the child under both surnames. Later records, such as an emigration index, may use the father's name. [S24], [S25]\n- **Treat the presenter's legal dates as leads.** He links naming the father to an 1826 ordinance and links the child taking the mother's status to a 1677 law, framed in Bavarian and Prussian terms. Do not apply these rules to Württemberg, other states or other periods without checking the law that applied. [S24], [S25]\n- **Verify the meaning and timing of a cross beside a baptism.** Check the register’s notation and later marriage and burial records. A reported marked baptism could still be matched provisionally to a marriage about thirty years later [S35]. The mark alone cannot establish that the child died in infancy.","sources":["S43","S24","S25","S35"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a693b3ef2fea","kind":"portal-availability","anchor":"**Brandenburg and Berlin: also search the Brandenburg-Datenbank** (db-brandenburg.de), a volunteer database of transcribed sources [S76 @2026-11-12]. Its categories include church books, civil registers, address books, cemeteries and graves, war memorials including the fallen, genealogical evaluations (OFB), and Familienstammbücher und Ahnenpässe. Civil registers are added office by office and year by year, each marked as a name index (*Namensindex*) or a full transcription (*Vollabschrift*), for example \"Standesamt Berlin 10b (B) Geburten 1904 (Namensindex)\" [S74 @2026-11-12]. The Metasuche searches only the databases you select, also matches birth names, and does not yet cover every database [S75 @2026-11-12].","sources":["S76","S74","S75"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7f9c83b5b15a","kind":"custody","anchor":"- For former eastern territories, Standesamt I has an incomplete replacement collection, and the Landesarchiv holds transferred historical registers [S73 @2026-11-19]. Check the specific office, register type, surviving years and reported Ancestry coverage [S26 @2026-11-19], [S28 @2026-11-19].","sources":["S73","S26","S28"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d2062121fd71","kind":"method","anchor":"- **Do not assume one village means one register.**\n  - Read the gazetteer’s parish field and nearby churches separately. Meyers lists Preetz Stadt as Kührsdorf’s Protestant parish; after researchers missed a baptism in Preetz, a participant reported locating entry 26 at nearby Wankendorf [S31], [S85]. Cite the register image once inspected.\n  - When following a family across several births, search each plausible church for every child. A researcher reported Meimersdorf baptisms in both Flintbek and Kiel St. Nikolai [S30].\n  - Read a banns entry for the church that solemnized the marriage: the Teupitz transcription records banns locally and in Berlin but places the wedding in Berlin’s Luisenstadtkirche [S32].\n  - Mark each parish's role (banns, consent, wedding, baptism). Before you call an entry missing, search neighbouring parishes, hospital towns and the mother's home parish, and record which book held each entry.\n- **List a parish for each confession the family may have belonged to.** Regional tools give the nearest Lutheran and nearest Catholic church as separate targets. [S9], [S10]\n- **Search the holding town only for entries about your village.** Search its records under the holding town's name. [S7]\n- **Widen the year window.** A birth year worked out from an age at marriage or death is often rounded, so search several years either side. [S5], [S6]","sources":["S31","S85","S30","S32","S9","S10","S7","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-4d9f5f9b44a6","kind":"fee","anchor":"- Archion requires a paid, time-limited pass to view register images [S67 @2026-11-19].","sources":["S67"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-26651d6766c5","kind":"portal-availability","anchor":"- Archion’s directory lists Protestant Landeskirchen and state archives, as well as the Catholic dioceses of Hildesheim, Speyer and Trier [S68 @2026-11-19]. Matricula lists 19 German Catholic dioceses and the state copies for Baden, Württemberg and Hohenzollern. Berlin, Erfurt, Freiburg, Görlitz, Hamburg, Köln, Speyer and Trier were absent from its list [S69 @2026-11-19], [S70 @2026-11-19].","sources":["S68","S69","S70"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-77709cf81798","kind":"method","anchor":"- A listed archive may still lack the parish or years. Open the parish page and note the years shown.\n  - Use the Ancestry collection titles for the Württemberg family tables and Protestant registers of Baden, Württemberg and Hesse as search terms. Check the specific book for images or an index [S66], [S71], [S86]. For Brandenburg and Posen duplicates, FamilySearch’s July 2026 update identifies collection 1491272. Check image access for the parish and year [S72], [S84].","sources":["S66","S71","S86","S72","S84"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9ddf8b857d02","kind":"custody","anchor":"- **Hesse: open the civil-register second copies in Arcinsys Hessen.** The digitised Personenstandsnebenregister (the registry offices' second copies, now archive holdings) sit under Staatsarchiv Marburg > H Personenstandsarchiv Hessen, holdings HStAM 900–926. [S44 @2026-11-19]","sources":["S44"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cad29361d2c2","kind":"platform-ui","anchor":"- A thumbnail beside the archival reference marks a digitised volume. Open it with 'Digitalisate öffnen' or in the DFG-Viewer. LAGIS lists the online volumes by registry office. [S44 @2026-11-19]","sources":["S44"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-208ab94bfed3","kind":"portal-availability","anchor":"- In January 2026 volumes were online up to births of 1900, marriages of 1930 and deaths of 1965; the death cut-off follows a 60-year rule (§ 9(2) sentence 3 HArchivG). [S44 @2026-11-19], [S64 @2026-11-19] So wartime deaths (1939–45) normally fall inside the online range and births after 1900 normally do not. Deaths up to 1980 were available on application, with a user form, to the Hessisches Staatsarchiv Marburg. [S64 @2026-11-19] Before you plan a request, check the archive's current cut-off and confirm coverage for the specific volume.","sources":["S44","S64"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-38a118c83a45","kind":"platform-ui","anchor":"- A missing thumbnail means the volume is not yet digitised or not yet cleared for publication, not that it is lost. [S44 @2026-11-19]\n  - Check other Länder on their own official sites.","sources":["S44"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5aaff8377824","kind":"portal-availability","anchor":"- **North Rhine-Westphalia: check the Landesarchiv NRW's second registers before writing to a Standesamt or municipal archive.** Marriages 1874/1876–1899 and deaths 1874/1876–1938 are digitised; coverage is partial and growing, and birth registers are not on the list. Start from the Landesarchiv's [Digital family research](https://www.archive.nrw.de/en/landesarchiv-nrw/geschichte-erfahren/familienforschung/digital-family-research) page. Westphalia-Lippe registers open through the archive.nrw.de search; Rhineland volumes (PA 3102 marriages, PA 3103 deaths) open through the department's online pages. [S50 @2026-11-19], [S51 @2026-11-19]","sources":["S50","S51"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-917e6bde9396","kind":"platform-ui","anchor":"- **Search the name index by birthplace, not only by surname.** The MyHeritage index of these registers is searchable in the Schlagwortsuche (keyword search) of the Archivportal NRW (archive.nrw.de). It holds the names and, where recorded, the birth date and birthplace of the people named on each certificate. Certificates are titled `Todesfall <name>`, so pair `Todesfall` with a place or region of origin (`Todesfall Pommern`, `Todesfall Kolberg`) to find migrants from the eastern provinces who died in Westphalia. Narrow the results with the Laufzeit (date range) filter, which uses the death date. [S52 @2026-11-19], [S53 @2026-11-19], [S54 @2026-11-19]","sources":["S52","S53","S54"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-876771680214","kind":"portal-availability","anchor":"- So far only death registers (1874/76 to June 1938) of Regierungsbezirk Münster are indexed: Kreise Ahaus, Beckum, Borken, Coesfeld, Lüdinghausen, Landkreis Münster, Recklinghausen, Steinfurt, Tecklenburg and Warendorf; Städte Bocholt, Bottrop, Gelsenkirchen, Gladbeck, Münster and Recklinghausen; and Isselburg. Marriage registers (1874–1899) and other districts are to follow; check the [current list](https://www.archive.nrw.de/landesarchiv-nrw/geschichte-erfahren/familienforschung/familienforschung-digital/indexdaten-zu-den). The image link opens the register without marking the name, so find the certificate and read all of it. [S52 @2026-11-19], [S53 @2026-11-19]","sources":["S52","S53"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8d8b39148e32","kind":"historical","anchor":"- **Baden 1810–1870: open the Standesbücher.** From 1 January 1810 the clergy, and the rabbis for Jewish communities, kept their registers as civil-status books and sent a second copy (Standesbuch) to the district office after each year's end. Mayors became civil registrars only from 1 February 1870. [S48]","sources":["S48"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f5061abd25ab","kind":"portal-availability","anchor":"- The second copies are at the Generallandesarchiv Karlsruhe (390) for northern Baden and at the Staatsarchiv Freiburg (L 10) for southern Baden, both fully digitised by the Landesarchiv Baden-Württemberg. [S48 @2026-11-19], [S49 @2026-11-19]\n  - For a Baden event of 1810–1870, check this copy as well as the parish original. Classify it as a church-kept duplicate (section 7), not a Standesamt record.","sources":["S48","S49"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7a11087cf01c","kind":"method","anchor":"- **Württemberg from 1808: check the parish Familienregister.** From 1 January 1808 the Protestant and Catholic parishes of Württemberg kept a Familienregister (family register) on printed forms, one sheet per couple with the couple's parents and children. [S65] Use the Ancestry collection title \"Württemberg, Germany, Family Tables, 1550-1985\". [S66] Classify a Familienregister line as a parish family register (section 7) and check it against the baptism, marriage and burial books.","sources":["S65","S66"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-85560e1bbb5f","kind":"portal-availability","anchor":"- **Recheck access against the holding archive’s list.** A February 2026 lecture relied on Hülshagen extracts, but Archion’s Schaumburg-Lippe collection now lists Hülshagen with Lauenhagen [S5 @2026-11-19], [S45 @2026-11-19]. Look for the volume covering the event and compare the extract with its image. Record the actual barrier if you cannot inspect the entry.","sources":["S5","S45"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e2f89b879ee3","kind":"method","anchor":"- **A no-hit in an online civil index is not absence.**\n  - Browse the dated images and check side text as well as the printed form. A Stralau researcher reported unindexed death notifications written beside entries, including notices from hospitals or care institutions [S29].\n  - Record the last visible entry number and date, and compare the online range with the archive’s inventory. The Berlin III images reportedly stopped at no. 882 when no. 910 was sought; wartime loss was a forum explanation [S29]. Record the gap as unavailable online until the custodian establishes whether the volume survives.\n- **Date the parish, and treat a portal's year range as one custodian's holdings.**\n  - Check when the parish began and which parish served the place before. Danzig-Emaus dates only from 1906; St. Nikolai served the area before then. [S34]\n  - A participant who traced Behlendorf before the Archion series beginning in 1761 pointed to copies of the Nusse books for 1614/1618–1760 in the Lübeck city archive. [S33]\n  - Build a table of custodian, register type, years and serving parish. If every church copy has a gap, turn to the civil registers (the Standesamt step in section 4). [S34]","sources":["S29","S34","S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
