claims:
  - {"id":"C-01","kind":"method","anchor":"Use this route for an interwar or 1940s Romanian apprentice, qualified worker, master artisan or workshop proprietor. Begin with the place and trade named in a historical record [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"custody","anchor":"Find the relevant county archive's `Camera de Muncă` fonds and identify which local office served the workplace. Read the inventory before searching names. If the files are grouped by trade, choose the trade first and then search its alphabetical run. If the inventory is grouped by credential, check the applicable labour book, journeyman's book, master's book or apprenticeship series [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"custody","anchor":"The Harghita guide distinguishes the Brașov Chamber’s Miercurea Ciuc office using inventory 303 from its Odorheiu Secuiesc office using inventories 472 and 473. For the latter, look for the alphabetical index and personal files or work books for 1936–1949 [S2 @2026-11-22].","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Capture the credential type and date, the trade and employer as written, and any recorded birth details, domicile, religion, ethnicity, signature or attached photograph. Keep the applicant's statements and the credential issuer's findings distinct. If the file carries a portrait, use the labelled attachment and file context to assess its attribution [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"A miss in a single credential series cannot rule out the trade. Record the local office, the series and dates searched, and whether the inventory or underlying files were accessible. Check parallel applications, apprenticeship contracts and renewed credentials before reporting the result [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"Request the identified personnel file after checking the repository's access conditions for that reference [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
