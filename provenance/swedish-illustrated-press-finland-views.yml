claims:
  - {"id":"C-swedish-illustrated-press-finland-views-1","kind":"method","anchor":"Search Libris by exact periodical title and follow the holding library’s digital link. Use Kaisa Kyläkoski’s lead to Ny illustrerad tidning, Alvin record 461983, for the Helsinki exhibition exterior in no. 21/1876, opening in no. 29, interiors in no. 30, garden in no. 33 and ethnographic exhibition in no. 39. For 1860 Viipuri views of Behm’s school and Monrepos, use her lead to nos. 32 and 33 of Illustrerad Tidning, Alvin record 187030. Browse the full issues, including covers, and compare the Swedish printing with any Finnish copy. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-swedish-illustrated-press-finland-views-2","kind":"example","anchor":"For views of Ladoga or Valamo, use Kaisa Kyläkoski’s lead to Ny illustrerad tidning no. 4/1869. For St. Hemming’s reliquary at Turku Cathedral, check no. 18/1870. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-swedish-illustrated-press-finland-views-3","kind":"example","anchor":"For a Tampere view, check no. 42/1876 of Ny illustrerad tidning for the city view, mills and railway bridge identified by Kaisa Kyläkoski. Read the caption on each image before assigning its locality. [S2]","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-swedish-illustrated-press-finland-views-4","kind":"method","anchor":"Keep the printed caption and any artist, photographer, engraver or earlier publication credit with the issue and page. Follow the credit to the underlying image. In the exhibition series Kaisa Kyläkoski describes, check the exterior for a photograph credit and the opening, interiors and garden for drawing credits. For parallel depictions of a building, compare distinctive details and credits before assigning a common source. [S2] [S3]","sources":["S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-swedish-illustrated-press-finland-views-5","kind":"example","anchor":"Check for a prior lithograph or drawing before treating the issue illustration as the first depiction. For the Ladoga and Valamo views, Kaisa Kyläkoski identifies Russian lithographs as leads. For the Turku reliquary, she points to a drawing by C. Jansson. [S4]","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
