  - {"id":"C-1abe26dd3b87","kind":"unclassified","anchor":"- **Small or large proof.** The small Abstammungsnachweis reached the grandparents; the large one reached the line of ancestors living on 1 January 1800 [S1]. The small proof used seven birth or baptism and three marriage records, or a certified Ahnenpass or Ahnentafel in their place [S9].\n- **Ahnenpass.** A printed booklet, published by at least 17 publishers in 1933–1945, among them the NS Teachers' League and the Reichsnährstand; the registrars' association's Verlag für Standesamtswesen was the most common [S10]. It was not legally required and lacks the evidentiary weight of a civil-status certificate [S10]. Families kept it at home because one person often had to prove descent to several offices [S1].\n- **Organisation forms.** SS men and their brides documented every ancestor born up to 1 January 1800 on the SS-Ahnentafel; SS officers were to reach 1750 [S1], [S2]. SA files hold a \"Fragebogen zur Feststellung der arischen Abstammung\" to the grandparents, with names, occupations, places, dates and confession; Ahnentafeln are rare there [S2]. Reich Chamber of Culture questionnaires reach the grandparents of the applicant and the spouse [S2]. The NS Teachers' League (NSLB) chart is a standard form with names, dates and confession for each ancestor [S25].\n- **Abstammungsbescheid.** A ruling by the Reichsstelle für Sippenforschung (from 12 November 1940 the Reichssippenamt) in a doubtful case: unclear parentage, a foundling, an illegitimate birth [S9], [S12]. More than 112,000 had been issued by 1940 [S12].\n- **Record the depth the document had to reach.** Only lines inside it had to be documented. Record each line's actual certification separately, including lines beyond the required depth; a line without a stamp is uncertified family knowledge.","sources":["S1","S9","S10","S2","S25","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d241b423c18","kind":"method","anchor":"- **Find out what the certifier compared.** Registrars or church-book keepers wrote entries into the Ahnenpass directly [S1]. A 1935 decree also let registrars certify entries, and entries were accepted only on original certificates or certified copies [S10]. The Reich Chamber of Culture checked its questionnaire against the documents presented and confirmed it with a visa (Sichtvermerk) [S2].\n- **Compare the date of certification with the events and the certifier's jurisdiction.** Civil registration was Reich-wide from 1876, with earlier local starts [S10]. Check the start for the office in [German register image recovery](german-register-image-recovery.md). A Northeim registrar certified most entries in one Ahnenpass on 9 June 1942, including a line reaching back to 1777 [S43]. An event older than that office's registers calls for the supporting church certificate or other document and its underlying register.\n- **Record for each line:** the certifying office, its date, and whether that office kept the register the line cites.\n- **Read check marks as the office's checks.** Surviving SS-Ahnentafeln are covered with check marks (Prüfvermerke) [S1]. They show what the SS marriage office checked, not what the register says.\n- **Log every line as a derivative.** A stamp makes a line a certified copy, not a verified original.","sources":["S1","S10","S2","S43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-903116908cd2","kind":"method","anchor":"- **Inspect the baptism entries for witnesses omitted from the chart.** At several children's baptisms the same man appeared first as a forester's assistant and later as a priest. The researcher followed that change in occupation to investigate paternity [S36]. Transcribe the witnesses, their roles and any marginal legitimation separately. Repeated appearances suggest an inquiry and do not establish parentage on their own.\n- **Investigate a blank father line.** Compare stamps and other entries at the same depth to see whether the proof was completed. For disputed parentage within a completed proof, look for an Abstammungsbescheid, the Reichsstelle's ruling [S9]. An entire paternal branch was blank in one family document, and the explanation came from family hearsay [S34]. Check the original birth entry and any later acknowledgment or legitimation. Preserve the omission and the family's explanation separately.\n- **Date later annotations separately.** At Wallenfels, Joannes Wolf's marriage entry gave 1778, and another hand added 11 June 1781. The reported age at death, 53½ on 6 February 1833, implies about August 1779 [S35]. Preserve all three readings with their date roles. Check the baptism, mother and other identifiers before attaching the 1781 birth to the groom.\n- **Check names against the image before searching them.** One SS-Ahnentafel transcript was corrected from Niedermamhacht to Niedermarschacht and from Straner to Strauer [S44]. Keep the initial reading for traceability, check the letters on the image and test the locality in a gazetteer ([German register image recovery](german-register-image-recovery.md)).","sources":["S36","S9","S34","S35","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fe5bb781c821","kind":"method","anchor":"- **The confession field fed the classification.** The 11 April 1933 regulation called a person \"non-Aryan\" if one parent or grandparent was, and presumed this when that parent or grandparent had belonged to the Jewish religion [S9]. Under the 1935 rules, a grandparent who had belonged to the Jewish religious community counted as \"fully Jewish\" without counter-proof, including a woman who had converted to Judaism on marriage [S11].\n- **Copy the confession exactly, as a dated statement, and source it to the register entry.** Do not convert it into race, ethnicity, \"Jewish ancestry\" or \"Aryan descent\".\n- **Quarantine the labels.** Keep \"arisch\", \"deutschblütig\", \"Mischling\" and \"jüdisch versippt\" verbatim in a separate field marked \"regime classification\". Do not claim descent, ethnicity or kinship from them.\n- **Read \"gottgläubig\" as a church exit.** From 26 November 1936 it replaced \"Dissident\" or \"konfessionslos\" for people who had left a church [S13]; it appears in civil records after 1938 [S38]. Look for the baptism in the church the person left.\n- **Separate a regime ruling from evidence of relationship.** The Reichsstelle used reports from university institutes [S9], [S12], and SA medical records included descriptions of supposed “racial features” [S2]. A ruling about Feix relied on an assistant's inspection of his appearance [S24]. Record its issuer, date and imposed label as evidence of how the regime treated him. Such examinations and photographs cannot establish ancestry or kinship. Trace any cited register entries, adoption papers and witness statements to their sources.","sources":["S9","S11","S13","S38","S12","S2","S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3640d06ccefe","kind":"unclassified","anchor":"- **Start with the family.** No central archive of ancestry proofs ever existed; the Ahnenpass is to be sought in the family [S1]. The SS marriage office returned certificates, Ahnenpässe and family books after its decision [S1]. Ask every branch of the family, then check deposited family papers and collections of orphaned passes: they surface at flea markets and in forum \"found items\" threads [S33], and the Brandenburg database indexes donated Ahnenpässe and family books with a Brandenburg link [S23].\n- **Privacy gate:** <!-- privacy-gate: request --> The requests below for NSLB, personnel, party correspondence and Erbhof files ask for records about a named person who may still be living, and about that person's relatives; answer the privacy gate in `SKILL.md` before each request.\n- **Teacher.** Ask the Bundesarchiv for a name search in NS 12, the NSLB's Hauptamt für Erzieher [S3], [S25]. Use restrictions on much of the holding rule out a systematic search; the archive searches single names on request and gave a processing time of about four months [S25]. Search the state archive in parallel:\n  - the teacher's personnel file, and the school authority's subject files by school, such as \"Abstammungsnachweise und Zeugnisabschriften zur Einstellung von Lehrern, 1937–1945\" in a provincial school board's holding [S20];\n  - family papers deposited there, which can hold the family's copy of an NSLB-Ahnentafel [S21].\n  Search the Deutsche Digitale Bibliothek and Archivportal-D by name and by title words such as \"Abstammung\". Church and university archives often catalogue personnel files by name with birth dates; other archives list them only by year or by initial letter [S40]. Where files are listed by letter, browse the letter group before you record a name search as a miss.\n  The NSLB material from the Berlin Document Center is mainly card files that prove membership only [S2]; NARA filmed it as A3340, series MF [S7].\n- **Civil servant or public employee.** The 1933 civil-service law required the proof [S9]. Ask the archive of the employing authority for the personnel file; for Reich ministries, look in their personnel-file series at the Bundesarchiv [S2]. Mayors and officials usually have a surviving file unless the office burned; mass employers' files were often discarded or sampled [S39].\n- **SS man or SS bride.** From 1 January 1932 every SS member needed a marriage approval [S2]. About 240,000 marriage-office files survive, with the RuS questionnaire, the hereditary-health form, the medical form and the SS-Ahnentafel [S2]. They are BArch R 9361-III [S1], [S3] and NARA A3343, series RS (7,811 rolls); officer files are series SSO and enlisted files series SM [S7]. In wartime the office usually accepted proof to the grandparents only, and war weddings needed no Ahnentafel at first [S1].\n- **SA member.** R 9361-III [S3]; NARA A3341 [S7]. Expect the ancestry questionnaire, not an Ahnentafel [S2].\n- **NSDAP member.** The membership card includes name, birth date and place, occupation, membership number, application and entry dates, any end of membership and address changes; central-file cards can also carry a portrait photograph [S2]. Use it to fix the birth data, then ask for the party correspondence, R 9361-II [S3] (NARA A3340, series PK [S7]). Applications survive only in part [S2].\n- **Artist, writer, musician, journalist, film or press worker.** The Reich Chamber of Culture file, R 9361-V [S3]; NARA A3339 [S7].\n- **Farmer on an Erbhof.** The proof reached 1800, for the spouse too [S9]. Ask the state archive that holds the local Amtsgericht's records for the Anerbengericht's Erbhof files, for example a 1934–1944 series of Erbhofregisterakten [S22].\n- **Doubtful case.** The Reichssippenamt holding, R 1509, contains few individual cases; the office gave assessments [S1]. Look for the Abstammungsbescheid in the family's papers and in the person's personnel file.\n- **Jewish household in 1939.** The Bundesarchiv holds the census supplementary cards on descent and education of 17 May 1939 [S1], [S2].","sources":["S1","S33","S23","S3","S25","S20","S21","S40","S2","S7","S9","S39","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b9d33220fc2d","kind":"custody","anchor":"- **Identify the subject of the file.** The BDC personnel records are indexed under the applicant or member. To find an earlier ancestor on an SS-Ahnentafel, establish the descendant's identity and birth date and search under that descendant [S2 @2026-11-19].\n- **Run invenio first.** Try name variants and initially omit the birth date [S4 @2026-11-19]. Save the signature, holding, identifying details and reading room as listed. For R 9361-I/2553 a forum respondent expected only a list with a name and birth date [S32 @2026-11-19]. Treat that as a prediction about the file until you inspect it. A finding-aid hit alone establishes neither fuller contents nor membership.\n- **Privacy gate:** <!-- privacy-gate: request --> A written request for an SS, Waffen-SS, SA or party file asks for records about the applicant, who may still be living; answer the privacy gate in `SKILL.md` before you send it.\n- **Then write.** For BDC material you cannot locate in the public catalogue, identify the file subject and state the purpose in your written inquiry [S2 @2026-11-19]. Quote any signature found. Send SS, Waffen-SS and SA requests to the Abteilung Deutsches Reich at Berlin-Lichterfelde [S4 @2026-11-19].\n- **Use the NARA films for a first pass.** The films are arranged by organisation, series, then alphabetically or phonetically by surname [S7 @2026-11-19]. NARA's scans of both NSDAP card files are online with machine-read text [S8 @2026-11-19]. Search both card files, the central file (MFKL) and the local-group file (MFOK) [S7 @2026-11-19]. On a roll, cards can run in reverse alphabetical order, sound-alike names (Meier, Maier, Meyer) file together and sort by given name and birth date, and the text recognition misses cards: page before and after every hit [S45 @2026-11-19].\n- **Keep the Bundesarchiv request separate.** The Bundesarchiv searches its own scans of the card file on request and allows reading-room use only for research, official and educational purposes [S5 @2026-11-19]. A NARA hit does not replace a request for the party correspondence or an SS file. A July 2026 report described newspaper indexes covering only part of the SA and SS personnel holdings [S27 @2026-11-19]. Record which files a name search actually covered.","sources":["S2","S4","S32","S7","S8","S45","S5","S27"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-e4cad26a0397","kind":"unclassified","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> A request for a protected file, or for earlier access to it, concerns a person who may still be living and states your relationship and purpose; answer the privacy gate in `SKILL.md` before you send it.\n- **Do the arithmetic for the person the file concerns.** Files about a person may be used 10 years after that person's death; if the death year cannot be found, 100 years after birth; if neither date is known, 60 years after the file was created [S6]. For an SS man born in 1927 whose death year cannot be established, the ordinary protection period ends in 2027. A death certificate moves the end to 10 years after the death, so send it with the request.\n- **Ask for earlier access on the law's two routes.** The Bundesarchiv can shorten the period with the person's consent, or without it when the use is indispensable for a research or documentation project or for legitimate interests that mainly serve another person or body, and harm to the person or relatives is ruled out, for example by anonymised copies or written undertakings (§ 12(2)) [S6]. After the person's death, relatives who show a legitimate interest have a right to information or inspection, unless the person left other instructions (§ 14(2)) [S6]. State the relationship and the purpose in the request.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d08fc48d5fa8","kind":"method","anchor":"**The three periods above are federal and bind the Bundesarchiv.** A state archive applies its own state's archive law: Bavaria's, for example, sets the same three periods for its state archives [S42]. Do not apply the federal periods in another state's archive without reading that state's law.","sources":["S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-be450f24a24a","kind":"custody","anchor":"- **Know what the projects made.** The Reichsnährstand aimed at a village lineage book for every village and organised church-book card indexing [S15 @2026-11-19]. The Kirchenbuchstelle Alt-Berlin carded Berlin's church registers for ancestry proofs and to identify Christians of Jewish origin, compiled all Berlin Jewish baptisms from 1800 to 1936, and sent its results to the Reichsstelle [S14 @2026-11-19]. Lippe's church registers were carded by volunteers from about 1934 for the same purpose, with Jewish baptisms and mixed marriages recorded separately and reported [S29 @2026-11-19]. Nuremberg's carded church books served the same requests [S30 @2026-11-19] and are on Archion [S17 @2026-11-19].\n- **Know the films.** Sippenämter had church books and Jewish registers filmed during the war [S28 @2026-11-19]. The Reichssippenamt's church-book originals and films, including from Danzig-West Prussia, Białystok, Kreis Sudauen and the Generalgouvernement, are in Leipzig [S1 @2026-11-19], together with paper copies made from the films [S31 @2026-11-19]. Ask Leipzig which of the three forms exists for your parish, and order the original where it survives. Some Archion images are digitised from those films; the image page names the Leipzig holding \"Reichssippenamt - Kirchenbuchunterlagen\" [S16 @2026-11-19]. A January 2026 report described Berlin security films on FamilySearch and Ancestry and distinguished the eastern-territory books held by the Evangelisches Zentralarchiv [S41 @2026-11-19]. Verify access for the particular title. Read the source note of every image before you cite it as the register. The Saxon State Archives dates the Gatermann filming of confiscated Jewish communal records to November 1944–April 1945 and identifies the firm as based in Duisburg-Hamborn [S46 @2026-11-19]. For Hesse, the originals were destroyed shortly after the war and the films are the only remaining source [S19 @2026-11-19].\n- **Cite the derivative with its maker and date.** For a card or film image, record the project, the holding and the original register it copies.\n- **Check it against the original if the original survives.** A card is an abstract, made by volunteers, and the Lippe index is incomplete and mostly ends in the mid or late 19th century [S29 @2026-11-19].\n- **Retain an extract when the original register is unavailable.** A Pomeranian family's church and civil extracts had been obtained by a grandfather who worked as a Wehrmacht civil servant [S37 @2026-11-19]. Record the issuing office, certification date and original volume or entry named. Distinguish a documented loss from a register you have yet to locate. Identify the surviving item as an extract or film.\n- **Read a separate card series as the indexers' reporting task.** A card in a converts' or mixed-marriage series records what the indexers were told to report. Use it to find the register entry; if the register is lost, log the card as the surviving witness.","sources":["S15","S14","S29","S30","S17","S28","S1","S31","S16","S41","S46","S19","S37"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7403f69fff09","kind":"custody","anchor":"**For a Jewish community register from central or eastern Germany, look for the original in Leipzig.** The Bundesarchiv's information sheet says it handed the civil-status registers of Jewish communities from central and eastern Germany to Leipzig in 2010, and that the Reichssippenamt's collection there is accessible in the Staatsarchiv Leipzig today [S1 @2026-11-13].","sources":["S1"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-72c51f06574c","kind":"method","anchor":"**Allgemeine SS applicant.** Use the applicant search in section 6 to locate the RuSHA file. Check it for an SS-Aufnahmegesuch (admission application) and any accompanying Ahnentafel even if you have no evidence of a marriage [S47], [S48]. For applications from December 1937, look for the kleine Ahnentafel documenting the applicant's line through the grandparents [S49]. Verify admission separately using evidence such as an SS membership card [S49].","sources":["S47","S48","S49"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-91c4ddb0f97c","kind":"method","anchor":"**Family certificates from the Protectorate of Bohemia and Moravia.** If the family holds birth certificates from several generations that were all issued during the Protectorate, keep them together as a possible ancestry-proof packet [S50], [S51]. Look among the accompanying papers for a matching *Prohlášení o rodovém původu* (declaration of ancestry). For a public employee, check the personnel file for that declaration. The 1940 instructions directed offices to file the declaration with the personnel papers and return the supporting certificates to the employee [S51]. Record the purpose of the bundle only when its paperwork identifies it.","sources":["S50","S51"],"checked":null,"stated_as":"fact","review":"reviewed"}
