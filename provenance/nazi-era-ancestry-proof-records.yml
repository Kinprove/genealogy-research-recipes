claims:
  - {"id":"C-1abe26dd3b87","kind":"unclassified","anchor":"- **Small or large proof.** The small Abstammungsnachweis reached the grandparents; the large one reached the line of ancestors living on 1 January 1800 [S1]. The small proof used seven birth or baptism and three marriage records, or a certified Ahnenpass or Ahnentafel in their place [S9].\n- **Ahnenpass.** A printed booklet, published by at least 17 publishers in 1933–1945, among them the NS Teachers' League and the Reichsnährstand; the registrars' association's Verlag für Standesamtswesen was the most common [S10]. It was not legally required and lacks the evidentiary weight of a civil-status certificate [S10]. Families kept it at home because one person often had to prove descent to several offices [S1].\n- **Organisation forms.** SS men and their brides documented every ancestor born up to 1 January 1800 on the SS-Ahnentafel; SS officers were to reach 1750 [S1], [S2]. SA files hold a \"Fragebogen zur Feststellung der arischen Abstammung\" to the grandparents, with names, occupations, places, dates and confession; Ahnentafeln are rare there [S2]. Reich Chamber of Culture questionnaires reach the grandparents of the applicant and the spouse [S2]. The NS Teachers' League (NSLB) chart is a standard form with names, dates and confession for each ancestor [S25].\n- **Abstammungsbescheid.** A ruling by the Reichsstelle für Sippenforschung (from 12 November 1940 the Reichssippenamt) in a doubtful case: unclear parentage, a foundling, an illegitimate birth [S9], [S12]. More than 112,000 had been issued by 1940 [S12].\n- **Record the depth the document had to reach.** Only lines inside it had to be documented. Record each line's actual certification separately, including lines beyond the required depth; a line without a stamp is uncertified family knowledge.","sources":["S1","S9","S10","S2","S25","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d241b423c18","kind":"unclassified","anchor":"- **Find out what the certifier compared.** Registrars or church-book keepers wrote entries into the Ahnenpass directly [S1]. A 1935 decree also let registrars certify entries, and entries were accepted only on original certificates or certified copies [S10]. The Reich Chamber of Culture checked its questionnaire against the documents presented and confirmed it with a visa (Sichtvermerk) [S2].\n- **A registrar's stamp on a line older than civil registration means papers, not registers.** Civil registration began Reich-wide only in 1876, which is why church registers had to be used [S10]; check the earlier local start dates in [German register image recovery](german-register-image-recovery.md). A registrar who certified a line older than the office's own registers compared church certificates presented to the office. In one reported Ahnenpass, entries back to 1777 were mostly certified on a single day in 1942 by the registrar of one town [S33]. Treat such a line as a copy of a copy until you open the register.\n- **Record for each line:** the certifying office, its date, and whether that office kept the register the line cites.\n- **Read check marks as the office's checks.** Surviving SS-Ahnentafeln are covered with check marks (Prüfvermerke) [S1]. They show what the SS marriage office checked, not what the register says.\n- **Log every line as a derivative.** A stamp makes a line a certified copy, not a verified original.","sources":["S1","S10","S2","S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-903116908cd2","kind":"unclassified","anchor":"- **The chart drops what decides hard cases.** It gives names, dates, places and confession. It leaves out godparents, witnesses, marginal notes and legitimations. In one reported case an Ahnenpass with certified birth entries looked final. The original baptism entries then named one man as a witness at several of the children's baptisms, first as a forester's assistant and later as a priest. That lead identified the father [S36].\n- **A blank father line is a lead, not a finding.** It means the chart's maker entered no father. Inside the required depth of a finished proof, it points to an illegitimate birth with no father named or to an unknown father: a case of unclear parentage, which the Reichsstelle decided as a doubtful case [S9]. Look for an Abstammungsbescheid (section 5, doubtful case). On an unfinished pass it can mean only that the line was never filled; check whether the other lines at that depth are stamped. In one reported family the whole paternal side of a grandfather was left out and a family story supplied a reason [S34]. Go to the birth entry and any later paternity or legitimation note. Treat the story as a claim to test.\n- **Test later additions in old registers.** Establish the date, author and basis of an annotation in a different hand. Test its claimed link against an independent entry. Prefer the contemporaneous entry over an unattributed later-hand addition until an independent entry confirms the addition: one marriage entry gave only the groom's birth year, and a full birth date added in another hand conflicts with his age at death (53½ in February 1833, so born about August 1779, not 1781) [S35].\n- **Re-read places and surnames on the image.** One poster corrected a transcription of an SS-Ahnentafel: Niedermamhacht was Niedermarschacht, Straner was Strauer [S33]. Resolve each place in a gazetteer ([German register image recovery](german-register-image-recovery.md)).","sources":["S36","S9","S34","S35","S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fe5bb781c821","kind":"unclassified","anchor":"- **The confession field fed the classification.** The 11 April 1933 regulation called a person \"non-Aryan\" if one parent or grandparent was, and presumed this when that parent or grandparent had belonged to the Jewish religion [S9]. Under the 1935 rules, a grandparent who had belonged to the Jewish religious community counted as \"fully Jewish\" without counter-proof, including a woman who had converted to Judaism on marriage [S11].\n- **Copy the confession exactly, as a dated statement, and source it to the register entry.** Do not convert it into race, ethnicity, \"Jewish ancestry\" or \"Aryan descent\".\n- **Quarantine the labels.** Keep \"arisch\", \"deutschblütig\", \"Mischling\" and \"jüdisch versippt\" verbatim in a separate field marked \"regime classification\". Do not claim descent, ethnicity or kinship from them.\n- **Read \"gottgläubig\" as a church exit.** From 26 November 1936 it replaced \"Dissident\" or \"konfessionslos\" for people who had left a church [S13]; it appears in civil records after 1938 [S38]. Look for the baptism in the church the person left.\n- **Do not use racial examinations as evidence.** Reichsstelle rulings drew on \"erb- und rassebiologische\" reports by university institutes [S9], [S12]; SA medical findings recorded \"racial features\" [S2]. In one documented case an institute assistant's examination of a man's appearance led the Reich office to classify him as a \"Mischling\" [S24]. These are pseudo-science. Use only the register entries, adoption papers or statements such a file cites. Do not treat a file photograph as evidence of identity or kinship.","sources":["S9","S11","S13","S38","S12","S2","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3640d06ccefe","kind":"unclassified","anchor":"- **Start with the family.** No central archive of ancestry proofs ever existed; the Ahnenpass is to be sought in the family [S1]. The SS marriage office returned certificates, Ahnenpässe and family books after its decision [S1]. Ask every branch of the family, then check deposited family papers and collections of orphaned passes: they surface at flea markets and in forum \"found items\" threads [S33], and the Brandenburg database indexes donated Ahnenpässe and family books with a Brandenburg link [S23].\n- **Privacy gate:** <!-- privacy-gate: request --> The requests below for NSLB, personnel, party correspondence and Erbhof files ask for records about a named person who may still be living, and about that person's relatives; answer the privacy gate in `SKILL.md` before each request.\n- **Teacher.** Ask the Bundesarchiv for a name search in NS 12, the NSLB's Hauptamt für Erzieher [S3], [S25]. Use restrictions on much of the holding rule out a systematic search; the archive searches single names on request and gave a processing time of about four months [S25]. Search the state archive in parallel:\n  - the teacher's personnel file, and the school authority's subject files by school, such as \"Abstammungsnachweise und Zeugnisabschriften zur Einstellung von Lehrern, 1937–1945\" in a provincial school board's holding [S20];\n  - family papers deposited there, which can hold the family's copy of an NSLB-Ahnentafel [S21].\n  Search the Deutsche Digitale Bibliothek and Archivportal-D by name and by title words such as \"Abstammung\". Church and university archives often catalogue personnel files by name with birth dates; other archives list them only by year or by initial letter [S40]. Where files are listed by letter, browse the letter group before you record a name search as a miss.\n  The NSLB material from the Berlin Document Center is mainly card files that prove membership only [S2]; NARA filmed it as A3340, series MF [S7].\n- **Civil servant or public employee.** The 1933 civil-service law required the proof [S9]. Ask the archive of the employing authority for the personnel file; for Reich ministries, look in their personnel-file series at the Bundesarchiv [S2]. Mayors and officials usually have a surviving file unless the office burned; mass employers' files were often discarded or sampled [S39].\n- **SS man or SS bride.** From 1 January 1932 every SS member needed a marriage approval [S2]. About 240,000 marriage-office files survive, with the RuS questionnaire, the hereditary-health form, the medical form and the SS-Ahnentafel [S2]. They are BArch R 9361-III [S1], [S3] and NARA A3343, series RS (7,811 rolls); officer files are series SSO and enlisted files series SM [S7]. In wartime the office usually accepted proof to the grandparents only, and war weddings needed no Ahnentafel at first [S1].\n- **SA member.** R 9361-III [S3]; NARA A3341 [S7]. Expect the ancestry questionnaire, not an Ahnentafel [S2].\n- **NSDAP member.** The membership card includes name, birth date and place, occupation, membership number, application and entry dates, any end of membership and address changes; central-file cards can also carry a portrait photograph [S2]. Use it to fix the birth data, then ask for the party correspondence, R 9361-II [S3] (NARA A3340, series PK [S7]). Applications survive only in part [S2].\n- **Artist, writer, musician, journalist, film or press worker.** The Reich Chamber of Culture file, R 9361-V [S3]; NARA A3339 [S7].\n- **Farmer on an Erbhof.** The proof reached 1800, for the spouse too [S9]. Ask the state archive that holds the local Amtsgericht's records for the Anerbengericht's Erbhof files, for example a 1934–1944 series of Erbhofregisterakten [S22].\n- **Doubtful case.** The Reichssippenamt holding, R 1509, contains few individual cases; the office gave assessments [S1]. Look for the Abstammungsbescheid in the family's papers and in the person's personnel file.\n- **Jewish household in 1939.** The Bundesarchiv holds the census supplementary cards on descent and education of 17 May 1939 [S1], [S2].","sources":["S1","S33","S23","S3","S25","S20","S21","S40","S2","S7","S9","S39","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b9d33220fc2d","kind":"unclassified","anchor":"- **Name the person the file is about.** Access is only by surname, given name and birth date, and only the person concerned can be searched, never that person's ancestors [S2]. To reach a 1790s ancestor on an SS-Ahnentafel, identify the descendant who applied and that person's birth date.\n- **Run invenio first.** Search without the birth date first and with spelling variants [S4]. A hit can name the holding, the birth date and the reading room; one reported hit in R 9361-I was a list giving only name and birth date [S32]. Record the signature.\n- **Privacy gate:** <!-- privacy-gate: request --> A written request for an SS, Waffen-SS, SA or party file asks for records about the applicant, who may still be living; answer the privacy gate in `SKILL.md` before you send it.\n- **Then write.** The BDC's own card indexes and databases are not open to users, so a written request stating the purpose is needed [S2]. Quote any signature found. Send SS, Waffen-SS and SA requests to the Abteilung Deutsches Reich at Berlin-Lichterfelde [S4].\n- **Use the NARA films for a first pass.** The films are arranged by organisation, series, then alphabetically or phonetically by surname [S7]. NARA's scans of both NSDAP card files are online with machine-read text [S8]. Search both card files, the central file (MFKL) and the local-group file (MFOK) [S7]. On a roll, cards can run in reverse alphabetical order, sound-alike names (Meier, Maier, Meyer) file together and sort by given name and birth date, and the text recognition misses cards: page before and after every hit [S26].\n- **Keep the Bundesarchiv request separate.** The Bundesarchiv searches its own scans of the card file on request and allows reading-room use only for research, official and educational purposes [S5]. A NARA hit does not replace a request for the party correspondence or an SS file. The paid name searches run by newspapers index only part of the SA and SS files, and the Bundesarchiv answers from more than they show [S27]; a miss there is not a negative.","sources":["S2","S4","S32","S7","S8","S26","S5","S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e4cad26a0397","kind":"unclassified","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> A request for a protected file, or for earlier access to it, concerns a person who may still be living and states your relationship and purpose; answer the privacy gate in `SKILL.md` before you send it.\n- **Do the arithmetic for the person the file concerns.** Files about a person may be used 10 years after that person's death; if the death year cannot be found, 100 years after birth; if neither date is known, 60 years after the file was created [S6]. For an SS man born in 1927 whose death year cannot be established, the ordinary protection period ends in 2027. A death certificate moves the end to 10 years after the death, so send it with the request.\n- **Ask for earlier access on the law's two routes.** The Bundesarchiv can shorten the period with the person's consent, or without it when the use is indispensable for a research or documentation project or for legitimate interests that mainly serve another person or body, and harm to the person or relatives is ruled out, for example by anonymised copies or written undertakings (§ 12(2)) [S6]. After the person's death, relatives who show a legitimate interest have a right to information or inspection, unless the person left other instructions (§ 14(2)) [S6]. State the relationship and the purpose in the request.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-be450f24a24a","kind":"unclassified","anchor":"- **Know what the projects made.** The Reichsnährstand aimed at a village lineage book for every village and organised church-book card indexing [S15]. The Kirchenbuchstelle Alt-Berlin carded Berlin's church registers for ancestry proofs and to identify Christians of Jewish origin, compiled all Berlin Jewish baptisms from 1800 to 1936, and sent its results to the Reichsstelle [S14]. Lippe's church registers were carded by volunteers from about 1934 for the same purpose, with Jewish baptisms and mixed marriages recorded separately and reported [S29]. Nuremberg's carded church books served the same requests [S30] and are on Archion [S17].\n- **Know the films.** Sippenämter had church books and Jewish registers filmed during the war [S28]. The Reichssippenamt's church-book originals and films, including from Danzig-West Prussia, Białystok, Kreis Sudauen and the Generalgouvernement, are in Leipzig [S1], together with paper copies made from the films [S31]. Ask Leipzig which of the three forms exists for your parish, and order the original where it survives. Some Archion images are digitised from those films; the image page names the Leipzig holding \"Reichssippenamt - Kirchenbuchunterlagen\" [S16]. Berlin church-book images on FamilySearch and Ancestry include the Reichssippenamt's security films; books from the former eastern territories held by the Evangelisches Zentralarchiv are not viewable there [S41]. Read the source note of every image before you cite it as the register. Jewish community registers were collected and photographed in winter 1944 by a Duisburg-Hamborn firm [S18]. For Hesse, the originals were destroyed shortly after the war and the films are the only remaining source [S19].\n- **Cite the derivative with its maker and date.** For a card or film image, record the project, the holding and the original register it copies.\n- **Check it against the original if the original survives.** A card is an abstract, made by volunteers, and the Lippe index is incomplete and mostly ends in the mid or late 19th century [S29].\n- **If the original is lost, log the derivative as the surviving witness.** Write \"original lost; film only\" or \"original lost; certified extract only\". In one Pomeranian family, extracts a grandfather had ordered as a Wehrmacht civil servant carried the research where church books and civil registers were missing [S37].\n- **Read a separate card series as the indexers' reporting task.** A card in a converts' or mixed-marriage series records what the indexers were told to report. Use it to find the register entry; if the register is lost, log the card as the surviving witness.","sources":["S15","S14","S29","S30","S17","S28","S1","S31","S16","S41","S18","S19","S37"],"checked":null,"stated_as":null,"review":"pending"}
