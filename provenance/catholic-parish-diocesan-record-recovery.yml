  - {"id":"S57","kind":"catalogue","urls":["https://adatbazisokonline.mnl.gov.hu/adatbazis/mikrofilm-anyakonyvek/adatlap/38952"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Read 2026-11-19 for the Bátaszék holding under Pécs","entry_sha256":"5e7b32254f400ab5f04619d0b9320ecc74d6672c013b235abe17df5eb6403287","claims":["C-bb65834391b5"],"review":"reviewed"}
