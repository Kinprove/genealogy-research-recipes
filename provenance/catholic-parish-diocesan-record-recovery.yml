claims:
  - {"id":"C-c80713899341","kind":"unclassified","anchor":"Use this recipe before you conclude that a Catholic baptism, marriage or burial does not exist or that a register was lost. Use it when one parish search or one online collection has failed, when a parish name matches several churches, when a parish has closed or merged, or when the spouses in a marriage may have been related. It builds a holdings register: the parish that kept the register, alternative parishes, the diocesan copy, the successor custodian and any dispensation file, each with the level actually inspected.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-68efc1ef653f","kind":"unclassified","anchor":"For Irish parishes and the National Library of Ireland (NLI) images, use [Irish Catholic parish image recovery](irish-catholic-parish-image-recovery.md). For FamilySearch Catalog and DGS steps, use [FamilySearch practical record workflows](familysearch-practical-record-workflows.md). For cemetery follow-up, use the [burial evidence packet](burial-evidence-packet.md). For identity and kinship rulings, and for comparing a register with its copy, use [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-565af07781cd","kind":"unclassified","anchor":"- Begin with the town or address and the event date. Do not begin with the dedication name. Patron names repeat, so a single country can have several parishes with the same name. Record every candidate as *dedication + town + diocese*. Never record it by dedication alone. [S4]\n- Look up the town in a Catholic directory such as gcatholic.org or catholicdirectory.com to get its parish and diocese. If one directory has no entry, try another. [S2], [S3] One presenter reported that an AI chatbot often named the correct parish and diocese. Treat any such answer as a lead and confirm it in a directory or catalogue ([AI for documentary records](ai-for-documentary-records.md)). [S3]\n- If the event took place at a chapel, mission or subsidiary church served by a visiting priest, search the parish church's books first. Registers were kept at parish level. The priest brought his notes from secondary churches and pastoral centres back to the parish register. An entry may or may not name the other building. [S1], [S2], [S3]\n- Modern directories show today's parishes. Parishes split, merge and close, so check the candidate against historical boundaries or diocesan maps for the event date. Also note adjoining parishes that were created later or earlier. [S3], [S11], [S12]\n- **Switzerland: route by canton, confession and place of origin.** For a Swiss citizen, a civil-status event is registered where it happened and also at the place of origin (Heimatort, lieu d'origine), which can differ from the birthplace and the residence. Nationwide civil registration began in 1876; before that, the church registers are the record, and Reformed and Catholic parishes kept separate ones. [S17] Check the canton's holdings first, because some cantons kept civil registers earlier: Geneva's civil registers start in 1798, for the city and for the rural and suburban communes. [S23] Look for those registers in the parish or communal archives, and ask the cantonal state archive, which keeps directories of them. [S17] Access to recent family registers needs permission from the competent supervisory authority. [S17] Do not send the request to the Swiss Federal Archives. Civil status is a communal and cantonal matter, and the Federal Archives mainly hold files on people who dealt with federal authorities, such as refugees and emigrants. [S18]","sources":["S4","S2","S3","S1","S11","S12","S17","S23","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c1859cf9e56b","kind":"unclassified","anchor":"1. **Other parishes in the same town.** A family could use a neighbouring parish, for example because they disliked the priest. [S4]\n2. **For a marriage, the bride's parish first, then the groom's.** Marriage in the bride's parish was the usual practice, so search it first. There are exceptions, so a miss there sends you to the groom's parish. [S4], [S10]\n3. **The diocesan copy series** (step 3).\n4. **The successor parish.** In Philadelphia, the records of a closed or consolidated parish went to one designated holding parish. The archdiocesan archive (now the Catholic Historical Research Center, CHRC) sends requesters to that parish and uses parish boundary maps (for 1891, 1921 and 1971) to place an address in its former parish. Elsewhere, ask the diocese which parish received the registers. Do not assume the nearest surviving church holds them. [S11], [S12]","sources":["S4","S10","S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1f4a586740d2","kind":"unclassified","anchor":"Treat burial separately. In the Archdiocese of Philadelphia, the archdiocesan cemeteries (for example Old Cathedral, New Cathedral and Holy Sepulchre) were leased in 2013 to StoneMor, which holds their records, and the archive holds no burial records. Parish cemeteries keep their own records. Check who currently operates the cemetery, and do not assume this split applies in other dioceses. [S11], [S12]","sources":["S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fc3bcb8cbeaa","kind":"unclassified","anchor":"- Dioceses customarily made a periodic copy of parish registers, usually yearly, sometimes called bishop's transcripts in English (other countries use other names). This copy can survive when the parish book is lost, so it is a second place to look. [S1], [S2], [S3], [S5], [S6] S1 calls the practice a general tradition, not a fixed rule. Before you rely on it, confirm that a copy series exists for that diocese and those years.\n- An online collection may contain only one of the two series. FamilySearch may have filmed the diocesan copy and skipped the parish books, or the reverse. [S3], [S5] For every holding, record whether it is the **parish original** or a **diocesan copy**, who made it, the years it covers, its locator, and whether you inspected an index, a catalogue entry or the image.\n- A copy and its original are not independent corroboration. If they differ, keep both readings ([evidence/proof judgment: compare the creation stages](evidence-proof-judgment.md)).\n- If a priest says the registers are missing or burned, record that as his statement. Then look for the diocesan copy before you write that the register is lost. [S3], [S7]","sources":["S1","S2","S3","S5","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb65834391b5","kind":"unclassified","anchor":"- **Closure period.** The Bishops' Conference of England and Wales applies a 110-year closure to sacramental registers. Findmypast's England Roman Catholic parish collection starts in 1657. A 2021 presentation gave its end year as 1907, but that figure follows from the 110-year rule at an earlier release date, and Findmypast's parish list now shows at least one parish running to 1916. Recalculate the closure for the current date and check the parish's own span on the parish list. Do not reuse a fixed end year. [S13]\n- **Retained registers.** Some parishes in the participating dioceses kept their sacramental registers and are not in the collection. The presenter adds that each diocese makes its own decisions about what it releases. [S13] The presentation named Birmingham, Liverpool, Middlesbrough, Southwark and Westminster. Findmypast's browse pages for the wider collection also name Leeds, Northampton, Nottingham and Plymouth, and some pages add Salford. Check the current diocese and parish lists before you treat a diocese as covered or absent.\n- **Collection scope and search method.** A browse-only archive is not keyword-searchable. The Philadelphia registers on the Catholic Heritage Archive can be browsed by parish but not keyword-searched. The archive representative described them as free. The CHRC also calls the platform free to use, but says elsewhere that viewing on Findmypast needs a subscription, and coverage dates differ between descriptions. Check access terms and years when you search. [S11], [S12] For staff searches, the CHRC's request page currently says records created 75 or more years ago can be obtained through the CHRC and newer records come from the parish. That is about 1951 in 2026, and the cutoff moves each year. An older interview gave a fixed 1941 limit, which is now out of date.\n- **Each holder's span, by record type.** An aggregator's end year is not the end of the register series. A diocesan archive's start year is not the start of the parish's records either. Hungarian-era Bačka parishes (Archdiocese of Kalocsa) are a worked example. Civil registration began in Hungary on 1 October 1895, so church-register films on FamilySearch often stop in 1895. One participant reported that Ancestry's Hungarian Catholic books also stop in 1895. Forum participants reported the following. The Kalocsa archive holds diocesan second copies, mostly from 1826, which they said was the year keeping them became compulsory. The archive also holds some earlier originals (Sombor from 1719) and later volumes into the 1920s–1940s, with access by paid subscription. FamilySearch has some military church books that the archive lacks. [S14], [S15] Read every row for the locality in the archive's downloadable locality list. Participants said it uses a type code (K baptisms, E marriages, M deaths) and usually one row per digitised book. A quoted row shows that a single row can cover several years (Zombor, K 1794–1802) and records whether the book is an original (eredeti) or a copy. The list is not sorted, so a single row such as \"E 1826\" is not the full range. [S14] If a parish is missing from the list, first check whether it belonged to another diocese at the event date before you call it undigitised (the thread's example is Bátaszék, probably under Pécs). [S14] Do not carry the 1826 or 1895 years over to another parish or diocese. Check each locality's rows, and confirm current access terms with the archive.\n- **Latgale (Vitebsk guberniya) parishes on Raduraksti.** Do not conclude that years are lost from a parish's own page on Raduraksti (the Latvian State Archives' register site). Also check:\n  - the separate deanery copy collection, *Romas katoļi → Dekanāti* (Roman Catholics → deaneries), which lists 10 deaneries. Spans differ by deanery: Lejasdaugavpils starts in 1835 and Augšdaugavpils in 1827. [S20]\n  - the copies sent to the Mogilev consistory. These were obtained from fond 1781 of the National Historical Archives of Belarus (NIAB) and placed under each parish. They cover parishes of Daugavpils, Ludza and Rēzekne uezds, 1677–1801 overall, with a different span for each parish. They are in Latin and Polish, and the archive's notice offers a spreadsheet listing them. [S19]\n  - the official inventories of NIAB fond 1781 published on niab.by, as a lead for copies after 1801. [S22]","sources":["S13","S11","S12","S14","S15","S20","S19","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7ce8b4b64735","kind":"unclassified","anchor":"Raduraksti describes its revision-list collection (*Dvēseļu revīzijas*) as covering Vidzeme and Kurzeme. A miss there for a Latgale person is a coverage gap, not a negative. [S21]","sources":["S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-af356a2e0930","kind":"custody","anchor":"For a Latgale household's 1782 or 1795 revision, search NIAB in Minsk. Encyclopedia entries place Dinaburg, Lyutsin and Rezhitsa uezds in the Polotsk viceroyalty, so named from 10 January 1778 until its merger into Belarusian guberniya on 12 December 1796 [S29 @2026-11-08], and then in Vitebsk guberniya, formed from Belarusian guberniya in 1802 [S30 @2026-11-08]. A 2017 congress paper on Latgale sources lists the 1795 revision in NIAB fond 2567 (Polotsk viceroyalty board) and the 1782 revision in fond 3223 (Polotsk Treasury Chamber) [S31 @2026-11-08], and the NashiPredki summary of fond 2567 shows one inventory, op. 1, for 1775–1798 [S32 @2026-11-08]. Take any file number from the NIAB inventory itself, not from a secondary list.","sources":["S29","S30","S31","S32"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1983eb1e96e2","kind":"custody","anchor":"- **Grodno-area Catholic parishes.** Before you call a year lost from the Belarusian holdings, add the Archdiocesan Archive in Białystok (Archiwum Archidiecezjalne w Białymstoku) to the register: its holdings page lists copies of Catholic acts of the Grodno deanery for 1865–1937 and of the Łunna deanery for 1922–1937 [S33 @2026-11-08]. The Białystok archdiocese grew out of the apostolic administration for the part of the Vilnius archdiocese that lay inside Poland after the Second World War [S35 @2026-11-08]. The archive opens for genealogy only books at least 100 years old and notes that many acts are in Russian [S34 @2026-11-08], so in 2026 the copies after 1926 stay closed, and the cutoff moves each year.","sources":["S33","S34","S35"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-39324d5f35ef","kind":"unclassified","anchor":"If any of these apply, record a **coverage gap** naming the parish, diocese and years, not a negative result. Send the request to the diocesan archive or the parish. At the start, offer to pay costs or make a donation. [S1], [S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-905a293cf52c","kind":"unclassified","anchor":"- If the spouses share a surname, are suspected cousins, or the marriage entry mentions a dispensation, search the diocesan matrimonial or dispensation records. The parish marriage entry is not the only record. Dispensations for related couples went through the diocese, so the files sit at diocesan level. [S1], [S2], [S7], [S8], [S10]\n- First read which impediment the dispensation names. Only a consanguinity dispensation means the couple were related, and a dispensation for another impediment, such as marriage to an unbaptized person, says nothing about kinship. For a consanguinity dispensation the couple had to show how they were related, so expect a declared pedigree or statement of the relationship. Files often also contain affidavits and witness testimony. They are free-form, vary in length and are less often digitized than parish registers. [S1], [S2], [S8] Record the file with its own locator, and mark it searched, not searched or not available.\n- **Turn the stated degree into a generation before you search.** Until 1983, canon law counted generations from one spouse to the common ancestor, not the two lines added together: siblings are 1st degree, first cousins 2nd, second cousins 3rd and third cousins 4th. Before the 1917 Code the impediment reached the 4th degree, so fourth cousins (5th degree) needed no dispensation. [S24], [S25] The 1917 Code cut it back to the 3rd degree. [S27] Since 1983, canon law adds both lines together (c. 108), and the impediment reaches the 4th degree, which means first cousins (c. 1091). [S26], [S27] Check which system applies at the marriage date before you read the number. \"Third degree\" under the old system means second cousins. It does not mean third cousins. When the two lines are unequal, the degree given is the longer line. [S24], [S25] Wording such as \"3rd and 4th degree\" or \"3rd mixed with 4th\" gives the length of each line, so look for the common ancestor at both generations.\n- **Count every shared couple.** Each common ancestral couple was a separate impediment, so a dispensation for \"double\" or \"multiple\" consanguinity records two or more shared couples. Search for every one. [S24], [S25]\n- For a foreign-born spouse marrying in Puerto Rico, add a separate enquiry about **probanzas de soltería**, proofs of single or widowed status described in the cited research account. They are a different target from consanguinity dispensations. The account reports possible origin statements, baptism extracts and evidence of a former spouse's death. [S16] Confirm the actual custodian, series, period and locator before requesting a file. In a retrieved file, keep each document's issuer, date and stated purpose separate. A status-proof file does not itself establish consanguinity.\n- A pedigree in the file is the relationship the parties declared, so treat it as a claim to check. A shared surname or a related witness stays a hypothesis. [S10] Applications for cousin marriages were very common, so this search is worth doing wherever the couple came from a small or close community. [S9] If no dispensation file is found, that does not prove the couple were unrelated.\n- **Test a suspected link with the degree.** List the marriages between the two families' descendants, and keep only those from places and years where the registers survive. The Port-Royal (Annapolis Royal) registers, for example, survive only from 1702, so earlier marriages there cannot be checked. [S28] For each marriage, open both spouses' ancestor charts at the generation the degree points to. Use birth years to rule each unidentified ancestor couple in or out. If no common ancestor appears at that level, record it as unresolved. One researcher suggests that a priest far from the couple's home parish, after a displacement such as the 1755 Acadian expulsion, may have granted the dispensation as a precaution because the family's memory was uncertain. Treat that as a hypothesis, not as proof of kinship. [S24]","sources":["S1","S2","S7","S8","S10","S24","S25","S27","S26","S16","S9","S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e2294103cf8d","kind":"unclassified","anchor":"If several baptisms are entered under one date, the priest may have gathered notes from his circuit and written them up together. Such entries can be less accurate than they look. [S1], [S2] Flag the run as possible batch recording, compare sequence and handwriting, and keep the date and church as written. Treat them as the date and place of entry rather than of the ceremony only when the entry itself or the register's demonstrated practice shows that.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-358e931998b0","kind":"unclassified","anchor":"Return one row per holding: parish (dedication + town + diocese) and the reason it was chosen, original or copy, years covered, locator, level inspected, and result. List coverage gaps separately: closure, retained registers, not filmed, outside a holder's span, or browse-only and not browsed. Add the successor custodian, separate dispensation and status-proof file rows, and any batch-recording flags. State negative results only for the holdings you actually inspected.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5328744c910e","kind":"custody","anchor":"- **Acadian registers outside Nova Scotia.** Do not assume the pre-1755 Acadian registers were all lost, or look for them only in Nova Scotia: the Nova Scotia Archives say the two Port-Royal (Annapolis Royal) volumes are the only associated materials to have survived and remained in the province [S28 @2026-11-12]. The Saint-Charles-des-Mines (Grand-Pré) registers survive for 1707–1748 in three volumes because parishioners took them into exile; they reached St. Gabriel in Louisiana [S36 @2026-11-12], [S37 @2026-11-12]. A survey of surviving pre-Deportation registers gives their custodian as the Diocese of Baton Rouge's Diocesan Archives, with microfilm at the Centre d'études acadiennes in Moncton and an 1895 transcription at Library and Archives Canada [S37 @2026-11-12]. Confirm the custodian with the diocese before you send a request.","sources":["S28","S36","S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-781a2af25e42","kind":"historical","anchor":"Read old German kinship words in their period sense. *Vetter* first meant the father's brother and later also the mother's brother [S38]. *Base* first meant the father's sister, then also the mother's sister and more distant female relatives, and narrowed to today's cousin only in the 18th century [S39]. *Muhme* meant the mother's sister and, from late Middle High German, also a female relative [S40]. Middle High German *Oheim* could mean the mother's brother, an uncle, a sister's son or a relative in general [S41]. Record the term as written and take the relationship from the other entries.","sources":["S38","S39","S40","S41"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-30c8e8e5f22c","kind":"historical","anchor":"When an entry says the priest supplied the ceremonies of baptism for a child already baptized privately, often at home by a layperson (French *ondoyé*), do not read it as a second baptism or take its date as the baptism date. A valid baptism was not repeated: after a private baptism in necessity, a priest supplied the other ceremonies later, in church, if the child survived [S44]. Record two events, the private baptism with its baptizer and any date given, and the supplied ceremonies on the entry date. In a 1742 Port-Royal entry the priest supplied the ceremonies on 24 June for a boy born on 17 June and baptized at home by a named layman [S45]. Keep the lay baptizer's name. Acadian relatives or witnesses baptized newborns while families waited for a missionary priest, who often entered that baptism later [S46], so the same layman baptizing a family's children in different years is a lead to where they lived, not proof of it [S47]. A lay baptism can also mean the child was in danger of death [S44].","sources":["S44","S45","S46","S47"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-81880343d39e","kind":"portal-availability","anchor":"For German, Latin and English terms, and for degrees under old and new canon law and civil law, use Heiko Hungerige's free brochure *Verwandtschaftsbezeichnungen und Verwandtschaftsgrade* (RzD-Forschungshilfen Heft 2) and the Roland zu Dortmund's info-graphics in the society's online document collection [S42 @2026-11-12], [S43 @2026-11-12].","sources":["S42","S43"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-71a40b17f448","kind":"portal-availability","anchor":"The same survey says images of the original registers are not online, and lists Canadiana (the transcription on LAC reel C-1869) and FamilySearch for online viewing [S37 @2026-11-12].","sources":["S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
