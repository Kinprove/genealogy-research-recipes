  - {"id":"S60","kind":"web-page","urls":["https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann998-1165_en.html"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Read 2026-11-19 for the fourth degree in the collateral line","entry_sha256":"9057c7fc8cc7861383061d7406b75b799667925b5fba690233d21d25f776c56e","claims":["C-905a293cf52c"],"review":"reviewed"}
claims:
  - {"id":"C-c80713899341","kind":"unclassified","anchor":"Use this recipe before you conclude that a Catholic baptism, marriage or burial does not exist or that a register was lost. Use it when one parish search or one online collection has failed, when a parish name matches several churches, when a parish has closed or merged, or when the spouses in a marriage may have been related. It builds a holdings register: the parish that kept the register, alternative parishes, the diocesan copy, the successor custodian and any dispensation file, each with the level actually inspected.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-68efc1ef653f","kind":"unclassified","anchor":"For Irish parishes and the National Library of Ireland (NLI) images, use [Irish Catholic parish image recovery](irish-catholic-parish-image-recovery.md). For FamilySearch Catalog and DGS steps, use [FamilySearch practical record workflows](familysearch-practical-record-workflows.md). For cemetery follow-up, use the [burial evidence packet](burial-evidence-packet.md). For identity and kinship rulings, and for comparing a register with its copy, use [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-565af07781cd","kind":"custody","anchor":"- Begin with the town or address and the event date. Do not begin with the dedication name. Patron names repeat, so a single country can have several parishes with the same name. Record every candidate as *dedication + town + diocese*. Never record it by dedication alone. [S4 @2026-11-19]\n- Search a Catholic directory for the town or address and confirm the parish against a map or catalogue for the event date [S2 @2026-11-19], [S3 @2026-11-19]. If an [AI documentary search](ai-for-documentary-records.md) suggests a parish, check the same town, dedication and diocese before using it to select a register.\n- If the event took place at a chapel, mission or subsidiary church served by a visiting priest, search the parish church's books first. Registers were kept at parish level. The priest brought his notes from secondary churches and pastoral centres back to the parish register. An entry may or may not name the other building. [S1 @2026-11-19], [S2 @2026-11-19], [S3 @2026-11-19]\n- Modern directories show today's parishes. Parishes split, merge and close, so check the candidate against historical boundaries or diocesan maps for the event date. Also note adjoining parishes that were created later or earlier. [S3 @2026-11-19], [S11 @2026-11-19], [S12 @2026-11-19]\n- **Switzerland: route by canton, confession and place of origin.** For a Swiss citizen, a civil-status event is registered where it happened and also at the place of origin (Heimatort, lieu d'origine), which can differ from the birthplace and the residence. Nationwide civil registration began in 1876; before that, the church registers are the record, and Reformed and Catholic parishes kept separate ones. [S17 @2026-11-19] Check the canton's holdings first, because some cantons kept civil registers earlier: Geneva's civil registers start in 1798, for the city and for the rural and suburban communes. [S23 @2026-11-19] Look for those registers in the parish or communal archives, and ask the cantonal state archive, which keeps directories of them. [S17 @2026-11-19] Access to recent family registers needs permission from the competent supervisory authority. [S17 @2026-11-19] Do not send the request to the Swiss Federal Archives. Civil status is a communal and cantonal matter, and the Federal Archives mainly hold files on people who dealt with federal authorities, such as refugees and emigrants. [S18 @2026-11-19]","sources":["S4","S2","S3","S1","S11","S12","S17","S23","S18"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c1859cf9e56b","kind":"unclassified","anchor":"1. **Other parishes in the same town.** A family could use a neighbouring parish, for example because they disliked the priest. [S4]\n2. **For a marriage, the bride's parish first, then the groom's.** Marriage in the bride's parish was the usual practice, so search it first. There are exceptions, so a miss there sends you to the groom's parish. [S4], [S10]\n3. **The diocesan copy series** (step 3).\n4. **The successor parish.** In Philadelphia, the records of a closed or consolidated parish went to one designated holding parish. The archdiocesan archive (now the Catholic Historical Research Center, CHRC) sends requesters to that parish and uses parish boundary maps (for 1891, 1921 and 1971) to place an address in its former parish. Elsewhere, ask the diocese which parish received the registers. Do not assume the nearest surviving church holds them. [S11], [S12]","sources":["S4","S10","S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1f4a586740d2","kind":"unclassified","anchor":"Treat burial separately. In the Archdiocese of Philadelphia, the archdiocesan cemeteries (for example Old Cathedral, New Cathedral and Holy Sepulchre) were leased in 2013 to StoneMor, which holds their records, and the archive holds no burial records. Parish cemeteries keep their own records. Check who currently operates the cemetery, and do not assume this split applies in other dioceses. [S11], [S12]","sources":["S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fc3bcb8cbeaa","kind":"unclassified","anchor":"- Dioceses customarily made a periodic copy of parish registers, usually yearly, sometimes called bishop's transcripts in English (other countries use other names). This copy can survive when the parish book is lost, so it is a second place to look. [S1], [S2], [S3], [S5], [S6] S1 calls the practice a general tradition, not a fixed rule. Before you rely on it, confirm that a copy series exists for that diocese and those years.\n- An online collection may contain only one of the two series. FamilySearch may have filmed the diocesan copy and skipped the parish books, or the reverse. [S3], [S5] For every holding, record whether it is the **parish original** or a **diocesan copy**, who made it, the years it covers, its locator, and whether you inspected an index, a catalogue entry or the image.\n- A copy and its original are not independent corroboration. If they differ, keep both readings ([evidence/proof judgment: compare the creation stages](evidence-proof-judgment.md)).\n- If a priest says the registers are missing or burned, record that as his statement. Then look for the diocesan copy before you write that the register is lost. [S3], [S7]","sources":["S1","S2","S3","S5","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb65834391b5","kind":"custody","anchor":"- **Closure period.** The Southwark diocesan guidance sets a 110-year restriction on information from parish registers and lists exceptions [S53 @2026-11-19]. A 2021 presentation gave 1907 as a collection endpoint [S13 @2026-11-19]. Findmypast's baptism list gives a later end for individual parishes, including 1916 for Holbeck, St Francis [S54 @2026-11-19]. Check the parish and record type before interpreting a missing year.\n- **Retained registers.** A diocese can appear in a collection while a particular parish is absent. Birmingham's archive warns that some parishes retained their sacramental registers and will be missing in its search results [S55 @2026-11-19]. Check the archive's holdings and the published parish list separately [S13 @2026-11-19], [S54 @2026-11-19].\n- **Philadelphia.** If a name search fails, browse the parish images for the sacrament and year. Archive representatives described browsing the Catholic Heritage Archive and gave 1941 as the cutoff then used for staff searches [S11 @2026-11-19], [S12 @2026-11-19]. For a staff search, the Catholic Historical Research Center now directs records at least 75 years old to the center and more recent records to the parish. A certified copy must come from the parish that performed the sacrament or holds the closed parish's registers [S56 @2026-11-19]. Verify online access and coverage separately for the collection you plan to view.\n- **Each holder's span, by record type.** For a Hungarian-era Bačka parish, check church films on either side of the 1895 start of civil registration and look for diocesan duplicates even if the film ends. Kalocsa researchers reported second copies mostly from 1826, some earlier originals (Sombor from 1719), later volumes into the 1920s–1940s and military books represented in a different collection [S14 @2026-11-19], [S15 @2026-11-19]. In the archive's locality list, compare every row under the place. K denotes baptisms, E marriages and M deaths. The quoted Zombor K 1794–1802 row describes an original (*eredeti*). A lone E 1826 row cannot establish the parish's full marriage coverage [S14 @2026-11-19]. If the town is absent, check its diocese for the event date. A Kalocsa searcher suggested Pécs for Bátaszék [S14 @2026-11-19]. The Hungarian National Archives actually catalogues a Bátaszék mixed Roman Catholic register for 1757–1770 under Pécs [S57 @2026-11-19].\n- **Latgale (Vitebsk guberniya) parishes on Raduraksti.** Do not conclude that years are lost from a parish's own page on Raduraksti (the Latvian State Archives' register site). Also check:\n  - the separate deanery copy collection, *Romas katoļi → Dekanāti* (Roman Catholics → deaneries), which lists ten deaneries [S20 @2026-11-19]. Lejasdaugavpils includes entries from 1835 [S58 @2026-11-19], while Augšdaugavpils includes entries from 1827 [S59 @2026-11-19]. Check each parish's own span.\n  - the copies sent to the Mogilev consistory. These were obtained from fond 1781 of the National Historical Archives of Belarus (NIAB) and placed under each parish. They cover parishes of Daugavpils, Ludza and Rēzekne uezds, 1677–1801 overall, with a different span for each parish. They are in Latin and Polish, and the archive's notice offers a spreadsheet listing them. [S19 @2026-11-19]\n  - the official inventories of NIAB fond 1781 published on niab.by, as a lead for copies after 1801. [S22 @2026-11-19]","sources":["S53","S13","S54","S55","S11","S12","S56","S14","S15","S57","S20","S58","S59","S19","S22"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7ce8b4b64735","kind":"unclassified","anchor":"Raduraksti describes its revision-list collection (*Dvēseļu revīzijas*) as covering Vidzeme and Kurzeme. A miss there for a Latgale person is a coverage gap, not a negative. [S21]","sources":["S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-af356a2e0930","kind":"custody","anchor":"For a Latgale household's 1782 or 1795 revision, search NIAB in Minsk. Encyclopedia entries place Dinaburg, Lyutsin and Rezhitsa uezds in the Polotsk viceroyalty, so named from 10 January 1778 until its merger into Belarusian guberniya on 12 December 1796 [S29 @2026-11-08], and then in Vitebsk guberniya, formed from Belarusian guberniya in 1802 [S30 @2026-11-08]. A 2017 congress paper on Latgale sources lists the 1795 revision in NIAB fond 2567 (Polotsk viceroyalty board) and the 1782 revision in fond 3223 (Polotsk Treasury Chamber) [S31 @2026-11-08], and the NashiPredki summary of fond 2567 shows one inventory, op. 1, for 1775–1798 [S32 @2026-11-08]. Take any file number from the NIAB inventory itself, not from a secondary list.","sources":["S29","S30","S31","S32"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1983eb1e96e2","kind":"custody","anchor":"- **Grodno-area Catholic parishes.** Before you call a year lost from the Belarusian holdings, add the Archdiocesan Archive in Białystok (Archiwum Archidiecezjalne w Białymstoku) to the register: its holdings page lists copies of Catholic acts of the Grodno deanery for 1865–1937 and of the Łunna deanery for 1922–1937 [S33 @2026-11-08]. The Białystok archdiocese grew out of the apostolic administration for the part of the Vilnius archdiocese that lay inside Poland after the Second World War [S35 @2026-11-08]. The archive opens for genealogy only books at least 100 years old and notes that many acts are in Russian [S34 @2026-11-08], so in 2026 the copies after 1926 stay closed, and the cutoff moves each year.","sources":["S33","S34","S35"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-39324d5f35ef","kind":"unclassified","anchor":"If any of these apply, record a **coverage gap** naming the parish, diocese and years, not a negative result. Send the request to the diocesan archive or the parish. At the start, offer to pay costs or make a donation. [S1], [S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-905a293cf52c","kind":"historical","anchor":"- If the spouses share a surname, are suspected cousins, or the marriage entry mentions a dispensation, search the diocesan matrimonial or dispensation records. The parish marriage entry is not the only record. Dispensations for related couples went through the diocese, so the files sit at diocesan level. [S1], [S2], [S7], [S8], [S10]\n- First read which impediment the dispensation names. Only a consanguinity dispensation means the couple were related, and a dispensation for another impediment, such as marriage to an unbaptized person, says nothing about kinship. For a consanguinity dispensation the couple had to show how they were related, so expect a declared pedigree or statement of the relationship. Files often also contain affidavits and witness testimony. They are free-form, vary in length and are less often digitized than parish registers. [S1], [S2], [S8] Record the file with its own locator, and mark it searched, not searched or not available.\n- **Turn the stated degree into a generation before you search.** Until 1983, canon law counted generations from one spouse to the common ancestor, not the two lines added together: siblings are 1st degree, first cousins 2nd, second cousins 3rd and third cousins 4th. Before the 1917 Code the impediment reached the 4th degree, so fourth cousins (5th degree) needed no dispensation. [S24], [S25] The 1917 Code cut it back to the 3rd degree. [S27] Since 1983, canon law adds both lines together (c. 108), and the impediment reaches the 4th degree, which means first cousins (c. 1091). [S26], [S60] Check which system applies at the marriage date before you read the number. \"Third degree\" under the old system means second cousins. It does not mean third cousins. When the two lines are unequal, the degree given is the longer line. [S24], [S25] Wording such as \"3rd and 4th degree\" or \"3rd mixed with 4th\" gives the length of each line, so look for the common ancestor at both generations.\n- **Count every shared couple.** Each common ancestral couple was a separate impediment, so a dispensation for \"double\" or \"multiple\" consanguinity records two or more shared couples. Search for every one. [S24], [S25]\n- For a foreign-born spouse marrying in Puerto Rico, add a separate enquiry about **probanzas de soltería**, proofs of single or widowed status described in the cited research account. They are a different target from consanguinity dispensations. The account reports possible origin statements, baptism extracts and evidence of a former spouse's death. [S16] Confirm the actual custodian, series, period and locator before requesting a file. In a retrieved file, keep each document's issuer, date and stated purpose separate. A status-proof file does not itself establish consanguinity.\n- A pedigree in the file is the relationship the parties declared, so treat it as a claim to check. A shared surname or a related witness stays a hypothesis. [S10] Applications for cousin marriages were very common, so this search is worth doing wherever the couple came from a small or close community. [S9] If no dispensation file is found, that does not prove the couple were unrelated.\n- **Test the declared degree.** List descendant marriages within surviving register coverage. The surviving pre-deportation Port-Royal registers start in 1702 [S28]. Build both spouses' lines to the generation indicated and test candidate ancestors against their birth years. In a 1762 Quebec marriage, Estes found a third-degree dispensation but could not identify a common ancestor at that degree for Madeleine Bourg and Jean-Baptiste LePrince. The possible Gaudet and Hébert connections were a generation out. She suggested the priest acted cautiously after the Acadian displacement [S24]. Keep that explanation as her hypothesis and the shared ancestor unresolved.","sources":["S1","S2","S7","S8","S10","S24","S25","S27","S26","S60","S16","S9","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e2294103cf8d","kind":"unclassified","anchor":"If several baptisms are entered under one date, the priest may have gathered notes from his circuit and written them up together. Such entries can be less accurate than they look. [S1], [S2] Flag the run as possible batch recording, compare sequence and handwriting, and keep the date and church as written. Treat them as the date and place of entry rather than of the ceremony only when the entry itself or the register's demonstrated practice shows that.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-358e931998b0","kind":"unclassified","anchor":"Return one row per holding: parish (dedication + town + diocese) and the reason it was chosen, original or copy, years covered, locator, level inspected, and result. List coverage gaps separately: closure, retained registers, not filmed, outside a holder's span, or browse-only and not browsed. Add the successor custodian, separate dispensation and status-proof file rows, and any batch-recording flags. State negative results only for the holdings you actually inspected.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5328744c910e","kind":"custody","anchor":"- **Acadian registers outside Nova Scotia.** Do not assume the pre-1755 Acadian registers were all lost, or look for them only in Nova Scotia: the Nova Scotia Archives say the two Port-Royal (Annapolis Royal) volumes are the only associated materials to have survived and remained in the province [S28 @2026-11-12]. The Saint-Charles-des-Mines (Grand-Pré) registers survive for 1707–1748 in three volumes because parishioners took them into exile; they reached St. Gabriel in Louisiana [S36 @2026-11-12], [S37 @2026-11-12]. A survey of surviving pre-Deportation registers gives their custodian as the Diocese of Baton Rouge's Diocesan Archives, with microfilm at the Centre d'études acadiennes in Moncton and an 1895 transcription at Library and Archives Canada [S37 @2026-11-12]. Confirm the custodian with the diocese before you send a request.","sources":["S28","S36","S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-781a2af25e42","kind":"historical","anchor":"Read old German kinship words in their period sense. *Vetter* first meant the father's brother and later also the mother's brother [S38]. *Base* first meant the father's sister, then also the mother's sister and more distant female relatives, and narrowed to today's cousin only in the 18th century [S39]. *Muhme* meant the mother's sister and, from late Middle High German, also a female relative [S40]. Middle High German *Oheim* could mean the mother's brother, an uncle, a sister's son or a relative in general [S41]. Record the term as written and take the relationship from the other entries.","sources":["S38","S39","S40","S41"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-30c8e8e5f22c","kind":"historical","anchor":"When a priest supplied the ceremonies for a child already baptized privately (*ondoyé*), record the private baptism and the later church ceremonies separately. A valid baptism could be given in danger of death, with the other ceremonies supplied later [S44]. At Port-Royal in 1742, Honoré was born on 17 June. The entry says Abraham Bourg baptized him at his father's house and that the priest supplied the ceremonies on 24 June. It does not give a separate date for the baptism at home [S45]. Copy the lay baptizer's name and the place as written. Acadian families could wait for a missionary to record a baptism [S46]. Bourg also appears as lay baptizer for children in 1709 and 1719 [S47]. Use that recurrence to search for neighbours or relatives, and verify the family's residence in a dated record.","sources":["S44","S45","S46","S47"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-81880343d39e","kind":"portal-availability","anchor":"For German, Latin and English terms, and for degrees under old and new canon law and civil law, use Heiko Hungerige's free brochure *Verwandtschaftsbezeichnungen und Verwandtschaftsgrade* (RzD-Forschungshilfen Heft 2) and the Roland zu Dortmund's info-graphics in the society's online document collection [S42 @2026-11-12], [S43 @2026-11-12].","sources":["S42","S43"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-71a40b17f448","kind":"portal-availability","anchor":"The same survey says images of the original registers are not online, and lists Canadiana (the transcription on LAC reel C-1869) and FamilySearch for online viewing [S37 @2026-11-12].","sources":["S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-046a0c9ac2ed","kind":"historical","anchor":"**Additional saints' names.** Check whether a local baptismal custom accounts for an added saint's name [S48]. In late-15th-century Florentine baptisms, *Romolo* or *Romola* added after the other given names can reflect devotion to a local saint [S49]. Keep the names in the recorded order. Do not use a shared *Romolo* or *Romola* by itself as evidence of kinship.","sources":["S48","S49"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-12bbc02bb16a","kind":"method","anchor":"**Mother's maiden name.** Check her children's baptisms and her own marriage entry first [S50], [S51]. The baptism may give her maiden name alongside the father's name, and the marriage may give it as the bride's surname [S51]. Check confirmation for her surname when the register records parents. A confirmation list can give a recipient and sponsor without naming either parent [S52]. Keep the maiden name unresolved if the entry gives only a married surname or leaves the surname blank.","sources":["S50","S51","S52"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
