  - {"id":"S2","kind":"help-page","urls":["https://www.nyc.gov/site/records/about/frequently-asked-questions-old.page"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Read the parallel marriage-series explanation for document roles, separate filing and the overlap years.","entry_sha256":"1ddfc0c7c279407e7a66d9aead1720aad8f75295661da43591b5eac1e3a11c03","claims":["C-02","C-03"],"review":"reviewed"}
  - {"id":"S3","kind":"video","urls":["https://www.youtube.com/watch?v=yFTJ_vF6x3E"],"published":"2024-01-14","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the advice to take the New York City marriage certificate lead to the City Clerk license for birthplace details.","entry_sha256":"f69714be10e1798f7ceb4564ad4c30adf213e242ade61918335935e21b643abe","claims":["C-01"],"review":"reviewed"}
  - {"id":"S4","kind":"video","urls":["https://www.youtube.com/watch?v=CBka-0ZyR4I"],"published":"2022-03-18","retrieved":"2026-11-21","access":"unknown","rights":null,"basis":"Attempted to open the video on 2026-11-21 but the fetch was throttled. The supplied transcript excerpt advises starting on the city's site and following its Historical Vital Records link to the name search.","entry_sha256":"888f4c06698db3c6a44bab71092c7f5a19e3e207779ee6533737efa562f4ba06","claims":["C-06"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://www.nyc.gov/site/records/historical-records/genealogy.page"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Confirmed the department's Genealogy page links to Historical Vital Records of NYC for digitized birth, marriage and death records. The linked search form returned HTTP 403 in this review.","entry_sha256":"260e96fdbeb0d3a20d2fd2f8cb837917ff034f1c6a84b9cee4cbdea7e8bab1d9","claims":["C-06"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://www.newyorkfamilyhistory.org/blog/new-york-city-public-digitized-vital-records-now-online-free"],"published":"2022-03-16","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the New York Genealogical and Biographical Society's walkthrough of the city portal for name and number searches, outside indexes and the separate marriage license index.","entry_sha256":"a7dbef854fea286a5a976fab44133aced1acc7b7f5f4f9a828f0629c50335c55","claims":["C-06"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://www.archives.nyc/blog/2021/5/20/how-to-research-the-vital-records-collection"],"published":"2021-05-21","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the Municipal Archives' explanation of borough, filing year and certificate number as locators and its distinction between the Health Department certificate index and City Clerk license index.","entry_sha256":"99c31cb814f883776f047443a2ebc6251b225c2dc320be5cc2415793eccf4efe","claims":["C-06"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/wrapping-up-2024-myheritage-year-in-review/"],"published":"2025-01-01","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the historical records section for the names and advertised spans of the three NYC collections and its description of the accompanying scans.","entry_sha256":"5adac2afc270cad7983d9d846ba3dc3332f2d2fa8ad41e18bc4a00cc485c2b3f","claims":["C-07"],"review":"reviewed"}
  - {"id":"S9","kind":"help-page","urls":["https://education.myheritage.com/article/new-york-city-vital-records-an-essential-resource-for-researching-american-heritage/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the collection links, titles, scanned-record examples and marriage-series breakdown. The linked marriage and death collection pages did not render in this review.","entry_sha256":"8e7b07a8f6ef0e03498608e773bb42b1e715a564c16d4b796a86678a24e4890e","claims":["C-07"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the podcast adviser, seek the City Clerk license as well as the New York City marriage certificate when searching for the spouses’ and parents’ birthplaces. [S3†]","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"Search both filing series separately for a New York City marriage dated 1908–1937. The Health Department registered the officiant’s certificate and the City Clerk kept a separate license series. Look up each result under its own index and keep its own number. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"In the Clerk’s packet, record the couple as the suppliers of the affidavit, the Clerk as the issuer of the license and the officiant as the reporter on the completed certificate. Use the officiant’s certificate for the ceremony and check the application and license pages for occupations, residences and parental birthplaces. Copy each detail from the page that gives it. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Read each parent’s birthplace field on the image. Preserve the smallest place actually written, even if only one parent’s entry names a county or another subdivision. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Copy the form’s wording and both counts for children the mother has had and children living. Use the two figures to plan sibling searches and check whether the form or the individual return counts the new child before interpreting the difference. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"Open **Historical Vital Records of NYC** from the [DORIS Genealogy page](https://www.nyc.gov/site/records/historical-records/genealogy.page). [S5 @2026-11-21] If you lack a certificate number, try the portal’s name search for the image, according to the video presenter’s advice. [S4† @2026-11-21], [S6 @2026-11-21] If the name search misses, look up the number in an outside index and search the city portal by record type, number, borough and filing year. For a City Clerk marriage license, start with the separate license index and use its license number. [S6 @2026-11-21], [S7 @2026-11-21]","sources":["S4","S5","S6","S7"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-07","kind":"portal-availability","anchor":"If the city search stalls, use the collection links in the [MyHeritage guide](https://education.myheritage.com/article/new-york-city-vital-records-an-essential-resource-for-researching-american-heritage/) to search Births (1866–1909), Marriages (1866–1949) or Deaths (1866–1948) and open the associated image if available. [S8 @2026-11-21], [S9 @2026-11-21] For a 1908–1937 marriage, use Marriages to look for the Health Department certificate and seek the City Clerk license in its own series. [S9 @2026-11-21]","sources":["S8","S9"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
