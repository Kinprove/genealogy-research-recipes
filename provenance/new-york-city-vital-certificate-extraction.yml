claims:
  - {"id":"C-01","kind":"method","anchor":"According to the podcast adviser, seek the City Clerk license as well as the New York City marriage certificate when searching for the spouses’ and parents’ birthplaces. [S3†]","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"Search both filing series separately for a New York City marriage dated 1908–1937. The Health Department registered the officiant’s certificate and the City Clerk kept a separate license series. Look up each result under its own index and keep its own number. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"In the Clerk’s packet, record the couple as the suppliers of the affidavit, the Clerk as the issuer of the license and the officiant as the reporter on the completed certificate. Use the officiant’s certificate for the ceremony and check the application and license pages for occupations, residences and parental birthplaces. Copy each detail from the page that gives it. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Read each parent’s birthplace field on the image. Preserve the smallest place actually written, even if only one parent’s entry names a county or another subdivision. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Copy the form’s wording and both counts for children the mother has had and children living. Use the two figures to plan sibling searches and check whether the form or the individual return counts the new child before interpreting the difference. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"Open **Historical Vital Records of NYC** from the [DORIS Genealogy page](https://www.nyc.gov/site/records/historical-records/genealogy.page). [S5 @2026-11-21] If you lack a certificate number, try the portal’s name search for the image, according to the video presenter’s advice. [S4† @2026-11-21], [S6 @2026-11-21] If the name search misses, look up the number in an outside index and search the city portal by record type, number, borough and filing year. For a City Clerk marriage license, start with the separate license index and use its license number. [S6 @2026-11-21], [S7 @2026-11-21]","sources":["S4","S5","S6","S7"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-07","kind":"portal-availability","anchor":"If the city search stalls, use the collection links in the [MyHeritage guide](https://education.myheritage.com/article/new-york-city-vital-records-an-essential-resource-for-researching-american-heritage/) to search Births (1866–1909), Marriages (1866–1949) or Deaths (1866–1948) and open the associated image if available. [S8 @2026-11-21], [S9 @2026-11-21] For a 1908–1937 marriage, use Marriages to look for the Health Department certificate and seek the City Clerk license in its own series. [S9 @2026-11-21]","sources":["S8","S9"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"portal-availability","anchor":"According to the 2023 interview, the city portal offers free scans of original birth, marriage and death records. [S10† @2026-11-22], [S11 @2026-11-22] If an image is missing, check the portal’s [Digital Vital Records coverage charts](https://a860-historicalvitalrecords.nyc.gov/digital-vital-records) for the record type, borough and filing year. [S6 @2026-11-22] Treat the missing image as inconclusive even within the project’s stated dates, since the Municipal Archives holds records that have yet to be digitized. [S12 @2026-11-22]","sources":["S10","S11","S6","S12"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"Search MyHeritage’s separate [New York City Marriages, 1829-1938](https://www.myheritage.com/research/collection-21028/new-york-city-marriages-1829-1938) index for a marriage before 1866 or when the image collection yields no match. Search for either spouse and add the other spouse’s name if known. Compare any listed birth dates, parents’ names, and marriage date and place, then use the hit as a lead to the original filing. [S13 @2026-11-22], [S14 @2026-11-22]","sources":["S13","S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"portal-availability","anchor":"If a name search misses a City Clerk license for 1908–1937, follow the file links on Reclaim The Records’ release pages, according to the approach described by the interview guests. [S15† @2026-11-23] Open the [1908–1929 release](https://www.reclaimtherecords.org/records-request/1/) or the [1930–1995 release](https://www.reclaimtherecords.org/records-request/2/) and follow its Internet Archive link to the scanned license index. [S16 @2026-11-23], [S17 @2026-11-23], [S18 @2026-11-23] Choose the scan by borough and filing year. Browse the surname pages in the viewer or download the item’s PDF for local browsing if offered. Record the borough, filing year and license number as the locator for the packet. [S19 @2026-11-23] NYCMarriageIndex.com’s own name search and raw data downloads start in 1950. [S20 @2026-11-23]","sources":["S15","S16","S17","S18","S19","S20"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
