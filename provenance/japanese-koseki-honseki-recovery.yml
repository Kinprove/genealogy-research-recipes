claims:
  - {"id":"C-76f8e6a2adf5","kind":"unclassified","anchor":"- **Searching on a romanized name.** One spoken reading can be written with many kanji combinations, so a romanized name does not identify the person. The request needs the exact registered Japanese spelling, kanji or kana as recorded ([Kagoshima City naming FAQ](https://www.city.kagoshima.lg.jp/faq-kurashi/shimin/q113.html)). Never construct that spelling from a romanized reading. The presenter had heard that some offices may accept a romanized name, but do not plan around that. [S1], [S2]\n- **Sending the request to the region the family \"came from\".** The register is held by the municipal office for the registered domicile ([Kagoshima City FAQ](https://www.city.kagoshima.lg.jp/faq-kurashi/shimin/q97.html)). Japan has 1,718 municipalities ([MIC](https://www.soumu.go.jp/kouiki/kouiki.html)) plus Tokyo's 23 special wards. The presenter rounds this to roughly 2,000 offices. In his example, a family believed to come from western Japan had a honseki near Tokyo, and the western office his friend planned to visit would have reported no record. [S1], [S2] Since 1 March 2024, wide-area issuance lets an eligible requester who comes in person get the register at any office (see step 4), except some registers that have not been computerized. Those, and proxy requests, still go to the honseki office.\n- **Reading the honseki as a residence.** In older registers the domicile is a lead to where the family lived, not established residence. In modern registers the honseki can be any existing lot address in Japan and need not match where the family lived ([Metropolis](https://metropolisjapan.com/japans-honseki-system/)). The presenter's examples are a baseball stadium and a place where someone married or proposed. [S1]\n- **Treating a \"no record\" reply as proof that no register existed.** The reply may come from the wrong office or a merged municipality. The register may also have been discarded or destroyed (see step 5). [S1]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00bfecd79b65","kind":"unclassified","anchor":"Start with the emigrant ship's passenger list. For Japanese emigrants to Brazil, the presenter uses the passenger database of the Japanese immigration museum in São Paulo. He demonstrates searching it by ship, prefecture of origin, period, given name or surname. In his demonstration a romanized search returned the name in kanji, along with the ship, departure and arrival dates, and the family members who travelled together. Keep that family group as context for identification. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-07aca216ac1f","kind":"unclassified","anchor":"A prefecture alone is not enough. You need the complete address, including the house or lot number. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-57205649526f","kind":"unclassified","anchor":"- Prewar emigrant passport-issuance records are held at the Diplomatic Archives of the Ministry of Foreign Affairs in Tokyo ([NDL research guide](https://ndlsearch.ndl.go.jp/rnavi/business/travel_records)). The presenter describes entries that give the passport number, the name in kanji, the place of origin and address, age and birth date. Not all of them are digitized. For undigitized volumes you have to read entry by entry around the departure date. [S2]\n- The National Diet Library (NDL) holds almost none of the passport-issuance records. What it does hold is the emigration-company lists 『伯剌西爾行移民名簿』 (1908–1963), and only part of that set is digitized ([NDL research guide](https://ndlsearch.ndl.go.jp/rnavi/business/travel_records)). In his demonstration, the presenter searched the NDL digital collection for the kanji name and narrowed the results to the Brazil emigrant lists. He got one entry with a passport number, prefecture, issue date, occupation and birth date. [S2] Cite such an entry as an emigrant list, not as the passport-issuance register. If it lacks the full address, go to the Diplomatic Archives records.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-333a15cee777","kind":"unclassified","anchor":"Treat the recovered domicile as a set of historical place names: prefecture, county and village. Trace the village through its municipal mergers to the present municipality. The presenter uses the county and village articles on Wikipedia, with machine translation if needed. His example goes from a Wakayama Prefecture county and village to its successor town. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fed98f83a3ef","kind":"unclassified","anchor":"- Under Family Register Act Art. 10, a register can be requested by the persons recorded in it, their spouses, and their direct ascendants and descendants ([Art. 10 text](https://ja.wikibooks.org/wiki/%E6%88%B8%E7%B1%8D%E6%B3%95%E7%AC%AC10%E6%9D%A1)). A spouse has no entitlement, simply as a spouse, to the partner's ancestors' registers. The descendant has to request those. Art. 10-2 separately allows third parties who have a legitimate purpose, such as exercising rights or inheritance. [S1]\n- Requests go up the direct line: yourself, then parents, grandparents and further back. Collateral relatives' registers (aunts, uncles, nieces, nephews, cousins) are not available as of right. [S1]\n- A proxy can request on the descendant's behalf with a letter of authorization (委任状) signed by the requester. The proxy presents the request form, the 委任状 and the proxy's own ID ([Edogawa City FAQ](https://www.city.edogawa.tokyo.jp/e031/qa/kurashi/todokede/kosekishomei08.html)). The presenter asks his clients for a notarized power of attorney. That is his own practice, not a general legal requirement. [S1]\n- Prove direct descent with ID plus birth and death certificates and immigration records that link you to the ancestor. If you hold your own koseki, ID plus that koseki is enough to start, because it names your parents. [S1], [S2]\n- Direct-line eligibility also applies to **foreign-national descendants**. If Japanese registers do not establish the chain, assemble the civil certificates linking every generation to the ancestor, with Japanese translations of the foreign-language documents. Gobo City's overseas-request instructions explicitly require descent certificates and Japanese translations for foreign descendants; confirm the required chain, ID and translation details with the honseki municipality. Foreign nationality does not by itself remove eligibility, and it does not make an incomplete descent chain sufficient. [S16], [S17]\n- **Privacy gate:** <!-- privacy-gate: request --> Each koseki or closed-register request sends ID and descent proof and returns registers that may name the requester, parents and other living relatives, so answer the privacy gate in `SKILL.md` before each request.\n- Each koseki is organized by family unit and names the parents. Request one generation at a time until no earlier register survives. Genealogy requests of this kind are common, and they can take weeks ([Fukuoka City](https://www.city.fukuoka.lg.jp/shimin/kusei/life/koseki_kouikikoufu.html)). [S2]\n- **Wide-area issuance (広域交付).** Since 1 March 2024, an eligible requester can get koseki and closed-register (除籍) certificates at any municipal office in Japan. Some koseki and closed registers that have not been computerized are excluded, so request those from the honseki municipality. The requester must appear in person, requests by post or by a proxy are not allowed, and it covers only the requester, the spouse and direct-line relatives ([MOJ](https://www.moj.go.jp/MINJI/minji04_00082.html)). Fukuoka City's list of certificates under this route also includes pre-revision registers (改製原戸籍) ([Fukuoka City](https://www.city.fukuoka.lg.jp/shimin/kusei/life/koseki_kouikikoufu.html)). Most overseas descendants cannot appear in person, so for them this route does not help.\n  - This route supplies **full-register certificates** (謄本／全部事項証明), not individual extracts (抄本／個人事項証明), partial certificates or the address-history attachment (戸籍の附票). Request those excluded products from the honseki municipality. [S18]\n  - If the descent chain depends on foreign civil documents rather than linked Japanese registers, confirm with the office whether it can process the proposed request under wide-area issuance. Do not assume ordinary direct-descendant eligibility guarantees that particular issuance route.","sources":["S1","S2","S16","S17","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e37954266ba0","kind":"unclassified","anchor":"The earliest ordinarily issuable register **format** is the Meiji 19 (1886) format, if it survives. The Meiji 5 (1872) registers, also called 壬申戸籍 (Jinshin koseki), are not an earlier request route: a Ministry of Justice directive of 29 March 1968 required the retained material to be sealed against inspection, and certificates cannot be issued from it. A person born before 1886 can still appear in a later register; the format date is not a birth-year cutoff. [S19]","sources":["S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2806815ae22b","kind":"unclassified","anchor":"The retention period for closed registers was extended from 80 to 150 years by an ordinance amendment that took effect on 1 June 2010 ([commentary](https://www.mc-law.jp/kigyohomu/17566)). Registers whose former 80-year retention period had expired before that date may already have been lawfully discarded; the extension did not restore them. Disasters and wars destroyed others. [S1], [S12] If a register cannot be found, record it as missing with the cause unconfirmed. Record discard or destruction only when the office's reply or other specific evidence says so. A missing register does not show that the family was never registered there. The presenter advises requesting soon. [S1]","sources":["S1","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c6e728a97d42","kind":"unclassified","anchor":"- **Old land ledgers (旧土地台帳, Legal Affairs Bureau).** The presenter says these list the assets for an address and the people tied to it, along with land size and tax in old units. He describes the people as household heads. Treat them as owners (所有者), because that is what the ledger records. He also says ledger copies are free and that anyone may request them, with no descent requirement. Confirm ledger access and cost with the bureau that covers the area; some municipalities hold copies under different rules. Keep the historical lot address separate from a modern honseki, and check their relationship before linking them. [S1]\n- **Map certificates are a separate product.** The indexed [MOJ fee table](https://www.moj.go.jp/MINJI/TESURYO/index.html) calls this 地図等情報: from 1 April 2025, 500 yen by written application, 470 yen online with postal delivery and 440 yen online with counter collection. Only indexed text was checked; direct retrieval returned HTTP 403, so the full table was not read [S13]. These are map-information certificate fees, not a charge for the old land ledger. Confirm the applicable map, parcel unit and current fee with the bureau.\n- **Family temple (bodaiji) and its death register (kakochō).** In the Edo period everyone had to be affiliated with a Buddhist temple (the terauke system), which was tied to the ban on Christianity ([Kotobank](https://kotobank.jp/word/%E6%AA%80%E5%AE%B6%E5%88%B6%E5%BA%A6-1363649)). Use the oldest honseki to identify the family's affiliated temple, then ask about its death register and graves. The presenter warns that entries may give only a Buddhist posthumous name that differs from the koseki name. Temples may also refuse to show records to people who have no existing connection. [S1]\n- **Local history journals.** Look in local libraries and history museums. Many are not digitized, so contact them directly. [S1]","sources":["S1","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f7ec37d8a41d","kind":"unclassified","anchor":"If a step was not completed, name it as a gap. Do not fill it with a guessed office or address. This recipe does not cover postal request forms or fee payment from abroad, so confirm those with the target office.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
