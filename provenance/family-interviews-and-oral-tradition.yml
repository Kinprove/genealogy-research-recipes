claims:
  - {"id":"C-cad4ed79c2e2","kind":"unclassified","anchor":"Before a new recording starts, explain the topic, who will hear the recording and how it may be used, and get the participant's consent. Written and signed consent is preferred; otherwise record the spoken consent at the start of the recording [S12], [S14]. When the session ends, ask the participant to confirm the terms of use, ideally by signing a release form, otherwise by a recorded declaration, and note any restrictions [S13], [S14]. A family can use a simple joint statement of intent, filled in by both of you after the recording [S15]. Do not deposit or publish a recording until the participant has given that confirmation [S12].","sources":["S12","S14","S13","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a72bea5e0fbd","kind":"unclassified","anchor":"The participant may refuse a question, take a break, end the session, restrict access or withdraw the interview. Once a recording has been shared publicly or deposited in an archive, it may not be possible to remove it fully, so say that before it leaves the family [S14]. Whenever possible, let the participant review the recording or transcript before it is shared [S12]. Record each decision in the session register.","sources":["S14","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e736b318205a","kind":"unclassified","anchor":"Before you record, check the recording law where each person is. U.S. federal law lets you record a conversation you take part in, but some states require every party's consent, for conversations in person as well as for calls, and a call across state lines can fall under the stricter state's law. Record openly, with consent captured at the start [S16]. In the UK and EU, a recording of an identifiable living person is personal data, and so is what it says about other identifiable living people [S17]. Data-protection law does not apply to purely personal or household activity [S18], [S19]; before you share, deposit or publish a recording, check whether that exemption still covers what you are doing.","sources":["S16","S17","S18","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f9fc275b368e","kind":"unclassified","anchor":"If you doubt that the participant can understand who will hear the recording and how it may be used, for example because of dementia, explain the session in plain words and let a trusted carer, relative or friend be present, with that person's role agreed in advance [S20]. A carer supports the participant; the carer's agreement is not the participant's consent. If the participant cannot give informed agreement, make no recording for any use beyond private family memory. If the family keeps such a recording, with the carer's agreement, record in the session register that the participant's own agreement is absent, and never deposit or publish it.","sources":["S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9c74835d373d","kind":"unclassified","anchor":"For a new recording, use a bounded prompt such as a photograph, object, recipe or experienced event. With a photograph, ask about the vehicles, buildings, place and season before asking who the people are, and never supply a desired identity [S2]. After an important question, stay silent and let the participant remember [S3], [S11]. Respect a decision not to discuss the topic. Relatives raised in one household can have experienced the same events differently: record each relative's version as that person's own account [S2].","sources":["S2","S3","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-14d0b71a3c7f","kind":"unclassified","anchor":"Use a census page the participant would remember as a neighbourhood prompt: with the recording running, show them their own entry, read out the neighbours listed before and after it, and ask what they recall [S4]. Link the page and question to the actual response, and keep the census and the recollection as separate sources. Page adjacency alone establishes neither kinship nor shared residence.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-db4f538583bf","kind":"unclassified","anchor":"Make a short test recording of both voices and play it back before the interview [S23]. For a seated one-to-one interview indoors, clip a lapel (lavalier) microphone on the relative answering [S3], [S21], [S22]. Record the interviewer's questions and any cueing relative too: with a second microphone if the recorder takes one, or with the recorder placed between you, so that every question and cue can be heard later [S21], [S22], [S23]. Keep the recorder running for the whole session instead of stopping and restarting it, and watch the counter or level meter while it runs [S21], [S23]. A recorder that splits a long session into files of about an hour is fine [S23]. If you can, run a second device as a backup [S24]. In a 2022 demonstration of one family-history app, the presenter advised keeping recordings made in the app to a few minutes, even splitting an interview [S1]; that advice is for the app, not for an interview on a recorder. Check the file right after the session for audibility and completeness [S1], and copy it to a second place [S13]. If an answer was not recorded or cannot be heard, record that limitation; never reconstruct it from the question. For supplied recordings, mark inaudible or missing passages and keep any available session notes separate.","sources":["S23","S3","S21","S22","S24","S1","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0d1f692788ee","kind":"unclassified","anchor":"Record who prompted each answer. A familiar sibling or other close relative can help a participant with memory difficulties by cueing (\"do you remember when…\") [S11]. When that happens, note who was present, the cue's wording or recording offset and the response that followed. Settle consent with such a participant first, as described under \"Get consent before recording and authorization before sharing\". Details introduced only by the prompter remain the prompter's account. On revisits, record which session first supplied each detail. Flag details that appear only after repeated pressing as possibly reconstructed. Stop when the participant strains to be helpful, note that you stopped, and corroborate such details with documents [S10].","sources":["S11","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aed0b234f0f6","kind":"unclassified","anchor":"For a relayed or inherited account, record its chain. Note the speaker, whom they heard it from, the occasion, their approximate age then and how that teller could know [S5]. Add any interviewer and date, and each later note, typescript, duplicate, photocopy or retyping, marking unseen links and the generation you hold [S6]. Asking about the oldest person remembered from childhood can draw out such accounts [S9].","sources":["S5","S6","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4696b7866d77","kind":"unclassified","anchor":"An \"as told by\" typescript is a received transcript: its recording stays an open search, and a copy note is not the interview date [S7], [S6]. Differing versions are derivatives, not corroboration. A written version is one dated telling, so do not edit other tellings toward it [S8]. Relayed content, teller intent and remembered dates still need documentary support [S5], [S6].","sources":["S7","S6","S8","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aecae77654cd","kind":"unclassified","anchor":"Connect the recording to its photo or object and session notes through stable references. Keep those links in a portable register or sidecar if the application does not export them. After the requested export, open a sample audio file and its associated item and verify that speaker/context, required notes and links survived. Never assume a single image download carries the memory: in a 2022 demonstration of one app, downloading a photograph did not bring its attached audio, and comments did not travel when a photo was shared [S1]. If the interface or account is not available to you, say so, and do not describe download or export controls you have not seen.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
