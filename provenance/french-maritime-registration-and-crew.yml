claims:
  - {"id":"C-french-maritime-registration-and-crew-1","kind":"custody","anchor":"Use the place and date in the recruitment register to identify the relevant *quartier maritime*. Check the *inscription maritime* finding aids for that district and period. For a Breton lead, include the Service historique de la Défense at Brest where the district’s finding aid points there. Search the *matricule* for the appropriate category and copy transfers or renewals, the number, and the vessel and engagement entries. [S1 @2026-11-22] [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-french-maritime-registration-and-crew-2","kind":"method","anchor":"For a ship departing Bordeaux, use its name, approximate sailing date and port to look for the *armement* and *désarmement*. Read the initial and closing crew rolls for departure, calls, changes aboard and disembarkation. Keep the sailor’s presence at each leg open until you have read the dated entries. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-french-maritime-registration-and-crew-3","kind":"example","anchor":"Check the sailor’s whereabouts on the ship’s departure date before placing him aboard. In the case reported by MyHeritage, a sailor remained on the Bordeaux roll for pay while he was still in hospital ashore. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-french-maritime-registration-and-crew-4","kind":"method","anchor":"Compare the French record’s occupation and release or disembarkation dates with the proposed emigrant’s dated records. If the chronology conflicts, check the maritime record for later annotations or an inquiry. Keep a relative’s reported overseas town and trade as attributed leads and verify both in records from that place. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
