claims:
  - {"id":"C-cf3d9fddded2","kind":"method","anchor":"Record where the image appears and whose name or inscription accompanies it. Describe the shield and record the crest, where present, as a separate element above the helmet. Compare like elements with like; a matching crest alone leaves the complete arms unidentified [S3], [S5]. Use [burial evidence](burial-evidence-packet.md) to retrieve and cite a gravestone inscription.","sources":["S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-494b5c2aa262","kind":"method","anchor":"According to the presenter, check the arms carved on colonial Virginia gravestones and trace the arms in a genealogy back to the bearer [S1†]. Compare the stone’s design and inscription with the source identifying whose arms they are. Treat the display as evidence of a claim, then investigate status and descent separately [S2], [S4], [S5].","sources":["S1","S2","S4","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3ec8644b6789","kind":"example","anchor":"For colonial Virginia, according to the presenter, start with Crozier’s *Virginia Heraldica* [S1†]. Use the surname entry to find the arms description and genealogical notes, then trace each consequential statement back to the named monument or record. The Library of Virginia also lists Crozier in its index of armorial sources [S2], [S6].","sources":["S1","S2","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-008a2ce54832","kind":"method","anchor":"Identify the authority and the original named bearer. Find the grant, confirmation or relevant visitation record. For an English or Welsh claim, check the descent rules applicable to the line and any exception that applies before relying on a male-line pedigree. For any other jurisdiction, use its own rules. Verify each parent-child link independently of the armorial evidence, using [evidence and proof](evidence-proof-judgment.md) for unresolved links [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
