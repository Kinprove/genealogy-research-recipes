  - {"id":"S54","kind":"web-page","urls":["https://www.freebmd.org.uk/search-help.shtml"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Database description read 2026-11-19 for volunteer transcription, field availability and scope","claims":["C-7d03060ea669"],"review":"reviewed","entry_sha256":"63c0692b79b9001b2b21f3e79606f9b5ced577abbbf30d24da09816c54b90000"}
  - {"id":"S55","kind":"web-page","urls":["https://www.lostcousins.com/newsletters2/latesep21news.htm"],"published":"2021-09-29","retrieved":"2026-11-19","access":"read","rights":null,"basis":"Contemporary article and its update read 2026-11-19 for the removed and reinstated surname search option","claims":["C-a55caf6c302c"],"review":"reviewed","entry_sha256":"7515d733ca25c63e4f251a2ee266c934c71d742331e12358c1a9eec32bda9400"}
claims:
  - {"id":"C-de82f867f9b5","kind":"method","anchor":"1. Before searching, find the registration district that covered the parish or residence *at\n   the event date*. A dated parish-to-district list such as UKBMD's shows each parish's district\n   and the years it belonged there. Search older place forms too: Grimsby is listed as Great\n   Grimsby, under Caistor district from 1837 to about 1897 [S7]. Districts changed over time\n   [S3], [S19].\n2. Search civil-registration indexes by the district name, not the census parish. A parish\n   search can miss the entry completely. Barkston, Lincolnshire, for example, fell under Newark\n   [S9].\n3. Keep the district separate from the birthplace and the county. A district is an\n   administrative unit. It can cover many parishes, can share its name with a town or county,\n   and can cross county lines [S1], [S8], [S10], [S11]. Do not reject a candidate because their\n   parish differs from the district name [S8]. Date the parish and the district separately. Aston civil parish joined Birmingham on 9 November 1912, but Aston registration district continued until 1 September 1924, when it split between Birmingham North and Birmingham South [S52]. If you infer a\n   county from consistent census residence, label it as an inference and revise it once the\n   entry is obtained [S11].","sources":["S7","S3","S19","S9","S1","S8","S10","S11","S52"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-59cc80bc4889","kind":"unclassified","anchor":"1. Record each entry as found: surname and forenames, year, quarter, district, volume, page,\n   mother's maiden surname (or dash or blank), age at death where shown, and which index\n   supplied it.\n2. A quarter is the registration quarter and is named after its *last* month: March = Jan–Mar,\n   June = Apr–Jun, September = Jul–Sep, December = Oct–Dec [S1], [S5]. Some aggregators show the\n   quarter by its first month. One presenter found Ancestry showing \"April\" for a June-quarter\n   entry, and warns against rejecting a May birth because of it [S4]. Another reads a \"July\"\n   label as Jul–Sep [S6]. Check how the collection you are using displays the quarter, and\n   convert it to the GRO quarter name before you record it.\n3. Turn each entry into a *possible-event interval*, never a date. Births had to be registered\n   within 42 days, marriages were registered when they took place, and deaths had to be\n   registered within five days unless there was an inquest [S1]. Assuming registration within\n   42 days, a birth's interval starts 42 days before the quarter opens and ends when it closes.\n   A December birth can fall in the next year's March quarter [S1], [S5], [S2]. This on-time\n   window cannot rule out an earlier birth, even after 1875: the 1874 Act itself provides for\n   registration after 42 days, after three months, and after twelve months with the Registrar\n   General's written authority (sections 2, 4 and 5). Widen the interval for births before 1875.\n   The Births and Deaths Registration Act 1874 came into force on 1 January 1875. It put the\n   duty to register on parents and informants and attached penalties to it. Presenters report\n   that registration became more consistent after that, and that births close to 1837 were the\n   most likely to go unregistered [S15], [S3]. Never enter the quarter as the event date or as a\n   \"before\" date [S2], [S5].","sources":["S1","S5","S4","S6","S2","S15","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-504eaab23480","kind":"platform-ui","anchor":"1. Search by surname only (forename blank) plus the mother's maiden surname\n   [S12 @2026-11-19], [S14 @2026-11-19], [S13 @2026-11-19], [S18 @2026-11-19], [S38 @2026-11-19]. Before you sweep, check that every window falls inside the GRO\n   online index's birth years (step 5 of \"Reconcile copies\"). For births from 1935 to 1983, sweep a copy of the\n   quarterly index (FreeBMD, Ancestry or Findmypast) instead; the copies carry the mother's maiden\n   surname only from the September quarter of 1911 [S39 @2026-11-19], [S40 @2026-11-19]. The GRO search window is at most\n   ±2 years, so each search covers five years. GRO's guide lists sex as a required field, so each\n   search takes one sex at a time [S12 @2026-11-19], [S13 @2026-11-19], [S38 @2026-11-19]. Start at, or just before, the\n   marriage year. Run consecutive, non-overlapping windows, female and male, until the end of\n   childbearing. Presenters stop 25–30 years after the marriage [S14 @2026-11-19] or at the census of\n   interest [S7 @2026-11-19], [S13 @2026-11-19]. Log every window: year, ±, sex, district, maiden-name spelling.","sources":["S12","S14","S13","S18","S38","S39","S40","S7"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fdb41f4a8c89","kind":"unclassified","anchor":"1. Compare the maiden-surname field across several children. Do not rely on one child\n    [S15], [S16], [S7]. Prefer a later-born child with an unusual name, because births close to\n    1837 more often went unregistered [S15]. A forename or middle name can repeat the mother's\n    surname. Use it as a search lead, not a conclusion [S15].\n2. A different maiden surname for the same father splits the group. It means separate\n    marriages, or separate same-name couples [S17]. Presenters report men remarrying a woman\n    with the same forename, so a matching wife's forename does not join the groups [S16]. With\n    several same-name children in one place, the maiden surname is the main way to tell them\n    apart [S15].\n3. If the marriage entry gives a different surname from the children's maiden-name field,\n    check for an earlier marriage. Do not assume the marriage surname is her birth name [S7].\n    Co-resident in-laws are clues, but a widowed mother-in-law may carry a later husband's\n    surname [S15].","sources":["S15","S16","S7","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4acc4e8f581c","kind":"method","anchor":"1. If a child, especially the first child, is missing under the father's surname, search the\n    mother's maiden surname, including dates before the marriage [S19], [S21], [S20]. If no\n    marriage can be found, search all the children that way. In Grant’s search the children were registered under their mother’s surname and carried the presumed father’s surname as a middle name. His paternity remained unconfirmed [S20].","sources":["S19","S21","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dc82a822262b","kind":"unclassified","anchor":"1. In marriage indexes such as FreeBMD's, everyone listed on the same quarter, district,\n    volume and page is only a *candidate* spouse. The page can hold several couples, and the\n    index does not show who married whom [S23]. The spouse's surname appears in the index only\n    from 1912 [S6]. Before 1912, the page is your only link between bride and groom.\n2. For each page, list the candidates and rule each one out using census, address and the\n    children's maiden-name evidence. Take the pairing, fathers' names and occupations from the\n    marriage record itself [S23], [S2]. Do not create a couple or parentage from the index entry\n    [S23]. From 1912, a matching spouse surname narrows the page but still does not replace the\n    record.","sources":["S23","S6","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d867babf05cc","kind":"method","anchor":"1. In Grant’s demonstrations, FamilySearch \"England and Wales birth registration\" entries and Ancestry's\n    GRO-titled index reproduced the GRO index [S5], [S7]. Match copies by district, quarter,\n    volume and page, and count them as one observation, not as independent support.","sources":["S5","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b0c4019bdd65","kind":"unclassified","anchor":"1. The Isle of Man, Jersey and Guernsey (with Alderney and Sark) keep their own civil\n    registration, outside the England and Wales system, and Jersey and Guernsey also keep their\n    own probate and deeds records. A GRO, FreeBMD or English probate nil is not a search of the\n    islands [S28], [S30], [S31]. Route to:\n    - **Isle of Man:** Manx National Heritage for archives and the parish registers, with\n      finding aids on iMuseum [S28], [S32];\n    - **Jersey:** Jersey Archive (Jersey Heritage), which holds the BMD indexes and wills of\n      movable property from 1660 to 1999 [S30];\n    - **Guernsey:** the civil registry and the conveyancing registers (from 1567) at the Greffe,\n      the Island Archives, and the Priaulx Library for census and parish-register copies\n      [S31], [S28].\n2. The 1837 start date does not apply. Civil registration began in Guernsey in 1840, Jersey in\n    1842, Alderney in 1850 and Sark in 1915. On the Isle of Man it began in 1849 but was\n    compulsory only from 1878, and from 1884 for marriages [S28]. Before those dates use\n    the parish registers, such as Guernsey's at the Priaulx Library and the Manx registers\n    (c.1607–1878) at Manx National Heritage [S28]. A civil-index nil before the start date is a\n    coverage gap.\n3. Island census returns are part of the UK census series at The National Archives [S29]; read\n    them with [UK census and 1939 Register interpretation](uk-census-and-1939-register-interpretation.md).\n4. For Jersey and Guernsey residents during the German Occupation (1940–45), use the\n    registration cards and identity forms as identity sources. Jersey cards give name, address\n    and date of birth, and the Guernsey forms cover everyone over 14 who stayed on the island\n    [S30], [S31]. The Isle of Man was not occupied.","sources":["S28","S30","S31","S32","S29"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e006b395d2b8","kind":"unclassified","anchor":"1. Order using the full reference: name, year, quarter, district, volume and page [S2], [S21].\n    Without an index reference, the GRO searches only a three-year period centred on the year\n    you give [S6]. Supply the reference. Take event dates, birthplace, parents, informant and\n    the couple's pairing from the certificate or register [S2], [S3].\n2. Return: the observation register (literal fields plus which index supplied each); the\n    calculated on-time interval for each entry; the sibling sweep table (windows by sex, year,\n    district, spelling, search option) with the unresolved out-of-district hits; a\n    candidate-spouse list for each marriage page with the reason for each elimination; and the\n    certificates to order. Proof rulings go to evidence-proof-judgment.md.","sources":["S2","S21","S6","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6ecbd8681612","kind":"custody","anchor":"**Isle of Man civil registers from 1878 are with the Douglas Civil Registry Office.** The National\nArchives names that office as the contact for them, and Manx National Heritage for the parish\nregisters [S28 @2026-11-13]. A recent entry can name people who are still living, so answer the\nprivacy gate in `SKILL.md` before you ask the office for a copy.","sources":["S28"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-df997080730a","kind":"method","anchor":"A certificate's birth date is the informant's statement, and it may have been moved later so\nthat the registration looked on time. Late registration carried a penalty, and some parents\ngave a slightly later birth date to avoid the fine; a baptism that records the true date, or\none held before the stated birth date, can expose it [S43], [S47]. When the stated birth falls\njust inside 42 days before registration, check it against the baptism and the census ages\nbefore you fix the birth date. The parents named are the informant's statements too and can be\nwrong; the father named is not always the biological father [S43], [S47].","sources":["S43","S47"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9ac70fd99007","kind":"method","anchor":"For a Church of England marriage, look for an image of the parish register before you buy the\ncertificate. The church register holds the same details as the civil certificate [S45], [S50],\nand it carries the couple's and the witnesses' own signatures or marks; a GRO certificate is a\ncopy that shows only whether each of them signed or made a mark [S46]. Keep the signatures for\ncomparison with other documents [S50]. For a Catholic or nonconformist marriage, look for a\nregister image too, and order the certificate when there is none [S50].","sources":["S45","S50","S46"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-62b4b908a75c","kind":"fee","anchor":"To test a birth or death candidate cheaply, order the GRO's Online View digital image (£3.00)\nor PDF (£8.00) instead of a full certificate (£12.50 online with an index reference). Both\ncover births from 1837 up to 100 years ago and deaths from 1837 to 1957, need the full GRO\nindex reference and can be ordered only online; neither exists for marriages\n[S24 @2026-11-14], [S42 @2026-11-14], [S48 @2026-11-14]. An Online View image can be viewed and\ndownloaded for 3 months from the order and is then removed without a reminder\n[S24 @2026-11-14], [S42 @2026-11-14].","sources":["S24","S42","S48"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-70903066ab89","kind":"method","anchor":"Cite any GRO certificate, PDF or image as a copy. The GRO holds the quarterly copies that\nregistrars sent it, while the original register stays with the local register office, which\nmakes its own certificates from that original [S44]. Record the GRO product as a derivative of\nthe local entry; the information in it can still be first-hand. The GRO's statement that a PDF\nhas no evidential value means only that it cannot be used for official purposes such as a\npassport application [S42], [S49]; it does not lower its weight as research evidence. If a\nGRO copy looks miscopied, take the local-office route in step 6 of \"Reconcile copies of one\nindex\".","sources":["S44","S42","S49"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a55caf6c302c","kind":"method","anchor":"2. Presenters prefer the GRO \"similar sounding\" option to the broader phonetic option, which one\n   finds too wide [S13], [S15]. These options changed over time. The September 2021 LostCousins newsletter reported that the GRO removed\n   \"similar sounding\" variations for the surname field in birth and death searches, kept them\n   for the mother's maiden surname, and later reinstated them [S55]. Record which option you used on\n   which field, and check what the form currently offers. Rerun with maiden-surname spelling\n   variants [S14], [S15]. Do not centre on a census age at ±2 and stop there. Census ages are\n   often off by a year or two [S15].","sources":["S13","S15","S55","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-90733d42e9ed","kind":"method","anchor":"3. Leave the district blank first, or widen it after a miss. Boundaries change and families\n   move [S13], [S19]. Grant left a Watford hit unresolved when looking for a Buckinghamshire family [S13]. Check the parish and date even when the district’s county differs: Watford was in Hertfordshire but included part of Chalfont St. Peter, Buckinghamshire, in 1907–1908 [S53]. Accept a candidate only when surname,\n   maiden surname, district and sibling spacing agree, and note how common the surname is\n   locally [S13].\n4. Reconcile hits with every census household. The 1911 census asked for years married and\n    children born alive and still living [S12], [S17]. Families sometimes counted children from\n    other unions [S12]. A child older than the marriage, or more children listed than the\n    couple's count, points to an earlier marriage [S17]. A child born after one census and\n    dead before the next can be missing from both censuses yet appear in the civil-registration\n    indexes [S12], [S20].","sources":["S13","S19","S53","S12","S17","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-903e1783cb7f","kind":"platform-ui","anchor":"2. GRO's guide says a dash in the maiden-name column means no maiden surname was captured for\n    the entry: the informant did not give one, or it was not data-captured [S38 @2026-11-19]. Presenters read\n    a dash as a sign that the mother's surname matched the child's, often because she was\n    unmarried [S21 @2026-11-19], [S22 @2026-11-19], [S14 @2026-11-19], [S19 @2026-11-19]. GRO's guide does not say this, so treat it as a lead,\n    not proof. One presenter warns that the parents' surnames can coincidentally be the same\n    [S22 @2026-11-19]. Confirm from the entry before attaching the child [S21 @2026-11-19].","sources":["S38","S21","S22","S14","S19"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7d03060ea669","kind":"platform-ui","anchor":"2. Copies do not all carry the same fields. FreeBMD and the commercial copies reproduce the\n    printed quarterly index. The printed index added the mother's maiden surname to births from\n    the September quarter of 1911 and age at death from the March quarter of 1866; from the June\n    quarter of 1969, death entries give the date of birth instead of the age [S39 @2026-11-19]. Before those\n    quarters a copy has no such field to read or search. GRO built its online index from its own\n    digitised records and added the mother's maiden surname to earlier births \"where possible\"\n    [S38 @2026-11-19]. 2016 launch reports say it also gives ages at death for earlier deaths, but they\n    disagree on the first year [S41 @2026-11-19]. For births under 100 years old, the GRO index shows the\n    mother's maiden surname only if you entered it in the search [S38 @2026-11-19]. For an 1885 birth, Grant found no maiden-name field in FreeBMD and a dash in the corresponding GRO entry [S21 @2026-11-19]. Record the two displays separately. FreeBMD is volunteer-transcribed and incomplete [S54 @2026-11-19]. Its coverage starts with the\n    September quarter of 1837. Rule: when FreeBMD or an aggregator finds an entry inside the GRO\n    online index's years (step 5), rerun its exact spelling in the GRO index to get the\n    maiden-name field or the age at death [S21 @2026-11-19], [S19 @2026-11-19]. A blank maiden name in a copy is not a\n    dash.","sources":["S39","S38","S41","S21","S54","S19"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-26927df26730","kind":"method","anchor":"3. Before linking a same-named death to a child, read the GRO age at death [S19], [S14].\n    Searching by age needs a wide margin; one presenter uses at least five years [S14]. Also\n    run the search without it, and compare the age you see.\n4. A failed search is not a finding. Births before 1875, especially near 1837, are the most\n    likely to be unregistered [S15]. Entries can be misindexed or indexed under another form of\n    the forename [S20], or under the mother's surname. Report the windows actually searched.","sources":["S19","S14","S15","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c4bb283ac717","kind":"portal-availability","anchor":"5. Check the GRO online index's range before a sweep. It covers births 1837–1934 and deaths\n    1837–1957, then both again from 1984 to a recent year, so it has no entries for births 1935–1983 or\n    deaths 1958–1983, and it has no marriage index [S24 @2026-11-19]. Read the current end year on the GRO\n    site. For those gaps and for every marriage, use FreeBMD or another copy of the quarterly\n    index. Check the marriage index's end year before you treat a miss on a recent marriage as a\n    nil [S33 @2026-11-19]. Ancestry’s November 2026 catalogue capture and the Findmypast collection on FamilySearch give 2005 as their end year\n    [S34 @2026-11-19], [S35 @2026-11-19]. FreeBMD stops sooner: its marriage chart ends at 2000, and its transcription is\n    incomplete [S36 @2026-11-19]. Order a later marriage from the GRO without a reference by giving the date\n    and place (extra search fee, slower dispatch), or from the register office for the district\n    where it took place [S37 @2026-11-19].","sources":["S24","S33","S34","S35","S36","S37"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-e9ca9a9a7e1d","kind":"portal-availability","anchor":"6. Before calling a miss final, search the local register-office index for the district,\n    reached through the UKBMD county pages. Local indexes are transcribed from the district's own\n    registers, not from the GRO copies, so they can hold entries that are missing or misindexed in\n    the GRO index [S25 @2026-11-19]. Some local marriage indexes name the church; Lancashire BMD, for example,\n    has a marriage-venue search [S27 @2026-11-19]. Order from the local office with its own register and\n    entry reference: the GRO volume and page mean nothing there [S26 @2026-11-19].","sources":["S25","S27","S26"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b89439138a37","kind":"method","anchor":"Save the download date with the GRO reference (year, quarter, district, volume and page) so the image remains identifiable after online access ends [S51]. A sibling’s infant death entry can also supply a recorded cause of death [S49].","sources":["S51","S49"],"checked":null,"stated_as":"observation","review":"reviewed"}
