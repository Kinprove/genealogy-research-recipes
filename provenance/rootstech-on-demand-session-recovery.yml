claims:
  - {"id":"C-b049a011689e","kind":"platform-ui","anchor":"According to the presenter, refine an ambiguous place-name search with the location filter [S1† @2026-11-21]. Use the library’s location, topic or speaker filters to distinguish the place under study from text that merely mentions it. Inspect the active language filter before treating a sparse result as the full result set and try the language relevant to the question. [S2 @2026-11-21]","sources":["S1","S2"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4ace93b5be40","kind":"platform-ui","anchor":"Check for a playable recording and for a handout separately. Open the session page and check below the player or description for syllabi or slides. Some in-person sessions lack a recording. Use the speaker page to look for another session by the same presenter and the event’s syllabi page when there is no playable session. Record the title, speaker and available materials with the research question. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6e48d7a3c13f","kind":"platform-ui","anchor":"If returning to multiple sessions, sign in and save them in a topic playlist. Keep an independent session citation with the research notes. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
