claims:
  - {"id":"C-dd2673dd6ee9","kind":"unclassified","anchor":"Use this recipe before you search for, or rule out, pre-1900 U.S. military service. The usual failure is to search only federal compiled-service or pension indexes and then report \"no service\". A related mistake is reading an empty donation-land or bounty-land search as meaningful when the man was never eligible. This recipe works out the probable service type, sends each type to its own record series and custodian, labels what each record actually shows, and keeps same-named men apart.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1a7a241ad35d","kind":"unclassified","anchor":"Before opening any index, record where the man lived and where and when he probably enlisted. Without that, a militia man cannot be told apart from a Continental soldier, and either kind is hard to find [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b9ff6c741c66","kind":"unclassified","anchor":"- **Continental or volunteer.** Search the compiled military service records (CMSRs) at the National Archives. CMSRs cover the volunteer army (NARA gives 1775–1902) and do **not** cover regular-army enlistments [S2]. CMSRs also exist for volunteers who served in the 1784–1811 \"old war\" period (NARA M905) [S4]. Revolutionary CMSRs are reconstructions. A War Department fire on 8 November 1800 destroyed most of the original records, and more were lost in 1814. NARA Record Group 93 was later put together as a substitute, from records transferred by the State, Interior and Treasury Departments (1893–1913) and from purchased and copied material [S2]. An incomplete Revolutionary CMSR therefore does not show that a man did not serve.\n- **Militia, state line or ranger.** For state-only service, look in state (and sometimes county) records; NARA does not hold state militia records [S1], [S7]. Militia called into federal service also has CMSRs at NARA (for the War of 1812, federalized militia are in RG 94, index M602), so search both. State archives hold state militia, National Guard and Confederate pension records. Confederate pensions are not at NARA [S7]. Ranger companies are a separate in-between category (see §2).\n- **Regular army.** Not in the volunteer CMSRs [S2]. For enlisted men, search the Register of Enlistments in the U.S. Army at NARA. For officers, start with Heitman's *Historical Register* and, for service from 1863, the Commission Branch and ACP files in RG 94 (NARA, *Prologue*, Fall 2002).\n- **Loyalist.** Treat this as its own route (§5). Patriot service indexes are the wrong place to look.","sources":["S2","S4","S1","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d99563324485","kind":"unclassified","anchor":"Build a routing table with one row per series: custodian, coverage, eligibility rule, and whether a miss is meaningful. A miss counts only when the man met the eligibility rule **and** the series covers his period and place.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-06f35bf7ccc0","kind":"custody","anchor":"- **Pennsylvania donation land.** Check service to the end of the war in the Pennsylvania Continental Line. The State Archives lists ten surveying districts in parts of Butler, Clarion, Crawford, Erie, Lawrence, Mercer, Venango and Warren counties and gives separate claimant, patent and register series [S31 @2026-11-19]. An archivist describes a Line soldier whose service ended at the 1781 mutiny and reports grants to some special ranger companies outside the Line [S3 @2026-11-19]. Check the specific company's eligibility. A missing grant cannot exclude earlier Line or militia service.\n- **State bounty land.** Search federal and state grants separately. Bockstruck's published index covers Connecticut, Georgia, Maryland, Massachusetts, New York, North Carolina, Pennsylvania, South Carolina and Virginia [S30 @2026-11-19]. A researcher reports that Massachusetts veterans had to choose between state and federal grants [S4 @2026-11-19]. Check the applicable terms and both sets of records before interpreting a federal miss.\n  - Search Lloyd Bockstruck's *Revolutionary War Bounty Land Grants Awarded by State Governments* first. The presenter says it is alphabetical regardless of state. Then go to that state's archive for the record itself [S4 @2026-11-19].\n  - Virginia warrants could lie in present-day Kentucky and Ohio (the Virginia Military District). The presenter adds West Virginia [S4]. The Kentucky Secretary of State website has 4,748 Virginia Revolutionary War warrants digitized [S4]. Search where the land lay, not only where the soldier came from.","sources":["S31","S3","S30","S4"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-9ebdb3008d75","kind":"custody","anchor":"- **Militia fines and levies in tax lists are levy/fine, never service proof.** Pennsylvania militia fines were charged to men who were not serving. The archivist adds two details. Older men who could not serve were charged too. During the Revolution, some levies fell on a whole township, or on a group within it, depending on whether a volunteer could be found [S3 @2026-11-19]. Look for muster, class or account records instead.\n- **A county-history roster can be an enumeration.** In a Georgia county history used to fill an early census gap, the militia roster's notes said that some compilers included women and enslaved people while others omitted them [S5 @2026-11-19]. Transcribe the heading and the counting rule for the particular district. A name establishes inclusion on that list; seek a separate record of service.\n- **Pennsylvania militia-loan certificates.** Follow the certificate number on an abstract card marked “militia loan accounts” to the underlying account. An archivist reports that the card can give little more than a name, amount and county, while the account may identify the dates and place of a tour, often frontier or guard duty [S3 @2026-11-19]. The State Archives lists the Revolutionary War Military Abstract Card File as series 13.50, digitized rolls 4444–4497 [S32 @2026-11-19]. Record what the account actually states.\n- **State pay vouchers.** The North Carolina State Archives lists Revolutionary War Pay Vouchers as SR.204.29 [S33 @2026-11-19]. Copy the claimant, amount and date and place of the claim where given [S6 @2026-11-19]. Label the payment and inspect the stated reason before identifying a tour of military service.\n- **State bounty-land warrants.** Transcribe the service designation and term from the warrant. The 1783 Virginia warrant shown for Hezekiah Lindsay specifies three years in the Continental Line [S4 @2026-11-19]. Enter that term and branch, and check a separate record for any militia service.","sources":["S3","S5","S32","S33","S6","S4"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-11d6db87bdb8","kind":"method","anchor":"- Retain the class, company and battalion exactly as each roll identifies them, along with the duty status and county. In the Lancaster County example, the same man's active entry was 2nd battalion, 7th company, 8th class, while the inactive entry was 7th battalion, 1st company, 2nd class [S4]. Check the local system before deciding that a change of all three numbers means a different person or a transfer.","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-49f9e9e5688e","kind":"unclassified","anchor":"Search period newspapers for notices of intent to leave the country and for public sales of confiscated property under the person's name [S4]. Then search Ancestry's \"UK, American Loyalist Claims, 1776–1835\" and, for New York, \"New York, Sales of Loyalist Land, 1762–1830\". The presenter also names an American Loyalist migration database, and says the claims are the largest of his three collections [S4]. Many claims were rejected or only partly paid, but even an unpaid claim can preserve sworn affidavits about residence and property lost [S4]. Treat a newspaper notice as a claim lead, not as an identification. German auxiliaries are a separate population and are not routed here.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b92b73c0a74b","kind":"method","anchor":"- List every same-named candidate with birth date, residence at the time of service and recruiting area. In a search for Civil War soldier John Morgan, the researcher used a known birth date and Indiana residence to narrow dozens of candidates to units raised nearby [S8]. Use that list to prioritize searches and retain other units until independent evidence excludes them [S7].\n- Use a county militia-district map to place same-named men in different districts [S5].\n- Where vouchers survive, compare amount, date and place claimed, man by man [S6].\n- Before splitting rows, check roster status (§4). Active and inactive designations that differ can belong to one man.","sources":["S8","S7","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-42f523de735f","kind":"unclassified","anchor":"- the service-type classification and its basis;\n- the routing table (custodian, coverage, eligibility rule, whether a miss is meaningful, what was actually searched);\n- an evidence-kind label for each record;\n- the candidate-separation table;\n- handoffs to pension recovery and proof judgment.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1812-cmsr-index-online","kind":"portal-availability","anchor":"- **War of 1812 index hits.** NARA has put the War of 1812 CMSR indexes online at Ancestry and Fold3, but the carded service records themselves (NAID 300392) have not been digitized in full; only select files are free in the National Archives Catalog [S10 @2026-11-16]. One presenter (only transcript excerpts read) warns that the records are not generally on Fold3, Ancestry or FamilySearch [S9 @2026-11-16]. Label an online War of 1812 service-record hit as an index entry, not the CMSR. Look for a scanned file in the Catalog; otherwise list the CMSR as unsearched.","sources":["S10","S9"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-register-regulars","kind":"historical","anchor":"- **War of 1812 regulars.** Most enlisted regulars of the war are in the fifteen Register volumes for 1798–1815. An entry can give age, birthplace, physical description, occupation and enlistment details, and the Adjutant General's Office built the entries from muster rolls, payrolls, inspection and descriptive rolls and other records [S11]. Treat an entry as a derived abstract: cite it, then follow it back to the rolls behind it, as one presenter (only transcript excerpts read) advises [S9].","sources":["S11","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-register-online","kind":"portal-availability","anchor":"- **Register online.** The Register (NARA M233) is online at Ancestry, FamilySearch and Fold3 [S12 @2026-11-16].","sources":["S12"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-rg98-company-books","kind":"custody","anchor":"- **Company books.** For 1812–15, NARA Record Group 98 (Records of United States Army Commands, 1784–1821) holds company books and order books for many regular infantry regiments, the 2nd and 3rd Artillery, the 1st and 3rd Rifle regiments and the Light Dragoons [S13 @2026-11-16]. One presenter (only transcript excerpts read) says these company and descriptive books carry the same kinds of detail as the Register [S9 @2026-11-16]. Search them when the Register entry is thin or the man is missing from it.","sources":["S13","S9"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-state-rosters-coverage","kind":"method","anchor":"- **War of 1812 state rosters and society compilations.** Many states published rosters of their troops called to duty in the war [S11]. One presenter (only transcript excerpts read) points to state adjutant-general volumes and to state-level books from the Society of the War of 1812 and the Daughters of 1812 [S9]. Each covers only some service types and units. Write that coverage into the routing table, use a hit to find the original record, and count a miss only inside the stated coverage.","sources":["S11","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-kentucky-report","kind":"historical","anchor":"- **Kentucky.** *Report of the Adjutant General of the State of Kentucky: Soldiers of the War of 1812* (Frankfort, 1891) [S15]. The Kentucky Genealogical Society says men who served in the U.S. regulars or in Virginia units do not appear in it, and that the original state-level records were destroyed after it was published [S16]. A Kentuckian missing from it may still be in the Register (§1) or in Virginia or federal records.","sources":["S15","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1812-nj-ohio-rosters","kind":"portal-availability","anchor":"- **New Jersey and Ohio.** *Records of Officers and Men of New Jersey in Wars, 1791–1815* (Adjutant-General's Office, Trenton, 1909) and *Roster of Ohio Soldiers in the War of 1812* (Adjutant General's Office, Columbus, 1916, catalogued under Ohio militia). These two volumes and the Kentucky report are scanned on the Internet Archive [S15 @2026-11-16], [S17 @2026-11-16], [S18 @2026-11-16].","sources":["S15","S17","S18"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-virginia-militia-volumes","kind":"custody","anchor":"- **Virginia militia.** Search *Pay Rolls of Militia Entitled to Land Bounty under the Act of Congress of Sept. 28, 1850* and its companion *Muster Rolls of the Virginia Militia in the War of 1812*. The Library of Virginia treats them as the official record of Virginia militia service, and access to the fragile originals is restricted. It also holds militia muster rolls and payrolls left out of the printed volumes (series APA 253a), and says the federal government ultimately paid many of these men, whose service and benefit records are at the National Archives [S14 @2026-11-16]. One presenter (only transcript excerpts read) likewise sends men missing from the volumes to the National Archives [S9 @2026-11-16]. A miss in the printed volumes is not meaningful until APA 253a and the M602 index have also been searched.","sources":["S14","S9"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-virginia-regulars-butler","kind":"historical","anchor":"- **Virginia regulars.** The Library of Virginia lists Stuart Lee Butler's *Virginia Soldiers in the United States Army, 1800–1815* among its published indexes [S14]. One presenter (only transcript excerpts read) says Butler pulled the Virginia regulars of the war out of the Register of Enlistments [S9]. Use a hit to find the man's own Register entry (§1).","sources":["S14","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1812-tennessee-daughters","kind":"historical","anchor":"- **Tennessee.** *Tennessee Soldiers in the War of 1812: Regiments of Col. Allcorn and Col. Allison* (Penelope Johnson Allen, with the National and Tennessee Societies of the U.S. Daughters of 1812, 1947) is limited by its title to those two regiments [S19]. A miss there says nothing about other Tennessee service.","sources":["S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8edde179db24","kind":"portal-availability","anchor":"With a known NARA microfilm-publication number, look it up in NARA's digitization-partner table and follow the listed collection links. Keep the National Archives Catalog Availability Status column separate from the extent of each partner's collection; check the target collection's coverage before reading a miss. Do not assume that a provider's name search indexes the publication number, or that a link to one partner proves the whole series is online. [S23 @2026-11-16](https://www.pricegen.com/7512-2/) [S24 @2026-11-16](https://www.archives.gov/digitization/digitized-by-partners)","sources":["S23","S24"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5cec5570d949","kind":"method","anchor":"- **Ohio WPA veterans’ grave-registration cards: claim lead.** Treat an Ohio WPA veterans' grave-registration card's service attribution as a compiled lead, then check the cited unit in service records, rosters and any pension file. In Union County the project crosschecked cemetery names against war records and local rosters before creating cards. When two same-named men receive the same unit or dates, compare each man's residence, life dates and the unit's recruiting context rather than transferring the service to the man whose grave is easiest to find. Keep the burial identification and service identification separate. [S20](https://genealogypants.com/2024/08/14/dont-stop-digging-graves-registration-cards-ohio/), [S21](https://genealogypants.com/2025/07/09/did-my-george-long-serve-in-the-war-of-1812/), [S22](https://www.unioncountyohio.gov/Veterans-Burial-Records)","sources":["S20","S21","S22"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-quaker-meeting-service-leads","kind":"method","anchor":"**Quaker meeting clues.** Treat a Revolutionary-era Quaker monthly meeting minute that mentions military activity as a claim lead [S28]. Use any place of service named in the minute [S25] to choose the compiled service, pension and bounty-land records to search. Match each series to the probable service type and its eligibility rules (§2) [S29]. Keep the meeting's location separate from the place of service unless the minute connects them.","sources":["S28","S25","S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-pa-inactive-muster-fines","kind":"method","anchor":"**Pennsylvania muster fines.** Transcribe the date and offense. A fine explicitly levied for missing an inactive-duty muster records absence at that muster [S25], [S26]. Keep active duty and combat open. Compare dated fines for the man and his known relatives to spot repeated absences. Leave attendance unresolved on dates with no fine entry [S27]. If you suspect Quaker membership, check the relevant monthly meeting minutes [S28]. Record a reason for an absence only when the records support it.","sources":["S25","S26","S27","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-privateers","kind":"custody","anchor":"**Privateering commissions.** For a Revolutionary letter of marque, identify the vessel and issuing authority before choosing a record series. Follow Continental Congress commissions and state-issued commissions as separate leads [S34 @2026-11-20] [S35 @2026-11-20]. For the War of 1812, start with the State Department's letters-of-marque correspondence in RG 59, M588, roll 1. Check applications and abstracts returned by customs collectors as well as applications sent directly to the department [S36 @2026-11-20].","sources":["S34","S35","S36"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-navy-treasury","kind":"custody","anchor":"**Navy muster and pay rolls.** If the Navy rolls in RG 45 or RG 24 leave a gap [S58 @2026-11-20], check the Treasury series in National Archives RG 217, §217.9.5. Use its card index (1828–1907) to find muster, pay and receipt rolls (1820–1898) [S38 @2026-11-20]. Follow the presenter's advice (only transcript excerpts read) to check the index by ship or shore station even when the series description suggests a gap, then look for the relevant dates in the rolls [S37 @2026-11-20].","sources":["S58","S38","S37"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-naval-cutter","kind":"method","anchor":"For a Coast Survey vessel or revenue cutter that operated with the Navy [S61] [S39], search by vessel name in the Navy muster rolls. Also test the vessel name in the Treasury index when the Navy rolls leave a gap, as the presenter suggests (only transcript excerpts read) [S37].","sources":["S61","S39","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-horse-claims","kind":"custody","anchor":"**Mexican War horse claims.** For mounted service with a clue to the loss of a horse, search the Third Auditor's Claims Division in National Archives RG 217, §217.8.5, beginning with the abstracts of horse claims (1846–1865) [S38 @2026-11-20]. The presenter points to the horse-claim route (only a transcript excerpt read) [S40 @2026-11-20]. Capture the unit, appraisal, loss and replacement details where stated. Use the claim as a lead to the tour and check the service rolls [S41 @2026-11-20].","sources":["S38","S40","S41"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-georgia-m1745","kind":"portal-availability","anchor":"**Georgia frontier militia claims.** For service on the Georgia frontier in 1792–94, search the five rolls of M1745, *Claims for Georgia Militia Campaigns Against Indians on the Frontier, 1792–1827* [S44 @2026-11-20]. The National Archives lists the publication as fully digitized in its Catalog [S43 @2026-11-20]. Search the Catalog by publication number. Use the M1745 finding aid to locate the voucher, as the presenter suggests (only transcript excerpts read), and open the corresponding roll [S42 @2026-11-20].","sources":["S44","S43","S42"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-georgia-voucher","kind":"method","anchor":"**Georgia militia vouchers (M1745).** Label the voucher as payment and record the serviceman, company, service interval and amount where stated [S44]. Use the service interval to place the man when the voucher identifies where he served. Following the presenter's examples (only transcript excerpts read), record the later voucher date separately and keep any widow, executor or assignee in the role the voucher gives [S42].","sources":["S44","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-colonial-substitution","kind":"method","anchor":"**Colonial militia substitutes.** If a man is missing from a colonial expedition's service roll, check whether the local rules let a man chosen for duty furnish a substitute or pay for one. Follow the presenter's lead (only transcript excerpts read) and look for a substitution or fine entry that names him before treating the roll search as conclusive [S45] [S46].","sources":["S45","S46"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-colonial-fines","kind":"method","anchor":"**Colonial militia fines.** If drill rolls are missing, follow the presenter's suggestion (only transcript excerpts read) to check local militia fines for failure to appear [S45]. For colonial Virginia, include county court-martial records in that search. Use the offense as written, since fines also covered other conduct [S59]. For a Quaker, compare the fine entry with the monthly meeting minutes for an explicit refusal to pay or a record of collection [S47].","sources":["S45","S59","S47"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-death-register","kind":"method","anchor":"**Death during the War of 1812.** For a regular enlisted soldier, inspect the Remarks field in the Register of Enlistments (M233). Read the full page for other death entries only when the question covers other soldiers as well, as the presenter suggests (only transcript excerpts read) [S48] [S49]. Treat a notation in the Register as a lead to the roll or other original record.","sources":["S48","S49"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-death-rolls","kind":"custody","anchor":"For a death lead, follow the presenter's advice (only transcript excerpts read) to inspect the original unit muster roll's Remarks field when a published roster is silent [S48 @2026-11-20]. Use the National Archives' RG 94 finding aids to distinguish the volunteer War of 1812 rolls (NAID 654644) from regular-army rolls (NAID 654583) [S50 @2026-11-20]. For regulars, search by arm of service, regiment, company and date [S49 @2026-11-20].","sources":["S48","S50","S49"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-death-books","kind":"custody","anchor":"For a regular unit, use the National Archives RG 98 guide to locate surviving company books by regiment [S13 @2026-11-20]. Check the descriptive entries and rosters of men separated from service for a death [S51 @2026-11-20]. Start with the company or regiment and date, following the presenter's advice (only transcript excerpts read) [S48 @2026-11-20].","sources":["S13","S51","S48"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-nj-deaths","kind":"method","anchor":"**New Jersey War of 1812 deaths.** Check the muster-roll entries in *Records of Officers and Men of New Jersey in Wars, 1791–1815* for an explicit death remark, as the presenter suggests (only transcript excerpts read) [S48] [S60]. Carry the unit and date to the original rolls if the printed entry leaves details unresolved.","sources":["S48","S60"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-va-counties","kind":"method","anchor":"**Virginia militia company to county.** Use the commander index and county-by-county listings in Part III of Stuart Lee Butler's *A Guide to Virginia Militia Units in the War of 1812* to match a known company to a county. The presenter suggests the county route (only transcript excerpts read) [S48] [S52]. Carry the company and county into the state and federal searches. Use this as a unit guide and verify the soldier's service in a roll or service file.","sources":["S48","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-maryland-privateers","kind":"method","anchor":"**Maryland privateering in the War of 1812.** Check chapter II of William M. Marine's *The British Invasion of Maryland, 1812–1815* and its appendix for a person or vessel connected with privateering, as the presenter suggests (only transcript excerpts read) [S48] [S53]. Treat a hit as a lead to the commission records (§1).","sources":["S48","S53"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-hardy-county-court","kind":"custody","anchor":"**Hardy County militia officers.** Follow the presenter's lead (only transcript excerpts read) to search county court minutes and orders for recommendations [S54 @2026-11-20]. For the late 1790s through the War of 1812, start with the Library of Virginia's Hardy County Record Book 4 (1795–1798, reel 3) and use the 1795–1812 index (reel 11) and the later volumes to look for appointments or promotions. Check the overlapping volumes against the dates sought [S55 @2026-11-20].","sources":["S54","S55"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-virginia-commission","kind":"custody","anchor":"**Virginia militia nominations.** Label the court's recommendation as a claim lead. Establish the appointment and its date from a record of the governor's action [S57 @2026-11-20]. Follow the presenter's suggestion (only transcript excerpts read) to check the governor's records at the Library of Virginia [S54 @2026-11-20]. Search the Militia Commission Papers, 1777–1858 (misc. reels 6443–6616), and use the Journals of the Council of the State of Virginia (misc. reels 2981–2998) as a rough index into the governor's correspondence [S56 @2026-11-20].","sources":["S57","S54","S56"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-hardy-vacancy","kind":"method","anchor":"In later Hardy County orders, search for a successor named “in room of” the officer, as the presenter suggests (only transcript excerpts read) [S54]. Record “removed” or “promoted” as the stated vacancy reason and leave the circumstances or new rank open until another record supplies them. Use the later orders and commission records to establish the rank and date at each step from ensign to captain [S55] [S56].","sources":["S54","S55","S56"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-death-cmsr","kind":"method","anchor":"For a volunteer, follow the presenter's advice (only transcript excerpts read) to check the full compiled military service record for a death notation or related personal paper [S48] [S10]. Use a silent file as a reason to check the unit rolls.","sources":["S48","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-1812-de-md-rolls","kind":"portal-availability","anchor":"**Delaware and Maryland militia deaths.** Use a published muster entry to identify the company and date. If the entry is silent about death, inspect the original unit roll's remarks, as the presenter suggests (only transcript excerpts read) [S48 @2026-11-20]. For Delaware, check the Delaware Public Archives' posted 1813 rolls [S62 @2026-11-20]. For Maryland, use the state archive's military records bibliography to find the relevant county volume or unit roll citation [S63 @2026-11-20].","sources":["S48","S62","S63"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolution-pay-and-diplomacy","kind":"custody","anchor":"**Revolutionary War records outside the service file.** Follow the alternate routes from the available excerpt of the Strauss interview [S66 @2026-11-21]. For pay, start in Treasury RG 217, §217.7.7, with paymasters' accounts (1777–1781) or the index to later settled Revolutionary War claims (1828–1835), according to which transaction you need [S38 @2026-11-21]. For a wartime diplomatic question, search the Committee for Foreign Affairs and Secretaries for Foreign Affairs papers in RG 360, M247 [S68 @2026-11-21]. For follow-up correspondence from 1785–1790, check the foreign letters in State Department RG 59, M61 [S69 @2026-11-21].","sources":["S66","S38","S68","S69"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-treasury-navy-service-records","kind":"custody","anchor":"**Treasury Navy service records.** Follow the lead from the available excerpt of the Treasury talk [S71 @2026-11-21]. For Navy enlisted men or warrant officers, check the separate 1825–1892 service-record series in the Fourth Auditor's Record and Prize Division, RG 217, §217.9.5, even if the ship's payroll turns up nothing [S38 @2026-11-21].","sources":["S71","S38"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ship-marine-detachments","kind":"portal-availability","anchor":"**Marine detachments aboard Navy ships.** Follow the detachment route from the available excerpt of the USS Constitution talk [S79 @2026-11-21]. Search Marine Corps RG 127 by month and ship, using T1118 for 1798–1892. Browse it at FamilySearch or search the Marine rolls at Ancestry. Run a separate Navy muster search for sailors [S81 @2026-11-21] [S80 @2026-11-21].","sources":["S79","S81","S80"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-constitution-roll-start","kind":"historical","anchor":"For the earliest USS Constitution detachment, start the Marine roll search in 1798, the year of the first voyage and the opening year of T1118 [S82] [S77]. Keep the 1797 launch as a separate date in the ship's chronology, following the dating lead from the available excerpt [S79].","sources":["S82","S77","S79"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-us-volunteer-m1017","kind":"portal-availability","anchor":"**Former Confederates in U.S. Volunteer Infantry.** For service in the 1st–6th U.S. Volunteer Infantry, 1864–1866, look up RG 94 microfilm M1017 in NARA's digitization-partner table and open the listed partner collection, following the suggestion from the available excerpt of the microfilm talk [S73 @2026-11-21] [S24 @2026-11-21]. Search these U.S. volunteer service files separately from the man's Confederate service [S74 @2026-11-21].","sources":["S73","S24","S74"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-mormon-m351","kind":"portal-availability","anchor":"**Mexican War volunteers in Mormon organizations.** Follow the publication route from the available excerpt of the microfilm talk [S73 @2026-11-21]. Use the alphabetical volunteer index M616 as a name lead and open the actual compiled service file in RG 94, M351. Follow the M351 collection links from NARA's Mexican War guide or its digitization-partner table [S75 @2026-11-21] [S24 @2026-11-21].","sources":["S73","S75","S24"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-m351-rolls","kind":"custody","anchor":"For the Mormon Battalion, choose M351 roll 1 for A–G, roll 2 for H–R, or roll 3 for S–Z [S76 @2026-11-21]. For a physical film search, use the roll list and confirm the viewing location, following the route from the available excerpt [S73 @2026-11-21] [S89 @2026-11-21].","sources":["S76","S73","S89"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-tippecanoe-t1085","kind":"custody","anchor":"**Battle of Tippecanoe, November 1811.** Look up T1085 in NARA's Microfilm Catalog, following the lead from the available excerpt of the microfilm talk [S73 @2026-11-21]. Use the single roll for both militia and Regular Army muster and pay records [S77 @2026-11-21] [S89 @2026-11-21]. Check current viewing listings and include the Indiana State Library's microform holdings as a separate option [S78 @2026-11-21].","sources":["S73","S77","S89","S78"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-regular-roster","kind":"custody","anchor":"**Mexican War regular Army units.** Follow the unit-roster lead from the available excerpt of the Treasury talk [S71 @2026-11-21]. Search the Second Auditor's *Roster of Officers and Regular Army Units Serving in the Mexican War*, January 1845–January 1850, RG 217, §217.7.3, NAID 2580614 [S38 @2026-11-21] [S72 @2026-11-21]. Carry the unit, commanding officer and any payment date or paymaster named into the search for unit rolls and individual service records.","sources":["S71","S38","S72"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-second-auditor-paymasters-rolls","kind":"custody","anchor":"**Army paymasters' accounts.** Follow the parallel rolls search from the available excerpt of the Treasury talk [S71 @2026-11-21]. If the settled Army paymaster accounts (1815–1861) lack the roll you need, search the separately listed muster rolls and payrolls (1815–1866) in the Second Auditor's Archives Division, RG 217, §217.7.7 [S38 @2026-11-21].","sources":["S71","S38"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-colonial-gooch-recruitment","kind":"method","anchor":"**Colonial Southern militia and Gooch's American Regiment.** Use Murtie June Clark's *Colonial Soldiers of the South, 1732–1774*. In the 1983 edition, start at page 1 for the Maryland Militia and page 125 for Gooch's Regiment, following the chapter leads from the available excerpt [S85] [S86]. Keep a regiment match open for men recruited in Northern colonies too. Rhode Island recruiting correspondence is one route to check colony of enlistment independently of the compilation's title [S87].","sources":["S85","S86","S87"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolution-record-search-status","kind":"custody","anchor":"**Revolutionary War search misses.** Follow the search-status distinction from the available excerpt of the Strauss interview [S66 @2026-11-21]. Check the series description and finding aid for surviving coverage. Record holdings without searchable images as unsearched unless you actually examined them, and record losses only where a source identifies the affected records [S67 @2026-11-21].","sources":["S66","S67"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolution-outside-federal-holdings","kind":"custody","anchor":"Limit a negative federal search to the series examined. Follow the repository leads from the available excerpt of the interview [S66 @2026-11-21]. For state-only militia, check the relevant state archive or county records [S67 @2026-11-21]. Check the DAR Library's Patriot Records Project Index as a separate route and carry a hit's source locator to the underlying record [S70 @2026-11-21].","sources":["S66","S67","S70"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-teamster-routes","kind":"portal-availability","anchor":"**Mexican War teamsters.** Keep enlisted duty and civilian employment open. For suspected volunteer service, check FamilySearch's M616 index and follow a hit to the CMSR [S75 @2026-11-21] [S90 @2026-11-21]. Treat a miss as leaving civilian employment possible, following the advice from the available excerpt [S83 @2026-11-21]. Test Regular Army enlistment separately with the Register (§1). Congress authorized teamster positions in some Regular Army units in 1847 [S84 @2026-11-21]. Look for a hiring, contract or pay record that identifies the man as a civilian before assigning that status.","sources":["S75","S90","S83","S84"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-gooch-rations-enumeration","kind":"method","anchor":"**Gooch's Regiment ration lists.** Follow the record-type lead from the available excerpt of the Gooch's Regiment talk [S85]. If a ship's list records soldiers “borne for victuals only”, label the entry as enumeration of people provisioned on that ship. Carry the ship and date to the relevant service records for any claim about enlistment, duty or home colony [S88].","sources":["S85","S88"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pennsylvania-militia-duty-dates","kind":"custody","anchor":"**Pennsylvania Revolutionary militia.** Use the Pennsylvania State Archives' Revolutionary War Military Abstract Card File, series 13.50, to locate the underlying county and battalion record [S65 @2026-11-21]. Check that record for rank, class, captain's company, battalion and any stated dates [S64 @2026-11-21]. Carry the recorded duty status with the date so that a roster date alone cannot establish a tour.","sources":["S65","S64"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolution-reference-request-locator","kind":"method","anchor":"For a draft Revolutionary War reference request, record the exact National Archives record group and series or subseries title. Add the entry or National Archives identifier when listed. Use the series description to name the target in the draft, following the advice from the available excerpt of the Strauss interview [S66] [S67].","sources":["S66","S67"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-regular-army-enlistment-papers","kind":"custody","anchor":"**Regular Army enlistment papers.** After identifying the man in the Register, search the separate Regular Army Enlistment Papers, 1798–1894, in RG 94, entry 91, by surname. Look separately for papers covering each enlistment. Use the contract lead from the available excerpt [S91 @2026-11-22] and keep this series distinct from the Personal Papers in RG 94 [S92 @2026-11-22].","sources":["S91","S92"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-regular-army-regimental-returns","kind":"portal-availability","anchor":"**Regular Army regimental returns.** For a unit's station or company commander, browse the monthly returns by regiment and date. Use M665 for infantry, M744 for cavalry and dragoons, or M727 for artillery. Follow the matching Ancestry link in NARA's partner table, using the separate infantry and non-infantry lookup from the available excerpt [S91 @2026-11-22] [S92 @2026-11-22] [S24 @2026-11-22]. Use the return to select a company and date for the individual muster-roll search.","sources":["S91","S92","S24"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ainsworth-unit-finding-aid","kind":"portal-availability","anchor":"**Ainsworth List.** If you know the volunteer unit and need to identify the rolls from which its service cards were compiled, browse the FamilySearch catalog entry for T817 by military organization. Follow the unit lookup from the available excerpt [S93 @2026-11-22] [S94 @2026-11-22] [S95 @2026-11-22]. Carry the roll type and covered dates into the record search. Use the list as a unit finding aid.","sources":["S93","S94","S95"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-naval-indexes","kind":"portal-availability","anchor":"**Revolutionary naval and maritime records.** Search the surname and known vessel in the searchable PDFs of *Naval Documents of the American Revolution*. Use each relevant volume's back index to locate the document and page [S96 @2026-11-22] [S97 @2026-11-22]. Carry the document's date, vessel and the person's recorded role into the service search. For a separate Library of Congress Manuscript Division lookup, use the index to Charles Henry Lincoln's *Naval Records of the American Revolution, 1775–1788*, following the book lead from the available excerpt [S98 @2026-11-22] [S99 @2026-11-22].","sources":["S96","S97","S98","S99"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-constitution-navy-roll-dates","kind":"custody","anchor":"**USS Constitution sailors.** Start with the RG 45 vessel muster rolls and payrolls (NAID 1813771). Use the ship chronology to date the crew's service, following the ship-history lead from the available excerpt [S100 @2026-11-22]. For this ship, start in 1798, when the first crew sailed, and keep the 1797 launch date separate. Use the ship name and period to select the returns [S101 @2026-11-22] [S58 @2026-11-22].","sources":["S100","S101","S58"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-callahan-navy-marine-officers","kind":"method","anchor":"**Navy and Marine Corps officers.** Follow the officer-register lead from the available excerpt [S93]. Search Edward W. Callahan's *List of Officers of the Navy of the United States and of the Marine Corps, from 1775 to 1900*. Use the appointments, ranks and dated service to select the officer and the underlying records. Route enlisted sailors and Marines to their respective rolls and enlistment records [S102] [S92] [S103].","sources":["S93","S102","S92","S103"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-navy-enlistment","kind":"portal-availability","anchor":"**Civil War Regular Army, Navy and Marines.** Limit a volunteer CMSR miss to the volunteer series. Use the Regular Army route above for soldiers, ship and enlistment records for U.S. Navy sailors and the separate Marine Corps rolls for U.S. Marines, following the branch distinction from the available excerpt [S104 @2026-11-22] [S92 @2026-11-22] [S105 @2026-11-22]. For an enlisted Navy candidate, search T1099, the Civil War index to rendezvous reports. Check FamilySearch's M1953 weekly enlistment returns, then use the enlistment place or ship to find the corresponding personnel or muster entry [S106 @2026-11-22] [S103 @2026-11-22].","sources":["S104","S92","S105","S106","S103"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-pennsylvania-civil-war-regimental-records","kind":"custody","anchor":"**Pennsylvania Union units.** Use the surname in the Pennsylvania State Archives' Civil War Veterans Card File (RG 19, series 19.12) to find Bates's *History of Pennsylvania Volunteers* and identify the unit. Carry the regiment and company to the separate Civil War Muster Rolls and Related Records (RG 19, series 19.11). Include Pennsylvania-raised U.S. Colored Troops in the state search [S107 @2026-11-22] [S108 @2026-11-22] [S109 @2026-11-22].","sources":["S107","S108","S109"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-volunteer-and-sailor-index","kind":"portal-availability","anchor":"**Mexican War soldiers and sailors.** Search the National Park Service's *U.S. Mexican War Soldiers & Sailors Database* as a lead to branch and unit [S110 @2026-11-22] [S111 @2026-11-22]. For an Army volunteer, check M616 and use the unit to find the compiled file as described below. Keep the Register of Enlistments open for Regular Army enlistment [S75 @2026-11-22]. Route sailors to the Navy sources below.","sources":["S110","S111","S75"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-index-fields","kind":"portal-availability","anchor":"**Mexican War research by dated event.** Use birth, enlistment or discharge details from MyHeritage's *United States, Mexican-American War Soldiers and Sailors* to narrow a same-name match. Check the dates individually, including earlier appointments or enlistments when listed. Use the relevant service series to confirm each event and leave the wartime unit open until the evidence connects it to the person [S112 @2026-11-22] [S113 @2026-11-22] [S111 @2026-11-22].","sources":["S112","S113","S111"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-colonial-virginia-pre-revolution-service","kind":"method","anchor":"**Earlier colonial Virginia service.** For a Virginia Revolutionary officer or soldier, open a separate search for earlier colonial service in Lloyd DeWitt Bockstruck's *Virginia's Colonial Soldiers* and Murtie June Clark's *Colonial Soldiers of the South, 1732–1774*, following the lookup from the available excerpt of each source [S114] [S115] [S116] [S117] [S123]. For a militia lead, also check William Armstrong Crozier's *Virginia Colonial Militia, 1651–1776* [S121]. Follow a hit to the named county record, roll or claim. Establish identity across conflicts before using the earlier entry to explain later rank [S118] [S86].","sources":["S114","S115","S116","S117","S123","S121","S118","S86"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dunmores-war-claims-and-payrolls","kind":"custody","anchor":"**Lord Dunmore's War, 1774.** Classify service at Point Pleasant as colonial Virginia militia and establish any Revolutionary service separately. Search Skidmore and Kaminsky's *Lord Dunmore's Little War of 1774* for the captain, participant, horse-hire and scouting-pay leads from the available excerpt of each source [S114 @2026-11-22] [S119 @2026-11-22] [S120 @2026-11-22]. Search the Library of Virginia claims ledger by name and browse its unindexed pages if needed. Distinguish time served from goods and services paid for. Use reel 78 for the separate vouchers and payrolls. For transcribed documents, use Thwaites and Kellogg's *Documentary History of Dunmore's War* and cite the edition consulted [S121 @2026-11-22] [S122 @2026-11-22].","sources":["S114","S119","S120","S121","S122"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-pennsylvania-provincial-rolls","kind":"custody","anchor":"**Pennsylvania provincial service.** For a French and Indian War candidate missing from a national index, use the *Officers and Soldiers in the Service of the Province of Pennsylvania, 1744–1765* section of *Pennsylvania Archives*, Fifth Series, volume 1 (digitized roll 2069), and the Pennsylvania State Archives' RG 4 provincial muster rolls and military returns. Search by unit or officer when the name search fails, following the state-record route from the available excerpt [S123 @2026-11-22] [S124 @2026-11-22] [S125 @2026-11-22].","sources":["S123","S124","S125"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-maryland-revolutionary-militia-and-rolls","kind":"portal-availability","anchor":"**Maryland Revolutionary service.** Search the index to *Archives of Maryland*, volume 18, then open the named roll, return or other record. For suspected militia service with an unknown county, start with Clements and Wright's *The Maryland Militia in the Revolutionary War* and carry the company or officer to the Maryland State Archives indexes. Follow the references from the available excerpt [S126 @2026-11-22] [S127 @2026-11-22] [S128 @2026-11-22]. A miss in the volume or militia compilation leaves the other Maryland series open.","sources":["S126","S127","S128"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-south-carolina-revolutionary-volunteer-and-line","kind":"method","anchor":"**South Carolina Revolutionary units.** For service in 1775, check *South Carolina Provincial Troops* for the provincial rolls and returns. For a South Carolina Continental Line clue, search Alexander S. Salley's *Records of the Regiments of the South Carolina Line in the Revolutionary War*. For a name with the service type still open, use Bobby Gilmer Moss's *Roster of South Carolina Patriots in the American Revolution* to recover unit, officer and source leads. Follow the book choices from the available excerpt of each source [S115] [S116] and test any match against the cited record [S129] [S130] [S131].","sources":["S115","S116","S129","S130","S131"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-philippine-insurrection-volunteer-indexes","kind":"custody","anchor":"**Volunteers in the Philippines.** Use the National Archives' Philippine Insurrection guide, following the reference from the available excerpt [S93 @2026-11-22]. Start in M872 for the volunteer compiled-service index. Try M871 as well when service may have begun during the War with Spain. Carry the indexed unit and rank to the compiled file. For Regular Army service, follow the separate enlisted and officer routes [S132 @2026-11-22].","sources":["S93","S132"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-volunteer-index-coverage","kind":"portal-availability","anchor":"**MyHeritage volunteer lookups.** Use the separate *Soldiers who Served in Volunteer Organizations* collections for the War of 1812 and the War with Spain. Capture the regiment and recorded ranks. When the entry supplies an image, open it and identify whether it shows an index card or an abstract from the compiled file before marking the file searched [S133 @2026-11-22] [S134 @2026-11-22] [S135 @2026-11-22] [S10 @2026-11-22].","sources":["S133","S134","S135","S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-lake-erie-branch-coverage","kind":"method","anchor":"**Lake Erie Squadron, War of 1812.** Use Eric E. Johnson's *The Men of the Lake Erie Squadron, 1813–1825* to identify the ship and the man's service branch. Carry the ship and date into Navy or Marine rolls and keep the Regular Army and state militia routes open for men supplied from those forces. Follow the cross-branch lead from the available excerpt [S136] [S137].","sources":["S136","S137"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-of-1812-regular-and-militia-compilations","kind":"method","anchor":"**War of 1812 compilations by service type.** For a Tennessean in the U.S. Army, use Eric E. Johnson's *Tennessee Regulars in the War of 1812* and carry the unit to the Register of Enlistments. Search Tennessee militia separately. For Black soldiers whose service type is unclear, use Johnson's expanded *Black Regulars and Militiamen in the War of 1812*, which covers both, and verify the indicated service in the corresponding records. Follow the edition and coverage leads from the available excerpt of each source [S138] [S139] [S140] [S141].","sources":["S138","S139","S140","S141"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-spanish-american-war-volunteer-file-coverage","kind":"portal-availability","anchor":"**Spanish-American War volunteer file coverage.** Search M871 for the volunteer's name and unit, then use the state, arm and regiment to locate the full compiled service record in RG 94, *Carded Service Records of Volunteer Organizations: Spanish-American War, 1898* (NAID 300400) [S10 @2026-11-23]. Read the cards as abstracts of the stated muster rolls or other regimental papers. For the 1st Florida Infantry, go directly to the M1087 compiled files at Fold3 or Ancestry. Follow the distinction between index and file from the available excerpt [S93 @2026-11-23] [S142 @2026-11-23] [S143 @2026-11-23] [S24 @2026-11-23]. Mark an indexed file you have yet to examine as unsearched.","sources":["S10","S93","S142","S143","S24"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-rolls-and-card-abstracts","kind":"portal-availability","anchor":"**Revolutionary War rolls behind the compiled file.** When a pension survives, use its stated unit and tour to choose among same-name compiled files. For each card, record the source named on it and the dates of that tour. Use the unit, date and cited roll type to browse RG 93, M246, at Fold3 or FamilySearch. Compare the M881 card with the matching roll when it survives. Label each image by what it reproduces, a roll or a card abstract. Build a dated service timeline with each enlistment, muster, commanding officer and individual status where recorded. Keep separate tours and leave unsourced intervals open. Follow the roll and pension comparisons from the available excerpt of each source [S144 @2026-11-22] [S145 @2026-11-22] [S116 @2026-11-22] [S146 @2026-11-22] [S92 @2026-11-22] [S147 @2026-11-22] [S148 @2026-11-22] [S149 @2026-11-22].","sources":["S144","S145","S116","S146","S92","S147","S148","S149"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-roll-date-and-status","kind":"method","anchor":"**Revolutionary War company muster rolls.** Find the regiment and company, then scan the relevant rank group. Read the column heading to distinguish an officer's commission or appointment from an enlisted man's enlistment date. Record status and its date before placing the person with the unit. A furlough entry can leave the company at a place while the soldier was elsewhere. Follow the individual-status check from the available excerpt [S116] and the available excerpt [S150] [S147].","sources":["S116","S150","S147"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-unit-events-versus-individual-status","kind":"method","anchor":"**Unit events and individual presence.** Use a volunteer company's record of events to date its movements, stations and engagements. Follow the unit-history lead from the available excerpt [S151] [S116]. Use the named individual's muster status or other service evidence to establish presence at an engagement. Keep the company's or captain's activity separate from the person's documented actions [S152] [S105].","sources":["S151","S116","S152","S105"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-south-carolina-indent-audited-account","kind":"custody","anchor":"**South Carolina Revolutionary War audited accounts.** Carry a referenced indent's full number and letter into the search for the claimant in series S108092. Compare the numbered certificate or receipt with its stub in S218110 when needed to distinguish names or claims. Read the service or goods description before labeling the transaction. Follow the indent-to-account lead from the available excerpt [S116 @2026-11-22] [S153 @2026-11-22].","sources":["S116","S153"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-virginia-revolutionary-organization-guide","kind":"method","anchor":"**Virginia Revolutionary unit names.** Use E. M. Sanchez-Saavedra's *A Guide to Virginia Military Organizations in the American Revolution, 1774–1787* to identify the dated organization. Check named Continental units as well as numbered regiments. Use the guide's index to locate the unit and carry confirmed variant names into the rolls search. Use a known company and captain to narrow the county lead. Follow the organization and company leads from the available excerpt [S154] [S155] [S156] [S157].","sources":["S154","S155","S156","S157"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-leftwich-brigade-roster-lookup","kind":"method","anchor":"**Virginia militia in Leftwich's brigade.** Start with the wartime commander in Butler's *A Guide to Virginia Militia Units in the War of 1812*. Check the brigade material in the guide and search the troop roster in his *Real Patriots and Heroic Soldiers* even if the narrative index has no entry. Carry the company captain from the roster back to the guide's county listings to identify the county regiment. Record both unit designations and verify the man's company in the rolls. Follow the two-book search from the available excerpt [S158] [S159] [S52].","sources":["S158","S159","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-point-pleasant-attached-companies","kind":"historical","anchor":"**Point Pleasant company attachments.** Use Isaac Shelby's 16 October 1774 letter to distinguish the companies in the first divisions from those that reinforced them. Look for a captain under his independent company name and under the formation he joined. Treat the letter as an account of unit movements and check a roll, pay claim or other individual record for the soldier. Follow the company trail from the available excerpt [S119] [S160] [S161].","sources":["S119","S160","S161"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-texas-guard-federal-company-letter","kind":"historical","anchor":"**Texas company letters in federal service.** For the War with Spain, search First Infantry, Texas Volunteer Guard, companies B, F, G and H under their federal designations in the First Texas Volunteers. Map B to A, F to C, G to D and H to E. In the Second Infantry, Texas Volunteer Guard, route Company D (Calvert City Guards) to Company M and Company K to Company A, both in the Second Texas Volunteers. Keep the state and federal designations with their own rolls, following the crosswalk from the available excerpt [S93] [S162].","sources":["S93","S162"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-continental-unit-recruiting-place","kind":"method","anchor":"**Continental unit recruiting places.** Check the Lineages section in Robert K. Wright Jr.'s *The Continental Army* for where the regiment or company was organized and which companies made it up. Use the printed edition when a digital edition omits the lineages. Enter the documented recruiting area for the relevant date in the candidate-separation table. Follow the lineage lookup from the available excerpt of each source [S115] [S116] [S163].","sources":["S115","S116","S163"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-georgia-continental-recruiting-outside-state","kind":"historical","anchor":"**Georgia Continental recruits from other states.** Keep Georgia service open when a candidate lived outside Georgia. Use the cross-state lead from the available excerpt [S164] and check the dated regiment lineages. Wright places recruitment for the 2d Georgia primarily in Virginia, the 3d in North Carolina and the 4th in Pennsylvania. Use the unit's name for the relevant date when searching the rolls [S163].","sources":["S164","S163"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-regular-officer-appointment","kind":"method","anchor":"**Regular Army officer appointments.** When a pension list gives a rank and state without a service type, compare both with the dated appointments in volume 1 of Heitman's *Historical Register and Dictionary of the United States Army*. Use the earlier explicitly named unit as a search lead when a later appointment omits the unit. Verify the later unit in the record for that appointment. Follow the sequence from the available excerpt [S165] [S166] [S132].","sources":["S165","S166","S132"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-m233-roll-selection","kind":"method","anchor":"**Select an M233 roll.** Match the enlistment period and surname range in the roll list. Use rolls 1–13 for 1798 through May 17, 1815, and rolls 14–17 for May 17, 1815 through June 30, 1821. Check both groups at the May 1815 boundary and check rolls 14–17 as well as roll 18 for June 1821. In the later volumes, use the surname initial and enlistment year and month to locate the entry with the volume's arrangement [S174] [S175]. Follow the arrangement lead from the available excerpt [S91].","sources":["S174","S175","S91"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-m233-facing-page-remarks","kind":"method","anchor":"**Read both pages of the Register entry.** If the spread is split across images, open the facing page and match the soldier's entry number or row position across the spread. Read the corresponding Remarks and carry any cited recruiting return or muster roll into the next search [S175]. Follow the facing-page lead from the available excerpt [S91].","sources":["S175","S91"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-carded-medical-records","kind":"custody","anchor":"**Mexican War treatment records.** Use the soldier's service type and organization to choose the carded medical series in National Archives RG 94. For volunteers use PI-17 entry 534 (NAID 655646), arranged by state, numbered organization and surname initial. Look after the Civil War cards for that organization. For Regular Army enlisted men and noncommissioned officers use PI-17 entry 529 (NAID 655638), arranged by regiment number, unit type and surname initial. Check the military service records for a Regular Army commissioned officer's medical cards. Record the hospital, admission date and disposition where given [S168 @2026-11-23]. Follow the Mexican War medical-card lead from the available excerpt [S167 @2026-11-23].","sources":["S168","S167"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-missouri-military-service-cards","kind":"portal-availability","anchor":"**Missouri service cards.** For someone who entered military service from Missouri, search the Missouri State Archives' *Soldier's Records: War of 1812 - World War I* by name or unit and use the conflict filter when known [S170 @2026-11-23] [S171 @2026-11-23]. Use MyHeritage's *Missouri Soldiers, War of 1812 to World War I* as another index [S169 @2026-11-23] [S172 @2026-11-23]. Open the service-card image where available. Copy the residence, birthplace, age or birth date, enlistment place and date, unit, service dates and any discharge notation the card gives. Use those clues to choose the underlying rolls or service file [S170 @2026-11-23] [S171 @2026-11-23].","sources":["S170","S171","S169","S172"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-natf-form-86-eligibility","kind":"custody","anchor":"**Order an older Army service record.** When an eligible Army service file is still needed, use NATF Form 86 for the identified organization and prepare a separate form for each organization. Check the form's service limits. It covers federal volunteer service from 1775 through 1902, Confederate service from 1861 through 1865, and Regular Army records retrievable by name for enlisted men who served before October 31, 1912 and officers who served before June 30, 1917. Use the branch-specific routes in §1 for Navy and Marine Corps service and the pension-file recipe for pension or bounty-land applications [S177 @2026-11-23] [S178 @2026-11-23]. Use the Form 86 lead from the available excerpt and apply NARA's branch and date limits [S176 @2026-11-23].","sources":["S177","S178","S176"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-moores-creek-battle-rosters","kind":"method","anchor":"**Moores Creek Bridge.** Use Bobby Gilmer Moss's separate *Roster of the Patriots in the Battle of Moores Creek Bridge* and *Roster of the Loyalists in the Battle of Moores Creek Bridge*. Choose by the suspected affiliation and search both if it is unclear. Follow the entry's cited records to establish the person's service or presence at the battle [S173]. Follow the battle-specific book lead from the available excerpt [S115].","sources":["S173","S115"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-m233-repeat-enlistments","kind":"method","anchor":"**Repeat enlistments in M233.** Open all plausible same-name entries and order them by enlistment date. Compare age at enlistment, recorded birthplace, company, regiment and any reenlistment remarks. Test a possible link in the enlistment papers for the separate terms. A change of regiment alone leaves reenlistment possible [S175]. Follow the repeat-enlistment comparison from the available excerpt [S91].","sources":["S175","S91"],"checked":null,"stated_as":"fact","review":"reviewed"}
