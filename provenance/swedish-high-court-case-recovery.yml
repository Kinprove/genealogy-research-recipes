claims:
  - {"id":"C-step-01","kind":"example","anchor":"Copy the parties, places and every decision date in the notice heading. Browse each corresponding protocol date and compare the case descriptions as well as party names. A surname miss in a skim of 9 March 1781 in *Högsta domstolen Prot:1781:1* (p. 653) left the earlier dates in the 23 March *Dagligt Allehanda* notice's 16 February to 9 March decision range open [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-step-02","kind":"method","anchor":"With an incoming date or a lower-court referral, start in the *revisionsdiarier* for civil revision cases and the *besvärsdiarier* for complaints and petitions. Copy the decision date and any later dates. Follow later incoming references back through the diary to the next decision [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-03","kind":"example","anchor":"A protocol index miss leaves the decision-date search open. Browse the dated protocol and its consolidated permission lists, including cousin-marriage and remarriage permissions. In the reported 1792 example, the couple was absent from the index and appeared in *Högsta domstolen Prot:1792:1*, p. 430, image 6140 (NAD SE/RA/1311, ArkivDigital AID `v791181.b6140.s430`). Check that locator in the user's own account [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-step-04","kind":"example","anchor":"In the same 1792 volume, check the Turku and Vaasa appellate headings alongside Swedish and Finnish place and name forms. Include parties whose names give no clue to their locality [S2].","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-step-05","kind":"method","anchor":"Use the decision date to match the protocol and the decision copy or draft (*registratur* or *koncept*). Take that date and any file number to *revisionsakter* for civil revision cases or *utslagshandlingar* for complaints and petitions. Where there is a referral sheet in place of a file, follow its incoming date back to the diary. For a death-sentence file, consult Becker's guide at the sections on diaries and incoming papers [S1], [S4], [S5].","sources":["S1","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-06","kind":"method","anchor":"For a marriage petition, record permission and any fine as separate outcomes. Keep the marriage itself open until a marriage record or other independent evidence establishes it [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
