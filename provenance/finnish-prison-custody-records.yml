claims:
  - {"id":"C-01","kind":"method","anchor":"For the Swedish period, search the Swedish archive by the issuing authority and prison. For the 1799–1800 Turku Castle and Häme Castle lists, carry *Justitiekanslern, Huvudarkivet* EIIIcc:261 and EIIIcc:269 into the catalogue. For each admission or release copy the date, sending official and stated reason when present [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"For autonomy-era Crown-prison lists, search Astia for *vankiluettelot* under *Prokuraattorin toimituskunnan arkisto*. In Eoa follow the date and the sending prison to the list that covers that institution. Then search the receiving prison’s or spinning house’s own archive for its admission [S1 @2026-11-23] [S3 @2026-11-23].","sources":["S1","S3"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"If the order specifies Lappeenranta spinning house, check its admission register by arrival window for the date and the recorded age. For the March 1873 example, the community post locates the admission in I Ba:11 [S3] [S1].","sources":["S3","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Use a wanted notice to locate the sentencing court and describe the escape or alleged offense as the notice reports it. Keep the penal destination as an order and follow dated prison admissions and departures to test whether it was reached. A prisoner assigned to Viapori in the reported 1799 case instead returned to Turku Castle to await another hearing [S2].","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"If a provincial wanted notice names a village and farm, take those locators into the communion book. Compare the name and marital status before using the preceding volume to recover the earlier household [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Give pretrial admission, dispatch to court, hearing or sentence, return to custody, penal dispatch and arrival one row each. Pair each dispatch with a dated receipt or admission at the destination. Leave the departure date open if the only later date is receipt of an appellate decision [S2] [S3].","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Start with the admission name even if a later report uses a different one. Read annotations beside the original entry for a recorded identification and carry both names into the next custody search [S3].","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"example","anchor":"Keep a later omission separate from an earlier documented arrival. The reported Viipuri-to-Kuopio case has a March arrival and no entry found in the April list [S3].","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"If the person disappears from the sequence, check prison-list remarks and departures for an escape even if the newspapers yield no report. Use the date in the prison record for the escape and retain the newspaper search as a separate observation [S3] [S2].","sources":["S3","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
