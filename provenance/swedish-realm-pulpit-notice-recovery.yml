claims:
  - {"id":"C-step-01","kind":"method","anchor":"Start with the 1800 Finnish *Yhteenweto* for texts prescribed for repeated reading. Find the ordinance or proclamation, then copy the reading season and stated local or realm-wide scope. If the text is missing from the compilation, still search for one-off royal, provincial and local announcements [S1], [S2], [S5].","sources":["S1","S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-02","kind":"method","anchor":"For instructions sent by the Porvoo cathedral chapter, look up the occasion in A. J. Hornborg's 1872 *Sammandrag* of circular letters for 1725–1829. Copy the dispatch date and identify the occasion named in the instruction. Trace an unclear instruction or absent appointed day to the circular itself [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-03","kind":"method","anchor":"A reading order establishes what was prescribed. Establish the local reading separately. Record the event, instruction or dispatch, intended reading, reported local observance and newspaper issue date in separate fields. Search *Posttidningar* for reports from the named parish and compare nearby places. A shared local date is a lead for the intended Sunday. Preserve each report's own geographic scope. If a parish is missing on the expected day, compare that date with the dispatch date and keep delayed delivery open. For a dated comparison, use the Porvoo and Hämeenlinna reports in the 24 March 1746 issue [S3], [S6].","sources":["S3","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-04","kind":"method","anchor":"Read the geographic scope from the source's own wording. For a newspaper report of a Stockholm service, keep other localities open until the mandate or another report gives that wider scope. Treat reported battle losses in an observance account as claims requiring independent evidence [S6].","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
