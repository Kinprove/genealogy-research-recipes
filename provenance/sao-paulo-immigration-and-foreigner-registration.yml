claims:
  - {"id":"C-bd22042be90c","kind":"portal-availability","anchor":"Search the São Paulo Immigration Cards collection by name and arrival clue. Use MyHeritage’s collection or FamilySearch collection 2140223, whose description identifies consular cards presented at Santos by both visitors and immigrants [S1 @2026-11-22] [S2 @2026-11-22]. Open the image and record the document type, issuance date, any separately recorded port and date of arrival, declared residence, birthplace, nationality and parents. Check the image for a passport photograph and retain its locator [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5da86bd25fc2","kind":"method","anchor":"Check whether the document records a completed arrival, temporary entry, transit or a declaration of intended residence. Keep permanent settlement open until another record places the traveler there later [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-76ad347cf3e1","kind":"example","anchor":"In MyHeritage’s worked example, the same collection links an immigration card to later special visa requests [S1]. For the person's own record, check for related document links. If absent, search again by the documented name and identifiers. Record dates, addresses and civil status as stated on each form. Record proposed destinations as intentions and use voyage evidence to establish whether travel occurred.","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6c725ed8f028","kind":"method","anchor":"According to the available excerpt from the community guide, use the foreigner registration card as a lead to the separate dossier [S5†].","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ef2b5a7c3408","kind":"portal-availability","anchor":"Search the São Paulo state archive’s Delegacia de Estrangeiros index if the registration took place in the city of São Paulo. The police registration series differs from the consular cards. Use the registration result to recover the RNE number [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f814de36b395","kind":"custody","anchor":"For the Arquivo Nacional’s 1939–1987 prontuários, route by place of registration. The archive places Southern and Southeastern registrations in Rio de Janeiro and the other regions in Brasília. If requesting the federal file, provide the recorded full name, parentage and registration city, plus the RNE number for a registration in the city of São Paulo [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
