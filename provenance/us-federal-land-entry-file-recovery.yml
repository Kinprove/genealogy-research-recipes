claims:
  - {"id":"C-721e97c769af","kind":"unclassified","anchor":"Use this recipe when a person may have acquired federal public-domain land, whether by military bounty-land warrant, cash entry or homestead. It also applies when your only clue is a BLM General Land Office (GLO) patent hit, the bounty-land number on a pension card, or a final-proof notice. The patent is only the last step of a federal land entry. Follow the patent, or the lack of one, through the legal description, the tract book and the bounty-land series to the land-entry case file in National Archives (NARA) Record Group 49. Keep veteran, heir, assignee, locator and patentee as separate roles.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-37cb2d939166","kind":"unclassified","anchor":"Overlapping steps belong to sibling recipes. For the pension and bounty-land *application* packet and its custodian, use [military pension file recovery](us-military-pension-file-recovery.md). For warrant/survey/patent stages and later county conveyances, use [land index and book-series recovery](land-index-book-series-recovery.md). For packet-versus-selected-image boundaries, use [Ancestry record search recovery](ancestry-record-search-recovery.md). For identity and kinship rulings, use [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3e898dba4102","kind":"unclassified","anchor":"- Stopping at the patent image. The digitized GLO item is the final grant or warrant image, often a single page. It is not the entry file. [S1], [S4], [S5]\n- Treating a failed GLO name search as proof that no claim existed. The GLO site indexes completed patents. Cancelled, relinquished or otherwise incomplete entries never became patents and do not appear there. [S3], [S14]\n- Searching BLM-GLO or RG 49 for the original grant of land in a state-land state, such as Pennsylvania, Virginia, Kentucky, Tennessee or Texas. The first grant there did not come from the federal land office. [S15]\n- Merging the bounty-land warrant *application* with the land *entry* file. They are separate series. The application files are in RG 15 and the entry files are in RG 49. [S2], [S1]\n- Assuming that the person who located a warrant served, was related to the veteran or lived on the land. [S1], [S8], [S9], [S10], [S13]\n- Reading a patent, or a neighbouring patentee, as evidence of residence. [S11]","sources":["S1","S4","S5","S3","S14","S15","S2","S8","S9","S10","S13","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d930fef80b1e","kind":"unclassified","anchor":"Before querying BLM-GLO or NARA RG 49, confirm that the land lies in a public-land state [S15]:","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-412be2fb341b","kind":"unclassified","anchor":"Two cautions. In Tennessee, the United States held title to the land south and west of the Congressional Reservation Line from 1806 to 1846, but Tennessee issued the grants [S16]. In Ohio, a public-land state, land in the Virginia Military District began with Virginia warrants; its patents can still be found on BLM-GLO [S17].","sources":["S16","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5f4c1c55ec0b","kind":"unclassified","anchor":"Start an entry-routing row for each GLO hit. Record the authority (military warrant, cash sale, homestead or another act), the act year, the acreage, the Document Nr. and the Accession Nr. as separate labelled fields, any warrant number, the land office and the legal description. The authority field classifies the entry. A military-warrant authority means the entry was not a cash sale or a homestead. In the Strauss example, the GLO detail showed a military warrant entry of 160 acres, file number 36643, under the bounty-land act of 1855. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-487c08cca59e","kind":"unclassified","anchor":"If you have a pension or bounty-land index card, compare its BLWT number with the GLO hit. A BLWT number has three parts in this order: warrant/file number, acreage and act year (for example 36643-160-55). In Strauss's example all three matched the patent record. [S1] If any one part fails to match, treat the patent as belonging to a different warrant or person until you can explain the difference.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b568b9223e1c","kind":"unclassified","anchor":"Read the acreage against the act. A veteran who received 40 acres under the 1850 act could receive another 120 acres under the 1855 act, for 160 acres in total. [S2] So one veteran can lie behind more than one warrant and more than one entry. The 1855 act was the last general bounty-land act, but warrants under the 1847–1855 acts kept being issued for decades. Acreage varied by rank and changed with each act. For example, the basic War of 1812 grant of 160 acres was raised to 320 by an 1814 act. [S9], [S12] State bounty-land programmes had their own rules and fall outside this federal route. [S12], [S1]","sources":["S2","S9","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d153c957fd62","kind":"unclassified","anchor":"- **Warrant application file (RG 15):** the declaration by the veteran, widow or heir. It may contain service details, the marriage date and place, the veteran's death, residences and heirs. [S2], [S12] Retrieve it through the pension recipe.\n- **Land-entry case file (RG 49):** the surrendered warrant, where it was located on a tract and, if it was assigned, the signed assignment. The issued warrant itself is in the entry file, not the application file. [S2], [S1]","sources":["S2","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ba457810d686","kind":"unclassified","anchor":"Reading one series does not mean you have searched the other, in either direction. NARA holds the RG 49 land-entry case files, and the surrendered warrants are not online. [S1], [S4], [S5] The GLO site shows whether an entry exists and displays one page. [S1]","sources":["S1","S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-27e86eaa02c4","kind":"unclassified","anchor":"- **Same-name patentees:** separate them by the spouse listed with each entry. In Strauss's search, three entries under one name split into two couples with different wives, and only one couple matched the veteran's widow. [S1]\n- **Assignment:** the Act of 1852 made warrants assignable. Brokers and speculators traded them, and newspapers quoted their prices. [S9], [S10], [S8] In the Strauss example, the widow assigned the warrant to a man whose relationship to the family is unknown. His name appears on the GLO page, and her signed assignment is on the back of the original warrant. [S1] Another presenter found that a War of 1812 veteran's bounty land went to someone else several years after the award. [S13]\n- **Long delay:** a warrant could be entered long after it was issued, so the locator's entry date dates neither the veteran's service nor the assignment. Tanner gives an extreme case from his own experience: a 1930s entry in Davis County, Utah, made with a War of 1812 warrant. This anecdote has not been independently confirmed. [S8], [S10]","sources":["S1","S9","S10","S8","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7f6ca64c0b13","kind":"unclassified","anchor":"A missing name in the GLO index reflects what the index covers. It is not a negative finding. The site indexes completed title records, and BLM states that it does not yet hold every federal title record. [S3], [S14]","sources":["S3","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb586b5c3cbc","kind":"unclassified","anchor":"First check whether NARA publishes a name index to cancelled, rejected or relinquished entries for the land office and period. The National Archives at Kansas City publishes two: the Dodge City and Topeka, Kansas offices (ca. 1905–1937) and the Alliance, Nebraska office (ca. 1869–1950). They list names and dates and need no legal description. To get a hit, request the file from the Kansas City reference staff, as those index pages direct.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb19ed208526","kind":"unclassified","anchor":"- **Newspaper legal notices:** final-proof (intent-to-prove) notices, contests and patent-ready notices, usually in the county's official paper. Final-proof notices ran weekly for several weeks so that adverse claimants could come forward. [S7], [S3] Search for them with the [newspaper recovery recipe](newspapers-com-search-recovery.md). A contest notice points to a disputed entry. It does not show that the claim failed. [S7]\n- **A GLO location search** on that description. In Smith's Kansas example, the claimant was missing from the patentees in his section, yet his entry fit \"with no conflict\". The gap was itself the clue. [S3] The GLO site also has survey plats, field notes and land status records (Master Title Plats) for that location. [S4]\n- **A census civil township**, converted to township and range with a historical county atlas. [S3]","sources":["S7","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ce0a891bf25a","kind":"unclassified","anchor":"Tract books record every transaction on a tract until the government transfers title, including unsuccessful entries. Later transfers are in county deed records. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-698ab1046eda","kind":"unclassified","anchor":"1. Use the tract-book coverage table on the FamilySearch wiki to choose the state or territory and the volume. If the table lists several candidate volumes, browse all of them and expect to search. In Smith's Dakota example, the volume the table gave and the volume where the entry turned up were different (as narrated). [S3]\n2. Log every entry on the tract in order, with its file number and any cancellation or relinquishment notation. In Smith's first example the person was the fourth claimant on one homestead. [S3]\n3. Read several pages before and after the hit. Smith found a second, cancelled claim by the same man this way, under a different file number. That is a second case file to request. [S3]\n4. Note relatives and associates on nearby tracts. Smith found two brothers-in-law close by. Their application file numbers were in the tract book even though they later left. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0eb919c37ea4","kind":"unclassified","anchor":"Check any applicable NARA cancelled-entry name index (§4) first. Without a legal description, Smith calls this search time-consuming and usually unsuccessful. Run it only if all of the following hold [S3]:","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2fcae5c07ae5","kind":"unclassified","anchor":"If you go ahead, convert the census township to township and range, choose the volume from the coverage table and read it page by page. Record every page you inspect, so that an unsuccessful run states exactly what it covered. [S3] Do not search a whole territory.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b740ea7e71a","kind":"unclassified","anchor":"Copy the identifier the NARA request type needs, exactly as GLO or the tract book gives it. For a pre-1908 file, give the state, land office, authority and patent number (GLO's Document Nr.). For a serial file (issue date July 1908 or later), give the serial patent number (GLO's Accession Nr.). For a warrant entry, the request needs the act, the acreage and the warrant number. Then request the case file from NARA. These files cover all 30 federal public-land states. [S4] Tanner points to NARA General Information Leaflet 67 (*Research in the Land Entry Files of the General Land Office*). [S4] NARA has replaced that leaflet with Reference Information Paper 114, and its \"Accessing Land Entry Files\" page explains current access.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2a16e805c0d0","kind":"unclassified","anchor":"Most case files are not digitized, but some are. Before ordering, check the homestead sets that NARA lists as online: Ancestry (Homestead Records, 1863–1908), Fold3 (Homestead Records, Nebraska) and FamilySearch (Homestead Final Certificates, 1863–1909). Serial patent files from the early 1960s onward are often at NARA regional facilities rather than in Washington. [S4], [S5]","sources":["S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-010215ecde3c","kind":"unclassified","anchor":"Inventory the file one document at a time instead of summarizing it. Contents vary. Some files hold only a receipt and the patent, and others are much fuller. [S5] Look for:","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-38ce16d7d667","kind":"unclassified","anchor":"- Application and proof-up papers, which may give an immigrant's original name, place of origin or family arrangements. [S4]\n- Naturalization papers. The 1862 Homestead Act let citizens and people who had filed a declaration of intention make an entry, but citizenship was required by final proof. That makes a declaration or a citizenship certificate a likely item in the packet. [S6] If it names a court, look for the declaration or petition in that court. [S6] Take the court lead to [U.S. immigration search recovery](usa-immigration-search-recovery.md).\n- For warrant entries: the surrendered warrant and any signed assignment on its back. [S1]","sources":["S4","S6","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-192b069bc6e0","kind":"unclassified","anchor":"Run a GLO location search on the entry's township and range, and on the adjacent sections (each about one square mile), to list nearby patentees. [S11] Treat them as candidates for the friends, associates and neighbours (FAN) cluster, not as residents. The presenter's own ancestor owned land in Minnesota as a speculator and never lived there. [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-03e656921049","kind":"custody","anchor":"**Mining claims.** Search the GLO records for a mining claim, as Family Locket's mining guide advises [S20 @2026-11-12], but expect only claims that went to patent. The site gives access to federal land conveyance records [S23 @2026-11-12], and its 2004 glossary names the Mineral Certificate as the document that describes a lode, placer or millsite claim [S21 @2026-11-12]. An unpatented claim was never conveyed, so a GLO miss says nothing about it. Look for its location notice in the records of the county where the claim lies, and in BLM's copies of notices recorded under section 314 of the Federal Land Policy and Management Act [S22 @2026-11-12].","sources":["S23","S21","S22","S20"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-45938d290355","kind":"method","anchor":"- The application or entry date. The patent ends an entry, and the case file can show when it began, often years earlier. Diana Elder found Arkansas patent applications dated four to six years before the earlier patents and two years before the later ones, and used an 1838 application as the earliest date for the man in the county [S18]. Do not read a homestead entry date as the start of residence: a homesteader had six months after filing to take up residence, and at final proof the witnesses testified when actual residence began [S24]. Title came after five years on the land, or after six months' residence and a cash payment [S19]. For any entry, record the entry date as a dated dealing with the land, not as proof that the person lived there.","sources":["S18","S19","S24"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8e97b05ab22c","kind":"custody","anchor":"Ohio has a second exception. Its northeastern counties in the Connecticut Western Reserve and the Firelands were part of Connecticut's western land claims. The Ohio History Connection holds no original entry or survey records for those counties and suggests the Western Reserve Historical Society Library and the Connecticut State Library [S25 @2026-11-13]. For land there, start with those two libraries.","sources":["S25"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
