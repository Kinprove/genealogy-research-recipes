claims:
  - {"id":"C-721e97c769af","kind":"unclassified","anchor":"Use this recipe when a person may have acquired federal public-domain land, whether by military bounty-land warrant, cash entry or homestead. It also applies when your only clue is a BLM General Land Office (GLO) patent hit, the bounty-land number on a pension card, or a final-proof notice. The patent is only the last step of a federal land entry. Follow the patent, or the lack of one, through the legal description, the tract book and the bounty-land series to the land-entry case file in National Archives (NARA) Record Group 49. Keep veteran, heir, assignee, locator and patentee as separate roles.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-37cb2d939166","kind":"unclassified","anchor":"Overlapping steps belong to sibling recipes. For the pension and bounty-land *application* packet and its custodian, use [military pension file recovery](us-military-pension-file-recovery.md). For warrant/survey/patent stages and later county conveyances, use [land index and book-series recovery](land-index-book-series-recovery.md). For packet-versus-selected-image boundaries, use [Ancestry record search recovery](ancestry-record-search-recovery.md). For identity and kinship rulings, use [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3e898dba4102","kind":"unclassified","anchor":"- Stopping at the patent image. The digitized GLO item is the final grant or warrant image, often a single page. It is not the entry file. [S1], [S4], [S5]\n- Treating a failed GLO name search as proof that no claim existed. The GLO site indexes completed patents. Cancelled, relinquished or otherwise incomplete entries never became patents and do not appear there. [S3], [S14]\n- Searching BLM-GLO or RG 49 for the original grant of land in a state-land state, such as Pennsylvania, Virginia, Kentucky, Tennessee or Texas. The first grant there did not come from the federal land office. [S15]\n- Merging the bounty-land warrant *application* with the land *entry* file. They are separate series. The application files are in RG 15 and the entry files are in RG 49. [S2], [S1]\n- Assuming that the person who located a warrant served, was related to the veteran or lived on the land. [S1], [S8], [S9], [S10], [S13]\n- Reading a patent, or a neighbouring patentee, as evidence of residence. [S11]","sources":["S1","S4","S5","S3","S14","S15","S2","S8","S9","S10","S13","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d930fef80b1e","kind":"unclassified","anchor":"Before querying BLM-GLO or NARA RG 49, confirm that the land lies in a public-land state [S15]:","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-412be2fb341b","kind":"unclassified","anchor":"Two cautions. In Tennessee, the United States held title to the land south and west of the Congressional Reservation Line from 1806 to 1846, but Tennessee issued the grants [S16]. In Ohio, a public-land state, land in the Virginia Military District began with Virginia warrants; its patents can still be found on BLM-GLO [S17].","sources":["S16","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5f4c1c55ec0b","kind":"method","anchor":"Start a row for each GLO hit. Copy the authority, act year, acreage, warrant number, land office and legal description. Keep the Document Nr. and Accession Nr. in separate fields. Use the stated authority to distinguish a military warrant from a cash sale or homestead [S1], [S39].","sources":["S1","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-487c08cca59e","kind":"method","anchor":"Match the three parts of the bounty-land number on a pension or warrant index card against the entry. For example, 36643-160-55 means warrant 36643, 160 acres, Act of 1855 [S1]. The warrant number, acreage and authorizing act together identify the surrendered warrant [S39]. If a field differs, retain both references until you can explain the discrepancy.","sources":["S1","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b568b9223e1c","kind":"unclassified","anchor":"Read the acreage against the act. A veteran who received 40 acres under the 1850 act could receive another 120 acres under the 1855 act, for 160 acres in total. [S2] So one veteran can lie behind more than one warrant and more than one entry. The 1855 act was the last general bounty-land act, but warrants under the 1847–1855 acts kept being issued for decades. Acreage varied by rank and changed with each act. For example, the basic War of 1812 grant of 160 acres was raised to 320 by an 1814 act. [S9], [S12] State bounty-land programmes had their own rules and fall outside this federal route. [S12], [S1]","sources":["S2","S9","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d153c957fd62","kind":"unclassified","anchor":"- **Warrant application file (RG 15):** the declaration by the veteran, widow or heir. It may contain service details, the marriage date and place, the veteran's death, residences and heirs. [S2], [S12] Retrieve it through the pension recipe.\n- **Land-entry case file (RG 49):** the surrendered warrant, where it was located on a tract and, if it was assigned, the signed assignment. The issued warrant itself is in the entry file, not the application file. [S2], [S1]","sources":["S2","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ba457810d686","kind":"unclassified","anchor":"Reading one series does not mean you have searched the other, in either direction. NARA holds the RG 49 land-entry case files, and the surrendered warrants are not online. [S1], [S4], [S5] The GLO site shows whether an entry exists and displays one page. [S1]","sources":["S1","S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-27e86eaa02c4","kind":"method","anchor":"- **Namesakes.** Compare each spouse named in the entries with the pension or warrant application. Strauss distinguished two Noah Damons by their wives, Esther and Elizabeth [S1]. Keep separate candidates when the spouse or warrant details conflict.\n- **Assignment.** The Act of 22 March 1852 allowed federal military bounty-land warrants to pass by written assignment [S46]. Read the patent for the assignee, then inspect both sides of the surrendered warrant for the assignor’s name, signature or mark. Strauss reported finding Esther Damon’s signed assignment to Samuel Rice on the back of the warrant [S1]. Record what transferred and look elsewhere for any family relationship.\n- **Long delay.** Date the award, assignment and entry separately. Tanner described a War of 1812 warrant used in a 1930s purchase in Davis County, Utah [S10]. If an entry falls far outside the service period, trace the warrant through its successive holders before identifying the locator [S8], [S9], [S13].","sources":["S1","S46","S10","S8","S9","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7f6ca64c0b13","kind":"unclassified","anchor":"A missing name in the GLO index reflects what the index covers. It is not a negative finding. The site indexes completed title records, and BLM states that it does not yet hold every federal title record. [S3], [S14]","sources":["S3","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb586b5c3cbc","kind":"unclassified","anchor":"First check whether NARA publishes a name index to cancelled, rejected or relinquished entries for the land office and period. The National Archives at Kansas City publishes two: the Dodge City and Topeka, Kansas offices (ca. 1905–1937) and the Alliance, Nebraska office (ca. 1869–1950). They list names and dates and need no legal description. To get a hit, request the file from the Kansas City reference staff, as those index pages direct.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb19ed208526","kind":"method","anchor":"- **Newspaper legal notices:** final-proof (intent-to-prove) notices, contests and patent-ready notices, usually in the county's official paper. Final-proof notices ran weekly for several weeks so that adverse claimants could come forward. [S7], [S3] Search for them with the [newspaper recovery recipe](newspapers-com-search-recovery.md). A contest notice points to a disputed entry. It does not show that the claim failed. [S7]\n- **Neighbouring patents and survey records.** Plot the completed patents around the legal description, then compare the survey plat and field notes [S4], [S23]. A gap consistent with the claimant’s tract is a lead for a tract-book search [S3]. The gap alone cannot identify who entered it.\n- **A census civil township**, converted to township and range with a historical county atlas. [S3]","sources":["S7","S3","S4","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ce0a891bf25a","kind":"unclassified","anchor":"Tract books record every transaction on a tract until the government transfers title, including unsuccessful entries. Later transfers are in county deed records. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-698ab1046eda","kind":"method","anchor":"1. Select possible tract-book volumes from the coverage table for the state or territory, township and range. Check the volume’s own coverage and search neighbouring volumes if needed. In Smith’s Dakota example the table pointed to volume 159, but she reported finding the entry in volume 154 [S3].\n2. Log the successive claimants on the same tract. Copy each file number and any cancellation or relinquishment notation [S3].\n3. Read several pages on either side for other entries by the same claimant. Smith reported finding a cancelled Kansas claim under a different file number from the man’s completed homestead [S3]. Request the files separately.\n4. Copy entries and application numbers for known associates on nearby tracts, including abandoned claims. Use the applications to test the association and later records to establish where the claimants went [S3].","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0eb919c37ea4","kind":"unclassified","anchor":"Check any applicable NARA cancelled-entry name index (§4) first. Without a legal description, Smith calls this search time-consuming and usually unsuccessful. Run it only if all of the following hold [S3]:","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2fcae5c07ae5","kind":"unclassified","anchor":"If you go ahead, convert the census township to township and range, choose the volume from the coverage table and read it page by page. Record every page you inspect, so that an unsuccessful run states exactly what it covered. [S3] Do not search a whole territory.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b740ea7e71a","kind":"unclassified","anchor":"Copy the identifier the NARA request type needs, exactly as GLO or the tract book gives it. For a pre-1908 file, give the state, land office, authority and patent number (GLO's Document Nr.). For a serial file (issue date July 1908 or later), give the serial patent number (GLO's Accession Nr.). For a warrant entry, the request needs the act, the acreage and the warrant number. Then request the case file from NARA. These files cover all 30 federal public-land states. [S4] Tanner points to NARA General Information Leaflet 67 (*Research in the Land Entry Files of the General Land Office*). [S4] NARA has replaced that leaflet with Reference Information Paper 114, and its \"Accessing Land Entry Files\" page explains current access.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2a16e805c0d0","kind":"unclassified","anchor":"Most case files are not digitized, but some are. Before ordering, check the homestead sets that NARA lists as online: Ancestry (Homestead Records, 1863–1908), Fold3 (Homestead Records, Nebraska) and FamilySearch (Homestead Final Certificates, 1863–1909). Serial patent files from the early 1960s onward are often at NARA regional facilities rather than in Washington. [S4], [S5]","sources":["S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-010215ecde3c","kind":"unclassified","anchor":"Inventory the file one document at a time instead of summarizing it. Contents vary. Some files hold only a receipt and the patent, and others are much fuller. [S5] Look for:","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-38ce16d7d667","kind":"unclassified","anchor":"- Application and proof-up papers, which may give an immigrant's original name, place of origin or family arrangements. [S4]\n- Naturalization papers. The 1862 Homestead Act let citizens and people who had filed a declaration of intention make an entry, but citizenship was required by final proof. That makes a declaration or a citizenship certificate a likely item in the packet. [S6] If it names a court, look for the declaration or petition in that court. [S6] Take the court lead to [U.S. immigration search recovery](usa-immigration-search-recovery.md).\n- For warrant entries: the surrendered warrant and any signed assignment on its back. [S1]","sources":["S4","S6","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-192b069bc6e0","kind":"method","anchor":"Use the township, range and adjacent sections to identify nearby patentees [S11]. Put them on a list of possible associates. A patentee could own land from a distance, so check tax, census, deed or case-file evidence for residence before calling anyone a neighbour [S11].","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-03e656921049","kind":"custody","anchor":"**Mining claims.** Search the GLO records for a mining claim, as Family Locket's mining guide advises [S20 @2026-11-12], but expect only claims that went to patent. The site gives access to federal land conveyance records [S23 @2026-11-12], and its 2004 glossary names the Mineral Certificate as the document that describes a lode, placer or millsite claim [S21 @2026-11-12]. An unpatented claim was never conveyed, so a GLO miss says nothing about it. Look for its location notice in the records of the county where the claim lies, and in BLM's copies of notices recorded under section 314 of the Federal Land Policy and Management Act [S22 @2026-11-12].","sources":["S23","S21","S22","S20"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-45938d290355","kind":"method","anchor":"- Record the application, proof and patent dates separately. Elder reported an 1838 application that preceded an Arkansas patent and supplied an earlier dated dealing with the land [S18]. For an 1862 Act homestead, check the claimant’s and witnesses’ final proof for the date residence began. The rules allowed time to settle after filing, and the route to title could involve five years on the land or a shorter residence followed by cash payment [S24], [S19].","sources":["S18","S24","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1e96a6a641e3","kind":"custody","anchor":"A further caution for Ohio: its northeastern counties in the Connecticut Western Reserve and the Firelands were part of Connecticut's western land claims. The Ohio History Connection holds no original entry or survey records for those counties and suggests the Western Reserve Historical Society Library and the Connecticut State Library [S25 @2026-11-13]. For land there, start with those two libraries.","sources":["S25"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-86cbefeb99ae","kind":"method","anchor":"Do not stop a military-bounty warrant search in the veteran’s home state. Once the warrant’s act, acreage and number match an entry (§1), read its land office and legal description to place the tract. Keep that location separate from the warrantee’s residence. [S34], [S35], [S36]","sources":["S34","S35","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03ce29edfedd","kind":"method","anchor":"In Ohio, identify the survey or land division before interpreting a township/range description. The state contains several systems with different numbering; the Virginia Military District uses metes and bounds. Use the Ohio History Connection land-division guide and a period map to select the system, then copy the description in that system instead of forcing every Ohio parcel into one rectangular grid. [S26], [S27], [S28]","sources":["S26","S27","S28"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dca5e02b38e6","kind":"method","anchor":"When a homestead claimant sought military-service credit toward the residence requirement, check the case file for service papers. Carry any recorded unit and service dates into the military-record search. [S29], [S30]","sources":["S29","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cceea98bdaec","kind":"method","anchor":"Read the final-proof witnesses’ answers as a separate source, including how long they knew the claimant, their distances from the tract and any other neighbours they identify. Search neighbouring homestead files for the ancestor as a witness even if the ancestor completed no entry. Witnesses were usually neighbours; the witness role alone establishes neither kinship nor independence from the claimant. [S31], [S29], [S32], [S33]","sources":["S31","S29","S32","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-44e2089692b2","kind":"method","anchor":"When a widow or heir completed a deceased claimant’s homestead, read the succession papers for the claimant’s death date and the successor’s stated relationship. [S31], [S30]","sources":["S31","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c52d352dfb9","kind":"method","anchor":"On a War of 1812 pension envelope, check the upper right corner for bounty-land notes and keep them separate from the pension file number [S38]. According to the presenter, use the bounty-land certificate numbers to search GLO [S37†]. Run a separate search for each warrant and confirm matches by warrant number, acreage awarded and act [S39].","sources":["S38","S37","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-314e72015192","kind":"method","anchor":"**Revolutionary War claims under the 1855 act.** According to the presenter, search under the 1855 act even if the Revolutionary War veteran had already died [S40†]. For a new warrant on that service, check for an eligible widow or, if there was no widow, children who were minors when the act took effect [S42]. The September 28, 1850 act covered specified War of 1812 and post-1790 Indian War service and included commissioned officers who served in the Mexican War [S43]. Keep earlier Revolutionary War warrant authorities in the search [S44].","sources":["S40","S42","S43","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-362446ce927c","kind":"method","anchor":"**Assigned Revolutionary War warrants.** According to the presenter, search GLO for the veteran even if the warrant may have been sold [S40†]. Read the patent for the veteran and any stated assignment. Identify the patentee from the grant clause. A Revolutionary War warrant could underlie a patent issued to someone else [S41]. Carry the warrant into the application search (§2) for evidence of the veteran's service [S44].","sources":["S40","S41","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-290d28fffde6","kind":"method","anchor":"According to the presenter, read the Revolutionary War patent for its service designation [S40†]. If it gives only a line or militia designation, carry that wording into the service search. Use a warrant application or a military service record that identifies the regiment before recording one [S44], [S45].","sources":["S40","S44","S45"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f696af49247d","kind":"method","anchor":"**California.** According to Family Tree Magazine’s California guide, distinguish federal public-land sales from earlier Spanish or Mexican grants [S47†]. Read the patent’s authority before choosing a file series. The 1851 act provided for U.S. patents on confirmed claims based on Spanish or Mexican grants [S48]. For a federal public-land sale, follow the cash-entry route (§§1 and 7) [S39].","sources":["S47","S48","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-109139b0f242","kind":"custody","anchor":"For an earlier Spanish or Mexican grant, check the California State Archives’ *Spanish and Mexican Land Grants* collection for copies of title papers and maps [S49 @2026-11-20].","sources":["S49"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9b9e2e5032be","kind":"method","anchor":"**Early federal Revolutionary War warrants.** Start in the U.S. Military District of Ohio for warrants governed by the 1796 reservation [S50], [S55]. Use the U.S. Military Survey meridian for tracts in that district [S68]. According to the presenter, keep searching past the original January 1800 deadline [S51†]. The 1806 act allowed qualifying unlocated warrants to be placed on reserved tracts before October 1, 1808 [S56].","sources":["S50","S55","S68","S51","S56"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b6f324145791","kind":"method","anchor":"**Warrants exchanged for scrip.** If a qualifying Revolutionary War warrant remained unsatisfied, look for an exchange under the 1830 act. Include eligible U.S.-issued warrants and keep the original issuer in the search [S50], [S57]. According to the presenter, follow the scrip to land outside the original military district [S51†]. For 1830 scrip, search private sales in Ohio, Indiana and Illinois. For scrip under the 1833 expansion, include other public land liable to sale at private entry [S57], [S58].","sources":["S50","S57","S51","S58"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-97f1e893a679","kind":"method","anchor":"**Later locations.** According to the presenter, widen the search when the warrant falls under the 1842 or 1864 legislation [S51†]. For a warrant covered by the 1842 act, search public land open to private entry beyond the original district [S59]. Include later locations of qualifying outstanding Revolutionary War and War of 1812 warrants under the 1864 act. Apply the land rules in force at the location date [S60].","sources":["S51","S59","S60"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-67dce5db6e65","kind":"method","anchor":"Before splitting a hyphenated identifier, check the labels in the record or its series guide. Copy the complete identifier and carry the warrant number, acreage and act forward as separate fields. The order shown for one series may differ from another [S50], [S52].","sources":["S50","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fd1d6df0ac62","kind":"method","anchor":"According to the presenter, check the Revolutionary War pension jacket for a bounty-land notation [S51†]. Read `B. L. Wt.` as bounty-land warrant and record its number and acreage separately from any pension file number. Copy the act year when given, including `55` for 1855 [S44].","sources":["S51","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e0069c7c76bb","kind":"method","anchor":"**Continental service and rank.** According to the presenter, use the early bounty schedules to check service and rank [S51†]. For the September 1776 resolutions, look for Continental Army service through the end of the war or discharge by Congress. Also check for a representative's claim for an officer or soldier killed by the enemy [S61]. Use the acreage as a rank clue. Match 100 acres to a private or noncommissioned officer, 150 to an ensign, 200 to a lieutenant, 300 to a captain, 400 to a major, 450 to a lieutenant colonel and 500 to a colonel [S61]. Under the August 1780 extension, compare 850 acres with brigadier general and 1,100 acres with major general [S62]. Corroborate rank in the warrant or service record.","sources":["S51","S61","S62"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0aa7828e404f","kind":"method","anchor":"**Pension rejection or short service.** According to the presenter, keep searching for bounty land if the pension jacket has a numbered `R` or the pension failed on length of service [S51†]. Check which application the rejection marks [S44]. The 1850 act omitted Revolutionary War service [S43]. Check the 1855 act even when service fell short of the 1832 pension law's six-month minimum [S63]. Check for at least 14 days of service or actual engagement in battle, along with the other 1855 eligibility requirements [S42].","sources":["S51","S44","S43","S63","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f9e65e94acad","kind":"method","anchor":"**Revolutionary War naval service.** According to the presenter, also check the 1856 amendment for naval and Marine Corps claimants [S51†]. Section 4 clarified that the 1855 act covered Revolutionary War naval officers, marines, seamen and other naval personnel, as well as their widows and minor children [S67].","sources":["S51","S67"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f235d055f968","kind":"method","anchor":"**Wagon-masters and teamsters.** According to the presenter, read the award's act before interpreting the acreage or service label [S64†]. Under the 1855 act, check for wartime transport of military stores or supplies under competent authority. Verify the qualifying service in the application papers even when the warrant shows 160 acres [S42].","sources":["S64","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a2d17bf61a8d","kind":"method","anchor":"**Application evidence.** Record the veteran's age and residence at application. Look for a discharge certificate and service affidavits. In an heir's application, log the evidence of service, death and the relationship used to establish heirship [S50], [S65], [S44].","sources":["S50","S65","S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-73572a2902f3","kind":"portal-availability","anchor":"If a pension search is empty, check the separate bounty-land application series. For a Fold3 miss on service from 1812 to 1855 or a disapproved Revolutionary War claim, check NARA Catalog series 567388. NARA lists selected applications there and partial digitization on Fold3 [S50 @2026-11-21], [S53 @2026-11-21].","sources":["S50","S53"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-409a819dda9d","kind":"method","anchor":"**Filmed exceptions for early warrants.** Use the act-specific indexes in Reference Information Paper 114 to find the surrendered warrant [S50], [S52]. For Revolutionary War warrants under the 1788, 1803 and 1806 acts, start with the indexes and registers on M829 roll 1, then follow the warrant number to the filmed records [S66]. Check M848 for early War of 1812 warrants [S52], [S66].","sources":["S50","S52","S66"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-96df2f12d156","kind":"portal-availability","anchor":"For an online copy of M829, use the Ancestry collection listed by NARA [S53 @2026-11-21].","sources":["S53"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f20ac27062af","kind":"method","anchor":"For a War of 1812 warrant under the 1850, 1852 or 1855 acts, check M313 as well as the application files. For Mexican War service, include the 1847 act. For Indian War service, use the application files to fill gaps in the warrant indexes [S50], [S52].","sources":["S50","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-560f1218e1f7","kind":"method","anchor":"If a Revolutionary War application filed before the November 1800 fire is missing, check M804 for a warrant record card compiled from the registers. Label a record card as a reconstruction and a filmed surviving warrant as a copy of that warrant [S50], [S44], [S52].","sources":["S50","S44","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-af4b2d81327b","kind":"custody","anchor":"For a Revolutionary War scrip exchange, use the RG 49 scrip indexes, exchanged warrants, applications and certificate stubs to carry the original warrant into the land-entry search. Keep the scrip certificate number and original warrant number in separate fields [S54 @2026-11-21].","sources":["S54"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-66d997c56230","kind":"method","anchor":"According to the presenter, check both directions of assignment when a name turns up in several bounty-land hits [S64†]. Read the patent to confirm whose service earned each warrant. For the person's own award, follow the warrant naming that person as the original warrantee, including an outgoing assignment. File an incoming assignment of someone else's warrant under the person's acquisitions [S41], [S46].","sources":["S64","S41","S46"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a46dd5442d7b","kind":"method","anchor":"According to the presenter, check the location certificate before treating an 1842 entry as an assignment [S51†]. Under the 1842 act the certificate of location was nonassignable, and the patent issued to the originally entitled person, heirs or legal representatives [S59].","sources":["S51","S59"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-232689fb916a","kind":"method","anchor":"According to the presenter, use [Reference Information Paper 114](https://www.archives.gov/files/publications/ref-info-papers/rip114.pdf) to choose the case-file route [S51†]. Use its searchpath tables for military warrants and for early cash and credit entries [S52].","sources":["S51","S52"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e14ebd8183b4","kind":"method","anchor":"**Virginia Military District.** Check the warrant issuer before selecting either Ohio military district [S27]. According to the presenter, use volume 4 of Clifford Neal Smith’s *Federal Land Series* for Virginia Military District grants [S77†]. Search the name, place or watercourse index in both parts and carry the survey or warrant number into the original records [S94], [S27].","sources":["S27","S77","S94"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1a9f5b1a29f0","kind":"method","anchor":"**Ohio Refugee Tract.** According to the presenter, use this tract label as a Revolutionary War lead [S77†]. Check the claimant against the grants for refugees from Canada and Nova Scotia who sided with the Americans. Verify military service in a separate record [S27].","sources":["S77","S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c97da59c1618","kind":"method","anchor":"**Early War of 1812 warrants.** According to the presenter, include legislation that preceded the war and separate the territory chosen from the parcel allotted [S77†]. Check the December 24, 1811 and January 11, 1812 authorities. Under the May 6, 1812 act, the warrantee designated a territory and drew a quarter section by lot. Use the warrant and patent to identify the actual parcel [S78]. For locations under the April 29, 1816 replacement of the Michigan reservation, search Illinois and Missouri Territory north of the Missouri River. Also check the original allocations in Illinois and the part of Louisiana Territory now in Arkansas [S78], [S79].","sources":["S77","S78","S79"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f5c7f647b3fd","kind":"method","anchor":"According to the presenters, screen same-name bounty-land hits by the authorizing act and by the state, line or unit named for the service [S85†], [S84†]. An 1850 warrant for someone known to have served in the Revolution is a lead to separate qualifying service. Check the War of 1812, post-1790 Indian wars or applicable Mexican War service against the warrant application before assigning the hit [S43], [S44].","sources":["S85","S84","S43","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d915bdd09862","kind":"method","anchor":"According to the presenter, when an 1855 award is below 160 acres, look for an earlier award under a general bounty-land law [S84†]. Match the claimant and service before totaling acreage. Section 1 allowed a top-up to 160 acres for an otherwise eligible recipient of a smaller award. Keep any independently authorized earlier warrants in the search even when the 1855 award itself is for 160 acres [S42].","sources":["S84","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3a244576f440","kind":"portal-availability","anchor":"According to the presenters, check the name coverage of the partial bounty-land index before interpreting a miss [S77† @2026-11-22], [S85† @2026-11-22]. Search within NARA Catalog series 567388 and record the veteran, unit and war when shown. If the name is absent from the searchable subset, use the RG 15 Entry 26 files arranged by veteran’s surname [S53 @2026-11-22], [S93 @2026-11-22].","sources":["S77","S85","S53","S93"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-a4d52912bc66","kind":"method","anchor":"**August 31, 1852 Virginia scrip.** According to the presenter, carry this scrip beyond the Virginia Military District [S77†]. Check for a Virginia Revolutionary War warrant issued or allowed before March 1, 1852 with acreage still unsatisfied. Follow the scrip to federal land open to private entry. Record the original warrantee, the party entitled to scrip and any later assignee separately [S81].","sources":["S77","S81"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0a38773342cc","kind":"method","anchor":"According to the presenter, copy every application number listed for the veteran in Brown’s *Genealogical Abstracts, Revolutionary War Veterans, Scrip Act 1852* [S80†]. Carry each number with the act, names and RG 49 series reference into the scrip application search. Keep the numbers separate from the original warrant number and the scrip certificate number [S82], [S83], [S54]. Check each file for evidence of the soldier’s service and the claimant’s chain of entitlement. According to the presenters, check for copies of wills offered as evidence of descent [S80†], [S77†]. The statute allowed separate shares for people with interests in the same warrant [S81].","sources":["S80","S82","S83","S54","S77","S81"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fcb4adff96a5","kind":"method","anchor":"According to the presenter, check whether the early War of 1812 authority allowed a sale before patent [S77†]. For a bounty under the May 6, 1812 act, section 4 barred pre-patent transfers. If a different party appears on a later deed, date that conveyance against the patent and apply the authority under which the tract was acquired [S78].","sources":["S77","S78"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-63c9b5f8ecff","kind":"method","anchor":"According to the presenters, start a GLO search with the surname in the known locality and include women and people who may have assigned a right without taking title [S88†], [S69†], [S86†], [S87†]. According to the presenter, widen the search beyond the initial state if the name is missing [S77†]. Compare the parties and warrant identifiers before treating a name hit elsewhere as the same entry [S39], [S41], [S46].","sources":["S88","S69","S86","S87","S77","S39","S41","S46"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-aee3915ff02c","kind":"method","anchor":"For a rectangular description in a patent or application, locate the section by principal meridian, township and range. Read nested fractions from the containing division inward. According to the presenters, carry the meridian from the record and plot a nested division such as the east half of a northwest quarter inside that quarter of the section [S88†], [S69†], [S89].","sources":["S88","S69","S89"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d805aec02924","kind":"portal-availability","anchor":"According to the presenter, use a Master Title Plat to orient the parcel within its township [S88† @2026-11-22]. Use the Master Title Plat for land status and the survey plat and field notes for the original survey [S23 @2026-11-22].","sources":["S88","S23"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f75589be12fe","kind":"method","anchor":"According to the presenter, allow for occupation before the federal survey [S77†]. Compare the survey date with any earlier residence or improvements proved in the entry file. The 1842 Florida settlement act expressly contemplated some settlements predating survey [S90].","sources":["S77","S90"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0feae2385ba1","kind":"custody","anchor":"According to the interview, check for a parallel local land record when tracing a Utah homestead [S69† @2026-11-22]. Use the legal description to find the county recorder’s tract abstract and copy its instrument and book and page references [S91 @2026-11-22]. For records of the federal Salt Lake or Vernal land offices or the Utah tract books, check the National Archives at Denver [S92 @2026-11-22].","sources":["S69","S91","S92"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-01ce4303e344","kind":"portal-availability","anchor":"According to the interview, take the patent’s legal description into the digitized [FamilySearch tract-book collection](https://www.familysearch.org/en/search/collection/2074276) [S69† @2026-11-22]. Use the state, township and range to select possible volumes from the collection’s coverage table and browse the images if the name search misses the entry [S76 @2026-11-22].","sources":["S69","S76"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-371921d632c9","kind":"method","anchor":"**Homestead eligibility.** According to the interviews, read the applicant’s stated basis for eligibility and include Black claimants, including formerly enslaved people, in a homestead search [S74†], [S69†]. Under the original 1862 act, check for head-of-family status or age 21, subject to the military age exception, and for citizenship or a filed declaration of intention. Compare the loyalty affidavit with any evidence that the applicant bore arms against the United States or aided its enemies [S19], [S70].","sources":["S74","S69","S19","S70"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fb2f2e035e9b","kind":"method","anchor":"According to the interview, use a woman’s homestead papers to look for her stated marital status and, when given, the basis of her citizenship [S74†]. If the stated status conflicts with other evidence about a spouse, carry the discrepancy to [court case-file recovery](court-case-file-recovery.md) as a lead to search for a divorce decree [S19], [S75].","sources":["S74","S19","S75"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b7247fe7c0e2","kind":"method","anchor":"According to the interview, use the statutory proof window to time the search and check for an early purchase when proof precedes the ordinary term [S69†]. For an ordinary entry under the 1862 act, look for final proof after five years from the filing affidavit and within the next two. For a commuted entry, read the settlement proof and payment receipt against the rules in force for that entry. The original act provided for payment at the applicable minimum price before five years elapsed [S19].","sources":["S69","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5ba4e2e1e0b4","kind":"method","anchor":"According to the interview, account for credited Civil War service when comparing the residence date with final proof [S69†]. Under the 1872 Soldiers’ and Sailors’ Homestead Act, compare qualifying Union service with the credit allowed in the case file. The provision generally deducted time served, used the enlistment term for qualifying disability discharges and still required at least one year on the homestead after improvements began [S73].","sources":["S69","S73"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2445e7616adc","kind":"method","anchor":"According to the interview, extract the household relationships and counts from the claimant’s final-proof testimony even when names are absent [S69†]. Record the actual residence dates, crops and improvements it describes [S71], [S72]. According to the interview, compare how often each witness saw the claimant and which improvements each could describe [S69†]. Match the notice of intent to make proof with any printed clipping and signed proof of publication in the packet [S72].","sources":["S69","S71","S72"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02384fe1b53c","kind":"method","anchor":"**Railroad grants.** According to Family Tree Magazine, trace a historical railroad sale in two legs [S95†]. Read the federal conveyance and its authority to identify the original grantee. If the company received the land under a grant such as the 1862 Pacific Railroad Act, take its name and the legal description to the county deed index and search for its conveyance to the later buyer [S96]. Use [land index and book-series recovery](land-index-book-series-recovery.md) for the deed chain.","sources":["S95","S96"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-70accd881b93","kind":"method","anchor":"According to the presenter, when a spouse’s claim was cancelled after they reported the veteran dead, compare the cancellation with any earlier award to the veteran [S77†]. For an 1850 claim, check whether the veteran had already received land for the same service and record the stated disposition separately from the applicant’s account of the veteran’s death [S43]. According to the presenter, search for an 1855 claimant under her later married surname as well [S77†]. Section 2 allowed a subsequent marriage if she was again widowed when she applied [S42].","sources":["S77","S43","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
