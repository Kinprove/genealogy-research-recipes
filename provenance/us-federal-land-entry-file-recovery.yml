claims:
  - {"id":"C-721e97c769af","kind":"unclassified","anchor":"Use this recipe when a person may have acquired federal public-domain land, whether by military bounty-land warrant, cash entry or homestead. It also applies when your only clue is a BLM General Land Office (GLO) patent hit, the bounty-land number on a pension card, or a final-proof notice. The patent is only the last step of a federal land entry. Follow the patent, or the lack of one, through the legal description, the tract book and the bounty-land series to the land-entry case file in National Archives (NARA) Record Group 49. Keep veteran, heir, assignee, locator and patentee as separate roles.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-37cb2d939166","kind":"unclassified","anchor":"Overlapping steps belong to sibling recipes. For the pension and bounty-land *application* packet and its custodian, use [military pension file recovery](us-military-pension-file-recovery.md). For warrant/survey/patent stages and later county conveyances, use [land index and book-series recovery](land-index-book-series-recovery.md). For packet-versus-selected-image boundaries, use [Ancestry record search recovery](ancestry-record-search-recovery.md). For identity and kinship rulings, use [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3e898dba4102","kind":"unclassified","anchor":"- Stopping at the patent image. The digitized GLO item is the final grant or warrant image, often a single page. It is not the entry file. [S1], [S4], [S5]\n- Treating a failed GLO name search as proof that no claim existed. The GLO site indexes completed patents. Cancelled, relinquished or otherwise incomplete entries never became patents and do not appear there. [S3], [S14]\n- Searching BLM-GLO or RG 49 for the original grant of land in a state-land state, such as Pennsylvania, Virginia, Kentucky, Tennessee or Texas. The first grant there did not come from the federal land office. [S15]\n- Merging the bounty-land warrant *application* with the land *entry* file. They are separate series. The application files are in RG 15 and the entry files are in RG 49. [S2], [S1]\n- Assuming that the person who located a warrant served, was related to the veteran or lived on the land. [S1], [S8], [S9], [S10], [S13]\n- Reading a patent, or a neighbouring patentee, as evidence of residence. [S11]","sources":["S1","S4","S5","S3","S14","S15","S2","S8","S9","S10","S13","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d930fef80b1e","kind":"unclassified","anchor":"Before querying BLM-GLO or NARA RG 49, confirm that the land lies in a public-land state [S15]:","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-412be2fb341b","kind":"unclassified","anchor":"Two cautions. In Tennessee, the United States held title to the land south and west of the Congressional Reservation Line from 1806 to 1846, but Tennessee issued the grants [S16]. In Ohio, a public-land state, land in the Virginia Military District began with Virginia warrants; its patents can still be found on BLM-GLO [S17].","sources":["S16","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5f4c1c55ec0b","kind":"method","anchor":"Start a row for each GLO hit. Copy the authority, act year, acreage, warrant number, land office and legal description. Keep the Document Nr. and Accession Nr. in separate fields. Use the stated authority to distinguish a military warrant from a cash sale or homestead [S1], [S39].","sources":["S1","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-487c08cca59e","kind":"method","anchor":"Match the three parts of the bounty-land number on a pension or warrant index card against the entry. For example, 36643-160-55 means warrant 36643, 160 acres, Act of 1855 [S1]. The warrant number, acreage and authorizing act together identify the surrendered warrant [S39]. If a field differs, retain both references until you can explain the discrepancy.","sources":["S1","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b568b9223e1c","kind":"unclassified","anchor":"Read the acreage against the act. A veteran who received 40 acres under the 1850 act could receive another 120 acres under the 1855 act, for 160 acres in total. [S2] So one veteran can lie behind more than one warrant and more than one entry. The 1855 act was the last general bounty-land act, but warrants under the 1847–1855 acts kept being issued for decades. Acreage varied by rank and changed with each act. For example, the basic War of 1812 grant of 160 acres was raised to 320 by an 1814 act. [S9], [S12] State bounty-land programmes had their own rules and fall outside this federal route. [S12], [S1]","sources":["S2","S9","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d153c957fd62","kind":"unclassified","anchor":"- **Warrant application file (RG 15):** the declaration by the veteran, widow or heir. It may contain service details, the marriage date and place, the veteran's death, residences and heirs. [S2], [S12] Retrieve it through the pension recipe.\n- **Land-entry case file (RG 49):** the surrendered warrant, where it was located on a tract and, if it was assigned, the signed assignment. The issued warrant itself is in the entry file, not the application file. [S2], [S1]","sources":["S2","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ba457810d686","kind":"unclassified","anchor":"Reading one series does not mean you have searched the other, in either direction. NARA holds the RG 49 land-entry case files, and the surrendered warrants are not online. [S1], [S4], [S5] The GLO site shows whether an entry exists and displays one page. [S1]","sources":["S1","S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-27e86eaa02c4","kind":"method","anchor":"- **Namesakes.** Compare each spouse named in the entries with the pension or warrant application. Strauss distinguished two Noah Damons by their wives, Esther and Elizabeth [S1]. Keep separate candidates when the spouse or warrant details conflict.\n- **Assignment.** The Act of 22 March 1852 allowed federal military bounty-land warrants to pass by written assignment [S46]. Read the patent for the assignee, then inspect both sides of the surrendered warrant for the assignor’s name, signature or mark. Strauss reported finding Esther Damon’s signed assignment to Samuel Rice on the back of the warrant [S1]. Record what transferred and look elsewhere for any family relationship.\n- **Long delay.** Date the award, assignment and entry separately. Tanner described a War of 1812 warrant used in a 1930s purchase in Davis County, Utah [S10]. If an entry falls far outside the service period, trace the warrant through its successive holders before identifying the locator [S8], [S9], [S13].","sources":["S1","S46","S10","S8","S9","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7f6ca64c0b13","kind":"unclassified","anchor":"A missing name in the GLO index reflects what the index covers. It is not a negative finding. The site indexes completed title records, and BLM states that it does not yet hold every federal title record. [S3], [S14]","sources":["S3","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb586b5c3cbc","kind":"unclassified","anchor":"First check whether NARA publishes a name index to cancelled, rejected or relinquished entries for the land office and period. The National Archives at Kansas City publishes two: the Dodge City and Topeka, Kansas offices (ca. 1905–1937) and the Alliance, Nebraska office (ca. 1869–1950). They list names and dates and need no legal description. To get a hit, request the file from the Kansas City reference staff, as those index pages direct.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb19ed208526","kind":"method","anchor":"- **Newspaper legal notices:** final-proof (intent-to-prove) notices, contests and patent-ready notices, usually in the county's official paper. Final-proof notices ran weekly for several weeks so that adverse claimants could come forward. [S7], [S3] Search for them with the [newspaper recovery recipe](newspapers-com-search-recovery.md). A contest notice points to a disputed entry. It does not show that the claim failed. [S7]\n- **Neighbouring patents and survey records.** Plot the completed patents around the legal description, then compare the survey plat and field notes [S4], [S23]. A gap consistent with the claimant’s tract is a lead for a tract-book search [S3]. The gap alone cannot identify who entered it.\n- **A census civil township**, converted to township and range with a historical county atlas. [S3]","sources":["S7","S3","S4","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ce0a891bf25a","kind":"unclassified","anchor":"Tract books record every transaction on a tract until the government transfers title, including unsuccessful entries. Later transfers are in county deed records. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-698ab1046eda","kind":"method","anchor":"1. Select possible tract-book volumes from the coverage table for the state or territory, township and range. Check the volume’s own coverage and search neighbouring volumes if needed. In Smith’s Dakota example the table pointed to volume 159, but she reported finding the entry in volume 154 [S3].\n2. Log the successive claimants on the same tract. Copy each file number and any cancellation or relinquishment notation [S3].\n3. Read several pages on either side for other entries by the same claimant. Smith reported finding a cancelled Kansas claim under a different file number from the man’s completed homestead [S3]. Request the files separately.\n4. Copy entries and application numbers for known associates on nearby tracts, including abandoned claims. Use the applications to test the association and later records to establish where the claimants went [S3].","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0eb919c37ea4","kind":"unclassified","anchor":"Check any applicable NARA cancelled-entry name index (§4) first. Without a legal description, Smith calls this search time-consuming and usually unsuccessful. Run it only if all of the following hold [S3]:","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2fcae5c07ae5","kind":"unclassified","anchor":"If you go ahead, convert the census township to township and range, choose the volume from the coverage table and read it page by page. Record every page you inspect, so that an unsuccessful run states exactly what it covered. [S3] Do not search a whole territory.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b740ea7e71a","kind":"unclassified","anchor":"Copy the identifier the NARA request type needs, exactly as GLO or the tract book gives it. For a pre-1908 file, give the state, land office, authority and patent number (GLO's Document Nr.). For a serial file (issue date July 1908 or later), give the serial patent number (GLO's Accession Nr.). For a warrant entry, the request needs the act, the acreage and the warrant number. Then request the case file from NARA. These files cover all 30 federal public-land states. [S4] Tanner points to NARA General Information Leaflet 67 (*Research in the Land Entry Files of the General Land Office*). [S4] NARA has replaced that leaflet with Reference Information Paper 114, and its \"Accessing Land Entry Files\" page explains current access.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2a16e805c0d0","kind":"unclassified","anchor":"Most case files are not digitized, but some are. Before ordering, check the homestead sets that NARA lists as online: Ancestry (Homestead Records, 1863–1908), Fold3 (Homestead Records, Nebraska) and FamilySearch (Homestead Final Certificates, 1863–1909). Serial patent files from the early 1960s onward are often at NARA regional facilities rather than in Washington. [S4], [S5]","sources":["S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-010215ecde3c","kind":"unclassified","anchor":"Inventory the file one document at a time instead of summarizing it. Contents vary. Some files hold only a receipt and the patent, and others are much fuller. [S5] Look for:","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-38ce16d7d667","kind":"unclassified","anchor":"- Application and proof-up papers, which may give an immigrant's original name, place of origin or family arrangements. [S4]\n- Naturalization papers. The 1862 Homestead Act let citizens and people who had filed a declaration of intention make an entry, but citizenship was required by final proof. That makes a declaration or a citizenship certificate a likely item in the packet. [S6] If it names a court, look for the declaration or petition in that court. [S6] Take the court lead to [U.S. immigration search recovery](usa-immigration-search-recovery.md).\n- For warrant entries: the surrendered warrant and any signed assignment on its back. [S1]","sources":["S4","S6","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-192b069bc6e0","kind":"method","anchor":"Use the township, range and adjacent sections to identify nearby patentees [S11]. Put them on a list of possible associates. A patentee could own land from a distance, so check tax, census, deed or case-file evidence for residence before calling anyone a neighbour [S11].","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-03e656921049","kind":"custody","anchor":"**Mining claims.** Search the GLO records for a mining claim, as Family Locket's mining guide advises [S20 @2026-11-12], but expect only claims that went to patent. The site gives access to federal land conveyance records [S23 @2026-11-12], and its 2004 glossary names the Mineral Certificate as the document that describes a lode, placer or millsite claim [S21 @2026-11-12]. An unpatented claim was never conveyed, so a GLO miss says nothing about it. Look for its location notice in the records of the county where the claim lies, and in BLM's copies of notices recorded under section 314 of the Federal Land Policy and Management Act [S22 @2026-11-12].","sources":["S23","S21","S22","S20"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-45938d290355","kind":"method","anchor":"- Record the application, proof and patent dates separately. Elder reported an 1838 application that preceded an Arkansas patent and supplied an earlier dated dealing with the land [S18]. For an 1862 Act homestead, check the claimant’s and witnesses’ final proof for the date residence began. The rules allowed time to settle after filing, and the route to title could involve five years on the land or a shorter residence followed by cash payment [S24], [S19].","sources":["S18","S24","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1e96a6a641e3","kind":"custody","anchor":"A further caution for Ohio: its northeastern counties in the Connecticut Western Reserve and the Firelands were part of Connecticut's western land claims. The Ohio History Connection holds no original entry or survey records for those counties and suggests the Western Reserve Historical Society Library and the Connecticut State Library [S25 @2026-11-13]. For land there, start with those two libraries.","sources":["S25"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-86cbefeb99ae","kind":"method","anchor":"Do not stop a military-bounty warrant search in the veteran’s home state. Once the warrant’s act, acreage and number match an entry (§1), read its land office and legal description to place the tract. Keep that location separate from the warrantee’s residence. [S34], [S35], [S36]","sources":["S34","S35","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03ce29edfedd","kind":"method","anchor":"In Ohio, identify the survey or land division before interpreting a township/range description. The state contains several systems with different numbering; the Virginia Military District uses metes and bounds. Use the Ohio History Connection land-division guide and a period map to select the system, then copy the description in that system instead of forcing every Ohio parcel into one rectangular grid. [S26], [S27], [S28]","sources":["S26","S27","S28"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dca5e02b38e6","kind":"method","anchor":"When a homestead claimant sought military-service credit toward the residence requirement, check the case file for service papers. Carry any recorded unit and service dates into the military-record search. [S29], [S30]","sources":["S29","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cceea98bdaec","kind":"method","anchor":"Read the final-proof witnesses’ answers as a separate source, including how long they knew the claimant, their distances from the tract and any other neighbours they identify. Search neighbouring homestead files for the ancestor as a witness even if the ancestor completed no entry. Witnesses were usually neighbours; the witness role alone establishes neither kinship nor independence from the claimant. [S31], [S29], [S32], [S33]","sources":["S31","S29","S32","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-44e2089692b2","kind":"method","anchor":"When a widow or heir completed a deceased claimant’s homestead, read the succession papers for the claimant’s death date and the successor’s stated relationship. [S31], [S30]","sources":["S31","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c52d352dfb9","kind":"method","anchor":"On a War of 1812 pension envelope, check the upper right corner for bounty-land notes and keep them separate from the pension file number [S38]. According to the presenter, use the bounty-land certificate numbers to search GLO [S37†]. Run a separate search for each warrant and confirm matches by warrant number, acreage awarded and act [S39].","sources":["S38","S37","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-314e72015192","kind":"method","anchor":"**Revolutionary War claims under the 1855 act.** According to the presenter, search under the 1855 act even if the Revolutionary War veteran had already died [S40†]. For a new warrant on that service, check for an eligible widow or, if there was no widow, children who were minors when the act took effect [S42]. The September 28, 1850 act covered specified War of 1812 and post-1790 Indian War service and included commissioned officers who served in the Mexican War [S43]. Keep earlier Revolutionary War warrant authorities in the search [S44].","sources":["S40","S42","S43","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-362446ce927c","kind":"method","anchor":"**Assigned Revolutionary War warrants.** According to the presenter, search GLO for the veteran even if the warrant may have been sold [S40†]. Read the patent for the veteran and any stated assignment. Identify the patentee from the grant clause. A Revolutionary War warrant could underlie a patent issued to someone else [S41]. Carry the warrant into the application search (§2) for evidence of the veteran's service [S44].","sources":["S40","S41","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-290d28fffde6","kind":"method","anchor":"According to the presenter, read the Revolutionary War patent for its service designation [S40†]. If it gives only a line or militia designation, carry that wording into the service search. Use a warrant application or a military service record that identifies the regiment before recording one [S44], [S45].","sources":["S40","S44","S45"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f696af49247d","kind":"method","anchor":"**California.** According to Family Tree Magazine’s California guide, distinguish federal public-land sales from earlier Spanish or Mexican grants [S47†]. Read the patent’s authority before choosing a file series. The 1851 act provided for U.S. patents on confirmed claims based on Spanish or Mexican grants [S48]. For a federal public-land sale, follow the cash-entry route (§§1 and 7) [S39].","sources":["S47","S48","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-109139b0f242","kind":"custody","anchor":"For an earlier Spanish or Mexican grant, check the California State Archives’ *Spanish and Mexican Land Grants* collection for copies of title papers and maps [S49 @2026-11-20].","sources":["S49"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
