  - {"id":"S49","kind":"web-page","urls":["https://www.drk-suchdienst.de/wie-wir-helfen/suchen/zweiter-weltkrieg/kriegsgefangene-und-vermisste/"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Historical tracing account read 2026-11-23","entry_sha256":"eb60e17887c4332b3401eb0c1bc80c69229b3cbc95b177f760c3d93292b698c4","claims":["C-4bfaabdbb3da"],"review":"reviewed"}
  - {"id":"S50","kind":"catalogue","urls":["https://www.arcinsys.niedersachsen.de/arcinsys/showFondsDetails?fondsId=5220"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Fonds description read 2026-11-23","entry_sha256":"ac551a9d3bbb48ecae075eb343e7b9590a8692a181ca9fe332b37307bad9da34","claims":["C-4bfaabdbb3da"],"review":"reviewed"}
  - {"id":"S51","kind":"pdf","urls":["https://www.stadtarchiv.de/fileadmin/_Websites/Stadtarchiv/recherche/Familienforschung.pdf"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Sections on civil status and residence registration read 2026-11-23","entry_sha256":"2ccc479610cc22417b4264964649c42c69503f843ed128e40cbbf74cd73f96ff","claims":["C-4bfaabdbb3da"],"review":"reviewed"}
  - {"id":"S52","kind":"pdf","urls":["https://www.deutsche-rentenversicherung.de/SharedDocs/Downloads/DE/Fachliteratur_Kommentare_Gesetzestexte/Studientexte/Verfahrensrecht/03_beitrags_und_meldeverfahren.pdf?__blob=publicationFile&v=11"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Historical insurance-record sections read 2026-11-23","entry_sha256":"cccbdb476584b3fa43a15723d8baea4b68fc5a433534e3169c5bf8972cff0d57","claims":["C-4bfaabdbb3da"],"review":"reviewed"}
claims:
  - {"id":"C-ecb7e0c2b94b","kind":"unclassified","anchor":"- **Period:** Old-Prussian army (1714–1806), Imperial army in peacetime (before 1914, including retired officers), First World War, or Wehrmacht.\n- **Rank class:** enlisted or NCO, or officer. The surviving series differ sharply between the two. Do not merge the routes.\n- **Army or state:** Prussian, another German state, Austro-Hungarian and so on. Take the regiment's name and number exactly as the entry gives them, for example \"Kürassier-Regiment Nr. 10 (Gensdarmes)\" [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d983d40f0148","kind":"unclassified","anchor":"A retired officer who died before or during the First World War belongs in the Imperial-officer route [S1]. If he could have been alive in August 1914, also open a casualty-list row until service evidence settles whether he was reactivated. If the period or rank class is uncertain, open one row for each possibility. Do not pick one.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-804b7f272de4","kind":"unclassified","anchor":"Do not reuse the Prussian loss findings for those armies. Give each such man a row marked *route not covered here*. Find out which archive holds that state's records before you record any series as destroyed or searched. For Austro-Hungarian service of men from Galicia and Bukovina, see [Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md), steps 5 to 8.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-911a6d61795a","kind":"unclassified","anchor":"- **Bavaria:** Bayerisches Hauptstaatsarchiv, Abteilung IV Kriegsarchiv, Munich [S9]. Its Kriegsstammrollen (wartime muster rolls) of 1914–1918 are on Ancestry as \"Bavaria, Germany, World War I Personnel Rosters, 1914-1918\" [S10].\n- **Württemberg:** Hauptstaatsarchiv Stuttgart [S9]. The Kriegsstammrollen are filed by unit, for example M 493 for the Landsturm infantry battalions, and some volumes are online [S11].\n- **Baden:** Generallandesarchiv Karlsruhe [S9]. The Kriegsstammrollen of 1914–1918 are in 456 C and the Kriegsranglisten in 456 D [S11].\n- **Saxony:** Hauptstaatsarchiv Dresden [S9]. Personnel lists of 1914–1918 survive in at least some units' files, so ask for the unit's finding aid [S13].","sources":["S9","S10","S11","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c0f3a00b5d70","kind":"unclassified","anchor":"Most Prussian army files burned at Potsdam in 1945 [S9]. For a Prussian soldier, use the casualty lists and the hospital books (§ 4) instead.","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-83b5fd9d143d","kind":"custody","anchor":"- **Check the unit against the surviving muster rolls.** Most Prussian Stammrollen were destroyed in 1945. For a pre-1806/07 regiment start in GStA PK, IV. HA Rep. 11. The archive also identifies cabinet holdings I. HA Rep. 96 and 96 A and an inventory for eighteenth-century rolls preserved in civil files [S31 @2026-11-19]. A published extract for Regiment Prinz Heinrich (1777/78) cites *Rep. 92 B V.1* [S6 @2026-11-19]. Verify that older reference against the catalogue. Record the result for the specific unit and year.","sources":["S31","S6"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e6c9cefb4bee","kind":"method","anchor":"- **Militär-Wochenblatt.** Distinguish the periodical, which began in 1816, from its *Beiheft* (1843–1926) when choosing a catalogue entry [S33], [S34]. Consult the half-year volume’s contents under *Biographisches* for promotions, transfers and deaths [S1]. For a missing issue, check the Deutsche Digitale Bibliothek, the Elbląg library, UB Potsdam and the Internet Archive. Record the library, volume and pages actually inspected.\n- **Regimental chronicle and Ehrentafel.** Check each regiment’s chronicle for promotion, transfer and retirement dates, then verify notices by date. A 1910 chronicle recorded an officer’s China campaign of 1900/01, before he joined that regiment [S1]. Record which years and personnel the roll of the fallen covers before interpreting a miss. Use the regiment’s GenWiki bibliography to locate editions.\n- **Reichsanzeiger.** Look up each dated transfer or promotion in Mannheim University Library’s digitised *Reichsanzeiger* or the Deutsches Zeitungsportal [S1], [S35]. Cite the newspaper issue, date and page.\n- **Bound the death search.** Use a dated event that establishes the officer was alive, such as his retirement, as a starting point. Check both name and street sections of the [city directory](city-directory-observation-workflow.md). One retired captain appeared as *Hauptm. a.D.* in 1912 and disappeared from both sections in 1913. A researcher subsequently found a death notice in the *Norddeutsche Allgemeine Zeitung* [S1]. Search beyond the first missing year in the Deutsches Zeitungsportal or ZEFYS, and take an upper bound from a dated death or widowhood record.\n- **Keep reactivation open after a casualty-list miss.** Seek a dated service or discharge record and check the coverage of any separate lists of deceased active and retired officers. Record the specific lists and years searched. The forum did not establish how far those officers’ lists continued into the war [S1].\n- **Civil death registers.**\n  - A death is registered at the registry office for the place where it happened (§ 28 PStG). A death while travelling or at a spa is therefore registered there, not at the home address. [S14] A participant made the same point [S1].\n  - For a fallen soldier, also search the registers of his birthplace and last residence; the same participant said such deaths are often registered there instead [S1].\n  - The continuation period for death registers is 30 years (§ 5(5) PStG); after it ends, § 7(3) requires the records to be offered to the responsible public archive under its archival rules. Confirm the actual custodian rather than assuming a transfer is complete. Access during the continuation period follows § 62 PStG; establish which applicant category applies before requesting an entry. The Sonderstandesamt Bad Arolsen death-register continuation period is 80 years. [S14]\n  - Search the widow’s remarriage file and the offices where the banns were posted. One surviving file contained only the banns certificate and supplied no proof of the first husband’s death [S1].","sources":["S33","S34","S1","S35","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e26178be3c44","kind":"method","anchor":"- **Test both given names in the local family books and original registers.** Search the birth village and the wife’s village around both reported years, and record where a namesake could still be missing. In a Vaskút case, a wounded man in the 1915 list had the documented given name but a different birth year and the wife’s village, while the 1916 death list and the memorial used another given name in German and Hungarian [S3].\n- Inspect the original handwriting for an abbreviation such as *Jos.* or *Joh.* before treating Josef and Johann as different men. A participant proposed this misreading in the Vaskút case. Check the memorial’s language as well as its spelling [S3].\n- A one-year difference in birth year, or a mismatch between birthplace and residence, ranks a candidate lower but never excludes it. Record the wounding and the death as separate episodes ([episode discipline](russian-military-repression-record-episodes.md)).\n- Give the inference and its limits, including the family books, indexes, original registers and years searched for namesakes. Use the original entries to resolve disagreements among the compiled family books [S3]. Leave the identity ruling to [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-94b499ed74bc","kind":"unclassified","anchor":"A lost personnel file need not end a service inquiry. The 2022 Bundesarchiv presentation\ndescribes surviving Krankenbuchlager material and *Lazarettbücher* that can document\nparticular hospital stays [S8]. Select this route for the period and holding actually\nconfirmed by the custodian; it does not extend the Prussian loss findings to other armies.","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b03e4c735d47","kind":"custody","anchor":"The surviving books of the Krankenbuchlager Berlin, which held the hospital books of\nPrussian soldiers, are in the Bundesarchiv [S12 @2026-11-13]. Since 1 September 2025 its\nAbteilung Deutsches Reich in Berlin-Tegel answers all person-related enquiries about military\npersonnel up to 1945, and from March 2026 the person-related holdings up to 1945, the Prussian\narmy's hospital books (PH 22-II) among them, move there from Freiburg [S21 @2026-11-13].\nAddress a hospital-book enquiry to the Abteilung Deutsches Reich, not to the Abteilung PA that\nthe older page S12 names. The depots for the other armies in Dresden, Stuttgart and Munich were\ndestroyed in the Second World War, but the same older page says the books of later depots in\nKassel and Munich were brought together at the Krankenbuchlager Berlin in 1964\n[S12 @2026-11-13]. For a Bavarian soldier, ask the Bundesarchiv whether a hospital book\nsurvives before you record the route as destroyed.","sources":["S12","S21"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6c9ae48c7aed","kind":"unclassified","anchor":"1. Give the archive the independently supported name, birth details and any hospital,\n   unit or date clues you have. Ask which surviving hospital book or associated finding\n   reference could cover that episode, who now holds it and what the current request\n   terms require. Preserve the reply and book/entry reference separately from the\n   missing personnel-file result.\n2. Request the identified entry. The presentation describes collective pages containing\n   several patients, with scans sometimes masking other people's entries [S8]. Ask for\n   the relevant entry under the custodian's reproduction conditions; a collective page\n   is not automatically available in full.\n3. Extract the fields actually present: identity or identification-tag detail, incoming\n   unit, admission date, hospital, diagnoses, named relatives and discharge or transfer\n   destination. Keep a return-to-duty entry and its named unit as a separate dated\n   observation. The presentation describes these possible fields, not a standard form\n   or a promise that every entry contains them [S8].\n4. Use an actual transfer, hospital or unit reference to select the next record to ask\n   about. Compare the person across the linked entries before joining the episodes;\n   preserve conflicting dates and unresolved names. A relative named in the book is\n   a recorded relationship claim to test, not an identity ruling.\n5. Return the book/entry locator, inspected extract, dated admission/discharge/transfer\n   observations and remaining gaps. A hospital stay establishes only the episode the\n   record documents, not continuous service or a complete military history.","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b32e8c5196e8","kind":"method","anchor":"- **Request the man's documents from the Bundesarchiv.** For a person-specific inquiry use the department given in section 4. Ask which surviving WASt records give a birthplace, division or regiment [S4]. Log the request separately from the Volksbund inquiry.\n- **Ask what supplied the Volksbund birthplace.** Save the grave entry’s spelling and the date and outcome of any source inquiry. If a reply is pending, keep the birthplace provisional and search personnel and civil records independently [S4].\n- **Use the unit to select the files.** NARA identifies *Records of German Field Commands: Divisions* as microfilm publication T315 [S36]. Use the division guide to find dated files and any regimental daily orders (*Tagesbefehle*) [S4]. Keep unit events separate from dated appearances of the individual.\n- **Compare loss and grave cards from the same company and date.** Search Ancestry’s *Deutschland, im Kampf gefallene Soldaten, 1939–1948*, and cite each card’s BArch B 563-2 KARTEI reference. Record the original place wording, grave number and cause of death separately. In one search several cards placed men in the same numbered comrades’ grave, while a civil certificate repeated a reported place across the border [S7], [S37]. Check the historical map before identifying the locality. The cards rarely include 1945 graves and omit postwar reburials [S37].\n- **Check the source of a postwar birthplace before choosing a parish.** A 1949 marriage extract gave *Josefsdorf* for the bride’s deceased father, while the grave index gave *Josefin* [S4]. Seek an independent mention. List each candidate, parish, year and register examined. The researcher reported misses in three West Prussian Josefsdorfs. Four Ukrainian candidates were proposed, but the reported check covered the 1902 Protestant baptism books of Roshischtsche and Luzk [S4]. Keep any unexamined jurisdiction or confession open.","sources":["S4","S36","S7","S37"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-56f2f464ef1a","kind":"unclassified","anchor":"1. **Routing table:** one row per period, army and rank-class route. For each series give its status: *destroyed*, *surviving and searched*, *surviving but not online*, *not yet asked*, or *route not covered here*, with the locator or URL used.\n2. **Canton list:** the districts and towns from Lyncker with volume and page, ranked, each labelled as a search area.\n3. **Notices:** Militär-Wochenblatt year, half-year, page and the digital library used; chronicle title, edition and page; Reichsanzeiger issue and date.\n4. **Death window:** earliest bound (leaving the army), the last address-book listing and the first inspected absence, any latest bound with the dated death or widowhood evidence behind it, and the newspapers and registers searched, with each register's place of death and access status.\n5. **Casualty-list identity notes:** the namesake search (books, indexes, years), any script or language confusion considered, and the inference as worded.\n6. **WWII leads:** Bundesarchiv request log (department addressed and date), Volksbund query and reply status, regiment and division, and NARA unit-record leads (microfilm series and unit). Keep these separate from personal documents.\n7. **Hospital episodes:** custodian reply and current request terms, hospital-book and entry references, inspected or restricted reproduction, actual admission/discharge/unit/transfer fields, and unresolved links between episodes.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-55f33b1392df","kind":"portal-availability","anchor":"Search the German casualty lists in CompGen's free name index of the *Deutsche Verlustlisten* 1914–1919 at des.genealogy.net. Volunteers entered over 8.5 million entries from the printed lists, recording the name and the birthplace [S16 @2026-11-12].","sources":["S16"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4921b07bf651","kind":"method","anchor":"Expect several entries for one man. A later list can print his name again under *Berichtigung früherer Angaben* (correction of earlier information) with a new status [S18]. The researchers of a study built on this index used machine learning to merge possible repeat entries for the same person, CompGen reports [S15]. Collect every entry under his name and place, and record each list number, date and status as a separate episode before you call him wounded, captured or fallen. Treat the place as a lead to the birth register, not as his birthplace.","sources":["S18","S15"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c8f64cb08c0c","kind":"platform-ui","anchor":"Search by name. Each result names the list it came from, for example \"Preußen 665\" or \"Bayern 427\", and gives a status such as *gefangen* (captured), the list date and a link to the scanned page [S17 @2026-11-12], [S18 @2026-11-12], [S19 @2026-11-12]. It gives the regiment only where the printed list did: from 1916 until the end of the war the lists omitted it [S20 @2026-11-12]. Open the scan before you record the entry.","sources":["S17","S18","S19","S20"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f9b8ae2fdffe","kind":"method","anchor":"Use this route when a family account or a later record calls a man a “Hessian” who served with the British in America. Record the claimed regiment, capture and American place separately. The surviving monthly lists and the prisoner route can test a family’s Virginia connection once the man and his contingent are identified [S22], [S26].","sources":["S22","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a85c6a9fe0cf","kind":"historical","anchor":"- **Establish the contingent first.** Six principalities supplied troops to Britain: Hesse-Cassel, Brunswick-Wolfenbüttel, Hesse-Hanau, Ansbach-Bayreuth, Waldeck and Anhalt-Zerbst. Their men were all called Hessians, whatever their state of origin [S25]. Take the contingent from a record that names his regiment, not from the family's label. If no record names it, open one row per possible contingent (§ 1).","sources":["S25"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-78a537ebfde7","kind":"portal-availability","anchor":"- **Search HETRINA for Hesse-Cassel, Hesse-Hanau and Waldeck men.** HETRINA (*HEssische TRuppen IN Amerika*) records the men of those three contingents by name, with biographical and source details for each. It is searchable online as a module of the Landesgeschichtliches Informationssystem Hessen (LAGIS), linked from the Hessisches Landesarchiv's genealogy pages [S23 @2026-11-16]. The module holds records on about 30,000 soldiers who served in America in 1776–1783 [S24 @2026-11-16]. Its printed edition is the series *Hessische Truppen im amerikanischen Unabhängigkeitskrieg* [S26 @2026-11-16]. Record each entry with the source references it gives.","sources":["S23","S24","S26"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-97b2de7840f4","kind":"portal-availability","anchor":"- **Read a HETRINA miss narrowly.**\n  - HETRINA does not cover Brunswick, Ansbach-Bayreuth or Anhalt-Zerbst men. Give such a man a row marked *route not covered here*. The FamilySearch Wiki article on Hessian soldiers lists separate name lists for those contingents and calls the Anhalt-Zerbst list incomplete [S25 @2026-11-16].","sources":["S25"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b06ba4793f13","kind":"historical","anchor":"- HETRINA was cut down to what fitted an 80-column punch card, mostly from the regiments' monthly lists (*Monatliche Listen*) [S26]. A miss is a miss in that compressed index, not in the rolls.","sources":["S26"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-92d742d343f7","kind":"method","anchor":"- Search surname forms attested in America alongside German forms supported by family records. The lecturer’s unsuccessful search under the American name left a possible name change unresolved [S22]. Record the forms and contingent searched before interpreting a miss.","sources":["S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-51f9e219de0e","kind":"portal-availability","anchor":"- **After a hit, open the monthly lists.** For each man whose status changed since the previous month's report, the monthly lists give the complete date where HETRINA gives month and year, and they hold detail HETRINA left out. The Johannes Schwalm Historical Association's scans of the Hesse-Cassel, Hesse-Hanau and Waldeck lists are PDFs on Kutztown University's \"Schwalm Marburg Files\" page, listed by unit and Marburg file number [S26 @2026-11-16]. Record the file number and each dated event as its own episode.","sources":["S26"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4e90889864b2","kind":"custody","anchor":"- **Treat the Schwalm collection and compiled lists as secondary.**\n  - Franklin & Marshall College in Lancaster, Pennsylvania, holds the association's research collection. It no longer answers genealogical inquiries by email, phone or mail, and it does no research on specific soldiers; researchers use the collection in person by appointment. The college calls the collection secondary and limited on specific soldiers, often holding little beyond the association's online registry and journal profiles, and warns against a long trip just to use it. Check the inventory and the journal name index linked from its collection page before anyone plans a visit, and do not draft a research question to the college [S27 @2026-11-16].","sources":["S27"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8f959e735cb5","kind":"portal-availability","anchor":"- For a man said to have stayed in America, check John Merz's \"Hessians remaining in America\" listing on the AMREV-HESSIAN RootsWeb site. Its introduction says each entry codes events such as discharge, desertion, marriage, a land grant or petition and a Quebec census listing against numbered sources; it calls the list by no means complete, and the page was last updated in 2006. The live site refused automated access, so the introduction was read in an Internet Archive capture [S28 @2026-11-16]. Follow each numbered source to the record it names. An absence from the list proves nothing.","sources":["S28"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-eee30b940d68","kind":"historical","anchor":"- **Test a family placement against his capture.** Take the capture from his own service entries, then compare the camp sequence.\n  - Saratoga (1777), the Convention Army: held near Boston, then from January 1779 at the Albemarle Barracks about five miles northwest of Charlottesville, Virginia. The Hessian prisoners stayed there until February 1781 and were then sent north, first to Winchester and then on to Maryland [S29].\n  - Yorktown (1781): the prisoners, who included German auxiliaries of the Bayreuth Regiment, passed through Williamsburg on the march north and were split between a camp outside Winchester, Virginia, and Fort Frederick, Maryland, whose group was moved on to the town of Frederick. From January 1782 the prisoners at Frederick and Winchester were moved to Lancaster, Pennsylvania, and some were held at York. Many deserted to settle in Virginia, Maryland and Pennsylvania [S30].\n  - A Bayreuth man taken at Yorktown falls outside HETRINA. A later home near a camp fits that capture but does not prove it.","sources":["S29","S30"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3931e969c2f0","kind":"custody","anchor":"- **Search military church books by regiment and garrison.** Check the GStA PK finding aid *VIII. HA, MKB* for the congregation, register type and years [S32 @2026-11-19]. Try the Berlin and military church-book scans identified in the forum [S2 @2026-11-19]. A published extract places Regiment des Königs Nr. 18 under Wehrkreis-Pfarramt Spandau [S6 @2026-11-19]. For Regiment Prinz Heinrich, look for Friedrich Bengs’s extracts from the marriage registers for 1756–1806 in *Familiengeschichtliche Blätter* (1934–36) [S5 @2026-11-19].","sources":["S32","S2","S6","S5"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ec0ceba716e6","kind":"method","anchor":"- **Search the local parish as well as the military congregation.** A Brandenburg database led a researcher to the NCO’s 1718 marriage in the rural parish of Satzkorn on Archion, where neither parents nor birthplace were recorded [S2]. Carry the spouses’ names to their children’s baptisms.\n- **For a marriage entry, record its type.** The published extract from the regiment's marriage registers lists entries as \"banns or marriage consent\" (Aufgebot oder Konsenserteilung), with origin and confession as stated [S5]. Record which type the entry is, or record that the publication does not say. A consent date is not a wedding date.\n- **Use the canton as a ranked list of places to search, not as a birthplace.** Look up the regiment in Lyncker, *Die altpreußische Armee 1714–1806*:\n  - For Kürassier-Regiment Nr. 10, a participant cited vol. I, p. 169 for the districts Halberstadt, Jerichow and Prignitz [S2]. Verify that page and the extent of the canton for the relevant period before assigning a place. A reported 1755 baptism under a rare surname in Halberstadt’s Reformed congregation supplies a parish to check for relatives [S2].\n  - Two finding aids are worth knowing. A participant pointed to a FamilySearch catalogue item titled *Die altpreußische Armee 1714–1806 und ihre Militärkirchenbücher* [S2]. Wolfgang Eger's *Verzeichnis der Militärkirchenbücher in der Bundesrepublik Deutschland* (Neustadt/Aisch; vol. 1 1993; vol. 2 1996, covering the new federal states and the Roman Catholic church) indexes military church books by holding [S7]. Check the holdings either one lists before you rely on it.\n- **Test a later civil occupation against the family as well as the surname.** A participant linked an NCO to a 1748 house grant in Dahme to the widow of an armoury clerk who shared his rare surname [S2]. Retrieve the grant, identify the widow and compare the marriage and burial entries in Dahme before joining the two careers.","sources":["S2","S5","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cce1db3e83ee","kind":"method","anchor":"**Route a conscription clue by residence and year.** Establish which state governed the man's residence in the likely call-up year and check the conscription law that applied there [S38]. For a North German Confederation case under the 1867 law, § 17 uses residence at draft age and accounts for a move before the final decision on active service [S39]. For a Bavarian case in 1869, start with Bavaria's 1868 *Wehrverfassung*. The North German law took effect in Bavaria on 1 January 1872, with reservations [S40]. Use the applicable rule to select the draft district and cohort. Require a record of actual service before assigning a unit.","sources":["S38","S39","S40"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-3860ce815ed7","kind":"platform-ui","anchor":"Check the personnel and loss records above for the soldier's last documented unit and status [S41 @2026-11-22]. If his fate is unknown, browse the DRK-Suchdienst *Vermisstenbildlisten* by field-post number, unit address or unit location, or use the number or location of a known POW camp. Scan the resulting list for the soldier's name. The lists document tracing inquiries, so a miss leaves the soldier's fate open [S42 @2026-11-22].","sources":["S41","S42"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bb05134de462","kind":"portal-availability","anchor":"If the service evidence points to the 6th Army, use *Armeeoberkommando 6* and the relevant dates to find unit records in NARA's catalogue, RG 242, microfilm T312 [S36 @2026-11-22], [S43 @2026-11-22]. Compare the Bundesarchiv's RH 20-6, starting with RH 20-6/216 for the advance on Stalingrad through October 1942. Distinguish the army that fought at Stalingrad from the 6th Army re-formed in 1943 [S44 @2026-11-22]. Use each unit record for the dates it covers and require a named record to place the individual there.","sources":["S36","S43","S44"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6abaa8c21f57","kind":"method","anchor":"**Follow up a Marburg miss.** Take the suggestion from the available excerpt of Just Genealogy [S45] and look up the man in Clifford Neal Smith's indexed *Muster Rolls and Prisoner-of-War Lists in American Archival Collections* (German-American Genealogical Research Monograph no. 3, FHL 973 W2smn no. 3) [S46]. Check which lists cover the man's regiment and dates, then follow any hit to the original roll or prisoner list named in the compilation [S47]. Limit a miss to the lists you checked.","sources":["S45","S46","S47"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-4bfaabdbb3da","kind":"method","anchor":"Record the letter date and any last sighting or loss date it gives. Keep *missing* as an unresolved tracing status and leave the soldier's fate open [S49]. Compare the reported loss date or window with independent entries for the same man. Check hospital admission or discharge [S12], files for injured veterans (*Versorgungsakten*) [S50], civil registration [S51], and employment periods on social insurance records [S52]. Match the identity details and record each event date separately from its filing date. If an entry places him alive after the reported loss, record the event and its locator as evidence of survival to that date.","sources":["S49","S12","S50","S51","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-85da638007cd","kind":"example","anchor":"In one published family account, a tracing reply still listed the soldier as missing despite his reported postwar registrations [S48].","sources":["S48"],"checked":null,"stated_as":"observation","review":"reviewed"}
