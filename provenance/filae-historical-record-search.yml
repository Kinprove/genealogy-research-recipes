claims:
  - {"id":"C-1de13de8f952","kind":"platform-ui","anchor":"According to the presenter, start with Search for a Source when you know the type of event [S1† @2026-11-22]. Use Filae’s source list to check the collection scope and choose the likely series before submitting a name [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-a44889b9b634","kind":"portal-availability","anchor":"For a birth, marriage or death around the change to civil registration, check both the eighteenth-century parish collections and the civil-registration collections beginning in 1792. For a census, check the commune and the year, including the indexed 1872 and 1906 collections where applicable. [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-196049ab2df2","kind":"portal-availability","anchor":"For a military or service clue, check the specific conscription, prisoner-of-war or decoration collection. For a civil pension or naturalization lead, look for the relevant entry in the Bulletin des lois holdings. Record the series searched before reading a miss. [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ee0874ac3a90","kind":"portal-availability","anchor":"For a departure lead, check Embarquements, Passeports, Passagers for a collection matching the port and year. Bordeaux passports and passenger lists are listed separately. Check naturalizations under their own series when the clue is acquisition of citizenship. [S2 @2026-11-22] [S4 @2026-11-22]","sources":["S2","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8f5ad8f4609f","kind":"portal-availability","anchor":"For a birth less than 120 years ago, check Filae’s stated birth-indexing boundary before treating an empty result as evidence. Check a death collection against its own coverage and use [departmental record routing](french-departmental-record-routing.md) to identify the correct register keeper. [S6 @2026-11-22]","sources":["S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-290334234d75","kind":"platform-ui","anchor":"Run a Filae person search with the target’s name and approximate place and year. If several matches remain, add one known spouse or parent and rerun. If that removes the expected hit, retry without the relative filter and inspect the indexed names and roles. Use the source filter to distinguish a civil act or census from a tree lead. [S3 @2026-11-22] [S5 @2026-11-22]","sources":["S3","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8213426f44c7","kind":"platform-ui","anchor":"In the surname field, use `?` for one uncertain character and `*` for several. Keep the exact form as a separate run so the wildcard does not obscure which spelling produced a hit. [S7 @2026-11-22]","sources":["S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-003478bf72d3","kind":"platform-ui","anchor":"If the place is uncertain, inspect the map distribution and compare candidate places with the written event place in each result. Keep event and residence separate when the same indexed source shows both. [S4 @2026-11-22] [S5 @2026-11-22]","sources":["S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a4829785365b","kind":"platform-ui","anchor":"Copy Filae’s source label, person’s role, commune, event date and reference. Open the linked image when available. If the result stops at an abstract or a member tree, use the commune, series and date to locate the record through [departmental routing](french-departmental-record-routing.md). Use [civil-act extraction](french-belgian-civil-act-extraction.md) to read the act. [S3 @2026-11-22] [S5 @2026-11-22] [S6 @2026-11-22]","sources":["S3","S5","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
