claims:
  - {"id":"C-03","kind":"method","anchor":"Record the occupation as written, the approximate working years and the historical address. A railway job title or an address beside the line does not establish the employer. Match the line, station or works and the working dates to the operator, then check for a takeover or a successor's records. Keep a colliery or ironworks employer in play when the occupation points to a different industry [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"custody","anchor":"Start with the National Records of Scotland railway guide. The North British Railway staff registers are listed as `BR/NBR/15/1–94`, 1844–1948. Search the individual volumes for the operating area and working years. Use the corresponding staff series for another company and keep the explained coverage of each volume with the search result [S1 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Request a specific staff record only after checking the catalogue's access conditions. Use the full archival reference, worker's name, working dates and occupation. Add an address from the historical record only if needed to distinguish a candidate [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"Search the operator's dated company records, station photographs and timetables for the workplace. Record separately what those records establish about the line or works and what links the individual to that employer. A missing staff entry leaves employment unresolved when the company's staff material or the relevant operating district is missing [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
