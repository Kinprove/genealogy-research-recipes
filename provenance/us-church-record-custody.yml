claims:
  - {"id":"C-7861e9ef0717","kind":"unclassified","anchor":"Use this when a U.S. ancestor's baptism, marriage, burial or membership record is needed and the denomination, the congregation or the current holder of its registers is unknown or uncertain. Before searching, work out the exact denominational branch, the record types that branch kept, the congregation or minister who kept the entry, and who holds those registers now. Do not report \"not found\" or \"records lost\" until that custody path has been checked. For tracing custody through jurisdiction and holding changes in general, use [locality coverage in research documentation](research-documentation.md). For directory addresses, use [city-directory observations](city-directory-observation-workflow.md). For church-news searching, use [newspaper search recovery](newspapers-com-search-recovery.md). For identity rulings, use [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-79bf78e4a91b","kind":"unclassified","anchor":"- **Lutheran:** find the synod. Brady says the Missouri, Augustana, Norwegian and Wisconsin bodies each have different archives. Her list also includes \"Concordia\", but the recording does not make clear which body she means. One reading is Concordia Historical Institute in St. Louis, which is the archives of the Lutheran Church–Missouri Synod [S19], the same body as her \"Missouri\" item. Identify the body before looking for its archive. She says synod membership was largely geographic or ethnic: Swedish immigrants and their children are probably Augustana. Augustana was the Swedish synod. [S4]\n- **Presbyterian/Reformed:** find out whether the congregation was Old School, New School, Associate (Seceder), Associate Reformed, Covenanter or General Assembly Presbyterian. Even a small town could have several Presbyterian churches belonging to different bodies. [S11] In 1858 the Associate Presbyterian Church and the northern Associate Reformed body merged to form the United Presbyterian Church of North America. The southern Associate Reformed Presbyterian church stayed separate. Carry the merger in the custody trail. [S10]\n- **Baptist:** name the specific body, for example Primitive Baptist or Seventh Day Baptist. Lisson treats Primitive Baptists as a distinct and difficult research target. [S2] Baptist congregations were autonomous and kept their own records, so there is no central denominational register to search. [S1], [S5]\n- **Society of Friends (Quakers):** the monthly meeting kept the records, and they are now deposited by yearly meeting, not in one central archive. Find which yearly meeting the monthly meeting belonged to at the date, then ask that yearly meeting's depository. Friends Historical Library at Swarthmore College is the official depository for many yearly meetings [S22]. Since 1965 Philadelphia Yearly Meeting has deposited records at either Swarthmore or Haverford College, so one meeting's records can be split between the two [S23]. Guilford College holds North Carolina Yearly Meeting [S24]. Earlham College holds Indiana, Western and Northern Yearly Meetings and the New Association of Friends [S25]. Ancestry's *U.S., Quaker Meeting Records, 1681–1935* can be searched and browsed by meeting [S26], [S27]. William Wade Hinshaw's *Encyclopedia of American Quaker Genealogy* gives abbreviated entries drawn from meeting records; check each entry you use in the meeting's original record [S26].\n- **Methodist:** a local church's registers stay with that church or its successor. When a church closed without a successor, its records went to its Annual Conference archives. The General Commission on Archives and History at Drew University, Madison, New Jersey, does not hold local church membership, baptism or marriage registers [S28].\n- **Episcopal:** registers stay with the parish. A closed church's records go to the succeeding congregation or to the diocese [S29].","sources":["S19","S4","S11","S10","S2","S1","S5","S22","S23","S24","S25","S26","S27","S28","S29"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e1bee23edb4a","kind":"method","anchor":"- **Presbyterians.** Baptisms can be easier to find than marriages [S10]. Request the register and the session minutes, which document congregational business [S12]. Check admissions for a previous congregation. Eighteenth-century transfers led Houser to the parish he called Cumber, County Derry, for some of his Wilson family [S13]. Search there for the household.\n- **Baptists** practised believer's baptism, so do not expect infant baptisms. [S10] Do not look for confirmation registers. Expect minutes, including women's-group minutes, to be the main surviving series, and search for them first. Do not treat them as a fallback. [S4], [S8]\n- **Seventh Day Baptists.** Tanner’s Rhode Island congregation kept membership lists without birth or death entries [S1]. Use a dated appearance to trace membership. Check what the particular church recorded before drawing a conclusion about vital events.\n- **Catholics:** expect parish registers of baptisms and marriages [S1], [S4], and expect a death or burial register as well. The Roman Ritual of 1614 gave forms for the parish books, including a book of the dead (*Liber Defunctorum*) [S20]. The Second Plenary Council of Baltimore (1866) told pastors to keep registers of baptisms, confirmations, marriages and funerals [S21]. Brady says many Catholic churches did not record burials, while French Canadian parishes regularly did [S4]. So do not assume every parish kept one. Before you mark it never-created or lost, check what that parish actually recorded and who holds its books now.\n- **Quakers:** expect minutes, membership books and registers of births, marriages and deaths or burials, and certificates of removal when a member moved to another meeting [S22], [S26]. Some meetings kept removal registers; others recorded removals only in the minutes, so check both [S26].","sources":["S10","S12","S13","S4","S8","S1","S20","S21","S22","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fe045834c1ae","kind":"unclassified","anchor":"Membership lists are dated observations of presence. A first or last appearance brackets joining or leaving. It is not a birth or death. Where a body admitted members only at an older age, an admission is not a birth. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d7942dd67577","kind":"method","anchor":"- **Catholic (territorial):** start with the parish whose boundaries cover the address. Check whether the nearest church was a mission or chapel without parish status, in which case its sacraments were recorded at the parish it belonged to. [S1] Record the parish, not just the church.\n- **Chosen-church denominations (e.g. Presbyterian):** members could attend the church they preferred. In rural areas that was often the nearest church. In towns it may have been any of several, reached on foot or by trolley. Keep every congregation of that branch active in the period as a candidate until its registers are checked. [S11]\n- **African American Presbyterians.** Include all Presbyterian congregations active nearby. In Pennsylvania, an archivist found African American members in registers outside the historically Black congregations [S11]. Record which churches and years you checked.\n- **Rural or remote families:** Lefler notes they might use whichever preacher came through, of any denomination. Widen the candidate list across denominations. [S3]","sources":["S1","S11","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-19a518ee6151","kind":"unclassified","anchor":"- **Hall's Index of American Presbyterian Congregations** (Presbyterian Historical Society). The archivists describe volunteers compiling it from the presbytery rolls in the printed General Assembly minutes. [S11] The Society's own description adds annual denominational yearbooks and other denominational publications as sources, and says the index runs only to about 2015. You can search it by church name and by city or state, but not by county. Search every nearby town from a map, one at a time. Allow for a congregation's recorded place name changing with post-office or boundary changes. [S11]\n- **WPA Historical Records Survey Inventories of Church Archives**, published state by state from about 1936 to 1942. Lisson cites Michigan volumes digitized at HathiTrust. At least one Michigan volume has been confirmed in full view there, but check each volume you need. [S2]\n- **Community-news columns** (revivals, Bible schools, visiting speakers) to find small or independent churches you did not know existed. [S9], [S18]\n- **Denominational periodicals**, for example the Baptist *Biblical Recorder* in Lisson's area. It was founded in 1833 and moves to digital-only publication after 2026. [S9]","sources":["S11","S2","S9","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6571a00c7e4c","kind":"method","anchor":"- Read the minister's return as well as the license. Record the officiant's name and literal title. \"M.G.\" means minister of the gospel and does not identify a denomination. [S17]\n- Compare an unclear officiant’s signature with relatives’ marriage returns [S17]. Two New York City certificates named the same parents and officiant. Searching their shared **347 East 74th Street** address led Starkey to the church office [S16]. Check the officiant and address in a directory from the marriage year.\n- Find his church through city directories or newspapers. [S17] Then ask that church for its own entry. It may include details the civil record leaves out, such as birthplace. [S16]\n- Search under the minister’s own name for a personal register. Presbyterian Historical Society archivists describe cataloguing pastoral registers this way and finding mostly successive appointments in the volumes they handled [S11]. List the dates served at each church and check possible overlaps.","sources":["S17","S16","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d409da4109e6","kind":"method","anchor":"- Baptisms clustered at intervals (for example every six weeks) suggest a visiting minister. Search the other churches he served. [S15]\n- Start at the nearest church, then widen the search. Check the other congregations in the same charge, the pastor's private registers (which he may never have copied into the congregation's book) and churches across nearby county lines. [S14]\n- Record the register title, event location and residence separately. A circuit minister could record a ceremony elsewhere or omit it [S3]. Western Berks County marriages appear in an eastern church’s book because its pastor served both congregations [S14]. Check his appointments before assigning a venue.","sources":["S15","S14","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-35d7cae9459d","kind":"unclassified","anchor":"- **Catholic:** a closed or merged parish's registers usually go either to the successor parish that absorbed its territory or to the diocesan archive, depending on the diocese. Crow gives the diocesan archive as the expected route. [S5] Diocesan practice varies, so ask the diocesan archive where the registers are held. Then check both places.\n- **Other denominations:** check the last minister, a neighbouring congregation of the same faith, local and state historical societies [S5], and the state or regional denominational body, such as a state Baptist association [S8]. Ask the local genealogical society what happened to the records. [S5], [S18] If the church still exists, contact its historian. [S8] For itinerant ministers (Allen's example is Methodist circuit riders), check the denomination's regional repositories and the county where the minister died. [S6], [S7]\n- When contacting the Presbyterian Historical Society, give the congregation name plus its city and state, because that is how its holdings are arranged. Have the staff confirm which records survive for that congregation before they say yes or no to a particular entry. [S12]\n- A denominational archive may document mainly the organization and its history rather than individual members. Tanner's examples include the American Baptist Historical Society and the Archives of the Episcopal Church. Check what it actually holds before treating it as the source of a person's record. [S1]","sources":["S5","S8","S18","S6","S7","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b2c3abad82b","kind":"unclassified","anchor":"Keep four states separate: **never-created**, **unlocated** (custodian unknown), **unsearched**, and **searched with no hit**. For each search, record the holder, the catalogue checked, the series and years inspected, and the index scope.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3a79af5f0189","kind":"unclassified","anchor":"- An online index covers only what was scanned. Ancestry scanned and indexed many, but not all, of the Presbyterian Historical Society's congregational records, and the Society keeps no central index of names. [S12] A miss in an Ancestry or FamilySearch index is not proof of absence. Use [Ancestry search recovery](ancestry-record-search-recovery.md) or [FamilySearch workflows](familysearch-practical-record-workflows.md) for index diagnosis. Record Hall's Index's cutoff (about 2015) as part of its scope.\n- A county history's statement that records \"no longer exist\" is the author's view when the history was written. Allen treats such records as possibly held elsewhere. [S6], [S7]\n- Repository databases are updated from time to time without announcement. Date each check. [S8]","sources":["S12","S6","S7","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8ee4e1a90ad","kind":"unclassified","anchor":"Return: the candidate register, expected record types, a custody trail (holder, how it was confirmed, catalogue checked, index scope), officiant leads (name, title, service dates, pastoral registers searched), and the bounded negatives.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7f9831a079c3","kind":"method","anchor":"- **Union churches:** In Pennsylvania German research, identify every congregation that used a union church building. Lutheran and Reformed congregations could share the building and clergy while keeping separate books or separate sections in one book. Search each congregation’s records; a shared building is not one merged register or proof of one denomination. [S30], [S31], [S32]","sources":["S30","S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1d6828c4bfe9","kind":"method","anchor":"- **Confirmation entries:** Use a confirmation entry to add a dated rite location and its sponsors or witnesses to the candidate register. Check that denomination’s and parish’s confirmation practice before estimating an age: teenage confirmation is not universal. The church’s location directs a residence search; it does not itself establish the person’s home address. [S35], [S36]","sources":["S35","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e4c08df1edc3","kind":"method","anchor":"- **Family, communicant and financial records:** Inventory more than the vital-event books: check family registers, communicant and membership lists, and administrative or financial records that may name donors. A family register groups entries by household; a communicant or contribution list gives another dated appearance. Preserve the recorded role rather than treating a donation or communion appearance as permanent membership. [S39], [S40], [S41], [S32]","sources":["S39","S40","S41","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f1630edd01ca","kind":"method","anchor":"- **Colonial Virginia:** For colonial Virginia, search the territorial Anglican parish’s birth/christening and death/burial registers even when the family belonged to another faith. Establish the parish boundary and surviving years first; a duty to report does not show that a particular event was entered or that its register survives. [S37], [S38]","sources":["S37","S38"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-46bbc0ea13fc","kind":"method","anchor":"- **Probate inventories.** Look for pews among the property [S42]. Of Joseph Alden’s two pews in his 1787 Middleborough inventory, only one is located, at Mr. Gurney’s meeting house [S43]. Trace that congregation and leave the other pew unassigned. Neither establishes attendance.","sources":["S42","S43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-12a3539629b5","kind":"method","anchor":"- **Moravian diaries:** For a person near the Moravian settlements of Wachovia, include the published Records of the Moravians in North Carolina. Its translated excerpts from congregation diaries, travel diaries and annual accounts discuss neighbours as well as Moravians. Follow an item to the cited diary or archival locator where needed, and keep a neighbour’s mention separate from evidence of Moravian membership. [S44], [S45]","sources":["S44","S45"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2dcb3f126afe","kind":"method","anchor":"- **Delayed baptism:** A baptism search confined to the birth year is incomplete. For a child served by visiting clergy, search the following years as well: baptisms could occur months or years after birth, and several siblings could be baptized together. Keep the stated birth and baptism dates separate; do not impose a one- or two-year maximum delay. [S33]","sources":["S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d93fe4d4e0b2","kind":"method","anchor":"- **Later copying.** At Little Wymondley, a certification dated 12 July 1867 follows Arthur Hose’s 1 November 1866 baptism and identifies the 1866 entries as copies. Reynolds suggests the minister used private notes. The certification does not identify his source [S34]. In a U.S. book, transcribe comparable copying statements and distinguish baptism dates from copying dates.","sources":["S34"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ebc428380302","kind":"custody","anchor":"- **Latter-day Saints:** For Latter-day Saint membership evidence, use the Church History Library’s Record of members collection, 1836–1970, and search the catalogue by the ward or branch. The library’s guide says acquisitions after the 1960s–1970s microfilming project are catalogued separately, so the main collection is not the whole search. Record the particular series and its access conditions, without assuming an online image is available. [S46 @2026-11-16], [S47 @2026-11-16]","sources":["S46","S47"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-46149aedb438","kind":"method","anchor":"- **Old Kanawha Baptist Church.** For the congregation in Pratt, West Virginia, search Eugene Lincoln Peck and Regina Peck Andrus’s *Old Kanawha Baptist Church Minutes, Indexed, Plus Unpublished County Court Records of West Virginia*. Check the July 1796–August 1845 transcription for meetings, baptisms and member dismissals. Search the separate county-record section in the same book and cite each hit to the section it came from. [S55], [S56], [S57]","sources":["S55","S56","S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6c993b4dc219","kind":"custody","anchor":"- **Connecticut historical society holdings.** Look for published church records and for church-record abstracts in the genealogical manuscripts filed by town or family at the Connecticut Museum of Culture and History in Hartford, formerly the Connecticut Historical Society. Use a copy or abstract to identify the congregation and trace the register. [S48 @2026-11-20], [S51 @2026-11-20], [S52 @2026-11-20]","sources":["S48","S51","S52"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-204a9da5e56e","kind":"custody","anchor":"- **Connecticut State Library.** Look up the town and congregation in *Church Records by Town*. Record the call number, reel or archival reference and distinguish original registers from copies. The SLI notation marks coverage by the separate Church Records Index. Use an index slip’s town, church, volume and page to locate the entry. If the needed register is outside the index, browse the relevant volume or reel by year. [S48 @2026-11-20], [S53 @2026-11-20], [S54 @2026-11-20]","sources":["S48","S53","S54"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-72516a086cd0","kind":"method","anchor":"- **Early Connecticut marriages.** Use Frederic W. Bailey’s *Early Connecticut Marriages as Found on Ancient Church Records Prior to 1800* to locate candidate entries. Use Scott Andrew Bartley’s annotated table of contents to identify the church, years and volume and page across the seven books. Check the original edition’s errata if the reprint omits them, and compare Bailey’s reading of each name with the church register. [S48], [S49], [S50]","sources":["S48","S49","S50"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-024f53fc16f9","kind":"custody","anchor":"**Catholic nuns and sisters.** For membership in a U.S. Catholic religious community, start with the archive of the specific congregation the nun or sister joined [S58 @2026-11-21], [S59 @2026-11-21]. If the custody path is unclear, look up the congregation by name or initials in *Women Religious History Sources: A Digital Guide to Repositories in North America* [S60 @2026-11-21]. Ask the archivist at the motherhouse if it holds the collection, or at the receiving repository if it was transferred, which series and years you can consult [S59 @2026-11-21], [S60 @2026-11-21], [S61 @2026-11-21].","sources":["S58","S59","S60","S61"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a28a771e4ac7","kind":"method","anchor":"- **Chestnut Ridge Baptists.** Search for the Maryland congregation under both Sater’s Baptist Church and Chestnut Ridge. Record General Baptist as the branch named in the congregation’s 1742 deed. In Baptist histories, use Particular Baptist as a search term for Calvinistic Baptists. [S62], [S63], [S64]","sources":["S62","S63","S64"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d2697224be1f","kind":"method","anchor":"- **Census of Religious Bodies.** When a U.S. record says only “Baptist,” compare candidate bodies in the Census Bureau’s *Religious Bodies: 1916*, Part II, or the *Baptist Bodies* section of *Religious Bodies: 1936*. Compare the bodies’ histories, doctrine, organization and geographic statistics. Use a Baptist congregation’s observance of Saturday as the Sabbath as a lead to check the Seventh Day Baptist heading. Confirm an individual’s affiliation in congregation records. [S62], [S65], [S66], [S67], [S68]","sources":["S62","S65","S66","S67","S68"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c707d7306072","kind":"method","anchor":"- **First Alfred Seventh Day Baptists.** For Alfred, Allegany County, New York, search Ilou M. Sanford’s *First Alfred Seventh Day Baptist Church Membership Records* (1816–1886). Follow references to early Rhode Island families when tracing a move to Alfred and verify the connection in the Rhode Island records. [S65], [S69]","sources":["S65","S69"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-003e91ec66f4","kind":"method","anchor":"- **Central New York Seventh Day Baptists.** Use the surname index in Sanford’s *Membership Records of Seventh Day Baptists of Central New York State, 1797–1940s*, then read the congregation group’s entries in order. Check Brookfield, DeRuyter, Scott, Verona or Adams Center as applicable. Read admissions, transfers out and any recorded origins or relationships. Treat a baptism as a believer’s baptism and establish age from a separately recorded birth date or other evidence. Distinguish the original entries from later typed lists where the compilation used them. [S65], [S70], [S67]","sources":["S65","S70","S67"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07c1eec459f9","kind":"method","anchor":"- **Western Association Seventh Day Baptists.** Search Sanford’s *Membership Records of Seventh Day Baptist Churches in Western New York and Northwestern Pennsylvania, 1800–1900*. Use the surname index and identify the church and town before using an entry. Check the original church series for years or congregations outside the compilation. [S65], [S71]","sources":["S65","S71"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-25cd677f4ac9","kind":"method","anchor":"- **Newport Seventh Day Baptists.** Use Ilou M. and Don A. Sanford’s *Newport Seventh Day Baptist Trilogy*. Search the 1671–1884 membership section and check which entries came from the First Baptist Church before the congregations separated. Compare names across dated lists to develop leads, then verify identity and kinship before connecting entries. Use the church history and the separate Hubbard study for context. [S65], [S72]","sources":["S65","S72"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a6c66e6bc40c","kind":"historical","anchor":"- **Early Connecticut.** For a Connecticut town before disestablishment in 1818, include the town’s Congregational church records when the family’s affiliation is uncertain. Use the town and period to choose registers. Treat a mention as evidence of the recorded event and look for an explicit membership entry before assigning membership. [S73], [S74], [S75]","sources":["S73","S74","S75"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a4ea4cc5950f","kind":"custody","anchor":"- **Western Pennsylvania United Brethren appointments.** For a United Brethren circuit minister, search the United Methodist Western Pennsylvania Conference’s *Historical Church Records* by district and congregation. Search the entries for the minister’s name and record each appointment and its years. Carry those places and dates into the search for the registers of the congregations served. [S76 @2026-11-22], [S77 @2026-11-22], [S78 @2026-11-22]","sources":["S76","S77","S78"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d261fd73e715","kind":"custody","anchor":"- **Swedish-American church books.** In ArkivDigital, look up the congregation in the U.S. archive listings and check the volumes and years individually. Include Swedish Free, Methodist and Baptist churches when the branch fits. Record the image as an ArkivDigital photograph of the church book when the volume is part of that photographed collection. If the congregation or years are absent, check the Swenson Center’s church-record listings for a microfilm copy. [S79 @2026-11-22], [S80 @2026-11-22], [S81 @2026-11-22], [S82 @2026-11-22]","sources":["S79","S80","S81","S82"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-59a730f597ce","kind":"custody","anchor":"- **Seventh Day Baptist originals.** Use the Seventh Day Baptist Historical Library & Archives church index under the congregation’s name to trace the records used in Sanford’s membership compilations. Match the record series and years to the published entry. [S65 @2026-11-22], [S83 @2026-11-22], [S69 @2026-11-22], [S70 @2026-11-22], [S71 @2026-11-22], [S72 @2026-11-22]","sources":["S65","S83","S69","S70","S71","S72"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ed92888ed602","kind":"method","anchor":"- **Membership books and newsletters.** Search the congregation’s name in catalogues of local libraries, historical societies and denominational or diocesan archives. Open the collection finding aid and check membership rolls and the congregation’s own newsletters as separate series, even when the catalogue title is just the name of the church. [S84], [S85], [S86]","sources":["S84","S85","S86"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a436f511f5e4","kind":"historical","anchor":"- **German-American registers around World War I.** Search German- and English-language entries for the same congregation. Check adjacent volumes when the German entries end. In Cincinnati’s Third German Protestant Church, the Sunday-school ledger switched to English in 1918, while the collection’s ledgers changed over a longer period. Check the language of each series before bounding a negative. [S87], [S88]","sources":["S87","S88"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7e99d9ba5341","kind":"method","anchor":"- **Dumbarton Methodist baptisms and marriages.** For Georgetown, now in Washington, D.C., search Jane Donovan’s *Records of Dumbarton United Methodist Church*, volume I. Use the alphabetical entries and the separate bride index for marriages. Bound a negative to the entries covered by the volume’s 1813–1991 span. [S89], [S90]","sources":["S89","S90"],"checked":null,"stated_as":"fact","review":"reviewed"}
