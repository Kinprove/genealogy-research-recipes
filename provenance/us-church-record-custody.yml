claims:
  - {"id":"C-7861e9ef0717","kind":"unclassified","anchor":"Use this when a U.S. ancestor's baptism, marriage, burial or membership record is needed and the denomination, the congregation or the current holder of its registers is unknown or uncertain. Before searching, work out the exact denominational branch, the record types that branch kept, the congregation or minister who kept the entry, and who holds those registers now. Do not report \"not found\" or \"records lost\" until that custody path has been checked. For tracing custody through jurisdiction and holding changes in general, use [locality coverage in research documentation](research-documentation.md). For directory addresses, use [city-directory observations](city-directory-observation-workflow.md). For church-news searching, use [newspaper search recovery](newspapers-com-search-recovery.md). For identity rulings, use [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-79bf78e4a91b","kind":"unclassified","anchor":"- **Lutheran:** find the synod. Brady says the Missouri, Augustana, Norwegian and Wisconsin bodies each have different archives. Her list also includes \"Concordia\", but the recording does not make clear which body she means. One reading is Concordia Historical Institute in St. Louis, which is the archives of the Lutheran Church–Missouri Synod [S19], the same body as her \"Missouri\" item. Identify the body before looking for its archive. She says synod membership was largely geographic or ethnic: Swedish immigrants and their children are probably Augustana. Augustana was the Swedish synod. [S4]\n- **Presbyterian/Reformed:** find out whether the congregation was Old School, New School, Associate (Seceder), Associate Reformed, Covenanter or General Assembly Presbyterian. Even a small town could have several Presbyterian churches belonging to different bodies. [S11] In 1858 the Associate Presbyterian Church and the northern Associate Reformed body merged to form the United Presbyterian Church of North America. The southern Associate Reformed Presbyterian church stayed separate. Carry the merger in the custody trail. [S10]\n- **Baptist:** name the specific body, for example Primitive Baptist or Seventh Day Baptist. Lisson treats Primitive Baptists as a distinct and difficult research target. [S2] Baptist congregations were autonomous and kept their own records, so there is no central denominational register to search. [S1], [S5]\n- **Society of Friends (Quakers):** the monthly meeting kept the records, and they are now deposited by yearly meeting, not in one central archive. Find which yearly meeting the monthly meeting belonged to at the date, then ask that yearly meeting's depository. Friends Historical Library at Swarthmore College is the official depository for many yearly meetings [S22]. Since 1965 Philadelphia Yearly Meeting has deposited records at either Swarthmore or Haverford College, so one meeting's records can be split between the two [S23]. Guilford College holds North Carolina Yearly Meeting [S24]. Earlham College holds Indiana, Western and Northern Yearly Meetings and the New Association of Friends [S25]. Ancestry's *U.S., Quaker Meeting Records, 1681–1935* can be searched and browsed by meeting [S26], [S27]. William Wade Hinshaw's *Encyclopedia of American Quaker Genealogy* gives abbreviated entries drawn from meeting records; check each entry you use in the meeting's original record [S26].\n- **Methodist:** a local church's registers stay with that church or its successor. When a church closed without a successor, its records went to its Annual Conference archives. The General Commission on Archives and History at Drew University, Madison, New Jersey, does not hold local church membership, baptism or marriage registers [S28].\n- **Episcopal:** registers stay with the parish. A closed church's records go to the succeeding congregation or to the diocese [S29].","sources":["S19","S4","S11","S10","S2","S1","S5","S22","S23","S24","S25","S26","S27","S28","S29"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e1bee23edb4a","kind":"unclassified","anchor":"- **Presbyterians** recognized two sacraments, baptism and communion. Expect baptisms to be more productive than marriages. [S10] Request the register (baptisms, marriages, members) and the session minutes as separate series. The minutes record the congregation's business and history. [S12] Look in session and membership records for transfers of membership. Houser found 1700s entries naming the Irish presbytery or parish a family transferred from. [S13]\n- **Baptists** practised believer's baptism, so do not expect infant baptisms. [S10] Do not look for confirmation registers. Expect minutes, including women's-group minutes, to be the main surviving series, and search for them first. Do not treat them as a fallback. [S4], [S8]\n- **Seventh Day Baptists:** Tanner reports that his ancestors' congregation kept only membership lists, with no births or deaths. [S1]\n- **Catholics:** expect parish registers of baptisms and marriages [S1], [S4], and expect a death or burial register as well. The Roman Ritual of 1614 gave forms for the parish books, including a book of the dead (*Liber Defunctorum*) [S20]. The Second Plenary Council of Baltimore (1866) told pastors to keep registers of baptisms, confirmations, marriages and funerals [S21]. Brady says many Catholic churches did not record burials, while French Canadian parishes regularly did [S4]. So do not assume every parish kept one. Before you mark it never-created or lost, check what that parish actually recorded and who holds its books now.\n- **Quakers:** expect minutes, membership books and registers of births, marriages and deaths or burials, and certificates of removal when a member moved to another meeting [S22], [S26]. Some meetings kept removal registers; others recorded removals only in the minutes, so check both [S26].","sources":["S10","S12","S13","S4","S8","S1","S20","S21","S22","S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fe045834c1ae","kind":"unclassified","anchor":"Membership lists are dated observations of presence. A first or last appearance brackets joining or leaving. It is not a birth or death. Where a body admitted members only at an older age, an admission is not a birth. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d7942dd67577","kind":"unclassified","anchor":"- **Catholic (territorial):** start with the parish whose boundaries cover the address. Check whether the nearest church was a mission or chapel without parish status, in which case its sacraments were recorded at the parish it belonged to. [S1] Record the parish, not just the church.\n- **Chosen-church denominations (e.g. Presbyterian):** members could attend the church they preferred. In rural areas that was often the nearest church. In towns it may have been any of several, reached on foot or by trolley. Keep every congregation of that branch active in the period as a candidate until its registers are checked. [S11]\n- **African American members:** search all local congregations of the denomination, not only historically Black churches. The archivists report finding African American members in the registers of other congregations. [S11]\n- **Rural or remote families:** Lefler notes they might use whichever preacher came through, of any denomination. Widen the candidate list across denominations. [S3]","sources":["S1","S11","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-19a518ee6151","kind":"unclassified","anchor":"- **Hall's Index of American Presbyterian Congregations** (Presbyterian Historical Society). The archivists describe volunteers compiling it from the presbytery rolls in the printed General Assembly minutes. [S11] The Society's own description adds annual denominational yearbooks and other denominational publications as sources, and says the index runs only to about 2015. You can search it by church name and by city or state, but not by county. Search every nearby town from a map, one at a time. Allow for a congregation's recorded place name changing with post-office or boundary changes. [S11]\n- **WPA Historical Records Survey Inventories of Church Archives**, published state by state from about 1936 to 1942. Lisson cites Michigan volumes digitized at HathiTrust. At least one Michigan volume has been confirmed in full view there, but check each volume you need. [S2]\n- **Community-news columns** (revivals, Bible schools, visiting speakers) to find small or independent churches you did not know existed. [S9], [S18]\n- **Denominational periodicals**, for example the Baptist *Biblical Recorder* in Lisson's area. It was founded in 1833 and moves to digital-only publication after 2026. [S9]","sources":["S11","S2","S9","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6571a00c7e4c","kind":"unclassified","anchor":"- Read the minister's return as well as the license. Record the officiant's name and literal title. \"M.G.\" means minister of the gospel and does not identify a denomination. [S17]\n- If the name is badly written, compare the same officiant's other entries in that register. Check whether he married siblings or other relatives. In Starkey's example, two siblings were married by the same pastor, and his church was still at the address given on the records. [S16], [S17]\n- Find his church through city directories or newspapers. [S17] Then ask that church for its own entry. It may include details the civil record leaves out, such as birthplace. [S16]\n- Search the archive catalogue under the pastor's name for personal pastoral registers. The Presbyterian Historical Society catalogues them that way. Record his dated service at each church. The archivists found that the registers they hold mostly show service at one church after another, with few overlaps. Still check for overlapping service before ruling a church out. [S11]","sources":["S17","S16","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d409da4109e6","kind":"unclassified","anchor":"- Baptisms clustered at intervals (for example every six weeks) suggest a visiting minister. Search the other churches he served. [S15]\n- Start at the nearest church, then widen the search. Check the other congregations in the same charge, the pastor's private registers (which he may never have copied into the congregation's book) and churches across nearby county lines. [S14]\n- A circuit preacher may have recorded an act somewhere other than where it took place, or may not have recorded it at all. [S3] An entry in a distant book does not show residence or attendance. Beidler gives the example of western Berks County families who appear in the register of an eastern Berks County church only because they shared its pastor. [S14]","sources":["S15","S14","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35d7cae9459d","kind":"unclassified","anchor":"- **Catholic:** a closed or merged parish's registers usually go either to the successor parish that absorbed its territory or to the diocesan archive, depending on the diocese. Crow gives the diocesan archive as the expected route. [S5] Diocesan practice varies, so ask the diocesan archive where the registers are held. Then check both places.\n- **Other denominations:** check the last minister, a neighbouring congregation of the same faith, local and state historical societies [S5], and the state or regional denominational body, such as a state Baptist association [S8]. Ask the local genealogical society what happened to the records. [S5], [S18] If the church still exists, contact its historian. [S8] For itinerant ministers (Allen's example is Methodist circuit riders), check the denomination's regional repositories and the county where the minister died. [S6], [S7]\n- When contacting the Presbyterian Historical Society, give the congregation name plus its city and state, because that is how its holdings are arranged. Have the staff confirm which records survive for that congregation before they say yes or no to a particular entry. [S12]\n- A denominational archive may document mainly the organization and its history rather than individual members. Tanner's examples include the American Baptist Historical Society and the Archives of the Episcopal Church. Check what it actually holds before treating it as the source of a person's record. [S1]","sources":["S5","S8","S18","S6","S7","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b2c3abad82b","kind":"unclassified","anchor":"Keep four states separate: **never-created**, **unlocated** (custodian unknown), **unsearched**, and **searched with no hit**. For each search, record the holder, the catalogue checked, the series and years inspected, and the index scope.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3a79af5f0189","kind":"unclassified","anchor":"- An online index covers only what was scanned. Ancestry scanned and indexed many, but not all, of the Presbyterian Historical Society's congregational records, and the Society keeps no central index of names. [S12] A miss in an Ancestry or FamilySearch index is not proof of absence. Use [Ancestry search recovery](ancestry-record-search-recovery.md) or [FamilySearch workflows](familysearch-practical-record-workflows.md) for index diagnosis. Record Hall's Index's cutoff (about 2015) as part of its scope.\n- A county history's statement that records \"no longer exist\" is the author's view when the history was written. Allen treats such records as possibly held elsewhere. [S6], [S7]\n- Repository databases are updated from time to time without announcement. Date each check. [S8]","sources":["S12","S6","S7","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8ee4e1a90ad","kind":"unclassified","anchor":"Return: the candidate register, expected record types, a custody trail (holder, how it was confirmed, catalogue checked, index scope), officiant leads (name, title, service dates, pastoral registers searched), and the bounded negatives.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
