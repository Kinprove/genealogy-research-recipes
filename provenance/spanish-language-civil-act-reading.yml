claims:
  - {"id":"C-event-date","kind":"method","anchor":"Keep the event date and the date the act was drawn up in separate fields. In a phrase such as *el veintisiete del corriente*, resolve the day against the month of the dated statement containing the phrase. If that statement is quoted in a later act, keep its own date as the reference point. Record nationality, reported origin, birthplace and residence separately when the wording distinguishes them [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-role-and-kin","kind":"method","anchor":"Read *denunciante*, *exponente* or *declarante* as the person making the report. Record the capacity stated for each person and any explicit kinship. In a birth act, mark each pair after *abuelos paternos* and *abuelos maternos* on the indicated side. Preserve *hijo natural* as the recorded status and check the period’s usage before drawing a conclusion about the parents’ marriage or legal parentage [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-delayed-book","kind":"method","anchor":"When the event-year birth book misses, search later filing years and check the catalogue for *inscripciones tardías de nacimiento* or *nacimientos fuera de término*. Look in a complementary book if the local series separates those acts. If one sibling was registered late, check nearby acts for others registered on the same visit. Record the year of birth, filing year and office separately [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-delayed-evidence","kind":"method","anchor":"If a delayed-birth act cites an *expediente*, locate it by the act number and the office that filed it. In a *testimonio*, check the opening and closing for the witness’s relationship and whether they personally witnessed the birth. Read each *certificado* for what it certifies. Cuba’s 2015 regulation distinguishes a sworn declaration from a later medical estimate of age, which supplies a different basis from a doctor’s contemporary statement about the delivery [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-packet","kind":"method","anchor":"Separate the marriage act and pronouncement from the application to marry. Look for *no había impedimento*, a documented resolution, an earlier spouse, or a reference to the *expediente matrimonial*. In the file, identify the *contrayentes* and read the declaration of freedom to marry, any signed consent required for that time and place, and proof of how an earlier marriage ended. Check for birth, marriage, divorce or death records filed as supporting evidence. Record each document’s date, issuing body and locator [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-witness","kind":"method","anchor":"Separate what the witnesses say about knowing the couple from what they say about an impediment or freedom to marry. Where kinship is unstated, a shared surname can guide a search for a common relative. If the witness’s relationship is still unresolved, compare census households or addresses for the same place and period to test a neighbor connection [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-death-informant","kind":"method","anchor":"Read the death informant’s stated relationship before weighting details about the deceased’s parentage or origin. If the relationship is unclear, compare civil birth and marriage acts for the informant and the deceased for a common relative or an in-law link. If the deceased’s age and parents are missing, carry the reported place of origin into a search of birth or marriage acts and test it against the resulting records [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-stillbirth","kind":"method","anchor":"For a *mortinato*, check the birth and death series and any separate fetal-death series for the jurisdiction and year. Use parents’ names and event date when the entry identifies the child as *N.N.*, *infante* or *párvulo*. Under Spain’s 1958 regulation, follow the *Libro Diario* to the distinct *legajo de abortos* when that rule applies, and preserve whether the entry places death before, during or after delivery [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
