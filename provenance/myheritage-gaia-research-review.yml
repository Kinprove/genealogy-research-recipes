  - {"id":"S3","kind":"web-page","urls":["https://dillmanfamilyassociation.org/2026/11/15/myheritage-gaia-research-agent-ai-genealogy-assistant/"],"published":"2026-11-15","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22.","entry_sha256":"2515ab7f88d59b8fbd9bdce446b13753ba4c7407a6b4cf82655eed1db69cd8ce","claims":["C-5fce86250115"],"review":"reviewed"}
claims:
  - {"id":"C-c3f7acb87ce3","kind":"platform-ui","anchor":"Sign in and open Research Agent from the MyHeritage Research page. Check the default tree on the default family site, because that is the tree context GAIA’s documentation describes. If the relevant branch is in a different tree, verify the context in the user’s account before supplying any missing facts. Use Manage trees to verify the default for that site. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cc4d929321be","kind":"platform-ui","anchor":"Submit one bounded research question in Research Agent after checking the data and tree context. Include only the names, approximate dates, places, relatives and variant spellings needed for that question. Keep unconfirmed identities and relationships marked as hypotheses. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f9cbc80a0ca1","kind":"platform-ui","anchor":"In Overview, open People to inspect each proposed person’s details, associated sources and relatives. Use Relevant sources to filter by type and, when helpful, sort by age or GAIA’s relevance confidence. Read the relevance explanation and verify what the record actually says. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c885b99c71df","kind":"platform-ui","anchor":"Open a cited source from the response and inspect the scanned image when the source pop-up offers one. Use Review and save to your tree to reach the full record page and its arrows to navigate the sources. Hold any save until each image and identity is checked. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f6cda196ed1a","kind":"platform-ui","anchor":"Treat a Lead as a locator for a manual search. Open the named repository or catalogue and check its holdings. If a source needs a separate external subscription, check access there or find another copy. A gap in GAIA’s results leaves that source unsearched. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b472bca418c7","kind":"platform-ui","anchor":"Select an in-conversation suggested search only if it tests a current hypothesis or opens a specific unsearched source. Check the suggested question before running it, and keep the result attached to the question it tests. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3eb723125e60","kind":"platform-ui","anchor":"Review GAIA’s proposed tree changes in Compare with your tree when offered. Save only the individually approved, verified changes. When starting without a tree, finish reviewing the connected people first and use the creation option only if offered and explicitly authorized. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5fce86250115","kind":"method","anchor":"Reopen edited profiles and verify the person, record link and fields actually saved in the user’s account. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
