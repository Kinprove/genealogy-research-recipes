claims:
  - {"id":"C-46b5615df661","kind":"method","anchor":"For Maryland or Delaware, search by keeper in Henry C. Peden Jr.'s *Colonial Tavern Keepers of Maryland and Delaware, 1634–1776*. Check for the spouse and residence. According to the presenter in the available excerpt, use the separate index to other names if the keeper entries give no hit [S1†]. Record whether the name occurs as a keeper or in another person's entry. Start with the record citation in the vignette. [S2]","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-43c7488ea408","kind":"method","anchor":"For a site on Virginia's Old Buckingham Road, check Agnes E. Gish's *Virginia Taverns, Ordinaries and Coffee Houses* by locality and road segment. Use the book's geographic scope before expanding to other counties. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8bfa58d38042","kind":"method","anchor":"According to the presenter in the available excerpt, carry a Baltimore County ordinary licence citation to the county court proceedings for the stated grant year [S1†]. Preserve the description of the premises and the keeper's role as written. Use [state archives county-record guides](state-archives-county-records-guides.md) to locate the court volume and [court case-file recovery](court-case-file-recovery.md) for associated papers.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-70781d28e854","kind":"method","anchor":"According to the presenter in the available excerpt, Peden's 1776 rates appendix supplies a separate lookup for listed goods and accommodations [S1†]. Check the jurisdiction, date, unit and amount before applying a rate to an establishment. In Maryland, use the applicable county-court schedule where surviving. The act printed in volume 36 required county justices to set rates for liquor and accommodations. Treat a prescribed rate as a schedule entry and require a transaction record to establish what a customer paid. [S4]","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
