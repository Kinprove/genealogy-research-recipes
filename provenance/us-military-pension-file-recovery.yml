  - {"id":"S62","kind":"web-page","urls":["https://genealogytipoftheday.com/index.php/2023/11/14/an-unapproved-pension-application/"],"published":"2023-11-14","retrieved":"2026-11-14","access":"read","rights":null,"basis":"read 2026-11-14","claims":["C-f5a5368a5571"],"review":"reviewed","entry_sha256":"ef20d2df5fce00ebf2c48fa08cb0a5a19bfc740bc047f9f005fb35a60ef767fd"}
  - {"id":"S63","kind":"video","urls":["https://www.youtube.com/watch?v=Opk_teD3ffo"],"published":"2022-04-01","retrieved":"2026-11-14","access":"read","rights":null,"basis":"transcript read 2026-11-14","claims":["C-2af1305957c9","C-b3a17a4684ef","C-a1bc4093e4c2"],"review":"reviewed","entry_sha256":"8d74d3b8275a2cabbd7811d2f12001224c9425ce9fbd96c204e2f5542f57dbef"}
