claims:
  - {"id":"C-45bfba21885a","kind":"unclassified","anchor":"1. Compare the service clue with a conflict, branch and unit. Save the source of that context;\n   an unusual name alone does not establish the correct soldier.\n2. Search a pension index covering the relevant service and claimant category. Do not assume\n   every person who served applied for a pension. Start with the federal series below. Several\n   are free online, so check them before paying for copies. The hosts are those named by NARA or\n   Fold3 on 2026-11-07; check each host's current coverage. [H4–H8]","sources":["H4","H5","H6","H7","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-25dd33c21fb6","kind":"unclassified","anchor":"3. Distinguish the pension application from the service record and any bounty-land application.\n   Record which of these you are trying to retrieve.\n4. Consult the current repository instructions before choosing a request route. NARA's older-record\n   page separates service requests from pension/bounty-land requests; NATF 85 concerns eligible\n   federal pension/bounty-land applications, rather than state or Confederate pensions.\n5. For a state or Confederate pension lead, identify the relevant state's custodian and holdings.\n   For a transferred file or uncertain repository, ask the custodian with the copied identifiers\n   instead of treating a historical storage rule as a current guarantee. [S1, S3, H1, H2]","sources":["S1","S3","H1","H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a7bbb7bfbdca","kind":"method","anchor":"Extend the index search to the soldier's brothers, sisters, sisters-in-law, widows and other\ndependent claimants, and give each of them a separate candidate row. A relative's file can hold\nfamily Bible pages, dates, or an affidavit in which a woman gives her married name and her\nrelationship to the applicant. Record each affiant's stated name, relationship and date as a\nsecond-party claim. In Samuel David Patillo’s pension papers, Mrs. M. J. Wise identified him as her brother [S83]. Compare the stated relationship with marriage and other independent records [S82].","sources":["S83","S82"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-39adb0fbb892","kind":"method","anchor":"List every conflict that overlaps the person’s lifetime, including regional and Indian wars. A Confederate veteran’s earlier Mexican War pension file held affidavits about the second wife’s disputed marriage [S84]. For each Confederate application, establish the applicant’s residence at filing, which can differ from the unit’s state. Search each later state of residence and check its eligibility requirements with the custodian [S1], [S85].","sources":["S84","S1","S85"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bf301cfce755","kind":"unclassified","anchor":"**Artifact:** A routing row: candidate ID, service evidence, conflict/branch/unit, record type,\nclaimant category, index/series coverage, current custodian, retrieval route and date checked.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-081aa8873178","kind":"method","anchor":"Where an available pension-abstract or full-text collection covers the question, search\nsupported target-name forms in the text as well as the claimant index. The target may appear in\nanother applicant's file. Retain the actual applicant/file locator and the abstract passage,\nthen seek that file and inspect the named person's stated role in the original document. Keep an\nunresolved locator or identity open. A name in the full text can identify a witness or fellow soldier even when the target never applied [S16], [S26]. Verify the role, service and any stated relationship in the original file.","sources":["S16","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5baebe14c61a","kind":"unclassified","anchor":"1. Open the index image when available. Copy the soldier and applicant names, service designation,\n   claim category, application number and certificate number exactly as supplied.\n2. Preserve prefixes, suffixes, filing dates, residence/state, transfer marks and marginal notes.\n   Do not combine an application's number with another claimant's or category's certificate.\n3. Keep the index collection/series, card/image locator and a saved image where permitted.\n4. Compare the card's service and applicant context with the intended candidate.\n5. Continue investigating an application with no certificate number or a rejection notation.\n   It may still have an application file and subsequent supporting documents; do not report\n   “no file” solely from an unsuccessful claim.\n6. If a mark suggests transfer, carry its exact wording into a custody inquiry. This recipe does\n   not assign a universal meaning or current storage location to every prefix. [S1, S2, S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb6ec8f2a10d","kind":"method","anchor":"A pension index can exist in more than one hosted version. The versions may be arranged\ndifferently and may carry different fields, such as a death date or place or a dependent's name.\nBefore ordering, check each version. Give each version its own locator row naming its series, and\nnote the fields it adds or contradicts. Do not merge the versions' fields into one card. Record a\nmiss separately for each series and search route. Where a version is arranged by state, unit,\ncompany and surname, browse the candidate’s company under each documented unit designation. Compare its cards with the name-search results and record any differences in names, units or dates [S86], [S87].","sources":["S86","S87"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d924e4321b85","kind":"method","anchor":"Compare the images when two indexes cover the same claim. An XC number at the bottom of one card can be missing from the other [S14]. Keep each image’s series, original number and filing or transfer dates. Take the additional identifier into the custody check and leave any mismatch open until the custodian confirms where the file is held.","sources":["S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7220413b9be4","kind":"method","anchor":"Read claimant details as of the filing date. Check how the series defines its state field and investigate a difference from the unit state as a possible move [S8]. Take the claimant widow’s marriage date from the file and look for earlier wives [S88]. When a card shows both spouses’ claims, copy both numbers and try the widow’s certificate number for the combined papers [S9]. Search remarried widows under each later surname. If a state roll reports only that the widow applied, request the application and decision before recording an award [S82].","sources":["S8","S88","S9","S82"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-67cb8378f585","kind":"method","anchor":"If an application or certificate number is unreadable, check whether a separately arranged\nindex covers that service and claimant category. Use supported regiment/company and applicant\ncontext to find a candidate; reconcile the claim category and application-versus-certificate\nfields before using its number. Preserve both index locators and literal readings with the\nresolution basis. For an unreadable number on an alphabetic card, try a separately arranged regiment and company index [S15]. Keep unresolved digits unreadable. Both cards may point to the same file.","sources":["S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b320767a9b9a","kind":"unclassified","anchor":"1. Check whether the result is only an index image, a selected extract, or a multi-image\n   application file. Inspect its description and image sequence rather than its search-result title.\n2. Compare multiple apparent file matches against the locator table; a name can produce more than\n   one candidate file.\n3. If ordering eligible older federal pension records, use NARA's current pension request\n   instructions and the identifiers you copied. The order form is NATF Form 85, which covers\n   federal service from 1775 to 1903, not state or Confederate service. Its product choices\n   distinguish a complete application file from a Pension Documents Packet containing selected\n   document types. NARA's fee page, read on 2026-11-07, lists:\n   - complete pension application file, pre-Civil War: $55;\n   - complete pension application file, Civil War and later: $80 for up to 100 pages, then\n     $0.70 a page, with a quote first;\n   - Pension Documents Packet: $30;\n   - bounty-land warrant application file: $30.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3079c84a4c23","kind":"unclassified","anchor":"A compiled military service record is a separate order on NATF Form 86 ($30). A land entry\n   file is ordered on NATF Form 84 ($50). [H1, H4]\n4. Choose the product that fits the question. For a question requiring the claim's progression\n   or witness material, request the complete-file option rather than silently substituting the\n   smaller packet.\n5. Record the selected product, request identifier, submission date, custodian and any page limit\n   or remaining-copy instructions in the actual order. Check current terms instead of carrying\n   a video's historical price or delivery estimate into the request.\n6. When copies arrive, record what was received and any stated omissions. Follow up on a\n   disclosed page limit or incomplete delivery when the missing material affects the question.\n   [S1, H1]","sources":["H1","H4","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3a7a18b72068","kind":"method","anchor":"When identifiable prior copies, dated notes or internal references describe particular papers,\ncompare them with the newly received package. Queue each unmatched item with its earlier\nlocator or observation basis and its current retrieval status. Sarah Cook’s later papers referred to marriage evidence submitted in 1816 that the researcher could not locate [S19]. Preserve the reference and leave the earlier testimony unrecovered.","sources":["S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-adf00748f494","kind":"unclassified","anchor":"1. Read the received file through once, including covers, administrative notes, rejected claims\n   and reconsideration material.\n2. Give each received image a stable ID in its original order. Group connected pages into\n   documents while preserving every image's original locator.\n3. Record the document type, date, creator, applicant and named people; distinguish an asserted\n   relationship from your interpretation.\n4. Create a chronological view of the documents without renaming away the original order.\n   Track applications, supplied proof, objections, decisions and later actions when present.\n5. Transcribe relevant passages with uncertain readings marked, and check them against the image.\n6. End with a claim-action timeline, source-linked leads and explicit gaps. Send identity,\n   relationship or conflicting-evidence conclusions to the evidence/proof workflow. [S1, S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-777cfb1e53ff","kind":"method","anchor":"For a Revolutionary War veteran's postwar household, look for a property or income schedule\nsubmitted to demonstrate need, together with its accompanying household statement or letter.\nBuild a dated household-and-means row: named people, stated relationships and ages, residence,\noccupation, ability to work, assets, debts and income, recording only fields actually supplied.\nKeep the applicant’s statement separate from a clerk’s or witness’s assessment. Cato Freedom’s declaration named daughters Charlotte and Aurelia and described each girl’s ability to work [S18]. Compare the people named with the contemporary census and inspect the pension images for the declaration and the clerk’s separate remarks [S17], [H3]. The schedule was drawn up to demonstrate need, so treat valuations as claims and leave unlisted relatives open.","sources":["S18","S17","H3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-07b09a5a3dbb","kind":"unclassified","anchor":"Never read a filing date as a death date. Take death dates from a document that states them, such\nas a drop report, a widow's declaration, or a later widow's proof that an earlier marriage had\nended ([Lisson's death-date session](https://www.youtube.com/watch?v=bc92E8Oq4zU)). Record such a\ndate as the claim's statement; it may be approximate or second-hand. A date dropped from the rolls\nis not automatically a death date. A widow's late application may reflect a later change in\neligibility rather than a recent death. Do not name a statute unless the file or an authoritative\nsource does ([Thomsen overview](https://www.youtube.com/watch?v=C2_9AVcodcg)). Treasury final\npayment cards and ledgers form a separate series from the application file. They may give the\npaying agency, the act, payment dates and a death. Cite their own locator and confirm the series\ncitation with the custodian\n([Strauss Revolutionary War talk](https://www.youtube.com/watch?v=nJsQ9ftU9iM)). None of these\nsources sets the proof requirements of any particular law.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e725f0149164","kind":"method","anchor":"Check federal and state service records for enlistments outside the pension narrative. One claimant’s Civil War pension omitted his later enlistment in the 13th U.S. Infantry [S89]; a different claimant’s federal pension omitted earlier Confederate service [S90]. Compare identifiers before linking the episodes and leave the reason for an omission open. If the pension index names a unit but its published roster omits the applicant, retain both findings, check whether the claim was allowed and look for independent service papers [S86].","sources":["S89","S90","S86"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ca3a80fb9ecb","kind":"unclassified","anchor":"> From these service clues and pension-index images, build separate candidate routing and\n> locator rows. Identify the current record-type/custodian route without assuming a card is the\n> file. Prepare the appropriate request with the exact identifiers and product scope; do not\n> claim it was submitted. For supplied file images, preserve original order, inventory every\n> image/document and build a claim-action timeline. Retain rejected applications, transfer marks,\n> uncertain readings and gaps. Do not decide identity or benefit entitlement.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b31e369ff9f1","kind":"historical","anchor":"When \"Invalid\" appears on the jacket of a military service record, read it first as the noun for a disabled or infirm soldier and look for evidence of a claimed service-related injury or disability; taking it to mean \"void\" can wrongly suggest that the enlistment or record had no force. [S20], [S21] The Legal Genealogist traces this usage in American service from the Revolution through Civil War pension forms. [S20] Confirm the reading from the injury or disability evidence in the record. [S20], [S22]","sources":["S20","S21","S22"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9ef2da8f027b","kind":"historical","anchor":"If a Continental soldier or officer is linked to a corps of invalids under the 26 August 1776 resolution, read that as placing the man among those entitled to a disability pension but found capable of guard or garrison duty, and do not assume that an \"invalid\" was unfit for any further service. [S20], [S23], [S24] Do not date the eight-company Corps of Invalids from that resolution, because it came from a later one of 20 June 1777. [S23], [S24] Do not infer a man's actual duties from the resolution alone. [S20], [S23], [S24]","sources":["S20","S23","S24"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7b2f05d9881c","kind":"portal-availability","anchor":"For a Navy veteran's own approved claim, use M1469, *Case Files of Approved Pension\n   Applications of Civil War and Later Navy Veterans*, arranged by certificate number\n   [H9 @2026-11-13]; Fold3 has it as \"US, Navy Survivors' Certificates, 1861-1910\"\n   [H10 @2026-11-13].","sources":["H9","H10"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-483f6a82ffb9","kind":"method","anchor":"If the man appears in the 1910 or 1930 census, read its military column before you choose a war to search. In 1910, column 30 marks a survivor of the Union or Confederate army or navy as UA, UN, CA or CN; in 1930, column 31 names a veteran's war or expedition, with CW for the Civil War and WW for the First World War [S48], [S58]. In 1910, columns 30–32 are often overwritten with tabulators' figures such as 2-1-0-0, which are not answers [S48]. Carry a marked answer into a routing row as a service lead.","sources":["S48","S58"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a343b7be5d82","kind":"portal-availability","anchor":"A widow who drew a pension on the service of more than one husband usually has a single\n   file, under the surname of her most recent husband. Search the remarried widows' indexes\n   under her later names: M1784 covers the War of 1812, the Indian wars, the Mexican War and the\n   regular army before 1861, and M1785 covers volunteer service in the Civil War and later wars\n   and the regular army after the Civil War. The index gives the claimant, the soldier and his\n   unit, and the pension number, and NARA names Ancestry and FamilySearch as hosts of both\n   indexes [H5 @2026-11-14].","sources":["H5"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e39a5e183aa4","kind":"method","anchor":"When the target has no file of his own, or his file says little about his service, also search\nthe files of men from his company. A man who never applied often testified for others, so search\nother applicants' files for his name [S26]; fellow soldiers' declarations can describe service\nthey shared with him [S51]. List each witness in the target's own file, with the relationship the\npapers give (neighbor, relative or fellow soldier), as an associate lead [S51]. Record another\nman's account of a shared tour as that man's claim about the target.","sources":["S26","S51"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d6d08686c95f","kind":"portal-availability","anchor":"A man with no pension file can still have a bounty-land application. For War of 1812 service,\nNARA files the pension and bounty-land applications together when the veteran applied for both,\nand files the bounty-land application separately when he received bounty land but died before\nhe could qualify for a pension [H5 @2026-11-14], [S57 @2026-11-14]. Search that separate series\n(NAID 567388) as its own route. NARA calls it only partially digitized on Fold3, where its index\nis \"US, Bounty-Land Warrant Applications Index, 1812-1855\" [H5 @2026-11-14], [S39 @2026-11-14].\nWhen the name is not found there, order the file from NARA (section 3) instead of recording a\nmiss.","sources":["H5","S57","S39"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7279364a0bfe","kind":"historical","anchor":"For a Revolutionary War claim, M804 holds only federal applications, approved or rejected;\npensions that a state granted and paid are not in it [S26], [S34]. Under the resolution of 26 August 1776 the states examined, granted and paid\nthe disability pensions; the federal government took over the payments under an act of\n29 September 1789, but not every state pensioner was moved to the federal roll [S25], [S27].\nFires in the War Department on 8 November 1800 and during the British capture of Washington on\n24 August 1814 destroyed most of the papers of the acts before 1818; the surviving federal files\nare mainly those of the 1818 and later acts [S25], [S27], [S34], [S63]. When a man was pensioned\nonly before 1818, a missing federal file is expected loss, not evidence that he had no pension.\nSearch the state's own pension records and published compilations, including Lloyd DeWitt\nBockstruck's *Revolutionary War Pensions Awarded by State Governments 1775–1874, the General and\nFederal Governments Prior to 1814, and by Private Acts of Congress to 1905*, which reconstructs\nsuch pensioners from state records and private acts of Congress [S27], [S63]. Under the act of\n1818 the applicant swore his declaration before a federal district judge or before a judge or\ncourt of record of the county, state or territory where he lived, so look for it in that\ncourt's records as well as in the federal file [S35], [S54].","sources":["S26","S34","S25","S27","S63","S35","S54"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9230cd4f7085","kind":"method","anchor":"If no general act covered the claimant, or the claim was rejected, search Congress's private\nclaims. A veteran or widow could petition Congress directly, and Congress passed private acts\nfor people the general pension laws did not reach [S27], [S28], [S54]. The petitions needed the\nsame kinds of evidence as a pension application, so read one as you would a pension file [S28].\nSearch NARA's House and Senate records for them with the terms private claims, petitions and\nmemorials, and committee papers [S28].","sources":["S27","S28","S54"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-574443e3538a","kind":"historical","anchor":"For a Revolutionary War file in M804, read the letter before the file number first. S marks a\nsurviving soldier's application whose widow did not apply; W a widow's application, filed alone\nor with the soldier's own; R usually a rejected claim but sometimes a Virginia veteran's claim\nfor half pay for life; and BLWt a bounty-land warrant application [S26], [S53]. A W file can therefore hold the soldier's own declaration, and an R does not prove that\nevery claim in the file failed: many files under the Virginia act of 5 July 1832 were numbered R\nalthough the claims were not rejected [S25], [S26].","sources":["S26","S53","S25"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6cb8b46fcf7e","kind":"method","anchor":"On an affidavit that does not state where the affiant lived, copy the venue line and the county\nnamed in the notary's or justice's certificate. Record the venue county as where the affiant was\non the affidavit's date: the certificate is meant to show where the act was performed [S49],\n[S59]. When the venue gives only a state, read the county of the officer's appointment as a lead\nfor that place, not as confirmed; USLegal states the general rule that a notary acts only within\nthat county, but not each state's historical rule [S49], [S59]. Neither county shows where the\naffiant lived [S59].","sources":["S49","S59"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9215e2f628a3","kind":"historical","anchor":"In a Union invalid pension file, expect a series of dated examining surgeons' certificates, not a\nsingle examination. The act of 14 July 1862 required invalid pensioners to be examined every two\nyears, some were examined yearly or twice a year, totally disabled pensioners were exempt, and an\nexamination could reduce a pension or remove it from the roll [S40], [S56]. Until 1882–83 a single\nphysician examined in most counties and boards of three or more in larger cities; from then a\nboard of three examined every claimant [S40]. Give each certificate its own row in the inventory\nand the claim-action timeline, and read the series for changes in the rating.","sources":["S40","S56"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dd8ce1f9e85e","kind":"historical","anchor":"The Treasury payment ledgers for the acts of 1818 through 1858 are NARA's T718. They are\narranged by act, then by pension agency, then roughly by the first letter of the surname, and\ngive each pensioner's allowance, the date payments began, a mark for each payment, and remarks\nsuch as a death or a transfer to another agency; payments were usually made twice a year, in\narrears [S29], [S60]. Build a dated row for each agency from the payment marks and transfers. It\nlocates the paying agency. William McCullar moved to New York in 1819 but requested a transfer in 1826; creation of the Albany agency moved his account again in 1831 [S29]. Compare each transfer with residence and burial evidence before you\ncall a transfer a migration [S54]. Letters the Pension Office sent can survive outside the file,\nin its Letters Sent, 1800–1866; some volumes are indexed by addressee, so search the names of\npeople who wrote on the pensioner's behalf as well as his own [S29], [S53].","sources":["S29","S60","S54","S53"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-25cf98ff14c3","kind":"portal-availability","anchor":"FamilySearch has the T718 images as \"United States, Revolutionary War Pension Payment Ledgers,\n1818-1872\"; despite the title, the volumes include widows and pensioners of later wars\n[S32 @2026-11-14], [S60 @2026-11-14].","sources":["S32","S60"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-badaebb74e8e","kind":"historical","anchor":"Follow a death or last-payment remark to the final payment. Under the act of 6 April 1838, heirs\ncould claim from the Treasury the pension accrued between the last payment and the death, and\nthose settled accounts often give the date and place of death and the heirs' names [S29], [S55].","sources":["S29","S55"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ee5f71ce66db","kind":"portal-availability","anchor":"Fold3's \"US, Final Payment Vouchers Index for Military Pensions, 1818-1864\" indexes final and\nlast payments to more than 65,000 pensioners of the Revolutionary War and some later wars. Each\nslip gives the paying agency, the act, the date of payment and the death date, and a star marks a\nvoucher that survives among NARA's selected final payment vouchers [S29 @2026-11-14],\n[S31 @2026-11-14]. Only the Delaware and Georgia vouchers are imaged on Fold3, and NARA says the\nseries is closed for digitization [S30 @2026-11-14]. Cite the index slip and the voucher as\nseparate items.","sources":["S29","S31","S30"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c15884d4bd5d","kind":"method","anchor":"Record the act each application, certificate or ledger entry names, then read that act's terms\nbefore you interpret the claim. The terms say what the claimant had to prove. Read a first\napplication filed soon after a new act as a sign that the act made the claimant eligible, not as\nnew need or a new disability, unless the papers say otherwise [S52], [S61]. A first pension in\n1832 or later is not a sign of short or doubtful service either: the man may not have qualified\nunder the stricter earlier acts [S52]. Take the terms from the statute or from a summary of the\nacts themselves, as the tables below do, not from a talk or a general history. The tables give\nthe main acts; the act the file names governs.","sources":["S52","S61"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b35ba79da60c","kind":"historical","anchor":"| Act | Who qualified |\n| --- | --- |\n| Resolution of 26 August 1776 | Officers, soldiers and sailors disabled in service, at half pay; the states examined, granted and paid the claims until the federal government took over payment under an act of 29 September 1789 [S25], [S27] |\n| 24 August 1780 | Widows and orphans of officers who died in service, at half pay for seven years; not the families of enlisted men [S25] |\n| 18 March 1818 | Nine months' service, or service to the end of the war, in the Continental Line or the Navy, and need; militia service did not count [S25], [S35] |\n| 1 May 1820 | The 1818 pensioners had to file certified schedules of income and property; those found not in need could be struck off [S25] |\n| 7 June 1832 | Six months' service in the Continental Line, state troops, militia, navy or marines; full pay for two years or more, less for shorter service; no test of need or disability [S25] |\n| 4 July 1836 | The widow of a man who qualified under the 1832 act, married before his last service ended [S25] |\n| 7 July 1838, extended in 1843, 1844 and 2 February 1848 | A widow married before 1 January 1794 [S25] |\n| 29 July 1848 | A widow married before 2 January 1800 [S25] |\n| 3 February 1853 | No limit on the date of the widow's marriage [S25] |\n| 9 March 1878 | The widow of a man who served 14 days or was in any engagement [S25] |","sources":["S25","S27","S35"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b3a17a4684ef","kind":"historical","anchor":"Read the bracket for the widow's marriage date from the act she applied under, and take the date\nitself from her proof. A widow pensioned under the 1853 act may have married the veteran long\nafter the war and need not be the mother of his children [S25], [S52], [S63].","sources":["S25","S52","S63"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a1bc4093e4c2","kind":"historical","anchor":"For a rejected Revolutionary War claim, look for the decision in the file or in *Rejected or Suspended Applications for Revolutionary War Pensions* (1852) [S26]. Compare the tours the applicant proved with the qualifying service under the act, including nine months in 1818 and six months in 1832 [S26], [S63]. For a widow, check the marriage-date evidence. In its sample of 34 rejected claims, Southern Campaigns found militia claims denied for absence from a roster even though the rules exempted militiamen [S26]. Record the stated reason and test it against the applicable rules before concluding the service was false.","sources":["S26","S63"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-75587e9a2ef6","kind":"historical","anchor":"| Act | Who qualified |\n| --- | --- |\n| Before 1871 (the \"Old Wars\" series, indexed in T316) | Men disabled by their service, and the widows of men who died of it [S33] |\n| 14 February 1871 | 60 days' service and an honorable discharge, for men who had not supported the Confederacy; widows married before the peace treaty took effect on 17 February 1815 who had not remarried [S36], [S38] |\n| 9 March 1878 | 14 days' service or any engagement, and an honorable discharge; their widows, with no limit on the marriage date [S37] |","sources":["S33","S36","S38","S37"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b7bed05fb095","kind":"historical","anchor":"Most War of 1812 files come from the 1871 and 1878 acts, and most of their applicants were\nwidows or minors [S33]. A veteran who was not disabled by his service and died before 1871 could\nnot get a pension; search for his widow's claim and for bounty land (section 1) [S50], [S51]. If a\nwidow qualified only under the 1878 act, compare her marriage date with 17 February 1815 before\nlooking for another reason [S36], [S50].","sources":["S33","S50","S51","S36"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bf43d4cf4c30","kind":"historical","anchor":"| Act | Who qualified |\n| --- | --- |\n| 14 July 1862 | Men disabled by a wound received or a disease contracted in service and in the line of duty; for a death from such a cause, the widow, then children under 16, then a dependent mother, then dependent orphan sisters under 16 [S64] |\n| 27 June 1890 | 90 days' service, an honorable discharge and a permanent disability, not caused by vicious habits, that prevented earning a support by manual labor; widows with no other support than their own labor, married before 27 June 1890, without proof that the death came from service [S43] |\n| 5 August 1892 | Women employed as army nurses for six months or more, honorably relieved, and unable to earn a support [S44] |\n| 3 March 1901 | A widow who was his wife during his service, was pensioned for a death from service and was dropped for remarrying, restored when widowed again or divorced on her own application without fault on her part, and left with no other support than her own labor [S65] |\n| 6 February 1907 | Age 62 or over, with 90 days' Civil War service (or 60 days in the Mexican War) and an honorable discharge [S45] |\n| 19 April 1908 | Widows of men with 90 days' service and an honorable discharge, married before 27 June 1890, with no test of support [S46] |\n| 8 September 1916 | The 1908 widows' pension extended to widows married before 27 June 1905; widows dropped for a later marriage, restored when widowed again or divorced on her own application without fault on her part [S47] |","sources":["S64","S43","S44","S65","S45","S46","S47"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-464f77b47100","kind":"historical","anchor":"Read the date and type of each Union application against this table before treating a late or\nrepeat claim as new illness or hardship; many veterans moved from their earlier invalid pensions\nto the 1890 act because it paid more [S41], [S56]. Read a denied claim as one that did not qualify\nunder the law in force when it was filed, not as evidence that the man did not serve, and order it\nas you would an approved file [S62]. An application number with no certificate number is a usual\nsign of denial, not the decision itself; keep the outcome open until the file gives it [S62]. Search the indexes under a woman's own names for a claim as a nurse, not only as a widow\nor dependant [S44], [S56].","sources":["S41","S56","S62","S44"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-918b01c4e235","kind":"historical","anchor":"A continuing Union widow's pension with no remarriage record does not show that she lived alone.\nRemarriage ended a widow's pension, the Pension Office reported widows who lived with a man\nwithout marrying for fear of losing it, and it could not end a pension for that cohabitation\n[S40], [S56]. From 7 August 1882, open and notorious adulterous cohabitation ended a widow's\npension from its start [S42]; look in a later file for an investigation and a termination. Where\nno marriage record existed, the Pension Office accepted evidence of cohabitation and general\nrecognition as husband and wife as proof of marriage, so read the witnesses' testimony before\ntreating a missing marriage record as no marriage [S40].","sources":["S40","S56","S42"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-file-multiple-claims","kind":"historical","anchor":"In a Revolutionary War file, sort the papers by claim before you build the timeline. One file can\nhold the applications of more than one claimant: the soldier, his widow or his children [S34],\n[S66]. A veteran rejected under one act could reapply years later under another, so a rejected\nclaim and a granted one can share the file [S66]. A W number names the widow's pension; read every\nimage for the soldier's own declaration and the decisions on his claim before you treat the file\nas hers alone, because her file may or may not include his [S34], [S66]. The papers are in no\nparticular order, and important ones can lie near the end [S66].","sources":["S34","S66"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-file-claim-sort","kind":"method","anchor":"Give each document in the image/document inventory the claim it belongs to: the soldier's, the\nwidow's, a rejected claim, another claimant's, or unassigned when the papers do not show it. Then\norder each claim's documents by date in the claim-action timeline. Record the sort in the tables;\nkeep the original image order and filenames. A rejected application may need its own timeline even when the archive filed it alongside an awarded claim [S67].","sources":["S67"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1812-pension-jacket","kind":"historical","anchor":"For War of 1812 pensions, the M313 index images reproduce the faces of the file envelopes\n[S74]. Read `S` in `SO` and `SC` as Survivor. For the Survivor and Widow entries, copy Original\nas the application number and Certificate as the award number for that claimant [S75], [S76].\nCopy the veteran's rank, militia unit and captain where the jacket supplies them, then check\nthe service verification inside the file [S74], [S75]. If the jacket shows a widow's award,\nread the file for the veteran's own application and for earlier or rejected claims. Leave the\nveteran's outcome open until you find his decision. If the widow field is blank, leave the order\nof the spouses' deaths open and check the marriage and death evidence against the acts in\nsection 5 [S74]. In the Morgan jacket, Rebecca’s WO 9611 and WC 5199 identified her application and award while leaving Willis Morgan’s own pension outcome open [S73].","sources":["S74","S75","S76","S73"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-rev-war-volunteer-text","kind":"portal-availability","anchor":"For Revolutionary War pensions, use the NPS–NARA transcription project as a text route into the\nfiles. Citizen Archivist transcriptions are searchable in the National Archives Catalog\n[S68 @2026-11-18], [S71 @2026-11-18], [S72 @2026-11-18]. Use a hit to locate the corresponding\nimage and cite its page. Keep untranscribed pages open after a text-search miss.","sources":["S68","S71","S72"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-court-testimony","kind":"method","anchor":"Read a Revolutionary War court declaration as testimony given to establish eligibility under\nthe named act [S68], [S66]. In the 1832 veteran's interrogatories, record birthplace and birth\nyear, residence when called into service, residences since the war, and residence at the time\nof the declaration as separate entries. Keep the court venue separate from the wartime residence\n[S69]. Log each witness and what the witness attests to, distinguishing service or marriage\ntestimony from a statement about the applicant's reputation [S66], [S69].","sources":["S68","S66","S69"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-personal-accounts","kind":"method","anchor":"Read the letters, diaries and other personal accounts in a Revolutionary War file for leads\nabout the writer's or applicant's occupation and residence. If someone is named as providing\nland, record who made that statement and carry the named person into the land-record search.\nKeep personal accounts attributed to their writers [S68], [S34].","sources":["S68","S34"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-extended-kin","kind":"method","anchor":"For kin beyond the veteran's household, look in the Revolutionary War file's family records and\naffidavits for grandchildren or children’s spouses [S68], [S34], [S70]. The abstracts for file W25706 identify Joseph H. Mitchler as a grandson and William Lewis as a son-in-law from their own testimony [S81]. Record each relationship with its speaker and check the affidavit image.","sources":["S68","S34","S70","S81"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-voucher-representative","kind":"method","anchor":"In a surviving Revolutionary War final-payment voucher, copy each named person's role. An\nattorney, executor or estate administrator is a lead to the claim or estate papers. Keep that\nrole separate from any stated relationship or heirship. For someone acting on behalf of a widow, read the voucher’s authorization before entering the representative among the heirs [S30], [S80].","sources":["S30","S80"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1812-disability-route","kind":"method","anchor":"If a War of 1812 file suggests a separate pension for service-connected disability, check the\nOld Wars index (T316) and confirm the pension type from the papers. Keep that search open even\nwhen you already have a service-pension jacket [S33], [S74]. The Morgan cover prompted a separate disability-pension search, but the cover alone did not identify a disability award [S73].","sources":["S33","S74","S73"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-union-invalid-commissioned-grade","kind":"historical","anchor":"For an officer's disability pension under the act of 14 July 1862, take the grade from the\ncommission. Treat a lieutenant's acting command as a duty assignment until you find evidence of\na higher commission [S78]. If the file invokes the act of 24 February 1897, check for a qualifying\nappointment or commission and the record of its recognition, even if the commission was never\ndelivered [S79]. The William A. Knilans discussion illustrates why a lieutenant’s acting command and evidence for pensionable rank should be recorded separately [S77].","sources":["S78","S79","S77"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fold3-rev-war-full-text","kind":"platform-ui","anchor":"In Fold3's Revolutionary War pension collection, use full-text search for the names of the\nveteran, relatives and witnesses alongside the claimant search. Check whether a hit is in\nsomeone else's application. Keep a text miss open because handwriting recognition can miss\nnames [S91 @2026-11-20], [S92 @2026-11-20], [S113 @2026-11-20].","sources":["S91","S92","S113"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dar-rev-war-pension-index","kind":"platform-ui","anchor":"In the DAR Genealogical Research System, open the Revolutionary War Pension Index from the Rev\nWar tab [S94 @2026-11-20]. Following the suggestion from the available excerpt of the DAR\ninterview, search its index of abstracts for applicants and for people named in other files\n[S93 @2026-11-20], [S95 @2026-11-20]. Use the entry to find the M804 file and cite the image\nthat supplies the evidence.","sources":["S94","S93","S95"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-jacket-transfer-leads","kind":"method","anchor":"For a Revolutionary War payment search, distinguish the outer file envelope from the inner\npension jacket. Following the example from the available excerpt on Daniel Waldo, treat\ncrossed-out place names as agency leads and copy them along with the names left standing\n[S111]. Follow each transfer into the receiving agency's T718 ledger, including returns\nto an earlier agency. Look in the application file for a transfer request and record its\ndate and both agencies.\nKeep the state of service separate from the paying agency [S29].","sources":["S111","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ancestry-t718-ledger-route","kind":"portal-availability","anchor":"For T718 on Ancestry, use collection 1116, *U.S., Revolutionary War Pensioners, 1801-1815,\n1818-1872*. Search by the pensioner's name, then browse the ledger images by act and agency\nwhen the name search misses [S109 @2026-11-20], [S102 @2026-11-20]. Use the agency leads\nfrom the available excerpt on Daniel Waldo to choose volumes [S111 @2026-11-20]. Check the\nseparate Albany agency when the transfer points there, and include the invalid or widow\nvolumes when the claim calls for them [S109 @2026-11-20], [S29 @2026-11-20].","sources":["S109","S102","S111","S29"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-selected-voucher-route","kind":"custody","anchor":"Use the T718 ledger or the final-payment index slip to carry the pensioner's name, paying\nagency, act or pension class, and payment quarter and year to the vouchers. Follow a starred\nslip to RG 217, Selected Final Payment Vouchers, Entry A1-722, NAID 605894. The series\nholds vouchers pulled from the larger Settled Accounts of Pension Agents\n[S30 @2026-11-20], [S29 @2026-11-20]. For Georgia, follow the lead from the available excerpt\non the Georgia militia to the selected vouchers [S101 @2026-11-20]. Retrieve them on\nmicrofilm M1746 [S102 @2026-11-20].","sources":["S30","S29","S101","S102"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-settled-accounts-route","kind":"custody","anchor":"If the slip lacks a star or the selected voucher is missing, check for a transfer and look\nfor a voucher in the M804 file when the envelope marks one as received from the GAO. Then use\nthe quarterly abstracts to find the voucher number in RG 217, Settled Accounts of Pension\nAgents, NAID 302049. Use the agency, quarter and pension class to locate the bundle and browse\nthe vouchers if its abstract is missing [S29 @2026-11-20],\n[S30 @2026-11-20].","sources":["S29","S30"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-quarter-and-accrual","kind":"historical","anchor":"Under the act of 7 June 1832, payments could accrue from 4 March 1831. A ledger entry starting\nthen can belong to the 1832 act [S112]. Read the ledger's numbered payment marks by quarter.\nUse the example from the available excerpt on Daniel Waldo to keep the dates covered, actual\ncollection date and any death notation in separate fields [S111]. If a year is written\nabove a quarter mark, copy both and check the collection date in the voucher [S29].","sources":["S112","S111","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-last-payment-and-collector","kind":"method","anchor":"Treat the last payment at one agency as a cutoff for that agency's account. Check for a\ntransfer or an unclaimed balance before treating it as the end of the pension [S29]. When\na payment postdates a recorded death, read the voucher receipt, affidavit and any power of\nattorney to identify the collector and beneficiary [S30]. The examples on Isaac Kingman and\nDaniel Waldo illustrate this distinction. Access to each was limited to a transcript excerpt\n[S110], [S111].\nInvestigate named witnesses as associates or possible kin.","sources":["S29","S30","S110","S111"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-trace-voucher-death-source","kind":"method","anchor":"Following the example from the available excerpt on Isaac Kingman, trace a death date repeated\non a pension jacket, ledger and index slip to the paperwork in the voucher [S110]. Check for\na clerk's certificate or an affidavit that states the date and record\nwho supplied it. Count a date copied from the ledger onto the slip as one evidence chain\n[S29], [S30]. William McCullar's death was recorded a year late in both pension\nrecords and the 1835 roll [S29].","sources":["S110","S29","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-1852-report-search","kind":"historical","anchor":"In the 1852 Secretary of the Interior report, use the state index in the Clearfield reprint\nand check both the rejected and suspended lists under the applicable act, following the\nsearch from the available excerpt on rejected and suspended claims [S96], [S97], [S98].\nFor a county that later became part of West Virginia, search under Virginia. Copy the\nsoldier, widow if named, reported residence, act, disposition and stated reason into the\nclaim timeline [S99], [S100].","sources":["S96","S97","S98","S99","S100"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-rejection-and-suspension-proof","kind":"method","anchor":"For a suspension, use the stated reason to identify the evidence still wanted. For a rejection\non service grounds, use the examples from the available excerpt to distinguish failure to\nprove any qualifying service from failure to prove the required duration [S96]. If the\ndecision concerns team or wagon work, check for service under military authority. For a\nwidow's claim, distinguish missing marriage proof, a missing marriage date, and a proved\nmarriage outside the act's limits [S99], [S112].","sources":["S96","S99","S112"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-death-and-early-half-pay-routes","kind":"historical","anchor":"For a War of 1812 death lead, follow the route from the available excerpt and use the M313\nindex to find the widow's application and supporting papers [S103], [S74].\nRead her death statement there. For an early half-pay claim, also search the\nSecretary of War's report of 5 January 1818 (H. Doc. 15-35). Copy the named beneficiaries and\ncertificate number when given [S105], [S106]. Verify each relationship in the application or other records.\nFor half pay in lieu of bounty land under section 2 of the act of 16 April 1816, the five-year\nterm was computed from 17 February 1815 [S107]. Use an explicit death statement to date the death.","sources":["S103","S74","S105","S106","S107"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-pension-roll-of-1835","kind":"portal-availability","anchor":"If the pensioner was alive into the 1830s, check Ancestry's *U.S., The Pension Roll of 1835*\nby state and compare any hit with the earlier certificate and pension papers before linking\nthe entries [S108 @2026-11-20], [S106 @2026-11-20].","sources":["S108","S106"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-death-and-disability-indexes","kind":"method","anchor":"Use the Old Wars search from the available excerpt for a War of 1812 disability or death\nclaim [S103]. Include Army, Navy and Marine Corps claims in that search. For\nmilitia service, check M313 as well as T316 and classify any hit by the act and papers it\nidentifies [S104], [S33], [S74].","sources":["S103","S104","S33","S74"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-revolutionary-pension-route","kind":"portal-availability","anchor":"For a Revolutionary War claim, also search MyHeritage's *Revolutionary War Pension Records*\n(collection 10021) for pension and bounty-land applications. The public collection page\nmarks it free. Check whether the result and its images open in the user's account, and\ncompare the packet with M804 before treating it as complete [S115 @2026-11-21],\n[S116 @2026-11-21].","sources":["S115","S116"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-charleston-unit-or-individual-capture","kind":"method","anchor":"For possible capture at Charleston, follow the lead from the available excerpt [S129] to the\npension and bounty-land references in Carl Borick's *Relieve Us of This Burthen* [S130]. Check whether those papers place the soldier's unit in the city at surrender or\noutside it. Keep the individual's capture open until evidence identifies\nhim among those taken.","sources":["S129","S130"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rev-war-jacket-award-or-bounty-only","kind":"method","anchor":"On an M804 jacket, read numbered S and W as survivor and widow award identifiers and verify\nwhose award the papers document [S66]. The jacket from the available excerpt held\nbounty-land papers alone [S128]. For a BLWt jacket, inventory the bounty claim and look\nseparately for an award before recording a pension [S26].","sources":["S66","S128","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-t317-filing-fields","kind":"portal-availability","anchor":"In FamilySearch's T317 index (*United States, Mexican War Pension Index, 1887–1926*), use\nthe event date and place to locate the earliest filing. Read the card image to assign\nthe filing to the veteran or widow and copy any occupation, department or act written\nthere, following the example from the available excerpt [S125 @2026-11-21], [S126 @2026-11-21].","sources":["S125","S126"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ordinary-army-pension-voucher-collection-quarter","kind":"custody","anchor":"In RG 217, Inventory 14, Entry 721, use the agency, actual collection quarter and\nyear, and act or pension class to locate the settled account. If the abstract is\nunbound, check the first folded paper in that quarter's bundle. If the expected quarter\nis empty, browse later quarters and the next year for delayed or combined payments\n[S29 @2026-11-21]. Following the distinction from the available excerpt, record the voucher number and\nwhether and when the payment was collected apart from the application and award\n[S118 @2026-11-21].","sources":["S29","S118"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-april-1838-transfer-and-purpose","kind":"historical","anchor":"Read the Treasury transfer under the act of 6 April 1838 as a lead to unclaimed pension\nmoney. The act set the threshold at eight months after payment became due [S119]. Verify\nwhether the payment was to the pensioner or to a survivor or representative before using\nit as a death lead. Compare the recipient and purpose on repeated notices under that act\nbefore filing them as copies, using the example from the available excerpt [S118].","sources":["S119","S118"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-entry-724-claims-and-finding-aid","kind":"custody","anchor":"Check the pension application for a notice referring to the act of 6 April 1838. Test\nshortened notes such as “6 April” or “April 1838” on the final-payment index slip against\nthat act, following the lead from the available excerpt [S121 @2026-11-21]. Search\nCraig R. Scott's *The “Lost” Pensions: Settled Accounts of the Act of 6 April 1838* by\nname. Carry the payment year and account number into RG 217, Inventory 14, Entry 724,\n*Settled Accounts for Payment of Accrued Pensions (Final Payments)*, August 1838 to\nSeptember 1865. Check the account for the pension certificate and evidence from heirs\n[S29 @2026-11-21], [S120 @2026-11-21]. Search each distinct account given on the\napplication notices, using the example from the available excerpt [S118 @2026-11-21].","sources":["S121","S29","S120","S118"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-april-1838-comptroller-review","kind":"custody","anchor":"To trace Treasury review of an accrued-pension claim under the 1838 act, carry the\nclaimant, payment year and account number from the Third Auditor's account into the Second\nComptroller's Army Pension Division records, RG 217, section 217.4.4 of the Archives\nguide. Check the registers and decisions for the amount reviewed. Follow the review\nlead from the available excerpt [S118 @2026-11-21], [S122 @2026-11-21], [S131 @2026-11-21].","sources":["S118","S122","S131"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-treasury-warrant-and-post-death-check","kind":"custody","anchor":"For a Union Civil War pension payment with a warrant lead, check the Treasury pay-warrant\nindexes (RG 39, 1861–1919) [S132 @2026-11-21]. Search by year, issuing department, warrant\ntype and number, using the example from the available excerpt [S118 @2026-11-21]. Copy any\naddress from the matched document.","sources":["S118","S132"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-treasury-check-issued-after-death","kind":"custody","anchor":"If a pension check is dated after the pensioner's death, use the route from the available excerpt\nto RG 217, Entry 728, *Applications for Payment of Checks Issued to Deceased Pensioners*,\n1889–1919 [S118 @2026-11-21], [S122 @2026-11-21]. Check for an application for payment\nwithout administration and identify the applicant and recipient from the papers.","sources":["S118","S122"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-navy-pension-account-series","kind":"custody","anchor":"For Navy pension payments, follow the accounting route from the available excerpt to the\nFourth Auditor's records in RG 217 [S118 @2026-11-21]. In section 217.9.3 of the Archives\nguide, look for certificates of settlement of pension accounts (1824–1870), records of\npayments (1859–1901) and indexes to pension agents' accounts (1816–1895). The Fourth Auditor\nsucceeded the Accountant for the Navy in 1817. Search the predecessor's records under the\nsame office heading for the period beginning in 1798 [S122 @2026-11-21].","sources":["S118","S122"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-inventory-bounty-land-among-pensions","kind":"method","anchor":"In M804, look through the whole sequence for bounty-land papers. Record each by its\nclaim and benefit type, following the lead from the available excerpt on bounty-land\npapers inside a pension file [S26], [S117]. In a combined War of 1812 file, classify a\nwidow's pension and bounty-land applications by the benefit named on each form. Link\nher evidence of her husband's service, their marriage and his death to the filing\nit supports, even when the forms look alike [S114], [S33].","sources":["S26","S117","S114","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-of-1812-reconcile-enlistment-details","kind":"method","anchor":"For a War of 1812 widow's account of enlistment, record the widow as the informant.\nAttribute the enlistment age, birthplace, occupation, height, complexion, and eye and hair\ncolor reported about her husband to the veteran. Use the veteran's age and the date on a\nbounty-land application to estimate his age at the documented enlistment date, or at the\nstart of the war as a preliminary check [S114], [S33]. Compare that estimate with his\nreported enlistment age and test any claim of full-war service against dated enlistment and\ndischarge entries. In the magazine's example, the widow recalled full-war service and the\nfile gave a shorter dated term [S114].","sources":["S114","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1832-revolutionary-war-service-recollection","kind":"method","anchor":"In an 1832 Revolutionary War declaration, build a row for each claimed tour with terms\nof enlistment, dates, officers, campaigns and engagements. Treat those dates as a\nrecollection made decades later, following the caution from the available excerpt [S117]. Compare\ndates and sequence with service records and the dates each supporting witness actually\nattests to [S66].","sources":["S117","S66"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-treasury-ledger-color-annotations","kind":"method","anchor":"If a grayscale image leaves a Treasury ledger annotation ambiguous, compare it with a\ncolor image or the original. Check later marks for a stated death date or a reference\nto an accrued-pension account, following the example from the available excerpt [S118].\nRecord the mark as written and verify its meaning against the voucher or account [S29].","sources":["S118","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-half-pay-treasury-registers-and-accounts","kind":"custody","anchor":"For early War of 1812 widow or orphan half pay, browse the Paymaster General's\nstate-arranged register (RG 217, Entry 587) for the soldier, the recipient and payment\ndates. If the left column gives an account date, follow the cross-reference\nfrom the available excerpt into Entry 516, *Settled Accounts of Army Paymasters*\n[S118 @2026-11-21], [S122 @2026-11-21]. Also check the Third Auditor's half-pay register,\nEntry 588, for the claimant and payment dates [S123 @2026-11-21].","sources":["S118","S122","S123"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1812-half-pay-widow-paymaster-cross-reference","kind":"custody","anchor":"In RG 217, Entry 726, search the settled accounts for payments to War of 1812 widows\nor orphans, July 1812 to August 1825. If the packet gives a Paymaster General reference,\ncarry its office, account number and date into Entry 516 for the underlying application.\nCheck the application for the marriage place and date, officiant, witnesses and each\nchild's birth date, including births after the soldier's death, following the case\nfrom the available excerpt [S118 @2026-11-21], [S122 @2026-11-21], [S123 @2026-11-21],\n[S124 @2026-11-21].","sources":["S118","S122","S123","S124"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mexican-war-teamster-service-status","kind":"historical","anchor":"For a Mexican War Quartermaster teamster's claim under the act of 29 January 1887,\ncheck for enlisted service, civilian employment, or a Congressional resolution\nnaming the claimant for specific service. Compare any evidence of enlistment, service\nand honorable discharge with the act's terms [S127]. Treat the job title as an\noccupation and test the contractor explanation from the available excerpt against the\nstated reason for denial [S125].","sources":["S125","S127"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-of-1812-online-file-routes","kind":"portal-availability","anchor":"Search the War of 1812 pension files on Fold3 before paying for a copy. The\nPreserve the Pensions project makes the digitized images free to view there\n(S156 from the available excerpt) [S156 @2026-11-22], [S133 @2026-11-22].","sources":["S156","S133"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-southern-campaigns-pension-transcriptions","kind":"portal-availability","anchor":"Search the Southern Campaigns Revolutionary War Pension Statements site for a name or\nfile number when looking for a transcript (S162 from the available excerpt) [S162 @2026-11-22], [S145 @2026-11-22]. Copy the pension number\nfrom the result and use it to find the M804 images. Carry untranscribed papers forward\nas gaps in the text search.","sources":["S162","S145"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-general-index-myheritage","kind":"portal-availability","anchor":"For another name-search route into the general pension index, use MyHeritage's *United\nStates, General Index to Pension Files, 1861–1934*, collection 21045 [S134 @2026-11-22], [S135 @2026-11-22].\nTreat the result as fields extracted from an index card. Check the card image for\nthe filing place and date, claimant and each application and certificate number\nbefore carrying any field into the request [S135 @2026-11-22].","sources":["S134","S135"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-spain-t288-search","kind":"method","anchor":"For Spanish-American War service, search T288 even when the collection is titled\n*Civil War Pension Index*. Compare the unit, service dates and the veteran's and\nwidow's filing dates on candidate cards with the known chronology. Carry the\ncorresponding card forward when those particulars support the match (S159, S160 from the available excerpt of each source) [S159], [S139], [S160].","sources":["S159","S139","S160"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-union-claimant-fields","kind":"historical","anchor":"On a Union pension index card, put the Invalid or Soldier's Original entry under the\nveteran's own application. Record the widow and minor entries separately, distinguishing\nOriginal (application) from Certificate (award) (S157, S160 from the available excerpt of each source) [S157], [S160], [S142], [S76].\nA widow's filing gives a provisional latest bound on the soldier's death. Keep the\nactual death date open and find the death proof in her papers [S140]. If a minor's\nclaim follows a remarriage, look for the guardian's appointment and the child's\nbirth evidence before assigning the child's identity [S76].","sources":["S157","S160","S142","S76","S140"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-file-number-sequence","kind":"method","anchor":"For a Civil War or later claim, read the numbered fields and cross-references in\nsequence. Carry the confirmed C or XC file designation when one supersedes the\nearlier numbers. Otherwise follow the certificate for a granted claim or the\napplication for a claim without an award. Keep all earlier numbers as cross-references\n(S157 from the available excerpt) [S157], [S141]. If the cards omit a later identifier, compare any earlier\narchival reply with the card images. Record the reply's locator and the number it\ngives before reusing the original request details (S160 from the available excerpt) [S160].","sources":["S157","S141","S160"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pension-numerical-index-cross-check","kind":"portal-availability","anchor":"When T288 and T289 disagree or a number is hard to read, look up each candidate number\nin A1158, *Numerical Index to Pensions, 1860–1934*. On Fold3, look for it under\n*Pension Numerical Index*. The digitized run is partial\n[S137 @2026-11-22], [H5 @2026-11-22]. On the numbered card, find the service and claimant category, then\nread Original or Orig. for the application and Certificate or Ctf. for the award.\nRead W in a dependent certificate row as Widow. If an application entry supplies\na certificate number, open that numbered card too. Resolve a number only\nwhen the veteran's name, unit and claimant category agree. One number can index\nunrelated applications and awards (S157, S158 from the available excerpt of each source) [S157 @2026-11-22], [S158 @2026-11-22], [S136 @2026-11-22].","sources":["S137","H5","S157","S158","S136"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-old-wars-enlistment-to-pension","kind":"portal-availability","anchor":"In FamilySearch's T316 *United States, Old War Pension Index, 1815–1926*, open\neach candidate card. Its event date and place locate the first filing by the veteran\nor a dependent [S138 @2026-11-22]. Compare rank, company and regiment with the Register of\nEnlistments and test the filing date against discharge and the claimant's identity.\nKeep birthplace and place of filing in separate fields. If the enlistment entry\nexplicitly gives a pension certificate, use its number where legible to test any\nsame-name T316 or T318 hit. An application alone cannot corroborate the stated award.\nCarry the matched T316 locator into the NARA Catalog's Old Wars case files, NAID 1105306\n(S158 from the available excerpt) [S158 @2026-11-22], [S138 @2026-11-22], [H5 @2026-11-22].","sources":["S138","S158","H5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-heritagequest-selected-file-scope","kind":"method","anchor":"For a HeritageQuest Revolutionary War packet, check the reproduction named in the\ncollection description or image citation. If it identifies M805, follow the pension\nnumber to M804 before inventorying the full file. When the reproduction is unclear,\ncompare the image sequence against M804 (S162 from the available excerpt) [S162], [S144], [S143], [H5].","sources":["S162","S144","S143","H5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-copied-packet-completeness","kind":"method","anchor":"For a Civil War packet copied by a relative, trace what was originally ordered and\nwhether the relative copied the entire delivery. Use page count to flag a scope\nquestion, then compare the original order receipt and the papers referenced by the\nfile jacket or later documents before calling the copy complete (S160 from the available excerpt) [S160], [S141].","sources":["S160","S141"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-maryland-final-payment-abstracts","kind":"method","anchor":"For a Maryland pensioner, use the paying agency on the final-payment slip or ledger\nto pick the published *Selected Final Pension Payment Vouchers, 1818–1864* abstracts.\nStart with the Baltimore volume if the agency is unknown. Follow a transfer or payment\nlead to the Philadelphia, District of Columbia or Wheeling abstracts as applicable.\nCarry the agency, name and date from the abstract into the voucher search\n(S164 from the available excerpt) [S164], [S29], [S147].","sources":["S164","S29","S147"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-war-replies-and-bible-readings","kind":"method","anchor":"Distinguish incoming inquiries from outgoing pension-office replies. Use a reply that\nsummarizes the file to locate the papers it cites, and test any statements of kinship\nin incoming correspondence against those papers. If a Bible image is illegible and\na reply quotes it, record the reply's reading as the office's transcription, with\nits own image locator. Leave the original reading unresolved (S163, S162 from the available excerpt of each source) [S163], [S162], [S143], [S29].","sources":["S163","S162","S143","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-war-marriage-without-widow-claim","kind":"method","anchor":"Look for marriage affidavits and family records in the veteran's papers even when\nthe M804 jacket identifies only a survivor's claim. Record which spouse and marriage\neach item describes. Leave the place, maiden name and earlier marriages open where\nthe documents do not supply them (S162 from the available excerpt) [S162], [S143], [S66].","sources":["S162","S143","S66"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-war-age-and-role","kind":"method","anchor":"If the applicant's reported age appears too young for service, read the veteran's\nand witnesses' accounts even in a rejected file. Record the age and date each\nwitness claims, the role described, and whether the witness says they saw or served\nwith the applicant. Check how the veteran entered service, including whom a substitute\nreplaced, and associate each officer and rendezvous with its own tour\n(S169, S170 from the available excerpt of each source) [S169], [S170], [S66].","sources":["S169","S170","S66"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-war-heirs-count","kind":"method","anchor":"For an heirs notice under the act of 6 April 1838, copy the stated total of children\nand the names actually given, then use the Entry 724 account to look for missing names\nand the capacity in which they appear (S163 from the available excerpt) [S163], [S29]. Compare the death evidence\nwith the language naming each heir. Look for a personal claim or a statement of survival\nand distinguish a child from someone claiming through a deceased child. The transcript\nof S11572 shows why the count and names need separate fields, giving a count of eight\nchildren while naming only one [S146].","sources":["S163","S29","S146"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-combined-and-separate-claims","kind":"method","anchor":"For a Union Civil War packet, compare the jacket and enclosed papers with the locator\nrow for each veteran, widow and minor claim. If a claim is missing, keep its number\nand name variants in the retrieval queue. The pension office left Robert Jabo's\nunsuccessful applications under two names separate from his widow's approved claim\nunder a third name (S160 from the available excerpt) [S160], [S140].","sources":["S160","S140"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-compare-birth-statements","kind":"method","anchor":"When a Union widow's claim gives conflicting birth dates, enter each date under its\nown document. Use the attestation and the name beside each signature or X to\nidentify its maker. Check other dates in the same statement against independently\ndated records, such as a\nsibling's appearance in a census or the action in which the veteran died. Record\nwhich parts agree before weighing the birth-date assertions, following the example\nfrom the available excerpt (S155 from the available excerpt) [S155], [S140].","sources":["S155","S140"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-union-widow-previous-marriages","kind":"method","anchor":"For a Union widow's claim involving earlier marriages, make a separate row for each\nmarriage and its alleged ending. Look for divorce or death evidence in the pension\npapers and for the special examiner's findings if the marriage was disputed [S76].\nWhen two women claimed the same veteran, the example from the available excerpt\nshows that each could have a marriage record while proof of an earlier divorce was\nstill missing (S161 from the available excerpt) [S161]. Carry the unresolved marriage and jurisdictions into the\ndivorce and death searches.","sources":["S76","S161"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-union-pension-family-questionnaires","kind":"method","anchor":"Check which people each Union pension form asked the informant to name. When a widow\nor minor claim under the 1862 act lists children under 16, use that list for the\nclaim's date and scope. Check the veteran's family questionnaires, including those\nfrom around 1898 and 1915 where present, for names and birth dates omitted from the\ndependent claim. Leave older or deceased children open until a record addresses\nthem (S160 from the available excerpt) [S160], [S76], [S140].","sources":["S160","S76","S140"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-hospital-treatment-evidence","kind":"method","anchor":"For a Union disability claim that names a hospital, copy each treatment date and\nplace into the claim timeline. Compare those entries with the veteran's service\nrecord and, for a gap or disputed episode, look for the separately filed carded\nmedical record. Keep a dated treatment entry distinct from later testimony about\nwhen the injury or illness began (S154 from the available excerpt) [S154], [S152].","sources":["S154","S152"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-soldiers-home-pension-payee","kind":"method","anchor":"If a medical entry at the National Home for Disabled Volunteer Soldiers calls a\npension closed, check the branch register's dates and pension notation against\npayment records and the pension file. Look for a changed payee, a reduced payment or\na recorded termination before assigning an outcome. The Home's disbursing officer\ncould receive pension payments even when the member's own payments were reduced\n(S160 from the available excerpt) [S160], [S150], [S151].","sources":["S160","S150","S151"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-march-1818-pension-roll-identification","kind":"portal-availability","anchor":"For an early pension, browse the state or territory in the report transmitted on\n28 March 1818, published as *Pensioners of the United States, 1818* and on Ancestry\nas *Revolutionary Pensioners of 1818* (S165 from the available excerpt) [S165 @2026-11-22], [S148 @2026-11-22], [S149 @2026-11-22]. An absence\nleaves both earlier payments and later awards under the act of 18 March 1818 open.\nIn List A, establish the war of service independently for a disability pensioner.\nFor the half-pay subsection, check for relinquished bounty land and verify a named\nguardian's relationship before recording widowhood (S165 from the available excerpt) [S148 @2026-11-22], [S165 @2026-11-22]. In List B,\ncopy the soldier's rank, pension commencement, payment rate and any widow or orphan\nnotation. Follow a War of 1812 survivor entry into the underlying payment account and\napplication. Verify the governing act from those papers (S168 from the available excerpt) [S168 @2026-11-22], [S148 @2026-11-22], [S153 @2026-11-22].","sources":["S165","S148","S149","S168","S153"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-of-1812-half-pay-scope-and-remarriage","kind":"historical","anchor":"Check early half-pay accounts after a standard War of 1812 pension file miss when\nthe service and death evidence fit. Under section 1 of the 16 April 1816 act, the\ndeath of a man in a covered service class could qualify if it occurred in service\nduring the war, on the way home after muster-out, or later from wounds suffered in\nservice. A missing later roll entry leaves earlier payments open. Check the record\nfor the death circumstances (S166, S168, S165 from the available excerpt of each source) [S166], [S168], [S165], [S107], [S153]. For a\nwidow's death or remarriage before the term ended, look for the balance going to\nthe qualifying children under 16. When the register gives only a guardian, check the widow's\ndeath and remarriage before the dated entry. Compare any new surname with the\nremarriage record and test whether the guardian was the new husband. Keep the\nguardian's relationship open until the records link them (S167 from the available excerpt) [S167], [S107], [S153].","sources":["S166","S168","S165","S107","S153","S167"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-of-1812-half-pay-marriage-proof","kind":"method","anchor":"When an early half-pay voucher lacks the widow's proof, trace its reference to the\nsupporting application. Look for a sworn statement by someone who attended the\nwedding if the officiant's evidence is missing, and for any clerk's endorsement of\nmarital status or continued eligibility. Read a child's birth list against the\nage question actually asked. Check any unlisted older children in other papers\nand leave the household count open (S168 from the available excerpt) [S168], [S107], [S153].","sources":["S168","S107","S153"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gibson-regiment-continental-service","kind":"historical","anchor":"For a pension claim based on service in George Gibson's 1st Virginia State Regiment,\ncheck the dates of the applicant's tour against the unit's period on the Continental\nestablishment. House Report 14 of the 29th Congress describes the regiment's service\nin place of the 9th Virginia Continental Regiment and reports that an 1818 denial\nbased on the regiment's state designation was reversed. If the case turns on that\ndesignation, search the Congressional petitions for arrears and verify the outcome\nfor the named claimant (S171 from the available excerpt) [S171], [S172].","sources":["S171","S172"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-creek-war-of-1812-pension-index","kind":"method","anchor":"For service in the Creek War of 1813–1814, check M313 when the service evidence\nidentifies a federal War of 1812 unit. Compare the unit on the pension jacket with\nM602 or the specific compiled service records, such as M1830 for McIntosh's Company\nof Creek Indians. Establish the dates and unit before choosing a pension index\nfor a lead that says only Creek War (S165 from the available excerpt) [S165], [S173].","sources":["S165","S173"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-revolutionary-war-sugar-house-confinement","kind":"method","anchor":"In Revolutionary War pension testimony, record an unqualified “Sugar House” as a\nconfinement clue and preserve the wording and image locator. Following the suggestion\nfrom the available excerpt [S174], compare the stated confinement dates with documented\nperiods of prison use. For New York City, test Livingston’s on Crown (now Liberty)\nStreet and Van Cortlandt’s by Trinity Church as candidates [S175], [S176]. Keep the\nbuilding unresolved if several sites fit the dates or gaps in the records prevent\nruling out other candidates. The Bronx window came from the Cuyler (later Rhinelander)\nsugar house in Manhattan, whose use as a prison is disputed [S175].","sources":["S174","S175","S176"],"checked":null,"stated_as":"fact","review":"reviewed"}
