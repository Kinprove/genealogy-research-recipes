claims:
  - {"id":"C-45bfba21885a","kind":"unclassified","anchor":"1. Compare the service clue with a conflict, branch and unit. Save the source of that context;\n   an unusual name alone does not establish the correct soldier.\n2. Search a pension index covering the relevant service and claimant category. Do not assume\n   every person who served applied for a pension. Start with the federal series below. Several\n   are free online, so check them before paying for copies. The hosts are those named by NARA or\n   Fold3 on 2026-11-07; check each host's current coverage. [H4–H8]","sources":["H4","H5","H6","H7","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-25dd33c21fb6","kind":"unclassified","anchor":"3. Distinguish the pension application from the service record and any bounty-land application.\n   Record which of these you are trying to retrieve.\n4. Consult the current repository instructions before choosing a request route. NARA's older-record\n   page separates service requests from pension/bounty-land requests; NATF 85 concerns eligible\n   federal pension/bounty-land applications, rather than state or Confederate pensions.\n5. For a state or Confederate pension lead, identify the relevant state's custodian and holdings.\n   For a transferred file or uncertain repository, ask the custodian with the copied identifiers\n   instead of treating a historical storage rule as a current guarantee. [S1, S3, H1, H2]","sources":["S1","S3","H1","H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a7bbb7bfbdca","kind":"unclassified","anchor":"Extend the index search to the soldier's brothers, sisters, sisters-in-law, widows and other\ndependent claimants, and give each of them a separate candidate row. A relative's file can hold\nfamily Bible pages, dates, or an affidavit in which a woman gives her married name and her\nrelationship to the applicant. Record each affiant's stated name, relationship and date as a\nsecond-party claim. Correlate that claim with other records; on its own it does not prove a\nmarriage. The [Thomsen state-records talk](https://www.youtube.com/watch?v=8i254jbCQDQ) and the\n[Wilcox Patillo example](https://www.youtube.com/watch?v=HG6sY_S-Neg) motivate this step. Neither\nshows how often collateral files contain such material.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-39adb0fbb892","kind":"unclassified","anchor":"Compare the person's age with every conflict he lived through, including regional or Indian wars,\nand give each conflict its own routing row. A Confederate veteran may also have a federal file for\nearlier service, and that file can be fuller than a state pension\n([Derenthal Mexican War example](https://www.youtube.com/watch?v=cLMzNfMNHic)). For a Confederate\nveteran or widow, presenters describe the relevant state as the one where the applicant lived when\napplying, which may not be the unit's state; verify the series' residence requirements. Establish postwar residence from other records, check each later state of\nresidence, and bring the unit and postwar counties to the inquiry\n([Anderson overview](https://www.youtube.com/watch?v=OcAeLJxT9XU);\n[Lefler's Alabama example](https://www.youtube.com/watch?v=tD9lgibwBRE)). These sources give only\nscattered examples of acts and state rules, not a complete set, so confirm eligibility and coverage\nwith the custodian.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bf301cfce755","kind":"unclassified","anchor":"**Artifact:** A routing row: candidate ID, service evidence, conflict/branch/unit, record type,\nclaimant category, index/series coverage, current custodian, retrieval route and date checked.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-081aa8873178","kind":"unclassified","anchor":"Where an available pension-abstract or full-text collection covers the question, search\nsupported target-name forms in the text as well as the claimant index. The target may appear in\nanother applicant's file. Retain the actual applicant/file locator and the abstract passage,\nthen seek that file and inspect the named person's stated role in the original document. Keep an\nunresolved locator or identity open; a mention does not establish that the target applied for a\npension, served in the stated unit or was related to the applicant. The Southern Campaign\nteaching example motivates this route without verifying the narrated case or promising\ncomprehensive coverage. [S16]","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5baebe14c61a","kind":"unclassified","anchor":"1. Open the index image when available. Copy the soldier and applicant names, service designation,\n   claim category, application number and certificate number exactly as supplied.\n2. Preserve prefixes, suffixes, filing dates, residence/state, transfer marks and marginal notes.\n   Do not combine an application's number with another claimant's or category's certificate.\n3. Keep the index collection/series, card/image locator and a saved image where permitted.\n4. Compare the card's service and applicant context with the intended candidate.\n5. Continue investigating an application with no certificate number or a rejection notation.\n   It may still have an application file and subsequent supporting documents; do not report\n   “no file” solely from an unsuccessful claim.\n6. If a mark suggests transfer, carry its exact wording into a custody inquiry. This recipe does\n   not assign a universal meaning or current storage location to every prefix. [S1, S2, S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb6ec8f2a10d","kind":"unclassified","anchor":"A pension index can exist in more than one hosted version. The versions may be arranged\ndifferently and may carry different fields, such as a death date or place or a dependent's name.\nBefore ordering, check each version. Give each version its own locator row naming its series, and\nnote the fields it adds or contradicts. Do not merge the versions' fields into one card. Record a\nmiss separately for each series and search route. Where a version is arranged by state, unit,\ncompany and surname, browse the candidate's company as well as searching by name. Transcribed\nnames, units and dates can be wrong, and a regiment may be named several ways. The\n[Family History Fanatics regiment project](https://www.youtube.com/watch?v=P9g7JwVmnIM)\n([part 10](https://www.youtube.com/watch?v=8h90dEdVBYc)) motivates this step. It does not\nestablish each version's coverage or accuracy, that browsing is complete, or that a site's\narrangement stays the same.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d924e4321b85","kind":"unclassified","anchor":"When another index-card version or series is actually available for the same supported claim,\ncompare its image with the first card. A later file identifier may appear on one version and be\nabsent on another; the interview in S14 illustrates this with an XC number. In each version's\nlocator row, keep its available filing/transfer dates and number, preserving both images\nwhere permitted. Carry an additional identifier into the custody check without overwriting the\nearlier application/certificate locator. An unresolved mismatch remains open; a missing field on\none card does not establish that no later identifier exists. Do not assume a particular website\nalways supplies the fuller card or that a prefix establishes the file's present location. [S14]","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7220413b9be4","kind":"unclassified","anchor":"Read a card's claimant details as they stood at that filing. For the illustrated card\nseries, presenters describe the state as where the claimant lived when filing, not the enlistment or\nunit state; verify the series' field definition, then treat a different state as a migration lead ([Findmypast walkthrough](https://www.youtube.com/watch?v=Wo-M7iIWj78)). The widow\nnamed on the card is the claimant, not necessarily the wartime wife. Take the marriage date from\nthe file and check for earlier wives\n([regiment spreadsheet](https://www.youtube.com/watch?v=cpulm6BuAJ8)). When a card shows both a\nveteran's and a widow's claim, copy both numbers and try the widow's certificate number too,\nbecause the papers tended to be combined under it\n([Martinez overview](https://www.youtube.com/watch?v=mRt2jTgEqVw)). If a widow remarried, search\nagain under each later surname and link the new locator rows. A roll entry that only notes an\napplication is a pointer ([Thomsen Georgia example](https://www.youtube.com/watch?v=8i254jbCQDQ)).\nThese are tendencies and single examples, not rules for every war, state or index.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-67cb8378f585","kind":"unclassified","anchor":"If an application or certificate number is unreadable, check whether a separately arranged\nindex covers that service and claimant category. Use supported regiment/company and applicant\ncontext to find a candidate; reconcile the claim category and application-versus-certificate\nfields before using its number. Preserve both index locators and literal readings with the\nresolution basis; unresolved digits stay unreadable. The\n[historical regiment-index teaching example](https://www.youtube.com/watch?v=dSVVQE7iVgo)\nsupplies this recovery route, not a verified matched-card pair or current hosting/coverage\nguarantee. A second index can resolve a locator without independently confirming its genealogy.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b320767a9b9a","kind":"unclassified","anchor":"1. Check whether the result is only an index image, a selected extract, or a multi-image\n   application file. Inspect its description and image sequence rather than its search-result title.\n2. Compare multiple apparent file matches against the locator table; a name can produce more than\n   one candidate file.\n3. If ordering eligible older federal pension records, use NARA's current pension request\n   instructions and the identifiers you copied. The order form is NATF Form 85, which covers\n   federal service from 1775 to 1903, not state or Confederate service. Its product choices\n   distinguish a complete application file from a Pension Documents Packet containing selected\n   document types. NARA's fee page, read on 2026-11-07, lists:\n   - complete pension application file, pre-Civil War: $55;\n   - complete pension application file, Civil War and later: $80 for up to 100 pages, then\n     $0.70 a page, with a quote first;\n   - Pension Documents Packet: $30;\n   - bounty-land warrant application file: $30.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3079c84a4c23","kind":"unclassified","anchor":"A compiled military service record is a separate order on NATF Form 86 ($30). A land entry\n   file is ordered on NATF Form 84 ($50). [H1, H4]\n4. Choose the product that fits the question. For a question requiring the claim's progression\n   or witness material, request the complete-file option rather than silently substituting the\n   smaller packet.\n5. Record the selected product, request identifier, submission date, custodian and any page limit\n   or remaining-copy instructions in the actual order. Check current terms instead of carrying\n   a video's historical price or delivery estimate into the request.\n6. When copies arrive, record what was received and any stated omissions. Follow up on a\n   disclosed page limit or incomplete delivery when the missing material affects the question.\n   [S1, H1]","sources":["H1","H4","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3a7a18b72068","kind":"unclassified","anchor":"When identifiable prior copies, dated notes or internal references describe particular papers,\ncompare them with the newly received package. Queue each unmatched item with its earlier\nlocator or observation basis and its current retrieval status. Keep absent testimony unrecovered;\na note about it does not recreate the document. The [Sarah Cook re-retrieval example](https://dna-explained.com/2023/01/09/sarah-cook-1774-1775-1863-epitome-of-perseverance-52-ancestors-386/)\nmotivates this comparison without establishing misfiling or the missing paper's contents.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-adf00748f494","kind":"unclassified","anchor":"1. Read the received file through once, including covers, administrative notes, rejected claims\n   and reconsideration material.\n2. Give each received image a stable ID in its original order. Group connected pages into\n   documents while preserving every image's original locator.\n3. Record the document type, date, creator, applicant and named people; distinguish an asserted\n   relationship from your interpretation.\n4. Create a chronological view of the documents without renaming away the original order.\n   Track applications, supplied proof, objections, decisions and later actions when present.\n5. Transcribe relevant passages with uncertain readings marked, and check them against the image.\n6. End with a claim-action timeline, source-linked leads and explicit gaps. Send identity,\n   relationship or conflicting-evidence conclusions to the evidence/proof workflow. [S1, S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-777cfb1e53ff","kind":"unclassified","anchor":"For a Revolutionary War veteran's postwar household, look for a property or income schedule\nsubmitted to demonstrate need, together with its accompanying household statement or letter.\nBuild a dated household-and-means row: named people, stated relationships and ages, residence,\noccupation, ability to work, assets, debts and income, recording only fields actually supplied.\nKeep the applicant's statement separate from a clerk's or witness's assessment. Such papers can\nname family members not individually named in a contemporary census return; retrieve the pension images\nbefore treating an article's extract as an inspected original. Preserve the declaration's\nneed-supporting purpose: its valuations are reported claims, and the listed household is not a\ncomplete list of the veteran's relatives. [S17, S18, H3]","sources":["S17","S18","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-07b09a5a3dbb","kind":"unclassified","anchor":"Never read a filing date as a death date. Take death dates from a document that states them, such\nas a drop report, a widow's declaration, or a later widow's proof that an earlier marriage had\nended ([Lisson's death-date session](https://www.youtube.com/watch?v=bc92E8Oq4zU)). Record such a\ndate as the claim's statement; it may be approximate or second-hand. A date dropped from the rolls\nis not automatically a death date. A widow's late application may reflect a later change in\neligibility rather than a recent death. Do not name a statute unless the file or an authoritative\nsource does ([Thomsen overview](https://www.youtube.com/watch?v=C2_9AVcodcg)). Treasury final\npayment cards and ledgers form a separate series from the application file. They may give the\npaying agency, the act, payment dates and a death. Cite their own locator and confirm the series\ncitation with the custodian\n([Strauss Revolutionary War talk](https://www.youtube.com/watch?v=nJsQ9ftU9iM)). None of these\nsources sets the proof requirements of any particular law.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e725f0149164","kind":"unclassified","anchor":"Treat the service described in a pension file as what the claimant chose to declare, not as a\ncomplete military history. Search federal and state records separately for other regular,\nvolunteer, militia or opposing-army enlistments. Link any you find only after comparing identity\nevidence, and do not guess why service was left out\n([Strauss regular-army example](https://www.youtube.com/watch?v=M72-nL_Yb2I);\n[Confederate-then-Union example](https://www.youtube.com/watch?v=CPSlx8VfKps)). Conversely, if an\nindex lists the candidate under a unit that a published roster omits, keep the candidate and mark\nthe conflict unresolved. Record whether the claim appears allowed or rejected, and check further\nservice sources ([regiment project](https://www.youtube.com/watch?v=P9g7JwVmnIM)). An application\nalone does not prove service, and a gap in a roster does not disprove it.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ca3a80fb9ecb","kind":"unclassified","anchor":"> From these service clues and pension-index images, build separate candidate routing and\n> locator rows. Identify the current record-type/custodian route without assuming a card is the\n> file. Prepare the appropriate request with the exact identifiers and product scope; do not\n> claim it was submitted. For supplied file images, preserve original order, inventory every\n> image/document and build a claim-action timeline. Retain rejected applications, transfer marks,\n> uncertain readings and gaps. Do not decide identity or benefit entitlement.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b31e369ff9f1","kind":"historical","anchor":"When \"Invalid\" appears on the jacket of a military service record, read it first as the noun for a disabled or infirm soldier and look for evidence of a claimed service-related injury or disability; taking it to mean \"void\" can wrongly suggest that the enlistment or record had no force. [S20], [S21] The Legal Genealogist traces this usage in American service from the Revolution through Civil War pension forms. [S20] Confirm the reading from the injury or disability evidence in the record. [S20], [S22]","sources":["S20","S21","S22"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9ef2da8f027b","kind":"historical","anchor":"If a Continental soldier or officer is linked to a corps of invalids under the 26 August 1776 resolution, read that as placing the man among those entitled to a disability pension but found capable of guard or garrison duty, and do not assume that an \"invalid\" was unfit for any further service. [S20], [S23], [S24] Do not date the eight-company Corps of Invalids from that resolution, because it came from a later one of 20 June 1777. [S23], [S24] Do not infer a man's actual duties from the resolution alone. [S20], [S23], [S24]","sources":["S20","S23","S24"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7b2f05d9881c","kind":"portal-availability","anchor":"For a Navy veteran's own approved claim, use M1469, *Case Files of Approved Pension\n   Applications of Civil War and Later Navy Veterans*, arranged by certificate number\n   [H9 @2026-11-13]; Fold3 has it as \"US, Navy Survivors' Certificates, 1861-1910\"\n   [H10 @2026-11-13].","sources":["H9","H10"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
