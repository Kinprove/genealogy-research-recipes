  - {"id":"S66","kind":"web-page","urls":["https://ru.migrapedia.org/%D0%9F%D0%BE%D1%81%D0%B5%D0%BC%D0%B5%D0%B9%D0%BD%D1%8B%D0%B9_%D1%81%D0%BF%D0%B8%D1%81%D0%BE%D0%BA"],"published":null,"retrieved":"2026-11-16","access":"read","rights":null,"basis":"read 2026-11-16","entry_sha256":"2c9782ef02226c02331f56380e997203772f32d4aebaa653433c43eb76ad8dd3","claims":["C-61a56d32ebb9"],"review":"reviewed"}
