  - {"id":"S68","kind":"statute","urls":["https://nnov.hse.ru/ba/law/igpr/polozhenie_gosdum1905"],"published":null,"retrieved":"2026-11-16","access":"read","rights":null,"basis":"read 2026-11-16","entry_sha256":"da8e0142b4c3c9a5c4d16235f55cd419e93bf8591527ec1195075ae482caccd0","claims":["C-db5830bce578"],"review":"reviewed"}
claims:
  - {"id":"C-75d2a864ef04","kind":"unclassified","anchor":"Use this recipe when the metrical books or revision lists for a Russian-Empire peasant or townsperson are missing or stop, especially after the tenth and last revision (1857–1859; its lists are usually dated 1858). Later revision-list files also survive; confirm the individual file's date rather than rejecting it on the revision range alone. [S25] The common mistake is to send the researcher only to church registers and revision lists. That misses the local administrative fonds. For peasants these are the volost board (волостное правление) and the village society (сельское общество). For townspeople they are the town administration (городская управа). These fonds hold family lists, call-up lists, inhabitant lists and property lists at household level. Call-up lists under universal military service start in 1874, the year of the military-service statute. Earlier recruit-levy files and lists of lower ranks also survive in volost fonds (GASO ф. 723 оп. 1 д. 17, a recruit levy of 1870–1871, and the second д. 16, lists of lower ranks on the volost register, 1871–1872), so do not stop the search at 1874. [S2] The opposite mistake is to treat an inventory title as verified contents, or to accept a mis-catalogued title. This recipe builds a register of candidate series. Every row stays an inventory lead until the file has been inspected.","sources":["S25","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4908403f7ff4","kind":"unclassified","anchor":"- **Peasants:** search the fond of the volost board for the volost and period, and any separate village-society or village-assembly (сельский сход) fond. In the Sverdlovsk regional archive (GASO), village-society fonds stand on their own. Examples are ф. 721 (the Dolmatovo village assembly under the Lyapunovo volost board, 1914–1919) and ф. 722 (Znamenskoe society, Irbit uezd, 1892–1919). These are mostly assembly-sentence books. ф. 721 also has 1917–1918 minute books of the society's general meetings, and ф. 722 also has 1918–1919 orders and correspondence. [S2]\n- **Townspeople (мещане, merchants):** search the town-administration fond. For Yekaterinburg this is GASO ф. 62. Also search the older town fond that holds the town's revision lists and inhabitant lists, which for Yekaterinburg is ф. 8, оп. 1. [S4], [S7]\n- **Do not stop at the obvious fond.** In GASO, revision lists for a volost also sit in volost-board fonds and in the county treasury. Two volost-board fonds hold nothing but a single revision list: ф. 205 has 1834 and ф. 209 has 1816. The Irbit county treasury (ф. 674) holds revision lists by volost for 1816, 1834 and 1850. It also holds an inventory list of Irbit town real property for 1911–1915 (дд. 127–128) and a 1915 list of unpaid real-property taxes (д. 132). [S1] A participant in the Shadrinsk archive thread pointed to the Kargapolye volost-board fond (ф. 19) as holding revision lists and possibly other population lists. The participant had not seen the fond or its inventory. [S6]\n- **Military-service and election bodies at county or province level** hold parallel person-level files. The Irbit county military-service board (GASO ф. 724) holds pension petitions from named lower ranks of named volosts, 1913–1920, rather than lists. [S2] The Slutsk county military-service board (NIAB ф. 627, оп. 1, д. 11) holds lists of Jews liable for service in 1891. The Vitebsk provincial commission for State Duma elections (NIAB ф. 2558) holds voter-list files. [S10], [S11]\n- **Belarusian holders.** NIAB (National Historical Archive of Belarus, Minsk) holds pre-1917 records of the Vitebsk, Minsk and Mogilev guberniyas, including parish registers. [S19] Grodno guberniya and the Vileika, Disna, Lida and Oshmiany uezds of Vilna guberniya belong to a separate archive, the National Historical Archive of Belarus in Grodno. [S20] NARB (National Archive of the Republic of Belarus) is a different archive again. [S21] Write each archive's name out at first use, because НАРБ/NARB also abbreviates the National Archive of the Republic of Bashkortostan in Ufa. [S23]\n  - On the official state-archives portal sodd.by (SODD NAF), use the fond creator, the historical place name and the record type as search terms; its quick search matches part of a word and ignores case. Then go fond → opis → delo. [S22]\n  - A description card is not a viewable scan or a name index. Save the card ID, URL and cipher. An empty surname search over descriptions does not exclude an entry inside a delo.\n- Look for transcribed inventories before you write to the archive. Forum participants have typed up GASO inventories in the threads. A participant reported that the \"Великія описи\" project had entered about 11,000 GASO file titles (inv.velikie.org/archive/gaso-ural/), partly duplicating the forum work. [S2]\n  - Choosing an archive in the Великія описи search form does not mean its inventories have been typed: the site holds only what volunteers have entered. [S15], [S16]\n  - Its search options include «Дела без датировки» (undated cases) and «Непривязанные документы» (unlinked documents). Record which options and filters you set, and rerun a miss with both ticked before you read it as a negative. [S18]\n  - The site publishes no scans, so order copies from the archive by cipher. [S15], [S16]\n  - Do not bulk-scrape. Its terms forbid automated mass collection that overloads the site or bypasses its API, and require citing the archive and cipher (§8.1, §6.1). [S17]","sources":["S2","S4","S7","S1","S6","S10","S11","S19","S20","S21","S23","S22","S15","S16","S18","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c98ab85002ab","kind":"unclassified","anchor":"Read the whole inventory of each fond and record one row per file in every class below. The GASO inventories show these classes [S1], [S2]:","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f1873b963076","kind":"unclassified","anchor":"**1917 agricultural census.** Add the 1917 All-Russian agricultural (land) census as a household series between the 1858 revision and the Soviet похозяйственные книги (village-soviet household books). [S12] The FamilySearch title «Поземельная перепись, 1917» (land census, 1917) is a catalogue lead: its title, fond and film format came only from search results because the record page required sign-in. Those details were not confirmed from the full entry; check it before claiming a particular file is filmed or available [S13].","sources":["S12","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7eefa2346a78","kind":"unclassified","anchor":"- For Altai (Tomsk) guberniya, the State Archive of Altai Krai's index at altarchives.ru/census1917 covers the 1917 agricultural and urban census forms for residents as of May–September 1917. A card is an index entry, not the form. It gives the head's full name, the 1917 settlement and the year the family settled in the guberniya. The form adds the head's age, estate and nationality, the sex, names and ages of family members, and a migrant's guberniya of origin. The archive offers the form on a prepaid request that is not refunded when nothing is found, and the user decides whether to order it. The index warns that some settlements have incomplete data or none. [S12]\n- The index names household heads only: look for a wife, widow or child under the head's card, not under their own name. [S12]\n- The index does not list the uezds it covers. Kuznetsk uezd stayed in Tomsk guberniya under the decree of 17 June 1917, while the Slavgorod, Kamen, Barnaul, Biysk and Zmeinogorsk uezds formed Altai guberniya. [S24] For a uezd outside Altai guberniya's 1917 extent, test whether the index returns any forms for that volost or uezd before you read a surname miss as negative. If it returns none, record the query and its empty result, leave the uezd's coverage unconfirmed, and ask the archive what it holds.","sources":["S12","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b2698825ee03","kind":"unclassified","anchor":"**Internal resettlement, 1880s–1917.** For a family resettled to Siberia or the Steppe, search both ends: registration cases for removal from the old society (отчисление) and family lists in the departure volost and society fonds, and settler lists and enrolment in the arrival volost. Date the move from the removal and enrolment records at the two ends, not from a petition, a scout's (ходок) plot allotment or a Cossack-host enrolment date. A settler index is a finding aid, not a family record. The index at belarus-tomsk.ru lists 1906–1917 Stolypin settlers to present-day Tomsk Oblast by surname. Each entry names the origin (guberniya, uezd, volost) and the place of settlement, both in early-20th-century units, with a delo number at the State Archive of Tomsk Oblast (GATO). [S14] Cite the GATO delo number as the page gives it; the page names no fond. In Altai (Tomsk) guberniya, also check the 1917 census index above. [S12]","sources":["S14","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6961d89f39b5","kind":"unclassified","anchor":"- **Family lists for the 1874 call-up and later call-up lists:** GASO ф. 62 оп. 1 д. 27а, a family list of Yekaterinburg мещане for military service, 1874, and д. 28, call-up lists 1878–79. [S4]\n- **Registration into the town society:** ф. 8 оп. 1 д. 1935а, admission of various persons to the мещане society, 1867. [S4]\n- **Inhabitant lists (обывательские списки):** ф. 8 оп. 1 д. 493 (1816–1818) and д. 970 (1844). Their columns cover old resident or newcomer and age, marital status and spouse, children with ages, any house or land and whether it was built, inherited, bought or received as dowry, its town part and number, presence or absence, trade, and civic offices held. [S7] The examples shown are pre-1858. No post-reform inhabitant list was shown, so search the town fond for one but do not assume the series continues.\n- **Building and plot ledgers:** ф. 59 оп. 7 д. 353 (1809) lists householders by town part, street and plot number, with the area of each plot. [S7] Another participant then found their own мещане ancestors in the same ledger. [S7]\n- **House-construction files:** ф. 62 files 746–813, on houses built or altered in 1875–1911 (step 5). [S5]\n- **Voter lists:** see step 4.\n- **Town call-up lists outside the Urals:** NIAB ф. 611 (Pinsk town administration), оп. 5, д. 194, a call-up list of Jewish мещане. The participant introduced it as a 1911 example, but the title quoted says 1914. Record the year in the title and note the conflict. [S11]","sources":["S4","S7","S5","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-245139245460","kind":"unclassified","anchor":"- **Split combined coverage.** One family list can cover two societies (ф. 680 дд. 29–31). One land-possession record can cover a village with its hamlets (выселки) or farmsteads (заимки), and sometimes only part of a hamlet (\"часть выселка\", ф. 207 дд. 7–8). [S1] Enter every named place in the row so that a search by hamlet still finds it.\n- **Keep repeated files separate.** ф. 212 has two land-possession files for the same group of villages, dated 1895 (д. 5) and 1897 (д. 6). Record both. Do not treat one as a duplicate. [S1]\n- **Mark gaps in an annual series.** The ф. 732 call-up lists run yearly but have no file for 1894, 1897 or 1902. [S2] That is a coverage gap in the inventory, not proof that no list was made or that the person was absent.\n- **Log defects as they appear.** The defects seen are:\n  - an inventory scanned with some sheets skipped (the note at the head of the ф. 725 inventory, an ironworks fond) [S2];\n  - repeated delo numbers (ф. 723 has two items numbered 16, ф. 724 two numbered 6 and two numbered 26) [S2];\n  - skipped numbers (ф. 683 goes from 031 to 033) [S1];\n  - impossible dates (\"879\" and \"00.01.9080\" in ф. 683; end dates before start dates, such as ф. 730 д. 1) [S1], [S2];\n  - dates given as 00.00.0000 (ф. 730 д. 22, an undated family list) [S2];\n  - the \"inactive inventory\" (недействующая опись) item at the end of most fonds [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4b4f3ecca21c","kind":"unclassified","anchor":"Copy these as written. Before you order a file with a repeated number, ask the archive which file it means.\n- **Inventory dates can be wrong.** A participant in the Shadrinsk archive thread reported files whose actual dates differed from the inventory dates, and leaves bound in from other documents. [S6] Take the date range from the inspected file. Date a family list from its entries, not its label (evidence/proof judgment).\n- **A missing sheet count is a question to the archive.** An NIAB inventory gave no sheet counts. A participant advised asking the archive, or someone who works there regularly, for the size and contents. The researcher who then obtained the file found lists of heads of families, a rough village map and a building plan. The file was a case on permitting worship in a village prayer school, ф. 299 оп. 2 т. 5 д. 16988. [S11] Generic titles can hide household lists. Rank them lower, but do not drop them.","sources":["S6","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-31114471f515","kind":"unclassified","anchor":"- **Record each list's type separately.** For one uezd in 1906, a participant pointed out that the list of landowners and real-property owners is separate from the list of town voters, and said to check the town list next. [S8] Note which list you actually searched.\n- **Content and limits.** Search State Duma voter lists from 1905. The election law dates from August 1905 and the first election from 1906, and the Shadrinsk town administration holds Duma voter-list files dated 1905–1907 and 1905–1909. [S3] They cover only men aged 25 and over, as set by the 1905 election law and kept in 1907. Participants said these lists give full name, religion and residence, and sometimes age. [S9] A surname hit with other given names is only a lead. [S8]\n- **Copy every printed field as written.** Shadrinsk town-administration voter lists give rate-sheet (раскладочная ведомость) numbers and a qualification value (\"1\", \"1,3\", \"4\"). The value changed between years for the same man. [S3] Someone in the thread asked what these fields mean, and nobody answered. Record them literally and do not interpret them.\n- **Question an impossible title.** The Shadrinsk archive described ф. И-473 оп. 1 д. 633 as State Duma voter lists for 1883–1884. [S3] The State Duma was created in 1905 and first elected in 1906, so this title is wrong as it stands. Record it as **title questioned** and leave the election and contents open until the file is inspected. The same reply also called the 1917 list a Duma list. The researcher found that its full title (д. 2064) is a list of voters for the Constituent Assembly, compiled 2 November 1917 for the elections that began that month. [S3] Read the full title on the file itself.\n- **Complaints about exclusion** are a separate series. NIAB ф. 2558 оп. 1 holds such complaints, for example one from 1907 about exclusion from the Polotsk voter list. A complaint like this places a named man in a town at a dated moment. [S10]\n- Participants also named other town series to check when metrical books are lost. For Vitebsk these were family lists of мещане and merchants (1882), lists of Jews (1874), voter lists (1912), and the list of persons entitled to take part in the second congress of town voters for the Fourth Duma (1912). They did not give the fond. [S8] Find the fond before you send a request.","sources":["S8","S3","S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d73f15d51724","kind":"unclassified","anchor":"A printed reference book describes Yekaterinburg town-administration files 746–813 (GASO ф. 62) on houses built or altered in 1875–1911, with surname and address indexes. [S5] Use the index only to get the delo number, then inspect the original file. Cite the file, not the abstract, for any household fact. Mark it inventory-only until you have seen the original.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-72efc6a85c7d","kind":"unclassified","anchor":"- Copy house, plot, quarter, town part and rate-sheet numbers exactly, including later corrections. In one transcript of the 1809 ledger, plot numbers appear with a bracketed alternative reading (\"№1773 [1573]\"). Keep both readings. [S7]\n- Do not link entries across years by house or plot number alone. Numbering can change between ledgers. The 1816–1818 list gives a bare house number, while the 1844 list gives town part, quarter and number. [S7] A link needs an inspected basis, such as the same owner, the same street and a stated purchase or inheritance.\n- Record every person in the household, with the relationships, ages, estate, presence or absence and occupation as written. Cross-reference each household to the matching revision-list and confession-list entries with their own locators. An age or date that does not match ranks the candidate lower. It never excludes them.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-267c8b64ad3f","kind":"portal-availability","anchor":"- **Before relying on a written search, read a Belarusian state archive's current requests page and record its URL and the date.** On 8 November 2026, NIAB's page said it had suspended genealogical and thematic requests from 2 April 2026, with any resumption to be announced on its website, and biographical requests from private persons from 17 September 2026 [S26 @2026-11-08]. The page of NIAB in Grodno said it had suspended genealogical requests from private persons from 1 February 2025, still listed paid biographical requests, and recommended researching in its reading room by prior appointment [S27 @2026-11-08]. While a suspension stands, do not promise a postal or e-mail reply; work from the reading room, the published inventories and the sodd.by descriptions.","sources":["S26","S27"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ad32a673fae0","kind":"custody","anchor":"**Departure side, 1906–1917: land-management commissions.** The decree of 4 March 1906 set up guberniya and uezd land-management commissions (землеустроительные комиссии), and an uezd commission assessed the need for state help with resettlement and passed peasants' petitions for special benefits on to the central committee for land-management affairs [S28 @2026-11-08]. Add their fonds to the departure volost and society fonds: the Penza oblast archive's review of resettlement records lists files on peasants resettling from the guberniya beyond the Urals and to Central Asia, and correspondence on scouts' journeys to Siberia, in the fond of the Penza guberniya commission (f. 45, 1906–1917) [S29 @2026-11-08].","sources":["S28","S29"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6a2954694fa4","kind":"custody","anchor":"Look also for the commission seated in the departure uezd town: the Wikisource transcription of the State Archive of Rivne Oblast's fond list gives f. 16, the Ostrog land-management commission (1905–1917), whose op. 2 covers 1906–1912 in 230 files [S30 @2026-11-08]. The only op. 2 file title transcribed there is a peasant's 1907 petition about land near a named village, not a resettlement file [S31 @2026-11-08], so read the inventory itself for resettlement files.","sources":["S30","S31"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-55af48e8a1e8","kind":"custody","anchor":"- **Search typed file titles by surname and town, and by place and estate.** A blogger found an 1859 uezd-court file on the sale of a house by a мещанин to a merchant, in the Tver regional archive, by searching Великія описи for the buyer's surname and his town. [S51 @2026-11-15] Another blogger advises looking for court cases that name whole groups of people, such as a suit between the peasants of a village and the мещане of a sloboda. [S52 @2026-11-15] Search the titles of a court, volost or treasury fond by the village, the sloboda and the estate as well as by the surname.\n- **Recruitment boards and boards for military service hold a recruit's own list.** For a recruit before 1874, search the fonds of the uezd and guberniya recruitment boards (рекрутское присутствие); with the manifesto of 1 January 1874 their functions passed to the boards for military service (по воинской повинности присутствие). In the Vologda regional archive the Vytegra uezd recruitment board fond (f. 1025, 1812–1874) holds lot lists, formulary lists of accepted and rejected recruits and family lists of village societies; one formulary list gives a recruit's age, estate and village, his height and appearance, that he could not read, and that his wife was left pregnant. The guberniya board for military service there (f. 726) holds over 4,500 files of 1874–1917 arranged by year. [S37 @2026-11-15] A Tula blogger shows recruits' formulary lists from an uezd recruitment board fond (State Archive of Tula Oblast, f. 425) and lists their fields as name, age, height, marks, origin, estate, year of entry into service, family, and literacy or a trade. [S35 @2026-11-15] Another blogger lists call-up lists, soldiers' and officers' service records and re-examination protocols in the uezd boards for military service. [S36 @2026-11-15] Search both levels for the levy year, not only the volost fond.","sources":["S51","S52","S37","S35","S36"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-885439285a3d","kind":"method","anchor":"**Scouts' papers.** Under the resettlement rules of 1906 a scout (ходок) went ahead for a family, a group of households or a community and registered plots for those he represented by the number of male souls; the settlers could travel with the state's benefits only after the certificate of plot registration (свидетельство о зачислении участков) had been issued. [S47] Look for the scout's papers and that certificate at both ends: they name the households he represented and give the earliest date on which the family could move with benefits. A Tula blogger reproduces a document captioned «Подписка ходока», a scout's signed undertaking. [S46] These papers do not date the move itself; date it from the removal and enrolment records as above.","sources":["S47","S46"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b5b2a5e1dffa","kind":"custody","anchor":"**Trade and industry inspection journals.** To test a story of an ancestor's shop, mill or workshop, look for the journals of inspection of trade and industrial enterprises. The tax inspectors who kept them were set up by a law of 30 April 1885 and attached to the treasury chambers; the fond of the tax inspector of Starodub uezd (State Archive of Bryansk Oblast f. 544, 1894–1914) holds such journals for the town of Starodub. [S49 @2026-11-15] A blogger lists their fields as the place, the name of the enterprise, the owner's estate and name, the manager, the dates of the trade certificate, the number and pay of clerks and workers and the turnover. He names treasury-chamber, tax-inspector and uezd zemstvo board fonds as the places to look and, for Moscow, f. 179 [S48 @2026-11-15], which is the Moscow town public administration (управа and duma) in TsGA Moscow. [S50 @2026-11-15]","sources":["S49","S48","S50"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-5f48bc4d66a0","kind":"method","anchor":"**In a call-up list, name every column from its heading too.** Under the 1874 statute the call-up age was 21 and entry into active service was decided by lot [S33]; each man drew once and served according to the number he drew. [S34] So a number in the lot column is his lot number, not an entry number, and a man in the list did not necessarily serve: the decision column states the result, such as «призван на строевую службу» or a deferral. [S32] Family-status deferrals were in three classes: the first for an only son or the only family member able to work, the second for the only working son of a working father whose other sons could not work, and the third for the brother next in age after one already on active service. [S33] A younger brother's later entry can therefore list the brothers with their ages and record an older brother's service: in a Tula list of 1904 the family column names two older brothers, one of them in military service since 1900, and the deferral column gives a third-class deferral as the brother next in age after him. [S32] When a man's own entry stops at the call-up decision, read his younger brothers' entries in later years. The blogger's 1900 and 1904 lists differ in form, so do not carry column numbers from one year to another. [S32]","sources":["S33","S34","S32"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-39764ba2cdf6","kind":"method","anchor":"- **Read a household form for whom it names.** The forms differ by census and place. The 1917 questionnaires behind the Altai archive's database give the names of family members with their ages and relation to the head, and each household's status as старожил or переселенец. [S45] Other household cards name only the head. A guide to the agricultural census cards of 1916–1917 says that members' names were not entered, only each person's relation to the householder, age and any absence of more than a month. [S44] Nizhny Novgorod cards of 1917 and 1920 name only the head in full and write the others as abbreviations of their relation with ages (Х for the householder, М mother, О father, С son, СН daughter-in-law, БР brother), under point 23 of the enumerators' instruction, and mark a landless household «безз» in the column of allotment units. [S41] Tula's household cards of 1910–1912 give the members other than the head only by relation, age and occupation. [S42] Name the members from the metrical books: look for births to parents of the head's or his son's names in the year each age implies, allowing for the census's error [S44], and record each match as an inference. Read the abbreviations from the instruction, not as initials.\n- **A «старожил» mark does not prove birth in the village.** A blogger read «старожилы» on the forms of several brothers in an Altai village as meaning that they were born there, while the eldest brother's form gave him as a migrant from Tula guberniya who had settled in 1880. [S43] The mark shows only that the person was not himself recorded as a migrant. Take it as a lead to the local baptismal registers, and read the form's trade column as well: the eldest brother's form gave his trade. [S43]","sources":["S45","S44","S41","S42","S43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e02afb3285c0","kind":"custody","anchor":"**Marriage papers of the volost executive committees after 1917.** The fonds of the volost executive committees (ВИК) can hold the papers of couples who married through the volost. In the fond of the Pershino volost executive committee of Aleksin uezd (State Archive of Tula Oblast, f. Р-210, op. 1), a file whose title resembled the files of passports and identity papers held, for marriages of 1922, certificates of the parents' consent, the couple's signed statements that the impediments of articles 66–70 of the 1918 code did not apply, birth certificates copied from the metrical books on Soviet forms, a groom's petition to the volost soviet explaining why his marriage was under age, a people's judge's divorce certificate that restored a woman's maiden name, and certificates of widowhood, one of them the first record found of a husband's death in the First World War. [S38 @2026-11-15] The 1918 code set the marriage age at 16 for women and 18 for men and allowed guberniya civil-registration departments to lower it by six months in exceptional cases, such as a peasant household left without workers; the 1926 code took effect on 1 January 1927. [S39 @2026-11-15] So a petition in a volost file is the request, not the ruling. Under the divorce decree of 1917 the spouses received a certificate of the divorce; spouses who agreed could choose their surnames, while in a divorce sought by one of them each took back the surname borne before the marriage. [S40 @2026-11-15] Read a divorce certificate for the woman's maiden and married surnames, and open every file of the series, whatever its title says.","sources":["S38","S39","S40"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-060841bed13f","kind":"custody","anchor":"- **Family lists sit in more fonds than the volost board's.** Family lists (посемейные списки) of peasants and мещане were kept from 1858 by the treasury chambers and the volost boards. A reference page on the taxable estates places them, in regional archives, in the fonds of resettlement administrations, volost boards, estate institutions, town boards (городские управы), treasury chambers, мещане elders and land captains (участковые земские начальники), and the inventory books of appanage peasants in RGIA, f. 515. One list was kept up for years and replaced by a new one when it had no room left for changes, so a volost fond can hold three or four of them. [S65 @2026-11-15] A genealogist's post names the same holders. [S64 @2026-11-15] Search each of these fonds for the society before you treat its family list as lost.","sources":["S65","S64"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-85ac89b56ec0","kind":"method","anchor":"- **Copy the household's economy as well as its people.** The 1917 household card also records the household's livestock by kind, its implements, its land by form of holding, the land it rented or let, and its sown area by crop. [S56] A genealogist's 1916–1917 card from Orlov uezd of Vyatka guberniya gives these under the settlement, volost and society, with the head's age, estate, nationality, literacy and occupation. [S55] Copy these fields as the household's profile, and use them with the head's age to tell apart households whose heads share a name. In Nizhny Novgorod the forms for the control of land renting and letting (бланки контроля аренды и сдачи земли) are in the same fond as the cards (ЦАНО f. Р-124). They repeat the plot's size, term and price, and add the names of the person renting and the person letting, which a card can leave out or give wrongly. A blogger found some in op. 4, d. 43 and others at the end of a file of household cards, after the cards. [S57] Turn every sheet of the file to its end.","sources":["S56","S55","S57"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-eca0a08b2f9a","kind":"method","anchor":"**Numbered plots and khutors.** A place written as a plot and khutor number can be a resettlement allotment, not a village. In the Oparino area (now Kirov Oblast), plots and numbered khutors were allotted to settlers from the Baltic provinces, Belarus and elsewhere, mostly in 1907–1912, and the resettlement administration that allotted the land sat at Nizhnyaya Volmanga until it moved to Oparino in 1912. [S54] A genealogist whose family was remembered as Old Believers of a named khutor learnt from a ZAGS reply that the place was «участок 106, хутор 4»; the 1926 census in the Oparino district archive showed these to be resettlement plots but named no one on that plot. The family was found in a list of settlers of the Oparino part of the Oparino–Moloma resettlement district placed in 1909–1911, with additions for 1912–1915, which a caption in the post gives as Veliky Ustyug archive f. 69, op. 1, d. 11. [S53] When a ZAGS, census or household entry gives such a plot number, search the settler lists of the resettlement district, not the records of an ordinary village.","sources":["S54","S53"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e35c4c6b83d3","kind":"custody","anchor":"**Leaving the commune, 1906–1917: the plot on the map.** A peasant who left the commune and had the land consolidated in one place («к одному месту») left papers in the uezd land-management commission's fond and in the guberniya draughting office's. In the Central Archive of Nizhny Novgorod Oblast (ЦАНО), f. 272, the Arzamas uezd land-management commission (1906–1917, 29 files), holds copies of resolutions approving land-separation projects, village assembly sentences and files on separating land for peasants, and f. 829, the guberniya draughting office (губернская чертежная), holds maps and plans of land plots. [S58 @2026-11-15] From these fonds a blogger used a 1909 list of those leaving a village society, a 1913 commission resolution consolidating their land, and a draughting-office plan of the consolidated plots with its list of owners, then overlaid the plan on satellite imagery to fix the plot's coordinates. The same route can start from a lease-control form for a tenant who rented from such an owner, which the blogger calls a rare piece of luck; plans and descriptions of bought land are also in the uezd zemstvo board fonds. [S57 @2026-11-15] These fond numbers are Nizhny Novgorod's; look for the matching commission and draughting-office fonds in the guberniya's own archive.","sources":["S58","S57"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-21167be4fb06","kind":"portal-availability","anchor":"**Peasant Land Bank loan files.** For peasants who bought land with a loan of the Peasant Land Bank, alone or as a village society or partnership (товарищество), search its fond at RGIA, f. 592. On 16 November 2026 the Великие предки project's page on the fond counted 93,382 loan files (opisi 4–39) in 627 uezds of 75 guberniyas and said it had digitised and openly published 61,263 of them (65.6%), listed by guberniya and uezd. It says about 90% of the files hold only lists of the borrowers (the household heads), fewer than 1% hold family lists and the rest no list at all, and that its imaging covers each file's identifying data, lists and reports, not every file in full. [S62 @2026-11-16]","sources":["S62"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7c9e097564ef","kind":"method","anchor":"One catalogued file of 1893 from Ufa guberniya (op. 35, d. 27) holds an 1885 plan of the plot for sale, a list of the partnership's members with their male souls, a statement of the buyers' economic position and their origin in Kazan guberniya. [S63] A genealogist reads these files for the household heads and the number in each household, sometimes their kinship, and a settler family's place of origin and date of moving. The list of documents submitted can record an attached family list of the buyers with its date and number of male souls, and details such as the owners of neighbouring plots or the founding date and first settlers of a khutor can appear only in the narrative. [S61] Read the whole file, including the list of documents submitted. A digitised part that holds only the borrower list is not the whole file.","sources":["S63","S61"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c33304cedf3a","kind":"custody","anchor":"- **1917 urban census forms:** for a town household in 1917, look in the regional archive for the forms of the urban census taken that year alongside the agricultural census. A genealogist names its main forms as the per-apartment card (поквартирная карточка), with the address, the house owner, the head of the apartment, everyone living in the apartment, its rooms and fittings and the livestock kept, and the per-property list (повладенная or подворная ведомость), which lists every building on the plot and the apartment holders by surname; the post says they survive incompletely, in the regional archives. [S59 @2026-11-15] In Tobolsk guberniya the census used household, apartment and city-block (поквартальные) cards. The apartment card was made for the household of each apartment and gave each person's relation to the head, age, literacy and occupation, absent members such as men at the war, and the rooms, stoves, lighting and heating; the documents of its first processing are in the State Archive in Tobolsk, f. I417. [S60 @2026-11-15] ЦАНО f. Р-124, op. 3, holds urban-census cards for the uezds of Nizhny Novgorod guberniya. [S58 @2026-11-15] Survival varies by town: search the statistical committee's and statistical bureau's fonds in the regional archive before you treat a town's census as lost.","sources":["S59","S60","S58"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-db5830bce578","kind":"method","anchor":"- **A land qualification «по цензу жены» or «по цензу матери» is not the voter's own land.** Under the Regulation on State Duma elections of 6 August 1905, women could give their real-property qualification to their husbands and sons (art. 9), and sons could vote in their fathers' place on the fathers' real property, with their authorisation (art. 10). [S68] A genealogist shows a 1906 list of those entitled to vote at the congress of uezd landowners of Berdichev uezd, Kiev guberniya, in which three men's land qualification is marked «по цензу жены» or «по цензу матери». [S67] Record such land as the wife's, mother's or father's, and look for it among that relative's land and notarial records.","sources":["S68","S67"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-61a56d32ebb9","kind":"method","anchor":"**In a family list, read the form's own columns.** Forms differ. A genealogist describes a family list whose male age column has three parts: the age by the revision tale, the age on 1 January of the year the list was compiled, and the year, month and day of birth by the metrical book. The family carries its number in the list and in the revision tale, and a column marks the men taken into active service in the six years before the list was compiled, with the year of call-up. [S64] A reference description of the form gives the family's number by the last revision tale in column 2, the men's year, month and day of birth in columns 4–6, and their entry into and release from active service and transfer to the reserve in column 8. [S65] Under the military-service statute of 1874, call-up lists were compiled from the family lists, which parish priests checked against the metrical books every year; in 1885 the duty passed to the volost elders and clerks. [S66] Take a man's birth date from the metrical column where the form has one, carry the family back to the revision tale by its revision-tale number, and take a call-up year to that year's call-up list in the volost fond.","sources":["S64","S65","S66"],"checked":null,"stated_as":"observation","review":"reviewed"}
