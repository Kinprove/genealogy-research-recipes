claims:
  - {"id":"C-cb342f31af6a","kind":"unclassified","anchor":"- A Sanborn sheet does not name the people who lived in a building, and it almost never names the owner. Businesses are usually labelled only by type, such as \"auto top works\" or \"mattress factory\". A firm's name was added only for a large concern when there was room on the sheet [S1], [S2], [S3], [S4], [S5]. Get names from directories, land records, newspapers and censuses.\n- Do not date a building to the base year of a corrected volume.\n- None of these means a place was unmapped or did not exist: missing from one holder's list, uncoloured on a key map, missing from one edition, or missing from a gazetteer.\n- Do not use a colour or symbol key from another volume or a generic online key without checking it against the key in the volume itself.\n- An overlay outline is not a modern parcel, footprint or address.\n- A modern street with the same name is not the historical street. Living near someone does not make them kin.\n- Absence from a landowner map does not prove the family did not live there or owned no land.","sources":["S1","S2","S3","S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cc9a5aa924b2","kind":"unclassified","anchor":"1. Search every holder before you call a place unmapped. The Library of Congress does not have every Sanborn edition online. Some sheets are still under copyright, and some volumes are not digitized or not held [S1]. Also check university, state and public-library sets. Examples are the University of Utah Marriott Library's Utah Sanborn site (the Utah Sanborn maps it holds, with georeferenced sheets you can download for Google Earth) and BYU's ProQuest access [S1], [S5], [S9]. The LoC city table lists each volume's date and sheet count, plus any other places included [S10]. When you are looking for a small place next to a large city, always check the city's volumes as well. Sanborn put sheets for outlying places into city volumes, such as Manchester and South Richmond in a Richmond volume [S10].\n2. Search by area as well as by name. OldMapsOnline lists the historic maps that fall inside a rectangle you draw, and the list updates as you pan or zoom [S25]. The USGS Historical Topographic Map Collection viewer shows a timeline of every digitized map for the area. Tanner cited about 178,000 maps in 2016 [S25].\n3. A keyword hit is a hit on catalogue information. On David Rumsey, a keyword finds any term in a map's metadata [S7]. So check that the map image actually shows the target place before you count it as coverage. Start with a broad search without exact-phrase quotes, then narrow it [S7].\n4. Land-ownership maps are rarely indexed, so expect to browse. Narrow the search with the census township name or the land description [S11]. Not every county had an atlas published [S11]. Record which sites, holders and editions you checked. A site you did not check is a gap, not a negative result.","sources":["S1","S5","S9","S10","S25","S7","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c88b3a88a3cd","kind":"unclassified","anchor":"When an archival map has been detached into a map collection, search relevant finding aids\nfor a possible originating dispute or court case, using the supported places, parties and\nsubject. Preserve both locators and why the link is proposed. Hoitink's\n[example](https://www.dutchgenealogy.nl/map-of-the-week-shooting-of-tonis-willinck-circa-1590/)\ndescribes this route; retain the map-to-case link as a candidate until the records establish it.\nKeep the estimated map-production date, the case-file span and any dated event statements\nseparate. Seek the case's actual statements before dating the depicted event or moving a\nsame-named person to another generation. [S31]","sources":["S31"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-486faad3115a","kind":"unclassified","anchor":"1. Use the volume's street index and key map to reach the detail sheet. Follow the adjoining-sheet numbers printed in the margins. In Smith's example, sheet 208 points to 209 [S3]. An uncoloured block on the key map either was mapped in a separate volume or was left out by the surveyors. Check the city's other volumes for the same year before you decide which [S3].\n2. Record both dates. A date range in a volume's publication date means the copy carries pasted-in corrections. Correction slips were pasted onto published maps [S6]. In the Genealogy Gems walkthrough of the LoC table, a Richmond volume reads \"1924 through April 1950\". The 1924 base map was updated with paste-overs up to 1950, so the sheet shows Richmond around 1950, drawn on a 1924 base [S10]. Cite the holder, volume, base date, correction date and sheet. Treat any building as shown at some point within that span, not as of the base year.\n3. Take the meanings of colours and symbols from the volume's own key. Look at the front or back of the volume, or the town's first sheet [S7]. Smith notes that the symbols were fairly standardized because the surveyors worked from wax templates [S1], but keys did change between volumes and years [S7]. Use another volume's key or a generic key only as a default reading, and confirm it against this volume's key. Common readings are yellow for wood frame, pink for brick and blue for stone. Smith also reads a large X as a stable, plus marks for storeys and windows [S1], [S3]. Smith worked from a legend she found online [S2], [S4]. If you do the same, record it, because that is a weaker reading. Colours and symbols describe material, height and use. They do not describe ownership [S4].\n4. When working in a georeferenced mosaic, open the individual sheet. In the Spanish Fork example, the border of one sheet hid neighbouring stores [S1].\n5. Compare editions lot by lot. The Hollister lots are empty in 1886, have a house, stable and coop by 1892, and have a second house by 1902 [S9]. Keep structure observations in one column. The owner comes from a plat map or other record, as in that example [S9].","sources":["S3","S6","S10","S7","S1","S2","S4","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ac5c717685f9","kind":"unclassified","anchor":"Find the building from its occupancy label plus landmarks named in dated advertisements or directories. Smith combined newspaper ads with the 1925 map to find an auto-top and mattress works at 242 North Main. It was the only business of its kind on that edition. She used an ad's bank and telephone-office landmarks to place a second firm, and found that Spanish Fork had two banks in 1925 [S1], [S2]. Before relying on a label, check that it is unique across the whole edition. Record the link as an inference and give your reasoning. Record the printed address separately from today's numbering, because street numbers can be reassigned. Spanish Fork's Main Street numbers were, and 242 North Main no longer exists [S1]. One edition shows a single moment. Spanish Fork has editions of 1890, 1908 and 1925 [S1].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-02dad9fe6cc0","kind":"unclassified","anchor":"1. Copy the address exactly as written, with its source and date. If the handwriting is uncertain, list the candidate readings and test each one against period maps and any institution at the address. Allen's AI-assisted check of a death certificate kept four parts separate: the handwriting, the reconstructed address, the landmark evidence (a Baptist home at the address), and the street today [S22]. Check every AI step yourself. Do not assume what a number written with a slash means. In a Sverdlovsk (Yekaterinburg) thread, participants read \"218/25\" as a corner house, with 218 on the main street and 25 on the cross street, not as a flat number. They tested this on period plans by checking which house stood at each intersection and how the numbers ran along the cross street. The 1910 plan did not fit. A 1931 plan posted in the thread showed the house on a corner, with no. 27 across the junction, which fits a cross-street number of 25 [S26]. Treat a slash reading as a hypothesis, and accept it only when a dated plan near the record date fits it. Even then it does not tell you who lived there.\n2. Choose the edition closest to the record date [S15]. A building missing from an earlier map does not contradict a later census address. In one example, a 1905 sheet showed no house where a later census placed a couple [S17]. Comparing several dated editions shows how the area changed [S20]. Do not assume the same number marks the same plot today. Compare dated plans that print house numbers with the current map, and record the old and current numbers separately. In a Berlin-Weißensee case, historical no. 131 on an 1893 plan lay in a different stretch of the street from today's 131. A local history society gave the current number as 166. Street View showed an old house at 166, but zooming in to the number plate showed it was actually no. 165 [S27]. Cite an old-to-current number as information from whoever supplied it. Treat a local society's answer as a lead, and test it against dated plans and the house plate before you use it. If a land registry record states the renumbering, cite that record. Treat a war-damage map reading as a lead.\n3. Connect a lost street to the present through dated evidence:\n   - census ward → historical ward map → a renamed-streets list for the city. In a Milwaukee case on Lisa Lisson's show, this identified the street as what is now South Fifth Street [S21].\n   - postal district code → district, then a dated street-renaming list. In a Berlin thread, Auguststraße and Goebenstraße each existed in six or seven districts. A participant decoded the \"W 57\" written with the Goebenstraße address as Schöneberg. Check the code against a period postal-district map before you choose the district. For the Auguststraße address, the researcher guessed Zehlendorf from family tradition. The renaming list then showed that the Zehlendorf Auguststraße existed only until 13 July 1934 and is now Claszeile [S27]. Keep both names and the renaming date. Do not assume the house numbers carried over. The researcher found that Claszeile now starts at no. 2, and the thread left the question open [S27].\n   - the directory's own bound-in map plus surviving landmarks. Aligned on the Ohio River, this showed that a Cincinnati street had been erased by a highway [S18].\n   - period maps plus city directories [S16].\n4. Plot residences on a dated map, record each point's year, and mark any point you estimated. Family History Fanatics estimated positions on an 1842 directory map. They stated that the resulting cluster suggests a relationship but does not establish one [S19].\n5. Use the placement for bounded follow-ups, and treat each result as a lead. For example, choose nearby parishes by language and by whether their records survive, using the five-yearly \"Locations of Chicago Roman Catholic Churches, 1850–1990\" maps in the FamilySearch Digital Library [S12]. Or use an associate's work address from a WWI draft card [S21].","sources":["S22","S26","S15","S17","S20","S27","S21","S18","S16","S19","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1bd3d85cef62","kind":"unclassified","anchor":"Start from a known point. Open every dated edition for the area and record each map's date, the features shown and the names as printed [S25]. Read period names from the edition closest to the event [S25]. If a feature is missing from GNIS, Google Maps, GeoHack services or Find a Grave, that alone does not show it never existed. In Tanner's 2016 searches, the Joseph City, Arizona cemetery appeared on maps but in none of those services. Coordinates from BillionGraves photos located it [S24]. It has since been listed on Find a Grave, so a gap in a listing service may only reflect when you searched.","sources":["S25","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-90f4525ff12b","kind":"unclassified","anchor":"A rural place name in a list or directory may be a farm, an estate or a second settlement with the same name, not a village in a modern gazetteer. Look for it on the sheet of a period topographic series that covers the parish or town named in the record. In one thread, the Courland residence \"Krogkalnos\" from a resettlement list was looked for on the Goldingen sheet of the German 1:100,000 *Karte des westlichen Russlands*. A participant proposed \"Krogekaln\", a few kilometres south-south-west of Goldingen, as a good candidate. The asker's only online hit, a modern farm called \"Krogkalni\" near Libau, was not the place the participant proposed. So a modern hit with the same name is not enough on its own [S29]. Then test the candidate against how the record is arranged. In a Perm-region thread, a participant located a Godovalov hamlet on a 19th-century map 20 km from Bolshaya Sosnova. They judged it too far away to have been listed together with that village in the 1748 and 1763 revisions, and concluded that those entries belong to another place with the same name [S30]. The distance threshold is that participant's judgement. A candidate stays a candidate until a record ties the family to it.","sources":["S29","S30"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-17f148dac678","kind":"unclassified","anchor":"- Retromap (retromap.ru) is a lead for old-map overlays and city plans. A search-result title lists the Столистовая карта (hundred-sheet map) of the Russian Empire under an 1804 label; the map page could not be read, so that label and its interactive display remain unconfirmed [S38]. The map's compilation in 1801–1804 is separately supported by S39. Record the title and year actually shown when you open a map [S39].\n- maps.vlasenko.net holds Soviet military topographic sheets from 1:50,000 to 1:1,000,000, mainly for Ukraine, with partial coverage of Moldova, Belarus and Russia that depends on scale. Record the sheet nomenclature and survey year [S40].\n- etomesto.com overlays old maps of Russia and the former USSR on modern maps. Record the map and sheet [S41].","sources":["S38","S39","S40","S41"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-44f4f5cf15c1","kind":"unclassified","anchor":"- **Denmark:** Historiske Kort (historiskekort.dk), Klimadatastyrelsen's historical map viewer [S49].\n- **France:** Géoportail (geoportail.gouv.fr) shows the Cassini map, made between 1756 and 1815 in 180 sheets. It shows the kingdom's borders of its time, so Nice, Savoy and Corsica are missing [S44]. IGN's Remonter le temps (remonterletemps.ign.fr) offers IGN's historical series, among them the état-major map, surveyed from 1818 to 1881 [S45].\n- **France, Napoleonic cadastre:** the cadastre begun in 1807 is kept by each Archives départementales. Its plans divide a commune into lettered sections and numbered parcels, and the *état de sections* lists each parcel with its owner and *lieu-dit* when the plan was drawn. Take the reference from that archive's finding aid (3 P in the Côtes-d'Armor). Some communes have two series of plans, so match the état de sections to the plan's date before you read an owner [S46]. An owner's name is a tax entry, not proof of title. To follow it to a deed, use [French departmental routing, step 8](french-departmental-record-routing.md#8-find-property-transfers-and-notarial-minutes).\n- **Germany:** the Messtischblätter (topographic sheets at 1:25,000) are in the SLUB Dresden Virtuelles Kartenforum (kartenforum.slub-dresden.de), georeferenced, with a Messtischblätter filter, a place search and a time slider [S50]. SLUB set out to digitise about 6,000 sheets covering the whole Reich (1860–1935) [S51]; if the sheet you need does not appear, record it as not found in the Kartenforum, not as absent. To place a village from its railway station on the 1:100,000 Karte des Deutschen Reiches, see [German register image recovery § 3](german-register-image-recovery.md#3-separate-namesakes-with-the-kreis-and-non-parish-records).\n- **Netherlands:** Topotijdreis (topotijdreis.nl) shows Kadaster's topographic maps from 1815 to the present; choose the year on the slider [S42]. Different zoom levels show different map series, so zoom in to the most detailed one before you read a feature [S43]. Each sheet has its own edition years, and some slider years are grouped (for example 1816–1819), so record the sheet's edition year [S42].\n- **Norway:** Kartverket's historical map archive (Historiske kart on kartverket.no) has thousands of scanned maps, among them amtskart and gradteigskart, free to download, with a map-based entry [S48].\n- **Sweden:** Lantmäteriet's Historiska kartor (historiskakartor.lantmateriet.se) shows maps and survey files from 1628. It shows the survey authorities' material only up to 1875; ask Lantmäteriet for later files [S47].","sources":["S49","S44","S45","S46","S50","S51","S42","S43","S48","S47"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a6c6cdef9ffe","kind":"unclassified","anchor":"To test an oral report of a farm burial ground, check dated county maps and atlases for a cemetery mark. Private cemeteries of the 1840s and 1870s were drawn on them [S23]. Then work out which county held the site at that date. Lehigh was formed from Northampton in 1812, and Berks lost territory to Schuylkill in 1811 and to Lebanon in 1865. Some churches and burial grounds have moved between these counties [S23]. Treat a plotted symbol as an approximate lead for a site visit [S24].","sources":["S23","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fe92b3d877d6","kind":"unclassified","anchor":"Record a landowner map's title, publisher, date and holder. A name on it shows who held the land in that edition. Neighbours and associates on the map are leads [S11]. Smith reports that LoC holds more than 1,800 land-ownership atlases [S11]. A map made for another purpose can still show landowners, such as an 1895 Civil War battle map. Record its purpose and date [S14].","sources":["S11","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a5e1f33bbeb7","kind":"unclassified","anchor":"On a cadastral map, a parcel number is not the house number in a vital record. Galician (Austrian) metrical books give house numbers, but final-stage cadastral maps show building and land parcel numbers. Bridge the two with the earlier field sketch, which labels buildings with the house numbers used in vital records, or with the tax register, which links owners, house numbers and parcels. Check the Gesher Galicia cadastral inventory for what survives for the locality. One participant, working from the 1849 Jaworów map in the Gesher Galicia map room, planned to use such a parcel-to-house index in the Lviv archive [S28]. Record both numbers, the survey year and the concordance you used.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e48deebdd43e","kind":"unclassified","anchor":"Galicia also has two earlier land surveys whose rolls name householders: the Josephine cadastre (1785–1788) and the Franciscan survey (from 1819–1820), whose records are TsDIAL (Central State Historical Archive of Ukraine in Lviv) fond 19, the Йосифінська метрика (Josephine metrica), and fond 20, the Францисканська метрика (Franciscan metrica) [S32], [S35], [S52]. The fond identities come from the archive catalogue read for S52; the survey dates come from S32. Use those rolls as people-bearing series to separate same-named household heads and to trace a holding divided between heirs. They are not map series: no maps or sketches survive from the Franciscan survey, and few Josephine field sketches were kept [S32]. Field sketches (Feldskizzen) and mapped parcels belong to the later stable cadastre. The earliest Galician stable-cadastre maps in the Gesher Galicia Map Room are based on 1826–1828 surveys [S32], [S33].","sources":["S32","S35","S52","S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-004a49ea3564","kind":"unclassified","anchor":"To place a vanished hamlet, use Arcanum's Mapire, which overlays the georeferenced Habsburg military surveys on a modern map. mapire.eu now redirects to maps.arcanum.com, where full access needs a subscription. It carries the first survey (1763–1787; Galicia 1779–1783, Bukovina 1773–1775) and the second (1806–1869; Galicia and Bukovina 1861–1864) [S36], [S37]. Keep the Gesher Galicia Map Room as the route to cadastral maps [S32]. For the jurisdiction and record holders that put these Galician cadastral and military-survey maps in context, see [Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).","sources":["S36","S37","S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b6d8cca7ea7d","kind":"unclassified","anchor":"Georeferenced views are approximate. Older maps look more skewed [S11], and atlas maps like the ones Smith overlaid are not drawn exactly to scale [S14]. Sanborn outlines were drawn by hand. Do not treat an outline as the building edge or the property edge until the deed or survey settles which one it is [S8]. Align the map on features that still exist, such as roads and railways, and keep the georeferencing files with the image [S13]. Tie any parcel claim to the deed or survey description [S11]. PLSS descriptions come from the Land Ordinance of 1785 [S2]. Plot aliquot parts from the deed's own description, not the overlay. Use the [land-index recovery](land-index-book-series-recovery.md) recipe to retrieve that deed.","sources":["S11","S14","S8","S13","S2"],"checked":null,"stated_as":null,"review":"pending"}
