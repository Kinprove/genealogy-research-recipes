claims:
  - {"id":"C-cavalry","kind":"custody","anchor":"For a Household Cavalry other rank or non-commissioned officer, search WO 400, Household Cavalry soldiers' service records, 1799–1920. Check the enrolment form, next-of-kin statement and any conduct record [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nurses","kind":"custody","anchor":"For a First World War nurse, search WO 399 for Queen Alexandra’s Imperial Military Nursing Service, its Reserve or the Territorial Force Nursing Service. Check the named service before interpreting a miss [S1 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-army-auxiliary","kind":"custody","anchor":"For a woman reported to have served in the Women’s Army Auxiliary Corps, search the service records for 1917–1920. Confirm the corps and check the surviving papers for age, birthplace and address where recorded [S1 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-parallel-series","kind":"method","anchor":"For other ranks, search WO 363 for surviving service papers [S2]. Check WO 364 for pension-derived papers even if WO 363 returns no file, since the 1940 Blitz fire at the War Office record store destroyed many First World War soldiers’ service files [S2] [S5] [S6] [S7]. When the service packet is absent or thin, use the medal index card and its referenced medal roll for the service number, regiment and rank. Compare identifiers across these series before attaching a namesake to the service timeline [S2].","sources":["S2","S5","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
