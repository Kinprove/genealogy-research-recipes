claims:
  - {"id":"C-cavalry","kind":"custody","anchor":"For a Household Cavalry other rank or non-commissioned officer, search WO 400, Household Cavalry soldiers' service records, 1799–1920. Check the enrolment form, next-of-kin statement and any conduct record [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-nurses","kind":"custody","anchor":"For a First World War nurse, search WO 399 for Queen Alexandra’s Imperial Military Nursing Service, its Reserve or the Territorial Force Nursing Service. Check the named service before interpreting a miss [S1 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-army-auxiliary","kind":"custody","anchor":"For a woman reported to have served in the Women’s Army Auxiliary Corps, search the service records for 1917–1920. Confirm the corps and check the surviving papers for age, birthplace and address where recorded [S1 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-parallel-series","kind":"method","anchor":"For other ranks, search WO 363 for surviving service papers [S2]. Check WO 364 for pension-derived papers even if WO 363 returns no file, since the 1940 Blitz fire at the War Office record store destroyed many First World War soldiers’ service files [S2] [S5] [S6] [S7]. When the service packet is absent or thin, use the medal index card and its referenced medal roll for the service number, regiment and rank. Compare identifiers across these series before attaching a namesake to the service timeline [S2].","sources":["S2","S5","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-casualty-lists","kind":"portal-availability","anchor":"For a possible wartime casualty, search MyHeritage’s *United Kingdom & Commonwealth, First World War Casualty Lists 1917-1919* index. Capture the rank, service number, indexed enlistment place and any medal details shown. Keep the casualty-list date and the indexed death year in separate fields [S8 @2026-11-22] [S9 @2026-11-22]. On the list image, record the issue date and casualty status heading. Check later issues for corrections before treating the status as final [S10 @2026-11-22].","sources":["S8","S9","S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-prisoner-index","kind":"portal-availability","anchor":"For a soldier reported missing or captured in 1914–1918, search MyHeritage’s *United Kingdom & Commonwealth, World War I Prisoners of War, 1914-1918* index. Compare the rank, regiment and service number and use any birth, residence and next-of-kin details to resolve namesakes. Treat the hit as a lead to the status recorded in the underlying file. Require explicit evidence of capture or internment before recording captivity. Extract the capture date and place and the camp where recorded [S11 @2026-11-22] [S12 @2026-11-22].","sources":["S11","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-gallipoli-missing-file","kind":"platform-ui","anchor":"For a soldier reported missing at Gallipoli or the Dardanelles, check both relevant files covered by the MyHeritage index [S11 @2026-11-22] [S12 @2026-11-22]. In the International Committee of the Red Cross search, use **Available files** to search the Gallipoli missing-servicemen file (C G1 E 15-05) and the main British Army and Commonwealth file (C G1 E 15-01) separately [S13 @2026-11-22] [S14 @2026-11-22].","sources":["S11","S12","S13","S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
