  - {"id":"S92","kind":"web-page","urls":["https://www.ctgenweb.org/county/conewlondon/deeds/PrestonDeeds7.html"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"deed transcriptions read 2026-11-20","entry_sha256":"ee32cff3bbb7d37642e06befd2f3cd9a9be42b4bbb2db9a26dc68d98de470989","claims":["C-fa17021fa62f"],"review":"reviewed"}
claims:
  - {"id":"C-54c29d87b7ef","kind":"unclassified","anchor":"- **Warranty deed.** Guarantees the title against defects [S7].\n- **Special warranty deed.** Warrants only against defects that arose while the grantor owned the land. It makes no promise about earlier owners [S7].\n- **Quitclaim.** Passes whatever interest the grantor had and does not warrant that the grantor owned anything [S7]. So it does not certify the grantor's share or relationship. A quitclaim tells you the grantor may have had some claim. It does not tell you what the claim was or where it came from.\n- **Disclaimer deed.** The signer states that he or she claims no interest in the property. It is used where community property applies. The presenter explains that in Arizona spouses automatically obtained half ownership of real property, so title work sought a disclaimer deed from a spouse not otherwise provided for in the deed [S7]. A disclaimer by a spouse identifies a spouse on that date. It says nothing about parentage.\n- **Dower or widow's release.** S2 describes it as the wife's release of her dower interest when her husband sold the land, or the widow's interest after his death [S2].\n- **Jurisdiction check.** Before you interpret a spouse's joinder, disclaimer or release, find out from an authoritative legal-history source whether a community-property or dower regime applied in that jurisdiction on the instrument date. There are nine community-property states today, including Texas, Arizona, New Mexico and California. Utah is not one [S7]. That list describes present law. Do not apply it to an older instrument without a dated legal source for that jurisdiction.","sources":["S7","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0e5b33331bb2","kind":"method","anchor":"Transcribe the stated consideration. If the deed gives an actual price, compare like acreage and land in the same county and period, citing the values used. A below-market price or a promise of lifetime care can prompt a search for the grantee’s relationship to the grantor [S1]. Check the care agreement, estate and other conveyances before attributing the transfer to family ties.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3737a0f1f98e","kind":"method","anchor":"If comparable values are unavailable, enter “not compared”. A lifetime transfer may explain why the land is missing from the estate, even if a probate file exists [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3b7212765ef3","kind":"method","anchor":"- **Quitclaims among heirs.** When a parent's estate has no will or probate file, search the deed indexes for that parent's land. Look for quitclaims between heirs, or from heirs to a third party. Record each grantor as a possible heir to identify. A married daughter may appear under her married surname [S3]. Being a participant is not the same as being a child. Use [heir lists are not child lists](evidence-proof-judgment.md).\n- **Pre-death deed series.** If an estate contains little or no land, search the grantor index before death for parcels divided among several people on the same day for nominal sums [S4]. Record each grantee, share and parcel, then compare them with the heir list or other family records. The pattern alone establishes neither kinship nor motive.\n- **Fiduciary deeds.** An executor's or administrator's deed in the chain of title means there was a probate. Use the deed date to go straight to the court record [S2]. Then hand the search to the probate inventory recipe.\n- **Life estate or survivorship.** Use this route when a child holds the land after a parent's death and there is no deed or probate at the death. Look back for an earlier deed from the parent that reserved a life estate. Under a life estate the property passes to the remainderman when the life tenant dies. Also look for a joint tenancy with right of survivorship, which passes the property automatically to the surviving tenant or tenants [S7]. Record the conveyance date and the end of the life tenancy as separate events. Do not treat the death as the date title passed. The presenter says that US jurisdictions usually require some evidence of the transfer at the death [S7]. Search the chain of title after the death for it, such as a later conveyance by the remainderman or a recital of the life tenant's death. Do not assume nothing was recorded.","sources":["S3","S4","S2","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8793a501a4dc","kind":"unclassified","anchor":"- **Wife's or widow's release.** Check the release for her maiden name. List her witnesses as possible relatives to test. The presenter says the release may give the maiden name and may be witnessed by her family [S2]. Witness kinship stays unproven until another record supports it.\n- **\"Of [place].\"** Record it exactly as written, including relative forms such as \"of the same place.\" Treat it as a place tied to the party on the instrument date, usually residence. Do not use it to confirm or overturn a birthplace without a source that states birth [S8].\n- **Security for a court bond.** If a deed or deed of trust says it protects a surety on a named court bond, read the recital explaining that purpose, not only the opening parties. Preserve any stated relationship separately from the deed maker, surety, trustee and person bound to appear. Use the supplied names, court, term and dates to queue the corresponding bond or case, then check the cross-reference on the retrieved records. Providing security or acting as surety alone establishes no kinship. [S10]\n- **Candidate pool from same-surname parties.** When the parents are unknown, sweep county land records for every party with the surname, starting about 20 years before the target's birth. Then follow each candidate child's own deeds back to their grantors, and note witnesses who recur [S5]. Treat the pool as candidates. Land records seldom name children [S5].\n- **Search window.** A deed may not have been recorded until many years after the transaction. The presenter says filing was not required at the time. Search at least 20 years past the ancestor's last known date in the area [S1]. Record the instrument date and the recording date separately, as the land-record recipe requires.","sources":["S2","S8","S10","S5","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ed9e27e5a39a","kind":"method","anchor":"Record a smaller parcel as part of a larger tract only where boundaries and conveyances support the link. In an AI-assisted comparison, the same original date and grantor appeared in a deed concerning a different lot [S9]. Compare dimensions, adjoining owners and the cited book and page on the images.","sources":["S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cfd66378f705","kind":"method","anchor":"Keep similar surnames such as Wilmer and Wimmer separate until the parties and parcels can be matched. Where a later deed cites a different day, compare the earlier deed’s body, acknowledgment and cover note on the images. A proposed 13th/30th misreading in an AI-assisted comparison remained unverified by its presenter [S9]. Preserve both readings pending inspection.","sources":["S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ca353b5edb5b","kind":"unclassified","anchor":"A sale in the origin county and a purchase in the destination county by the same name supports a proposed move [S6]. The same applies when someone buys and later sells the same acreage, which can suggest departure [S1]. Before you link them, rule out two different people with the same name. Use the parcel, spouse, witnesses and other people in each locality [S6]. Check that the county and state boundaries for each date are correct [S1].","sources":["S6","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-75415b2b031b","kind":"historical","anchor":"- **Lease and release.** When a lease for a nominal sum and a release of the same tract pass between the same parties, read the pair as one sale, not as a rental and a separate cancellation, and take the price from the release, not the nominal lease sum [S11], [S12]. The lease comes first and may predate the release by a day, a week or even a year, so search up to a year earlier from a release and up to a year later from a lease [S11]. The Legal Genealogist reports the form in colonial America more widely, often in the Northern Neck and older Virginia counties; outside Virginia, confirm the pairing from the local deeds [S13].","sources":["S11","S12","S13"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-da000d2609d9","kind":"historical","anchor":"- **Dower set off to a widow.** Read a record setting off dower as a life estate in part of her husband's lands, generally one-third, not as an inherited ownership share she could keep and pass on [S14], [S15]. At common law, do not list the widow as her husband's heir [S16]. Statutes could differ, so check the law for the place and date: Illinois's 1845 statute endowed a widow with a third of the lands of which her husband was seized of an estate of inheritance during the marriage [S17], and the same guide reports that a widow whose husband left no child took one-half of the real estate and all the personal estate outright, and kept her dower [S17].","sources":["S14","S15","S16","S17"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6a952d699be4","kind":"historical","anchor":"- **Moiety.** The usual sense is one half, also given for *demidietas* and *dimidietas* [S18], [S19], [S20]. Copy any stated fraction: the term can also refer to equal shares [S21]. An 1848 North Carolina deed conveyed a “two-thirds moiety”, read as two of three equal shares [S22].","sources":["S18","S19","S20","S21","S22"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f64c1a4d1a92","kind":"historical","anchor":"- **Age of a buyer or lessee.** Do not conclude from a land purchase or lease alone that the party had reached 21, because an infant's contract to purchase land and a lease to an infant were voidable, not void [S23], [S24]. The Legal Genealogist applies this to land deeds where a jurisdiction treats minors' non-necessary contracts as voidable and says land generally was not a necessary [S25].","sources":["S23","S24","S25"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d8ff924837a3","kind":"method","anchor":"- **How the seller acquired the land.** Extract the source of title from the parcel description, including any stated relationship to an earlier owner [S26]. Tennessee deeds named a grantor’s father, yet several men in the county bore the father’s name [S27]. Trace the earlier conveyance and distinguish the candidates before assigning him.","sources":["S26","S27"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f80b8ffae378","kind":"example","anchor":"- **Court proof of a deed your target witnessed.** Read the later testimony even if the target never owned the land. In one Tennessee proof, the men identifying an absent witness’s handwriting called themselves his father and brother [S27]. Record exactly who claimed which relationship. Another signatory’s matching surname or “Jr.”, or the absence of a son from one candidate’s known family, still needs independent support.","sources":["S27"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-9161354f160f","kind":"method","anchor":"Record the fractional interest actually conveyed and trace the owners of the remaining shares, including descendants of a deceased co-heir. A North Carolina deed for two brothers’ shares left a third share unaccounted for by that conveyance [S22]. Search for a separate transfer before recording ownership of the whole tract.","sources":["S22"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-df7e4974179c","kind":"method","anchor":"To locate a metes-and-bounds tract, combine the calls from its grants, surveys and deeds with adjoining owners’ descriptions that name the same corners [S35]. Fit the roads, watercourses, ridges and neighbours together, then anchor the assembled plats to an identifiable feature on a period map before comparing a modern map [S36]. If only survey transcriptions survive in the material searched, report an approximate location and seek original plats in the county surveyor’s books [S35].","sources":["S35","S36"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-24741a0109bc","kind":"method","anchor":"- **Separate the tract’s county from the parties’ residences.** Search the deed where the land lay, then use each party’s stated residence to find census, tax and court records [S28]. An 1815 Ohio buyer was described as “of Knox Co”; the tract lay in what became Holmes County only in 1824 [S29], [S30]. Date both jurisdictions. Successive Arkansas patents named Izard and then Fulton, formed from Izard effective 1 January 1843 [S31], [S32]. Check which side of the new boundary the residence occupied before inferring a move.","sources":["S28","S29","S30","S31","S32"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1e6eff1c3de3","kind":"method","anchor":"- **Marriage settlement.** Read any separate-estate provisions, trustee appointments and witness signatures. A simple settlement could have no trustee, and a relative could serve where one was appointed [S34]. Record every trustee and witness as a possible relative. Test their identities, including a woman’s married name, in independent records before assigning the relationship [S33].","sources":["S34","S33"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ab6e2a426e4f","kind":"historical","anchor":"- **Wife’s examination in a lease and release.** Read the acknowledgments on both instruments. In a 1751 Virginia pair the wife signed both but was privately examined only on the release [S43]. A 1753 Frederick County transcription likewise puts the private examination on the release [S44]. Check that instrument for the disposition of dower before recording it as missing.","sources":["S43","S44"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c514d898e55d","kind":"method","anchor":"- **Release deed.** Read the obligation in the body of a printed release. It may discharge a mortgage [S28] or another right or claim [S42]. An 1882 Illinois release discharged an agreement to pay siblings for land transferred by their parents [S41]. Follow such a recital to the parents’ deed and any probate.","sources":["S28","S42","S41"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5a111cb79da8","kind":"method","anchor":"- **Heirs' deeds after the widow's death.** When a man died owning land and his widow outlived him, search for his heirs' conveyances after her death as well as after his. What she held as dower went back into his estate for his heirs. The estate should then have been reopened, but often the only record of the division is in the deed books, sometimes only in deeds for the separate pieces sold out of the family years later [S48]. Such a deed may not mention the widow or her death [S47].","sources":["S48","S47"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1c397e0124a9","kind":"method","anchor":"- **A widow’s will over a life estate.** Check her husband’s deed or will for the duration of her interest and the named remaindermen. If the estate was measured by her life, her interest ended at death, even though she could convey that interest while alive [S52]. In one reported case a widow’s will left her property to one son, but the farm was already settled on the children after her death [S51]. Check the probate decision and the remaindermen’s deeds before recording who acquired the farm.","sources":["S52","S51"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20e76bde5a5e","kind":"method","anchor":"- **Land outside the probate county.** Search the deed indexes where the land lay, including decades after death [S50]. A mid-1940s Nebraska title record identified an Illinois will made relevant by an owner’s death in the 1890s [S49]. Follow any named estate or will back to its jurisdiction.","sources":["S50","S49"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0c585bb96ed9","kind":"method","anchor":"- **Several deeds recorded together.** Search adjacent entries for the same grantee. Recording order follows delivery to the recorder, and deeds signed years apart could be filed together [S66]. Extend the search through a later sale or inheritance and record execution and recording dates separately [S67].","sources":["S66","S67"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1119d66e6a36","kind":"method","anchor":"- **Names in boundary descriptions.** Extract every adjoining owner, including women under a new married surname [S54]. A 1780 Massachusetts deed named the seller’s remarried mother in its boundaries without calling her his mother [S53]. Test each proposed relationship outside the deed.","sources":["S54","S53"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-16028cbe4e20","kind":"method","anchor":"- **Deed witnesses.** Do not assign one witness to the husband's family and one to the wife's, as a guidebook did [S55]. Colonial law asked only that a witness be credible, meaning competent to testify and without an interest in the transaction; Virginia's 1710 act, for example, required deeds for land to be proved by two or more credible witnesses [S56]. Treat each witness as an associate lead. Research first the witnesses who recur on documents the person signed, especially across years and places [S55], [S57].","sources":["S55","S56","S57"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c376396b092c","kind":"method","anchor":"- **Mortgage lenders.** Identify the lender or note holder in every mortgage and trust deed, including private lenders in a long series [S50], [S63]. An 1879 trust deed named a wife’s mother and stepfather as lenders without stating their kinship [S62]. Record the parties and obligation as written and seek independent evidence of the relationship.","sources":["S50","S63","S62"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e9e98478d7c7","kind":"historical","anchor":"Convert French and Spanish units with the value for the grant's place, not one standard. Arpents appear in formerly French parts of the United States and varas in formerly Spanish ones [S77]. The arpent is both a length of about 192 feet and an area; as an area it is officially 0.84628 acre in Louisiana, Mississippi, Alabama and Florida and 0.8507 acre in Arkansas and Missouri [S78]. The vara varied by time and place [S79]; in Texas surveys it was about 33⅓ inches [S80]. Do not treat an arpent as an acre or a vara as a yard.","sources":["S77","S78","S79","S80"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a434e9b88932","kind":"method","anchor":"In colonial Virginia the vestry defined processioning precincts and owners renewed their boundaries every four years [S75]. In one 1755 Augusta County list a man attended two neighbours’ boundary walks, but neither attended his; their shared lines may already have been settled [S73]. Check every walk involving the tract. Compare the sequence of names with county road orders to reconstruct the route and test who lived nearby [S74]. The Virginia Transportation Research Council published Augusta County’s 1745–1769 orders and lists other county volumes [S76]. Test any proposed kinship separately.","sources":["S75","S73","S74","S76"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b856b2896163","kind":"method","anchor":"For a family that moved, get every deed in the county they left in which they were grantors, including deeds made or recorded after they seem to have gone, because a sale there could be completed after the move [S81]. Read each for the grantor's stated residence, and note where and before which official the acknowledgment was taken: the sale may name the new county, and the acknowledgment places the grantor where that official could act on that date [S81], [S28]. A clerk could wait for an acknowledgment from a grantor in another county before recording, so recording could follow by days or weeks [S28]. Treat a place found this way as a destination lead, and pair it with a purchase there only after excluding namesakes.","sources":["S81","S28"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-278f999d1bbe","kind":"method","anchor":"A nominal $1 or $10 recital, including “other good and valuable consideration”, can leave the actual price undisclosed [S46]. An index or newspaper notice may repeat the nominal figure [S45]. Read the deed for an actual price. If the recital is all it gives, record the wording and mark the comparison “not compared”. Test family ties using the parties and other records.","sources":["S46","S45"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1905bbc978f9","kind":"method","anchor":"- **Chain carriers.** Read a name marked CC, CB or SCC on a survey, plat or grant as a chain carrier, who carried the surveyor's measuring chain, not as a witness or a party [S58], [S59]. Do not infer legal age from a plain CC: a Tennessee land glossary reads C.C. as possibly under legal age and S.C.C., a sworn carrier, as having reached it [S82], and a Cumberland County, North Carolina, page gives 14 as the minimum age for male carriers [S83]. Family members commonly carried the chain [S60], [S82]; the man having the survey made very often had relatives carry it, especially brothers-in-law, but carriers could be anyone [S61]. List them as possible kin of the landowner to test.","sources":["S58","S59","S82","S83","S60","S61"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-75bdea70ca67","kind":"method","anchor":"- **Separation recited in a deed.** When a spouse remarried, search deed books where the couple lived for property divisions and separation agreements. A Kentucky deed divided a couple’s property while expressly saying they were still married [S64]. The agreement may also name a parent from whom property came [S65]. Use the date by which separation is documented unless the deed gives the separation date itself. Seek a separate record for divorce or death.","sources":["S64","S65"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-eaf94507d6a9","kind":"method","anchor":"- **Hawaiian deeds.** The Registrar of Conveyances records for 1846–1900 may name relatives or heirs and give death dates [S38]. Read the acquisition clause and check leases, mortgages and adoptions in the same books. If a seller conveyed an undivided interest as a grandchild, follow earlier leases for co-heirs and check probate and obituaries for the intervening generation [S37]. Search “heir of” and try a single name in both name fields. Record Royal Patent (R.P.) and Land Commission Award (LCA) numbers to trace the Kuleana petition [S37]. Search with and without initial *Ka* or *Ke* (Kawaiahao/Waiahao) [S37], [S39]. Deeds between Hawaiians are often in ʻŌlelo Hawaiʻi, while corporate transactions may be in English [S37]. Preserve *makua kāne*: it can mean father, uncle, male cousin of a parent’s generation, or the mother’s husband [S40]. See [AI for documentary records](ai-for-documentary-records.md) for help checking a translation.","sources":["S38","S37","S39","S40"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b6045be97122","kind":"method","anchor":"For each parcel, tabulate acreage acquired, disposed of and still held [S68]. Reconcile differences against the legal descriptions and allow for survey variation. Check probate [S71] and transactions outside the years searched [S69]. When full-text search returns unequal acreages, compare the tracts before assuming a missing deed, then search the grantor and grantee indexes by hand [S70]. Inspect the images for transcription errors [S72].","sources":["S68","S71","S69","S70","S72"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ba7c6ae2fcda","kind":"method","anchor":"- **Lifetime gift to a child omitted from a will.** When a parent's final will omits a possible child, keep the child in the candidate list and look for a deed of gift made during the parent's lifetime [S84]. If the deed books yield no gift, check any family-held deeds already available [S84]. Compare the deed's date, parties and parcel with the will and later deeds. Land already given could have counted toward the child's share [S85]. Keep the reason for the omission open unless the records explain it.","sources":["S84","S85"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b3752bb337ea","kind":"method","anchor":"- **Resident named in someone else's deed.** According to the presenter, read the landowner's historical deeds for clauses naming the person you seek as a resident [S87†]. Record the wording and parcel as a residence clue dated to the deed or to the period the clause states [S88]. Require title evidence before assigning ownership to the resident.","sources":["S87","S88"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-74568c25252a","kind":"method","anchor":"When a gift deed might resolve a disputed branch assignment in a published genealogy, trace the same parcel from the purchase through the gift and any later conveyances [S84], [S86]. Compare the owners named in that chain with the people each proposed branch places on the tract. Record any missing transfer and corroborate the proposed relationships with other records.","sources":["S84","S86"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-22804b89dcd3","kind":"method","anchor":"- **Joint conveyance by heirs.** When several heirs convey together, read the recital for their relationships to the former owner, according to Jacobus’s advice on early Connecticut deeds [S89†]. Copy each stated relationship alongside the person's role in the deed and leave unstated relationships open. A 1780 Norwich deed names the buyer’s wife among the co-heirs and lists two heirs’ husbands among the grantors [S91]. Check the relationships against the estate papers.","sources":["S89","S91"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-be8016be74b2","kind":"method","anchor":"- **Wife’s inherited interest.** When a marriage record is missing, examine early Connecticut deeds in which husband and wife convey together. Look for land set to her from her father's estate in the source-of-title wording, according to Jacobus’s advice [S89†]. Copy the estate recital and compare the woman, spouse and parcel with the estate distribution before assigning her a father. In an 1869 Connecticut deed that recites an allotment, the woman’s co-grantor has a different given name from the husband named for the distributee [S90].","sources":["S89","S90"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fa17021fa62f","kind":"method","anchor":"- **Official roles of witnesses.** Before prioritizing a witness as a relative or household lead, check whether a justice or clerk who drew the deed also witnessed it, according to Jacobus’s advice on early Connecticut deeds [S89†]. Compare the witness, acknowledgment and recording lines and record each role stated. A 1711 Preston deed lists the same man as witness and acknowledging justice [S92]. Compare appearances on deeds for other grantors and seek a separate family or household link before prioritizing a recurring official signature.","sources":["S89","S92"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
