claims:
  - {"id":"C-53299c4fdb5a","kind":"unclassified","anchor":"- **City boards or bureaus of health.** Cities often registered during years when their county or state did not. In Pennsylvania, counties registered births and deaths through the Register of Wills from about 1852 to 1854/55 and again from 1893 to 1905. Several city bureaus of health registered in the gap between those two periods [S7], [S6]. Pittsburgh's Bureau of Health has separate series: death indexes for 1851–1857 and 1870–1899, birth registers for 1870–1905 and death registers for 1870–1897 (Pennsylvania State Archives). Give each series its own row. The presenter gives Reading as 1874 and Allentown and Scranton as about 1873–1874 [S7], [S6]. Allentown 1873 is supported elsewhere. For Reading, a published research plan lists deaths from 1873 and births from 1876, so give its two series separate start dates. For Scranton, the only date found is deaths from 1878, so treat the presenter's Scranton date as unconfirmed. In North Carolina, Raleigh kept city records from 1885 and Wilmington from 1903, both before statewide registration began in October 1913 [S4].\n- **New York City.** The state does not file births and deaths that occurred in New York City, so New York State statewide indexes do not cover the five boroughs as part of the city. The state does hold some pre-1898 records from Queens and Richmond towns, for example 1881–1897 [S12]. Historical city certificates are at the NYC Municipal Archives, with images online at a860-historicalvitalrecords.nyc.gov. Take each borough series' date range from the Archives' list of holdings [S11]. Bronx, Queens and Richmond borough series start in 1898. For Bronx areas annexed earlier (1874 and 1895), search the Manhattan records. For pre-1898 Queens and Richmond events, search the separate town and village series (1847–1849 and 1881–1897) and Long Island City (1871–1897) [S11]. Give city, state and each borough series their own rows and start years.\n- **Independent cities.** These sit outside any county and often have their own courthouse. Their records may be held in the city or at a county courthouse [S4]. Virginia has 38 independent cities.\n- **The county.** The register of deeds, the courthouse or the county archives may hold births and deaths from before the state level began [S4]. Some counties, like Pennsylvania's, registered in separate periods with gaps between them. Give each period its own row.\n- **The state mandate.** Treat this as the start of one series, not the start of all coverage. Mandate years differ from state to state, and some states had an earlier state series that stopped. Virginia's state registers cover 1853–1896, and statewide registration started again in 1912 [S4]. Utah's statewide registration began in 1905 [S1]. Illinois statewide registration began on 1 January 1916 [S3].\n- **Mandate is not compliance.** Many births in the years just after a mandate were never registered. In Cook County, many people born in the late 19th century and the first two decades of the 20th never had a certificate and later filed delayed births [S3]. Treat the first years after a mandate as partial coverage and always add a delayed-birth row for them [S2]. Record, as a separate coverage marker, the year the state was admitted to the federal Death Registration Area (formally set up in 1900) or Birth Registration Area (set up in 1915). Admission required registration to be about 90% complete, and both areas covered every state by 1933 [S13].","sources":["S7","S6","S4","S12","S11","S1","S3","S2","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cfe135b57b25","kind":"unclassified","anchor":"Mark each start date as either `verified` (and name the authority you checked) or `presenter-reported`. Re-check any presenter-reported date with the state archives or the vital-records office before you rely on it. Do not extend one state's arrangement to another state.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-45a7054ae596","kind":"unclassified","anchor":"Consolidations change what a name refers to. The city and county of Philadelphia merged under the Act of 2 February 1854, and the city took over the county's boundaries [S7], [S6]. A \"Philadelphia\" record from before 1854 may therefore come from the old small city, a borough or a township. Set the authority to match the event date, not today's map.","sources":["S7","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-54907f6b1f67","kind":"unclassified","anchor":"1. **The chronological register and the individual certificates as separate rows.** Cook County has register books with entries in date order (1871–1915) and individually issued certificates (from 1871). FamilySearch indexes them as separate collections. Some people appear in both, and others in only one [S3]. State-level registration in Illinois began in 1916, and many births before then have no certificate [S3]. A miss in the certificate index before 1916 is weak evidence until the register and the delayed births have also been searched [S3].\n2. **Delayed-birth filings.** These cover people born before the mandate, and also people born just after it whose birth was never registered at the time. Ask the county to search for an application rather than assuming none was made [S9], [S2]. The Cook County presenter says its delayed births have been digitized but are usually not online, and puts this down to a county restriction she could not explain [S3]. This has not been confirmed. Ask the Cook County Clerk, and read the FamilySearch collection description for what it includes.\n3. **Midwives' and physicians' registers.** These are not government-produced records and may be the only record of a birth or death. For Utah, the presenter says many were filmed and catalogued at the Family History Library under Utah, then the county, then Vital Records [S1]. Check the same catalog heading for whatever state you are working in.\n4. **Institutional and supplemental series.** A Philadelphia City Archives representative says the Archives holds births from the almshouse and from Philadelphia General Hospital alongside the official city births [S8]. The Archives' record-group list includes Blockley Almshouse and Philadelphia General Hospital, but it has not been confirmed that a separate births series exists within them.\n5. **Ledgers and group registers.** Some original city records are weekly group lists of who was born or buried, not individual certificates [S8]. Philadelphia deaths before July 1860 survive as cemetery (burial) returns, and death records are filed by cemetery [S8], [S10]. Search these as registers, not as certificate indexes.","sources":["S3","S9","S2","S1","S8","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c8952ab4be86","kind":"unclassified","anchor":"- city hall or a city archive\n- county office or courthouse\n- a local library\n- state archives, state library or state historical society\n- a county or local genealogical or historical society, which may have compiled the only index [S7]\n- FamilySearch, Ancestry, Findmypast and MyHeritage. The presenter says each has contracts with archives and often carries different collections, so check all four [S4], [S7].","sources":["S7","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5451fa41f684","kind":"unclassified","anchor":"When holders are unclear, search the state's vital-records listing in the FamilySearch Catalog or ask a county archivist [S4]. The presenter phoned Raleigh and was told that copies of the city's records were at a Raleigh library and at the state archives. The FamilySearch Catalog then showed city records at the state level [S4]. The library is the Olivia Raney Local History Library (Wake County). It holds microfilm of Raleigh city birth registers for 1890–1938 and death registers for 1887–1937.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-857432aca16a","kind":"unclassified","anchor":"- **Index status:** indexed, or browse-only. Unindexed film under the county catalog listing can still be browsed image by image, and a society index can point you to the right frame [S7].\n- **Access limits:** check the current rule with the vital-records office. Utah's Office of Vital Records page, checked 2026-11-07, makes birth records public after 100 years and death records after 50 years. [S19] Those are the correcting source's limits; do not repeat the presenter's 75-year figure [S1] for births or deaths. For Cook County delayed births, the only report of a restriction comes from the presenter [S3].\n- **Whether the online copy matches the custodian's originals.** The Philadelphia City Archives holds births and deaths from July 1860 to June 1915, marriages only from July 1860 to December 1885, and cemetery returns from 1803 to June 1860. Marriages after 1885 are with the Orphans' Court / Register of Wills. The presenter and the Archives representative gave marriages through 1915 and \"deaths\" from 1803 [S8], [S10]. Correct both before you build the rows. The representative also said she could not confirm which of these holdings appear on FamilySearch or Ancestry [S8]. In Utah, most county registers have been transferred to the Utah State Archives and some remain with the counties [S1]. For example, Salt Lake County's hard copy went back to its county archives.","sources":["S7","S19","S1","S3","S8","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c984d91ee0a7","kind":"unclassified","anchor":"For Philadelphia City Archives death records filed by cemetery, follow the Archives' own sequence: index, then register page, then cemetery name, then original return. A known cemetery and burial date can be a shortcut into the original records [S10].","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0ec4f314b757","kind":"unclassified","anchor":"For a New York City birth, marriage or death listed in an index on FamilySearch, Ancestry or elsewhere, copy the certificate number, year and borough. Search the Municipal Archives image site by certificate number, limited to that borough and year, not by name: numbering restarts every year in each borough, and name spellings differ between indexes [S15], [S14]. The year on a certificate is the year it was filed, so if nothing comes up, check the number and borough, then try the following year [S15]. If there is still no image, record `searched – no hit` for the online lookup and order the certificate from the Municipal Archives; orders for records not yet digitized are typically filled within six weeks [S16]. Record `unavailable (not online)` only when the archive confirms the certificate is not digitized. Many indexed certificates are not yet digitized, including most corrected \"S\" birth certificates, and some images are mis-indexed [S17], [S18], [S15].","sources":["S15","S14","S16","S17","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-84796e6b59a6","kind":"unclassified","anchor":"- **A nearby city where the person worked but did not live.** People living just outside a city could register a birth or death with the city's board [S7], [S6].\n- **Where the mother's female relatives lived around the birth.** Look for her mother, sisters and other close female kin. Include neighbouring counties, and cross the state line where the family lived near one [S5].","sources":["S7","S6","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3d454869c4cb","kind":"unclassified","anchor":"When you find a delayed certificate, record each item in its evidence section as a separate lead with a likely holder. Typical items are a family Bible, a parent's affidavit, a child's birth certificate and school records (school records came from a viewer's report) [S2], [S9]. For a Bible, work out which collateral line holds it [S9], [S5].","sources":["S2","S9","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c4e161d56ba4","kind":"unclassified","anchor":"- an affiant was alive on the date the affidavit was executed\n- an affiant's stated age, counted from the date that age applies to, gives an approximate birth year for that affiant\n- the applicant's signature may show a married surname [S2], [S9]","sources":["S2","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dccfca1d1c82","kind":"unclassified","anchor":"Then ask the custodian whether the application and its exhibits were kept. Researchers have told the presenter that some counties kept only the certificate copy [S2]. The certificate alone does not establish the event; route its weight to evidence/proof judgment.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-74242b3dd153","kind":"unclassified","anchor":"| Place | Authority | Series | Start date (verified + authority / presenter-reported) | Custodian(s) | Access route | Index status | Original vs copy searched | Result |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-28983f6d72c3","kind":"platform-ui","anchor":"An index search is also bounded by how that index matches names. Before you record `searched – no hit` in an online state or county index, read its search tips, and treat it as exact-match only unless they promise phonetic or variant matching: smaller state and county indexes often have none, so a one-letter misreading (Bane for Bone) defeats every spelling of the right name [S20 @2026-11-12]. Then run an initials search with wildcards and a search with no name at all, by sex, county and death month and year. The name-free search is what found a 1928 Oklahoma death indexed as Margotte C. Bane, a day off the headstone date [S20 @2026-11-12].","sources":["S20"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e81e3ac35d7f","kind":"platform-ui","anchor":"Oklahoma's OK2Explore death index works this way: it returns only exact matches, accepts an asterisk as a wildcard in any field, treats a blank field as a wildcard, and asks you to narrow any search that matches more than 15 records. Run the name-free search there with sex, death county and its ±1, 2 or 5-year date range [S21 @2026-11-12].","sources":["S21"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
