claims:
  - {"id":"C-03","kind":"platform-ui","anchor":"Open [Stockholms Stadsarkivs sökbara handskrifter](https://stockholm-city-archives.transkribus.eu/) and search the surname and variants. Use the City Archives’ descriptions to identify what a series can establish. For marital conflicts or broken marriage promises, look for Stockholms domkapitel. Check which volumes the database actually includes before narrowing the query [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Search a named associate when the target surname fails. For a blended household, try a child from an earlier marriage under that child's own surname, and verify the relationships in the case. In the same search, a spelling variant of the child's surname led to an inheritance proceeding in Justitiekollegiet och Förmyndarkammaren, `A1 a2:65`, as reported by the researcher [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Open the page image at the hit and inspect the surrounding pages for the parties, their roles and the disposition. Keep alleged parentage, a witness statement and a ruling separate. Record the fonds, series, volume, page and how the text was produced. If the hit gives only a lead, use the named body, case date and volume reference to find the remaining pages in the Stockholm City Archives catalogue [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"portal-availability","anchor":"A zero-result search covers the text and names queried. It leaves unprocessed volumes and unreadable handwriting unresolved. Compare the searched volume list with the archive's full series, then browse relevant images or pursue the catalogue route for an unprocessed volume. Keep a short-term Stockholm connection open after a miss [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
