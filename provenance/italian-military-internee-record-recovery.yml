claims:
  - {"id":"C-recover-the-captivity-identifiers-1","kind":"method","anchor":"Search the Vatican Information Office for prisoners of war (Inter Arma Caritas) inquiry cards by the prisoner’s name. When there is more than one card, compare the requester, historical address as recorded, camp, prisoner number, service designation and work detachment across the cards. Use any protocol number to trace the underlying correspondence. A card establishes an inquiry and the information entered on it. Read a reply or dispatch record for what the office actually communicated. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-recover-the-captivity-identifiers-2","kind":"method","anchor":"Search Arolsen for the deceased internee under the literal spellings in the Vatican and German papers. Carry differing birthplaces as recorded and test them as spelling variants or historical jurisdiction names. To link the returns, compare the Stalag designation and prisoner number as a pair and test the matching birth and death dates. Record Arbeitskommando (Arb.Kdo.) number and locality separately from the base camp and its prisoner identifier. If a card gives a different Kommando number or only a region, check both number and locality against the German detachment entry before deciding whether it is a transcription difference or a change of detachment. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-recover-the-captivity-identifiers-3","kind":"method","anchor":"Transcribe I.M.I. as Italienischer Militärinternierter when the record uses that designation, and retain Kriegsgefangener where a different document calls the same person a prisoner of war. Compare service designations across the papers. Read Sanitätssoldat as the medical-service role, and preserve Mechaniker in a profession field as a separate observation. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-separate-the-hospital-record-from-later-notices-4","kind":"method","anchor":"If the Arolsen file includes a Deutsches Rotes Kreuz Formblatt 5a, inspect front and reverse for the work detachment, tag, illness, relatives’ address field and burial. Distinguish the dated departure or transfer from the work detachment, admission to the military hospital and death. If a Todeszeugnis distinguishes the underlying condition from the immediate cause of death, record both fields in the order the certificate gives them. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-separate-the-hospital-record-from-later-notices-5","kind":"method","anchor":"Record the Lagerarzt death report to the Wehrmachtauskunftstelle and the Stalag’s transmission of a Personalkarte as separate administrative events. Give each its own date, sender, recipient and document identifier. If the relatives’ address is unknown on a Red Cross card, compare the camp report and war death notice for a historical address. Preserve a blank Vatican communication field as blank. Use an explicit camp statement only for whether that office notified the family. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-recover-the-local-registration-and-check-for-copies-6","kind":"method","anchor":"Follow a war death notice to the civil register of the death locality. Search the registration year named in the notice or file, including years after the death when a later notification is documented. Give the death, notification and registration their own dates and citations. Compare differently formatted versions of a Kriegssterbefallanzeige before counting sources. In Suardi’s comparison, a handwritten Arolsen copy and a typescript held by the municipality preserved a single report. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-recover-the-local-registration-and-check-for-copies-7","kind":"custody","anchor":"For a Hessian death, use the state archive’s Arcinsys route to check whether a usable Standesamt duplicate covers the registration year. If the death register is absent from that route, identify the municipal archive’s death-register series and use the notice’s register reference to select the entry. [S5 @2026-11-22]","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
