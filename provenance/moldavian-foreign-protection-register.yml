claims:
  - {"id":"C-01","kind":"custody","anchor":"Use *Catagrafia sudiților*, Vistieria Moldovei 2/1824–1825, at the Iași County Service of the Romanian National Archives. The alphabetical index is filed separately as 2a/1824–1825 under Aurora Turcu’s name. Use it as a locator and return to the manuscript for the person’s entry and decision. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Use the opening *Scara* to locate the relevant *ținut* and then browse the protection headings, including *rosăști* or *rosienești* for the Russian section. On a page with paired columns, follow each column through its own entry and check the heading before attaching details to a person. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"historical","anchor":"Read *sudit* or *sudet* as foreign protection exercised through consular representation. Keep protection and birthplace distinct, since a claimant could have been born in Moldavia. Record the claim, supporting papers and commission decision as three separate observations. Read the comments and resolution and check end lists for refused claims. A register miss leaves residence and foreign origin open. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Copy the office, date and reference number under *Adeverința*, when given, as the locator for the paper cited in support of the claim. Keep that paper’s date distinct from the inquiry and decision dates. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Transcribe *supușenie*, *nație* and birthplace separately. Read *lege* for religion, *statornicia* for settlement and premises, and *breasla* or *Briasla* for the full description of the work. Keep the elapsed years in *vremea venirii* separate from age. Record *fisionomia* and *portul* as physical description and dress respectively. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Read the whole *Născut* line for parents’ names and notes on their residence or death. Read *Starea* for a spouse’s origin and children’s names and ages, as well as marital status. To pursue a migration lead, combine birthplace and settlement duration into a provisional time window. Compare the name, confession, trade and residence before linking a candidate in another record. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"For Fălciu use Văcaru’s named extracts and for Bacău follow his reference to *Sudiții ținutului Bacău în anul 1825*. For Iași check volume II of *Documente statistice privitoare la orașul Iași*, edited by Ioan Caproșu and Mihai-Răzvan Ungureanu. Use Turcu’s 1956 guide, volume II, pp. 129–150, for layout and scope, and use Stela Mărieș’s *Supușii străini din Moldova în perioada 1781–1862* or her study in *Studia et Acta Historiae Iudaeorum Romaniae* I, pp. 51–138, for the relevant protection context. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"portal-availability","anchor":"Request a targeted lookup from Genealogica only after clearing the gate and confirming the site still offers that service. Use the contact form and give the minimum historical identifiers needed, such as a name variant or district. Ask for the original folio and cite the entry once you have it. [S1 @2026-11-22], [S4 @2026-11-22]","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
