claims:
  - {"id":"C-617678d252e4","kind":"unclassified","anchor":"Date each NIL against the collection as it stood at the time. Record the collection title and any\ncoverage or last-updated note the provider showed. A NIL covers only that version. If the provider\nlater lists the collection as added to or updated, for example with new counties or years, re-run\nthe logged search as a new dated row. Do not overwrite the old row. The\n[Lisa Lisson update-check example](https://www.youtube.com/watch?v=0_GHyojrnu8) motivates this\nre-check. An update notice does not show that the target place or period was added, so confirm the\nnew coverage before expecting a hit.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-57120af44713","kind":"unclassified","anchor":"When a database displays only a fixed maximum number of hits, a list that reaches that cap may be\nincomplete, so a target missing from it is untested, not a NIL. Narrow the query, for example to\none record category and one year range at a time, until each slice returns fewer hits than the cap.\nLog each slice as its own row with the category and range used. A\n[J-Roots database-search tip](https://forum.j-roots.info/viewtopic.php?f=20&t=5084) motivates this\nfor one site's 100-record display. Check each tool's actual cap. A completed set of slices still\ncovers only that database.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e3fe68912e2","kind":"unclassified","anchor":"If searches went unlogged, a browser-history export for that period can list the pages to reopen.\nRebuild each citation and log row from the reopened record page, not from the URL, and mark these\nrows as reconstructed after the fact. History lists the URLs of visited pages. It does not show\nevery query run or every result inspected and dismissed, so do not turn it into NIL entries. The\n[Family History Fanatics recovery example](https://www.youtube.com/watch?v=BSOrsobztYY) motivates\nthis step without naming a tool or making extraction from record pages automatic.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-45c2b1a112e5","kind":"unclassified","anchor":"When building a timeline, keep the date as written, its source locator and stated precision\nseparate from any derived sort key. If software supplies a synthetic first day to order a\nmonth-only date, label that value as an ordering convention and do not export it as the event\ndate. Preserve qualifiers and ranges in the displayed value. Overlapping uncertain intervals\nleave event order unresolved even when the software presents one row before another.\nThe [timeline-sorting example](https://www.youtube.com/watch?v=8Smljk9Aink) reports a partial\ndate beside a generated first-of-month value. It motivates this distinction without\nestablishing a current formula or interface contract.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c4e8b38f4c26","kind":"unclassified","anchor":"For a bounded set of multi-person records, an optional associate index can keep one row\nper named person's occurrence, with the same source-item/document number on every row from\nthat item. Filter by person to see their occurrences or by item number to recover its named\nparticipants. Retain documentary roles and unresolved same-name identities. These are\noccurrence rows, not additional records or independent confirmations; keep the ordinary log.\nThe [John Dobkins record-tracking example](https://dna-explained.com/2022/10/16/tracking-john-dobkins-or-dobbins-to-maryland-52-ancestors-378/)\nsupplies this two-way lookup; repeated association does not establish kinship.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b977defa069f","kind":"unclassified","anchor":"To compare recurrence across record types, derive a matrix from those occurrence rows:\none identified person or unresolved identity candidate per row, and one source item per\ncolumn, ordered by the recorded action or observation date. Retain the date and document\nnumber in each column and mark only observed occurrences. Keep uncertain identities\nseparate rather than merging same-named people to fill the grid. Compare recurring\nparticipants to choose the next distinguishing record; empty cells do not record a\ncompleted search, and multiple columns containing copies remain dependent evidence.\nThe [Alford/Johnson FAN-chart example](https://familylocket.com/rlp-257-alford-johnson-project-interview-with-michelle-mickelson-part-1/)\nsupplies the chronological people-by-source view; the identity and blank-cell controls\napply the existing evidence rules. Keep the underlying log and occurrence rows.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a0b702c468d2","kind":"unclassified","anchor":"Record which names you deliberately searched in each resource, with the date and method.\nA name met incidentally while extracting other surnames is an occurrence, not a completed\nsearch for that name; queue that search separately. The [extraction-log example](https://dna-explained.com/2024/06/14/genealogy-proof-series-extracting-and-recording-data-so-that-you-can-find-it/)\nmotivates this distinction without requiring every name to be transcribed.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-843b3e8ff916","kind":"unclassified","anchor":"For women in a parish's metrical books, a per-surname extraction table can hold two marriage lists\nbesides family groups: brides born with the surname, and brides who married into it. Record any\nprior married surname each entry gives. A widow recorded without a maiden name can then be traced\nback one marriage at a time to her first marriage, which states her birth surname. Each link is a\ncandidate until the original entry is reread. Ages at remarriage may be unreliable, and the lists\ncover only the books extracted. A\n[metrical-book marriage-table example](https://rodgersforum.borda.ru/?1-0-0-00000238-000-0-0-1721744472=)\ndemonstrates this chaining.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d160466c18bb","kind":"unclassified","anchor":"Keep a locality guide bounded to the question and period: historical jurisdiction, relevant\nseries and dates, known loss, present custodian, access and collection/finding-aid links.\nInclude geography or administrative history when it changes where to search. A described\ncollection remains uninspected until its contents have actually been examined.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3d637a199889","kind":"unclassified","anchor":"List every body that created records for the place and period as a separate line in the guide.\nThat includes town, school and church bodies, special-purpose districts such as irrigation or\nhospital districts, and the county, state and national levels. Records at these levels may contain\ndifferent information or copies of the same information; check their creation and copying\nrelationships. A NIL at one level leaves the others unsearched. When judging who supplied a found document's\ninformation, note which level created it. James Tanner's\n[jurisdiction-layer example](https://www.youtube.com/watch?v=7Jn_XMUozo0) motivates this list. It\ndoes not establish that any district's records survive or name individuals.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4591d48f5c7b","kind":"unclassified","anchor":"For conflicting gazetteer coordinates, retain each source's place identifier, stated\nreference point, coordinate system and date where supplied. A church, market square or\ncalculated centre can represent the same settlement; a coordinate difference alone does\nnot separate two places. Check the described feature and historical context before merging\nor separating the candidates, without inventing a distance tolerance. If relocation is\ndocumented, retain the earlier and later sites with their supported dates and identify which\nsite each source describes. Leave unknown dates or reference points unresolved instead of\nreplacing an earlier site with today's coordinates. The [2025 historical-place data discussion](https://www.youtube.com/watch?v=yR_W3jjwQAU)\nsupplies these reference-point and relocation distinctions; their use in this locality guide\nis synthesis, not evidence that any particular place moved.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a1bba17c355b","kind":"unclassified","anchor":"Use that coverage to choose the next searches: target series and locator, dates or sections\nto inspect, access route and the observation that could distinguish the competing explanations.\nAfter a local record loss, distinguish copies transmitted to another custodian from records\ncreated separately by another administrative level. In Family Locket's 2022 example, state-held\ntax copies and federal land patents supply different routes; a patent does not replace a\nsubsequent county deed. Verify the relevant custody and survival for the actual locality.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1494d1fa37e8","kind":"unclassified","anchor":"Trace custody series by series across every jurisdiction that controlled the spot during the\nrecord period. After a county split, older records may stay with the parent county, pass to the\nnew county, go to a state archive or library, or be destroyed. After a border change, church and\nland records may have gone to different archives, or originals may have left with emigrants. James\nTanner's [records-move rule](https://www.youtube.com/watch?v=aSwzD902OUE) and Dave Obee's\n[border-change example](https://www.youtube.com/watch?v=NQ8E1t7xN4g) motivate this check. Neither\nsupplies a custody history for any particular place.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a07115f3323f","kind":"unclassified","anchor":"For one parish's registers or one revision year, keep a year-by-year holdings list beside the\nlocality guide. For each year and section, record every known locator, including parallel files in\nanother inventory or fond. Also record the parish's own page range inside a multi-parish volume and\nscope notes such as births, marriages or deaths only, non-confessing only, or near-illegibility.\nCite the page range, not only the volume, and log which file you actually inspected. A year missing\nor nearly illegible in one file is not lost or NIL until the parallel files are checked. Where\nfiles are stated to copy each other, treat them as one source, not independent confirmation;\notherwise do not assume parallel files are identical. A\n[parish register holdings-list example](https://rodgersforum.borda.ru/?1-7-0-00001326-000-0-0-1780129313=),\na [parish locator table](https://rodgersforum.borda.ru/?1-7-0-00001306-000-0-0-1766240961=) and a\n[revision-list duplicate discussion](https://rodgersforum.borda.ru/?1-7-0-00001332-000-0-0-1772787407=)\nmotivate this. None shows which file is the original, or that copies agree in completeness or\nmarginal notes.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4edce32f6755","kind":"unclassified","anchor":"When searching an archival catalogue or reference database, use the administrative units in force\nat the record date, not an earlier or later unit, such as a former sloboda or a Soviet oblast or\nraion. A birthplace stated in a unit created after the event uses later terminology; convert it to\nthe units in force at that date before searching. If the settlement returns nothing, repeat the\nsearch at the enclosing district and then the province, because files covering a whole district may\nbe indexed only there. A [J-Roots archive-reference discussion](https://forum.j-roots.info/viewtopic.php?f=152&t=36),\na [J-Roots beginners' advice thread](https://forum.j-roots.info/viewtopic.php?f=20&t=5084) and an\n[Ural revision-list exchange](https://rodgersforum.borda.ru/?1-14-0-00000139-000-0-0-1767764008=)\nmotivate this. They do not show how other catalogues index places, and a NIL at every level covers\nonly the catalogue searched.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8ab4b9d6e8d","kind":"unclassified","anchor":"**Method origin:** [Family Locket's locality research and planning example](https://familylocket.com/using-the-fan-methodology-to-find-a-females-father-part-2-locality-research-and-research-planning/).\nUse [evidence and proof judgment](evidence-proof-judgment.md) to decide what a result changes.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5612055352cc","kind":"unclassified","anchor":"For private family or plantation papers relevant to the locality, use an available collection\nindex by place, surname or collection to select the described collection and section. Include\ncollections held elsewhere that mention the place. Follow the locator to the actual holder\nand available volume or reel, then read its finding guide before selecting a bounded range\nto browse. A guide may describe only part of the contents; an omitted name or item does not\nestablish absence from the papers. Log the pages actually inspected and leave the remainder\nuninspected. Private papers are also a separate lead after courthouse loss; a surviving private\ncopy must be located, not presumed. Amy Johnson Crow's [2018 plantation-records interview](https://www.youtube.com/watch?v=in4Jda5KglQ)\nsupplies this index-to-collection route, without establishing present holdings or proving that\nthe target person appears in a collection.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-123862d0b511","kind":"unclassified","anchor":"A genealogical or local-history periodical subject index can supply another locality route.\nSearch by place and relevant subject category, or a distinctive surname, using the index's\nactual options. Preserve the article title, periodical, issue and publisher supplied by a hit;\nit is an article citation, not an inspected article. Check the publishing society's holdings\nor copy service, then the indexing library's article-copy route if needed, using current\ninstructions and the exact citation. Keep an unavailable or requested article distinct from\none received and read. Amy Johnson Crow's [2025 PERSI demonstration](https://www.youtube.com/watch?v=Hr6FD9xvNUM)\nsupplies this citation-to-article handoff; its historical order form and service terms are not\na current ordering contract.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5960fad0b30e","kind":"unclassified","anchor":"Before an onsite visit, confirm the specific service and target volume for the actual date.\nAn open building, scheduled tour, onsite finding index and retrieval of original files are\nseparate arrangements. Retain any advance-order requirement and the permitted capture route;\nif only the index can be inspected, preserve its pointer and leave the document queued.\nThe [onsite-trip example](https://familylocket.com/how-to-prepare-for-an-onsite-genealogy-research-trip/)\nmotivates this distinction without establishing a repository's current policy or permission.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4148e4bef5c0","kind":"unclassified","anchor":"For the cotes already on the visit worklist, check the target archive's current per-order and\ndaily request limits, where applicable, and when requests are collected and documents delivered.\nPrioritize the cotes within that capacity and retrieval schedule, allowing time to examine each\nitem; leave work exceeding the day's capacity queued. Keep each cote attached to its notes and\nsaved images through the permitted capture route. The\n[departmental-archive visit tutorial](https://www.youtube.com/watch?v=nveyeh3OT1k) describes local\nrequest limits and retrieval rounds. It motivates this capacity check; do not copy its example\nnumbers or assume the whole worklist can be retrieved in one day.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1f5c0695ff36","kind":"unclassified","anchor":"For a written record request, state the person or event, known dates and places, available\nlocator, and desired delivery form. If an image of the entry is needed, request a reproduction\nof the original explicitly; distinguish the image, transcription or certified extract actually\nreceived in the log and citation. The [2021 civil-register request example](https://www.youtube.com/watch?v=dhDhK3sPgyU)\nmotivates that product distinction. Check the holder's current service and fee information\nbefore ordering; the example establishes no present fee, service or certification requirement.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-db7aba56c87c","kind":"unclassified","anchor":"For a supported manuscript lead, switch to\n[manuscript collection recovery](manuscript-collection-recovery.md) for the creator and subject\nsearches in cross-repository catalogues, the trace from a collection description to the holder's\nown catalogue, and the request states. The\n[university-archives interview](https://familylocket.com/rlp-284-university-archives-with-sam-howes/)\ndemonstrates creator and subject searches in ArchiveGrid and reports its incomplete participation.\nUse the onsite preparation checks above for any described material you plan to request.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ebc6ef5752de","kind":"unclassified","anchor":"For a broken link to a historical genealogy page, retain the exact original URL and check\nan available web archive, such as the Internet Archive's Wayback Machine, for a dated capture.\nInspect a capture's page content as well as its capture date: several later\ncaptures may preserve only an error page. Move back to a content-bearing capture, then inspect\nlater available versions for the needed pre-change page. Record the original URL, archive URL\nand capture timestamp, inspected dates, access date and actual content or error state; keep any\nknown original publication date separate and retain any pointer to the underlying source. Record\nmissing pages, images and linked material individually. No usable capture means the page\nremains unavailable. An archived tree or transcription keeps that source role; retrieval adds\nneither independent corroboration nor proof of kinship. Roberta Estes's\n[2026 broken-link example](https://dna-explained.com/2026/10/02/focus-step-1-seven-solutions-for-dna-matches-with-absent-or-shrunken-trees/)\nsupplies this recovery route, without guaranteeing a capture or the site's current content.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-335c429e45be","kind":"unclassified","anchor":"The [digital-publications demonstration](https://www.youtube.com/watch?v=a-539DY1aak)\nshows the temporal search across captures. A surviving page does not mean its search form or\ndatabase was preserved: report failed controls and missing captures as retrieval gaps. An\narchived page's date or an unavailable search does not establish record absence or the truth\nof its claims.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ba13893886df","kind":"unclassified","anchor":"When analysis produces another search, retain a separate pending-action field linked to\nthe originating document number or correspondence entry. Derive a list of nonempty actions\nshowing that link, a short source description, the proposed search and its repository or\nrecipient. Group by repository when planning a session. Mark an action completed with its\nactual result or link to the new log entry; preserve the originating record and analysis.\nThis avoids burying a lead in comments or detaching it into an untraceable to-do list.\nThe [research-log views example](https://familylocket.com/rlp-258-saving-views-of-your-airtable-research-log/)\ndemonstrates filtering next steps and grouping them by repository. These are companion\nviews of the log, not replacement search results or a requirement to use Airtable.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-628af1ea5a49","kind":"unclassified","anchor":"For each event task, retain the person/event identifier, target record, archive\nor custodian, locator or clue, project, entered research status, and the actual\nsearched scope and result. Keep the evidence and task status separate: a status\nsuch as complete or unfindable does not prove source exhaustion.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f237105c921f","kind":"unclassified","anchor":"**Method origin:** [BYU's family timeline-grid demonstration](https://www.youtube.com/watch?v=0p_3oXHBy5I).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-929c2547137b","kind":"unclassified","anchor":"Retain the originally agreed objective. Show a later working objective as a separate dated\nrevision with its reason and the scope actually followed, preserving any actual agreement.\nDo not rewrite the original objective with facts learned later. This applies the\n[research-planning example](https://familylocket.com/rlp-187-revisiting-research-planning-again/)\nwithout imposing an additional approval process.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-07f50459f596","kind":"unclassified","anchor":"If the report may be shared in parts, keep the project name, report version date and page\nN of M on every page. Keep each figure, table and document number with its citation, so an\nextracted page can be traced to the full report. Retain the full report and original images\nseparately from the sharing copy. The [report-formatting](https://familylocket.com/rlp-249-rlp-with-dna-11-research-reports/)\nand [report-sharing](https://familylocket.com/rlp-250-rlp-with-dna-12-whats-next/) examples\nmotivate these page-level details; a PDF does not prevent alteration or misuse of an excerpt.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0a4b26a9d472","kind":"unclassified","anchor":"An optional person-to-project index can record each project once with its date, objective,\nresult, unfinished work and links to the report, log and diagrams. Link every identified\nperson it actually covers. Consult those projects before rebuilding a timeline or source log;\nretain the ordinary person-to-source-item index for individual record occurrences.\nTrack updates to each destination tree separately using observed status: finishing a report\ndoes not establish that every tree was updated. The [project-tracking example](https://familylocket.com/rlp-223-tracking-research-projects-in-airtable/)\nsupplies this handoff without requiring a particular database or treating custom status\nlabels as proof grades.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c0af26e89cd5","kind":"unclassified","anchor":"Before extending an earlier phase's log for a new phase, keep a dated copy of that log linked\nto the earlier report. Add later observations in a new working copy or as dated rows, so what\nwas known at the earlier conclusion stays distinguishable. The [research-planning](https://familylocket.com/rlp-247-rlp-with-dna-9-research-planning/)\nand [research-log](https://familylocket.com/rlp-248-rlp-with-dna-10-research-logs/) examples\nmotivate this baseline; a saved log records that phase's scope, not source truth.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e30bf1e96a0b","kind":"portal-availability","anchor":"For a Ukrainian museum, library, archive or Jewish-genealogy site that has gone offline since\n2022, also search SUCHO (Saving Ukrainian Cultural Heritage Online) before calling its\ncollections lost. A Wayback capture of such a site often holds only its start page or other top\nlayers, not the digital collections [H1 @2026-11-12] [H2 @2026-11-12]. Since February 2025 all\nof SUCHO's archived content, more than 50 TB from national archives to local museums, is reached\nthrough the SUCHO Database of Web-Archived Content (`database.sucho.org`), which gives each\nresource's online status, collection timeline and completeness [H3 @2026-11-12]. In 2022 the\narchived sites already included Gesher Galicia, JewishGen Ukraine and Rohatyn Jewish Heritage\n[H1 @2026-11-12]. Record which archive held the capture and its stated completeness, as for any\ncapture above.","sources":["H1","H2","H3"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
