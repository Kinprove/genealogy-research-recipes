  - {"id":"S30","kind":"web-page","urls":["https://ballymacoda.ie/searching-for-missing-friends-ballymacoda-emigrant-advertisements-in-the-boston-pilot/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the dated examples and their reproductions. The November 13, 1880 notice uses an approximate elapsed interval for emigration. The author identifies the December 25, 1880 David Hyde notice and its repeat in January 1881.","entry_sha256":"88cb2ae16b36c75b2db51782e2de4a6349ea3b5b94d2a6711ef0ab54ae132454","claims":["C-23"],"review":"reviewed"}
  - {"id":"S31","kind":"catalogue","urls":["https://libguides.bc.edu/burns/services/finddigitalcollections"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the Digitized Newspapers section, last updated October 21, 2026. It identifies the digitized Pilot selection and predecessor titles and says users can browse issues by date. Coverage is selective.","entry_sha256":"76460068ab11bef9ffb9b7d9b18dc2298fbe1ca4b6077ffb46c0d51fca6d9035","claims":["C-24"],"review":"reviewed"}
  - {"id":"S32","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/the-other-side-of-marriage-records-tracing-divorces-in-genealogy/"],"published":"2025-06-20","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the section on alternatives when a divorce record is hard to find. The author suggests looking for filings in local newspaper legal notices.","entry_sha256":"73acff4fc69f38c7515b57b86cab151a582bda27e42d595f9319755a224ecebf","claims":["C-32"],"review":"reviewed"}
  - {"id":"S33","kind":"pdf","urls":["https://tile.loc.gov/storage-services/service/ndnp/dlc/batch_dlc_fiji_ver01/data/sn83030214/0017504209A/1903012101/0376.pdf"],"published":"1903-01-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the Notice of Summons for a divorce action. It names the parties, court and county, distinguishes the summons date from the order for publication and gives the complaint filing date.","entry_sha256":"1e077603afda00a19b74d3dde8c6e2213c0879369f396392e5af8ab42dff53ef","claims":["C-32"],"review":"reviewed"}
  - {"id":"S34","kind":"web-page","urls":["https://blog.myheritage.com/2026/09/the-great-miami-hurricane-of-1926-what-its-100th-anniversary-means-for-genealogy/"],"published":"2026-09-17","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the Historical newspapers section. Yan Sandler suggests checking disaster-area and former hometown newspapers and combining surname or address clues with language used in reporting on the injured, missing and displaced.","entry_sha256":"5d26d9e370f4e61016b933dfa15687a89bfaa6d56a1ec181c1b578c571159b61","claims":["C-35"],"review":"reviewed"}
  - {"id":"S35","kind":"web-page","urls":["https://gateway.okhistory.org/ark:/67531/metadc2048219/m1/1/"],"published":"1926-09-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the front-page storm coverage and list giving names and Miami-area addresses in the Oklahoma Historical Society’s issue record.","entry_sha256":"82ac6327a512ab632fea41d6fdff91cd006a7aac803195c0062bbc9d043e8d45","claims":["C-35"],"review":"reviewed"}
  - {"id":"S36","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/10/vuonna-1906-havinnyt-helsinki.html"],"published":"2024-10-27","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read Kaisa Kyläkoski’s reproduced notice from Uusi Suometar, March 23, 1906. The account gives the street and house number, sale of wooden buildings to several buyers, removal deadline and the lot owner’s plan for a replacement. The report does not describe a sale of the lot.","entry_sha256":"442e7a7111efe58f4a2f53b6b0bd6c0a9a31d69e9e0c6bd39f9580213fda4942","claims":["C-22"],"review":"reviewed"}
  - {"id":"S37","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/09/vuosina-1901-02-havinnyt-helsinki.html"],"published":"2024-09-20","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read Kyläkoski’s reproduced sale mentions, municipal demolition order and Uusi Suometar items of January 15 and 16, 1902. The second issue corrects the age assigned to the building in the first.","entry_sha256":"c00a4e9c2a0c9aefa01d5aaa6796e92db55f84c473c32becec9dbfe7b113c914","claims":["C-22"],"review":"reviewed"}
  - {"id":"S38","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/07/vuonna-1891-havinnyt-helsinki.html"],"published":"2024-07-30","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the reproduced Päivälehti reports. The May 10, 1891 coverage gives a lot number and owner in one item and distinguishes completed removal from intended re-erection in another.","entry_sha256":"b760e7481591e8f740a41d9a5a014101488f525113926e598c24ccf2be2c0133","claims":["C-22"],"review":"reviewed"}
  - {"id":"S39","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/06/kansallismuseon-naapurustosta-27.html"],"published":"2025-06-13","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read Kyläkoski’s account of stock sold in the bankrupt estate’s name and later notices in the widow’s name, including the move announced in Helsingfors Tidningar on July 15, 1862 and the old shop’s role taking orders on October 1, 1862.","entry_sha256":"8d2459737d85254e4eb715ef436e21ded684a96c896e2bc6c2da09e71d5f1bfa","claims":["C-21"],"review":"reviewed"}
