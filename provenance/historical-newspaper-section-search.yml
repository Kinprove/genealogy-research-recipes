sources:
  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/records/newspapers/newspaper-article-types/"],"published":"2023-03-24","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s searches in announcements, society coverage, classified advertisements, conference coverage and incident reports.","entry_sha256":"4340a01d17df08c738622a573516432fd8d847e68185427f1ba4ef47df5f36e5","claims":["C-01","C-02","C-03","C-04","C-05","C-06"],"review":"reviewed"}
  - {"id":"S2","kind":"pdf","urls":["https://www.loc.gov/ndnp/guidelines/docs/GASiteVisitPublicLibraryOutreach20260402.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Read the genealogy section of the presentation for notices, social columns, want ads and business advertisements.","entry_sha256":"989ca128797c8d3c9a7ded6852ed447c9f1cf8854ff68c1379821f86d86c76ad","claims":["C-01","C-02","C-04"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.thebostonpilot.com/article.php?ID=1913"],"published":"2005-03-25","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The newspaper’s account describes the Missing Friends column and the migration details it can supply.","entry_sha256":"3db805436b7e34a324df7b0dd92d103f1a4a43e63fd42b562ff8e0cbdd633ca7","claims":["C-05"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://blog.myheritage.com/2024/08/she-discovered-her-great-grandfather-survived-the-mexican-revolution-as-a-u-s-refugee/"],"published":"2024-08-08","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. This MyHeritage community account gives Jennifer’s search for Dr. George D. Rich using the word “accident” and identifies her result as a refugee account in the May 29, 1911, *San Francisco Call*. It reproduces practice ads from the December 3, 1905, *San Francisco Call* and July 27, 1906, *Petaluma Argus*.","entry_sha256":"e6df32b57c02d84c961098c62c22eb6fb00e57148887dc8917d2ed44352df370","claims":["C-10","C-12"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://blog.myheritage.com/2024/11/tracing-your-roots-using-immigration-records-to-find-ancestral-origin/"],"published":"2024-11-01","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. In the section organized by period, the author suggests using local sporting and academic coverage and legal notices as leads alongside immigration sources.","entry_sha256":"64c2721ca74f4b48ac116bd5886e65056903bb2363b8b2288231d6d31e6f27ff","claims":["C-08"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/how-to-find-wills-online-and-why-theyre-so-valuable/"],"published":"2025-06-18","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. David Ridd suggests checking local newspaper probate notices when a will is hard to locate.","entry_sha256":"5f52c73992eead9612ef964e589dc69915d82137974c7cef4cd5c78469ef4d30","claims":["C-11"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://blog.myheritage.com/2026/03/tracing-irish-ancestors-a-guide-to-famine-era-genealogy/"],"published":"2026-03-16","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The author suggests checking U.S. obituaries, community announcements, Irish organization coverage and parade reports for family names and Irish hometown clues.","entry_sha256":"f3a3b61d41ff137a29aa3efd779fffd9adcbc6cd8ae9c3c30ea0e4c2b9845c42","claims":["C-09"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://familytreemagazine.com/photos/underused-sources-for-family-photos/"],"published":"2022-02-08","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Read the indexed article text after the direct page returned HTTP 403. Lisa Lisson suggests checking wedding announcements for clothing descriptions when photographs are missing. S9 independently supplies examples from a newspaper issue.","entry_sha256":"e6ac514e5fa20eb2091a343058f24f63e98e1ef65432bfbb6f1e740750ab4891","claims":["C-07"],"review":"reviewed"}
  - {"id":"S9","kind":"pdf","urls":["https://tile.loc.gov/storage-services/service/ndnp/dlc/batch_dlc_kaiser_ver02/data/sn83030214/00175036957/1899011901/0338.pdf"],"published":"1899-01-19","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The wedding column describes attire at individual ceremonies, including the gowns and veils worn by brides.","entry_sha256":"82927abfe2736cc40bdbadf7ea6cba94d555cba3886ec3682dd91e79aaedcc2c","claims":["C-07"],"review":"reviewed"}
  - {"id":"S10","kind":"pdf","urls":["https://tile.loc.gov/storage-services/service/ndnp/curiv/batch_curiv_lytton_ver01/data/sn82014381/00175037937/1880110301/0017.pdf"],"published":"1880-11-03","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The probate notice for Eliza Olsen identifies the Superior Court in Sacramento County, a scheduled hearing and the executrix of the will.","entry_sha256":"1649831b33ada87cbd097b5f02886b4ef80deb2498e41d8e965a34d73c41bedd","claims":["C-11"],"review":"reviewed"}
  - {"id":"S11","kind":"video","urls":["https://www.youtube.com/watch?v=B9ttzUb6mi4"],"published":"2022-07-10","retrieved":"2026-11-20","access":"snippet-only","rights":null,"basis":"Read 2026-11-20. Read the supplied transcript excerpts. The video page did not open. The presenter recommends searching the paper for government and vital notices and describes an out-of-town death notice and a reprint credited to the Boston Journal in the July 23, 1851 issue. S12 documents the types of notices and the scope of an abstract volume. S14 supplies an independently documented reprint. The two notices from that July issue were not independently checked.","entry_sha256":"1d35adf7e8d37e19b90d99e31cd5c6a0fce49db3ba62a5e8379440b50f1676a7","claims":["C-13","C-14"],"review":"reviewed"}
  - {"id":"S12","kind":"catalogue","urls":["https://heritagebooks.com/products/101-d1309"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The description of Joan M. Dixon’s volume lists congressional and military material, appointments, and marriage and death notices. It specifies a two-year volume, chronological arrangement and coverage that extends beyond the District of Columbia.","entry_sha256":"6b8f24f3f52bdaae5b6136060655ada609511cb5a4d71282778e8ec8bba5eda9","claims":["C-13"],"review":"reviewed"}
  - {"id":"S13","kind":"video","urls":["https://www.youtube.com/watch?v=n3JunP5L7pc"],"published":"2022-04-14","retrieved":"2026-11-20","access":"snippet-only","rights":null,"basis":"Read 2026-11-20. Read the indexed episode description and supplied transcript excerpts. The video page did not open. Craig R. Scott suggests looking for casualty lists and battle reports in surviving local newspapers and reports consulting the National Intelligencer and Niles’ Register. S14–S16 verify the period newspaper coverage independently.","entry_sha256":"73961a76cec58fa2597163a983152e383cb0bd3a8506eab88057db559b23eda6","claims":["C-15"],"review":"reviewed"}
  - {"id":"S14","kind":"pdf","urls":["https://ibiblio.org/anrs/docs/E/E3/dh_1812_v03c03.pdf"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Pages 763–764 give a report with aggregate casualties from the *Columbian* and identify its reprint in the July 22, 1814, *Daily National Intelligencer*.","entry_sha256":"fdcb92c9b92ebd2f570d8a7541fbcf14f81a7009a8a2544d65a7bbc4d0f23f19","claims":["C-14","C-15"],"review":"reviewed"}
  - {"id":"S15","kind":"pdf","urls":["https://mdhistory.msa.maryland.gov/niles_register/nilesweeklyregis06balt.pdf"],"published":"1814-04-02","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The issue prints casualty totals for the battle at Williamsburg and a separate list naming commissioned officers killed or wounded.","entry_sha256":"6c9438900b3bab9f515b7e463e7bbbcf77e9574483b62729a15c45f068272a08","claims":["C-15"],"review":"reviewed"}
  - {"id":"S16","kind":"pdf","urls":["https://cdm17538.contentdm.oclc.org/digital/api/collection/p17538coll17/id/1734/download"],"published":"1813-10-23","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Read the issue’s reports of casualties in the Battle of the Thames and aboard the brig *Argus*, including extracts credited to other newspapers.","entry_sha256":"de80b46dfcc1121f172a90e8f60e69fdc6cfe5f2380996b08f490e5b777d01db","claims":["C-15"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"Read list and table entries as well as long notices for engagements, weddings and milestone anniversaries. For a wedding, capture named attendants or witnesses and the place as separate newspaper observations to compare with the marriage record. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For a missing associate, browse society columns for meetings, club events and private gatherings. Copy the guest and organizer names with their roles and the event’s date. Party attendance gives a social link to investigate. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"If the first profile ties the person to a conference or award, search for the event itself in the host city and in publications serving the sponsoring religious or civic community. Coverage may be filed under the event or organization. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Trace a family business through repeated advertisements. Compare dated address and opening-hour entries across issues so a single ad supplies one dated observation. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"When an immigrant disappears from the expected destination, browse the classifieds for *Information Wanted* and *Missing Friends*. Search for both the advertiser and the missing person. The Boston *Pilot* used this genre for Irish immigrant notices. Use stated origins and migration details as leads to the records for each person. [S1], [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Search the news columns in towns near the incident as well as the deceased person’s home paper. Keep the initial account and follow-up reports as dated observations. Record their witnesses, sequence and conflicting details separately. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"When no photograph survives, check local wedding coverage for descriptions of what the bride or attendants wore. Record the clothing as described for that occasion. [S8], [S9]","sources":["S8","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"For a deceased twentieth-century immigrant, browse local reports of school sports, academic prizes and amateur tournaments, along with legal notices of sales or marriages. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"When U.S. obituaries and community announcements leave a famine-era immigrant’s Irish origin unresolved, look for family names and Irish hometowns in reports on Irish organizations and St. Patrick’s Day parades. [S7]","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"For a suspected move, compare advertisements in the old and new towns. Record each advertised address with its issue date and leave the actual move date open. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"When a will is hard to find, check the local paper’s legal notices for probate or estate notices. Use the named court and any hearing date to guide the search for the will or other estate papers. [S6], [S10]","sources":["S6","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"To test an oral account about a deceased ancestor, search the name as it would appear in print, including any title, with an incident keyword from the story. Read each promising article for the event it describes. In the reported example, a trolley-accident search turned up a refugee-arrival article. [S4]","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"Search Washington, D.C.’s *National Intelligencer* for congressional lists, appointments, military news, and marriage and death notices. Include it for deaths outside the District, according to the presenter’s guidance. [S11†], [S12] When using Joan M. Dixon’s *National Intelligencer Newspaper Abstracts*, select the volume covering the year and use the abstract to locate the issue. [S12]","sources":["S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"When the *National Intelligencer* credits a reprint to another newspaper, as the presenter reports for a death notice, follow the credit to the source printing. [S11†], [S14]","sources":["S11","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-15","kind":"method","anchor":"For a War of 1812 military death, browse surviving newspapers from the person’s locality for casualty lists and battle reports. Extend the search to the *National Intelligencer* and *Niles’ Weekly Register*, two titles the presenter reports searching. [S13†], [S14], [S15], [S16] Check which casualties the report names and which it gives as totals. [S14], [S15]","sources":["S13","S14","S15","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
