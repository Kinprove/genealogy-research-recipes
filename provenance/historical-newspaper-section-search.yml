  - {"id":"S28","kind":"video","urls":["https://www.youtube.com/watch?v=P41LtviK6PY"],"published":"2022-04-26","retrieved":"2026-11-22","access":"snippet-only","rights":null,"basis":"Read 2026-11-22. Read the indexed episode description and supplied transcript excerpts. The video page did not open. Craig R. Scott suggests comparing origins, last-known locations and contacts, dating relative phrases from the issue, opening the corresponding issue, checking for repeat insertions and browsing relevant issues for coverage of deaths in Ireland or visits to or from Ireland.","entry_sha256":"eec7dc169e6cf5ecb625595d35e20f4eddf8a5c8413e3dba022cd31dc78c50ca","claims":["C-23","C-25","C-37"],"review":"reviewed"}
