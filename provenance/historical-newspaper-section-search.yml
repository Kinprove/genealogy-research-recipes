  - {"id":"S23","kind":"web-page","urls":["https://animatinghistory.unl.edu/history/bellaffair/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The project traces named people and court cases through press coverage, including the October 13, 1848 issue of *The North Star*, and gives locators for freedom-suit records involving the Bell family.","entry_sha256":"c1c518db816c247ac491af14716368bd6930a1c9df536410f3a86498d01e18a5","claims":["C-18"],"review":"reviewed"}
  - {"id":"S24","kind":"catalogue","urls":["https://dlas.uncg.edu/petitions/petition/21184810/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Read the catalogue entry and its abstract of a filing that names Arry Hicks and gives the jurisdiction and details of her freedom suit.","entry_sha256":"157c31428fc86a8a3f1eff0c44997b4c5ff3a9abcb0b76be1d9bb3bca4c6922e","claims":["C-18"],"review":"reviewed"}
  - {"id":"S25","kind":"web-page","urls":["https://familytreemagazine.com/podcasts/researching-your-family-history-at-your-local-library/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The publisher’s notes identify Jenny Ashcraft as the guest sharing a newspaper discovery in the sponsor segment at 14:59.","entry_sha256":"f5454e40a8e45ff9076a6fa283463507ee787c2b8e813d8875d932088d788105","claims":["C-19"],"review":"reviewed"}
