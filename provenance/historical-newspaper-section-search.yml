  - {"id":"S41","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/11/gottlebenit-painomusteessa-1777-1786.html"],"published":"2024-11-06","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the references to Dagligt Allehanda and Stockholmsposten arrivals, including the merchant’s two visits with differing companions and lodging detail. Kyläkoski also reports a May 1, 1786 Posttidningar notice naming the court for the deceased merchant’s debts and a November 23 notice reporting the bankruptcy decision.","entry_sha256":"960a3c10fa9056e0b93ac311a5f29d6deb69c64787d9159e3b246d205d980eb6","claims":["C-28","C-30"],"review":"reviewed"}
  - {"id":"S42","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/08/david-tuominen-muutti-sippolaan.html"],"published":"2026-08-30","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the reprinted appointment notice’s misspelling and Kyläkoski’s account of Tuominen’s correction of both surname and job title in Tapio of May 2, 1863. The post also cites signed responses to an earlier article and the sending note on a printed poem.","entry_sha256":"fd714cd72648b021aa1b13001f45cf69ac6b258314493384982a0b517718598a","claims":["C-27"],"review":"reviewed"}
  - {"id":"S43","kind":"pdf","urls":["https://www.utupub.fi/server/api/core/bitstreams/e5d91f30-2520-4f62-b760-552af3699f36/content"],"published":"2023-10-08","retrieved":"2026-11-22","access":"read","rights":"CC BY 4.0","basis":"Read 2026-11-22. Read the sections explaining correspondence columns in Finnish newspapers, including exchanges where editors publicly answered or declined contributions.","entry_sha256":"64830da41516ae2cb482f9efede91c19a883d86a8dc04b767edc278c069f41f9","claims":["C-27"],"review":"reviewed"}
  - {"id":"S44","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2022/06/1800-luvun-tutkimuksen.html"],"published":"2022-06-11","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read Kyläkoski’s fifth conference note. She anticipates searching Translocalis for places or writers and asks which of a contributor’s texts meet the selection criteria. The note predates the release. S45 and S46 establish the corrected scope.","entry_sha256":"141f0ae6bf7a9a1ccc3b797e1ee7a3e1e77b0eb52bd93bbc7d1c59638debccee","claims":["C-26"],"review":"reviewed"}
  - {"id":"S45","kind":"web-page","urls":["https://www.kansalliskirjasto.fi/fi/uutiset/1800-luvun-suomalainen-paikalliskirjeiden-aineisto-saatavilla-digissa"],"published":"2023-02-09","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the launch notice. It describes keyword searching and filters using place and author metadata, publication title and date. It identifies the material as local reader correspondence published in Finnish-language newspapers through 1885.","entry_sha256":"09132b5eb75854c8a3c6694104d06e1f7d5f8743c8588ceac71d0da57be5faf2","claims":["C-26"],"review":"reviewed"}
  - {"id":"S46","kind":"web-page","urls":["https://projects.tuni.fi/translocalis-en/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the project description of locally framed reader letters in Finnish-language newspapers for 1775–1885. Followed its link to the National Library collection, which returned the application’s JavaScript splash screen. Search controls are documented by S45.","entry_sha256":"1384f83b9012071a6f7586cfdc74b968f6fe2ada3fe1de9cf82b5ed87d8103d5","claims":["C-26"],"review":"reviewed"}
  - {"id":"S47","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/09/david-tuominen-lahti-ruotsiin.html"],"published":"2026-09-02","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read Kyläkoski’s account of a job applicant and finalist and the excerpt of the first Stockholm travel letter, dated June 29, 1872. The letter opens with a generic steamship departure before the writer names his own embarkation on the Aura.","entry_sha256":"f063172c9c7e729ee421e946d5be9edabd7d6b936c32cddf76de0074938de553","claims":["C-29"],"review":"reviewed"}
  - {"id":"S48","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/02/ilmestynyt-sukulaisten-peraan.html"],"published":"2026-02-12","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read Kyläkoski’s summary of her published study of eighteenth-century notices seeking heirs and spouses whose whereabouts or survival were uncertain. Her post cautions that publication of these notices had little connection with legal requirements in the late-eighteenth-century practice she studied; the post is not a statement of law for other periods or places.","entry_sha256":"c185f71d97bad94cfd43274c8c285f4a7cac525cce5024f4c13f5bbf4377f559","claims":["C-31"],"review":"reviewed"}
  - {"id":"S49","kind":"web-page","urls":["https://guides.slv.vic.gov.au/ships/journeys"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the newspaper and shipping-intelligence guidance for tracing voyages via arrivals and departures. S40 and S41 supply examples of the passengers, companions, and lodging detail in period travel columns.","entry_sha256":"7f541f4fffc559d2087a2fa53e597dda465002c85889086e0f966d7a8bdcf6af","claims":["C-28"],"review":"reviewed"}
  - {"id":"S50","kind":"video","urls":["https://www.youtube.com/watch?v=2dILEctXIcs"],"published":"2025-05-06","retrieved":"2026-11-22","access":"snippet-only","rights":null,"basis":"Read 2026-11-22. Read the indexed episode description and supplied transcript excerpts. The video page did not open. Judy Russell suggests looking in legal notices for publication of service and for private notices disclaiming responsibility for a departed spouse’s debts. S33 and S51 give examples of the two types.","entry_sha256":"740c6d4d8aff0b9e4f3f27795116f752abc2eec333131b2779561dac37520b3e","claims":["C-32","C-33"],"review":"reviewed"}
  - {"id":"S51","kind":"pdf","urls":["https://tile.loc.gov/storage-services/service/ndnp/az/batch_az_leopardfrog_ver01/data/sn84020558/00212476407/1900071801/0633.pdf"],"published":"1900-07-18","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the paid notice in which a husband says his wife left their household and states he will no longer take responsibility for her debts. The notice supplies a date and locality and gives no court or decree.","entry_sha256":"1034b3acfd98f445b568e6985029626907c75b0cc7e7a6e75fa99fa794495fd4","claims":["C-33"],"review":"reviewed"}
  - {"id":"S52","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/when-a-marriage-disappears-tracking-annulments-in-your-family-history/"],"published":"2025-06-18","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the Newspapers and Legal Notices section. The author suggests checking local papers for announcements and follow-up reporting on annulment proceedings. The article does not document a specific notice.","entry_sha256":"4f9bd1684f2cba643639311f411923745a7a2e6e400a1cd16038e9805f7e0c2c","claims":["C-34"],"review":"reviewed"}
  - {"id":"S53","kind":"help-page","urls":["https://help.ancestry.ca/hc/en-ca/articles/55301382836115-Find-Newspaper-Stories-and-Events-Recommended-for-Your-Ancestor"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the geographic scope and the sections on matching and refining Stories and Events searches. The documentation confirms distinct geographically matched Stories and Events collections. S27 describes the companion event indexes and the two directions of search.","entry_sha256":"750c6b9dc52e114a68aee8c851882b43302829798b0c1422fe442240d81490a4","claims":["C-36"],"review":"reviewed"}
  - {"id":"S54","kind":"catalogue","urls":["https://www.americanancestors.org/search-newspaper-archives-and-journals"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the list of newspaper collections. The publisher lists the Boston Pilot Irish Immigrant Advertisements database and gives its title and coverage as 1831–1920. The underlying search was not tested in a member account.","entry_sha256":"e211dd9c3a43f8b2c8b6954289e8ed8123c94aa19ab05ab01e506586af9b7413","claims":["C-37"],"review":"reviewed"}
  - {"id":"S55","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/08/ananaksia-helsingissa-kasvattanut-mies.html"],"published":"2025-08-04","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the account of Tengström’s 1834 relocation notice and dated crop and seed advertisements, including the February 1836 produce offer and the January 1851 seed list that states his residence.","entry_sha256":"4b022e05342dc0a350cc85e49868d1ae1ac6f6bdbb7a8f7c729f06c30910bc80","claims":["C-38"],"review":"reviewed"}
  - {"id":"S56","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/09/omituiseksi-kutsuttu-karl-fredrik-lonn.html"],"published":"2024-09-29","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read the reproduced retrospective account of the will, including its bequests and burial instructions, and Kyläkoski’s description of the search that had found an estate-inventory notice without locating an official will notice.","entry_sha256":"ba57cc99bca1acac99713f58239c492451cacc3e4a68747573b8172b01f69f41","claims":["C-39"],"review":"reviewed"}
  - {"id":"S57","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/10/karamellituliaisia.html"],"published":"2024-10-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Read Kyläkoski’s comparison of a Helsinki retail offer in Helsingfors Dagblad, May 9, 1864 and a craft-exhibition prize list in Morgonbladet, September 15, 1875. The latter names an exhibitor and attributes the pastilles to her.","entry_sha256":"bf9f493ff64777850e2cec447a639cbd6446fe9bda7d41d1cad6a0fc57b823ce","claims":["C-40"],"review":"reviewed"}
  - {"id":"S58","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/08/vaimon-ja-velat-suomeen-jattanyt-frans.html"],"published":"2026-08-22","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Kaisa Kyläkoski reproduces a reply in *Kalevan Kaiku* on May 31, 1894, and treats the similarity between the missing report and a report in another title as an inference.","entry_sha256":"98c3a5f5807ea1223f352d4de2fa4c635cf6289208bfe7eb74de480dcc3d9e66","claims":["C-41"],"review":"reviewed"}
  - {"id":"S59","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/11/virrenveisuuta-ja-lopetus.html"],"published":"2025-11-11","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Kyläkoski lists *Koti* in *Maamiehen ystävä* on June 18, July 9, 16, 23 and 30, and August 13, 1853. The linked locators for *Vähäköstä niitä on jotka autuaiksi tulevat?* give page 2 on February 26 and page 1 on March 5, 1853. The issue scans for those two pages could not be opened.","entry_sha256":"cd173a4af22914c80a672cb65115c5f66582a72a2efbbca64fe67b5bc71331fb","claims":["C-42"],"review":"reviewed"}
  - {"id":"S60","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2022/10/kuka-muistaisi-guntlackia.html"],"published":"2022-10-17","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Read 2026-11-23. Read the supplied excerpt after the post failed to open. Kyläkoski infers separate distribution from a contemporary description that the chapters accompanied *Dagligt Allehanda*. S61 and S62 support looking for separately issued material. The early serial’s format and coverage in the Swedish portal were unverified.","entry_sha256":"b7f70944f8401972779f0e6a60079eed156e0fc4050d594d9113cd815e052508","claims":["C-43"],"review":"reviewed"}
  - {"id":"S61","kind":"catalogue","urls":["https://sveperlit.kb.se/1/1_127.htm"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The Swedish press bibliography gives the parent title and named nineteenth-century supplements to *Dagligt Allehanda*, including supplements with separate numbering.","entry_sha256":"c68c2d2b10bdb1f3d1806c7f33b18304eb5fdd641ab7093c7f3561520b4cecde","claims":["C-43"],"review":"reviewed"}
  - {"id":"S62","kind":"web-page","urls":["https://www.journals.vu.lt/knygotyra/en/article/download/35966/34152?inline=1"],"published":null,"retrieved":"2026-11-23","access":"read","rights":"Creative Commons Attribution licence","basis":"Read 2026-11-23. The study distinguishes installments in the main paper from separately folded literary supplements. The author examined undigitized supplements in the Academic Library of Tallinn University.","entry_sha256":"e8dae0a846a6ba184f547e1a30b32e25345f1d3ec552747b455fa72bf2f11aae","claims":["C-43"],"review":"reviewed"}
  - {"id":"S63","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/02/ilmestynyt-sanomalehtiemme-varhaisia.html"],"published":"2024-02-25","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Kyläkoski recommends care with nineteenth-century issues dated April 1 or April 30. The companion study in S64 documents hoaxes around April 1 and their later reveals. It supplies no example for April 30.","entry_sha256":"3dc55fe26786bbe30641b9824ba92c9fc6352bab70126361d2385417091442cc","claims":["C-44"],"review":"reviewed"}
  - {"id":"S64","kind":"web-page","urls":["https://www.historianyst.fi/verkkolehti/uutiset/sanomalehtiemme-varhaisia-aprillipi/"],"published":"2024-02-22","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The study describes the April 1, 1899 *Tampereen Uutiset* advertisement and news item for a fictitious exhibit, plus the editors’ follow-up within days. Its later examples include hoaxes reprinted as real news in other papers.","entry_sha256":"2739440bbf45ddee9f4253a3227fd4f4797cd335bbccdac7f762d956ade31f89","claims":["C-44"],"review":"reviewed"}
  - {"id":"S65","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/03/kaupunkien-rummunlyojat.html"],"published":"2024-03-31","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Kyläkoski reproduces the wording of a Helsinki proclamation dated to 1801 in *Uusi Suometar*, January 27, 1915. *Savo*, January 4, 1919, recalls Kuopio auctions and street-corner announcements around 1869. *Sanantuoja*, July 1, 1916, recalls notices read aloud during a reported publishing gap around 1903–04. Recollections in *Kaiku*, August 26, 1934, and *Seura*, issue 13 of 1937, distinguish the drummer and reader in Oulu and Tornio. The accounts establish leads for those places and dates.","entry_sha256":"36f51c988251235dd532ba6c653b7a05c0967e11574b8934150f4bd991971f1d","claims":["C-45"],"review":"reviewed"}
  - {"id":"S66","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/02/kaupunkirenkien-sukunimet-ja-tekoalyn.html"],"published":"2026-02-24","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Read the post in Kyläkoski’s weekly archive beginning February 22 after the permalink failed. The author describes a 1774 notice citing two men’s birthplaces, approximate ages and a court reference. The linked digitized proclamation, binding 2985302, could not be opened.","entry_sha256":"be3380cf29e9621163945655b1c55ac522b8ff1aced58a07e654892fcdb8b282","claims":["C-46"],"review":"reviewed"}
  - {"id":"S67","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/10/valayksia-susanna-eisenbergin-elamasta.html"],"published":"2024-10-20","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Kyläkoski describes the September 14, 1796 Turku and Pori proclamation, including appearance, clothing at escape and earlier service in a named regiment. The linked scan, binding 2994943, could not be opened. The author reports that she did not independently confirm the service identification.","entry_sha256":"429f86c808473cf3410e303da914be17e39099975b8b63a3ec8a7a4e63f7f59d","claims":["C-46"],"review":"reviewed"}
  - {"id":"S68","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2022/01/luterilaisen-kristinuskon-autuus.html"],"published":"2022-01-10","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Read 2026-11-23. Read the supplied excerpt after the post failed to open. Kyläkoski discusses newspaper notices for people missing in war or otherwise and recalls a formal declaration of death in an inheritance context. S69 establishes the separate court decision and assigned date in historical Finnish records.","entry_sha256":"430d4395f294205c930d5f7072698d90efae5c1205084d57db9ab914db5ec570","claims":["C-47"],"review":"reviewed"}
  - {"id":"S69","kind":"web-page","urls":["https://portti.kansallisarkisto.fi/arkistojen-portti/ihmiselaman-viimeiset-lahteet"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The section on declarations of death distinguishes the official notice from the court decision and its assigned death date, and gives the court jurisdiction and records to check for historical cases.","entry_sha256":"8f196eff87196e4ca2af99f399facbf5b95e224fe974cafc7604b402fe579fdb","claims":["C-47"],"review":"reviewed"}
  - {"id":"S70","kind":"video","urls":["https://www.youtube.com/watch?v=uHelDkQixuk"],"published":"2025-10-10","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Read 2026-11-23. Read the supplied transcript excerpts because the video page did not open. The tutorial demonstrates a full question about a locality and a search using modern terminology for historical coverage. S71 documents the separate search modes and semantic matching.","entry_sha256":"dd4f0ffb4ed14a4a0078a7c1b40393b34fea9a98a6a4103f85d292ce07d55bb6","claims":["C-48"],"review":"reviewed"}
  - {"id":"S71","kind":"web-page","urls":["https://www.coloradovirtuallibrary.org/csl-news/elephind-webinar-explore-the-future-of-newspaper-research/"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Read the State Library’s description of the joint webinar with Veridian. It identifies separate keyword and Smart Search modes and describes matching by meaning and related concepts. The live Elephind page returned HTTP 403, so no live query was tested.","entry_sha256":"ddbdfe54abd39723ca787e3727a9ca0e76a2da1326fea5f49441a4eb54bd3227","claims":["C-48"],"review":"reviewed"}
  - {"id":"S72","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2022/09/sanomalehtisymposiumissa-kuultua-ja.html"],"published":"2022-09-01","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Kyläkoski reports that a project used Finnish-American newspapers to trace a writing career and that Lotta Leiwo consulted paper issues at the National Library of Finland. S73 and S74 supply the catalogue and current on-site microfilm route.","entry_sha256":"40510a9bf587b317d74fee87215cf63f746c4ad66575a0a00aea10bd5570d967","claims":["C-49"],"review":"reviewed"}
  - {"id":"S73","kind":"catalogue","urls":["https://www.kansalliskirjasto.fi/en/collections/finnish-american-collection"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The collection description covers Finnish-American publications in the United States and Canada and links to digitized periodicals and a microfilm title list. Coverage needs checking for the title and issue sought.","entry_sha256":"d7a96565c58a58405da1f88abac5ff2a164127239cf77ec4f5386806f834313b","claims":["C-49"],"review":"reviewed"}
  - {"id":"S74","kind":"web-page","urls":["https://www.kansalliskirjasto.fi/fi/kirjastopalvelut/tyoskentely-kirjastossa"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The microfilm section identifies Finnish-American newspapers on the shelf and locates the readers in the North Reading Room.","entry_sha256":"7950a1e852a0e2c25211f37ed1d63981141d807c16df3e148ac6908fabde6ae2","claims":["C-49"],"review":"reviewed"}
  - {"id":"S75","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2022/04/suomi-tanskalaisissa-1700-luvun.html"],"published":"2022-04-19","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Read 2026-11-23. Read the supplied excerpts after the post failed to open. Kyläkoski reports searching for *Finland* and suggests trying names of coastal towns for further shipping notices. The excerpts give no results from the suggested town searches. S76 and S77 establish the Danish newspaper search route.","entry_sha256":"c1b04528e16e8fb8b4de87de2b98c2b33c3fb934c329d6a33a8189f8d46f3d97","claims":["C-50"],"review":"reviewed"}
  - {"id":"S76","kind":"help-page","urls":["https://www.kb.dk/en/find-materials/guides/how-find-newspapers"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The library identifies Mediestream as its digital search for historical Danish newspapers and gives coverage and access context.","entry_sha256":"c346b855f3f554e84ac409c2a0722b8fada804e9d16d9d6355699b0a6c78a3d9","claims":["C-50"],"review":"reviewed"}
  - {"id":"S77","kind":"web-page","urls":["https://skrivopgave.kk.dk/nyheder/digitaliserede-aviser"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The guide describes full-text search in Mediestream’s digitized historical newspapers.","entry_sha256":"0e1c9f237ee630249644b9202c6b3dec77c723ed67da0986ccab9cf3fad0fd7e","claims":["C-50"],"review":"reviewed"}
  - {"id":"S78","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/09/atte-landgren-karkasi-armeijasta-ja.html"],"published":"2026-10-01","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Kyläkoski cites *Östra Finland*, October 27, 1886, for the Viipuri conscript battalion account, distinguishing Landgrén’s prior post in the 30th reserve company from the sentence and loss of rank. The post supplies the issue locator and the author’s reading.","entry_sha256":"44650a98d5734f5fb342e20aecc8e2ae89942c27024ffad5fa440ee69249148b","claims":["C-51"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"Read list and table entries as well as long notices for engagements, weddings and milestone anniversaries. For a wedding, capture named attendants or witnesses and the place as separate newspaper observations to compare with the marriage record. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For a missing associate, browse society columns for meetings, club events and private gatherings. Copy the guest and organizer names with their roles and the event’s date. Party attendance gives a social link to investigate. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"If the first profile ties the person to a conference or award, search for the event itself in the host city and in publications serving the sponsoring religious or civic community. Coverage may be filed under the event or organization. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Trace a family business through repeated advertisements. Compare dated address and opening-hour entries across issues so a single ad supplies one dated observation. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"When an immigrant disappears from the expected destination, browse the classifieds for *Information Wanted* and *Missing Friends*. Search for both the advertiser and the missing person. The Boston *Pilot* used this genre for Irish immigrant notices. Use stated origins and migration details as leads to the records for each person. [S1], [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Search the news columns in towns near the incident as well as the deceased person’s home paper. Keep the initial account and follow-up reports as dated observations. Record their witnesses, sequence and conflicting details separately. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"When no photograph survives, check local wedding coverage for descriptions of what the bride or attendants wore. Record the clothing as described for that occasion. [S8], [S9]","sources":["S8","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"For a deceased twentieth-century immigrant, browse local reports of school sports, academic prizes and amateur tournaments, along with legal notices of sales or marriages. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"When U.S. obituaries and community announcements leave a famine-era immigrant’s Irish origin unresolved, look for family names and Irish hometowns in reports on Irish organizations and St. Patrick’s Day parades. [S7]","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"For a suspected move, compare advertisements in the old and new towns. Record each advertised address with its issue date and leave the actual move date open. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"When a will is hard to find, check the local paper’s legal notices for probate or estate notices. Use the named court and any hearing date to guide the search for the will or other estate papers. [S6], [S10]","sources":["S6","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"To test an oral account about a deceased ancestor, search the name as it would appear in print, including any title, with an incident keyword from the story. Read each promising article for the event it describes. In the reported example, a trolley-accident search turned up a refugee-arrival article. [S4]","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"Search Washington, D.C.’s *National Intelligencer* for congressional lists, appointments, military news, and marriage and death notices. Include it for deaths outside the District, according to the presenter’s guidance. [S11†], [S12] When using Joan M. Dixon’s *National Intelligencer Newspaper Abstracts*, select the volume covering the year and use the abstract to locate the issue. [S12]","sources":["S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"When the *National Intelligencer* credits a reprint to another newspaper, as the presenter reports for a death notice, follow the credit to the source printing. [S11†], [S14]","sources":["S11","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-15","kind":"method","anchor":"For a War of 1812 military death, browse surviving newspapers from the person’s locality for casualty lists and battle reports. Extend the search to the *National Intelligencer* and *Niles’ Weekly Register*, two titles the presenter reports searching. [S13†], [S14], [S15], [S16] Check which casualties the report names and which it gives as totals. [S14], [S15]","sources":["S13","S14","S15","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-16","kind":"method","anchor":"For a deceased person’s travels and civic ties, browse society columns for visits, parties they hosted and named group memberships, according to Rhonda Lauritzen’s guidance. [S17†], [S18] Check the destination paper using the reported place and date of a visit. Keep a host or guest role distinct from an explicitly stated membership. [S18]","sources":["S17","S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-17","kind":"method","anchor":"When a deceased person is missing from longer articles, browse letters to the editor for their signature and check brief sick-list notices and local sports results, according to the podcast’s suggestions. [S19†], [S20]","sources":["S19","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-18","kind":"method","anchor":"For an enslaved person, browse sale and escape advertisements, newspaper court reports and abolitionist newspapers for names, descriptions and places. If the person’s name is missing, search by the named enslaver, estate or locality. [S21], [S22], [S23] When a report identifies a freedom suit, use the parties and court to look for the underlying petition. Keep details from the report and the petition attributed to their respective sources. [S21], [S23], [S24]","sources":["S21","S22","S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-19","kind":"method","anchor":"When an out-of-town death report describes a letter found on the deceased, look for the postmark even if the writer is unnamed, as reported in the podcast’s newspaper segment. [S19†], [S25] Record its locality and date as printed and look for the candidate or their associates in records from that locality. Keep the mailing place, the address on the letter and any evidence of residence separate. [S26]","sources":["S19","S25","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-20","kind":"example","anchor":"When an index hit points to a photograph, transcribe the caption’s identifications and record each pictured person separately from people named only in the text. Keep facial resemblance out of the identification evidence. Treat any later recognition as the recognizer’s attributed claim. The 1924 *Cincinnati Enquirer* item indexed under a mother’s name pictured her daughters. [S27]","sources":["S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-21","kind":"method","anchor":"After a proprietor’s death, check later issues for stock offered in the estate’s name and declarations that someone will continue the firm. Record who placed each notice. When a move announcement is followed by an order notice, assign each address its stated role, including a shop at the old address that still took orders. [S39], [S40]","sources":["S39","S40"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-22","kind":"method","anchor":"To trace a vanished building, search by historical street address or lot number in auction notices, demolition orders and demolition reports. Record the advertised or reported sale, what was sold, the removal deadline and any planned replacement as separate observations. If the sale covers buildings for removal, attach its price to those buildings and leave the lot’s ownership to separate evidence. Check subsequent issues for completion or corrections. [S36], [S37], [S38]","sources":["S36","S37","S38"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-23","kind":"method","anchor":"For *Boston Pilot* Missing Friends hits, compare parish and county, last-known American locality and named associates to distinguish candidates. Keep birthplace, marriage place, last-known whereabouts and the address for replies in their stated roles. [S29], [S30] According to the presenter, use the issue date to interpret elapsed-time phrases, verify them under *Information Wanted* in that issue and check matching ads in later issues for repeat insertions. [S28†], [S30] Record each printing date while counting a repeated ad as one inquiry. [S30]","sources":["S29","S30","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-24","kind":"portal-availability","anchor":"Check Boston College Libraries’ digitized newspaper guide for coverage of the dated *Pilot* issue under the title used that year. [S31 @2026-11-22]","sources":["S31"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-25","kind":"method","anchor":"Where the issue survives, browse it for reports of a death in Ireland or of travel to or from Ireland, according to the presenter’s guidance. [S28†]","sources":["S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-26","kind":"platform-ui","anchor":"For a locality or writer in Finnish-language newspapers, search Translocalis by place or author metadata and open the relevant issue. Its selection covers local reader letters published in the Finnish-language press from 1775 through 1885. Search the paper itself for other kinds of contributions or dates outside that range before weighing a missing hit. [S44 @2026-11-22], [S45 @2026-11-22], [S46 @2026-11-22]","sources":["S44","S45","S46"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-27","kind":"method","anchor":"If a contribution is missing, browse published replies to correspondents by initials and locality. Record a rejection that identifies the submission as evidence of sending it. Follow later replies if a letter started an exchange. When several papers give the same unexpected spelling or job title, follow the credited source and read later issues for a signed correction before treating the printings as independent. [S42], [S43]","sources":["S42","S43"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-28","kind":"method","anchor":"When a traveler is missing from other records, browse arrival and departure columns in ports on the route. Record stated companions and relationships, where the party came from, whom they stayed with and the lodging address. Compare repeat visits for fuller names or addresses and keep temporary lodging separate from evidence of residence. [S40], [S41], [S49]","sources":["S40","S41","S49"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-29","kind":"method","anchor":"In a published travel letter, use the dateline for the writer’s stated place and date of writing and keep the issue date with the citation. Read through any description of a typical journey to the writer’s own account of boarding before extracting an embarkation place. [S47]","sources":["S47"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-30","kind":"method","anchor":"If the death-notice search turns up a summons about the deceased’s debts, take the court and parties from that notice and browse later issues for the reported bankruptcy decision, as in the *Posttidningar* case. Record the summons and decision as distinct stages. [S41]","sources":["S41"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-31","kind":"method","anchor":"For a missing heir or spouse, search notice columns as well as news of the disappearance. Read the notice for whom it seeks and why. Establish any obligation to publish from separate evidence for that place and period. [S48]","sources":["S48"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-32","kind":"method","anchor":"For a suspected historical divorce with a missing case record, search the legal notices for both parties and headings such as *Notice of Summons*, according to Judy Russell’s guidance on published service. [S50†], [S32], [S33] Record the court, county and any complaint filing date for the case search. Keep the summons, publication order and final decree as separate events. [S33]","sources":["S50","S32","S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-33","kind":"method","anchor":"Also search for a spouse’s notice disclaiming responsibility for debts after the other spouse left the household, according to Judy Russell’s guidance. [S50†], [S51] Record its place, date and signer’s account as a separation lead. Look for a case record before recording a divorce. [S51]","sources":["S50","S51"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-34","kind":"method","anchor":"For a suspected historical annulment, search local legal notices and follow-up news for the parties and the reported stage of proceedings. [S52]","sources":["S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-35","kind":"method","anchor":"For someone missing after a disaster, check papers in the affected area and the person’s former hometown for casualty and missing-person lists, hospital admissions, relief reports, funerals and accounts of survivors. Pair a surname with a period address, employer, neighborhood or relative. Browse with event and status terms such as *reported missing* and *among the injured*, then track subsequent reports before recording a death. [S34], [S35]","sources":["S34","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-36","kind":"portal-availability","anchor":"On Ancestry, use the places and dates from the deceased person’s timeline to choose a Newspapers.com Stories and Events collection for local news and society items, where the collection covers those places. Build or refine that timeline from the dedicated newspaper birth, marriage and obituary indexes where available. When a story points to a life event, search the corresponding event index and follow the result to its issue. [S27 @2026-11-22], [S53 @2026-11-22]","sources":["S27","S53"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-37","kind":"portal-availability","anchor":"For an indexed route to the *Pilot* ads, consult *Boston Pilot: Irish Immigrant Advertisements (Search for Missing Friends), 1831–1920* at American Ancestors. [S54 @2026-11-22] Look for the compiled advertisements by title, according to the presenter’s guidance. [S28† @2026-11-22]","sources":["S54","S28"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-38","kind":"method","anchor":"For a market gardener, compare relocation notices and dated seed price lists, including winter issues when tracking fresh produce. Keep the goods advertised and selling location with each notice and record a residence only when the wording identifies it as such. [S55]","sources":["S55"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-39","kind":"method","anchor":"If the estate inventory notice leads to no will notice, search retrospective profiles for reported bequests and burial instructions. Use the details as leads to the will and attribute them to the profile until you have the document. [S56]","sources":["S56"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-40","kind":"method","anchor":"When advertisements place a product in local shops and you need to identify its maker, search exhibition prize lists for an exhibitor expressly credited with producing it. Record the retail offer and the maker attribution separately. [S57]","sources":["S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-41","kind":"method","anchor":"If the issue containing a disputed report is missing, search surviving issues of the same title for a published reply. Cite the reply for the topic it addresses and leave the missing report’s wording and treatment unresolved. [S58]","sources":["S58"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-42","kind":"method","anchor":"Follow a serial’s title or continuation heading through later issues even when the next issue has no installment. Check each installment’s page afresh and cite it with its own issue date and page. [S59]","sources":["S59"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-43","kind":"method","anchor":"If a serial is absent from issue scans, check press histories for how the installments were distributed. According to the author’s reading of a contemporary description, installments that accompanied a paper can be a lead to separately issued sheets. [S60†] Search for the supplement as its own catalogue item and check physical holdings for separate sheets. [S61], [S62]","sources":["S60","S61","S62"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-44","kind":"method","anchor":"For a striking report in a nineteenth-century Finnish issue around April 1, search subsequent issues for an explanation or reveal before entering the event. Check whether other titles credited the same story. On April 1, 1899, *Tampereen Uutiset* ran both an advertisement and a news item for the same fictitious animal show. [S63], [S64]","sources":["S63","S64"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-45","kind":"method","anchor":"If a historical Finnish auction or magistrate’s notice is missing from the paper, check whether the local title was publishing at the time. Search retrospective articles by town, notice type and terms such as *rumpali* (drummer) or *kuulutus* (proclamation) for accounts of street-corner announcements. Look for wording preserved in the later account. Date the notice separately from the account and record who drummed and who read the notice when the account distinguishes them. A 1919 recollection describes Kuopio auctions announced by a drummer and recalls that city notices did not appear in *Tapio*. [S65]","sources":["S65"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-46","kind":"method","anchor":"For a wanted notice in historical Finland, look for printed provincial proclamations alongside newspaper notices. Use the issuing province and date to locate the proclamation. Use any stated birthplace and approximate age to narrow candidates. Record build, hair and clothing at escape separately from earlier service details such as rank and regiment. [S66], [S67]","sources":["S66","S67"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-47","kind":"method","anchor":"For a historical Finnish missing-person notice, record the reported disappearance and any date it gives, according to the author’s distinction between a disappearance and a declaration of death. [S68†] Look for the declaration in the court records for the person’s last Finnish domicile. Record the date of the decision and the death date it assigns separately from the disappearance. [S69]","sources":["S68","S69"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-48","kind":"platform-ui","anchor":"If Smart Search is available in your Elephind session, ask a full question using the historical locality, period and topic, according to the tutorial’s guidance. [S70† @2026-11-23] Try modern terms to discover the language used in the articles, then rerun the search in keyword mode with those period terms. [S71 @2026-11-23]","sources":["S70","S71"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-49","kind":"custody","anchor":"For a writer in the Finnish-American press, identify the title and target years from the writer’s timeline. Check both the digitized periodicals and the microfilm title list in the National Library of Finland’s Finnish American Collection. For issues listed on film, use the on-site microfilms in the North Reading Room. [S72 @2026-11-23], [S73 @2026-11-23], [S74 @2026-11-23]","sources":["S72","S73","S74"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-50","kind":"platform-ui","anchor":"For eighteenth-century Finnish events or shipping that might have been reported in Denmark, search the text of Danish newspapers in Mediestream. [S76 @2026-11-23], [S77 @2026-11-23] Start with *Finland* and, for shipping, run separate queries for the coastal towns or ports on the route, according to the author’s suggestion. [S75† @2026-11-23]","sources":["S76","S77","S75"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-51","kind":"method","anchor":"For a historical Finnish conscript, search papers from the battalion’s town for reports of desertion proceedings. Extract the reserve company and post held before the incident. Record any later confinement sentence and loss of rank as separate disciplinary outcomes. [S78]","sources":["S78"],"checked":null,"stated_as":"fact","review":"reviewed"}
