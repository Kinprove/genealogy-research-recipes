claims:
  - {"id":"C-c08ecdc2dba5","kind":"unclassified","anchor":"An index hit under a familiar name is not yet the right immigrant. A town in a manifest can be a\nbirthplace, last residence, relative's address or destination. Copying any one of those into a\nbirthplace field sends the next search to the wrong records. Preserve the wording and field role\nuntil the movement and locality evidence resolve them. [S1–S4, H1]","sources":["S1","S2","S3","S4","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d27b17f13bfd","kind":"unclassified","anchor":"Start in the documented destination household. Extract dated appearances from censuses, vital\nrecords, directories, naturalization papers and children's records. Separate an event date from\nthe later record's reporting date. A child born abroad is a lead to family movement, not proof that\nevery household member traveled together. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1526b78e63cf","kind":"unclassified","anchor":"A destination census or similar later record that reports “Germany” or “England” for a Russian\nEmpire family may reflect the port the informant named, such as Hamburg or Liverpool, rather than\nbirthplace or nationality. Record the country as written, with its informant and record role. Test\nit against the arrival record's embarkation and last-residence fields before sending any search to\nthat country. [James Tanner's talk](https://www.youtube.com/watch?v=wUyse0sA2cU) motivates this\ncheck as a general warning about nineteenth-century enumeration. It gives no rule for a particular\ncensus and does not make every such entry a port.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9c544e2e1afc","kind":"unclassified","anchor":"A German-speaking household recorded as born in “Germany” may instead come from the Russian Empire's\nGerman colonies, for example in Bessarabia. Compare the birthplace across every census year and the\nmanifest's origin field before searching German emigration sources. A later census or manifest\norigin that reads “Russia” is a reason to add a colony candidate; a reported miss in German\nemigration lists is not. In the\n[Bessarabian-colonist case](https://forum.ahnenforschung.net/forum/thread/3013995/),\nthe manifest that was found had sailed from Bremen, and the colony marriage and manifest were linked\nonly by names, ages and a child. Treat such a link as a candidate to test. It does not settle the\nfamily's earlier German origin.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-39d9ccb2def2","kind":"unclassified","anchor":"If the family moved in the 1939–1945 resettlement of ethnic Germans from the USSR, interwar\nPoland and Volhynia, Bessarabia or the Baltic states, check the naturalisation and resettlement\nfiles of the Einwandererzentralstelle (EWZ). [H9, H12] The originals are at the Bundesarchiv as\nR 69 (Einwandererzentralstelle Litzmannstadt). [H10] NARA holds a copy as Microfilm Publication\nA3342 in Record Group 242; its films are not digitised, and searches go through NARA College\nPark. [H11] FamilySearch holds only part of the series on film. [H12] Consult these copies before\nwriting to Germany. A Bundesarchiv request needs a signed application (Benutzungsantrag), which\nthe user signs and sends by post or as a scan by email. [H9]","sources":["H9","H12","H10","H11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-120f8e679090","kind":"unclassified","anchor":"Make one chronology row per reported or documented movement. Preserve every reported immigration\nyear with its source, then identify the interval supported by the dated appearances. Keep conflicting\narrival dates visible. A later return, a child's separate arrival and an onward crossing are separate\nevents, not corrections to one universal immigration date. [S1, S5]","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6fb93b96abb5","kind":"unclassified","anchor":"A destination marriage can exist as several separately filed records: an application, a licence, a\ncertificate or return, a county or state copy, and a religious record. Each was made for a\ndifferent purpose and can carry different fields. Retrieve every component the jurisdiction created\nbefore concluding that the marriage gives no origin. In the\n[village-finding interview](https://www.youtube.com/watch?v=RKqz2lXQU7w), the interviewee describes\na New York City licence application that asked for the couple's and parents' birthplaces. The\ninterviewee puts it at about 1908–1937 without certainty, so confirm the jurisdiction's actual\nseries and coverage before relying on those years.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6d8ba1d415ac","kind":"unclassified","anchor":"For a U.S. citizenship clue, find the issuing court and retrieve the declaration and petition, plus\nattached arrival evidence when present. The stages can be in different courts. Before September 27,\n1906, municipal, county, state and federal courts could naturalize; a NARA miss does not exhaust\nlocal court holdings. Later records also require checking the actual court and repository. [H2]\nDo not expect every emigrant, wife or child to have a separate naturalization packet.","sources":["H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-421d5c8e5e62","kind":"unclassified","anchor":"When a declaration of intention bears the emigrant's signature in Yiddish or another non-Latin\nscript, record it as a separate, self-written name observation. Have it read independently, log\nevery proposed reading and any illegible portion, and add the readings to the name-variant searches\nfor origin-side records. The\n[GeneaVlogger's great-grandfather case](https://www.youtube.com/watch?v=2YLat4WuFKY) and the\n[later recap](https://www.youtube.com/watch?v=2h6zplRuD28) motivate this step: a crowd reading\nproduced a surname different from the family's American surname, with an uncertain ending. A\nsignature reading is a search key. It does not prove the name used in origin records.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd49e94df9d8","kind":"unclassified","anchor":"Use a collection for the plausible arrival port and period. Check its description and gaps before\nadding more name filters. U.S. passenger records are arranged by arrival port; New York is one\nroute, not the default for every Russian Empire emigrant. [H1]","sources":["H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-78f5c4bca62e","kind":"unclassified","anchor":"1. Search the documented name variants with the chronology's date interval. Leave an uncertain\n   birthplace or nationality filter off the initial searches.\n2. Search a spouse, child or documented fellow traveler using their own recorded variants. A\n   community case recovered the family list through a child's alternative spelling. [S3]\n   Use [beider-given-name-variants.md](../../genealogy-research-recipes/recipes/beider-given-name-variants.md)\n   for supported Jewish given-name variants; keep generated guesses separate.\n3. If the database supports it, search the known U.S. contact's name or address. Otherwise inspect\n   that contact's appearances in candidate manifests manually. The contact can locate the traveler\n   without being a passenger on that voyage. [S7]\n4. Try another index of the same collection and compare the images. A new provider's hit does not\n   make a second independent record. If a ship/date is known, browse its arrival list and relevant\n   passenger sections rather than repeating the same failed name query. [S2, S4]\n5. If the arrival record or a family account names Hamburg as the port of departure, search the\n   Hamburg emigrant lists. They cover 1850–1934 with a gap for 1915–1919, and have separate\n   direct and indirect lists for 1854–1910. Most give the last place of residence, which can name\n   the town that a manifest gives only as \"Russia\". Ancestry has a partial index. [H14, H15] For other\n   ports and for pairing a departure list with its arrival, use\n   [U.S. immigration search recovery, workflow 5](usa-immigration-search-recovery.md#5-recover-an-arrival-through-the-departure-list).","sources":["S3","S7","S2","S4","H14","H15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-57580f28022a","kind":"unclassified","anchor":"For a Canadian route, distinguish **arrival in Canada** from **admission to the United States**.\nFollow a U.S. border index/card's ship, port, date and record references to the linked manifest;\n“St. Albans” can describe the record system rather than the traveler's crossing town. U.S.-bound\npassenger lists made at Canadian seaports omit passengers who declared a Canadian destination. [H3]\nConsult Library and Archives Canada's matching port/year records as well. When a 1919–1924\narrival involved Canadian immigration or a stay beyond direct U.S. transit, include LAC's Form 30A\nbranch; absence from its ordinary passenger-name index does not exhaust that record type.\nPassengers in transit directly to the United States were not required to complete Form 30A:\nprioritize U.S. Canadian-seaport/border records and do not treat a missing form by itself as a\nrecord gap. [H3, H4, H7]","sources":["H3","H4","H7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-458c04d00c37","kind":"unclassified","anchor":"For an emigrant who settled in Canada, also search LAC's *Immigrants from the Russian Empire,\n1898–1922*. It indexes by name the Passport and Identity Papers files of the Russian consulates\nin Montréal, Vancouver and Halifax (Likacheff-Ragosine-Mathers collection), with filters for\nbirth year and religion. Only that series is digitised, so a miss there does not cover the\ncollection's other files, which LAC holds on microfilm. [H8] On Doukhobor ship lists (arrivals\n1898–99, 1902–06, 1909–14 and 1925–32), a patronymic or family nickname was sometimes recorded\ninstead of the official surname, so add patronymic-as-surname and nickname search lanes.\n[S18]","sources":["H8","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-84e0c6fbd8fc","kind":"unclassified","anchor":"Save the full image, ship header and any continuation page required by the form. On a two-page\nmanifest, pair the correct halves by heading, passenger line number and surrounding names; the\nnext displayed image is not sufficient evidence that the halves belong together. Look for linked\ndetention or special-inquiry lists and preserve the passenger reference. Forms and passenger\nclasses differ, so transcribe the headings actually present. [S1, S2, H5]","sources":["S1","S2","H5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e295e024db9f","kind":"unclassified","anchor":"Keep both the index spelling and your reading of the image. Preserve uncertain letters and line\nreferences. Read the birthplace, last residence, citizenship/nationality, relative left behind and\ndestination contact as distinct fields. A port of embarkation is another field; it does not identify\nthe birth town. [S1, S2, H1]","sources":["S1","S2","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-305d29090ef8","kind":"unclassified","anchor":"Transcribe annotations before interpreting them. Consult Marian L. Smith's annotation guide for\nthe marking's position and form, including cross-references, detention and special inquiry. A\ncrossed-out line or inspection entry alone does not establish admission, deportation or a name\nchange. If the outcome record is missing, record `outcome unresolved`. [H5]","sources":["H5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a8a29f74202b","kind":"unclassified","anchor":"Make separate worklist rows for the relative or friend left behind and the person being joined.\nRecord the relationship exactly as written. Search the destination contact's household, address\nand citizenship records for origin clues. Search later-arriving relatives and fellow travelers for\nclearer locality wording, using the chronology to test whether they belong to the same family\nnetwork. [S1, S3, S4]","sources":["S1","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-836ee728195e","kind":"unclassified","anchor":"When records turn up several people with the destination contact's name, give each namesake a\nseparate row: birth, arrival and naturalization data, plus the dated addresses from censuses and\ncitizenship papers. Before linking any of them to the traveler, compare each dated address with the\nmanifest's contact address. A\n[contact-namesake discussion](https://forum.ahnenforschung.net/forum/thread/185403/)\nshows this check. The candidates' 1925 and 1930 census addresses did not quite match the manifest\naddress, and one candidate's naturalization address was only nearby. A nearby street or a similar\nyear narrows the field but does not identify the contact. The link to the traveler's home district\nstill has to be tested.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-769ecde7968b","kind":"unclassified","anchor":"Only after the target's own, family and contact records give no usable origin, and when the surname\nis genuinely rare, build a separate surname survey as a lead list. Record each passenger-list or\nother origin-bearing entry for the surname with its stated place, place role, date and locator.\nClusters become candidates for the competing-locality table. The\n[Genealogy Gems planning episode](https://www.youtube.com/watch?v=3y1JkCoCpyU) and its\n[repeat](https://www.youtube.com/watch?v=VWxN39TRlMk) motivate the survey. Neither measures how\nrare a surname is or establishes kinship; a shared surname only guides the next search and never\nsubstitutes for the record that distinguishes the possibilities.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb5aeaf2e1c6","kind":"unclassified","anchor":"If a relative may have prepaid the passage, look for passage-ticket records such as immigrant-bank\nledgers (e.g. Blitzstein), and open the original entry rather than stopping at an index. Extract\nthe date, passenger, the passenger's origin address, route and line, then add the purchaser's name\nand address as its own contact row. A purchaser recorded under a different surname can be a lead\nlinking pre-migration and American names; test it by comparing addresses with other records. In the\nGeneaVlogger's [ledger walkthrough](https://www.youtube.com/watch?v=pVfGwY6uBHU) and\n[surname case](https://www.youtube.com/watch?v=VQgE0u9SGSU), the presenter is unsure of some\ncolumns and of the holding repository. The ledger does not state the payer's relationship, and the\npresenter calls the match strong but not confirmed.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c18d3a432597","kind":"unclassified","anchor":"If money was sent between the emigrant and relatives back home, search the surname in the documents\nof Russian consulates in the USA, for example by asking in the J-Roots forum's index topic for them. A\n[consular-records reply](https://forum.j-roots.info/viewtopic.php?f=75&t=7576) says hits can be\nviewed through FamilySearch, and the poster found documents on an undelivered money transfer and\nrefund that way. The reply gives no period, coverage, finding aid or field list. Record any named\nperson and place as written, as an unverified contact lead, and do not treat a miss as a negative\nsearch.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-989aff6ec2de","kind":"unclassified","anchor":"List plausible towns for the raw place string. Separate candidates by coordinates, dated\njurisdiction and nearby places. “Russia” or “Poland” can be the jurisdiction reported at the event\nor reporting date; resolve the locality before selecting a modern country's archive. For Jewish\nlocalities, the JewishGen Communities Database supplies historical names/jurisdictions, including\nYiddish variants. Its omission of a village does not show that no Jews lived there; use its Gazetteer\nand relevant historical gazetteers/maps for additional candidates. [S6, H6] For a Bessarabian\norigin, take the state and district of the event date from\n[Route a Bessarabian or Moldovan record by date, district and bank of the Dniester](bessarabia-moldova-record-routing.md).","sources":["S6","H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc60cae5a4ec","kind":"unclassified","anchor":"When a place string on a passenger list cannot be identified, compare its doubtful letters with the\nsame letter groups in other words on the page. Then test\nwhether the string is a German transcription of a Slavic name (for example, Sch for Ш) and enter\neach resulting candidate in the competing-locality table. In a\n[manifest place-reading discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667), one\nparticipant read an unrecognised name as Schomer, comparing the same letter group elsewhere on the page, and\nparticipants considered Zhitomir. The thread shows no confirming record, so a reconstructed reading\nstays a candidate and is not the locality.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e48e45f578e","kind":"unclassified","anchor":"A place name that matches a guberniya or a major city can be a province-level or nearby-city answer\nrather than the town of origin. Before entering Kovno, Vilna, Warsaw or a similar name as a town\ncandidate, add a second row that reads it as the province or as a stand-in for a nearby locality,\nand look for a record that names a smaller place. The\n[Lithuanian genealogy talk](https://www.youtube.com/watch?v=mXVe1M5AibY) and the\n[village-finding interview](https://www.youtube.com/watch?v=RKqz2lXQU7w) motivate this check.\nNeither shows which reading applies to a given record, and the talk's generalization about who\nlived in cities does not decide between them.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-af590b78e2a2","kind":"unclassified","anchor":"When the emigrant may have left while charged or sought by the authorities, search pre-1917\nRussian-language newspapers for court search notices. Include the provincial *gubernskie\nvedomosti*, which printed official search notices. [H13] Search under the Russian name form with\npatronymic. Such a notice can name the issuing court, the person's estate (*soslovie*) and town of\nregistration, and the article charged. Enter that town as a registration-society row in the\ncompeting-locality table, not as a birthplace. Use the court and case details to look for the case\nfile, and search the town's metrical books for siblings. In\n[*Finding Your Roots* (PBS, season 10, episode 9)](https://www.pbs.org/video/michael-douglas-unravels-his-familys-secret-past),\na 1906 Mogilev District Court notice described the man sought as a townsperson of Chausy and gave\nthe article he was charged under. A notice matched on name and patronymic is a candidate to test\nagainst the chronology. It does not identify the emigrant. [S19]","sources":["H13","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1a1880aaebdd","kind":"custody","anchor":"For an emigrant who settled in Mandatory Palestine, look for a British Mandate naturalization\n(citizenship) application. A 2023 MyHeritage Wiki article reports that the Israel State Archives\nholds more than 60,000 of them, has scanned them all onto its website and fully indexed many, that\nthe collection is incomplete, and that many forms were also filled in Hebrew [H16 @2026-11-08]; a\n2017 Times of Israel report dates the applications 1937–1947 [H17 @2026-11-08]. The Israel State\nArchives' online catalogue refused an automated fetch with HTTP 403 [H18† @2026-11-08]: open it in\nthe user's browser, and search Hebrew-script as well as Latin-script name forms before reading a\nmiss as a negative.","sources":["H16","H17","H18"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
