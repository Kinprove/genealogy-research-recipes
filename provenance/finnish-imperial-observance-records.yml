claims:
  - {"id":"C-start-with-the-words-town-and-date-1","kind":"method","anchor":"When the account gives a name or a date without an occasion, check the imperial family’s birthdays and name days in the contemporary almanac or state calendar. Use the account’s own time clues to choose among possibilities, then check a dated local report for the stated occasion. Keep a coming-of-age service separate from the birthday on the calendar. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-distinguish-the-proclamation-from-instructions-for-a-service-2","kind":"method","anchor":"Check the imperial manifesto for what was announced. For instructions to a Lutheran congregation, use the cathedral chapter’s circulars for the diocese and year, including the Turku B III series as a finding route and the separate Porvoo chapter papers. Carry the date, volume or circular number into the search. A proclamation alone leaves its reading in the parish or the holding of a service unproven. [S1] [S3] [S6]","sources":["S1","S3","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-distinguish-the-proclamation-from-instructions-for-a-service-3","kind":"method","anchor":"When an imperial anniversary and news of a war or dynastic event fall close together, identify the stated reason for the service in its own circular or report and the occasion for accompanying festivities separately. Search by issue date for the local report corresponding to the circular. Use the printed volume and circular number as finding clues until the original wording is seen. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-verify-what-happened-in-each-place-4","kind":"portal-availability","anchor":"Use the National Library of Finland’s digitized newspapers to search each town’s own title and nearby issues. Record the reported local observance date separately from the issue date, and compare towns before assigning a date to another locality. [S1 @2026-11-22] [S5 @2026-11-22]","sources":["S1","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-verify-what-happened-in-each-place-5","kind":"portal-availability","anchor":"For 1830s Helsinki, check the dated entries in the SLS edition of Zacharias Topelius’s Dagböcker. For any diarist, check whether the writer was in town and what they say they personally saw or heard. Check the local newspapers before letting silence in a diary stand for silence in the town. [S1 @2026-11-22] [S4 @2026-11-22]","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
