claims:
  - {"id":"C-c89bcd81f5f0","kind":"method","anchor":"Identify the farm by historical province, parish, village and farm number. In the supplemented 1875 and 1905 *maakirjat*, check *muistiinpanoja* or *anteckningar* for the purchase date. If those books do not give the date, bracket the change in the *henkikirjat* or browse the province’s lists of issued grants [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-89d08ceb0bf7","kind":"historical","anchor":"Use the purchase date to pick the granting authority. Under Swedish rule, the Kammarkollegium confirmed the purchase. Under Finnish autonomy, follow the Finnish Senate’s records [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-59a66a8f2145","kind":"method","anchor":"For a Swedish-period purchase, search the Kammarkollegium records by farm and date. If the papers are missing, look for the separately filed first provincial office draft (*konsepti*) described by Kyläkoski [S1]. The 1802 fire destroyed many Finland-related papers [S2]. Use the draft register to locate the draft and record which form you actually inspected [S1].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-558225a8261e","kind":"custody","anchor":"In the Finnish National Archives’ Senate hereditary-purchase collection, use the province and year in series Ba, the lists of issued grants. For 1809–1859 dossiers, get the general correspondence diary number from the Bc dispatch lists where they cover the date, or look in the registrar’s correspondence diaries or the Finance Department’s diaries. Follow that number to the Senate registrar’s correspondence files. For 1860–1862, use the province and grant date to browse a covering grant-copy volume in series D. From 1863, use the grant number in Ba to find the grant copy in D. For 1860–1928 dossiers, take the case diary number from the end of the grant copy and use the province, year and number to find the unit in series Ea of archive list 417. If the copy or number remains unavailable, record the dossier locator as unresolved [S2 @2026-11-23].","sources":["S2"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-58fb19645489","kind":"method","anchor":"Extract the applicant, farm, payment date, decision and grant date from the documents that state each one. The application, receipt and grant can describe different stages of the same purchase [S2]. Use [place-name resolution](historical-place-name-resolution.md) for a disputed farm, [tax-roll observations](tax-roll-observation-workflow.md) for the occupancy sequence and [deed interpretation](deed-content-relationship-clues.md) for later transfers.","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
