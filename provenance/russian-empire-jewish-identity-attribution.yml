claims:
  - {"id":"C-b890755d922c","kind":"unclassified","anchor":"When a Jewish person from the Pale, Lithuania, Belarus, Ukraine, Latgale (the part of today's Latvia in Vitebsk guberniya, inside the Pale) or Congress Poland turns up under a given name, patronymic or surname that fits neither candidate branch — or fits the wrong one — decide which branch (if either) they belong to: which record features and household-structure signals actually discriminate, in what order to check them, which naming and re-registration mechanisms must be carried as explicit competing hypotheses, and what DNA can still contribute when the tree carries endogamy plus repeated pedigree collapse. The statutory dates cited below are the Russian imperial regime of the Pale guberniyas; Congress Poland kept its own civil-status registration and surname chronology, and Courland and Bessarabia have their own — confirm the jurisdiction before applying a date. Courland and Livland, including Riga, lay outside the Pale: from 1835 Courland allowed residence to Jews already registered there by the revision and to those with a general right of residence anywhere, and Livland allowed residence in Riga and Shlok ([Brockhaus-Efron Jewish Encyclopedia: Courland](https://ru.wikisource.org/wiki/ЕЭБЕ/Курляндия), [Livland](https://ru.wikisource.org/wiki/ЕЭБЕ/Лифляндская_губерния)).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-572d8fbe5993","kind":"method","anchor":"- **Which link is actually in doubt.** Father, mother, both, or the person's identity itself — and, given the dates, which mechanisms are even *possible* (a recruit substitution needs a levy in range; a stepchild needs a prior marriage or widowhood). The model will happily weigh mechanisms the chronology already excludes.\n- **The registration geography.** Deciding which мещанское/купеческое society the family was ascribed to — from a later document that states it (a metrical entry's estate phrase \"Сорокский мещанин,\" the 1897 census приписка column, a passport or причисление file) — is a research decision the model cannot make from a place of residence. The сословие marker and место приписки are hard identity discriminators, and a repeated name down a pedigree is a namesake before it is a match. Read the estate label with [estate registration status](russian-estate-registration-status.md) and test same-name candidates with [evidence, proof and working hypotheses](evidence-proof-judgment.md).\n- **More documents that state the society, and a test for reading it.** Melamed-certificate files list applicants as 'X-ский мещанин' working in another town. District files of the same kind give each teacher's age, appearance and приписка [N5]. Vitebsk provincial-board lists of Jews in rural settlements (1882, 1894) give estate and society, household, village, the date residence began, previous place and occupation [N24]. Keep приписка and residence or workplace as separate fields, and read 'прибыл из' as the previous place, not the birthplace. A мещанское общество belonged to a town or mestechko, never to a village. So for a hard-to-read adjective, discard gazetteer matches that are only villages [N2]. This rules candidates out; it does not identify one. Limits: the posters did not see family composition in the licensing files they read, the forum's lists are transcriptions, and the rural series is shown for one guberniya only.\n- **A change of estate.** Follow the treasury-chamber transfer file and the annual merchant lists in both towns. One reported transfer into the merchants of a new town was absent from its subsequent merchant lists [N2]. Consider cessation of dues and reversion to the former estate, leaving the date and any actual move open until documented.\n- **The mechanism verdict.** Which competing re-registration story survives the record features. The model ranks stories by narrative fit; you rank them by which falsifier you actually found.\n- **The \"differs / does not differ\" call for every DNA tester** and the decision to stop asking DNA when nothing differs.\n- **The sufficiency ruling on an absence** — whether the list *should* have contained the person (registered there, taxable, not in service, not converted) before absence carries weight.","sources":["N5","N24","N2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2e976c215662","kind":"method","anchor":"- **Judging kinship by surname alone.** Test surname adoption through marriage, changes at re-registration and a household using the maternal grandfather’s name [N1], [N2]. Also test unrelated households using the same occupational or patronymic-derived surname [N15]. A motive such as avoiding the levy needs its own evidence.\n- **Parsing the wrong name field.** Read the column heading and the original-language wording. In a reported household, reading «Шлема Ицка» as one man’s double name resolved an apparent conflict over a nephew [N2]. Test a mother’s patronymic before entering it as a maiden surname, and compare spellings across records before splitting or combining identities [N2], [N4], [N7], [N16].\n- **Vital-record fallacy.** Treats a revision or family list as a residence census and a birth register: absence = death or non-existence; presence = residence; listed age = birth year; missing women = dead or unmarried (early revisions and specific men-only lists — an 1874 \"male part of the family\" list, an 1875 town list — omit them by design; the standard 1874 family-list form has a female section, so know which form you hold; and girls' births often went unregistered in the first place — see [Jewish metrical books and rabbinates](russian-empire-jewish-metrical-book-recovery.md#2-build-a-dated-table-of-candidate-rabbinates-for-the-event-year)). (J-Roots 4667, 1202; Древо Жизни 3802; GeneaVlogger Tolchin live)\n- **Ignoring the cross-reference machinery.** Never asks for the previous household number, the age-at-last-revision column, the \"выбыло\" reason, the additional lists, or the levy number — the columns that carry identity when names do not. (GeneaVlogger revision-list streams; J-Roots 4667)\n- **Foster and adoptive names.** Record «сын», «приёмыш» and «воспитанник» as written. Test the relationship with the birth and marriage entries and any formal adoption file. A reported Ural marriage preserved the birth surname and patronymic of a woman otherwise recorded under her foster father’s names [N9].\n- **Correction formula read as an alias.** In a revision list, 'A, по ошибке (по росписи) написанный B' records that the entry was first written for B and then corrected to A. Register A. Keep B as a discarded reading, possibly another man's name copied in by mistake, and not as an alias or a double name. A [correction-formula discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) reads many such corrections in one volume as a sign of a later fair copy; that is a hypothesis. Whether the patronymic belongs to A must come from the household chain.\n- **Title inflation.** Expands 'р.' or 'реб' before a man's name as 'rabbi', when it is usually the courtesy title 'reb' (roughly 'Mr'). It also repeats a family story's 'chief rabbi' as fact. A [family-title discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) advises doubting both words of such a claim. Do not use a rabbinical title to support the son-in-law-took-the-surname mechanism until a record states the office. This is one member's account of usage; it does not rule out that a given man was a rabbi.\n- **Inferring a motive from a name.** Compare clerical error, a double name, a household name and a change at re-registration. For a levy explanation, establish the year and eligibility and seek a recruit or transfer file [N2], [N10].\n- **Autosomal branch-picking under collapse.** Reads \"more cM with branch A's descendants\" as \"belongs to A\"; adds path averages; reports a confident placement with a number attached; never asks whether any observation predicts differently under the two hypotheses. (see the DNA section; mechanics routed to the sibling recipes)\n- **Y/surname mismatch = NPE.** Under a documented surname split within one patriline, a Y match across two surnames is the *expected* outcome, not a contradiction. (routed to [Y-DNA and mtDNA](ydna-mtdna-interpretation.md))\n- **Restricting the search to the home books.** Separate residence, registration and event place. A couple ascribed to Shklov and Mogilev reportedly married in Smolensk [N3]. Check the [bride’s community](jewishgen-search-family-reconstruction.md#a-daughters-married-household-when-neither-husband-nor-married-surname-is-known) and other places linked to the couple before drawing an inference from a missing marriage.","sources":["N1","N2","N15","N4","N7","N16","N9","N10","N3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f42b6aff026a","kind":"method","anchor":"Compare each part of the Russian entry with its Hebrew equivalent. In one reported reading, the Hebrew separated the town of origin from the groom’s surname; the source image was unavailable [N2]. Check the children’s entries and the annual alphabetical index (алфавит) for an «он же» alias. Search both surnames without assuming which was primary.\n3. **Establish the приписка, then work in *that* society's lists.** Start from the latest document that states the estate and society and only then go back into the nineteenth century. Family lists (посемейные списки) were compiled only for families ascribed to that society; a Mogilev list even had a separate section for \"Jews living outside Mogilev province, ascribed to the Mogilev town society.\" (J-Roots 36)","sources":["N2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a3f31f2ca06f","kind":"method","anchor":"In a reported 1917 Kiev birth entry, «гражданин города X» supplied a town to investigate for registration [N4]. Test it against earlier estate wording such as «X-ский мещанин». Record studio, residence and registration towns separately. Check the named society’s surviving books before concluding the person was ascribed there.","sources":["N4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-22c034300cc0","kind":"unclassified","anchor":"Before calling a list missing or a person absent, widen the file search and classify each file. A shtetl's Jews may sit in uyezd-wide revision files arranged by estate category, not under the shtetl's name. A [revision-list catalogue discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) calls missing the district-level 1850 and 1858 files a serious methodical error. Jewish мещане are usually filed separately but sometimes sit in combined files titled for Christian мещане, Jews and state people together ([revision-file arrangement](https://forum.j-roots.info/viewtopic.php?f=75&t=7576)). A title such as 'Ревизские сказки 1874' can cover the male-only census, a local additional list, or a register of only those not counted at the previous revision ([file-title discussion](https://forum.j-roots.info/viewtopic.php?f=152&t=36)). Record which town-level and district-level files were read, and what each one is. Limits: these threads show that such files exist, not how common they are or that a given family is in them. Do not date a file from its title alone.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fc7c7f46ee6d","kind":"custody","anchor":"For a Jew living in Tula, the file that tested his right to live there can survive. A Tula researcher describes the State Archive of Tula Oblast's f. 445 (Tula city police administration), op. 4 «Личные дела евреев», as more than 600 personal files in alphabetical order, most with a questionnaire («Еврейский листок») on the estate, arrival, passport, occupation, craft, trade or education documents, family members' ages and, for a soldier, his service and приписка ([Tula police-file post](https://dzen.ru/a/avTRfIGcXEcuF50W) [N31 @2026-11-15]). Check the ground a file documents against the law of its date: Jewish lower ranks on active service had no right of universal residence, and the right was later granted to those who fought in the Far East or served blamelessly in the active army ([Jewish Encyclopedia on military service](https://ru.wikisource.org/wiki/ЕЭБЕ/Военная_служба_в_России) [N32 @2026-11-15]).","sources":["N31","N32"],"checked":"2026-11-15","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7eb266c84a46","kind":"method","anchor":"For someone living outside the Pale while registered elsewhere, look for the stated basis of residence. An entry «в … по паспорту» suggests a passport search; a merchant’s petition, trade document or craft certificate provides a different test. A rabbi reportedly appeared as a baker in official papers [N2]. Check the recorded trade against other evidence of employment and the person’s identifiers. Soviet «служащий» can include private employment and by itself cannot document an imperial state post.\n4. **Chain the household across lists.** Household number this list ↔ former household number ↔ page; age at this revision over age at last revision; the \"по последней ревизии состояло и после оной прибыло\" and \"из того числа выбыло\" columns (умер / отдан в рекруты / в отлучке / перечислен); the additional lists (дополнительные ревизские сказки) for anyone missed in a main revision or transferred in from elsewhere — they continue after the last full revision of 1858 (additional lists of 1864, 1873 and 1874–1890 are cited in the threads); then the 1874–75 male lists with *two* age columns (\"по ревизским сказкам и указам Казённой палаты о причислении и перечислении до 1871 г.\" and \"по наружному виду\"); then the family lists. Compare the previous number and age with the named relatives, page and transfer entries before linking households. Use the number to locate the earlier entry, then compare the people recorded there [N2], [N5], [N14].","sources":["N2","N5","N14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e1a202d7b290","kind":"method","anchor":"Between revisions, look for a town magistrate's register of trade certificates (ведомость о выданных свидетельствах на право торговли), which lists each certificate holder with his household. In one 1825–26 [register of the Chigirin town magistrate](https://commons.wikimedia.org/wiki/File:ДАКО_280-166-7459._1825-1826._Ведомости_Чигиринского_магистрата_и_Черкасской_городской_думы_о_выданых_свидетельствах_на_право_торговли.pdf) (Kiev guberniya), issued to merchants and мещане, each entry gives the holder's number in the 1816 revision or the 1818 additional list. It then names the people 'belonging to his capital': his wife, sons, the sons' wives and children, and daughters, with a wife married since the revision marked 'taken after the revision'. The ages sit in two pairs of male and female columns. One pair copies the age from the 1816 revision or the additional lists; the other gives the age of each child born after the revision. So an age in the first pair is a revision-year age, not the age when the certificate was issued. From the inspected pages, the two generations appear in columns with different date bases: the older son’s 14 belongs to the revision column and his son’s four to the born-after column [N30]. Use such a register like the recruit-turn book in step 8, to carry a household from the 1816 revision towards the next one. Limits: only one spread of one town's file was read, and the register covers only households that took a certificate.","sources":["N30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f352df53c607","kind":"method","anchor":"Read each age with its column heading and entry date. In the discussed 1874–75 male lists, the documentary age can refer to 1858 or a later addition through 1871. A continued family list can date a child’s age to a later marginal addition [N2]. Check the spread, date and relationship label (including «внучка») before assigning the child. The forum’s proposed passport basis for some absence entries needs corroboration.\n5. **Read relation labels against the current head, and watch them drift.** Treat \"племянник\" in a pre-1850 list as \"relative,\" not \"brother's son,\" until the household chain says otherwise; by 1858 the modern meaning is usual. \"При семье брата,\" \"зять,\" \"воспитанник,\" \"приёмный,\" \"приёмыш,\" \"пасынок\" describe the *household*, not descent. A man written \"nephew\" in 1850 as the head's brother's son, whose wife that year carries the head's name as her patronymic, is son-in-law as well as nephew — inside the head's household that patronymic makes her his daughter unless another man of that name can be shown as her father; when he reappears in 1858 as \"зять\" with a wife whose patronymic excludes her being the head's daughter, the label has outlived the marriage that created it. A younger brother listed as head with an older \"brother of the head\" means the father died and headship passed. (J-Roots 4667)\n6. **Test age, sequence and naming fit.** Recheck an unexpected age against the original entry, its heading and its date basis. Seek missing births in other towns and under later registrations. If the household sequence suggests re-registration, seek a recruit file, quittance or причисление/перечисление before adopting that explanation [N2], [N6]. A child’s name may suggest a recently deceased relative; check the proposed relative’s death and branch independently [N1], [N12].","sources":["N2","N6","N1","N12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d2cefde6d506","kind":"method","anchor":"Compare men’s current and previous-revision ages in the appropriate columns. Where the form gives women only a current age, a changed wife’s name and age cannot by themselves establish remarriage. Children of different wives can have the same patronymic. Check the next surviving revision, marriage entries and the children’s metrical records [N2].","sources":["N2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e871f1c05cb7","kind":"method","anchor":"Test 'one or two' with the features that can separate them. Before merging two same-surname households from one place, compare their приписка and the relative age order of siblings who share names. Lists that reverse which sibling is older, or that name different societies, point to two families. A rare surname, one village and repeated names still point to kinship, so keep the families separate but possibly related, and look for a list that carries both. When one father appears under different double-name pairs, check who wrote and certified each entry, the приписка wording and the birth spacing. Different recorders make variants easy to explain. One recorder makes them less likely, but not impossible, since a father may have brought documents with different second names ([household and recorder comparisons](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Limit: these checks shift the odds, not the verdict. Keep both hypotheses until a household or death record separates them.\n7. **Read what the metrical entry records.** In the Pale guberniyas, the 1835 statute made rabbis keep metrical books [N29]. The community elected the rabbi and the provincial authority confirmed the election; the 1857 law concerned eligibility for election [N33]. Congress Poland’s civil-status registers followed a separate regime. Record the parents’ estate and registration society, the mother’s stated patronymic, and the marriage-status wording (девица / разводная / вдова). Test both a widow’s birth and previous married surname. Check the family-held certificate as well as the archival book and any attached later slip. A note on a 1905 Klintsy birth entry reportedly gave a 1917 adoption and changes to all three parts of the name [N2], [N9].","sources":["N29","N33","N2","N9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6c11dcce7d07","kind":"method","anchor":"If a birth entry names only the mother, transcribe any status wording from each language, including an explicit label of illegitimacy. A missing father’s name alone cannot supply that status. Check later marriages, family lists, council documents and any acknowledgement before linking a later paternal surname or patronymic to the child. The forum discusses entries in several forms and does not establish a universal wording or filing place [N2].","sources":["N2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f675f0220a44","kind":"method","anchor":"The wording «возворотил разлученную» prompted a reader to consider a remarriage to the groom’s former wife [N2]. Check the first marriage, divorce, any intervening marriage and its end before creating a second bride or merging the two.\n8. **Pull the recruit and conscription files.** Personal recruit files (личные дела по рекрутскому призыву), recruit family lists (рекрутские посемейные списки — where \"приёмыш\" appears), draft lists and causes \"о причислении к призывному участку.\" The levy is a documented motive for deliberate re-registration, and the exemption claim is where a substitution is written down — but a name in a recruit list may also be a purchased substitute, not kin at all. \"По 95 набору отдан в рекруты\" dates a surrender to 1830 by levy number. (J-Roots 36, 4667, 1107)","sources":["N2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a90aa2045f16","kind":"method","anchor":"Look for a recruit-turn book (очередная книга). A reported 1831 Rogachev town and uezd book lists households in levy order, including women, and points to their 1816 revision and 1818 additional-list numbers [N23]. Follow those references. Verify actual surrender in the recruit record. A petition against a call-up can name other sons and ages; check each against an independent list because the petitioner had an interest in the outcome [N5].","sources":["N23","N5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-596de1f714a5","kind":"method","anchor":"Search the garrison town’s rolls for the soldier’s wife and children, and the treasury-chamber orders and additional town lists for a man released on indefinite furlough. Reported entries supply such identifiers as rank, command, age, patronymic, medal or stripes [N24], [N26]. Compare them with the recruit record; keep an unreadable surname open. A medal alone cannot establish combat, regiment or pre-service origin.\n9. **Only then DNA**, with the prediction table below.","sources":["N24","N26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a307cbdfa234","kind":"unclassified","anchor":"Conversion is not only Orthodox, and its trace runs past 1917. At NIAB, fond 1781 holds individual files titled as a Jew's transfer to Roman Catholicism or baptism. Their titles carry the pre-conversion name and sometimes a second surname ([NIAB fond 1781 file listing](https://forum.j-roots.info/viewtopic.php?f=152&t=36)); record both names as search forms. A Soviet record calling a baptised man 'еврей' does not contradict the baptism: imperial records classified people by confession, Soviet ones by nationality. So match on name, birth year and place, occupation and address ([convert-identity discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Limits: only the file titles were seen, so what the files say about parents or new names is unverified. Do not read the father's death or consent into a patronymic kept at baptism. Whether a Soviet patronymic came from the baptism or from family usage was left open.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ce872fb0e1f0","kind":"unclassified","anchor":"- **Run the sequence in order: parse → приписка → chain → labels → fit → metrics → recruit files → DNA-with-prediction-table.** Skipping to DNA is the tell that the documentary work was not done.\n- **Make the model produce the ledger**: per mechanism, evidence for, evidence against, the settling record, the settling DNA observation, status. A placement without a ledger is a guess.\n- **Read the image, not the index**, for household numbers, the age columns, the \"выбыло\" column and marginalia — indexes drop exactly these (routed to [AI for documentary records](ai-for-documentary-records.md) for the transcription mechanics).\n- **Family lists are layered.** The page runs parents, then children, then other relatives. Children's later spouses and offspring were written into whatever space was free, in small script, so the layers break down. An indexer of these lists reports that published indexes left some insertions wrongly attributed, with substantial errors ([family-list layout note](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Before chaining on an indexed family list, place every inserted person in the household against the image. The source names no specific error, so treat this as a reason to check, not as a known error rate.\n- **Cross-recipe boundaries:** cM inflation, non-additivity, largest-segment triage, multi-path mapping, pedigree-aware family comparison, endogamy segment filters, Ashkenazi reference ranges and genetic pioneers → [AI for DNA research](ai-for-dna-research.md); WATO limits and tester choice under tied hypotheses → [unknown parentage and WATO](unknown-parentage-wato.md); surname/haplogroup contradictions and Y/mt tester selection → [Y-DNA and mtDNA](ydna-mtdna-interpretation.md); X-DNA elimination logic and pile-up regions → [X-DNA and phasing](xdna-phasing-judgment.md); same-name fusion, namesake tests and negative-evidence sufficiency → [evidence, proof and working hypotheses](evidence-proof-judgment.md); estate (сословие) labels as dated registration status → [estate registration status](russian-estate-registration-status.md); JewishGen's Town field as a registration place, double-name search lanes and marriages in the bride's town → [JewishGen search and family reconstruction](jewishgen-search-family-reconstruction.md); given-name variant forms → [Beider given names](beider-given-name-variants.md); unregistered girls and substitutes for a lost metrical book → [Jewish metrical books and rabbinates](russian-empire-jewish-metrical-book-recovery.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-17ecb86caa68","kind":"method","anchor":"1. **Use household records to test what a name means.** The 1804 statute required an inherited or newly adopted family name to be preserved in records [N34]; the 1876 code traces the retention requirement to §16 of the 1835 statute [N35]. In reported 1850 revisions, brothers appear under different surnames, including Факторович and Буряковский [N2]. Treat an «он же» alias, an inherited household name and a surname shared by unrelated families as separate possibilities. A patronymic can use either element of a double name or reverse the order [N1]. Search [both elements and their variants](jewishgen-search-family-reconstruction.md#double-names-and-ambiguous-patronymics). Compare the entry with the names of the father, grandfather, guardian, stepfather and husband, and trace the household before deciding which relationship the wording supports [N1], [N3], [N17].\n2. **Revision lists, family lists and recruit lists are ledgers of *registration* (приписка), updated from the previous ledger.** They record who is *ascribed* to a taxpaying society and what happened to each entry since last time (died, given as recruit, absent, transferred), not who was born, not who lived where. \"Проживать\" and \"быть приписанным\" are, in the archivists' phrase, \"три большие разницы.\" Absence from a list has documented non-death explanations — exemption, registration elsewhere, an additional list, transfer, service, conversion, concealment — and each has to be excluded before absence means anything. (J-Roots 36, 1272; Древо Жизни 3802; Уральская 1206)\n3. **Under endogamy plus pedigree collapse, autosomal DNA separates two branches of one family only where the fully specified pedigrees make the predictions differ for a tester you actually have.** Adjacent-degree distributions overlap; recent collapse across the two branches can make A's descendants B's descendants too; the population layer adds sharing no recent tree explains. So never report a placement from total cM against \"branch A\" versus \"branch B\" descendants. Write the prediction per tester under each hypothesis first. A difference of one expected *degree* inside overlapping total-cM distributions is weak likelihood evidence, usable only through a pedigree-aware model; a *qualitative* difference — recent IBD under one hypothesis and population background under the other, or a resolved uniparental mismatch — can decide. (J-Roots 3733; GeneaVlogger Miglin; Estes 2022; Family Locket Hopper case)","sources":["N34","N35","N2","N1","N3","N17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5c36d62684cf","kind":"method","anchor":"| Mechanism | Biology vs. registration | Record feature that confirms it (a label alone only raises the hypothesis) | DNA observation that differs |\n| --- | --- | --- | --- |\n| **Variant form** — double-name element, Yiddish/Hebrew/Russified form, feminine patronymic, index error | unchanged | intact household chain; same last-revision age; a death or tax entry using the other element of the double name (Хаим = Хайкель) | none — never test |\n| **Head-of-household patronymic** — grandfather, guardian, stepfather or husband written where the father belongs, typically after the father's death or absence | unchanged | the father's \"умер / отдан в рекруты / в отлучке\" precedes the drift; older siblings carry the real patronymic; the name written is the head's | none if the head is the paternal grandfather; if the written name is the *maternal* grandfather, a resolved Y mismatch with that grandfather's patriline excludes \"he really was that man's late son\"; a Y match supports it without proving it |\n| **Heir naming** — a grandson registered with a son-less grandfather's surname and patronymic | unchanged | one sibling differs, the rest do not; the grandfather has no sons | a resolved Y mismatch with the grandfather's patriline excludes \"son of\" and leaves \"named for\"; a match supports the grandfather's patriline — never the man — and excludes the documented father only if his patriline is independently resolved and different (§3); when the two patrilines are kin (a documentary check), Y separates nothing |\n| **Stepchild** (пасынок) — wife's child from a prior marriage under the stepfather's names | father differs, mother same | the mother's earlier marriage or her remarriage entry as вдова/разводная, and the child's birth entry under the first husband; \"приёмыш\" in a recruit family list only raises the hypothesis — also test a child fostered by relatives and seek records of both parents [N5], [N9] | a resolved Y mismatch with the stepfather's patriline excludes \"his son\"; full-vs-half against the stepfather's children (tested siblings only, see §3); mt unchanged |\n| **Fostered child** (воспитанник/приёмный) — child placed with relatives or an unrelated household, for reasons including a parent's death; entered under the foster household's surname with the foster father's name as patronymic, or under his own surname with the label alone (both forms are attested) | identify biological parents and caregivers separately | a parent's death entry near the birth; birth entry under the original parents; \"приёмный\" once in a revision; marriage entry reverting to birth surname and true patronymic | trace each tested line. A paternal uncle normally shares the birth father’s Y line, and a maternal aunt the birth mother’s mtDNA line. Other caregivers can also share a lineage. A well-resolved mismatch can exclude a proposed continuous line; a match cannot identify the parent |\n| **Levy engineering** — boy hidden, age lowered, marked \"в отлучке,\" registered into another household (as its exempt only son, or under its surname), re-registered into another society under a wife's or brother's surname, names altered at surrender | unchanged | levy year + eligible age; no birth entry in the registered household; age off the family's spacing; recruit file / quittance; later \"перечислен\" back; a re-registration file into another society | a resolved Y mismatch with the registered patriline excludes biological sonship to that household (then test the proposed biological patriline); recent IBD at close range with the proposed biological family against background-only sharing with the registered one supports the re-registration — the two households' own kinship and any other path between them set the background the difference must exceed (§3); when the households are patrilineal kin, Y separates nothing |\n| **Son-in-law took the wife's surname** — no sons, or a prestigious rabbinical line | children are the surname family's grandchildren *through the mother* | his marriage entry with the birth surname; his brothers under it; \"зять\" in the wife's father's household | a resolved Y mismatch excludes patrilineal membership in the surname family; marriage and household records, not DNA, establish the surname-taking; autosomal predictions follow from the two explicit pedigrees (his own siblings' descendants are unrelated to the surname line) |\n| **Surname split / double surname** at imposition — brothers fixed under different surnames, or one man \"он же\" | unchanged | same patronymic, same or adjacent household; \"он же\" in a marriage entry | none; a cross-surname Y match is expected |\n| **Conversion** — check the baptismal given name, retained surname or documented change, and re-registration into a Christian society | unchanged | parish book \"принявший православие из евреев\"; a причисление file to the new society; for a serviceman with a changed surname, look for the previous surname and date of change in the service list [N35] | none |\n| **Second unrelated family** with the same (patronymic or occupational) surname in the same town | different people | compare both household chains, registration societies and birthplaces [N7] | a resolved Y mismatch separates them; a Y match at low resolution does not join them — unrelated Ashkenazi families share Y lineages; model any other documented paths before interpreting autosomal sharing |","sources":["N5","N9","N35","N7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3b02a1c9e49c","kind":"method","anchor":"- **Privacy gate:** <!-- privacy-gate: contact --> Asking living descendants of the candidate brothers, whether relatives or matches, to take a DNA test is contact about a DNA question and moves their genetic data; answer the privacy gate in `SKILL.md` before any approach, and stage it through [DNA match outreach staging](dna-match-outreach-staging.md).\n- **Write the prediction table before reading the matches.** For each tester, compare the paths under each candidate brother. Shared ancestors can put the same tester on both sides, and distant Ashkenazi common ancestry adds background sharing [N18], [N19], [N22]. Where the specified pedigrees give different expected cM but their distributions overlap, the difference is weak likelihood evidence for a pedigree-aware model and a reason to test more descendants of the candidate brothers [N20]. Compare the observed sharing against both pedigrees before assigning a branch. See [AI for DNA research](ai-for-dna-research.md) and [unknown parentage and WATO](unknown-parentage-wato.md).\n- **Distinguish recent collapse from population sharing.** Runs of homozygosity require the tester to inherit matching copies through both parents. A clean result leaves collapse within one parent’s pedigree open. List recent shared ancestors and bound the population background separately. With both parents linked, matches assigned to both sides can flag shared population ancestry; no single percentage establishes it [N19], [N22]. See [endogamous match interpretation](ai-for-dna-research.md#endogamous-matches-separate-prioritization-from-ancestral-attribution) and [X-DNA and phasing](xdna-phasing-judgment.md#1--small-segment-false-positive-rates-cite-the-real-divergent-numbers--never-invent-a-round-one).\n- **Ask the questions that stay answerable:**\n  - **Patriline (Y-DNA)** — informative only when the competing mechanisms *differ in the father's patriline* (stepchild, fostering by the mother's kin or strangers, son-in-law surname, substitution into an unrelated household, a second unrelated family, heir naming after a maternal grandfather) and useless when they share it (a paternal grandfather written as father, surname split, conversion, variants). The logic is directional: a mismatch resolved at a level adequate for the two recent lineages *excludes* the hypothesis that shares the patriline; a match *supports* a shared patriline at some depth and never identifies which man. Brothers A and B share a Y: Y can never choose between them. Which testers to recruit and what a match can establish → [Y-DNA and mtDNA](ydna-mtdna-interpretation.md).\n  - **Matriline (mtDNA)** — informative when the mechanisms differ in the *mother* (fostering by the father's kin; child of a first vs. a second wife; a widow's child), with the same directional logic: a resolved mismatch excludes, a match supports and, in a population with few founding maternal lineages, supports weakly.\n  - **Full and half siblings.** Compare the tested siblings themselves by genome-wide IBD state. To place a child with a proposed father, independently establish that the siblings share a mother and that the comparison sibling is the child of that father. Otherwise a half-sibling result can distinguish the two pedigrees only to the extent that their known parentage permits. Even with shared maternity established, different fathers alone do not identify either father. Full siblings are expected to share both copies over about a quarter of the autosomal genome. Half siblings with unrelated non-shared parents ordinarily share no regions identical on both copies through those parents. Related non-shared parents can produce such regions [N22]. With an otherwise unrelated common parent, the expected IBD2 fraction for half siblings is about one eighth when their other parents are full siblings and one thirty-second when their other parents are first cousins. Compare each explicit pedigree with the observed fraction, allowing for variation. For the siblings’ descendants, the full- and half-cousin cM ranges overlap. Where the same observations fit both hypotheses, use several comparisons or a pedigree-aware model [N19], [N20].\n  - **The out-married line** — a descendant of A's wife's family, when she came from another town (the forum's explanation of \"дальний брак\": small communities were all kin within three or four generations), predicts recent sharing under H1 and background-only sharing under H2. She was still Ashkenazi, so the difference is recent IBD versus population background: judge it by segment length, not total, at close range where a long single segment is not background (segment-length filters → [AI for DNA research](ai-for-dna-research.md#endogamous-matches-separate-prioritization-from-ancestral-attribution)). It is one useful class of tester whose prediction differs; any sufficiently close collateral line exclusive to one hypothesis is another. Choose testers by whether their prediction differs, never by their cM. (J-Roots 1107)\n- **If nothing differs, say so.** \"Undecidable by DNA with current testers; a patrilineal descendant of B / a matrilineal descendant of the first wife would decide it\" is a correct verdict. A confident placement is not.","sources":["N18","N19","N22","N20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-88315bc2296d","kind":"method","anchor":"- **A changing patronymic.** In the reported Chernyakhov births, one mother appears without a patronymic, under forms of her father’s double name, and under her grandfather’s name after her father died [N1]. Compare each entry with the original, the husband, the household and the death date. The pattern suggests a household-name substitution; it does not identify who supplied the name or exclude copying.\n- **A relationship label can persist.** A man recorded as nephew and son-in-law in Kolyshki was still called «зять» in a later revision with a different wife [N2]. Compare the wives’ patronymics, household heads and earlier marriages before deriving descent from that label.\n- **A recruit with a different name.** Follow the stated additional-list number to the original and the levy number to the recruit file. In the reported Zhytomyr case, 1816 no. 169 and the 95th levy of 1830 provide separate checks on an abbreviated or substituted name [N2]. The number alone cannot distinguish the two explanations.\n- **Unexplained absence.** Transcribe «в неизвестной отлучке» as the recorded status. Check later lists, employment, marriage, migration and death records before assigning an explanation to an absent daughter [N2].\n- **Date the age column first.** A researcher rejected a three-year-old Meer using an assumed 1889 date; the archivist dated the entry to 1868, yielding an estimated birth around 1865 [N6]. The remaining difference from 1868 still needs the original entry and supporting identifiers.\n- **A label that appears only once.** Check successive revisions and the marriage record for the birth and household names. One Ural researcher reported «приёмный» only once in the revision sequence [N9]. This is a lead from an Orthodox case; check the forms that survive for the target community.\n- **A society elsewhere.** A researcher found Odessa entries for Maidenburgs ascribed to Soroki [N7]. Follow the named society into its own lists and keep the residence in a separate field.\n- **A census birthplace with no revision match.** Check later revisions, the society of registration and any documented exemption. For two families reporting Yaroslavl births, a poster proposed an exemption before the tenth revision had been searched [N11]. Keep that explanation open.\n- **A changing headcount.** A reported 1678 list gave a sexton’s household four sons and its 1680 entry gave seven [N10]. Compare eligibility, ages and omissions before attributing a motive; a later recruit-levy explanation cannot simply be projected onto a seventeenth-century return.","sources":["N1","N2","N6","N9","N7","N11","N10"],"checked":null,"stated_as":"observation","review":"reviewed"}
