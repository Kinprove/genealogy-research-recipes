claims:
  - {"id":"C-b890755d922c","kind":"unclassified","anchor":"When a Jewish person from the Pale, Lithuania, Belarus, Ukraine, Latgale (the part of today's Latvia in Vitebsk guberniya, inside the Pale) or Congress Poland turns up under a given name, patronymic or surname that fits neither candidate branch — or fits the wrong one — decide which branch (if either) they belong to: which record features and household-structure signals actually discriminate, in what order to check them, which naming and re-registration mechanisms must be carried as explicit competing hypotheses, and what DNA can still contribute when the tree carries endogamy plus repeated pedigree collapse. The statutory dates cited below are the Russian imperial regime of the Pale guberniyas; Congress Poland kept its own civil-status registration and surname chronology, and Courland and Bessarabia have their own — confirm the jurisdiction before applying a date. Courland and Livland, including Riga, lay outside the Pale: from 1835 Courland allowed residence to Jews already registered there by the revision and to those with a general right of residence anywhere, and Livland allowed residence in Riga and Shlok ([Brockhaus-Efron Jewish Encyclopedia: Courland](https://ru.wikisource.org/wiki/ЕЭБЕ/Курляндия), [Livland](https://ru.wikisource.org/wiki/ЕЭБЕ/Лифляндская_губерния)).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-572d8fbe5993","kind":"unclassified","anchor":"- **Which link is actually in doubt.** Father, mother, both, or the person's identity itself — and, given the dates, which mechanisms are even *possible* (a recruit substitution needs a levy in range; a stepchild needs a prior marriage or widowhood). The model will happily weigh mechanisms the chronology already excludes.\n- **The registration geography.** Deciding which мещанское/купеческое society the family was ascribed to — from a later document that states it (a metrical entry's estate phrase \"Сорокский мещанин,\" the 1897 census приписка column, a passport or причисление file) — is a research decision the model cannot make from a place of residence. The сословие marker and место приписки are hard identity discriminators, and a repeated name down a pedigree is a namesake before it is a match. Read the estate label with [estate registration status](russian-estate-registration-status.md) and test same-name candidates with [evidence, proof and working hypotheses](evidence-proof-judgment.md).\n- **More documents that state the society, and a test for reading it.** Melamed-certificate files list applicants as 'X-ский мещанин' working in another town. District files of the same kind give each teacher's age, appearance and приписка ([melamed-certificate files](https://forum.j-roots.info/viewtopic.php?f=152&t=36)). Vitebsk provincial-board lists of Jews in rural settlements (1882, 1894) give estate and society, household, village, the date residence began, previous place and occupation ([rural-residence lists](https://forum.j-roots.info/viewtopic.php?f=15&t=64)). Keep приписка and residence or workplace as separate fields, and read 'прибыл из' as the previous place, not the birthplace. A мещанское общество belonged to a town or mestechko, never to a village. So for a hard-to-read adjective, discard gazetteer matches that are only villages ([registration-place discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). This rules candidates out; it does not identify one. Limits: the posters did not see family composition in the licensing files they read, the forum's lists are transcriptions, and the rural series is shown for one guberniya only.\n- **An estate change is not a second man.** A merchant of one town whose child is later written as the child of a мещанин of his old town may have stopped paying guild dues and been returned to his former estate. A [merchant-status discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) gives this reading. A treasury-chamber file confirmed his transfer into another town's merchants, yet that town's merchant lists for following years did not show him. Check the yearly merchant lists and the transfer file before splitting the person or assuming a permanent move. The thread left open when, or whether, he reverted.\n- **The mechanism verdict.** Which competing re-registration story survives the record features. The model ranks stories by narrative fit; you rank them by which falsifier you actually found.\n- **The \"differs / does not differ\" call for every DNA tester** and the decision to stop asking DNA when nothing differs.\n- **The sufficiency ruling on an absence** — whether the list *should* have contained the person (registered there, taxable, not in service, not converted) before absence carries weight.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e976c215662","kind":"unclassified","anchor":"- **Name-polarity error.** Mismatch → \"not kin\"; match → \"kin.\" Reality: brothers under different surnames in one 1850 household (Факторович / Буряковский in a Radomysl-district list; Хабенский / Резник) or across two families of one list (Кикинзун / Говхман, same patronymic); a son-in-law who took a wife's surname; two brothers who re-registered into another society and took a wife's and a brother's surname — \"to dodge the army,\" in the forum's reading; a grandson registered with the *maternal* grandfather's surname and patronymic while his brothers kept the father's; a wife's patronymic silently replaced by her husband's given name for the rest of her life. And the converse: a patronymic-derived surname (Aaronov) or a simple occupational one (Waxer) adopted by several unrelated families in a town of thousands. (J-Roots 4667, 3733; GeneaVlogger Miglin, Tulchyn)\n- **Token mis-parse.** Reads a mother's patronymic as her maiden name (Jewish entries usually give the mother as name + patronymic, no maiden name); reads the second element of a double name as a patronymic (\"Шлема Ицка\" is one man, not Shlema son of Itsko — which turned a \"contradictory\" nephew into an ordinary one); cannot tell whether an unaccompanied \"Шомшонович\" or \"Мориц Пейсах Мошкавич\" is surname / given name / patronymic; merges Гершон with Герш (different names) or splits Люба from Либа (one woman). (J-Roots 4667, 1272, 5084; GeneaVlogger Q&A, Tolchin live)\n- **Vital-record fallacy.** Treats a revision or family list as a residence census and a birth register: absence = death or non-existence; presence = residence; listed age = birth year; missing women = dead or unmarried (early revisions and specific men-only lists — an 1874 \"male part of the family\" list, an 1875 town list — omit them by design; the standard 1874 family-list form has a female section, so know which form you hold; and girls' births often went unregistered in the first place — see [Jewish metrical books and rabbinates](russian-empire-jewish-metrical-book-recovery.md#2-build-a-dated-table-of-candidate-rabbinates-for-the-event-year)). (J-Roots 4667, 1202; Древо Жизни 3802; GeneaVlogger Tolchin live)\n- **Ignoring the cross-reference machinery.** Never asks for the previous household number, the age-at-last-revision column, the \"выбыло\" reason, the additional lists, or the levy number — the columns that carry identity when names do not. (GeneaVlogger revision-list streams; J-Roots 4667)\n- **Label literalism.** Takes \"сын\" as biological, \"усыновление\" as a recorded act, \"приёмыш/воспитанник\" as formal adoption or as a stepchild, and a fostered child's new surname as permanent — when the same person appears under birth and adoptive names in different entries of the same year. Check the marriage entry: in the attested case it was the only record carrying the birth surname and true patronymic. (Уральская 146; J-Roots 4667, 1107)\n- **Correction formula read as an alias.** In a revision list, 'A, по ошибке (по росписи) написанный B' records that the entry was first written for B and then corrected to A. Register A. Keep B as a discarded reading, possibly another man's name copied in by mistake, and not as an alias or a double name. A [correction-formula discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) reads many such corrections in one volume as a sign of a later fair copy; that is a hypothesis. Whether the patronymic belongs to A must come from the household chain.\n- **Title inflation.** Expands 'р.' or 'реб' before a man's name as 'rabbi', when it is usually the courtesy title 'reb' (roughly 'Mr'). It also repeats a family story's 'chief rabbi' as fact. A [family-title discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) advises doubting both words of such a claim. Do not use a rabbinical title to support the son-in-law-took-the-surname mechanism until a record states the office. This is one member's account of usage; it does not rule out that a given man was a rabbi.\n- **Drama over base rate.** Explains a single anomalous line with cantonist substitution when a scribe's line-slip, a double name, or the household head's name is the base-rate cause — or, symmetrically, dismisses levy engineering in a family with an eligible boy in a levy year. (J-Roots 4667; Уральская 1206)\n- **Autosomal branch-picking under collapse.** Reads \"more cM with branch A's descendants\" as \"belongs to A\"; adds path averages; reports a confident placement with a number attached; never asks whether any observation predicts differently under the two hypotheses. (see the DNA section; mechanics routed to the sibling recipes)\n- **Y/surname mismatch = NPE.** Under a documented surname split within one patriline, a Y match across two surnames is the *expected* outcome, not a contradiction. (routed to [Y-DNA and mtDNA](ydna-mtdna-interpretation.md))\n- **Anglo transfer.** \"No death record → still alive,\" \"census = where they lived,\" \"surname = family\" — each false for this system (Odessa Maidenburgs were registered to Soroki). \"The marriage will be in the bride's community\" is the usual case here too (see [JewishGen search and family reconstruction](jewishgen-search-family-reconstruction.md#a-daughters-married-household-when-neither-husband-nor-married-surname-is-known)) but not a rule: a couple registered to Shklov and Mogilev married in Smolensk, so absence from both home books is not evidence. (J-Roots 1107, 1272)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f42b6aff026a","kind":"unclassified","anchor":"Parse against every rendering of the entry, not the Russian line alone. In one bilingual marriage entry, the Hebrew side gave the groom's name, his father's name, the surname and 'from the town of …' as separate parts. It showed that the Russian origin adjective was not his surname and that the apparent patronymic fragment was. The daughter's birth entry agreed. In an 1853 marriage, the yearly alphabetical index (алфавит) gave the bride a second surname as 'он же'. So the supposed second given name of her father was a surname, and both surnames must be searched ([bilingual-entry and index readings](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Limits: the Hebrew reading rests on one member's look at an image the thread does not reproduce, so check the children's entries before reassigning a surname. The index does not tell you which surname was primary.\n3. **Establish the приписка, then work in *that* society's lists.** Start from the latest document that states the estate and society and only then go back into the nineteenth century. Family lists (посемейные списки) were compiled only for families ascribed to that society; a Mogilev list even had a separate section for \"Jews living outside Mogilev province, ascribed to the Mogilev town society.\" (J-Roots 36)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a3f31f2ca06f","kind":"unclassified","anchor":"In 1917 entries, 'гражданин города X' can stand where 'X-ский мещанин' stood months earlier, and it still names the society of registration, not residence. A [1917 registration-wording note](https://forum.j-roots.info/viewtopic.php?f=20&t=5084) used a Kiev birth entry's 'citizen of the town of X' to send the search to that town rather than to a town known only from studio portraits. Search the named town's records first. Limits: the post rests on one entry, does not say how long the wording persisted, and does not show that the named town's books survive.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-22c034300cc0","kind":"unclassified","anchor":"Before calling a list missing or a person absent, widen the file search and classify each file. A shtetl's Jews may sit in uyezd-wide revision files arranged by estate category, not under the shtetl's name. A [revision-list catalogue discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) calls missing the district-level 1850 and 1858 files a serious methodical error. Jewish мещане are usually filed separately but sometimes sit in combined files titled for Christian мещане, Jews and state people together ([revision-file arrangement](https://forum.j-roots.info/viewtopic.php?f=75&t=7576)). A title such as 'Ревизские сказки 1874' can cover the male-only census, a local additional list, or a register of only those not counted at the previous revision ([file-title discussion](https://forum.j-roots.info/viewtopic.php?f=152&t=36)). Record which town-level and district-level files were read, and what each one is. Limits: these threads show that such files exist, not how common they are or that a given family is in them. Do not date a file from its title alone.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7eb266c84a46","kind":"unclassified","anchor":"A man ascribed to a Pale society but found living outside the Pale (an 1874 entry 'в … по паспорту') was there on some legal ground. List the possible grounds as competing hypotheses and look for the file each would leave. Members suggested a merchant's clerk resident on a merchant's petition (the merchant need not be a relative), a temporary merchant, and a guild or non-guild craftsman ([outside-the-Pale residence discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). A recorded craft may be that ground rather than the work done: a melamed was registered as a bookbinder and then a furrier, and a rabbi was entered as a baker ([residence-right discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). So do not reject an identity match, or rank a branch, on such an occupation alone. Do not read a Soviet-era 'служащий' for a pre-1917 father as state service; it may mean private employment. Limits: these are suggestions and family examples from one thread, and many recorded trades were genuine. No fond for such petitions is named.\n4. **Chain the household across lists.** Household number this list ↔ former household number ↔ page; age at this revision over age at last revision; the \"по последней ревизии состояло и после оной прибыло\" and \"из того числа выбыло\" columns (умер / отдан в рекруты / в отлучке / перечислен); the additional lists (дополнительные ревизские сказки) for anyone missed in a main revision or transferred in from elsewhere — they continue after the last full revision of 1858 (additional lists of 1864, 1873 and 1874–1890 are cited in the threads); then the 1874–75 male lists with *two* age columns (\"по ревизским сказкам и указам Казённой палаты о причислении и перечислении до 1871 г.\" and \"по наружному виду\"); then the family lists. A person sitting at the expected former number with a consistent last-revision age *is* the person; the name is a variant. That is how Meer, son of Elia — household 671 in an 1875 list — was confirmed as family 214 of 1858 on page 440. (GeneaVlogger revision-list streams; J-Roots 4667, 36)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e1a202d7b290","kind":"method","anchor":"Between revisions, look for a town magistrate's register of trade certificates (ведомость о выданных свидетельствах на право торговли), which lists each certificate holder with his household. In one 1825–26 [register of the Chigirin town magistrate](https://commons.wikimedia.org/wiki/File:ДАКО_280-166-7459._1825-1826._Ведомости_Чигиринского_магистрата_и_Черкасской_городской_думы_о_выданых_свидетельствах_на_право_торговли.pdf) (Kiev guberniya), issued to merchants and мещане, each entry gives the holder's number in the 1816 revision or the 1818 additional list. It then names the people 'belonging to his capital': his wife, sons, the sons' wives and children, and daughters, with a wife married since the revision marked 'taken after the revision'. The ages sit in two pairs of male and female columns. One pair copies the age from the 1816 revision or the additional lists; the other gives the age of each child born after the revision. So an age in the first pair is a revision-year age, not the age when the certificate was issued. Based on the inspected pages, a son aged 14 in the revision column there has a four-year-old son in the born-after column, which is possible only if 14 was his age at the revision [N30]. Use such a register like the recruit-turn book in step 8, to carry a household from the 1816 revision towards the next one. Limits: only one spread of one town's file was read, and the register covers only households that took a certificate.","sources":["N30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f352df53c607","kind":"unclassified","anchor":"Know which year each age is reckoned at. In the 1874–75 male lists, a documentary-column age with no decree cited is, in members' reading of the form, the age at entry in a revision list: 1858 for most men, or an additional list up to 1871. It is not the age in 1875. For a man marked dead, count the birth year from that entry year. One participant suggests that absence entries were based on the society's passport records; someone who left without a passport could therefore still be recorded at home. Family lists were kept up for decades. A later addition's age is reckoned at the year written beside it, so a girl 'eight in 1890' was born about 1882, not 1866. Read the whole spread, and marginal words such as 'внучка', before assigning children ([1874–75 columns and continued family lists](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Limits: this is a reading of the forms, not a cited regulation. Daughters were often entered late, so an age gap alone is not a second person.\n5. **Read relation labels against the current head, and watch them drift.** Treat \"племянник\" in a pre-1850 list as \"relative,\" not \"brother's son,\" until the household chain says otherwise; by 1858 the modern meaning is usual. \"При семье брата,\" \"зять,\" \"воспитанник,\" \"приёмный,\" \"приёмыш,\" \"пасынок\" describe the *household*, not descent. A man written \"nephew\" in 1850 as the head's brother's son, whose wife that year carries the head's name as her patronymic, is son-in-law as well as nephew — inside the head's household that patronymic makes her his daughter unless another man of that name can be shown as her father; when he reappears in 1858 as \"зять\" with a wife whose patronymic excludes her being the head's daughter, the label has outlived the marriage that created it. A younger brother listed as head with an older \"brother of the head\" means the father died and headship passed. (J-Roots 4667)\n6. **Test age, sequence and naming fit.** Two to three years of age drift is nothing; a larger gap sends you to the original entry and its date basis, not to a second person. A boy who appears in a household with no birth entry there and an age off the family's spacing raises the re-registration hypothesis — it does not prove it: births were registered late, elsewhere or not at all, so require a recruit, quittance, причисление/перечисление or equivalent record before concluding he was registered rather than born into the household. Ashkenazi naming after the recently dead is a signed clue: a child named for a man who died two years earlier points at the branch that man belonged to (the Miglin Abram born 1828 dated his grandfather's death to about 1827; the Chernyakhov Itsko-Yos born 1883 honoured the mother's father who died in 1880). (J-Roots 1202, 1107, 3733; GeneaVlogger Miglin)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2cefde6d506","kind":"unclassified","anchor":"The last-revision age check works for males only. Revision lists give women a current age and have no previous-revision age column for them. So a wife whose name and age differ between two revisions is not thereby shown to be a second wife. Children of a second marriage carry the same patronymic, so their patronymics cannot separate the two cases, and name variance in revisions is common. A [revision-list query about a wife's changing name](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) concluded that no firm verdict was possible. Leave the question open and check the next surviving revision and the children's metrical entries.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e871f1c05cb7","kind":"unclassified","anchor":"Test 'one or two' with the features that can separate them. Before merging two same-surname households from one place, compare their приписка and the relative age order of siblings who share names. Lists that reverse which sibling is older, or that name different societies, point to two families. A rare surname, one village and repeated names still point to kinship, so keep the families separate but possibly related, and look for a list that carries both. When one father appears under different double-name pairs, check who wrote and certified each entry, the приписка wording and the birth spacing. Different recorders make variants easy to explain. One recorder makes them less likely, but not impossible, since a father may have brought documents with different second names ([household and recorder comparisons](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Limit: these checks shift the odds, not the verdict. Keep both hypotheses until a household or death record separates them.\n7. **Read the metrical books for what they encode.** In the Pale guberniyas Jewish metrical books were mandated in 1835 and kept from then by the rabbi the community elected and the provincial authority confirmed, informally the казённый раввин; an 1857 law changed who could be elected, not when registration began ([Brockhaus-Efron Jewish Encyclopedia: metrical books](https://ru.wikisource.org/wiki/ЕЭБЕ/Метрикация,_метрические_книги_и_свидетельства), [rabbinate](https://ru.wikisource.org/wiki/ЕЭБЕ/Раввинат)). Congress Poland's акты гражданского состояния follow a different regime. The parents' estate phrase gives the registration society; the mother is name + patronymic; a remarriage entry states девица / разводная / вдова and the widow's surname may be her first husband's or her maiden one (or both coincide when she married a same-surname cousin); a marriage may have been registered in a third town, so its absence from both home communities is nothing. Look for later marginalia — some, not all, adoptions were later noted in the register; the post-1891 court procedure inscribed the adoption on the family-held birth *certificate*, so the archived register may carry nothing; a Soviet-era slip addressed to the Klintsy ZAGS office was glued onto a 1905 birth entry to record a 1917 adoption with a new surname *and* new given name and patronymic. (J-Roots 3733, 4667, 1107)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6c11dcce7d07","kind":"unclassified","anchor":"Treat a birth entry that names only the mother as a possible illegitimate birth, and read the Hebrew side. In one processed set of 1908–1918 town books, seven of eight such entries were marked illegitimate. The Hebrew used a phrase meaning 'born outside the law' for unmarried mothers and 'mamzer' for a widow's child. After the parents married, such a child may appear in every later record under the father's surname and patronymic. A [metrical-book illegitimacy discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) reports one such case confirmed by DNA. Limits: not every such entry is labelled, and some mothers registered the child in another town. One member says the rules changed around 1903, and another found a note in a family list citing a мещанская управа document; where legitimation was formally recorded was not established.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f675f0220a44","kind":"unclassified","anchor":"Read 'возворотил разлученную' in a groom's entry as a possible remarriage to his own divorced wife, not a new bride. In the case discussed, a widower took back his first wife, and the entry counted his marriages but not hers, as an update of the old union. A [returned-divorced-wife discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) adds that this was possible only if she had not remarried in between. So link the bride to the earlier wife as a hypothesis rather than adding a second woman, and search for the first marriage, the divorce and the intervening wife's death. Limits: this is one member's reading of one entry; establish the sequence from those records.\n8. **Pull the recruit and conscription files.** Personal recruit files (личные дела по рекрутскому призыву), recruit family lists (рекрутские посемейные списки — where \"приёмыш\" appears), draft lists and causes \"о причислении к призывному участку.\" The levy is a documented motive for deliberate re-registration, and the exemption claim is where a substitution is written down — but a name in a recruit list may also be a purchased substitute, not kin at all. \"По 95 набору отдан в рекруты\" dates a surrender to 1830 by levy number. (J-Roots 36, 4667, 1107)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a90aa2045f16","kind":"unclassified","anchor":"Two more recruit-side sources, each to be checked against the lists. An 1831 recruit-turn book ('очередная книга') for one town and uezd was compiled by families in turn for the levy. It lists males and females like a revision and cites each household's numbers in the 1816 revision and the 1818 additional list, which bridges the gap between revisions for the step-4 chain ([recruit-turn book](https://forum.j-roots.info/viewtopic.php?f=20&t=4270)). A petition against a son's call-up often lists the other sons with ages and details. It is interested testimony, and a [recruit-petition discussion](https://forum.j-roots.info/viewtopic.php?f=152&t=36) warns such lists are often untrue. Limits: the turn-book report is second-hand and covers one uezd. A family's place in the turn order is not evidence that a son was surrendered. A son left out of or added to a petition is part of the exemption argument, not a household fact.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-596de1f714a5","kind":"unclassified","anchor":"Service is an exit from the home lists, not the end of the trail. A soldier's family may sit in a garrison town's rolls. An 1858 roll of cantonists, soldiers' children and soldiers of an inner-Russian town lists a Jewish private of the local invalid command with his wife, given with her patronymic, and their children with ages ([garrison-town roll](https://forum.j-roots.info/viewtopic.php?f=15&t=64)). A man released on indefinite furlough could be enrolled into a town's мещанство by treasury-chamber order. He then appears in that town's additional revision list, possibly far from his home society, with age, campaign medal and stripes ([discharged-soldier additional list](https://rodgersforum.borda.ru/?1-23-0-00000023-000-0-0-1743010117=)). Match him to the recruit by name, patronymic and age before joining them. Limits: each thread shows one town's list, and the roll entry is one transcription with a partly unreadable surname. The furlough entries give no pre-service origin or regiment, and a campaign medal does not prove combat.\n9. **Only then DNA**, with the prediction table below.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a307cbdfa234","kind":"unclassified","anchor":"Conversion is not only Orthodox, and its trace runs past 1917. At NIAB, fond 1781 holds individual files titled as a Jew's transfer to Roman Catholicism or baptism. Their titles carry the pre-conversion name and sometimes a second surname ([NIAB fond 1781 file listing](https://forum.j-roots.info/viewtopic.php?f=152&t=36)); record both names as search forms. A Soviet record calling a baptised man 'еврей' does not contradict the baptism: imperial records classified people by confession, Soviet ones by nationality. So match on name, birth year and place, occupation and address ([convert-identity discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Limits: only the file titles were seen, so what the files say about parents or new names is unverified. Do not read the father's death or consent into a patronymic kept at baptism. Whether a Soviet patronymic came from the baptism or from family usage was left open.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ce872fb0e1f0","kind":"unclassified","anchor":"- **Run the sequence in order: parse → приписка → chain → labels → fit → metrics → recruit files → DNA-with-prediction-table.** Skipping to DNA is the tell that the documentary work was not done.\n- **Make the model produce the ledger**: per mechanism, evidence for, evidence against, the settling record, the settling DNA observation, status. A placement without a ledger is a guess.\n- **Read the image, not the index**, for household numbers, the age columns, the \"выбыло\" column and marginalia — indexes drop exactly these (routed to [AI for documentary records](ai-for-documentary-records.md) for the transcription mechanics).\n- **Family lists are layered.** The page runs parents, then children, then other relatives. Children's later spouses and offspring were written into whatever space was free, in small script, so the layers break down. An indexer of these lists reports that published indexes left some insertions wrongly attributed, with substantial errors ([family-list layout note](https://forum.j-roots.info/viewtopic.php?f=4&t=4667)). Before chaining on an indexed family list, place every inserted person in the household against the image. The source names no specific error, so treat this as a reason to check, not as a known error rate.\n- **Cross-recipe boundaries:** cM inflation, non-additivity, largest-segment triage, multi-path mapping, pedigree-aware family comparison, endogamy segment filters, Ashkenazi reference ranges and genetic pioneers → [AI for DNA research](ai-for-dna-research.md); WATO limits and tester choice under tied hypotheses → [unknown parentage and WATO](unknown-parentage-wato.md); surname/haplogroup contradictions and Y/mt tester selection → [Y-DNA and mtDNA](ydna-mtdna-interpretation.md); X-DNA elimination logic and pile-up regions → [X-DNA and phasing](xdna-phasing-judgment.md); same-name fusion, namesake tests and negative-evidence sufficiency → [evidence, proof and working hypotheses](evidence-proof-judgment.md); estate (сословие) labels as dated registration status → [estate registration status](russian-estate-registration-status.md); JewishGen's Town field as a registration place, double-name search lanes and marriages in the bride's town → [JewishGen search and family reconstruction](jewishgen-search-family-reconstruction.md); given-name variant forms → [Beider given names](beider-given-name-variants.md); unregistered girls and substitutes for a lost metrical book → [Jewish metrical books and rabbinates](russian-empire-jewish-metrical-book-recovery.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
