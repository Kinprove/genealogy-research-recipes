claims:
  - {"id":"C-52ea99c68b26","kind":"method","anchor":"1. Begin with the county’s Griffith’s Valuation surname search. The Ask About Ireland demonstration shows a route from an index result to the individual entry [S1], [S2]. Each entry describes a holding and its valuation. One occupier can appear on several lots [S3].\n2. Open every hit for the target name, including spelling variants. In the Limerick search for James Scully, the speaker read a house valued at 11 shillings under Thomas Noonan and a house with 15 acres, 3 roods and 29 perches under Thomas O’Grady [S1]. Record those values in separate rows. They are valuations rather than amounts of rent paid.\n3. Make one row per entry. Record these fields separately:\n   - townland\n   - lot number, copied literally (for example a lot with a letter suffix)\n   - occupier name, copied literally\n   - immediate lessor, copied literally (\"in fee\" there means the occupier was also the legal owner)\n   - holding type (house only, or house and land)\n   - acreage in acres, roods and perches\n   - rateable value\n   - series, and the date printed on the volume you consulted\n   Do not identify the family at this stage.\n4. Put family recollections in a separate note. A story about wealth led the Limerick search toward the larger Scully holding [S1]. Retain the smaller holdings and test each candidate against a parish, marriage or migration record that connects the person to the townland.\n5. Copy the occupier and immediate lessor into separate fields. In the same demonstration the speaker read one John Scully as junior and presumed the other was senior [S1]. Mark a qualifier as transcribed only if it appears on the page. A sublease between same-named men supplies a lead to their dealings, not a parent-child relationship.","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5e99fb179728","kind":"unclassified","anchor":"1. Copy any parenthetical word or name after an occupier's name exactly as written, for example *John Daly (James)*. It is a mark that separates same-named occupiers [S3]. It is often the father's first name, but valuers also used Jr/Sr, occupation and physical traits as distinguishers. Hold the father's-name reading as a hypothesis in a separate column, and do not use it to fill a parent field.\n2. One person can lease several holdings and so appear more than once [S3]. Mark repeated same-name rows within a townland as *possibly one occupier holding several lots*. Do not merge them by default. The presenter in [S3] goes further and says that same-named entries without distinguishers in one townland are the same person. Treat that as the presenter's rule of thumb, not a finding. The same presenter describes the traditional naming pattern (eldest son after the paternal grandfather, second after the maternal grandfather, third after the father) producing several men of the same name and similar age in one area [S3]. The pattern was not followed everywhere, but where it was, that is the very situation in which a default merge fails.\n3. Draft family groups by townland only as clusters of candidates. \"Probably all related\" because they lived in one area for generations [S3] is a reason to look further, not evidence of kinship.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ac99d44aae1e","kind":"unclassified","anchor":"1. Names that sit next to each other in Griffith's are not necessarily next-door neighbours. Do not read entry order the way you would read a census visitation order [S2]. Entries follow the reference numbers on the Ordnance Survey map, so nearby lot numbers often mean nearby plots, not adjoining houses. Use the lot reference to place each row on the map rather than inferring position from the page.\n2. If the county and the family's network of names are known but the townland is not, search the Tithe Applotment books **by place** on the National Archives of Ireland site (titheapplotmentbooks.nationalarchives.ie), which can be browsed by county, parish and townland [S2]. That site holds the 26 counties of the Republic, plus a few parishes filed under Armagh, Down and Fermanagh [S10]. The six Northern Ireland counties' books are at PRONI (FIN/5/A), free to view as parish PDFs in its eCatalogue but not indexed by name [S11]. FamilySearch has both sets with images, and Ancestry has an all-Ireland name index without images [S12]. Look for places where the known cluster of family surnames appears together, then compare that cluster with the valuation for the same area [S2]. Record:\n   - each place searched\n   - the surnames found in each place\n   - places searched where the cluster was not found\n   - the date on each tithe book consulted, so the gap to the valuation entry is explicit\n3. A cluster that turns up in both series narrows the search area. It does not identify any one occupier. The presenter's explanation that arranged matches kept land together [S2] is context for why clusters recur, not a kinship link between any two rows.","sources":["S2","S10","S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-626b433f3a49","kind":"method","anchor":"1. Follow the lot forward from Griffith’s through the manuscript revision books. Match its number, area and any subdivision before comparing the names. A valuer could cross out an occupier and date the replacement [S3]. The 2023 launch of the Ancestry index to Northern Ireland’s 1864–1933 revisions reported around 3.2 million indexed names and guest-account access at launch [S6].\nFor Northern Ireland, PRONI provides place searches and images of the 1864–1933 books, series VAL/12/B [S5 @2026-11-19]. For the Republic, Tailte Éireann holds the original post-primary revisions and maps. Its archive describes on-site terminals for the digitised books and a staff research service for people unable to visit [S7 @2026-11-19]. Confirm appointment and production arrangements before travelling.","sources":["S3","S6","S5","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7ba030221df7","kind":"method","anchor":"1. Identify the issuing court on the rental. The 1849 Act authorised Commissioners for the Sale of Incumbered Estates [S20]. The 1858 Act created the permanent Landed Estates Court [S21]. Retrieve the rental image by estate or tenant name, then copy the statement date and proposed sale date separately. Findmypast’s archived *Landed Estates Court Rentals 1850-1885* description identifies transcripts and images [S13].\n2. Give each life in the lease a separate row. In the lease Lisson reads, dated 1 May 1800, William Kearney’s brother Joseph and William’s son Joseph are two named lives [S4]. Record each relationship to William and check the spelling, lease and lot on the rental image before identifying either Joseph elsewhere.\n3. Lisson reads William as the sole survivor [S4]. For each other life established as alive on 1 May 1800, the observation brackets death between the lease and the rental’s dated survival statement. When that statement’s date is missing, leave the upper bound unresolved. Neither the year the court opened nor an assumed sale year can supply it.","sources":["S20","S21","S13","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a80c993f030a","kind":"portal-availability","anchor":"**The National Archives of Ireland's tithe site named in step 2 is offline.** NAI lists the Tithe Applotment Books, 1823–37, among the collections that can still be viewed in its Reading Room while its genealogy microsites are offline [S14 @2026-11-13]. Until the site returns, run step 2 on the other copies that step names, or on the books in the Reading Room.","sources":["S14"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"GM13-LAND-COVERAGE","kind":"method","anchor":"**Check coverage before interpreting a missing name.** Tithe books list occupiers of titheable agricultural land; people without such holdings are outside that coverage [S15]. Search the civil parish and townland, separately from the Catholic parish [S16]. For Griffith’s, read the county volume’s actual date within 1847–1864 before testing someone who died or emigrated earlier [S15].","sources":["S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"GM13-LAND-ACRES","kind":"method","anchor":"Before comparing tithe and Griffith’s holdings, copy each volume’s acreage unit. An Irish or plantation acre is about 1.62 statute acres; Griffith’s uses statute measure [S16]. Keep the literal acres, roods and perches and any conversion in separate fields.","sources":["S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"GM13-LAND-WIDOW","kind":"method","anchor":"6. Read a dated \"Widow [surname]\" entry as reported widowhood by that date [S18]. It does not name the husband. Identify him from other records before assigning the report to the earlier occupier. His last established record alive supplies the lower bound for a proposed death window; the same-surname succession alone supplies neither his identity nor that bound.","sources":["S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"GM13-LAND-DOGS","kind":"method","anchor":"Use dog licences as a separate residence check from 1866. Findmypast’s *Ireland dog licence registers, 1866–1914* description gives names and addresses in the index and further dog details in images [S17]. Compare the licensee’s address and date with the occupancy chain; the licence is not a property title.","sources":["S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0a191322aa1f","kind":"method","anchor":"2. For each change, record:\n   - book and page\n   - lot\n   - the crossed-out name, copied literally\n   - the replacement name, copied literally\n   - the date written beside the change\n   - the colour or ink of the entry, if visible\n3. Separate a change in what the valuer wrote from a change in tenancy. In Aghnabohy, civil parish of Piercetown, County Westmeath, Donna Moughty traced a Griffith’s entry for Bernard Murtagh to a revision she dated to 1883 in the interview. Her own article identifies the replacement surname as Moughty and reports church entries under that spelling [S3], [S19]. Transcribe both names from the revision image. Test the spelling correction and the proposed succession between two Bernards separately.\n4. A new surname can lead to a marriage search. Moughty followed the lot through a John in the 1950s and a later occupier after John’s reported death in 1966. She attributed the later occupier’s link through John’s sister to evidence outside the valuation [S3]. Retrieve that marriage and check a death or probate record before recording the brother-in-law relationship.\n5. Compare the townland or street in the 1901 or 1911 return with the lot’s townland. Record the county and district electoral division as well [S8], [S9]. Treat a household-to-lot link as provisional until independent details agree.","sources":["S3","S19","S8","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
