claims:
  - {"id":"C-f74e1aad448e","kind":"method","anchor":"A dated parish transfer records an administrative step. Leave the physical relocation date open until evidence places the person. Compare the origin parish’s outgoing list, the destination’s incoming list and the moving certificate (muuttokirja), when it survives. The origin parish drew up the certificate and the destination parish filed it. Carry the certificate number and the page reference into the rippikirja, and label issue, receipt or entry dates by what the headings and document establish. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f1dec326bd43","kind":"method","anchor":"Use a communion-book listing as evidence of registration. Keep an unrecorded absence open, and follow dated observations to test it. The Tampere example uses a certificate to Helsinki to trace registration and leaves the suggested rural residence unresolved. Use a fictional or literary setting only as a search lead. [S2], [S5]","sources":["S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7279cbd6d3bd","kind":"method","anchor":"For a historical move into Helsinki, search the address and occupation directory (osoite- ja ammattikalenteri) for the same year as the henkikirja population roll. Use the historical district, block and lot to find the roll entry. A roll is a snapshot of the enumeration. If it omits the person and the directory lists them, preserve both observations and keep residence during the year possible. [S3], [S4]","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a6c1e9d94aa6","kind":"method","anchor":"Put the directory edition, date of the population enumeration and parish registration on separate rows. Use an earlier listing to bound when the person was recorded locally, and look for an independent event date before dating the physical move. [S2], [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-003c9da9a2ab","kind":"example","anchor":"In one Helsinki case reported by Kyläkoski, the address directory and population roll both listed the person before the formal transfer. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2c2df40a1f89","kind":"method","anchor":"Follow page references through successive communion books (rippikirjat, RK) and children's books (lastenkirjat, LK), retaining the parish, village, farm, croft and page of each entry. For Vesanto around 1867, check the successive Rautalampi and Vesanto volumes. If baptisms continue to name the same estate, keep a move between a farmhouse and a croft on that estate open while you check the household pages and any more detailed memoir version. [S2], [S6]","sources":["S2","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
