claims:
  - {"id":"C1","kind":"historical","anchor":"Use *Ufficio Informazioni Vaticano (Prigionieri di Guerra, 1939–1947)*. Despite the prisoner-of-war title, include civilian inquiries. Start with the person sought. On a matching card, read the identifying details for the person sought and the requester, the reported outcome and any box reference [S2], [S3].","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C2","kind":"method","anchor":"Follow the card’s box reference into the correspondence or lists. Look for the original request, any internee list or third-party communication it cites, and the reply. In the community case a Vatican reply notified a civilian internee’s family months after the event. Treat the inquiry, the reply and the person’s actual fate as separate findings. [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C3","kind":"historical","anchor":"Use *Inter arma caritas*, volume I, for the fonds inventory. Use volume II’s *Ricerche di civili* for examples of civilian inquiries. Record a miss in the printed selection as a miss in that selection and keep the card search open [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
