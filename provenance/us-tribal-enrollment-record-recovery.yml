claims:
  - {"id":"C-5b24687a6d43","kind":"method","anchor":"- **Test the tribe against the place before choosing a roll.** Ask which nation the family is said to belong to. Then ask which nations lived where the family actually lived, and when [S3]. If no history places that nation in the family's county, treat that as a warning sign, not a gap to explain away. One presenter answers a Cherokee claim from Houston County, Alabama, by pointing to Creek country in the east of the state and old Choctaw territory in the west [S2].\n- **Check whether the lore has moved to the wrong person or the wrong tribe.** In the Isenhour case, the family said Eliza Ann Isenhour (1850–1898) was \"full-blooded Cherokee\". The enrollment packet records her as a non-citizen. Her second husband, Jacob Meek, was a quarter Choctaw, and their son Calvin and her stepson James were enrolled as Choctaw by blood. The lore had attached to the mother instead of the husband and stepchildren, and had changed the tribe [S9].\n- **Split the claim into one roll question per tribe and period.** \"Cherokee in Georgia before removal\", \"Cherokee in Indian Territory in 1900\" and \"Cherokee in North Carolina in 1924\" point to different rolls (step 2).","sources":["S3","S2","S9"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c71da2e2e8d","kind":"historical","anchor":"| Roll or series | Who could be on it | Period and conditions | What it was for |\n| --- | --- | --- | --- |\n| Dawes Final Rolls (Commission to the Five Civilized Tribes) | Cherokee, Choctaw (including Mississippi Choctaw), Chickasaw, Creek and Seminole citizens by blood, by marriage, Freedmen, and Delaware adopted by the Cherokee [S14] | Applications from 1898 through 1907, with a handful accepted in 1914. Applicants had to reside in Indian Territory [S14]. Mississippi Choctaw had to relocate to present-day Oklahoma before the rolls closed [S24] | Allotment of tribal land |\n| Guion Miller roll (Eastern Cherokee applications to the U.S. Court of Claims) | Eastern and Western Cherokee alive on 28 May 1906 who were members of the Eastern Cherokee tribe at the time of the treaties, or descended from such members, and not affiliated with any tribe other than the Eastern Cherokee or the Cherokee Nation [S25]. Families who stayed in the East qualified. Old Settler Cherokee were excluded [S23] | Applications had to arrive by 31 August 1907. They document over 125,000 individuals, and 30,820 were approved: 3,436 east of the Mississippi and 27,384 west [S16] | Paying a Court of Claims judgment. It is not a membership roll |\n| Baker Roll (1924) | Eastern Band of Cherokee Indians | Today's EBCI rule: a direct lineal ancestor on the 1924 Baker Roll and at least 1/16 Eastern Cherokee blood, counted from that ancestor's entry [S21] | EBCI base roll |\n| UKB base roll (1949) | United Keetoowah Band | Descent from someone on the 1949 base roll or the final Dawes Roll, and at least 1/4 Keetoowah Cherokee blood, computed from that ancestor's roll entry and shown on a CDIB [S22] | UKB base roll |\n| Indian Census Rolls, 1885–1940 (NARA M595) | Only people who kept a formal affiliation with a tribe under federal supervision, recorded by agency [S17] | Not every reservation or group has a roll for every year. In 1935, 1936, 1938 and 1939 only supplemental rolls were made, and most 1940 rolls stayed with the BIA. From 1930 they add blood degree and residence [S17] | Agency census, for any federally supervised tribe |","sources":["S14","S24","S25","S23","S16","S21","S22","S17"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5cf6c0f4fc67","kind":"method","anchor":"- **For an ancestor of a tribe outside the Five Tribes, do not search the Dawes Rolls.** They hold only the five tribes above. Each tribe sets its own enrollment rules and its own base roll [S18], [S10], and a present-day tribe can still require Dawes descent, as the UKB does (step 6).\n- **Do not treat the three Cherokee tribes as one.** The Cherokee Nation, the Eastern Band and the United Keetoowah Band each have their own citizenship rules and base roll [S5], [S20], [S21], [S22].","sources":["S18","S10","S5","S20","S21","S22"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8af3addbb57e","kind":"custody","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> A request to a tribe's enrollment office, a BIA agency or a National Archives facility sends the family's names and lineage, and enrollment and agency files can name people who are still living. Answer the privacy gate in `SKILL.md` before you send it.\n- **Current membership is held only by the tribe.** The BIA has no database of enrolled members and does not keep records of everyone with Native ancestry. Each tribe keeps its own enrollment records, including records of past members [S18 @2026-11-13].\n- **Historical rolls and federal case files are mostly at the National Archives.** The Dawes Final Rolls are in Record Groups 48 and 75, digitized in the National Archives Catalog and filmed as T529. The Fort Worth facility is the contact for 1896 applications, allotment maps and Choctaw–Chickasaw Citizenship Court records [S14 @2026-11-13], [S15 @2026-11-13]. The Guion Miller applications (M1104) and enrollment records (M685) are digitized in the National Archives Catalog [S16 @2026-11-13].\n- **BIA agency files sit at NARA facilities around the country, with no comprehensive index.** Identify the tribe and the local agency first [S19 @2026-11-13]. For example, the Fort Belknap agency's records are at NARA Denver, and allotments there were kept in tract books, not individual case files [S12 @2026-11-13].","sources":["S18","S14","S15","S16","S19","S12"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3bfec6e2e7a8","kind":"method","anchor":"- **Ask the tribe's enrollment office.** Each tribe manages its own enrollment, so contact its office directly [S10].\n- **Ask the agency that holds the official record early, not last.** One family spent months on probate, deed, mortgage and guardianship searches. Then the Osage Agency BIA office answered the question in one visit [S13].\n- **Read agency microfilm page by page.** Some agency microfilm is narrative, not a name list, so read through the images instead of expecting a name index [S3].","sources":["S10","S13","S3"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-450ed471fd1a","kind":"method","anchor":"- **Go from the index to the card.** Copy the census card number from the typed index, then browse to that card by tribe [S1]. One card can show three generations [S1].\n- **Read the stamps and notes.** An application may be marked refused and later accepted [S1]. Cards show whether a person appeared on an earlier tribal roll, and an 1896 application is noted as \"1896 Case\" with a number [S15]. For changes that the final roll hides, see [period law reading](us-period-law-record-reading.md).\n- **Get the application as well as the card.** The card records the applicants and the actions taken. The application holds the supporting documents [S14]. Packets can include repeated interviews and witness statements [S9].\n- **Search for more than one number.** A Cherokee applicant may have a doubtful number, a rejected number and an approved number, and each file can hold different material [S2]. Search every number the person had. Doubtful (\"D\") cards were later moved to approved or rejected (\"R\") cards [S15].\n- **Read Freedmen and by-blood cards differently.** Freedmen were defined as people formerly enslaved by the Five Tribes and their descendants [S14]. For slaveholder research from a Freedman card, use [freedpeople record recovery](us-freedpeople-record-recovery.md).","sources":["S1","S15","S14","S9","S2"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c5b51a3fc85","kind":"method","anchor":"- **A rejection is a decision under that roll's rules, not a finding about ancestry.**\n  - Rejected Dawes applicants have no allotment jacket, but may still have a census card and an application [S15].\n  - Rejected files are often the richest. One presenter's ancestor was denied after an 80-page file that gave another generation [S2]. Estes says declined applications often hold more family information than approved ones [S8].\n  - Mississippi Choctaw \"MCR\" (refused) cards include applicants turned away for many reasons, including white applicants [S4].\n  - The Choctaw Nation describes the Commission as flooded with fraudulent applications [S24].\n  - A rejection alone neither shows nor rules out Native descent.\n- **Read every page of a rejected file, then confirm identity independently.** In Ancestry's worked example, a rejected 1903 Mississippi Choctaw application was tied to an 1881 Texas marriage and a 1910 Oklahoma census household of the same man, Jim Wilkerson. The tie rested on his wife's name, the children's names and ages, and the places [S3].\n- **Check whether a Guion Miller rejection was procedural.** NARA says most applications for minors and dependents were rejected because they arrived late, and that rejected applications still hold family history [S16]. Published extracts of rejected applications exist (Jo Ann Curls Page; Jerry Wright Jordan, *Cherokee by Blood*) [S7].\n- **Absence from the Dawes Rolls has known causes. Name them before drawing any conclusion.**\n  - The person did not live in Indian Territory [S14].\n  - The family belonged to a tribe outside the Five Tribes.\n  - Cherokee families who separated from the tribe and settled in Arkansas, Kansas, Missouri or Texas lost Cherokee Nation citizenship [S6].\n  - Some ancestors hid from government agents [S11].\n- **Absence from the Indian Census Rolls follows from who was counted.** Only people with a formal tribal affiliation under federal supervision were counted [S17], [S1].\n- **Absence from every roll that fits leaves descent unproven.** It does not disprove it [S5]. Do not turn that into support for the lore either. Report the rolls searched, and the rule that would have kept the person off each one.","sources":["S15","S2","S8","S4","S24","S3","S16","S7","S14","S6","S11","S17","S1","S5"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-af3665561707","kind":"method","anchor":"- **A roll shows a person at one point in time. The tribe decides membership today** [S11]. Proving descent from a historical tribe does not establish membership or entitle anyone to benefits [S8].\n- **Qualifying descent means descent from the enrollee, not from a sibling.** A brother on the Dawes Rolls can support family history. For Cherokee Nation citizenship, the applicant's own direct ancestor must be on the roll [S1]. The Nation requires tracing \"directly back to at least one original enrollee on Dawes\" [S20].\n- **Do not import one tribe's rule into another.**\n  - Cherokee Nation: one or more direct ancestors on the Dawes Rolls [S20], and no minimum blood quantum [S26].\n  - EBCI: Baker Roll and 1/16 [S21].\n  - UKB: the 1949 base roll or Dawes, and 1/4 [S22].\n  - Before an application, confirm the current rule with the enrollment office.\n- **Do not offer DNA as proof of membership.** The BIA says DNA tests will not document descent [S18]. The Cherokee Nation does not accept DNA results [S20], and EBCI accepts DNA only for parentage [S21].\n- **A BIA payment or an inherited tribal asset is not proof of descent.** In the Osage case, a family's headright share came from a relative who bought it in 1952 from a non-Osage man. He had inherited it from his Osage wife [S13].","sources":["S11","S8","S1","S20","S26","S21","S22","S18","S13"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
