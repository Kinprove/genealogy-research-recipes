claims:
  - {"id":"C-5b24687a6d43","kind":"method","anchor":"- **Test the claimed nation against the family’s location and date.** Trace the household’s residences before selecting a roll [S3]. In a discussion about Houston County, Alabama, the presenters suggest checking Creek and Choctaw history alongside the family’s Cherokee account [S2]. Use a dated local source to identify possible nations, then look for the individual’s records.\n- **Test each household member separately.** Include spouses, children and stepchildren, and record whose status the application actually describes. In Elder and Dyer’s account, Jacob Meek’s enrollment packet calls Eliza Isenhour a non-citizen, while her husband Jacob, their son Calvin and her stepson James obtained Choctaw enrollment by blood [S9]. The family’s identifying Eliza as Cherokee remains a separate claim.\n- **Split the claim into one roll question per tribe and period.** \"Cherokee in Georgia before removal\", \"Cherokee in Indian Territory in 1900\" and \"Cherokee in North Carolina in 1924\" point to different rolls (step 2).","sources":["S3","S2","S9"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c71da2e2e8d","kind":"historical","anchor":"| Roll or series | Who could be on it | Period and conditions | What it was for |\n| --- | --- | --- | --- |\n| Dawes Final Rolls (Commission to the Five Civilized Tribes) | Cherokee, Choctaw (including Mississippi Choctaw), Chickasaw, Creek and Seminole citizens by blood, by marriage, Freedmen, and Delaware adopted by the Cherokee [S14] | Applications from 1898 through 1907, with a handful accepted in 1914. Applicants had to reside in Indian Territory [S14]. Mississippi Choctaw had to relocate to present-day Oklahoma before the rolls closed [S24] | Allotment of tribal land |\n| Guion Miller roll (Eastern Cherokee applications to the U.S. Court of Claims) | Eastern and Western Cherokee alive on 28 May 1906 who were members of the Eastern Cherokee tribe at the time of the treaties, or descended from such members, and not affiliated with any tribe other than the Eastern Cherokee or the Cherokee Nation [S25]. Families who stayed in the East qualified. Old Settler Cherokee were excluded [S23] | Applications had to arrive by 31 August 1907. They document over 125,000 individuals, and 30,820 were approved: 3,436 east of the Mississippi and 27,384 west [S16] | Paying a Court of Claims judgment. It is not a membership roll |\n| Baker Roll (1924) | Eastern Band of Cherokee Indians | Today's EBCI rule: a direct lineal ancestor on the 1924 Baker Roll and at least 1/16 Eastern Cherokee blood, counted from that ancestor's entry [S21] | EBCI base roll |\n| UKB base roll (1949) | United Keetoowah Band | Descent from someone on the 1949 base roll or the final Dawes Roll, and at least 1/4 Keetoowah Cherokee blood, computed from that ancestor's roll entry and shown on a CDIB [S22] | UKB base roll |\n| Indian Census Rolls, 1885–1940 (NARA M595) | Only people who kept a formal affiliation with a tribe under federal supervision, recorded by agency [S17] | Not every reservation or group has a roll for every year. In 1935, 1936, 1938 and 1939 only supplemental rolls were made, and most 1940 rolls stayed with the BIA. From 1930 they add blood degree and residence [S17] | Agency census, for any federally supervised tribe |","sources":["S14","S24","S25","S23","S16","S21","S22","S17"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5cf6c0f4fc67","kind":"method","anchor":"- **For an ancestor of a tribe outside the Five Tribes, do not search the Dawes Rolls.** They hold only the five tribes above. Each tribe sets its own enrollment rules and its own base roll [S18], [S10], and a present-day tribe can still require Dawes descent, as the UKB does (step 6).\n- **Do not treat the three Cherokee tribes as one.** The Cherokee Nation, the Eastern Band and the United Keetoowah Band each have their own citizenship rules and base roll [S5], [S20], [S21], [S22].","sources":["S18","S10","S5","S20","S21","S22"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8af3addbb57e","kind":"custody","anchor":"- **Privacy gate:** <!-- privacy-gate: request --> A request to a tribe's enrollment office, a BIA agency or a National Archives facility sends the family's names and lineage, and enrollment and agency files can name people who are still living. Answer the privacy gate in `SKILL.md` before you send it.\n- **Current membership is held only by the tribe.** The BIA has no database of enrolled members and does not keep records of everyone with Native ancestry. Each tribe keeps its own enrollment records, including records of past members [S18 @2026-11-13].\n- **Historical rolls and federal case files are mostly at the National Archives.** The Dawes Final Rolls are in Record Groups 48 and 75, digitized in the National Archives Catalog and filmed as T529. The Fort Worth facility is the contact for 1896 applications, allotment maps and Choctaw–Chickasaw Citizenship Court records [S14 @2026-11-13], [S15 @2026-11-13]. The Guion Miller applications (M1104) and enrollment records (M685) are digitized in the National Archives Catalog [S16 @2026-11-13].\n- **BIA agency files sit at NARA facilities around the country, with no comprehensive index.** Identify the tribe and the local agency first [S19 @2026-11-13]. For example, the Fort Belknap agency's records are at NARA Denver, and allotments there were kept in tract books, not individual case files [S12 @2026-11-13].","sources":["S18","S14","S15","S16","S19","S12"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3bfec6e2e7a8","kind":"method","anchor":"- **Ask the tribe's enrollment office.** Each tribe manages its own enrollment, so contact its office directly [S10].\n- **Ask the agency that holds the official record early, not last.** Give the agency the names of known holders and the interest being traced. In Hunt’s account the Osage Agency in Pawhuska identified the relative who had acquired the family’s headright share after searches in county probate, deed, mortgage and guardianship records had left the transfer unresolved [S13]. Record the transfer and seek its underlying documentation.\n- **Read agency microfilm page by page.** Some agency microfilm is narrative, not a name list, so read through the images instead of expecting a name index [S3].","sources":["S10","S13","S3"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-65dea42167b2","kind":"method","anchor":"- **Go from the roll entry to the card.** The person's Final Rolls entry, under the tribe and the enrollment category, gives the roll (enrollment) number and, in its own column, the census card number. Use the card number to find the card; do not use the roll number as a card number, because the allotment jackets are the records filed by enrollment number [S15]. The National Archives Catalog also searches the cards by name, tribe and card number [S15]. One card can show three generations [S1].\n- **Read the stamps and notes.** An application may be marked refused and later accepted [S1]. Cards show whether a person appeared on an earlier tribal roll, and an 1896 application is noted as \"1896 Case\" with a number [S15]. For changes that the final roll hides, see [period law reading](us-period-law-record-reading.md).\n- **Get the application as well as the card.** The card records the applicants and the actions taken. The application holds the supporting documents [S14]. Packets can include repeated interviews and witness statements [S9].\n- **Search for more than one number.** A Cherokee applicant may have a doubtful number, a rejected number and an approved number, and each file can hold different material [S2]. Search every number the person had. Doubtful (\"D\") cards were later moved to approved or rejected (\"R\") cards [S15].\n- **Read Freedmen and by-blood cards differently.** Freedmen were defined as people formerly enslaved by the Five Tribes and their descendants [S14]. For slaveholder research from a Freedman card, use [freedpeople record recovery](us-freedpeople-record-recovery.md).","sources":["S15","S1","S14","S9","S2"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c5b51a3fc85","kind":"method","anchor":"- **A rejection is a decision under that roll's rules, not a finding about ancestry.**\n  - Rejected Dawes applicants have no allotment jacket, but may still have a census card and an application [S15].\n  - Read the rejected applicant’s testimony and witnesses for named parents, spouses or an earlier generation [S8]. One presenter reports finding another generation in an 80-page file despite the denial [S2]. Verify each relationship against a separately identified record.\n  - Mississippi Choctaw \"MCR\" (refused) cards include applicants turned away for many reasons, including white applicants [S4].\n  - The Choctaw Nation describes the Commission as flooded with fraudulent applications [S24].\n  - A rejection alone neither shows nor rules out Native descent.\n- **Correlate the rejected file with independent records.** Compare the spouse’s name and aliases, the children’s names and ages, and the family’s moves. Ancestry’s presentation links Jim Wilkerson’s rejected 1903 Mississippi Choctaw application to an 1881 Texas marriage and a 1910 Oklahoma household through Sarah/Sally and the children [S3]. Distinguish the identification of the applicant from his claim to enrollment.\n- **Check whether a Guion Miller rejection was procedural.** NARA says most applications for minors and dependents were rejected because they arrived late, and that rejected applications still hold family history [S16]. Published extracts of rejected applications exist (Jo Ann Curls Page; Jerry Wright Jordan, *Cherokee by Blood*) [S7].\n- **Absence from the Dawes Rolls has known causes. Name them before drawing any conclusion.**\n  - The person did not live in Indian Territory [S14].\n  - The family belonged to a tribe outside the Five Tribes.\n  - Cherokee families who separated from the tribe and settled in Arkansas, Kansas, Missouri or Texas lost Cherokee Nation citizenship [S6].\n  - Some ancestors hid from government agents [S11].\n- **Absence from the Indian Census Rolls follows from who was counted.** Only people with a formal tribal affiliation under federal supervision were counted [S17], [S1].\n- **Absence from every roll that fits leaves descent unproven.** It does not disprove it [S5]. Do not turn that into support for the lore either. Report the rolls searched, and the rule that would have kept the person off each one.","sources":["S15","S8","S2","S4","S24","S3","S16","S7","S14","S6","S11","S17","S1","S5"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-af3665561707","kind":"method","anchor":"- **A roll shows a person at one point in time. The tribe decides membership today** [S11]. Proving descent from a historical tribe does not establish membership or entitle anyone to benefits [S8].\n- **Qualifying descent means descent from the enrollee, not from a sibling.** A brother on the Dawes Rolls can support family history. For Cherokee Nation citizenship, the applicant's own direct ancestor must be on the roll [S1]. The Nation requires tracing \"directly back to at least one original enrollee on Dawes\" [S20].\n- **Do not import one tribe's rule into another.**\n  - Cherokee Nation: one or more direct ancestors on the Dawes Rolls [S20], and no minimum blood quantum [S26].\n  - EBCI: Baker Roll and 1/16 [S21].\n  - UKB: the 1949 base roll or Dawes, and 1/4 [S22].\n  - Before an application, confirm the current rule with the enrollment office.\n- **Do not offer DNA as proof of membership.** The BIA says DNA tests will not document descent [S18]. The Cherokee Nation does not accept DNA results [S20], and EBCI accepts DNA only for parentage [S21].\n- **Trace how a headright changed hands.** For each transfer, record the previous holder, date and whether the interest was inherited or bought. Hunt reports that her great-aunt bought a share in 1952 from a non-Osage widower who had inherited it from his Osage wife in 1938 [S13]. A payment to the later holder therefore cannot, by itself, establish descent from the original allottee.","sources":["S11","S8","S1","S20","S26","S21","S22","S18","S13"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-253050882c","kind":"platform-ui","anchor":"Use NARA’s state-by-state BIA guide to identify the agency that served the tribe, place and period. The Arizona guide lists agencies, their jurisdictions and holding routes. Carry the agency name, covered years and listed facility into the catalogue search, instead of treating all RG 75 material as one statewide name index. [S27 @2026-11-16], [S28 @2026-11-16]","sources":["S27","S28"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-69dc258dfa","kind":"platform-ui","anchor":"For an adopted person’s local document checklist, use the current Cherokee Nation packet. The packet checked on 16 November 2026 requires a certified final adoption decree and a state-certified full-image birth certificate after adoption; it also requires the petition if the decree omits the birth parents. Use those papers’ parentage statements to document the biological Dawes line, keeping the adoptive relationship in its own role. [S29 @2026-11-16], [S30 @2026-11-16]","sources":["S29","S30"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-e43d7b5f90","kind":"platform-ui","anchor":"Read CDIB blood degree as a documentary fraction based on official-roll ancestry, not a laboratory measurement of someone’s DNA. Keep the roll ancestor, recorded degree and each documented descent link with the fraction. Do not substitute a consumer genetic-ancestry percentage for that calculation, or import one tribe’s citizenship rule into another. [S29 @2026-11-16], [S31 @2026-11-16], [S32 @2026-11-16]","sources":["S29","S31","S32"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-69ed6e39fe","kind":"method","anchor":"For Alaska series that cross 1931, search the creator history under both the Alaska Division of the Office of Education and the Bureau of Indian Affairs. The division transferred to the BIA on 14 March 1931 under Secretary’s Order 494. Record the creator and dates from the series description, then take the holding facility from the catalogue’s custody information. [S33], [S34]","sources":["S33","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-f531d0d614","kind":"platform-ui","anchor":"For Alaska Native census leads, use FamilySearch’s Alaska, Village Census Rolls collection page to identify the relevant items. It describes BIA census material supplied by Sealaska Heritage Institute Archives, but its title says 1912–1978 while its description says 1919–1972. Record the village and year from the individual item and retain the conflicting collection-page spans in the coverage log; neither span establishes complete village-by-year coverage. [S33 @2026-11-16], [S35 @2026-11-16]","sources":["S33","S35"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-m595-band-agencies","kind":"method","anchor":"**Browse M595 under the historical agency headings.** Use the band, place and year to choose which rolls to open. Search both Cheyenne River and Standing Rock for a Sihásapa (Blackfoot Lakota) lead. Cheyenne River also covers Minnecoujou, Two Kettle and Sans Arc (Itázipčho). Standing Rock also covers Hunkpapa and Yanktonai [S36], [S38].","sources":["S36","S38"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-m595-agency-labels","kind":"method","anchor":"For Oglala, check both Pine Ridge and Oglala Sioux Indians. For Sicangu (Brulé), start with Rosebud. For Lower Brulé, check Lower Brule and Crow Creek by year. For a Spirit Lake lead for Sisseton, Wahpeton or Cut Head (Pabaksa), check Devils Lake and Fort Totten. For Santee Dakota in Nebraska, check Santee and the relevant years under Yankton and Winnebago. For Northern Cheyenne, look under Tongue River [S36], [S38], [S39], [S17].","sources":["S36","S38","S39","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-m595-access-genealogy","kind":"portal-availability","anchor":"For Sioux agency rolls, use Access Genealogy’s free U.S. Indian Census Rolls directory to locate links by agency and year, including Cheyenne River and Standing Rock. Match the directory result to the M595 roll and confirm the year on the roll itself [S36 @2026-11-20], [S37 @2026-11-20].","sources":["S36","S37"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-m595-partner-status","kind":"portal-availability","anchor":"Use `M0595` in NARA’s Digitized by Partners table to narrow the `1885` lookup reported in a 2022 video excerpt [S40† @2026-11-20]. The “Indian Census Rolls, 1885 - 1941” row lists “Not available” under National Archives Catalog status and gives separate links to Fold3 and Ancestry [S41 @2026-11-20]. Use NARA’s Indian Census Rolls guide to reach the Catalog or a provider you can access, then confirm the specific agency and year there [S42 @2026-11-20].","sources":["S40","S41","S42"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-m595-coverage-and-fields","kind":"method","anchor":"**Check the agency year and the form before reporting an absence.** In M595, the Standing Rock listing for roll 553 includes 1912–1913 and 1915–1916, so log 1914 as a coverage gap in that series [S17]. When the year is present, check the form headings for names, ages, relationships and identifiers, and record an absent column separately from a blank entry [S36], [S17]. Transcribe each number with its column label. A census row number could change from year to year, so reserve “tribal enrollment number” for a number identified as such [S17].","sources":["S17","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dawes-myheritage-approved-index","kind":"portal-availability","anchor":"**Check MyHeritage for an approved enrollee.** Search the deceased ancestor’s name in MyHeritage’s Oklahoma Dawes Rolls, 1898–1914 [S43 @2026-11-22], [S44 @2026-11-22]. Use the indexed age, blood degree, tribe and any household names to identify a candidate [S44 @2026-11-22]. Confirm the entry on the Final Rolls and read the household relationships on the census card [S14 @2026-11-22]. The index covers approved enrollees, so a miss leaves the application question open [S44 @2026-11-22]. Search the National Archives Catalog’s Dawes census cards and enrollment applications directly after a miss. If the name search turns up no card, browse doubtful and rejected cards by tribe and enrollment category [S14 @2026-11-22].","sources":["S43","S44","S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
