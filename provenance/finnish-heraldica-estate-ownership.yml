claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Use Europeana Heraldica as a finding aid for rälssi and säteri holdings. Open the estate or agent record to look for links and dates. Before using a map omission as evidence, check the database’s scope and test the estate in the land and tax records [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S1","S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Identify the individual holding before assigning the owner. If a marker is labelled with a village or several markers sit together, compare the counts and holding categories in the transcribed passage with the bailiffs’ or provincial accounts for that village and period. Record the separately named holdings and tax figures before grouping any as constituents of a fief [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Check the compiled owner against the cited passage. In a pledge or transfer, identify the specific property, the person whose inheritance it was and who acted in the transaction. Keep a listed home farm and a steward’s employment separate from ownership. Use a steward’s entry as a lead when it names the employer and the holdings together [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For holdings said to have passed together, compare their dated histories but require a source that connects each holding to the transfer. Record an owner missing from the entry as a gap in the displayed history [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"Before using text displayed with the map, distinguish the record’s source material from any text under its Wikipedia heading. Attribute each statement to the publication that supplied it [S1 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
