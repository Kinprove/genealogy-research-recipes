claims:
  - {"id":"C-c551d2135a4e","kind":"unclassified","anchor":"Start from whichever end you hold. In the teaching case the convict was first found in the colonial records, and the presenter then worked back to the English trial [S1]. Working forward from a trial report is equally valid [S2]. Whichever way you go, set up a worklist with one row for each stage below, and leave a row empty until it is filled from an inspected record:","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-647c92e0d3ea","kind":"unclassified","anchor":"1. A newspaper report of the arrest or trial: the charge, any accomplices, the verdict and the stated sentence [S1], [S2].\n2. The criminal register entry from assizes or quarter sessions: the trial date, the court and county, and the sentence. These registers (The National Archives HO 26 and HO 27; on Ancestry as \"England & Wales, Criminal Registers, 1791–1892\") list people charged with indictable offences, with court, trial date and sentence [S2], [S3].\n3. The prison hulk register entry. The hulk registers are TNA HO 9, on Ancestry as \"UK, Prison Hulk Registers and Letter Books, 1802–1849\" [S1], [S2], [S3].\n4. The convict ship record: vessel, departure and the people shipped together [S2]. The bridge from the trial is the Home Office's Convict Transportation Registers (TNA HO 11, 1787–1870), which list each ship's convicts with where and when they were convicted and their sentence [S8]. Search names in the State Library of Queensland's free *British convict transportation registers 1787–1867* database. It holds about 123,000 of the estimated 160,000 convicts. Most of the missing ones were transported from Ireland or elsewhere outside mainland Britain, so a miss there is not a negative [S9]. Ancestry and Findmypast have name indexes too, and TNA's Discovery has the images, which cannot be searched by name [S8], [S9].\n5. The colonial arrival indent (NSW State Archives series NRS 12188 and 12189). From the 1820s NSW indents record a physical description, including a \"particular marks or scars\" column, so expect it and transcribe it [S2]. An arrival index is not the indent; keep them in separate rows.\n6. Colonial gaol entries, such as the NSW gaol books on Ancestry as \"New South Wales, Australia, Gaol Description and Entrance Books, 1818–1930\" [S1], [S2], [S3].\n7. A ticket of leave, conditional pardon or absolute pardon. Each is its own row. On Ancestry these appear in \"New South Wales and Tasmania, Australia, Convict Pardons and Tickets of Leave\" (1834–1859) and the NSW register of conditional and absolute pardons (1788–1870) [S2], [S3].\n8. A permission to marry, then the marriage record itself. Each is its own row. NSW convicts needed the Governor's permission, recorded in NRS 12212, Registers of convicts' applications to marry, 1825–1851, apart from the marriage register [S2].","sources":["S1","S2","S3","S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a7d3a34ec291","kind":"unclassified","anchor":"Between these stages, the colonial lists in TNA HO 10 (1787–1859) can place a convict in New South Wales or Van Diemen's Land with their sentence, employment, land or pardon: convict and settler lists, general musters and the NSW census of 1828 [S10]. Give each list you inspect its own row with its date.","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-669e7e91505e","kind":"unclassified","anchor":"The presenter said he found most of the chain on Findmypast, with other items from British and Australian archives [S2]. In an earlier talk he found it through the record suggestions Ancestry linked to one hit [S3]. A platform suggestion is a lead to a record series. It is not a verified episode.","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d252e81f1a61","kind":"unclassified","anchor":"- **Van Diemen's Land (Tasmania), from 1803** [S5]. Libraries Tasmania holds the conduct registers, indents (CON14 to CON16) and description lists (CON18, CON19) [S6]. Choose the conduct register by sex and period: men under the assignment system, 1803–1843 (CON31), and under the probation system, 1840–1853 (CON33); women under assignment, 1803–1843 (CON40), and under probation (CON41) [S6]. A miss in CON31 says nothing about a man who arrived under probation. Search the person by name in the Tasmanian Names Index, whose convict records cover people transported to Tasmania and people convicted locally, and which also indexes convict permissions to marry [S5].\n- **Western Australia, June 1850 to January 1868.** The State Records Office of Western Australia holds the convict registers and character books, ticket-of-leave, expiree and reconviction registers, medical records and correspondence [S7].","sources":["S5","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-580d8d73bc2f","kind":"unclassified","anchor":"- **A hulk entry does not prove conviction.** The presenter pointed out that one hulk register entry did not show whether the man was held before or after sentence [S1]. Another hulk entry he showed did give a conviction date and a received date [S2]. Record whatever the entry actually states. If it states nothing about sentence, record \"stage unstated\". Never fill in the conviction from the hulk row.\n- **The sentence comes from the trial.** Take the trial sentence from the court register or the trial report. If a colonial record such as an indent states a sentence, transcribe it in that record's own row, but never let it stand in for the trial record. In the teaching case the newspaper gave a 14-year transportation sentence and an acquitted accomplice, and the register of assizes and sessions gave a trial on 1 August 1837 at Norwich with a sentence of transportation [S2]. The presenter did not say which court tried the case: read the court from the register entry itself, and record it as unconfirmed until you have. Keep both rows, so that each record's own statement stays visible.\n- **Received, sailed, arrived and admitted are different dates.** The indent the presenter showed gives arrival on 8 February 1838; later, while describing the Newcastle gaol admission, he gave the arrival year as 1837 [S2]. A man tried on 1 August 1837 and held until October 1837 before he was put on the ship [S2] cannot plausibly have arrived in 1837, so use 8 February 1838 as the working arrival date. Keep 1837 in the gaol row with its source and the reason it was set aside (it conflicts with the trial and shipping dates). Do not delete it. The working date stays provisional until the trial and ship rows are filled from inspected records. Whenever values conflict, test each against the dates of the stages before and after it. Take the value the sequence supports as the working date, and keep every other value in its own row with its source and the reason it was set aside.\n- **Ages show when the record was made.** The presenter read the convict's age as 21 at trial and 23 at the Newcastle gaol admission [S2]. Use the age to place that record in the sequence. Do not adjust it to make the rows agree.\n- **An index-only row stays index-only.** One arrival item the presenter showed, carrying an Archives Authority of New South Wales notice, is a partial index of convicts arriving 1837–1842 with its own volume reference [S2]. It is an index, not the indent: give it its own row and keep the inspected indent in a separate row.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-50c9077511ae","kind":"unclassified","anchor":"A miss in one court database only tells you about that court. One presenter described the Old Bailey Online as holding transcripts from every court of the period [S4]. Do not repeat that claim. The Old Bailey Online covers trials at the Old Bailey, London's central criminal court, 1674–1913; from 1834 that court's jurisdiction also took in urban parts of Kent, Surrey and Essex. A man tried at a county assize or quarter sessions elsewhere, such as the Norwich trial above [S2], will not appear there. Before calling any search negative, record the courts, counties and years it covered. The site's punishment search includes transportation [S4], so it can produce candidates, but each candidate still has to be matched to the colonial person. For an Old Bailey convict, also search the Digital Panopticon. It brings together records from about fifty datasets on the 90,000 people the Old Bailey sentenced to transportation, imprisonment or death from 1780. Where it found a match, it links their trial records with transportation, colonial, prison and civil records. Searching and summary results are free; some full records need an Ancestry or Findmypast subscription [S11]. Its links are proposed matches: give each linked record its own row only after you have opened it. For convicts sent to America, the same presenter pointed to Peter Wilson Coldham's lists, compiled from official court and government records (for example *The Complete Book of Emigrants in Bondage, 1614–1775*), and to published abstracts of runaway notices [S4]. Runaway notices regularly include a physical description, which is their main value when no image of the person exists [S4]. Record both as compilations, not as originals, and go back to the underlying court record or newspaper where you can.","sources":["S4","S2","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b257540c3c25","kind":"unclassified","anchor":"Name, age, offence, place of conviction and vessel are the fields that join a British trial to a colonial convict. Record which of them each row shares with the others. The presenter said the surname was uncommon, which made the records easy to attribute [S3]. That point only holds for that surname. With a common name, look for conflicting candidates in the same court and the same arrival year. A family story or tree attachment only names a candidate. Send the identity decision to [evidence/proof judgment](evidence-proof-judgment.md), and mark each link \"proposed\" until that is done.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb30ad196373","kind":"unclassified","anchor":"Marriage did not bring an automatic pardon. Do not repeat the claim that every convict was pardoned on marriage. The same presenter said so in two talks [S1], [S3]. In a later talk he showed a conditional pardon that cited the man's good conduct since arrival [S2]. Permission to marry was a separate process that could be refused, and pardons and tickets of leave were granted through their own processes. Record the reason exactly as the pardon states it. Keep a ticket of leave, a conditional pardon and an absolute pardon in separate rows, because they are different instruments. Permission to marry is also a separate row from the marriage record. Claims about what happened after the pardon, such as a return to England, need their own records before they enter the table. The presenter mentioned such records but did not show them [S1].","sources":["S1","S3","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ec8f2ba2dc3c","kind":"portal-availability","anchor":"**For a convict tried in Ireland, add the National Archives of Ireland's convict records.** NAI lists these among the collections that can be viewed in its Reading Room while its genealogy microsites are offline: the Chief Secretary's Office Convict Department's Transportation Registers (Ireland to Australia), 1836–1857; its Prisoners' Petitions and Cases, 1788–1836; and its Convict Reference Files, 1836–1856 and 1865–1868 [S12 @2026-11-13]. Search these series before you log a stage as missing.","sources":["S12"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
