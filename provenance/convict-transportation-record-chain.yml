claims:
  - {"id":"C-c551d2135a4e","kind":"method","anchor":"Start with the record you already have. From a colonial indent, work back through the vessel and transportation register to the British trial [S1]. From a trial, follow the sentence forward to the receiving colony [S2]. Give each stage its own row and leave undocumented stages open:","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-647c92e0d3ea","kind":"unclassified","anchor":"1. A newspaper report of the arrest or trial: the charge, any accomplices, the verdict and the stated sentence [S1], [S2].\n2. The criminal register entry from assizes or quarter sessions: the trial date, the court and county, and the sentence. These registers (The National Archives HO 26 and HO 27; on Ancestry as \"England & Wales, Criminal Registers, 1791–1892\") list people charged with indictable offences, with court, trial date and sentence [S2], [S3].\n3. The prison hulk register entry. The hulk registers are TNA HO 9, on Ancestry as \"UK, Prison Hulk Registers and Letter Books, 1802–1849\" [S1], [S2], [S3].\n4. The convict ship record: vessel, departure and the people shipped together [S2]. The bridge from the trial is the Home Office's Convict Transportation Registers (TNA HO 11, 1787–1870), which list each ship's convicts with where and when they were convicted and their sentence [S8]. Search names in the State Library of Queensland's free *British convict transportation registers 1787–1867* database. It holds about 123,000 of the estimated 160,000 convicts. Most of the missing ones were transported from Ireland or elsewhere outside mainland Britain, so a miss there is not a negative [S9]. Ancestry and Findmypast have name indexes too, and TNA's Discovery has the images, which cannot be searched by name [S8], [S9].\n5. The colonial arrival indent (NSW State Archives series NRS 12188 and 12189). From the 1820s NSW indents record a physical description, including a \"particular marks or scars\" column, so expect it and transcribe it [S2]. An arrival index is not the indent; keep them in separate rows.\n6. Colonial gaol entries, such as the NSW gaol books on Ancestry as \"New South Wales, Australia, Gaol Description and Entrance Books, 1818–1930\" [S1], [S2], [S3].\n7. A ticket of leave, conditional pardon or absolute pardon. Each is its own row. On Ancestry these appear in \"New South Wales and Tasmania, Australia, Convict Pardons and Tickets of Leave\" (1834–1859) and the NSW register of conditional and absolute pardons (1788–1870) [S2], [S3].\n8. A permission to marry, then the marriage record itself. Each is its own row. NSW convicts needed the Governor's permission, recorded in NRS 12212, Registers of convicts' applications to marry, 1825–1851, apart from the marriage register [S2].","sources":["S1","S2","S3","S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a7d3a34ec291","kind":"unclassified","anchor":"Between these stages, the colonial lists in TNA HO 10 (1787–1859) can place a convict in New South Wales or Van Diemen's Land with their sentence, employment, land or pardon: convict and settler lists, general musters and the NSW census of 1828 [S10]. Give each list you inspect its own row with its date.","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-669e7e91505e","kind":"method","anchor":"Use a suggested match or an index hit to locate the underlying series, image and reference. Add a stage to the chain only after checking that record’s identifiers [S2], [S3].","sources":["S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d252e81f1a61","kind":"unclassified","anchor":"- **Van Diemen's Land (Tasmania), from 1803** [S5]. Libraries Tasmania holds the conduct registers, indents (CON14 to CON16) and description lists (CON18, CON19) [S6]. Choose the conduct register by sex and period: men under the assignment system, 1803–1843 (CON31), and under the probation system, 1840–1853 (CON33); women under assignment, 1803–1843 (CON40), and under probation (CON41) [S6]. A miss in CON31 says nothing about a man who arrived under probation. Search the person by name in the Tasmanian Names Index, whose convict records cover people transported to Tasmania and people convicted locally, and which also indexes convict permissions to marry [S5].\n- **Western Australia, June 1850 to January 1868.** The State Records Office of Western Australia holds the convict registers and character books, ticket-of-leave, expiree and reconviction registers, medical records and correspondence [S7].","sources":["S5","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-580d8d73bc2f","kind":"method","anchor":"- **Read the hulk register’s column headings.** Copy the date received and any separately stated conviction date. One hulk entry left it unclear whether the man was held before or after sentence [S1]. When a conviction date is given, carry it as the hulk’s reference back to the court record [S2].\n- **Separate the verdicts and identify the court.** The newspaper in the demonstration reported an acquittal for the other defendant [S2]. Queensland’s transportation index names Edward Rodwell’s court as Norfolk Assizes and dates his fourteen-year sentence to 1 August 1837, computed from 1 September. Its reference is HO 11/11, p. 153 (78), AJCP microfilm roll 90 [S15]. Use it to locate the register and the separate trial record.\n- **Distinguish departure, arrival and gaol admission.** The Queensland index gives the *Waterloo*’s departure as 2 October 1837 [S15]. The indent described in the lecture gives arrival on 8 February 1838, while the lecturer later said 1837 when describing the Newcastle gaol entry [S2]. Keep 1838 as the indent’s reported year and inspect the gaol and ship records before deciding what the later entry says. The October departure date alone cannot decide the arrival year.\n- **Compare ages at their own dates.** Keep the reported trial age of 21 and Newcastle gaol age of 23 with their respective entries. Check the elapsed time before treating the difference as a conflict or revising a birth estimate [S2].\n- **Separate an index from the indent it leads to.** The NSW archive lists its 1837–42 index to convict indents as NRS 12191, fiche 803–806. Use the ship, volume and page to open the indent series and record the two references separately [S16]. The lecture’s item labelled as a partial arrival index cannot establish that the original indent was examined [S2].","sources":["S1","S2","S15","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-50c9077511ae","kind":"method","anchor":"Bound each search by court and year. Old Bailey Online covers published trials at London’s Old Bailey from 1674 to 1913. From 1834 its ordinary jurisdiction extended to London, Middlesex and parts of Essex, Kent and Surrey [S19]. Search Norfolk Assizes for Rodwell’s case [S15]. For a London transportation case, search the Digital Panopticon for records linked to the Old Bailey trial [S11], [S13]. Its links use automated and manual matching. Check the age, sentence, vessel and dates in each record before accepting the proposed identity [S14]. For convicts sent to America, search Peter Wilson Coldham’s compilations, including *The Complete Book of Emigrants in Bondage, 1614–1775*. Follow a runaway-notice abstract to the newspaper for a physical description [S4].","sources":["S19","S15","S11","S13","S14","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b257540c3c25","kind":"method","anchor":"Match the name, age, offence, court and vessel across each pair of records [S3], [S15]. Search for competing people at the same court or on the same voyage, including when the surname seems uncommon. A tree attachment supplies a candidate. Mark each link as proposed until the records distinguish the people. See [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S3","S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-eb30ad196373","kind":"method","anchor":"A marriage alone cannot establish emancipation. The conditional pardon read in the lecture referred to Rodwell’s good conduct since arrival [S2]. Transcribe the terms of the pardon and distinguish a ticket of leave, a conditional pardon and an absolute pardon [S17]. In NSW, check both grants and refusals in the marriage application registers (NRS 12212), then seek the marriage entry itself [S18]. A later return to Britain needs a separate passenger, residence or other dated record [S1], [S3].","sources":["S2","S17","S18","S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ec8f2ba2dc3c","kind":"portal-availability","anchor":"**For a convict tried in Ireland, add the National Archives of Ireland's convict records.** NAI lists these among the collections that can be viewed in its Reading Room while its genealogy microsites are offline: the Chief Secretary's Office Convict Department's Transportation Registers (Ireland to Australia), 1836–1857; its Prisoners' Petitions and Cases, 1788–1836; and its Convict Reference Files, 1836–1856 and 1865–1868 [S12 @2026-11-13]. Search these series before you log a stage as missing.","sources":["S12"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8a0851a7b1a7","kind":"method","anchor":"**If the receiving colony is unknown for an Irish convict sent to Australia,** start with the New South Wales convict indents and the Tasmanian Names Index for Van Diemen’s Land, using any known voyage date to narrow the search [S20], [S21]. For a case tied to the 1867 Fenian Rising, search the Western Australian convict registers for a match on the *Hougoumont*, which arrived in January 1868 [S21], [S22], [S23].","sources":["S20","S21","S22","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b2cddf151602","kind":"method","anchor":"**Check whether the transportation sentence was carried out.** Match the prisoner's name against HO 11, using the conviction date and place when recorded. Read the register entry for the ship, departure date and any note of death at sea [S24], [S25]. Keep embarkation open if you have only a sentence or an order to board. Look for a muster taken at boarding to establish embarkation and a disembarkation muster or arrival indent to establish landing [S26].","sources":["S24","S25","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4de1c10adda6","kind":"portal-availability","anchor":"MyHeritage lists *United Kingdom, Convict Transportation Registers* (1787–1867) as another index lead for the ship and conviction details [S24 @2026-11-22], [S27 @2026-11-22].","sources":["S24","S27"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-92c85d016518","kind":"portal-availability","anchor":"**For an early NSW arrival, search by fleet.** On Ancestry, choose the fleet-specific *Australian Convict Transportation Registers* for the First Fleet (1787–1788), Second Fleet (1789–1790) or Third Fleet (1791) [S28 @2026-11-22], [S21 @2026-11-22].","sources":["S28","S21"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bc6123279435","kind":"method","anchor":"**If the Second Fleet arrival search misses, keep embarkation open.** Look for a boarding muster and search surviving records of the ship for a death before landing [S26]. Convicts aboard the *Neptune* died at sea on its 1790 voyage [S28], [S29].","sources":["S26","S28","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-203bb9c1ab3f","kind":"method","anchor":"**For a Port Phillip exile, follow the landing record.** The *Maitland* called at Hobart on 27 October 1846 before continuing to Port Phillip in November, so check the ship's nominal or disposal list in VPRS 14 to establish where the person landed [S33], [S34].","sources":["S33","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dfa18bbf5531","kind":"method","anchor":"In later NSW convict indents, transcribe the recorded age, trade and offence in the arrival row and compare them with the details in the earlier records before linking the person to the voyage [S28], [S21].","sources":["S28","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9f1a19674d5f","kind":"method","anchor":"**Read “exile” in its Port Phillip context.** Treat it as a lead to a transportation sentence and a conditional pardon. Search *Notification of Pardon of Exiles, 1844–1849* by ship and read the individual's terms [S32]. The restriction on returning to Britain ran for the remainder of the original sentence [S30], [S31].","sources":["S32","S30","S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
