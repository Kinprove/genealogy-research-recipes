claims:
  - {"id":"C-90b32c21ffc9","kind":"example","anchor":"Record abandonment and baptism as separate dated events. Keep birth approximate when the entry describes only how soon before discovery it happened. Record each adult by role. In the reported case, the same couple acted as foster parents and godparents while authorities were still seeking the biological parents. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e4048cca049a","kind":"method","anchor":"An assigned surname identifies a recorded naming decision. Keep it separate from evidence of parentage. Copy the exact name, date, authority and any stated reason for the assignment. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-152b9ff6598a","kind":"custody","anchor":"If a margin cites the Petit Conseil, search Vaud’s cantonal archive for the authority and decision date. Look for related correspondence or an inquiry under the same date and locality. Record which papers concern foster placement, the child’s presence at the time of inquiry, or a request for an earlier extract. [S1 @2026-11-21] [S2 @2026-11-21]","sources":["S1","S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7cde2c71c245","kind":"method","anchor":"If a later parish entry cites the earlier register, follow the named parish and compare its entry with the later account. Retain both locators and identify the source of each date or relationship. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
