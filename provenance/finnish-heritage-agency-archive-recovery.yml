  - {"id":"S1","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/05/museoviraston-arkiston-kaivelua.html"],"published":"2025-05-10","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Community account of browsing the Helsinki building studies and numbered ethnographic manuscripts, including inaccessible files and titles that identify excerpts. Read 2026-11-22 in the author’s weekly archive beginning 2025-05-04.","entry_sha256":"c91ebe5616295dc71b357fead20e6fd5db8c31b05b5e5e51d5dc592e3b29dd96","claims":["C-01","C-02","C-03","C-04"],"review":"reviewed"}
