claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"When Yksa returns material you already have from Kulttuuriympäristöportaali, open the archive hierarchy and browse the relevant series by folder and item title. For building studies, look under the municipality. Kyläkoski reports finding Helsinki material under *Rakennetun ympäristön tutkimukset kunnittain: Helsinki*. Confirm the folder and item in the public view before citing a match [S1 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"portal-availability","anchor":"For ethnographic studies, browse *Hp Kansatieteen käsikirjoitukset, kyselylehdet ja muut aineistot*. Use the numbered catalogue *Kansatieteelliset käsikirjoitukset ja muu aineisto numerojärjestyksessä* for the earlier accessions. Search within that series for the place or activity described [S1 @2026-11-22], [S4 @2026-11-22].","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Treat titles with *Tuomiokirjoista poimittuja tietoja* as leads to extracts from court books and *Asiakirjoista jäljennettyjä tietoja* as leads to transcribed information. Record the manuscript’s own reference and any original reference it gives. Carry the original reference forward as a separate lead [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"portal-availability","anchor":"Check file visibility for each item, including companion studies. Open the item’s access or restriction information and record what it explicitly says. If the public view shows only metadata and gives no clear reason, record “file unavailable in the public view” and leave the reason open. Check the agency’s reading-room access information separately [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
