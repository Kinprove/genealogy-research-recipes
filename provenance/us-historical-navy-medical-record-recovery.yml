claims:
  - {"id":"C-ea875f0d4a4f","kind":"custody","anchor":"Search the treating ship, station or hospital as well as the sailor. According to the presenter, check\nRG 52 for ship or shore-station medical journals and a separate patient list [S1† @2026-11-22]. Use\n§52.3.2 to match the date to the ship journals (1813–1910), station journals (1812–1912) or patient\nlists (1830–1889). Check separately listed hospital admission papers for the relevant dates\n[S4 @2026-11-22].","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-90b40e7e18ee","kind":"custody","anchor":"For Philadelphia, according to the presenter, start with the hospital’s RG 24 admission and discharge\nregister [S1† @2026-11-22]. Use §24.8.2 to locate the 1867–1917 series at the National Archives at\nPhiladelphia [S2 @2026-11-22], [S5 @2026-11-22]. Search by admission or discharge date and capture the\nregister entry as its own document.","sources":["S1","S2","S5"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-21b18c1659d9","kind":"custody","anchor":"According to the presenter, search separately for papers sent to the Bureau of Medicine and Surgery\nand papers kept by the treating hospital [S1† @2026-11-22]. Use RG 52’s general records and individual\nhospital listings to find the relevant journal, patient abstract or admission papers. For\nPhiladelphia, check the regional RG 52 holdings alongside the RG 24 register [S3 @2026-11-22],\n[S4 @2026-11-22].","sources":["S1","S3","S4"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
