claims:
  - {"id":"C-historical-register","kind":"method","anchor":"Use the village and event year to identify the civil district or the relevant Catholic, Protestant, Greek Catholic or Jewish register district. For events before the uniform postwar civil system, identify the registration system used in that place and year. Search parish and civil copies as separate holdings where both were kept. In the Central Archives of Historical Records guide for the former eastern territories, first select the correct confession and locality [S1] [S2] [S3] [S5].","sources":["S1","S2","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-parish-series","kind":"custody","anchor":"For a sacramental register, compare the parish or diocesan holdings with the state archives' catalogue. Check for Protestant registers by historical parish and Jewish registers by registration district. For an account book, confirmation list or other internal church record, check the parish or diocesan holdings separately from the civil copies [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-transfer","kind":"custody","anchor":"Use the applicable retention and transfer rule for the specific book. The standard age periods are 100 years for births and 80 for marriages and deaths. For older register books, check the closing date and the statutory rules for books containing more than one class of entry. If an eligible series is absent from the state archive catalogue, check the civil registration office (Urząd Stanu Cywilnego, USC) for a book awaiting transfer [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S2","S3","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
