claims:
  - {"id":"C-historical-register","kind":"method","anchor":"Use the village and event year to identify the civil district or the relevant Catholic, Protestant, Greek Catholic or Jewish register district. For events before the uniform postwar civil system, identify the registration system used in that place and year. Search parish and civil copies as separate holdings where both were kept. In the Central Archives of Historical Records guide for the former eastern territories, first select the correct confession and locality [S1] [S2] [S3] [S5].","sources":["S1","S2","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-parish-series","kind":"custody","anchor":"For a sacramental register, compare the parish or diocesan holdings with the state archives' catalogue. Check for Protestant registers by historical parish and Jewish registers by registration district. For an account book, confirmation list or other internal church record, check the parish or diocesan holdings separately from the civil copies [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-transfer","kind":"custody","anchor":"Use the applicable retention and transfer rule for the specific book. The standard age periods are 100 years for births and 80 for marriages and deaths. For older register books, check the closing date and the statutory rules for books containing more than one class of entry. If an eligible series is absent from the state archive catalogue, check the civil registration office (Urząd Stanu Cywilnego, USC) for a book awaiting transfer [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S2","S3","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-duchy-civil-start","kind":"historical","anchor":"For places in the original Duchy of Warsaw, search Napoleonic civil registers for events from 1 May 1808 [S6] [S7]. For places annexed from Austria in 1809, look for the Napoleonic civil series from 1810 and check when local entries begin [S8] [S9]. For events before the change in registration, follow the preceding jurisdiction’s parish or other register system.","sources":["S6","S7","S8","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-prussian-start","kind":"historical","anchor":"In the Prussian partition, route births, marriages and deaths from 1 October 1874 to the Standesamt that served the event locality, regardless of confession. Search the parish series separately for a church entry. For a missing civil act, check the original register (Hauptregister) and the duplicate (Nebenregister) [S10] [S11] [S12].","sources":["S10","S11","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-siedlikow-parish","kind":"custody","anchor":"For an early nineteenth-century Siedlików death, start with the Roman Catholic parish of Ostrzeszów civil-status books, fonds 53/3436/0 in Poznań [S13 @2026-11-22] [S14 @2026-11-22].","sources":["S13","S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-historic-congregation","kind":"historical","anchor":"When a building changed confession or served as a chapel of another parish, identify the congregation responsible in the event year and search its register. For an 1853 Poznań marriage at the church later dedicated to Wszystkich Świętych, look under the Evangelical parish of św. Krzyża [S15] [S16]. For chapel events at Zawyki, start with the Suraż Uniate parish in the Uniate period and the Suraż Orthodox parish in the later Orthodox period [S17] [S18] [S19].","sources":["S15","S16","S17","S18","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-settlement-alias","kind":"historical","anchor":"When a settlement was absorbed into a city, try both the period settlement name and the modern city under the historical parish. For a pre-1797 entry from Poznań’s parish of św. Marcina, also search under the settlement Święty Marcin [S15] [S20].","sources":["S15","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-synagogue-district","kind":"method","anchor":"For Jewish civil registration in Białystok or Łomża, use the synagogue district as the register creator and search for *akta stanu cywilnego okręgu bożniczego* with the city name [S21] [S22]. When one incident involved people of different confessions, open the appropriate series for each person. For the 1886 Łomża well collapse, use the St Michael’s Roman Catholic deaths (act 234) for the worker and the synagogue district deaths for the other victim [S23] [S22].","sources":["S21","S22","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-event-and-residence","kind":"method","anchor":"Use the place of death reported in a newspaper to choose the first district to search and keep the person’s recorded home district as a separate lead [S24] [S25]. Use the stated birth village to choose the birth parish. Record the wedding place, each spouse’s residence and any permanent-population registration separately. Use a stated residence abroad to look for records there. When birthplace is missing, use permanent registration and an estimated birth year to generate parish candidates, then verify the candidate against family details [S26] [S27] [S28].","sources":["S24","S25","S26","S27","S28"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gidle-catalogue","kind":"custody","anchor":"When a scan is absent, check the archive’s file list for the event type and year before marking the book missing. For historical Gidle events, including Wojnowice births, compare the files and scans in fonds 8/224/0 at the Archiwum Państwowe w Częstochowie [S28 @2026-11-22] [S29 @2026-11-22].","sources":["S28","S29"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-act-date","kind":"method","anchor":"If the act is absent at the event date, browse forward in the same register and include later annual volumes when a delayed declaration is plausible. Record the event and registration dates separately. Assign a parent’s age and occupation to the date the act describes [S23] [S27] [S25]. In the Łomża example, an 1898 birth appears in the 1911 birth register [S27].","sources":["S23","S27","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-remarriage","kind":"custody","anchor":"If a Prussian-partition church remarriage entry omits the spouse’s origins, retrieve the corresponding civil marriage act. Use the recorded birth date, birthplace and parents to identify the birth parish. For Ostrzeszów civil marriages, start with fonds 11/730/0 at the Archiwum Państwowe w Kaliszu [S10 @2026-11-22] [S30 @2026-11-22].","sources":["S10","S30"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dabrowka-alternate","kind":"custody","anchor":"If the parish series has a gap, record the available and searched years separately and check the civil series for the same event dates. For a Dąbrowa death during the reported 1876–1886 gap in the Skórzewo parish books, use the death series of the Dąbrówka Standesamt, fonds 53/1846/0 in Poznań. Include a relative in that search when other records place the relative in the same district and interval [S31 @2026-11-22] [S11 @2026-11-22] [S12 @2026-11-22].","sources":["S31","S11","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-attachments","kind":"method","anchor":"When a birth or baptism book is missing, look for baptismal extracts in the marriage attachments (alegata or aneksy), including for spouses from the marriage parish [S25] [S32]. In the 1820 Skórkowice example, the same marriage’s attachments supplied extracts for both local spouses [S32].","sources":["S25","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bound-death","kind":"method","anchor":"For a missing death, bound the search with the latest act that explicitly places the person alive and the earliest that describes them as deceased. If those status statements conflict, check the identity and wording before using either as a bound. Look for the spouse listed as surviving in a death act and for parents described as living or deceased in their children’s marriages. Use explicitly stated co-residence to place a living parent at the date of the historical act. Group indexed births by the parents and order the children’s acts by event date and village to choose which parishes to add. A child’s death act can place a widowed parent in a different parish or supply an age to estimate a missing birth between known sibling births [S33] [S34] [S35].","sources":["S33","S34","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-neighboring-search","kind":"platform-ui","anchor":"If the bounded window runs beyond the home parish’s books or a documented widower’s prior spouse is absent from them, search other parishes indicated by the family’s record trail. In Geneteka, check coverage for each candidate parish, event type and year, including parishes across modern voivodeship boundaries. For a widow, search for remarriage under her prior married and birth surnames and compare the father’s name and widowhood in the acts. Keep remarriage open when the indexed search is empty [S36 @2026-11-22] [S31 @2026-11-22] [S32 @2026-11-22] [S33 @2026-11-22] [S37 @2026-11-22].","sources":["S36","S31","S32","S33","S37"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-press-death-outcomes","kind":"method","anchor":"When a news report lists several fatalities or potentially fatal injuries, resolve each person separately. If only one death act matches, keep the outcomes of the others open and consider later dates and other competent parishes [S38] [S23].","sources":["S38","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
