  - {"id":"S70","kind":"video","urls":["https://www.youtube.com/watch?v=SY_UaEIZ1ok"],"published":"2022-02-04","retrieved":"2026-11-22","access":"partial","rights":null,"basis":"Verified packet excerpts of the census discussion read 2026-11-22.","entry_sha256":"d190adec004be4c50b4ab9fd8e053e75863f865247e550a2525e32a0def8e9b3","claims":["C-caba04d1e06c","C-186449fe9a1a","C-55d616636ad1","C-807864338284"],"review":"reviewed"}
  - {"id":"S71","kind":"pdf","urls":["https://cms-b-assets.familysearch.org/0f/53/e26932d5c9bf5f846c594b9073dd/rootstech-1921-aoife-o-connor-slides.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reproduced household form read 2026-11-22.","entry_sha256":"a26c684aedc75ee3f76279f7985b93fd0ce79f47d4322f7b91b2d51ef69d9847","claims":["C-caba04d1e06c","C-7e366245c8ec","C-186449fe9a1a"],"review":"reviewed"}
