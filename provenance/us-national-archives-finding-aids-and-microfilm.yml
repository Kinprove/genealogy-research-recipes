claims:
  - {"id":"C-295337eda555","kind":"custody","anchor":"According to the presenter, carry the record group, inventory title or edition, and entry number together when following up a series [S2† @2026-11-21]. A finding aid’s entry number describes a series. Retain the finding aid and record group with it. Open the group’s Guide to Federal Records entry and check its finding aids and its predecessor and successor references for the dates when the function changed hands. [S3 @2026-11-21]","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-40336142b167","kind":"platform-ui","anchor":"According to the presenter, choose a search field that matches the locator you have [S1† @2026-11-21]. In the Microfilm Catalog, browse or search by publication number when known. In Advanced Search, use a distinctive title fragment, the record group, or an applicable subject field. Open Important Publication Details for the pamphlet or roll list. Use its actual title, contents and arrangement to choose a roll. Check Viewing Location for that publication. [S4 @2026-11-21] [S5 @2026-11-21]","sources":["S1","S4","S5"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7587e68c9c92","kind":"portal-availability","anchor":"Keep the description, roll list and actual images distinct. For a partner listing, check the publication row and verify that the named partner opens the target roll. For catalogue access, follow the series to the National Archives Catalog and open the actual digital objects. If an image is absent, record the host, publication number and roll you checked and use the film’s viewing locator. [S6 @2026-11-21] [S7 @2026-11-21]","sources":["S6","S7"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-catalog-collection-search","kind":"platform-ui","anchor":"According to Lisa Louise Cooke, start the National Archives Catalog search with the record type or collection [S8† @2026-11-22]. Start in **All Records** so you can see descriptions without images. Once you have the series, search within it. Use **Available to access online** when you specifically need digitized material. [S9 @2026-11-22]","sources":["S8","S9"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-aad-file-search","kind":"platform-ui","anchor":"For a structured electronic series, check the Catalog description’s **Online Resource(s)** for an Access to Archival Databases (AAD) link [S10 @2026-11-22]. Open the relevant file and use its available fields. According to Cooke, look for fields such as person, place or date [S8† @2026-11-22]. Read the file’s data layout and open the full record for any promising hit. A zero result applies to the file and fields searched. [S11 @2026-11-22]","sources":["S10","S8","S11"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-history-hub-leads","kind":"portal-availability","anchor":"When a series locator is unclear, search Open History Hub for the record group or series title to find imported History Hub answers. According to the presenter, use those answers as leads for where to look next [S12† @2026-11-22]. Verify any suggested locator against the finding aid or catalog. [S13 @2026-11-22]","sources":["S12","S13"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-foreign-claims-file","kind":"custody","anchor":"For a Foreign Claims Settlement Commission decision, use the claims program to choose the series in Record Group 299. Look for a scanned name index under the description’s **Online Resources** if you lack a claim number. According to the presenter, carry the number from the decision into the search for the underlying papers [S14† @2026-11-22]. Give the claims program and claim number to the National Archives if you need to request the file. [S15 @2026-11-22]","sources":["S14","S15"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-microfilm-opening-frames","kind":"method","anchor":"If a partner’s browse label leaves the unit or dates unclear, read the opening frames of the roll for its title page, roll notes and targets. According to the presenter, look there for the introduction or roll list [S16†]. If the full roll list is missing, check the first roll and the standalone descriptive pamphlet. [S17]","sources":["S16","S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-confederate-prison-roll","kind":"example","anchor":"For Confederate prisoners of war in M598, start with the pamphlet. According to the presenter, use its prison or station listing to select the registers [S18†]. If you cannot place the prisoner at one institution, check the sections for records covering all prisoners or several prisons. [S19]","sources":["S18","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-draft-board-boundaries","kind":"example","anchor":"For a World War I draft card, locate the registrant’s board before choosing a roll of M1509. According to the presenter, use the boundary maps in M1860 to place an address in a board district [S20†]. Check that the maps cover the city or county before using them. [S21]","sources":["S20","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-navy-muster-roll-number","kind":"example","anchor":"For early USS Constitution muster rolls, use T829. According to the presenter, start with the National Archives’ Navy muster-roll guide [S22†]. Then distinguish muster rolls from payrolls in the T829 roll list. For the muster roll dated 1803–1824, select roll 90. [S23] [S24]","sources":["S22","S23","S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-partner-table-filters","kind":"platform-ui","anchor":"In the digitization partners table, match the publication number or series title. According to the presenter, look up a known number such as T829 or an exact record group [S22† @2026-11-22] [S14† @2026-11-22]. Try the table’s zero-padded form T0829 if T829 returns no match. Filter the downloadable spreadsheet to the exact group if sorting leaves the result unclear. Follow the link in the **Series Title** column for Catalog images or the relevant partner’s link for its copy. **Partial** indicates incomplete Catalog coverage. Check the item or roll you need. If no row matches, continue with the record group’s finding aid. [S7 @2026-11-22]","sources":["S22","S14","S7"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-catalog-status-scope","kind":"portal-availability","anchor":"The availability status describes the National Archives Catalog. According to the presenter, check the named partner directly even when the table shows a negative status [S22† @2026-11-22]. If the link fails, search the partner’s catalog by publication title and check the roll in your own access session. [S7 @2026-11-22]","sources":["S22","S7"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-army-returns-partner-check","kind":"portal-availability","anchor":"According to the presenter, check Ancestry for the Regular Army returns on M727 (artillery regiments, 1821–1901), M728 (field artillery batteries and regiments, 1901–1916) and M744 (cavalry regiments, 1833–1916), which the Archives 1 guide lists under Ancestry even though the table labels them **Not available**. [S14† @2026-11-22] [S16† @2026-11-22] [S7 @2026-11-22] [S26 @2026-11-22]","sources":["S14","S16","S7","S26"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-worldcat-microfilm-holdings","kind":"platform-ui","anchor":"According to the presenter, search WorldCat for the full microfilm publication title [S22† @2026-11-22]. Open the microform edition, then check the holding library’s own catalog for the branch, call number and target roll before planning a visit. [S25 @2026-11-22]","sources":["S22","S25"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-archives-one-pull","kind":"custody","anchor":"For Archives 1 in Washington, DC, use the Microfilm Reading Room for the facility’s self-service film. For originals, arrange an advance consultation with Archives 1 Reference and confirm whether an advance pull is available. If arriving without an advance pull, ask the consultation desk how to complete the pull slip and when the records can be ready. [S27 @2026-11-22] [S28 @2026-11-22] [S29 @2026-11-22]","sources":["S27","S28","S29"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-on-site-partner-access","kind":"fee","anchor":"If you need subscription access to a partner copy, open Ancestry or Fold3 through the National Archives’ **Online Databases** links on a facility workstation. According to Cooke, on-site access is free of charge [S8† @2026-11-22]. [S30 @2026-11-22]","sources":["S8","S30"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-aad-direct-route","kind":"platform-ui","anchor":"According to the presenter, AAD is a starting point for selected electronic records [S36† @2026-11-23]. If you have a record type and no Catalog locator, open AAD from NARA’s [Online Research Tools and Aids](https://www.archives.gov/research/start/online-tools) and browse for a matching series. Check what the series covers before choosing a file. [S37 @2026-11-23]","sources":["S36","S37"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-wra-aad-locator","kind":"portal-availability","anchor":"According to Cooke, look in AAD for World War II incarceration records [S8† @2026-11-23]. In **Records About Japanese Americans Removed During World War II**, search the names used at the War Relocation Authority (WRA) camp, including Japanese and English names when applicable. From the full hit, record the name as indexed, birth year, camp and individual number. Use the numeric part of the individual number to look for other possible family members. For a birth in camp, check the WRA case-file guide even if AAD returns no hit. [S33 @2026-11-23] [S34 @2026-11-23]","sources":["S8","S33","S34"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-wra-case-file-request","kind":"custody","anchor":"Use the WRA case-file request form for the underlying *Evacuee Case Files* (RG 210, entry PI-77 22, NAID 891305). Carry the subject’s names and camp from the hit and verify the full birth date for the form. If the subject was another family member, include the head of family’s name and birth date. Check the form’s DOJ-361 requirements for a living subject or its proof-of-death requirement for a deceased subject. [S34 @2026-11-23] [S35 @2026-11-23]","sources":["S34","S35"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-confederate-citizens-jackets","kind":"portal-availability","anchor":"For a supplier to the Confederate government, use M346, *Confederate Papers Relating to Citizens or Business Firms* (Record Group 109). Find M0346 in the digitization partners table and check the Fold3 copy in your session. [S7 @2026-11-23] According to the presenter, search by the supplier’s personal or business name and try a first initial with the surname as well as the full given name [S31† @2026-11-23]. If the search misses, browse the roughly alphabetical jackets under both forms. If the firm name yields no jacket, also check the name of a company officer or agent. Record the roll and jacket heading. [S32 @2026-11-23]","sources":["S7","S31","S32"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
