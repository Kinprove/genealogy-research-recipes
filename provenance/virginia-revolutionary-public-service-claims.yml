claims:
  - {"id":"C-5a1e0c3b7d21","kind":"historical","anchor":"Use this recipe when a person may have supplied provisions, other goods or a service to the Revolutionary forces in Virginia and claimed reimbursement from the state. It also applies when your clue is an entry in Abercrombie and Slatten's *Virginia Revolutionary \"Publick\" Claims*, a Library of Virginia (LVA) index hit, or a person called a commissioner in claims papers. The claims repaid Virginia residents for goods and services supplied to the militia, State Line and Continental troops, and LVA states that they were not payments for military service. [S2]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8b47f2a9e630","kind":"custody","anchor":"- Reading a public service claim as military service. It shows property or a service supplied and its value, not enlistment. [S2 @2026-11-16]\n- Stopping at Abercrombie and Slatten. The printed set transcribes the court booklets for 69 of the 75 counties then in existence. The certificates and the Commissioner's Books are separate series and are not in it. [S2 @2026-11-16], [S4 @2026-11-16]\n- Treating the claimant as the supplier. A certificate holder could assign the right to reimbursement, and the assignment was often written on the back of the certificate. [S2 @2026-11-16]\n- Treating a miss in the index or on FamilySearch as proof that no claim was made. Rejected claims were never microfilmed, and some records of the reimbursement process are not indexed. [S2 @2026-11-16]\n- Assuming that a commissioner was appointed by the county court or served for the whole war. The provision acts gave the appointment to the governor and council or to the state commissioner, and each act ran for a limited term. [S7 @2026-11-16], [S8 @2026-11-16]","sources":["S2","S4","S7","S8"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c9d4e7f1a85","kind":"portal-availability","anchor":"Search LVA's Revolutionary War Public Service Claims Index, not only the printed volumes. It includes every individual claim record in three microfilmed series of the Auditor of Public Accounts (APA), but some records of the reimbursement process are not in it. [S2 @2026-11-16] The three series are:","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e3f6a0b8c912","kind":"custody","anchor":"- **Court booklets, indexes and lists (APA 242):** 1779–1788, mostly 1780–1783, reels 1–17, arranged by county. After the court approved a claim and set its value, the clerk entered it in a booklet sent to the claims commissioners in Richmond. [S2 @2026-11-16], [S3 @2026-11-16]\n- **Certificates (APA 241):** 1780–1783, reels 18–35, arranged by name within each county. The certificate was the receipt given when goods or a service were taken. It gives the name, the date, the item or service and its set value, and any assignment is often on the back. [S2 @2026-11-16], [S3 @2026-11-16]\n- **Commissioner's Books (APA 243):** 1783, five books on reels 36–37. The commissioners recorded each approved claim with the name, the goods or services and their value, and the date payment was authorized. The claimant took the resulting warrant to the state treasurer's office for payment or a state tax credit. [S2 @2026-11-16], [S3 @2026-11-16]","sources":["S2","S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-71d5b2e4f0a3","kind":"method","anchor":"A 2022 Just Genealogy live stream pointed out that the printed claims cover only one series of the public claims records (cited from transcript quotations; the recording was not inspected). [S1†] Treat a hit in the printed abstracts as one series, then pull the same claimant from the certificates and the Commissioner's Books. Those two series are not part of the printed work. [S4]","sources":["S1","S4"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-a96c3d8e2b14","kind":"method","anchor":"Keep one row per series for each claim: series and APA number, county, reel, and the item's position. For the Commissioner's Books the index gives the book number and page. [S4] Record the supplier, any assignee and the person who presented the claim as separate roles. Record the certificate date, the court's allowance and the date payment was authorized as separate events.","sources":["S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4f0b7e1c9d62","kind":"portal-availability","anchor":"The three microfilmed series are digitized on FamilySearch. LVA notes that select records there can be viewed only at Family History Centers or affiliate libraries, including LVA, and that most indexed claim records can be borrowed on microfilm through interlibrary loan. [S2 @2026-11-16] If an image is restricted, log the restriction and the route you will use to see it.","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d2e8a4f6c137","kind":"custody","anchor":"Rejected claims have not been microfilmed, and LVA says they can be viewed in its Archives Research Room. [S2 @2026-11-16] Check them when a claimant is missing from all three series, or when a claim never reaches the Commissioner's Books.","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0b5c9e3a7f48","kind":"method","anchor":"The live stream advised having offline material examined or photographed on site (cited from transcript quotations; the recording was not inspected). [S1†] That advice now fits the rejected claims and the unindexed process records, not the three microfilmed series, which are digitized. [S2]","sources":["S1","S2"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c7a1f5d9e286","kind":"portal-availability","anchor":"1. Get the catalogue citation for what you need: the collection title and accession number of the rejected claims or of the unindexed process records. Every request below depends on it.\n2. Ask Archives Reference Services (<archdesk@lva.virginia.gov>) to confirm the citation and that the material can be served. LVA's research-room rules ask visitors to confirm availability before they come. [S2 @2026-11-16], [S6 @2026-11-16]\n3. Book a Virtual Reading Room appointment to see the material remotely. The service is free. In a one-hour Zoom session, staff page through one box, one bound volume, up to three single accession folders or one microfilm reel, then photograph up to 10 pages you choose and email them to you. The booking must name the collection title and/or accession number (and the box for larger collections), or it is cancelled. Book by the Thursday before, at most a month ahead. [S5 @2026-11-16]\n4. Or view it in the Archives Research Room. Researchers aged 16 or older need a Library of Virginia card. Photographs for personal research are allowed, but personal scanners and flash are not. Originals are not served when a legible microfilm or digital copy exists, so expect the film for the three microfilmed series. [S6 @2026-11-16]","sources":["S2","S6","S5"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-96e4b0a2d3f7","kind":"historical","anchor":"The county court was where a claim was first heard. A November 1781 act empowered every county court to receive all claims against the public and to fix the value of impressed articles in specie, independent of any earlier valuation. The court also separated articles used for Continental purposes from those used for the state, and sent a transcript of its proceedings to the next assembly. [S9] Later acts changed the deadlines, and the courts' power to receive claims stayed open until 1 September 1787. [S10]","sources":["S9","S10"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3d8f1c6b0e59","kind":"method","anchor":"Read the county's own order or minute books for the sessions in which claims were heard. Do this when the booklet is missing or hard to read, when the county is not in the printed set, or when the claim may have been presented after 1783. LVA's guide lists a Louisa County volume of public service claims transcribed from the court order books for 1774–1783 and the minute book for 1784–1787. [S2]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f1a7d3e9b504","kind":"method","anchor":"When your person is called a commissioner, or signed certificates, do not assume that he held one office from appointment to the end of the war. A 2022 Just Genealogy live stream made this point and suggested bounding the term by the appointment and the successor's appointment. It looked for the appointment in the county order books, or in the executive papers if the state made it (cited from transcript quotations; the recording was not inspected). [S1†] Under the acts below, the appointment came from the governor and council or from the state commissioner, not from the county court. [S7], [S8] First identify which office the papers mean:","sources":["S1","S7","S8"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-58c2e6a0f9d1","kind":"historical","anchor":"- **Provision-law commissioner, 1780.** The act of May 1780 let the governor, with the advice of the council, appoint commissioners in the counties he judged necessary. They could buy or seize provisions and gave certificates for them. The act was to stay in force only until ten days after the next session of the assembly began. [S7] A single commission could be narrower still. One issued in Council on 8 October 1780 covered supplies for one regiment on its march and ended when that task was done. It required duplicate lists of every certificate given, by owner, article, price and date. [S11]\n- **State commissioner and county deputies, 1781.** In its October 1780 session the assembly revived the expired act. The governor, with the advice of the council, appointed one commissioner. He could appoint a deputy in any county where he judged one necessary and remove him at pleasure, and each deputy kept the accounts for his county. The act ran to the end of the next session. [S8] On 3 February 1781 the Council advised that the commissioner, John Browne, be directed to appoint a deputy in each county. [S12] A county deputy or assistant in 1781 owed his post to the state commissioner.\n- **Claims commissioners, 1783.** A May 1783 act had the courts certify claims to two commissioners appointed in aid of the auditor. An October 1783 act discontinued them and sent the returns to the auditor. [S10] The Commissioner's Books are their record (§1).","sources":["S7","S11","S8","S12","S10"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b0d9f4c7a3e6","kind":"custody","anchor":"Look for the appointment in the executive records first. LVA's Governor's Letters Received index covers letters and other documents received in the Governor's Office from 1776 to 1784, searchable by personal name, date, subject or place. [S13 @2026-11-16] Read the Council's journal for the dates you need: the Jefferson editors cite the Council's advice on Browne's deputies to *Va. Council Jour.*, ii, 285. [S12 @2026-11-16] Commissions can also survive outside LVA. The 8 October 1780 commission is known from a transcript in a War Office letter book, which the editors locate at MiU-C. [S11 @2026-11-16]","sources":["S13","S12","S11"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
