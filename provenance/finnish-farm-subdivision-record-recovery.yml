  - {"id":"S1","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/08/kokemaki-paikannimena-kankaanpaa.html"],"published":"2026-09-10","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Community case linking a named share in communion books to survey papers filed under Ristiluoma. This is the author’s account of the case, including the quoted archival locator. Read 2026-11-22.","entry_sha256":"9f3cfe693a76d2a17e20da5f2b1ad78340dd7dc68c14e0d7f14a5c9189c9ab64","claims":["C-01","C-02","C-03","C-04"],"review":"reviewed"}
