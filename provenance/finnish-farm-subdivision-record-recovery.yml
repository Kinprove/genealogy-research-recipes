claims:
  - {"id":"C-01","kind":"method","anchor":"Check the communion books for the share under its parent holding. Copy the share name and any manttaali figure with the page and register span. Keep the manttaali figure separate from any ownership fraction stated in a division document [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"portal-availability","anchor":"In Astia, browse *Maanmittaushallituksen uudistusarkisto* → *Uudistuskartat ja -asiakirjat* by historical province, municipality and village. A missing share name in the survey index leaves the subdivision unresolved. Check the land register by village and parent holding, then browse the parent holding’s survey map and associated papers for the division minutes [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S1","S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"example","anchor":"Kyläkoski reports following Kokemäki to the papers for its parent holding at `A25:1/61-65 Alahonkajoki, N:o 13 Ristiluoma`, where a copy of the minutes accompanied the map [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"If the survey minutes recite an earlier inheritance division, extract its date, parties and fractions received or retained. Keep the recited event separate from the date, parties and parcel identifiers of the survey proceeding. Record whether you inspected a copy or the original minutes [S1], [S2], [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
