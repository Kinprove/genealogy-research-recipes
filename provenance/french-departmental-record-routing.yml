  - {"id":"S60","kind":"pdf","urls":["https://archives.maine-et-loire.fr/fileadmin/rechercher_consulter/conseils_recherche/FICHE_LES_ARCHIVES_DES_NOTAIRES_2021.pdf"],"published":null,"retrieved":"2026-11-13","access":"read","rights":null,"basis":"read 2026-11-13","claims":["C-a5f1dc38b214"],"review":"reviewed","entry_sha256":"c68ea2890c6f998f67fdde2bc361fda55be0f07c71b5927847aa02cf16d38201"}
  - {"id":"S61","kind":"web-page","urls":["https://neogenea.fr/couverture.html"],"published":null,"retrieved":"2026-11-13","access":"read","rights":null,"basis":"read 2026-11-13","claims":["C-9a52bea2f437"],"review":"reviewed","entry_sha256":"2e78205c67de709cc8bc585e07afa44565f27effa407d83c4b836898ba569a84"}
claims:
  - {"id":"C-2516e2b8d839","kind":"unclassified","anchor":"- **Send each search to an Archives départementales (AD), not to a national index.** Older civil registers, census lists, military registers, Enregistrement tables and notarial minutes are kept by the AD, each with its own website and series. The Ministry of Culture publishes a directory of public archive services as open data [S4].\n- **Fix the commune's département on the event date and today.** When the two differ, start from today's AD and read its finding aid for where the series for the event date are held.\n- **Date French civil registration from 1792.** The law of 20–25 September 1792 moved registration from the parish priest to the mayor. Separate civil registers begin in 1793. For an act of September–December 1792, also look at the end of the 1792 parish register, where the law placed the first civil acts. The law required each register to be kept in two identical copies, one in the commune and one at the civil court's registry (*greffe*) [S56].\n- **Use the ten-year tables (*tables décennales*) to find an act without an exact date.** They were drawn up every ten years from 1803, but the first table's years differ by département: in the Maine-et-Loire the first table covers 1793–1802 [S56]; in the Côtes-d'Armor the first table starts in 1802 [S18]. Take the first table's years from the AD you search. Women are listed under their birth names, and marriages are often indexed under the husband's name only [S56].\n- **A Paris event before 1860:** the registers were destroyed in May 1871. Use the reconstructed acts; see [French and Belgian civil act extraction](french-belgian-civil-act-extraction.md#check-a-paris-reconstructed-record-branch).\n- **Read series letters as a département's own classification.** Take each cote from that AD's finding aid, not from another département's. The series codes in steps 5, 7 and 8 are single-AD examples.\n- **Fix the 1871–1918 annexation before routing a north-eastern commune.** The Treaty of Frankfurt ceded Bas-Rhin, Haut-Rhin except the Belfort area, most of the pre-1871 Moselle département, about one-third of Meurthe (the Château-Salins and Sarrebourg areas), and the Vosges cantons of Schirmeck and Saales [S15]. Saales was partitioned: the part left in France became the canton of Provenchères-sur-Fave [S17].\n- **Place a former Meurthe commune before you route it.** The annexed Château-Salins and Sarrebourg areas joined Moselle [S16]. Do not assume which AD holds its pre-1871 registers: resolve the commune in the place-name recipe, then read the finding aid of its present AD.","sources":["S4","S56","S18","S15","S17","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6a494536ef2f","kind":"unclassified","anchor":"- **Open birth and marriage registers 75 years after the register closed, or 25 years after the person's death if that comes first** (Code du patrimoine, art. L213-2 I 4° e) [S12], [S13]. For a marriage, the 25-year rule runs from the death of both spouses [S14].\n- **Treat death acts as open at once.** Anyone may request one without giving a reason [S13], [S14]. A 25-year limit applies only to putting death acts online, so an online series can stop short of years that are open on request [S13].\n- **Do not report a closed act as missing.** For a more recent birth or marriage, the person, the spouse, ascendants, descendants or a legal representative request a full copy (*copie intégrale*) or an extract with filiation (*extrait avec filiation*) from the mairie. Anyone may obtain an extract without filiation (*extrait sans filiation*) [S14].\n- **Compute the window from today's date** and the register's closing year, and record it with the result.","sources":["S12","S13","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7cc3aa68fe00","kind":"unclassified","anchor":"- **Search INSEE's Fichier des personnes décédées (file of deceased persons) for a death from 1970 on.** It is free open data, published by INSEE under the Licence Ouverte [S1]. It holds deaths registered by INSEE, including some deaths abroad; INSEE warns that 1970–1975 may have gaps [S1].\n- **Read the fields it gives:** date of birth, birth place code with the birth commune, or the birth country for a birth abroad, date of death, death place code, and the death act number [S1]. Use it to date a recent death or to find an emigrant's foreign birthplace.\n- **Search it through deces.matchid.io.** This independent search engine over the INSEE open-data file has run since January 2020 [S2], [S3]. It is not an INSEE service.\n- **Search several name forms.** Try the name with and without a second surname and without accents. Each monthly file is published once and not corrected afterwards [S1], so a misspelled entry stays misspelled.\n- **Order the act with its number** (step 2): for a death in France, from the mairie of the death place or of the last domicile; for a death abroad, from the foreign-affairs ministry for a French national, otherwise from the authority that issued the act [S14]. INSEE says the file must not be used to certify anyone's vital status [S1]; cite the act, not the file.","sources":["S1","S2","S3","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12694460df7b","kind":"unclassified","anchor":"- **Search the Enregistrement tables des successions et absences (tables of estates and absences) for the area.** They are usually in sub-series 3 Q, kept by registration office (*bureau d'enregistrement*) and alphabetical by the deceased's surname [S7], [S8]. Some later volumes sit in W accessions [S8].\n- **Expect the span to vary by AD.** In the Finistère they run from 1825 and give way to death cards (*fiches décès*) from 1969 [S7].\n- **Read what an entry gives:** date of death and domicile, the surviving or predeceased spouse in tables opened from about the late 1880s, and the date of the succession declaration, with its number in later tables [S7]. Entries are not always complete [S8].\n- **Follow the declaration date into the registre des mutations par décès (register of transfers on death)** of the same office [S7], then order the death act from the commune the domicile points to.","sources":["S7","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-78294ac73ec7","kind":"unclassified","anchor":"For a person independently connected with the Martinique disaster, carry the name and\nfamily clues beyond the victim index. The 2024 presentation describes an incomplete list\nassembled from civil registration at the Archives nationales d’outre-mer (ANOM) and death\njudgments registered at the Fort-de-France court [S44]. These are two record targets.","sources":["S44"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fb37ae2df86b","kind":"unclassified","anchor":"- **Expect a list every five years from 1836 to 1936, then 1946.** The 1871 census was taken in 1872 and none was taken in 1916 [S5].\n- **Find the lists by commune and year.** Up to 1936 they are often in sub-series 6 M [S5], [S6]; in the Côtes-d'Armor the 1946 lists are in a W series [S5]. Inside a commune they run by street and household [S6].\n- **Read the columns of the year you open.** The lists give names and occupations [S6]; the role in the household (head, wife, children) is given only from 1881 [S5]. Other columns change by year: birthplace and nationality are absent from 1856 to 1866, and from 1906 a birth date replaces the age [S5]. Do not expect a birthplace in every year.\n- **Browse, do not name-search.** Most years have no name index. A few have one, such as the Côtes-d'Armor 1906 census indexed by a local genealogy centre [S5]. Without an index, read the commune household by household, and record a miss only after reading every page of that list.","sources":["S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9a52bea2f437","kind":"portal-availability","anchor":"- **Compute the classe as birth year plus 20.** The registers run from the classe of 1867, so men born about 1847 onward [S9 @2026-11-13].\n- **Route by recruitment bureau, not by birthplace.** Registers are kept by classe and by recruitment bureau, and a man is recorded where he lived at age 20 [S9 @2026-11-13]. Some cantons belonged to a bureau in another département, and their registers can be in either département's archives. For the classes 1867–1929, the Doubs finding aid places the registers of listed cantons of the Montbéliard and Baume-les-Dames arrondissements, enrolled at the Belfort bureau, in the Territoire-de-Belfort archives, but the 1902–1928 registers of Dole and six neighbouring Jura cantons, enrolled at the Besançon bureau, in the Jura archives [S10 @2026-11-13]. Read the finding aids of both the canton's and the bureau's départements. Search the département of his residence around age 20 first, then his birth département.\n- **Open the alphabetical table for each classe and bureau** [S9 @2026-11-13], then the register entry. Check the classes either side if the birth year is uncertain.\n- **Use Grand Mémorial as a finder for the classes of 1887–1921.** It searches the departmental registre-matricule indexes nationally and links each hit to the departmental archive's record [S11 @2026-11-13]. Coverage depends on each AD's indexing. Cite the departmental register and image, not Grand Mémorial.\n- **Search Neogenea by name where no name index covers the soldier.** For a classe outside Grand Mémorial's 1887–1921, or a département whose AD site cannot be searched by name [S46 @2026-11-13], search [Neogenea](https://neogenea.fr) by surname. It indexes registres matricules that the ADs have put online without a name index [S47 @2026-11-13]. A vision model reads the names and volunteers check the readings [S46 @2026-11-13], [S47 @2026-11-13]; on 2026-11-13 its coverage page showed fewer than half of the images reread by hand [S61 @2026-11-13]. The classes covered differ by département, and the coverage page lists them for each one [S61 @2026-11-13]: check on that page that the soldier's département and classe are covered. Treat every hit as a pointer: open the register image on the AD site and confirm the classe, bureau and matricule there. A miss in Neogenea does not prove the man is absent, and neither does a failed name search in an AD interface that expects the classe first. Fall back to routing by classe and bureau.\n- **Do not assume an Alsace-Moselle man of the annexation years has no French military record.** The First World War registres matricules of the Bas-Rhin, Haut-Rhin and Moselle were drawn up by the French administration after the three départements returned to France in 1918, to list the men who could still be called up; men killed in the war or already released from service obligations are therefore absent [S50 @2026-11-13]. In the Bas-Rhin they start with the class of 1893 [S50 @2026-11-13]. The Bas-Rhin's online alphabetical indexes start with class 1894; its registers themselves are not online [S49 @2026-11-13]. A 2017 report says the Haut-Rhin put classes 1893–1921 online, filed by recruitment bureau (Colmar or Mulhouse) [S48 @2026-11-13]. For German service the entry usually gives only the service dates or the bare words *service dans l'armée allemande* (service in the German army) [S48 @2026-11-13], [S50 @2026-11-13]. The French register cannot trace service in the German army, so take unit and service details from the German record [S50 @2026-11-13].\n- **For an Alsace-Lorraine veteran who survived, also search the ONAC files at the Bas-Rhin archives.** The Office national des anciens combattants files in 718 D and 844 D are indexed and include about 70,000 First World War files. They hold veterans'-card and veterans'-pension applications made after the decree of 28 June 1927, for Bas-Rhin residents and for Alsace-Lorrainers settled outside the three départements. A file can contain the man's original German military papers (Militärpass, Soldbuch) and German service statements [S50 @2026-11-13].","sources":["S9","S10","S11","S46","S47","S61","S50","S49","S48"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b76deb7d7a8c","kind":"unclassified","anchor":"For a corroborated earlier class and locality, check the surviving recruitment series\nbefore assuming the later matricule lookup applies. The 2025 presentation describes\nmunicipal H and departmental R as finding leads [S38]; take each cote and covered year\nfrom the actual local inventory.","sources":["S38"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bfaa0f687d88","kind":"unclassified","anchor":"1. Locate the municipal alphabetical recruitment list and preserve the commune, class\n   year, person details and entry locator actually supplied. The presentation places\n   this list in communal series H; verify its survival and custody for the commune.\n2. Follow the candidate into the canton's *tableau de recensement*, described in\n   departmental R. Compare the recorded identity details across the two entries;\n   a same-name hit does not establish that they concern the same recruit.\n3. Read that canton and class's lottery list. Copy the number, literal outcome and any\n   recorded exemption, replacement or number exchange, keeping the named parties in\n   their stated roles. A draw or a census entry alone does not establish service.\n4. Seek the *liste définitive du contingent* in the relevant departmental inventory.\n   Retain its recorded final status, dates and any destination unit or battalion; the\n   source describes a destination as a possible field, not a universal one [S38].\n5. Return the linked stages and unresolved links. A selection or final-contingent listing\n   does not by itself establish physical departure or a complete service history.\n   If the final record or destination is missing, leave it unresolved before choosing\n   a unit to trace.","sources":["S38"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-735a34510357","kind":"unclassified","anchor":"1. Choose a small interval around a supported arrival or recorded injury, death or\n   decoration, within the unit/date bounds actually documented. Distinguish assignment\n   from confirmed presence and leave gaps unresolved. Do not select a convenient unit\n   journal merely because its dates overlap the war.\n2. The 2024 presentation carries matricule-derived regimental information to the\n   histories and *journaux de marche et d'opérations* (JMO) on Mémoire des Hommes [S37].\n   Verify the actual journal's unit and date coverage, then inspect the selected pages.\n   Keep the journal date and page/image locator separate from the personal record.\n3. Record what the journal states about the unit, and about an individual only where\n   it actually identifies that person. Compare the unit context with the matricule's\n   transitions and preserve conflicts. A unit action is not automatically the soldier's\n   participation, and the journal may omit him entirely.\n4. Return the bounded interval, pages inspected and resulting unit context, with any\n   unavailable, uninspected or uncertain stretch explicit. Do not fill the soldier's\n   personal chronology from the regiment's whole wartime narrative.","sources":["S37"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ff599547af2e","kind":"unclassified","anchor":"- **Expect one copy before 1667.** The Ordonnance de Saint-Germain-en-Laye of 1667 required parish registers to be kept in two copies, one sent to the court registry (*greffe*) [S18].\n- **Expect patchy greffe copies from 1667 to 1736.** The royal declaration of 9 April 1736 restated the duty because it had been widely neglected, and required two registers, both authentic [S19]. In the Gard the greffe collection starts between 1667 and 1736 depending on the parish [S20].\n- **When one copy is lost or damaged, look for the other in a different series.** The parish original usually sits in the communal fonds (GG, then E) or E-dépôt; the greffe copy forms its own E sub-series [S18]. In the Côtes-d'Armor the greffe copy of the parish registers is in 6 E (7 E holds the civil registers) [S18]; read each AD's finding aid for both copies.","sources":["S18","S19","S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1760be691dd0","kind":"unclassified","anchor":"For a known northern French or Picard town and a lineage gap before parish registers,\nselect its *registre de réception* or *livre de bourgeoisie*. The 2026 presentation\ndescribes chronological civic admissions, possible filiation and published transcriptions\nof these books [S45]. Civic status itself does not establish the proposed parent.","sources":["S45"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-01f31d383336","kind":"unclassified","anchor":"- **Look for minutes over 75 years old in the AD.** Take the sub-series from that AD's finding aid; the Nièvre, for example, files them in 3 E [S22]. Younger minutes usually stay with the notary's office [S21].\n- **Send only Paris intra-muros notaries to the Archives nationales.** Their minutes go to the Minutier central; notaries elsewhere, the Paris suburbs included, deposit with their AD [S21].\n- **Search by notary, not by client.** Identify the notaries working in the place and period, then read each one's chronological répertoire (*répertoire*), kept alongside the minutes [S21]. Use a name index only where one exists for that notary.\n- **Expect marriage contracts and inventaires après décès (post-mortem inventories)** among the minutes; the Archives nationales publish a series of Minutier central inventaires après décès [S23].","sources":["S22","S21","S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5a270cb188a9","kind":"unclassified","anchor":"Keep the fiscal case, named person and parcel as separate references. The 2024 presentation\nwarns that a case can continue after a death and omit intermediate heirs [S39]. Use the\nentry as a retrieval lead, not as proof of an unbroken ownership or complete heir list.","sources":["S39"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd5ca43579a1","kind":"unclassified","anchor":"1. Copy the recorded name and dated parcel information. Select the historical mortgage\n   bureau covering the commune and the period from its actual inventory. The\n   Côtes-d'Armor guide describes a name-based search: a cadastral reference first supplies\n   a person's name, rather than directly identifying a mortgage account [S40].\n2. Follow the bureau's *registre indicateur* from surname to the alphabetical table's\n   volume and folio; identify the person there and copy the repertoire volume and case.\n   The mortgage case is a person's account, not the cadastral case [S40]. Preserve both\n   locators and resolve namesakes before joining them.\n3. In that account, distinguish transcriptions from credit inscriptions. Follow any\n   continuation account and retain the transcription volume/article and date [S40].\n   The entries are not identified by parcel: inspect candidate acts within the supported\n   period and compare their property descriptions rather than choosing by name alone.\n4. Convert the fiscal volume reference to an archival cote through that bureau's\n   inventory, then obtain the complete transcription [S40]. Use any actual notary/date\n   reference to seek the minute through the route above. Keep the two copies distinct.\n5. Compare the inspected act's parties and stated succession roles with the fiscal entry\n   and other evidence. Reuse [land-index recovery](land-index-book-series-recovery.md)\n   for the full-instrument inspection and [tax observations](tax-roll-observation-workflow.md)\n   for fiscal capacity. A missing heir in the matrix proves neither exclusion nor title.","sources":["S40"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6b192597d8b0","kind":"unclassified","anchor":"- **Old core:** use a *calepin des propriétés bâties* for the recorded owners, occupants\n  and building description, and a *sommier foncier* for mutation references [S39], [S41].\n  These sources overlap: the official guide lists sommier periods 1809–1859, 1859–1880\n  and 1880–1945. Do not stop the sommier search at 1852 when calepins begin.\n- **Search the address as indexed for that period.** The guide indexes calepins under\n  both the historical arrondissement or commune and the present location [S41]. Keep\n  each returned cote and date span; an address match is not yet a person match.\n- **Carry the sommier's actual mutation date, nature and notary into the minute search.**\n  Its property entry is the bridge to the notary [S39], [S41]; retain the referring\n  entry and the separate notarial act, including any conflicting names or dates.\n- **A commune before its 1860 annexation:** select its cadastral records instead of\n  assuming the old-core route applies [S39]. Compare intermediate dated plans when\n  urban change prevents a secure parcel/address match; leave uncertain links open.\n- **Check access before ordering.** The official page opened 2026-11-05 warns that\n  D1P4 before 1901 is inaccessible because of asbestos [S41]. A descriptive hit does\n  not establish that a calepin can be inspected; record its actual access status.","sources":["S39","S41"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-012d6269524e","kind":"unclassified","anchor":"- **Take early-1939 camp lists from the Archives nationales, not the department.** The Pyrénées-Orientales departmental archives hold no nominative data for the crossing of January–February 1939 and the months after; their nominative data run from September 1939 to November 1942 [S24]. For Argelès, Sûreté nationale series F/7/14731 at the Archives nationales holds nominative lists and individual notices from 2 February 1939 to 17 May 1940, including the first arrivals of 31 January to 2 February 1939 [S25], [S28]. F/7/14732 covers Barcarès and F/7/14733 Saint-Cyprien and other Pyrénées-Orientales sites [S28]. These lists are partial [S25]: a miss in them is not a negative.\n- **Search the department's camp name database and its list of internee files,** both linked from its camp resources page [S24]. In the prefecture fonds, 109 W 330 holds nominative lists for the Argelès-sur-Mer camps, 1939–1940 [S25]. The Argelès camp memorial holds no internee lists itself [S25].\n- **Check the Archives nationales police card files for a refugee with a French police file:** the Sûreté nationale central file, individual files to 1940 [S27], and the administrative police file, about 150,000 files opened from March 1941 to 1949, which records internment, transfer and release [S26]. These are individual police files, not camp lists.\n- **Search OFPRA's online Spanish refugee card file (*fichier espagnol*, archives.ofpra.gouv.fr) for a refugee who sought protection from 1945.** It holds 185,646 cards, compiled from 1945, when the Office central des réfugiés espagnols was created [S52], [S53]. A 1939 arrival appears only if they applied from 1945 on. Create a personal account first: OFPRA staff validate it on working days, and the card images open only after that [S52]. Search a woman under both her married and her birth surname [S51]. A card records civil status, birthplace, place of residence and occupation [S53]: read the census list for the residence (step 5) and carry the birthplace to Spain. The card points to a paper case file, which you can consult only in OFPRA's reading room [S52], [S53].\n- **Ask OFPRA's Mission histoire whether a case file stands behind the card.** Send the archives access form to `mission-histoire@ofpra.gouv.fr`. Its finding aids are closed to the public, so staff run the name search and answer only whether a file exists, normally within 1 to 2 months; they do not research its contents for you. If one exists, they offer a reading-room appointment [S51], [S53]. OFPRA is moving its archives: routine search requests received after 30 October 2026 must be resubmitted from 26 February 2027, and the reading room is closed from 30 November 2026 until its planned reopening on 26 February 2027 at 198 rue Carnot, Fontenay-sous-Bois [S55]. You may photograph documents open to consultation; name files open 50 years after their last document, and earlier ones need an exemption request [S54]. Then read the AD's own M or W inventory for a foreigner file and resident card, and the Archives nationales for a naturalization file [S51].\n- **Carry the search back to Spain** from the birthplace or identity these files give.","sources":["S24","S25","S28","S27","S26","S52","S53","S51","S55","S54"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ce0b7d71a2ef","kind":"unclassified","anchor":"Search the person's marriage and death acts, including their margins, and the reported\nadoptant's succession papers for an adoption-judgment date or reference. The 2022 adoption\npresentation identifies these places as possible sources of the judgment date [S29].\nUse the succession-table route in step 4 when it supplies a declaration to inspect;\ndo not assume the table itself contains the adoption reference.","sources":["S29"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4c3b8194c6a4","kind":"unclassified","anchor":"- Copy the judgment date and any court, parties or locator actually written, beside the\n  referring act's own date and image. Keep an unreadable or absent court unresolved.\n- With those details, ask the relevant archive to identify the historically competent\n  court, surviving judgment series and request conditions for that period. A date alone\n  does not identify a court, and this route supplies no universal adoption-series code.\n- Keep the judgment as a separate retrieval target. Do not apply the civil-register\n  access calculation in step 2 automatically to it or to an earlier birth act replaced\n  after adoption; confirm the applicable conditions with the custodian.\n- Report the reference found and whether the judgment was requested, inspected,\n  unavailable or still unidentified. Upbringing does not establish adoption. Use\n  [evidence/proof judgment](evidence-proof-judgment.md) to keep any documented legal\n  parentage distinct from biological descent.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-61b87eb27bca","kind":"unclassified","anchor":"In a French Basque inquiry, test a house-entry explanation when the records show a name\nchange across marriage. The 2022 names presentation describes a man entering an heiress's\nhousehold and using her surname, itself a house name [S30]. Treat that as a hypothesis\nfor the particular couple, rather than a rule for every family, period or inheritance.","sources":["S30"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-71d92979f49b","kind":"unclassified","anchor":"1. Keep the person's earlier surname, spouse's surname and house name as separate fields,\n   each with its dated source and commune. Preserve any wording for entry into the house.\n2. Retrieve the marriage entry. Use step 8 to locate the relevant notary and any surviving\n   marriage contract, inheritance instrument or post-mortem inventory described for that\n   place and period. Follow an actual reference to house or succession papers; if no\n   reference or custody is established, leave that target unresolved.\n3. Compare the spouses, stated parents, dates, house wording and succession roles across\n   the inspected documents. Record which document connects the earlier name to the later\n   household, and which links remain hypotheses. A same-named house can have successive,\n   unrelated occupants; a house label alone does not identify a person or establish title.\n4. Return the name-and-house sequence with its supporting locators and missing links.\n   Do not turn surname frequency into origin evidence, or house-name continuity into an\n   uninterrupted paternal line. A claimed heiress's status or property right still needs\n   documentary and historical legal support.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-71cb00ff49a0","kind":"unclassified","anchor":"When a historical Breton marriage says a party is *décrété* or names a *décret de justice*,\ncopy that wording and any jurisdiction, seat and date before searching only notarial\nminutes. The 2022 presentation describes a judicial marriage-consent route for a party\nunder 25 whose father had died, with a sénéchal rather than a notary recording it [S31].\nConfirm that context for the actual party and period; the label alone does not establish it.","sources":["S31"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-06c58918b95a","kind":"unclassified","anchor":"Start from an independently identified applicant and the supported application commune.\nThe 2026 presentation describes requests passing from the mairie to the préfecture and\ncentral administration, with departmental communal lists in M or sometimes R and\nseparately surviving individual packets assembled by mayors [S32].","sources":["S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dde9009d44a5","kind":"unclassified","anchor":"Record the medal's actual inscription, any named recipient, date, class and whether it is\na table medal or a wearable decoration. The 2022 presentation distinguishes these forms\nand describes different responsible administrations over time [S33].","sources":["S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-885095393817","kind":"unclassified","anchor":"Keep the independent award clue, identified person and plausible award period even when\nLéonore returns no dossier. The 2024 presentation names two published alternatives:\nthe five-volume *Fastes de la Légion d’honneur* (1845) for early promotions, and\n*Bulletin des lois* nomination announcements from 1818 [S42].","sources":["S42"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c34ad4cd71ee","kind":"unclassified","anchor":"1. Select the publication whose period covers the clue. Search its actual name index\n   where available, preserving name variants and the volume/page reference. The\n   presentation describes Gallica copies and Filae indexes; check which volumes and\n   indexes you can actually consult rather than assuming complete online coverage.\n2. Follow the index reference into the publication itself. Record the printed name,\n   nomination date, award wording and original page, keeping the index entry separate.\n   Compare the person with independent identity clues before joining the nomination\n   to the dossier search.\n3. Return either that dated nomination or the publications, volumes and index coverage\n   checked. Both alternatives are incomplete [S42]: another miss does not disprove the\n   award, and a nomination does not by itself establish receipt of the decoration.","sources":["S42"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b0ee7d372bf7","kind":"unclassified","anchor":"Fix the consulate or consular section and residence period first. The official guide\nroutes immatriculation through the post fonds' *chancellerie*, distinguishes civil and\nnotarial primata collections from duplicata, and warns that registration was voluntary\n[S35]. Check those separate inventories, including earlier notarial registers left in\nthe post fonds; take custody and request conditions from the selected description.","sources":["S35"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2904725869c8","kind":"unclassified","anchor":"The consular-fonds guide also identifies military material [S36]. Keep military files\nseparate from consular immatriculation despite the shared word *matricule*. The 2022\npresentation motivates these parallel searches [S34]; its reading-room and date-limit\nstatements are not current access instructions.","sources":["S36","S34"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1b253e4d6dc6","kind":"unclassified","anchor":"Start from a dated press report or military-record annotation that actually names a\nprison. Keep its wording and identity clues beside the bounded detention period. The\n2024 presentation uses these leads to select an institution before searching its\n*registres d’écrou* (admission registers) [S43].","sources":["S43"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0a181fb3cd1f","kind":"unclassified","anchor":"1. Open the relevant AD’s finding aid for that institution and period. The presentation\n   gives series Y as a lead; take the actual cote and surviving date span from the\n   selected inventory. Distinguish the penal categories and register types it describes,\n   using the clue’s stated status rather than choosing a register by surname alone.\n2. Locate that institution’s alphabetical table or general repertory. The presentation\n   describes alphabetical tables in older registers and later repertories referring to\n   several register types [S43]; use the actual arrangement without assuming a common\n   transition date. Read the name entry for its admission number (*numéro d’écrou*)\n   and any register, date or category reference.\n3. Carry those references into the specified register and admission entry. If a separate\n   nominative index supplies an archival cote, follow that cote back to the AD record;\n   retain the index and original as distinct sources. Copy the admission number and\n   page/image locator so another researcher can retrace the handoff.\n4. Compare the entry’s recorded civil identity, occupation and dates with the independent\n   clues. Preserve any judgment or sentence reference for separate retrieval; record\n   only the fields actually present. Return the clue → institution/category → table or\n   repertory → register-entry chain, with unresolved identity and retrieval links.","sources":["S43"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-789110ecb4b3","kind":"unclassified","anchor":"- **Jurisdiction row:** the commune under each spelling, its département on the event date and today, and the annexation status for an 1871–1918 north-eastern event.\n- **Access row:** for each birth or marriage, the open date computed from closure and deaths, and whether the act was ordered from the mairie.\n- **Series rows:** for each search, the AD, series and cote (or the INSEE file, Grand Mémorial or Archives nationales finding aid), the classe and bureau for a soldier, the notary for a notarial act, and the status: searched, found, not found, closed or not online.\n- **Census rows:** each commune and year read, the pages read, and whether a name index existed.\n- **Family-linkage rows:** the adoption-date reference and separate judgment target, the\n  Basque name-and-house sequence, or the Breton marriage-to-consent locator chain, with\n  the records inspected, unresolved custody/access and unproven links kept explicit.\n- **Award/consular rows:** the decoration form and creator or consular post, separate\n  index/list/packet or registration/civil/notarial/military targets, actual inventory\n  references, inspected contents and unresolved date, custody or identity questions.\n- **Military-stage/context rows:** linked municipal, canton, lottery and final-contingent\n  entries with literal outcomes and any stated destination; or the matricule-derived\n  unit/date bounds, selected JMO pages and unit observations kept separate from personal\n  presence, departure or participation conclusions.\n- **Property rows:** separate cadastral and mortgage cases, historical bureau, table and\n  transcription locators, or the dated Paris address and selected property register;\n  the deed/notary reference, actual access and inspection status, and unresolved parcel,\n  person or succession links.\n- **Prison row:** the dated institutional clue, selected penal category, table or\n  repertory reference, admission number and original entry locator, with identity links\n  supported by the inspected records.\n- **Alternative death/parentage rows:** the Saint-Pierre index and separate civil or\n  court targets, or the town’s civic-admission book and edition/original locator; retain\n  the wording inspected and any unresolved victim or parentage link.\n- **Gaps:** INSEE years 1970–1975, greffe copies before 1736, unindexed census years, and for early 1939 whether the Archives nationales camp lists were read.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2698af7902e7","kind":"historical","anchor":"**Savoie and Haute-Savoie have no civil registers for 1816–1860.** Savoy returned to Sardinian law in 1816 and joined France in 1860, and the mayors took up civil registration again on 1 January 1861. For 1816–1860, look for the event in the Catholic parish registers: duplicates or copies of them were sent to the lay courts and to the bishoprics, and extracts, then certified copies, of the acts of 1828–1860 were handed to the mairies after 1861. The parish registers that a Sardinian decree of 22 December 1815 handed to the priests did not go back to the mairies after 1860; a very large part of those of the Chambéry diocese was deposited in the Savoie departmental archives in 1972. [S57] Record which copy you read.","sources":["S57"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4ee20c1ff8e7","kind":"historical","anchor":"**A marriage of 22 September 1798 to 26 July 1800 can be in another commune's register.** From 1 vendémiaire an VII to 7 thermidor an VIII, marriages were celebrated only in the canton's chief town (*chef-lieu de canton*). After the cantons were abolished on 17 February 1800, couples went on marrying in the former chief town for a while; the practice ended before 26 July 1800, but not everywhere on the same date. The communes' ten-year tables still list these marriages. [S56] So search the chief town's marriage register as well as the home commune's. The Maine-et-Loire guide says the first page of a commune's birth and death registers names its canton and chief town [S56].","sources":["S56"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-deff09651861","kind":"historical","anchor":"**Paris, 12th arrondissement:** the birth acts of 1 January 1870 to 25 May 1871 were also destroyed; look for them among the [reconstructed acts](french-belgian-civil-act-extraction.md#check-a-paris-reconstructed-record-branch) [S58].","sources":["S58"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2d85a4bf70d7","kind":"method","anchor":"**Expect the online images to stop earlier than the open registers.** The government's answer of 6 October 2015 to a parliamentary written question says that the CNIL's single authorisation AU 029 of 12 April 2012 set a delay of 100 years for putting birth and marriage acts online, which can be cut to 75 years when the margin notes are masked [S13]. So a birth or marriage act between 75 and 100 years old can be open to the public and still be missing from the AD website. The same answer says the ten-year tables are open at once; the ministry considers that their pages can go online after 25 years for deaths and 75 years for births and marriages [S13].","sources":["S13"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1ab3a1581220","kind":"historical","anchor":"**For a death before 1825, search the older tables.** The Finistère guide says the table des successions et absences was kept from 1 January 1825 and brought together the information of five tables abolished on that day: the tables of deaths, of seals placed and lifted (*appositions et levées de scellés*), of post-mortem inventories, of guardianships and curatorships (*tutelles et curatelles*), and of succession duties paid (*successions acquittées*) [S7]. Look for those five tables among the same registration office's records.","sources":["S7"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-aa869779a4e0","kind":"portal-availability","anchor":"**In Paris, expect nominative lists for 1926, 1931, 1936 and 1946 only.** The Archives de Paris say the five-yearly censuses produced nominative lists there only in those four years. The lists run by arrondissement, quartier and street, and the streets are not always in alphabetical order. For each building they group the members of a family and give each person's date and place of birth and occupation. The lists are online except those of 1946, which are seen only in the reading room [S59 @2026-11-13]. The same page names census records of 1856–1872 for the 5th and 10th arrondissements among the arrondissement mairies' records [S59 @2026-11-13].","sources":["S59"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5f1dc38b214","kind":"method","anchor":"If the répertoires of the place's notaries (see above) are lost for the period or do not lead to the act, use the registration records [S60]. From 1693 every notarial act had to be declared at a contrôle des actes office. In December 1790 the contrôle was replaced by the enregistrement, whose registers list in date order all the acts passed before the notaries of each office's area. The administration made tables of these registers by kind of act: sellers, buyers, marriage contracts, wills and others. [S60] In the Maine-et-Loire guide's example, a table entry gives the parties, the date of the act, the date of registration and the notary. The guide warns that some tables give only the registration date; then read the registration register at that date for the notary and the act date [S60]. The guide's AD keeps the ancien-régime records in series C and the later ones in sub-series 3 Q; take the cotes from your own AD's finding aid.","sources":["S60"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
