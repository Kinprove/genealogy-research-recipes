claims:
  - {"id":"C-e145450d86f2","kind":"unclassified","anchor":"- The rabbi kept the metrical books (births, marriages, deaths) from 1835, when the Statute on the Jews made him responsible for them, until civil registration replaced the rabbinate in that place (section 6). The community elected him and the provincial authority confirmed him; he is informally called the crown rabbi (казённый раввин). A law of 1857 changed who could be elected, not when registration began. Early books are often missing: the Odesa regional archive reports the Odesa city rabbinate's books (fond 39) for 1835–1874 lost in the Second World War, apart from births for 1846–1847 and other events for 1854. So ask what survives from 1835 on, not from 1857. [S6, S7] The spiritual rabbi of a synagogue did not keep the books.\n- Do not assume where a crown rabbinate sat. Participants give a rule of thumb: crown rabbinates sat in larger towns, usually the uezd centre, and villages had none. [S3] The rule does not hold for small shtetls. NIAB holds separate Jewish-society metrical books for small Minsk-uezd shtetls such as Rakov (1860–1917), Kamen and Gorodok, and a participant reports that Parichi had its own rabbi in 1900 (section 2, step 4). For a shtetl, treat \"no own rabbinate\" as a hypothesis and test it year by year. For a village, look to the rabbinates around it.\n- Do not search for \"the village's\" or \"the synagogue's\" metrical book. Having synagogues, or a sizeable Jewish population, does not show that a place had its own crown rabbi. A forum participant made this point about a town of about 2,000 Jews with two synagogues. [S3]\n- Revision lists were produced by uezd or guberniya treasury bodies. For example, the Bobruisk revision lists of 1795–1874 are in NIAB f. 333 op. 9, from the Minsk treasury. Police records (the stanovoi pristav) and conscription records (the 1874 conscription census, district offices and присутствия) were created at uezd level at least. For one Orsha-uezd volost in NIAB, a participant advised that any surviving volost-level papers would sit in uezd or guberniya fonds, and so began the search at uezd level. [S1] Start at uezd or guberniya level too, but also check whether the archive lists a fond of the volost administration itself.\n- Check that a record series exists for your window. The 10th revision was taken in 1858, so neither the 9th nor the 10th can list a person born in 1860–1900, as a participant pointed out to a user who asked for them. [S1] They can still list that person's parents or grandparents, so request them only for the earlier generation.\n- Check the person's registration as well as the place of the event. In one case a 1917 entry called the father a \"citizen\" of another town. A participant read this as his former estate registration (мещанин). That town's records needed attention before the town where photographs were taken. [S3] Use the identity-attribution recipe for that branch.","sources":["S6","S7","S3","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b92de797ed4f","kind":"historical","anchor":"The metrical books named in the first bullet had a fourth part. The 1835 Statute required the rabbi to keep them for circumcisions, marriages, divorces and deaths. [S11] The Odesa regional archive describes its city rabbinate's books (fond 39) as holding births, marriages, divorces and deaths. [S7] Search the divorce part as well. It can explain a marriage that ends without a death entry, or a woman who remarries while her first husband is alive.","sources":["S11","S7"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cd321ebe4742","kind":"unclassified","anchor":"1. **Put the place in its period uezd and guberniya.** Use the uezd and guberniya at the event date, not today's raion or oblast. Participants corrected a user who gave a Soviet raion for a 1906 birth, and placed the place in Rogachev uezd. [S3] When a participant suggested a neighbouring town's books, another objected that the town was in a different guberniya at the time. Rank a candidate across a guberniya border lower, but do not drop it. [S4]\n2. **Find out who held rabbinical office that year and where they lived.** Use the provincial press and address calendars for that year. A participant reported this arrangement for Berdichev in 1915: the city rabbi (with an assistant) recorded the city, the uezd rabbi recorded the uezd communities, and all three lived in Berdichev. From this the participant concluded that a nearby railway town's events were probably entered in books kept in Berdichev, and that the town probably never had its own books. [S3]\n3. **Treat a gap in the roster as an open question.** A participant reported a 1906 roster from the Mogilev guberniya press. It shows a community rabbi for Mogilev, Gorki, Klimovichi, Mstislavl and Orsha with their uezds. It shows none for Bykhov, Gomel, Rogachev, Senno, Chausy and Cherikov. The same participant noted that some books still survive from uezds that had no rabbi that year. Who kept them is unresolved, so make that the next question rather than reporting that no book exists. [S3]\n4. **Check whether the shtetl had its own rabbi that year.** A participant reported that the Bobruisk (uezd-town) books survive and gave the relevant book as NIAB f. 1520, op. 7, d. 6. Fond 1520 is NIAB's fond for the Jewish societies and institutions of Minsk and Grodno guberniyas. The same participant reported that Parichi had its own community rabbi in 1900. A Parichi birth may therefore not be in the Bobruisk books, and the Parichi rabbi's books need their own survival check. [S3]\n5. **Look at the nearest community, including one in a neighbouring uezd.** One volost had no known society or crown rabbi. For it, a participant suggested the nearest community with a rabbi, which lay towards a neighbouring uezd (Tolochin, with Senno uezd as well as Orsha). [S1] Participants said people registered at the nearest synagogue except in rare cases. When the distance was very great or there was no crown rabbi, an entry occasionally went into a church parish book, though a participant called this extremely rare. [S4]\n6. **Test every candidate town in the uezd, not only the uezd seat.** A participant reported that Seda had no surviving books, while Плунгяны (Plungė), Ворни (Varniai) and Telshi itself survived well. The participant took this as a sign that Seda had no crown rabbinate, but said its entries were not necessarily registered in Telshi. Search each candidate town. [S5]\n7. **Register siblings separately.** Before the revolution one child could be registered in one town and a sibling in another, and a girl might not be registered at all. [S3] One sibling's entry does not fix the rabbinate for the others.","sources":["S3","S4","S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6af331baf870","kind":"unclassified","anchor":"- Do not search for the entry first. Establish whether that rabbinate's book survives for that confession, event type and year. Only then choose online viewing, a written request or a visit. [S3]\n- Participants report that this check depends on forum databases, the archive's own lists and \"archive links\" pages. When those are missing, the regional archive that holds the period guberniya's records is the only source of the answer. [S3] Ask the archive that held that territory. A Belarusian archive cannot answer for a Chernigov-guberniya or Kiev-guberniya town. For a Bessarabian crown-rabbinate book, search ANA fond 211 by district opis, as set out in [Route a Bessarabian or Moldovan record by date, district and bank of the Dniester § 4](bessarabia-moldova-record-routing.md#4-search-bessarabian-metrical-books-in-ana-fond-211-by-opis).\n- Participants reported that no Jewish metrical books survive for Starodub, Fastov or Vasilkov, or Novgorod-Seversky. In the Fastov and Vasilkov case, the village could have belonged to either rabbinate. [S3] For Rechitsa, a participant quoted another forum's statement that the 1905–1915 rabbinate books were not preserved, and said he did not know whether it was true. NIAB's later reply to the person searching said the records were not preserved. [S4]\n- Record each such report as a statement by its author, with the date it was made. It is a coverage gap for that rabbinate and those years, not a negative for the person.\n- An archive reply of \"not preserved\" closes only the rabbinate, years and event it names. In one case the national archive said the records were not preserved, and the zonal archive said they had never been transferred to it. Those are two different statements. Record both, then continue with section 2 (other candidate rabbinates) and section 4 (the town copy and other substitutes). [S4]\n- **Check the confession.** Karaite births were recorded by the kenesa, not by the rabbinate. The Dnipropetrovsk oblast archive's fond 193 is a collection of metrical books for Ekaterinoslav guberniya (1779–1935) and includes Jewish-society books, but no public description confirms Karaite books in it. Before you browse that collection for a Karaite, confirm that it actually holds Karaite books, as a participant advised. Synagogue books are not Karaite coverage. [S3]\n- Do not commission a broad \"find everything\" search from the archive before this check. A participant called that money thrown away. Instead, list specific fonds, opisi and, where possible, delo numbers in one request. [S3]","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-48b9df51be0f","kind":"unclassified","anchor":"Choose these from the person's known biography (places of work, study, military service, party membership, evacuation), not from the birthplace alone. [S3] Each substitute is a separate source with its own creation date and its own basis of information.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b27e60fc90f","kind":"unclassified","anchor":"- **The town administration's copy.** From 1853 the law (Свод законов, vol. IX, arts. 913–921) required rabbis to present the previous year's books each year, both the general book and the private one, to the town duma, ратуша or magistrate (later the town public administration, городская управа). The town body checked them and kept the general book; the private book went back to the rabbi. [S6, S8] A study of the Irkutsk synagogue books describes the original staying in the synagogue and a copy going to the town uprava. [S9] Archive guides also show rabbinate books and extracts outside the rabbinate's own fond: rabbinate books for Zhytomyr and its uezd, 1844–1921, in the Volhynian guberniya board's fond (ДАЖО f. 67, op. 3); Jewish metrical books for the towns of Podolia in the Podolian guberniya board's fond (ДАХмО f. 227); and extracts and lists drawn from the books in the Nizhny Novgorod town uprava's fond (ЦАНО f. 30, op. 35). [S8, S10] Before you record a year as lost, search the town-administration and guberniya-board fonds for that year. One year can survive in two fonds.\n- **The rabbi's private notebooks.** A participant posted a quotation from another forum thread that cites the Svod zakonov. According to it, crown rabbis kept private books or notebooks with the same content as the official book. These were written at the ceremony itself, in Hebrew and Russian. The rabbi then had one month to copy them into the official book, which was kept in the synagogue or prayer house. Some archives hold these notebooks, and they can replace lost books. [S2] If you find two differing versions of one entry, do not treat the difference as a transcription error. Ask whether one is the notebook and the other the official book, and keep each with its own spellings. The two books of one year can sit in different fonds (see the town administration's copy above).\n- **Metrical extracts (метрические выписи) in personal files.** People took copies of their metrical entries to enter university, take a job, register a residence, be conscripted or receive a passport. [S2] A copy can therefore survive in an employment, student or military personal file. [S4] Marks such as \"issued in …\" in a book show that copies were made. A participant read a cluster of such marks as more likely a sign of these everyday uses than of passportization alone. [S2]\n- **Extracts issued by early Soviet bodies from lost books.** A participant reported a town whose rabbinate books do not survive. In the 1920s a local Soviet committee there issued extract certificates from those books, or from alphabets compiled from them. Search the fonds of such Soviet bodies for books, alphabets or issued extracts. [S1]\n- **Certificates signed by community members.** A participant described a person whose metrical book burned before the revolution. That person's personal file holds a certificate, signed by respected members of the Jewish community, attesting his birth. [S2] This is testimony recorded at a later date, not a register entry.\n- **Soviet \"повторное\" (repeat) ZAGS certificates.** Participants said many people obtained repeat Soviet birth and marriage certificates marked \"повторное\". These were sometimes written from the person's own words or from witnesses, and sometimes from personal-file papers. Practice depended on local authorities. [S2] Date such a certificate to its issue and name its basis. Never treat it as a contemporary entry.\n- **Later lists that give ages.** Electoral lists, family lists of a town's Jewish society and similar lists can carry ages. A participant cited one such list: DARO f. 165 (Rovno city uprava), op. 1. If a list's age conflicts with an archival certificate, rank the candidate lower but do not exclude it. Check the same lists for other years, as a participant advised. [S2]\n- **Uezd and volost papers that survive when the books do not.** For Rechitsa uezd these are in NIAB, the Gomel oblast archive and the Rechitsa zonal archive. A participant noted they may hold information on the person and relatives even though the birth entry itself is unlikely to be found. [S4]","sources":["S6","S8","S9","S10","S2","S4","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ddf7b1835b21","kind":"unclassified","anchor":"- No \"birth certificate\" was issued as a matter of course for an 1880s birth. For a pre-revolutionary entry, ask for an **archival certificate (архивная справка) quoting the metrical entry literally**, or for a **scan**. A participant said the scan is sometimes certified with the archive's seal. [S3]\n- A copy of an issued certificate can be supplied only if three things are true: the person once received one, a copy was left somewhere such as a personal file, and that file can now be found. [S3]\n- For legal or practical use, a file downloaded from the internet is not enough. Order the archival certificate or a certified copy from the archive. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d4a73ed166b2","kind":"unclassified","anchor":"Establish the changeover from the actual local books or a dated archive description. Participants give 1919/1920 or 1919/21 as the end of the crown rabbinates. [S3] Treat that as their regional experience, not a general date or proof that a particular place had already changed to civil registration. A portal's last published book does not establish when local registration changed.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e9e1a07ad660","kind":"unclassified","anchor":"A participant reported that ZAGS books up to about 1926 sit in the oblast archive and later books stay with ZAGS. [S3] Treat that cut-off as reported practice only. Confirm the current custody and access rule with the archive for the country and region concerned; the reported cut-off is not a retention rule.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-19242deb2c60","kind":"unclassified","anchor":"An early-Soviet village birth can produce the same layered replies as section 3. In one case a user received separate replies: \"not preserved\" for some years, \"entry not found\" for another year, and a further reply about a church parish book. Record each reply as its own row. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
