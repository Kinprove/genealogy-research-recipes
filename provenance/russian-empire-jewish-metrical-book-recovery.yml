claims:
  - {"id":"C-e145450d86f2","kind":"method","anchor":"- The rabbi kept the metrical books (births, marriages, deaths) from 1835, when the Statute on the Jews made him responsible for them, until civil registration replaced the rabbinate in that place (section 6). The community elected him and the provincial authority confirmed him; he is informally called the crown rabbi (казённый раввин). A law of 1857 changed who could be elected, not when registration began. Early books are often missing: the Odesa regional archive reports the Odesa city rabbinate's books (fond 39) for 1835–1874 lost in the Second World War, apart from births for 1846–1847 and other events for 1854. So ask what survives from 1835 on, not from 1857. [S6], [S7], [S11] The spiritual rabbi of a synagogue did not keep the books.\n- Check for a shtetl’s own register before assuming the uezd seat kept it. The film guide lists Rakov, Kamen and Gorodok separately on the same roll. For deaths in 1860 it identifies distinct records: NIAB f. 1226, op. 1, d. 3 for Rakov, d. 7 for Kamen and d. 8 for Gorodok (film 1920792, items 5, 9 and 10) [S25]. A reported community rabbi in Parichi in 1900 makes the uezd seat only one candidate for that year [S3].\n- Do not search for \"the village's\" or \"the synagogue's\" metrical book. Having synagogues, or a sizeable Jewish population, does not show that a place had its own crown rabbi. Kazatin reportedly had two synagogues and nearly 2,000 Jewish inhabitants. Check the city and uezd rabbinical rosters before choosing books for its residents [S3].\n- Revision lists were produced by uezd or guberniya treasury bodies. For example, the Bobruisk revision lists of 1795–1874 are in NIAB f. 333 op. 9, from the Minsk treasury. Police records (the stanovoi pristav) and conscription records (the 1874 conscription census, district offices and присутствия) were created at uezd level at least. For a village in Orsha uezd, check NIAB’s uezd and guberniya fonds for police and conscription papers, then look for the volost administration’s own fond [S1]. Verify the creator and dates in each inventory.\n- Match the person’s birth to the date of enumeration. For someone born after the 1858 tenth revision, search the original ninth and tenth returns for parents and grandparents [S1]. If the inventory lists later supplementary returns, check their own dates before deciding whom they could include.\n- Use the original status wording to identify another community to search. A 1917 Kyiv Jewish entry calls the father a «гражданин города Глухова», a lead to earlier Hlukhiv мещане registration. Family photographs taken in Kazatin establish neither that registration nor where the birth was entered [S3]. Check Hlukhiv’s society records against the father’s identity.","sources":["S6","S7","S11","S25","S3","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-086708925485","kind":"historical","anchor":"The metrical books named in the first bullet had a fourth part, for divorces. The 1835 Statute required the rabbi to keep them for circumcisions, marriages, divorces and deaths. [S11] The Odesa regional archive describes its city rabbinate's books (fond 39) as holding births, marriages, divorces and deaths. [S7] Search the divorce part as well. It can explain a marriage that ends without a death entry, or a woman who remarries while her first husband is alive.","sources":["S11","S7"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2498ac45fec3","kind":"method","anchor":"Read the divorce part column by column. In the Jewish form, Part III «О разведшихся» gives the ages, who performed the divorce or the chalitzah (халица) and who witnessed it, the date in the Christian and the Jewish calendar, the reasons («По каким причинам»), by whose decision, and who exactly was divorced from whom, and by which of the two rites. [S20] Copy the stated reason separately from the rite and decision. A stated call-up or allegation about a spouse’s conduct records the grounds given in that entry [S19]. The marriage part has a column for the main acts or records and the obligations between the couple, with their witnesses [S21]; copy what it says, and do not read a sum in it as a dowry unless the entry says so.","sources":["S20","S19","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cd321ebe4742","kind":"method","anchor":"1. **Date the uezd and guberniya.** For Streshin in 1906, use Rogachev uezd, Mogilev guberniya. The later Zhlobin raion points to a different administrative period [S3]. Check the border before ordering the nearest town’s books. Retain a cross-border candidate when the family’s or community’s records connect the places [S4].\n2. **Separate the rabbi’s address from the territory he registered.** Look for the office, assistant and district in that year’s address-calendar or provincial press. A reported 1915 Berdichev roster places the city rabbi, his assistant and the uezd rabbi in Berdichev. For Kazatin, search the uezd books as well as local inventory titles before concluding where its events were entered [S3].\n3. **Compare the roster with surviving volumes.** A reported Mogilev-guberniya roster for 1906 names rabbis for Mogilev, Gorki, Klimovichi, Mstislavl and Orsha, but none for Bykhov, Gomel, Rogachev, Senno, Chausy or Cherikov. Books were nevertheless reported from some of the latter uezds [S3]. Check the year, compiler and communities named on each surviving volume.\n4. **Search the shtetl and the uezd seat separately.** NIAB f. 1520, op. 7, d. 6 is the reported Bobruisk book for a 1900 search. Parichi reportedly had its own community rabbi that year, so check for a separate Parichi register and verify the Bobruisk file’s coverage [S3].\n5. **Include neighbouring communities across the uezd border.** For Kokhanovo in Orsha uezd, Tolochin was suggested as a possible registering community. Check the evidence for the Tolochin rabbi and search the Senno as well as the Orsha inventories [S1]. If a church parish book is suggested as an exceptional route, establish its coverage and read the entry before assigning it to the family [S4].\n6. **Check each candidate town, including smaller centres.** A reported gap at Seda and surviving books for Плунгяны (Plungė), Ворни (Varniai) and Telshi leave Seda’s registering community unresolved [S5]. Search those candidates by event and year before assigning Seda’s residents to the uezd seat.\n7. **Register siblings separately.** Before the revolution one child could be registered in one town and a sibling in another, and a girl might not be registered at all. [S3] One sibling's entry does not fix the rabbinate for the others.","sources":["S3","S4","S1","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6af331baf870","kind":"method","anchor":"- Do not search for the entry first. Establish whether that rabbinate's book survives for that confession, event type and year. Only then choose online viewing, a written request or a visit. [S3]\n- Participants report that this check depends on forum databases, the archive's own lists and \"archive links\" pages. When those are missing, the regional archive that holds the period guberniya's records is the only source of the answer. [S3] Ask the archive that held that territory. A Belarusian archive cannot answer for a Chernigov-guberniya or Kiev-guberniya town. For a Bessarabian crown-rabbinate book, search ANA fond 211 by district opis, as set out in [Route a Bessarabian or Moldovan record by date, district and bank of the Dniester § 4](bessarabia-moldova-record-routing.md#4-search-bessarabian-metrical-books-in-ana-fond-211-by-opis).\n- Participants reported that no Jewish metrical books survive for Starodub, Fastov or Vasilkov, or Novgorod-Seversky. In the Fastov and Vasilkov case, the village could have belonged to either rabbinate. [S3] For Rechitsa, a participant quoted another forum's statement that the 1905–1915 rabbinate books were not preserved, and said he did not know whether it was true. NIAB's later reply to the person searching said the records were not preserved. [S4]\n- Record each such report as a statement by its author, with the date it was made. It is a coverage gap for that rabbinate and those years, not a negative for the person.\n- Distinguish a statement about survival from one about custody. For a Rechitsa-area search, NIAB replied that the records had not survived, while the Rechitsa zonal archive said it had never received them [S4]. Record each archive, event and year separately. Continue with another candidate rabbinate or the town copy.\n- **Check the confession.** Karaite births were recorded by the kenesa, not by the rabbinate. The Dnipropetrovsk oblast archive's fond 193 is a collection of metrical books for Ekaterinoslav guberniya (1779–1935) and includes Jewish-society books, but no public description confirms Karaite books in it. Before you browse that collection for a Karaite, confirm that it actually holds Karaite books, as a participant advised. Synagogue books are not Karaite coverage. [S3]\n- Do not commission a broad \"find everything\" search from the archive before this check. A participant called that money thrown away. Instead, list specific fonds, opisi and, where possible, delo numbers in one request. [S3]","sources":["S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-odesa-city-birth-index-coverage","kind":"portal-availability","anchor":"- **Odesa city births, 1878–1900.** JewishGen's catalogue entry for fond 39, the Odesa city rabbinate, reports its records for 1875–1919 as completely intact. [S18 @2026-11-16] A JewishGen volunteer project transcribed the birth books' own name indexes, which give the given name, surname, year and month of the event and the location in the book. Its project page reports 56,029 lines submitted to JewishGen for 1878–1889, 1891, 1894, 1896–1897 and 1900. [S17 @2026-11-16] MyHeritage lists a JewishGen-supplied collection, \"Odessa Birth Records from JewishGen\" (collection 20068). Its 2022 announcement gave 13,190 records and described them as Jewish births \"between the years 1878 to 1900\"; MyHeritage listed 55,983 records on 2026-11-16. [S15 @2026-11-16] [S16 @2026-11-16] Do not read that span as continuous coverage. Check the year against the project's list: a miss in 1890, 1892–1893, 1895 or 1898–1899 is untested, and a miss in a listed year does not mean the book is lost. Use a hit to fix the year, month and book location, then order the entry itself from fond 39 and keep the index line as its own version.","sources":["S18","S17","S15","S16"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-48b9df51be0f","kind":"unclassified","anchor":"Choose these from the person's known biography (places of work, study, military service, party membership, evacuation), not from the birthplace alone. [S3] Each substitute is a separate source with its own creation date and its own basis of information.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b27e60fc90f","kind":"method","anchor":"- **The town administration's copy.** From 1853 the law (Свод законов, vol. IX, arts. 913–921) required rabbis to present the previous year's books each year, both the general book and the private one, to the town duma, ратуша or magistrate (later the town public administration, городская управа). The town body checked them and kept the general book; the private book went back to the rabbi. [S11], [S8] A study of the Irkutsk synagogue books describes the original staying in the synagogue and a copy going to the town uprava. [S9] Transcriptions of archive guides and an archivist’s inventory preface also identify rabbinate books and extracts outside the rabbinate's own fond: rabbinate books for Zhytomyr and its uezd, 1844–1921, in the Volhynian guberniya board's fond (ДАЖО f. 67, op. 3); Jewish metrical books for the towns of Podolia in the Podolian guberniya board's fond (ДАХмО f. 227); and extracts and lists drawn from the books in the Nizhny Novgorod town uprava's fond (ЦАНО f. 30, op. 35). [S8], [S10], [S24] Before you record a year as lost, search the town-administration and guberniya-board fonds for that year. One year can survive in two fonds.\n- **The rabbi's private notebooks.** A participant posted a quotation from another forum thread that cites the Svod zakonov. According to it, crown rabbis kept private books or notebooks with the same content as the official book. These were written at the ceremony itself, in Hebrew and Russian. The rabbi then had one month to copy them into the official book, which was kept in the synagogue or prayer house. Some archives hold these notebooks, and they can replace lost books. [S2] If you find two differing versions of one entry, do not treat the difference as a transcription error. Ask whether one is the notebook and the other the official book, and keep each with its own spellings. The two books of one year can sit in different fonds (see the town administration's copy above).\n- **Metrical extracts (метрические выписи) in personal files.** People took copies of their metrical entries to enter university, take a job, register a residence, be conscripted or receive a passport. [S2] A copy can therefore survive in an employment, student or military personal file. [S4] Record the date and recipient of any «выдан» note. A cluster of issue marks at Klintsy prompted competing explanations, including passports and other requests [S2]. Search the possible receiving institution’s files without assigning a purpose until a mark or the extract names it.\n- **Trace extracts issued from lost books.** For Khislavichi, the local Committee of Peasant and People’s Deputies reportedly issued extracts in the 1920s from rabbinate books or alphabetical indexes derived from them [S1]. Check the committee’s fond for issued certificates, retained registers and alphabets. Record which one the certificate names as its basis.\n- **Check the personal file for community testimony.** After a pre-revolutionary register burned, a personal file preserved a birth certificate signed by members of the Jewish community [S2]. Record the signatories and the date of their testimony separately from the birth they attest.\n- **Soviet \"повторное\" (repeat) ZAGS certificates.** Participants said many people obtained repeat Soviet birth and marriage certificates marked \"повторное\". These were sometimes written from the person's own words or from witnesses, and sometimes from personal-file papers. Practice depended on local authorities. [S2] Date such a certificate to its issue and name its basis. Never treat it as a contemporary entry.\n- **Later lists that give ages.** Electoral lists, family lists of a town's Jewish society and similar lists can carry ages. A participant cited one such list: DARO f. 165 (Rovno city uprava), op. 1. If a list's age conflicts with an archival certificate, rank the candidate lower but do not exclude it. Check the same lists for other years, as a participant advised. [S2]\n- **Uezd and volost papers that survive when the books do not.** For Rechitsa uezd these are in NIAB, the Gomel oblast archive and the Rechitsa zonal archive. A participant noted they may hold information on the person and relatives even though the birth entry itself is unlikely to be found. [S4]","sources":["S11","S8","S9","S10","S24","S2","S4","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ddf7b1835b21","kind":"unclassified","anchor":"- No \"birth certificate\" was issued as a matter of course for an 1880s birth. For a pre-revolutionary entry, ask for an **archival certificate (архивная справка) quoting the metrical entry literally**, or for a **scan**. A participant said the scan is sometimes certified with the archive's seal. [S3]\n- A copy of an issued certificate can be supplied only if three things are true: the person once received one, a copy was left somewhere such as a personal file, and that file can now be found. [S3]\n- For legal or practical use, a file downloaded from the internet is not enough. Order the archival certificate or a certified copy from the archive. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d4a73ed166b2","kind":"unclassified","anchor":"Establish the changeover from the actual local books or a dated archive description. Participants give 1919/1920 or 1919/21 as the end of the crown rabbinates. [S3] Treat that as their regional experience, not a general date or proof that a particular place had already changed to civil registration. A portal's last published book does not establish when local registration changed.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e9e1a07ad660","kind":"unclassified","anchor":"A participant reported that ZAGS books up to about 1926 sit in the oblast archive and later books stay with ZAGS. [S3] Treat that cut-off as reported practice only. Confirm the current custody and access rule with the archive for the country and region concerned; the reported cut-off is not a retention rule.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0b3e21e03a4d","kind":"custody","anchor":"In Russia the term behind that report is statutory. Federal Law 143-FZ, Art. 77, keeps act books at ZAGS for one hundred years from the records and then sends them to the state archives, so the cut-off moves forward a year every year and reached the books of about 1926 in 2026. [S13 @2026-11-15] A 2023 Dzen guide applies the rule to the early Soviet act records and names the Central State Archive of Moscow Oblast (ЦГАМО) as their holder for Moscow guberniya. [S14 @2026-11-15] A book can stay at ZAGS past the term: first-copy books made before Federal Law 219-FZ of 2016 took effect go to the archive only after their data are entered in the unified register, as [Soviet personal-file recovery § 1](soviet-personal-file-recovery.md#1-read-the-negative-reply-before-you-treat-it-as-a-dead-end) notes. So read the term as where a book should be, not as proof of where it is. For Ukraine's 75-year term, see that section too.","sources":["S13","S14"],"checked":"2026-11-15","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5fa4fec1d369","kind":"custody","anchor":"For an act book already transferred to the state archive, write to the archive, not to ZAGS. A genealogist reports that the oblast archive issues a certificate from such a book, on paper or electronically, without proof of kinship, while ZAGS issues one only on documents that prove the whole chain of kinship. [S22 @2026-11-15] This fits the archive law: access to archival documents with information on a person's personal and family secrets is restricted for 75 years from their creation, and earlier only with the written permission of the person or, after death, of the heirs (Federal Law 125-FZ, art. 25, part 3). [S23 @2026-11-15] Check the transfer for the region and year first, as above, and gather the kinship chain only for books still at ZAGS.","sources":["S22","S23"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-19242deb2c60","kind":"method","anchor":"For an early-Soviet birth, log one row for each archive reply, naming the authority, confession, event and years checked. A reply that books did not survive for some years, a search that found no entry in another year, and an answer about a church parish register leave different searches open [S3].","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-later-note-finding-aids","kind":"custody","anchor":"Administrative finding aids are worth asking about: the State Archive of Lviv Oblast catalogue describes name indexes to issued biographical and thematic certificates in fond 21, opis 1 (1918–1939), for the interwar state archive in Lwów. The catalogue warns that the described documents may be incomplete and not cover every year; no individual file was inspected. This example does not establish the meaning of a number on a metrical entry or survival of a corresponding request file elsewhere. [S12 @2026-11-16]","sources":["S12"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-metrical-index-event-and-filing-towns","kind":"portal-availability","anchor":"**Separate the event town from the filing town.** For a hit in MyHeritage’s JewishGen birth or death indexes for Belarus, Latvia or Ukraine, copy the birthplace or place of death and the filing town into separate fields. [S26 @2026-11-20] [S27 @2026-11-20] [S30 @2026-11-20] [S31 @2026-11-20] Start with the filing town when choosing which rabbinate inventory to check. If the hit gives only the filing town, leave its event-place field blank. In JewishGen’s Belarus death index, use “Place Recorded” for the book search and “Town of Death” for the event. [S32 @2026-11-20]","sources":["S26","S27","S30","S31","S32"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-latvian-birth-index-to-register","kind":"portal-availability","anchor":"**Trace a Latvian birth hit to the book.** MyHeritage’s Latvia, Jewish Birth Records from JewishGen spans 1838–1921, mostly 1854–1909. [S26 @2026-11-20] [S27 @2026-11-20] Check the recorded town and year in JewishGen’s birth inventory before interpreting a miss in the JewishGen index. [S33 @2026-11-20] Look for the corresponding JewishGen entry and copy its Latvian State Historical Archives locator (fond, apraksts, lieta, image or page number, and entry number) for FamilySearch or Raduraksti. In Raduraksti, browse the recorded town and year in the birth series (Dz). When you have an index locator, match its three archival numbers to the cover, then find the image and entry. [S28 @2026-11-20]","sources":["S26","S27","S33","S28"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ukrainian-birth-index-sources","kind":"portal-availability","anchor":"**Trace a Ukrainian birth hit to its source.** For MyHeritage’s Ukraine, Jewish Birth Records from JewishGen, keep the hit’s source label and any fond, opis and delo or film and item numbers. [S26 @2026-11-20] [S30 @2026-11-20] If the hit lacks a usable locator, look for the corresponding entry in JewishGen’s Ukraine Vital Records. Follow the source named for that entry to the Family History Library film, the Central Archives for the History of the Jewish People (CAHJP) or the named Ukrainian archive. A hit can come from an unfilmed archive record. [S29 @2026-11-20] If the entry gives no source, use the JewishGen inventory’s town, event and year to find candidate repositories, then confirm the source in the matching volume. The inventory points to CAHJP for 1844 births in Mohyliv-Podilskyi. [S34 @2026-11-20]","sources":["S26","S30","S29","S34"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
