  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2022/10/new-and-improved-family-statistics-on-myheritage/"],"published":"2022-10-27","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Checked 2026-11-22. Read the documented chart groups, drill-downs, indicator legend and category examples.","entry_sha256":"17685f2093b164214f8553b4e471a764b0d96b555d01e58d2effe365e601058b","claims":["C-01","C-02","C-03","C-04","C-05","C-06"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://education.myheritage.com/article/fun-with-family-statistics/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Checked 2026-11-22. Read the entry route, tree selector and chart-to-profile workflow.","entry_sha256":"2cd328bdabe301829b06977800e8c15876d4e8c4c2e00b06f8cbbbac47dff47e","claims":["C-01","C-02","C-05","C-06"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"From the family site, open Home → Family Statistics. Choose the named tree for an audit of one tree, or All family trees for the site scope. Confirm the profile associated with the user before reading the relationship charts. Interpret each chart within the selected tree or site scope. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"Under Relationships, read Related to you and Not related to you as the presence or absence of a path in the tree. The General chart can omit empty categories. Open Your ancestors to see the list of profiles and available event and match indicators. Open Not related to you to check for duplicate profiles, missing links or intentionally separate branches. Confirm the proposed link in records before any tree change. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"Use Steps away from you for the tree’s relationship hops, Generation difference from you for relative generation, and Marriages away from you for the number of marriage links along the path. Open a chart group to get the underlying List view and use the displayed bucket label to preserve its bounds. In the marriage chart, read the blood-relative group according to the paths represented in the tree. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"Open a branch or a blood-relationship card to get its underlying people. A branch percentage describes the selected tree’s profiles. If the blood-relative chart shows a lighter card with a dotted line for a half sibling, inspect the profiles and verify which parent the tree has in common. Follow [relationship paths](cousin-relationship-paths.md) before interpreting multiple possible paths. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"Open a common first or last name in Overview to list matching profiles and check the displayed count. In Ages open Top 10 for an unusually old or young group, then inspect the events behind surprising ranks. These are worklists of entered data. A rank alone cannot establish a birth date, death date or longevity claim. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"In Places compare birth, death and residence maps to form a migration hypothesis. Open the underlying profiles and date each move from evidence before using the map in a conclusion. Use the [country coding audit](myheritage-country-coding-place-audit.md) to check place labels. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
