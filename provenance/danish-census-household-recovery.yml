claims:
  - {"id":"C-3c0a7c6128e7","kind":"portal-availability","anchor":"Search the 1925 Denmark Census in MyHeritage or FamilySearch for the confirmed deceased subject, then read the schedule image. If an index hit is missing or ambiguous, browse Rigsarkivet's census collection by census year and the period geography. Choose the rural parish, the market town or the relevant Copenhagen street or district. For a town outside Copenhagen, the 1925 *Købstæder* schedules provide a starting point. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22] [S5 @2026-11-22]","sources":["S1","S2","S3","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4ca4c18ce6eb","kind":"method","anchor":"Use the schedule heading and the person's row to distinguish household position from occupation. In the 1925 schedule, copy the address from the household heading and read each person’s household position and occupation from the fields provided for that form. Carry blank occupation fields forward as blank. [S3] [S4]","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-418d4d5c5ff8","kind":"method","anchor":"Put later entries on their own census-date rows. Compare address, birthplace or birth date and other household members before attaching a new occupation to the person. If the listed work differs, record the occupation associated with each census date and leave the date of any change open. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
