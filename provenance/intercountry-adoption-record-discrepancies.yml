claims:
  - {"id":"C-51abe4cc9c2d","kind":"method","anchor":"Make one row per source. Record the pre-adoption name, assigned name, stated birth date, issuing authority, record date and stated basis for placement or consent. Keep the birth parent’s account as a separate attributed source and compare its chronology with each document before calculating age. When a Chilean civil birth search misses, keep a home birth with no surviving registration among the possibilities. A consent statement in the file records what the paperwork says. Establish what the signer understood and agreed to from independent evidence. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5624cd10d97f","kind":"method","anchor":"Through an existing authorized route, ask the birth parent whether they want to give their own account of the placement. With consent, ask what they recall signing, what they understood the document to authorize, and how the child entered care. Record their wording and distinguish what they witnessed from what they learned later. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4145c4e6bad4","kind":"custody","anchor":"For a Chilean origin-file request, start with the official Búsqueda de Orígenes route for applicants in Chile or abroad. Use consular guidance where an overseas applicant needs help identifying the route. Submit only the fields and proof the office requires after clearing the gate. [S4 @2026-11-21] [S5 @2026-11-21]","sources":["S4","S5"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-998dd66a929a","kind":"method","anchor":"Keep a first-pregnancy statement attributed to whoever the adoption file names as its source. For an independently established full sibling, compare the two birth dates and flag a conflict if the sibling was born before the pregnancy described in the file. In a reported Korean case, an older sibling identified by a DNA match called the file’s first-pregnancy statement into question. [S6]","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7fe915b47dbc","kind":"method","anchor":"For a Vietnamese placement through Friends For All Children, compare the name on the supplied birth certificate with the orphanage name in intake records or agency correspondence. Keep both names as search leads and require independent evidence linking the records to the same child before accepting a birth-family identification based on either name. A later agency email recalled replacing an orphanage name with a name for which the agency had a birth certificate. [S9] [S10]","sources":["S9","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6bc2e0a11f21","kind":"portal-availability","anchor":"For a Chile-born adoptee investigating suspected coercion, check the intake guidance from Nos Buscamos or Connecting Roots alongside the official origin-file route. After clearing the contact gate, ask the organization through its public contact channel whether it can take the case. If it suggests a birth-family link, test the proposed relationship against independent records or DNA match evidence already available to the adoptee before accepting it. [S14 @2026-11-23] [S15 @2026-11-23] [S16 @2026-11-23]","sources":["S14","S15","S16"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bfc7acfbc9ba","kind":"custody","anchor":"After a local-record miss for a 1974–1975 Friends For All Children placement from Vietnam, ask the Operation Babylift Collection to check the agency’s adoptee index and the evacuation travel and flight lists. Use the birth, nursery, departure and adoptive names where known. Log the outcome of each check and limit every negative to the names and records actually searched. [S9 @2026-11-23] [S11 @2026-11-23]","sources":["S9","S11"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f084d33b5127","kind":"custody","anchor":"Start with a Korean Adoption Information Disclosure request to the National Center for the Rights of the Child (NCRC). Apply for the Certificate of Adoptee Without Identifying Birth Parent Information for Genetic Testing if the adoptee was listed as abandoned or missing and the file has no birth-parent information, or if that information is too inaccurate or incomplete to identify or locate the parents. Get NCRC’s eligibility determination even if the adoptee already has a commercial sibling match. [S7 @2026-11-23]","sources":["S7"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b9e03db28d15","kind":"custody","anchor":"Once NCRC confirms eligibility, register the adoptee’s DNA through fresh sample collection at a Korean police station or, from abroad, through the designated Korean diplomatic office. In Korea bring the certificate and a copy of the adoptee’s ID. From abroad use the Korean embassy or consulate with jurisdiction to confirm the collection procedure. Track the comparison with the Korean missing-person DNA reference data separately from any commercial match. [S7 @2026-11-23] [S8 @2026-11-23]","sources":["S7","S8"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b62f0860e733","kind":"method","anchor":"For a missing-child comparison made through Argentina’s Comisión Nacional por el Derecho a la Identidad (CONADI), record a negative as no match to the Banco Nacional de Datos Genéticos (BNDG) reference families compared. Keep the separate search for birth relatives open using records or other DNA matches already available to the adoptee. In a reported Argentine case, a restricted official comparison was negative and a separate DNA search later yielded a relative. [S12] [S13]","sources":["S12","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
