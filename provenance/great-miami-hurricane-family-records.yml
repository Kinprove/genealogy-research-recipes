claims:
  - {"id":"C-baad9ace4f70","kind":"historical","anchor":"Start with 18 September 1926 and the person’s last known or reported whereabouts. Search Miami and Miami Beach separately and extend to places such as Fort Lauderdale, Hollywood or Moore Haven when the evidence points there. For Miami-area records, search the historical county name Dade as well as the modern name Miami-Dade. A pre-storm directory miss leaves visitors and recent arrivals in scope. [S1], [S2], [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2663232b61a8","kind":"method","anchor":"A missing-person item reports a status at the time of publication. Leave death and survival open until person-level evidence resolves them. Use aggregate Red Cross figures for the storm’s scale. Check the 22 September AP list of dead taken to Miami morticians and the 22 September Tampa Tribune coverage for Moore Haven, keeping each list’s scope and revision date. Use the transcriptions as leads to the newspaper pages. Follow later issues for corrections or identifications. [S1], [S2], [S3], [S4]","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dcb00ce939ad","kind":"method","anchor":"Check the Florida death index and any matching certificate, then compare burial, funeral-home and death notices by name, place and date. Test a poorly transcribed or unidentified entry by matching age, home address or body disposition. For injury or relief, use the reported facility or relief organizer as a search term in repository finding aids. The Miami Herald of 22 September, p. 8, places a Red Cross temporary hospital at the Halcyon Hotel. [S1], [S3], [S5], [S6]","sources":["S1","S3","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5a89415d74d4","kind":"method","anchor":"Use the 1920 and 1930 censuses as anchors and place 1925–1927 directory and other dated entries between them. Compare names, addresses, household members and occupations. If Miami entries stop, test evacuation, residence with kin, a permanent move and surname changes. Search for the same person in a relative’s 1930 household and follow neighbors when displacement may have affected a group. Check property transfers and permits for evidence of a sale, rebuilding or abandonment. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
