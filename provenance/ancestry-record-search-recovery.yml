  - {"id":"S22","kind":"help-page","urls":["https://articles.familysearch.org/hc/en-us/articles/41601524428571-How-do-I-get-help-reading-handwriting-while-viewing-records"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Handwriting guidance read 2026-11-21","entry_sha256":"16a6217a942dc557822376877d97235673c81a4c1f411c89e8d4ffc06a7c3fc2","claims":["C-postmaster-entry-rows"],"review":"reviewed"}
  - {"id":"S23","kind":"video","urls":["https://www.youtube.com/watch?v=ysc3ni3ovCc"],"published":"2022-06-13","retrieved":"2026-11-21","access":"partial","rights":null,"basis":"Supplied transcript excerpt read 2026-11-21","entry_sha256":"6d905b341ea5f6b8a14c3296d3df15709feb2ac5b5866e5c3bfcfacd9beed18e","claims":["C-correspondence-index-browse"],"review":"reviewed"}
  - {"id":"S24","kind":"catalogue","urls":["https://www.archives.gov/digitization/digitized-by-partners"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"M686 row read 2026-11-21","entry_sha256":"db3a234d438fd85173073728878a730f8d699f62a7a77b2d1aceb50610d6b0c6","claims":["C-correspondence-index-browse"],"review":"reviewed"}
  - {"id":"S25","kind":"catalogue","urls":["https://www.familysearch.org/en/search/collection/1834308"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Collection description and search form read 2026-11-21","entry_sha256":"8ef835b3483b3acaf25796e0cdb62430d227de1d0fbcf3cfdd229dd841d9e877","claims":["C-correspondence-index-browse"],"review":"reviewed"}
claims:
  - {"id":"C-f3b3627532c7","kind":"unclassified","anchor":"Check Collection Focus and result-type settings; restore the intended collections\nand historical-record categories. These settings persist between searches. Record\ntheir state before and after resetting them, then rerun the same query: this tests\nthe search environment without changing the person. See [Ancestry's refinement guide](https://help.ancestry.com/hc/en-us/articles/53933347318419-Refining-Your-Search-to-Improve-Results).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f8fb8abbf28","kind":"unclassified","anchor":"Try a short title fragment, then a separate keyword search. Catalog keywords can\nfind descriptions that a title search misses; they do not search every name or\nword in the underlying images. More keyword terms narrow the catalog: retry\ndistinctive terms individually instead of pasting a long imagined collection\ntitle. Try related record vocabulary in separate passes, such as electoral\nregisters when searching for census-like household or residence evidence.\nOpen each plausible collection and inspect its actual coverage.\nSee [the Card Catalog guide](https://help.ancestry.com/hc/en-us/articles/53933305954579-Using-the-Card-Catalog).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9e4c332bcec8","kind":"method","anchor":"Try the singular and plural separately, then clear the text and compare a category-and-place search. In the Genealogy Gems demonstration, searching for “postcard” missed titles containing “postcards” [B16]. Log the date, terms, filters and count for each attempt so you can reproduce the difference.","sources":["B16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9155473e169f","kind":"unclassified","anchor":"Read its Source and About sections, then inspect the available browse subdivisions\nand volumes. Check the actual locality, date, record type and population covered,\nincluding omissions or restrictions. Run a place/date query without the target\nname to see what the index returns for that area. This is an **index diagnostic**:\nzero results can reflect unindexed images, missing fields or restrictive settings.\nCheck the image inventory separately before deciding which material is absent.\nSee [Ancestry's collection-information guide](https://help.ancestry.com/hc/en-us/articles/53933269983507-Source-and-Collection-Information).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2d473920b404","kind":"unclassified","anchor":"Inspect the populated query, including relationships. Remove the later spouse,\nchildren, later residence and uncertain facts when they constrain an early-life\nsearch; retain appropriate parents or siblings. Use the name recorded at that\nlife stage. Search forms differ by collection, so use only fields that this\ncollection actually exposes. A missing death-date control in a census search is\nnot evidence that the person lacks a death record.\nSee [How to Search](https://help.ancestry.com/hc/en-us/articles/53933305561747-How-to-Search-Ancestry)\nand [Search Tips](https://help.ancestry.com/hc/en-us/articles/53933347309331-Ancestry-Search-Tips).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-16da8aa0f6a2","kind":"method","anchor":"For a possible remarriage, search the previous married surname within the supported dates and place. Inspect prefilled parents and siblings: their surnames can keep an unwanted maiden-name constraint in a query after it has been removed from the subject. Save both queries, remove the constraint and compare the results. Test the candidate against the actual marriage record [B8].","sources":["B8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c24941bb6f65","kind":"method","anchor":"Keep the candidate’s reported surname in the subject field. Where the collection offers a suitable field, search the hypothesized family surname as a keyword or associate, with the supported place and year. Read the recovered record for the stated roles, including any parent or stepparent, before drawing a kinship conclusion [B23].","sources":["B23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-95c60dbce803","kind":"unclassified","anchor":"Then relax the year independently. A census age converted to a birth year can\nshift by one year even without an erroneous age; an unreliable age requires a\nwider interval. Preserve the reliable anchor while changing one constraint at a\ntime, and record which change recovered a candidate.\nSee [Ancestry's refinement guide](https://help.ancestry.com/hc/en-us/articles/53933347318419-Refining-Your-Search-to-Improve-Results).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dbcbb77d727d","kind":"method","anchor":"If an undocumented death year fails, check the last record showing the person alive and search across the surrounding years. Absence from the next census suggests another search date, but gives no upper bound on death. An Ohio example yielded a 1930 death record five years before the stated year [B17]. Test a transposition separately, such as 1762 for 1726 [B18]. Compare any hit with the image, other dated records and namesakes.","sources":["B17","B18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e9de62600bc3","kind":"unclassified","anchor":"For the **1841 England and Wales census**, allow for the instruction to round\nages 15 and above down in five-year steps. Where applied, a recorded age of 30\nrepresents ages 30–34. Inspect the original age field and retain the reported\nvalue; an index's calculated birth year is not an exact birth date. Use the\npossible age range and census date to set search bounds, checking other records\nbefore deciding whether rounding explains a discrepancy. The instruction alone\ndoes not prove how a particular entry was completed.\nSee [The National Archives census guide, section 5](https://www.nationalarchives.gov.uk/help-with-your-research/research-guides/census-records/).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b3cd19babba2","kind":"method","anchor":"Check where each identified adult child lived near the parent’s estimated death. Use those dated addresses to select other death-record jurisdictions and check each collection’s date coverage. Record the source for the child’s residence separately from the hypothesis that the parent stayed or died there [B11].","sources":["B11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-4b40f40d4b01","kind":"unclassified","anchor":"- [Getting Started, Lesson 5](https://help.ancestry.co.uk/hc/en-gb/articles/53933301322899-Getting-Started-Lesson-5-Search-Tips):\n  at least three non-wildcard letters, a letter as the first or last character, and `*`\n  for zero to five letters.\n- [Search Tips](https://help.ancestry.com/hc/en-us/articles/53933347309331-Ancestry-Search-Tips):\n  `?` and `*` anywhere, at least one letter, and `*` for one or more letters.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c5c42698e697","kind":"unclassified","anchor":"Both say `?` stands for one letter. A pattern with at least three non-wildcard letters\nthat begins or ends with a letter, like the two above, satisfies both. Do not infer a universal short-pattern rule or require an Exact checkbox from\nan old tutorial; check the current field's instructions when a pattern is rejected.\nSee also [Spelling Variations](https://help.ancestry.com/hc/en-us/articles/53933306665107-Searching-with-Spelling-Variations)\nand [Searching with Soundex](https://help.ancestry.com/hc/en-us/articles/53933287988883-Searching-with-Soundex).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b15e24f31672","kind":"platform-ui","anchor":"Once the image shows a mistranscription, the user can add the correct reading using **Add or update information** in the record page’s three-dot menu. Ancestry keeps the original index entry and makes the alternate reading searchable [B33 @2026-11-19]. A hit can therefore match someone else’s reading. Compare the indexed and alternate names with the original image, and cite the wording that appears there [B34 @2026-11-19].","sources":["B33","B34"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a338ecefa3ac","kind":"unclassified","anchor":"For births, search the parent fields alone, including a mother's-maiden-name field where the\nbirth index offers one; some early registers omit the child's name, so a search by the child's\nname cannot reach those entries. Treat hits as candidates and match them by parents, date and\nplace ([Joyce Whiting](https://www.youtube.com/watch?v=1LPbDiF6fn8),\n[Dave Obee](https://www.youtube.com/watch?v=14LegPypVRM)).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-67f212970c09","kind":"unclassified","anchor":"Use [Ancestry's horizontal-search advice](https://help.ancestry.com/hc/en-us/articles/53933305561747-How-to-Search-Ancestry)\nand, for the 1950 census, [NARA's household/neighbor search guidance](https://www.archives.gov/research/census/1950/faqs).\nThese are retrieval pivots; route any identity decision to the evidence-judgment\nrecipe. Do not add a recovered household to the tree merely because it matches\nthe search constraints.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f5a579ac6aa","kind":"unclassified","anchor":"A person-search keyword field offers another pivot. Keep only name, birth year and place, and put\none known associated fact in the keyword field instead of a structured field. That fact can be an\naddress from another record, a city whose county changed, a regiment from a draft card, or an\nindexed column without its own field, such as a passenger list's nationality. For a child who may\nhave lived in an institution, try a status term such as 'orphan' in a census keyword field, then\ninspect the full institutional pages. Check that the current collection indexes that text.\nCo-residents and listed inmates are leads, not relatives or identifications.\n[Judy Sharp's examples](https://www.youtube.com/watch?v=VsbXLVM1-Xk), the\n[Swiss keyword tip](https://www.youtube.com/watch?v=ezp_SFmMdYM) and a relayed\n[adoptee-research tip](https://www.youtube.com/watch?v=KcsQHKLSjFQ) motivate this. They do not\ndocument current keyword coverage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9cc0ffa85db3","kind":"unclassified","anchor":"The internal-index method is described by [Lisa Louise Cooke](https://lisalouisecooke.com/2019/11/17/browse-only-records-at-ancestry/).\nUse the current viewer's available navigation; the 2019 article's screen positions\nare not a current interface contract. Preserve the collection, volume, printed\npage and image locator for each candidate.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-796a94bdc684","kind":"unclassified","anchor":"Find a contemporary address in a directory, draft or naturalization record;\nresolve it to the enumeration district for the **same census year**; browse that\ndistrict's images on Ancestry or at the archive. An earlier address is a lead to\ncheck, and another year's district boundaries are not a substitute.\nSee [NARA's 1940 address-to-district method](https://www.archives.gov/research/census/1940/start-research).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-02513335ed35","kind":"unclassified","anchor":"For the **1950 U.S. census**, inspect sheets numbered 71 onward as well as the\nordinary sequence: these carry people enumerated out of order. The numbering jump\ndoes not establish that images are missing. This is a year-specific convention,\nnot a rule for every census. Follow any \"see sheet / line\" reference on the\noriginal schedule and check informant footnotes when a neighbor supplied the\nhousehold information. See [NARA's 1950 FAQ](https://www.archives.gov/research/census/1950/faqs).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-57f50743294e","kind":"unclassified","anchor":"Read the collection's front matter before treating selected pension/bounty papers as a\ncomplete application. Follow the identified applicant and packet boundary into additional\ncomponents actually offered; record which papers were inspected and what remains outside\nthat extent. Preserve the packet locator alongside the individual image locators.\nThe [selected-papers demonstration](https://www.youtube.com/watch?v=2TlWZ0KvbxU) supplies this\nextent check, not a guarantee about present collection coverage or access.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-37533a377e89","kind":"unclassified","anchor":"Copy the collection citation and original repository's locator. For a Web Records\nentry, follow the linked source site. For an index-only collection, identify the\ncustodian and its image or copy-request route; an Ancestry index does not guarantee\nAncestry hosts the image. Access conditions can differ between a personal account\nand a library edition. See [Ancestry's library guide](https://help.ancestry.com/hc/en-us/articles/53933331964691-Searching-on-Ancestry-at-a-Library-or-School)\nand [Web Records guide](https://help.ancestry.com/hc/en-us/articles/53933331868179-Finding-Records-Online-with-Ancestry-Web-Records).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1b7469a9bbb5","kind":"method","anchor":"Search other catalogues for the exact collection or publication title, place and year [B22], [S11]. Record each host, edition and search attempted. Compare the cited original page, memorial identifier or source of the index before counting independent evidence. A shared 1880 census index or two Find a Grave indexes pointing to the same memorial can return the same observation twice [S12], [S13].","sources":["B22","S11","S12","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-99dc02f9273d","kind":"unclassified","anchor":"If an inspected record supplies a religious name and a named community affiliation,\ncarry both with that record's locator into an institutional-archive inquiry. Check the\ncommunity's actual holdings and present custodian, including a documented later name or\nsuccessor archive; ask whether a personnel file is held and accessible for that person.\nKeep any returned letters, obituaries or photographs separately identified and verify\ntheir link to the researched person. The [interview with Sunny Jane Morton](https://www.youtube.com/watch?v=hUmGeEvOWbU)\nsupplies this possible file target. It does not guarantee survival, access or contents.\nKeep a birth-name/religious-name link unresolved until supported; do not infer community\nmembership or parentage from a name form, initials, clothing or Catholic context alone.\nThe life-stage query in workflow 6 already handles supported name variants.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1a40e805cdcd","kind":"unclassified","anchor":"For England and Wales censuses **1841–1901**, carry the archive series, piece,\nfolio/page and, where applicable, book reference into a reference search or image\nbrowse. Do not reuse that locator shape unaltered for the household schedules of\n1911 or 1921. When a whole locality is missing, check the original archive's\ncoverage documentation before continuing name permutations.\nSee [The National Archives census guide, sections 10–11](https://www.nationalarchives.gov.uk/help-with-your-research/research-guides/census-records/).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6f0245aa39fa","kind":"unclassified","anchor":"For a **1921 household schedule**, recover the address panel and instructions as\nwell as the person rows. Keep the schedule's identity and each image locator;\ncheck that the sides belong together. Findmypast's [RG 15 image guide](https://www.findmypast.com/discover/census-land-and-surveys/census/1921-census-of-england-and-wales-image-browse)\ndescribes the address panel on the front and household details on the back, with\ndifferent sequences for longer schedules and attachments. Do not assume that a\nfixed previous/next-image offset always retrieves the other side.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-42fb0730258c","kind":"unclassified","anchor":"If you save a recovered record as an authorized tree attachment, list the source's named\npeople and their intended tree profiles first. Select the facts and people deliberately, then\nopen each intended profile and verify its source attachment, person-row pairing and resulting\nfacts against the record. A successful save to one person does not verify all intended people.\nUse the current per-person attachment controls to address a missing link; do not\ninfer a parent-child relationship from household membership. Ancestry documents\n[field and person selection](https://help.ancestry.com/hc/en-us/articles/53933314225043-Adding-Records-to-a-Tree)\nand [saving a source to another person](https://help.ancestry.com/hc/en-us/articles/53933348187923-Managing-Facts-Events-and-Sources-in-Trees).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ed829e6aa8c5","kind":"method","anchor":"In a multi-person record, select the subject’s own row before choosing the destination profile. Check the proposed age, birthplace and parents against that row and the existing sources. Selecting another household member can offer that member’s details for the intended person [B9]. Leave conflicting facts and unrelated attachments in place while resolving the identity.","sources":["B9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a04956650eeb","kind":"unclassified","anchor":"These field roles come from [Ancestry's 2012 member-profile demonstration](https://www.youtube.com/watch?v=KRz3hK3KZWc).\nUse fields actually exposed in the available view; the demonstration does not establish\nthat the historical directory or its controls are available in the current account.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dab76d812ca4","kind":"platform-ui","anchor":"Do not take an empty Ancestry-wide search as proof that a newspaper item is absent. Ancestry's\nglobal search does not include the Newspapers.com Stories and Events Index collections because\nof their size, as reported in March 2024 [S1 @2026-11-12], [S2 @2026-11-12]. Run a Card\nCatalog title search for Newspapers.com, open the collection for the person's state or\ncountry, and search it directly [S2 @2026-11-12], [S3 @2026-11-12]. A hit links to the page on\nNewspapers.com, which needs that site's own subscription to view [S3 @2026-11-12].","sources":["S1","S2","S3"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ssa-index-parent-leads","kind":"portal-availability","anchor":"For a deceased U.S. person with unknown parents, search *U.S., Social Security Applications and Claims Index, 1936–2007* [S9 @2026-11-16]. Ancestry lists possible birth details, father’s name, mother’s maiden name and name/claim changes, but warns that inclusion is incomplete and parents’ names can be suppressed [S5 @2026-11-16]. Extract the fields actually shown as application/claim statements; a blank parent field or missing person is not a finding that no application existed [S5 @2026-11-16].","sources":["S5","S9"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-death-facility-county","kind":"method","anchor":"For a U.S. death search, separate the residence county from the hospital or institution’s county. The standard death certificate gives separate residence, facility/place-of-death and county-of-death fields [S6]. If a known facility was elsewhere, search its locality as well as the home locality, preserving which place belongs to which field. Do not move the person’s residence merely because the death was recorded elsewhere [S10].","sources":["S6","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-visual-vs-soundex","kind":"method","anchor":"When handwriting could interchange **t** and **l**, search the letter alternatives directly or with the supported wildcard. Soundex assigns them different codes; a visual resemblance is not a sound-code match. The same issue affects Bowery/Bowey: retaining the R gives B600 versus B000 under the standard NARA rules [S4]. Keep the two searches separate rather than assuming phonetic matching covers both [S7] [S8].","sources":["S4","S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-709b1a037b33","kind":"platform-ui","anchor":"Clear the town or province from the Card Catalog’s Title/Keywords fields and compare the list with a country or category search [S14 @2026-11-19]. In Ancestry’s 2026 demonstration, entering Nova Scotia hid national Canadian census collections that included the province [B1 @2026-11-19]. Open the national collection and look for the locality within its coverage.","sources":["S14","B1"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2b114ff6bacd","kind":"method","anchor":"Remove the target name and search with a distinctive combination of residence, birth year, birthplace, sex or known relatives. Try each parent’s name or a sibling or neighbour whose name is easier to distinguish. Open the image, locate the household and check nearby pages for an entry indexed under another spelling [B2].","sources":["B2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9e9f79b09734","kind":"method","anchor":"If there is a separate probate index volume, copy its reference to the will book and printed page. Open the named book, verify its heading and locate the actual will before reporting what it says [B5].","sources":["B5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-results-record-location-filter","kind":"platform-ui","anchor":"When a broad historical-record search returns hits from too many places, use the record\nlocation filter on the left of the results page [S15 @2026-11-20], [S16 @2026-11-20].\nKeep the person query as entered so the comparison isolates the effect of the filter.","sources":["S15","S16"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-postmaster-catalog-title","kind":"platform-ui","anchor":"For M841, enter `postmasters` in the Card Catalog’s Title field to find *U.S., Appointments of U. S. Postmasters, 1832–1971* [S14 @2026-11-21], [S20 @2026-11-21]. A 2022 Title search from the available excerpt missed the collection with `post office` [S19 @2026-11-21]. Compare the terms in the current account if the collection is missing.","sources":["S14","S20","S19"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-pension-ledger-surname-only","kind":"platform-ui","anchor":"For the T718 payment ledgers in *U.S., Revolutionary War Pensioners, 1801–1815, 1818–1872*, retry a failed full-name search in the same account with only the surname [S18 @2026-11-21]. Inspect plausible ledger images for an obscured given name and compare the locality with known places for the pensioner. Check whether the place names the paying agency [S18 @2026-11-21]. In the 2022 example from the available excerpt, the surname-only search recovered an entry whose given name was blotted out [S17 @2026-11-21].","sources":["S18","S17"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-postmaster-office-location","kind":"platform-ui","anchor":"If a surname search in the M841 postmaster appointments fails, clear both name fields and search the collection by the post office’s locality, county and state [S20 @2026-11-21]. If that fails, browse by state and county, then turn to the office [S20 @2026-11-21], [S21 @2026-11-21]. In the 2022 example from the available excerpt, the office search recovered a candidate under a different surname [S19 @2026-11-21].","sources":["S20","S21","S19"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-postmaster-entry-rows","kind":"method","anchor":"Enlarge a suspect M841 appointment entry, compare the handwriting with the rows immediately above and below, and trace any ambiguous stroke to its own row before reading the surname [S22]. In the 2022 example from the available excerpt, the presenter traced a letter in the indexed surname to a neighboring entry [S19].","sources":["S22","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-correspondence-index-browse","kind":"portal-availability","anchor":"If a general name search misses, open Ancestry collection 1268, *U.S., Index to General Correspondence of the Record and Pension Office, 1889–1904* (M686), directly [S24 @2026-11-21]. Follow the browse route from the available excerpt of the 2022 demonstration [S23 @2026-11-21], checking the controls in the current account before selecting the surname range. For a separate name search, use FamilySearch’s index to the same cards [S25 @2026-11-21].","sources":["S24","S23","S25"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
