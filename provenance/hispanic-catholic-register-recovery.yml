  - {"id":"C-a8a7a72b37bf","kind":"method","anchor":"- **Identify the parish.** In a city with many churches, use a historical address or the family's recollection of the church used for baptisms and marriages to choose a parish. Record the reason for that choice [S4].\n- **Identify the civil district separately.** For Havana or Santiago de Cuba, narrow the address to the municipal district as well as the parish. A Havana family's civil entry was traced to Norte de La Habana [S13]. Record that level of detail for your own search.","sources":["S4","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
