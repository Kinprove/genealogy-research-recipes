claims:
  - {"id":"C-a8a7a72b37bf","kind":"unclassified","anchor":"- **A town lead is not a register selection.** A larger town or city has many parishes, so the town alone does not tell you which books to search. One presenter puts the number as high as a hundred in a larger town or city [S4]. Ask relatives which church the family used for baptisms and marriages, and record that answer as its own lead [S4].\n- **A large city can also have several civil registry offices.** Havana and Santiago de Cuba have many parishes and municipal districts [S13]. Cuban records are held by the individual church or by the regional civil registry office, and one original Havana entry came from the Registro Civil of Norte de La Habana [S13]. Identify the registry district as well as the parish, and record both.\n- **Order a Buenos Aires civil act by its reference.** The city's Registro Civil identifies each act by circunscripción or sección (registry district), tomo (volume), acta (act number) and year [S23]. Take that reference from an index entry before you request a copy through the city's Solicitud de partidas procedure. You can still order by name and approximate date, but then the registry has to run a separate search [S23]. Record the reference next to the parish locator, as for the Havana registry district.\n- **Parish and municipality boundaries differ.** One parish can cover several municipalities, and one municipality can contain several parishes [S1].\n- **The FamilySearch Catalog can list a parish and a municipality under the same place name.** The presenter's example reads the first entry as the parish and the second as the municipality [S1]. Open each entry's record list. Do not stop at the first match.\n- **Catholic marriage records can sit in two Catalog series.** The Catalog usually lists them under Matrimonios and Información matrimonial [S14]. Search both when the parish has both, and record which series supplied each entry.\n- **A colonial parish could keep separate books by calidad.** Mexico City's Sagrario parish kept baptism and marriage books for españoles and separate books for castas, while Indians had parishes of their own [S32]. In Valladolid (now Morelia, Michoacán), one book was divided into sections by calidad from 1643, and separate books began in 1652 [S33]. The book followed the calidad the priest assigned, and a person's calidad could vary: one child has entries in both the castas and the españoles books, under the same baptism date [S33]. When a colonial entry is missing, search every book the parish kept for those years, and record which book held the entry.\n- **A small chapel visited by a priest normally kept no books.** If no parish appears for a small town, go up one level to the municipality and search its parish seat [S6].\n- **Records can move when a parish changes.** When a family vanishes from a parish's books, check whether the parish closed, a new parish was founded, or the books were transferred. The people may have stayed put while their records moved [S1]. Follow the books before you infer that the family migrated.","sources":["S4","S13","S23","S1","S14","S32","S33","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c55201255dfc","kind":"unclassified","anchor":"Extract each field separately [S10], [S2]:","sources":["S10","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c2c887df4f5e","kind":"unclassified","anchor":"- **Margin name:** copy it exactly. It can be written surname first, with the given name abbreviated (the presenter's example shows Torres before an abbreviated Juan Pablo) [S10]. Use the margin name to find your subject [S2].\n- **Officiating priest:** the opening formula names the priest. Do not record him as the child or a relative [S2].\n- **Legitimacy:** record the term exactly as written (legítimo, hijo natural or an abbreviation such as L) [S10]. In a parish register, legítimo means the parents were married in the church. Natural means the child was not born of a church marriage. Usually that means born out of wedlock [S10], but a child whose parents had married only civilly was also entered as natural [S2]. So \"natural\" does not prove the parents never married. Search the civil marriage register before you state that they were unmarried. When a child carries the mother's surname, one presenter takes it as a likely sign that the parents were unmarried [S2]. Treat that as a hypothesis.\n- **Casta label:** copy any colonial casta or calidad label (español, mestizo, castizo, mulato, indio and others) exactly as written. It is the priest's or official's description in that one entry. Labels for the same person could shift between records, by passing or drift [S24]. A label mismatch does not, by itself, show that two entries are different people. The label is not proof of ancestry either: it recorded social standing (calidad), judged also by dress, speech and conduct, as well as descent [S24].\n- **Dates:** keep the baptism date and any stated birth date in separate fields [S10], [S2]. A stated birth date often is not there; one presenter calls it a bonus [S2].\n- **Margin notes:**\n  - A note can record a later death [S10]. Treat it as its own event and as a lead to the burial record.\n  - A note can record a later marriage with its date, place and spouse. The priest added it when the baptism was checked before the marriage [S9]. Treat it the same way: its own event, and a lead to the marriage record.\n- **Other fields:** parents, their origin and residence, godparents, and any occupation or residence that separates same-named men [S2], [S10].\n- **Grandparents:** an entry can also name the paternal and maternal grandparents. Extract each one as its own field, marked paternal or maternal, with any birthplace or residence given. Each named grandparent takes the line up a generation [S15]; use them to target the parents' baptisms and marriage. Not every entry names them, and how often they appear varies:\n  - Cuban civil and church entries follow the Spanish model and almost always name the grandparents, often with each one's birthplace [S13].\n  - One source says baptisms often name both sets from the 19th century on [S16].\n  - One researcher finds that Mexican civil births of legitimate children often name both sets, while the entries for two natural children named no other family [S17].","sources":["S10","S2","S24","S9","S15","S13","S16","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8448b00ef54c","kind":"unclassified","anchor":"Do not read a missing grandparent line as a wrong match. When a civil birth names no grandparents, search the baptism, which can also carry lineage [S17]. A transcribed certificate kept by the family can leave out the grandparents' birthplaces that the original entry gives [S13]; obtain the original register entry before you record a field as absent. If the direct ancestor's marriage cannot be found, search a full sibling's records, which name the same parents [S15].","sources":["S17","S13","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4b36b64c3483","kind":"unclassified","anchor":"- **Devotional prefix.** Priests often added a leading José, Juan or María at baptism, and the person usually dropped it in daily life [S5], [S4], [S11]. Examples: a baptismal José Miguel who is plain Miguel in the census [S11], and an everyday Pablo who was baptized José Pablo [S4]. Search censuses and civil records under the everyday name and baptismal entries under the prefixed form. Keep both forms as separate observations in the name register.\n- **Do not merge siblings who share the prefix.** In some parishes every boy was José and every girl María. That pattern does not mean one child was baptized more than once, or that middle names kept changing [S12]. Tell the siblings apart by the following name, the parents and the dates. How often this happened, and where and when, is less settled. One presenter's example is from 1920s–1930s Mexican baptisms [S12]. Another says the practice has mostly faded over roughly the last century but continues in more conservative areas of Mexico [S4]. For the test for same-named siblings, use the evidence/proof judgment recipe.\n- **Compound surnames.** Search under:\n  - the paternal surname\n  - the maternal surname\n  - the full compound, with and without the joining y/e [S2]\n  - the two surnames hyphenated or joined into one word, forms some immigrants adopted in the United States [S18]","sources":["S5","S4","S11","S12","S2","S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ac0bae6a0127","kind":"unclassified","anchor":"A U.S. record may have dropped one surname [S2]. Record every ordering searched and its result.\n- **Immigrants appear under a Spanish form of their name.** In one Puerto Rican marriage record, a couple from the French Caribbean are cited with Spanish forms of their given names [S19]. Another immigrant to Puerto Rico took the Spanish form of his middle name as his given name and his mother's surname as his second surname [S20]. Search the Spanish form and the two-surname pattern as well as the birth name. Keep each form as its own observation in the name register.\n- **When the index fails, browse the images.** Compound surnames make Latin American indexes unreliable: an indexer has to pick one surname, and people who did not follow the standard pattern get lost [S2]. Browse the chronological registers by place and date [S2], [S4]. A zero-result index query is not an absence finding.","sources":["S2","S19","S20","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-be62b1c92958","kind":"unclassified","anchor":"- **Never copy a baptism date into the birth field.** Baptism could be late because of distance, the priest's fee or inertia [S2].\n- **Whole families were sometimes baptized on one day** [S2], [S9]. In one example, two children baptized together looked like twins until their birth dates differed [S9].\n- **Some people were baptized as adults.** The priest could require baptism shortly before a marriage [S1], [S2], [S7].\n- **If no infant baptism turns up, search the months before the marriage** [S7], [S1].\n- **Wording for an entry with only a baptism date:** \"born on or before\" the baptism, with any estimated interval labelled as calculated. One presenter suggests birth was probably a few weeks earlier [S10]. Because baptisms could be late, treat that only as a starting window. The born-before reasoning is in the evidence/proof judgment recipe.","sources":["S2","S9","S1","S7","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f53b72ceafa","kind":"unclassified","anchor":"- **Direction of search.** The civil birth registration usually came before the baptism [S10]. From a baptism, search backward for the civil birth. From a civil birth, search forward for the baptism. If nothing turns up, reverse the direction [S10].\n- **Search civil records only after civil registration began there.**\n  - Mexico: civil registration was required from 1859 but not strictly enforced until 1867, and compliance was incomplete even after that (FamilySearch) [S1, S34].\n  - Chile: civil registers begin in 1885 [S10, S35].\n  - Puerto Rico: civil registration began in 1885, though a few municipalities started earlier [S10, S36].\n  - Cuba: the Spanish civil-registry law of 1870 applied from 1 January 1885. Before that, search the parish books [S28].\n  - Spain: the Registro Civil starts on 1 January 1871, and some larger towns kept municipal civil registers from 1841. Use step 1 of [Spanish record routing](spanish-civil-parish-record-routing.md), which covers both.\n  - Argentina: there is no single national start year. The 1884 law covered only the city of Buenos Aires and the national territories, and the city registry began in August 1886 [S29], [S30]. Buenos Aires province opened its offices from 1 January 1889 under its own law [S31]. For any other province, take the first year from that province's FamilySearch Catalog entries.\n  - Any other country: use the FamilySearch Wiki page \"Civil Registration in Latin America\" [S21] only as a first guess. Start years differ widely: the Dominican Republic began in 1828 and Bolivia not until 1940 [S21]. The page gives one national year per country and was last edited in 2021; its years for Argentina (1881), Mexico (1857) and Brazil (1850) differ from the dates above and from the Brazilian recipe [S21]. Confirm the year in the municipality's Catalog entries before you treat an earlier gap as an absence. Do not assume a late-19th-century start.","sources":["S10","S1","S34","S35","S36","S28","S29","S30","S31","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0500f0fce9b4","kind":"unclassified","anchor":"Before the start year, rely on the parish books [S10]. After it, a missing civil entry in a given municipality may be a compliance gap, so keep searching the parish books.\n- **Build a paired event table.** Each row holds the event, the record type, the date role and the locator. A civil entry and a church entry for the same event stay as two rows.\n- **Deaths: get both records.** Search the civil death register as well as the burial book. The civil entry can give the cause of death and name the informant, who may be a relative [S21].\n- **One Mexican marriage can leave several entries with different dates.** Once civil registration was in force, a marriage is often found in both the civil and the church register, usually on different dates [S22]. The civil entry is often the earlier, but the church entry is occasionally earlier [S22]. Different dates mark different stages, not a conflict or a second couple. Do not reject a church entry because it predates the civil act.\n- **A Mexican civil register can hold more than one act for one couple.** The 1859 civil-marriage law set out the steps: a declaration of intention before the registrar, a public notice posted for 15 days, then the marriage act [S22]. Search back from the marriage act for the declaration. In one worked example the declaration, an appointment to marry and the marriage were three numbered acts. The declaration came 24 days before the marriage and gave each party's parents, age, residence and marital status, with two witnesses for each; the church marriage followed days later [S22]. Search for every act and give each its own row and date role.","sources":["S10","S21","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-629f39a87074","kind":"unclassified","anchor":"- **Confirm the anchor first.** Pick one entry you have actually identified as the right person, not just a matching common name such as José González [S4].\n- **Read entry by entry.** Start with about two years either side of the anchor for siblings. From each newly found child, move out another couple of years and repeat until no more children turn up; the earliest is the first known child. Then search back a year or so before that first known child for the parents' marriage [S3], [S4], [S1]. Then repeat for the husband's and the wife's families, using both surnames [S4].\n- **A long gap between children is only a prompt.** The presenter gives a four- to eight-year gap as a reason to search for a missing child [S10]. Do not record a gap as evidence of anything.\n- **Godparents can be grandparents, as a hypothesis.** One presenter says godparents were often the grandparents [S3]. Hold that as a hypothesis to test against marriages and baptisms. Witnesses at a marriage are often relatives [S10].\n- **Same-surname spouses.** If bride and groom share surnames, they may have been cousins who needed a dispensation. Dispensations are held at the diocesan level [S10].\n- **Check the pre-marriage investigation file.** The Información matrimonial series (step 1) holds the pre-marriage investigations into canonical impediments [S21]. When the marriage entry leaves out a birthplace, an age or the parents, search those files [S21]. Do not assume they are indexed: browse the images page by page [S21]. A failed index search does not cover them.\n- **If the person disappears, check in turn** [S10]:\n  - baptism margins and burials for a death within a few years\n  - a marriage under a changed name\n  - another parish\n  - the priesthood or religious vows","sources":["S4","S3","S1","S10","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a29a9fb723b0","kind":"unclassified","anchor":"Also work backward from a burial to the marriage or the children's baptisms [S10]. For burial-record handling, use the [burial evidence packet](burial-evidence-packet.md).\n- **A death entry can point to a will.** In Puerto Rico a death entry can name the notary, the filing date and the executors of a will; the source finds this mostly in civil death records and occasionally in church ones [S19]. Record the notary and the date as the lead to the will. The source points to the Last Wills and Testaments series at the Archivo General de Puerto Rico in San Juan [S19]. Read the death entry for this note before you conclude that no will exists.\n- **In Argentina, search the gazette for a succession edict.** A court edict that \"cita y emplaza … a herederos y acreedores de …\" (summons the heirs and creditors of …) names the deceased, the court (juzgado and its number) and the secretaría handling the sucesión (probate file) [S25]. Use the court and secretaría to find the sucesión file. The edict shows only that the death came before its first publication, which can be months or years after the death; do not record the publication as a death date. The national Boletín Oficial is on the Internet Archive from its 1893 issues [S26], [S27]. Its OCR is noisy, so search spelling variants of the name. From January 1950 the court edicts are in the segunda sección (second section). Before that they are in the first section [S25].","sources":["S10","S19","S25","S26","S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-06d1265735d4","kind":"unclassified","anchor":"- **Two copies often exist:** the parish original and a copy held by the diocese or archdiocese [S8]. One presenter describes the copy as made many years after the event [S8].\n- **Bishop's transcripts.** The FamilySearch Catalog uses this term for at least one Mexican archdiocesan series (Mexico City). Presenters describe the copy as made when the bishop or his staff visited the parish: once a year according to two of them [S2], [S4], periodically according to another [S1]. The timing is their account, not a confirmed rule. One presenter also says a third copy was sent to Spain during the Spanish-empire period [S4]. FamilySearch guidance mentions only the parish original and the diocesan copy, so do not plan a search around a copy in Spain.\n- **The diocesan copy can be harder to find.** The same presenter says fewer diocesan records are digitized than parish registers [S4].\n- **When an entry is missing, damaged or unreadable,** search the diocesan copy and compare it with the original [S1], [S8].\n- **Keep each copy's locator separate,** and state which copy supplied each reading.","sources":["S8","S2","S4","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-886045d1f530","kind":"platform-ui","anchor":"Read the Spanish handwriting from the image; use an online translation only for a first understanding [S38 @2026-11-12]. To check a letter form, abbreviation or set phrase, use the free Spanish tutorial of the BYU Script Tutorial (script.byu.edu) [S38 @2026-11-12]. It has handwritten alphabet charts in upper and lower case, a handwriting history, common phrases, common abbreviations, numbers, Spanish names, a genealogical glossary, guides to church, civil and notarial records, and interactive baptism exercises in vocabulary and transcription [S37 @2026-11-12].","sources":["S38","S37"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
