claims:
  - {"id":"C-timeline","kind":"method","anchor":"Anchor each date and place to the event the wording describes. Read *pochován* or *pochována* as buried. Read *usnul v Pánu*, its feminine form *usnula v Pánu*, and *z tohoto světa se vystěhoval* as death formulas. When *druhého dne* modifies the finding of the body, record the discovery the following day and calculate its calendar date only if the prior event is dated. Keep burial, injury, illness, transport, death and recovery in separate rows when named [S1], [S2], [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-origin","kind":"method","anchor":"Read *rozený z* as a stated birthplace and *pocházející* as reported origin in the Praskolesy examples. Record those separately from the opening locality, where an injury occurred, where the person was taken and whether they arrived alive. Retain *obdankovaný voják* as discharged soldier and *žebrotou se živící* as living by begging when those phrases qualify the deceased [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-childbirth-outcomes","kind":"method","anchor":"In a death in childbirth, read the verbs for mother and child separately. In Mýto parish book 2, the Těškov burial of 21 April 1728 describes a child born after the mother’s death and baptized. Check the baptism register for the child rather than closing both lives at the burial date [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-planned-marriage","kind":"method","anchor":"If a burial narrative says that a person was preparing for another wedding or blessing, enter the later marriage as planned and carry any stated duration to the earlier marriage. Use the marriage book to test whether the later wedding occurred [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-reform","kind":"historical","anchor":"For an entry before the 1784 Josephine reform, look for cause in the narrative and leave it unrecorded if the entry is silent. From the reform onward, inspect the cause column as well as any remarks. A space left blank in the standardized form supplies no cause [S1], [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-attribution","kind":"method","anchor":"Keep the original cause wording and identify who supplied it if named. Preserve any difference between what the person said, what the priest recorded and what an examining official observed. Treat a symptom or story in the register as a reported explanation. If a supporting death inspection slip survives, compare it with the entry and give both records separate locators [S1], [S3], [S4].","sources":["S1","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-slip-custody","kind":"custody","anchor":"For a nineteenth-century entry whose cause or date needs checking, look for the parish’s *ohledací listy* or *ohledací lístky* among the regional or district archive’s accompanying records. Search by the parish and year and use any slip number carried by the entry [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-double-register","kind":"method","anchor":"When the period and parish give you both an Evangelical and a Catholic entry, compare the wording for the same person, death date and residence. A Chleby entry dated 14 December 1828 uses an indirect expression in the Evangelical register where the Catholic entry records suicide explicitly [S5].","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-sacraments","kind":"method","anchor":"Record each rite the entry names and when it occurred. If confession and Communion are introduced by *nedávno před tím*, put them under earlier observance and extract the rites during the final illness separately. Keep *podmínečně* as conditionally when it modifies the last anointing [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-interment","kind":"method","anchor":"If the record uses *zahrabán* in an entry that distinguishes interment from a regular burial, retain that wording and distinction. Record the cemetery and its denomination separately from the rites the minister names [S5].","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
