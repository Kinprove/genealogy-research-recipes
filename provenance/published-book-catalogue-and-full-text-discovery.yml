  - {"id":"S175","kind":"catalogue","urls":["https://digitalt.kb.se/search?_field=subject&q=%22Fiske%22"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Catalogue entries read 2026-11-23.","entry_sha256":"9d364c64ef107a703e2ec75a4febe07010492fc1e564c76502631dfbde48d61d","claims":["C-kb-digitalt-metadata-search"],"review":"reviewed"}
claims:
  - {"id":"C-175d4da9a2e0","kind":"unclassified","anchor":"**Decide whether the target is published or archival before choosing a catalogue.** A presenter from Library and Archives Canada called this the first decision point, because LAC is both a library and an archive and, when she spoke, used a separate catalogue for each [S4]. Those catalogues have since been replaced: Aurora searches LAC's published holdings, and Collection Search covers both archival and published records. Use the institution's current tools, but make this decision first.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ad669bfe77b7","kind":"unclassified","anchor":"- the library catalogue can show that a newspaper title is held, but it cannot find an individual obituary;\n- archival descriptions do not index every file or name [S4].","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4ce8b7e8a922","kind":"method","anchor":"- **Catalogue search** (WorldCat, a library OPAC) matches only the terms cataloguers assigned. WorldCat does not search a book's contents [S2], [S12]. Some records include a table of contents or a summary, and those are searched too.\n- **OCR full-text search** looks for words inside scanned pages, including names absent from the catalogue record. Run a quoted name and spelling variants in Google Books and in full-text collections such as MyHeritage’s Compilation of Published Sources or HathiTrust [S6], [S12], [S15]. Google Books can return a snippet without showing all the matching pages. Record the volume and edition, then obtain the page in an accessible copy.","sources":["S2","S12","S6","S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0baac0218b73","kind":"unclassified","anchor":"- FamilySearch Books searches the full text of its books as well as their descriptions [S26].\n- Internet Archive searches metadata (title, creator, description, subjects) by default. To search the OCR text of books, choose **Text Contents** in the search drop-down or tab (its help pages call the option \"Search text contents\"), or open `https://archive.org/search?query=TERM&sin=TXT`. A default search can miss a book whose pages contain the term [S27], [S28].","sources":["S26","S27","S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c009a3ad4bfd","kind":"unclassified","anchor":"**Don't compare hit counts across tools.** Tools count different units: Google Books counts books, HathiTrust's full-text search lists individual volumes, and the presenter describes MyHeritage's count as word occurrences. They also search different fields and collections. A catalogue count reflects only how cataloguers described whole items [S12], [S6].","sources":["S12","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-65e8711d4647","kind":"unclassified","anchor":"**Don't type the ancestor's name into a catalogue and stop.** A catalogue is arranged by subject categories and is not a word-for-word transcription. Searching by name and finding nothing is the failure this recipe exists to prevent [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8613583082ed","kind":"method","anchor":"**Write the queries as subject descriptions.** For a Joseph City settler, try Arizona history, early settlement and the town or religious community [S2]. A catalogue record can describe the community while omitting the settler. Search that person's name inside the books the subject search identifies.","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-92e1587b66e2","kind":"unclassified","anchor":"**Record WorldCat's holding libraries for each title.** Enter a postal code or location and WorldCat lists the nearest libraries that hold the title [S2], [S6].","sources":["S2","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bd75c355d249","kind":"method","anchor":"- Compare the full title, author, imprint, date and pagination before counting editions. Two WorldCat descriptions of the same 1964 book about Henry Martin Tanner used different title lengths [S6]. Keep both identifiers and their holdings, and use the title page to decide whether they describe the same edition.","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09ad473bc2d6","kind":"unclassified","anchor":"- Catalogue and finding-aid entries for manuscripts and archival groups describe whole groups of items, sometimes hundreds, not individual items [S3].\n- Not all manuscript collections have finding aids. The presenter notes that much of the Library of Congress's manuscript material is still waiting to be catalogued [S3].\n- A catalogue that finds nothing is not evidence that the library doesn't hold the material.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f23ad6bda5b3","kind":"method","anchor":"Use a relevant catalogue hit to identify a shelf range. At BYU, a Vermont history volume led to neighbouring books in the social sciences section, where an index pointed to a transcribed probate record [S10]. Note the range and indexes inspected, then verify the transcription against the probate file.","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0d9db2c0dd49","kind":"unclassified","anchor":"- the same or similar material sits in two, three or more places in one library;\n- different cataloguers can classify the same item differently;\n- some material is uncatalogued [S1], [S9], [S3].","sources":["S1","S9","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-696188aa341b","kind":"unclassified","anchor":"**Within digitised county histories and compiled genealogies, run full-text searches for the surname.** Don't rely on the title, the table of contents or the printed index. The presenter found that many county-history indexes list only the main subject of each biographical sketch [S8].","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a97cc2a97272","kind":"method","anchor":"**Look for people named inside someone else's sketch.** A county-history sketch named Effie Barnes as the daughter of John and Emma even though Barnes was absent from the table of contents. A separate surname hit appeared on a church membership list [S8]. Record the page and whether it names a relative or a church member, then follow the appropriate family or congregation records.","sources":["S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ea9b7cb4e3ba","kind":"method","anchor":"**Search a compiled-genealogy collection by surname keyword.** A search inside a book titled for another family turned up several familiar names and a possible collateral relative [S5]. Record the page and the proposed relationship separately, then look for each link in independent records.","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1f1d904e4fae","kind":"unclassified","anchor":"**Search Google Books for the ancestor's name across all books, not only full-view ones.** For a common name, put the full name in quotation marks and add a place or occupation qualifier [S6]. Record every query string exactly as you ran it.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-78e130c13ea4","kind":"unclassified","anchor":"**For Central and Eastern European directories, yizkor (memorial) books and military lists, search Genealogy Indexer (genealogyindexer.org).** It searches the OCR text of these publications, and its guide warns that the OCR is not fully accurate [S16], [S17]. An empty 'surname near uezd' proximity query is weaker evidence than an empty surname-only query, because an OCR error in either word blocks the match. Also try its OCR-Adjusted matching and wildcards [S17]. If the source list shows no edition for the target guberniya, look for its residents in empire-wide editions and the WWI casualty lists. The page images sit on the holders' websites, and a moved image shows the host's error page, so find the volume at another holder [S18]. Its robots.txt disallows /search/ and /words/ for all robots (checked 2026-11-02), so run searches only in the user's browser [S19].","sources":["S16","S17","S18","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-752990634064","kind":"unclassified","anchor":"**For people who lived in Latvia, search the National Library of Latvia's periodika.lv and its digitised books.** Periodika searches the OCR full text of Latvian periodicals from the 18th century to the present, with a language filter [S20]. It includes Russian-language press of the Latvian SSR, such as the Riga paper *Советская молодежь* (Sovetskaya molodezh) [S21]. Some titles still under copyright are not available in full text [S22]. The digitised books collection holds interwar telephone subscriber lists, such as Jelgava 1932/33 [S23]; use them as an address and occupation lead. OCR can merge adjacent columns into a false match, so confirm every hit on the page image.","sources":["S20","S21","S22","S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f0c3151a4d65","kind":"unclassified","anchor":"When the book's headings or index cover only the principal subjects, look for a\nseparately held index of people mentioned in the text. ArkivDigital's February 2024\ndemonstration describes photographed Riddarhuset cards for incidental people in\nLewenhaupt's *Karl XII:s officerare. Biografiska anteckningar* [S24]. The title is\nconfirmed by the digitized book [S25]. This supplies a route for a woman or another\nsecondary person who has no officer biography of their own; an officer-name miss\nhas not searched that separate index.","sources":["S24","S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-de97e297b413","kind":"unclassified","anchor":"- FamilySearch Books\n- Internet Archive\n- HathiTrust\n- Google Books\n- WorldCat holdings (on a Google Books page, use the \"Get the book\" tab and its \"Search WorldCat\" link under Borrow; the presenters knew it as \"Find in a library\" [S15])\n- a general web search","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c16618fba0a5","kind":"method","anchor":"- **Check the book's viewing options separately from its purchase options.** Google Books showed “No eBook available” for a 1964 volume on Henry Martin Tanner of Joseph City, Arizona. A search by name and place located a complete downloadable copy at FamilySearch Books [S6], [S15]. Record the holding and the extent actually visible at each host.\n- **Google Books \"preview\" or \"snippet\"** is that platform's access level only. Look up the same book at Internet Archive or HathiTrust [S11].","sources":["S6","S15","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-511fbf32a099","kind":"platform-ui","anchor":"Google digitised most HathiTrust content, so check Google Books for a locked item, as the presenter does [S7 @2026-11-08]. Google Books also decides what a reader may view from the reader's country and IP address [S33 @2026-11-08].\n- **A FamilySearch access-restriction message** (such as \"not authorized to view\") means the book is restricted, not missing. FamilySearch gives each book one of three access levels, shown in its search result and in the Access Level filter [S34 @2026-11-08]:\n  - **Available Online:** searched and viewed online; it can be downloaded and printed [S35 @2026-11-08].\n  - **Protected (search only):** searched online, generally not viewable. One current help article says it cannot be viewed; another says it can be viewed but not printed or downloaded [S34 @2026-11-08], [S35 @2026-11-08]. Do not claim that it can be viewed.\n  - **Viewable in Library:** searched online and viewed only on site (\"from a Family Search Center or Library\", in the help's words), without printing or downloading [S34 @2026-11-08], [S35 @2026-11-08].","sources":["S7","S33","S34","S35"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-92b3dbd02f27","kind":"unclassified","anchor":"Affiliate libraries do not get restricted Books images [S36]. Read the level on the book's search result and confirm that book's access with FamilySearch or the center before you plan a visit. The presenter adds that a \"not authorized to view\" message can also mean the book's limit on simultaneous viewers has been reached [S6]. Record the exact restriction message you saw.","sources":["S36","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d6f4e27991df","kind":"method","anchor":"**Verify a claimed digital copy.** A result advertising a free copy of the 1964 Tanner book led to advertisements [S6]. Open the title page and the relevant printed page. If neither is available, record the listing as a lead and try a library holding.","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c1decaa1e9bd","kind":"method","anchor":"- DPLA collects other institutions' metadata and does not hold the objects. Follow the hit to the host's item page for the object, its rights and download options [S7].\n- On Internet Archive, compare the date range, volume and sponsor for near-identical titles. When the sponsor field names a library such as Allen County Public Library, use its catalogue or collection index to identify the right item, then match its details back to the scan [S14].","sources":["S7","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-69767a4f74d1","kind":"unclassified","anchor":"Photographs, plates and other items without searchable text can be found only through the descriptions written for them. Ohio Memory searches both OCR text and the descriptive metadata its partners add. A presenter from Ohio Memory gave two tips for that site [S13]:","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-19dab31e20d1","kind":"unclassified","anchor":"**Use a snippet for triage, not for facts.** A snippet shows only the search term in context on its page. It can tell you which book and page are worth chasing [S6], [S15]. Before you record any fact, find a complete copy and read the whole entry.","sources":["S6","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eeb132337915","kind":"unclassified","anchor":"**Keep an incidental mention as a candidate.** A presenter warns against copying a surname book into a family file without first verifying that the people are actually related [S12]. Pass identity questions to evidence/proof judgment.","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dab66630ba0a","kind":"unclassified","anchor":"**Trace a transcription back to its original record.** For example, a transcribed probate record found in a book should lead you to the original probate record. If the book itself is held only on paper elsewhere, request it through interlibrary loan [S10].","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e234d06610df","kind":"platform-ui","anchor":"In these sources a given name is often not spelled out. Genealogy Indexer's guide warns that some give only an initial or an abbreviated given name, and suggests searching for both forms near the surname, as `\"j pytel\"~3 | \"joz* pytel\"~3` [S38 @2026-11-12]. Vera Miller adds that in Russian and Ukrainian sources the given name and the patronymic may each be cut to about four letters, or given as initials only [S39 @2026-11-12]. Run the surname with an initial and with a short wildcard stem of the given name, and the surname with the place. Do not read a miss on the full given name and patronymic as a negative, and match an abbreviated hit to the person on the page image, not on the hit line.","sources":["S38","S39"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3e178b8b7f88","kind":"method","anchor":"**For Pennsylvania, search the published *Pennsylvania Archives*, which is not the Pennsylvania State Archives.** The *Pennsylvania Archives* is a printed set of transcribed records, issued 1838–1935 in ten series: the Colonial Records and the First to Ninth Series. The State Archives is the repository in Harrisburg [S40], [S41], [S42]. The transcribed lists include militia and muster rolls, tax lists, land warrantees, church marriages and baptisms, oaths of allegiance of foreigners arriving at Philadelphia, and governors' papers [S40], [S41], [S42]. The set runs from 1614 (Second Series volume V, on the Delaware colonies) to 1902 (Fourth Series, governors' papers), and the Ninth Series covers 1790–1838, so do not skip it for an event after 1780 [S41], [S42], [S43]. Search its own name indexes as a separate route: the last four volumes of the Third Series index the sixteen volumes before them, volume XV of the Sixth Series indexes the Fifth, and the Seventh Series indexes the names in the first fourteen volumes of the Sixth [S41]. Fold3's description of the set warns that names were misread in transcription, German names above all [S42]. Search spelling variants, and trace each entry you rely on to the original record, as in [section 8](#8-treat-snippets-incidental-mentions-and-transcriptions-as-leads).","sources":["S40","S41","S42","S43"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b3037b859937","kind":"portal-availability","anchor":"Fold3 has page images of all ten series, which you can search by name or browse by series and volume, under the title \"US, Pennsylvania Archives, 1660-1780\"; the title understates the set's dates [S40 @2026-11-13], [S42 @2026-11-13]. The Pennsylvania Historical and Museum Commission names Ancestry and HathiTrust as other hosts, and its summary of each series helps you choose a volume [S41 @2026-11-13]. Wikipedia's volume list covers only the Colonial Records and the First to Seventh Series; it links the volumes to scans at Internet Archive, Google Books and FamilySearch [S43 @2026-11-13].","sources":["S40","S41","S42","S43"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1ef04b7eeaa3","kind":"platform-ui","anchor":"**Search the catalogue of each library that serves the county, not only WorldCat and the FamilySearch Catalog.** WorldCat shows a library's copy only when the library is an OCLC member, has chosen to represent its collection in WorldCat and keeps the subscription that makes its holdings visible [S48 @2026-11-16]. The FamilySearch Catalog describes material that FamilySearch has collected [S49 @2026-11-16]. A book held only by a local library can be missing from both. Find the online catalogue of the public library or libraries serving the county and run the subject queries there too. The Just Genealogy video on county research makes this a step of its own for that reason (known here only from transcript excerpts; the video itself was not read) [S46† @2026-11-16]. Log each of these catalogues as a separate catalogue-search tool in the register.","sources":["S48","S49","S46"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-a4484743a5de","kind":"platform-ui","anchor":"**Set WorldCat's location to the county before you read its holdings list.** WorldCat.org lists holding libraries within roughly 200 miles of the location it is given. It asks you to sign in with a free account to see more than the first results, and it does not display every type of library [S47 @2026-11-16]. Enter a place in the target county, not your own or the server's location, and record the location you used.","sources":["S47"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ac612927f2cf","kind":"method","anchor":"**When the ancestor has no sketch, look for each child's.** A child's biography may name a parent who has no entry [S44]. Search the index and full text for each child and each daughter's husband. A sketch indexed under the husband's name can identify his wife's parents [S8]. Treat the relationship, origin and migration reported by a county history as leads until independently verified [S45]. Follow [section 8](#8-treat-snippets-incidental-mentions-and-transcriptions-as-leads).","sources":["S44","S8","S45"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-45554a33cd49","kind":"custody","anchor":"**For a book held only on paper, record whether the holding copy lends.** Read the holding library's lending rule before you list interlibrary loan as the route. Allen County Public Library, for example, excludes reference materials and rare or unique materials from interlibrary loan, and its Genealogy department lends nothing but offers copying services [S50 @2026-11-16]. Where the copy does not lend, record a request for copies of the pages you need as the follow-up route. The user sends any loan or copy request, including the interlibrary loan in [section 8](#8-treat-snippets-incidental-mentions-and-transcriptions-as-leads). Draft it with the title, call number and pages only.","sources":["S50"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-county-history-bibliography","kind":"method","anchor":"**Use P. William Filby's *A Bibliography of American County Histories* as another title finder.** The Family History Library's Ohio research outline recommends the 1985 bibliography for local histories [S54]. Carry a discovered title, author and edition into current catalogues, and also search regional titles covering the locality rather than limiting the query to a single-county title [S58].","sources":["S54","S58"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-descendant-biography-origin","kind":"method","anchor":"**If the immigrant lacks a named sketch, extend the search to documented later descendants.** The Maine examples described in the Bangor Daily News include parents' and earlier generations' origins inside descendants' biographies [S53]. Extract the literal origin statement, whose ancestor it concerns and the relationship asserted. Use it to choose an origin search; a sketch does not guarantee an exact birth town [S57].","sources":["S53","S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-mug-book-selection","kind":"method","anchor":"**For a late-nineteenth- or early-twentieth-century mug book, check its subscription and biography-selection process.** Frevert describes advance subscribers buying inclusion and sometimes portraits, and subjects editing their sketches [S52]. A missing biography does not establish absence from the locality or lack of status. Treat the published sketch as a contributed account and pursue its named people, places and events in other records [S56].","sources":["S52","S56"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-copy-specific-annotations","kind":"method","anchor":"**Inspect an accessible library copy for handwritten annotations, corrections and inserted material even when you have read another copy of the edition.** UVA's Book Traces account documents such copy-specific additions [S51]. Cite the particular holding copy and page or insertion, and distinguish its printed text from later handwriting. Determine who wrote a note before attributing it to the donor or author [S55].","sources":["S51","S55"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-worldcat-later-printing","kind":"platform-ui","anchor":"**Expand a WorldCat result to check for a later printing.** Just Genealogy suggests this step, according to the transcript excerpt [S64† @2026-11-18]. Open **View All Formats & Editions** when offered and use the **Sign in** prompt to see the full list [S65 @2026-11-18]. A single search result can group records for different editions and formats [S66 @2026-11-18]. Compare the imprint and date, then check holdings for the printing you need.","sources":["S64","S65","S66"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-google-books-and-all-filters","kind":"platform-ui","anchor":"**Run the same historical name-and-place query under both Books and All in Google Search.** For a deceased ancestor, quote the full name and add the locality. Crume suggests applying **Books** to find published family and local histories and also checking **All** for copies at other hosts such as Internet Archive [S59 @2026-11-18]. Google varies which filters it displays by query, so check the available filters for **Books** [S60 @2026-11-18]. Record the filter with each set of hits and misses.","sources":["S59","S60"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-antient-press-surname-index","kind":"portal-availability","anchor":"**For colonial Virginia, use the Antient Press surname index to choose which volumes to open.** Just Genealogy suggests looking under the surname's initial or using the combined index, according to the transcript excerpt [S61† @2026-11-18]. Heritage Books lists both kinds of entry under [Antient Press Indexes](https://heritagebooks.com/collections/antient-press-indexes) [S62 @2026-11-18]. If you have only a listing, locate the matching alphabetical volume of Ruth and Sam Sparacio's *Virginia County Court Records Surname Indexes* in a library catalogue [S63 @2026-11-18]. Record the surname range you searched and follow each hit into the cited volume to read the abstract.","sources":["S61","S62","S63"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7b804f04c425","kind":"portal-availability","anchor":"- **Check the HathiTrust volume's rights and download options [S67 @2026-11-19].** Anyone can read a public-domain Full View item. Visitors can download unrestricted public-domain volumes in full, including many scanned by Internet Archive and items released under Creative Commons. For vendor-restricted scans, visitors can download single pages. Users signed in through a member library can download full public-domain volumes [S67 @2026-11-19]. A member login alone does not open a search-only copyrighted volume for ordinary reading [S67 @2026-11-19].\n  - Check the place and date of publication and the item's rights code. HathiTrust's 2026 guidance treats U.S. publications through 1930 and non-U.S. publications through 1900 as public domain. For non-U.S. publications from 1901 through 1930, its default full-view access applies from a U.S. IP address. For 1931 and later it generally treats the item as in copyright, subject to the individual volume's rights. Recheck the current thresholds when repeating a search [S29 @2026-11-19]. The code `pdus` restricts full view to a U.S. IP address, and `icus` to locations outside the U.S. [S30 @2026-11-19].\n  - To find volumes outside the default viewable set, choose All Items under Item Viewability [S31 @2026-11-19]. The Bibliographic API documents `usRightsString` as the U.S. user's view. Check the volume page from your own location before recording access [S32 @2026-11-19].","sources":["S67","S29","S30","S31","S32"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-publisher-county-search","kind":"platform-ui","anchor":"**Search a genealogy publisher's catalogue by county and state when a county bibliography has gaps.** The presenter reports a 2022 FamilySearch Catalog miss for the Highland County death book [S95† @2026-11-20], which the Library of Virginia lists as Woodrow Clay Hamilton's *Highland County, Virginia Death Records, 1853–1898*, F232 H8 H36 2010 [S97 @2026-11-20]. Recheck the title and county in the FamilySearch Catalog you can access. For Virginia, search Heritage Books' Virginia catalogue by county and record type [S96 @2026-11-20], then carry any discovered title into a holder's catalogue.","sources":["S95","S97","S96"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-jette-period","kind":"method","anchor":"**For early Québec families, open René Jetté's *Dictionnaire généalogique des familles du Québec des origines à 1730* first.** This 1983 Presses de l’Université de Montréal dictionary revises and corrects material in Cyprien Tanguay's *Dictionnaire généalogique des familles canadiennes* within Jetté's period [S68], [S69]. For years beyond 1730, check Tanguay's coverage. Resolve conflicting entries with the records behind them.","sources":["S68","S69"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-tanguay-ancestry","kind":"portal-availability","anchor":"**Search Ancestry for the Tanguay Collection or collection number 2177.** Check the collection label for Cyprien Tanguay's seven-volume *Dictionnaire généalogique des familles canadiennes* [S68 @2026-11-20], [S70 @2026-11-20]. If the surname is elusive, check volume VII for surname variants and *dit* names [S70 @2026-11-20]. Record the volume and printed page and follow the entry's details into the relevant register.","sources":["S68","S70"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-red-drouin-editions","kind":"portal-availability","anchor":"**Look for the Red Drouin under *Dictionnaire national des Canadiens français*.** Use the American-French Genealogical Society's Red Drouin listing to locate the CD or USB edition [S68 @2026-11-20], [S71 @2026-11-20]. In Genealogy Quebec's unified search, look for book 4 from the legacy Great Collections tool [S98 @2026-11-20]. Match the exact title and book number before using a Drouin result.","sources":["S68","S71","S98"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-red-drouin-dependence","kind":"method","anchor":"**Trace a Red Drouin entry through Tanguay before counting corroboration.** The Red Drouin carries forward some of Tanguay's entries and errors [S68], [S72]. If the two give the same relationship, check what each cites and use the underlying record to settle it.","sources":["S68","S72"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-acadian-compilations","kind":"method","anchor":"**For Acadian families, search by exact title and author before choosing a volume.** Look in WorldCat for Bona Arsenault's *Histoire et généalogie des Acadiens* and Stephen A. White's *Dictionnaire généalogique des familles acadiennes* [S68], [S73], [S74]. Check the Arsenault edition and its contents for the settlement you need. For White's first part, use volume I for A–G or volume II for H–Z, and check that the family was formed before 1715. Apply the holding copy's lending rule in [section 5](#5-carry-the-confirmed-title-across-holders).","sources":["S68","S73","S74"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-polona-published-material","kind":"portal-availability","anchor":"**For a Polish locality, search Polona for published material about the place.** Search by locality and inspect books, periodicals and maps before narrowing to surname hits. Record which types you checked and carry the titles you find into the within-book search [S80 @2026-11-20], [S81 @2026-11-20].","sources":["S80","S81"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-romanian-village-family-books","kind":"portal-availability","anchor":"**For an ethnic German family in a known Romanian village, look for an *Ortsfamilienbuch*.** According to the podcast transcript excerpt, one such book led between family groups through cross-references [S84† @2026-11-20]. Check the St. Louis County Library list by village for a title, including the village's German name if known [S85 @2026-11-20]. Check the parish and years covered, start with the surname, and follow family numbers across surnames to track marriages and children's births. Record the family number and cited register entries before drawing a relationship conclusion [S86 @2026-11-20].","sources":["S84","S85","S86"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-harvard-immigration-context","kind":"portal-availability","anchor":"**After an Ellis Island search, look for books about the migration identified by the record.** The podcast suggests Harvard's collection, according to the supplied transcript excerpt [S82† @2026-11-20]. Use Harvard's *Immigration to the United States, 1789–1930* to find publications on voluntary immigration by migrant group or destination [S83 @2026-11-20]. Use them for migration context and retain the passenger record for the individual arrival.","sources":["S82","S83"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-new-york-palatines","kind":"method","anchor":"**For Palatines who may have reached Pennsylvania through New York, look for Matthias Henry Richards's *The German Emigration from New York Province into Pennsylvania*.** The presenter suggests this route, according to the transcript excerpt [S87†]. Search for the standalone reprint or Part V of *Pennsylvania: The German Influence in Its Settlement and Development*, in volume IX of the Pennsylvania-German Society's *Proceedings and Addresses* (1899) [S88]. Use it to test the Schoharie-to-Tulpehocken route alongside a search for a direct arrival.","sources":["S87","S88"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-tenmile-family-index","kind":"method","anchor":"**For families who reached southwestern Pennsylvania from the Shenandoah Valley, search the Pennsylvania settlement separately.** The presenter suggests Howard L. Leckey's *The Tenmile Country and Its Pioneer Families*, according to the transcript excerpt [S87†]. For Greene and Washington counties, use the reprint's every-name index, then read the family sketch under its place of settlement [S89]. A Shenandoah book's coverage can end before the later settlement.","sources":["S87","S89"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-pennsylvania-archives-virginia-entries","kind":"method","anchor":"**For Virginia claims in western Pennsylvania or Pennsylvania donation lands, open Third Series, volume 3 of the published *Pennsylvania Archives*.** The presenter suggests checking the set, according to the transcript excerpt [S87†]. Use William Henry Egle's *Old Rights, Proprietary Rights, Virginia Entries, and Soldiers Entitled to Donation Lands* as the volume locator [S90]. Start at that volume in the Fold3 browse described above. Check the section heading before treating an entry as a Virginia claim or a donation-land entitlement.","sources":["S87","S90"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-kanawha-volumes","kind":"method","anchor":"**For West Virginia's Kanawha Valley, choose a volume by the kind of evidence needed.** According to the transcript excerpt, the presenter distinguishes settlement history from resident sketches [S91†]. In the 1891 *History of the Great Kanawha Valley*, start in volume I for early settlements and border events, including chapter X for the account of Cornstalk's death and later attacks [S92]. In volume II, browse the resident's county under the biographical sketches and check the medical history for pioneer physicians [S93]. Record volume and printed page with each lead.","sources":["S91","S92","S93"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dayton-upper-kanawha","kind":"method","anchor":"**For homes and settlers of the upper Kanawha, check Ruth Woods Dayton's *Pioneers and Their Homes on the Upper Kanawha* (1947).** The presenter suggests this title, according to the transcript excerpt [S91†]. Compare the target home or locality with the book's coverage before using a miss to assess the family's presence [S94].","sources":["S91","S94"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-acpl-submitted-family-histories","kind":"portal-availability","anchor":"**For a family account of U.S.–Canadian migration, check Allen County Public Library's Family Resources.** The article suggests Allen County Public Library, according to its search-result extract [S75† @2026-11-20]. Open **Family Resources** from the Genealogy Center's Research Resources and check for a submitted family history or file even if a published-title search found nothing [S76 @2026-11-20]. Record the account and the places it actually covers.","sources":["S75","S76"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-county-and-anniversary-book-photos","kind":"method","anchor":"**Browse the illustrations in a county history or a town's anniversary book.** According to the author's search-result excerpt, county histories and commemorative books are places to look for photographs [S77†]. Search library and historical society catalogues for the place with `history`, `centennial` or `bicentennial` [S78], [S79]. Once you have the book, browse its plates and captions even when the name search is empty. Record the edition, page or plate and the exact caption. Use a person's recognition only as their attributed claim. Facial resemblance carries no weight for identity.","sources":["S77","S78","S79"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-munsell-genealogies-index","kind":"method","anchor":"**Look up the surname in Munsell's *Index to American Genealogies* for early published U.S. research.** Use the 1900 fifth edition and search the *Supplement, 1900 to 1908* separately. The Genealogical Publishing Company reprint issued in Baltimore in 1979 contains both [S113], [S114]. Carry each cited book or article into the catalogue search. Search later publications separately. According to the chapter transcript, Jacobus describes the index as useful for the earlier literature [S112†].","sources":["S113","S114","S112"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-worldcat-subject-author-search","kind":"platform-ui","anchor":"**Use a relevant WorldCat record to start a new subject or author search.** In the item details, expand **Show More** under **Subjects** and click the heading that matches the place, topic and period [S100 @2026-11-21]. Run a separate **Author** search in **Advanced Search** for other works by the author [S101 @2026-11-21]. Log both queries. According to the episode transcript, Sunny Jane Morton demonstrates following a subject heading and suggests searching by author [S99† @2026-11-21].","sources":["S100","S101","S99"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-worldcat-public-list-search","kind":"platform-ui","anchor":"**Use WorldCat's public lists as another source of titles.** Once you have a relevant family history, use its historical surnames and localities as leads for list names in **Lists** search. Open promising lists and check each title against your scope [S107 @2026-11-21]. According to the episode transcript, Morton suggests looking for overlap in surnames and places and revisiting a relevant list for later additions [S99† @2026-11-21]. Record the list locator with the [book-discovery register](#9-close-with-a-book-discovery-register).","sources":["S107","S99"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-swiss-local-family-books","kind":"method","anchor":"**For a Swiss locality, look for a *Familienbuch* before abandoning the book search.** The MyHeritage author suggests looking through regional libraries and historical societies [S109]. Query their catalogues and bibliographies with the place name and *Familienbuch*. For the Basel region, check the genealogical society's source list for local family compilations [S110]. Verify the place and years covered and classify the item before using it. The Basel-Stadt archive guide also uses *Familienbuch* for household registers [S111].","sources":["S109","S110","S111"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-american-ancestry-contributed-lineages","kind":"method","anchor":"**For nineteenth-century U.S. contributors claiming colonial descent, search Joel Munsell's Sons' *American Ancestry*.** Use the twelve-volume set or the Clearfield reprint in four books. Start with the nineteenth-century descendant and work backward through the asserted line [S115]. Verify each link in the records. According to the chapter transcript, Jacobus describes the series as inviting contributors to submit their own lines [S112†].","sources":["S115","S112"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-virkus-compendium-volume-titles","kind":"method","anchor":"**For submitted U.S. pedigrees, search Frederick A. Virkus's seven-volume set.** Search under *The Abridged Compendium of American Genealogy* and *The Compendium of American Genealogy*. The original series used the shorter title for volumes 4–7 [S116]. Check the volume indexes for the descendant or the earliest American ancestor named in the line, and verify the reported links [S117]. According to the chapter transcript, Jacobus describes the scope of the pedigrees [S112†].","sources":["S116","S117","S112"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-brown-west-simsbury","kind":"method","anchor":"**For early settlers of Canton, Connecticut, search under West Simsbury as well.** Open Abiel Brown's *Genealogical History, with Short Sketches and Family Records, of the Early Settlers of West Simsbury, Now Canton, Conn.* (1856) for the family sketches [S128]. According to the episode transcript, the presenter recommends the book for these settlers [S123†].","sources":["S128","S123"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-peters-elk-run-volumes","kind":"method","anchor":"**For Brent Town and the Elk Run Valley in Fauquier County, Virginia, choose the volume by question.** Use Joan W. Peters's *Brent Town and the Elk Run Valley, A History*, volume I (*From Acquisition to Settlement, 1688–1800*) for land and settlement [S126]. Use volume II (*The Families and Homes, 1759–1800*) for family entries arranged by surname, and follow the probate records behind the family charts [S127]. According to the episode transcript, the presenter recommends both volumes [S123†].","sources":["S126","S127","S123"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-wright-amis-edition","kind":"method","anchor":"**For the Newton County, Mississippi, Amis compilation, choose the chapter by the family branch's earlier locality.** Search Lucius F. Wright's edition by ISBN 9780788455667 or by title words *Amis*, *Brewer* and *Newton County*. Use the chapters for Lewis or William Amis of Granville County, North Carolina, John Amis of Maury County, Tennessee, or the Brewer families of Sumter County, Alabama, through 1860 [S124]. According to the episode transcript, the presenter describes Wright's edition as an expansion [S123†]. Use Wright's second-edition introduction to identify what he added or recast in Register format and what comes from the 1936 manuscript by A. B. Amis. Count a claim carried over from the manuscript as one account [S125].","sources":["S124","S123","S125"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-charleston-exile-appendices","kind":"method","anchor":"**For a Charleston patriot thought to have been exiled to St. Augustine in 1780, check the appendices in *Patriots in Exile*.** In the book by James Waring McCrady and C. L. Bragg, start with appendix A for the exiles and appendix C for sources identifying them [S130]. Use those citations to follow the individual into the underlying records. According to the episode transcript, the presenter suggests using the names, sketches and citations in the book [S129†].","sources":["S130","S129"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-goodspeed-county-history-associates","kind":"method","anchor":"**If a Missouri county history omits the ancestor, read the county section and search its sketches for documented associates.** Look for Goodspeed's *History of Franklin, Jefferson, Washington, Crawford & Gasconade Counties, Missouri* (1888) and the added index in Southern Historical Press's 2001 reprint [S122]. Treat anyone found as an associate only when a record or passage supports the connection. According to the episode transcript, the presenter suggests the county history and the sketches of possible associates as alternate leads [S121†].","sources":["S122","S121"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-worldcat-visit-location","kind":"platform-ui","anchor":"**For an in-person visit, centre the WorldCat holdings search on a city the user can visit.** Use that public city name in the location setting [S102 @2026-11-21]. In **Find a Copy at a Library**, match the edition and compare the distances shown for featured libraries. Check **All libraries** for additional holders when available [S103 @2026-11-21]. According to the episode transcript, Morton used a city-based search to locate a copy she could visit [S99† @2026-11-21].","sources":["S102","S103","S99"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-seminary-library-guest-access","kind":"portal-availability","anchor":"**Check visitor access separately from lending at a seminary library.** Read the holding library's guest policy and opening hours before planning an on-site consultation. Saint Charles Borromeo Seminary's library allows visitors and lists separate borrowing eligibility [S104 @2026-11-21]. According to the episode transcript, Morton consulted a WorldCat holding on-site at a private seminary [S99† @2026-11-21].","sources":["S104","S99"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-holding-department-index-lookup","kind":"portal-availability","anchor":"**For an indexed work with an unknown page number, check the holding department's lookup policy.** Look for reference, local history or genealogy services at the holding library. If it offers lookups, draft a targeted index lookup for the user to send with the title, volume or edition, call number and the minimum name or date needed. St. Louis County Library accepts requests identifying an indexed source [S105 @2026-11-21]. According to the episode transcript, Morton suggests watching the holdings for these departments and describes asking for a lookup in an obituary index [S99† @2026-11-21].","sources":["S105","S99"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-reprint-editorial-apparatus","kind":"method","anchor":"**Check a reprint's front and back matter for added indexes, corrections and additions.** Search any added index and cite the edition and section that supplied the hit. Compare a correction with the original and record the source named for it. The Genealogical Publishing Company editions of *History and Genealogy of the Families of Old Fairfield* and *Kentucky Soldiers of the War of 1812* illustrate added corrections and an added index, respectively [S118], [S119]. According to the chapter transcript, Jacobus also describes reprints made from annotated copies [S112†]. If copied handwriting appears in a reprint, identify it as an annotation and look for the source copy.","sources":["S118","S119","S112"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-reprinted-record-excerpts","kind":"method","anchor":"**Search for a separate reprint when you have a reference to a periodical or printed archives volume.** Try the article or record-set title with the parent publication and the reprint publisher. Check the reprint's contents and citation to the original. For *The Pennsylvania Magazine of History and Biography*, check *Genealogies of Pennsylvania Families* [S120]. For Virginia land entries and Pennsylvania donation lands, check William Henry Egle's *Virginia Claims to Land in Western Pennsylvania Published with an Account of the Donation Lands of Pennsylvania*, the Clearfield reprint of two *Pennsylvania Archives* excerpts [S131]. According to the chapter transcript, Jacobus describes separate reprints of previously published records [S112†].","sources":["S120","S131","S112"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-worldcat-save-private-list","kind":"platform-ui","anchor":"**Save titles to a private WorldCat list when the user chooses account-based tracking.** In a personal account, use **Add item to list** and verify **Private** before saving. A public list is visible to WorldCat visitors [S106 @2026-11-21]. According to the episode transcript, Morton suggests grouping books by topic [S99† @2026-11-21].","sources":["S106","S99"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-worldcat-follow-list","kind":"platform-ui","anchor":"**Follow the public list if the user wants to revisit it and their account offers that control.** OCLC documents access to followed lists from the user profile [S108 @2026-11-21]. Keep the list locator in the register for later checks.","sources":["S108"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-reconstruct-short-book-citation","kind":"method","anchor":"**Reconstruct a short book citation before choosing an edition.** Read the citing work's bibliography and compare its other short references. Search distinctive title words with the known author, imprint year, publisher or place of publication. Retry with a shorter title and the author's name when an ISBN search fails. Compare the candidate's subtitle, imprint and edition with what the citation actually supplies [S132].","sources":["S132"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-conflicting-title-and-year","kind":"method","anchor":"**When a footnote's title and year disagree, search them separately.** Look up the exact title and the same author's works from the cited year. Compare the citing bibliography, title pages and date ranges. If the cited pages land in front matter, use the event date to find the relevant chapter in each plausible volume. Keep the citation unresolved if no passage matches [S138]. The footnote Kyläkoski transcribes gives 1951 for Castrén's *Nuori Arwidsson ja hänen ympäristönsä* [S138], whose Helka record gives 1944 [S139].","sources":["S138","S139"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-recover-translated-titles","kind":"method","anchor":"**If the catalogue cannot identify an original from a translated title, search for an intermediary edition.** Search both halves of the title in the likely intermediary language, including any subtitle. Search under the credited writer, translator or editor to find candidates. Check original-title links, title-page credits and prefaces before matching editions [S140], [S141]. If the source garbles the original author's name, search for the translator and subject together, then use the resulting edition's credits to identify the original author [S157], [S158]. Keep the original, translation and adaptation as separate candidates until their credits or texts establish the relationship.","sources":["S140","S141","S157","S158"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finna-material-type-filter","kind":"platform-ui","anchor":"**Retry a Finna title or author search with the book material-type filter cleared.** Inspect results under other types, including archival material, and compare the holding institution and imprint. A museum copy of a printed work can be excluded by the book filter [S135 @2026-11-22]. Remove the individual filter and log both searches [S136 @2026-11-22].","sources":["S135","S136"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-subject-filter-recall","kind":"method","anchor":"**Test a narrow subject search against titles already known to fit.** When using Melinda to find Finnish biographies, query a known title or author without the *henkilöhistoria* subject heading and century limits. Read the returned subject terms. If a known title disappears under either restriction, rerun the discovery search with that restriction cleared and assess the time period from the item itself [S137], [S136].","sources":["S137","S136"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-publication-stage-evidence","kind":"method","anchor":"**Keep publication status open when a notice only announces a plan, a manuscript submission or an intended sale.** Record the exact stage that the notice describes and search later notices for evidence of issue [S153], [S155]. Check whether a catalogue date was projected [S154]. If you have an ISBN, compare dated publisher, catalogue and bookseller records for that identifier and log each separately [S159]. Search under the author as well as the proposed title. Confirm the edition from an issued copy or a verified holding for that edition.","sources":["S153","S154","S155","S159"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-separate-author-entries","kind":"method","anchor":"**Search across separate author entries when one heading yields only part of a writer's work.** Query the credited name and documented variants, open each relevant author entry, and compare dates, roles and attached titles before combining the results [S142], [S143]. Keep title searches separate when the entries cannot be reconciled.","sources":["S142","S143"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-internet-archive-rerun-within-book","kind":"platform-ui","anchor":"**Rerun the target term inside the Internet Archive book.** After opening a result from a compound query, enter the historical name or phrase on its own in **Search Inside** so the broader term's highlights do not determine what you inspect [S144 @2026-11-22]. Select the hit markers to reach the corresponding pages and record the printed pages you read [S145 @2026-11-22].","sources":["S144","S145"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-agbi-publication-index","kind":"method","anchor":"**Use the American Genealogical-Biographical Index to find a published mention of a deceased person.** Search the name, then follow the result's source reference to the printed work or newspaper column. Godfrey Memorial Library's index covers both [S146], [S147]. Record the index locator separately from the edition, issue and page read.","sources":["S146","S147"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-catalogue-online-link","kind":"method","anchor":"**Open the electronic-access links in the catalogue record before planning a visit.** Check which links lead to the edition, which describe another format, and which lead to related material. Confirm that the linked copy contains the pages you need [S132], [S156].","sources":["S132","S156"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bookseller-as-bibliographic-lead","kind":"platform-ui","anchor":"**Use a bookseller listing to recover bibliographic clues for a scarce title.** At AbeBooks, try the full title, a distinctive title fragment and the author's name [S133 @2026-11-22]. Extract any author, edition and imprint details visible in the listing or title-page photographs. Carry those details back to a library catalogue and verify them against the copy you open [S132 @2026-11-22].","sources":["S132","S133"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-series-coverage-per-part","kind":"method","anchor":"**Check a multi-volume work volume by volume.** Start with the catalogue's stated extent and search for the needed volume or part by number and individual title. Match each scan to its own title page. Log duplicates as additional copies of the same volume, and record which part is still missing from the holders checked [S148], [S134].","sources":["S148","S134"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-almanac-collection-split","kind":"portal-availability","anchor":"**For Finnish almanacs, choose the National Library collection by the year of the issue.** For an issue before 1810, start at *Almanakat* under Swedish Era Literature in Books [S149 @2026-11-22], [S150 @2026-11-22]. For later issues, start at *Almanakat ja kalenterit* under Journals [S151 @2026-11-22]. Open the collection's online-material link and check the individual issue's access. Check the Almanac Office guide for Helsinki-horizon issues and distinguish free online reading from on-site access [S152 @2026-11-22].","sources":["S149","S150","S151","S152"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-copy-for-accompanying-material","kind":"method","anchor":"**Match the physical features your question needs to the copy you choose.** For a map, plate or foldout cited in the text, check the physical description and any accompanying-material field, then locate it in the actual scan or holding copy [S134]. Compare its locator with the edition cited. A reprint can serve a text lookup if the needed passage is present. For missing supplements, check another copy for the specific item [S132].","sources":["S132","S134"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-periodical-editor-trade-bibliography","kind":"method","anchor":"**Check contemporary trade bibliographies when the accessible periodical copy omits the editor.** Search the journal title and volume years in digitized book-trade listings [S170]. For the St. Petersburg society's *Mittheilungen der Kaiserl. freien ökonomischen Gesellschaft*, look in *Bibliotheca mechanicotechnologica et oeconomica* for the listing of the 1861 and 1862 volumes, which credits Dr. J. Johnson as editor [S171]. Record the credit with the years named in the listing and compare it with the corresponding volumes when available.","sources":["S170","S171"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-svenska-mercurius-subscribers","kind":"portal-availability","anchor":"**Look for the alphabetical subscriber list in the first annual volume of *Den Swänska Mercurius*.** Use the National Library of Finland's *Den svenske mercurius* record in Finna (`fikka.1529443`) to identify volume 1 (1755/56) [S168 @2026-11-23]. Look for the list in the opening material of the volume beginning in July 1755 [S169 @2026-11-23]. Record the subscriber's name, title or office and any locality given. According to the blog excerpt, the author's transcriptions from the paper copy include entries with Finnish localities [S167† @2026-11-23].","sources":["S168","S169","S167"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-dorman-virginia-founding-families","kind":"method","anchor":"**For a line from an early Virginia settler or Virginia Company investor, check whether the founder appears in John Frederick Dorman's fourth edition of *Adventurers of Purse and Person, Virginia, 1607–1624/5*.** Use the founding family's surname to choose volume 1 (A–F), 2 (G–P) or 3 (R–Z) [S165]. Start in volume 3 for Woodson [S166]. Trace each claimed path from the later generation back to the founding entry. Record marriages along each path and verify the parent–child links against the underlying records. According to the supplied transcript excerpts, the presenter recommends the compilation [S163†] and points to volume 3 for Woodson [S164†].","sources":["S165","S166","S163","S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-keating-epidemic-names","kind":"method","anchor":"**For someone who disappears from Memphis-area records around 1878, search J. M. Keating's *The Yellow Fever Epidemic of 1878, in Memphis, Tenn.* (1879).** Check the Memphis mortality index [S162] and the lists of deaths elsewhere, physicians and nurses, contributors, and names associated with the Howard Association [S161]. Record the page and list heading so each name hit retains its role. According to the supplied transcript excerpt, the presenter suggests looking up names in Keating's volume [S160†].","sources":["S162","S161","S160"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-kb-digitalt-metadata-search","kind":"platform-ui","anchor":"**Search KB Digitalt for historical illustrations, portraits and catalogued texts from Sweden's National Library.** Query the historical place and compare matches in the title (**Titel**) and subject (**Ämne**) fields. When an item credits a deceased creator (**Upphov**), run that name on its own as a separate search [S173 @2026-11-23], [S174 @2026-11-23]. Log these queries as metadata searches. According to the blog excerpt, the author compared fields for `Finland` and suggests `Sveaborg` for eighteenth-century imagery [S172† @2026-11-23]. Check the date and Regina ID on each `Sveaborg` hit to distinguish records with the same title [S175 @2026-11-23].","sources":["S173","S174","S172","S175"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
