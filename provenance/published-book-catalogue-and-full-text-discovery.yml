  - {"id":"S172","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2026/02/kungliga-biblioteketin-digitoimaa.html"],"published":"2026-02-16","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Search-result text and supplied blog excerpts read 2026-11-23.","entry_sha256":"2f1949ce389781817a790251449a255c1bec03adbeac861c50767b5565c61488","claims":["C-kb-digitalt-metadata-search"],"review":"reviewed"}
