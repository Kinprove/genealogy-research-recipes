claims:
  - {"id":"C-252ba23da22f","kind":"portal-availability","anchor":"Search MyHeritage’s United Kingdom and Ireland, Incoming Passenger Lists, 1878–1960 for arrivals\nand its United Kingdom and Ireland, Outgoing Passenger Lists, 1890–1960 for departures\n[S1 @2026-11-22]. The National Archives catalogues the Board of Trade lists as BT 26 inward and\nBT 27 outward [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-21a36795446d","kind":"portal-availability","anchor":"Search the FamilySearch outward index as a second way to locate a BT 27 entry [S5 @2026-11-22].","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3afa8c1679d6","kind":"historical","anchor":"Check the whole ship itinerary before logging a miss. Use BT 26 for arrivals from beyond Europe\nand the Mediterranean and BT 27 for sailings whose final destination lay beyond those waters.\nCheck intermediate ports on a qualifying itinerary, including passengers who left outward ships\nat those ports [S2] [S8].","sources":["S2","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-32510ff8cf1b","kind":"historical","anchor":"Apply MyHeritage’s Irish-port cutoff at independence in 1922 to both collections [S1]. A miss for\nan 1878–1888 inward voyage may reflect sparse survival. The Board of Trade destroyed many of those\nearly lists in 1900 [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-78aa2df1f606","kind":"method","anchor":"When a name search misses and the ship or port is known, use the port arrangement and BT 32 registers for 1906–1951 to locate a candidate list. For dates before 1908, the registers cover only Southampton, Bristol and Weymouth. Use the month before 1920 and check the sailing date where the register gives one [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e4372a4b68b0","kind":"method","anchor":"When the British series starts too late or the list does not survive, use the ship, port and\napproximate date to check passenger records at the overseas end of the voyage. A list there may\nsurvive independently [S4] [S6].","sources":["S4","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-99e59eb0ae41","kind":"method","anchor":"Confirm the ship and sailing against the original list header. Use the image’s column labels to\nrecord the vessel, departure and arrival dates, embarkation and disembarkation ports as supplied.\nCopy the passenger’s name, age or birth date, occupation, marital status and residence fields where\nthe form gives them [S1] [S2] [S3] [S4] [S5].","sources":["S1","S2","S3","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-57ace7014a89","kind":"example","anchor":"Check later typed forms for a full birth date, address and marital status when those details are\nmissing from other records. MyHeritage’s 1957 inward example shows all three fields [S4].","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0247f528f841","kind":"method","anchor":"Keep current or permanent residence separate from the proposed address and intended residence.\nA proposed address and intended length of stay describe plans for this voyage. Look for a later\nhistorical record showing where the passenger actually lived [S3] [S4] [S5].","sources":["S3","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-aa7b883ca596","kind":"method","anchor":"For an inward list, test a visit, return or onward journey before inferring settlement. MyHeritage\ndescribes lists filed at each U.K. stop on qualifying voyages, so an entry can record a transit\npassenger [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c582918aeff0","kind":"method","anchor":"For an outward list, treat the British embarkation port as the start of the recorded leg.\nCheck for earlier continental travel, such as a Scandinavian passenger traveling via a British\nport en route to the United States or Canada, and compare the destination country’s arrival\nrecord [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-aedfa000f4f1","kind":"example","anchor":"Keep the last U.K. address on an outward list separate from declared permanent residence.\nMyHeritage’s 1949 and 1955 Alfred Hitchcock examples give different London hotels and separately\nrecord his U.S. residence [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1efc4f86ed91","kind":"method","anchor":"On an inward voyage with separate British/Commonwealth and *alien* sheets, check both for the same\nship and date when relatives or companions may have held different nationalities. In MyHeritage’s\nNovember 1935 example, foreign-born travelers appear on a separate *alien* sheet. Treat the heading\nas the officials’ classification on that list and transcribe nationality and birthplace separately\n[S4] [S7].","sources":["S4","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5860449fdd0b","kind":"method","anchor":"When an occupation column gives *wife* or *child*, record the wording and compare nearby entries\nand ages to identify a candidate family group. If a household member is missing, look for them on\nlater departures or arrivals. Allow for separate crossings several years apart [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d491b1e5e5b1","kind":"method","anchor":"Compare names and occupations elsewhere on the list for possible work companions. Use an independent\nemployment record or contemporary report before assigning a professional connection [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dbc224f54011","kind":"method","anchor":"Compare dates, routes, occupations, addresses, stated residences and companions across repeat\nsailings before linking them to the same person. Set the dated legs beside gaps in home-country\nrecords to test whether travel or relocation could account for those gaps [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d64cf939679e","kind":"method","anchor":"Search the destination’s arrival records and next relevant census using the stated destination as a\nlead. Search contemporary newspapers by ship and sailing date for evidence of the trip’s purpose\n[S4] [S6].","sources":["S4","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-26ec7b17f372","kind":"method","anchor":"Report each leg’s direction, vessel, date, ports, archive series and page or image locator. Include\nthe literal field labels, stated travel plans, candidate companions and any missing sheets or\nvoyages. Record which lists you checked and which gaps reflect coverage or survival. Leave\nidentity, residence or travel purpose open where corroboration is missing [S1] [S2] [S4] [S6].","sources":["S1","S2","S4","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
