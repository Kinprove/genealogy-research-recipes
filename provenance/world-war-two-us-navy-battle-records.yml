sources:
  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2025/10/battle-of-midway-tracing-family-history-through-wwii-naval-records/"],"published":"2025-10-13","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the advice to check rosters, service and casualty records and wartime diaries for the Midway claim.","entry_sha256":"241d25cf715c0424f590b702fe5ca549b74bcc1c1bed5e3b9075bb5bd02316ba","claims":["C-01","C-03"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://www.archives.gov/research/military/navy/muster-rolls"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-18. Used the post-1940 location and the World War II muster-roll series description. Rechecked 2026-11-21. Used the wartime muster-roll access guidance in the section on 1940 and later rolls.","entry_sha256":"4a2ff41d8c9a88ba56655f4d9f47b6b8aad3f32fa7e5cc4db5a6f69e4046c183","claims":["C-01","C-02","C-04"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.archives.gov/research/military/logbooks/navy-deck-logs-1941-1959"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the officer and enlisted coverage distinctions as well as personnel remarks and ship activities.","entry_sha256":"54915f1eda322017b5f035572a7062850f48033f5f7797b82ff7ec436954cb86","claims":["C-02","C-03"],"review":"reviewed"}
  - {"id":"S4","kind":"pdf","urls":["https://www.archives.gov/files/research/military/ww2/ww2-participation.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the personnel file and Navy operational records sections for date coverage, monthly war diaries and action reports.","entry_sha256":"618da70a7190e3bcc8b661d787a14f57feddac71529954808665d3e955bdd143","claims":["C-01","C-03"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/wrapping-up-2024-myheritage-year-in-review/"],"published":"2025-01-01","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the community post’s announcement of the initial batch and its link to identify the collection.","entry_sha256":"fff4a9c752e6233ab02f3a69ee42731692945f46511532536ee68ac35f492362","claims":["C-04"],"review":"reviewed"}
  - {"id":"S6","kind":"catalogue","urls":["https://www.myheritage.com/research/records-catalog/military/catid-3000"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Verified the collection title and Search link in the public catalog. The linked collection page returned a bot challenge, so the review covered the catalog listing.","entry_sha256":"91226b5f2a4a5ef448c484d15636d9125eb2683f3352422293005d83ea7344c1","claims":["C-04"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://familytreemagazine.com/records/military/world-war-ii-service/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. David A. Fryxell found a draft card and Navy muster entries for a relative for whom he found no Army enlistment entry. Used the named collection routes, his advice to list the postings when results are out of order, and his pointer to a Pearl Harbor muster-roll guide. The linked FamilySearch guide returned a 403, so the recipe uses the National Archives locator and the National Park Service casualty list.","entry_sha256":"505bb3c6468a60f0c4cadc9782d58d524ac4bbcd5683a9791faa06beeb134df9","claims":["C-05","C-06","C-08","C-10"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://text-message.blogs.archives.gov/2013/12/02/know-your-records-u-s-navy-muster-rolls-and-personnel-diaries/"],"published":"2013-12-02","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the descriptions of enlistment details, dates reported for duty, dates of rolls and changes of status. The guide distinguishes the quarterly rolls from records of individual changes and notes that rolls do not establish daily whereabouts.","entry_sha256":"62cca94af7a1ffb4ea33e2e6e2225cb39114ec1cbe8209c620f890f59b016e4a","claims":["C-07","C-08"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://www.archives.gov/research/military/ww2/electronic-records.html"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the stated coverage of the World War II Army Enlistment Records in Record Group 64, National Archives Identifier 604357, which excludes other services.","entry_sha256":"4a39ac9cb158207fbeaccb2fae85ee829d7b93e32b508efa12513d6866207268","claims":["C-05"],"review":"reviewed"}
  - {"id":"S10","kind":"catalogue","urls":["https://www.fold3.com/publication/829"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The short URL returned the public collection overview with Search and Browse controls and a description covering ships, stations and other activities. The long URL and a repeat fetch returned a 403. No account search or image access was tested.","entry_sha256":"03aba3c484fc2553033ce4e8a9958d53feb335dd01f6c137f878abb7c7bc721c","claims":["C-06"],"review":"reviewed"}
  - {"id":"S11","kind":"catalogue","urls":["https://www.archives.gov/digitization/digitized-by-partners"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the Record Group 24 rows under National Archives Identifier 594996 for the Ancestry wartime Navy muster-roll partnership and the separate Pearl Harbor Muster Rolls locator. The linked Ancestry and Pearl Harbor Fold3 pages returned a 403, so the check covered the partner listings.","entry_sha256":"1d4f874f0fa0bb48a53478bba01456225bec5a0aaba5e48e1b0801752d3c8c28","claims":["C-06","C-10"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://www.nps.gov/perl/learn/historyculture/navy-casualties.htm"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the memorial’s Navy casualty list organized by ship or installation as a source of unit leads for fatalities.","entry_sha256":"70c349f6a516b3d23e425699fde0d3415b71686344e5906c2621aa89c50d9e0a","claims":["C-10"],"review":"reviewed"}
  - {"id":"S13","kind":"web-page","urls":["https://blog.myheritage.com/2025/05/myheritage-adds-105-million-historical-records-in-april-2025/"],"published":"2025-05-01","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the announcement’s description of enlistment date and place and its example that distinguishes the enlistment date from the date of the roll. Record fields were cross-checked against the National Archives guide in S8.","entry_sha256":"1c088e579168a337d5e1e33a77809ac4f61e8335a522e4fb33a1d4c1b4aba169","claims":["C-07"],"review":"reviewed"}
  - {"id":"S14","kind":"web-page","urls":["https://blog.myheritage.com/2025/07/myheritage-adds-1-25-billion-historical-records-in-june-2025/"],"published":"2025-07-06","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the announcement’s description of enlistment date, enlistment place and ship name when present. Record fields were cross-checked against the National Archives guide in S8.","entry_sha256":"7c9713030c617f83f70e7f97571ae3fc2b36ba9839fd59e47438ac9a4d8409f1","claims":["C-07"],"review":"reviewed"}
  - {"id":"S15","kind":"web-page","urls":["https://blog.myheritage.com/2026/05/research-the-history-of-your-american-ancestors-in-wwii-for-ve-day/"],"published":"2026-05-07","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the author’s suggestion to look for a transfer to a naval hospital when reconstructing assignments from the muster records.","entry_sha256":"bb55f0715c918e45f6cd3212a59bed29a0b6e8ffb91ab316f2ac9bc644a2ca0a","claims":["C-09"],"review":"reviewed"}
  - {"id":"S16","kind":"pdf","urls":["https://www.archives.gov/files/calendar/know-your-records/dec8-veterans-presentation_0.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the Navy Muster Rolls and Personnel Diaries sections on the date and explanation of transfers and other status changes, including medical departures.","entry_sha256":"ad3cce742104e424b58e59cdc2a1b1ba9b06d0c51c11bc4b738b4f4dc567cd4a","claims":["C-09"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://blog.myheritage.com/2026/01/7-wwii-battles-from-80-years-ago-tracing-your-ancestors-final-year-of-war/"],"published":"2026-01-25","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Used Gavin Crawley’s advice to take a battle name from a service file into casualty and hospital records and to follow evacuation after a wound at Iwo Jima or Okinawa. The post gives no locator for hospital-ship patient records.","entry_sha256":"7deb99de6383276c12d0163240870cd4031d78a09c79f1c5458cf122580e29e4","claims":["C-11","C-12"],"review":"reviewed"}
  - {"id":"S18","kind":"web-page","urls":["https://www.archives.gov/publications/ref-info-papers/82/part-1.html"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Used the Record Group 24 finding aid for the series title, the geographic and battle arrangement, the operation and ship alternatives, and the guide to finding evacuation details in ships’ logs. The guide describes uneven detail in logs and gaps in the casualty files.","entry_sha256":"507b523aaa01186bb3e0de3807b7066fbddc2c0716a8a828e78029d8dfb32f82","claims":["C-11","C-12"],"review":"reviewed"}
  - {"id":"S19","kind":"web-page","urls":["https://achh.army.mil/history/ancwwiibook-introduction/"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Used the Pacific section’s account of hospitals on Guam, Saipan and Tinian receiving casualties from Iwo Jima and Okinawa. The account describes evacuation routes at campaign level.","entry_sha256":"590947ca0fe7b1accac0b0110bd0f7a1b247b158a359536511bd71d743096593","claims":["C-12"],"review":"reviewed"}
  - {"id":"S20","kind":"web-page","urls":["https://www.archives.gov/personnel-records-center/active-duty-medical-records"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Used the Navy inpatient filing arrangement by hospital and the treatment dates and patient identifiers used to locate records. The guidance gives no inventory of surviving files for either campaign.","entry_sha256":"df9828e787d24958ac0efe12d12c531a756ee20063c54362e050e2c67ca803fd","claims":["C-13"],"review":"reviewed"}
  - {"id":"S21","kind":"web-page","urls":["https://www.archives.gov/personnel-records-center/clinical-records-access"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Used the guidance on limited public release without authorization and the information needed to locate the record.","entry_sha256":"95c72a2c14c2b3d33b524031badf8059c20156d9a02cee3fc51581adc875ff9d","claims":["C-13"],"review":"reviewed"}
  - {"id":"S22","kind":"web-page","urls":["https://www.archives.gov/personnel-records-center/medical-records-veterans-access"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Used the facility and patient information required for a request and the proof-of-death requirement for next-of-kin access.","entry_sha256":"849bfb12482bd93f266f60d15775feb85dae0a3d9b357199d4ceeb5121bf38d9","claims":["C-13"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"For an enlisted sailor, find the vessel or station in the World War II muster rolls, including the records around and after the battle date. Read changes, transfers and absences before concluding the sailor was aboard. Start from the service record if the ship is unknown. [S1], [S2], [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For an officer aboard ship, look in the deck log for officer lists and changes of assignment. Use the same deck log’s daily entries to track movements and any named casualties or personnel changes. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Use the ship’s deck log and the command’s war diary or action report for the battle dates. Correlate the unit’s activity with the person’s assignment, then check named casualty or missing reports for a claim of injury, death or disappearance. Attribute an individual role in the action only when the records describe it. [S1], [S3], [S4]","sources":["S1","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"portal-availability","anchor":"Search for the sailor by name in MyHeritage’s *United States, World War II Navy Muster Rolls, 1938-1949*. [S5 @2026-11-21], [S6 @2026-11-21] If the index returns no match, keep the assignment unresolved and use the National Archives’ muster-roll guide to locate rolls for a known vessel or station around the battle date. [S2 @2026-11-21]","sources":["S5","S6","S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"If a World War II draft card is the starting point, establish the branch from service evidence. A miss in the World War II Army Enlistment Records leaves possible Navy service unresolved. For enlisted Navy service, use Navy muster rolls. [S7], [S9]","sources":["S7","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"portal-availability","anchor":"If you need another name index, search for the sailor by name in the *World War II Navy Muster Rolls* at Ancestry or Fold3. [S7 @2026-11-22], [S10 @2026-11-22], [S11 @2026-11-22]","sources":["S7","S10","S11"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Use the enlistment date and any recorded enlistment place on the roll to distinguish same-name hits. Take the ship or station from the roll heading and keep the enlistment date separate from the date the sailor reported for duty. [S8], [S13], [S14]","sources":["S8","S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"For each posting, record the ship or station, the date the sailor reported or the change occurred, and the date of the roll. Sort the postings by reporting or change date before deciding which assignment spans the battle. Leave gaps in the dated evidence unresolved. [S7], [S8]","sources":["S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"If a report of changes records a transfer to a naval hospital, enter the transfer date and destination before deciding whether the sailor was aboard on the battle date. [S15], [S16]","sources":["S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"portal-availability","anchor":"For Pearl Harbor on 7 December 1941, use the *Pearl Harbor Muster Rolls* entry in the National Archives’ digitization guide to locate the ship’s rolls and check changes around the attack. [S7 @2026-11-22], [S11 @2026-11-22] For a reported death, scan the Pearl Harbor National Memorial’s U.S. Navy casualty list for a ship or station lead. [S12 @2026-11-22]","sources":["S7","S11","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"When a service file names a Navy action, use the geographic area and the battle or campaign name to locate the folder in *World War II by battle or campaign*, a subseries of *World War II casualty lists and related records, 1941–52* in the Bureau of Naval Personnel records (RG 24). Look for the sailor in the folder’s casualty lists and compare any identifiers with the service file. If the battle folder is missing or yields no match, check the *Comprehensive list by operation* under the operation name or *World War II by ship* under the vessel name. Keep casualty status unresolved if the records do not identify the sailor. [S17], [S18]","sources":["S17","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"For a reported wound at Iwo Jima or Okinawa, look for the sailor’s evacuation transfer in the casualty records or the assigned ship’s deck log. If a record identifies a hospital ship, follow that ship’s deck log from the transfer date through disembarkation. Use the port and disembarkation date to narrow the search for a named admission at a receiving facility. If the destination is unclear, check Guam, Saipan and Tinian as leads. Confirm the destination only when a record ties the sailor to the receiving facility. [S17], [S18], [S19]","sources":["S17","S18","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"custody","anchor":"To verify admission at an identified naval hospital, request the inpatient record from the National Personnel Records Center. Use the hospital’s name and location, treatment type, treatment year and any known month. Include the sailor’s name as used during treatment, status during treatment, and service or Social Security number as required. [S20 @2026-11-23], [S21 @2026-11-23], [S22 @2026-11-23] Follow the Center’s clinical-record release rules. Public access is limited without authorization, and next-of-kin access requires proof of death. Keep the request as an unsent draft until the privacy gate is cleared. [S21 @2026-11-23], [S22 @2026-11-23]","sources":["S20","S21","S22"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
