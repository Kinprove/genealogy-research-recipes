  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2025/10/battle-of-midway-tracing-family-history-through-wwii-naval-records/"],"published":"2025-10-13","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the advice to check rosters, service and casualty records and wartime diaries for the Midway claim.","entry_sha256":"241d25cf715c0424f590b702fe5ca549b74bcc1c1bed5e3b9075bb5bd02316ba","claims":["C-01","C-03"],"review":"reviewed"}
