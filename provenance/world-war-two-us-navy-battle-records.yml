claims:
  - {"id":"C-01","kind":"method","anchor":"For an enlisted sailor, find the vessel or station in the World War II muster rolls, including the records around and after the battle date. Read changes, transfers and absences before concluding the sailor was aboard. Start from the service record if the ship is unknown. [S1], [S2], [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For an officer aboard ship, look in the deck log for officer lists and changes of assignment. Use the same deck log’s daily entries to track movements and any named casualties or personnel changes. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Use the ship’s deck log and the command’s war diary or action report for the battle dates. Correlate the unit’s activity with the person’s assignment, then check named casualty or missing reports for a claim of injury, death or disappearance. Attribute an individual role in the action only when the records describe it. [S1], [S3], [S4]","sources":["S1","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
