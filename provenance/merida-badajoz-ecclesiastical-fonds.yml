claims:
  - {"id":"C-01","kind":"custody","anchor":"Choose the fonds by the body that created the record. Use the Mérida-Badajoz repository’s separate routes for the bishop, cathedral chapter, parishes and the two military orders. For a sacrament, start with the named parish and use [Spanish record routing](spanish-civil-parish-record-routing.md) to fix its period diocese. [S3 @2026-11-22], [S4 @2026-11-22]","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For an episcopal edict, circular, letter or pastoral visitation, start in the diocesan fonds under Gobierno. For parish fabric accounts or the papers of the Comisión de Culto y Clero or Junta Diocesana, start in Administración. Record the parish, date and the document’s issuing or receiving authority. [S1], [S2], [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"For the cathedral chapter, start in Administración económica for finances, Patrimonio for movable and immovable property, and Fundaciones for chaplaincies and pious works. Keep a cathedral foundation and a similarly named parish foundation as separate candidates. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Use *Catálogo-Inventario Fondo Orden de Alcántara. Prioratos de Magacela y Zalamea* for those priories. For Santiago use the catalogue naming the San Marcos de León priory, Provincia de León en Extremadura and the Llerena and Mérida provisorates. Check the title’s jurisdictions against the locality before treating a catalogue search as covering the relevant order. [S1], [S2], [S5], [S6]","sources":["S1","S2","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"historical","anchor":"Keep the series searched and its date coverage visible. The 1705 bombardment, losses during the Napoleonic invasion and losses associated with the Spanish Civil War can explain gaps in Badajoz’s episcopal papers. Record which series or years remain unaccounted for and leave the fate of an individual file unresolved without specific evidence. For an absent sacramental volume, follow the parish and diocesan alternatives in [Catholic record recovery](catholic-parish-diocesan-record-recovery.md). [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
