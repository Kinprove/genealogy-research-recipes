claims:
  - {"id":"C-087fbfede0ed","kind":"unclassified","anchor":"Use this recipe before you search for a Canadian birth, marriage or death registration, a First or Second World War personnel file, a Métis or First Nations record, or a British Home Child. It sends each record to the custodian and access category of its own province, date and series. It prevents five failures: treating Canadian vital records as one national system, reading a miss past an archive's release cut-off or inside a registration gap as an absence, calling a Second World War file unavailable without checking whether it is open or closed, searching treaty paylists and scrip by surname alone, and searching for a Home Child with the family instead of inside the agency party.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-be58a967f331","kind":"unclassified","anchor":"- **Route by province, not by \"Canada\".** Vital registration is provincial. Each province has its own start date, gaps and archive cut-off, so build one coverage row per province before you search.\n- **Use these rows for the three provinces checked.** The cut-offs are the holdings as published on 2026-11-04. Re-read the custodian's page before you rely on a cut-off; cut-offs move forward as registries release years.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d20dd3936b31","kind":"unclassified","anchor":"| Province | Registration coverage | Archive holdings (read 2026-11-04) | Later years |\n  | --- | --- | --- | --- |\n  | Ontario | From 1 July 1869 [S12]; not widely followed for some years after [S1] | Archives of Ontario: registrations from 1869 up to a cut-off for each event type [S2]; ask the Archives before ServiceOntario | ServiceOntario [S2] |\n  | British Columbia | BC Archives index: births 1854–1904, marriages 1871–1950, deaths 1872–2005 [S3] | Royal BC Museum / BC Archives genealogy search [S3] | BC Vital Statistics Agency, which releases years to the BC Archives annually [S3] |\n  | Nova Scotia | Births and deaths 1864–1877, then none until October 1908; marriages continuous [S4] | Nova Scotia Archives, online as of July 2025: births 1864–1877 and 1908–1924, delayed births 1830–1924, marriage bonds 1763–1864, marriage registrations 1864–1949, deaths 1864–1877 and 1908–1974; 1925 birth registrations transferred to the Archives but not yet online [S4] | Vital Statistics, Service Nova Scotia (as of March 2026): births from 1926, marriages from 1951, deaths from 1976 [S4] |","sources":["S12","S1","S2","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aedda565804d","kind":"unclassified","anchor":"- **For any other province, build the row from that province's custodian page** before you read a result: start date, gaps, archive cut-off per event type, and the office that holds later years.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bf27daf6dfff","kind":"unclassified","anchor":"- **Past the archive cut-off, route to the provincial registry.** Ask the Archives of Ontario first for an Ontario birth, marriage or death; a registration it does not hold is with ServiceOntario [S2], not missing. A Nova Scotia birth of 1925 is at the Nova Scotia Archives although it is not yet online; request it there [S4]. A BC birth after 1904 is outside the BC Archives index, not absent [S3].\n- **Inside Nova Scotia's 1877–1908 gap, do not search for a birth or death registration.** The province did not record them [S4]. Search instead:\n  - marriage registrations, which run straight through the gap [S4];\n  - delayed birth registrations, which cover births from 1830 [S4];\n  - City of Halifax death registers, 1890–1908, for a Halifax death [S4];\n  - church registers, through the parish recipe.\n- **In Ontario's first years, do not read a missing registration as an absence.** Registration began on 1 July 1869 but was not widely followed for some years [S1]. Search church and census substitutes before you call the event unrecorded.\n- **Write the row on every negative.** Record the province, the series, the years it covers and the cut-off date you read. A miss without that row is not a negative search.","sources":["S2","S4","S3","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7daf03a9eb9f","kind":"unclassified","anchor":"- **First World War: open the Canadian Expeditionary Force file in LAC Collection Search.** Library and Archives Canada (LAC) digitised more than 600,000 CEF service files and put them in Collection Search [S5]. Almost all are online [S6] and free to view there. Treat a CEF file that is not found as a search problem first, not as a lost file.\n- **Second World War: decide the access category before calling a file unavailable.**\n  - **Died in service, 1939–1947:** the file is open. Download it from Collection Search with the download arrow [S7]. Expect a \"genealogy package\" of selected documents for most entries; only about 1,600 are complete or partial digitised files [S7].\n  - **Survived the war:** the file is closed. Request it through an ATIP (access to information or privacy) request. LAC requires proof of death, or the consent of the person if still alive [S7].\n- **Record the category and the request route** in the packet. \"Not online\" for a survivor's file is the access rule, not a loss.","sources":["S5","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3aa1fcdfd4f8","kind":"unclassified","anchor":"- **Métis scrip: read the application for parents and birth details.** Scrip applications give dates and places of birth and the names of parents, children and spouses, and are filed alphabetically within several Department of the Interior (RG 15) series [S12]. Search the scrip series directly rather than relying on a name-index miss.\n- **Treaty annuity paylists: search by band, list by list, not by surname.** They are Indian Affairs records in LAC RG 10, reached through finding aids FA 10-91, 10-109 and 10-116 [S8]. The government identified band members by a band number or \"ticket\" given to a family or to an adult living alone [S8]. Record any band or ticket number you find.\n- **Expect a privacy restriction on paylists after 1909** [S8]. Record a later list as restricted, not as missing.\n- **Hudson's Bay Company servants and posts: search the Hudson's Bay Company Archives at the Archives of Manitoba.** The HBCA is part of the Archives of Manitoba and holds servants' contracts and pre-1870 records from almost five hundred HBC posts [S9].","sources":["S12","S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-286846ac9943","kind":"unclassified","anchor":"- **Date the movement correctly.** More than 100,000 children were sent from the British Isles between 1869 and the late 1930s. The Fairbridge Society brought some Middlemore children to a farm school in British Columbia between 1936 and 1948 [S10].\n- **Search LAC's Home Children index in Collection Search.** It is built mainly from passenger lists. Where lists were missing or unreadable, LAC filled gaps from other immigration records, and it added a Boards of Guardians register [S10].\n- **Search the party, not the family.** The child usually travelled in an agency party, not with relatives. LAC gave each group of children travelling together a code [S10]. Search by that code to see the whole party and its arrival.\n- **Request the agency's own case records.** Barnardo's holds the records of its child migrants and also those of the Marchmont, Annie Macpherson and Liverpool Sheltering Homes. It releases them through its Family History Service, with the signed consent of the nearest surviving descendant [S11].","sources":["S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
