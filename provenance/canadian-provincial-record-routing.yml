  - {"id":"S58","kind":"web-page","urls":["https://blog.myheritage.com/2026/09/myheritage-adds-338-million-historical-records-in-august-2026/"],"published":"2026-09-06","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Article text read 2026-11-22","entry_sha256":"49cebcba05588e18d633c4fef45eca660d8aaf057fe6e2d17bc00bae8ec0531a","claims":["C-alberta-marriage-index-verification"],"review":"reviewed"}
  - {"id":"S59","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-21020/canada-alberta-marriage-index-1877-1950"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Public catalogue description read 2026-11-22","entry_sha256":"8a7bd63944f82e2503d2ba407693d0290a05851dfe89610435ca05b5d0e74c20","claims":["C-alberta-marriage-index-verification"],"review":"reviewed"}
