  - {"id":"S56","kind":"web-page","urls":["https://blog.myheritage.com/2023/06/46-million-historical-records-added-in-may-2023/"],"published":"2023-06-11","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Article text read 2026-11-22","entry_sha256":"59037f7691f044f04366e62e0408365bcd21206cccdebea84fd4bdeba8b3ab1c","claims":["C-bc-marriage-death-locators"],"review":"reviewed"}
