claims:
  - {"id":"C-01","kind":"portal-availability","anchor":"Use the denominator printed for the population, date and area you are comparing. For historical city figures, open the Aluesarjat historical series and read its own notes with the City’s Working Papers 2016:1. Distinguish *henkikirjoitettu väestö* from counts based on church registers and from census presence. The working paper’s national-register use of *läsnäoleva väestö* refers to permanent residents, including foreign nationals, and *poissaoleva väestö* includes Finnish citizens transferred to that category on moving abroad. Apply the city table’s own definition when reading the same terms in a municipal census. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"historical","anchor":"Read exemptions and inclusions against the table and year. For 1870 the published report describes omissions from the parish and poll-tax figures, including Russian troops and foreigners residing on passports. The cited Aluesarjat age series notes inclusion of foreign nationals in the poll-tax population from 1951. Treat exceptional years separately and require a note for the exact series before inferring who was counted. [S4] [S2] [S3]","sources":["S4","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"example","anchor":"Use Statistics Finland’s urban census guide for the published report or the archive of original household schedules. For an unpublished schedule, identify the enumeration district from the locality and year before choosing the folders. Check the actual delivery location and reading-room availability in the current order for the exact series before planning a visit. A 2024 account found the district list was a separately ordered item and the apparent catalogue location differed from the order location. [S5] [S6]","sources":["S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"historical","anchor":"For 1 March 1870, use the Helsinki report’s *todellinen väestö* total, 32,113, for the whole city on census day. It includes visitors present and excludes residents temporarily away. Open Helsinki table 7, *Kaupungissa olevia epäsuomalaisia alamaisia*, for non-Finnish subjects. Calculate their share with the published total as denominator because these people are already included in it. Compare the table’s subjecthood with the report’s birthplace categories as independent classifications, and use the matching area and sex columns where relevant. [S4] [S3]","sources":["S4","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"portal-availability","anchor":"Open the City’s digitized statistical yearbook for the edition needed, for example the 1910 volume. Record the observation year in each table and keep the edition or publication date in the citation. Check the table heading, district key and footnotes before comparing rows. If a topic is tabulated for the city or a combined area, keep the figures at that level and look for a separate district series. [S7 @2026-11-22] [S1 @2026-11-22] [S8 @2026-11-22]","sources":["S7","S1","S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Start a birthplace or language comparison with each table’s population basis. Keep census-day totals apart from registered population and carry unknown birthplace or distinct language categories through the comparison. For a time series, test changes in boundaries and categories before joining successive editions. The Aluesarjat age series uses presence for the 1900–1920 censuses and city residence for 1930 and 1950, so the similar-looking rows do not answer the same question. [S2] [S1] [S8]","sources":["S2","S1","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
