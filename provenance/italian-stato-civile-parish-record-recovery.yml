claims:
  - {"id":"C-947c9364f34c","kind":"unclassified","anchor":"- **Parish custody, diocesan copies, successor parishes and dispensation files:** [Catholic parish and diocesan record recovery](catholic-parish-diocesan-record-recovery.md).\n- **Baptism–marriage margin notes between parishes:** [Catholic sacramental cross-notations](catholic-sacramental-cross-notations.md).\n- **A town with several names or a frazione (hamlet) you cannot place:** [historical place-name resolution](historical-place-name-resolution.md).\n- **Using a photographed index to browse an unindexed FamilySearch register:** [FamilySearch practical workflows](familysearch-practical-record-workflows.md), workflow 3.\n- **Frame versus page, and scan availability versus index coverage:** [archival image coverage verification](archival-image-coverage-verification.md).\n- **Identity rulings:** [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4bd650ef2624","kind":"unclassified","anchor":"| Place and period | Legal register of the event |\n| --- | --- |\n| Sicily, from 1820 | Civil registers kept by the comuni under the Codice per lo Regno delle Due Sicilie (code of the Two Sicilies) [S1] |\n| Comuni then in the Kingdom of Italy | Stato civile of the comune under R.D. 15 November 1865 n. 2602 [S2] |\n| Veneto and Trentino under Napoleonic rule (Venice from 16 June 1806, Trentino 1811–1815) | Civil register kept by the comune's civil-status office; the registers are now usually at the State Archive [S17], [S18], [S19] |\n| Veneto, 1816 to 31 August 1871 | Parish book; the parishes kept the civil-status registers under Austrian law [S3], [S17] |\n| Veneto, from 1 September 1871 | Stato civile of the comune [S3] |\n| Rome and its province, after 1870 | Stato civile [S4] |\n| Trentino from 1815, and Venezia Giulia under Austrian rule, to 31 December 1923 | Parish book; the parishes served as the civil-status office [S5], [S6], [S7] |\n| Trentino and Venezia Giulia, from 1 January 1924 | Stato civile of the comune; in Trieste under R.D. 24 September 1923 n. 2013 [S5], [S6] |","sources":["S1","S2","S17","S18","S19","S3","S4","S5","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cb1620acaf76","kind":"unclassified","anchor":"- **Do not apply the 1865 decree to the whole country.** It covers only the comuni then in the Kingdom. Veneto, Rome, Trentino and Venezia Giulia came under the comune Stato civile later [S3], [S4], [S5].\n- **Search a Napoleonic-period event in the municipal civil register, not the parish book.** In Venice that register ran from 16 June 1806; parish competence returned on 1 July 1815 for marriages and 1 January 1816 for births and deaths [S17]. For a place not in the table, take the Napoleonic dates from the local State Archive's guide.\n- **Log a priest-as-officer year as a parish search, not a civil gap.** Where the parish kept the state civil-status register, the parish book or its state copy is the civil record. Its absence from a comune series is expected. Send the search to the parish or diocese (step 4).\n- **For a former Austrian place outside Trentino and Venezia Giulia proper,** take the changeover year from the local State Archive's guide, not from this table.\n- **For a place and period not in the table,** take the start of civil registration from the guide of the State Archive that holds the province's Stato civile.\n- **Fix the place first.** A frazione moved between comuni or a comune between provinces changes the series. Resolve it with the place-name recipe.","sources":["S3","S4","S5","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e928cb0f8d8d","kind":"unclassified","anchor":"- **Use antenati.cultura.gov.it.**\n- **Read Antenati as State Archive material, not as the whole record.** Its registers come from over 100 Archivi di Stato (State Archives) [S8]. Former Austrian areas differ: there the parish kept the registers before the changeover (step 1).\n- **Do not trust a name-search miss.** Cerca per nome (search by name) reaches only what has been indexed. A miss says nothing about the registers it did not reach.\n- **Browse the indexes before the year volumes.** Use the indici decennali (ten-year indexes) and the annual index at the end of each register. Then open the act.\n- **Classify a missing comune or year as a coverage gap.** Check, in order:\n  - the comune's own register at its Ufficio dello Stato Civile (step 6);\n  - whether the series has been digitised and published at all;\n  - FamilySearch, for the same comune and years.\n- **Cite each layer separately:** the State Archive, the series, the comune, the register and year, the act number, and the Antenati image. Keep the act number even when the image number changes.","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ef0778624790","kind":"unclassified","anchor":"- **Before civil registration and in its gaps, search the parish books.** Baptisms, marriages, burials and the stato delle anime (status animarum, a household-by-household parish census) are normally kept by the parish or gathered into the diocesan archive [S9]. Parish priests had to keep stati delle anime regularly after the Rituale Romanum of 1614, household by household with ages [S10].\n- **Find the holder through BeWeB** (beweb.chiesacattolica.it), the Italian bishops' conference (CEI) catalogue of ecclesiastical archives. It lists only archives registered with it and gives their contact details. It does not do research; you arrange access with the archive itself [S11].\n- **Check Antenati for parish books only in a State Archive's gap years.** Where a State Archive holds parish-kept registers that served as the civil record, check Antenati for those years [S9]. Alessandria's parish registers of 1838–1865 are an example [S9]. Expect most parish books, especially before 1800, only at the parish or diocese [S9].\n- **For the diocese in the event year** (Italian dioceses do not follow modern provinces), a priest's statement that books burned, diocesan copies, merged parishes and dispensations, follow the Catholic parish recipe.","sources":["S9","S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d6f76ed7eeba","kind":"unclassified","anchor":"- **Search the liste di leva (conscription lists) by comune of residence and classe.** The comuni compiled them [S12], [S13]. The classe is the year of birth [S12].\n- **Search the ruoli matricolari (service rolls) by distretto militare and classe.** They were kept by the distretto militare (military district) of the man's residence [S12].\n- **Do not read a missing service roll as disproof.** Not every man in the liste has a ruolo or foglio matricolare (service sheet) [S13]. A man found in the liste and missing from the ruoli is still the man in the liste.\n- **Look for both series in a State Archive.** The Modena and Bergamo State Archives hold and describe them [S12], [S13]. Confirm which State Archive holds the man's district before you log a miss.","sources":["S12","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8b9f8aee87b6","kind":"unclassified","anchor":"- **Ask the Ufficio dello Stato Civile for a vital act.** Every comune has one [S14]. It keeps the birth, marriage, death and citizenship registers [S15].\n- **Ask the Ufficio Anagrafe for a household or a move.** The anagrafe holds the registro di popolazione (population register), kept as fogli di famiglia (family sheets) showing household members and changes of residence [S15], [S16].\n- **Date the population register by the place.** It was set up by R.D. 31 December 1864 n. 2105 and kept from 1 January 1865 [S16]. Former Papal State territory followed under the law of 20 June 1871 n. 297 [S15]. For a place annexed later, take the dates from the local archive's guide: Trieste's family sheets begin in 1857, under the imperial ordinance of 23 March 1857, and are kept by the Comune di Trieste [S5].\n- **Treat a request to the wrong office as unanswered, not negative.** Re-send it to the right office before you log a miss.","sources":["S14","S15","S16","S5"],"checked":null,"stated_as":null,"review":"pending"}
