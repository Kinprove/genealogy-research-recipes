claims:
  - {"id":"C-947c9364f34c","kind":"unclassified","anchor":"- **Parish custody, diocesan copies, successor parishes and dispensation files:** [Catholic parish and diocesan record recovery](catholic-parish-diocesan-record-recovery.md).\n- **Baptism–marriage margin notes between parishes:** [Catholic sacramental cross-notations](catholic-sacramental-cross-notations.md).\n- **A town with several names or a frazione (hamlet) you cannot place:** [historical place-name resolution](historical-place-name-resolution.md).\n- **Using a photographed index to browse an unindexed FamilySearch register:** [FamilySearch practical workflows](familysearch-practical-record-workflows.md), workflow 3.\n- **Frame versus page, and scan availability versus index coverage:** [archival image coverage verification](archival-image-coverage-verification.md).\n- **Identity rulings:** [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4bd650ef2624","kind":"historical","anchor":"| Place and period | Legal register of the event |\n| --- | --- |\n| Mainland South (Kingdom of Naples), 1809 to 1814 | Civil register kept by the comune under Murat's decree of 29 October 1808, no. 198 [S27], [S31] |\n| Mainland South (Kingdom of the Two Sicilies, roughly today's southern Italy), 1815 to 1865 | Civil register kept by the comune; the Napoleonic civil register stayed in use there after 1815 [S20] |\n| Sicily, from 1820 | Civil registers kept by the comuni under the Codice per lo Regno delle Due Sicilie (code of the Two Sicilies) [S1], [S20] |\n| Comuni then in the Kingdom of Italy, from 1 January 1866 | Stato civile of the comune under R.D. 15 November 1865 n. 2602 [S2], [S20] |\n| Veneto and Trentino under Napoleonic rule (Venice from 16 June 1806, Trentino 1811–1815) | Civil register kept by the comune's civil-status office [S17], [S18], [S19] |\n| Veneto under the Austrian registration system, to 31 August 1871 | Parish book; the parishes kept the civil-status registers under Austrian law [S3], [S17], [S18] |\n| Veneto, from 1 September 1871 | Stato civile of the comune [S3] |\n| Rome and its province, from 1 February 1871 | Stato civile of the comune; R.D. 27 November 1870 n. 6030 extended the 1865 decree to the province [S22] |\n| Trentino from 1815, and Trieste and Gorizia, to 31 December 1923 (the Austrian system stayed in force after 1918) | Parish book; under Austrian law the parishes served as the civil-status office [S5], [S6], [S7]. In Trieste the other officially recognised faiths kept their own registers [S5] |\n| Trentino, Trieste and Gorizia, from 1 January 1924 | Stato civile of the comune; R.D. 24 September 1923 n. 2013 extended the 1865 decree to the territories annexed after the First World War [S23], [S5], [S6] |","sources":["S27","S31","S20","S1","S2","S17","S18","S19","S3","S22","S5","S6","S7","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-101da828c04b","kind":"custody","anchor":"**Find where the earlier registers are now.** The Naples State Archive holds the civil registers of Naples and its province from 1809 to 1865 [S21 @2026-11-13]. Venice's Napoleonic registers were gathered into the State Archive [S17 @2026-11-13], and the Vicenza State Archive holds those of the Vicenza cantons [S18 @2026-11-13]. Trentino's Napoleonic registers survive at the Provincial Archive of Trento for nine comuni [S19 @2026-11-13]. A 1919 memo cited in its inventory says that many records of several Trentino comuni from that period had ended up in Innsbruck [S19 @2026-11-13]. In Vicenza province the Austrian-era parish books are searched in the parishes or the Diocese of Vicenza's historical archive [S18 @2026-11-13]. For Trieste before 1924, search the parish archives, the Trieste diocesan archive (copies of the parish registers of the Diocese of Trieste and Capodistria, 1833–1941) or the archives of the other recognised faiths [S5 @2026-11-13]. For Gorizia, the archbishop's curia archive holds copies of the birth, marriage and death registers from 1835 [S6 @2026-11-13]. Neither the Trieste nor the Gorizia State Archive holds its province's Stato civile series [S5 @2026-11-13], [S6 @2026-11-13]. The Trieste State Archive does hold the registers of the Italian consulate, which recorded Italian citizens living in Trieste in 1867–1915, and those of the Anglican community [S5 @2026-11-13].","sources":["S21","S17","S18","S19","S5","S6"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cb1620acaf76","kind":"historical","anchor":"- **Do not apply the 1865 decree to the whole country.** It covers only the comuni then in the Kingdom. The others came under the comune Stato civile later: Veneto in 1871 [S3]; Rome in 1871 [S22]; Trentino, Trieste and Gorizia in 1924 [S23], [S5], [S6].\n- **Search a Napoleonic-period event in the municipal civil register, not the parish book.** In Venice that register ran from 16 June 1806; parish competence returned on 1 July 1815 for marriages and 1 January 1816 for births and deaths [S17]. For a place not in the table, take the Napoleonic dates from the local State Archive's guide.\n- **Log a priest-as-officer year as a parish search, not a civil gap.** Where the parish kept the state civil-status register, the parish book or its state copy is the civil record. Its absence from a comune series is expected. Send the search to the parish or diocese (step 4).\n- **For a former Austrian place outside Trentino, Trieste and Gorizia,** take the changeover year from the local State Archive's guide, not from this table.\n- **For a place and period not in the table,** take the start of civil registration from the guide of the State Archive that holds the province's Stato civile.\n- **Fix the place first.** A frazione moved between comuni or a comune between provinces changes the series. Resolve it with the place-name recipe.","sources":["S3","S22","S23","S5","S6","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e928cb0f8d8d","kind":"portal-availability","anchor":"- **Use antenati.cultura.gov.it.**\n- **Read Antenati as State Archive material, not as the whole record.** Its registers come from over 100 Archivi di Stato (State Archives) [S8 @2026-11-13]. Former Austrian areas differ: there the parish kept the registers before the changeover (step 1).\n- **Know which original you are reading.** Each Stato civile register was kept in two originals. One stays at the comune; until 2001 the second went to the court (Tribunale) and later to the State Archive [S20 @2026-11-13]. Some State Archives never took in the courts' second originals: Alessandria's holds no Stato civile from 1866 for lack of space and sends readers to the courts or the comuni [S9 @2026-11-13].\n- **Do not trust a name-search miss.** Cerca per nome (search by name) reaches only what has been indexed. A miss says nothing about the registers it did not reach.\n- **Browse the indexes before the year volumes.** Use the indici decennali (ten-year indexes) and the annual index at the end of each register. Then open the act.\n- **Classify a missing comune or year as a coverage gap.** Check, in order:\n  - the comune's own register at its Ufficio dello Stato Civile (step 6);\n  - the court's second original, where the State Archive never received it;\n  - whether the series has been digitised and published at all;\n  - FamilySearch, for the same comune and years.\n- **Do not use an Antenati image as a certificate.** Antenati says the documents found on the portal have no legal value and cannot be used for legal or administrative purposes, in particular citizenship requests [S24 @2026-11-13]. For a certificate, ask the comune's Ufficio dello Stato Civile (step 6).\n- **Cite each layer separately:** the State Archive, the series, the comune, the register and year, the act number, and the Antenati image. Keep the act number even when the image number changes.","sources":["S8","S20","S9","S24"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-50924a93a79a","kind":"custody","anchor":"**Use the archive's names for the file when you search its catalogue.** Napoleonic civil registers often have allegati or processetti matrimoniali (marriage attachments) beside them, which can give the spouses' parents and their consent [S20 @2026-11-13]. For the Stato civile from 1866, look for the Allegati (attachments) series: it was kept in one original only, at the court, and later passed to the State Archive, so the comune does not have it [S20 @2026-11-13].","sources":["S20"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ef0778624790","kind":"portal-availability","anchor":"- **Before civil registration and in its gaps, search the parish books.** In the province of Alessandria, the State Archive's guide says parish archives, including birth, marriage and death registers and stati delle anime (status animarum, household-by-household parish censuses), generally remain at the parish, with some gathered into diocesan archives [S9 @2026-11-16]. The Barga inventory, partially read on pp. 6 and 73, says the Rituale Romanum of 1614 required systematic compilation of stati delle anime and warns that relationships and ages are not always recorded and actual regularity at Barga varied over time [S10 @2026-11-16].\n- **Find the holder through BeWeB** (beweb.chiesacattolica.it), the Italian bishops' conference (CEI) catalogue of ecclesiastical archives. It lists only archives registered with it and gives their contact details. It does not do research; you arrange access with the archive itself [S11 @2026-11-16].\n- **Check Antenati's local coverage of parish books.** The Alessandria State Archive reports that Antenati publishes the 1838–1865 parish registers of the Comune di Alessandria and its outlying villages (sobborghi); this coverage does not extend to the rest of the province [S9 @2026-11-16]. For another comune in the province, check the parish, diocesan and municipal historical archives [S9 @2026-11-16]. For years before 1804 in the province of Alessandria, the State Archive's guide directs researchers only to the territorial parish, or to the curia if the parish archive was deposited in the diocesan archive [S9 @2026-11-16].\n- **For the diocese responsible for the parish in the event year**, a priest's statement that books burned, diocesan copies, merged parishes and dispensations, follow the Catholic parish recipe.","sources":["S9","S10","S11"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d6f76ed7eeba","kind":"custody","anchor":"- **Search the liste di leva (conscription lists) by comune and classe.** The comuni compiled them, with each man's birth and residence details [S12 @2026-11-13], [S13 @2026-11-13]. Look in the comune of birth as well as the comune of residence at call-up [S9 @2026-11-13], [S12 @2026-11-13]. The classe is the year of birth [S12 @2026-11-13].\n- **Search the ruoli matricolari (service rolls) by distretto militare and classe.** The distretto militare (military district) of the man's residence at age 20 called him up and kept his roll [S12 @2026-11-13]. A volunteer can sit in an earlier class and a deferred man in a later one, so search at least three classes either side before you log a miss [S12 @2026-11-13].\n- **Do not read a missing service roll as disproof.** Not every man in the liste has a ruolo or foglio matricolare (service sheet) [S13 @2026-11-13]. A man found in the liste and missing from the ruoli is still the man in the liste.\n- **Look for both series in a State Archive.** The Modena and Bergamo State Archives hold and describe them [S12 @2026-11-13], [S13 @2026-11-13]. Confirm which State Archive holds the man's district before you log a miss.\n- **Ask the Army's Centro documentale for a service sheet not yet transferred.** Army service sheets that have not reached the State Archive are with the Centri documentali (former Distretti Militari); the Navy, Air Force and Carabinieri keep theirs in other offices [S24 @2026-11-13].","sources":["S12","S13","S9","S24"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8b9f8aee87b6","kind":"custody","anchor":"- **Ask the Ufficio dello Stato Civile for a vital act.** Every comune has one [S14 @2026-11-13]. It keeps the birth, marriage, death and citizenship registers [S15 @2026-11-13].\n- **Ask the Ufficio Anagrafe for a household or a move.** The anagrafe holds the registro di popolazione (population register): fogli di famiglia (family sheets) listing each household's members [S16 @2026-11-13], and records of each change of residence [S15 @2026-11-13].\n- **Date the population register by the place.** It was set up by R.D. 31 December 1864 n. 2105, and its first family sheets describe each household as of 1 January 1865 [S16 @2026-11-13]. In Frosinone, in the part of Lazio that was Papal until 1870, the register followed the law of 20 June 1871 n. 297 [S15 @2026-11-13]. For a place annexed later, take the dates from the local archive's guide: Trieste's family sheets begin in 1857, under the imperial ordinance of 23 March 1857, and are kept by the Comune di Trieste [S5 @2026-11-13].\n- **Treat a request to the wrong office as unanswered, not negative.** Re-send it to the right office before you log a miss.","sources":["S14","S15","S16","S5"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie21-f5b707e88a","kind":"method","anchor":"When an Italian record places fu before a parent’s name, read that parent as deceased by the date of the act. In a Piedmont notarial abstract of 10 January 1645, Martra fu Gioanni identifies Martra as the daughter of the late Gioanni [S26]. Use it to set a death-before bound and search the parent’s death separately; fu does not provide the death date, and its absence alone does not establish that a parent was alive. [S25], [S26]","sources":["S26","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-napoleonic-register-starts","kind":"historical","anchor":"**Check the first Napoleonic register for the comune and event type.** Use the 27 March 1806 regulation as a search lead for comuni it covered in the Napoleonic Kingdom of Italy [S27], [S28]. For comuni in Piedmont's Po department, search the *Atti dello Stato Civile napoleonico* from 1803 [S29]. For comuni covered by the *Stato civile di Toscana*, start in 1808 [S30].","sources":["S27","S28","S29","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-birth-event-and-act","kind":"method","anchor":"**Separate the birth from its declaration.** Take the birth date from the sentence that says when the child was born and record the declaration date separately. For an act under the 1865 Civil Code, inspect the margin for a waiver of presenting the newborn. Record any stated reason and leave the method of verification open when the act is silent. [S43], [S42]","sources":["S43","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-damaged-birth-recovery","kind":"method","anchor":"**Follow a legible marriage annotation out of a damaged birth act.** Preserve the readable text and check the other register original. Use the annotation’s marriage comune, date, part and act number to locate the marriage act, then look for a pre-damage birth extract in its allegati. Match the extract to the birth comune, year, part and number and record its issuing office and date. [S32], [S37]","sources":["S32","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-damaged-birth-counterexample","kind":"example","anchor":"The author reports that a surviving marriage annotation on a water-damaged Gonzaga birth act led to a certified extract made before the damage [S38†].","sources":["S38"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-birth-residence-copy","kind":"method","anchor":"**Check the parents’ comune of residence for a transcription.** If the birth was registered in a different comune, look in both registers and cite the birth entry and its transcription separately. Under the 1865 Civil Code, the office receiving the original declaration sent an authentic copy to the comune of domicile or residence. Under R.D. 1238/1939, look in Parte II, Serie A for the transcription of a birth that occurred and was registered during a temporary stay in another comune. [S43], [S32]","sources":["S43","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-register-parts","kind":"method","anchor":"**Read the part and series in the register for that year.** For years before 1940, use the printed title page to establish what its parts and series cover. Browse all of Parte II for a First World War proxy marriage when the index does not identify the series. Under R.D. 1238/1939, effective 1 January 1940, look in Parte II, Serie A for a religious marriage first transcribed in the celebrating comune and Serie B for its further transcription from another comune. Read the act in Serie C before classifying it because that series includes civil proxy celebrations and other acts, including marriages celebrated abroad. For a religious wedding, establish who appeared from the ceremony act. [S32], [S33], [S40], [S34]","sources":["S32","S33","S40","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-religious-original","kind":"method","anchor":"**Follow a religious transcription back to the ceremony.** Record the parish act and the civil transcription with their own dates and numbers. For a late-December celebration, include the next year’s civil volume. Where the required publications and dispensation are both absent under Law 847/1929, check for the Article 12 impediment review and a ten-day Article 13 notice of the celebration before civil transcription. Keep this notice out of the pre-wedding banns chronology. [S35], [S32]","sources":["S35","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-religious-second-original","kind":"method","anchor":"**Ask the celebrating comune for the second signed parish original.** For a marriage under Law 847/1929, trace the original sent for civil transcription when the parish copy cannot be consulted. Use the date and number of the transcription to identify the papers. [S35]","sources":["S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-post-ceremony-notice","kind":"example","anchor":"The author reports that in the Asiago case the registrar posted a notice after the religious wedding and before its civil transcription [S36†].","sources":["S36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-marriage-banns-series","kind":"historical","anchor":"**Search the civil pubblicazioni even when the wedding act is missing.** Record the request and posting dates separately, and keep parish banns separate from municipal postings. Use the marriage act or banns file to trace each place of publication, including a destination abroad named in a forwarding request. Distinguish the request from a certificate that posting took place. Check for a dispensation or opposition. Under R.D. 1238/1939, the banns papers moved to the marriage annexes once the marriage was celebrated. Use the celebration act to establish whether the wedding took place. [S32], [S35], [S34]","sources":["S32","S35","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-banns-consent","kind":"method","anchor":"**Follow the record of consent to the parent’s act.** If the banns or marriage papers name a parent giving assent, record the name and relationship. Use a death certificate cited for the other parent to locate that parent’s death entry. [S32], [S37], [S42]","sources":["S32","S37","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-banns-counterexample","kind":"example","anchor":"The author reports a surviving Asti banns act for a proposed wedding that the registrar stopped after learning of a prior marriage [S39†].","sources":["S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-marriage-proxy-scope","kind":"method","anchor":"**Read the mandate’s operative words and the ceremony signatures.** A mandate to request banns (*per richiedere le pubblicazioni di matrimonio*) leads to the receiving comune’s incoming protocol and banns entry. For a ceremony by proxy, look for authority to contract the marriage (*per contrarre matrimonio*), the intended spouse, and the act’s statement and signature showing who appeared in whose place. The case documented in Conselice in 1942 has a military mandate for banns and the groom’s own signature at the later ceremony. Follow the filing, publication, celebration and transcription as separate events. [S34], [S33], [S32]","sources":["S34","S33","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-proxy-birth-check","kind":"method","anchor":"**Check a wartime mandate’s birth details against the municipal birth acts.** A parish marriage act can repeat the mandate’s incorrect birth date. Record each version and use the municipal birth entry to test the discrepancy. [S34], [S32]","sources":["S34","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-mandate-to-service-record","kind":"method","anchor":"**Use a First World War military mandate to find the service sheet.** Under Decree 903/1915, look in the marriage annexes for the principal’s rank and corps and, for rank-and-file soldiers, the matriculation number. Use those identifiers with the district and class to locate the foglio matricolare (step 5). Use the marriage act to date the ceremony. [S40], [S41], [S37]","sources":["S40","S41","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-wwi-legitimation","kind":"method","anchor":"**Search for a legitimation decree if a First World War mandate did not lead to a ceremony.** If the military principal’s death prevented the wedding, follow the mandate and any legitimation annotation on the child’s birth act to the royal decree and its case papers under Decree 1496/1915. The legitimation can be recorded even when the marriage was never celebrated. [S54], [S40], [S33]","sources":["S54","S40","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-annex-locators","kind":"method","anchor":"**Match the separately bound attachments to the act.** Use the year and act number to find the cover, then confirm the spouses and compare the papers with the cover list or count when present. When the birth predates local civil registration, look for a parish baptismal certificate in the processetti. For each parish or civil extract, record its issuance date separately from the events it records. Use the issuing comune or parish and the cited register, year, part, folio or act number to find the entry it copies. [S37], [S32]","sources":["S37","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-annex-baptism-counterexample","kind":"example","anchor":"The author reports that an 1841 Piscopio marriage packet preserved a parish extract of a baptism from 1796, before local civil registration [S52†].","sources":["S52"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-marriage-annex-children","kind":"method","anchor":"**Search forward from a child’s birth when the parents’ marriage is missing.** Read any later recognition or legitimation annotation and follow it to the marriage entry. If the marriage act names children, use the recognition clause and the birth records in its annexes to find their original birth entries. Put their recorded birth dates and places in sequence to identify other comuni to search. [S32], [S37]","sources":["S32","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-annex-mobility-case","kind":"example","anchor":"The author reports tracing a family across comuni through children’s birth acts assembled for a later marriage in Prignano [S53†].","sources":["S53"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-parish-index-trento","kind":"portal-availability","anchor":"**Search the relevant MyHeritage parish index.** For the Diocese of Trento, use Catholic Church Baptisms (1548–1937) for birth and baptism details and parents [S45 @2026-11-22]. Use Catholic Church Deaths (1567–1911) for death place and date and any parents or spouse recorded [S46 @2026-11-22]. Use the death collection’s own dates when the roundup table gives the baptism range [S44 @2026-11-22].","sources":["S45","S46","S44"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-parish-index-calabria","kind":"portal-availability","anchor":"**For Calabria, choose the index by event.** In Parish Births and Baptisms (1591–1963), note the baptism place and parents, and godparents where listed [S48 @2026-11-22], [S47 @2026-11-22]. In Parish Deaths and Burials (1593–1969), record death and burial separately and note parents or spouse where listed [S49 @2026-11-22], [S47 @2026-11-22]. For either region, use a hit to locate the parish book. After a miss, check the holder’s catalogue for the parish and year.","sources":["S48","S47","S49"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-service-roll-civilian-details","kind":"method","anchor":"**Read the service roll for civilian occupation and residence changes.** Record the occupation with its entry date or service stage. Check later annotations for changes of residence, including a move abroad. Keep the first residence, the military district and the later residence as separate leads. [S50], [S51]","sources":["S50","S51"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-italian-parish-volume-access","kind":"custody","anchor":"**Check the volume’s transfer and access dates.** Verify that the register has entered the historical archive before arranging direct consultation [S59 @2026-11-23]. Apply the local diocesan rule. In Udine, count 70 years from the last act or document entered in the volume [S60 @2026-11-23]. Log a closed volume as restricted access.","sources":["S59","S60"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-italian-parish-marriage-certificate","kind":"custody","anchor":"**Check eligibility for an individual marriage certificate or extract.** When direct consultation is closed, an individual request is the next route to try according to the community guide [S61† @2026-11-23]. Check the issuing parish or diocesan office’s rules for your purpose before sending a request. Identify the act by the spouses’ names, the marriage parish and date, and the act number if known [S59 @2026-11-23], [S62 @2026-11-23].","sources":["S61","S59","S62"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-italian-agricultural-occupation","kind":"method","anchor":"**Check landholding separately from the recorded occupation.** In a civil act or service roll, read *agricoltore* as work in agriculture, which can include owners, tenants and hired workers [S50], [S55]. Read *bracciante* in an agricultural entry as a clue to manual wage work and leave landownership open [S56]. Use the locality and date to look for the person in the historical *catasto*’s holder index and for a farm lease or sharecropping contract. Record the role each document gives the person and leave ownership unresolved if the only evidence is an occupation or a missed index entry [S57], [S58].","sources":["S50","S55","S56","S57","S58"],"checked":null,"stated_as":"fact","review":"reviewed"}
