claims:
  - {"id":"C-03","kind":"portal-availability","anchor":"Start with the St James’s church history in *Rigascher Almanach für 1865* and the [St James’s inventory at Raduraksti](https://raduraksti.arhivi.lv/collections/1:4:11:2055:2472). Compare the historical account with the event types and year spans listed for the available books [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"historical","anchor":"The almanac describes gaps in the St James’s baptisms and burials from 1710 into 1711. Check each event series separately. The baptism gap falls between the entries of 1 June 1710 and 20 July 1711. The almanac describes German recording after the interruption and a separate Swedish book from 1748. A Swedish-language miss does not cover an event entered in the German book [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Compare the parish appointment dates with military appointments. Use Kotivuori’s university matriculation register and follow its source notes to the diocesan proceedings and Livonian clergy biographies. Keep appointment, taking office and concurrent service separate [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"example","anchor":"For example, the matriculation entry for Jeremias Raumstadius distinguishes a regimental appointment he apparently did not take up from a different regimental pastorate overlapping his parish office. Check for that distinction whenever the records assign two titles to a cleric in the same years [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
