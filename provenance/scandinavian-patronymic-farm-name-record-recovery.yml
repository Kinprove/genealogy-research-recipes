claims:
  - {"id":"C-a8f107be1376","kind":"unclassified","anchor":"Start with destination records, identify the parish, and then search that parish [S2]. An approximate age is not an anchor. The exact birth date is. Swedish church books, including the household examination books, record the exact birth date, often in its own column, so the date works almost like an identifier for telling same-named people apart [S5].","sources":["S2","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8cb338c77372","kind":"unclassified","anchor":"Do not search the American surname backwards as if it were hereditary. Everett's example: a family known as Jensens in America cannot simply be looked for as Jensens in Denmark [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9f78cf9a87d4","kind":"unclassified","anchor":"- **Patronymic.** Built from the father's given name plus -son/-sen or -dotter/-datter. It changes every generation [S1], [S5]. Build spelling variants as well. Brady shows one man recorded as Persson, Pierson, Pettersson and similar forms across Swedish and U.S. records [S1]. Swedish given names also vary, for example Per, Petter, Peder and Pär for Peter [S1].\n- **Matronymic.** An illegitimate Swedish child may carry a surname based on the mother's name [S3]. A female-based surname is a lead to an illegitimate birth, not an error. Check the baptism entry for it before you look for a father.\n- **Farm or house name.** Clerks added these to tell parishioners apart. A farm name may stay with a family for generations or for only one [S6]. Castillo reports that the farm name changed when a person moved to another farm, and that she has seen a son-in-law who married into a family of daughters take his father-in-law's name or the farm's name [S3]. A change of farm name is therefore not a change of person.\n- **Soldier byname.** The army assigned these because so many men had the same name, and soldiers may appear under either the patronymic or the soldier name. Some men kept the byname afterwards. Brady's example is Johan Magnus Anderson from Kalmar province, who was John Falk in the U.S. and Johan Magnus Anderson in Swedish records [S1]. In S5, the guest's family surname came from a great-great-uncle's army byname, which an emigrant brother adopted instead of the patronymic. Search military records by unit and by the soldier name, not only by the civil name, starting with the local muster [S8].\n- **Adopted American name.** This may come from none of the forms above. Everett's Walter Slangerup was christened Waldemar … Martinson after his father. After emigrating he took the name of Slangerup, a town northwest of Copenhagen that his great-grandfather came from [S2]. Treat the American surname as one observed form, not as the search key.","sources":["S1","S5","S3","S6","S8","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ea94685076e5","kind":"unclassified","anchor":"In your tree, enter the name exactly as it appears in the christening (the first record) as the primary form. Log every farm, soldier or American name as an alternate with its source [S6].","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bfd63fdaaf20","kind":"unclassified","anchor":"ArkivDigital's April 2026 demonstration distinguishes its general-muster index from other regimental rolls. Starting from a Swedish soldier name and regiment [S18]:","sources":["S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e242956640e7","kind":"unclassified","anchor":"- Browse the regiment's rolls for intervening years as well as the periodic general musters; those separate rolls need not be in the general-muster index.\n- If a dismissal note refers the soldier for *underhåll*, use that referral to investigate the Krigsmanshuset archive.\n- If the original names a *rusthållare* and records a *krigsmanshusavgift*, investigate the fee documentation for changes of rusthållare. Keep that holder and fee distinct from the soldier and his support history.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-378b5bccdb46","kind":"unclassified","anchor":"The demonstration's original records contain support and fee annotations absent from the index. Check the actual indexed fields and the surviving regiment/archive volumes for the relevant interval; the demonstration does not establish current coverage or an individual's identity. [S18]","sources":["S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b3af5434de87","kind":"unclassified","anchor":"Search the parish indexes under each patronymic and farm form in the register. If all of them fail, do not conclude the person is absent. Browse the parish register to the known birth date and recognize the entry from its context. Everett found Slangerup this way after no index search could reach him [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-13298f5996a9","kind":"portal-availability","anchor":"- Denmark: Rigsarkivet says the police registered emigrants' shipping contracts from 1868 to 1959. Most emigrants left from Copenhagen and are in the Copenhagen police registers. From 1934 the State Emigration Office also checked the agents' contracts and received copies, while the Copenhagen police went on keeping the emigrant registers. The police registers it lists run to 1952; from 1941 they list emigrants together with other travellers. For 1953–1959 it lists only the office's copies. The registers from 1934 and the office's copies are not scanned, so a miss in the online material is not a negative for those years. The registers for 1868–1911 are name-searchable on the Danish Emigration Archives' site; that site's own year list runs to 1920, with 1912, 1917 and 1918 missing. [S23 @2026-11-13], [S24 @2026-11-13]\n- Norway: search the police emigrant protocols in [Use Norwegian censuses and emigrant protocols within their ranges](#use-norwegian-censuses-and-emigrant-protocols-within-their-ranges).\n- Sweden: search the port lists, *Emigranter 1861–1940* and the moving-out registers described in [Swedish household reconstruction](scandinavian-parish-record-recovery.md#before-1869-look-for-emigrants-in-the-moving-out-registers). Emiweb's *Emigranter i svenska kyrkböcker* (formerly Emibas) indexes emigrants from parish registers. It was compiled systematically only for about 1836–1895, and not for Uppsala, Norrbotten or Stockholm counties. It is a subscription database. [S25 @2026-11-13], [S26 @2026-11-13]","sources":["S23","S24","S25","S26"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e88b29e73f4d","kind":"unclassified","anchor":"1. Open the manifest of a known co-traveller, such as a future spouse or a sibling. In S5, the guest found his great-grandfather next to his future wife, listed under a father-derived \"-son\" form instead of the American surname.\n2. Scan the nearby pages, not only the family group, for people with the same farm name and a matching patronymic. In S7, a probable brother was listed on the parents' page of a Norway Heritage transcription, outside the family group, under the same farm name; the family's daughter appeared a page or two later. Those transcriptions mainly cover 1825–1873/75. The site search is currently down, so browse by ship and year.\n3. Treat any such person as a candidate only. Confirm through:\n   - the home-parish baptism, which should name the expected parents and parish\n   - the minister's record of people moving out (in Norwegian church books, the *utflyttede* section), with an entry dated before sailing [S7]","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9e96b9ee89d3","kind":"unclassified","anchor":"S7 found both records for its candidate. The moving-in and moving-out registers (*innflyttede* / *utflyttede* in Norway) also let you follow a person between parishes [S2], [S9].","sources":["S2","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d3f2507ea174","kind":"unclassified","anchor":"Same-named people are common in a parish. Families with the same parents' names and the same children's names are also common, so a careless search attaches other families' children [S1], [S4]. Build one row per candidate with these columns:","sources":["S1","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8179f391692f","kind":"unclassified","anchor":"- exact birth date\n- father's name, and mother's name where recorded\n- spouse\n- farm or house of residence, taken from house censuses and farm records [S4]\n- smallpox vaccination date and place, from baptism, confirmation or marriage entries [S2]\n- the locator for each entry","sources":["S4","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-30dcc9ba4947","kind":"unclassified","anchor":"Vaccination became compulsory in Norway from 1810 and in Sweden from 1816. Denmark's decree of 3 April 1810 required a vaccination certificate for school, confirmation and marriage. In Danish confirmation and marriage entries after 1810, expect the vaccination note and use it. Everett shows it in a Norwegian marriage entry of 1843 and in confirmation entries, and uses the vaccination date and place to decide whether two records are the same person [S2]. In other places and periods, check whether the column exists before you count a blank against a candidate.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fc14538f464f","kind":"unclassified","anchor":"Tanner warns that a Norwegian line with no source at the house-census or farm level is very likely wrong in its places, its names or both [S4]. Treat such an inherited tree as unverified until you have tied it to farm-level records, such as the censuses and church records on Digitalarkivet.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35069ddcd422","kind":"unclassified","anchor":"- A bygdebok, often a *gard og slekt* (farm and family) volume, is a compiled secondary source. It is arranged by gårdsnummer and bruksnummer (farm and holding numbers), and husmannsplasser (cottars' places) are treated in the chapter of the farm they belong to. [S10], [S12] Find the volume for the parish and read it under the farm and its numbers, not by surname.\n- Rygh's *Norske Gaardnavne* covers the matrikkel (land-register) farm names. For a plass, search under its parent farm. The same farm name recurs in different parishes; Rygh lists 13 farms called Nyborg. [S11] Fix the parish before you use a farm name as a key.\n- Search nb.no (Nettbiblioteket, the National Library's online library) for the volume. If you cannot open the full text, log an access gap, not a miss.\n- Check every bygdebok statement against the kirkebøker (church books) and censuses on Digitalarkivet before you use it.","sources":["S10","S12","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-87d024d610cc","kind":"unclassified","anchor":"- The national censuses that name each person are 1801, 1865, 1875, 1891, 1900, 1910 and 1920. [S13], [S15] The 1815, 1825, 1835, 1845 and 1855 censuses were numeric counts. Only some name lists from them survive, in ministers' and town archives, so a gap between 1801 and 1865 is expected. [S13]\n- A nil from a census name search is not a negative until you confirm the municipality is transcribed for that year.\n- Police emigrant protocols start at different dates in each port. Oslo's begin in 1867. [S14] For any other port, read its start date on Digitalarkivet. For a departure before that range, search the home parish's church book for a moving-out note.\n- Treat a link in Historisk befolkningsregister (histreg.no) as a derived hypothesis. Check it against the scanned record.","sources":["S13","S15","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b8de82d6d74","kind":"portal-availability","anchor":"- Rigsarkivet has scanned every census of the kingdom up to 1940 on Arkivalieronline. [S22 @2026-11-16] Its name-search guide lists fully transcribed censuses for 1787, 1801/1803, 1834, 1840, 1845, 1850, 1860, 1880, 1885 (Copenhagen only) and 1901, and describes DDD's coverage as 1787–1930. [S27 @2026-11-16] DDD (Dansk Demografisk Database) is run by Rigsarkivet. [S16 @2026-11-16] Rigsarkivet says DDD is closing as a separate platform and its data is being made searchable in Søg i Samlingerne. [S27 @2026-11-16] Check the actual transcription coverage for the locality and year; a nil in a partly transcribed year is not a negative. Check each transcription against the scan.\n- Use the lægdsruller (military levying rolls) to bridge censuses for men. Males of the peasant class were liable in 1788–1848, and all men from 1849. Rigsarkivet gives the registration ages as 0–36 for 1788–1808, 0–45 for 1808–1849, 15–38 from 1849, 19–38 from 1869 and 18–36 from 1912. After 1849 a boy was not entered at birth: look for him in the rolls for the years when his age fell within his period's range. The rolls give the father's name (the mother's if the man was born outside marriage) and the man's moves while liable for service. Moves can be followed across the country from 1789. Before 1788 only scattered rolls survive. [S17 @2026-11-16]","sources":["S22","S27","S16","S17"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7795e9fac0d3","kind":"unclassified","anchor":"- **Sibling sets.** Build these from the parents named in each baptism, not from a shared surname. Around a parish's change to fixed surnames, older children may carry the father's patronymic while younger ones carry a fixed surname [S6]. Brady says adult siblings in Sweden chose their own fixed surnames, so two brothers can have different surnames [S1].\n- **Transition dates.** The laws differ by country, and people widely ignored them, so read the actual parish entries:\n  - Denmark: a decree in 1828 and a ministerial circular in 1856.\n  - Sweden: Brady places voluntary fixed surnames around the 1880s [S1], and Castillo dates the first changes to about 1860 [S3]. The ordinance of 5 December 1901 on adopting family names (SFS 1901:125) controlled which new family names a parish could enter in the church book. It obliged no one to take a family name, and patronymics were still in use in every registration district in the late 1950s [S19]. The Names Act (SFS 1963:521) took effect on 1 January 1964 [S20]. From 1 January 1983 the law allowed a person to take a -son or -dotter surname for special reasons, and from 1 July 2017 a child can get one at birth [S21]. A modern -son or -dotter surname therefore does not show the old practice.\n  - Norway: the first Name Act came on 9 February 1923.\n  - Iceland never abandoned patronymics [S9].","sources":["S6","S1","S3","S19","S20","S21","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5064079777a7","kind":"unclassified","anchor":"Lisson's guest's \"mid-1800s, each country its own year\" [S6] fits Denmark only. Do not apply it to Swedish or Norwegian parishes. Tanner's \"after about 1830, varying by country\" [S9] is a rough orientation, not a rule.\n- **Marriages.** Under traditional patronymic practice, wives keep their own patronymic or maiden name, so a wife whose surname differs from her husband's is not a mistake [S5]. Norway's 1923 Name Act required a wife to take her husband's surname, so for later Norwegian records also log her married-name form. A census household can list a man and several women, none of them with his surname, and nothing shows which woman is his wife. Prove the marriage in the parish register [S9].","sources":["S6","S9","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-goldie21-4c8dcdae7c","kind":"method","anchor":"Use Vesturfaraskrá as the 1983 printed emigration index for 1870–1914 described by Icelandic Roots, rather than assuming it is a searchable online database. Search its first-name arrangement with the observed patronymic and farm, then compare its year and destination with departure and arrival evidence. The index includes some planned departures that did not happen, so an entry alone does not prove that the person emigrated. [S28], [S29]","sources":["S28","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie21-51a0e30dff","kind":"method","anchor":"An Icelandic farm name is not a unique location. Resolve it through the sýsla (county) and sókn (parish), and carry both into the place register before matching a census household to a church entry. Preserve competing same-named farms until the dated household, parents or neighbouring places distinguish them; a bare farm-name match does not select one. [S28], [S30]","sources":["S28","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie21-57cc109c4f","kind":"platform-ui","anchor":"Check Íslendingabók’s access conditions before planning a lookup: its English information page restricts access to Icelandic citizens and legal residents with a kennitala. If that route is unavailable, retain it as unavailable and continue with the cited census and parish records. Treat a compiled family link as a lead to its evidence; no logged-in search or account access was tested for this guidance. [S28 @2026-11-16], [S31 @2026-11-16]","sources":["S28","S31"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie21-c026326194","kind":"method","anchor":"For an Icelandic emigrant family, search diaspora newspapers and serialised settlement histories for the destination-side bridge. Byerly-Adams’s worked example cites a 1906 Heimskringla memorial and a history serialised in Lögberg-Heimskringla in 1969–1970. Follow such references to the issue and page, then test names, places and relationships against records. The article’s retelling and the newspaper original remain separate sources; the originals were not inspected for this guidance. [S28], [S34]","sources":["S28","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie21-a1ee45e112","kind":"method","anchor":"Choose an Icelandic census by its actual fields. The 1703 census supplies names, ages and household/residence context; the 1762 census names the household head and counts other household members. A wife or child unnamed in that latter return is not thereby absent from the household. Copy the headings and stated relationships before comparing same-named people across years. [S28], [S32]","sources":["S28","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie21-372d1bb2c7","kind":"method","anchor":"Check the Icelandic parish’s surviving years before inferring a birth from an early baptism search. FamilySearch’s guide dates record-keeping decrees to 1735 and 1746, identifies the earliest surviving records as 1664, and places most surviving series’ beginnings around 1750–1780. A decree date is not the start of every local book; record the actual parish, event series and earliest inspected year. [S28], [S33]","sources":["S28","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
