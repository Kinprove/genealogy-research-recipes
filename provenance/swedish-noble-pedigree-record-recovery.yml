claims:
  - {"id":"C-step-01","kind":"portal-availability","anchor":"Open the noble family's Minerva entry and record the family name, rank and number. Where a revised *stamtavla* is supplied, open it and find the relevant branch, couple and source references. Inspect the separate arms item for its own provenance. Carry a proposed printed source as tentative until you match the plate or its credit [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-02","kind":"portal-availability","anchor":"If the entry quotes a letter of arms, look for the complete *sköldebrev* as its own Minerva object. If needed, browse the separate letter-of-arms copy series in ArkivDigital under *Sköldebrevsavskrifter*, including *större format*. Record whether you read the original letter image, a copy, a drawing or an extract [S1 @2026-11-22], [S2 @2026-11-22], [S4 @2026-11-22], [S5 @2026-11-22].","sources":["S1","S2","S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-03","kind":"portal-availability","anchor":"An absent branch in one pedigree leaves the archival search open. Check whether the chart covers that branch and whether Riddarhuset's publication rules withhold recent generations. Limit the investigation to deceased people [S3 @2026-11-22].","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-04","kind":"portal-availability","anchor":"Browse the named Riddarhuset series in ArkivDigital by volume. Use *Originalgenealogier* for genealogies submitted by the families and *Peringskiölds genealogier* for a separate early compilation. Classify the pedigree by who supplied it. Check the relevant series and volume coverage before treating a name miss as an omission from the archive [S1 @2026-11-22], [S5 @2026-11-22].","sources":["S1","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-05","kind":"method","anchor":"Compare the family's extinction or ennoblement date with the period in which the original genealogies were collected. When the dates do not fit, try a later or earlier compilation as appropriate before judging what the missing submission means [S5].","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
