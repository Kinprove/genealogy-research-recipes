claims:
  - {"id":"C-af5acc00b682","kind":"unclassified","anchor":"For federal jurisdiction, record groups and NARA custody, use\n[U.S. federal court case-file recovery](us-federal-court-case-file-recovery.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9e91f398111b","kind":"unclassified","anchor":"- **Treat a \"State v.\" caption as a clue, not as a crime.** A criminal case is always brought by a government and can lead to criminal penalties such as jail, probation or fines. Governments also sue civilly, for example over damage to government property or a broken contract. Classify the case as criminal when the docket labels it criminal or an indictment, information or criminal charge is on file. If you have the caption and a jail census entry, log it as probably criminal, pending the file. If you have only the caption, record the proceeding type as unresolved and get the file. [S2]\n- **Treat an arrest, charge or newspaper arrest report as the start of a case.** It is not a finding about conduct. An arrest is a detention and does not mean the person committed a crime. Follow the case to a dismissal, plea, acquittal or sentence before stating what happened. [S2]\n- **Treat a census entry in a jail or prison as a strong pointer to a criminal case.** First check that the entry lists the person as an inmate, not as the keeper or a member of the keeper's household. Tanner reads such an entry as meaning there was probably a criminal case. Search for that case. Do not state the charge or the outcome until the file shows them. [S1], [S2]\n- **Do not read a missing newspaper report as no arrest.** Tanner says newspapers reliably reported visible or major arrests, but minor arrests such as shoplifting often went unreported outside small communities. [S2]\n- **Separate locators from flags.** A recorded judgment or satisfaction of judgment identifies the case, the court and the parties. An appellate citation shows that a lower-court case was filed. Treat both as locators and go to the file. A divorce is a lead to the granting authority's records, which may be a court or, in some early periods, a legislature. A claimed injury makes a lawsuit likely. Log divorces and injuries as reasons to search, not as findings. [S1]","sources":["S2","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-92aca38f185a","kind":"unclassified","anchor":"**Recorded judgment or satisfaction of judgment in land records.** This identifies the court, the case and the parties. Copy those details and use them to request the lawsuit file. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ca6960d78bc3","kind":"unclassified","anchor":"**Sheriff's sale, foreclosure or lien notice.** Tanner describes a chain: judgment, application and notice of sale, sale, a possible redemption period, then a sheriff's deed or a payment of the proceeds to the creditor. If real property was involved, the later documents are in the recorder's office with the land records. The sale notice was sometimes only posted at the courthouse, so it may be missing from the court file. Expect papers after the sale. Search the court file and the recorder's land records for each step of this chain. Tanner says the procedure differed by county and state, so read each document against the local procedure rather than expecting a fixed sequence. [S10]","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d1e6acd3f4cf","kind":"unclassified","anchor":"**Bound minute books.** A minute entry is a pointer, not the case. Where an every-name minute-book index exists, search it for non-party roles as well as plaintiff and defendant: juror, attorney, solicitor general, security, and court officers such as a bailiff. Follow each volume and page reference to the minute entry. In S6, the Archive Lady shows a Stewart County circuit court minute-book index that she describes as covering the book from 1821 to 1834, with volume and page references and those roles. She calls this kind of every-name indexing rare, so do not expect it elsewhere. Published listings for the Stewart County indexes give other spans, so check the span and structure against the archive's own index before you cite it. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3b004270a987","kind":"unclassified","anchor":"**State chancery folder index.** The Library of Virginia chancery index is searched by county or city, then by surname, plaintiff or defendant. Not every listed case has linked images. If a folder is listed without images, keep its case details. Then search the FamilySearch Catalog by county, not by name, for that county's court records. [S7] For Catalog and film routes, use [FamilySearch workflows](familysearch-practical-record-workflows.md).","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bddb0af7366d","kind":"unclassified","anchor":"**Incapacity indexes.** These are filed under period terms such as \"lunatics\" and \"drunkards\". Search them under the heading the court used at the time. In the example, a man who did not serve in the Civil War was checked against such an index at the Clearfield County, Pennsylvania courthouse, and divorce files were checked at the prothonotary's office. Neither search found him. The presenter left the question open. Record such a search as a negative for that index, that court and those years only. It proves neither capacity nor absence. [S8], [S9]","sources":["S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-768a158615e9","kind":"unclassified","anchor":"**Appellate citation.** An appeal shows that a lower-court case was filed. Go to that court for the file. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c29dc14a7b4c","kind":"unclassified","anchor":"Archives often bring out only the bound minute books. Ask separately for the loose papers or case file: affidavits, subpoenas and other working papers. The county archivist on S5 says these are kept apart from the minute books. Also find out where the court's files were later transferred, whether to a basement, attic, storage facility, microfilm or online images. Do not assume the files stayed at the courthouse. [S2], [S5]","sources":["S2","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-caf23f021a0b","kind":"unclassified","anchor":"For recent state/county files, start with the court clerk (called the prothonotary for some\ncivil courts). For older files, check the state archives' court holdings and transfer guidance\nearly: many older local-court series have moved there. Transfer dates vary by state and court,\nso confirm custody for the named series and years rather than assuming all old files moved.\nFor transferred federal files, follow the NARA route above; a current federal court may still\nhold recent files. [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-740d52c2fb67","kind":"unclassified","anchor":"Read from the first document filed to the last. In Tanner's example, a Utah County probate file stayed open for 30 years, and papers later in the stack added information. [S10] Record a locator or an explicit gap for each expected stage.","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b4d629de956c","kind":"unclassified","anchor":"**Civil, chancery and divorce cases** [S1]:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-af06fd986a69","kind":"unclassified","anchor":"**Criminal cases** [S2]:","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b615ae676475","kind":"unclassified","anchor":"- **Search by name with a stated scope.** Use a published case-law search, such as Google Scholar's case-law option, nationwide or limited to chosen courts. It is full-text, so counsel can also be found by name. Google Scholar's help page gives its coverage as U.S. Supreme Court opinions from 1791, lower federal opinions from 1923, including district (trial), appellate, tax and bankruptcy courts, and state appellate and supreme court opinions from 1950. It does not cover state trial or probate court files. Log the courts and date range you searched. [S2], [S3], [S4]\n- **Read a no-hit narrowly.** It says nothing about state trial-court involvement, and little about state cases decided before 1950. Courts not of record do not publish their decisions, so search their surviving dockets, indices, minute books and case papers separately. [S1]\n- **Follow a hit back to the trial court.** Look for the lower-court file and the testimony transcript, which Tanner says may give relationships and motives that the opinion leaves out. Record people named in the opinion who were not parties as separate leads. [S3]\n- **Keep the appellate record and the original file apart.** If the trial file is lost, the appellate record and opinion may be what survives. Label them as the appellate record. Do not treat an opinion's summary of facts as the trial record. [S1]","sources":["S2","S3","S4","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0e45bd1d5412","kind":"unclassified","anchor":"Search across the person's whole adult life and decades past death. Tanner warns that suits involving an estate can come 10–20 years later or more. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6eecf743c8c3","kind":"method","anchor":"**Judge named without a court.** If an article names a state or local judge but not the court, do not give up on the court record: The Legal Genealogist suggests looking for other newspaper articles from the same time and place to get the judge's full name, the court's name or the exact place the judge was working. [S12] Also look for a published \"History of the Bench and Bar\" or similarly named volume for that time and place, as the author recommends, for example through Google Books with \"history bench and bar\" as the search term and the 19th century as the time frame. [S12] Such volumes exist for Wisconsin (1882), Ohio (1897) and Missouri (1878), and the Ohio text shows one naming a judge's court. [S13], [S14], [S15]","sources":["S12","S13","S14","S15"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-788e97dd85ca","kind":"historical","anchor":"**Find the court that heard equity at that date before searching for a chancery case.** Where a state had a separate chancery court, its bills, pleadings and minutes were recorded apart from the county and circuit court minutes, and the court often served a district of several counties [S16], [S17]. In Tennessee, the 1837–38 act made Fayette, Shelby, Hardeman and McNairy counties one chancery district sitting at Somerville, and the 1869–70 act divided the state into twelve chancery districts [S17]. Virginia moved chancery between courts: superior courts of chancery (1802–1831), circuit superior courts of law and chancery (1831–1851), then circuit courts from 1852, with county courts also hearing chancery until 1870 [S18]. Read the bill as the complainant's allegations, which the defendant's answer responds to; only the decrees record what the judge decided [S16], [S18]. Do not state a sale, debt or relationship from the bill alone.","sources":["S16","S17","S18"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1e36ae61fc27","kind":"platform-ui","anchor":"Run the name through CourtListener as a second published-case search, pinned to the family's place with a proximity query. CourtListener documents a quoted phrase followed by `~N` as finding the phrase's words within N words of each other, so `\"Whitwell Perry Tennessee\"~10` finds the surname near both place names; a tilde after a single word is a fuzzy spelling search that accepts only 1 or 2 [S19 @2026-11-12]. Use that documented quoted form, not a parenthesised group followed by `~10`. Do not limit the search to the home state's courts: a proximity search for a Perry County, Tennessee surname turned up a 1906 Missouri estate case, *Jackson v. Grissom*, 196 Mo. 624 [S20 @2026-11-12].","sources":["S19","S20"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6331ec4fcd58","kind":"method","anchor":"**List the courts that heard each kind of case in that place and period before you log a negative.** Probate, guardianship, divorce, foreclosure, property disputes, criminal cases and equity could each go to a different court [S21]. Divorce in Minnesota was generally a district-court matter, yet in Ramsey County some divorces of the 1860s and 1870s were heard in a court of common pleas [S36]; in Allen County, Indiana, in 1909, divorces were heard in both the circuit and the superior court [S37]. Search each court that could have heard the matter in those years, and log each court's negative separately.","sources":["S21","S36","S37"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d19b0abfddeb","kind":"method","anchor":"**Read the order or minute book around the entry, not only the indexed line.** Order and minute books record all matters brought before the court while it was in session [S42]. Page through the volume on either side of a family entry: its sittings show when the court actually met, and its routine business shows what a terse entry means [S30]. Find the county's order books through the FamilySearch Catalog by county.","sources":["S42","S30"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-35f25a21cee4","kind":"method","anchor":"Search every county where either spouse lived, not only the couple's home. A divorce was usually filed in a local court where one spouse lived or had met the residency requirement, which varied by state, and there is usually no statewide index [S23], [S24]. One party may have moved to another state and filed there [S36]. Start with the counties where each spouse lived and their neighbours [S24]. Search for a suit for separate maintenance or support as well as for a divorce [S22]: a 1909 Fort Wayne paper reported a wife's support suit against the husband she said had abandoned her [S37].","sources":["S23","S24","S36","S22","S37"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bf00ae19805a","kind":"historical","anchor":"Read the decree's wording. A divorce *a vinculo matrimonii* dissolved the marriage. A divorce *a mensa et thoro*, from bed and board, was a court-ordered separation: the couple stayed married and could not marry anyone else [S26], [S38]. Where a court did not use that term, the same arrangement may appear as a suit for separate maintenance [S26].","sources":["S26","S38"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-84b4e9ef875a","kind":"method","anchor":"Search the land records under both spouses' names as well. A spouse who was still married may have had to give up rights in land before it could be sold, and a deed may state a party's marital status at the sale [S23]. Deed books also hold spousal property settlements and bills of sale for property other than land [S40]. A separation agreement may be recorded there even when it deals only with personal property [S25]: in 1847 a Caldwell County, Kentucky couple's articles of separation, under which the wife left her husband's bed and board for a horse, a cow, a bed and household goods, were entered in the county deed book [S39]. Use [land index recovery](land-index-book-series-recovery.md) for the indexes.","sources":["S23","S40","S25","S39"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c168233e8076","kind":"method","anchor":"Do not read a separation or a remarriage as a divorce. Some couples simply lived apart, and some people married again without a divorce [S24]; a husband's 1909 suit in Allen County alleged that his wife's earlier marriage had never been dissolved by death or divorce [S37]. When the courts, years and indexes you searched show no divorce, record \"no divorce found\" for those searches, not \"divorced\" and not \"record lost\".","sources":["S24","S37"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6132d170a564","kind":"method","anchor":"Search the divorce files of the person's divorced brothers and sisters too. A divorce file can give the place and date of the marriage, each party's residence, the children's names and affidavits from relatives [S36], and the person you are researching may have testified in a sibling's case [S27]. Take a marriage place or first home found there straight to that place's marriage, land and church records: it can show where the family came from [S27].","sources":["S36","S27"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-812b3324e407","kind":"method","anchor":"When the case concerns a death, ask also for the coroner's inquest, which is kept apart from the court file. In a 1787 Delaware murder case, the inquest papers named the witnesses the coroner examined, and the trial case file and the session docket were separate items [S35]. Lancaster County, Pennsylvania, describes its inquest records as naming the witnesses examined, who may include family members [S45].","sources":["S35","S45"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-512767115d6c","kind":"method","anchor":"**Read each summons, subpoena and sheriff's return as a dated residence clue.** A sheriff's authority ended at the county line. Under Ohio's 1824 statutes, for example, process for a defendant living in another county was directed to that county's sheriff, and a sheriff noted when a defendant was not to be found in his county [S41]. So the county a writ was sent to shows where the party seeking it believed the person lived when it was issued, and the return shows what the sheriff found. In the author's 1830-era Virginia estate suit, the counties to which the heirs' subpoenas were sent placed the heirs and traced their migration [S28]; in an early-1830 Virginia summons, several defendants were not living in Virginia [S29]. Record the county, the writ's date and the sheriff's return for each person as a dated residence entry. A return of service puts the person in that county on that date; a return that the person was not found there is a negative for that county and date only.","sources":["S41","S28","S29"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-571b78eb9de6","kind":"method","anchor":"List each witness, juror and court officer named in a criminal case file or an inquest, and research them as the person's associates: such lists name the people around the event, and inquest witnesses may include family members [S35], [S45]. A name in the file shows that the person took part in that proceeding, not a relationship.","sources":["S35","S45"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-898f246e388b","kind":"method","anchor":"List the date of each significant step in the docket or file, such as the filing, hearings, the judgment or sentence and any appeal, and search the local papers around each date [S32]. Search the paper published at the county seat as well as papers near the person's home [S34]. Look for the term's list of cases, short reports of what happened, legal notices the law required, and fuller articles on cases of local interest, which can hold details the court record lacks [S34], [S43]. Browse the issues around each date by hand as well, because OCR errors make keyword searches miss names [S32], [S44]. Expect a fuller article only for a case that was local news [S34]: its absence says little, while a missing term list or required notice means searching another paper or issue. For legal notices and the handoff from a notice back to the court, use [newspaper search recovery](newspapers-com-search-recovery.md).","sources":["S32","S34","S43","S44"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-acd5ba4fe801","kind":"method","anchor":"When the file is lost, sealed or closed, run the same search from the dates you know, such as the hearing and the judgment or sentence; a newspaper account may be the only description of the case you can get [S31]. When a paper reports a filing but no file turns up, the suit may have been withdrawn or dismissed, leaving the newspaper as its only trace [S33]. Allen County's 1909 divorce reports include complaints \"withdrawn from the files\" and dismissed cases [S37]. Check the docket or index for a dismissal before calling the file lost. Treat a newspaper's details, such as the year and place of a marriage, as leads to check against records, because a report can be wrong [S33].","sources":["S31","S33","S37"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
