claims:
  - {"id":"C-marker-lead","kind":"method","anchor":"According to the presenter, use a government-style military marker as a clue to a headstone application [S1†]. Record the deceased’s name, death date and cemetery before choosing the application series. Keep the inferred application date open until the paperwork supplies it [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-application-windows","kind":"custody","anchor":"According to the presenter, check the date range of the collection before deciding whether it could contain an application [S1† @2026-11-20]. Start with NARA’s 1925–1970 applications for the corresponding period and use its guide to route a later filing. In the 1954 and later fiscal-year groups, check the applications filed as prior to that fiscal year after searching the main alphabetical run [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-application-identity","kind":"method","anchor":"According to the presenter, compare the death date and the service branch, unit and enlistment date to separate people with the same name, and inspect the back of the card [S1†]. Record burial and service details independently. Carry the service identifiers into a military record search [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
