claims:
  - {"id":"C-marker-lead","kind":"method","anchor":"According to the presenter, use a government-style military marker as a clue to a headstone application [S1†]. Record the deceased’s name, death date and cemetery before choosing the application series. Keep the inferred application date open until the paperwork supplies it [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-application-windows","kind":"custody","anchor":"According to the presenter, check the date range of the collection before deciding whether it could contain an application [S1† @2026-11-20]. Start with NARA’s 1925–1970 applications for the corresponding period and use its guide to route a later filing. In the 1954 and later fiscal-year groups, check the applications filed as prior to that fiscal year after searching the main alphabetical run [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-application-identity","kind":"method","anchor":"According to the presenter, compare the death date and the service branch, unit and enlistment date to separate people with the same name, and inspect the back of the card [S1†]. Record burial and service details independently. Carry the service identifiers into a military record search [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-myheritage-application-index","kind":"portal-availability","anchor":"For a deceased veteran, search MyHeritage’s *United States, Applications for Headstones for Military Veterans, 1861-1989* index (collection 21054) [S5 @2026-11-22] [S6 @2026-11-22]. Compare the birth and death dates, burial place, and enlistment and discharge dates. Where listed, record the branch, rank, unit, company, service number, and the applicant’s name and residence at the time of the application [S5 @2026-11-22]. Follow an index hit to the original application. After an index miss, continue with the archival filing series.","sources":["S5","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-overwritten-birth-year","kind":"method","anchor":"When the birth year is overwritten, transcribe the original and revised entries separately. Compare both with the death certificate and the birth date or age recorded at enlistment. Use the service record and any annotation on the application to test whether the revised year came from the enlistment entry [S4] [S2]. Harner reports ruling out a revised year with records that placed the veteran alive before it [S4].","sources":["S4","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-shared-birth-informant","kind":"method","anchor":"Identify who supplied the birth date on the headstone application and on the death certificate. When the same person supplied the same date on both, count the agreement as one informant’s account [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-prisoner-marker-burial","kind":"method","anchor":"For a Confederate prisoner who died in a federal prison or military hospital in the North, look up the grave location in NARA microfilm M918. Browse by camp or other place of death, then match the prisoner by name, unit and death date [S8]. Compare the recorded grave location with the marker cemetery and check for reinterment before deciding whether the headstone marks a grave or a cenotaph [S8] [S9]. According to the presenter, a prisoner buried at Point Lookout had a headstone in the cemetery where his wife was buried [S7†].","sources":["S8","S9","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
