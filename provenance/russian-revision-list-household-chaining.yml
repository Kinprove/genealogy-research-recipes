  - {"id":"S52","kind":"web-page","urls":["https://kray.chelib.ru/places/monuments/pamyatnik-osnovatelyam-chelyabinska"],"published":null,"retrieved":"2026-11-08","access":"read","rights":null,"basis":"read 2026-11-08","entry_sha256":"632cca02abc8cbb4b985015993aa262f3dbacd60db7a80e54a7310760368af6d","claims":["C-e45c8dc6f678"],"review":"reviewed"}
  - {"id":"S53","kind":"catalogue","urls":["https://www.bibliososna.ru/catalog/author/biblio/pozdeev-vv/"],"published":null,"retrieved":"2026-11-08","access":"read","rights":null,"basis":"read 2026-11-08","entry_sha256":"55d0480c1e468b3197795586dedbf4a61ae96f62365eb871fbaa3f4dc9eaeb10","claims":["C-e45c8dc6f678"],"review":"reviewed"}
