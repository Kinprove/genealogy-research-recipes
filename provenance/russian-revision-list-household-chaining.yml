  - {"id":"S56","kind":"web-page","urls":["https://ru.wikisource.org/wiki/%D0%AD%D0%A1%D0%91%D0%95/%D0%9F%D0%B5%D1%80%D0%BC%D1%81%D0%BA%D0%B0%D1%8F_%D0%B3%D1%83%D0%B1%D0%B5%D1%80%D0%BD%D0%B8%D1%8F"],"published":null,"retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","entry_sha256":"cd591b9b25089cfb5b0ab766c5e7dd0a0119a1e2051632704adb9afd95529a4c","claims":["C-059a79e9f8b7"],"review":"reviewed"}
claims:
  - {"id":"C-76b9a70a8925","kind":"unclassified","anchor":"- Before you search, find the estate category and the owner on the revision date: state, factory-ascribed, monastery or a private owner. Monastery peasants were enumerated separately. A participant reported that the 1744 Shadrinsk district revision file at RGADA (f.614, op.1, d.73) contains no Dalmatov monastery holdings. Another participant gave the monastery's own censuses and revisions in the monastery fond at the Shadrinsk archive: Ф.И-224, оп.1, with d.3157 (1719), d.3155 (1727), d.3238 (1742), d.282, 3155 and 3156 (1744–1745) and d.3144 (1757). [S1]\n- Search the inventory under the unit that existed in that year. A participant noted that by 1850 Barnevskoe was a volost centre and the sloboda structure had gone, so 1850 material is filed by volost. [S14] Factory-ascribed peasants appear under the factory and its owner. The 1763 Kamenskaya tale opens with the ascription to the state Kamensky works under the Ekaterinburg administration. [S6] A questioner found \"уволенные от личных заводских работ\" on migrants in 1811 destination revisions and did not know whether they had been ascribed to factories. A participant pointed to GASO f.24, op.2, d.286, lists of ascribed peasants of Perm guberniya who moved to Orenburg guberniya in 1802–1806, but would not say what the phrase means in the revisions. Treat the phrase as a reason to check the migrants against d.286, not as proof of factory ascription. [S22]\n- A missing village heading does not mean the village did not exist. The 1710 census of Nevyanskaya sloboda listed people by administrative tithing (десяток), not by settlement, so a village standing at the time can have no heading of its own. [S21] A settlement can also be entered as \"вновь заведенная\" (founded since the last census), or sit in another sloboda's run. The compiled 1744 index notes that one village is missing from its sloboda, and that in 1719 it followed directly after another village. [S1]","sources":["S1","S14","S6","S22","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7233b695a2cc","kind":"unclassified","anchor":"Participants cited d.899 as the 1747 copy for Shartash and neighbouring villages. The RGADA inventory (as mirrored on NashiPredki) dates d.899 to 1742 and describes it as a census book of state peasants, artisans and clerks of the Ekaterinburg administration. Read its cover and dating before you treat it as the 2nd-revision copy. The inventory also dates d.1632 to 1748, although the participant who cited it called it the 1747 list. Participants cited the early censuses at RGADA f.214: op.1, d.1587 (1719, Tobolsk district) and op.5, d.434 (1710). [S2], [S3], [S6], [S9], [S10]\n- **Local originals and parallel copies:** participants cited the following:\n  - GASO f.24 for household tales: op.2, d.74 for the 1719 household-tale census and op.1, d.548a for 1747\n  - district-level returns in other GASO fonds: f.38, op.1, d.29 (1743), f.42, op.1, d.86 (1735) and f.27, op.1, d.22 (1745)\n  - GAPK f.111 for 19th-century revisions\n  - GASO f.24, op.23, d.6625 for the 1850 Zlatoust factory list","sources":["S2","S3","S6","S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9d1ce21cd4c8","kind":"unclassified","anchor":"[S2], [S10], [S11], [S12], [S25], [S3]\n- **County-treasury and volost fonds:** the GASO inventory of the Irbit county treasury (f.674, op.1) lists revision tales for 1816, 1834 and 1850 by volost, town and factory. It also has supplementary tales (дополнительная) and separate tales for individual landowners' household serfs. Check these fonds as well as the provincial chamber. [S4]\n- **Supplementary and special lists:**\n  - Books of those who left after the 1st revision exist as a type. RGADA 350-2-1153 is one, for the Arsk road of Kazan district (1748). It is not a Urals file. [S5]\n  - In an alphabet of leavers (алфавит выбывших), do not assume the number by a name is a leaf number; columns can differ between files. Read the column header and test one entry before you search by number. Also look the village up under its \"тож\" second name.\n  - Supplementary tales for 1850–1853 for Shadrinsk district are filed by volost in GAPK f.111, op.1, d.2536. [S14]\n  - For the 1858 town-estate tales, a participant cited GASO f.8, op.1, d.1776–1779, including \"private\" tales (частные) and tales of newly enrolled townsmen (вновь причисленные). The same participant cited lists of factory people discharged into the town estate (d.1922, 1922a) and enrolment into the town society (d.1935a). [S8], [S20]\n  - In the Ekaterinburg area, Old Believers were also counted in separate schismatic series, which you must search alongside the revision. Participants cited the 1742 schismatic census (GASO f.24, op.1, d.1000), a 1752 list of Old Believer children born after the revision (d.1370) and the 1765 schismatic tales (GASO f.34, op.1, d.187). [S2]\n- **Owner and monastery fonds:** see step 1. [S1]","sources":["S2","S10","S11","S12","S25","S3","S4","S5","S14","S8","S20","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f23eeb86a9fa","kind":"unclassified","anchor":"Mark each row as inspected (images or original), extract only, or unlocated. If an archive reports a find but gives no locator, ask for the fond, opis, delo and leaf, and check the file's own cover title. In one archive reply the file turned out to be an alphabetical list of family heads that cited revision numbers. That kind of list is not a revision list and does not show who was in the family. [S7]","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c10c675bcc7d","kind":"unclassified","anchor":"- Many volumes open with a реестр (register) of settlements and leaf numbers. Use it to find the leaf range for the target village. A participant transcribed one at the head of GAPK 111-3-40 (1816, Perm, Okhansk and Cherdyn districts). Registers give only household or soul totals, and the person-by-person entries follow in the body. [S15] Some central files end with their own aids. The RGADA inventory records a summary at l.312 ob. and a geographic index at l.313 of f.350, op.2, d.909.\n- A participant compiled a settlement index for the 1744 Shadrinsk file. It gives a separate leaf range for each village's \"умершие и убылые\" (dead and departed) section. It also shows several gaps:\n  - old leaves 1–33 (the town's own entries) are missing, and the surviving file starts at old leaf 34, which is new leaf 1\n  - several later old-numbered leaves are missing too","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0ee8617447dc","kind":"unclassified","anchor":"Record the dead-and-departed range and any missing leaves for your village. Coverage reporting is handled by the archival image coverage recipe. [S1]\n- Look for sub-sections inside a village's run. They include:\n  - people entered under a later order or after the census\n  - солдатские дети (soldiers' children)\n  - рекрутские дети (recruits' children)\n  - children of factory workers not assessed for the poll tax\n  - people \"who moved of their own accord\"","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fa7db28b853d","kind":"unclassified","anchor":"[S11], [S25], [S10]\n- Before reading, check what the file really contains:\n  - GAPK 111-1-2198 is titled as one 1858 volost tale. A participant found that it contains many supplementary tales from several districts for 1857–1861, so the title describes only the first item bound in it. [S15]\n  - A participant reported that GAPK treats any \"сказка\" as a revision tale by default, even an autobiography. Confirm the document type from the document itself. [S13]\n  - A file ordered from an archive for a named hamlet held the right place but the wrong people (one family only). Participants took it to be a supplementary revision of omitted persons, not the main return. Another ordered file had renumbered leaves. [S5]\n  - An online catalogue's file numbers and titles did not match the actual files. Check them against the images. [S5]\n- Note whether the volume covers males only. The 1st (1719), 2nd (1744–1747) and 6th (1811) revisions did not record women; the others did. [S37], [S38] A wife or daughter missing from an 1811 tale was not recorded, so her absence says nothing about her. Some local copies of the 1st revision name women anyway (step 6). [S10], [S25]","sources":["S11","S25","S10","S15","S13","S5","S37","S38"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-104aff118494","kind":"unclassified","anchor":"- **Numbers.** Copy every number in front of a name. In the transcribed central copies cited for 1747 (d.899) and 1762 (d.908), men carry running soul numbers, and in 1762 women carry their own numbers. A 1858 factory entry has two numbers before the head's name. [S2], [S3] Test whether one of them matches the previous revision's number. Do not assume it does.\n- **Age pairs (3rd revision and later).** In the participant's transcription of the 1763 Kamenskaya tale, the columns are those entered at the last (1747) revision, those who dropped out since, and those present now. For each male, the first figure is his age at the previous revision. The second is either his current age or his fate with its year. Fates include died, taken as a recruit, taken to work at the mint (денежный двор) and struck from the assessment, and appointed a church clerk. [S6] Do not take a single figure as proof of birth after the revision. In the same transcription, some sons listed under \"написанные в последнюю ревизию\" carry only one figure. Take birth status from the heading \"рожденной после ревизии\" over the entry or from the status formula, never from the number of figures. [S6], [S2] Later lists write the pair in several ways:\n  - \"(41,5) 49\" or \"22/38 4/12\", with fractions of a year [S3], [S12]\n  - \"26/ум.1836\" or \"Помер в 1818 г.\" when the second value is an exit [S3], [S12]","sources":["S2","S3","S6","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bcbe6c8acd04","kind":"unclassified","anchor":"A 1782 seigneurial tale (GAPK 13-1-36) gives the counts as previous / departed / now, separately for men and women. [S15]\n- **Wives and daughters.** Each wife's clause names her natal family in the form \"взята [place] крестьянина [father's name] дочь\". In the father's household, each daughter's departure is recorded as \"выдана в замужество [place] за крестьянина [husband's name]\". Record both as separate fields. In the 1762 and 1763 tales cited, female ages are a single figure. Later lists can give women the pair form too (the 1850 Zlatoust list writes a wife's age as \"/38 4/12\"), so keep any female pair or exit remark exactly as written. [S6], [S2], [S12]\n- **\"Старинная\" wife.** A participant stated that this word means the wife lived in the same village before marriage and that her father was entered in the earlier revisions. The 1763 Kamenskaya tale also uses it before clauses that name another sloboda, ostrog or village as her origin. Search for her father's household in the previous revision of the place the clause names. Use the same village only when the clause names it or names no other place. [S22], [S6]\n- **Status and origin formula.** Record it word for word as its own field. Examples:\n  - \"написан в прежнюю перепись\", with any other place named (\"в Камышевской слободе\", \"в Алапаевском заводе\")\n  - \"после переписи рожденный\"\n  - entries made under the 1735 order\n  - bought or transferred people (\"купленной … из деревни …, написанного в прежнюю перепись за оным помещиком\")\n  - \"в рекруты\", \"в бегах\" or \"умре\"","sources":["S15","S6","S2","S12","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8603482db3dc","kind":"unclassified","anchor":"[S25], [S3], [S11]\n- **Transferred serfs.** Only a household member entered in the previous revision carries the \"transferred from\" place. Children born after it carry no origin. If no such member is present, record the origin as unstated. A participant treated the origins of neighbouring entries as a weak lead only. [S20]\n- **Converts.** Baptised dependents may be listed under a first name plus a second name. Find the baptism entry and its godparents before you read the second name as a patronymic. In published extracts that participants posted, the purchaser's children were the godparents at such baptisms, and the converts' second name corresponds to a godparent's first name. That link is an inference from the extracts; confirm it in the baptism and revision records themselves. [S19]\n- **Local narrative, signatures and confession.** In the 1747 local tales, an entry can give:\n  - the birthplace\n  - the year the person left an earlier home on a passport\n  - the earlier census he was assessed in\n  - who signed for an illiterate head","sources":["S25","S3","S11","S20","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-53eb9eadf989","kind":"unclassified","anchor":"The central summary of the same entries leaves this text out. Copy it in full. [S2] The town-estate lists of 1858–1867 usually note confession at the foot of the page. Members of one household could be partly Orthodox and partly Old Believer, so record confession per person. [S8]\n- **Later layers.** Any later annotation is its own observation with its own date, not part of the entry. Examples are a pencil correction of a district name in the GAPK inventory entry for 111-3-40, or a note about a later move. [S15], [S23]","sources":["S2","S8","S15","S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2149acefaa38","kind":"unclassified","anchor":"- **Boilerplate origins.** In the 1743 Katai tales almost every entry repeats \"written in the poll census at village X, native of the same\". A participant checked these against the 1719 RGADA census book. Several men had actually been counted in other villages, and some surnames were absent in 1719 altogether. Treat the formula as a claim and test each household against the earlier census. [S11], [S10]\n- **Official registration versus residence.** A participant found that the 1763 revision of Katai ostrog (cited as RGADA f.350, op.2, kn.904) entered some branches at their former settlements, although the 1743 census and later records placed them elsewhere. Other participants gave two more cases. In the first, an 1834 tale notes a family \"living there for many years\" (проживает с давних лет), and a 1790 confession list already shows them at the new place. In the second, a family was returned to its official place. Date residence from confession lists. [S23]\n- **Compilation date.** Compute birth estimates from the actual compilation date for that place, not from 1 January of the nominal year:\n  - a participant gave 1 September 1850 for the Zlatoust 1850 list [S12]\n  - the participant's transcription of the 1762 Shartash tale dates it 30 September 1762 [S2]\n  - the participant's transcription of the 1763 Kamenskaya tale dates it 2 October 1763 [S6]\n  - a participant concluded that the \"1743\" Katai census ran into 1744–1745, from the birth dates in it and an entry dated 18 April 1744 [S11]\n- **Declared ages.** Expect bias. A participant compared one village's men from 1710 to 1762 and found that boys' ages were understated at their first enumeration and while they were liable for recruitment. Once past the limit, which he put at 35 for 1745, their declared ages rose sharply. One man gave the same age, 14, in 1710 and in 1719. Participants also found long-lived men in the 2nd and 3rd revisions whose ages the 1st revision does not support. Women's ages were rounded. [S16], [S17]","sources":["S11","S10","S23","S12","S2","S6","S16","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5431119d3a30","kind":"unclassified","anchor":"Compare a man's age across every census from 1710 and 1719 onward. Prefer a metrical-book birth entry when one exists. An age mismatch lowers a candidate's rank. It does not exclude the candidate. [S17]\n- **Exits and recruits.** The paired figure shows a recruit as taken, with the year. [S6] Check whether his wife and children are marked \"выбыла в [volost]\". If they are, open that volost's list for the same year and look for a heading such as \"взятого в рекруты … крестьянина … жена\". In a worked 1795 case, a recruit's wife was marked as gone to another volost and was found there under exactly that heading (cited as Ф.И154, оп.8, д.224, archive not named). [S9]","sources":["S17","S6","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6ab96b2737a4","kind":"unclassified","anchor":"A participant noted that in the Urals some recruits were sent to state factories as artisans and were not counted as soldiers. Early soldiers could stay in a local garrison and live at home outside the taxable population. So a man missing from the 1719 list while his son appears is not proof of death. Recruit lists survive only in part. [S9]","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0bb0f1663ded","kind":"unclassified","anchor":"- **Go backwards.** Move from the later list to the earlier one using three links: the previous-revision age, the named prior place or owner, and the household position. A participant worked one factory chain: 1858 (GAPK 111-3-260) → 1834 (111-3-256) → 1762 (RGADA 350-2-1636) → 1747 (350-2-1632). The RGADA inventory dates 350-2-1636 to 1762–1764 and 350-2-1632 to 1748. The 2nd-revision purchase statement names the village and the owner the family came from. [S3]\n- **Find wives through their fathers' households.** In the 1762 Shartash tale, a daughter is marked as married to a named peasant of the same village. In the husband's household she appears as a wife taken from that father, at the same age. Link the two entries, then carry her back in her father's household. [S2]\n- **Compare copies line by line, and do not count both.** For the 1719 Katai census, the RGADA book and the GASO household tales (f.24, op.2, d.74) differ in several ways:\n  - the surname is spelled with different vowels\n  - they group the settlements differently\n  - adult ages differ by up to 10 years\n  - only the local copy names the women and the taxes\n  - a participant took the local copy to be somewhat later, because an infant shown as half a year old in the RGADA book is one year old in the local copy; treat that order as unproven until dated evidence settles it","sources":["S3","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3db3a271d6ba","kind":"example","anchor":"[S10] For 1747, the local copy and the central copy cited by participants differ by a year in several ages, and in those entries the 1762 previous-revision figures match the central copy. [S2] Record each copy as a separate observation of one episode, never as corroboration.\n- **Bridge gaps with confession lists.** To chain revisions through the confession lists between them, and to use lists of people absent from confession, follow [reading confession lists, steps 3 and 5](russian-orthodox-confession-list-reading.md#5-check-the-household-against-revision-lists-and-metrical-books).","sources":["S10","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fcdc6537f6d0","kind":"example","anchor":"- **Record unlocated revisions as unlocated.** Participants could not locate the 4th–7th revisions for two Irbit volosts and cited the 1800 confession lists instead (GASO f.6, op.3, d.345b, l.69 ob. and d.345a, l.153 ob.). [S24]","sources":["S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-62e1d203bed8","kind":"unclassified","anchor":"[S1], [S5], [S12] Also check whether leaves missing from one online image set survive elsewhere. A participant could not find a person in the 1795 Zlatoust factory leaves on the NARB site and expected him on the missing leaves. Another participant then posted his entry from the 1795 list (cited as И-138-2-59, ll.266–266 ob.). [S12] NARB (НАРБ) is ambiguous: it abbreviates the National Archive of the Republic of Bashkortostan in Ufa [S34], and other recipes in this catalog use it for the National Archive of the Republic of Belarus. Confirm which archive holds fond И-138 in that archive's own catalogue, and write the archive's full name in the citation. Separately, a participant said she held missing leaves of the same revision and offered them to a researcher, who had meanwhile found his person with other help. [S12] Absence from a revision can mean the person was moved, was counted at the official place, or was outside the taxable population. [S9], [S23]","sources":["S1","S5","S12","S34","S9","S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0adabe849d81","kind":"unclassified","anchor":"Search-engine summaries of a Rosstat release report that the household sheets of the 1897 census were ordered destroyed after tabulation, with the order not carried out everywhere. The PDF did not load, so this account of destruction and uneven survival remains unconfirmed from the full release [S26]. Check the particular locality's surviving sheets before you send anyone to \"the 1897 census\":","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c2f351f7623e","kind":"unclassified","anchor":"1. Check the survival catalogues. The volunteer catalogue at metrics.tilda.ws/perepis1897 is arranged by country and archive, sometimes down to fond, delo and uezd, and marks some entries as unconfirmed. [S27] Altai State University's arch1897.histcensus.asu.ru is a catalogue lead: its title and address were seen in a search-result bibliography, but the site refused the connection, so its contents and usability remain unconfirmed [S28].\n2. Then read the holder's own inventory. A census-commission fond does not mean that named sheets survive, and an uezd absent from a catalogue is not proven lost.\n3. Even in a set known to survive, check the delo for the settlement. Two examples: the State Archive in Tobolsk holds the sheets of the Tobolsk guberniya statistical committee (ф. И-417, оп. 2, д. 1–4175): second and trial copies for eight uezds and their towns, all except Berezov and Surgut, digitised with paid online access. [S39], [S40] The State Archive of Yaroslavl Oblast keeps an 1897 census database and electronic indexes for the residents of some towns of the guberniya, Yaroslavl among them. [S41]","sources":["S27","S28","S39","S40","S41"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-60acdad72a10","kind":"unclassified","anchor":"Rootera's 1897 index (rootera.lv) covers only places in present-day Latvia and is still being extended. [S30]","sources":["S30"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2f0d61ebd841","kind":"unclassified","anchor":"For 16th- to 18th-century estates of the Grand Duchy of Lithuania, now in Belarus and Lithuania, the Vilna Archaeographic Commission's «Акты» volumes publish estate инвентари (inventories). These are economic descriptions of starosties, estates, folwarks and villages, with their peasants and dues, not archival описи (finding aids). [S31], [S32], [S33]","sources":["S31","S32","S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2619f630e063","kind":"unclassified","anchor":"- **Choose the volume by the documents' dates, not the publication year.** Vol. XXV (1898) holds inventories and boundary acts catalogued as 16th–17th century, with indexes on pp. 517–614. [S33] Vol. XXXV (1910) holds inventories of 1751–1789. [S31] Vol. XXXVIII (1914) holds inventories of 1720–1798. [S32]\n- **Start from the contents and the indexes,** and search the estate's name as well as the village's. [S31], [S32]\n- **Map printed pages to the PDF for each location** instead of carrying one offset across the volume or to another copy, and check the errata list.\n- **Read the neighbouring pages** for the document's heading, start and continuation.\n- **Bound what an inventory shows.** It is not a full list of residents, and its content depends on the document. An empty OCR search of the scans is not a negative.\n- Link the online copies; do not redistribute them.","sources":["S33","S31","S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e5c5e688ba84","kind":"unclassified","anchor":"- **Do not assume 9th or 10th revision tales exist for a Cossack household.** Check the holding archive's inventory for which revisions were taken and survive, and search the Host's own records for the later years.\n- **Read the surname handbook as an index.** Vishnevsky's handbook of Orenburg Cossack surnames is a surname index built from revision tales in the Bashkortostan, Samara and Orenburg archives, not a set of family lists. [S36] A hit does not prove residence in that place and year. A miss does not disprove a later document.","sources":["S36"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ea9a0379fc1e","kind":"method","anchor":"- **Clergy statements:** among the first-revision files, also look for the parish clergy's statements about their parishioners. RGADA's inventory describes f.350, op.2, d.1649 as clergy statements about parishioners, filed with statements about landlords' and monastery peasants of three станы of Kurmysh uezd, 1722–1723. [S55] One file can cover several станы, so where such a statement names a village known only from later sources, keep every стан in the file's title as a candidate until the statement's own headings or another record place the village. Give each clergy statement its own row, and do not use one as a household list until you have read it.","sources":["S55"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e45c8dc6f678","kind":"custody","anchor":"- **Iset-line fortresses.** Chelyabinsk fortress was founded in 1736, after the 1719 sloboda lists; its 1740 census book is published by I. V. Degtyarev in «Челябинская старина» (Chelyabinsk, 1996, pp. 56–96). [S52 @2026-11-08] V. V. Pozdeev published the 1739–1740 first-settler lists of the Miass fortress in «Ветер времени», 2007, no. 1 (14), pp. 67–74. [S53 @2026-11-08] A local-history page cites the Miass census as RGADA f.248, op.3, d.144; confirm the locator in the RGADA inventory and check each edition against its original. [S54 @2026-11-08]","sources":["S52","S53","S54"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4e0576b78f5c","kind":"method","anchor":"- **Bashkir and Tatar households.** Do not chain households by an -ов/-ев/-ин name as if it were a hereditary surname. Among Turkic-speaking peoples, Bashkirs included, propertied families took surnames from the 17th century but ordinary people only in the 19th [S49]; a Familio guide says many Tatars and Bashkirs fixed theirs only after 1917 [S48]; and the Orenburg Cossack surname handbook notes that the revision tales of some Muslim settlements record no surnames [S43]. Chain such households by the links in the first bullet of this step, and do not use a surname as a link in revisions earlier than the one where it first appears for that household; search earlier tales for the name only as a lead. Check the printed volumes «История башкирских родов» (Ufa; vol. 14, «Тазлар», 2015, prints shezhere, archival documents and 1850 revision data) [S50], cite volume and page, and test each name against the revision.","sources":["S43","S48","S49","S50"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-24bd1de145e0","kind":"custody","anchor":"Route a revision for present-day Bashkortostan, Chelyabinsk or Orenburg oblast by the guberniya on its date. The offices of Orenburg guberniya moved from Orenburg to Ufa in 1802, and Ufa became the seat of a separate Ufa guberniya in 1865. [S45 @2026-11-08] The Orenburg Treasury Chamber's revision tales are fond И-138, op. 2 of the National Archive of the Republic of Bashkortostan in Ufa, per NashiPredki's copy of the inventory [S47 @2026-11-08], and hold the 5th–10th revisions (1795–1858) according to a Familio guide [S48 @2026-11-08], so an 1816 or 1834 tale for a village now in Chelyabinsk or Orenburg oblast can be in Ufa, and for this fond NARB means the Bashkortostan archive.","sources":["S45","S47","S48"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-059a79e9f8b7","kind":"historical","anchor":"Conversely, the agreement of 20 March 1919 on Soviet Bashkir autonomy moved to Bashkiria volosts of eleven uezds: Orenburg, Orsk, Verkhneuralsk, Troitsk, Chelyabinsk, Shadrinsk, Ekaterinburg, Krasnoufimsk, Zlatoust, Ufa and Sterlitamak, and one volost of Buzuluk uezd. [S46] Shadrinsk, Ekaterinburg and Krasnoufimsk uezds belonged to Perm guberniya, not to Orenburg guberniya. [S56] So for a village that was in Bashkiria after 1919, look for its pre-1919 records under the guberniya and uezd it then belonged to, Perm guberniya included, not only in the Orenburg and Chelyabinsk regional archives.","sources":["S46","S56"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8296e63979a2","kind":"method","anchor":"- **Use the handbook for non-Cossack families of the Host's territory too, and take spellings from the tale.** After its Cossack lists of 1816–1834, it indexes groups later enrolled into the Host: the peasants and soldiers of the volosts attached to it, the soldiers and odnodvortsy of the line settlements, and retired soldiers with their children. It gives surnames in modern spelling with alternative readings separated by a slash, so search and cite the form written in the revision tale. [S43]","sources":["S43"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0599e3bf99b9","kind":"custody","anchor":"- **After 1834, follow the Host's own series.** The handbook's introduction states that the 8th revision (1834) was the last taken for the Host, so do not expect 9th or 10th revision tales for a Host household. [S43 @2026-11-08] The Chelyabinsk Oblast United State Archive (OGAChO) lists formulary, service, family and name lists in its stanitsa-board fonds, for example f. И-31 (Kremenkul, 1853–1856, 1865, 1866) and f. И-10 (Emanzhelinsk, 1833, 1842–1849, 1854, 1855, 1865), and orders of the Orenburg Cossack Host for 1850–1858 in f. И-10. [S42 @2026-11-08] Cite a delo only after finding it in the opis.","sources":["S42","S43"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8d9e1f126536","kind":"historical","anchor":"- **Fix both jurisdictions on the event date:** the Host's (stanitsa or settlement; from the 1840 Statute one of ten regimental districts, later a military department) and the civil one (guberniya, uezd and volost). [S44] The Statute of 12 December 1840 and later acts enrolled the population of the Host's territory, state peasants and retired soldiers among them, and some state peasants only in 1853, so a family entered as peasants or soldiers in 1834 can be Cossacks later. [S44], [S43] Search the civil series up to the enrolment and the Host series after it, and record the change as a dated transition ([estate registration status, step 3](russian-estate-registration-status.md#3-date-when-the-person-acquired-the-status)), not as a clerk's error. The handbook adds that some peasants moved away to avoid enrolment. [S43]","sources":["S44","S43"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dbc0aac0431b","kind":"custody","anchor":"The household cards and fragmentary householder lists of the 1920 agricultural census are a separate route: NA RB f. Р-472, op. 1 (Central Statistical Administration of the Bashkir ASSR). [S51 @2026-11-08]","sources":["S51"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
