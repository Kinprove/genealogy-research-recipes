claims:
  - {"id":"C-7f93c3f7dffd","kind":"method","anchor":"- **Check before assuming.** Before moving to enslaver-side records, look for the household as free people of color in the 1850 and 1860 population schedules, which name free people of color. The slave schedules, by contrast, list enslaved people mostly by age, sex and color under the slaveholder's name. If the free-household search fails, move to enslaver-side records [S17], [S10]. A free household found in 1850 or 1860 shows freedom at that census date only. Record it with that date, and if the family could have been enslaved earlier, still search for the will, deed, purchase or manumission that freed them [S2]. Make a status table with three values (free, enslaved, unknown), each with its evidence and date. A failed name search sets the status to \"unknown\", not \"enslaved\".\n- **Date the status evidence.** Compare the date the will was written with the date emancipation took effect locally. A Texas will bequeathing Mariah and her son Bob in April 1864 reached probate in September 1865, after emancipation, without specifying their status at probate [S26]. Enter the bequest at the writing date.\n- **Free people of color in court records.** Search available court minutes and registration books for the phrase “free man of color” and related terms. The 1863 court terms for Richmond County, Georgia, are a lead for registrations [S2]. Transcribe abbreviations such as FPC, FMC and FWC literally [S5].\n- **Pennsylvania.** Living in Pennsylvania after the 1780 Gradual Abolition Act does not mean a person was free. The act ended slavery gradually, not at once [S21], [S23]:\n  - People already enslaved when the act passed stayed enslaved for life, provided their enslavers registered them by 1 November 1780. Unregistered people were freed. Look for the 1780 slave register in the county.\n  - Children born afterward to enslaved mothers were held as servants until age 28 (not for a 28-year term counted from some later date).\n  - Registering each such child's birth comes from the amending act of 29 March 1788, not the 1780 act. The holder had to deliver the child's name, sex and age as best known, in writing, to the county clerk of the peace within six months of birth. Search county birth returns from 1788 onward. In Chester County these are the \"Negro Servant Returns\", 1788–1821.\n  - Because of the age-28 term, people enslaved for life and term servants can turn up in the same households for decades after 1780.","sources":["S17","S10","S2","S26","S5","S21","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bc27d7311424","kind":"method","anchor":"Search these Pennsylvania sources:\n  - the 1780 county slave registers and the post-1788 birth returns described above;\n  - the septennial census returns (Pennsylvania State Archives RG-7, 1779–1863), which include enslaved people in a household [S23]. Only about 11% of the returns survive, and many enumerators listed only people enslaved for life, not the term servants born after 1780. A blank entry therefore does not rule out a term servant;\n  - the Pennsylvania Abolition Society's \"Manumissions and indentures, ca. 1780–1840\", held at the Historical Society of Pennsylvania and available as a seven-reel microfilm set. The series is arranged by name of master or slaveholder, so search under the master's name. It also includes records from several other eastern states, not only Pennsylvania [S22], [S24];\n  - county manumission records. The presenter points to an index found by searching \"manumissions\" at chesco.org and credits it to the Chester County Historical Society [S22], [S24]. chesco.org is actually the site of Chester County Archives and Records Services, the county government's archive. The Historical Society is a separate private organization. The county archive lists slave manumissions among its holdings and posts online indexes to the 1780 Slave Register and the Negro Servant Returns. Confirm which index you are using, and cite the county archive as its custodian.\n- **Other gradual-abolition states.** In other Northern states that abolished slavery gradually, a person born before the act's cutoff date was not freed by the act. Connecticut's 1784 act, for example, covered only people born after 1 March 1784 and did not free their parents [S27].\n  - For a person born on or before the cutoff, look for separate evidence of manumission and check the later 1848 abolition act [S27].\n  - Check an estimated census age against the town birth record. The Woodstock entry placed Gin’s birth ten months before the cutoff, and an 1845 will described her as having passed to the heirs [S27].\n  - Do not assume that \"servant\" in these states' wills means hired help: a \"servant\" left to the testator's heirs can be a person held as property [S27]. A support duty split among heirs is not proof on its own, since Connecticut also made former owners' heirs liable for supporting people they had freed. Compare the birth date, the census status columns, the terms of the applicable act and any later evidence of freedom.","sources":["S23","S22","S24","S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2a4763325ffa","kind":"method","anchor":"- **Find out how freedom came.** Possible routes include [S9]:\n  - USCT service, with pension files claimed by widows, children or even parents;\n  - self-emancipation;\n  - flight to a contraband camp. Camp histories turn up in local history sources; a census will not show them;\n  - wartime employment.\n- **USCT testimony and questionnaires.** Look for questions naming former enslavers, including who held the soldier at enlistment. Record the answer, speaker, document type when known and file locator. The surviving question in one demonstration did not identify the form [S14]. Keep same-surname enslavers separate until another record identifies the person.\n- **Later records of the children.** Look for family biographical forms in a child’s World War I Gold Star file. Extract any named former enslaver, occupation, county of enslavement and postwar destination [S28]. Attribute the account to its informant and test those leads in earlier records.\n- **A woman's maiden name.** Identify the men in her life first: husband, father and brothers. Then search the Civil War pension file of any of them who served, or of another member of her community, and the Freedmen's Bureau marriage records [S29]. These can give her maiden name.\n- **Freedmen's Bureau field-office records.** The Bureau operated from 1865 to 1872, and its records are in National Archives Record Group 105 [S1]. Field-office records include rations and labor contracts [S17]. Check who signed the contract and copy any stated relationship: a mother’s signed identification of her children can distinguish them from other people in the same 1870 household [S11]. Search the field office covering the person's home, and also the office in the nearest larger town, because people sometimes travelled there to file [S20].\n- **Locate the Bureau series.** The field-office publications are M1900–M1913, one for each state or district, with Florida in M1869 [S43], [S104], [S105]. The Washington headquarters marriage records for 1861–1869 are M1875 [S103]. Use the collection for the relevant office [S44]. Alabama’s M1900 collection offers image browsing [S45]. Check which pages the Smithsonian project transcribed before relying on its text search [S46].\n- **Cover the Bureau before calling a search negative.** The home town may have had no field office, and one agent could cover several counties. Find the offices near the home on a map, or on the Mapping the Freedmen's Bureau site, and search each one whose district may have included the home [S30]. Field offices are not the whole Bureau: also search the Headquarters, state Assistant Commissioner and state Superintendent of Education records [S30]. Transcription coverage differs by office. Where a series is not transcribed, browse its images, including the agent's \"Letters Sent\" [S30]. Record each office and series in the coverage log.\n- **Cite the Bureau item.** Record the collection, office, series, NARA publication and roll, page and letter number, together with the range searched. If a finding aid omits roll numbers, match the item’s title and position to NARA’s descriptive pamphlet. The Smithsonian’s Tennessee finding aid preserved the NARA sequence while omitting its roll numbers [S30].\n- **Freedman's Bank registers.** The Freedman's Savings and Trust Company opened about 37 branches in 17 states and the District of Columbia. The surviving signature registers of only 29 branches, 1865–1874, are NARA M816 [S39], 27 rolls in Record Group 101 [S47]. What each branch asked varied, but entries can name parents, brothers and sisters, spouse and children, and sometimes a former owner [S39]. FamilySearch has a name index with the register images [S48]. The NARA indexes (M817) lack many account numbers, sometimes give numbers that differ from the registers, and leave out some depositors who appear in the registers, so read the register images themselves [S39]. A miss counts only for a surviving branch near the person, within its years. Record which branches you read.\n- **Information Wanted ads.** Search Last Seen: Finding Family After Slavery (informationwanted.org). It collects newspaper ads, mostly 1865–1922, placed by formerly enslaved people looking for relatives separated by sale [S40]. It has a location search but no enslaver field, so run keyword searches on enslaver names as well as relatives' names, and search the places [S41]. Record each ad as the advertiser's own account, with the newspaper and issue date.\n- **Enslaved.org.** It links person-level data from many contributed datasets and projects [S42]. Follow each hit to its contributing dataset and that dataset's original source, and cite those, not the hub.\n- **Postwar labor contracts.** Record the employer and other workers in labor or sharecropping agreements. If the employer shares a freedperson’s surname, trace that employer’s land and family records in the county [S31]. The employment relationship gives a candidate to investigate. Seek an earlier record identifying an enslaving relationship.\n- **Apprenticeship records.** Inspect county court minutes and bonds in the years after a child first appears in another household. A Tennessee bond dated 2 March 1874 named the mother and her current husband for a child living with the future master in 1870 [S32]. Record the census observation and legal placement separately, with the boy’s age and the wording of the bond.\n- **Southern Claims Commission files.** Search by county, not by surname. Read the testimony in allowed claims and also in disallowed and barred claims (NARA M1407). These files are on Ancestry and Fold3. Formerly enslaved witnesses in someone else's claim may name their owner [S20].\n- **Fugitive Slave Act cases (post-1850).** The 1850 act used federal commissioners and U.S. marshals to return fugitives, so it created federal paperwork: a petition, an ownership affidavit and witness testimony. Search under the claimant slaveholder's name [S8].","sources":["S9","S14","S28","S29","S1","S17","S11","S20","S43","S104","S105","S103","S44","S45","S46","S30","S39","S47","S48","S40","S41","S42","S31","S32","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-55afc6674ac6","kind":"method","anchor":"- **Collect candidates.** Draw them from the 1870 household (older generations living there), neighbors, shared given names between Black and white families, slave schedules and county slaveholder lists [S10], [S13]. Include the children’s middle names when generating surname leads, then test each candidate in ownership records [S18].\n- **Locate the voter before selecting counties.** Check the 1867 registration or oath book when one survives. Washington McGriff’s recorded birthplace and later tax records pointed to Thomas County, but his 1867 voter oath was in Decatur County, Georgia, election district 8, no. 37, p. 318 [S33]. Include both counties in the candidate search.\n- **Rank by schedule entries.** For a surname shared by several owners, compare each owner's 1850/1860 slave-schedule entries. Look for an enslaved person of the expected age and sex, and investigate the owners with a fit first [S18]. An owner with no fitting entry moves down the ranking but is not excluded: schedule ages may be estimates, so keep the mismatch unresolved unless independent evidence excludes that owner. Record the mismatch and its year in the candidate register.\n- **Keep the surname as a set of hypotheses.** Possible explanations:\n  - the last enslaver;\n  - an earlier, first, favorite or longest enslaver [S25];\n  - a parent's or grandparent's enslaver [S25];\n  - a surname the person carried from owner to owner [S25];\n  - no connection at all.","sources":["S10","S13","S18","S33","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c17dd67d6eb2","kind":"method","anchor":"Compare the surname with earlier holders as well as the last one. In a Liberty County example the adopted surname led back to an earlier enslaver [S12].","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8625eb74c5e3","kind":"unclassified","anchor":"Enslaved people appear in records of the enslaver's personal property: sale notices, business records and probate [S1]. For each candidate in the register, best fits first:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e72566da3786","kind":"method","anchor":"- **Get the full probate file**, not just the will: inventory, appraisals, accountings and distributions [S10], [S2], and the estate sale record. An estate settled without a will can hold the same papers, and its sale record can name the buyers [S34]. An enslaved person sold at the estate sale passed to the buyer, so follow the buyer as well as the heirs. Then retrieve the later wills of heirs, widows and administrators.\n- **Retrieve the other property records:** deeds of sale or gift, mortgages and plantation papers [S15], [S16].\n- **Search civil suits over a sale.** Search buyer and seller in the court files and inspect the depositions. In a 1715 Suffolk County suit, the buyer identified the boy, his age, the ship and the island from which he had been brought, and the ship’s captain gave separate testimony [S35]. Record which witness supplied each detail.\n- **Read the enslaver family's published genealogies and memoirs.** They can name enslaved people whom the early federal censuses only count. Take each name to vital, census and probate records, and treat the writer's guesses about a person's origin or kin as hypotheses [S27].\n- **Follow the chain through purchase, marriage and inheritance.** Work backward from the inventory through mortgages, appraisals, sales and wills [S15]. Record each named person, place, date and party before comparing the next transaction.","sources":["S10","S2","S34","S15","S16","S35","S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0844e091f566","kind":"method","anchor":"A will and appraisal can list similar names in different generations. In the El Destino research, a proposed link from Amy in an 1820 appraisal to Amy in a 1786 will remained a hypothesis [S15].\n- **Search every place the enslaver lived.** Trace the candidate's own moves and search bills of sale and probate in every county and state where he lived. Enslaved people could reach him by bequest from a relative in another state, or move to another state with a widow after her husband's death [S18].\n- **Full Text Search.** Put the enslaver's name in quotes in the name field. Add the given name and status keywords using the + prefix for required terms, then filter by place. Quoted phrases, + for required terms and place filters are documented tool behavior. The presenter's grouped form +(negro slave), which she says matches either word, comes only from her demonstration [S2]. Test it, and if it fails, run separate +negro and +slave searches. Also try +emancipate [S2].\n  - Also search under the plantation, overseer and executor names [S3], [S6].\n  - AI transcripts can drop commas between names, so read the original image [S6].\n  - Re-run the searches every week or two, because processed coverage keeps growing [S3].","sources":["S15","S18","S2","S3","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2086dc8a56bf","kind":"method","anchor":"- **Same name in one document.** Create distinct rows for same-name entries and seek a later accounting that supplies ages or relationships. An 1857 inventory listed two Elijahs whom a later accounting distinguished as father and son, aged 43 and 22 [S2].\n- **Names across documents.** Link variants such as Jim/James or Nan/Fanny/Nanny only as candidates [S25]. An exact same-spelling match is a candidate too: several enslaved people in one area could share a name [S36]. A link to the same holder or household [S36], or a repeated distinctive descriptor within the same family or neighborhood [S25], strengthens it.\n- **Descriptors across documents.** Record descriptions and appraised values with their dates. Appraisals can vary with age, health and skills. Similar prices provide little identification on their own. A vital entry describing a woman named Pegge as “negro” did not settle whether she was the “Indian girl” in an earlier inventory [S36]. Test the holder, date and household against independent evidence.\n- **Unnamed entries.** Record the count, holder, recipient and date on a separate row. A later deed naming Pegge did not establish that she was among eight people recorded without names in the earlier purchase [S36]. Preserve the proposed link as a hypothesis.\n- **Grouping type.** Mark a grouping **explicit** when the document states the relationship, even if some members appear only as “her three children” [S2], [S6]. Mark a grouping suggested by sequence **order-inferred** and test it against another record. Appraisal order can put unrelated people together [S15], [S16].\n- **Bequests of a woman's increase.** Read \"her increase\" or \"all her issue\" in a will as a gift of the enslaved woman's children, not as boilerplate: usually those born later, and those already born too when the clause says so. Record the clause as an explicit grouping of the woman and the children it covers, still unnamed, and look for those children in the legatee's later records. Read every bequest clause in full: wills can name enslaved people in the same sentence as bedding, silverware and livestock, and use the livestock term \"increase\" for enslaved women's children (sale advertisements also use \"breeding\") [S37].","sources":["S2","S25","S36","S6","S15","S16","S37"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-45becc84a231","kind":"method","anchor":"- **Registers.** Search the separate colored register, the back of the register and the regular or white register. Clerks differed, and entries in a colored register may not state race [S5].\n- **Other separated series.** Check Black churches, separate obituary sections, separate cemeteries or sections, segregated military units and prison records [S4].\n- **Catholic registers.** Check how the particular parish or diocese organized its sacramental records. Combined Baltimore registers can put a person’s status in the margin and name an enslaver in the entry [S19]. Read the margins and transcribe each observation separately.","sources":["S5","S4","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9414306bfcc5","kind":"unclassified","anchor":"- **WPA narratives.** The Federal Writers' Project interviews (1936–1938) hold more than 2,300 first-person accounts by former slaves. A narrative from the same birthplace or birth year gives locality context. It is not evidence about the ancestor. Note the narratives' limits: memories more than 60 years old, uneven transcription and reduced candor with white interviewers [S7].\n- **Handed-down accounts.** A family's account of an enslaved ancestor may not be a first-person narrative. It can be an oral history handed down over generations [S38]. Record its chain of tellers as [family interviews and oral tradition](family-interviews-and-oral-tradition.md) describes, and treat what it says as a hypothesis to test, not as the ancestor's own testimony.\n- **DNA.** DNA matches to descendants of a proposed sibling test one hypothesis [S15]. A Y-DNA surname mismatch is another. Neither proves who the enslaver or the father was. Route them to [Y-DNA interpretation](ydna-mtdna-interpretation.md) and [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S7","S38","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d43a84dcef76","kind":"historical","anchor":"- **New Jersey \"apprentices for life\".** On the 1860 New Jersey census, read this term as a person still held under the state's 1846 act, not as a free trade apprentice [S49], [S50]. Those still held were freed by the Thirteenth Amendment in 1865, but a master or mistress could discharge an apprentice earlier by written certificate, so do not assume that someone listed in 1860 stayed in bondage until 1865 [S50]. The official 1860 total was 18, yet a page-by-page study found 64 names connected to slavery in the regular population schedules [S51]. Search the population pages and inspect each entry’s own status wording.","sources":["S49","S50","S51"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8a1d5259a666","kind":"historical","anchor":"- **Do not infer freedom from a Northern residence.** The 1840 U.S. census still reported enslaved residents in New Hampshire (1), Rhode Island (5), Connecticut (17, not counting 37 Amistad captives), New York (4) and New Jersey (674), so living in one of these states around 1840 does not settle status [S52]. Nor does Vermont's 1777 clause show that a person there was free: abolition there was a process, not a single event, and law and practice differed, so look for a record of that person's status [S49], [S53], [S54].","sources":["S52","S49","S53","S54"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-81695f904559","kind":"method","anchor":"- **Local registrations in gradual-abolition states.** Search for local records naming enslaved people and children bound to service: The Legal Genealogist reports such records in most Northern states that adopted gradual emancipation [S49]. The Pennsylvania registers described below went to the county Clerk of the Peace, or in Philadelphia to the clerk of the court of record [S55]. Elsewhere, search at the level each state used: the county clerk under New Jersey's 1804 act [S56], the city or town clerk under New York's 1799 act [S57], and the town clerk in Connecticut, so in New York and Connecticut look in town rather than county records [S58].","sources":["S49","S55","S56","S57","S58"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-aee652addc95","kind":"method","anchor":"- **A free woman heading an 1850 or 1860 household.** When a free woman of color heads a household with a growing number of children and no husband listed, keep an enslaved husband as one hypothesis. The FamilyTreeDNA guide reports that marriages between free and enslaved people, not uncommon in the Upper South, could not be formalized, and that the free-born children of an enslaved father carried their free mother's maiden name [S59]. Enslaved people could not legally marry [S64], and a child's status followed the mother's: Virginia's 1662 act held children \"bond or free only according to the condition of the mother\" [S63]. Search the children under the mother's surname as well as under any surname a father used. Widowhood, separation and an unmarried mother fit the same household, so keep the enslaved-husband reading open until a record names him. The same guide reports that such couples often registered in the 1866 cohabitation registers described in §2 [S59].","sources":["S59","S64","S63"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fefa80dc7632","kind":"historical","anchor":"- **Cohabitation registers of 1866.** Search the registers made when Virginia and North Carolina legalized the unions of formerly enslaved couples in 1866 [S64], [S65]. Virginia's registers of colored persons cohabiting together as husband and wife on 27 February 1866 usually name former enslavers, residences and birthplaces, and a separate register lists children whose parents had ceased to cohabit [S64]. North Carolina's cohabitation bonds, filed with the county register of deeds under the March 1866 act, typically give the man's and the woman's names and ages and how long they had been married; some counties add the enslaver or the number of children [S65]. The FamilyTreeDNA guide uses these records to find a wife's maiden surname, and treats couples who registered on the same day as possibly related or enslaved in the same household [S60]. A RootsTech 2025 session description also pairs them with probate, Freedmen's Bureau records and DNA for the years before 1870 [S61].","sources":["S64","S65","S60","S61"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d96875105b88","kind":"historical","anchor":"- **Virginia death registers, 1853–1865.** Read the county or city register’s date, place and enslaver columns for a death before emancipation [S68]. Where the place describes a plantation, trace the named enslaver in tax and land records to locate it [S62]. Check the surviving register’s coverage before drawing a conclusion from a missing death.","sources":["S68","S62"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e5247bb4d69e","kind":"method","anchor":"- **Crop liens and chattel mortgages.** After 1865, search the county's recorded crop liens, chattel mortgages and trust deeds for a freedman who farmed as a sharecropper or tenant. A lien can place him on a named landlord's farm in a given year [S71]. In Tennessee, look in books titled Deeds of Trust or Trust Deeds; elsewhere the books are often titled Crop Liens [S71]. The FamilyTreeDNA guide reports that farmers who signed one lien together shared the risk and were typically a parent and an adult son or son-in-law, or siblings and brothers-in-law [S59]. Record a co-signer as a candidate relative until a record states the relationship.","sources":["S71","S59"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8e23e621247c","kind":"historical","anchor":"- **Do not read \"Mulatto\" as a sign of an enslaver father.** The 1870 and 1880 enumerator instructions call the word generic: it includes quadroons, octoroons and all persons having \"any perceptible trace of African blood\" [S66], [S67]. The entry therefore says nothing about how recent the white ancestry was, and the FamilyTreeDNA guide warns that it does not imply the person was the child of an enslaver [S59]. Do not add a candidate enslaver to the register on the strength of the color entry.","sources":["S66","S67","S59"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bc7862f92ab8","kind":"method","anchor":"- **Search heirs’ chancery suits.** Inspect the pleadings, exhibits and disposition when an inventory or will omits a person, including children born after the will was written. William Kee’s heirs disputed who inherited Tissa but agreed that she was Hannah’s daughter [S59]. Record what the parties agreed on separately from what they contested. Search the county equity court and any state appeal. Virginia chancery exhibits can give names, ages and relationships [S72]. To locate the file, use [court case file recovery](court-case-file-recovery.md).","sources":["S59","S72"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-197d8a23475f","kind":"method","anchor":"- **Age words and values.** Use descriptors and appraised values to bracket an age, not to fix one. \"Old\" and \"young\", like \"big\" and \"little\", may only tell apart two people with the same name, and do not show that they were related [S59], [S69]. Read \"boy\" and \"girl\" by that appraiser's own usage, not as children under ten: one 1843 Maryland appraiser counted \"boys\" as 17 and under [S69]. Prices were highest for healthy young adult men, then for women of childbearing age, and low for young children and for old or infirm people [S70], [S69]. A low value can therefore mean a child or an old person, so compare values only within one document and beside their descriptors.","sources":["S59","S69","S70"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7f4bca1b1f60","kind":"portal-availability","anchor":"The Library of Virginia reports no statewide index to the 1853–1896 death registers, only indexes that some county clerks made, so look for a county index or read the register [S68 @2026-11-12].","sources":["S68"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7b6a7a7a6531","kind":"portal-availability","anchor":"The same guide reports that most of FamilySearch's crop liens and chattel mortgages are not indexed but can be reached through Full Text Search [S59 @2026-11-12].","sources":["S59"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-37098710df1f","kind":"historical","anchor":"\"Held for life\" means only that the state's first act did not free the person; a later act could. New York's 1799 act did not free people born before 4 July 1799, and legislation enacted in 1817 freed the remaining enslaved people in 1827 [S57]. Before ruling on a person's status at a date after the first act, look for a later act in that state.","sources":["S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-24fe5a9083","kind":"method","anchor":"Search period vocabulary as well as modern subject terms. In North Carolina material, the UNC Greensboro exhibit identifies terms such as absconding, truancy, eloping and running away. Combine the terms actually used by the local records with place and date; do not expect a contemporary heading to use a modern research label. [S73], [S74]","sources":["S73","S74"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-2b81319f2c","kind":"method","anchor":"A flight advertisement records an enslaver seeking someone; it does not establish where that person went. Include southern towns, wilderness refuges and Native communities among routes to test rather than assuming every escape went north. Surviving reports often reflect discovery or suppression, so an undiscovered refuge can leave little official documentation; preserve the destination as unknown unless evidence identifies it. [S75], [S76], [S77]","sources":["S75","S76","S77"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-d6348239fa","kind":"method","anchor":"For Confederate forced labour, inspect the RG 109 Confederate Quartermaster and Corps of Engineer payrolls through the National Archives catalogue and its available indexes. Extract the labourer, enslaver, occupation, work period and payee as separate roles. NARA describes postwar arrangement and indexing, so do not label the entire series unindexed or mistake a later compilation date for the labour date. Some payrolls include free Black or white employees; determine each person’s status from the entry rather than the series title. [S78], [S79]","sources":["S78","S79"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-bbc8d5b55b","kind":"method","anchor":"Keep an honorific separate from a relationship. The Natchez Trace history describes aunt and uncle as respectful forms of address for older Black people. A person called Uncle in a narrative is therefore a candidate relative only when other evidence supplies the kinship; copy the wording without manufacturing a parent-sibling connection. [S80], [S81]","sources":["S80","S81"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-goldie17-62494b586c","kind":"method","anchor":"For North Carolina emancipation research, search county court records and the State Archives’ Records of Enslaved People collection, PC.1629, alongside Quaker meeting papers. Read the collection guide’s provenance notes: it combines originals and copies, and some selected copies have uncertain provenance. Identify the actual document and originating county or collection before treating a finding-aid entry as a complete county search. [S82], [S83]","sources":["S82","S83"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-provine","kind":"method","anchor":"According to the Just Genealogy livestream excerpt, Dorothy Provine’s register abstracts are a starting point for free-status research in Alexandria County and Washington, DC [S99†]. Search the Alexandria County volume for 1797–1861 and the District of Columbia volumes for 1821–1861. When logging a miss for the District, account for the gap between the volume ending in 1846 and the one beginning in 1855 [S100], [S101].","sources":["S99","S100","S101"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-20261118-boston","kind":"method","anchor":"For Boston, look in the Overseers of the Poor’s almshouse records for entries that describe a person as enslaved or formerly enslaved. Record the status the entry states and leave it open when the entry gives only an admission [S94], [S96].","sources":["S94","S96"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-sharecropping","kind":"method","anchor":"Read the expense clauses in a sharecropping agreement alongside the promised fraction. Record which costs come out before division when the agreement specifies deductions, and leave the actual payout open until an accounting or receipt shows it [S89], [S92]. Check what labor the agreement assigns to each household member, including domestic work, even when only one person is named as the farmer [S89], [S92], [S93].","sources":["S89","S92","S93"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-project-search","kind":"portal-availability","anchor":"Search American Ancestors’ 10 Million Names databases for people enslaved in what became the United States. Include the collections about free and freed people and their communities when tracing a person across emancipation [S94 @2026-11-18], [S95 @2026-11-18].","sources":["S94","S95"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-project-partners","kind":"portal-availability","anchor":"For a promising 10 Million Names hit, check the collection description for a named contributor. Use the contributor’s own site for the historical context and related records. For example, the project credits the Newport Historical Society for its Newport database, and the society describes the primary sources it used [S94 @2026-11-18], [S97 @2026-11-18], [S98 @2026-11-18].","sources":["S94","S97","S98"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-newspaper","kind":"method","anchor":"For someone who escaped enslavement, search contemporary newspaper reward advertisements placed by enslavers, including issues from before 1850. Use terms such as “ran away” and “reward” with the person’s name or the place [S87], [S88].","sources":["S87","S88"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-schedule","kind":"historical","anchor":"Date a slave-schedule association to the census year and leave earlier ownership open. In 1850, the instructions treated the person for whom the enslaved person was found working as the owner. The 1860 instructions called for identifying the actual proprietor and the employer separately when someone returned people owned by others. Extract those roles as written and verify ownership in a separate record [S89], [S90], [S91].","sources":["S89","S90","S91"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-seller","kind":"method","anchor":"When a purchase names an estate as the seller, pull that estate’s probate file under the decedent’s name. Check its inventory and distributions for the person and any relatives named there. Follow the seller’s file even when a buyer purchased from an in-law’s estate [S84], [S85].","sources":["S84","S85"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-generations","kind":"method","anchor":"In a plantation list with explicit mother–child groups, look for daughters listed elsewhere in the same record as mothers. Record each stated relationship on its own, and keep the link between the two entries tentative until their details agree [S84], [S86].","sources":["S84","S86"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20261118-county-books","kind":"method","anchor":"Search for both Black and white names in Byrd and Smith’s North Carolina county volumes. According to the Just Genealogy livestream excerpt, names of white people appear in these sources too [S99†]. The Mecklenburg, Gaston and Union volume has a full name index and a table of civil and criminal cases [S102].","sources":["S99","S102"],"checked":null,"stated_as":"observation","review":"reviewed"}
