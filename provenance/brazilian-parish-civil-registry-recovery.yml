claims:
  - {"id":"C-e39be5f64051","kind":"method","anchor":"- **Work out the history of the place first.** Many Brazilian municipalities are recent. The town in a record may have been a village or district of an older municipality on the event date [S1].\n- In the IBGE municipal history, find *Formação Administrativa*. Record the parent municipality, former names, the law creating each district or municipality, and its installation date [S2], [S50], [S51].\n- **Worked example: Parelhas, Rio Grande do Norte.**\n  - Parelhas became a district of Jardim do Seridó in 1920. Law 630 created the municipality on 8 November 1926. It was installed on 1 January 1927 [S2]. The civil books shown in the 2024 FamilySearch demonstration started in 1927 [S4]. For a 1915 or 1921 birth at Parelhas, search Jardim do Seridó and check the actual district recorded [S3].\n  - Jardim do Seridó, formerly Conceição do Azevedo, separated from Acari in 1858 [S50]. Acari separated from Príncipe (later Caicó) in 1833 [S51]. For baptisms, work back from the parish created at Conceição do Azevedo on 4 September 1856 to its mother parish of Nossa Senhora da Guia in Acari [S46], then check Caicó for earlier entries [S4].\n- **Keep the civil chain and the church chain as two separate rows.** A parish (freguesia or paróquia) can be older or younger than the municipality. Its mother parish (matriz) is not always the parent municipality. In Pernambuco's Agreste, search the books of the mother parish of Bezerros for Caruaru, São Caetano and Gravatá families before about 1850 [S5].\n- **Use siblings to test a state boundary.** Two siblings’ baptisms point to Pedra Lavrada, Paraíba, in 1915 and Parelhas, Rio Grande do Norte, in 1917 [S3]. Search both parishes for the missing sibling. Verify the parents and estate in each entry before extending the family.\n- **Search inside the estate first.** In the Northeast, baptisms were often performed in estate chapels and entered by chapel and estate (engenho). Keep each search on the family's estate before you widen it: a wider area fills the results with same-named people from other estates [S6].","sources":["S1","S2","S50","S51","S4","S3","S46","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-65af5007af78","kind":"method","anchor":"- **Civil registration started on 1 January 1889.** Decree 9.886 of 7 March 1888 set the rules, and Decree 10.044 of 22 September 1888 fixed the start date [S7], [S8].\n- **A birth went to the clerk of the parish district where it happened.** The 1888 rules gave registration to the justice-of-the-peace clerk (Escrivão de Paz) of the first or only district of the parish where the birth took place [S7]. Early civil books therefore follow the parish districts of 1889, not today's municipalities.\n- **Trace the volume after a boundary change.** Check the old district, the successor registry and the municipal, district or state archive for a transfer or duplicate. Record the custodian and dates for the specific volume [S9].\n- **Search in this order, and log each step:**\n  1. the registry of the district that covered the birthplace on the event date;\n  2. the registry of each parent municipality in the chain from step 1;\n  3. the registry of the parents' residence: a birth could be registered in another town than the one where it happened, and small villages reported births to a central office [S9];\n  4. neighbouring towns, including across a state line, chosen from siblings’ baptisms or other records [S3].\n- **Distinguish an order to start registration from a surviving run.** Decree 907 of 29 January 1852 suspended the birth-and-death regulations approved on 18 June 1851 [S10]. Use 1 January 1889 as the general civil-registration starting point [S8].\n- **Check for earlier exceptions and local gaps.** Under the 1863 decree, the municipal council secretary where one spouse lived registered a non-Catholic marriage. The local justice-of-the-peace clerk registered non-Catholic births and deaths [S11]. FamilySearch’s guide reports that some local runs reach the 1860s or 1870s and others begin only in the 1920s [S9]. Verify the start of the particular volume.\n- **Civil marriage starts on 24 May 1890.** From that date only a marriage made under Decree 181 had civil validity. The couple could hold the church ceremony before or after the civil one [S12]. Search both registers for every marriage after that date, and expect two different dates.","sources":["S7","S8","S9","S3","S10","S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7dcf08595859","kind":"historical","anchor":"**Read the marriage rules by date.** From 1 January 1889 [S8], the 1888 rules required every couple, whatever their religion, to have their marriage entered within three days by the justice-of-the-peace clerk of their parish of residence, from the celebrant's certificate or statement [S7]. For a church marriage of 1889 or early 1890, search the civil books too. These rules replaced an earlier regulation of 25 April 1874, Decree 5.604 [S7], [S48]. They took effect across the Empire only on 1 January 1889 [S8], so do not take 1874 as the start either. Decree 521 of 26 June 1890 then removed the couple's choice to hold the church ceremony before or after the civil one [S12], [S49]. Under it, the civil marriage was always to come first [S49]. A minister who held the religious ceremony before it faced six months in prison and a fine [S49]. The decree took effect in each jurisdiction three days after the local judge published it [S49], so the date varies by place.","sources":["S8","S7","S48","S12","S49"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a19a738b1733","kind":"method","anchor":"- **Extend the search by registration year.** Start with the five years after birth. Widen the search by ten to twenty years where siblings or later documents suggest a delay [S13]. Some births may have gone unregistered [S14].\n- **Check the 1930s books.** Decree 19.710 of 18 February 1931 waived fines through 31 December 1932 [S15]. Two sisters born in 1922 and 1923 appeared together in the 1933 registrations [S16]. Search beyond the decree’s deadline and establish the legal basis of a later entry from its own papers.\n- **Keep the registration date and the stated birth date in separate fields.** Under the 1888 rules a late declaration needed an order from the justice of the peace and carried a fine [S7].\n- **Trace a court-ordered entry to the petition.** A modern registration for a woman born in 1843 drew on documents her descendant submitted [S17]. Record the judicial act under its own date. Cite and assess the underlying documents separately when using them to establish the birth.","sources":["S13","S14","S15","S16","S7","S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cb72e357bf1b","kind":"method","anchor":"- **For grandparents, use the civil birth.** The 1888 rules called for legitimacy or foundling status, the parents’ names, birthplaces, occupation and residence, their marriage parish, and both sets of grandparents. The rules also allowed a parent’s name to be omitted where naming that parent would cause scandal [S7]. Copy the actual fields before extending either generation [S13], [S18].\n- **Use the youngest sibling.** If older siblings’ baptisms omit grandparents, check civil births of siblings born from 1 January 1889. Compare both sides of the family across the surviving entries, including any blank fields [S7], [S19].\n- **For an adult's parents, use the civil death.** The 1888 rules required the death entry to name the deceased's parents, the surviving spouse, and the legitimate or recognised children with their ages [S7]. One presenter finds that a Catholic burial of a married adult usually names only the spouse [S14].\n- **Do not take a baptism as the adult's full name.** Brazilian baptisms usually give only the child's given name, then the parents [S20], [S14]. Pair a baptism with the person's marriage or death entry before you use it to identify an adult.\n- **Transcribe the baptismal status.** Keep *legítimo*, *natural* and *exposto em casa de …* as written. The last phrase identifies the house where a foundling was left [S20]. Search the named household’s probate papers. Children recorded at the door of Padre Manuel Inácio de Castro’s farm or at another household also appeared as godchildren in his 1819 will. The researcher used the will together with court proceedings and population lists to reconstruct their parentage [S21]. The 1888 civil rules also sent a foundling’s belongings to the orphans’ judge, giving a further court to search [S7].\n- **After 24 May 1890, read \"natural\" in a civil entry as a possible church-only marriage.** A church marriage then had no civil effect [S12]. Search the church marriage before you call the parents unmarried. A later margin note (averbação) can record the parents' civil marriage and the child's changed status [S16].\n- **Compare church and civil entries for immigrants.** A priest who shared the family's language could write a name more accurately than the civil clerk [S16]. Take the name form from the baptism and the civil entry separately, and keep both in the name register.","sources":["S7","S13","S18","S19","S14","S20","S21","S12","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fb00012ef09a","kind":"method","anchor":"- **Browse the images; do not trust the index.** Brazilian indexes are usually ordered by the child's or the groom's given name. The number in an index can be a page or an entry: \"L\" is the book, \"fl.\" or \"fls.\" the folio, and \"v\" the back of the folio (verso) [S1]. Civil books often have a name index at the start or end of the volume [S22].\n- **Follow the date gap back to the parish.** In the Pombal, Paraíba, search documented in 2024, the filmed marriages ended in 1900 and the deaths in 1889. The parish located the marriage sought for 1904–1906 in its own books [S23]. Give the parish the missing interval and identify which volumes you already checked.\n- **Look for the same register in a larger image set.** A 106-page São Paulo parish book omitted a marriage found in a 792-image set combining several volumes. For Patu, Rio Grande do Norte, the same demonstration found images under the locality when the catalog search had returned none [S24]. Check the title leaf and actual entries against the advertised dates. One volume held an 1889 birth before its listed range. Browse mixed books (*livros mistos*) for marriage investigations [S25].\n- **Match the certificate to its intended use.** A filmed entry predates any marginal note added later. Check the receiving authority’s requirements before you order a recent second original (segunda via). The São Paulo Italian consulate’s December 2023 document list specified Brazilian certificates in full-text form (*inteiro teor*), with apostille and apostilled sworn translation [S26].","sources":["S1","S22","S23","S24","S25","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d3794eea5a09","kind":"unclassified","anchor":"- **Expect regional losses and gaps.** In the Northeast, parish books mostly reach back only to about 1800. One presenter reports that Dutch-war losses left a single pre-war book for the old Diocese of Olinda [S6]. In Bezerros the parish began in 1768, but the marriage books start in 1782 and the early baptisms are badly damaged [S5].\n- **Ask the diocese as well as FamilySearch.** Many Pernambuco books were gathered at the archdiocesan curia in Recife, and some FamilySearch films of them are poor black-and-white images or are not online [S6]. Books digitised later with a diocese's permission can be viewable only at the diocese [S5].\n- **For a colonial-era event, ask for every status-specific book of the parish.** Colonial parishes kept separate books by legal status [S30], and a São Paulo parish listing shows a separate 1768–1826 book of enslaved people's marriages [S24]. Search the books for free and for enslaved people for the same years before you call an entry missing.\n- **Search Protestant registers separately.** German-speaking Evangelical and Lutheran congregations kept their own registers, in German until the late 1930s. These can name the home district or village where civil and Catholic entries give only \"Alemanha\" or a German state. Search both churches when a conversion or a mixed marriage is possible [S22].","sources":["S6","S5","S30","S24","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-69de36056cd2","kind":"unclassified","anchor":"Look in each series for a dated document that ties a couple to one more relative. One presenter builds families only from such dated \"couple plus one\" documents, because undated reconstructions collapse under same-named people [S6]. Mark each series searched, found or not found.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5e75b9c9a40c","kind":"method","anchor":"- **Probate inventories and wills (inventários, testamentos).**\n  - Search the *Juízo de Órfãos* with jurisdiction on the death date. The 1883 inventory of a couple from Sítio Parelhas names the orphans’ court of Jardim in its heading [S31]. Use the court’s historical place name to locate the file.\n  - Trace the inventory from the court to its archive, university, museum or private custodian. Establish who holds the file and what permission the custodian requires before requesting a copy [S31], [S23], [S32].\n  - Read the whole file. A creditor entry can carry filiation [S31]. Court files can preserve priest-issued copies of baptisms from books that are now lost [S33].\n  - Search several years after the death: one presenter has seen an inventory opened ten years later [S32].\n  - The court and notarial papers of São João do Cariri, Mamanguape and João Pessoa, Paraíba (2,020 items, 1778–1918), were digitised under the British Library's Endangered Archives Programme as EAP853 [S34].\n- **Church marriage files.** Search parish banns (*banhos*, *proclamas*) and episcopal dispensations. Bogaciovas recorded both together under *dispensas matrimoniais* at São Paulo’s archdiocesan archive [S35]. Browse the year and then the groom’s name in the series shown in the São Paulo demonstration [S36]. A Mariana dispensation can name three generations and identify a kinship impediment [S21]. For reading the impediment, use the Catholic holdings recipe.\n- **Civil marriage application and banns.** Under the 1890 decree the couple supplied proof of age or a substitute, their own and their parents’ status and residence (or where deceased parents died), and statements from two witnesses. The registrar entered the banns in a separate book [S12]. Ask the registry for the application file (processo de habilitação de casamento) and the banns notices (*editais de proclamas*). Even if the file lacks a birth certificate, read any declaration made or signed on a parent’s behalf. Rosa’s application named her Italian baptismal town and identified her father in just such a declaration [S37]. Compare its details with the marriage entry [S4].","sources":["S31","S23","S32","S33","S34","S35","S36","S21","S12","S37","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b82f2253ea67","kind":"unclassified","anchor":"- **Do not apply a fixed surname rule.** Brazil never had a standard way of forming surnames. Daughters often took the mother's surname and sons the father's [S42]. Siblings could carry very different surnames, and people changed surnames during their lives [S43], [S41].\n- **Search by given name and parents.** Given names were more stable than surnames [S43]. Search the given name with the parents' given names and the place, then each surname alone. In indexes, search with one surname [S1].\n- **Allow for a married woman's chosen name.** A civil marriage entry can state the name the bride will use [S1].\n- **Allow for immigrant patterns.** Immigrant families often gave sons only the father's surname [S42]. A father's given name could become the family's recorded surname when officials misread the order on a foreign document [S37].","sources":["S42","S43","S41","S1","S37"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8770d3e51c76","kind":"unclassified","anchor":"- **Cite the archive law in the written request for a church register before 1917.** Law 8.159/1991 (art. 16) identifies civil-status registers in religious archives made before the Civil Code took effect (1 January 1917) as of public and social interest [S44], [S45]. Quote art. 16 in the request, and record the custodian's answer.\n- **Record fees and image limits as access states.** A diocese can charge far more than a registry office for the same death entry [S45], and some diocesan agreements bar sharing images [S5].\n- **Log every refusal** with the custodian, the rule given and the date. A refused inspection is not a search result.","sources":["S44","S45","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-59c387a3c56d","kind":"unclassified","anchor":"- **Jurisdiction rows:** the place as written; its district, municipality and state on the event date; each parent municipality with its law and date; the parish, its mother parish and the diocese.\n- **Register decision:** parish, civil or both for each event, with the reason (1 January 1889, 24 May 1890, religion).\n- **Holdings rows:** custodian, series, years, locator (book, folio, entry, film or image number), level inspected (index, image, parish transcription, cartório certificate) and result.\n- **Late-registration rows:** registration date, stated birth date, and the basis (amnesty, court order).\n- **Substitute-series rows:** inventories, wills, marriage files, voter lists, land registers, household lists and deeds, each marked searched, found or not found.\n- **Name register:** every name form, by record.\n- **Access states:** refusals, restricted certificates, court petitions, and images viewable only on site.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-44969e83c6be","kind":"custody","anchor":"- **Choose the certificate form.** Under the CNJ rules, a short-form certificate (*breve relato*) generally requires no written application or identification. For a full text, sign a written request giving your identity, purpose, relationship if any, and whether the registered person has died. Death certificates in any form require neither an application nor judicial authorisation (arts. 113–118) [S47 @2026-11-19].\n- **Check which birth fields can be disclosed.** Article 6 of Law 8.560/1992 excludes the parents’ civil status, the nature of filiation and the place and registry of their marriage. It expressly provides for a reasoned judicial authorisation or requisition for the full text. Order the full text for those fields only under the applicable access rules [S28 @2026-11-19], [S47 @2026-11-19].\n- **Record any restriction and its basis.** CNJ art. 114 distinguishes the registered person, legal representative or specially empowered agent from a third party seeking sensitive data. It provides for direct-line relatives after the holder’s death. Art. 119 addresses the deceased person’s sensitive data under the data-protection law. Check separate restrictions on filiation and adoption under arts. 116–117 before relying on either exception [S47 @2026-11-19], [S28 @2026-11-19]. For older records, distinguish a legitimation annotation from the archived order for adoptive legitimation, which the 1973 law addressed separately [S27 @2026-11-19].","sources":["S47","S28","S27"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b7890f10b082","kind":"platform-ui","anchor":"- **Order through the official portal.** Arpen-SP’s instructions for registrocivil.org.br list electronic delivery, post and registry pickup [S29 @2026-11-19]. Supply the book and folio if known. For an image of the entry, specify *inteiro teor com cópia reprográfica* [S18 @2026-11-19].","sources":["S29","S18"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d44267e3c12f","kind":"method","anchor":"- **Record a parish \"certidão de inteiro teor\" as a transcription.** Parishes issue signed and stamped transcriptions of baptisms and marriages, sometimes from a transcription the requester supplies [S20], [S23]. Log it as a derivative of the book entry, with the issuing parish and the date.","sources":["S20","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-011f3148105a","kind":"custody","anchor":"- **Certificates of supporting papers.** CNJ art. 120 permits a certificate of a generally and unrestrictedly public document. For other supporting papers, check whether the interested party, document holder, legal representative, specially empowered agent or a requester with judicial authorisation may obtain a certificate. After the holder’s death, a requester can present the death certificate [S47 @2026-11-19].","sources":["S47"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ff576db5c8e0","kind":"method","anchor":"- **Voter lists.** From 1875 the parish boards’ voter lists had to give each qualified voter’s age, marital status, occupation, literacy, filiation, domicile and income [S38]. Look for them in town halls and municipal archives [S23].\n- **The vicar's land register (registro do vigário).** Under Decree 1.318 of 1854 the vicar of each parish registered land declarations: the possessor, the parish, the place name, the extent and the boundaries. The loose copies stayed in the parish archive, and the books went to the provincial land office [S39]. Use it as a dated list of who held land where in the 1850s. Treat a declaration that names an inheritance as a kinship lead.\n- **Household lists.** Use the names, ages, colour and birthplace in São Paulo’s *maços de população* (1765–1836). FAPESP illustrates the 1765 volume from the Arquivo Público do Estado de São Paulo [S40]. In Minas Gerais, compare the 1795 parish confession roll with the 1831 and 1838 nominal lists. The confession roll omitted children under seven. Use baptisms and the nominal lists to test whether a missing child belonged to the household [S41].\n- **Notarial deed books (livros de notas).** A sale, dowry, donation or settlement often states how a property came by inheritance, which can name a spouse's parent [S6].\n- **Published local histories and family books.** Use them for leads and for the folios they cite, then confirm each link in a primary record.","sources":["S38","S23","S39","S40","S41","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
