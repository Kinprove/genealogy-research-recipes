claims:
  - {"id":"C-1adb9ec20c35","kind":"custody","anchor":"Start with Fond 101, Ніжинський грецький магістрат (Нежинский греческий магистрат), at the State Archives of Chernihiv Region. Use the annotated register to distinguish Inventory 1, which holds the magistrate’s main records, from Inventory 2, the Melas merchant papers. [S1 @2026-11-22], [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7c4dbd965cc2","kind":"method","anchor":"Use Inventory 1’s subject divisions before narrowing by year. Start with registration, passports and community admission for membership, naturalization or travel. Use the property-protection and court files for disputes, and the poor-relief and financial files for benefits. Look for merchant lists and capital declarations separately from petitions to join the Brotherhood. Check the inventory against the cover and the contents, and verify access to images or microfilm for the particular file. [S2], [S3], [S4]","sources":["S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b9d5e655d0ea","kind":"historical","anchor":"For pre-magistrate leads, check the Brotherhood material included in Fond 101. Inventory 1, file 2209 is the 4 April 1685 land sale. File 4273 contains Greek-language court and accounting material dated 1695–1773. For first-half-eighteenth-century leads, start with file 1 for relations with imperial institutions, 3412–3414 for religious affairs and the Greek-designated files 4225, 4276, 4283 and 4285а. [S2], [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a9245a0a60ce","kind":"historical","anchor":"Check the document language within files 4225–4332 even when the inventory groups them as Greek. Inventory 1, file 4331 is a Russian-language counterexample. On Greek covers, read Δουλεία του … με τον … as a case between the people named and preserve former numbers and registration marks as separate locators. [S2], [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c025b6705d8e","kind":"method","anchor":"Search by parties, subject and year after a legacy number misses. Match the cover and any earlier number to the new locator before treating it as the same file. For business dated 1831–1840, also check the historical inventory in Fond 101, Inventory 1, file 823. Record an old title as evidence of the listing. If it says залишок (remainder), look in the title for the receiving court and trace that court’s copy or continuation. [S2], [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-34cf24ad3225","kind":"historical","anchor":"For a case that crossed the magistrate’s closure, check the 1862 proposal in Inventory 1, file 970 for the contemplated transfer to the district court and the request to retain passport and guardianship functions. Look for the actual order, transfer list or receiving docket before assigning successor custody. [S2], [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000afaf58533","kind":"method","anchor":"Search investigative files for bills, broken agreements, insults and thefts. Search contested files for property division and uncontested files for passports, attestations and discharge. Try each party as plaintiff and defendant. Use social status, debt amount and subject to resolve titles, and include outsiders such as visiting Greeks and merchants from other cities. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5e6613ed0b83","kind":"method","anchor":"Build a case sequence from complaint and summons through bills, receipts, testimony, any later reports or appeals, final ruling and written assent. If the case is missing, take the entry number, description, receipt date and forwarding date from the incoming-document register. Then find the formal decision under постанови or определения. Record its account of the pleadings, legal extracts and testimony as summaries within the decision. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dfab8d5a5d25","kind":"historical","anchor":"Check each journal’s year and month before using silence. For the early orders-and-decisions journals, Hedo identifies 1801, 1823, 1824, 1844 and 1849 as gaps. For the monthly form from 1865, compare the month against the holdings. Search individual cases for the occasional surviving Greek community minute. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-27a182ea5fe8","kind":"method","anchor":"Use the centered date or opening protocol for the sitting date, and capture the start time and the attendees’ names, patronymics and offices when given. Separate each item at слухали (heard) and ухвалили or наказали (decided or ordered). In a tabular protocol, look in the fourth column for signing and dispatch. In the journal, distinguish decrees conveyed for information from those sent for execution, check signatures, and look beyond the decrees for private petitions and money tendered on protested bills. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-30af2cdbb9ff","kind":"method","anchor":"Search the passport application and the issue register separately. Authorization is evidence of permission to travel. For 1839, start with Inventory 1, files 1745 (applications) and 1746 (issues). Record the authorized term and destination as written, then seek evidence of travel or arrival. Distinguish a magistrate-issued passport, ticket or attestation from a declaration or power of attorney submitted by a community member. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0b58aef9c2c5","kind":"method","anchor":"Search both for travel to a city and for journeys through it. Read the stated purpose and disposition of the petition, including refusals. When a traveler lacks an individual entry, check family and group applications and a merchant’s attached list for clerks or servants. The April 1739 list cited by Hedo is in Fond 59, Inventory 1, file 699, folio 17. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2e3a2918fef7","kind":"method","anchor":"Follow merchants into protested-bill, power-of-attorney and price registers and related trade or building files. In trade-permission papers, record the fee for the certificate and the fee for its білет (ticket) separately. In receipt-and-expenditure books, read the case title for the levy and trace accumulated communal funds through the annual statements to the Chernihiv Treasury Chamber. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7a7f2c4a48a6","kind":"historical","anchor":"Check the stated coverage before inferring anything from a missing payment. Hedo identifies 1809–1848 for the financial books discussed and 1819–1841 for contribution-payment entries. Use партикулярні суми in the described accounts as an estate-sale lead, then look for the underlying receipt or estate papers. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b79a56b01f33","kind":"method","anchor":"Check Inventory 1, files 3535–3563 for one-time aid following marriage, bereavement, a move to Nizhyn or an accident, and for recurring relief to widows and orphans. Read the reason for any refusal before making an inference about membership or means. Search school, hospital and poor-relief papers in parallel. Use Inventory 1, file 970 for donated-capital allocations and file 3874, folios 2 verso–4, for the planned 1860 budget. Find a disbursement or individual case before assigning any budgeted benefit to a person. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
