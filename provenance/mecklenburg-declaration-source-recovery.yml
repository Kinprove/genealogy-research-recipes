claims:
  - {"id":"C-01","kind":"method","anchor":"For a Series GG lead, take the name and locator from Craig L. Heath’s indexed transcription, then compare the passage with the corresponding Draper manuscript image. Copy the series, volume and page from the manuscript. Use the Wisconsin Historical Society series list and the microfilm guide to find the right reel. Check FF or HH when the reference points to Draper’s separate treatment or miscellanies. This uses the presentation’s finding-aid suggestion (only transcript excerpts read). [S1], [S2], [S3], [S4]","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Start a separate row for Graham’s 1895 paper and the enlarged 1905 book. To trace his earlier argument, look for the proceedings of the Scotch-Irish Society of America meeting at Lexington on 21 June 1895. Check the corresponding Draper item for wording or interviews that Graham reused. For an exact quotation, inspect the Davie copy and check Graham’s discussion of verbal variants before taking a printed reading as definitive. [S2], [S5], [S6]","sources":["S2","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Use the biographical sketches and witness accounts to identify a candidate’s claimed role and each informant. Copy the date of the event and the date each witness gave the account into separate fields. Distinguish the claims about 20 May from the text of the 31 May Resolves as transmitted in the contemporary press. Several publications that depend on one witness statement count as one evidentiary line. Use [evidence and proof judgment](evidence-proof-judgment.md) before assigning a role to the person. [S2], [S5], [S6]","sources":["S2","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
