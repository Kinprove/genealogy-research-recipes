claims:
  - {"id":"C1","kind":"platform-ui","anchor":"Run the institution’s name in the actor search (*toimijahaku*) and the document or series term separately in the material search (*aineistohaku*). Once the creator is identified, try it as a restriction on the material search and apply the date range. After a material-search miss, search for the creator separately. [S2 @2026-11-22].","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C2","kind":"platform-ui","anchor":"Open each plausible same-name actor card and inspect the linked material, including results farther down the list. Match the record group by creator, title and dates before following the hierarchy to series and unit [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C3","kind":"example","anchor":"In Kaisa Kyläkoski’s January 2023 lookup, two cards headed *Ilmatieteen laitos* led to maps, while *Ilmatieteen laitos (1918)* led to the target archive. Recheck the linked material in your own Astia session [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C4","kind":"method","anchor":"According to the author’s Turku example, compare the exact chapter name with every plausible result [S5†].","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C5","kind":"portal-availability","anchor":"Use the official *Turun tuomiokapituli* guide to cross-check the fonds title and follow its Astia link [S6 @2026-11-22].","sources":["S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C6","kind":"portal-availability","anchor":"When the combined search misses, search Finna or the web for the institution plus its archive name. Use the host archive, fonds title and dates from the result to resume the Astia search. For the Finnish Meteorological Institute case, match Finna’s *Ilmatieteen laitoksen arkisto (1880–1938)* to the target title and years in Astia [S1 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C7","kind":"method","anchor":"If the online hierarchy lacks the cited record series, check for a separately described archival catalogue and keep the target unresolved until its coverage has been checked [S1], [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
