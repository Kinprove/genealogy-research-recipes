sources:
  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/?p=5459317"],"published":"2024-02-23","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s advice to share extracts and arrange repository deposit, her example of a documented parent-child link, and her University of Virginia lead.","entry_sha256":"957482551c3f5d4ed17a4f7b7c474b834788c37bf65c12041db69c73dee35568","claims":["C-01","C-02","C-03","C-04","C-06"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://beyondkin.org/tell-world-enslaved-populations-researching/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The directory accepts the names of researched enslavers or institutions to connect research on their enslaved populations.","entry_sha256":"57748fab660d6b93738453310351d93cf615acd38a3cec9b6dbcba9f2304ac1d","claims":["C-01"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://academic-outreach.provost.virginia.edu/gibbons-project"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The university describes the descendant outreach research and work identifying people enslaved at UVA and associated properties.","entry_sha256":"fd884b2b43ae903d50fbf62cf35c7759ef338d6992d15fb643ce2a632dcd164f","claims":["C-05"],"review":"reviewed"}
  - {"id":"S4","kind":"video","urls":["https://www.youtube.com/watch?v=e4dzU-MkQNA"],"published":"2024-05-06","retrieved":"2026-11-21","access":"partial","rights":null,"basis":"Read the supplied transcript excerpts 2026-11-21. Fulton suggests sharing existing family materials, using the questionnaire for remembered family history, offering scans of privately held originals, and contributing estate records that identify the enslaving household and give ages and gender without names. The online video transcript was unavailable. The current forms and submission labels were checked separately.","entry_sha256":"cd0e0abc397f3c8351b4bc67be3fc8561e16234d2bcd9d5dfb5e56a83a797a09","claims":["C-07"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://10millionnames.org/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The “Share Names of Enslaved People” tile leads by “Read More” to the project’s submission portal.","entry_sha256":"c2107fe84239d58def4c4ce4cd04fa9893e22fc82045088688290b2376a48048","claims":["C-08"],"review":"reviewed"}
  - {"id":"S6","kind":"help-page","urls":["https://nehgsweb.atlassian.net/servicedesk/customer/portal/5"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The project’s intake lists separate forms for family trees in GEDCOM format, oral histories, family notes or genealogies, and family records from religious texts, as well as the questionnaire and general contribution form.","entry_sha256":"78f82e5f2730947f49c554fdecd3969acf430326dfd8f5d8a0fc515878b6cdac","claims":["C-08","C-09"],"review":"reviewed"}
  - {"id":"S7","kind":"help-page","urls":["https://nehgsweb.atlassian.net/servicedesk/customer/portal/5/group/5/create/31"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The form limits family names to people known to be deceased and asks for a question mark on uncertain names or places.","entry_sha256":"e79e82874bdf4d944e364610211739ba03bdd75223143c50c6f853da15f195c2","claims":["C-10"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://newsroom.churchofjesuschrist.org/article/rootstech-help-recover-names-of-enslaved-africans-10-million-names-project"],"published":"2024-03-07","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Church News coverage of Fulton’s RootsTech remarks describes contributing archival-quality scans while retaining physical items.","entry_sha256":"52aa1e78525d383262bb4beaeba90e890a9e0fdb355c256d2e4c663a87808622","claims":["C-11"],"review":"reviewed"}
  - {"id":"S9","kind":"help-page","urls":["https://nehgsweb.atlassian.net/servicedesk/customer/portal/5/group/5/create/26"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The form accepts digital images of the records and describes a Grant of Permissions for making donated copies available to researchers. It links to examples in the Digital Library and Archive.","entry_sha256":"4538821a14ed64235784047be03752b048407a161b33c3f8d757a0449c804412","claims":["C-11"],"review":"reviewed"}
  - {"id":"S10","kind":"help-page","urls":["https://nehgsweb.atlassian.net/servicedesk/customer/portal/5/group/5/create/40"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The form accepts contributions outside the listed categories and provides a description field and optional attachment. It leaves decisions about indexing and publication unspecified.","entry_sha256":"9e92cccca0b1f7cda60247cd2146d15fbd678c29ffa7c9deb961808c4b032aa0","claims":["C-11","C-12"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"portal-availability","anchor":"**Scope.** The community author suggests sharing names and details with genealogy groups or societies tied to the document’s place. The Beyond Kin directory takes the researched enslaver or institution as its entry point. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Publish the source-cited historical extract through a genealogy society or descendant research group that covers the document’s locality. Put the enslaved people’s names in the searchable text, along with the record type, date, place and locator. Read the receiving project’s collection scope before preparing a submission. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Arrange deposit of the original or a permitted copy with an archive, library or museum collecting records for the locality. For a privately shown document, obtain the holder’s permission to copy and deposit it. Keep the recipient and the accession or collection reference with the extract. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"The author suggests routing records about the construction of the University of Virginia to the research on enslaved laborers there. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"custody","anchor":"Send a concise record lead to the Gibbons Project’s descendant outreach contact when the document connects people enslaved by the family to labor at the University of Virginia. Identify the record and its locator in the first message. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Publish a documented parent-child link in the online tree with the evidence for parentage and the recorded condition of enslavement. Describe the documented relationship between the enslaver and the enslaved parent without implying a consensual union. Keep tentative links in private research notes. In one published example, a tree note described the father as the enslaver of the child’s mother. Cite the records for each relationship and distinguish what each record actually says. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Lindsay Fulton’s advice from the available excerpt of the May 2024 interview includes sharing family materials, remembered family history and estate records that describe enslaved people without naming them. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"platform-ui","anchor":"On the 10 Million Names homepage, select “Read More” under “Share Names of Enslaved People” to open “Help 10 Million Names Research.” [S5 @2026-11-21], [S6 @2026-11-21]","sources":["S5","S6"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"Submit existing family material through the form for the matching category: GEDCOM, oral history, family notes or genealogy, or family records from a religious text such as a Bible. [S6 @2026-11-21]","sources":["S6"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"platform-ui","anchor":"Use the family history questionnaire when the user has relevant family knowledge and no tree, notes or image to share. Enter family members’ names only if they are known to be deceased. Mark uncertain names or places with a question mark. [S7 @2026-11-21]","sources":["S7"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"portal-availability","anchor":"Submit a high-quality scan of the record when the family wants to keep the original. Use the form for family records from a religious text when it fits, and “I have something else to contribute” for other scans. Confirm the permissions and intended access before sending. [S8 @2026-11-21], [S9 @2026-11-21], [S10 @2026-11-21]","sources":["S8","S9","S10"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"portal-availability","anchor":"Submit an estate record that lists enslaved people only by age and gender through “I have something else to contribute.” Give the enslaving household’s name, the recorded descriptions and the record locator. Treat those descriptions as leads for identification. [S10 @2026-11-21]","sources":["S10"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
