sources:
  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/?p=5459317"],"published":"2024-02-23","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s advice to share extracts and arrange repository deposit, her example of a documented parent-child link, and her University of Virginia lead.","entry_sha256":"957482551c3f5d4ed17a4f7b7c474b834788c37bf65c12041db69c73dee35568","claims":["C-01","C-02","C-03","C-04","C-06"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://beyondkin.org/tell-world-enslaved-populations-researching/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The directory accepts the names of researched enslavers or institutions to connect research on their enslaved populations.","entry_sha256":"57748fab660d6b93738453310351d93cf615acd38a3cec9b6dbcba9f2304ac1d","claims":["C-01"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://academic-outreach.provost.virginia.edu/gibbons-project"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. The university describes the descendant outreach research and work identifying people enslaved at UVA and associated properties.","entry_sha256":"fd884b2b43ae903d50fbf62cf35c7759ef338d6992d15fb643ce2a632dcd164f","claims":["C-05"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"portal-availability","anchor":"**Scope.** The community author suggests sharing names and details with genealogy groups or societies tied to the document’s place. The Beyond Kin directory takes the researched enslaver or institution as its entry point. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Publish the source-cited historical extract through a genealogy society or descendant research group that covers the document’s locality. Put the enslaved people’s names in the searchable text, along with the record type, date, place and locator. Read the receiving project’s collection scope before preparing a submission. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Arrange deposit of the original or a permitted copy with an archive, library or museum collecting records for the locality. For a privately shown document, obtain the holder’s permission to copy and deposit it. Keep the recipient and the accession or collection reference with the extract. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"The author suggests routing records about the construction of the University of Virginia to the research on enslaved laborers there. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"custody","anchor":"Send a concise record lead to the Gibbons Project’s descendant outreach contact when the document connects people enslaved by the family to labor at the University of Virginia. Identify the record and its locator in the first message. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Publish a documented parent-child link in the online tree with the evidence for parentage and the recorded condition of enslavement. Describe the documented relationship between the enslaver and the enslaved parent without implying a consensual union. Keep tentative links in private research notes. The author used a public tree note to document a relationship in her own family. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
