claims:
  - {"id":"C-b3c3c05b1035","kind":"method","anchor":"Record the old URL, page title and resource or society name. Check whether the old address still opens, then search the title and sponsoring society or project independently. For an index or transcription, compare the new host’s title, compiler, locality and coverage so a similarly named resource does not replace the one cited. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a6d33443d192","kind":"platform-ui","anchor":"Paste the old public RootsWeb URL into the Wayback Machine and compare captures near the date the researcher cited. Keep the original address and capture date in your citation. A missing web capture leaves the former page’s existence and contents open. [S1 @2026-11-21] [S2 @2026-11-21]","sources":["S1","S2"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-025d758cf0a6","kind":"method","anchor":"For an accessible RootsWeb Wiki guide, record the original reference and publication date. Check its record or custody lead against the present custodian. Save a local reference to a surviving page and its capture or access date so you can find it again. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
