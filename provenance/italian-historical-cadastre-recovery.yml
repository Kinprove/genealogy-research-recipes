claims:
  - {"id":"C-choose-the-cadastre-by-place-and-period-1","kind":"custody","anchor":"Use the relevant State Archive’s guide to identify the cadastre and the dates it covers for that comune. Check the Teresian series in Austrian Lombardy, the Napoleonic or other predecessor cadastres where they applied, the Gregorian series in former Papal territory and the later Italian cadastre. Check which series has maps and which has only descriptions. In Latina, earlier Gregorian maps could be reused by the Italian cadastre, so match the date and series on the register and the map before joining them. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S1","S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-link-a-named-holder-or-parcel-to-the-map-2","kind":"method","anchor":"From a name, use the holder’s index or matricola for that series, then follow the account or partita to the listed properties. From a known location, use the correct cadastral map and its parcel number in the corresponding parcel book. Record map sheet, parcel number, place, type of property, assessed yield where given, and the literal holder name. Match the number on the map and in the book before locating the house or field. [S1] [S2] [S3] [S4] [S5]","sources":["S1","S2","S3","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-the-parcel-across-transfers-3","kind":"method","anchor":"Trace the parcel through the volture, trasporti or successor account. Follow changes in map sheet, parcel, ownership shares or parcel subdivisions. Preserve the cadastral change date and any separately recorded instrument date. Use the notary and act reference where stated to retrieve the instrument and determine whether the transfer was by sale, inheritance or another mechanism. [S1] [S3] [S5]","sources":["S1","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-the-parcel-across-transfers-4","kind":"method","anchor":"To decide whether a documented occupier owned or rented, compare separately dated evidence of occupation with the recorded holder, the underlying deed or a lease. A missing holder entry leaves tenure open. Use verified tenure and the recorded assessment as separate clues when describing economic circumstances. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
