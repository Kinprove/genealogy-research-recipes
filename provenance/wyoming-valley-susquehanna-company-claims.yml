claims:
  - {"id":"C-7b5721ed0b02","kind":"historical","anchor":"According to the presenter, search Connecticut’s Westmoreland County and Pennsylvania’s Northumberland County as separate jurisdictions when each fits the date and place [S1†]. Keep company shareholding, documented settlement and Pennsylvania title as three separate findings. Record the authority on each original document before linking tract descriptions. [S2] [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3016d5b8f715","kind":"method","anchor":"Start in Munger’s volume I, *Proprietors*, for shares and conveyances. Copy the parties, share or tract, residence, and execution and recording dates. Move to volume II, *Settlers*, for evidence of presence, even if volume I has no hit. Record the date, place and character of each underlying list. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-28e9b02af920","kind":"custody","anchor":"Use Munger’s volume III, *Claimants*, to trace a lot in a certified township to a person who obtained Pennsylvania title. Check RG 17 claims and transfer records by township, division and lot. Follow each conveyance back to the earlier claimant or settler and look for an original assignment or deed before equating the final claimant with the first occupant. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
