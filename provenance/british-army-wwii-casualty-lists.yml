claims:
  - {"id":"C-001","kind":"portal-availability","anchor":"Follow MyHeritage’s collection announcement to *United Kingdom, British Army Casualty Lists, 1939–1947*. Start by searching the soldier’s name in MyHeritage and compare the returned army service number, regiment and rank with the service evidence you already have. Copy any casualty date, place and status as listed. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-002","kind":"portal-availability","anchor":"If the first site supplies only an index entry or misses the soldier, use the National Army Museum’s route to the British Army casualty lists at Findmypast and search by the soldier’s name or service number there. Use the War Office series `WO 417` for the original lists. [S2 @2026-11-22]","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-003","kind":"method","anchor":"Treat the first list entry as a report at that date. Repeat the search by service number and check later lists for a revised status. Open the page images where available and follow any reference to a previous list back to that page. Keep the date of the casualty separate from the date the list reported or revised it. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-004","kind":"method","anchor":"Record every matching entry with its list number, page, `WO 417` piece when given, date of issue, reported casualty date and status as stated. Preserve the earlier report when a later one revises it. Use a theatre entry as a theatre and leave a precise casualty location open unless the record supplies one. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
