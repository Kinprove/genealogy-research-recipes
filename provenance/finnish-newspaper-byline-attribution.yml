claims:
  - {"id":"C-a3133a378d93","kind":"portal-availability","anchor":"Use Translocalis for nineteenth-century local letters. Begin with the place named in the item, then open the corresponding issue from the National Library’s Digi collections to check the printed signature and date [S5 @2026-11-22].","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2211436a680f","kind":"method","anchor":"According to the community account, use the recollected season as an approximate locator and search surrounding issues and other titles for the exact masked signature [S1†]. Record the earliest item you can locate and attribute. According to a second account, leave the start of the writer’s contributions open when only the earliest located letter is known [S3†].","sources":["S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04e18a44975a","kind":"method","anchor":"According to the community account, check the final instalment of a serial for its signature and read the editor’s dated introduction for any explicit statement linking the initials or pen name to earlier contributions [S2†]. Compare the same signature across issues, including full signatures where available. Leave other users of the initials as candidates until the evidence distinguishes them.","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-551b63dd99c5","kind":"portal-availability","anchor":"According to the community account, look up the signature in Kallio’s *Fennica-kirjallisuuden salanimiä ja nimimerkkejä vuoteen 1885* and check the paper’s own memorial notices for an explicit link to the writer [S3† @2026-11-22]. Use the National Library’s catalogue to locate the bibliography and check the available access route [S6 @2026-11-22]. Treat an index miss as a gap in the lookup.","sources":["S3","S6"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-78f5a9b2a4c7","kind":"method","anchor":"According to the community account, an editor’s retrospective identification of a former correspondent can be checked against the dated parish migration entries of same-name candidates [S4†]. Record each signed article separately. An attribution supported for one article leaves other items signed with the same initials open.","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
