claims:
  - {"id":"C-789a8517266c","kind":"unclassified","anchor":"**Check the whole pile-up, not only the hypothesis group.** When matches from one target population cluster on a segment, look the segment up in a pile-up table. Then review every match on that interval, not only those that fit the hypothesis. Many unrelated matchers mixed on the same interval point to a pile-up artefact. A [pile-up region discussion](https://genarchivist.net/showthread.php?tid=558) shows most such chromosome 22 matches being discarded after this check. One poster reports that significant matches usually extended beyond the pile-up and triangulated; triangulation alone is not treated as sufficient (see above). The thread gives no cM threshold and does not establish that a group-level pile-up shows membership in that population.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c8dbda84115a","kind":"unclassified","anchor":"**Recompute the match total before trusting it.** A vendor's total cM can be mostly small segments. Take the match's full segment table from the chromosome browser and sum only the segments at or above a stated cutoff. Record whether X segments were excluded. Report three things side by side: the vendor total, the cutoff used and the filtered total. In an endogamous profile, a large drop marks a lower-priority lead. In [GeneaVlogger's walkthrough](https://www.youtube.com/watch?v=jusPVWoQFr0), totals above 100 cM fell below 40 cM. The filtered total is a triage aid, not a validated relationship estimate. The cutoff (the presenter uses 10 cM for Jewish endogamy) is a choice, not an established threshold.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b350ea5bdc2a","kind":"unclassified","anchor":"**Check an ancient or historical-sample match against tested parents.** These vendor matches usually rest on one small segment. Before reading one as inherited, record which parents or close relatives were compared and whether either parent shows the same sample match on that segment. If neither parent carries it, treat it as a probable pseudosegment, as a [historical-match discussion](https://genarchivist.net/showthread.php?tid=662) argues. If an unphased identity-by-state result can be rerun with a phased-haplotype tool, treat a segment that only the unphased method finds as suspect, as an [ancient-DNA matching comparison](https://genarchivist.net/showthread.php?tid=1285) reports. A segment a parent carries is still not evidence of descent from that sample (section 1). Neither thread gives a measured false-positive rate.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a8a6055ee99d","kind":"unclassified","anchor":"**Use a phased map to choose a match's side.** Suppose a match segment crosses a point where the tester's paternal copy recombines, but the maternal copy has no breakpoint there. Then treat the maternal side as the candidate (and the reverse case the paternal side), and keep inheritance through the other side's grandparents open where multiple ancestral paths are possible, until transmission evidence resolves the assignment. [GeneaVlogger's demonstration](https://www.youtube.com/watch?v=Spc5UugzRUo) motivates this step. Record it as an inference that depends on the phasing, not as an observation. It assumes the breakpoint is correctly placed and the segment is real. A pseudosegment (section 2) or imprecise coordinates near the breakpoint can mislead. The source gives no measured probability for two segments, one from each side, meeting at that point.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d086573578e","kind":"unclassified","anchor":"**A terminology trap to flag separately**: \"phasing\" a kit against a *mother's* kit (e.g. GEDmatch's Phasing tool, which produces a binary maternal/paternal composite from a child+parent pair) is a **different** mechanism from both sibling-based visual phasing and from Lazarus reconstruction (which rebuilds a *deceased ancestor's* genome from multiple tested descendants/relatives, not a parent-child binary split). None of these three assigns segments to all four distinct grandparents on its own — only sibling-based visual phasing does that, and even then naming which grandparent each segment group belongs to needs matches to cousins ([Bettinger, part 1](https://thegeneticgenealogist.com/2016/11/21/visual-phasing-an-example-part-1-of-5/)).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-524d69f5bcc0","kind":"unclassified","anchor":"A tested parent is still worth using, for a different reason. A direct comparison of each sibling with the mother is half-identical along its whole length, so by itself it marks no recombination point. Her kit does help resolve which allele each sibling received from her and which from the other parent, wherever the genotypes are informative; where mother and child are both heterozygous, the origin at that marker stays unresolved. Segments shared by full siblings mix both parents' sides unless the kits are phased ([DNA Painter FAQ](https://dnapainter.com/help/faq)), so phased kits let sibling comparisons be read separately for each side; [Perl](https://dnapainter.com/blog/common-segment-generator/) describes a \"turbo\" visual phasing with both parents tested. Her kit does not by itself say which sibling carries a given crossover, and it does not assign her segments to her own two parents: that needs further siblings or relatives such as cousins, an aunt or uncle, or a grandparent. A match who shares DNA with a sibling but not with the mother is not automatically on the other parent's side either; the match can be identical by chance ([Estes](https://dna-explained.com/2016/04/06/concepts-parental-phasing/); section 2). A model asked to \"phase\" a case should first establish which of these two different techniques is actually available (parent-child vs. 3+ siblings, optionally + an aunt/uncle/grandparent to fill gaps) before promising either binary-parent isolation or four-grandparent assignment.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8d480efc6fa6","kind":"unclassified","anchor":"**Do not check X sharing against autosomal sharing as a ratio.** A first cousin's X and autosomal amounts may look proportional to each chromosome set's length, but more distant matches need not: autosomal DNA from a given ancestor can drop out within a few generations, so a sizeable X segment beside little or no autosomal sharing is not by itself an inconsistency, nor is it evidence of a recent relationship. An [X-versus-autosomal proportion discussion](https://forum.molgen.org/index.php/topic,3315.0.html) motivates recording the two as separate observations. Neither direction validates the other: a relatively large X segment still needs the pair-sex and density checks in sections 2 and 5, and the thread gives no figures or threshold.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-28a23a14b9db","kind":"unclassified","anchor":"- **10 cM on a single segment** — the floor given in a [2026 FTDNA presentation](https://www.youtube.com/watch?v=EOMIlP8fvB4). FTDNA's current [X-Matches help](https://help.familytreedna.com/hc/en-us/articles/9134064538895-X-Matches) (edited 2026-01-06) publishes no minimum X cM. It says X cM do not count toward overall shared cM, and that a match appears only when it meets the autosomal minimum (X not counted), so an X match is only ever shown alongside a qualifying autosomal match.\n- **A ~2× X-to-autosomal equivalence** — the same FTDNA presentation states a 15 cM X segment is \"approximately equivalent in relevance\" to a 7.5 cM autosomal one. FTDNA's X-Matches help gives its own example: a 16 cM X block represents the same probable number of recombination events as a 7 cM block on another chromosome. Other sources describe the same relationship with a slightly different pairing (e.g. \"10–15 cM X ≈ roughly 7 cM autosomal\"). The exact ratio isn't pinned down across sources — only its direction (X needs materially more cM than autosomal for equivalent confidence) is consistent.\n- **15–20 cM as a safer interpretive floor**, per Family Locket — but scaled *up* to 20–30 cM specifically for **female-to-female** comparisons (highest pseudosegment risk), and treated as lower-risk even below that floor for male-to-male pairs (no pseudosegment mechanism possible at all).\n- **40 cM instead of 20 cM** — a separate FTDNA tutorial's rule of thumb for chromosome-browser visualization work: use twice the autosomal cutoff selected for that task.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8aaee1f10f67","kind":"platform-ui","anchor":"**Screen any small match against tested parents on the same interval.** When one or both parents tested at the same company, check each small match against them segment by segment, not by list membership. A parent who shares the same interval with the match makes that parent's side the candidate side for your segment, not an assignment. An unphased comparison does not show that the parent's matching copy is the one you inherited: the parent's hit can lie on the copy you did not receive while your overlapping hit comes from the other parent or is identical by chance. A false match of yours can also be one the parent shares (Bettinger, 2017-01-06 [N27 @2026-11-12]). FamilyTreeDNA's own parent buckets are built from phased blocks between relatives, not from shared-match lists (Dyer, Family Locket, 2021-08-07 [N25 @2026-11-12]). A match who appears on a parent's list through a different segment does not clear yours, although FamilyTreeDNA's 2025 Matrix article treats any appearance on a parent's list as descent (Rowe-Schurwanz, FamilyTreeDNA, 2025-02-13 [N24 @2026-11-12]). Start the documentary search on the candidate side, but record the side as assigned only after phasing against the parents or other transmission evidence places the segment there. A documentary link found only on the other side conflicts with the screen; resolve it with that evidence before you accept either side (Kennett, 2020-09-01 [N26 @2026-11-12]). With both parents tested, a small match that neither parent shares is probably false (see section 1's parent comparisons). Do not turn that into a delete rule: a parent's test can miss a real match, imputation or unread positions on either test can create or hide one, and in Estes's MyHeritage comparison two whole-genome matches of 47 and 49 cM matched neither parent (Bettinger, 2017-01-06 [N27 @2026-11-12]; Estes, 2026-02-19 [N28 @2026-11-12]). A segment a parent carries can still be false on the match's side (above).","sources":["N27","N25","N24","N26","N28"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
