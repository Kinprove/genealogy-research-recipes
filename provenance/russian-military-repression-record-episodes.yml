  - {"id":"H115","kind":"catalogue","urls":["https://rgaspi-site.dlibrary.org/ru/nodes/322-opis-4-lichnye-dela-komandnogo-sostava-partizanskih-otryadov"],"published":null,"retrieved":"2026-11-13","access":"read","rights":null,"basis":"read 2026-11-13","entry_sha256":"9a115407e6af88fffbfbcd6ed443090d7a11272ee31f06f6bd5b8c6503cf1b53","claims":["C-d14456c35e9d"],"review":"reviewed"}
