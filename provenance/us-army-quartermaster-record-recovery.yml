claims:
  - {"id":"C-guide-route","kind":"custody","anchor":"According to the presenter, use §92.1 of the Guide to Federal Records to identify the quartermaster office responsible for the activity [S1† @2026-11-20] [S2 @2026-11-20]. Record office or post, date range and whether the person was a contractor, employee or officer. Check the headquarters and field series separately [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-contract-route","kind":"custody","anchor":"According to the presenter, search the supply and accounting records by the date, place, goods or service and contractor name [S1† @2026-11-20]. Use the series descriptions for contracts, fiscal records and correspondence to find the transaction, and keep any supply order separate from a record of delivery or payment [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-facilities-personnel","kind":"custody","anchor":"According to the presenter, a hospital lead in these records should first be treated as a facilities question [S1† @2026-11-20]. Search the construction, repair or supply series by installation and dates. For an officer, use the separate personnel and correspondence series [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-outgoing","kind":"custody","anchor":"According to the presenter, check the main series of letters sent by the Office of the Quartermaster General on microfilm M745 [S1† @2026-11-20]. Use the calendar date and office to narrow the volume, and carry any recipient and subject into the correspondence search [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-claim-index","kind":"custody","anchor":"According to the presenter, start a possible quartermaster claim with microfilm M1999 [S1† @2026-11-20]. Locate the *Index to Quartermaster Claims, 1839–1894* in the National Archives Catalog. Copy the index’s register, claim and claimant references into the search for the corresponding register and case papers. A miss covers the index rather than all quartermaster transactions [S2 @2026-11-20] [S3 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S2","S3","S4"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
