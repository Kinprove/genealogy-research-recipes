claims:
  - {"id":"C-guide-route","kind":"custody","anchor":"According to the presenter, use §92.1 of the Guide to Federal Records to identify the quartermaster office responsible for the activity [S1† @2026-11-20] [S2 @2026-11-20]. Record office or post, date range and whether the person was a contractor, employee or officer. Check the headquarters and field series separately [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-contract-route","kind":"custody","anchor":"According to the presenter, search the supply and accounting records by the date, place, goods or service and contractor name [S1† @2026-11-20]. Use the series descriptions for contracts, fiscal records and correspondence to find the transaction, and keep any supply order separate from a record of delivery or payment [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-facilities-personnel","kind":"custody","anchor":"According to the presenter, a hospital lead in these records should first be treated as a facilities question [S1† @2026-11-20]. Search the construction, repair or supply series by installation and dates. For an officer, use the separate personnel and correspondence series [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-outgoing","kind":"custody","anchor":"According to the presenter, check the main series of letters sent by the Office of the Quartermaster General on microfilm M745 [S1† @2026-11-20]. Use the calendar date and office to narrow the volume, and carry any recipient and subject into the correspondence search [S2 @2026-11-20].","sources":["S1","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-claim-index","kind":"custody","anchor":"According to the presenter, start a possible quartermaster claim with microfilm M1999 [S1† @2026-11-20]. Locate the *Index to Quartermaster Claims, 1839–1894* in the National Archives Catalog. Copy the index’s register, claim and claimant references into the search for the corresponding register and case papers. A miss covers the index rather than all quartermaster transactions [S2 @2026-11-20] [S3 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S2","S3","S4"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-solicitation-award","kind":"custody","anchor":"According to the presenter, use a newspaper solicitation to start an award search with the goods, delivery point and bid deadline, when given [S5† @2026-11-21] [S6 @2026-11-21]. Search the military contracts and leases in the Second Comptroller’s Quartermaster Division, RG 217 (§217.4.5), using the likely contract year and, when known, the contractor’s surname. Check the general contract index for 1862–1889 and the registers of bonds, contracts and leases for 1817–1894. Verify the award before crediting a supplier [S7 @2026-11-21].","sources":["S5","S6","S7"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-treasury-contract-enclosures","kind":"custody","anchor":"According to the presenter, follow a Treasury contract into the Quartermaster General’s correspondence for the proposal and its enclosures [S5† @2026-11-21]. Carry the contractor, commodity, date and issuing office into RG 92’s supply correspondence (§92.4.1) and check the headquarters *Consolidated Correspondence File*, 1794–1890 (§92.3.1), when it covers the transaction [S2 @2026-11-21]. For a cloth bid, look for the specification and any sample requested with the proposal [S8 @2026-11-21].","sources":["S5","S2","S8"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-mexican-war-horse-claims","kind":"custody","anchor":"According to the presenter, check a Mexican War teamster’s possible horse claim by claimant surname [S9† @2026-11-21]. Use M1999 for RG 92, including its references to the register for claims chiefly relating to the Mexican War, 1847–1858 (NM 81, part I, entry 790). Keep both the register volume and claim number from the hit [S10 @2026-11-21]. Check the Treasury’s *Registers of Mexican War Horse Claims* (NAID 2662977) and *Abstracts of Mexican War Horse Claims* (NAID 2663104) separately in RG 217 [S11 @2026-11-21].","sources":["S9","S10","S11"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-heitman-officer-lookup","kind":"method","anchor":"According to the presenter, test an uncertain officer name in a Mexican War teamster record against Francis Heitman’s *Historical Register and Dictionary of the United States Army*, volume 1, part II [S12†]. Use the alphabetical officer list to compare possible surnames and the dates of their Quartermaster appointments with the service clue [S13].","sources":["S12","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-brevet-date","kind":"historical","anchor":"According to the presenter, read `bvt` as brevet and compare its date with the regular appointment date before ruling out a candidate [S12†] [S13]. Verify pay separately in a pay record [S14]. A wartime reference to Major Ebenezer S. Sibley fits his brevet of 23 February 1847, which preceded his appointment as major quartermaster on 22 December 1856 [S13].","sources":["S12","S13","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-mexican-expedition-supply-records","kind":"custody","anchor":"According to the presenter, check RG 92 for an expedition supply lead [S15† @2026-11-22]. Search entries 189 and 190 for supply correspondence, telegrams and related papers for a proposed expedition during the Mexican Revolution [S16 @2026-11-22]. For the 1916–1917 Mexican Punitive Expedition, check the indexed headquarters correspondence and the telegrams in RG 395 (§395.7.1) [S17 @2026-11-22].","sources":["S15","S16","S17"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
