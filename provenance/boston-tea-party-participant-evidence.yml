claims:
  - {"id":"C-participant-lists","kind":"method","anchor":"Start with the museum's participant profiles and their source notes. Follow the cited name to the account that places the person at the event. Record the account date and distinguish what the writer saw, what someone recalled later and what the compiler inferred. Participants concealed their identities. Leave a name missing from a compiled list open and search the underlying accounts [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-participant-role","kind":"method","anchor":"Identify the role each account supports. Distinguish attending a meeting, witnessing events, boarding a ship and dumping tea. Compare dates, associates and residence to the proposed ancestor. Later military service or a lineage-society entry is a lead. Use an event-specific source before recording participation [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
