sources:
  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/history/the-olympic-games-a-history-for-genealogists/"],"published":"2026-02-05","retrieved":"2026-11-18","access":"refused","rights":null,"basis":"Attempted to open the article at its publisher on 2026-11-18; the page returned HTTP 403. Used the supplied quotations and the search extract for the trial, library and archive leads. The independent entries establish the procedures.","entry_sha256":"93192568746996a61306bceaf855e1a6db2283ac3301501d5db38f3509b71a9e","claims":["C-01","C-03","C-05"],"review":"reviewed"}
  - {"id":"S2","kind":"pdf","urls":["https://tile.loc.gov/storage-services/service/ndnp/dlc/batch_dlc_2feininger_ver01/data/sn83045462/00280604434/1948040101/0059.pdf"],"published":"1948-04-01","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Newspaper page carries reporting on a regional trial for U.S. Olympic boxing.","entry_sha256":"52cbe3dd664229654be57a2a48ea68d171d07676bfb235402f61281f26d3f66d","claims":["C-02"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.olympedia.org/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Read the listed lookup routes for people, editions, countries, sports and results.","entry_sha256":"0c0bf42614029c19cc5765df2bc588fbba4aa1c1a7882de4ab7d94f560c5e20b","claims":["C-04"],"review":"reviewed"}
  - {"id":"S4","kind":"help-page","urls":["https://www.olympics.com/ioc/faq/olympic-studies/how-can-i-access-the-catalogue-of-the-olympic-studies-centre"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Official description of IOC and organizing committee publications and catalogue scope.","entry_sha256":"af38bec352acc5b804ab201d50b2618556b4ab6795864969eec8a4d5f175018b","claims":["C-04","C-06"],"review":"reviewed"}
  - {"id":"S5","kind":"pdf","urls":["https://library.olympics.com/default/basicfilesdownload.ashx?itemGuid=7EC7D99C-8204-4D41-A216-3328257DBB0E"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Official description of access and the role of the Olympic Studies Centre.","entry_sha256":"2af92b991c3f6b94daab78d511b08e88b273e74a9b2041ff8178a04b72caf5f3","claims":["C-06","C-07"],"review":"reviewed"}
  - {"id":"S6","kind":"pdf","urls":["https://library.olympics.com/Default/Portal/basicfilesdownload.ashx?itemGuid=2ECE9BE9-EA5F-4F0F-97DF-84C75B6BC60A"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Opened the fonds finding aid and used its identification fields and access description.","entry_sha256":"8985aa4c50fb608ebdf537bb6738ec5369726c94899c5ce9b55236bde5319d9e","claims":["C-06","C-07"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://blog.myheritage.com/2024/07/paris-olympics-then-now-what-changed-from-1924-to-2024/"],"published":"2024-07-25","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. MyHeritage’s account quotes the Boston Herald on the Soviet decision and the proposed Moscow event. The text dates the report to 10 May 1924 and the clipping caption gives 11 May. The research uses the month and treats the report as an announcement. The post’s invitation and event identifications require independent evidence.","entry_sha256":"91bec3be6c118eff3704d1e63fd291bacee7d80ad330c4070416d394269385b3","claims":["C-08","C-11"],"review":"reviewed"}
  - {"id":"S8","kind":"pdf","urls":["https://stillmed.olympic.org/Documents/Reports/Official%20Past%20Games%20Reports/Summer/1924/FRA/1924-RO-S-Paris_I.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Page 62, *L’invitation aux nations*, gives invitation and acceptance totals and reproduces the invitation letter. The letter names Paris and gives the scheduled dates by sport. The section supports the invitation procedure and provides aggregate figures only.","entry_sha256":"1d1cac029a17e496d77f1d0f5621417376509e44fdefae7078d7e51f3f4d591f","claims":["C-08","C-10"],"review":"reviewed"}
  - {"id":"S9","kind":"pdf","urls":["https://isoh.org/wp-content/uploads/2015/03/249.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Page 25 and note 44 describe the IOC’s April 1923 decision against Russian participation in the Paris Games, including the proposal for Soviet representation, and cite the session minutes. This establishes the IOC’s eligibility decision. The disposition of any separate invitation to the Soviet government remains open.","entry_sha256":"a9b70bddc6b5183bb5873e7a2f63e6b43f87516606c1d699a2367d4c6066da9e","claims":["C-10","C-11"],"review":"reviewed"}
  - {"id":"S10","kind":"pdf","urls":["https://cdm17103.contentdm.oclc.org/digital/api/collection/p17103coll10/id/1630/download"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The article identifies Red Sport International as a federation of workers’ sports organizations, and table 3 lists its October 1924 congress in Moscow. The congress is documented separately from the newspaper’s announcement.","entry_sha256":"27b98c5b873d04e49e1ff15da2021c5495c2b63dbfb31f785326a6d73ab90738","claims":["C-08"],"review":"reviewed"}
  - {"id":"S11","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2025/08/kansallisleikki-joka-kannattikin-unohtaa.html"],"published":"2025-08-07","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Kyläkoski attributes the heading *Olympiska spel* to a Helsingfors Dagblad account of the artists’ guild’s outing on 7 June 1866, published the following day. The heading and outing are taken from the post’s reading of the issue.","entry_sha256":"35c538071d49194b3347a483cafcbd6e23a270680f982108912b76f863b3012b","claims":["C-09"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://www.olympics.com/ioc/news/athens-1896-the-revival-of-the-olympic-games"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The IOC account dates the first modern Olympic Games to Athens in April 1896.","entry_sha256":"59faeee0d3ecce391e80afadd0e7dc528ea09d3814795ee0cecedde5f3fab222","claims":["C-09"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the author’s search advice, check Olympic trials coverage if the person is missing from the team list. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Search historical newspapers around the trials with the name, sport and the term *Olympic trials*. Follow earlier qualifying events if the coverage identifies one. Record the competition level and result that the article actually names. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"According to the author, use Olympedia for athlete profiles and the editions and events in which they competed. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"portal-availability","anchor":"Use Olympedia to identify the athlete, edition, country and event. Compare its event result with the Olympic organizing committee report where the claim needs confirmation. [S3 @2026-11-18], [S4 @2026-11-18]","sources":["S3","S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"According to the author, search the Olympic World Library and the IOC historical archive when studying a competitor or someone involved with the IOC. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-06","kind":"portal-availability","anchor":"Look up the edition in the Olympic World Library for Olympic Studies Centre and organizing committee publications. When the lead is an internal record, identify the fonds, dates and file reference in the IOC Historical Archives finding aid. [S4 @2026-11-18], [S5 @2026-11-18], [S6 @2026-11-18]","sources":["S4","S5","S6"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"custody","anchor":"Ask the Olympic Studies Centre about access for the identified file using its reference and date. Prepare the inquiry with the title and call number first. [S5 @2026-11-18], [S6 @2026-11-18]","sources":["S5","S6"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"When a newspaper calls an event “Olympics,” match its date, place and organizer to the edition’s official program before recording Olympic participation. For the *Boston Herald*’s May 1924 report of Moscow’s “own Olympics,” search *Red Sport International* as an organization name and look for a dated program or results to identify the event. [S7], [S8], [S10]","sources":["S7","S8","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"example","anchor":"For the reported “Olympiska spel” heading in the 8 June 1866 *Helsingfors Dagblad*, look for the person in coverage of the artists’ guild outing, which predates the first modern Olympic Games at Athens in 1896. [S11], [S12]","sources":["S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"When a newspaper says a delegation chose to stay away, check the organizing committee’s invitation correspondence and the IOC minutes. Record the invitation, reply and eligibility decision separately. [S8], [S9]","sources":["S8","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"example","anchor":"For Paris 1924, record the *Boston Herald*’s May account of a Soviet decision to stay away separately from the IOC’s decision against Soviet representation. [S7], [S9]","sources":["S7","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
