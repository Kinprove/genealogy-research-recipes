claims:
  - {"id":"C-c04b5996a14a","kind":"unclassified","anchor":"- **An apprenticeship.** Apprentice bonds and bastardy bonds are separate series. The North Carolina county records guide lists them separately by county. Lisson warns that researchers wrongly treat an apprenticed child as illegitimate [S2].\n- **An \"alias\".** In earlier records it can mark a maiden name, or simply another name the person was known by [S6].\n- **A household pattern.** Examples are a child living with grandparents, an aunt, a cousin or a neighbour, a large age gap after the other children, or a child in an institution.","sources":["S2","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6aa5594951ed","kind":"method","anchor":"Use a gap between births to look for the child's own birth or baptism entry. Sorensen found a nine-year gap followed by a birth to the same mother in her late forties [S6]. Check a reported marital status against dated marriage or death records as well [S6].","sources":["S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2718ee949d24","kind":"unclassified","anchor":"Start with the mother's surname. A child born outside marriage usually took it [S1], [S2]. Lisson says the father's surname was used mainly when he acknowledged the child, and that in that case a bastardy bond is unlikely because he had accepted financial responsibility [S2]. A child could also take the father's surname later, for example after the parents married. If the child used the father's surname, record that as a separate observation. It is not evidence that the parents were married when the child was born.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5b9c8e006f7b","kind":"unclassified","anchor":"**English naming leads.** The double-surname examples below come from Sorensen's UK lecture\n[S6], not a general U.S. naming rule. In U.S. records a woman's alias can also mark a maiden\nor previous married name; preserve the wording without deciding which name it represents.\nRecord double-surname forms as leads, and test them against local usage:","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-28dd1833715e","kind":"unclassified","anchor":"- **\"X otherwise Y\".** Sorensen says this form almost always signals illegitimacy, usually followed by the mother's later marriage to the father [S6]. That overstates it. \"Otherwise\" and \"alias\" were also used for a change of name or for being known by two names, without any disreputable meaning, and a combined name could pass down through later generations. Treat \"otherwise\" as a high-priority lead. Search both surnames for a baptism under the first name and a later marriage of the mother to a man of the second name.\n- **\"X Y\" (no hyphen).** Sorensen reads this as the mother's surname followed by the father's, with the child usually born under the mother's name [S6]. This order rule is her view only. Test both orders.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-adb950ae9e4d","kind":"custody","anchor":"1. **County bastardy bonds.** These bonds existed so that someone other than the county would be financially responsible for the child [S2 @2026-11-19]. The Currituck County, North Carolina bond transcription says the bonds nearly always name the mother and the father, who signed the bond with his bondsmen, and rarely name the child. So expect a named father, and do not expect the child's name. Lisson reports that she has sometimes also found the child's name, age or birth date in them [S1 @2026-11-19], [S2 @2026-11-19]. When the mother would not name the father, she and those who signed with her were responsible instead. North Carolina's original bonds are held at the **State Archives of North Carolina in Raleigh, arranged by county**; FamilySearch has filmed copies under *Bastardy bonds and records (North Carolina), 1736–1957*. Check original and filmed coverage separately rather than sending a request to a courthouse by default. [S14 @2026-11-19] Lisson's experience is mainly North Carolina [S2 @2026-11-19]. For any other state, establish the series' custodian and coverage before searching it.\n2. **County court order books and minutes.** Search them under the mother's name, the named man's name and the couple's names, including for couples who never married [S1 @2026-11-19]. Record any apprenticeship of the child as its own series entry. Apprenticeship alone is not a bastardy finding. If the instrument expressly describes the child's status, preserve that wording as the instrument's statement, keeping the apprenticeship distinct from the bastardy-bond series. If it names the mother under one surname and says she is now married to a named man, retain both as a dated name-and-role crosswalk. That wording establishes neither the earlier surname as her maiden name nor the current husband as the biological father. [S8 @2026-11-19]\n3. **Quarter sessions (criminal court) fornication and bastardy proceedings and support orders.** In 1800s Pennsylvania, fornication and bastardy was prosecuted in the county Court of Quarter Sessions, which ordered child support, lying-in costs and fines. Allen describes Centre County, where an inquest into an unmarried pregnant woman led to court files and support records naming the mother, the accused man and the child [S4 @2026-11-19], [S5 @2026-11-19]. Centre County holds civil and criminal court papers for 1800–1875. Allen says volunteers built a fornication and bastardy index to these papers [S4 @2026-11-19], [S5 @2026-11-19]. The library's published list of indexes does not include one, so confirm it with the library's Pennsylvania Room before relying on it or describing its coverage. In other Pennsylvania counties, search the Quarter Sessions papers directly and ask whether a local index exists.\n4. **Grand-jury presentments or indictments for adultery or fornication.** Search under both names when a supposed marriage leaves no marriage or divorce record. In Lisson's family, an adultery indictment roughly twenty years after the presumed marriage prompted a search of county court and grand-jury records [S3 @2026-11-19]. Record the charge as an allegation and look for its disposition before revising either person's marital history.\n5. **Church records.** First find out how the family's denomination treated an unwed mother and her child. Then search its baptism, discipline and excommunication records for both of them [S2 @2026-11-19]. Quaker monthly meetings, for example, recorded charges and disownments for being with child while unmarried. In Latin registers, look for *ignotus* (\"unknown\") in place of the father, for example *nomine ignoto* (\"name unknown\") [S2 @2026-11-19].\n   - **Church-court suits.** A blank father in the baptism is no reason to stop at the parish register: a diocese may keep its own list of impregnation cases, and such a list can name the accused man. One reported example is the Hungarian Archdiocese of Kalocsa's spreadsheet of illegitimate impregnations, divorces and separations [S7 @2026-11-19]. To work a list like this, sort on the case-type column (*pertípus*), pick out the rows coded *impraegnatio* (Latin for impregnation), and order those rows by locality [S7 @2026-11-19]. Expect gaps. The list does not hold every such pregnancy, and the source guesses that only cases that went to a suit (*Klage*) appear in it [S7 @2026-11-19], so a missing case is uninformative. For a listed case, record the suit as an allegation, not as paternity. Trace it to the underlying record where one survives, then search for a later marriage of the couple, because some of the listed parties married afterwards and some did not [S7 @2026-11-19]. The source describes only the list. Reading such lists as a diocesan-court series with case files behind them is this recipe's own inference, and the Kalocsa list and its coverage rest on a single forum post. Before you describe such a list, ask the diocesan archive what it covers and whether files survive behind it.\n6. **Legitimation by subsequent marriage.** A later marriage can change the child's legal status under the applicable law; North Carolina G.S. 49-12 is one explicit example. [S15 @2026-11-19]\n   - **Privacy gate:** <!-- privacy-gate: request --> A legitimation or amended-birth-record request can identify the child and parents who may be living and disclose sensitive parentage. Answer the privacy gate in `SKILL.md` before sending a request or proof documents.\n   - Check the law for the jurisdiction and event date, then seek the marriage entry and any legitimation, acknowledgment or amended birth record. Keep legal status, a later surname and biological paternity separate. A surname change alone does not establish any of them.\n7. **Adoption and sealed records.** Treat an adoption as a separate legal proceeding, not an explanation inferred from a surname or foster placement. Identify the court, child-placement agency and vital-record authority for the place and date, then check their access rules.\n   - **Privacy gate:** <!-- privacy-gate: request --> An adoption-record request can disclose the adoptee's and birth or adoptive relatives' identities and sensitive parentage. Answer the privacy gate in `SKILL.md` before sending any request or proof documents.\n   - Request adoption papers or an original birth certificate only through the route the responsible court, agency or vital-record office authorizes. Sealed files are not ordinary public court files: North Carolina, for example, provides non-identifying information and a confidential-intermediary route subject to eligibility and consent. Record a refusal or restriction separately from an inspected no-hit; do not try to bypass sealing or identify living relatives through public tracing. [S16 @2026-11-19]","sources":["S2","S1","S14","S8","S4","S5","S3","S7","S15","S16"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b550d6dbb6b6","kind":"unclassified","anchor":"Choose the record-creating authority for the child's dates before searching: a court proceeding, a child-welfare file and a statement in a later church record are separate evidence [S9], [S10]. Have the archive confirm the historical authority and applicable series dates before switching between court and child-welfare routes; the examples below do not supply a universal legal cutoff.","sources":["S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00435425fc7f","kind":"method","anchor":"For the 1852 Lösen, Blekinge, inquiry, start with the mother's residence and identify its historical *häradsrätt*. Search its *domböcker* for 1852 and 1853 [S9]. The birth parish does not establish where an offense took place. Check the law and court jurisdiction for the date, and allow for the possibility that there was no prosecution.","sources":["S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1080e802a347","kind":"unclassified","anchor":"Browse backward in a surviving court-minute volume for a *saköreslängd* (fines list). If you find an entry for the mother, retain any named man and copy the paragraph reference, then retrieve that paragraph in the corresponding court and term's *dombok*. Retain court, year, term, volume, paragraph and image locators beside the entry and proceeding [S9].","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4baa17690ba1","kind":"unclassified","anchor":"Account for every court term in the selected interval: terms may be bound together or occupy separate volumes [S9]. Check actual catalogue holdings and keep unavailable or uninspected volumes distinct from inspected no-hits. Record the named people and the court's actual finding in their recorded roles; neither establishes biological parentage. An absent list or proceeding does not establish paternity or exclude a candidate. The example does not establish a universal prosecution cutoff.","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-583ce66b3116","kind":"unclassified","anchor":"Where the historical responsibility points to a *barnavårdsman* or *barnavårdsnämnd*, ask the responsible municipal archive for both the child's register entry (*liggare*) and individual case file (*akt*), supplying the child, mother, birth date and known residence or move dates [S10], [S11]. Request the file references and surviving documents, rather than treating a name-only reply as the complete case.","sources":["S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ef84af49095f","kind":"unclassified","anchor":"Follow the file across documented moves. If the first archive does not hold it, ask whether it was transferred, and request the destination board, transfer date and any register or file reference. Use those references to request the receiving authority's entry and file [S10], [S11]. Linköping's archive guide describes the forwarding of child-welfare papers when a child moved and became registered in another municipality; it also warns of gaps in particular rural series [S11]. A birth-municipality no-hit therefore leaves transfer and survival unresolved.","sources":["S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4af8c3e6cf7c","kind":"unclassified","anchor":"ArkivDigital reports that a file could close when the parents married or the child was adopted [S10]. Ask for the closing entry, its date and any reference to another authority or case. Closure does not establish destruction, successful identification of the father or an adoption decision; retain the welfare file and any separate court proceeding as distinct records.","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c66dad26f9e1","kind":"unclassified","anchor":"Follow the child into later confirmation records, moving certificates or court statements when those records survive: the presenter describes them as possible later statements of the father's identity [S10]. Preserve who supplied the name and when, and test that statement against the mother, child and alleged man's dated records before combining it with the earlier case.","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-30e83feb8f1e","kind":"unclassified","anchor":"If this inquiry already identifies a child in an Allmänna barnhuset roll, open the original roll image and retain the child's name, dates, admission number and any written reference or abbreviation [S12]. The roll can record foster placements and information about the mother, while her name may remain absent [S13]. Keep institutional admission separate from a finding about the child's birth outside marriage.","sources":["S12","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cfc08d6cf0a7","kind":"unclassified","anchor":"Follow the roll's actual reference to the linked papers, usually admission documents. Use the admission number or referenced category to select the corresponding series in Allmänna barnhuset, SE/SSA/0809A [S12], [S13]:","sources":["S12","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-747a72007e5b","kind":"unclassified","anchor":"Request the actual surviving papers with the roll, entry, year and reference; preserve their own names, roles and statements after inspection. The table does not establish what a particular file contains or identify a parent. If the roll instead gives a diary number/year, follow that distinct reference to *Huvuddiarium* C1 and its accompanying papers E4A [S13]. Keep the different identifiers separate, and record an unavailable or uninspected file without treating it as evidence about parentage.","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e6f5e2c13858","kind":"method","anchor":"If the roll records that the mother served as a wet nurse, retain that statement's date and any nurse reference, and use the guide's *Ammrullor* D1BA (1816–1937) as the next retrieval target [S13]. Follow the explicitly recorded role; a nurse with a similar name is not thereby the child's mother.","sources":["S13"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dacfd67013a1","kind":"unclassified","anchor":"If the entry describes home support (*understödsbarn*), use the separate rolls D2GA and their register D2GB [S13]. The guide says these children received support while remaining at home, so that category does not establish residence at the institution.","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3415d6f86c9f","kind":"unclassified","anchor":"A bond, court file or church-court suit records an accusation, a reputation or a court outcome. It does not prove biological fatherhood. A \"reputed\" father is the man known or believed to be the father. Lisson contrasts him with an \"imputed\" father, whom the mother accused and who may have disputed it [S2]. \"Imputed\" is her term. The usual legal term for the accused man is \"putative father\". Copy the record's own term exactly.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0687abbe0557","kind":"unclassified","anchor":"**A missing bond proves nothing about legitimacy or paternity.** Lisson says no bond was needed when the father acknowledged the child or when relatives raised it, because the county faced no cost [S2]. That is her reasoning from what the bond was for. The mother and her co-signers could be held responsible, so a family taking charge can still leave a bond. Search the series either way.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2994e80ee1d9","kind":"method","anchor":"**Record the role named in a Bible or will.** Lisson found Sarah Blanks in the family Bible and in a will as the mother of the testator's grandchildren. Lisson reports that Sarah's maiden name was Talley [S3]. Search both surnames, transcribe how each source identifies her, and seek a record linking her to her parents.","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bfb5dbd04ae9","kind":"custody","anchor":"For an agency adoption, request the agency's background (non-identifying) information as its own request, separate from the court decree or sealed court file. In California, for example, the licensed agency that handled the adoption, or the Department of Social Services, gives an adoptee general facts about the birth parents and their medical history. A written request sent to the Department when the agency is unknown is either processed there or returned with the agency's address [S17 @2026-11-12].","sources":["S17"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e6d8300a26a6","kind":"method","anchor":"Do not treat the decree as the whole adoption record. MyHeritage's adoptee guide says agencies often kept far more than the final legal paperwork [S19]. Washington's current rule shows what an agency file can hold: the report on the birth parents that an agency must give prospective adoptive parents includes heritage, physical description, education, occupation, family and social history, the circumstances leading to the adoption, and medical history [S18]. Record the agency's reply separately from the court's.","sources":["S19","S18"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0701dc0da4f2","kind":"method","anchor":"Search each child's later marriage under both parents' surnames. In Neill's 1840s German family, siblings used different surnames and one daughter married under her mother's maiden name [S20]. Look for a separate acknowledgment or legitimation and check the local law for the period [S21]. In Bremen, Anna Adelheid Lahrs was born under her mother's name in 1832. Her parents married in 1833, but the legitimation was entered only at Anna's own marriage in 1860 [S22]. Search the margins and later acts under both names, and distinguish the date of the legal event from the date of its entry.","sources":["S20","S21","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cf5451e3e5a8","kind":"method","anchor":"For a historical case whose parties are all dead, also search the local newspapers of the time. A sealed court file, or a birth certificate sealed after an adoption, does not withdraw a birth announcement or a report of the case that a paper had already printed [S23]. FamilySearch lists newspapers among the sources for births and adoptions, and says sealed adoption records cannot be viewed without a court order or similar authorization [S24]. Read such an item as the paper's or the family's account, not as the content of the sealed record. If anyone involved may be living, keep to the authorized route above and to the Living people rule in `SKILL.md`; do not use newspapers to get around the sealing.","sources":["S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-maintenance-warrant-birth-date","kind":"method","anchor":"**Maintenance warrant notices.** When a search under the mother's name in a historical case turns up a newspaper or police gazette notice of a maintenance warrant, record the man named on the warrant and any date the notice explicitly gives as the child's birth date [S26]. Keep the warrant and arrears dates in separate fields [S27]. Compare the child's full birth date with the date in an independent record. Fuller reports that a search under Annie Flynn found a maintenance notice naming Stanley Kenneth Sisson. The child's reported birth date matched her grandmother's, and a linked First World War service file contained a court document in which Sisson acknowledged paternity [S25]. Retrieve the order or acknowledgment and compare the identifiers. A warrant records enforcement, and a date match alone does not establish biological paternity.","sources":["S26","S27","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-household-marriage-promise","kind":"method","anchor":"**A household that looks like a married family.** Check each child’s own baptism entry for how it describes the birth and the parents. A marriage promise in a baptism entry records a promise. Find a dated marriage entry before recording a wedding [S28].","sources":["S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-military-absence","kind":"method","anchor":"**A married mother whose child is marked as born outside marriage.** Keep the child’s recorded status and the mother’s marriage as separate observations. Compare the birth date with any documented military absence of the husband, then look for the court’s account. A Loimaa baptism is a reported example of the two statuses coexisting [S29].","sources":["S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-middle-name-lead","kind":"method","anchor":"When a child recorded under the mother’s surname has a middle name that looks like a surname, try that name as a candidate surname in the local paternity and support records, as Clare Kirk suggests [S30]. Test whether it occurs in the mother’s family before using it to prioritize a man.","sources":["S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-names-and-later-marriage","kind":"method","anchor":"Compare a child’s given names and any later communion-book patronymic with the given names of the mother’s later husband and of the mother’s father and older brothers. Use any agreement to select records to search. Date the first appearance of a later surname against the mother’s marriage and her husband’s death. The Finnish account reports a child whose given names matched maternal relatives and whose later surname stayed in use after the mother’s husband died [S31]. Follow the child through the dated entries before attributing either name to a father.","sources":["S31"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-witnessed-acknowledgment","kind":"method","anchor":"If the birth entry notes a later marriage, read any witnessed acknowledgment in that entry and identify who actually declared paternity. The Prague entry reported in the post excerpt records the marriage and a witnessed declaration [S42†]. Record the declaration and the witnesses separately from the marriage and its date [S43].","sources":["S42","S43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-carolina-printed-bond-index","kind":"method","anchor":"**North Carolina printed bond index.** For a second finding aid, check Betty Jo and Edwin A. Camin’s *North Carolina Bastardy Bonds*, the volume whose Heritage Books reprint the presenter reports [S33†]. Check the county list before searching the name index. The publisher describes selected counties through about 1878 [S34]. Use the county and date to find the original, and record a bondsman in the role the bond gives.","sources":["S33","S34"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-foster-family-support-papers","kind":"method","anchor":"**Child-support papers kept by a foster family.** If a known foster family may have kept the original papers, ask the foster family whether it kept a court child-support order or verdict. Use a contact route the family already provided or an agreed intermediary. Translate any copy locally if needed. Record who was ordered to pay, which child the order identifies and how the court describes the relationship. One family reports receiving a court verdict from the foster household [S32].","sources":["S32"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-scottish-paternity-index","kind":"portal-availability","anchor":"For historical cases, search MyHeritage’s *Scotland, Paternity Decrees, Processes and Case Papers* [S35 @2026-11-22], [S36 @2026-11-22], or use the Scottish Paternity Index at Scottish Indexes [S37 @2026-11-22]. Start with the mother’s surname in the pursuer field where offered. Compare the child’s birth date and sex, the residence, the case year and court, and the defender’s name and occupation where supplied. Keep the court and any archival reference.","sources":["S35","S36","S37"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scottish-decree-and-process","kind":"method","anchor":"Read the decree for the court’s decision and any maintenance it orders. Read the process for the underlying papers and check whether the pursuer is identified as the child’s mother. If the register of extracted decrees has no entry, look for surviving processes and check which series and years were indexed for that court [S35], [S38]. Preserve each party’s role and the finding the court actually made.","sources":["S35","S38"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-swedish-court-book-text-search","kind":"platform-ui","anchor":"If the church book leaves the father unnamed, follow the court-book lead reported in the interview excerpt [S39† @2026-11-22]. Check the court and term in ArkivDigital’s *Maskinell texttolkning* coverage [S40 @2026-11-22]. Search for the mother and her residence where covered. Verify a hit in the court-book image, and browse the appropriate term and fines list if the text search has no hit or no coverage.","sources":["S39","S40"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-court-continuation-and-statement","kind":"method","anchor":"When district-court minutes say the hearing continued from an earlier sitting, retrieve that sitting’s minutes and follow any reference to testimony taken by another court. If they identify a military court that took an absent husband’s statement, use that reference to look for the statement. Keep the civil court’s summary and any statement you locate as separate records [S29].","sources":["S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-sibling-baptism-father-field","kind":"method","anchor":"When baptisms for siblings differ, record the father field for each child independently. Leave paternity unresolved from a blank entry even if a sibling’s entry names a man. One reported Lempäälä pair shows a named father in one baptism and a blank in the other [S41].","sources":["S41"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-kallar-sig-surname","kind":"method","anchor":"When *kallar sig* (“goes by”) follows the child’s given names in a historical Swedish-language baptism entry, record the surname it introduces as a name used by the child [S45]. Search later parish entries under that surname as well as the mother’s. Check separately for wording that identifies a father and record him as unnamed if the entry gives none. A reported 1831 Helsinki baptism gives a surname after *kallar sig* and leaves the father unnamed [S44].","sources":["S45","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
