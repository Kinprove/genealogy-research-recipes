claims:
  - {"id":"C-100b54a58269","kind":"portal-availability","anchor":"Search the MyHeritage Official Register index when you need a candidate edition and entry\n[S1 @2026-11-22]. Check the original edition’s scope using the National Archives guide\n[S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-94b7fbfe47d5","kind":"method","anchor":"A dated Official Register entry gives a snapshot of employment. Copy the listed position, agency,\nbureau, duty station, compensation, birthplace and appointment district where stated. Preserve\nresidence as its own field. Check adjoining editions to bound changes in employment and compare each\nedition’s inclusion rules before interpreting a miss [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d70b77564546","kind":"custody","anchor":"According to the presenter, follow a civilian employment lead to an Official Personnel Folder\n[S2† @2026-11-22]. For service ending before 1952, look up the agency in the National Archives at St.\nLouis archival holdings and verify access for that employment. Use the Archives’ later-record routing\nif service continued into 1952 or after. Check for a service record card when a folder is unavailable\n[S4 @2026-11-22], [S5 @2026-11-22], [S6 @2026-11-22].","sources":["S2","S4","S5","S6"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d09c83a3eb4f","kind":"method","anchor":"Extract dated appointments, promotions, transfers and separation [S4]. According to the presenter, a\nfolder can supply personal details [S2†]. Record any birth or family detail with the source document\nand informant when shown. Return the edition and page for the register entry, the personnel series and\nfile locator, and the specific gap or access outcome for any missing product.","sources":["S4","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
