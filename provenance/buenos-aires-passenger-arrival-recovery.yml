claims:
  - {"id":"C-39d35ca137b0","kind":"portal-availability","anchor":"Search CEMLA by passenger name. Record the declared marital status, arrival date, ship and embarkation port when shown. According to the community guide, check for gaps before reading a miss [S1† @2026-11-22]. CEMLA describes damage to books and uneven coverage. Its FAQ says the 1933–1937 results principally cover Italian and Spanish nationals and include some months and years for other nationalities [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bf0f23fb4a53","kind":"portal-availability","anchor":"For 1882–1937 sea arrivals at Buenos Aires, search the Archivo General de la Nación passenger books by name, arrival range or ship. Open the register image when supplied. For a miss with a known voyage, use the vessel and arrival date as retrieval keys for the books [S3 @2026-11-22]. Record the book and page or image locator separately from any transcript or download.","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0570c6cc8b75","kind":"portal-availability","anchor":"For a later voyage, check the Dirección Nacional de Migraciones’ historical records service and ask which records survive for the year before selecting a certificate. Its admission or residence certificate and its movement certificate answer different questions [S4 @2026-11-22] [S5 @2026-11-22].","sources":["S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
