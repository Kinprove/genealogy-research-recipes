claims:
  - {"id":"C-5632f72e15da","kind":"custody","anchor":"Use the transaction and the accounting office to choose the series. Keep a claim, its settlement and its payment distinct. According to the presenter, route the transaction by the Treasury office that handled it [S1† @2026-11-21]. In RG 217, start with Inventory 14 and the Guide to Federal Records. Use the Register of the Treasury for central receipts and expenditure ledgers and journals. Check the First and Second Comptrollers for the audit route appropriate to the date, and the Accountant for the War Department and Second Auditor for War Department accounting across the 1817 reorganization. Test the Third Auditor for military subsistence or Quartermaster accounts. For postal accounting, check the Fifth Auditor descriptions and the related Sixth Auditor records in RG 28. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bfdd92f121bd","kind":"custody","anchor":"Use the paymaster’s name and date to locate a settled Army account. Search the available register or inventory for the relevant account number or box. According to the presenter, record which paymasters each inspected box covers [S1† @2026-11-21]. For a pension payment, check the agency payment abstracts and final-payment vouchers as separate series from the claimant’s application. Compare payee, agency, amount and transaction date before connecting entries. [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-dfaa013a17ec","kind":"method","anchor":"For Revolutionary War and other early federal Army pensions covered by T718, take the pension act, payment agency and payment-start date from the application papers or payment index. Use the act, agency and period to select the ledger volume, then browse the relevant pages even if the name search misses. According to the presenter, use the application card's retroactive start date when it gives one [S5†] [S3].","sources":["S5","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-58f995f70176","kind":"platform-ui","anchor":"On Ancestry, open *U.S., Revolutionary War Pensioners, 1801-1815, 1818-1872* and select the T718 material under **Browse this collection**. The earlier payment roll in the same collection is M1786. According to the presenter, use **1818-1872** to locate the collection in the card catalog [S5† @2026-11-22] [S6† @2026-11-22] [S13 @2026-11-22].","sources":["S5","S6","S13"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-660c6f326809","kind":"method","anchor":"Keep each installment's due date separate from its collection year and quarter. According to the presenter, in the illustrated layout March and September head the due-date columns, 1 through 4 mark collection quarters, and a two-digit year above the quarter gives a different collection year [S5†] [S6†]. Confirm that reading against the headings, annotations and voucher for the volume at hand. Where installments share a collection year and quarter, check for one voucher covering the arrears and the current installment before counting separate pickups [S3].","sources":["S5","S6","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-67a72c1dbd0d","kind":"method","anchor":"Record any death notation, last recorded payment and dated transfer as separate events. According to the presenter, compare outgoing and incoming agency entries to bracket the change in agency, then check vouchers for changes of residence [S5†] [S6†] [S3]. If the new agency is unexpected, look for related pension-rate paperwork. The presenter reports that such paperwork explained an unexpected location in one case [S5†].","sources":["S5","S6","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2f3253058344","kind":"custody","anchor":"Carry the paying agency and state, collection year and quarter, and pension act or class to *Settled Accounts of Pension Agents*, RG 217, NAID 302049. Search by the series title and identifier to reconcile NARA's A1-712 reference with Series 721 in Inventory 14. According to the presenter, locate the box for that payment group and then look for the individual voucher [S4† @2026-11-22] [S5† @2026-11-22] [S3 @2026-11-22] [S11 @2026-11-22].","sources":["S4","S5","S3","S11"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4f2a8279e10e","kind":"method","anchor":"If *Quarterly Abstracts of Pensions Paid by Pension Agencies* (RG 217, Series 723 in Inventory 14) covers the agency and quarter, take the voucher number from the abstract. Otherwise, inspect any abstract filed with that quarter in the settled accounts or check the outside of the folded vouchers for the payee. Verify collection, amount and installment dates on the voucher [S3].","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0fb152becabe","kind":"method","anchor":"According to the presenter, read successive vouchers in date order for counties, including changes within one agency [S4†] [S5†] [S3]. According to the presenter, use the receipt and any power of attorney to identify who collected the payment before placing the pensioner at the agency or using the collection to bound a death date [S5†] [S6†] [S3]. When the last or final voucher gives incomplete service, check ordinary vouchers for captains and companies omitted there. The presenter reports finding additional captains this way [S4†].","sources":["S4","S5","S3","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d2931f079b00","kind":"method","anchor":"According to the presenter, read the bottom of the index slip for the operative label, including a typed *last* over a crossed-out *final* [S4†]. A last payment records the last documented collection for that pensioner. For a final settlement of arrears, extract the period covered, any stated date of death, the settlement date and the claimant's capacity separately [S3]. If payments stop, check for an agency transfer and seek independent evidence of death. Keep an unclaimed balance or discontinued collection open as alternatives. According to the presenter, check these possibilities before assigning a death date [S5†] [S6†].","sources":["S4","S3","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-76443e0c3193","kind":"example","anchor":"Check for a separate final-payment slip after finding a last-payment slip, since the presenter reports a file containing both [S4†].","sources":["S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c7601d7f1f8b","kind":"example","anchor":"When two slips under different spellings may point to one pensioner, compare their payment locators and the underlying ledger before counting people. The presenter reports a case where a hard-to-read ledger name produced two slips and a handwritten correction [S4†] [S3].","sources":["S4","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-196dc04324cb","kind":"method","anchor":"Read the final account for named claimants, spouses, stated residences, and any widow, child, administrator or agent identified by role. Place grandchildren under a child only when the papers support that relationship. Treat a statement of no surviving widow as status at death and keep earlier marriages unresolved until independently established. The presenter reports a final account that names grandchildren through their mother and records the pensioner as leaving no widow [S5†] [S3] [S11].","sources":["S5","S3","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a67feb4f7441","kind":"historical","anchor":"When a later federal payment reimburses last sickness or burial expenses, record the payee's documented role before inferring kinship. According to the presenter, check Civil War pension papers for medical and funeral receipts that identify who paid [S4†]. Under the Act of March 2, 1895, reimbursement applied in specified cases, including when there was no surviving widow or child and the estate lacked sufficient assets for those expenses [S20].","sources":["S4","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b2f7ba8c4b0f","kind":"portal-availability","anchor":"Find the *Index to Selected Final Payment Vouchers* (RG 217, Series 722A in Inventory 14) on Fold3. According to the presenter, use an asterisk on the slip to pursue the extracted voucher in *Selected Final Pension Payment Vouchers*, RG 217, A1-722, NAID 605894 [S4† @2026-11-22] [S5† @2026-11-22] [S6† @2026-11-22] [S3 @2026-11-22]. Use the veteran's state at death and try both the veteran and widow as filing names [S11 @2026-11-22]. According to the presenter, check the Fold3 voucher images for Delaware and Georgia (M2079 and M1746) [S5† @2026-11-22] [S6† @2026-11-22] [S7† @2026-11-22] [S12 @2026-11-22].","sources":["S4","S5","S6","S3","S11","S7","S12"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0a8767e03713","kind":"method","anchor":"For other states, check the particular agency covered by any published abstract before relying on its index. According to the presenter, check for abstracts by Alycon Trubey Pierce and Kathryn McPherson Gunning as leads to the vouchers [S4†] [S6†] [S3]. Check the full M804 application jacket for a stamp identifying an enclosed voucher from the General Accounting Office [S3].","sources":["S4","S6","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0d4d9e78308a","kind":"example","anchor":"If the application papers lack the original declaration, inspect any surviving last-payment packet for a copy. The presenter reports finding a copy of the Revolutionary War claim in one last-payment packet [S5†].","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2f91f1efd1a1","kind":"custody","anchor":"For an unstarred slip, pursue the ordinary vouchers using the agency and collection quarter. If a slip mentions the Act of April 6, 1838, or the facts fit a claim for uncollected pension, check *Settled Accounts for Payment of Accrued Pensions*, RG 217, Entry 724, independently of the star search. According to the presenter, follow docket wording such as *6 April*, *April 1838* or *Act of 1838* into that series [S4† @2026-11-22] [S5† @2026-11-22] [S6† @2026-11-22] [S3 @2026-11-22] [S15 @2026-11-22].","sources":["S4","S5","S6","S3","S15"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4bba471eb4ef","kind":"custody","anchor":"In Craig R. Scott's revised *The ‘Lost’ Pensions*, capture each matching entry's payment year and account number, along with the pensioner's name, agency and stated claimant relationship. Use year and account number to locate the flat-filed account. If an earlier edition yields only a box number, use the revised edition to recover the current locator. According to the presenter, the revision follows the refiling [S4† @2026-11-22] [S5† @2026-11-22] [S6† @2026-11-22] [S3 @2026-11-22] [S15 @2026-11-22]. When several Act of April 6, 1838 slips appear in one application file, compare them with the finding aid's separate entries and check each distinct account. The presenter reports a case where the slips and indexed entries agreed [S5† @2026-11-22].","sources":["S4","S5","S6","S3","S15"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4f86331547da","kind":"historical","anchor":"The Act of April 6, 1838 sent pension money unclaimed for eight months after it became payable to the U.S. Treasury for payment there. When the account shows Washington, D.C., record the original paying agency separately. According to the presenter, use the agency to trace where the installment first became available [S5†] [S14].","sources":["S5","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a568d8809c05","kind":"custody","anchor":"Check the volume for the relevant state in the Paymaster General's registers (RG 217, NAID 2642341) and also search the related half-pay register (NAID 2642378). Carry the beneficiary, soldier, pension start and account references into *Settled Accounts of Pension Agents for Payments to Widows or Orphans of Veterans of the War of 1812* (July 1818–August 1825, NAID 605925). According to the presenter, examine the auditor's report, account current, abstracts and vouchers in the account [S9† @2026-11-22] [S16 @2026-11-22] [S17 @2026-11-22].","sources":["S9","S16","S17"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2b1f5603d238","kind":"method","anchor":"Search payment abstracts and Army paymaster accounts separately. Distinguish the abstract date or number from the related account number and keep the agency or paymaster with the number. Keep the county of payment separate from the family's residence. The presenter reports cases in which only one of the two record types turned up [S8†] [S17]. Identify the widow or guardian and transcribe any stated date or cause of the soldier's death. The presenter reports that one abstract named a widow and gave her husband's death date and cause [S9†].","sources":["S8","S17","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-544493397b68","kind":"custody","anchor":"When a payment packet includes a Paymaster General's Office slip, carry the signing paymaster, date and account number together to *Settled Accounts of Army Paymasters*, RG 217, Entry 516. Check the supporting papers for the widow's or orphan's application and any marriage evidence. The presenter reports retrieving application papers from a slip and finding marriage evidence in a separate half-pay account [S8† @2026-11-22] [S9† @2026-11-22] [S18 @2026-11-22].","sources":["S8","S9","S18"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-221d4f5b3c90","kind":"method","anchor":"Search Entry 724 by name even when the original half-pay term ended earlier [S15]. According to the presenter, when the index identifies a widow in a late account, read the account to determine whether the widow herself or a later claimant sought the balance [S9†].","sources":["S15","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-78427a343e9e","kind":"method","anchor":"For dates before the payment cards, use dated residence clues to choose candidate agencies and check the quarterly abstracts in RG 217, Series 723, where the agency and date are covered. According to the presenter, trace the payments in their own series outside the pension application packet [S10†] [S3].","sources":["S10","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b7524c6ff884","kind":"method","anchor":"For a Union veteran or widow still on the federal pension rolls at the change to cards, check RG 15 microfilm M850, *Veterans Administration Pension Payment Cards, 1907–1933*. Match the certificate number, read the transfer-from agency or group on the front and use the payments on the back to bound the period. Follow agency changes as leads to dated residence evidence. According to the presenter, establish when the pension ended and use separate payment records to investigate moves during the period it ran [S10†] [S19] [S21].","sources":["S10","S19","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
