  - {"id":"S8","kind":"web-page","urls":["https://cruwys.blogspot.com/2020/09/the-ancestrydna-matching-updates-have.html"],"published":"2020-09-01","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","claims":["C-13a6dcaa85dd"],"review":"reviewed","entry_sha256":"dfc5681a163b3c1f526c8aa2d2baf370a63358b63836a5a651ab14892a1d08ce"}
  - {"id":"S9","kind":"web-page","urls":["https://www.geneamusings.com/2025/07/my-ancestrydna-clusters-are-limited-at.html"],"published":"2025-07-12","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","claims":["C-eb64415fc9d3"],"review":"reviewed","entry_sha256":"0f4f15a51f7abd3e37d22d65150b526c5f86ee8be01a88b0a3cd93287d7acc81"}
  - {"id":"S10","kind":"web-page","urls":["https://dna-explained.com/2025/07/10/how-to-use-ancestrys-new-match-clusters-and-what-they-mean/"],"published":"2025-07-10","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","claims":["C-eb64415fc9d3","C-75afe5dd6e6a"],"review":"reviewed","entry_sha256":"dfab4b3f7cfa1df4757c3d832235bb3b2bee40d87aded898e5d3ff3730485950"}
  - {"id":"S11","kind":"web-page","urls":["https://www.danaleeds.com/dna-color-clustering-the-leeds-method-for-easily-visualizing-matches/"],"published":"2018-08-23","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","claims":["C-75afe5dd6e6a"],"review":"reviewed","entry_sha256":"2829e7b2818becf033ba0d96208f7dc9f901ac1b74d8d8daab80053c766106fd"}
claims:
  - {"id":"C-2811f1d9bc04","kind":"unclassified","anchor":"For an authorized helper, check DNA-result access and access to the needed tree independently,\nincluding whether each intended invitation is accepted and usable. Keep both separate from\nthe correct tester-to-tree-person link; that link does not grant the helper either permission.\nLeave missing access unresolved instead of recommending a higher role. The [2024 sharing example](https://dna-explained.com/2024/02/05/ancestrys-thrulines-and-shared-matches-now-require-a-subscription/)\nmotivates these separate checks.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7d17a81444e","kind":"unclassified","anchor":"Before treating a target's tree as missing, record its DNA-link state and your access\nseparately. A match can have unlinked trees, each public or private; no DNA-linked tree\ndoes not establish that no tree exists. Inspect an accessible unlinked tree as a lead,\nretaining its URL and the person it actually describes. If no relevant tree can be opened,\nkeep that access gap and continue through the target's relatives. [Ancestry's comparison guidance](https://help.ancestry.com/hc/en-us/articles/53933331053331-Comparing-AncestryDNA-Matches)\ndocuments these categories.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b606306f2c53","kind":"unclassified","anchor":"Open an accessible tree itself rather than relying on the match-page view, which can show\nonly direct ancestors. Open even a one-person tree, and search its full people list for\ndeceased or non-private collateral relatives and for the tester's birth date, year or\nplace. If the match's or manager's profile shows other trees, check those too and read any\nvisible tree name as a surname lead. If the available search reaches a linked private\ntree, search it for the surnames your shared matches and hypothesis predict, and record\neach surname, result and date. A hit is a lead to document. A miss does not disprove the\nline; the tree may simply not reach it. A [2024 Legacy Tree guide](https://www.legacytree.com/blog/genetic-genealogy-proceed-if-a-dna-match-never-responds)\ndescribes these steps.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f68a55d80531","kind":"unclassified","anchor":"Open those relatives' trees and use obituaries, births and census households to place the target and its parents in the family. Identify a living target only as far as the family question needs: name, parents and place in the family, never its current address, contacts, workplace or online accounts (Living people, in `SKILL.md`). At 1773 cM, the [chart-supported candidates](https://dnapainter.com/tools/sharedcmv4) are full/half sibling, aunt/uncle–niece/nephew and grandparent–grandchild paths. If their trees are also missing, use recipe 3.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8b0f2518a6be","kind":"unclassified","anchor":"Before tracing the target's parents' families, use its documented relatives to choose which side\nto search first. Record each close relative's side of the target's family, as its tree and records\nshow it, and its cM with you. A relative on one side who also shares substantially with you points\nthe search to that side, as in a [JewishGen endogamy talk](https://www.youtube.com/watch?v=xaa5FcbZYb8).\nOne who shares little with you, like Ruth in the worked example, identifies the target but not the\nside of your connection. Treat the choice as work order, not exclusion: under endogamy a relative\ncan share with you through another line.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b51c7164f3a3","kind":"unclassified","anchor":"When a match shares with anchors on two related branches, compare its count for each branch with the number of matches you have already identified on that branch, rather than taking the larger raw count. A branch with many identified matches can outvote a smaller one, even for matches that belong to the smaller branch. Treat the proportion as a lead toward the branch to test first, then confirm it with the match's tree and records. The [presenter's example](https://www.youtube.com/watch?v=lH2vBiPOeg0) motivates this weighting.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-73b67ec54a9b","kind":"unclassified","anchor":"[Nicole Dyer's 2026 demonstration](https://www.youtube.com/watch?v=1hwGyO2ft4g) shows this\nalternate-primary selection on a previously explored line.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-640ca7537a24","kind":"unclassified","anchor":"Read a cluster's matrix member by member before assigning members to the cluster's line.\nCount each member's filled cells with the cluster's documented members. Treat a member tied\nby only one or two cells as weakly attached, and check its tree and records before using it\nfor the line. When one member is the only link to a subgroup whose own cells are sparse,\ntreat the subgroup as a likely shared-match chain and work it last. When unexplained members\nshare mainly with a subgroup already documented to one spouse's family, label them\nprovisionally with that spouse's family and stop extending their trees for the other\nspouse's line. Record each call and its basis as a matrix observation. A blank cell is\n“not shown,” never a measured zero (see [section 7](#7-recover-a-missing-row-through-another-view)),\nso these calls set work order only. A\n[2026 FamilySearch cluster walk-through](https://www.youtube.com/watch?v=D9rSab4b9EI)\nmotivates these checks.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d78254484463","kind":"unclassified","anchor":"Orient each kit separately. A sibling's or other relative's Parent 1 can be the opposite side from yours, so record the maternal/paternal mapping for every kit you compare, along with the known relatives that established it. Treat a 'Both sides' assignment as a hypothesis, not evidence of double relatedness, until known relatives, shared matches or mapped segments support it. Leave Unassigned matches unplaced. Check cluster sides against documented relatives as well. The [cluster review](https://www.youtube.com/watch?v=jzcjI59F6YI) found clusters that all came through one parent split across both sides, especially in an endogamous profile. The [sibling comparison](https://www.youtube.com/watch?v=rVndHlIg9-Y) is a 2023 observation from one family.\nWhen compiling one parent's match list, also review the Both and Unassigned sets. A [both-sides report](https://genarchivist.net/showthread.php?tid=184) found Both-labelled matches excluded from the Maternal and Paternal filters. It also found a documented close relative of a tested parent listed as Unassigned for the child. Record the displayed side label and its origin (provider prediction, user-assigned or unknown; see the label-origin check in [section 6](#6-detect-a-label-that-already-uses-your-shared-match-evidence)) separately from your own side assignment and the evidence for it.\n**Output:** a compact comparison table and the next match that distinguishes the competing paths.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7644207833af","kind":"unclassified","anchor":"Before searching a match's linked tree for the shared line, check that its home person is plausibly the tester. For example, compare the sex shown on the match page (such as the profile colour) with the tree's home person. If they differ, re-anchor on the likely tester, such as a spouse, and record that change before comparing surnames or places. A [tree-anchoring example](https://genarchivist.net/showthread.php?tid=588) found the shared line only after this switch. A corrected anchor is still a tree hypothesis: confirm the tester with the manager and the descent with records.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e6c7918aae3b","kind":"unclassified","anchor":"Treat a settler or diaspora Journey as a lead for a match search, not as evidence that a direct ancestor lived there. A [Journeys discussion](https://genarchivist.net/showthread.php?tid=1212) describes an assignment that came from an emigrant sibling's many descendants. Where the view is available, filter matches by that Journey and trace their trees to the collateral line that connects. Record the Journey's paternal/maternal label with its date, and separately the side of each tree person it lists. In a [later example](https://genarchivist.net/showthread.php?tid=2418) the list split across both parents. Those people come from your own tree, so they do not independently confirm it.\n**Output:** specific matches and people to trace back to the candidate couple.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aa3fffe30c0b","kind":"unclassified","anchor":"When evidence changes a group's ancestral interpretation, record the revised claim and basis,\nthen review the assigned matches against it. Renaming or recoloring alone does not audit\nmembership. Preserve the matches and independent observations; distinguish reviewed,\nunresolved and unsupported assignments. The [group-renaming example](https://whoareyoumadeof.com/blog/create-a-custom-group-of-dna-matches-on-ancestry/)\nmotivates this check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f31ef6c43c75","kind":"unclassified","anchor":"For a working group labelled with an ancestral couple, preserve its roster. Record observed\nmembership in a second group anchored by a documented path through one spouse's line. The\nmembers observed in the first group but outside the second can form a research queue; keep\nunreviewed or unavailable membership separate. This is the remainder, not the intersection,\nand supplies no proof that the remaining matches descend from the other spouse.\nThe [couple-group example](https://www.yourdnaguide.com/ydgblog/finding-3xgg-with-dna)\nmotivates this selection. A documented descendant through an ancestor's other partner can\nhelp focus the anchor question, as in the [half-sibling example](https://www.yourdnaguide.com/ydgblog/half-siblings).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0241ecb73f0c","kind":"unclassified","anchor":"When a suggested path runs through a match's parent who has also tested, compare both kits' amounts with you. First mark whether each figure is Ancestry's weighted headline or the unweighted amount, and compare the unweighted amounts. A small figure reported for a single match needs the same check. If the child still shares more than the parent, mark the path doubtful and keep three explanations open: a reporting or measurement difference, an incorrect path, or DNA from another source such as the other parent or another relationship. Check segments and shared matches before building out descendants on the strength of a green leaf. The [Gordon-line example](https://www.youtube.com/watch?v=nffEfpOI_k8), [parent/child example](https://www.youtube.com/watch?v=xv62kjXVi3g) and [small-match example](https://www.youtube.com/watch?v=EHUmd1Sfmn8) motivate this check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3f89f8fb11ce","kind":"unclassified","anchor":"Before treating a suggested ancestor's displayed match count as support for an older link,\ninspect the available paths by child. Keep a row for each identified match and proposed\ndescent, distinguishing paths through your already-known ancestor from paths that might\nindependently check that ancestor's parentage. Preserve unknown paths, dependent testers\nand possible additional relationships; a different child label alone does not establish\nindependent evidence. If the available view reaches one generation higher, compare those\npaths too: support for the wider family does not select the particular child through whom\nyou descend. Southard's [2020 worked example](https://www.youtube.com/watch?v=em_dMWtbJ-s)\nshows why the headline count can be misleading. Document each proposed link before\npromoting it.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7f9af38735ed","kind":"unclassified","anchor":"Treat a ThruLines “half” relationship as a reading of the trees, not of the DNA. A\n[JewishGen endogamy talk](https://www.youtube.com/watch?v=xaa5FcbZYb8) reports half labels that\narose because a contributing tree recorded only one parent of the ancestral couple. Before\nrecording a half relationship or a second partner, check whether your tree and the trees on the\npath record both spouses of the common couple. Resolve the couple from records and keep the half\nand full alternatives open.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0bbf8d9eb370","kind":"unclassified","anchor":"Before treating a displayed relationship as Ancestry's prediction, check its origin.\nA user-assigned relationship replaces the general prediction in the owner's match\nlist; manually assigned or changed parental-side labels carry a user-made indication.\nRecord the kit, view, date and label origin (provider prediction, user-assigned or\nunknown), preserving any visible indicator. Treat a manual entry as a user's\nassertion and retain its evidential basis where known; if the capture omits its\norigin, leave it unknown. See [Assigning Relationships](https://help.ancestry.com/hc/en-us/articles/53933287432211-Assigning-Relationships-to-AncestryDNA-Matches)\nand [Matches by Parent](https://help.ancestry.com/hc/en-us/articles/53933348047251-Matches-by-Parent).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-117e7fbaa511","kind":"unclassified","anchor":"Before mapping an Ancestry amount to a relationship, record the weighted headline, unweighted amount, segment count, longest segment, kit and view date. If the longest segment alone exceeds the headline, mark it possibly reduced by weighting. If a figure still looks low for a documented path, use the match-to-match view to find the match's close relatives and compare your and your tested relatives' sharing with them through the same line; consistently larger amounts make the low figure doubtful, not the path. Keep the low figure recorded as observed and check the relationship range against each figure separately. The [Timber-weighting discussion](https://genarchivist.net/showthread.php?tid=576) and a [match-to-match comparison discussion](https://genarchivist.net/showthread.php?tid=137) motivate these flags. Close relatives inherit different segments; the sourced pedigree decides the relationship.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1632243fee8d","kind":"unclassified","anchor":"Pair the longest segment only with the unweighted amount, because Ancestry reports it before\nTimber weighting. A [JewishGen talk](https://www.youtube.com/watch?v=0hGonlNLinM), citing\nAncestry's white paper, says the segment count is unweighted too. Compute an average segment\nlength as unweighted amount ÷ segment count, and label it so. Dividing the weighted headline by the count understates the average and mixes two\nmeasurements.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7b1b8895bef","kind":"unclassified","anchor":"Do not read a documented relative's blank cluster cell or missing shared-list row as sharing below the displayed floor. The [threshold examples](https://genarchivist.net/showthread.php?tid=1693) and a [Timber-threshold discussion](https://genarchivist.net/showthread.php?tid=137) report pairs dropping out once the weighted amount fell below the floor, one with about 51 cM unweighted. Where you manage one kit of the pair, open the direct comparison and record weighted and unweighted totals, segments, longest segment, kit and date; a longest segment larger than the weighted total signals reduction. A shared-view 'unweighted' line can repeat the weighted figure, as in the [shared-view label report](https://genarchivist.net/showthread.php?tid=1272), and two kits of one person can differ, so record each kit separately.\nIf an extension-modified browser view hides a known row or saved group, compare the same\nauthorized account, kit and filters in an available unmodified view. Retain the observed\nrow/group differences before concluding removal or a failed save; reappearance does not\nidentify the cause. The [2020 rendering example](https://genealem-geneticgenealogy.blogspot.com/2020/07/greetings-this-email-is-only-for-those.html)\nmotivates this comparison.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-34b701de0add","kind":"unclassified","anchor":"When a supplied cluster grid and its dropdown lists differ, preserve both with the kit,\nretrieval date and selected parental view. Record each person's listed groups separately\nfrom the cross-group cells actually visible in the grid; retain discrepancies and multiple\nobserved associations rather than forcing one group per person. If the grid is unavailable,\nmark those associations unverified. The [2025 example](https://dna-explained.com/2025/07/10/how-to-use-ancestrys-new-match-clusters-and-what-they-mean/)\nmotivates this comparison. Check saved manual tags against the recorded observations; neither\ntags nor cross-group cells establish an ancestral path.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5863ed56daf2","kind":"unclassified","anchor":"**Result:** Ruth is J.K.'s full maternal aunt, consistent with 1773 cM. Ada and J.K. have a documented third-cousin path through J.K.'s father, consistent with 25 cM in the [Shared cM Project chart](https://dnapainter.com/tools/sharedcmv4). The pedigrees identify their common ancestral couple. Use the close relative to identify the target, then trace both parental families for your own connection.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6bb1ec7f0ce2","kind":"platform-ui","anchor":"Set a custom cluster's range for the generation of the ancestor you are testing. Family\nLocket's summary of Ancestry's suggestions gives 90–340 cM for great-grandparents (second\ncousins), 40–120 cM for second-great-grandparents (third cousins) and 20–60 cM for\nthird-great-grandparents (fourth cousins), with 20 cM as the lowest setting [S1 @2026-11-12].\nAncestry's own custom-cluster help gives the same ranges and the 20 cM low end [B4 @2026-11-12].\nChoose sidekicks who descend from the same ancestor as the match of interest and share more\nDNA than the top of the range [S2 @2026-11-12].","sources":["S1","B4","S2"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c460e868fec0","kind":"platform-ui","anchor":"Do not read the children ThruLines shows under an ancestor as the whole family. It shows only\nchildren through whom a tested descendant's linked tree, yours or a match's, descends: in one\n2022 example it listed five children of a third-great-grandfather for whom the researcher had\nfound eleven [S3 @2026-11-12], [S4 @2026-11-12]. Build the\nsibling set from records, and treat the missing children's lines as places to look for\nuntested descendants when choosing a tester (see\n[unknown-parentage-wato.md](unknown-parentage-wato.md)).","sources":["S3","S4"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c4102c1b7ece","kind":"platform-ui","anchor":"At 90 cM or more, do not flag a match as possibly reduced by weighting or adjust its total.\nKessler found the weighted and unweighted figures always equal from 90 cM, and the unweighted\nfigure usually larger below it; Estes likewise reads Timber as removing segments only from\nmatches under 90 cM [S5 @2026-11-12], [S6 @2026-11-12]. Ancestry's help page on unweighted\nDNA gives no threshold [B12 @2026-11-12].","sources":["S5","S6","B12"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-13a6dcaa85dd","kind":"platform-ui","anchor":"A match seen before September 2020 that shared under 8 cM after Timber can be missing now for\nthat reason alone. AncestryDNA's 2020 update reported only matches of 8 cM or more after Timber\nand removed the smaller ones at the end of August 2020, apart from matches the user had\nmessaged, given a note, starred or put in a group [S7 @2026-11-12], [S8 @2026-11-12]. Its absence neither confirms nor\ndisproves the relationship.","sources":["S7","S8"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-eb64415fc9d3","kind":"platform-ui","anchor":"If the clusters show only as dropdown lists with no grid, count their members before marking\nassociations unverified. Ancestry's July 2025 announcement, as Seaver quotes it, says the grid\nis not shown above 100 clustered matches [S9 @2026-11-12]. Estes saw the message \"Chart view is\navailable for clusters of 100 matches or fewer\" and got a grid by selecting Maternal or\nPaternal, where that side's clusters had 100 members or fewer [S10 @2026-11-12]. Record which\nview the grid came from.","sources":["S9","S10"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-75afe5dd6e6a","kind":"method","anchor":"A match in the clusters of both grandparents on one parent's side most likely descends from\nboth of them: a first cousin through that parent's sibling, or that cousin's descendant.\nPedigree collapse can also put a match in several clusters [S10], [S11]. Read it as a\ncloser relative or a doubled line, not as a clustering error, and do not use it to tie either\ncluster to one grandparent: Leeds notes that a match who shares two grandparents with you\nmerges their clusters [S11].","sources":["S10","S11"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-841e3d3386e9","kind":"platform-ui","anchor":"Leeds (2023-03-27) documents group dots following palette order rather than the order of assignment. Leeds's eight-group scheme uses the middle row from right to left, **green through yellow**: paternal cool colors appear ahead of maternal warm colors. A reader's comment on that post, dated 2024-12-06, reports the dots in the order the groups were created instead, whatever their color [B46 @2026-11-12]. Check the order in your own list. Write a legend linking each color to its ancestral branch.","sources":["B46"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
