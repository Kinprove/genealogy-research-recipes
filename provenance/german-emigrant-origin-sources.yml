claims:
  - {"id":"C-825c339b9322","kind":"unclassified","anchor":"Translate the U.S. clue into the historical territory (the lectures call it the \"nobility area\"; in German, Territorium or Land). Then list that territory's upper, middle and lower government levels. The presenter uses a chart that names, for each territory, the office that kept emigration records. Search the catalogue under that office, not just under the state name. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a5c5a61bbabd","kind":"unclassified","anchor":"Do not rule out a middle level just because the territory is not Prussia. The presenter says only the Kingdom of Prussia had a middle level, but that is wrong. Bavaria set up mid-level Kreise/Regierungsbezirke in 1808, and by 1871 most states of the Empire had adopted the idea. The same lecture also shows a Bavarian middle-level catalogue entry (§ 2). Check every level the territory actually had. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f478514ea33c","kind":"unclassified","anchor":"Hessen example (the Grand Duchy of Hesse, called \"the duchy of Hessen\" in the lecture): the upper level was three provinces (Oberhessen, Rheinhessen, Starkenburg). The presenter says emigration records were not kept at province level. They were kept by the district (Kreis) offices. In his catalogue example, a district-level emigration series holds the file for one family's emigration, dated 16 October 1854. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6aa3887d4d48","kind":"unclassified","anchor":"Expect these files to be handwritten, with several documents per emigrant. The presenter treats them as a last resort after indexes. [S1] A second presenter, who has translated many of them, says permission files record [S6]:","sources":["S1","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-292e4a730123","kind":"unclassified","anchor":"Access: search the FamilySearch catalogue under the town and under the district office for your years before you plan anything around these files. Finding an office does not mean its files survive, were filmed or are online. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-702b84129f40","kind":"unclassified","anchor":"- **Government office as author:** an official record.\n- **Individual compiler as author:** a resource, even if its title looks like an official emigration register or it is catalogued under a government district. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-645533c671f3","kind":"unclassified","anchor":"- A Bavarian middle-level catalogue entry that is compiled by an individual. [S2]\n- Two Rheinhessen emigration compilations listed under the province: one on emigration in the 1700s and 1800s, credited to Helmut Schmahl, and one on emigration to Texas, credited to Hans Richter (names spelled from the lecture audio; the Richter work has not been located). [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2d65afe7fa6a","kind":"unclassified","anchor":"The presenter says these compilations were built from passenger lists and port records, so they often include people who left without permission and are missing from the official files. [S2] Search them, but list them in your source register as compilations. Agreement between a compilation and the passenger list it was built from is not two independent sources.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7d961d8740ce","kind":"unclassified","anchor":"For every published state or district index, write down its stated geography, date range, arrangement and whether it covers permitted emigrants only, before you search it. Indexes the presenter describes [S1]:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dbda3eda8147","kind":"unclassified","anchor":"- **Württemberg** emigration index by Trudy Schenk and Ruth Froelke: eight volumes (1986–2002). Fields are emigrant, birth date, birthplace and emigration date, plus Oberamt, destination and film number. Do not assume it covers every Oberamt: check the published volume-by-volume list for yours. It lists only people who had permission to emigrate, 1808–1890. A person who left without permission can be missing from it legitimately.\n- **Former Duchy of Braunschweig** (Gruhne, *Auswandererlisten*, 1846–1871): excludes the city of Braunschweig and Landkreis Holzminden. A \"born in Braunschweig\" person can therefore be missing from it legitimately. Note too that \"Braunschweig\" was both a city and a duchy.\n- **Duchy of Nassau**, 1806–1866 (Struck, *Die Auswanderung aus dem Herzogtum Nassau 1806–1866*).\n- **Westphalia**: the Prussian province had three government districts (Münster, Minden, Arnsberg). The work the presenter shows indexes one of them. Published Müller/Holz emigrant lists exist for both Münster and Minden. Record which district's list you searched. A miss covers only that district.\n- **Westerwald**: a landscape area that cuts across several territories and provinces. The book the presenter shows covers people who emigrated from it to America in the 1700s.\n- **Bremen–New York passenger lists** (Zimmerman & Wolfert, *German Immigrants: Lists of Passengers Bound from Bremen to New York*): four volumes (1847–54, 1855–62, 1863–67, 1868–71). They include only passengers whose specific place of origin was given. Entries give the home place with a territory abbreviation, for example \"Khe\" for Kurhessen. A passenger without a stated origin is not in them.\n- **Original Bremen and Hamburg departure lists.** Most Bremen lists are lost. From 1875 to 1908, lists older than three years were discarded for lack of space, and nearly all the rest were lost in World War II. About 3,000 lists from 1920–1939 survive, held by the Bremen Chamber of Commerce, and are indexed online at passagierlisten.de. [S12] Before 1920, apart from a few fragments, no Bremen departure list survives, so search the arrival manifest. The Hamburg emigrant lists in the Staatsarchiv Hamburg cover 1850–1934. [S13] They give each emigrant's name, place of origin and destination. They are searchable on Ancestry, which is free of charge in the Staatsarchiv reading room and at the BallinStadt museum. [S13], [S14] Ancestry labels the place as the residence (*Wohnort*). [S14] Treat it as the last home, not as the birthplace. A Hamburg miss counts only for the years your search platform indexes. For pairing a departure list with the arrival, see [U.S. immigration search recovery § 5](usa-immigration-search-recovery.md#5-recover-an-arrival-through-the-departure-list).\n- **Ortsfamilienbücher (village family books).** Online books are listed at online-ofb.de; many exist only in print. [S15] A hit gives a candidate village. A miss counts only for the registers and years the book covers. For reading a book and its scope note, see [German register recovery § 7](german-register-image-recovery.md#7-classify-the-register-version-behind-every-image).","sources":["S12","S13","S14","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f40bdbb57f66","kind":"unclassified","anchor":"- **Baden-Württemberg:** the emigrant index reached through the LEO-BW portal. One thread used an entry from it to date a departure (§ 7). [S9]\n- **Hessen:** the Hessian emigrant data in LAGIS, built from the Marburg HESAUS database and older Darmstadt card indexes. Another thread matched one village's LAGIS entries to settlers at the destination (§ 5). [S11]","sources":["S9","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8710f7b0d7df","kind":"unclassified","anchor":"A miss counts only for the index's stated extent. Record it as \"not in [index], which covers X and excludes Y\". Do not record it as \"not from [state]\". Also search across levels and landscape areas, not just the one unit you first identified. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ebb57d297638","kind":"unclassified","anchor":"According to the presenters, permission required paying fees, filling out forms, paying off debts and completing military obligation, and many people left without it to avoid those steps. Others left after the failed 1848 revolution because they faced prosecution. Such people are absent from the regular permission files. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7a4a7f3e9db3","kind":"unclassified","anchor":"Look for a separate series or volume for them. The presenter's example is Müller's two-part work for the Regierungsbezirk Minden in Westphalia [S3]:","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ebc7d3c842e7","kind":"unclassified","anchor":"Use the back index in Part II: take the person's assigned number and page, then open the entry. In his example the entry gives birthplace, birth date and parents. [S3] Write down the number, page and volume. An index line alone is not the entry.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7f6e0ac2cc5d","kind":"unclassified","anchor":"- **District gazettes (Kreisblatt, Amtsblatt).** A forum participant collected 1867 notices from one district gazette. They included statements of intent to emigrate, giving residence, occupation, the wife's maiden name and the number of children. They also included creditor calls and auctions of the same man's livestock, household goods and house, spread over several months. Read the notices together to date the break-up of the household. [S8]\n- **Municipal council minutes and subsidies.** One participant posted council minutes from a Bavarian village (1852 and 1864) granting community money towards poor residents' passage to America. The same post lists that village's emigrants as reported both to the district office and to the regional government. Note which level each list came from (§ 1). Another post records that a Baden municipality gave a penniless woman a travel subsidy in 1849 so she could join her husband in North America. [S7]\n- **Guardianship, estate and power-of-attorney files.** A published inventory of emigration sources in the Rhineland-Palatinate and Saarland state archives lists guardianship and estate files with inheritances for children who had emigrated. Another post cites a 1787 power of attorney sent from Maryland to manage a house, property and an inheritance at home (Landesarchiv Saarbrücken, HV K 55). Emigrants kept appearing in such files for years after they left. [S7]","sources":["S8","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3c738bd8a229","kind":"unclassified","anchor":"The German Immigrants in American Church Records series is ongoing. The presenter said there were 40 volumes in April 2024. The author's volume page, checked 2026-11-07, says Pennsylvania volumes 47–49 have been produced; consult that page and its congregation lists for the current scope. [S16] Volumes are grouped by U.S. state, but not strictly one per state: some cover a single city, several states, or \"Revisited\" parts. Each volume has an every-name index in the back. [S4]","sources":["S16","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a3231ae165e2","kind":"unclassified","anchor":"Steps [S4]:","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-858d6c4704cb","kind":"unclassified","anchor":"The presenter says the series is print-only and recommends buying a volume only once you know it extracts your ancestor's church. If the ancestor's congregation is not on the list, a miss says nothing about them. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fa457f17b385","kind":"unclassified","anchor":"If a passenger list or census places the emigrant in a small place that was not a common destination, suspect chain migration from one home village. A forum example shows how to test it [S11]:","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-14a2a02ffea6","kind":"unclassified","anchor":"Do not equate \"Hessian\" with Hesse-Kassel. German auxiliary troops came from Hesse-Kassel, Hesse-Hanau, Waldeck, Brunswick, Ansbach-Bayreuth and Anhalt-Zerbst. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8a2837b90e5","kind":"unclassified","anchor":"For a German who first appears in America in that period, search HETRINA (*Hessische Truppen im Amerikanischen Unabhängigkeitskrieg*), a six-volume printed index whose data is online in LAGIS Hessen, searchable by name or place of origin. Its fields include [S1]:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-456bddd28047","kind":"unclassified","anchor":"Pin the soldier to a specific town before you search church records. Otherwise a same-named man who stayed in Europe can be taken for him. [S5] Loyalist sources are a separate route and are not covered here. [S1]","sources":["S5","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-53fefc79512c","kind":"unclassified","anchor":"Take every index candidate to the original birth or baptism register of the named place that fits the candidate's confession and date: the parish church register, the Jewish community register, or the civil register once civil registration had begun. The presenter's Württemberg example shows why [S1]:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b109efe41059","kind":"unclassified","anchor":"Record illegitimacy, a named father, legitimation and any later surname change exactly as written. If several census or index candidates fit, compare them on birth year, spouse and residence first, then confirm in the register. [S1] Identity rulings belong in the evidence/proof recipe linked above.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-70ae2ce6dc5f","kind":"unclassified","anchor":"Search the emigrant index and the passenger lists first inside that window. Widen it if the bounding events do not prove the person was present, since a man could leave before his last child was born. In one forum example, the window was 1851–1853, and a LEO-BW emigrant-index entry narrowed it to 1852 and showed that he left without his wife. If a spouse is missing from the departure, search the home parish's death register within the window. Her absence does not prove she died. [S9]","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bea5b127e623","kind":"unclassified","anchor":"- an entry recording that he was actually mustered (examined) that year gives an earliest departure date; an entry without a recorded examination is only a lead;\n- the field for the conscript's current residence can name an interim town worth searching. [S10]","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
