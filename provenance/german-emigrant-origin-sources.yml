claims:
  - {"id":"C-825c339b9322","kind":"unclassified","anchor":"Translate the U.S. clue into the historical territory (the lectures call it the \"nobility area\"; in German, Territorium or Land). Then list that territory's upper, middle and lower government levels. The presenter uses a chart that names, for each territory, the office that kept emigration records. Search the catalogue under that office, not just under the state name. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a5c5a61bbabd","kind":"unclassified","anchor":"Do not rule out a middle level just because the territory is not Prussia. The presenter says only the Kingdom of Prussia had a middle level, but that is wrong. Bavaria set up mid-level Kreise/Regierungsbezirke in 1808, and by 1871 most states of the Empire had adopted the idea. The same lecture also shows a Bavarian middle-level catalogue entry (§ 2). Check every level the territory actually had. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f478514ea33c","kind":"method","anchor":"In the Grand Duchy of Hesse, work down from the province (Oberhessen, Rheinhessen or Starkenburg) to the *Kreisamt*. The catalogue case dated 16 October 1854 concerns a family in a district emigration series [S1], [S2]. In the Darmstadt finding aid, start with G 15 for *Kreis- und Landratsämter*. Record the district and file reference before ordering the papers [S21].","sources":["S1","S2","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6aa3887d4d48","kind":"unclassified","anchor":"Expect these files to be handwritten, with several documents per emigrant. The presenter treats them as a last resort after indexes. [S1] A second presenter, who has translated many of them, says permission files record [S6]:","sources":["S1","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-292e4a730123","kind":"unclassified","anchor":"Access: search the FamilySearch catalogue under the town and under the district office for your years before you plan anything around these files. Finding an office does not mean its files survive, were filmed or are online. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-702b84129f40","kind":"unclassified","anchor":"- **Government office as author:** an official record.\n- **Individual compiler as author:** a resource, even if its title looks like an official emigration register or it is catalogued under a government district. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-645533c671f3","kind":"unclassified","anchor":"- A Bavarian middle-level catalogue entry that is compiled by an individual. [S2]\n- Two Rheinhessen emigration compilations listed under the province: one on emigration in the 1700s and 1800s, credited to Helmut Schmahl, and one on emigration to Texas, credited to Hans Richter (names spelled from the lecture audio; the Richter work has not been located). [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2d65afe7fa6a","kind":"unclassified","anchor":"The presenter says these compilations were built from passenger lists and port records, so they often include people who left without permission and are missing from the official files. [S2] Search them, but list them in your source register as compilations. Agreement between a compilation and the passenger list it was built from is not two independent sources.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7d961d8740ce","kind":"unclassified","anchor":"For every published state or district index, write down its stated geography, date range, arrangement and whether it covers permitted emigrants only, before you search it. Indexes the presenter describes [S1]:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dbda3eda8147","kind":"unclassified","anchor":"- **Württemberg** emigration index by Trudy Schenk and Ruth Froelke: eight volumes (1986–2002). Fields are emigrant, birth date, birthplace and emigration date, plus Oberamt, destination and film number. Do not assume it covers every Oberamt: check the published volume-by-volume list for yours. It lists only people who had permission to emigrate, 1808–1890. A person who left without permission can be missing from it legitimately.\n- **Former Duchy of Braunschweig** (Gruhne, *Auswandererlisten*, 1846–1871): excludes the city of Braunschweig and Landkreis Holzminden. A \"born in Braunschweig\" person can therefore be missing from it legitimately. Note too that \"Braunschweig\" was both a city and a duchy.\n- **Duchy of Nassau**, 1806–1866 (Struck, *Die Auswanderung aus dem Herzogtum Nassau 1806–1866*).\n- **Westphalia**: the Prussian province had three government districts (Münster, Minden, Arnsberg). The work the presenter shows indexes one of them. Published Müller/Holz emigrant lists exist for both Münster and Minden. Record which district's list you searched. A miss covers only that district.\n- **Westerwald**: a landscape area that cuts across several territories and provinces. The book the presenter shows covers people who emigrated from it to America in the 1700s.\n- **Bremen–New York passenger lists** (Zimmerman & Wolfert, *German Immigrants: Lists of Passengers Bound from Bremen to New York*): four volumes (1847–54, 1855–62, 1863–67, 1868–71). They include only passengers whose specific place of origin was given. Entries give the home place with a territory abbreviation, for example \"Khe\" for Kurhessen. A passenger without a stated origin is not in them.\n- **Original Bremen and Hamburg departure lists.** Most Bremen lists are lost. From 1875 to 1908, lists older than three years were discarded for lack of space, and nearly all the rest were lost in World War II. About 3,000 lists from 1920–1939 survive, held by the Bremen Chamber of Commerce, and are indexed online at passagierlisten.de. [S12] Before 1920, apart from a few fragments, no Bremen departure list survives, so search the arrival manifest. The Hamburg emigrant lists in the Staatsarchiv Hamburg cover 1850–1934. [S13] They give each emigrant's name, place of origin and destination. They are searchable on Ancestry, which is free of charge in the Staatsarchiv reading room and at the BallinStadt museum. [S13], [S14] Ancestry labels the place as the residence (*Wohnort*). [S14] Treat it as the last home, not as the birthplace. A Hamburg miss counts only for the years your search platform indexes. For pairing a departure list with the arrival, see [U.S. immigration search recovery § 5](usa-immigration-search-recovery.md#5-recover-an-arrival-through-the-departure-list).\n- **Ortsfamilienbücher (village family books).** Online books are listed at online-ofb.de; many exist only in print. [S15] A hit gives a candidate village. A miss counts only for the registers and years the book covers. For reading a book and its scope note, see [German register recovery § 7](german-register-image-recovery.md#7-classify-the-register-version-behind-every-image).","sources":["S12","S13","S14","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f40bdbb57f66","kind":"portal-availability","anchor":"- **Baden-Württemberg.** The Landesarchiv’s guide directs name and place searches to the LEO-BW emigration database [S22 @2026-11-19]. Copy the archive signature as well as the emigration year.\n- **Hessen.** The Hessisches Landesarchiv identifies the Darmstadt, Marburg and Wiesbaden indexes in the LAGIS *Hessische Auswanderer* module. In Marburg, the underlying HESAUS index draws on names in multiple record series [S21 @2026-11-19]. Check the office and dates before interpreting a miss.","sources":["S22","S21"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8710f7b0d7df","kind":"unclassified","anchor":"A miss counts only for the index's stated extent. Record it as \"not in [index], which covers X and excludes Y\". Do not record it as \"not from [state]\". Also search across levels and landscape areas, not just the one unit you first identified. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ebb57d297638","kind":"unclassified","anchor":"According to the presenters, permission required paying fees, filling out forms, paying off debts and completing military obligation, and many people left without it to avoid those steps. Others left after the failed 1848 revolution because they faced prosecution. Such people are absent from the regular permission files. [S2], [S3]","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7a4a7f3e9db3","kind":"unclassified","anchor":"Look for a separate series or volume for them. The presenter's example is Müller's two-part work for the Regierungsbezirk Minden in Westphalia [S3]:","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ebc7d3c842e7","kind":"method","anchor":"In Part II of the Minden work, follow the alphabetical index to the assigned number and page. The entry for Abraham Jacoby gives his parents, Hartum as his birthplace and 5 May 1830 as his birth date [S3]. Record volume, page and number, then check the baptism under the recorded place and date.","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7f6e0ac2cc5d","kind":"method","anchor":"- **District gazettes (*Kreisblatt*, *Amtsblatt*).** Search adjacent issues for the same household, property and creditors. In the 1867 *Eisenacher Kreis-Blatt*, no. 62 announced an April sale of Caspar Dietzel’s livestock and goods at Krauthausen. Supplements to nos. 115 and 117 advertised his house, land or household effects in July. No. 121 called for creditor claims in August [S8]. These notices date the household’s dispersal. A notice of intent may also supply a spouse’s maiden name and the number of children. Verify departure separately.\n- **Municipal council minutes and subsidies.** Check the minutes and reports sent to both district and regional offices. Helmstadt council voted passage aid in 1852 and 1864. At Wangen in 1849, Maria Josepha Reitze received travel money to join her husband already in North America [S7]. Search council decisions under a spouse who followed later.\n- **Guardianship, estate and powers of attorney.** An heir overseas may appear in the home court’s papers long after leaving. Follow the forum’s locator to the bilingual power of attorney of 13 March 1787, Landesarchiv Saarbrücken, HV K 55. A man in Maryland empowered a Philadelphia agent to handle his house, property and inheritance in Europe [S7]. Verify the names and relationships against the instrument.","sources":["S8","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3c738bd8a229","kind":"unclassified","anchor":"The German Immigrants in American Church Records series is ongoing. The presenter said there were 40 volumes in April 2024. The author's volume page, checked 2026-11-07, says Pennsylvania volumes 47–49 have been produced; consult that page and its congregation lists for the current scope. [S16] Volumes are grouped by U.S. state, but not strictly one per state: some cover a single city, several states, or \"Revisited\" parts. Each volume has an every-name index in the back. [S4]","sources":["S16","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a3231ae165e2","kind":"unclassified","anchor":"Steps [S4]:","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-858d6c4704cb","kind":"unclassified","anchor":"The presenter says the series is print-only and recommends buying a volume only once you know it extracts your ancestor's church. If the ancestor's congregation is not on the list, a miss says nothing about them. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fa457f17b385","kind":"method","anchor":"Test chain migration by comparing households at the destination with emigrants recorded at the candidate village [S11].","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-14a2a02ffea6","kind":"unclassified","anchor":"Do not equate \"Hessian\" with Hesse-Kassel. German auxiliary troops came from Hesse-Kassel, Hesse-Hanau, Waldeck, Brunswick, Ansbach-Bayreuth and Anhalt-Zerbst. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8a2837b90e5","kind":"unclassified","anchor":"For a German who first appears in America in that period, search HETRINA (*Hessische Truppen im Amerikanischen Unabhängigkeitskrieg*), a six-volume printed index whose data is online in LAGIS Hessen, searchable by name or place of origin. Its fields include [S1]:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-456bddd28047","kind":"unclassified","anchor":"Pin the soldier to a specific town before you search church records. Otherwise a same-named man who stayed in Europe can be taken for him. [S5] Loyalist sources are a separate route and are not covered here. [S1]","sources":["S5","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-53fefc79512c","kind":"method","anchor":"Check the original birth or baptism register for the candidate’s place, confession and date. In a Württemberg baptism, Johann Michael’s entry recorded birth outside marriage and named his father. The later marriage and the father’s subsequent legitimation were distinct events [S1]. Search under the mother’s surname at birth and the father’s surname in later records. Date each name from the entry that uses it.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b109efe41059","kind":"unclassified","anchor":"Record illegitimacy, a named father, legitimation and any later surname change exactly as written. If several census or index candidates fit, compare them on birth year, spouse and residence first, then confirm in the register. [S1] Identity rulings belong in the evidence/proof recipe linked above.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-70ae2ce6dc5f","kind":"method","anchor":"Search the emigrant index and the passenger lists within the time window. A child’s birth at home supplies a family date without necessarily placing the father there [S9]. After an 1851 birth in Ebnat and an 1853 Ohio remarriage, the 1852 Max Grupp index entry is a lead to the Stuttgart original, HStAS E 143 Bü 488 Qu 38. It lists one adult and four children and says the wife or mother is unlisted [S23]. Search manifests for the party and Ebnat’s burial register for the spouse. Her omission alone cannot establish her death or her travel date.","sources":["S9","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bea5b127e623","kind":"unclassified","anchor":"- an entry recording that he was actually mustered (examined) that year gives an earliest departure date; an entry without a recorded examination is only a lead;\n- the field for the conscript's current residence can name an interim town worth searching. [S10]","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-11657ef80f9a","kind":"historical","anchor":"For a German-born person present in the United States in 1870, inspect the census image's\nbirthplace column before accepting a broad index label of Germany. Enumerators were instructed\nto give the state, such as Prussia, Baden or Bavaria. Keep the literal answer as a territory\nlead; the instruction does not guarantee compliance and a state is not the home town.\n[S17], [S18]","sources":["S17","S18"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-178a22b4b828","kind":"historical","anchor":"Do not route every German-born Revolutionary War participant into HETRINA. German-speaking\nregiments also served in the Continental Army, and Royal Deux-Ponts served the French crown.\nIdentify the actual army and unit from service evidence before choosing an auxiliary-troop\nindex. Neither German birth nor a HETRINA miss selects one of those service histories.\n[S19], [S20]","sources":["S19","S20"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3bb04717d82b","kind":"method","anchor":"1. Read the census page around the ancestor, including nearby lines.\n2. Look for a local settlement history or newspaper article that lists early settlers.\n3. Compare those names with the candidate village's emigrant list and church book.\n4. Check the reported passenger group against both places. A contributor transcribed the 5 August 1847 Baltimore arrival of the *President Smidt* from Bremen, with a group from “Rehrta” bound for “Dionesta.” Röhrda emigrant entries and early settlers around Tionesta, Pennsylvania, suggest identities to test for these passengers [S11]. Keep each person’s arrival year separate from later migrants on the same route.","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9f1f0a4a5877","kind":"platform-ui","anchor":"**Rhineland.** For a deceased emigrant who may have left the Rhineland in 1814–1939, search\nMyHeritage’s *Germany, Rhineland Emigrants, 1814-1939* index by name. Narrow the search with\nany known birth year, origin, departure year or destination [S24 @2026-09-19], [S25 @2026-09-19].\nUse the indexed origin as a candidate locality for the register search in § 7.","sources":["S24","S25"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fedca616c37c","kind":"portal-availability","anchor":"For an archival file reference, search Landesarchiv NRW’s *Auswanderer aus dem Rheinland*,\nFindbuch 200.01.01, by surname. Check the listed offices and the finding aid’s own span\n(1816–1934) before interpreting a miss. Copy the fonds, file number and folio. If the cited\nfolio records only the formal release, look on the preceding folios for the application\n[S26 @2026-09-19].","sources":["S26"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-112ed248cdfe","kind":"method","anchor":"For a nineteenth-century German emigrant whose route passed through a Bessarabian colony,\nidentify the colony's parish and confession and read its early registers for a named place of\norigin. Keep the colony, any previous residence and the candidate birth parish as separate\nplaces. Check the candidate parish in § 7 [S27], [S41], [S42].","sources":["S27","S41","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-941c171194a8","kind":"portal-availability","anchor":"When a nineteenth-century lead points to Brandenburg, search the *Auswandererkartei* for\nthe Regierungsbezirk Potsdam or Frankfurt (Oder), including for departures before the\nHamburg lists begin. Use the Brandenburgisches Landeshauptarchiv catalogue or the Ancestry\nindex. Search for the head of household when the emigrant was a child. Copy the birth date,\nbirthplace, residence and archive signature when given. The main group of permissions\nbehind the index spans 1809–1873. On a miss, search Rep. 2 A for Potsdam or Rep. 3 B for\nFrankfurt (Oder) by year, last residence and destination\n[S27 @2026-11-22], [S28 @2026-11-22].","sources":["S27","S28"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-17edad7e19cb","kind":"method","anchor":"Use the signature to locate the original permission file. For a copy of the index card,\ncheck the FamilySearch catalogue under *Auswanderungskartei* and match the district and\nsurname range before using a filmed card [S27], [S29]. Verify the index and card's\nhousehold, locality and dates against the file. Count the card and its transcription\nas one evidence trail [S28].","sources":["S27","S29","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-117a3bde1580","kind":"method","anchor":"Record the date labelled *Auswanderungskonsens* as the approval date. Establish the actual\ndeparture separately from voyage evidence [S27], [S28]. Read both sides of a family card.\nA card side that gives only the parents, residence, approval date and number of children\ncan have the children's names and exact birth dates on the reverse [S27], [S29].","sources":["S27","S28","S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3b5fee9ec54b","kind":"method","anchor":"For eighteenth-century emigration from southwest Germany, look up the surname in Werner\nHacker's *Eighteenth Century Register of Emigrants from Southwest Germany (to America and\nOther Countries)* (Closson Press, 1994). Copy the named locality and source reference.\nIf an entry cites a manumission, follow it to the release record [S27], [S33].","sources":["S27","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e5f1d7e7881d","kind":"method","anchor":"Use Annette K. Burgert's *Master Index to the Emigrants Documented in the Published Works\nof Annette Kunselman Burgert* to identify the volume that contains the emigrant. Carry the\nshort citation to that volume and read the entry there for the origin clue [S27], [S34].","sources":["S27","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5d3d217d170","kind":"method","anchor":"For a family in the 1710 migration to colonial New York, search the name and place index\nin Henry Z. Jones Jr.'s *The Palatine Families of New York — 1710*. Use the family's entry\nto identify the German records to check. A broad label of Palatine by itself gives no\nreason to expect an entry [S27], [S35].","sources":["S27","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fcc3d963dd42","kind":"portal-availability","anchor":"**Hesse.** For a deceased emigrant tied to Hesse, search MyHeritage's *Germany, Hesse\nEmigrants* by name. Its stated dates start in 1539. Copy the birth date, departure date\nand place, and reported destination wherever the entry gives them. Use the departure place\nto choose a district or locality to investigate. Compare the index hit with the LAGIS\nentry and follow any archival reference before naming a birth parish\n[S36 @2026-11-22], [S37 @2026-11-22].","sources":["S36","S37"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e485fc1975f5","kind":"method","anchor":"Use ship and route evidence to choose which port records to search. Check the surviving\nyears and record type for that port before drawing a conclusion from a miss [S27].","sources":["S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0e8006cfe841","kind":"method","anchor":"**Antwerp, 1855.** Use Charles M. Hall's *The Antwerp Emigration Index* as a locator for\nthe Antwerp shipping register (inventory K001, no. 1309). Check the ship and passenger in\nthe register when accessible. Hall's index contains errors and covers that year's register\nonly [S30].","sources":["S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8391922e520f","kind":"method","anchor":"**Le Havre.** For a French liner that returned to Le Havre, find the return date in the\nlocal shipping news. Use it with INV 334 to locate the *rôle de désarmement* in series 1 Mi\nor 2 Mi and check it for a passenger list. A missing name leaves the crossing unresolved,\nespecially for a third-class passenger [S31].","sources":["S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ed44ba39d635","kind":"portal-availability","anchor":"**Stettin and Swinemünde.** Search the port indicated by the route in Ancestry's *Pomerania,\nGermany, Passenger Lists, 1869–1901*. Check the port's own years before searching. The\ndates in the collection title combine coverage from both ports [S32 @2026-11-22].","sources":["S32"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1160d38fe3a3","kind":"method","anchor":"When the target's village is unknown, search the U.S. records of neighbors, coworkers and\nextended family who may have migrated with them. Test those people's named hometowns\nagainst the target's own records [S27].","sources":["S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-596769a33785","kind":"method","anchor":"For a Quincy, Illinois, cluster, look up the emigrant in Michael K. Brinkman's compilations.\nUse the suggestion from the available excerpt of the Quincy talk and test the home villages\nof fellow migrants against the target's own records [S38]. For Emsland, Oldenburger\nMünsterland and Osnabrücker Land, use the surname index in the single volume, which also\nincludes corrections to entries in the Westphalia set [S39]. For Münsterland, Westphalia,\nsearch Volume II by surname or use the numbers in Volume I to reach the biographies in\nVolume II [S40].","sources":["S38","S39","S40"],"checked":null,"stated_as":"observation","review":"reviewed"}
