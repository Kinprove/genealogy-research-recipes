claims:
  - {"id":"C-989a09ad2eea","kind":"platform-ui","anchor":"Identify the cathedral chapter serving the parish at the time. Search Astia for the chapter name or tuomiokapituli*, open the matching creator card, and browse for the circulars (*kiertokirjeet*, *cirkulärbref*) by dispatch date or number. Check Turku's own archive arrangement when searching for an Åbo circular. [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-93f52ce6b69c","kind":"historical","anchor":"For Porvoo (*Borgå*) circulars of 1725–1829, look up A. J. Hornborg's 1872 *Sammandrag af Domkapitlets i Borgå härförinnan otryckta Cirkulärbref*, arranged alphabetically and chronologically. Cite the entry as a printed summary and use it to locate the circular. Kyläkoski points to page 252 for the 1828–29 notices and pairs Turku circular and printed references, including ÅCB 243 and VII:571 for the peace thanksgiving. Carry both reference parts into retrieval. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4a0a7846a4f0","kind":"method","anchor":"Record the triggering event, each chapter's dispatch, the stated reason, and any prescribed date separately. Read the reason in the circular before grouping it with other observances. A victory notice and a later peace thanksgiving can concern the same war. For mourning, keep the death, funeral, bell-ringing instructions and prescribed mourning day as separate entries. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-40d4c15cb194","kind":"example","anchor":"Establish each parish's observance from a local report or parish record. Kyläkoski cites Helsinki newspaper reports for a peace service on 18 October 1829, before the circulars dated 21 October. Check issues on both sides of the dispatch date and keep preliminary news, official publication and local performance in separate rows. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-01052dfc4f17","kind":"method","anchor":"Resolve *eiläinen* (yesterday) from a dated local dispatch and keep the issue date in the citation. If the dispatch lacks a date, use independent evidence such as the proclamation to test the proposed date and leave the local date open if the evidence does not settle it. Extend the issue search into later weeks for reports of the same observance. [S1] [S5]","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-18a3d46baeca","kind":"method","anchor":"Distinguish the service from a dedication, illumination, private celebration or collection. Record who organized each activity and what occasion the account gives. Keep crowd estimates distinct from attendance inside the church, and proposed parish spending distinct from expenditures reported after the event. [S1] [S5]","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
