claims:
  - {"id":"C-000000000001","kind":"method","anchor":"Keep searching for debt imprisonment in 1896. Use the enforcement law’s commencement in 1897 to route a new proceeding around the reform. Compare the date a case began with the dates of individual orders and entries before assigning a later document to a new proceeding [S2] [S3].","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"custody","anchor":"Use the locality and period enforcement official to find the relevant archive. Search Astia by the name of the creator, such as a town bailiff (*kaupunginvouti*), Crown bailiff (*kruununvouti*) or other authority named in the document. Read the order and its execution papers together [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"method","anchor":"Record the creditor’s application and legal basis separately from the commitment, admission and release. Treat confinement as evidence of enforcement pressure. Leave the debtor’s ability to pay, any concealed property, actual labor and the amount recovered open until the documents establish them. Distinguish upkeep charges from sums credited against the debt [S1] [S2] [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"When the confinement trail stops, search the relevant lower court’s bankruptcy case papers. Match the debtor, creditor, date and amount to the enforcement papers. Read the petition, estate inventory and claims, then look for any decision or distribution record that establishes the debt’s outcome [S1] [S2] [S5].","sources":["S1","S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
