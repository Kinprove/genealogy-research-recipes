claims:
  - {"id":"C-01","kind":"custody","anchor":"Identify the parish’s diocese at the event date. For Turku, take the circular number and printed volume and page from the citation to the corresponding bundle. For the 1815 thanksgiving and 1817 Reformation jubilee, use archive unit B III:5 and look for ÅCB 174, IV:195 and ÅCB 181, IV:257 respectively [S4 @2026-11-23] [S3 @2026-11-23] [S1 @2026-11-23].","sources":["S4","S3","S1"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For Porvoo, search Hornborg’s 1872 *Sammandrag* by subject or date. For the 1815 thanksgiving and 1817 jubilee, start on printed pages 250 and 97 respectively. Record each entry as a published abstract of the circular and keep its citation distinct from a copy of the issued order [S2] [S1].","sources":["S2","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Compare the local report with both cathedral chapters’ instructions before assigning the observance a wider scope. For the 1817 jubilee use the paired circulars to test where it was directed. Keep the date of the occasion, each circular’s date, the prescribed timing and the local report in separate fields [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"If the circulars leave an observance unresolved, check the local press for a service actually reported. For the 1816 Turku and 1817 Uusikaarlepyy name-day services, check *Åbo Allmänna Tidning*, issue 111 of 19 September 1816 and issue 119 of 11 October 1817. The reported 1816 service in Turku leaves the scope of the direction unresolved [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9247393041f9","kind":"method","anchor":"Search A. J. Hornborg’s 1872 *Sammandrag af Domkapitlets i Borgå härförinnan otryckta cirkulärbref (1725–1829)* alphabetically by occasion and chronologically by year. Record the event, circular or dispatch date, and any specified service date separately. When a royal birth and the queen’s recovery yield different entries, retain the separate occasions [S5], [S6], [S2].","sources":["S5","S6","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-22441f623b5a","kind":"custody","anchor":"Use the circular date and occasion to search the National Archives of Finland’s *Porvoon tuomiokapitulin arkisto I*. If the abstract is silent or the intended date is missing, check surviving diocesan papers and the named parish archive for instructions, copies or contemporary notes [S5 @2026-11-22], [S7 @2026-11-22].","sources":["S5","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f6a592a51aa8","kind":"method","anchor":"Search *Posttidningar* and *Inrikes Tidningar* for accounts from the target parish and other parishes covered by the same order. Use the issue date to find the account, then read the date and place of the actual service in the text. Keep the report date separate. Require an explicit church service or prayer before counting a civic celebration as an observance [S5], [S6].","sources":["S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2bdf5d0a3828","kind":"method","anchor":"If places agree, use their dates to guide the search for an intended date and leave other parishes provisional. When a parish differs, check the local report for delayed delivery or an extension. When a circular is missing, keep open a local observance, including a royal funeral, and check the press or parish papers before drawing a negative conclusion [S5], [S6].","sources":["S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4fdabee30456","kind":"example","anchor":"Kyläkoski reports that a Hollola account in *Inrikes Tidningar*, 23 September 1771, gave 6 August as its observance after outlying parishes were allowed an extra week. Use that issue as the locator when testing the local schedule [S5].","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
