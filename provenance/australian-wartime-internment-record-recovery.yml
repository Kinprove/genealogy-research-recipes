claims:
  - {"id":"C-58014626bebf","kind":"method","anchor":"Check the detainee’s status even when the catalogue puts civilian internees and prisoners of war in the same series. According to the community account, a form can carry a civilian internee stamp over a printed prisoner-of-war heading [S1†]. Search the shared file series and transcribe both the heading and any correction [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-28cb41e5a0a6","kind":"method","anchor":"For an Italian detainee, compare prewar Australian residence in arrival or civil records with evidence of overseas military service, capture and transfer. Keep the civilian route open for a naturalised British subject or someone born in Australia. Record the camp number as well as the place, and use it to look for corroboration of the person’s classification [S4] [S5].","sources":["S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4bac7732f8db","kind":"portal-availability","anchor":"Search the National Archives of Australia’s MP1103/1 for Form A112, the Service and Casualty form. Extract the detainee identifier, identity fields, camp movements, hospital admissions and release or repatriation. Search MP1103/2 separately for the intake report or dossier and its residential history, family particulars and supporting papers. If the item search misses in MP1103/2, check the series description and its item list for material outside the online item index [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e67527db2e28","kind":"portal-availability","anchor":"Run NameSearch under the relevant defence, migration or security category. For a variable surname, use a stem of at least three characters followed by an asterisk. Follow with an Advanced search at item level, using the known series reference. Compare the full name, birth details and detainee number before combining results [S7 @2026-11-22] [S8 @2026-11-22].","sources":["S7","S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6ec842a65ee5","kind":"portal-availability","anchor":"For New South Wales, use the Sydney guide to find a C123 service record through C125 by name, C126 by nationality or C127 by location. Check C329 separately for a transcript when there is evidence that the detainee appealed. For exhibits concerning Italian internment, check ST2476/20 [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7a9a66dd0f0c","kind":"portal-availability","anchor":"For Loveday, use name index D4028 to locate the internee’s file in D1901. Check D1920 for nominal rolls and postal censorship extracts [S11 @2026-11-22].","sources":["S11"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-404f514fbf96","kind":"portal-availability","anchor":"For Western Australia, select the register for the relevant war in PP246/2. Check K1171 and PP246/3 for the dossier. For an Italian prisoner of war, also look under the surname in alphabetical series K1174 [S12 @2026-11-22].","sources":["S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-94defd63e738","kind":"portal-availability","anchor":"For Queensland, check BP242/1 for individual internment correspondence. Search BP25/1, BP289/1 and BP4/3 for alien registration records. If the evidence points to Civil Alien Corps service after release, look for a J1737 personnel file [S13 @2026-11-22].","sources":["S13"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-923ddbf40f2e","kind":"portal-availability","anchor":"For surveillance or intelligence correspondence, search A367 for relevant Canberra files and D1915 for relevant Adelaide investigation files. Continue the separate detention file search in parallel. For an Italian emigrant with a lead to political surveillance in Italy, also search the *Casellario politico centrale* by name [S11 @2026-11-22] [S14 @2026-11-22] [S17 @2026-11-22].","sources":["S11","S14","S17"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e19f149cf85a","kind":"method","anchor":"Read an alien registration form independently of the detention papers. Record the residence, personal particulars, family details and photograph when present. Keep any nationality recorded at registration separate from the status attributed in the detention file [S6].","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7f82b3294af0","kind":"portal-availability","anchor":"For Loveday, use Loveday Lives to look for a named biography. For camps around Tatura, use the museum’s camp list to match the number to the location. Use these leads to refine the archive search [S9 @2026-11-22] [S10 @2026-11-22].","sources":["S9","S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9e54e0d4160d","kind":"portal-availability","anchor":"If RecordSearch marks the individual item Not yet examined, use that status to choose the access procedure. If no digital copy is present, check reading-room access and the archive’s current copying terms [S15 @2026-11-22] [S18 @2026-11-22].","sources":["S15","S18"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2faa3a802a70","kind":"portal-availability","anchor":"Apply for access to the identified record through RecordSearch after confirming eligibility and clearance [S15 @2026-11-22].","sources":["S15"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-31200ed1a9de","kind":"portal-availability","anchor":"When Australian records leave a prisoner-of-war or civilian detention gap, check the International Committee of the Red Cross inquiry scope, eligibility and current quota window before preparing a request [S16 @2026-11-22].","sources":["S16"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c3aba96f9a83","kind":"portal-availability","anchor":"Submit a Red Cross detention inquiry for the named person only after confirming the agency’s coverage, current request window and who may apply [S16 @2026-11-22].","sources":["S16"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f7e78fe587e6","kind":"method","anchor":"According to the community account, a dossier can distinguish arrest from intake, a naturalisation application from a grant, and a release on parole from the later date of the report [S1†]. Use the date stated for each event and preserve the date of its document separately.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8f2a97a9955d","kind":"method","anchor":"According to the same account, the property statement can separate ownership shares, physical custody and authority to manage the property [S1†]. Record those roles separately. For a report addressed to the relief and information bureau in Geneva, record the camp as the report’s dated observation. Keep transfers as separate events in the chronology.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
