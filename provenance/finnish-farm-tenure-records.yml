claims:
  - {"id":"C-01","kind":"method","anchor":"Find candidate entries by village and read each farm’s account separately. When a newspaper history and Suomen maatilat use different farm labels, compare the sequence of family names in each candidate entry. Use a matching sequence to choose which holding to test in the court records [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Copy the reporting or submission year from the compiled farm account. Give earlier ownership, construction and renovation dates their own fields. Preserve the stated production period and keep it separate from the reporting year [S11] [S2].","sources":["S11","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Keep separate rows for each holding in the poll-tax roll (*henkikirja*) and land register (*maakirja*). Copy the village, holding number or name, mantal share, tenure label and the role the record attaches to the person. Compare the rows before treating a second cultivator as a formally divided property [S4] [S5].","sources":["S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Check the named holder’s death date before using a land register to date ownership. A reported Pyhänkorva entry carries a deceased holder’s name forward. A single cultivator in the roll supplies a dated listing. Seek a lease or other instrument before assigning the entire estate to that cultivator [S10] [S4] [S5].","sources":["S10","S4","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"If the relevant communion-book pages are missing, use Iso-Iivari’s farmholder compilation to shortlist the farm, holder and possible year of arrival. Carry those leads into the tax and court series [S7] [S8].","sources":["S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"portal-availability","anchor":"For Crown-tax payments, look up the farm, village and use period in the National Library of Finland’s digitized receipt books. Follow the cited Digi binding number. Keep the printed year apart from the years when the book was used and leave a missing farm unresolved [S12 @2026-11-23] [S13 @2026-11-23].","sources":["S12","S13"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Search for the farm and the outgoing owner when a search for the buyer under a later surname fails. Copy both parties as the minutes name them. Use later surnames with given names to find subsequent issues rather than backdating those surnames to the sale [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"example","anchor":"In the reported Paimela example, the seller’s name led to the sale in Iitti court district, KO a:27 (1857), page 1163, where the buyers appear without their later surname [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"In the title registration minutes, record the sale or deed date separately from the date it was presented in court. Copy the holding and shares conveyed, the price, any relationship wording and any retained rights. For a Crown farm, check the inspection proceedings for the prior occupancy grant and any transfer document cited there [S3] [S6].","sources":["S3","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"Find repeat notices for the farm. If a later offer refers to an earlier listing, record its claims about the outcome as the seller’s statement on the later publication date. Keep rental and purchase clauses separate, and align the two issues by beneficiary, tax obligations, payment rate and term, and livestock upkeep [S9].","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"Carry the amount mentioned in each advertisement as an offered or reported amount. Use the completed-sale instrument to establish the buyer, date and price for that transfer. Read any reserved maintenance (*syytinki*) clauses for rights to buildings as well as for upkeep obligations [S9] [S3].","sources":["S9","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"Transcribe the mantal share separately from field area. Keep each field-area estimate with its own measurement basis and record any explicitly excluded slash-burn cultivation (*kytö*) separately. For harvest figures, separate the amount already threshed from the expected yield still to be threshed and retain the seller’s time window and qualifications. Enter potential livestock capacity separately from the stock reported on hand [S9].","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
