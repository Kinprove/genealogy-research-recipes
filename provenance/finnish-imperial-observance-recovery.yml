claims:
  - {"id":"C-a8758c6858cb","kind":"custody","anchor":"Use the parish's cathedral chapter and the date window to select a circular. For the Turku printed series, use B III:4 for circulars 131–159 and B III:5 for 160–189. For Porvoo, use Hornborg's *Sammandrag* (II Eb:2), the register of previously unprinted circulars from 1725–1829, as a locator [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e98862813791","kind":"method","anchor":"For the 1814 Turku orders, start at circulars 168–170. Open the enclosures and check whether a general prayer accompanies a specific report. In the May 1814 material, look for *Sota-Sanomat* by the Finnish opening *Se suuri ja werinen taistelemus* [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-58a69287acbc","kind":"method","anchor":"For an 1812 cross-check, the author reports Turku locators nos. 154, 157 and 159 and Porvoo abstract locators pages 137 and 248 [S6†]. Use those as search targets within the confirmed circular volume and abstract [S2] [S4].","sources":["S6","S2","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f0362256b846","kind":"example","anchor":"Record circular, service and newspaper issue dates separately. The Turku service reported for 6 March 1814 preceded the Turku circular of 9 March. Use *Åbo Allmänna Tidning* of 17 March, no. 31, for the local report [S1] [S7].","sources":["S1","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-094ddbbe0b80","kind":"method","anchor":"For the later 1814 reports cited by Kyläkoski, check *Åbo Allmänna Tidning* nos. 57 (17 May) and 83 (19 July) for thanksgiving reports, and nos. 119 (11 October) and 121 (15 October) for the academy program and the relayed Helsinki account [S1] [S7].","sources":["S1","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4a8c1e4d058f","kind":"method","anchor":"When the paper gives no details of the celebration, check a dated local diary or cathedral account. For Turku and Porvoo in this period, use Sjögren's *Allmänna Ephemerider*, National Library edition (2020). Start with the 24 March 1814 entry for the Turku illumination reported in the community account [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-39745c724451","kind":"method","anchor":"For a December circular, include January in the local date window. The author reports a 17 January service in Raahe after the December 1812 orders and identifies *Åbo Allmänna Tidning* of 6 February 1813, no. 16, as the retrieval target [S6†]. Record the service date only after checking the local account [S7].","sources":["S6","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-135d81d41c49","kind":"method","anchor":"Read the honoree and occasion as written. Tie the reported flags, illumination or bells to a named occasion only when the source or a dated local match supports it. If a report is a reprint, follow the attribution and verify the city of the event before using place-specific details. Keep a possible mixture of accounts unresolved [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
