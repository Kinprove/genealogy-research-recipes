claims:
  - {"id":"C-8f3b2a61d0c7","kind":"method","anchor":"- Reading a precognition as the trial record. It was prepared for the prosecution before the trial and gives neither verdict nor sentence; the minute book gives the outcome. [S2], [S4]\n- Reading a High Court case as proof of murder or another grave crime. The court also tried repeat offenders for lesser crimes and heard appeals from lower courts. [S2], [S4]\n- Calling a case untraced after a miss in the National Records of Scotland (NRS) series AD14, AD15 or JC26. Many precognitions and trial papers did not survive, and a trial without them is linked only to its minute-book entry. [S2]\n- Searching the NRS catalogue with English legal terms such as \"burglary\" or \"manslaughter\". They return no results. [S2]","sources":["S2","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2d7e94c1a5f8","kind":"portal-availability","anchor":"Start with the free High Court index on Scottish Indexes. It covers 1800 to 1916 with over 133,000 entries, which is not every High Court record, and lists the accused and some victims. Each hit gives the full NRS reference, and the index adds ages and other details from sources outside the NRS catalogue. Its guide warns that a catalogue search can miss a name recorded as \"Jane Mitchell alias Scott\", so search each alias separately [S4 @2026-11-16].","sources":["S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a41c6b0e9d32","kind":"platform-ui","anchor":"Then search the NRS online catalogue. Put the accused's name in the \"Search For\" field and AD14, AD15 or JC26 in the \"Reference\" field; a year is optional. NRS has catalogued the trials in full for 1800, 1833–37 and 1840–1930, and its cataloguing of early 19th-century case papers is incomplete. An accused person's entry includes previous convictions where known. Victim names are incomplete and stop with the trials of 1905, because NRS left victim details out of cases less than 100 years old [S2 @2026-11-16].","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6e09d3f72b14","kind":"method","anchor":"Search for a crime by its Scots name: housebreaking, not burglary; culpable homicide, not manslaughter; assault to the injury of the person. [S2]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b7f2054ac9e1","kind":"historical","anchor":"MyHeritage announced its \"Scotland, High Court Precognitions and Trial Papers\" collection in April 2022 as a 138,934-record index of the same three series [S1]. This rests on the announcement alone; carry any hit there to its NRS reference and catalogue entry before you cite it.","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0c93e8d1f647","kind":"historical","anchor":"Older guides and citations name the custodian as the National Archives of Scotland. It merged with the General Register Office for Scotland in April 2011 to form NRS [S5].","sources":["S5"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-94d1b7e0a3c5","kind":"custody","anchor":"- **Precognition:** AD14 for the 19th century, AD15 for the 20th, among the Lord Advocate's Department records [S2 @2026-11-16].\n- **Trial papers (JC26):** the process papers, including the indictment or criminal libel that states the charge, evidence (sometimes physical) and the list of jurors [S4 @2026-11-16].\n- **Minute book (JC8, JC9, JC11, JC12 or JC13):** the court's record of each day of the trial, giving the case's timeline and outcome [S2 @2026-11-16], [S4 @2026-11-16].","sources":["S2","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3a5f1c88e2b0","kind":"method","anchor":"If the precognition or the trial papers did not survive, the NRS catalogue links the trial to its minute-book entry. Search the minute books before you call the case untraced. [S2]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e1b6047d95fa","kind":"portal-availability","anchor":"Some 19th-century minute books are digitised. Their images can be seen free of charge through the NRS High Court Criminal Trials database and the Virtual Volumes in the Historical Search Room, but not online [S2 @2026-11-16].","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7d28c5e0b4a9","kind":"method","anchor":"A precognition is the written report of statements that witnesses, and often the accused, gave before the trial. The Crown prepared it as prosecutor, and it is kept with the Lord Advocate's Department records [S2], [S1]. Log each statement under the witness's role. Take the verdict and sentence from the minute book, never from the precognition. The minute book gives the outcome [S4].","sources":["S2","S1","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1f8a3d6c27e5","kind":"method","anchor":"Do not infer the seriousness of the offence from the court. In the 19th century, repeat offenders, or people deemed criminals \"by habit and repute\", could be tried in the High Court for lesser crimes such as theft or housebreaking [S2]. The court also heard appeals from lower courts such as the sheriff court [S4]. Read the charge in the indictment or the catalogue entry, and check the accused's entry for previous convictions [S2].","sources":["S2","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c05e9b2f7a18","kind":"custody","anchor":"The trial records can be seen only in the NRS Historical Search Room, which has all AD14, AD15 and JC26 papers. Get a reader's ticket and name the records you want at least three days before the visit; order copies through the same search room [S2 @2026-11-16]. Scottish Indexes offers research packages for a reference found in its index [S4 @2026-11-16].","sources":["S2","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-58b2e7a04dc6","kind":"custody","anchor":"NRS gives precognitions and trial papers up to 1914 the access status \"open\", unaffected by closure rules [S2 @2026-11-16], but lists the Crown Office precognitions among records closed for 100 years [S3 @2026-11-16]. For a later case, read the access status on its catalogue entry before you plan a visit or an order.","sources":["S2","S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
