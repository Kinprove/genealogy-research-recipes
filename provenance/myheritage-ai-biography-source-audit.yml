claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Generate a biography for the selected deceased person after clearing the gate. Open the person’s profile (or select their card in Family View) and choose Create AI Biography. Choose Standard for a profile-only run or Enhanced to bring in matching records, trees and web material. Check the options and audience in the user’s account and record the mode and input. If starting from AI Record Finder, open the found historical record and use the biography option in its record view when available. [S1 @2026-11-22], [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"Add documented occupation, education or immigration facts only if the biography control is disabled for a sparse profile and the additions are supported and authorized. Return to the profile and check whether generation is available. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"Open Consistency Issues if the biography shows it, and put each conflicting value in its own evidence row. Follow the footnotes to the contributing historical record, tree profile or web page, then inspect what the item actually says. Use each biography statement as a lead and assign evidentiary weight to the contributing item. Keep an unresolved value open when the cited item does not support the narrative. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"Check the selected person’s tagged photos in the tree when a photo is absent from the narrative. The biography shows a selection of tagged photos. The omission leaves open what is present in the photo collection. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
