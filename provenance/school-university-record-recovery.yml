  - {"id":"S96","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2024/01/surkein-suomalainen-kulttuurihistoriall.html"],"published":"2024-01-19","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Reviewed the community post’s Helsinki school searches on 2026-11-23","entry_sha256":"efaeddecf852a50c024f9c9c43bc88421c27bfc7abe7ecc97a81a2e5e7adb85b","claims":["C-helsinki-school-register-dates-and-sites","C-helsinki-school-move-newspaper-attribution","C-helsinki-shared-elementary-school-holdings"],"review":"reviewed"}
