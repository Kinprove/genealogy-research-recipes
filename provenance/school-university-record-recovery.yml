claims:
  - {"id":"C-1dca4f052ded","kind":"method","anchor":"- List every school of the right type in the town for the attendance years. Do the same for every higher school the person could have reached. Sources for this include:\n  - published annual school reports;\n  - the town’s address-calendar for the relevant year (the 1900 Poltava volume was suggested for Kremenchuk) [S4];\n  - later records naming the school. A report cites Kharkiv marriage entry no. 40 of 1881 for a one-class state Jewish school in Kremenchuk. Use the wording to search education records [S4].\n- Check the faculty as well as the school. Tomsk University admitted its first medical students in 1888 and opened its law faculty in 1898 [S39]. Date a proposed Kyiv private Jewish gymnasium separately against evidence for that institution [S12].\n- Include schools run by other confessions. A researcher reports Jewish graduates at St Petersburg’s Lutheran Petrischule and points to images of graduate lists for at least 1891–1914. Check the pupil’s row for birth date, previous school and, for boys, intended destination [S10].\n- Identify the educational district at the attendance date. An undated list assigns Kholm to Vilna [S2]. The law creating Kholm guberniya dates to 23 June 1912 [S41]. The Kyiv curator’s fond description dates the transfer of Poltava schools to 1839 and Kholm schools to 1912 [S42].\n- Keep the school’s district separate from the archive holding a copy. For Kremenchuk, search Kyiv district records and the graduate lists copied to Moscow. A 1913 seventh-class certificate list was reported in Moscow curator records [S4], [S13].","sources":["S4","S39","S12","S10","S2","S41","S42","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0c20012e0f36","kind":"custody","anchor":"For a Scottish school, check the present holder and any former local-government or regional archive coverage instead of assuming today's county holds everything. Glasgow's guide includes schools from the former Strathclyde region and explains that most of its records follow the 1872 Education (Scotland) Act's implementation in 1873, with few earlier exceptions. Do not use 1870 as Scotland's cutoff or infer that every earlier school lost its records. Separate admissions registers, which can identify pupils, from headteachers' logbooks, which rarely name individual pupils. Only the transcript of the Scottish school-records discussion was inspected; the Glasgow archive guide supports these bounded distinctions. [S35 @2026-11-16](https://www.youtube.com/watch?v=5Wi6WBBuJHg) [S36 @2026-11-16](https://www.glasgowlife.org.uk/libraries/family-history/stories-and-blogs-from-the-mitchell/ask-the-archivist/ask-the-archivist-school-records)","sources":["S35","S36"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-24340f9f5302","kind":"method","anchor":"- For the two Pryluky girls’ gymnasiums, use the Chernihiv archive’s published register to choose the inventory [S40]. The forum suggested both fonds from their size [S1].\n  - The Fedorenko private gymnasium, f.1440, has 263 files for 1907–1920. Op.1 includes pupils’ marks. Op.2 explicitly includes lists and personal files of teachers and pupils [S40].\n  - The Pryluky girls’ gymnasium, f.1436 op.1, has 202 files for 1882–1921. The description names graduates’ certificates and diplomas [S40].\n- Check what the specific file contains. A pupil’s personal file may include a copy of a metrical certificate, while a graduate list may give only a name and year [S1]. A reported 1915 Kungur gymnasium document gave a pupil’s home address. Copy the address with its date and school [S21].\n- Record both of the school's layers, each with its own fond, opis and delo. For the Vilna First Gymnasium, a participant cited:\n  - the gymnasium's own fond, LVIA f.574;\n  - separately, pupil lists for 1835/36 in the educational-district fond, LVIA f.567, op.2, d.3668.","sources":["S40","S1","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-055c6f27ffb6","kind":"method","anchor":"A published graduate list (1837 onward, with medals) leaves out pupils who left before graduating. [S14]\n- Record which Poltava inventories you checked. A reported miss for Kremenchuk gymnasiums there left another route open. Moscow held a list of numbered certificates for pupils completing the seventh class in 1913 [S4], [S13].","sources":["S14","S4","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6376d4a01d0c","kind":"method","anchor":"- Search the chancellery fond of the educational-district curator for the date. For Kremenchuk, participants named the Kiev district curator's chancellery. [S4]\n- Search other districts' curator fonds as well. A participant reported that ЦИАМ (now ЦГА Москвы) f.459, the Moscow district curator's chancellery (1803–1918), holds lists for Kremenchuk girls' gymnasiums. The participant was not sure it covers all years. [S4]\n- In ЦГА Москвы, search both fonds. They are arranged differently and hold different cases, so a school missing from one can be in the other. Participants cited these cases:\n  - f.459, grouped by district or by town initial: a set for Vilna-district gymnasium graduates, reported as two volumes (order every volume), and a case for girls' gymnasiums in towns beginning with Г;\n  - f.363 op.3, named by school: d.209 for the Gomel girls' gymnasium and d.210 for the Gomel boys' gymnasium. [S16]\n- In the series described by the contributors, lists begin in 1905 at the earliest and more often in 1908. They usually give a surname and given name, sometimes a patronymic, estate or confession. For a 1901 graduate, search the school or later institution and record the dates of the Moscow cases checked [S16].\n- The archive’s reply transcribed in [S16] distinguishes records it received. For an out-of-district pupil, look in a general list. To request a personal file, name the Moscow higher school the pupil later attended. The contributor describes f.363 op.3 as graduate lists for specified years. Use the case title to establish which school and cohort it covers [S16].\n- Participants reported that the Vilnius archive holds cases on graduates of schools across several districts of the Empire for 1910–1911. Lists for Vyazma (Moscow district, 1909–1911) were found there, but without patronymics. [S13]\n- If the catalogue gives only a title, quote the full case reference in a request for the list or arrange an on-site inspection [S4], [S16].","sources":["S4","S16","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f449b7b8e6bc","kind":"unclassified","anchor":"Together these lead back to the place in the original case. [S2]\n- One microfilm can carry copies of several cases. Identify each case separately. In this index, the ID prefix Б000_1872 marks the 1872 list of a Vilna Talmud Torah literacy school. The 1910–1911 set also contains 1912 data. [S2]\n- The indexer reported that more than 600 of roughly 2,000 names on the film also appear in a ЦИАМ list. The Moscow list covers fewer schools but gives patronymics. The indexer marked merged entries \"ЦИАМ_459.14.61_1911\" and said this was probably the case signature. Treat ф.459 оп.14 д.61 as a presumed locator until you see the case. [S2]\n- Credit each reading to the copy it comes from: a patronymic, a fuller double given name, or a different surname form. Never silently choose one reading. A reading or date in one copy may disagree with your estimate for the person. That ranks the candidate lower but does not exclude them. [S2]\n- Treat \"он же / она же / см.\" pairs as two-way pointers to one entry. They are not two people. Also keep source marks, such as a crossed-out town in a school name or a note that the pupil was an adopted daughter. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2a16273c25ca","kind":"method","anchor":"- **Warsaw University (Warsaw archive, f.214).** A participant who photographed the inventories reported the following.\n  - The alphabetical index gives status, years, faculty, volume (tom) and old signature (stary szyfr), with remarks such as doctor or candidate. Record the volume and the old signature as separate fields.\n  - Then check the volume in the subject inventory. Accept it as a personal file only if that inventory calls it \"Akta osobowe studentów\".\n  - Pharmacists are in a separate list, and so are midwives with dentists.\n  - Names are written in Latin script, so search a Polish spelling as well. [S6]\n- Ask the university archive about a miss in the Warsaw f.214 alphabetical index. In one transcribed account the university supplied details of two students whose surname the researcher had not found, although the university said its data came from the Warsaw archive. Ask for the underlying volume and signature [S6].\n- Use the scan labels reported for Warsaw University on genealodzy.pl as locators [S8]. The contributors identified:\n  - a diploma book for 1899–1912, which lists both people who studied there and people who only sat the qualifying examinations;\n  - examination sheets for 1869–1914, in folders labelled 72_0214_0131 to 72_0214_0175 (the last folder is labelled 1914–1915 but holds 1913–1914);\n  - petitions from 1912–1914. [S8]\n- **Tartu (Dorpat/Yuryev).** Use the alphabetical files described for students, auditors and professional trainees [S7].\n  - Ask for the complete file and check for photographs and copies of metrical and school certificates.\n  - Read each letter to its end, because order within a letter is poor.\n  - It also covers auditors, midwives and pharmacist's assistants.","sources":["S6","S8","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-47c2d3d1ea47","kind":"method","anchor":"Read the compiler’s scope note and search student and preparatory-department files separately. Only one of two twin sisters appeared in a compiled list. The archive supplied five files covering the two sisters and the two classes of files. Another researcher received files for two medical students absent from the 1889–1918 list [S7].\n- **Tomsk.** Compare the printed annual roll with the personal-file inventory. A contributor found a chemistry student from Mariupol in the Technological Institute’s 1909–1910 list of students and auditors, but no corresponding file in the name index searched [S15].\n  - The name cards described in that exchange gave no graduation dates. Op.3 alone was reported to contain 963 files. Compare the scope of the cards with the inventory before using a year cutoff [S15].\n  - Convert Old Style dates before using a year cutoff. In the 19th century the difference was 12 days, so 22 December 1893 OS is 3 January 1894 NS. [S15]\n- **Kyiv Polytechnic (State Archive of Kyiv City, f.18).** From the inventory copy the delo number, any second number, the scan number and sheet count. Quote them when asking for all sheets, the available delivery method and any fee [S12].\n- **Other fonds participants cited:**\n  - ГАРФ f.1250 op.1: Warsaw Polytechnic Institute, more than 4,000 student personal files. The posted span, 1879–1918, starts before the institute's founding in 1898, so confirm the dates in the opis. [S8]\n  - ЦГИА СПб: a student file in f.115 op.2 (1915–1916) for the Petersburg Psycho-Neurological Institute, and a real-school pupil's file. [S1]\n  - Mining Institute, split by period:\n    - ЦГИА СПб f.963 (1773–1918), whose reported description includes students, auditors and staff [S11].\n    - ЦГА СПб f.Р-8811 for records from 1917. Compare the inventories for overlapping years [S11].\n  - Odessa University: search the ДАОО inventories for student personal files [S19].","sources":["S7","S15","S12","S8","S1","S11","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e3dfac929d66","kind":"method","anchor":"- In the published Kharkiv student lists, read the recorded confession alongside course, admission, estate, support and previous school. A confession-filtered extract excludes entries recorded under other confessions. Search the full roll under spelling variants and compare identifying details. A surname alone cannot establish the student’s confession [S5].\n- Read the whole case, not only the summary page. Moscow district reports go school by school, folio by folio, and list women separately. [S9]\n- Check impossible dates against the volume. In a transcription of Berlin leaving certificates, one attendance interval runs backwards and another pupil appears to enter school before birth. Keep each reading provisional until checked against the signature [S18].","sources":["S5","S9","S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5cef3efcc5fd","kind":"method","anchor":"In the posted extract of the 1913 Moscow district examination report (ЦИАМ f.459 op.14 d.27), distinguish pupil (ученик), external candidate (экстерн) and outsider (посторонний). Record the examination and its outcome separately. The extract distinguishes admission to a supplementary exam, absence, failure, a crossed-out entry and a former graduate re-sitting for higher marks. Retain individual qualifications such as an exemption from modern languages or a conversion reported during the examination [S9].","sources":["S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5909f92ed8b6","kind":"unclassified","anchor":"- A diploma-book entry can belong to an external candidate who only passed the qualifying examinations. It shows neither enrolment nor residence in the university town. [S8]\n- Kharkiv lists have a category for those admitted to lectures on condition that they hand in the required documents. [S5]\n- Lyceum lists distinguish a действительный студент from a candidate of legal sciences. [S3]\n- A 1913 Kremenchuk women's-gymnasium list records certificates issued for completing the 7th class, each with a certificate number. Record it as 7th-class completion, as the list states. These are certificates of completion: do not read the entry as a sign that the pupil left early. [S13]","sources":["S8","S5","S3","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d870f432339b","kind":"method","anchor":"- Compare the same graduating cohort in later volumes of the institution’s yearbook. The Demidov Lyceum’s *Временник* records Lavr Popov’s qualification in the 1881 cohort (book 27), then his posts as an investigating magistrate in Yekaterinburg district (book 53, 1891) and a deputy prosecutor in Yekaterinburg (book 81, 1900), as transcribed in [S3]. Cite each volume for the post it names.\n- Read \"сведений не доставили / не доставил\" as \"supplied no information\". It says nothing about death, emigration or absence. [S3]\n- Check the council minutes for stipends and course year. Book 18 records a stipend for Popov as a third-year student in 1878 [S3].\n- Carry the series into service files. Participants cited personnel files in ГАПК f.1 op.2 that restate the lyceum course and degree before the service record. [S3]","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cebeb1e0891c","kind":"method","anchor":"For a yearbook, inspect another copy of the same edition even when the family owns one. Handwritten inscriptions are copy-specific: look beside the relevant printed entry, inside covers, and on notes or autograph pages, keeping the copy's holder and page locator. A signature or personal note may be absent from both OCR and the family's copy. Treat the handwriting's attribution as a separate claim; do not identify a person by comparing faces. [S33](https://genealogytipoftheday.com/index.php/2025/06/27/grandma-signed-a-yearbook/), [S34](https://www.amyjohnsoncrow.com/getting-more-out-of-yearbooks-for-genealogy/)","sources":["S33","S34"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-349d329802a6","kind":"method","anchor":"- **The next institution’s file.** A researcher recovered a great-aunt’s Kremenchuk gymnasium certificate from her next institution’s file [S4]. Search the admissions papers under the later school’s name and request the earlier certificate with the student’s file [S16].\n- **Marriage records** can name a school (step 1). [S4]\n- **A conversion said to have been made for university entry.** Search three places separately:\n  - the metrical book of the baptising church;\n  - guberniya inventories for files on payments to converts;\n  - the student's personal file.","sources":["S4","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-74b02a2a4d0c","kind":"method","anchor":"A researcher describes finding baptism and official reliability (благонадёжность) documents, photographs and a father’s biography among Odessa student records. The student lists another researcher had checked ended in 1903. Record that search limit before checking personal files [S19].\n- **Berlin leaving certificates.** For the Luisenschule, the reported locator is Landesarchiv Berlin, A Rep. 020-05, Sign. 1–8. Choose by leaving year. Sign. 1 covers 1883–1893. For a possible departure in 1913–1921, compare the overlapping ranges reported for Sign. 7 (1913–1919) and Sign. 8 (1914–1921). Check the individual row for birthplace, father’s occupation or residence, confession and attendance [S18].\n- **A copied entry without a source.** The reported Easter 1893 entry for a Berlin law student includes a number, birthplace, occupation and town. Recover the page and its headings before interpreting the number or assigning the occupation and town to his father. Until then the transcript is a search lead [S20].\n- **A missing student-association album.** For the unlocated 1872–1897 Dorpat pharmacy students’ album, search under the association’s later name. The 1977 *Album Baltonorum et Gotonorum 1872–1976* was reported to contain biographies for 879 members and 32 honorary or corresponding members. Distinguish the later compilation from the original album and from the contributor’s own supplements [S17].\n- **Soviet-period records.** Look for the parents' personal files at their workplaces. Start from the house books of the city where the person last lived, because a family often shared one flat before the war. [S1]","sources":["S19","S18","S20","S17","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a2c7e99cfe50","kind":"portal-availability","anchor":"**Königsberg, Danzig, Elbing and Thorn, from 1544.** Do not look for printed dissertations only at universities: the academic gymnasia of Danzig, Elbing and Thorn printed them too. Search the databases of the Arbeitsstelle für kulturwissenschaftliche Forschungen (AKF) in Engi, which CompGen describes as freely accessible [S26 @2026-11-12], [S30 @2026-11-12]. The Danzig, Elbing and Thorn database holds 711 records [S28 @2026-11-12] and the Königsberg student database 24,822 [S29 @2026-11-12]. Search them this way:","sources":["S26","S30","S28","S29"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5ffe1a6f4b57","kind":"platform-ui","anchor":"- *Königsberger Universitätsschriften und Promotionen 1544 bis 1905*: search by respondent or doctoral candidate, praeses, title, date, faculty, printer and holding library [S27 @2026-11-12].\n- *Dissertationen des Akademischen Gymnasiums Danzig, des Gymnasiums Elbing und Thorner Gymnasiums*: browse by document, person, role, school, faculty and city [S28 @2026-11-12].\n- *Königsberger Studenten von 1829 bis 1921*: search by name, given name, place of origin, semester and faculty or subject [S29 @2026-11-12].","sources":["S27","S28","S29"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b38aaf6c8d4f","kind":"method","anchor":"Distinguish the respondent or doctoral candidate from the *praeses*, who presided. CompGen reproduces a 1710 Danzig dissertation naming Johannes Gottfried Drave of Belgard, Pomerania. Record the stated origin separately from the place of the disputation [S30].","sources":["S30"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-67e96815e4b7","kind":"method","anchor":"- **The person's own labour book (трудовая книжка).** Under the 1974 USSR instruction, education was entered on its title page only from a diploma or certificate, and periods of study at higher and secondary specialised schools were entered among the work records with a reference to the supporting document (пп. 2.10, 2.17). [S31] A 2020 Dzen guide adds that study was entered because it counted toward length of service. [S32] Take the school and years from each study entry before you search that school's fond.","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-local-library-yearbooks","kind":"method","anchor":"If the school's own holdings turn up no yearbook for the year you need, check the local-history collection of the public library serving the area where the family lived. Look for the volume by school and year. [S37](https://familytreemagazine.com/libraries-archives/a-guide-to-libraries-for-genealogy-research/), [S38](https://www.plainfieldlibrary.net/services/genealogy/)","sources":["S37","S38"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-eff39fee2735","kind":"platform-ui","anchor":"- **German chemistry candidates, 1898–1939.** The [CompGen DES search](https://des.genealogy.net/chemiker/search) lets you search the transcriptions by institution and qualification [S23 @2026-11-19].","sources":["S23"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0b2acec9e8e9","kind":"method","anchor":"- CompGen describes 30 booklets of the *Berichte des Verbandes der Laboratoriums-Vorstände an deutschen Hochschulen*. Distinguish the examining institution from the city. Berlin’s Technische Hochschule stood in Charlottenburg, a separate city until 1920 [S22], [S24].\n  - Read the Typ field as the qualification. A Verbandszeugnis is the certificate of a preliminary chemistry examination required before the doctorate or diploma examination; it is not a degree. Link one person's separate entries, which may be at different institutions, into a dated sequence. [S22], [S25]\n  - Entries often give place of origin, prior schooling and the supervising professor. Check each dissertation against the *Jahresverzeichnis der Deutschen Hochschulschriften*. [S22]\n- Use the higher-school route to find the school too. Entry to a university required a gymnasium certificate, earned either by study or as an external candidate. [S1], [S4]","sources":["S22","S24","S25","S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-township-school-search","kind":"method","anchor":"For a U.S. school in an area with township government, identify the family's civil township, county and state for the attendance years. Verify which authority ran the school at that date. If the township ran it, search local-government finding aids under the township and county for board of education records and school-age enumerations. Check the school district or successor office's inventory if responsibility changed. Use survey township numbers as location clues. [S47], [S48]","sources":["S47","S48"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-green-creek-school-enumeration","kind":"custody","anchor":"The Rutherford B. Hayes Presidential Library & Museums lists the 1840 enumeration for School District #2 of Green Creek Township, Sandusky County, Ohio, in *Green Creek Township Records*, inventory item 3, Loose papers. [S48 @2026-11-20]","sources":["S48"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-yearbook-photo-community-search","kind":"method","anchor":"When tracing a former community from a yearbook group photo, work through the whole group by row and position. Use captions or annotations to propose names. Where the school and year are known, check those names against class lists. Require evidence linking each name to its position in the photo, and record a recognition only as the claim of the person who made it. Search local records from the period for each candidate name, including classmates outside the family you started with. Leave unsupported positions unresolved. [S43], [S44], [S45]","sources":["S43","S44","S45"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-school-photo-unnamed-school","kind":"example","anchor":"The reverse of *Unknown School Class Photo* (item 32500) supplies names by row, with the school still unidentified. [S46]","sources":["S46"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-prize-list-enrolment-search","kind":"method","anchor":"When a historical school or university award is the clue, search the prize lists by award name and year [S49], [S50], [S51]. In a French lycée inventory, look under *palmarès* and *distributions des prix* [S50]. For Cambridge awards through 1910, check the University Prizes section of the 1917 *Historical Register* [S51]. Use the award year and any class or college named to narrow the search in admission registers, pupil entry and exit registers, or university matriculation records. Record award and enrolment dates separately, and search the enrolment series even if the prize list has no match. [S50], [S52]","sources":["S49","S50","S51","S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rollin-prize-and-attendance-records","kind":"custody","anchor":"For Collège Rollin, the Archives de Paris finding aid lists prize distributions for 1909–1912 at D2T2 482–483 and attendance certificate stubs covering those years at D2T2 289, in a gap between the listed pupil entry and exit registers. [S50 @2026-11-21]","sources":["S50"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-compare-finnish-school-statistics","kind":"method","anchor":"If a Finnish school memoir names only a town initial, compare its class, pupil and teacher counts with the *alkeisopistot* tables in the Finnish school statistics for each plausible academic year. Use the initial and the place of publication to rank the towns and keep the resulting identification provisional. For a late-1880s memoir, start with the 1885–1886, 1886–1887 and 1887–1888 issues. [S80], [S81], [S82], [S83]","sources":["S80","S81","S82","S83"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-san-aton-early-series","kind":"custody","anchor":"For a historical Badajoz seminarian, start in San Atón’s *Secretaría*. Use the series titles alongside the shelfmarks because the published classification numbers differ. For early pupils, search *Informaciones* (1683–1853) before *Expedientes Personales*, which begin in 1853. The 1664 constitutions, title 27, prescribe separate admission and absence books: check for admissions and oaths in one, and authorised absences and returns in the other. A prescribed book needs a surviving locator. In a personal file, look for the admission application and baptismal, conduct and medical certificates, with confirmation, scholarship and dispensation papers where included. [S53 @2026-11-22], [S54 @2026-11-22], [S55 @2026-11-22]","sources":["S53","S54","S55"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-san-aton-enrolment-and-exams","kind":"custody","anchor":"At San Atón, cross-check *Solicitud/Justificantes*, *Matrículas*, *Listado de Alumnos*, and *Actas de Exámenes* for application, enrolment, roster appearance and exams respectively. Compare the application addressed to the bishop with the personal file for parentage, origin and the stated reason for entry. Use the *Matrículas* for age and origin where given. In *Fondo Histórico, Secretaría*, start with Caja 57 for the exam minutes of 1893–1897 and Libro 70 bis (20) for 1913–1941. Check *Notas* and *Certificaciones* for subject grades, and check the personal file for exam evidence too. Cite an *Extracto de partida de bautismo* to the student file and record it as a copy extracted from the baptism entry. [S53 @2026-11-22], [S54 @2026-11-22], [S55 @2026-11-22]","sources":["S53","S54","S55"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-san-aton-parallel-student-series","kind":"custody","anchor":"At San Atón, check *Expedientes de Conducta* for the parish priest’s report, relatives and place of origin. In *Becas*, log each application and any decision separately. Check the *Actas Academias Literarias* for lecture summaries and names of participating seminarians, and *Administración General, Pagos* for named board and tuition payments. Use the *Seminario Menor*’s own *Asuntos Académicos* for matriculation, marks and bursaries. Follow a student who pursued ordination into *Órdenes Sagradas, Expedientes de órdenes*. [S53 @2026-11-22], [S54 @2026-11-22], [S55 @2026-11-22]","sources":["S53","S54","S55"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-jyvaskyla-school-and-application-series","kind":"custody","anchor":"For Jyväskylä teacher training, open the *Jyväskylän seminaari* creator in Astia (EAC_710083534), then work through the seminary’s own inventory. The *Seminaarin oppilasluettelot* list teacher trainees separately from the kindergarten and practice-school pupils. Use the incoming pupil application series to look for the application letter and its enclosures, including recommendations. Check curricula, annual reports and student work for the school context, and check access for the specific item. [S74 @2026-11-22], [S75 @2026-11-22], [S76 @2026-11-22]","sources":["S74","S75","S76"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-girard-historical-admission","kind":"custody","anchor":"For a Girard College pupil in the 1860s, use the college museum’s student-record search to locate the admission papers. Use the application for the reported birth date, as illustrated by the case from the inspected excerpt [S90 @2026-11-22]. Check for supporting evidence of the parents’ marriage, the pupil’s birth and the father’s death, as specified in the 1868 annual report. Keep each reported date tied to the document that supplied it. [S91 @2026-11-22], [S92 @2026-11-22]","sources":["S90","S91","S92"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-san-aton-wartime-transfer","kind":"historical","anchor":"When San Atón’s wartime rolls break, follow the 1937–1938 cohort to Villafranca de los Barros, starting with the diocesan bulletin of 31 December 1937, p. 248. In 1938–1939 search San Carlos Borromeo in Salamanca for Theology and Philosophy and Villafranca for the younger pupils. For Villafranca, also test San Atón’s related-institutions series *Seminario Menor Nuestra Señora de la Coronada* for accounts and grades. [S56], [S57], [S53]","sources":["S56","S57","S53"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-san-aton-affiliated-series","kind":"custody","anchor":"In San Atón’s *Instituciones Dependientes*, search *Colegio-Seminario Menor de San Benito* for applications, matriculation and grades in Villanueva de la Serena. For Elvas and Olivenza, check *Seminario Menor Elvas-Olivenza* for correspondence, accounts and reports. [S53 @2026-11-22], [S54 @2026-11-22]","sources":["S53","S54"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-texas-scholastic-coverage","kind":"custody","anchor":"For the Texas scholastic censuses of 1854–1855, start with Gifford White’s *Texas Scholastics 1854–1855* and check the county’s return type before drawing conclusions. Treat county and state returns as separate series, following the distinction from the inspected excerpt [S87 @2026-11-22]. Look for the state return in the Texas State Archives’ *Scholastic census*, box 2-9/662 for Ellis–Wood, and search the archive’s regional depository inventories for any surviving county counterpart. Treat missing A–D county returns as a gap in this search. A totals-only return can supply counts but cannot resolve a family’s presence. Where the return names families, record each named child and the adult’s stated role as parent or guardian. [S88 @2026-11-22], [S89 @2026-11-22]","sources":["S87","S88","S89"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-leuven-register-and-index","kind":"portal-availability","anchor":"For the Old University of Leuven, use the MyHeritage matriculation index as a lead and compare it with the Belgian State Archives’ enrolment-register inventory (1426–1797, with gaps). Record the date of enrolment and the place of origin as written. Establish any birthplace separately. A missing name leaves attendance unresolved: check the surviving years and the underlying roll before drawing an inference about the person. The roll records enrolments. It does not document who tried an entrance examination and failed. [S60 @2026-11-22], [S61 @2026-11-22], [S62 @2026-11-22], [S63 @2026-11-22]","sources":["S60","S61","S62","S63"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-matriculation-and-originals","kind":"portal-availability","anchor":"Choose the Helsinki *Ylioppilasmatrikkeli* compilation by the historical date: Kotivuori for 1640–1852 and Autio for 1853–1899. Check the year range at the top of each edition. The menu links to the other edition, and *Ylioppilasmatrikkelin etusivulle* returns to the edition you are already using. Use the compiled entry for earlier schools and family leads. For the archival register, use the archival indexes’ volume, page and entry numbers. Keep those numbers separate from the running number in the compilation. Search Arkki1640 by faculty for the original digitized registers and the historical degree lists where available. [S64 @2026-11-22], [S65 @2026-11-22], [S66 @2026-11-22], [S67 @2026-11-22]","sources":["S64","S65","S66","S67"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-athens-university-student-register","kind":"portal-availability","anchor":"For a University of Athens student in 1837–1938, search the Attica student-register index for the stated father and year and place of birth. Record any faculty and registration date, then use them to locate the entry in the university’s Historical Archive. Keep registration and degree dates separate. [S84 @2026-11-22], [S85 @2026-11-22], [S86 @2026-11-22]","sources":["S84","S85","S86"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-matriculation-and-attendance","kind":"method","anchor":"In the Finnish *Ylioppilasmatrikkeli*, log the reported matriculation date separately from the first term of study. Test enrolment in the spring and autumn lists of students registered present. Autio’s entry 17632 records matriculation and lists forestry studies at Tharandt, so use the named place of study as its own lead. [S72], [S73], [S69]","sources":["S72","S73","S69"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-defense-and-degree","kind":"method","anchor":"For a historical Helsinki dissertation, compare the printed dissertation list and any public-defence notice with the matriculation entry and faculty degree register. Record permission to print, defence, faculty decision and degree separately. If the degree is missing or the title stays the same, check successive faculty meetings and their attached examiners’ reports for approval, rejection, a vote or another unfinished requirement. An accepted dissertation could still leave the candidate without the intended degree. For the historical-philological section’s early twentieth-century procedure, use Garritzen’s *Lähteiden lumoamat*, pp. 131–134, to identify the minutes and reports to check. Check the manuscript itself if completeness is in question. [S77], [S78], [S79], [S65]","sources":["S77","S78","S79","S65"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-semester-address-series","kind":"method","anchor":"For a historical Helsinki student’s term address, search the Swedish *Förteckning* of staff and students registered present, its Finnish *Luettelo virka- ja palvelusmiehistä ynnä läsnä olevista ylioppilaista* (spring 1870 to spring 1873), or the later *Suomen yliopiston luettelo* (1875–1918; check its alternate titles). In the Finnish roster, look for staff at the front and students under their student nations. Record an address as reported for that term. Look for the same address in that issue and the next, using full-text search or scanning the list. Use repeat appearances as leads to possible housemates or acquaintances. [S68], [S69], [S70], [S71]","sources":["S68","S69","S70","S71"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dead-fred-yearbook-editions","kind":"portal-availability","anchor":"For a historical U.S. yearbook missing from the school and local library, check Dead Fred’s *Annuals* by school and year. Open the listed edition to see which pages or photos were uploaded. An edition entry leaves the completeness of the upload open. [S58 @2026-11-22], [S59 @2026-11-22]","sources":["S58","S59"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-werkko-school-register-by-diocese","kind":"portal-availability","anchor":"For an early Finnish small school or itinerant school, start with the historical diocese in Kaarle Werkko’s 1909 *Suomen pikku- ja kiertokoulujen matrikkeli* (URN:NBN:fi-fd2015-00008067). Look for the locality and school, then note any founding year and teacher named. Use those details to narrow the search for records from the school’s years of operation. [S93 @2026-11-23], [S94 @2026-11-23], [S95 @2026-11-23]","sources":["S93","S94","S95"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-school-register-dates-and-sites","kind":"platform-ui","anchor":"For a historical Helsinki elementary school, search by name in Historia Helsinki’s *Koulurekisteri*. Open each candidate and match its name, school type and operating dates to the years you need before adding it to your list. When the address for a year is missing, check *Rakennukset ja sijainnit* for the building’s address and years of use. For Hesperian kansakoulu, start with Mannerheimintie 13e, listed for 1896–1905. If the site for the target year is still unclear, check a period city directory or district map. The northern school-district map (963Ia:1) lists Hesperia and Töölö under district 12. [S96 @2026-11-23], [S97 @2026-11-23], [S98 @2026-11-23], [S100 @2026-11-23]","sources":["S96","S97","S98","S100"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-school-move-newspaper-attribution","kind":"historical","anchor":"When a Helsinki newspaper notice names a school, compare the notice date and venue with municipal building decisions and documented moves before assigning it to a register entry. [S96], [S101], [S102] The 1904 city report (pp. 34–36) distinguishes the school already using Hesperia villa from the new building approved for Töölönkatu lots 41 and 43, and the 1906 report’s *Hesperian rakennusten käyttö* records the school’s move to the new building. [S101], [S102]","sources":["S96","S101","S102"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-helsinki-shared-elementary-school-holdings","kind":"custody","anchor":"If *Koulurekisteri* gives an unknown archive location, as it does for Hesperian kansakoulu, use the Helsinki City Archives’ *Kouluaineistot* guide and search Sinetti. For a Finnish-language municipal elementary school, check the shared *Suomenkielisten kansakoulujen kanslia* inventory by school and year for leaving certificates, teacher applications and class diaries. [S96 @2026-11-23], [S98 @2026-11-23], [S99 @2026-11-23]","sources":["S96","S98","S99"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-kotivuori-student-and-parent-details","kind":"method","anchor":"In Kotivuori’s entries, take any stated origin and occupation as leads for the person to whom the entry assigns them. If you are tracing a relative, check the parent and kin details as well as entries headed by the target’s name. [S103], [S104] In entry 13622, the clock manufacturer from Danzig is the student’s father, Abraham Mikael Dreyer. [S104]","sources":["S103","S104"],"checked":null,"stated_as":"fact","review":"reviewed"}
