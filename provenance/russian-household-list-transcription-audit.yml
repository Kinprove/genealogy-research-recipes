claims:
  - {"id":"C-fc953ce8e240","kind":"method","anchor":"- **Use the list's own numbers.** In a confession list the first columns carry the running numbers of the household, of each male and of each female. [S13] The tenth-revision form that BYU transcribes has a male half and a female half, each with its own column of those now present. [S19] For each household, count the people in the transcription against those numbers. A skipped number or a number used twice marks a missing or doubled person.\n- **Reconcile the totals person by person.** A confession list can total households and male and female souls [S13]. In the 1858 Radyvyliv revision the male total appears to count households, while the female total agrees with the entries [S31]. Check the original subtotal and both halves of the list before reporting a missing person.\n- **Count both halves of a revision.** A daughter or a widow can stand only in the female half. Read the female half against the male half household by household ([step 4](#4-read-the-household-as-the-scribe-wrote-it)).","sources":["S13","S19","S31"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1f9d6e353091","kind":"method","anchor":"- **Use the scribe's own forms, not a chart.** The National Archives' transcription tips say letters \"will often appear similar or standard throughout a handwritten document by the same scribe\". [S1] Wikipedia's article on skoropis notes that each scribe had his own letter forms, so a vague place must be compared \"with already read parts of the same text\". [S4] BYU's Russian tutorial warns that a letter may not appear on its alphabet charts at all, and that one document can hold several styles of the same letter. [S2] For a digit, compare it with the same scribe's other numbers and dates on the page. BYU's French numbers page recommends checking other records by the same scribe \"to ensure the correct reading of a particular number\". [S3]\n- **Confirm the reference sample first.** Pick a word whose reading is fixed by something else, such as a formula word or a name confirmed in another list. The National Archives' tips start from a phrase that \"doesn't often have any spelling surprises\". [S1] A misread reference passes its error to every reading built on it.\n- **Put the two disputed glyphs side by side.** Two digits that each look like a reference 4 can still differ from each other. The National Archives' tips reason the same way within one word: if one letter is an \"e\", the look-alike next to it \"probably isn't\". [S1]\n- **Keep a stroke rule for each scribe.** BYU suggests making your own alphabet chart of how a scribe writes each letter. [S2] Record a feature such as the direction of a digit's top hook with that scribe and that list, and do not carry it to another hand.","sources":["S1","S4","S2","S3"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-52c299241a6b","kind":"historical","anchor":"- **Old letter forms.** In 18th-century скоропись в could be written as a quadrilateral or lying on its side. [S5] When a clear-looking reading contradicts every other list, suspect your letter model before you suspect the scribe.\n- **Raised letters.** Выносные буквы are written above the line, \"хотя они и составляют часть слова, остающегося в строке\", and at first they marked an omitted ъ or ь. [S5] Read the raised letter as part of the name, and test each candidate name against the other years.","sources":["S5"],"checked":"2026-11-10","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fdbd7d938a47","kind":"method","anchor":"Trace the line from the person’s running number through to the age. A crowded page makes it easy to take a value from an adjacent row [S6]. According to Kinprove’s private audit notes, the researcher reported a sloping line with the age above the name [S26†]. Check the parent’s and child’s rows together.","sources":["S6","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-efafd1567a3e","kind":"example","anchor":"- **A dead father can still name the household.** A 1748 heading names Vasily Nikiforov as deceased and introduces children born since the previous revision [S14]. Enter the sons listed in the body. Look for the father in the previous revision or a confession list.\n- **Follow the person named in each possessive.** A relationship can refer to the head or to another member [S19]. In one 1850 transcription «Кузьмин сын Василий» names Kuzma as father, then «Никифора Петрова другой сын Иван» returns to Nikifor [S15]. The 1816 phrase «Естифеевы сыновья» likewise introduces Estifey’s sons [S16]. Add a level if necessary and leave an ambiguous attachment open. See [confession-list layout](russian-orthodox-confession-list-reading.md#2-read-the-layout-before-the-names).\n- **Preserve the original relationship and its referent.** An 1817 translation gives “Iosel’s son” in the comments but adds “[Nephew]” in the relation-to-head column. The brackets mark the translator’s inference [S18]. Keep a separate field for that interpretation.\n- **Cross-check the two halves of the revision.** A wife or daughter may appear only on the female side [S19]. Identify whom a phrase such as «Ивана Мартынова жена» names, then follow «его же дочери» back to the same man [S17]. Compare the male entries before linking the row to a father or son of similar name.\n- **Keep period kin terms as written.** Dal gives several affinal meanings for зять [S20] and says приемыш can refer to a child taken into the family or regionally to a son-in-law taken into the house [S21]. An 1817 translator renders a six-year-old’s entry as “Son-in-law (primak)” [S18]. Preserve the term and source before proposing any marriage. Add a more specific relation in brackets only with its supporting record. See [period kin terms](ai-for-documentary-records.md#what-to-never-trust-or-delegate-verify-or-dont).\n- **In an entry without a surname, read the second name element as a patronymic form.** Where a revision entry gives only the head's given name and patronymic, the son's patronymic follows the father's given name: in Wikipedia's example, Прокопий Иванов's son Василий is Василий Прокопьев, \"а вовсе не Иванов\". [S22] Wikipedia calls such forms in older entries, as in «посиделец Ивашка Григорьев», \"ещё не фамилии\" (полуотчества). [S23] Call it a patronymic in the audit, not a surname, and reason from it to the father, after the [converts check in the revision-list recipe](russian-revision-list-household-chaining.md#4-transcribe-each-entry-field-by-field). Where an entry also carries a surname, keep both. A missing surname does not by itself show that the family had none ([village family reconstitution, step 1](russian-village-family-reconstitution.md#1-identify-people-by-an-identity-key-not-by-the-surname)).\n- **Read the margins.** Copy brackets with their words, including group attendance marks [S24]. For a transfer, record the named owner, destination and any instruction to enter the person there. In one 1763 tale the note directs the reader to Kochetovka in Saransk uezd on the owner’s estate [S25]. Search the receiving estate’s register for the corresponding entry.","sources":["S14","S19","S15","S16","S18","S17","S20","S21","S22","S23","S24","S25"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f79cbcd19a9a","kind":"example","anchor":"- **Compare the letters that distinguish the candidates.** For Данилов and Денисов, compare the vowel after Д and the consonant before ов with the same scribe’s forms [S10]. According to Kinprove’s private audit notes, the researcher reported a Максимъ/Михаил confusion [S26†]. Compare the disputed к/х against verified letters in that hand ([step 2](#2-settle-a-disputed-glyph-against-the-same-scribe)).\n- **Search both church and everyday name forms.** Petrovsky links Фетис to Феоктист [S7], Финоген to Афиноген [S8], and Аксинья to Ксения [S9]. Compare the same household across lists: a Tula researcher reads Алифан in an 1850 revision and Вонифатий in an 1851 confession list [S34]. Keep competing readings for Митяй Лукиев: Митя can derive from Дмитрий or Митрофан [S35], [S36], and the entry alone leaves the father’s name unresolved [S34]. Include patronymics derived from everyday names in surname searches, such as Меркулов from Меркул, a form of Меркурий [S37], [S38]. Retain the source spelling.\n- **Match the household before resolving a name.** Compare age and family composition [S12]. Read the preceding revision and the next one when available, then return to the original image with the proposed reading [S10], [S11].","sources":["S10","S26","S7","S8","S9","S34","S35","S36","S37","S38","S12","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bc9fa4a42f6e","kind":"example","anchor":"Look for the other year’s entry when a supposed second given name makes no sense. In the published 1795 revision the editor interpreted «Авдотья не Агафья» as a correction after comparing the 1782 entries [S11]. A later confession list may copy the earlier one and repeat its error [S13]. Keep the two readings and their relationship in the audit log.","sources":["S11","S13"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-baac3de80fe5","kind":"method","anchor":"- **Test whether the scribe carried ages forward.** Compare previous and current age pairs with the interval between revisions [S27]. In the published 1795 list the pairs differ by 13 years, the interval since 1782 [S11]. Use that pattern to rank uncertain digits. Preserve a clearly written age even when it breaks the pattern.\n- **Expect ages repeated from the previous list.** The same forum thread notes that a new tale was built on the previous one, so its errors in age, name or patronymic were often («частенько») \"попросту дублировали\". [S27] A person who carries the same age in two lists several years apart may be a copied entry or a declared age that did not change ([revision-list recipe, step 5](russian-revision-list-household-chaining.md#5-test-formulas-placements-and-ages-before-using-them)). Keep the image value and add a note such as \"same age as in the previous list; other years give birth about 1780\". Do not correct it, and do not use it alone for a birth estimate.\n- **Check the transcriber's own scheme too.** A sheet can fill ages by its own rule, such as the previous age plus the interval. An entry that breaks the transcriber's rule, or a death that has no note while its age follows the rule, needs the image.\n- **Keep the original unit and precision.** Russian archival publication guidance preserves historical number forms [S28]. An 1858 transcription retains months and fractional years («4 мес», «12 1/2») [S33]. Put any normalised value beside the literal age and record its unit.\n- **Date the event from its remark.** The 1795 tale records Evstafey Fedorov’s death in 1786 [S11]. Keep the stated year apart from the date of the revision, compare its digits with the same hand ([step 2](#2-settle-a-disputed-glyph-against-the-same-scribe)), and seek an independent death record when precision matters [S27].","sources":["S27","S11","S28","S33"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bf2e48910f1c","kind":"method","anchor":"- **Columns left out on purpose.** In confession lists the attendance column holds \"был\", \"была\", or a bracket over a group marked \"были\" ([reading confession lists, step 3](russian-orthodox-confession-list-reading.md#3-read-the-attendance-columns-as-an-administrative-mark)). [S24] A transcription that leaves these marks out on purpose has no omission. Ask before you report one.\n- **The researcher's own additions.** Editors mark their own additions separately. The National Archives asks transcribers to put their comments in a separate field, not in the transcription. [S1] Russian archival guidance puts words restored by the editor in square brackets. [S28] BYU's palaeography introduction uses brackets for letters the transcriber inserted. [S30] A translated 1817 revision list states that its bracketed items are the translator's and \"do not appear in the original record\". [S18] A column such as a family surname added as a research tag has no counterpart in the image. Do not report it as an error and do not remove it.","sources":["S24","S1","S28","S30","S18"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-88e5a4545f0f","kind":"method","anchor":"- **Record what the image says, even against other years.** Russian archival guidance does not correct wrong numbers or wrong proper names in the text. It gives the probable correct form in a note, or \"Так в документе\" when other sources cannot check it. [S28] The National Archives asks transcribers to type words exactly as written, \"even misspelled words\". [S1] An edition of a 19th-century journal leaves incorrect dates \"to stand\" and occasionally adds notes to clarify or correct them. [S29] So when a couple's ages fit neither the earlier nor the later list under any reading, record the image value and the inconsistency.\n- **Record the decision on a disputed reading.** Give the alternatives, same-hand comparisons and cross-year evidence to the researcher. Record which reading they adopted, why, and who made the decision. Keep any conflicting original reading visible [S1], [S28].\n- **Make crops a reviewer can check.** A very wide strip is hard to check in a small preview, and a vision model reads it no better. Anthropic's vision documentation says a large image is scaled down to fit a maximum long edge while its aspect ratio is kept, and that this can \"make text less legible\". [S32] So a strip twenty times wider than it is tall keeps only a twentieth of that limit as its height. Crop close to the item. Include two or three lines of context, the person-number margin and the age column, and look at the crop yourself before you send it to the reviewer.","sources":["S28","S1","S29","S32"],"checked":null,"stated_as":"observation","review":"reviewed"}
