  - {"id":"S33","kind":"web-page","urls":["https://rodnaya-vyatka.ru/blog/20278/147546"],"published":null,"retrieved":"2026-11-10","access":"read","rights":null,"basis":"opened 2026-11-10","entry_sha256":"6b01615d2af9120a28a20a8a4a856cda7666d4e03160d9d441c99bd070cc3967","claims":["C-baac3de80fe5"],"review":"reviewed"}
claims:
  - {"id":"C-fc953ce8e240","kind":"method","anchor":"- **Use the list's own numbers.** In a confession list the first columns carry the running numbers of the household, of each male and of each female. [S13] The tenth-revision form that BYU transcribes has a male half and a female half, each with its own column of those now present. [S19] For each household, count the people in the transcription against those numbers. A skipped number or a number used twice marks a missing or doubled person.\n- **Check the totals, but do not trust them blindly.** The list ends with a summary of households and of male and female souls. [S13] BYU's transcription of an 1858 revision notes that \"even in the original record, the count for the males is off\", because the scribe seems to have counted households instead of people. [S31] A totals mismatch can be the scribe's own arithmetic, so locate it person by person before you report an omission.\n- **Count both halves of a revision.** A daughter or a widow can stand only in the female half. Read the female half against the male half household by household ([step 4](#4-read-the-household-as-the-scribe-wrote-it)).","sources":["S13","S19","S31"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1f9d6e353091","kind":"method","anchor":"- **Use the scribe's own forms, not a chart.** The National Archives' transcription tips say letters \"will often appear similar or standard throughout a handwritten document by the same scribe\". [S1] Wikipedia's article on skoropis notes that each scribe had his own letter forms, so a vague place must be compared \"with already read parts of the same text\". [S4] BYU's Russian tutorial warns that a letter may not appear on its alphabet charts at all, and that one document can hold several styles of the same letter. [S2] For a digit, compare it with the same scribe's other numbers and dates on the page. BYU's French numbers page recommends checking other records by the same scribe \"to ensure the correct reading of a particular number\". [S3]\n- **Confirm the reference sample first.** Pick a word whose reading is fixed by something else, such as a formula word or a name confirmed in another list. The National Archives' tips start from a phrase that \"doesn't often have any spelling surprises\". [S1] A misread reference passes its error to every reading built on it.\n- **Put the two disputed glyphs side by side.** Two digits that each look like a reference 4 can still differ from each other. The National Archives' tips reason the same way within one word: if one letter is an \"e\", the look-alike next to it \"probably isn't\". [S1]\n- **Keep a stroke rule for each scribe.** BYU suggests making your own alphabet chart of how a scribe writes each letter. [S2] Record a feature such as the direction of a digit's top hook with that scribe and that list, and do not carry it to another hand.","sources":["S1","S4","S2","S3"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-52c299241a6b","kind":"historical","anchor":"- **Old letter forms.** In 18th-century скоропись в could be written as a quadrilateral or lying on its side. [S5] When a clear-looking reading contradicts every other list, suspect your letter model before you suspect the scribe.\n- **Raised letters.** Выносные буквы are written above the line, \"хотя они и составляют часть слова, остающегося в строке\", and at first they marked an omitted ъ or ь. [S5] Read the raised letter as part of the name, and test each candidate name against the other years.","sources":["S5"],"checked":"2026-11-10","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fdbd7d938a47","kind":"method","anchor":"On a crowded page \"it is easy to get off on the wrong row\", as one FamilySearch Community participant put it. [S6] According to Kinprove's own audit notes [S26†], lines in some lists slope, and one scribe wrote ages about half a line above their names. Anchor each age on the person's running number in the margin, not on the height of the name, and check that the transcription did not give a child the age on the parent's line.","sources":["S6","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-efafd1567a3e","kind":"example","anchor":"- **A household can be named after a dead father.** A transcribed 1748 revision heads a household \"Умершего, написанного в прежнюю перепись Василья Никифорова дети, после переписи рожденные\" and lists only the sons, not the father. [S14] Do not add a head row for him; find him in the previous revision and in the confession lists.\n- **Find each relationship's referent in the wording.** BYU notes that revision lists give a member's relationship \"to the head of household and/or other members of the household\". [S19] A possessive form states the relation to the man it names. A transcribed 1850 tale runs \"Никифоров сын Кузьма\", then \"Кузьмин сын Василий\" (Kuzma's son), then \"Никифора Петрова другой сын Иван\" (back to the head). [S15] An 1816 tale has \"Ивана Сидорова сын Естифей\" followed by \"Естифеевы сыновья\". [S16] A bare \"сын\" under a head usually refers to the head ([reading confession lists, step 2](russian-orthodox-confession-list-reading.md#2-read-the-layout-before-the-names)). Keep the chain as written. If the spreadsheet has fewer name levels than the entry, add a level. Leave an unclear referent open.\n- **Beware of a relation recoded to the head.** One published translation of an 1817 additional revision list gives a boy as \"Iosel's son\" in its comments column, and fills its relation-to-head column with a bracketed \"[Nephew]\" that it marks as the translator's own. [S18] A sheet that only has a \"relation to head\" column forces that recoding and can hide a wrong attachment.\n- **Use the female half to check the male half.** In the female half [S19] a wife is written by her husband's name: \"Ивана Мартынова жена Татьяна Аверьянова. Его же дочери\". [S17] Read that formula against the male half to see which wife belongs to which man, for example a father and a son of similar names, and to find a daughter listed only on the female side.\n- **Keep period kin terms as written.** Start from the [period kin-term rule](ai-for-documentary-records.md#what-to-never-trust-or-delegate-verify-or-dont). Dal gives зять as a daughter's husband, a sister's husband and a husband's sister's husband. [S20] He gives приемыш as a child taken into the family, and, in eastern speech, also as a son-in-law taken into the house. [S21] The translated 1817 list enters a six-year-old as \"Son-in-law (primak)\". [S18] Where another list gives a more specific relation, add it in brackets with its source.\n- **In an entry without a surname, read the second name element as a patronymic form.** Up to the 19th century most peasants were entered in the revisions without a surname, so Прокопий Иванов's son Василий was Василий Прокопьев, \"а вовсе не Иванов\". [S22] Wikipedia calls such forms in older entries, as in «посиделец Ивашка Григорьев», \"ещё не фамилии\" (полуотчества). [S23] Call it a patronymic in the audit, not a surname, and reason from it to the father, after the [converts check in the revision-list recipe](russian-revision-list-household-chaining.md#4-transcribe-each-entry-field-by-field). Where an entry also carries a surname, keep both.\n- **Brackets and margins carry data.** In confession lists a priest often joined a group with a bracket and marked them all \"были\". [S24] Record any other bracket and the word beside it as a note; attendance marks are covered in [step 8](#8-keep-what-is-not-an-error-out-of-the-error-list). A transfer note can name the owner's other estate, as in a 1763 tale's \"Переведен … в господина моего вотчину\". [S25] Such a note opens the owner's estate records as a new source.","sources":["S14","S19","S15","S16","S18","S17","S20","S21","S22","S23","S24","S25"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f79cbcd19a9a","kind":"example","anchor":"- **Watch for look-alike names.** A participant on the VGD forum called reading Данилов as Денисов \"очень запросто\" because only two letters differ. [S10] Decide such a pair by the letters that differ ([step 2](#2-settle-a-disputed-glyph-against-the-same-scribe)). According to Kinprove's own audit notes [S26†], one transcription entered Михаил for Максимъ in several lists; the third letter, к or х, decides.\n- **Expect church and colloquial forms of one name.** Petrovsky's dictionary of Russian personal names gives Фетис as a popular form of Феоктист [S7], Финоген as a colloquial form of Афиноген [S8] and Аксинья as the folk form of Ксения [S9]. One person can appear under both forms in different lists. Record the form written, annotate the identification, and do not normalise.\n- **Resolve a garbled or unreadable name through the household.** Familio advises matching people in confession lists by age and family composition. [S12] The editor of a published 1795 revision says it helps to clarify names written illegibly in the 1782 one. [S11] On the VGD forum a participant's advice was to order the previous revision, \"тогда все должно встать на места\". [S10] Read the other year's image for the same household, then return to the hard name.","sources":["S10","S26","S7","S8","S9","S12","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bc9fa4a42f6e","kind":"example","anchor":"Another year's entry can change a reading, but a copied entry is not a second witness. The same editor read puzzling letters beside two girls' names in the 1795 list as the word \"не\", correcting a name, only after finding the girls in the 1782 list. [S11] Confession lists were usually copied from the previous year's list, \"с внесением в него изменений за прошедший период, исправлением старых ошибок и созданием ошибок новых\". [S13]","sources":["S11","S13"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-baac3de80fe5","kind":"method","anchor":"- **Find the scribe's arithmetic and use it as evidence.** A participant on the SmolBattle forum says revisions as a rule did not ask peasants their age, but added the years since the last revision to the previous age. [S27] In a published 1795 tale every person entered with both a previous and a present age, men and women alike, shows a difference of exactly 13, the interval since 1782. [S11] Where a household follows such a rule, it is strong evidence for one reading of a disputed digit, not a reason to change a figure the image shows clearly.\n- **Expect ages repeated from the previous list.** The same forum thread notes that a new tale was built on the previous one, so its errors in age, name or patronymic were often («частенько») \"попросту дублировали\". [S27] A person who carries the same age in two lists several years apart may be a copied entry or a declared age that did not change ([revision-list recipe, step 5](russian-revision-list-household-chaining.md#5-test-formulas-placements-and-ages-before-using-them)). Keep the image value and add a note such as \"same age as in the previous list; other years give birth about 1780\". Do not correct it, and do not use it alone for a birth estimate.\n- **Check the transcriber's own scheme too.** A sheet can fill ages by its own rule, such as the previous age plus the interval. An entry that breaks the transcriber's rule, or a death that has no note while its age follows the rule, needs the image.\n- **Keep ages and numbers as written.** Russia's archival publication guidance keeps archaic number forms such as «полчетверта» and «полторо» as written. [S28] A published transcription of an 1858 revision keeps \"4 мес\" and \"12 1/2\" in the age columns. [S33] Record a worded age such as «полугоду» as written, with its value (half a year, 0.5), never as a decimal guess.\n- **Read the year in a remark as its own date.** An exit remark gives the year of the event, as in a 1795 tale's \"Евстафей Федоров 50 1786 год умре\". [S11] Do not let it collapse into the revision year, and settle its digits against the same scribe's other years ([step 2](#2-settle-a-disputed-glyph-against-the-same-scribe)). The SmolBattle participant adds that death years in revisions were often written from memory. [S27] So even a correctly read year is a statement, not a precise date.","sources":["S27","S11","S28","S33"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bf2e48910f1c","kind":"method","anchor":"- **Columns left out on purpose.** In confession lists the attendance column holds \"был\", \"была\", or a bracket over a group marked \"были\" ([reading confession lists, step 3](russian-orthodox-confession-list-reading.md#3-read-the-attendance-columns-as-an-administrative-mark)). [S24] A transcription that leaves these marks out on purpose has no omission. Ask before you report one.\n- **The researcher's own additions.** Editors mark their own additions separately. The National Archives asks transcribers to put their comments in a separate field, not in the transcription. [S1] Russian archival guidance puts words restored by the editor in square brackets. [S28] BYU's palaeography introduction uses brackets for letters the transcriber inserted. [S30] A translated 1817 revision list states that its bracketed items are the translator's and \"do not appear in the original record\". [S18] A column such as a family surname added as a research tag has no counterpart in the image. Do not report it as an error and do not remove it.","sources":["S24","S1","S28","S30","S18"],"checked":"2026-11-10","stated_as":"observation","review":"reviewed"}
  - {"id":"C-88e5a4545f0f","kind":"method","anchor":"- **Record what the image says, even against other years.** Russian archival guidance does not correct wrong numbers or wrong proper names in the text. It gives the probable correct form in a note, or \"Так в документе\" when other sources cannot check it. [S28] The National Archives asks transcribers to type words exactly as written, \"even misspelled words\". [S1] An edition of a 19th-century journal leaves incorrect dates \"to stand\" and occasionally adds notes to clarify or correct them. [S29] So when a couple's ages fit neither the earlier nor the later list under any reading, record the image value and the inconsistency.\n- **Present the competing readings and let the researcher rule.** For each disputed item give the readings, the same-hand comparisons and the cross-year table, then record the ruling and who made it. According to Kinprove's own audit notes [S26†], researchers' rulings that overruled first-pass model readings were later supported by the other years.\n- **Make crops a reviewer can check.** A very wide strip is hard to check in a small preview, and a vision model reads it no better. Anthropic's vision documentation says a large image is scaled down to fit a maximum long edge while its aspect ratio is kept, and that this can \"make text less legible\". [S32] So a strip twenty times wider than it is tall keeps only a twentieth of that limit as its height. Crop close to the item. Include two or three lines of context, the person-number margin and the age column, and look at the crop yourself before you send it to the reviewer.","sources":["S28","S1","S29","S26","S32"],"checked":null,"stated_as":"observation","review":"reviewed"}
