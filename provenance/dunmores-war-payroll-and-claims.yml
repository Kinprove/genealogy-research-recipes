claims:
  - {"id":"C-dunmores-war-payroll-and-claims-01","kind":"portal-availability","anchor":"From the available excerpt, the presenter points to the claims commissioners’ ledger in Virginia Colonial Government Records, Record Group 1 [S1 @2026-11-22]. Start with the Library of Virginia’s Dunmore’s War Payroll and Service Claims guide. Its partial name index links to digitized ledger pages for Augusta, Bedford, Botetourt, Culpeper and Fincastle [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-dunmores-war-payroll-and-claims-02","kind":"method","anchor":"From the available excerpt, the presenter advises browsing the ledger after an unsuccessful name search [S1]. Browse the relevant county pages because the index omits some pages. Transcribe whether the entry pays for a length of service, goods or other support and copy the amount and locator. Keep the exact basis of payment in the result [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dunmores-war-payroll-and-claims-03","kind":"custody","anchor":"From the available excerpt, the presenter points to Miscellaneous Microfilm Reel 78 [S1 @2026-11-22]. Use that reel for West Augusta Public Service Claims, the Pittsburgh, Romney and Winchester vouchers and the Pittsburgh payroll. Verify access with the library before relying on a loan. Keep a miss in the online ledger index separate from an unsearched reel [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
