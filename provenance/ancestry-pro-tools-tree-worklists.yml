  - {"id":"S5","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933315030419-Tree-Checker-in-Ancestry-Pro-Tools"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Opened via the support redirect. Documents the All People filters, profile exclamation mark and potential-error flags.","entry_sha256":"523b88d115f19243f16ae252929cddbfe44d901733daeb8be940b54cb62acece","claims":["C-08"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the interviewee’s advice, use a locality-filtered list as a starting group for a one-place study, or use a common census tag to bring a set of profiles together. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"According to the interviewee, review the map’s numbered circles for a birth or marriage in an outlying place. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"Open **All People** and **Filters**. In **Events & places**, pick **Any Event** and the locality for a one-place worklist. For a census list, filter **Custom Tags** by the shared tag already attached to the candidate profiles. Record the filters with the result. A place match reflects an event recorded in the tree. [S2 @2026-11-18]","sources":["S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"Open **Tree Mapper** to review mapped birth or marriage events. It opens on direct ancestors. Apply an event filter and open the numbered circles to examine outlying locations. Check the underlying place entry before using the circle as a locality lead. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"According to the interviewee, use a branch chart as a visual reference and return to the underlying tree for the sources of its facts. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"In **Charts & reports**, choose a descendant report and change **Focus person** to the branch’s starting ancestor. Check the preview for the chosen branch and preferred parents. Download the branch chart to the user’s own device when a local copy is needed. [S4 @2026-11-18]","sources":["S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"According to the interviewee, check Tree Checker flags before changing the profile. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-08","kind":"platform-ui","anchor":"Use the **Tree Checker** filters in **All People** to list flagged profiles. For one person, open the profile and click the circled exclamation mark at the upper right. Review the marked fact and evidence, then decide whether the flag points to a duplicate, an incorrect value or missing documentation. [S5 @2026-11-18]","sources":["S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
