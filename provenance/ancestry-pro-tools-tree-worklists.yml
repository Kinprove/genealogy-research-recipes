sources:
  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=FHnaTOOWMGE"],"published":"2024-04-16","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the interviewee’s locality, common-tag and chart ideas and the presenter’s suggested use of Tree Checker.","entry_sha256":"3f281b43b9f0ddd15d9c6cb40a2e3b8b13ac2788ca7e88a1ce21e588c51a4dd8","claims":["C-01","C-02","C-05","C-07"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933269993363-Smart-Filters-in-Ancestry-Pro-Tools"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Documents the All People filters for error types, events, places, dates, family lines and standard and custom tags. The list has no download or print function.","entry_sha256":"c89223e96a116376d52ac6af1bedac46f8719f9035c0fb1d82ffbbe2e265d320","claims":["C-03","C-09","C-12"],"review":"reviewed"}
  - {"id":"S3","kind":"help-page","urls":["https://help.ancestry.com/hc/en-us/articles/53933348446355-Tree-Mapper-in-Ancestry-Pro-Tools"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 via the support redirect. Documents the tree-view path, direct-line default, filters and the count of people represented by each numbered circle. The help page explains the circle counts and gives no color key for green shading.","entry_sha256":"4bc23a6fc2e4df2bd733450d74be108364608f41a6d6d8609664e04de292487b","claims":["C-04"],"review":"reviewed"}
  - {"id":"S4","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933269892627-Charts-and-Reports-in-Ancestry-Pro-Tools"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Documents report types, focus person, the two-to-seven generation range where offered, preferred-parent scope, download, and saving a printed fan view to a local PDF.","entry_sha256":"f833256ccec0bf8386dce64a19b8461f2ac3a1b5930fbbe2e31b31c74ca4466f","claims":["C-06","C-10"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933315030419-Tree-Checker-in-Ancestry-Pro-Tools"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 via the support redirect. Documents owner and editor access, the minimum tree size, the homepage shortcut's tree selection, profile controls and causes of empty results. Ancestry says the possible-errors list cannot be downloaded or printed.","entry_sha256":"dcd9c605c5d899e4adb440ee4ac656b7528d06197959a4cd0eb5081128af1ef1","claims":["C-08","C-11","C-12","C-13"],"review":"reviewed"}
  - {"id":"S6","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933347891091-MyTreeTags"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Documents the person card's tag controls, standard and custom labels, and tag visibility.","entry_sha256":"bd6f8d182fbd8a4a9ab925953733f2f6bef96b617b5ef91e9d9398080bb551f2","claims":["C-09"],"review":"reviewed"}
  - {"id":"S7","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933302364691-Finding-People-in-Your-Tree"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Documents the Find in tree path to List of all people.","entry_sha256":"66ae9a4aa53105ce1e6af70209c450feff89f112b6b5462dd739f312c68b0cf5","claims":["C-03"],"review":"reviewed"}
  - {"id":"S8","kind":"help-page","urls":["https://help.ancestry.com/hc/en-us/articles/53933288216083"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22 via the support redirect. Documents the three standard layouts, the Print command and the visible-only scope of its output.","entry_sha256":"a3ef11e27c563dd9d6aad7fff08675143fcb202472c959d7407047ed1221b5bc","claims":["C-10"],"review":"reviewed"}
  - {"id":"S9","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933332610067-Ancestry-Hints-for-the-Wrong-Person"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Documents hints for the wrong person and comparing the record with facts and people in the tree.","entry_sha256":"173593e3f5367a0b3375db3e8bcf830c5eaf5d6d22f138a03bb6cfa3ab487835","claims":["C-13"],"review":"reviewed"}
  - {"id":"S10","kind":"help-page","urls":["https://help.ancestry.com/hc/en-us/articles/53933322290323-Tree-Insights-in-Ancestry-Pro-Tools"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Documents the homepage path, reuse of the last eligible tree and the marriage-age ranking. The help page gives no instructions for a family-line filter.","entry_sha256":"250f7ac8b9e2f4b33895c3c3c477d8415419096343b8421b4f47cdc5f0ef5efd","claims":["C-14"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the interviewee’s advice, use a locality-filtered list as a starting group for a one-place study, or use a common census tag to bring a set of profiles together. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"According to the interviewee, review the map’s numbered circles for a birth or marriage in an outlying place. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"In the intended tree, open **Find in tree** → **List of all people** → **Filters**. For a one-place worklist, select **Any Event** and the locality under **Events & places**. For a narrower search, choose an event such as birth and add a year or range, or use **Family line** to select paternal, maternal or end-of-line profiles. Record the active filters and work through the matches in Ancestry. A place match reflects an event recorded in the tree. [S7 @2026-11-22] [S2 @2026-11-22]","sources":["S7","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"In the tree, open **View** → **Tree Mapper**. The map starts with direct ancestors. Set **Map Filters** to the family line, event, time or place you want to investigate. Check the active filters before comparing locations. Each numbered circle counts people with a matching event or fact in that area. Open the circle and check the underlying place entry before using it as a locality lead. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"According to the interviewee, use a branch chart as a visual reference and return to the underlying tree for the sources of its facts. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"Open the intended tree first, then choose **Charts and Reports** from **View**. Under **Document type**, use **Descendancy** for a line of descendants, **Register** to group descendants by family, **Ahnentafel** to trace ancestors, or **Family group sheet** for parents and their children. Set **Focus person** to the person the report should start from and choose the generation count when offered (2–7). Check the preview for the chosen branch and preferred parents. Download the branch chart to the user’s own device when a local copy is needed. [S4 @2026-11-22]","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"According to the interviewee, check Tree Checker flags before changing the profile. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-08","kind":"platform-ui","anchor":"Open the flagged person's profile and use the circled exclamation mark or **Tools** → **Check for errors**. Review the profile and its sources to decide whether the flag points to a duplicate, an incorrect value or missing documentation. Leave unresolved gaps open. [S5 @2026-11-22]","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"platform-ui","anchor":"To group profiles in an unshared tree, open a person's card and choose **More options** → **Add tag** or **Edit tags**. Apply a standard label such as **Military Service** or a custom label for the census worklist. To retrieve tagged profiles, open **All People** → **Filters**, select the corresponding category under **MyTreeTags** and choose the tag. These tag filters are available without Pro Tools. [S6 @2026-11-22] [S2 @2026-11-22]","sources":["S6","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"platform-ui","anchor":"For a copy of the tree view, choose **Fan**, **Horizontal** or **Vertical** from **View** and bring the part you need into view. Use **More** → **Print** to print the visible part on the user's local printer or save it to the user's device if the print dialog offers a PDF option. Check the preview for the intended scope. [S8 @2026-11-22] [S4 @2026-11-22]","sources":["S8","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"platform-ui","anchor":"Open the intended tree that you own or can edit and select its **Tree rating** or circled exclamation mark. The checker requires at least 50 people in the tree. If you use **Tree Checker** from **Pro Tools shortcuts** on the homepage, confirm the tree before reviewing the queue. The shortcut opens the last tree you viewed that you own or can edit. [S5 @2026-11-22]","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"platform-ui","anchor":"In **All People** → **Filters**, use **Tree checker** to select a category such as possible duplicates or people with only tree sources. Combine it with **Family line** or **Events & places** to narrow the review. Work through the on-screen list. If it is empty, clear or broaden the filters before drawing a conclusion. [S2 @2026-11-22] [S5 @2026-11-22]","sources":["S2","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"platform-ui","anchor":"Even with an empty **Possible Errors** list, check the record’s dates, places and relatives if it may have been attached to the wrong person with a similar name. [S5 @2026-11-22] [S9 @2026-11-22]","sources":["S5","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"platform-ui","anchor":"Open the tree you intend to review, then go to the homepage and choose **More Pro Tools** → **Tree insights** → **Explore your insights**. Confirm the tree before using the rankings. Insights uses the last tree you viewed that you own or can edit, so open the next tree before returning to Insights. Use an outlier such as an unusually young marriage age as a lead to check the birth and marriage dates in the underlying profile. [S10 @2026-11-22]","sources":["S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
