claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Search [MyHeritage's Queensland Licensed Victuallers index](https://www.myheritage.com/research/collection-20250/australia-queensland-licensed-victuallers-1900-1914) for gazette entries from July 1900 to July 1914. Copy the holder, publication date, place of issue, publication locator and any newspaper reference. If given, record coordinates as a town locator. Put the hotel or premises in its own field [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"Also check the State Library of Queensland's *Queensland Victuallers Licence index* in One Search. Use the name, hotel and district in the result to distinguish same-named holders. The index covers only some gazette transfers, so check the gazette for intervening changes when the same premises appears with different holders [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"custody","anchor":"Carry the indexed publication date and reference to the *Queensland Government Gazette*. For the indexed years, use the State Library's onsite copies or the Queensland State Archives guide to find the issue. Check the notice heading to distinguish an annual list from a transfer and record any separate date of grant or transfer [S2 @2026-11-22] [S3 @2026-11-22] [S5 @2026-11-22].","sources":["S2","S3","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Follow the newspaper citation on the index entry if present. Use [historical newspaper search](historical-newspaper-section-search.md) to open the issue and read what the notice actually announces. An application to transfer a licence leaves the approval open. Compare it with the gazette result or licensing record before adding a change of holder to the timeline [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"custody","anchor":"Before July 1900, check Appendix 1 of the Queensland State Archives hotel-records guide for annual gazette references. For records from 1914 onward, search the hotel or premises name in the Queensland State Archives' *Licensed Victuallers' Licence files*, series S17933, and check relevant district registers in the same guide. Use each series' dates and district to choose the item [S5 @2026-11-22].","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
