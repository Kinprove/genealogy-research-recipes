  - {"id":"S46","kind":"web-page","urls":["https://blog.familytreedna.com/transfer-your-dna-data-for-free/"],"published":"2019-05-02","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","claims":["C-2ba850b12cbe"],"review":"reviewed","entry_sha256":"117fbe2a70fb4b0edd0cd7da4e8b94e08eb5ab72b7a49e8afe7d13b033142bac"}
  - {"id":"S47","kind":"web-page","urls":["https://www.beholdgenealogy.com/blog/?p=3872"],"published":"2022-01-10","retrieved":"2026-11-14","access":"read","rights":null,"basis":"read 2026-11-14","entry_sha256":"cb707132cdf510ef2e3bbb714e43b56e51c5bd7782108145cf8a5d36e92946e8","claims":["C-66cdb0444f6c"],"review":"reviewed"}
  - {"id":"S48","kind":"web-page","urls":["https://dna-explained.com/?p=27648"],"published":"2019-11-06","retrieved":"2026-11-14","access":"read","rights":null,"basis":"read 2026-11-14","entry_sha256":"398c4de7bf70ef838ea720550a4b142a883604162c7f862b5f2658b5d1d8886b","claims":["C-66cdb0444f6c"],"review":"reviewed"}
claims:
  - {"id":"C-a9790b7f2df6","kind":"unclassified","anchor":"For workflows 1–4, use authorized account access and start with the paired export in workflow 1. FTDNA downloads\nrequire two-factor authentication. [H6]\nKeep original files and profile details private; use opaque handles in shared summaries.\nAuthorized access covers analysis, not tree changes: workflows 3 and 4 also need the privacy\ngate in `SKILL.md`, set out at the start of workflow 3, before any tree connection or\nmatch link.","sources":["H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c7411f19cbcf","kind":"unclassified","anchor":"For an authorized kit-continuity handoff, distinguish present access from a recorded kit\nmanager and any separately recorded beneficiary. Leave missing or unconfirmed designations\nunresolved; shared credentials do not establish either designation. The [2023 update](https://dna-explained.com/2023/12/11/familytreedna-2023-update-past-present-and-future/)\nmotivates this distinction.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8925b948586d","kind":"unclassified","anchor":"For an intended mtDNA/autosomal match intersection, record the verified tested person,\neach kit identifier and which test results are available to the actual query. If results\nare held under separate kit identities and the available query cannot combine them, record\nthe intersection as unavailable, not an empty match result. Before any separately authorized\ntransfer or additional test, verify the intended destination kit and current provider handling.\nRetain the test-to-kit mapping and query scope. The [2025 discussion](https://www.youtube.com/watch?v=essG5JYMERw)\nmotivates this check without establishing a current kit-merging rule. [S19] Read a returned\nmultiple-test roster with the Advanced Matches checks at the end of\n[workflow 6](#6-record-a-family-finder-matrix-comparison).","sources":["S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3e8028559c0a","kind":"unclassified","anchor":"On Family Finder Matches, use **Export CSV → All Matches** for the match list. In the Chromosome\nBrowser, use **Download All Segments** for all matches' segment rows; **Download Segments** produces\nonly the comparison subset. [S1, S2, H6, H7]","sources":["S1","S2","H6","H7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-45a1fe6527fb","kind":"unclassified","anchor":"When the match list is filtered by ancestral surname or haplogroup, treat the result as a search\nsubset. A surname search may return similar spellings: check each returned row's surname fields for\nthe target surname, and mark the others `similar-name hit` before following their shared matches. A\nhaplogroup filter or same-haplogroup indicator covers only haplogroups FTDNA holds for those kits.\nRecord a match missing from that result as `haplogroup not shown`, not as carrying a different\nhaplogroup. The [2021 search discussion](https://www.youtube.com/watch?v=gNFNKpvy1no) motivates both\nchecks, including a haplogroup known only from another vendor's test that did not appear.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b6395726557d","kind":"platform-ui","anchor":"For a same-surname search, also compare the Y haplogroups shown for male matches. A label may\nbe STR-predicted, derived from the Family Finder test (partial, SNP-based) or SNP-tested; a\nmore refined Family Finder label replaces the STR prediction. Ancestry and 23andMe transfers\nshow no haplogroup to matches, MyHeritage transfers completed after October 2025 currently\nreceive none [H12 @2026-11-12], and female testers have no Y label: record those as\n`haplogroup not shown`, never as a mismatch. A label from a different source or at a different\ndepth is not a conflict until both labels have been put into Discover's **Compare** and recorded\nas in [workflow 8](#8-preserve-the-inputs-and-reference-in-a-two-label-comparison). If they fall\nin the same lineage, keep the man as a candidate for Y-DNA testing or for shared-match and\ntriangulation work. Reliable, incompatible SNP-defined lineages rule him out as a recent direct\npaternal-line candidate, even within one major haplogroup; he can still be an autosomal relative.\nDifferent upstream and downstream labels alone do not establish incompatibility.\n[S24 @2026-11-12], [S26 @2026-11-12], [S27 @2026-11-12], [S28 @2026-11-12]","sources":["H12","S24","S26","S27","S28"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fbb53dde39c1","kind":"unclassified","anchor":"Read a match's ancestral surname list as self-reported. Its order carries no fixed meaning: a list may run by generation, alphabetically or in order of appearance, and a [2020 FamilyTreeDNA walkthrough](https://dna-explained.com/?p=31186) shows surnames shared with the viewer moved to the top in bold. Do not infer side, generation or line from a surname's position. To reconstruct the tree of a match without a usable tree, search compiled trees for combinations of the listed surnames and any most distant paternal and maternal ancestors named on the profile. Record a couple found this way as `candidate couple` until descendancy research accounts for the other listed surnames; list any surname it leaves unexplained. A [2024 case-study article](https://www.legacytree.com/blog/genetic-genealogy-proceed-if-a-dna-match-never-responds) motivates this check. [S20, S21]","sources":["S20","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-99f4cc098a08","kind":"unclassified","anchor":"Treat a match-date value as the date shown on that match row, not as the match's test date, chip version or processing cohort. A [Family Finder match-date discussion](https://genarchivist.net/showthread.php?tid=275) reports older matches showing 2021 dates after matching was recalculated. It also shows a kit's order history and administrator lab-results view recording a later chip procedure for an earlier order. Where authorized, take test and chip history from those records; otherwise record `test date unknown`.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-170ab893d708","kind":"unclassified","anchor":"A match present in only one of two dated exports of the same kit is a list change (`absent in later export` or `new in later export`, with both retrieval dates), not relationship evidence. A [Family Finder reprocessing discussion](https://forum.molgen.org/index.php/topic,1298.0.html) shows matches removed and later restored after provider reruns in 2012–2013.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6a550afed36a","kind":"unclassified","anchor":"**Synthetic manifest example:** kit `K1`, retrieval date/time `2026-10-03T10:00:00Z`, file `K1-matches.csv`, tool\n`Family Finder Matches`, export choice `All Matches`, active filters `none`, scope `all`, row count\n`240`, interface count `240`, links as of `2026-10-02`, checks `passed`.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-871e7326a1d9","kind":"unclassified","anchor":"Before an independently authorized upgrade or replacement of an existing Family Finder\nresult, preserve the currently available match and segment files, raw data and origins\nreport, or the supplied views where exports are unavailable. Record each saved product's\nkit, date and processing/test version, plus anything unavailable to save. Keep later results\nseparate. The [2026 upgrade notice](https://blog.familytreedna.com/family-finder-ngs-upgrade/)\nwarned that prior results would be removed and described different export access for transfer\nkits. [S12]","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3ec9cab7c7ae","kind":"unclassified","anchor":"The match file has one row per match; the segment file repeats a match for each reported interval.\nUse the match CSV's full-name column, rather than its separate first/middle/last-name columns,\nand compare its exact values with names in the segment CSV. [S1, S2] Use files from the same kit\nand export session. Hold out duplicated names and any unmatched spelling for the note-handle\nprocedure below.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c0ac0ba7fc38","kind":"unclassified","anchor":"For each held-out person, open the separate match profiles and assign opaque local handles in the\nprivate working ledger. Append that person's handle to their FTDNA match note, preserving the\nexisting note. Notes are included in the match CSV: re-export the pair through workflow 1 and\nverify that each handle identifies exactly one metadata row. [S1, H7]","sources":["S1","H7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-88188946ad62","kind":"unclassified","anchor":"On the Matches page, select only the row for one handled person and click **Compare Relationship**.\nIn the Chromosome Browser, use **Download Segments** and label the resulting file with that handle.\nRepeat for each other person. Keep the original ambiguous segment rows out of the join; replace\nthem with the labeled single-match files, joined to their handled metadata rows. [H6, H7]\nUse the displayed **Shared DNA**, **Longest Block** and linked relationship as cross-checks; the\nnote handle binds the row even when those values tie. Keep views by match and by chromosome/start/end.","sources":["H6","H7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-31c50a2c501f","kind":"unclassified","anchor":"Carry **Linked Relationship**, **Matching Bucket** and **X-Match cM** from the match export into the\njoined table. Those columns preserve the tree relationship, provider side assignment and X amount\nwithout retyping the screen. FTDNA reports X matches only for people who also match on an autosome;\nX-only relatives do not appear in this Family Finder match export. [S1] Keep the original exports and\nsave the join as a separate file.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f2e52c218143","kind":"unclassified","anchor":"Before connecting, switching or disconnecting the MyHeritage tree, seed a link inventory from the\nmatch export's **Linked Relationship** and **Matching Bucket** columns, then record the corresponding\ntree person from your existing link ledger and documented pedigree path for each linked match.\n[S1, S4] The MyHeritage tree does not mark who is linked, so the inventory comes from the FTDNA\nside. [H3] After a tree transfer, formerly linked people arrive flagged in the GEDCOM, but each must be searched and confirmed again through Account Settings → Genealogy →\nLink your matches: **Search**, then confirm each suggested person. These are suggestions, not\npreserved links. [H3]","sources":["S1","S4","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c9b06c766062","kind":"unclassified","anchor":"To link a match: **Link on Family Tree** beside it, then search the person's name as written in\nMyHeritage, including prefixes and the maiden surname. [S4, H3] Candidates return with relationship\nto the kit, full name and birth/death years; choose by the documented path recorded beforehand, not the first\nname hit.","sources":["S4","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e387de72e67","kind":"platform-ui","anchor":"Family Matching requires a Family Finder result, matches, a connected MyHeritage tree for new\nlinks, the tester set as Home Person in the FamilyTreeDNA Family Tree Settings before linking, and\nat least one linked maternal or paternal match. Any linked match related through only one parent\ncan phase other matches, however close or distant. To assign a match, FTDNA detects a shared\nphased DNA block between the tester, match and linked relative: the block is carried by the same\nalleles and meets the special Family Matching threshold. The linked relative's tree position\nsupplies the parental side. ICW is not used for bucketing. [H4 @2026-11-12], [S5 @2026-11-12]","sources":["H4","S5"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-db023599ff53","kind":"platform-ui","anchor":"Compare the dated counts and known-side paths. If counts are unchanged, check H4's conditions:\nthe correct person linked at the correct tree position, an anchor related to the tester through only one\nparent, and processing finished after the link [H4 @2026-11-12]. If a bucket conflicts with a documented path,\ncheck the tree positions of the linked kits on the reported side and look for an additional path\nthrough that parent. Correct or remove a misplaced link and re-export. With anchor identities and\ntree positions verified, the bucket means FTDNA found a qualifying phased block shared with a\nlinked relative on that side. A documented relationship through the other parent does not refute\nthat assignment. Record both and test the additional descent path using `ai-for-dna-research.md`.\nPreserve the provider's assignments exactly, including unassigned rows, in each snapshot.","sources":["H4"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-76b71f68dbda","kind":"unclassified","anchor":"Link documented relatives who identify one side first: parents and grandparents, then aunts,\nuncles and cousins. Children and full siblings share both sides and cannot split them. [S5] An\nanchor linked under the wrong parent supplies the wrong side to phasing. The shared-cM relationship check does\nnot validate a relative's tree position: trace each anchor's path to the kit holder's mother or\nfather.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a735cd058942","kind":"unclassified","anchor":"Capture maternal, paternal, both and unassigned counts before each anchor link. After linking,\ncheck that the anchor's Matches row shows the expected **Linked Relationship**, then re-export\nthe match list. Record the link-change time separately from the export time and save the bucket\ncounts shown in that dated export. [H3, H4]","sources":["H3","H4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ceabdbb51481","kind":"unclassified","anchor":"Use this workflow for a project's public Y-DNA Group Time Tree. It does not require the\nFamily Finder exports above. A public project view contains selected participating Big Y\nlineages; it is shaped by subgroup selection and publication settings. [S6–S8]","sources":["S6","S7","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f64d4bcd79a0","kind":"unclassified","anchor":"1. Open the project's public website and its **DNA Results → Group Time Tree** entry, or find\n   the project through Discover's **Group Project** search. Select the relevant subgroup(s)\n   before reading the tree. Record the project URL, retrieval time and selected subgroup names.\n   A broad selection can combine distant branches and compress the recent part of the\n   timeline; narrow the selection to the documented project question. [S6, S8]\n2. Save the visible view and record the displayed branch label, time estimate and interval\n   exactly as shown, together with the selected display options. Distinguish a branch estimate\n   from a named historical person's dates. A dashed connection can represent collapsed\n   intermediate branches in this selected view. It does not show that those branches or their\n   SNPs are absent from the underlying tree. [S6, S8]\n3. If the view is blank or a known participant's details are missing, diagnose the display in\n   order: selected subgroup, presence of participating Big Y results, public project results\n   settings, member sharing and update timing. A padlock can hide a member's name or earliest\n   known ancestor. Record `details withheld` rather than inventing the missing identity or\n   classifying that kit as absent. Save the retrieval date and recheck date; the 2023 instructions\n   describe periodic updates, not an immediate reflection of every change. [S6, S7]","sources":["S6","S8","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a6376451e08d","kind":"unclassified","anchor":"**Optional administrator branch:** use authorized Group Administrator access to inspect the\nproject's public-results configuration. Save the previous settings before any change. The\nGroup Time Tree instructions require public Y-SNP or Y-STR results; use a public report only\nwithin the project's agreed publication scope. Arrange the relevant Big Y kits into useful\nsubgroups and verify the entered display names and earliest known ancestors. Those ancestor\nfields are maintained in the account; the administrator guide does not derive them from an\nuploaded tree. Preserve member sharing choices. [S6, S7]","sources":["S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-494c4209c12f","kind":"unclassified","anchor":"The 2023 S6 instructions locate report-publication options at GAP → **Public Website**,\nper-member Y-DNA result display at **Public Results Display Settings**, and subgroup assignment\nat **Member Subgrouping**. Start from these entries and record the screen names and controls\nactually offered before any change. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6bbba87e4599","kind":"unclassified","anchor":"A member's **Account Settings → Project Preferences → Group Project Profile** sharing choice\ncontrols permission to publish that project profile. Administrator access levels are a separate\nsetting. Having access to a kit does not by itself authorize its public display. Check the\npublic tree after an update and record unresolved display exceptions instead of changing a\nmember's opt-in to make a row appear. [H8]","sources":["H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7cfe6b6a7d2e","kind":"unclassified","anchor":"When using a project Country Map beside the tree, inspect and record the map's own included\npopulation and active filters. Do not carry the tree's subgroup selection over by assumption.\nLabel a broader project population separately from the selected paternal line; leave an unknown\npopulation unresolved. The [tree preview](https://dna-explained.com/2023/01/13/sneak-preview-introducing-the-familytreedna-group-time-tree/)\nand [administrator example](https://dna-explained.com/2023/01/17/project-administrators-how-to-prepare-your-project-for-familytreednas-new-group-time-tree/)\nmotivate this cross-view check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-13cbeda0b139","kind":"unclassified","anchor":"If the question needs broader tested-tree context, retain an available broader branch view\nbeside the selected project view, with its own branch, population and selection. Project\nmembership, map population and haplotree country counts do not carry over automatically.\nThe [project-to-broader-tree example](https://dna-explained.com/2023/10/18/y-dna-haplogroup-o-when-and-how-did-it-get-to-the-americas/)\nsupplies this handoff; modern earliest-ancestor places plus node ages do not establish a\nhistorical ancestor's location, migration or identity.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1ee36c7abe3b","kind":"unclassified","anchor":"When quoting a branch's tester count, country distribution or ancient-sample list from FamilyTreeDNA's public trees or Discover, record the view, branch level and retrieval date with each number. A [haplotree-versus-Discover count comparison](https://genarchivist.net/showthread.php?tid=275) found materially different country counts for the same branch, matching the pages' own descriptions of FTDNA-tested users versus testers plus academic participants; an [mtDNA Ancient Connections versus Classic Tree count](https://genarchivist.net/showthread.php?tid=1508) also differed, without an explained cause. Do not combine, subtract or substitute counts across views, and do not read a sample missing from one view as absent from the branch.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d546ef5996a7","kind":"unclassified","anchor":"Treat a public haplotree surname report as a display subset, not a branch roster. A [surname-report discussion](https://genarchivist.net/showthread.php?tid=275) quotes a display rule requiring at least two kits with public project-profile sharing and the same surname spelling; posters also observed names listed only at the kits' terminal branch. Record a surname missing from the report as `surname not displayed`, not as evidence that no tester of that surname sits on the branch, and note the branch level viewed. A listed surname does not establish a shared recent ancestor.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3de222e4fe54","kind":"unclassified","anchor":"When a Discover branch shows a tester who is not among the kit's matches, check whether the branch's suggested projects lead to a public project results page listing that tester. Record the project URL, retrieval date and the displayed surname, earliest known ancestor and haplotype exactly as published, labelled as project-display data. Record how the project row was tied to the branch entry; if the link rests only on inference, label it `unconfirmed link`. A [Discover-to-project lookup](https://genarchivist.net/showthread.php?tid=416) motivates this route. It shows only what that project chooses to publish. It establishes no match, contact route or genealogical connection.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-04ea1007a7e5","kind":"unclassified","anchor":"Before searching a project's public results for a line, set the page size so every row is on one page; a browser search of the first page alone gives a false negative. A [2026 walkthrough](https://dna-explained.com/2026/10/23/focus-step-2-finding-the-y-dna-and-mitochondrial-dna-of-your-ancestors/) changed a default of 25 rows to 5000. If a very large page size fails to load, step through the pages instead. Search the earliest-known-ancestor column for each surname in the documented line, generation by generation, in every subgroup: results sit in subgroups the project administrator defines. A haplogroup's colour can mark it as predicted rather than SNP-confirmed. Record a surname hit as `candidate row` until the listed ancestor is shown to be a documented member of the line; for mtDNA, that means a woman in the direct maternal chain or her matrilineal relative, such as a sister. [S29, H11]","sources":["S29","H11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ab1f54c8f9b8","kind":"unclassified","anchor":"Using authorized access, select the intended people on Family Finder Matches and open the\nMatrix, or select them within the Matrix. Save the focal kit handle, retrieval time, exact\nroster and displayed comparison label. The documented quantities are **Total Shared cM**,\n**Number of Shared Segments**, and **Predicted Relationship Range**; current Help uses slightly\ndifferent labels for the same three choices. Record the label actually offered. [S9, H9]","sources":["S9","H9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d12f0f90cfa0","kind":"unclassified","anchor":"Keep each metric separate: the cM and segment-count views exclude X; the relationship range is\na provider estimate, not a documented pedigree relationship. Preserve each selected pair's\ndisplayed value, including any blank or unavailable state, rather than turning it into a\nmeasured zero. [S9] Use `dna-comparison-controls.md` for the common observation-state rules.","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4a604bf22bc1","kind":"unclassified","anchor":"For an interval question, save the focal Chromosome Browser comparison for the same people,\nincluding coordinates and build when available. A Matrix cell does not identify the segment\nthat the two matches in that cell share with each other. Before recording that pair as sharing the\nfocal overlap, obtain its direct pair segment comparison through an authorized data source\nand check the interval. A count of one segment does not replace that check. Without it, record\n`mutual interval unverified` and retain the group as a lead. [S9, H6]","sources":["S9","H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-89e878d18900","kind":"unclassified","anchor":"For a locality or surname question, check whether the authorized focal kit offers a\nproject-restricted Family Finder view, such as the Advanced Matches report demonstrated in\n[this 2026 project example](https://www.youtube.com/watch?v=84MgafRdVg0). Save the focal kit,\nselected project, test/filter state, retrieval date, returned identities and displayed\nrelationship labels. Record the project's stated admission scope, or `unknown` if unavailable.\nThis is a roster of matches to that focal kit within the selected project: membership or\nconcentration does not establish origin, an ancestral path or pairwise matching among members.\nUse it as a scoped documentary research queue.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cf7f654e77f8","kind":"unclassified","anchor":"For a supplied Advanced Matches result using multiple tests, preserve each selected test and\nthe displayed combination setting. Establish whether the supplied setting requires a match on\nall selected tests or includes matches on any selected test before using its roster; if that\nscope cannot be verified, record it as unknown. Keep differently configured results separate.\nThe [2025 example](https://dna-explained.com/2025/09/02/mitochondrial-dna-a-z-a-step-by-step-guide-to-matches-mitotree-and-mtdna-discover/)\ndistinguishes these scopes for mtDNA and Family Finder. Matching the focal kit on both tests\ndoes not establish that both matches come through the same ancestor or descent path; such a\nmatch still needs\n[separate ancestral-path analysis](ydna-mtdna-interpretation.md#combining-tests-establish-which-ancestral-path-each-supports). [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9a32e673db51","kind":"unclassified","anchor":"When a Y-DNA test is among the selections, record the exact Y choice. A\n[2026 example](https://dna-explained.com/2026/11/02/focus-step-3-breaking-through-brick-walls-using-y-dna-and-mitochondrial-dna/)\nreports that **All Y-DNA** requires a match at every marker level from 12 through 111, not at\nany one level. For a Y/Family Finder overlap, select one Y-DNA marker level both men have\ntested and set **Show only people I match in all selected tests** to Yes; otherwise the roster\ncombines both tests' matches. Record a person absent from an **All Y-DNA** roster as\n`not shown under All Y-DNA`, not as a non-match. [S26, H10]","sources":["S26","H10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-83441f0bf41f","kind":"unclassified","anchor":"For a dated Globetrekker view or recording, retain the requested terminal node and the node\nactually displayed, including an upstream substitute. If a later co-located marker covers\nan earlier node, use an actually available earlier time view, enlargement or linked tree to\ninspect it; otherwise record that view as unavailable. The [2023 map-view example](https://dna-explained.com/2023/08/04/globetrekker-a-new-feature-for-big-y-customers-from-familytreedna/)\nmotivates this check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-33770914208b","kind":"unclassified","anchor":"Keep both supplied Y-haplogroup labels verbatim with their stated assay/report basis and\nretrieval date. In an actually available comparison, record which input or logged-in report\nserves as the displayed reference. Preserve conflicting labels rather than silently resolving\nthem. Save the observed joining node and paths separately from shared study, celebrity or\ngeographical categories. An upstream label or upgrade prompt does not establish assay history.\nThe [2023 comparison example](https://dna-explained.com/2023/10/11/new-discover-tool-compare-haplogroups-more-at-familytreedna/)\nmotivates this input/reference crosswalk.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-edc6fa0fca41","kind":"unclassified","anchor":"With each supplied Y label, also record the haplotree version shown in Discover's About section, if available, and the date the label last changed. Treat a label that changed recently or is under a pending analysis as `provisional`. Recheck it after a later published tree version, including the haplogroup's variants/equivalents details. A [Big Y results discussion](https://genarchivist.net/showthread.php?tid=6) reports a dated snapshot version, publication lag and a placement that reverted within a day.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6c5f6146e3d9","kind":"platform-ui","anchor":"For a tester who has died, FamilyTreeDNA's kit-access FAQ asks for proof of death (a death\ncertificate or an unambiguous obituary) and then gives access to the listed beneficiary, who may\npass it on. With no beneficiary, or a deceased one, it asks for the document appointing the\nexecutor or personal representative; anyone else needs that person's written authorization\n[S34 @2026-11-12]. FamilyTreeDNA also says it can give a recorded Kit Manager access when the\ntester has died and no beneficiary is named [S35 @2026-11-12]. Record which route the requester\nhas and which documents exist; until one is in place, record the kit as `access route not\nestablished`, not as lost. A living tester who wants the kit usable later names a beneficiary (a\nperson or a Group Project) and a Kit Manager in Account Settings [S35 @2026-11-12]. Estes reports\nthat a project administrator given Advanced access in Project Preferences can order upgrades\nthat the administrator pays for [S36 @2026-11-12]. These are the tester's own settings: describe\nthem, and do not change them for the tester.","sources":["S34","S35","S36"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e4b081b42e90","kind":"platform-ui","anchor":"A kit transferred from another company holds only that company's data file. No DNA comes with an\nupload, so the upload gives FamilyTreeDNA no sample [S30 @2026-11-12]. For a transfer customer who\nhas never submitted a sample to FamilyTreeDNA, the Family Finder NGS upgrade is the first time\nFamilyTreeDNA sequences that person's DNA, and a collection kit is mailed after the order\n[S12 @2026-11-12].","sources":["S30","S12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2ba850b12cbe","kind":"fee","anchor":"The Autosomal Unlock has been retired [S46 @2026-11-12], [S31 @2026-11-12].\nA transfer that was never unlocked has its matches and the Family Finder Matrix [S12 @2026-11-12]\nbut no Chromosome Browser, Chromosome Painter, myOrigins or ancientOrigins [S31 @2026-11-12],\n[S46 @2026-11-12]. A missing Chromosome Browser there reflects the lock, not missing data, and\nworkflow 2's single-match segment files cannot be made: keep held-out persons out of the join as\n`unresolved`. For workflow 1's export pair the sources disagree. Estes's August 2026 table lists a\nsegment download as free [S31 @2026-11-12]; FamilyTreeDNA says a locked transfer cannot save its\ndata before an upgrade [S12 @2026-11-12]. Record each file the account does not offer as\n`unavailable`, not as an empty result.","sources":["S46","S31","S12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2db50813277d","kind":"platform-ui","anchor":"Before concluding that a tester who has died or cannot swab again can get no further\nFamilyTreeDNA test, have the account holder ask Customer Service whether samples from an earlier\ntest remain in storage, how many and how old [S31 @2026-11-12], [S32 @2026-11-12]. Stored samples\ndegrade, and older ones are less likely to give a result [S32 @2026-11-12]. Record the answer and\nits date. Estes ordered Family Finder on her late mother's stored sample, so that close relative\nis at FamilyTreeDNA, and later at MyHeritage by upload, but can never be at AncestryDNA or 23andMe\n[S33 @2026-11-12]. A close relative missing from those two databases may still be at\nFamilyTreeDNA.","sources":["S31","S32","S33"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-46b51a490a94","kind":"platform-ui","anchor":"To work one grandparent's line, do not filter to that parent's bucket. A match is bucketed only\nwhen it shares a segment with a linked relative on that side, and some matches stay unassigned\neven with close relatives linked [S41 @2026-11-12]. If neither that parent nor any relative from that\ngrandparent's line is linked, many of the line's matches sit in the unassigned rows. Work that\nside's bucket and the unassigned matches together, and set aside only the opposite side's bucket\n[S42 @2026-11-12]. Keep any match from that bucket that also has a documented or plausible path through the\ntarget grandparent: a match related through both parents sits in one side's bucket when only that\nside has a qualifying linked relative [S41 @2026-11-12].","sources":["S41","S42"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b34ffa67ef67","kind":"platform-ui","anchor":"Record whether each Discover report was read in the public view, through a shared page, or signed\nin through the tester's own kit. Signed in with a Big Y kit, Discover shows up to 30 Ancient\nConnections for the haplogroup, against up to 10 otherwise [S37 @2026-11-12]. Globetrekker and the\nY-DNA Match Time Tree open only for a Big Y tester signed in to that kit [S38 @2026-11-12],\n[S39 @2026-11-12], [S36 @2026-11-12]. Estes saw two or three Ancient Connections on a publicly\nshared page where the signed-in tester had more than 20 [S40 @2026-11-12]. Record a report missing\nfrom a public or shared view as `not inspected in this view`, never as absent.","sources":["S37","S38","S39","S36","S40"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3b150a6a1f31","kind":"platform-ui","anchor":"An mtDNA tester listed in a Discover haplogroup report but absent from the kit's mtDNA matches may\nsimply be beyond the match threshold. At the coding-region level, tested only by mtFull Sequence,\ntwo testers match with up to three differences and only within the exact same haplogroup\n[S43 @2026-11-12]. Estes gives this threshold as the reason a tester may not match everyone in the\nhaplogroup [S44 @2026-11-12]. Record such a tester as `not a match at this threshold`, not as\noutside the haplogroup or unrelated.","sources":["S43","S44"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5bb21810f5cf","kind":"platform-ui","anchor":"The Matrix compares at most ten selected matches at a time [S9 @2026-11-12], [S45 @2026-11-12].\nSplit a larger roster into separately saved comparisons, each with its own roster record. A pair\nthat never shared a saved comparison is `not compared`, not a blank cell.","sources":["S9","S45"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f5aa6ce656ff","kind":"platform-ui","anchor":"Globetrekker reconstructs only pre-Columbian migrations. For a European or African paternal line\nwhose descendants live in the Americas or Oceania, the path ends on the original continent\n[S38 @2026-11-12]. A non-Native American haplogroup recorded with an earliest known ancestor in\nthe Americas is not mapped there [S23 @2026-11-12]. Read the endpoint as the branch's modelled\npre-Columbian location, not as where the line last lived or as evidence against a later\nmigration.","sources":["S38","S23"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-66cdb0444f6c","kind":"method","anchor":"When the third person is a relative whose kit you manage or are authorized to open, take the\nmissing pairing from that kit. In the focal kit's Chromosome Browser compare the focal kit with the\nrelative and with the match; then open the relative's kit and compare the relative with the focal\nkit and with the match. An interval present in all three pairings is triangulated, as in Kessler's\nuncle-and-match comparison of segments of 6 cM or more (Behold Blog, 2022-01-10 [S47]). The focal\nbrowser alone cannot supply that pairing: it shows whether people match you on the same segment, not\nwhether they match each other (Estes, DNAeXplained, 2019-11-06 [S48]). Record each pairing's\ncoordinates with the kit it was read from. A triangulated interval still needs the segment and\nancestor checks in `xdna-phasing-judgment.md`.","sources":["S47","S48"],"checked":null,"stated_as":"fact","review":"reviewed"}
