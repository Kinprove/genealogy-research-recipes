claims:
  - {"id":"C-000000000001","kind":"historical","anchor":"Use the USPS historian’s *Star Routes* guide to interpret three asterisks in a mail-contract record. They abbreviate the requirements for speed, reliability and security in transport. In this bidding context, look for a contractor carrying mail between post offices, with delivery along the way if the route called for it. Follow a postmaster appointment through the postmaster recipe. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"historical","anchor":"Check the bid and award for the proposed and accepted conveyances. After the 1845 bidding change, keep horseback and stagecoach in play because some routes still favored stagecoaches. For an advertisement under the 1852 instruction, look for the bidder’s stated conveyance when proposing a mode beyond horseback. Keep the conveyance open if the award does not identify it. [S2] [S5]","sources":["S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"custody","anchor":"Start with Publication 119’s mail routes and contractors section. For a pre-1814 clue, check early correspondence, Hugh Finlay’s journal and contemporary newspapers. For later contracts, use Preliminary Inventory 168 and the RG 28 mail transportation guide to locate the register run for the state and period. Mark gaps in the register coverage before reading a miss. [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"According to the presenter, start with the contractor lists by period, state and surname, then follow the contract index to the register [S1†]. Take the period and state to the lists of Star Route mail contractors, 1833–1877, identified in the RG 28 guide [S3].","sources":["S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000005","kind":"custody","anchor":"If the register search stalls, check the RG 28 journals containing Orders of the Postmaster General for the period of the contract. Narrow the run with a documented bid or award date before browsing. [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000006","kind":"method","anchor":"According to the presenter, use the advertisement date cited in a Postmaster General report to find the published call for proposals [S1†]. According to the presenter, return to the report when the newspaper notice omits the place, and compare origin, ordered stops and destination across contract periods before linking route numbers. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000007","kind":"method","anchor":"For each proposed route, copy the stops and service schedule from the advertisement. In the contract register or report, distinguish the successful bidder from the other bidders. Record award date, service dates and route number separately. [S4] [S5]","sources":["S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000008","kind":"method","anchor":"If a name appears in the *Official Register* under a state, use the listing date and state to narrow the contract search. Require a dated route-level award before assigning the itinerary to that person. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
