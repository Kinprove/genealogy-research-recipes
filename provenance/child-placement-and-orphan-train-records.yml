claims:
  - {"id":"C-placement-not-adoption","kind":"method","anchor":"If the proposed adoption has no court record, check the orphanage and census under the child's earlier name and the receiving household's surname. Build separate entries for admission, placement, later transfer and any legal order. Keep a temporary or incomplete placement in the sequence and check for the related institutional papers [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-orphan-train-agency","kind":"custody","anchor":"Use the earliest known institution or placement location to identify the sending agency. For the Children's Aid Society, start with Series XI and distinguish its emigration and placing-out material from foster-home records. Read the series' access conditions before selecting a volume or case file. If the agency is unknown, start with the National Orphan Train Complex research resources [S2 @2026-11-20] [S3 @2026-11-20] [S4 @2026-11-20].","sources":["S2","S3","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-request-placement","kind":"custody","anchor":"Request the placement file using the agency locator and the child's documented names and placement dates. For restricted Children's Aid Society material, follow the finding aid's referral procedure through the holding library [S2 @2026-11-20].","sources":["S2"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
