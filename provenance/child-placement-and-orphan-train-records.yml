claims:
  - {"id":"C-placement-not-adoption","kind":"method","anchor":"If the proposed adoption has no court record, check the orphanage and census under the child's earlier name and the receiving household's surname. Build separate entries for admission, placement, later transfer and any legal order. Keep a temporary or incomplete placement in the sequence and check for the related institutional papers [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-orphan-train-agency","kind":"custody","anchor":"Use the earliest known institution or placement location to identify the sending agency. For the Children's Aid Society, start with Series XI and distinguish its emigration and placing-out material from foster-home records. Read the series' access conditions before selecting a volume or case file. If the agency is unknown, start with the National Orphan Train Complex research resources [S2 @2026-11-20] [S3 @2026-11-20] [S4 @2026-11-20].","sources":["S2","S3","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-request-placement","kind":"custody","anchor":"Request the placement file using the agency locator and the child's documented names and placement dates. For restricted Children's Aid Society material, follow the finding aid's referral procedure through the holding library [S2 @2026-11-20].","sources":["S2"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-famine-informal-care","kind":"method","anchor":"When tracing a child separated from family during India's 1876–1878 famine, search records of relatives and other households linked to the child's last known residence for evidence of informal care even if no adoption record turns up [S8] [S9] [S10].","sources":["S8","S9","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-assigned-intake-details","kind":"method","anchor":"Use a name assigned by the children's home to trace the placement and leave the birth name open. Record a birth date estimated at intake as an estimate. If the child's original birth certificate is available, compare its date with the estimate and keep both dates with their sources if they differ [S5].","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-nameless-adoption-file","kind":"method","anchor":"If an adoption file describes the child at intake but gives no birth-family names, use any existing DNA matches available for analysis to develop leads for the birth-family search [S5].","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-french-ase-applicant","kind":"custody","anchor":"For a restricted French child welfare file (aide sociale à l’enfance, ASE), check the rules of the department that handled the placement before choosing an applicant, even when an identified descendant is already helping with the search [S6 @2026-11-21] [S7 @2026-11-21]. In Pas-de-Calais, route the request through the living adult subject or their mandated representative. If the subject has died, confirm that the descendant qualifies as a direct heir before they request the file [S7 @2026-11-21].","sources":["S6","S7"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-care-payments","kind":"method","anchor":"Enter a foster-parent designation and any care payments as separate steps in the placement process. Check where the child actually lived and whether a legal order followed. In one reported case, prospective adoptive parents paid for a child's care before the adoption attempt fell through [S11].","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-private-placement-papers","kind":"method","anchor":"Ask the holder of the prospective adoptive family's papers about correspondence with the child and the institution, including files from a placement that ended. Use a contact route the user already has [S11].","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-mediated-child-letter","kind":"method","anchor":"For letters attributed to a child in an adoption file, distinguish the child's reported account from the wording of the surviving letter or translation. Record who conveyed the account, who wrote it down and who translated it. Mark an intermediary identified only in a family recollection as reported [S11].","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-finnish-poor-relief-placement","kind":"method","anchor":"In historical Finnish poor-relief accounts, read *huutolainen* as a person placed through poor-relief bidding and *huutotalo* as the receiving household. Keep any documented surviving parent in the family reconstruction and trace each named household as a separate placement. Look for the transitions in the locality's municipal poor-relief or earlier parish administration records [S12] [S13].","sources":["S12","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-proposed-adoptive-name","kind":"method","anchor":"Record a name chosen by prospective adoptive parents as proposed. Add it to the child's timeline of names used only when a separate record shows the child actually used it. A miss under a rescue-era name leaves later identity, adoption and name change unresolved [S11]. Apply the [Living people rule](../SKILL.md#living-people) to leads about anyone who may be living.","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-stockholm-childrens-home-rolls","kind":"portal-availability","anchor":"For a reported foundling in Stockholm, search Stockholm City Archives' *Allmänna barnhuset, rullor 1798–1916* by documented names. On a hit, use the roll's admission number and any SpB or ÄB reference to identify the intake papers [S15 @2026-11-22] [S16 @2026-11-22].","sources":["S15","S16"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-stockholm-later-date-miss","kind":"example","anchor":"When the only birth date comes from later church books, use it to bracket the search and keep the reported foundling origin open after a miss. One search, reported in a genealogy blog, found no match when it relied on the later date and left the Stockholm parish baptism search incomplete [S14†]. Check the additional barnhus registers and use the later date as a starting point for parish baptism searches [S16].","sources":["S14","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-seattle-foster-households","kind":"portal-availability","anchor":"For a household believed to have fostered through the Archdiocese of Seattle, check the 1961 issues of *The Catholic Northwest Progress* in Washington Digital Newspapers for the foster-family list. Use a household listing as a lead to the program's records for the child [S17 @2026-11-22] [S18 @2026-11-22].","sources":["S17","S18"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-court-papers-orphanage-lead","kind":"method","anchor":"Take the orphanage named in the adoption court papers as a lead to the institution and its records. Once you have confirmed custody and applicant eligibility, request an intake-register lookup or case file under the documented intake and court-record names. Keep the placement lead open after a miss at the named institution [S19].","sources":["S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
