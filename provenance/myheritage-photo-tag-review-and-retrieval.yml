claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: third-party-tool --> When Photo Tagger is enabled, it automatically scans new uploads for face suggestions on MyHeritage [S3 @2026-11-24]. Confirm Photo Tagger is off for the destination before uploading.","sources":["S3"],"checked":"2026-11-24","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"Apply a manual tag only to an independently supported identification. After clearing the PhotoDater gate above, open the individual photo from My Photos on desktop. On its Photo Page, choose **Tag person**, position the frame over the identified person, select the correct existing profile and choose **Done tagging** [S3 @2026-11-24], [S4 @2026-11-24]. If the correct profile is absent or the identification is uncertain, keep the proposed name in the local attribution record.","sources":["S3","S4"],"checked":"2026-11-24","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"On mobile, open Photos on the person’s tree profile, or use Photos → People to choose the person. On the website use My Photos → People, select the intended tree, and open the person’s tagged photos. Hover over the displayed name to locate its frame on the image. In My Photos List view use the People filter and Show photos of these people together to require every selected tag. Inspect the underlying photo before relying on the tag. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"platform-ui","anchor":"Under Discoveries, open Instant Discoveries → Photo Discoveries and compare source and destination profiles. Review each suggested image and its provenance, then add only the authorized, supported selections after clearing the gate. [S5 @2026-11-22], [S6 @2026-11-22]","sources":["S5","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photodater-before-tagged-image","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: third-party-tool --> Opening an eligible undated image on its desktop Photo Page can trigger MyHeritage PhotoDater. Confirm PhotoDater is disabled or clear its processing gate before opening any individual photo, including an untagged upload. [S7 @2026-11-24]","sources":["S7"],"checked":"2026-11-24","stated_as":"fact","review":"reviewed"}
