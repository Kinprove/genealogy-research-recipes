claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Search SKVR (*Suomen kansan vanhat runot*) by collector, locality or singer, and use the collection year to distinguish trips. Open each matching entry and record the volume and poem number together, the collection note, any archive reference and the date of database use [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S1","S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Read `Kuuli omassa kylässä` as a statement that the informant heard the version in their own village. Record the person who supplied the version and the person they heard it from in separate fields. Record a named place of learning apart from the collection locality [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"example","anchor":"When a collector’s published account omits a reciter, compare the earlier publication with the later version and the collected entries. Kyläkoski reports that Andberg’s 1896 *Mikkelin sanomat* account omitted a Hattuvaara informant who appears in the 1892 *Uusi Suometar* version and the SKVR material [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"When few texts are attributed directly to a singer, check the visit account for when the collector first reached them and any stated limits to recall. Look for collected versions that name the singer as the source from whom another reciter heard the verse. Link the two accounts without changing who supplied each version [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
