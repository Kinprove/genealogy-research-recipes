claims:
  - {"id":"C-jamaican-parish-civil-record-recovery-01","kind":"historical","anchor":"Use 1878 as the start of the regular civil birth and death series and 1880 for marriages. For a mid-century birth or death, also check whether the short-lived civil registers from 1844–1851 survive for the parish [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-jamaican-parish-civil-record-recovery-02","kind":"portal-availability","anchor":"Search FamilySearch’s Jamaica, Church of England Parish Register Transcripts, 1664–1880, by event, parish and year. For an earlier vital event, or one missing in the civil search, check the parish volume and any local handwritten index. Use the parish’s actual volume span to judge a miss [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-jamaican-parish-civil-record-recovery-03","kind":"method","anchor":"For a possible non-Anglican marriage, search the separately described Dissenter marriage transcripts via FamilySearch catalog locator 766992. Use the Jamaican Parish Registers microfilm list to identify the right volume and its date range. The microfilm list also points to volume 6 among the parish collection’s images. Check the officiant and congregation in the entry [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-jamaican-parish-civil-record-recovery-04","kind":"custody","anchor":"Direct a Jamaican civil certificate request to the National Identification and Registration Authority (NIRA), formerly the Registrar General’s Department. Identify the district and event first and check the applicable ordering requirements [S1 @2026-11-22] [S4 @2026-11-22] [S5 @2026-11-22].","sources":["S1","S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-jamaican-parish-civil-record-recovery-05","kind":"custody","anchor":"Use the National Library of Jamaica for newspaper, manuscript and map leads. Also check the University of the West Indies’ Mona Library Special Collections for West Indian newspapers and maps. Record the publication or collection and the item-level locator [S1 @2026-11-22] [S6 @2026-11-22] [S7 @2026-11-22].","sources":["S1","S6","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
