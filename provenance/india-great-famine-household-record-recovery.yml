claims:
  - {"id":"C-02ffab1ecf27","kind":"method","anchor":"Set up a household timeline across about 1871–1881. Record the last named village or district and the first later appearance of each person, with occupation, household and land changes. The 1871 and 1881 census reports can help compare districts. Label reported mortality totals according to their basis and keep aggregate estimates at district level. Use district evidence to time local conditions. Establish the household’s own movements and losses from records that identify its members. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-033734a1343c","kind":"custody","anchor":"Search for a named birth, marriage or death in the civil or religious records that cover the family. For people served by the churches in the British Library’s India Office Ecclesiastical Returns, start with IOR/N and choose the presidency and denomination. For families outside their coverage, look for local religious, village or community records. Keep unregistered death, an unsearched record and migration open when the registers give no result. [S1 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-15ffbbfc654f","kind":"custody","anchor":"Search the British Library catalogue for the historic district or presidency and terms such as famine, relief and public works. Use the official 1880 Famine Commission report and contemporary correspondence to look for relief sites and dates. The British Library describes 1877 famine telegrams, for example, at IOR/C/140 ff.199–207. Record whether each item names a recipient or describes the district only. [S1 @2026-11-21] [S2 @2026-11-21] [S4 @2026-11-21]","sources":["S1","S2","S4"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4aef044677ca","kind":"method","anchor":"When a household drops out of the village record, search outward from its last known location toward documented towns, relief works or railway employment. For an overseas lead, choose port, passenger, indenture or plantation records by the proposed destination and period. If a cultivator changes occupation, check revenue and land records for a dated change in tenancy, arrears or transfer. Compare the timing and locality of any move with evidence for famine, recruitment, military service, marriage and other work. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
