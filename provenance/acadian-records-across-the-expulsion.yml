claims:
  - {"id":"C-early-censuses","kind":"custody","anchor":"Start with the dated census transcriptions at the Acadian & French Canadian Ancestral Home. Carry the year, locality and household to the archive copy. The transcription site gives Library and Archives Canada reel C-2752, and the Nova Scotia Archives lists reel 12084 for its 1671–1752 Acadian census returns. Record which copy you inspected and any difference in names or household counts [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-incomplete-registers","kind":"custody","anchor":"For Annapolis Royal, browse the St. Jean-Baptiste baptism, marriage and burial volumes for 1702–1728 and 1727–1755. Check both around the overlap. These are the surviving original pre-Deportation parish volumes in Nova Scotia. A missing volume for another parish leaves the sacrament unresolved [S1 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dictionary","kind":"method","anchor":"Use the first part of Stephen A. White’s *Dictionnaire généalogique des familles acadiennes* for families in its 1636–1714 scope. Choose tome I for A–G or tome II for H–Z. Carry its household and source references into the dated record search [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pubnico","kind":"method","anchor":"For a suspected return to Pubnico, start with the museum's resettlement account and family-name leads. Keep pre-Expulsion, destination and return observations distinct. For a U.S. descendant, follow the documented line back and test a Québec stage where the records point there. Require a dated link between households before joining a line across the Expulsion [S1] [S6].","sources":["S1","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-massachusetts","kind":"custody","anchor":"If the first destination clue points to Massachusetts, use *Papers relating to the Acadians deported to Massachusetts in 1755*, MG18-F15, reels M-81 and M-82. Search names in the petitions and lists for a dated link to the household [S7 @2026-11-20].","sources":["S7"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
