claims:
  - {"id":"C-de64b4cb23c7","kind":"unclassified","anchor":"Log the residence-county search as one row: jurisdiction, office, record series (licence, bond, register, return), years covered, index or image, and outcome. Set the date window from evidence. Start with the years from about age 18 to the first child's birth, and widen the window when the evidence calls for it [S12], [S13]. A miss in this row is only a \"no hit\" for that series and those years. Do not write \"no marriage\" or \"never married.\" Non-marriage is a real possibility, but it is a hypothesis to test after the search, not a conclusion drawn from one county [S10], [S11].","sources":["S12","S13","S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b823b3b23f30","kind":"unclassified","anchor":"Before searching, confirm which county the residence lay in at the marriage date, not today. Jurisdiction depends on when as well as where [S15]. The cut-off part of Conway County, Arkansas, described below, was itself part of Perry County from 1840 to 1873.","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0184e40ee10e","kind":"unclassified","anchor":"- **Pennsylvania:** county marriage licences, issued by the clerk of the Orphans' Court, began on 1 October 1885 under an act of 23 June 1885 [S17], [S19]. Earlier, a registration law of 1852–1855 had county Registers of Wills record marriages. The State Archives holds the 1852–1854 returns of 49 of the 64 counties [S18]. Philadelphia's City Archives holds civil marriage records from July 1860 to December 1885 [S20].\n- **New York:** statewide marriage registration began in 1880–81, and the state marriage index starts in 1881 [S21]. Licences were required from 1 January 1908 and were issued by city and town clerks, not counties [S23]. New York City keeps its own marriage records outside the state index, and Albany, Buffalo and Yonkers marriages before 1908 are with those cities' clerks [S22].\n- **South Carolina:** marriage licences, issued by the county probate judge, began on 1 July 1911 [S24].","sources":["S17","S19","S18","S20","S21","S23","S22","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7e1bd3ed45de","kind":"method","anchor":"Record each partner’s residence county, the ceremony county and the issuing county separately. Search both residence counties and the ceremony county if the issuer is unknown [S12], [S13]. For an older marriage, establish where a licence could be obtained under the law in force on the marriage date.","sources":["S12","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5f22c0112be5","kind":"unclassified","anchor":"Rank the bride's residence county first among the residence rows. Couples usually married where the bride lived [S1], [S5]. That sets the order of the search. It does not let you skip the groom's county or the ceremony county.","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b060fc467f5c","kind":"method","anchor":"- Mark the residence, county seats, river crossings and rail stops on a map close to the marriage date. The David Rumsey collection supplied the 1924 map in Lowe’s Warren County search [S6], [S36].\n- Check which courthouse was reachable from the couple’s side of a river. Castillo uses the Arkansas River between part of Conway County and its seat at Morrilton to suggest a search in neighbouring Perry County when high water blocked the crossing [S15].\n- Compare routes for the season of the marriage. Lisson suggests a longer overland route to a Virginia courthouse could have been safer for Surry County, North Carolina, families during winter rains or the spring thaw [S11], [S9].\n- Follow the railway in both directions across county and state lines. After searching north as far as Louisville, Lowe reported finding the Warren County couple’s bond at Mitchellville in Sumner County, Tennessee, the rail stop just south of the border [S6], [S36].\n- Add the couple's church. People travelled long distances to marry in their preferred church [S15]. Find the couple's denomination and congregation, and add that church's county as a candidate.","sources":["S6","S36","S15","S11","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-134fe41cf368","kind":"unclassified","anchor":"For the home state and each neighbouring state, record the rules at the marriage date: consent age, waiting period, blood test, residency, bond and fees. Cite the edition you used. One presenter uses the Census Bureau marriage-and-divorce reports on Google Books and HathiTrust. He notes that not every annual report includes marriage statistics [S7], [S8].","sources":["S7","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1b66d2e7aa2b","kind":"method","anchor":"- Distinguish the report’s publication year from the dates covered. The Census Bureau’s 1909 report covers 1867–1906 [S37]. Lowe used a Kentucky–Tennessee difference in parental consent requirements as a lead [S7]. Check the applicable statutes on both sides for each partner’s age, sex and marriage date before ranking a crossing on that basis.\n- Check a high-rate border county against a period map and the registers. Lowe pointed to Brooke County, West Virginia, between Ohio and Pennsylvania, in a table from the 1922 report [S7], [S8]. A high marriage rate alone cannot identify the couple’s residence or motive.\n- Use lists of elopement destinations, also called Gretna Greens, to generate candidates for the home county [S4], [S10], [S11], [S14]. The examples include Niagara Falls, Ontario, for New Yorkers and Dillon, South Carolina, for North Carolinians [S10]. Include the date in a search for a local destination and verify its use in that period [S16].","sources":["S37","S7","S8","S4","S10","S11","S14","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dcc02c66ff16","kind":"unclassified","anchor":"Do not suggest modern resort venues by default. Las Vegas, Hawaii or Mexico belong on the list only when the period, the couple's location and the travel options make them plausible [S1]. A high-rate county or an easier law is a reason to search a place. It is not evidence that the couple married there [S10].","sources":["S1","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-68c4abd4b22f","kind":"method","anchor":"Map where siblings and close relatives lived at the likely marriage date, including the counties where other family members had married [S6]. Lisson reports locating an ancestor’s wedding in her sister’s home in another county after checking the home county and known elopement destinations [S14]. Add a relative’s county even when the couple never lived there.","sources":["S6","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3530c80d132c","kind":"method","anchor":"Match each partner’s service or work postings to the marriage window. Lefler reports that a Tennessee groom’s March 1951 Air Force enlistment and August air police training at Camp Gordon, Georgia, put him within reach of Aiken, South Carolina, where the couple married that August [S5]. Search across the state line from the posting and use the installation’s name at the time [S5], [S14]. For catalogue and map searches, the Army dates the change from Camp Gordon to Fort Gordon to 1956, the Fort Eisenhower name to 2023 and the return to Fort Gordon to June 2025 [S39].","sources":["S5","S14","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d973c0a4c325","kind":"method","anchor":"When independent evidence points to one county, ask its clerk, historian or archive which returns actually entered the official series. Lisson relays a reader’s report of a justice who left town with his register unfiled [S9]. Search for a minister’s or circuit rider’s papers in denominational archives, museums and ArchiveGrid, and check church records and newspapers where county papers were lost [S9], [S11].","sources":["S9","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-db85a30c4a65","kind":"unclassified","anchor":"Check that a hit is the right couple before accepting it, then follow it to the bond, licence, return or register itself. Do not stop at an index miss. Ancestry tends to hold indexes, while FamilySearch holds more original images, many of them unindexed [S12], [S13]. Browse the FamilySearch images for the county and years before recording \"no hit.\"","sources":["S12","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9d51c2a3dfce","kind":"method","anchor":"Compare the bondsman’s signature with the officiant’s name and the fee notation before treating him as a family associate. In Lowe’s account of the Mitchellville bond, F. M. Groves served as bondsman and justice of the peace and was listed as paying for the bond [S6], [S36].","sources":["S6","S36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bc4cc9a6671c","kind":"historical","anchor":"When an early American marriage has no licence or return, do not write it off as a lost record or as a sign that no marriage took place; find out whether the jurisdiction then used banns, read in church or posted publicly, or marriage bonds [S28]. Do not assume licences only came later: North Carolina's 1715 act let couples buy a licence or have banns published, and in Virginia giving bond was the step for obtaining a licence [S29], [S30].","sources":["S28","S29","S30"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e1092883d09d","kind":"historical","anchor":"A licence does not show that banns were read: in English law a special licence could dispense with publication, so check the local rule before assuming banns for a licensed marriage [S28], [S31].","sources":["S28","S31"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2fdb9711ac49","kind":"portal-availability","anchor":"Ask each county's clerk or archive for its loose marriage records as well as the bound books, both for a register hit and before recording \"no hit\" there. These are the papers of the licensing process, filed apart from the bound volumes and rarely online [S32 @2026-11-12]. They can include affidavits, parental consent letters for an underage bride or groom, bonds and blood-test results [S32 @2026-11-12], [S33 @2026-11-12]. The Houston County, Tennessee archivist reports that most of that county's packets, 1871–2010, also hold a copy of the licence [S33 @2026-11-12]. Bonds are documents separate from the licence, and guardians' consent affidavits, most common in the South and on the frontier, sit among town and county records [S34 @2026-11-12].","sources":["S32","S33","S34"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9847d4a912e2","kind":"custody","anchor":"In Pennsylvania today a licence issued in any county can be used anywhere in the Commonwealth. Follow the officiant’s return to the issuing county [S35 @2026-11-19], [S17 @2026-11-19].","sources":["S35","S17"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1dde2db15c4a","kind":"portal-availability","anchor":"- Use Cornell’s state marriage-law table to locate statutes. The table cites a chart in the 1999 World Almanac and reports subsequent statute checks without dating individual entries [S27 @2026-11-19]. Retrieve the version of the statute in force at the marriage date.","sources":["S27"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8c3c0332deb5","kind":"portal-availability","anchor":"Search the Periodical Source Index (PERSI) by place and subject for a published transcription, then obtain the article and follow its citation to the journal or register [S38 @2026-11-19]. In the providers’ archived descriptions, ACPL staff compile PERSI, and this copy is the larger one (September 2026) [S25 @2026-11-19]. Findmypast described its version in September 2025 as an index with fewer entries but images of some articles [S26 @2026-11-19].","sources":["S38","S25","S26"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
