claims:
  - {"id":"C-border-index","kind":"custody","anchor":"According to the community guide, try Ancestry's Canada, Border Crossings from U.S. to Canada, 1908–1935 index when the direction is into Canada [S1† @2026-11-20] [S3 @2026-11-20]. Leave an earlier movement open. Canada's federal border entry series starts in April 1908 [S2 @2026-11-20].","sources":["S1","S3","S2"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-land-forms","kind":"custody","anchor":"Use the port and date to browse the 1908–1918 lists. For 1919–1924 use land Form 30, and for early 1925 check both Form 30 and the resumed lists. Inspect both sides of each form, including the household head's form for children. For the 1925–1935 lists follow the reel guidance when a surname search misses. Take travel in the opposite direction to the U.S. immigration recipe [S2 @2026-11-20].","sources":["S2"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ocean-series","kind":"custody","anchor":"Check the catalogue's port and year coverage for 1865–1935. For 1919–1922 look for a passenger list and an ocean Form 30A. Continue using the Form 30A route through 1924. Where the route went through a U.S. port, check the separate Canadian series for travellers who declared a direct onward journey to Canada [S4 @2026-11-20].","sources":["S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-earlier-arrivals","kind":"custody","anchor":"For earlier arrivals, use the named voyage, immigrant or quarantine series for the place and date. For a famine-era Irish arrival, use the early arrival guide for Grosse Île and other arrival evidence, then trace the family's first Canadian residence in census, land or local records. Keep the earliest documented residence distinct from the arrival date [S5 @2026-11-20] [S6 @2026-11-20].","sources":["S5","S6"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-early-biography-itinerary","kind":"method","anchor":"If a biography gives a Canadian port and year on the way to the United States, use that port and year for the ocean-leg search. Before 1865, keep the itinerary open after a passenger-list miss and look for surviving records of that voyage [S5]. A published account of an 1854 itinerary via Quebec reports finding neither traveller in the passenger lists consulted [S14].","sources":["S5","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-passenger-newspaper-letters","kind":"method","anchor":"For an early voyage with no passenger entry, check newspapers at the ports of departure and arrival for signed letters thanking the captain. According to the interview excerpt, such a letter can identify the voyage and name fellow travellers [S15†]. Extract the ship, captain and any voyage date given. Keep the letter and publication dates distinct from the voyage date, and use the printed signatories as leads to other passengers [S16].","sources":["S15","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ellis-island-canadian-route","kind":"custody","anchor":"According to the interview excerpt, a missing Ellis Island entry is reason to check for a Canadian landing even without a known Canadian connection [S13† @2026-11-22]. Browse the original Canadian passenger lists for each plausible port and year, using the ship if known. The indexes generally omit passengers in transit to the United States [S4 @2026-11-22].","sources":["S13","S4"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-us-onward-travel","kind":"custody","anchor":"Read the destination on the Canadian arrival record when one is given. Use a stated U.S. destination as a lead for onward travel and verify the next leg separately [S11 @2026-11-22] [S4 @2026-11-22]. For journeys before U.S. border recording began in 1895, look for the first documented U.S. residence. For later journeys, check the U.S. manifests of admissions at Canadian seaports and entries at land ports. Use the St. Albans series (M1464, 1895–1954) where it covers the route [S12 @2026-11-22].","sources":["S11","S4","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-railway-settlement-reports","kind":"custody","anchor":"For a family linked to Canadian National Railway farm settlement, look in the Canadian National Land Settlement Association reports in the Canadian National Railway Company fonds (MIKAN 4958005 and 5085592) [S7 @2026-11-22] [S8 @2026-11-22]. Use the recorded family details and place of settlement to follow the household after landing. If a report gives a ship and landing date, use them to locate the ocean record [S9 @2026-11-22]. Verify participation in the settlement program separately from the railway journey.","sources":["S7","S8","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-naturalization-locators","kind":"custody","anchor":"To trace later naturalization, use Library and Archives Canada's published 1915–1951 lists to identify the certificate number and series letter. Immigration, Refugees and Citizenship Canada holds the corresponding federal files [S7 @2026-11-22] [S10 @2026-11-22]. Where the Montréal Circuit Court citizenship files (1851–1945) apply, use any stated years of residence to narrow the arrival window. Keep the date of naturalization separate from the date of arrival [S10 @2026-11-22].","sources":["S7","S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-arrivals-from-1936","kind":"custody","anchor":"According to the community guide, the Library and Archives Canada passenger-list run ends in 1935 [S17† @2026-11-22] [S4 @2026-11-22]. For an immigrant who arrived in 1936 or later, request the arrival record from Immigration, Refugees and Citizenship Canada (IRCC), including for prewar arrivals after the cutoff [S18 @2026-11-22]. Check the applicable request type and requester eligibility before filing. For a Privacy Act request on behalf of a living person, follow IRCC's written-consent requirements [S19 @2026-11-22].","sources":["S17","S4","S18","S19"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
