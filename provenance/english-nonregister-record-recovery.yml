claims:
  - {"id":"C-15230db4fd54","kind":"unclassified","anchor":"1. Identify the exact ancient parish, not just the town or the county.\n2. Open a dated jurisdiction finding aid such as the FamilySearch England Jurisdictions 1851 map. Copy each jurisdiction into its own row, with the period it applies to [S1], [S2]:\n   - county\n   - civil registration district\n   - probate court\n   - diocese\n   - rural deanery\n   - poor law union\n   - hundred\n   - province\n3. Do not let the county stand in for the other rows:\n   - **Registration district.** Formed in 1837 for civil registration. It can share the town's name, be much larger than the town, and cross county boundaries [S1].\n   - **Diocese and deanery.** These decide where to look for wills and other church-court records [S1].\n   - **Poor law union.** Created under the Poor Law Amendment Act 1834. This decides where to look for workhouse and post-1834 poor-law records. Union boundaries often match registration-district boundaries [S1]. Fill in both rows separately from the map instead of copying one into the other.\n4. FamilySearch rebuilt the map in 2025, and the former version is no longer available [S2], [S30]. Open the new map at <https://www.familysearch.org/en/mapp/>; the old maps.familysearch.org address redirects there. If the address fails, take the current link from the FamilySearch Research Wiki page \"England Jurisdictions 1851\", not from FamilySearch's help article, which still sends readers to a preview in FamilySearch Labs [S30]. Cite the version and the date you consulted it.\n5. For each question below, write down the chosen series, its custodian and the jurisdiction row that justifies the choice.","sources":["S1","S2","S30"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-16a0bf0637d6","kind":"unclassified","anchor":"1. **Choose the court from where the property lay, not from the county of death.**\n   - Goods worth more than £5 in more than one diocese of the same province (bona notabilia) sent the grant to that province's prerogative court: the Prerogative Court of Canterbury (PCC) for the southern province, the Prerogative Court of York (PCY) for the northern [S4].\n   - Property in both provinces needed a grant from each prerogative court (The National Archives, wills before 1858), so search both the PCC and the PCY.\n   - Otherwise start with the court shown on the jurisdiction row, such as a bishop's consistory court [S3].\n   - Besides the PCC, check the local and regional probate courts for the place and period. Each county's arrangement differs, so no single route works everywhere [S3].\n   - **1653–1660 (Interregnum):** the PCC and the church courts were replaced by one civil court in London, the Court for Probate of Wills and Granting Administrations, with jurisdiction over all of England and Wales. Its registered wills are in the PCC series PROB 11 at The National Archives. Search there first for a probate of those years, wherever the property lay. Some executors avoided the court, and some of their wills were proved in the church courts after 1660, so for a death in those years also check the local court's probates from 1660. [S31], [S32]\n   - **Where to search.** PCC registered wills (PROB 11, 1384–1858) can be searched and downloaded in TNA's Discovery catalogue; in April 2026 TNA said downloads were free \"for now\" to signed-in users, while some of its guides still mark them as paid. Prerogative Court of York records are at the Borthwick Institute, York. Findmypast has an index of its wills for 1688–1858, and since 31 March 2026 Ancestry has the images of the York registered wills, 1389–1858. [S17], [S31], [S33]\n2. **Search by probate date, not death year.** Indexes are arranged by when the will was proved, which can be years after the death. Widen the date range [S4].\n3. **For deaths from 1796, check the death duty register index (IR 27) on the original image** [S3]:\n   - Record the court abbreviation (for example PC, ArchCt, BishCt, ExCt) and each name in the entry under its column heading. The National Archives' guide shows these as \"Executor\" for wills and \"Name of Administrator\" for administrations. The index does not establish who benefited. Take beneficiaries only from the will or from the IR 26 register entry the folio points to.\n   - In the presenter's example, the transcription left out the court and a named person, the testator's wife; the original image showed both [S3].\n   - The index is on Findmypast for 1796–1903. Ancestry's index covers only 1796–1811, covers country courts only and leaves out the PCC.\n   - The index is not a complete list of estates. Exemptions narrowed over time: in 1796, bequests to children, spouses, parents and grandparents were exempt; from 1805, only those to spouses and parents; from 1815, only those to spouses. Entries for estates under £1,500 are often incomplete.\n   - Record which provider and which date range you searched.\n4. **Copy the locator exactly.** From the court index, copy the book (Libra) letter or volume number and the folio [S3], [S4]. Then use a court guide to find the register film for that book and date range. The presenter uses a digitised FHL binder she finds by searching the FamilySearch Catalog for the title *Register of pre-1858 probates* [S3]. Record the catalog number of whatever guide you actually use.\n5. **Go to the folio, not the image number.**\n   - Front-matter images push the image number ahead of the folio. In the York example, folio 87 was at image 95 [S4].\n   - A second index can be bound in just before the wills [S3].\n   - Confirm the printed folio and name on the page before citing it.\n6. **No folio?** Use the probate date from the printed index to pick the volume covering that date, then browse it [S4].\n7. **Separate the index from the document.**\n   - An index image is a locator, not the will [S4].\n   - Record whether you are holding the registered copy or the original probate [S4].\n   - Some digitised FamilySearch films can be viewed only at a FamilySearch center or affiliate. Check each film's catalog entry and record the restriction as an access status, not a miss [S3], [S4].\n8. Hand the will you found to the probate inventory recipe. Finding a will is not the end of the case.","sources":["S4","S3","S31","S32","S17","S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0fda6a933d7b","kind":"unclassified","anchor":"1. **Before 1834, search the parish chest** for the parish where the baptism took place and the period around it [S5], [S7]. Look for:\n   - bastardy examinations\n   - bastardy bonds\n   - lump-sum settlements paid to the parish\n   - overseers' or churchwardens' accounts showing regular payments to the mother [S7]\n   - vestry minutes and court leet presentments [S6]","sources":["S5","S7","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f626e5d5fbfa","kind":"unclassified","anchor":"Under the 1733 Bastardy Act (6 Geo. II c.31), a reputed father who failed to support an illegitimate child could be imprisoned [S7]. That is why the parish pressed for a name and a bond.\n2. **After 1834, move to the union and workhouse records** for the poor law union in your jurisdiction table, and to petty sessions records [S7]. Parish-chest bastardy material largely stops under the new poor law [S7].\n3. **Treat the named man as an allegation.** Authorities pressed the mother to name a father so that someone could be made to pay. A bastardy record therefore records an allegation, not proven paternity [S8]. The presenter says regular payments to the mother suggest the child was the payer's [S7]. That makes the payer a hypothesis to test, not a finding. Parish entries can also note that the father was dead or serving in the militia [S7].\n4. **Do not infer paternity from a stepfather.** A later census that shows the child first as the wife's son and later as the son of her husband does not settle paternity [S6].\n5. **Log the gaps.** Many parish chests have not survived, and many that survive are not digitised [S7]. Record survival, digitisation and the date range you inspected. A gap in coverage is not a negative finding.\n6. **Other routes** the presenter names [S7]:\n   - who raised or supported the child, including an apprenticeship master\n   - petty sessions and quarter sessions records\n   - newspapers","sources":["S7","S8","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-09eb0e81908f","kind":"unclassified","anchor":"1. **The stamp-duty registers (1710–1811, TNA series IR 1) do not cover everyone.**\n   - They leave out apprenticeships arranged by the parish or by public charities, because no duty was due [S9].\n   - Informal arrangements, such as with a relative, may not appear [S9].\n   - For London, IR 1 also holds separate Town Registers for 1711–1811 (The National Archives). Search them before treating a London case as uncovered.","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-53f5a498ada0","kind":"unclassified","anchor":"Record a miss in these registers as \"no entry found\", not as proof there was no apprenticeship. Class the case as uncovered only when its type (parish, charity or informal) or its date (outside 1710–1811) puts it outside the registers. Either way, go next to parish-chest, guild or company, and freedom-of-the-city records. The registers are richest from 1710 to about 1754 [S10]. Read the actual entry for any parent named; do not infer a parent or its omission from a universal year cutoff.\n2. **A family-held indenture is one of two counterparts.** The agreement was between the master and the apprentice's father or guardian, and each side kept a copy [S10]. Supporting records exist only in particular cases: a stamp-duty entry only where duty was paid, and freedom records only where the indenture was used to gain the freedom of a city, particularly London [S10].\n3. **Searching by master's name.** The stamp-duty registers name the master, so if the ancestor became a master, his apprentices can be found there. TNA also holds contemporary master indexes (IR 1/74–79). Indentures are rarely indexed by master [S10], so record a failed search there as \"no entry found\", not as proof he took no apprentices.\n4. **The premium payer is a candidate, not a parent.** The person who paid the indenture premium or signed for the child is someone to test as a supporter or father. Do not record him as a proven parent [S7].","sources":["S10","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bf97899c1ef2","kind":"unclassified","anchor":"1. **Keep the label exactly as written.**\n   - The two terms were used almost interchangeably for Protestants who did not conform to the Act of Uniformity 1662. In many places Presbyterians and Congregationalists were treated as one group, and records often do not name the denomination [S11].\n   - Do not upgrade the label to a specific denomination.\n2. **To identify the group, look outside religious registers** [S11]:\n   - the nonconforming minister whose meetings the person regularly attended\n   - prosecutions in church or civil courts\n   - quarter sessions records\n   - tax records\n3. **For a suspected Catholic, roughly the 1570s to the Roman Catholic Relief Act of 1829** [S11]:\n   - Sporadic, inconsistent Church of England entries may mean minimal outward conformity. Treat that as a hypothesis only [S11]. It does not apply to a marriage of 1754–1837, which the law required to take place in the Church of England (step 4).\n   - The Act of Toleration (1689) gave Protestant dissenters freedom of worship but excluded Catholics [S11] and those who denied the Trinity (Queen Mary University of London, Dissenting Academies Online).\n   - Search Anglican, parish-chest, nonconformist and Catholic records for the whole period before calling the person absent. Not being in a Catholic register is not proof they were not Catholic [S11].\n   - The presenter names the Catholic Record Society's transcribed Catholic censuses as a route to check [S11]. The Society published the 1767 Returns of Papists. The presenter's claim that it has transcribed most surviving censuses is unconfirmed.\n4. **For a marriage from 1754 to 1837, search the Anglican register first.** From 25 March 1754 (Hardwicke's Marriage Act, replaced in 1823 by a Marriage Act with the same rule) until civil marriage began in 1837, only Church of England marriages were legal in England and Wales [S12], [S16]. Quakers and Jews (where both partners were Quakers, or both Jewish) and the royal family were exempt [S12], [S14], [S35]. A nonconformist or Catholic couple of those years will normally be in the parish register. The rule did not apply in Scotland or Ireland [S14], [S15].\n5. **Do not treat TNA as the home of every chapel register.** Registers surrendered to the Non-Parochial Registers Commissions of 1837 (deposited in 1840) and 1857 are at TNA in RG 4 and RG 8 [S12], [S13]. The other surrendered series are RG 5, the birth certificates of the Dr Williams's Library and Wesleyan Methodist registries; RG 6, the Quaker registers (1578–1841); and RG 7, the Fleet and other clandestine marriage registers (1667–c.1777) [S34]. From 1742 until 1837, Dr Williams's Library registry recorded almost 50,000 births of London-area dissenters, with entries back to 1716. Its registers and indexes are in RG 4 [S34]. Search RG 4 to RG 8 on TheGenealogist (TNA's partner) or its pay-per-view site BMDRegisters; Ancestry has RG 4, RG 5 and RG 8 in one collection and RG 7 in another [S12], [S34]. Many chapels kept theirs. Most post-1837 nonconformist registers are in local record offices, and many burial registers are still at the burial ground [S12]. A miss in RG 4 or RG 8 is not a search of the chapel's own registers.","sources":["S11","S12","S16","S14","S35","S15","S13","S34"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00f2381c7a05","kind":"unclassified","anchor":"1. **Do not identify a Welsh person by surname alone.** Fixed surnames came late and from the top down: most noble families had them by the 16th century, the gentry generally in the 16th, yeomen in the 17th and 18th, and many farmers and labourers only in the 19th or later. Patronymics lasted into the early 19th century in rural areas [S22], [S23], [S27].\n   - Before a fixed surname, a man is named as X ap (or ab) Y, \"son of Y\", and a woman as X ferch Y, \"daughter of Y\" [S22], [S23].\n   - Surnames grew out of these forms: ap Rhys became Price, ap Hywel Powell and ap Hugh Pugh; others add -s to the father's forename, as in Jones or Davies [S22], [S23].\n   - Father and son, or brothers, can therefore carry different surnames [S22]. Do not reject a candidate father for that reason. Identify people by parish, farm, occupation and spouse.\n   - Search places in both their English and Welsh forms. The same patronymic problem in another region is handled in [Scandinavian patronymic and farm-name record recovery](scandinavian-patronymic-farm-name-record-recovery.md).\n2. **Look for pre-1858 Welsh wills at the National Library of Wales (NLW), not at TNA or a county record office.** NLW holds the wills proved in the Welsh church courts [S17], and they are free to search and view on its website (1521–1858, with dates varying by diocese) [S36]. For a probate of 1653–1660, use PROB 11 at TNA instead, as §2 describes. TNA has only PCC wills, for example where the deceased held land in more than one Welsh diocese [S17]. Some border parishes in Powys and Monmouthshire lay in the diocese of Hereford; their wills are at Herefordshire Archive and Records Centre [S18]. Read the diocese from the §1 jurisdiction table before choosing.\n3. **Use NLW for the other diocesan series too.** It holds the marriage bonds and allegations (search its catalogue for them), the bishop's transcripts (not digitised) and the diocesan copies of the tithe maps and apportionments, except for districts that went to English dioceses at disestablishment [S19], [S20], [S21].\n   - **Use the marriage entry to choose the supplemental search.** For a pre-1837 marriage that gives only a parish, copy whether it says *by banns* or *by licence*, its date and both parties' stated parishes. For banns, seek the surviving banns register for the relevant parish or parishes; for a licence, seek the issuing authority's bonds and allegations, using the dated jurisdiction and custodian above. Keep the marriage, banns, allegation and bond as separate records. A licence application or banns entry does not establish that the wedding occurred. GenealCymru describes this overlooked branch and notes that some licence papers add a farm name [S28]. NLW confirms that its bonds can give location details [S29]; neither source guarantees a house name in a particular file.\n   - **Turn an added house or farm name into a bounded search.** Preserve its spelling, date and source locator. Locate the place within the recorded parish, then inspect relevant census households, tithe map/apportionment entries and parish events for the supported people and period. Keep landowner, occupier and resident roles separate. List competing households and co-resident namesakes explicitly; a shared house name alone does not identify the spouses. Retain a missing supplemental record, an unresolved place or a gap between the marriage and later residence as that specific open link. This targeted chain is authored synthesis, not a verified reconstruction of the presenter's family.\n4. **Search chapel registers alongside parish registers.** On Census Sunday 1851 most people attending worship in Wales were nonconformists [S24], [S25]. Apply §5 to Welsh chapels.\n5. **Search Welsh newspapers in Welsh and in English.** An English-only search misses the Welsh-language press.\n6. **Find the local archive with the Archives Wales repository map.** Services follow modern local authorities, not historic counties [S26].","sources":["S22","S23","S27","S17","S36","S18","S19","S20","S21","S28","S29","S24","S25","S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9b572367305b","kind":"unclassified","anchor":"- the dated jurisdiction table, with the map version and the date you consulted it\n- for each question: the series chosen, its custodian, the reason for the choice, and the dates and extent inspected\n- the probate locator chain: court (both prerogative courts where property lay in both provinces) → index (with any court abbreviation) → book/volume and folio → register film and image → registered copy or original probate\n- a parish-chest, union or petty-sessions search log listing survival, digitisation and access gaps\n- named men, premium payers and denomination clues, each recorded as a separate hypothesis with its source\n- original labels quoted exactly\n- for Welsh cases, the diocese and custodian chosen for wills, the name forms searched, and any marriage → supplemental entry → house/farm → targeted-record chain, with unresolved namesakes and residence links","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-df411d753f92","kind":"method","anchor":"For step 1, read a combined place such as 'Prestwich cum Oldham' in an 1841 census entry or index as a whole ancient parish, not a single church. Prestwich-cum-Oldham, in Lancashire, had ten townships with several smaller chapelries; many townships had no medieval church of their own and used the parish church at Prestwich or a church outside the parish [S37]. List the townships and the churches their people used, and search each church's registers under its own name. Dana Leeds found a family's 1839 marriage under Prestwich, one of the ten townships, after the 1841 census placed the family in Prestwich cum Oldham [S38].","sources":["S37","S38"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fe8197ed49f4","kind":"portal-availability","anchor":"For a man who died before the 1841 census, do not rest his birth year on the burial age or a death notice alone. Search the United Grand Lodge of England membership registers: the Museum of Freemasonry says over 1.7 million names from the registers of 1751 to 1921 are on Ancestry, and that an entry normally gives the man's age, address and occupation with the date he joined the lodge, but no date of birth [S39 @2026-11-12]. That dated age is a separate estimate to compare with the burial and newspaper ages. In Jonny Perl's case the register gave 39 in January 1819, a birth in 1779 or 1780, which agreed with a death notice and not with the burial age [S40 @2026-11-12]. Record the age as the lodge return gives it, and a miss as \"no entry found\": only freemasons appear.","sources":["S39","S40"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-029d2de891da","kind":"historical","anchor":"**Dr Williams's Library registry was not only for London families.** It served the Baptist, Independent and Presbyterian congregations of London and within twelve miles of it, but parents from most parts of the British Isles, and even from abroad, also used it [S13]. The almost 50,000 births in item 5 are the registry's total, not a count of London families [S13]. Search RG 4 for a dissenter's birth of 1716–1837 wherever the family lived.","sources":["S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e6b19ba86029","kind":"platform-ui","anchor":"**Add the parish's manors to the table.** A parish can contain several manors, and the 1851 map does not show them. Search the Manorial Documents Register in The National Archives' Discovery catalogue by parish (England only) or by manor name [S41 @2026-11-14], [S42 @2026-11-14]. Each manor's entry lists its surviving documents with their dates, where they are held and their references, or says \"No records known to survive\" [S41 @2026-11-14]. The index does not name every manor that existed, and a manor with no surviving records may be left out, so record a manor you cannot find as unlisted, not as recordless [S41 @2026-11-14]. Then rule manors out with a map and the residence the register gives: one post took the seven manors listed for a Yorkshire parish and set out to test them against a marriage entry's \"parish and township\" [S43 @2026-11-14].","sources":["S41","S42","S43"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-765a7c920f16","kind":"historical","anchor":"**Search the PCC even when the property rule points to a local court.** The relatively wealthy used it, as over time did many less prosperous people and those who feared to die abroad; sailors and soldiers are well represented [S17]. It also took the wills of people living in England or Wales who died abroad, and wealthier people and nonconformists often chose it [S44]. A post adds people of status [S45]. Do not record \"no will\" until the PCC has been searched.","sources":["S17","S44","S45"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-45e18c007f77","kind":"historical","anchor":"**From 1530 to 1782, ask for the inventory as well as the will or administration.** In those years the executor had to have three or four local men value the personal estate and give the court an inventory; after 1782 one was made only on request, so fewer survive [S50]. An inventory lists goods, often room by room, and leaves out land and buildings, so its total is not the whole estate [S50], [S51].","sources":["S50","S51"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-96d7fd34eba6","kind":"method","anchor":"**Read the margins of the registered will and of the act book.** In one video, the will of a man who died in 1841 was proved in 1852, and a note down its side named his widow as residuary legatee and recorded letters of administration for goods left unadministered [S52]. In the Prerogative Court of Canterbury's act books, a later grant is usually noted beside the earlier entry with its month and year; a grant *de bonis non administratis* was made when an executor died or renounced before the estate was fully distributed [S53]. A widow or legatee named in such a note outlived the testator. Read the later grant as a date she died before only when the note says she died, because a renunciation produces the same grant [S53].","sources":["S52","S53"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5dca568c9027","kind":"historical","anchor":"**For a landed family, find the settlement before reading a will or sale as a disposal of the land.** Under a strict settlement the estate was conveyed to trustees, the holder was tenant for life, and sales were often difficult to arrange [S54]. A post warns that a gentry family's apparent owner may have been only a tenant for life, with trustees in control [S55]. Before inferring heirs or a sale from his will or a deed, look for the settlement in the family or estate papers.","sources":["S54","S55"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-62e58ef36091","kind":"historical","anchor":"**A northern mill worker with no local baptism may have been a parish apprentice sent from far away.** London parishes bound pauper children to distant employers, and those sent furthest were generally placed in northern cotton mills. In a sample of 3,285 London parish apprentices of 1767–1833, cotton bindings were concentrated in the 1790s and 1800s and none were made after 1819; an 1816 Act limited how far London parish apprentices could be sent [S56]. A post applies the same test to children of southern parishes generally, and the reverse search to a southern sibling who disappears without a burial [S57]. Treat it as a hypothesis: search candidate sending parishes' apprentice registers and indentures, and confirm the birthplace from the 1851 or a later census.","sources":["S56","S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-502675ff7375","kind":"historical","anchor":"**Read an older \"Nonconformist\" label as \"outside the Church of England\".** Gloucestershire Archives counts Roman Catholic and Jewish congregations among its nonconformist records [S58], and a post reads a public cemetery's \"Nonconformist\" section and its separate register in the same wide sense [S59]. Do not rule out a Catholic because of the label, or take it as proof of Protestant dissent. Where the cemetery also kept a Catholic section, search its register too.","sources":["S58","S59"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10c76d58d395","kind":"method","anchor":"**Do not read a will's religious preamble as the testator's own belief.** J. D. Alsop treats preambles as formulae: read in isolation, a preamble would have to be highly personal to show conviction, and he cites the test that only wording unusual within one scribe's series of wills counts [S60]. A post found near-identical wording in wills written by two scribes 40 miles apart within five years [S51]. Compare the preamble with other wills of the same place, period and scribe before using it as a denomination clue.","sources":["S60","S51"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-818513335c84","kind":"portal-availability","anchor":"**For a possible Huguenot family, check the Huguenot Library's list of family research files.** The Huguenot Society publishes the list of surnames for which the library holds a research file [S61 @2026-11-14]; the library is currently housed with UCL Special Collections at The National Archives [S62 @2026-11-14]. The list includes common English surnames such as Archer and Baldwin [S61 @2026-11-14], and a post notes that other Huguenot surnames may simply not have been researched [S63 @2026-11-14]. Treat a listed surname as a lead to test, and a missing one as no evidence either way.","sources":["S61","S62","S63"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04f49c048bb1","kind":"portal-availability","anchor":"**Check whether the parish kept a Dade-style register.** From 1777 the archbishop of York required extra detail in every parish of the diocese, though few clergymen consistently complied, and the practice largely ended in 1813 [S88 @2026-11-14]. BYU's Discovering English Ancestors site maps the parishes in Yorkshire and elsewhere whose registers record extra information, with the years and the details given, and offers the data as a spreadsheet [S88 @2026-11-14]. A post adds that any register with habitually fuller entries is now called a Dade register [S89 @2026-11-14]. Use the extra details where they exist, and do not read a plain York register of 1777–1812 as a lost series.","sources":["S88","S89"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8b9878561d74","kind":"method","anchor":"**Take the court in force at the date of death, and search that court's own records.** The 1851 map gives each parish's court in 1851. A peculiar was exempt from the bishop's jurisdiction and handled its own probate, sometimes for scattered parishes across county boundaries [S44]. In the diocese of Lichfield the peculiars came under the bishop's control by an Order in Council of 1846, and each had kept its own records [S46]; a post's Staffordshire example used the peculiar of Wolverhampton before 1846 and the Lichfield consistory court after [S45]. Start with that court, then search the courts above it, which may have taken the case [S47]. Most local church-court records are at county record offices [S17], but a diocese's records can be in a separate diocesan archive, as York's are at the Borthwick [S44]. Record a peculiar's series you cannot find as a gap, not as \"no will\".","sources":["S44","S46","S45","S47","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7b5c82eaf8a2","kind":"portal-availability","anchor":"**For a York will before 1688, use the printed indexes.** The Borthwick lists its online index of the Prerogative and Exchequer Courts of York as covering 1688–1858 [S48 @2026-11-14]. Earlier wills in the York Registry are indexed in the Yorkshire Archaeological Society Record Series, starting with volume 6 (1389–1514), and volumes of the series are on Internet Archive [S45 @2026-11-14], [S49 @2026-11-14]. Take the volume for the probate date, then go to the register as in steps 4 and 5.","sources":["S48","S45","S49"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e367ead3adc2","kind":"portal-availability","anchor":"1. **Search GOV.UK's probate records from the year of death forward.** They cover grants in England and Wales from 1858 and are filed under the year the grant was issued, not the year of death; if the person is missing from the death year, check the following years [S64 @2026-11-14], [S65 @2026-11-14].\n2. **Read the National Probate Calendar entry before buying a death certificate or a copy.** It may give the deceased's address and occupation, the date and place of death, the date and place of the grant, the executors or administrators with their relationship to the deceased, and the value of the estate [S66 @2026-11-14], [S67 @2026-11-14].\n3. **The people named received the grant; they are not the heirs.** Executors and administrators may or may not also inherit, and the calendar lists no beneficiaries [S65 @2026-11-14], [S66 @2026-11-14]. Take beneficiaries from the will.\n4. **Read the grant type before deciding whether there is a will.** \"Probate\" and \"Admon with Will\" grants contain a will; a plain \"Administration\" (Admon) does not [S64 @2026-11-14]. Do not read every administration as intestacy, as one post does [S65 @2026-11-14]: order the will for an \"Admon with Will\".","sources":["S64","S65","S66","S67"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c51f4d7007da","kind":"historical","anchor":"1. **1653–1660: look for a civil marriage, including in neighbouring parishes.** From 29 September 1653 couples married before a Justice of the Peace, with the parish's elected \"register\" present to record it [S68], [S70]. Not every parish had a justice, so the marriage may be recorded where the nearest one lived [S68]. In 1657 Parliament repealed the clause that made this the only valid form, and from 1660 the Book of Common Prayer was again the only sanctioned basis for a marriage [S69]. Search the neighbouring parishes' registers for these years before calling the marriage missing.\n2. **A marriage within the prohibited degrees of affinity may be far from home, abroad, or absent.** Until Lord Lyndhurst's Act of 1835 such a Church of England marriage was voidable, not void; the Act validated earlier ones and barred later ones [S71]. They still took place: an 1848 inquiry counted 1,364 in part of England since 1835, over 90% with a deceased wife's sister, and some couples married abroad [S71]. Marriage to a deceased wife's sister became lawful in 1907, to a deceased husband's brother in 1921, and to a niece or nephew by marriage in 1931 [S71]. Before those dates the couple may have married far away or lived together unmarried; a post found a niece-by-marriage couple who married 200 miles from home [S72]. Do not reject two sisters as a man's successive wives because such a marriage was \"not legal\" [S73]: before 1835 it stood unless challenged, and after 1835 such marriages still took place [S71]. Widen the search instead.\n3. **For a marriage by licence, look for the allegation and the bond.** They exist only for licence marriages [S74] and were kept by the issuing authority, usually a church court; the licence itself went to the couple [S75]. The register should say \"by licence\" [S76], but the note was not always made, so its absence does not rule out a licence [S74]. Bonds were required until 1823 [S75]. The bond's sum was a penalty owed only if the allegation proved untrue [S77]; do not read it as the groom's or the bondsman's wealth [S74].\n4. **If the marriage register is lost or damaged, look for the banns.** From 1754 the parish had to keep a separate banns register, and surviving banns books are at local archives [S76]. Banns were read on the three Sundays before the wedding [S75], so an entry gives the approximate date of the intended marriage; it does not prove that the wedding took place [S74]. The banns-or-licence routing in §6 applies to English marriages as well.","sources":["S68","S70","S69","S71","S72","S73","S74","S75","S76","S77"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-204c0f8f60f4","kind":"historical","anchor":"1. **Read the content year by year, not only the date range.** An archive's \"complete\" series means that the years survive, not that every event was entered. In the Civil War years clerks often explained gaps by the disruption, as at Tarporley for 1643–1648 [S78]. A post found that the Leeds registers, which have no gap in years, left out chapelry baptisms and that their Interregnum years are later copies of the civil clerk's notes [S79]. Read the clerks' notes and count each year's entries before you treat a missing event as evidence.\n2. **1640–1660: expect gaps and no bishop's transcript.** In the diocese of Gloucester no transcripts at all were kept between 1640 and 1660 [S80]. From 1653 an elected parish \"register\", who need not be the minister, kept the record [S68], and births were entered instead of baptisms [S81]. Treat patchy or missing entries for these years as a coverage gap [S81], [S70].\n3. **The register may be a later fair copy.** Many clergy noted baptisms and burials in a day book and wrote them into the parchment register later, often much later; entries could be miscopied or left out, or a day book lost [S82]. Blank names or dates suggest an entry written long after the event, and some bishop's transcripts hold entries that the register lacks [S83]. Compare the transcript with the register entry by entry.\n4. **Read \"chrisom child of [father]\" as a term, not a name.** It meant a child who died within a month of baptism, and London's bills of mortality used it for infants who died within a month of birth [S84]. A post reads it as covering a baby who died before baptism too [S85]. Do not enter \"Chrisom\" as a given name, and do not infer a baptism, or its absence, from the word.\n5. **Look for burial-in-woollen affidavits outside the register.** The Burial in Woollen Acts of 1666–1680 required burial in wool, proved by an affidavit sworn within eight days of the burial; the law was generally ignored from about 1770 and repealed in 1814 [S86]. Many affidavits were loose papers in the parish chest, and many of those were destroyed [S86]. A register can stop noting them long before the law lapsed, as a post found in Leeds after 1704 [S87]. Search the parish chest for surviving affidavits before calling a burial unrecorded.","sources":["S78","S79","S80","S68","S81","S70","S82","S83","S84","S85","S86","S87"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ba0c7fadc4ca","kind":"historical","anchor":"1. **1641/2: the Protestation Returns.** They list English men aged 18 and over who took the oath, and those who refused [S90], [S91]. The Parliamentary Archives hold the surviving returns, for about a third of English counties, and county record offices hold some returns kept locally [S90]. The returns are only a partial census [S91], so a man can be missing because he was away, dead or left off. Count his absence as weak evidence for the younger of two same-named candidates and settle the choice with other records; a post's conclusion that an unlisted man \"must have been under age 18\" goes further than the record allows [S70].\n2. **1662–1689: the Hearth Tax.** The occupier paid, and people who paid no poor or church rate were exempt [S92], as were paupers whose house was worth under £1 a year and who had no other property worth over £1 a year and an income under £10 [S93]. From 1664 anyone with more than two hearths was liable even if otherwise exempt; the lists were to name exempt householders by 1665, and printed exemption forms from 1670 recorded names [S93]. A post's rule that paupers with one hearth were excluded is not the test [S94]. An exempt household may be in a separate list, on a certificate, or nowhere, so its absence is not proof that it did not live there.\n3. **1780–1832: the Land Tax.** From 1772 the returns list occupiers as well as owners, paupers excepted. The duplicates of 1780–1832, used to establish the right to vote, are with the Quarter Sessions records at county record offices; earlier survival is patchy [S95]. Read a parish's returns year by year to date a move in or out and property passing to the next generation [S94], keeping the owner and occupier columns apart.\n4. **Before 1832: poll books exist only where the franchise and a contest produced them.** Wikipedia's list of counties and boroughs of the unreformed House of Commons in 1800 gives each English and Welsh borough's franchise type, its voters in 1800 and how often it was contested [S96]; a post uses the franchise type to judge whether name-rich voter lists can exist [S97]. With no contest there was no poll, and no poll book [S98]. Check Gibson and Rogers, *Poll Books c. 1696–1872*, for survivals, then the county record office's catalogue: local archives hold manuscript poll books for their area [S99], [S43]. A man missing from a poll book may simply not have been an elector.\n5. **1801–1831: surviving local listings.** The official 1821 returns were numbers only; some places drew up lists of names, which usually give only the head of household [S100]. In 1821 each family was counted as chiefly employed in agriculture, in trade, manufacture or handicraft, or in neither [S100]. A broad class that disagrees with a directory occupation is a lead (two occupations, or a change between the dates), not proof of a different man [S101].","sources":["S90","S91","S70","S92","S93","S94","S95","S96","S97","S98","S99","S43","S100","S101"],"checked":null,"stated_as":"fact","review":"reviewed"}
