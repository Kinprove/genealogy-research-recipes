claims:
  - {"id":"C-00d428378f41","kind":"portal-availability","anchor":"In the National Digital Library, search periodical titles and browse the issues around the incident date. Search distinctive place or establishment labels as printed across different reports. Then search ahead for the hearing, verdict and any later custody notices. For the Čachrov mill case, use both Rajský and Rejský. Start in 1925 for the incident and check *Český Západ*, *Český deník* and *Šumavan*. The community account points to *Šumavan* on 24 April 1926 for the hearing, 28 April 1926 for the verdict, and issue 61/1929, page 4, for a transfer. Use these as issue locators. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a3b02ce8adf3","kind":"method","anchor":"Read an early casualty report through its last paragraph and give each named person's condition, hospital transfer and outcome separate fields. Keep an early wanted description as a dated lead, then check the names, ages and occupations given after identification. In a notice using *příslušný do* and *rozený v*, copy the former as the stated place of affiliation and the latter as birthplace. Use neither field to supply residence without evidence. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7155f84731b1","kind":"method","anchor":"Resolve *t. m.* against the issue's month and *t. r.* against its year. Record the resulting event date alongside the printed wording and issue date. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-be8f1659c8fa","kind":"method","anchor":"In the jury report, assign each answer to its question, defendant and charge, including any qualification. Separately extract the judgment and sentence, which party appealed and which part of the outcome the appeal concerns. For a custody transfer, extract the sending and receiving prisons. If a transfer recap shortens a sentence, keep the exact duration from the contemporary verdict report and preserve the recap as a separate observation. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
