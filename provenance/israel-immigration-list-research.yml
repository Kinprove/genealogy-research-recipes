claims:
  - {"id":"C-4a7d1e9b2c30","kind":"custody","anchor":"Use this recipe when a person may have arrived in Mandatory Palestine or Israel between 1919 and the mid-1970s, and you are searching for or reading their entry in MyHeritage's Israel, Immigration Lists. Jewish Agency clerks recorded arrivals at seaports, airports and border crossings in a standard format until 1975. The collection indexes scans of their books, which the Israel State Archives holds, and most entries are in Hebrew. [S1 @2026-11-16], [S2 @2026-11-16], [S3 @2026-11-16], [S4 @2026-11-16]","sources":["S1","S2","S3","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8f21c6d03b5e","kind":"method","anchor":"- Calling every entry an immigration. The books also list tourists and Israeli residents returning from a trip abroad. [S1], [S2], [S3]\n- Assuming every arrival came by ship. The books also record arrivals by plane and at land border crossings. [S1], [S2], [S4]\n- Searching only in English and stopping at a miss. Most of the index is in Hebrew, and MyHeritage's own search guide asks for the name preferably in Hebrew. [S2], [S3]\n- Reading a miss as proof that the person never arrived. Some lists are missing or badly scanned, and the collection has no lists of illegal immigrants. [S2], [S4]","sources":["S1","S2","S3","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1b9e47a2d6f8","kind":"platform-ui","anchor":"Search the person’s pre-arrival name in its original spelling, then search the Hebrew form independently. MyHeritage’s index supports cross-language searching [S1 @2026-11-16], [S4 @2026-11-16]. Its published example retrieves Bracha Fuld’s Hebrew entry (ברכה) with the English query Barbara Fuld [S2 @2026-11-16]. Do not stop at an English miss. The search guide recommends entering the given name and surname in Hebrew where possible because the clerks recorded names in Hebrew [S3 @2026-11-16]. Compare the name, arrival date and companions on the list image.","sources":["S1","S4","S2","S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6c3a0f85e2d1","kind":"platform-ui","anchor":"Narrow a common name with the guide's search fields: birth year, departure place, arrival date and place, gender, residence, and the father's, mother's or spouse's name. [S3 @2026-11-16]","sources":["S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d27b4e19a0c6","kind":"method","anchor":"A child who came with the family can be recorded under the father's name. Search for the parents and look for the child beside them; a search by given name with the year of birth or of arrival can also find an entry. [S2], [S4]","sources":["S2","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9e05b3c7f142","kind":"platform-ui","anchor":"The record page shows the transcription above and the scan of the list below. Read the scan. A list's heading normally says whether its passengers are immigrants, returning residents or tourists, and the table has a category column. The heading also gives the place and date of arrival and, for a ship, its name and line. [S3 @2026-11-16] The books list tourists and Israeli residents returning from a trip abroad as well as immigrants. [S1 @2026-11-16], [S2 @2026-11-16]","sources":["S3","S1","S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3f8d61a4b9e7","kind":"method","anchor":"Call the entry an immigration only when the list heading or the category column says the person arrived as an immigrant. Clerks did not always fill in every field [S3]; if neither says, record the category as unknown. A returning resident already lived in the country, so look for that person's own arrival in an earlier list, or for a birth there.","sources":["S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a51c2e7d0b83","kind":"historical","anchor":"Record how the person came, by ship, by plane or across a land border, from the list itself. The books were kept at seaports, airports and border crossings and are arranged by the arrival dates of ships or planes, and some later immigrants came by air. [S1], [S2], [S4] Do not look for a ship's passenger manifest for an arrival by plane or across a land border.","sources":["S1","S2","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-74e9b0d2c5a1","kind":"custody","anchor":"A miss means only that no surviving, indexed list matched your search. Some lists are missing from the archives, and some were in such poor condition that their scans suffer. [S4 @2026-11-16] The books begin in 1919. [S2 @2026-11-16], [S4 @2026-11-16] The collection has no lists of illegal immigrants, although it includes several youth immigration lists. [S2 @2026-11-16]","sources":["S4","S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0d6f3a9e81b4","kind":"custody","anchor":"For a Jewish immigrant who arrived without an immigration permit between 1939 and 1945, look instead for the deportation application the British authorities filed. The Israel State Archives holds the scans, and MyHeritage's wiki points to the Israel Genealogy Research Association (IGRA) website for the names. Not every illegal immigrant was recorded or caught, so a miss there is not proof either. [S5 @2026-11-16]","sources":["S5"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cd60b609626e","kind":"method","anchor":"If a name search misses and you have the register scans for a known ship or flight, go to its arrival date in the chronological volume. Confirm the date and place in the heading and match the ship or flight wherever it is named before reading the passenger rows. [S3], [S6], [S8]","sources":["S3","S6","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b5366f3111c1","kind":"method","anchor":"On the full list page, record each accompanying relative's name and age where shown. Record parents and relatives awaiting the traveler in their stated roles and keep them distinct from the people who traveled. Capture the country of origin and intended destination when recorded, and distinguish the destination from the place of arrival. [S3], [S6], [S7], [S9]","sources":["S3","S6","S7","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6cee0b4dbd2c","kind":"example","anchor":"When several entries match the same person, compare the arrival dates, places and voyage headings on the scans. Keep separate trips as separate events and assign each its own arrival category. MyHeritage lists Golda Meyerson more than once, consistent with her documented travel after moving to Palestine in 1921. [S7], [S10]","sources":["S7","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a3f5c3ea9b4e","kind":"custody","anchor":"Treat a documented arrival before 1919, including a First or Second Aliyah arrival, as outside this collection's coverage. Use any later hit to investigate a separate arrival. [S6 @2026-11-22], [S8 @2026-11-22], [S11 @2026-11-22]","sources":["S6","S8","S11"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-60b30cedec0b","kind":"custody","anchor":"When investigating a possible clandestine arrival, log the excluded lists as a coverage gap. If the child's arrival is linked to Youth Aliyah, check the youth immigration lists for the child's group and note any program designation or placement recorded on the page. [S6 @2026-11-22], [S8 @2026-11-22], [S9 @2026-11-22]","sources":["S6","S8","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-danzig-passport-lists","kind":"custody","anchor":"If a Danzig passport is a clue in a possible deportation to Mauritius, look up IGRA's *Illegal Immigrants Deported to Mauritius 1944*. Distinguish Free State Danzig passports, Free State Danzig Alien passports and German State Aliens’ passports issued at Danzig. Record the passport category as written. [S13 @2026-11-23] Use the passport-list heading and any source reference supplied by IGRA to find the corresponding microfilm at The National Archives in Kew. If you lack a reference, start the catalogue search with Mauritius deportation and the passport category. Confirm the heading and row on the film and cite the archive reference and frame. [S12 @2026-11-23], [S13 @2026-11-23]","sources":["S13","S12"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mauritius-collection-year","kind":"historical","anchor":"Use 1944 to identify the IGRA collection and establish the arrival date separately. [S13] In March 1944, the House of Commons discussed refugees deported to Mauritius more than three years earlier. [S14]","sources":["S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
