claims:
  - {"id":"C-scope","kind":"historical","anchor":"Use this recipe when a guardian, a ward, a guardian's bond or account, or a minor's choice of guardian turns up in colonial or U.S. court records, or when a child disappears from the record after a father's death. A guardianship is a court's arrangement for a ward's property or affairs. Read each document for what it states about the ward's age, the parents, the guardian and the property, and log every series you search. Guardianship law and terms varied by state and period [S9], so confirm the statute that governed the record before you turn a rule below into a conclusion.","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-what-goes-wrong","kind":"historical","anchor":"- Reading the guardian as the person the child lived with. Guardians of minors were generally named for the child's property; a surviving parent, or a relative or neighbour, raised the child. [S2], [S3], [S7], [S1]\n- Reading \"orphan\" as a child with no living parent. Its older legal meaning was a fatherless child. [S10], [S8], [S7]\n- Reading a guardianship as proof of a parent's death, or its date as the death date. A living father could be named guardian of his child's property, and a guardian could be appointed years after a death, when a property matter required one. [S2], [S6], [S9]\n- Treating a failed search as a finding. Without property, or without a reason to act, no guardian was appointed. [S2], [S6], [S7]\n- Assuming that the guardian was a relative, or a relative on the father's side. [S9], [S3], [S1]\n- Assuming that the ward was a child. Adults judged unable to manage their own affairs had guardians too. [S6], [S4], [S1]\n- Treating a guardianship as an adoption. It did not end parental rights or create a new parent-child relationship. [S9]","sources":["S2","S3","S7","S1","S10","S8","S6","S9","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-row-fields","kind":"method","anchor":"Start a guardianship row for each ward and each appointment. Record as separate fields: the ward's name as written; minor or adult; the stated reason; the court, date and locator; whether the guardian was appointed by the court, named in a father's will or deed, or chosen by the ward; the guardian's name and any stated relationship; \"of the person\", \"of the estate\" or both, exactly as written; and the estate or property involved. A father could name a guardian by deed or will [S3].","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-adult-wards","kind":"historical","anchor":"**Minor or adult.** Read who petitioned, what authority they invoked and what the court ordered before deriving anything about the ward’s age. Williams describes relatives or friends petitioning about an adult’s management of his affairs [S6]. In Wayne County, Michigan Territory, the town’s overseers of the poor petitioned in 1835 because they feared having to support the ward, whom the court later designated a spendthrift [S4]. Separate the petitioners’ allegations from the court’s finding and handle an allegation of incapacity as sensitive [S1].","sources":["S6","S4","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-estate-not-custody","kind":"method","anchor":"**Estate or person.** Copy which powers the court granted. An appointment to manage a minor’s property could coexist with a surviving parent caring for the child [S2], [S3], [S7]. Establish where the child lived through a household record or a guardian’s account naming someone paid for board. Check the payee and period before using a schooling or maintenance payment as evidence of residence [S9]. Do not place a minor ward in the guardian's household unless a record says the child lived there.","sources":["S2","S3","S7","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-orphan-meaning","kind":"historical","anchor":"**\"Orphan\".** In *Stewart v. Morrison's* (Mississippi, 1860) the court gave the legal meaning of \"orphan\" as \"a fatherless child\", and held that a child whose father was living was not an orphan even if the mother had died [S10]. Baird describes the same older usage, in which the mother might be living [S8], and Legacy Tree warns against assuming that both parents were dead [S7]. Read the MyHeritage post's \"orphaned\" children [S1] in that sense. An orphan ward whose mother is not named may still have a living mother: search for her.","sources":["S10","S8","S7","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-stated-reason","kind":"method","anchor":"**Reason.** Copy the stated reason. Besides a parent’s death or incapacity [S1], a pending conveyance could require representation for minor heirs. If the appointment falls just before a sale, compare the shares and names in the deed with those in the guardianship [S6].","sources":["S1","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-death-not-proved","kind":"method","anchor":"**Death.** Do not read a guardianship as proof that a parent had died, or the word \"orphan\" as proof that both had. A child with property could have a living father named as guardian [S2], and guardianships also arose while parents were living but incapable, absent or financially unstable [S9]. Take a death only from the record's own words, such as \"deceased\"; the appointment date is then the latest date for that death, not its date.","sources":["S2","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-appointment-timing","kind":"historical","anchor":"**Timing.** Guardians were appointed when there was a reason, which could be long after the death. Williams traces the Alden children from their father’s death in 1773 to guardianships in 1788, after their grandfather died, and the deed his heirs made in 1789 [S6]. Russell lists property with no guardian until there was a reason to get one as a typical situation [S2].","sources":["S6","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-relationship-stated","kind":"historical","anchor":"Distinguish the relationship stated in the appointment from one established elsewhere. Search for maternal relatives, older siblings, neighbours and business associates [S9], [S1]. A widow’s remarriage could bring a change of guardian [S7]. Russell identifies the man appointed in Blair County, Pennsylvania, in 1868 as the ward’s stepfather, a relationship the quoted docket entry itself does not name [S5]. Verify it against a marriage or household record.","sources":["S9","S1","S7","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-maternal-lead","kind":"method","anchor":"**A guardian with another surname.** A widowed mother did not automatically become guardian of her children's property [S9]. The preference was for the nearest male relative, and Blackstone's example is the uncle on the mother's side, who could not inherit the child's estate [S3]. Treat a guardian whose surname differs from the ward's as a candidate maternal relative, and so as a lead to the mother's maiden name, not as proof of it. The MyHeritage post says these records can confirm maiden names [S1]; one does so only when it states the relationship. Test the lead with [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S9","S3","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-sibling-wards","kind":"method","anchor":"**Siblings and other wards.** Test sibling relationships through the estate and each ward’s share. In Williams’s account, two of Ebenezer Alden’s children chose their mother’s brother while a third chose their father’s brother [S6]. Search each guardianship under its own parties. Shared or different guardianship appointments alone cannot settle sibling, half-sibling or step-sibling relationships.","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-age-threshold","kind":"historical","anchor":"At common law a child could choose a guardian for their own property at 14 [S2], [S6], [S7]. Check the local age of choice and age of majority on the appointment date [S9]. Transcribe any age in the docket, including whether it is exact or only a bracket. In the Blair County docket, Russell quotes Jesse Brook’s petition describing him as over fourteen [S5]. Record the election and court approval separately, then apply the period rule:","sources":["S2","S6","S7","S9","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-age-bracket-list","kind":"method","anchor":"- A ward who chose a guardian, or is described as over 14, was at least 14 and under the age of majority on that date.\n- A ward described as under 14 was under 14 on that date. A missing choice does not show that the ward was under 14.\n- A final settlement or the ward's receipt at majority dates the end of minority. Majority was commonly 21 for males and, in some jurisdictions, 18 for females [S9].","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-missing-child","kind":"method","anchor":"When a child is missing from a parent's will or from a census, search the guardianship series of the county where the estate was settled. Guardianship files may be the only surviving documentation that names minor children individually [S9], and the MyHeritage post recommends them for younger children missed after a parent's death or a move [S1].","sources":["S9","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-minor-county","kind":"method","anchor":"Look up the rule for the court that appointed the guardian. For the 1868 Blair County case, Russell identifies the minor’s county of residence as the appointing jurisdiction and suggests searching nearby probate indexes for an accounting where the property lay [S5]. Search both counties if they differ. The MyHeritage article suggests using guardianships to pinpoint migration [S1]. Under the residence rule Russell describes [S5], enter the appointment date as evidence of where the ward lived. Date a move only from separate evidence of the change of residence.","sources":["S5","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-failed-search","kind":"method","anchor":"Log a negative search with the court, series, index and years. Even a child with property could go without a formal guardian until a transaction required one [S2], [S6]. Extend the search to the sale or distribution of the property. For a child without an estate, also check household, apprenticeship and binding-out records [S7], [S1]. A failed guardianship search is not evidence that the child did not exist or that the father was alive.","sources":["S2","S6","S7","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-file-series","kind":"method","anchor":"A guardianship can be spread over several series. Search each series the court kept: probate court minutes, orphans' court records, county court order books, guardianship docket books and estate settlement files [S9]. Colonial orphans' courts continued in later courts, including probate and common-pleas courts [S7]. Inventory the file one document at a time: the petition and appointment, the guardian's bond [S9], [S8], the ward's choice of guardian, the annual accounts [S7], [S8], petitions to sell, and the final settlement at majority [S9]. Accounts can list payments for the ward's schooling, clothing, medical care and board [S9]. The MyHeritage post lists probate papers and the initial petition among these documents [S1].","sources":["S9","S7","S8","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-not-adoption","kind":"historical","anchor":"An adoption is a separate proceeding. Guardianship did not end parental rights or create a new parent-child relationship [S9], and Russell notes that formal adoption under U.S. law began only in the 1850s [S3]. The MyHeritage post's mention of adoption records among guardianship papers [S1] is no reason to read a guardianship as an adoption; look for any adoption as its own proceeding.","sources":["S9","S3","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-property","kind":"method","anchor":"Follow the property into deeds, tax lists, accounts and published sale notices. A guardian might petition for authority to sell the ward’s land or act for a minor heir in a conveyance [S8], [S9], [S6]. Search the deed indexes under the guardian and the ward, and check tax lists under both names [S5]. Read the capacity in the signature and follow a deed executed as guardian back to the authority to act. Record the estate or property value as stated [S1]. See [land index and book-series recovery](land-index-book-series-recovery.md).","sources":["S8","S9","S6","S5","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-maternal-estate-guardianship","kind":"method","anchor":"**After a mother’s death.** If a mother died leaving minor children, search for guardianship proceedings after her death, following the advice from the available excerpt [S14], [S15]. Use her estate papers alongside the guardianship petition and accounts to trace which property interests passed to each child [S16].","sources":["S14","S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-war-of-1812-guardian-remarriage","kind":"method","anchor":"**War of 1812 half pay.** If the pension index card names the widow and a separate casualty entry names the heirs and their guardian, search for a marriage between the widow and the guardian after the soldier’s death, following the advice from the available excerpt [S17]. Compare any marriage date with the guardianship and pension chronology [S18], [S19]. Keep the widow’s brother and a court appointee with no known kinship among the candidates until the records establish the guardian’s identity.","sources":["S17","S18","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-relative-care-without-appointment","kind":"method","anchor":"**Care by a relative.** When no appointment turns up, keep a suspected relative in play as a caregiver, following the advice from the available excerpt [S20]. Search that relative’s household records for the child and record evidence of residence and care separately from evidence of an appointment. In *Powers v. Mortee*, the children were placed with relatives before the later court appointments [S21].","sources":["S20","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bond-sureties","kind":"method","anchor":"**Bond sureties.** If the case file omits the bond, check the court’s probate bond series [S13]. On the bond, record the principal and each named surety in the role given [S13]. Research the sureties for ties to the guardian, following the advice from the available excerpt [S11], [S12]. Test any proposed kinship with other records.","sources":["S13","S11","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-apprenticeship-search-window","kind":"method","anchor":"**Apprenticeship after a parent’s death.** If searches for a will, probate or guardianship come up empty, follow the lead from the available excerpt [S20] and search for apprenticeship or binding-out orders from the death through the end of the child’s minority. In *Norris v. Stephens*, the Washington County, Tennessee, binding-out order from the available excerpt dates to 1870, years after the father’s death [S22].","sources":["S20","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-sumner-apprenticeship-rolls","kind":"custody","anchor":"For 1890s Sumner County, Tennessee, search the County Court minutes on Tennessee State Library and Archives rolls 54 (October 1882–January 1892) and 55 (January 1892–February 1903), listed under County Clerk in the inventory [S23 @2026-11-23].","sources":["S23"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
