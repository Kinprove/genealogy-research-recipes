claims:
  - {"id":"C-scope","kind":"historical","anchor":"Use this recipe when a guardian, a ward, a guardian's bond or account, or a minor's choice of guardian turns up in colonial or U.S. court records, or when a child disappears from the record after a father's death. A guardianship is a court's arrangement for a ward's property or affairs. Read each document for what it states about the ward's age, the parents, the guardian and the property, and log every series you search. Guardianship law and terms varied by state and period [S9], so confirm the statute that governed the record before you turn a rule below into a conclusion.","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-what-goes-wrong","kind":"historical","anchor":"- Reading the guardian as the person the child lived with. Guardians of minors were generally named for the child's property; a surviving parent, or a relative or neighbour, raised the child. [S2], [S3], [S7], [S1]\n- Reading \"orphan\" as a child with no living parent. Its older legal meaning was a fatherless child. [S10], [S8], [S7]\n- Reading a guardianship as proof of a parent's death, or its date as the death date. A living father could be named guardian of his child's property, and a guardian could be appointed years after a death, when a property matter required one. [S2], [S6], [S9]\n- Treating a failed search as a finding. Without property, or without a reason to act, no guardian was appointed. [S2], [S6], [S7]\n- Assuming that the guardian was a relative, or a relative on the father's side. [S9], [S3], [S1]\n- Assuming that the ward was a child. Adults judged unable to manage their own affairs had guardians too. [S6], [S4], [S1]\n- Treating a guardianship as an adoption. It did not end parental rights or create a new parent-child relationship. [S9]","sources":["S2","S3","S7","S1","S10","S8","S6","S9","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-row-fields","kind":"method","anchor":"Start a guardianship row for each ward and each appointment. Record as separate fields: the ward's name as written; minor or adult; the stated reason; the court, date and locator; whether the guardian was appointed by the court, named in a father's will or deed, or chosen by the ward; the guardian's name and any stated relationship; \"of the person\", \"of the estate\" or both, exactly as written; and the estate or property involved. A father could name a guardian by deed or will [S3].","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-adult-wards","kind":"historical","anchor":"**Minor or adult.** Guardians were appointed for children under 21 and for adults who could not handle their own affairs [S6]. An adult guardianship could begin with a petition by the ward's relatives and friends or by town officials, and its depositions often say why the person was judged incompetent. Williams quotes an 1802 petition by a man's \"friends and connections\" saying that he had neglected his business for eighteen months [S6]. Russell describes an 1835 case in Wayne County, Michigan Territory, in which a town's overseers of the poor had a guardian appointed for a spendthrift in his mid-seventies; the law's aim was less his welfare than keeping the town or county from supporting him or his family, and many jurisdictions in colonial and early-state North America had such laws [S4]. The MyHeritage post makes the same adult-ward point [S1]. For an adult ward, record the incapacity as the petitioners' allegation, do not derive an age from the guardianship, and treat the finding as sensitive.","sources":["S6","S4","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-estate-not-custody","kind":"method","anchor":"**Estate or person.** For a minor, read the appointment as a property arrangement unless the record says more. Guardians were generally named to look after the child's property, not to raise the child: a surviving parent did that, and a child with no parent stayed with a relative or neighbour who would take the child in [S2]. In Russell's 1828 example the court made the mother's brother guardian of four children, who most likely stayed with their mother [S3]. Legacy Tree says guardianship had little to do with physical custody [S7], and the MyHeritage post makes the same point without naming a place or period [S1]. Do not place a minor ward in the guardian's household unless a record says the child lived there. For the household, look for a census entry, or for board and schooling paid in the guardian's accounts [S9].","sources":["S2","S3","S7","S1","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-orphan-meaning","kind":"historical","anchor":"**\"Orphan\".** In *Stewart v. Morrison's* (Mississippi, 1860) the court gave the legal meaning of \"orphan\" as \"a fatherless child\", and held that a child whose father was living was not an orphan even if the mother had died [S10]. Baird describes the same older usage, in which the mother might be living [S8], and Legacy Tree warns against assuming that both parents were dead [S7]. Read the MyHeritage post's \"orphaned\" children [S1] in that sense. An orphan ward whose mother is not named may still have a living mother: search for her.","sources":["S10","S8","S7","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-stated-reason","kind":"method","anchor":"**Reason.** Copy the stated reason exactly. The MyHeritage post names a parent's death or incapacity [S1]; the record may instead name the ward's property or a transaction that needed a guardian. In Williams's example, guardians were needed so that minor grandchildren could join in the deed of their grandfather's heirs [S6].","sources":["S1","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-death-not-proved","kind":"method","anchor":"**Death.** Do not read a guardianship as proof that a parent had died, or the word \"orphan\" as proof that both had. A child with property could have a living father named as guardian [S2], and guardianships also arose while parents were living but incapable, absent or financially unstable [S9]. Take a death only from the record's own words, such as \"deceased\"; the appointment date is then the latest date for that death, not its date.","sources":["S2","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-appointment-timing","kind":"historical","anchor":"**Timing.** Guardians were appointed when there was a reason, which could be long after the death. Ebenezer Alden died in 1773 leaving minor children; his father administered the estate and cared for the family, and no guardian was appointed until 1788, after the grandfather's death, so that the 1789 deed of the grandfather's heirs could be executed [S6]. Russell lists property with no guardian until there was a reason to get one as a typical situation [S2].","sources":["S6","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-relationship-stated","kind":"historical","anchor":"Record a relationship only where the record states it. Guardians were often close relatives, but not always: maternal relatives were often appointed after a father's death, older siblings sometimes served, and neighbours or business associates occasionally did [S9]. Legacy Tree adds that courts saw a widow's remarriage as leaving the child's estate exposed to the stepfather, and typically appointed a replacement such as a neighbour or a relative with no interest in the estate [S7]. In Russell's 1868 Pennsylvania example the guardian was the boy's stepfather [S5]. The MyHeritage post also names neighbours and other court-appointed adults [S1].","sources":["S9","S7","S5","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-maternal-lead","kind":"method","anchor":"**A guardian with another surname.** A widowed mother did not automatically become guardian of her children's property [S9]. The preference was for the nearest male relative, and Blackstone's example is the uncle on the mother's side, who could not inherit the child's estate [S3]. Treat a guardian whose surname differs from the ward's as a candidate maternal relative, and so as a lead to the mother's maiden name, not as proof of it. The MyHeritage post says these records can confirm maiden names [S1]; one does so only when it states the relationship. Test the lead with [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S9","S3","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-sibling-wards","kind":"method","anchor":"**Siblings and other wards.** Do not build a sibling group from a shared guardian, or split one by different guardians. In Williams's example, two of Ebenezer Alden's minor children chose their maternal uncle as guardian and a third chose a paternal uncle [S6]. Link wards through the estate their shares came from, and test any half- or step-sibling link separately.","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-age-threshold","kind":"historical","anchor":"At common law a child of 14 was old enough to choose his or her own guardian for his or her own property [S2]. Williams [S6] and Legacy Tree [S7] give the same threshold, and Legacy Tree adds that the child stayed a minor until 21 [S7]. Dockets can state the bracket outright: the Pennsylvania docket Russell quotes calls the ward \"a minor over the age of fourteen years\" [S5]. The MyHeritage post lists ages among the usual contents [S1]. The ages of choice and majority varied by jurisdiction [S9]. Confirm the statute, then:","sources":["S2","S6","S7","S5","S1","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-age-bracket-list","kind":"method","anchor":"- A ward who chose a guardian, or is described as over 14, was at least 14 and under the age of majority on that date.\n- A ward described as under 14 was under 14 on that date. A missing choice does not show that the ward was under 14.\n- A final settlement or the ward's receipt at majority dates the end of minority. Majority was commonly 21 for males and, in some jurisdictions, 18 for females [S9].","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-missing-child","kind":"method","anchor":"When a child is missing from a parent's will or from a census, search the guardianship series of the county where the estate was settled. Guardianship files may be the only surviving documentation that names minor children individually [S9], and the MyHeritage post recommends them for younger children missed after a parent's death or a move [S1].","sources":["S9","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-minor-county","kind":"method","anchor":"Search the county where the minor lived as well. In Russell's Pennsylvania example, the Orphans' Court of the county where the minor lived appointed the guardian, the property might lie in another county, and she suggests the probate indexes of nearby counties [S5]. Where the court of residence appointed, an appointment outside the estate's county is evidence of where the minor lived on that date. It does not date a move, although the MyHeritage post says these records can pinpoint one [S1].","sources":["S5","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-failed-search","kind":"method","anchor":"A failed guardianship search is not evidence that the child did not exist or that the father was alive. A child without property usually had no guardian, and a child with property had none until there was a reason [S2]; Ebenezer Alden's children had none for fifteen years [S6]. Fatherless children who inherited nothing stayed with their mother or, if she had died or could not care for them, were bound out as apprentices by the court [S7]: search apprenticeship and binding-out records next. The MyHeritage post also notes that not every child had a formal guardianship [S1]. Log each negative search with the court, series, index and years covered.","sources":["S2","S6","S7","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-file-series","kind":"method","anchor":"A guardianship can be spread over several series. Search each series the court kept: probate court minutes, orphans' court records, county court order books, guardianship docket books and estate settlement files [S9]. Colonial orphans' courts continued in later courts, including probate and common-pleas courts [S7]. Inventory the file one document at a time: the petition and appointment, the guardian's bond [S9], [S8], the ward's choice of guardian, the annual accounts [S7], [S8], petitions to sell, and the final settlement at majority [S9]. Accounts can list payments for the ward's schooling, clothing, medical care and board [S9]. The MyHeritage post lists probate papers and the initial petition among these documents [S1].","sources":["S9","S7","S8","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-not-adoption","kind":"historical","anchor":"An adoption is a separate proceeding. Guardianship did not end parental rights or create a new parent-child relationship [S9], and Russell notes that formal adoption under U.S. law began only in the 1850s [S3]. The MyHeritage post's mention of adoption records among guardianship papers [S1] is no reason to read a guardianship as an adoption; look for any adoption as its own proceeding.","sources":["S9","S3","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-property","kind":"method","anchor":"Follow the property into the land and tax records. A guardian could sell a ward's property if he convinced the court that the sale was in the child's interest [S8]; accounts and newspaper notices record sales of a minor's inherited land [S9]; and guardians executed deeds for minor heirs, as in the Alden heirs' 1789 deed [S6]. For each sale, petition or deed, search the deed indexes under the guardian's and the ward's names and the tax lists for property taxed to either, as Russell advises [S5], with [land index and book-series recovery](land-index-book-series-recovery.md). A deed signed by someone \"as guardian\" points back to a guardianship. The MyHeritage post notes that these records can give land ownership and estate value [S1].","sources":["S8","S9","S6","S5","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
