claims:
  - {"id":"C-commission","kind":"historical","anchor":"Record who wrote each account, the vessel and cargo, capture date and flag. Read *prize* as the vessel or goods taken. Compare any letter of marque with the capture date, issuing authority and status of the target. Keep labels from different governments attributed. Follow the case to the prize court’s decision before treating the capture or sale as lawful [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-vessel-names","kind":"historical","anchor":"If a vessel changed hands, search both names and date the change. For Blackbeard's flagship, read *La Concorde* in the French voyage records and *Queen Anne’s Revenge* for the vessel after capture [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-trial-search","kind":"custody","anchor":"Search the Law Library of Congress's digitized pre-1923 piracy trial collection under the defendant, vessel and jurisdiction. For Chesapeake context, look for early published documents and histories in *The Capital and the Bay* [S1 @2026-11-20] [S3 @2026-11-20] [S4 @2026-11-20].","sources":["S1","S3","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-crew","kind":"method","anchor":"Read a crew list alongside testimony about how each sailor came aboard. If a witness describes capture or forced recruitment, retain that as an explanation for service. Log verdict, sentence and actual disposition for each defendant separately. When the sentence was postponed, leave it open until you have a later record [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-directory-leads","kind":"platform-ui","anchor":"If you have a possible pirate or privateer and no record location, browse Cyndi’s List under *Prisons, Prisoners & Outlaws* → *Pirates, Privateers & Buccaneers* [S6 @2026-11-22] [S7 @2026-11-22]. Use relevant listings to locate the underlying records before drawing a conclusion about the sailor or vessel.","sources":["S6","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
