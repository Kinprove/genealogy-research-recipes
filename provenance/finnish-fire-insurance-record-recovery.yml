claims:
  - {"id":"C-01","kind":"portal-availability","anchor":"For Suomen palovakuutuskonttori (1816–1833), search Astia for `palovakuutuskont*` and open series H Vakuutusasiakirjat. Look by locality and year or by the named owner. For its successor Suomen Yleinen Paloapuyhtiö, follow the Tarmo finding aids [S4 @2026-11-22], [S3 @2026-11-22].","sources":["S4","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"Use the Arkistojen Portti guide to choose a locality finding aid. For Helsinki, start with the paper catalogue used at Rauhankatu in Kyläkoski’s 2024 account. For Helsinki and the other cities listed under 602:163a, match the historic block and lot within the printed city list in chronological order. Use Turku’s separate 602:163b, ordered by block and lot. For other towns or rural properties, follow the guide’s microfiche route. Record the application number with the label used in the list [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Search the lists of newly issued policies in *Finlands Allmänna Tidning* by the period covered. Open the full issue and its supplements, and check the date heading before extracting the policy number and place. If a list is missing, log whether the supplement was unchecked or missing. Kyläkoski suggests that missing supplements may explain some gaps. Continue in the finding aids and leave the existence of the underlying policy open [S1], [S2], [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"portal-availability","anchor":"Kyläkoski found that numbers printed in notices for *Yleinen palovakuutusyhtiö* matched the policy books in the cases she checked. Use the printed number as a candidate locator in *Keskinäinen vakuutusyhtiö Tarmon lakkautettujen ainaispalovakuutusten arkisto* → *Lakkautettujen ainaispalovakuutusten vakuutuskirjat*. Select the locality and number range and confirm the match against the property details in the file [S2 @2026-11-22], [S5 @2026-11-22].","sources":["S2","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Keep the notice, insurance application and policy document as separate records. If the policy search fails, retain the notice as evidence of what was published and record the locality and number ranges you checked. The document’s survival remains unresolved [S2], [S3], [S5].","sources":["S2","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Pull each dated policy or application for the same historical lot. Use descriptions of relative position and use to place main and outbuildings even when there is no sketch. For changes in condition, start with the successive descriptions of the buildings. Compare those descriptions with any dated plans to trace changes in layout, materials and uses. Record the locator for each observation [S2], [S3], [S5].","sources":["S2","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Use the issuer on the notice or record, along with its place and period, to choose the archive. Follow the Swedish *Allmänna Brandförsäkringsverket* through its notices and appraisals. Follow *Suomen palovakuutuskonttori* and its successor *Suomen Yleinen Paloapuyhtiö* through the Finnish finding aids. If your lead is a fire or a payment, start with the payout reports and use the property wording to pursue the policy [S3], [S4], [S20], [S22].","sources":["S3","S4","S20","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"portal-availability","anchor":"Open *Inrikes Tidningar* by issue date in the National Library of Sweden’s *Svenska tidningar*. Use the title holdings note to identify the newspaper. The Stockholm City Archives card index mentioned there covers marriages and deaths [S19 @2026-11-22], [S11 @2026-11-22].","sources":["S19","S11"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"Copy the issue date and page, the leading policy number after *N:o*, the named owners or holders, the historic town or parish, and the insured structures. Record each plot number in its own field and distinguish an extension, an individual building and a group of buildings. For a notice listing several policy numbers, keep each number. For Åbo, label *gammal* and *ny* plot numbers as old and new, even when their order varies, and search with both [S6], [S7], [S14].","sources":["S6","S7","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"When consecutive numbered entries name owners in the possessive and end with a shared *Gårdar i* phrase, read the full run. Carry that closing property and locality wording back to the entries it governs and keep each owner and policy on its own row [S7].","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"Use these issue leads from Kaisa Kyläkoski’s lists to choose what to browse. Match the locality and property wording in the original notice before carrying the number into the insurer’s records [S6], [S7], [S12], [S14].","sources":["S6","S7","S12","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"example","anchor":"**2251–2500.** Start with 12, 16, 24 and 26 February, 12, 15 and 20 April, and 17 May 1796. The transcriber marks 2369 and 2414 `[digitoitu]` (digitized). Treat these flags as copy leads and check the original notice and catalogue before drawing conclusions about survival [S7].","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"**2501–3000.** Check 26 October 1796, then 21, 22 and 24 February, 19 and 21 April, 25 July, and 1 and 4 August 1797, then 16 February, 8 and 12 June, and 14 August 1798 [S6].","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"example","anchor":"**3001–3250.** According to the supplied excerpt from Kyläkoski’s 1798–1799 selection, policy 3172 is a lead for a digitized file [S16†]. Confirm the number and property in the notice and look for the assessment and any drawings.","sources":["S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-15","kind":"example","anchor":"**3501–3750.** According to the supplied excerpt, the cited issues are 1, 2, 4 and 9 April, 13 and 16 May, and 4, 5, 7 and 14 November 1800, then 12 and 17 June and 3 July 1801 [S18†]. Use the named holder, locality and all listed policy numbers to check the originals.","sources":["S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-16","kind":"method","anchor":"**3751–4000.** Check 3 July, 15 September and 23 October 1801, then 27 January, 26 February, 7 April, 24 September, 6 and 15 October, and 3, 9 and 17 November 1802 [S14].","sources":["S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-17","kind":"method","anchor":"**4251–4500.** Check 12 October, 2 and 13 November, and 4 and 7 December 1804, then 8 January, 13 September and 6 November 1805. Kyläkoski marks policy 4382 as a digitized copy lead. Use the number to look for the file and verify the property in it [S12].","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-18","kind":"method","anchor":"**1806 restart.** Use the listed opening numbers to pick an issue, then verify the exact number inside the list. Browse adjacent listed issues if needed. In April and May the starts are 5201 ([29 April, page 1](https://tidningar.kb.se/2509100/1806-04-29/edition/145120/part/1/page/1/)), 5217 (30 April), 5233 (2 May) and 5250 (6 May). In June and July they are 5272 (4 June), 5301 (10 June), 5314 (17 June), 5339 (18 June), 5368 (25 June), 5383 (2 July), 5404 (4 July), 5450 (8 July) and 5468 (11 July). Later starts are 5501 (15 August), 5520 (16 September) and 5528 (24 September) [S12].","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-19","kind":"example","anchor":"Kyläkoski reports that policy 4500 dates to 1803 and was publicized late in 1805, and that 5201 dates to 1804 and opens the 29 April 1806 list. Use the file for the policy date. For numbers between those notices, search the insurer’s records and leave the policy’s existence open if the newspaper is all you have. The underlying files and completeness of the publication gap were outside the recorded check [S12].","sources":["S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-20","kind":"portal-availability","anchor":"Open *Sök i arkivet online* at Brandförsäkringsverkets stiftelse för bebyggelsehistorisk forskning and follow the link to the digital reading room at Centrum för Näringslivshistoria. With collection access, search by policy number. If the number is unknown or yields no result, try the period town or parish, property, owner or valuation year. Check the appraisal for a sketch and search maps and drawings separately. The foundation describes access activation for first-time accounts. If access is unavailable, record the access limit and take the locator to the inventory. The recorded check covered the documentation only [S8 @2026-11-22].","sources":["S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-21","kind":"historical","anchor":"Kyläkoski’s 2022 posts point to Riksarkivet’s separate [Brandförsäkringar](https://sok.riksarkivet.se/brandforsakringar) and [Brandförsäkringar kartor](https://sok.riksarkivet.se/brandforsakringar-kartor) searches and report overlapping results with Centrum för Näringslivshistoria for the early policies she tried [S6], [S7]. According to her September 2023 post and supplied excerpts from the series, Riksarkivet directed readers to the foundation [S14], [S16†], [S17†], [S18†]. Carry the number to the foundation if an older link fails. Treat misses in the overlapping early searches as a coverage limit.","sources":["S6","S7","S14","S16","S17","S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-22","kind":"method","anchor":"After a notice gap, an online miss or an access block, use the published archive inventory. Check the card and register entries for Finland in D 1, including volume 117 for urban and rural property, insurance numbers 138–15913. Check the separate Finland map inventory under D 2 for a plan. Use the inventory entries as locators and record the series actually inspected. Keep the policy number in the citation even if the catalogue normalizes the place name. The check covered the finding aid entries. Volume 117 itself was outside that check [S9].","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-23","kind":"custody","anchor":"Check the National Archives of Finland’s microfilms of the Swedish insurer’s records for properties in Finland after an online miss. Keep this microfilm route distinct from the Finnish successor office’s records [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-24","kind":"historical","anchor":"For Turku (Åbo), check the City Archives for the property and period. The city’s 2015 heritage programme identifies its oldest insurance records as dating from 1785–1827. For appraisals, use the published shelfmarks *Brandförsäkrings Instrument* K16–K17 (1785–1807). For 1807–1809 also check K10 for the appraisals identified there. The published discussion and programme supply these leads. Check the issuer, both plot numbers, holder and insured structure in the appraisal before joining it to the notice [S6], [S7], [S10], [S14], [S15].","sources":["S6","S7","S10","S14","S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-25","kind":"example","anchor":"Use Kyläkoski’s issue locators in the National Library of Finland’s collection as finding leads. Her inventory gives page 5 as the starting page for the listed issues, with separate starting pages for the two lists in issue 304 of 31 December 1859. The linked 1859 scans and the examples of 12 July 1833 and 15 November 1844 were unavailable during the recorded checks [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-26","kind":"method","anchor":"**List through 17 May 1833.** Use [12 July 1833, page 5](https://digi.kansalliskirjasto.fi/sanomalehti/binding/395939?page=5) [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-27","kind":"method","anchor":"**October–September lists ending in 1834–1845.** Use the issue in the ending year. In order, the dates are 31 October 1834, 31 October 1835, 29 October 1836, 28 October 1837, 26 November 1838, 14 November 1839, 28 November 1840, 10 November 1841, 4 November 1842, 31 October 1843, [15 November 1844, page 5](https://digi.kansalliskirjasto.fi/sanomalehti/binding/405822?page=5) and 29 October 1845 [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-28","kind":"method","anchor":"**Later October–September lists.** For periods ending in 1850, 1852, 1853, 1854 and 1856, use 26 November 1850, 9 December 1852, 7 December 1853, 9 December 1854 and 18 December 1856, respectively. For 1857–1858 and 1858–1859, both in issue 304 of 31 December 1859, use [page 13](https://digi.kansalliskirjasto.fi/sanomalehti/binding/404234?page=13) and [page 31](https://digi.kansalliskirjasto.fi/sanomalehti/binding/404234?page=31), respectively. For the period ending September 1860, use 26 November 1860 [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-29","kind":"method","anchor":"**Later periods.** For 1 October 1860 through 31 December 1861, use 28 March 1862. For calendar years 1862 and 1863, use 11 April 1863 and 13 May 1864, respectively [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-30","kind":"method","anchor":"Search digitized newspapers using the period Swedish property and place names. Browse annual reports of the General Fire Insurance Fund in *Fahlu Weckoblad* and *Weckoblad för Gefleborgs län*, including for Finnish properties. Start with the expected payout year and the next year, then check adjacent reports as needed [S20], [S21], [S22].","sources":["S20","S21","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-31","kind":"method","anchor":"Record the payout year, issue date and any stated fire date in separate fields. Copy the place, named party or property wording, currency and amount. Check adjacent reports for payments to the same property before counting separate fires. Limit a search miss to the compensation reports inspected and leave the occurrence of a fire open [S20], [S22].","sources":["S20","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-32","kind":"example","anchor":"Kyläkoski’s transcription traces payments to the same Göteborg sugar refinery in 1792–1794. Her transcription of the 1801 Björneborg (Pori) entry in *Fahlu Weckoblad*, 14 August 1802, gives 8,508 riksdaler for eight properties. Keep the property count with the group total and leave the individual sums open [S20].","sources":["S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-33","kind":"example","anchor":"Search building histories and local accounts for the same property and fire year. The Sederholm payout appears under the property in Kyläkoski’s transcription of the 14 August 1802 issue. The Helsinki City Museum documents 1801 fire damage to the side building at Katariinankatu 3. Cite the payout wording and the damage to the named building separately [S20], [S23].","sources":["S20","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-34","kind":"method","anchor":"Use the insurance document for the policy date and record the newspaper issue date separately. If the file includes a valuation, record its date and what it covers. Keep appraisals, claims, maps and drawings separately locatable. Match the property and number before pairing the notice and file [S12], [S13].","sources":["S12","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
