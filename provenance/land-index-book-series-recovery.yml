claims:
  - {"id":"C-0ada0c1a23b7","kind":"unclassified","anchor":"Choose a locality, supported name forms and a bounded period. Establish the historical\njurisdiction and present custodian from the locality's record descriptions.\nCopy any supplied property description exactly, including directional letters and numbers.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e27bde13453c","kind":"unclassified","anchor":"For **U.S. county conveyances**, check county formation and boundary changes for the tract\nbefore choosing index volumes. Land now in County B may have been recorded in parent County A\nbefore B existed. Search the appropriate parent-county series for that period and verify where\nthose books are held today. Keep later recording dates in mind too; a modern county-only search\ndoes not cover the tract's earlier records. [S35]","sources":["S35"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e6d2a8f33bd5","kind":"unclassified","anchor":"For a supplied land lead, distinguish an original government disposition from a later\nprivate conveyance before choosing the index. Use the stated issuing authority and\nhistorical holdings descriptions to select the relevant grant/entry series or conveyance\nrecords; verify present custody and index/image date coverage separately. Leave an\nuncertain record class unresolved. [Historical demonstration](https://www.youtube.com/watch?v=0fFPtZb5TQw).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2a2fae15e762","kind":"unclassified","anchor":"If the grant is filed under a historical land district, preserve that district/code separately\nfrom the parcel's county. Use the period district map and stated property description to resolve\nthe county before selecting local indexes; leave an unsupported mapping unresolved. A familiar\ndistrict name does not establish the same-named modern county or the person's residence.\nThe [district/parcel example](https://familylocket.com/rlp-196-texas-land-grants-republic-and-statehood/)\nmotivates this field-role check without resolving legal boundaries.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2d6624aa8359","kind":"unclassified","anchor":"When a patent states the grantee is “of” another place, preserve that exact residence\nstatement and date separately from the parcel description and county. Use each place role\nas a bounded follow-up lead, retaining namesake alternatives and the actual search outcome.\nThe [female-parentage research example](https://familylocket.com/rlp-230-finding-a-females-father-research-log-and-report/)\nmotivates this handoff without independently establishing the stated residence or identity.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a71a913aeab8","kind":"unclassified","anchor":"For an original-government grant lead, carry separately supplied warrant, survey and patent\nbook/page references into linked retrieval rows; seek any separately described application.\nPreserve applicant/warrantee, assignee and final patentee, each action's date and stage-specific\nacreage. Reconcile the retrieved components against the register before following later private\nconveyances, leaving missing parts and conflicting dates or acreage unresolved. The\n[Pennsylvania acquisition example](https://familylocket.com/part-4-pennsylvania-germans-the-land-acquisition-process-in-colonial-pennsylvania/)\nmotivates the crosswalk; it does not establish a universal grant procedure or legal title.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e0408545a8e6","kind":"unclassified","anchor":"Do not assume the warrant, survey and patent were completed before private sales began. A\nwarranted or surveyed tract may pass through county deeds before a later patent, so the patentee\ncan be a later holder rather than the first settler. Search county indexes for the tract between\nthe survey and patent dates. The [Pennsylvania discussion](https://www.youtube.com/watch?v=V0he2PdYk2k)\nmotivates this order check. [S7]","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9d1f2e7ba215","kind":"unclassified","anchor":"When a supported warrant/survey or assignment lead remains unexplained by a deed search,\nfollow the applicable grant/patent index to the described original survey and jacket. Inspect\navailable assignment endorsements; retain assignor, assignee, requested grantee and dates as\nseparate stages with their own locators. The [Dobkins survey example](https://dna-explained.com/2022/10/16/tracking-john-dobkins-or-dobbins-to-maryland-52-ancestors-378/)\nidentifies this next target without assuming assignments were universally unrecorded or\nestablishing residence, ownership, kinship or a complete chain of title.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b73fbdc593d","kind":"unclassified","anchor":"When a tax row explicitly supplies the original grantee or abstract number, carry that exact\nparcel reference into the government-grant search while keeping the assessed taxpayer's role\nseparate. Queue later local conveyances separately; first tax appearance does not date\nacquisition or arrival. The [Mexican Texas research example](https://familylocket.com/rlp-195-texas-land-grants-mexican-era/)\nsupplies this tax-to-grant handoff.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c8aa7a002f40","kind":"unclassified","anchor":"Map every volume and tax-class section of each selected year before interpreting a surname miss\nor stopping at one hit, and record each section's own sort key, locator and inspected extent in\nthe series register: a real-estate section may follow land location while another list follows\nnames. Check separately described supplementary or nonresident sections without assuming every\nplace has them, and recheck the arrangement for another year. The\n[reported one-book to two-book transition](https://familylocket.com/rlp-329-using-ai-in-report-writing/)\nmotivates this inventory. A missing name in one section is not absence from the annual set, and\na complete search of supplied volumes does not establish complete survival or legal liability.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-20425a86d733","kind":"unclassified","anchor":"If an expected taxpayer is missing from a roll used for this land lead, inspect its actual\norganization and bounded unsearched sections for entries filed under another payer or estate\nrepresentative. Preserve the names and sections searched, their extent and the result.\nIn the [1849 tax-roll example](https://familylocket.com/rlp-315-tips-for-when-the-courthouse-burned/),\nthe speaker reports finding John Cline's entry under W for administrator Wiseman after\nmissing it under C. Carry any supplied parcel reference into the comparison with land records.\nThis recovery step does not by itself establish a death date, a sale, kinship, legal liability\nor the identity of same-name people.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-07b19860d719","kind":"unclassified","anchor":"1. Record the index title, jurisdiction, covered dates and the record series it indexes.\n2. Read its opening instructions, subdivision keys and column headings before assuming that\n   surnames follow ordinary alphabetical order.\n3. Determine whether it is a grantor, grantee, combined/general or tract-based index. In U.S.\n   conveyance indexes, **direct = grantor** (conveying party), and **indirect**, **reverse** or\n   **inverted = grantee** (receiving party). Check the actual headings and record types: these\n   roles also occur in mortgages and other instruments, not just sales. [S36]\n4. Where separate grantor and grantee indexes exist, include both in the search plan. Record\n   the given-name subdivisions or surname-key procedure the actual volume requires.\n5. For a tract-based index, copy the complete available township/range/section or other\n   description and identify the volume covering it. Leave missing coordinates unresolved.\n6. Record the index date's role when explained: instrument, recording or another date.\n   Do not silently use a recording-year range as the transaction-year range. [S1, S2, S4]","sources":["S36","S1","S2","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-57d9371c3926","kind":"unclassified","anchor":"**Check:** The selected pages follow this volume's rules. A Russell-style or given-name\nsubdivision index can place a surname somewhere other than the page you first expected.\nRussell indexes use surname initials and selected key letters, often with given-name\nsubdivisions, rather than a single ordinary alphabetic sequence. Single-key and double-key\nversions differ. Read the key table printed at the front of the actual volume and follow its\ninstructions; do not substitute a Soundex code or assume a Campbell or Cott index uses the\nsame key. [S37]","sources":["S37"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-85a63e15ca8b","kind":"unclassified","anchor":"1. For each candidate, save its index image or a permitted transcription and copy the parties,\n   instrument type, book/volume, printed page(s), dates and property description actually supplied.\n2. Mark unreadable characters rather than choosing the locator that is easiest to open.\n3. Use the other index direction when available to compare an uncertain name, book or page\n   reference. Inspect neighboring entries to understand the handwriting and column layout.\n4. If a recorded locator produces the wrong document, return to the index before changing\n   the person's identity. A page range such as “4 and 5” can be misread as a single larger number.\n5. Keep the first reading and correction in the ledger. When both entries describe the same\n   instrument, link them to one candidate instrument rather than counting them as two sources.\n   [S1, S2, S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b09318d8f5a6","kind":"unclassified","anchor":"When parallel registers, translations or compiled indexes are supplied, align the same entry\nand its original page/sequence before comparing locators. Keep a compiler's bracketed grant\nreference or added field separate from the original register's words. Use the added locator\nas an attributed retrieval lead; do not date that information to the original register or\ncount derivative versions as independent witnesses. The [parallel Texas-register example](https://familylocket.com/navigating-the-unique-texas-land-grant-system-mexican-era-1821-1836/)\nmotivates this check, without requiring three versions or validating the translation or legal claim.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0daf08110fa5","kind":"unclassified","anchor":"1. Read the index's instrument-type and series columns and the repository's book descriptions.\n   The same volume number can be used in different series.\n2. Open the specified series and volume, then locate the printed page. Preserve the viewer's\n   image locator separately.\n3. If the index does not identify the series clearly, list the plausible locally held series\n   and inspect the bounded targets or ask the custodian with the complete index reference.\n4. Include a miscellaneous series when the index or holdings make it a candidate. A certificate\n   or related instrument can be there rather than in the deed book.\n5. Inspect the next page for continuation, and verify the parties, instrument type and land\n   description before marking the locator resolved.\n6. If a secondary lead's location conflicts with the index or document, preserve both forms.\n   Compare every directional letter and coordinate; do not silently “correct” the lead to make\n   a result fit. [S2, S3]","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-543b1f70c1fe","kind":"unclassified","anchor":"When an attributed lead identifies a loose or unrecorded deed, retain its parties, date and\nproperty clues. Check the actual custodian's holdings and finding route for those papers\nseparately from recorded deed books; distinguish the target requested from what was recovered.\nThe [loose-deed example](https://familylocket.com/rlp-225-how-multiple-relationships-affect-dna-match-analysis/)\nmotivates this fallback without guaranteeing survival, access or a reason for nonrecording.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c629f4be228f","kind":"unclassified","anchor":"When a record-loss report covers the period, do not treat it as absence. Ask the custodian, or\ncheck the holdings description, whether deeds were re-recorded from returned originals, and\nsearch those books and their indexes. Record a re-recorded entry as a later copy, keeping the\ninstrument date, any stated earlier recording reference and the re-recording date apart. Also ask\nwhether an abstract or title company keeps its own tract records for the area. Record any copy\nobtained as a third-party abstract or copy with its custody stated, and keep any official\nbook/page it cites as a retrieval lead. The [burned-county discussion](https://www.youtube.com/watch?v=zSx_9MrKP0M)\nand [title-plant remark](https://www.youtube.com/watch?v=gssWfSl8JwY) motivate these routes. They\ndo not show that a given county re-recorded, how such entries are marked, that every original\ncame back, or that a plant survives, covers the period, is accessible or reaches back to the\noriginal grant. [S5, S6]","sources":["S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-953c73777e2b","kind":"unclassified","anchor":"**Use when:** an identified Swedish farm lacks a purchase date, or its older designation\ndoes not match the parcel now being searched. Start with the actual property description\nand available book coverage; an approximate purchase decade need not be the only entry key.\nThe [property-book demonstration](https://www.youtube.com/watch?v=DoRSQ94Hd1M) follows a property\nthrough numbered entries and a later book. It does not verify the questioner's farm. [S27]","sources":["S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-22a7ab7063eb","kind":"portal-availability","anchor":"**Check the books' period and scope first.** Riksarkivet describes its *lagfartsböcker* as books\nfor rural properties, kept from the 1870s, with information from about 1875 to 1933. Its index of\nthe books is not complete. If the indexed search misses the property, search the archive's books\ndirectly; for that you need the property's name at the time and its parish. [S56 @2026-11-13]","sources":["S56"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e1468dd92126","kind":"unclassified","anchor":"1. Establish the relevant court archive and volume from the holdings description. Read the\n   volume's arrangement and locate the farm and stated property designation. Preserve the\n   farm number, parish and any *mantal* or fractional description exactly; do not substitute\n   the current designation without a documented connection.\n   If a carryover gives a book label that the catalogue does not recognize, compare the\n   available spine/title images with the catalogue's series description. Keep both labels\n   in a volume crosswalk, with the image that connects them. In the lecture's example, a\n   later ownership column points back to an older book and numbered rooms, while the book's\n   spine and catalogue use different labels [S28]. Verify that match for the actual archive;\n   the example is not a nationwide series-code conversion. Check the farm-name alphabetic\n   division and covered years as well: the same name can require successive period volumes.\n2. Copy the entry's *rum* number, the numbered space in the book, separately from the\n   printed page and viewer image. In the predecessor's column, follow a supplied room\n   reference backward; in the remarks, follow the reference to the next owner's room.\n   Record which column supplied each direction. The\n   [Riksarkivet guide](https://riksarkivet.se/resurser/guide-till-lagfartsbok)\n   explains these distinct references. [S29]\n3. If a margin transfers the entry into a new *lagfartsbok*, copy that book reference and\n   locate the corresponding entry there. Verify the property description and any stated\n   share at the destination. Keep an uncertain room reading unresolved instead of choosing\n   the next plausible name. A successor book's opening year is a locator, not a purchase date.\n4. For each entry, preserve applicant, transferor, acquisition type, underlying document\n   and its date, application date, granted-registration date and any protocol paragraph.\n   Keep a stated half-share as a half-share; do not silently make every entry a whole-farm\n   sale. A will or probate reference is a target to retrieve, not permission to call the\n   transfer a purchase or infer kinship. [S27, S29]\n5. Carry the registration year and act/paragraph reference into the corresponding\n   *lagfartsprotokoll* to seek the underlying acquisition document. Record the book entry\n   and retrieved protocol/document as linked objects, retaining any conflict between them.\n   If the protocol or cited will/probate is unavailable, report that exact missing target.\n   Room navigation alone does not resolve the ownership chronology. [S29]","sources":["S28","S29","S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b1ae9507eb22","kind":"unclassified","anchor":"When a designation changes, resolve that break before attaching an earlier book entry to\nthe modern parcel. The [property-history discussion](https://www.youtube.com/watch?v=HSY904f8uPU)\ndescribes subdivisions, mergers and numbering exceptions; number similarity is not a\nparcel link. Nor does the same *mantal* alone establish an unchanged parcel. [S28]","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8f6ac640766","kind":"unclassified","anchor":"1. Keep the older farm/parish/number and assessed *mantal* alongside the full modern\n   designation. In an available register extract, copy *Tidigare fastighetsbeteckning*\n   (previous designation), its date and act reference, and *Ursprung* (parent property or\n   properties) as separate fields. The\n   [register description](https://www.lantmateriet.se/sv/fastighet-och-mark/information-om-fastigheter/Fastighetsregistret/registrets-innehall/)\n   identifies these fields; do not assume that every extract supplies the whole history. [S30]\n2. Use the cited act identifier to retrieve the relevant *förrättningsakt*. Read its map\n   together with the descriptions, decisions and protocol actually present to identify\n   the old and new units and the change connecting them. The\n   [act description](https://www.lantmateriet.se/sv/fastighet-och-mark/information-om-fastigheter/Forrattningsakter/)\n   explains why the register summary and the survey file are separate retrieval targets. [S31]\n3. Give each documented subdivision, merger or renumbering its own link. Retain multiple\n   parent or successor units where the records show them, including an older designation\n   that no longer names an active parcel. Follow supplied references in both directions\n   where available; a missing parent record remains a gap. Do not derive a parent by\n   deleting digits or force every historical holding into one modern unit. [S28, S30, S31]","sources":["S30","S31","S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a671540ac44b","kind":"unclassified","anchor":"For a historical survey whose act reference is not yet known, use an available survey\nregister card as a finding aid. The lecture locates a farm-number card through the county,\nparish and farm's register, then takes the card's act label and year to the corresponding\nmap [S28]. Copy the card's farm identifier, act/signum, year and stated survey action;\nretain separate rows for subdivisions, partitions, road divisions or other listed acts.\nRegister formats vary by locality, so inspect the actual headings rather than applying the\nexample's card layout elsewhere. A card listing is a retrieval target, not an inspected act.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4461efd30870","kind":"unclassified","anchor":"Open the matching act and use its map with the descriptions and decisions already required\nabove. Compare the card's reference with the act actually retrieved, and retain any missing\ntext or map as an unresolved component. Record later parcel labels or annotations separately\nfrom the survey's original date: the lecture's map had numbers added afterwards [S28]. Use\nthe [map-record workflow](historical-map-record-recovery.md) for this copy's legend and\nbase/correction dates. An undated added label cannot date that designation or building to\nthe original survey, and a named feature does not identify its occupant.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f7c5507648de","kind":"unclassified","anchor":"A *lagfartsbok* follows registered owners, not every tenant or cultivator. A named husband\ndoes not make an unlisted wife absent from the household or settle her interest in the\nproperty [S28]. Keep the title entry and the residence observation as separate records.\nIf the question concerns a user rather than the registered owner, choose a branch below\nonly from evidence for that farm's assignment or the dwelling's arrangement.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d6df44022aac","kind":"unclassified","anchor":"**A military-assigned farm:** establish the actual assignment before looking for duty-specific\npapers. The lecture describes *rusthållsförändringar*, change receipts or lists for a farm\nsupporting the cavalry, as a route beyond the succession visible in tax rolls [S28]. Ask\nfor the relevant farm and period in the described *Krigsmanshuskontoret*, regimental or\ncounty *landskansli* holdings; establish each custodian's actual series and coverage\nseparately. Preserve the named outgoing and incoming holder, date, farm/share, recorded\nrole and any explicit relationship wording. Keep a holder change distinct from a sale;\nthe lecture discusses both Crown and privately owned farms. Tax-list proximity does not\nestablish the relationship, and a narrated example does not verify the people in your case.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-14b846152134","kind":"unclassified","anchor":"If the evidence instead identifies an *officersboställe* or another service holding covered\nby the inspection series, seek the described *husesynsprotokoll* for a change of holder.\nThe lecture points to inspection records under *Krigskollegium* for building-by-building\ndescriptions and information about users and entry into possession [S28]. Verify the\nholding, period and surviving series before requesting them. Record the inspection date,\nholder and cultivator separately, the buildings actually described and any stated entry\ndate; do not give a cultivator the officer's role or treat an inspection as a title transfer.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-04222f977bbe","kind":"unclassified","anchor":"**A torp or stuga on another owner's ground:** retain the parent farm and the evidence for\nthe small dwelling's location and use. A missing separate parcel/title entry does not show\nthat the dwelling did not exist. The lecture suggests *jordtorpsundersökningar* for torps\nwith labor-rent obligations; this is a population-specific survey, not a register of every\nsmall house [S28]. Check the survey's actual locality, period and included categories before\nusing it. Record the holding, user, work obligation or payment only as the inspected entry\nstates them, and keep a survey miss bounded to that coverage.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8c6a39095ecf","kind":"unclassified","anchor":"For a private rental or lease, look for a specific surviving lead among the owner's or\ntenant's papers; a title-book miss does not locate those papers. If a record identifies an\n*undantag* support arrangement, seek its contract\nand any referenced court copy. The lecture notes that copies can occur in *småprotokoll*\n[S28]; establish the relevant court and surviving series before treating this as a target.\nRecord the people, dwelling/use terms, dated obligations and record form actually recovered.\nDo not turn a lifetime support clause into ownership of the underlying land, or assume\nthat a private contract survives or was copied by a court.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d2d57dd6ca9","kind":"unclassified","anchor":"**Return:** add the triggering assignment, residence or contract reference to the existing\nledger, with its source, selected branch, custodian/series, requested target, inspected\ndocument and unresolved gap. Stop at the documented result. These routes can recover\nstatements about use, succession or relationships; they do not establish kinship, farm\ntenure, parcel lineage or a complete history of an unregistered dwelling.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4199d06252ac","kind":"unclassified","anchor":"**Use when:** a securely identified farm and bounded period lead to Bavarian property\nprotocols or tax cadastres. Preserve the farm wording and dated location before selecting\nrecords. The presentations describe historical retrieval examples [S32–S34]; their\narchive locations, catalogue screens and access statements are not current instructions.","sources":["S32","S33","S34"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-63682e508e23","kind":"unclassified","anchor":"Keep the named *Grundherr* (landlord), recording court and subordinate *Amt* separate.\nThe Briefprotokolle presentation describes a landlord consenting to a transfer recorded\nby another authority, and court records divided among subordinate Ämter [S32].","sources":["S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3c85bbdbb929","kind":"unclassified","anchor":"1. Use dated jurisdiction descriptions and the court's history to identify the lower\n   court responsible for this farm's property protocol. A named monastery or landlord\n   supplies a relationship to investigate, not automatically the creating court.\n2. Read that creator's finding aid for the relevant *Briefprotokolle*, period and Amt.\n   Preserve competing court/Amt candidates where the allegiance is unresolved; a modern\n   locality does not choose between them. Take the actual shelfmark from the inventory.\n3. Check the volume's beginning and end for an index before deciding how to browse.\n   The presentation reports indexes at the back as well as volumes without one [S32].\n   Apply the index and locator controls above to the actual arrangement; an index miss\n   is bounded by its verified coverage, not a finding that the transfer never occurred.","sources":["S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-18d5bab5a3d1","kind":"unclassified","anchor":"If the farm's records identify dues or an endowment owed to a second court, church or\nfoundation, preserve that institution and the obligation's wording, date and source.\nThe Landshut presentation describes farms appearing in such books despite belonging\nto another principal lord, and a *Salbuch* with earlier deed copies appended [S33].","sources":["S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-851ca1be00f8","kind":"unclassified","anchor":"Use the actual book headings and references at each stage. The Landshut and cadastre\npresentations distinguish an initial fixed assessment from chronological changes and\nlater house-number-partitioned volumes [S33, S34].","sources":["S33","S34"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9a0d52442159","kind":"unclassified","anchor":"1. Establish the farm's historical *Steuerdistrikt* from dated place/atlas descriptions,\n   keeping it separate from the modern municipality. Locate the corresponding early\n   *Häuser- und Rustikalsteuerkataster* under its actual Rentamt inventory; check later\n   *Grundsteuerkataster* descriptions separately. The source's two catalogue placements\n   are finding leads to verify, not a fixed present-day menu path [S34].\n2. In the initial entry, copy the farm description, recorded person, house number and\n   each *Besitznummer* separately. A farm can have several possession numbers. Carry\n   those numbers into the matching *Umschreibebuch*: the early example follows them\n   chronologically rather than arranging every change under the house number [S34].\n   Record the period and extent actually inspected; keep each transfer reference.\n3. Seek the corresponding *Liquidationsprotokoll* and map through their actual finding\n   descriptions. Compare the text's holding description and parcel numbers with the\n   map's identifiers, keeping *Flurnummer*, house number and possession number distinct.\n   Use the [map-record workflow](historical-map-record-recovery.md) for the actual legend,\n   map date and later annotations. A narration about a map does not establish a parcel link.\n4. Follow the references into the later cadastre and its *Umschreibehefte*. Inventory all\n   plausible volumes for the period: identical date spans can cover different house-number\n   ranges, and the catalogue may omit those divisions [S33, S34]. Inspect their actual\n   coverage or index before choosing one; the first same-dated volume may be insufficient.\n5. Carry an explicitly recorded old/new house number into the next volume. When a sale\n   or subdivision creates another possession number or sends parcels to another entry,\n   follow each stated destination and preserve the remaining holding separately [S34].\n   Keep multiple resulting units; number similarity or an unchanged farm name is not a link.\n6. Copy any actual notary, instrument date and document number from the change entry,\n   then use the series and full-instrument retrieval controls above. Keep the cadastral\n   entry, underlying act and any later annotation as linked records with their own dates.","sources":["S34","S33"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e26f3640f3c","kind":"unclassified","anchor":"1. From the retrieved document, record the instrument's stated date and the recording date\n   separately. Keep another dated action, such as acknowledgment, in its own field when present.\n2. Compare the dates with the index's ordering. If registration occurred later, extend the\n   index search by an explicit, recorded range when the question requires it.\n3. Confirm whether you examined an original instrument, a recorded copy in a book, or only\n   an index/abstract. Do not describe a book image as the original signed instrument by default.\n4. Reconcile the index-audit and locator ledgers: each relevant candidate is resolved,\n   uncertain, unavailable or assigned a next action.\n5. Report searched index directions, date ranges, key/page coverage and book series.\n   A completed bounded audit does not prove that no unrecorded or differently held instrument exists.\n6. Hand retrieved documents to the established abstracting and evidence/proof workflows.\n   Keep chain-of-title or kinship conclusions outside this retrieval result. [S1, S2, S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-456975f816c0","kind":"unclassified","anchor":"Compare the opening party roster with the execution names and roles before reporting a\nperson absent from a deed. Retain blanks, additional names and discrepancies with their page\nlocators; use relevant book practice and independent records to investigate unresolved roles.\nThe [Joanna West deed example](https://familylocket.com/rlp-217-joanna-west-case-study-part-2/)\nsupplies this crosscheck. Placement or omission alone does not establish widowhood, legal\nincapacity, a spouse's death or kinship; execution names in a recorded copy are not necessarily\noriginal autographs.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eff36a932b26","kind":"unclassified","anchor":"Before reporting a grantor's wife absent from a sale, read the recorded instrument through its\nacknowledgments for a release or separate-examination clause. If none appears, search later index\nentries over an explicit, recorded range for a separately recorded release or disclaimer deed,\nwhich may have been made years after the sale [S4], and link it to the sale's instrument ID.\nRecord her name as written, any date the release states, and any stated source of her interest,\nsuch as inheritance. The [disclaimer-deed explanation](https://www.youtube.com/watch?v=Gci5qXFBtrQ)\nand [release-of-dower discussion](https://www.youtube.com/watch?v=CjjD9mI_dY8) motivate this\ncheck. Release requirements varied by state. Neither a missing release nor the witnesses' names\nestablish her death, marital status or kinship. [S9]","sources":["S4","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3fed850e5cbf","kind":"unclassified","anchor":"A grantor/grantee index often names only the parties to an instrument. Determine from the index\nitself whether it covers only parties or also witnesses, adjoiners, heirs or other people named in\nthe text, and report a negative search within that verified scope. Use\n[FamilySearch Full-Text Search](https://www.familysearch.org/en/search/full-text/) where it covers\nthe relevant deed images, including for witnesses and adjoiners omitted from party indexes.\nRead instruments already in hand for those people too, and verify any search hit on the image. [S38] The\n[full-text search remark](https://www.youtube.com/watch?v=kFxsAw8HHAs) motivates this\ndistinction. Full-text coverage and machine reading vary, so a full-text miss does not prove\nabsence either. [S8]","sources":["S38","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4c1877e700d2","kind":"unclassified","anchor":"When an original deed survives outside the recorded book, read any clerk's endorsement giving\nthe book, page or acknowledgment date. Use it to find the recorded copy, then compare the two\ntexts instead of assuming the transcription is exact. Where a court ordered recording, search the\norder or minute book for that entry and keep its date in its own field. The\n[deed-process explanation](https://www.youtube.com/watch?v=gWPPN9DUUSc) motivates this crosswalk.\nEndorsement and court-order practice varied, and the source shows no example endorsement. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1c0b3dd91ff6","kind":"unclassified","anchor":"1. Save the patent image/locator and its supplied state, land office, act and date,\n   acreage, document/patent number and exact land description. Keep these labelled fields\n   separate; an absent entry-file number is not supplied by relabelling the patent number.\n   The [NARA preparation account](https://www.danaleeds.com/10_tips_for_nara/) shows a\n   BLM-linked locator worksheet, not a universal current request form. [S10]\n2. Identify the entry class from the document or finding description. The cited cases\n   include cash sales, bounty-land military warrants and homestead entries. Match the\n   locator fields to the actual custodian's series description and instructions for that\n   class and period before requesting the file; record unresolved class, custody or access\n   separately. A patent image does not establish that its supporting packet has been\n   retrieved. [S11, S12]\n3. After a completed-patent search misses a supported tract lead, follow the tract-book route in\n   [U.S. federal land entry files](us-federal-land-entry-file-recovery.md) to entries that did\n   not reach patent, and retain the literal entry status, legal description, land office and any\n   entry/file number. Queue a\n   corresponding case series only when that locator and the actual holdings support it,\n   keeping requested and retrieved files separate. The [historical tract-book example](https://www.youtube.com/watch?v=fEuF00FwZN8)\n   motivates this fallback. A patent-search miss does not establish that no application existed\n   or that its file survives; the historical entry status and present retrieval status remain\n   distinct. [S17]\n4. When the packet is available, compare its identifiers with the patent lead and inventory\n   the actual jacket and component documents against the entry-class targets below. Inspect\n   certificate and assignment reverses where present. Retain each component actually present,\n   including affidavits, with its individual locator, and record the requested and retrieved\n   extent; do not assume a fixed page count or a complete packet from the presence of a\n   certificate. [S11]\n5. In bounty-land papers, keep the named veteran, heir and assignee as separate rows of the\n   party-role table in U.S. federal land entry files. An assignee is not thereby the veteran or\n   a resident of the parcel. In homestead papers, keep the reported settlement, application, filing,\n   improvements, testimony and patent dates distinct. Attribute claimant and witness\n   statements to their actual documents; route conflicts and identity questions to the\n   evidence/proof workflow. [S11]","sources":["S10","S11","S12","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7c7ea1ffb7c2","kind":"unclassified","anchor":"The [land-file examples](https://www.danaleeds.com/nara-land-records-discovering-family-history-details-that-arent-online/)\nmotivate these inspection targets, not a universal contents list or eligibility rule.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c41033e3885d","kind":"historical","anchor":"For North Carolina deeds from 1784 to about 1867, The Legal Genealogist expects formal dower relinquishments to be mostly absent, because dower then reached only land the husband owned at his death; do not read a deed without one as showing that the seller was unmarried or widowed. [S39] North Carolina case law confirms that limit on dower and says an 1867 act extended dower to land held during the marriage unless the wife joined the deed with privy examination. [S40] The 1784 starting date was not independently verified, and no independent source confirmed how often relinquishments actually appear in these deeds, so treat their absence as a lead only. [S39]","sources":["S39","S40"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f6b3593e0c43","kind":"method","anchor":"When grantor and grantee indexes show no deed for someone who, according to other records, held land that must later have passed to another, read the surviving deed books page by page for the relevant years if they can be reviewed. [S41], [S42] This prevents a careful index search, even one covering spelling variants, from becoming a conclusion that the person never sold or recorded a deed. [S43] The Legal Genealogist's Winston County, Mississippi, example motivates this general practice; its index and deeds were not independently verified. [S43]","sources":["S41","S42","S43"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1f6e65d16f68","kind":"method","anchor":"Do not screen deed-index entries down to land sales. A county's deed books may also hold\nmortgages, leases, powers of attorney, sales and manumissions of enslaved people, bills of sale,\nindentures and apprentice papers, adoptions, livestock brands, wills and tax lists [S44].\nRetrieve every entry under the target name whatever its instrument type. Expect heirs among the\nparties too: brothers and sisters may all sign one deed giving up their claim to property from\ntheir parents [S44], and a guide to tracing formerly enslaved families reports finding a 1910\ndeed that divided a man's land among his heirs [S45].","sources":["S44","S45"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2d35e50ad92c","kind":"method","anchor":"For a miner or a mining-claim lead, start with the county recorder's mining-claim records for the\nplace the ancestor mined, then their filmed or archived copies, rather than relying on federal\nland-patent searches [S46]. Carry each claim's location into maps and land records, and read any\nminer registration for age, nationality and next of kin [S46].","sources":["S46"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cce84f7c3f82","kind":"portal-availability","anchor":"Calaveras County, California, shows where such books can be found: the FamilySearch Research Wiki\nlists its \"Mining and Land Claims 1852-1931, and Indexes 1850-1892\" with images among the county's\nland records [S47 @2026-11-12], and the Calaveras Heritage Council describes the county archives in\nSan Andreas as holding mining claims with deeds and other county records [S48 @2026-11-12].","sources":["S47","S48"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b8d9e2a36dec","kind":"portal-availability","anchor":"For a house or farm lead in Upper or Lower Austria, look the house up in a regional house-history\ndatabase before choosing land books: such map layers and cadastre-based sites give farm or house\nnames, owners and manorial lords [S49 @2026-11-12]. Carry the named manorial lord (*Grundherrschaft*) into the\nsearch for that lordship's land and transfer records as a lead, as for Bavarian farms above, and\nverify each owner and date in those books.","sources":["S49"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6fb33367c15e","kind":"portal-availability","anchor":"In Upper Austria, open the DORIS theme \"Hofnamen und Häusergeschichte\". It places the houses and\nfarms that existed around 1830 on the Urmappe and gives each one's farm names, owner and\n*Grundherrschaft*, taken from the Theresian Gültbuch of 1750, the Josephinian Lagebuch of 1786–88\nand the Old Grundbuch of 1790–93 [S50 @2026-11-12]; it held about 100,000 houses and farms when\nlaunched in 2022 [S51 @2026-11-12]. It is an ongoing project: the Hausruckviertel data are\nincomplete, and houses in Linz, Wels, Schärding, Braunau, Ried and Markt Obernberg are not yet\nincluded, so do not read a missing house as an absence [S50 @2026-11-12]. For Lower Austria, use\nWolfgang Zehetner's \"Haus und Hof\" at the ÖFR for house owners around 1787 (Josephinian Fassion)\nand 1820 (Franciscan cadastre), historical house names and pointers to manorial records. It covers\nLower Austria only, with communities added over time, not all of Austria [S52 @2026-11-12].","sources":["S50","S51","S52"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-36e89550b1b9","kind":"method","anchor":"Before you name a farm heir or look for a sibling's share, find out whether the place passed farms\nundivided or divided them. Under *Anerbenrecht* one heir took the whole farm and the others were\npaid off well below its value; by area the heir was the eldest or the youngest son, and the\nyoungest-son custom held, for example, in Ravensberg and the Wesermarsch [S53], [S54]. Do not\nassume the eldest son: in Belm near Osnabrück, where at least two sons were living, the youngest took\nover a large farm in about three of four cases, and small farms did not follow the custom [S55].\nLook for the non-heirs elsewhere: in an Emsland account, sons who did not inherit sought a bride\nwho held a farm, often taking the farm's name, or became craftsmen, farm servants or *Heuerleute*\n[S53]. In divided-inheritance (*Realteilung*) areas, which the Münster lecture lists as including\nWürttemberg, Baden, Hesse, the Rhineland, southern Westphalia and Lower Franconia, expect the land\nto be split among all the heirs [S55]. The same lecture calls this contrast schematic, so let the\nlocal transfer records decide [S55].","sources":["S53","S54","S55"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
