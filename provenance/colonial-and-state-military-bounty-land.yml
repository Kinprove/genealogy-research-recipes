  - {"id":"C-authority","kind":"method","anchor":"According to the presenter, check the authority and period before identifying a military tract on a map [S1†]. Copy the authority from the warrant or grant. Use that authority to decide whether to follow a colony, state or federal series. NARA microfilm M829 contains federal Revolutionary War warrants [S3].","sources":["S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-kentucky","kind":"custody","anchor":"According to the presenter, search Kentucky for a Virginia Revolutionary War military tract [S1† @2026-11-20]. Use the Kentucky Land Office warrant index by veteran, warrant number or immediate assignee. Follow the authorized patent references separately and distinguish the person awarded the warrant from the eventual patentee [S4 @2026-11-20].","sources":["S1","S4"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-pennsylvania","kind":"custody","anchor":"According to the presenter, search Pennsylvania under the label *Donation Land* [S1† @2026-11-20]. Use the Pennsylvania State Archives’ guide to find the Pennsylvania Line entitlement return and follow the named soldier into the land records. Keep Donation Land distinct from other military compensation [S5 @2026-11-20].","sources":["S1","S5"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-narragansett","kind":"method","anchor":"According to the presenter, look for group petitions or grants and distinguish a Narragansett settler from the soldier whose service qualified the claimant [S2†]. For a Narragansett township associated with King Philip’s War, record the original qualifying veteran or heir, the proprietor and any later settler as separate roles. Trace any assignment or inheritance before attributing service [S6].","sources":["S2","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-dual-search","kind":"custody","anchor":"According to the presenter, check federal patents and state awards separately for the same veteran [S8† @2026-11-21]. Search the Bureau of Land Management’s General Land Office index for completed federal entries and use the federal warrant series when a patent search is empty [S11 @2026-11-21]. For state awards, use Lloyd Dewitt Bockstruck’s *Revolutionary War Bounty Land Grants: Awarded by State Governments* as a finding aid [S7 @2026-11-21] [S12 @2026-11-21].","sources":["S8","S11","S7","S12"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-cession","kind":"method","anchor":"Run the federal search if the state award is missing and the service could qualify under federal rules [S7] [S3]. Check the terms of a cession before switching issuing authorities. Virginia reserved land in what is now Ohio for its own Revolutionary War veterans [S13].","sources":["S7","S3","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rank","kind":"historical","anchor":"For a bounty under the Continental Congress’s resolution of 16 September 1776, compare the warrant acreage with the schedule for the soldier’s documented rank [S7] [S3]. Confirm the issuing program before using acreage to infer rank.","sources":["S7","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pennsylvania-tract","kind":"custody","anchor":"According to the presenter, search the Pennsylvania Donation Lands separately [S8† @2026-11-21]. Use the surname index in the Pennsylvania State Archives’ *Donation Land Register* (RG 17, series 17.174) to identify the lot and district, then follow them to the tract and patent listings [S21 @2026-11-21].","sources":["S8","S21"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-massachusetts-maine","kind":"custody","anchor":"For a Massachusetts Revolutionary War award in the District of Maine, check the Massachusetts resolve of 5 March 1801 [S7 @2026-11-21] [S14 @2026-11-21]. Search FamilySearch’s *Massachusetts, Revolutionary War Bounty Land Applications, 1805–1845* by applicant [S15 @2026-11-21].","sources":["S7","S14","S15"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-north-carolina-tennessee","kind":"custody","anchor":"According to the presenter, look for the land from a North Carolina Revolutionary War warrant in present-day Tennessee [S8† @2026-11-21]. Follow the North Carolina military warrant into the grant books described by the Tennessee State Library and Archives. Keep the warrant number distinct from the grant number [S7 @2026-11-21] [S16 @2026-11-21].","sources":["S8","S7","S16"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-maryland-western-lots","kind":"custody","anchor":"According to the presenter, look in western Maryland for the state’s Revolutionary War bounty tracts [S8† @2026-11-21]. Find the soldier and lot number in *Bounty Land Soldiers* (MSA S162), then follow that number in *Lots Westward of Fort Cumberland* (SE1-1) [S18 @2026-11-21].","sources":["S8","S18"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-georgia-certificate","kind":"historical","anchor":"According to the presenter, check Georgia’s eligibility rules before inferring service from a grant [S8†]. Trace the grant to the bounty certificate to establish the basis of the claim. Georgia’s 1781 act allowed qualifying civilians to receive a bounty without military service [S19]. Include Georgia bounty grants in the search for a documented deserter from the British forces [S7] [S20].","sources":["S8","S19","S7","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-virginia-ohio","kind":"custody","anchor":"For an Ohio tract based on a Virginia award, trace the warrant in the Virginia Military District entry and survey books in federal Record Group 49. Check the separate warrantee and patentee indexes and carry the Virginia issuer through to the patent [S7 @2026-11-21] [S17 @2026-11-21].","sources":["S7","S17"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-virginia-clark","kind":"historical","anchor":"According to the presenter, identify the unit before choosing Virginia’s award provisions [S8†]. For general Virginia state or Continental service, start with the 1779 Virginia act [S22]. For George Rogers Clark’s Illinois Regiment, check Virginia’s 1781 resolution and 1783 act, then trace the allotment in the plat of Clark’s Grant in present-day Indiana [S23].","sources":["S8","S22","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-virginia-wilson","kind":"custody","anchor":"According to the presenter, look up Virginia soldiers and sailors in Samuel Mackay Wilson’s *Catalogue of Revolutionary Soldiers and Sailors of the Commonwealth of Virginia* [S8† @2026-11-21]. Follow a positive result to the Library of Virginia’s *Bounty Warrants* files [S12 @2026-11-21] [S22 @2026-11-21].","sources":["S8","S12","S22"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-virginia-rejected","kind":"custody","anchor":"According to the presenter, check William Lindsay Hopkins’s *Virginia Revolutionary War Land Grant Claims, 1783–1850 (Rejected)* if the expected award is missing [S8† @2026-11-21]. Follow the claim to the Virginia Governor’s Office *Rejected Claims* (accession 41986) and record the disposition separately from the service evidence in the file [S12 @2026-11-21] [S22 @2026-11-21].","sources":["S8","S12","S22"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-virginia-scrip","kind":"custody","anchor":"According to the presenter, look up 1852 Virginia warrant exchanges in Margie Brown’s *Genealogical Abstracts, Revolutionary War Veterans, Scrip Act 1852* [S8† @2026-11-21] [S12 @2026-11-21]. If a Virginia warrant remained wholly or partly unsatisfied, trace any exchange under the 1852 act into the federal scrip application and surrendered warrant at the National Archives. Keep the Virginia warrant and the federal scrip as separate records [S24 @2026-11-21] [S22 @2026-11-21].","sources":["S8","S12","S24","S22"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-town-history","kind":"method","anchor":"For a colonial New England town, start with its town history to identify the original grant name, granting colony and any service named in the settlement account. Use those clues to find the petition or grant, as with Suncook, also called Lovewell’s Town, in present-day Pembroke, New Hampshire [S7] [S9].","sources":["S7","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-short-expedition","kind":"historical","anchor":"Keep a soldier who served on a single expedition in the colonial grant search when the grant names that expedition, as Massachusetts’s 1728 Suncook grant did for Lovewell’s Pigwacket company and the legal representatives of deceased men [S7] [S10].","sources":["S7","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bounty-recipient","kind":"method","anchor":"According to the presenter, identify the veteran, the person who claimed the bounty and the eventual patentee separately [S29†]. Check whether the issuing program allowed a widow or other heir to claim, then look for the proof of relationship in the application or patent papers [S30] [S31].","sources":["S29","S30","S31"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bounty-assignment","kind":"method","anchor":"According to the presenter, check for assignments before using a bounty tract to place the veteran [S29†]. Follow transfers on the back of the warrant or survey to the final assignee. Establish the veteran’s residence from a record that places the veteran there [S30].","sources":["S29","S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-state-procedures","kind":"method","anchor":"According to the presenters, read the introduction to Bockstruck’s compilation for the state’s award procedures before interpreting a name search [S35†] [S36†] [S37]. Use the state’s procedure to choose the next record in the award trail.","sources":["S35","S36","S37"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-maine-film","kind":"platform-ui","anchor":"According to the presenter, use a statewide Maine search to follow a compiled bounty entry to the underlying record [S32† @2026-11-22]. Find the Maine Land Office’s *Revolutionary War Veterans Land Records*, filmed in 1954 as films 010249–010260 [S33 @2026-11-22]. Search the FamilySearch Catalog by film number without the leading zero and use the format icon on the matching entry to check access to the images [S34 @2026-11-22].","sources":["S32","S33","S34"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-maine-online-applications","kind":"portal-availability","anchor":"According to the presenter, check Maine’s archives for the underlying records when the film is hard to access [S32† @2026-11-22]. For Maine’s state program in the 1830s, check the Maine Land Office group in Digital Maine for registers, applications and certificates. For application images dated 1835–1838, also check FamilySearch’s separate Maine collection and read the full applicant folder [S52 @2026-11-22] [S53 @2026-11-22].","sources":["S32","S52","S53"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-maine-residence","kind":"historical","anchor":"According to the presenter, keep Maine’s later state award in scope when the veteran served outside Maine [S36†]. For the 17 March 1835 resolve, check residence in Massachusetts proper or the District of Maine at enlistment, Maine residence at the time of the resolve, the qualifying Revolutionary service and any earlier Massachusetts bounty. Check the separate terms for widows [S14].","sources":["S36","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-nc-enlisted","kind":"historical","anchor":"According to the presenter, check the state award rules against North Carolina service and follow a separate Georgia lead where the veteran settled there [S36†]. Keep enlisted soldiers in the North Carolina state search when they served in the North Carolina Continental Line. Use the state rank schedule, which includes privates and noncommissioned officers [S41].","sources":["S36","S41"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-md-eligibility","kind":"historical","anchor":"According to the presenter, check for qualifying Maryland Line service before expecting a Maryland state bounty lot [S42†]. Compare the enlistment and service to Maryland’s October 1777 provision for Continental soldiers. A gap in the bounty rolls leaves Maryland militia service open [S43].","sources":["S42","S43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-md-finding-aid","kind":"portal-availability","anchor":"According to the presenter, look up a Maryland state award in Bockstruck’s Maryland coverage [S42† @2026-11-22] [S28 @2026-11-22]. Search the print compilation or Ancestry’s *Revolutionary War Bounty Land Grants*, then follow the lead into the state’s lot records [S44 @2026-11-22].","sources":["S42","S28","S44"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-georgia-refugee","kind":"historical","anchor":"According to the presenters, keep Georgia bounty land in scope when a Revolutionary War veteran served in another state’s unit [S40†] [S36†]. For Georgia’s refugee category, check Georgia residence and enlistment in the other state’s unit against the certificate. Establish the applicable category before using a later move to Georgia as a search lead [S19].","sources":["S40","S36","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-georgia-rank","kind":"historical","anchor":"According to the presenter, use Georgia military bounty acreage as a clue to rank [S40†]. Identify the award class and the acreage schedule first. Georgia’s private-soldier allowance was 250 acres before the 25 February 1784 increase and 287½ acres under the increased schedule. Check the rank against the service evidence [S19].","sources":["S40","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-sc-bounty","kind":"custody","anchor":"According to the presenter, check the state bounty awards for a South Carolina tract [S36† @2026-11-22]. Look up the claimant in Tony Draine and John Skinner’s *Revolutionary War Bounty Land Grants in South Carolina*. Use the resulting name and place to search the state plat books in the South Carolina Department of Archives and History’s Online Records Index [S38 @2026-11-22] [S39 @2026-11-22].","sources":["S36","S38","S39"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-virginia-ohio-patent","kind":"custody","anchor":"According to the presenter, use Clifford Neil Smith’s *Federal Land Series*, volume 4, parts 1 and 2, for the Ohio Virginia Military District [S25† @2026-11-22]. Record the federal patent and its underlying Virginia warrant separately. Use Smith to recover the survey number and warrant number when the patent search stalls [S26 @2026-11-22].","sources":["S25","S26"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-clark-compilation","kind":"method","anchor":"According to the presenter, check both the Virginia and Illinois Regiment coverage when using Bockstruck for a Virginia lead [S27†]. For Clark’s Illinois Regiment, check the separately listed Virginia-Indiana coverage as well as Virginia and follow the lead to the original allotment [S28] [S23].","sources":["S27","S28","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-va-recorded-grant","kind":"portal-availability","anchor":"According to the presenter, look for a Virginia Land Office grant image when the lead identifies a Virginia grant [S36† @2026-11-22]. Search the Library of Virginia’s *Virginia Land Patents and Grants* for the recorded grant, including Kentucky grants recorded by Virginia before Kentucky statehood in 1792 [S46 @2026-11-22] [S22 @2026-11-22].","sources":["S36","S46","S22"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1852-scrip-eligibility","kind":"historical","anchor":"According to the presenter, use documented service to choose the 1852 scrip route [S36†]. Check section 1 of the 31 August 1852 act for a Virginia military warrant issued or allowed before 1 March 1852 that remained wholly or partly unsatisfied. Match the service to the Virginia State or Continental lines in the Revolutionary Army or Navy [S24].","sources":["S36","S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1852-scrip-proof","kind":"custody","anchor":"According to the presenter, use Brown’s abstract to find the original proof papers and recover the full text of any will it excerpts [S45† @2026-11-22]. Find the original application in *Applications for Military Bounty Land Scrip*, federal Record Group 49, with its warrant and supporting papers [S3 @2026-11-22] [S22 @2026-11-22].","sources":["S45","S3","S22"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1852-scrip-owners","kind":"method","anchor":"According to the presenter, look for court papers and wills in the application and follow each documented link from the veteran through the heirs [S45†]. Identify the veteran and the proprietor of each share separately. Check the supporting proofs for inheritance or transfer and reconcile the scrip amount against the unsatisfied acreage and each proprietor’s share [S24].","sources":["S45","S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1852-scrip-placement","kind":"historical","anchor":"According to the presenter, extend a Virginia scrip search beyond the Ohio military district [S45†]. Follow the scrip holder or assignee into federal land that was open to private entry under the 1852 act [S24].","sources":["S45","S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-proclamation-schedule","kind":"historical","anchor":"According to the presenter, compare a French and Indian War bounty to the rank schedule in the proclamation of 7 October 1763 [S47†]. For qualifying claimants, the schedule specifies 50 acres for a private, 200 for a noncommissioned officer, 2,000 for a subaltern or staff officer, 3,000 for a captain and 5,000 for a field officer. Verify the authority before treating acreage as a rank clue [S48].","sources":["S47","S48"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-taylor-calendar","kind":"method","anchor":"According to the presenter, search Philip Fall Taylor’s *A Calendar of the Warrants for Land in Kentucky, Granted for Service in the French and Indian War* by warrant recipient or assignee [S47†] [S49]. In the combined *Kentucky Land Warrants for the French, Indian, and Revolutionary Wars*, use Taylor’s portion for this search and Wilson’s for Revolutionary War warrants [S50].","sources":["S47","S49","S50"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-virginia-colonial-certificates","kind":"custody","anchor":"According to the presenter, start with the bounty land section of *The Virginia Land Office*, the Library of Virginia’s Research Notes Number 20 [S47† @2026-11-22]. For Virginia Regiment service, use the guide to follow county court proof of service into the Land Office’s filmed land certificates. Use the grant date and service period separately when records from the two wars overlap [S51 @2026-11-22].","sources":["S47","S51"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-additional-federal-warrant","kind":"historical","anchor":"According to the presenter, use earlier warrant acreage as a lead to additional bounty [S45†]. If an earlier federal warrant shows fewer than 160 acres, check for a later application for the balance under the act of 3 March 1855. Record the authorizing act, acreage and warrant number separately and verify eligibility under that act [S3] [S54].","sources":["S45","S3","S54"],"checked":null,"stated_as":"observation","review":"reviewed"}
