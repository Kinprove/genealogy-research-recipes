claims:
  - {"id":"C-59b26d84eafd","kind":"unclassified","anchor":"For a compiled genealogy or local history, inspect its preface/editorial notes for a named\ncontributor to the relevant family or section. Retain that attribution and locator, then assess\nthe contributor's possible knowledge of each statement rather than assigning every fact to\nthe editor. The [family-specific informant example](https://familylocket.com/rlp-185-revisiting-timelines-and-analysis-again/)\nmotivates this retrieval step; an older relative's contribution does not make the whole book\nfirsthand, reliable or independent.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dee5cf08c1cc","kind":"unclassified","anchor":"Before you rely on any entry in a compiled genealogy, read the work's apparatus: the family and\nlocality it covers, its numbering scheme, its inclusion criteria, its transcription conventions and\nany doubts the compiler admits. Keep hedges such as 'probably' attached and record those statements\nas speculation, separate from passages that cite wills, deeds or registers. Weigh each generation by\nwhether it lived in the author's own time. Do not treat a progenitor named in the title as\nidentified unless the text actually concludes who he was. List the records each statement cites as\nretrieval targets. Search later journal volumes and fraud discussions for reviews, rebuttals or\nrevisions. A tree birthplace written as 'of [place]' may be a residence entered as a presumed\nbirthplace. Read a same-name hit within its own family and place. Motivating examples:\n[books](https://www.youtube.com/watch?v=PYK389_glSI),\n[surname books](https://www.youtube.com/watch?v=QBLRdzk88po),\n[descendancy book](https://www.youtube.com/watch?v=lqYLQJICzDY),\n[family book](https://www.youtube.com/watch?v=lb58Xkl8czk),\n[journal chains](https://www.youtube.com/watch?v=iUHlYfkHtb8),\n[Horn Papers](https://www.youtube.com/watch?v=73Cnkvh3tmk),\n[compiled histories](https://www.youtube.com/watch?v=d7IaUGH2hPI),\n[Great Migration](https://www.youtube.com/watch?v=AG1TzZ79buQ),\n[preface](https://www.youtube.com/watch?v=cjzdXl19ewA),\n['of' places](https://www.youtube.com/watch?v=ZOBFGCHCKy8). The apparatus and any review guide how\nyou read a claim; neither verifies it. If no response to a work turns up, that neither confirms nor\nrefutes it.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6eb0d4e042ad","kind":"unclassified","anchor":"Treat an accepted lineage-society application, a patriot-database entry or a society's compiled\nstudy as a dated compiled conclusion, not as proof. Record its acceptance or edition date. Identify\nwhich child of the qualifying ancestor your line passes through. Examine the documentation cited for\neach generation, which may be hearsay, books or later copies, and assess it against current\nstandards. Look for the society's later flags, and for a later revision by the same author or body,\nthen retrieve what the revision relies on. Copied trees that repeat the earlier claim do not outweigh\na revision. Flag tree parents that go beyond a peer-reviewed study as unsupported, for example\nparents given for Mayflower passengers whose origins the study leaves unknown. Motivating\ndiscussions: [Geni](https://www.youtube.com/watch?v=e9DQLOq0x_o),\n[Mayflower applications](https://www.youtube.com/watch?v=UyinOYMxTOI),\n[DAR papers](https://www.youtube.com/watch?v=CcwF-SvHe5Y),\n[ranking review](https://www.youtube.com/watch?v=Zn1CxFAWFq0),\n[SAR](https://www.youtube.com/watch?v=uVlhnNVudY0),\n[colonial](https://www.youtube.com/watch?v=AG1TzZ79buQ),\n[DAR registrar](https://www.youtube.com/watch?v=CSB6bd-Agcs),\n[Mayflower study](https://www.youtube.com/watch?v=Uetstsga33c). An application without a flag is not\nthereby verified. These sources give no rate at which approvals are later revised.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d647b9e3ce2b","kind":"unclassified","anchor":"When a compiled book gives a relationship or event without an item citation, retain the exact\npassage and inspect its bibliography for the missing source. If the compiler cannot clarify\nit, use the book's named publisher or local historical society to prepare a bounded inquiry\nabout that statement and its underlying record. Obtain a record reference and inspect the\navailable item, distinguishing an image, transcription or later compilation; retain any gap\nto the original. Cite the book and recovered item separately before reassessing the claim.\nThe [Carding Jackson case](https://www.youtube.com/watch?v=UUcoAC0pd_g) follows this route from an\nuncited compiled parentage to a society's baptismal record; it does not establish that every\npublisher holds the source or that a retrieved web item is the archival original.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ad462eee117d","kind":"unclassified","anchor":"- **Trace a family tradition to its teller.** Record who first wrote or told the story, their generation, and whether they knew the subject or could have witnessed each episode. A first-person account may describe events from the writer's early childhood, or may have been written as fiction. Ask older relatives whether they heard the story and from whom. Flag a detail that recurs in unrelated families or contradicts the documented procedure. Motivating examples: [grandson's account](https://www.youtube.com/watch?v=qG2YD76a3gk), [novelized memoir](https://www.youtube.com/watch?v=CoxXz-C754c), [recent legend](https://www.youtube.com/watch?v=ekd8yqtdMUE), [shared motif](https://www.youtube.com/watch?v=V6PN8hTtv6c). A contemporaneous record may confirm the event but not the story's extra detail. If elders don't know the story, or the motif turns up elsewhere, the story is weaker but not disproved.\n- **Identity dossier / one-row-per-record descriptor table — and sort it BY descriptor.** Stop expanding the branch, then capture **every** descriptor per record in its own column — the Dewitt case used **40+ columns**: dates, places, occupations, spouses, children, neighbors, signatures, and behavioral **\"psychographics\"** (the case label \"Bad Barney\"). The core move is the **sort:** a distinct signature (or cluster of descriptors) surfaces separate people, a matching one unifies records a name alone couldn't — corroborated across the dossier, since a signature can be clerk-written or vary. Have the AI *build* the table; you *read the sort*. (Jan Joyce, RLP 399; From Chaos to Clarity)\n- **Make the dossier auditable.** Give the event date and the recording date separate columns. Log negative searches in the dossier beside the records found. Record whether the person signed or made a mark. Give each provisional grouping a working label, such as \"42-Acre Henry\", and write the reason for the grouping beside it. An age inferred from legal capacity, such as witnessing or signing a deed, is at most a lower bound on the age at that date, set under the age-threshold rule below; it is not an age. Sort on each descriptor alone, then on combinations, before you accept any grouping. (Source 185)\n- **Three-bucket identity triage.** Same-name+same-place / same-name+different-place / different-names — each needs a different separation tactic. **Parental sets** and the **FAN** network (Friends, Associates, Neighbors — Elizabeth Shown Mills' term) discriminate same-named people far better than name-spelling variants; for common names, keep candidates in **separate research projects** so records don't cross-contaminate. (Jan Joyce, RLP 399; One Man, Two Same-Named Wives; RLP 288; Seventeen Rules)\n- **Different names are a bucket to test, not a separator.** Records may give one father different given names, or list a man by a place-of-origin byname in one census and by a surname in another. Where peasant surnames were fixed late, one paternal line may appear under several surnames, hiding a shared ancestor and a cousin marriage. Before splitting or merging, compare what does not depend on the name: the wife's name and patronymic, the godparent and surety circle, the recruiting group or settlement, an associate listed beside him in both sources, and paternal lines rebuilt from patronymics and earlier listings. Keep each form verbatim. Motivating examples: [alternating given names](https://rodgersforum.borda.ru/?1-2-0-00001505-000-0-0-1775639167=), [byname and surname](https://rodgersforum.borda.ru/?1-2-0-00001620-000-0-0-1781866477=), [late surnames](https://rodgersforum.borda.ru/?1-25-0-00000220-000-0-0-1573821172=). None explains why the names differ or firmly dates surname fixation. A match remains a reconstruction, a name unique in one listing is unique only there, and a shared surname proves no kinship.\n- **Measure the namesake pool before attributing.** Run staged searches in a large index: surname, then given name within a date window, then locality. For a couple, search the surname with both parents' given names across the whole childbearing window and the index's full jurisdiction. Record each count with its collection, scope and search date, and list every candidate or couple returned. Attribute a record only when one candidate fits. Read each attached child's own source, and flag a different parent name or parish for investigation; detach a child only when correlated evidence establishes a different family. In a small community, extract every resident to see how much names and ages normally drift, then link people by recurring spouse and child combinations. Motivating examples: [mixed wives](https://www.youtube.com/watch?v=_ij26t85WY8), [Pryor](https://www.youtube.com/watch?v=Tii0ig0_FuM), [Talbot](https://www.youtube.com/watch?v=19dWr--gyB4), [Findmypast counts](https://www.youtube.com/watch?v=3axBF8ZZJtI), [Beaumont](https://www.youtube.com/watch?v=5frrXOx0Y2E), [John Thomas](https://www.youtube.com/watch?v=7fhBUIK9qkA), [Irish index](https://www.youtube.com/watch?v=AS_MMnXesfg), [spreadsheet](https://www.youtube.com/watch?v=rA6aOQwct2o). Counts measure index entries, not people. A sole candidate is unique only within that index's coverage, a rare name implies no kinship, and uniqueness never proves parentage.\n- **Use house numbers as a household descriptor.** Where a parish register gives a bare number beside a place name, check whether it is a house number before matching same-named candidates. Compare the number in the marriage entry with the number in each candidate's baptism: a different house is a reason to doubt that candidate, and the same house is one descriptor among others. Follow the number, and any house or vulgo name, to find other household members. A [house-number reply](https://forum.ahnenforschung.net/forum/thread/2977841/) motivates this step. Houses could be renumbered or shared by several families, so a matching number does not prove kinship.\n- **Jr./Sr. separates namesakes; it does not prove descent.** In early records, Senior/Junior (or Elder/Younger) may only tell apart an older and a younger man of the same name in one place on that record's date. The two may be uncle and nephew, cousins or unrelated, and a Junior can become Senior when the elder dies. Record each suffix verbatim with its record date as one descriptor among others (for example a tax entry's land section). Before linking two 'Sr.' entries, work out who was alive and eldest at each date, and do not invent a missing counterpart. Keep other period terms verbatim too ('nephew', 'natural child', 'reputed father', ignotus, or 'orphan', which in one court usage meant fatherless) and check them in a dictionary from the record's period. Motivating discussions: [1](https://www.youtube.com/watch?v=8NPz1yDXe-A), [2](https://www.youtube.com/watch?v=vVWewJI3NgM), [3](https://www.youtube.com/watch?v=MDSb0XgbEJg), [4](https://www.youtube.com/watch?v=llK0cgm8Is0), [5](https://www.youtube.com/watch?v=7yVDky7MvO0), [6](https://www.youtube.com/watch?v=xOWgEolt7-g), [7](https://www.youtube.com/watch?v=y9LHaORmIUE), [8](https://www.youtube.com/watch?v=W3vjuk_Pcvk), [9](https://www.youtube.com/watch?v=YsYAGYqYxzg), [10](https://www.youtube.com/watch?v=DiqiKRy-YAs), [11](https://www.youtube.com/watch?v=6HOBIqyzNo4), [12](https://www.youtube.com/watch?v=Miqeo11X4LI). Any kinship needs its own evidence. None of these sources gives firm period or regional bounds or a frequency, and a dictionary gives possible meanings, not this writer's meaning.\n- **Eliminate same-name candidates only on positive evidence.** List every candidate with parents and residence. Eliminate a candidate only on sufficient correlated evidence; a matched burial before marriageable age, or an independently established concurrent marriage and children elsewhere, are examples, not an exhaustive list. A candidate with no later record, including no burial found, stays open under the negative-evidence gate. Do not exclude a candidate because of a changed wife, children or state (test remarriage and migration first). Do not exclude one over a later self-reported birthplace either: check for an early-childhood move or institutional removal. When you link a common-named person in a new place, search the former place for a namesake who stayed. If two first marriages cannot be told apart, the widow's later remarriage may name her father; then check the rejected candidate's profile for children it has absorbed. Motivating examples: [German parish](https://www.youtube.com/watch?v=g8pltErjQpU), [Lithuanian](https://www.youtube.com/watch?v=49kPDjLKLtg), [brick wall](https://www.youtube.com/watch?v=1pVpwjsp7l4) (also [brick wall, second video](https://www.youtube.com/watch?v=33NcRbkm-eQ)), [Brady](https://www.youtube.com/watch?v=8rMB2nCIZz8), [Hamp](https://www.youtube.com/watch?v=L_69HP2yP3s), [Parkinson](https://www.youtube.com/watch?v=sxEZVAooC58), [Parkinson 2023](https://www.youtube.com/watch?v=M-gAadppRAY). The candidate who survives is a hypothesis that still needs independent linking evidence, not the proven ancestor.\n- **Calibrate a register's stated ages before choosing a candidate by age.** When an age at death is the deciding clue among same-name baptism candidates, take other burial entries by the same recorder whose baptisms you can find. Compare stated with actual ages, and record the error pattern for that register and period instead of applying a generic tolerance. A [German register discussion](https://forum.ahnenforschung.net/forum/thread/215886/) motivates this step. The error sizes it reports are individual experiences, not norms. An accurate recorder narrows the window, but it does not identify the person, and the other candidates stay open under the elimination rule above.\n- **Test a same-named man's marriage series for consistency.** Tabulate every marriage attributed to him with the marital status the register gives (bachelor, widower), his stated age, the witnesses, and the death of each previous wife. A bachelor status after an earlier marriage, or ages that do not progress, flags a possible second man; a widower status needs a matching death of the previous wife, which may be entered under her married surname. Take parents and origin from whichever entry states them (in the example, only the first marriage gave the parents). The [marriage-series comparison](https://forum.ahnenforschung.net/forum/thread/3014148/) leaves one marriage unassigned: an inconsistency is a conflict to investigate, not a separator.\n- **When two people carry one birth identity, test each claimant against the records.** If marriage entries for two different women give the same name, birth date, parents and birthplace, first list every child of that surname in the origin parish's baptisms for the surrounding years, with parents, so twins or a same-named relative are tested rather than assumed. Then, for each claimant, take from her children's baptisms the mother's stated age and birth order, any sponsors from her natal family, and names echoing her natal siblings. A [duplicated-identity discussion](https://forum.ahnenforschung.net/forum/thread/3014856/) shows these checks. There the sponsor test was negative for both families and the age gap was small, so neither woman was identified. Weak or absent signals leave both claimants open.\n- **Reality-check filters on any merged or proposed-merge timeline.** A genuine biological/chronological impossibility (childbearing window, a birth more than about ten months after the father's death) **blocks the merge**; a posthumous birth within about ten months of his death does not. Softer anomalies (a duplicate census enumeration, spouses/children that appear then vanish) are **conflicts to investigate** — resolve them, don't merge over them, but don't treat them as automatic separators either. On a collaborative tree, read the **change log bottom-up** to recover the profile's *original intended identity* before untangling. (Kathryn Grant, Same Name Trap & Recognizing Problems; New Merge Experience)\n- **Screen a compiled child list for two merged couples.** Look for these signs: an unexplained multi-year gap or an over-long childbearing span; children overlapping under two different spouses; two differently named children born in one year; more attached children than a census child count reports (confirm the field's definition first); grandparents that differ. To split the families, use marriages near each first birth, occupations in the baptism entries, census households, and the exact form of each parent's name that the clerk wrote (Johann vs Johannes). Test each child separately against the father's will (allowing for children who died before it), the siblings' baptism places and the birth spacing. Detach a child only when several independent signals agree, and write the reasons down. Motivating examples: [Makins](https://www.youtube.com/watch?v=p-ImaWJYGMA), [same-name class](https://www.youtube.com/watch?v=D-PJUgIDY-M), [later version](https://www.youtube.com/watch?v=dlFJ4BKQyOg), [merge review](https://www.youtube.com/watch?v=HMoPsznHP1g), [Sutton](https://www.youtube.com/watch?v=jfWVACjBbbM), [20 children](https://www.youtube.com/watch?v=GbTECnZXn88). Each sign is a conflict to investigate, not a separator: gaps, omissions and census answers can have innocent explanations. Children you cannot assign stay uncertain.\n- **Check a stated parent's household roster.** When a record names someone as the child of a named father, test the claim against an enumeration of that father's household that lists daughters as well as sons. A child of the expected age who is missing, together with other gaps (a mother outside the childbearing window, sponsors or relatives who never appear in that family), suggests a same-named father. The [revision-list check](https://rodgersforum.borda.ru/?1-2-0-00001487-000-0-0-1776019117=) shows this combination. Absence alone counts only under the negative-evidence gate: the child may have lived elsewhere or been missed.\n- **Geographic reality check.** Map every event place attached to one identity or family, and trace each place to the record that supplied it: a place taken from a child's record does not put the parent there. Confirm whether each date is a birth or a christening. Then ask whether the mother could plausibly have been present at each birth, given the distance and travel in that period, and flag baptisms that alternate between distant communities. Use a dated boundary source or gazetteer to check whether each place existed then, whether one place lay inside another, whether a county label changed, and how many places shared the name. An event placed somewhere that did not yet exist, or a stated age that conflicts with when the birthplace existed, is unlocated or in conflict; do not quietly modernise it. Motivating examples: [Sanderson](https://www.youtube.com/watch?v=gssWfSl8JwY), [Morgan](https://www.youtube.com/watch?v=oNYa_u3v_c8), [Sutton](https://www.youtube.com/watch?v=Tii0ig0_FuM), [non-event](https://www.youtube.com/watch?v=9YdOl_wgvb4), [mother present](https://www.youtube.com/watch?v=aSwzD902OUE), [English](https://www.youtube.com/watch?v=yLKR7PCqFrc) and [Irish](https://www.youtube.com/watch?v=YWpZYZVqHfw) jurisdictions, [Stepney](https://www.youtube.com/watch?v=NCIZoX2VV04), [Kent](https://www.youtube.com/watch?v=19dWr--gyB4), [hint cluster](https://www.youtube.com/watch?v=3-op5VOfN0M), [places first](https://www.youtube.com/watch?v=cxdv-_iOfH4), [distance](https://www.youtube.com/watch?v=bHpQnoG9PS0), [railroad](https://www.youtube.com/watch?v=eG5ZcWAjiLg), [settlement dates](https://www.youtube.com/watch?v=FDmZ8YGxldo), [alternating counties](https://www.youtube.com/watch?v=uzd9VGvE1yc), [Tipton](https://www.youtube.com/watch?v=3rpwjGBRnG0), [same-named towns](https://www.youtube.com/watch?v=BXde-Z4rocM). A spread, an anachronism or a clash is a conflict to investigate, not a separator. A tight cluster proves nothing, and the presenters' mileages and dates are not rules.\n- **Same-named siblings and apparent twins need a test, not a merge or a split.** Two baptisms with one given name to the same parents years apart may be a child who died and a later namesake. Read both originals, and search that parish's burials for the elder child before the later christening, with an age that fits. Parents in England and Wales often gave a dead infant's name to a later sibling (Sources 181, 182), so never merge or drop either entry until you have searched the burials between the two baptism dates and followed both children forward into confirmation, marriage and census records. Two entries close together may be a provisional baptism, noted in the margin, followed by a later one, not two children. One baptism date can cover children born on different dates. An unexpected index entry sharing the subject's birth date, place and mother's maiden name may have been copied from a neighbouring entry: get the certificate or a no-record statement. Motivating examples: [British Isles](https://www.youtube.com/watch?v=hEZSzJRVXYE), [Scottish](https://www.youtube.com/watch?v=tlfJga5MZ_M), [necessity baptism](https://www.youtube.com/watch?v=_YP7JKXjthk), [Blackburn](https://www.youtube.com/watch?v=e3wVkWt581Y), [Welsh](https://www.youtube.com/watch?v=BAoVsb8RzSQ), [shared baptism](https://www.youtube.com/watch?v=Z-4MobTXiuw), [phantom entry](https://www.youtube.com/watch?v=D3EnR_-ZUhA). Neither a reused name nor a baptism 'of necessity' proves a death. A missing burial counts only under the negative-evidence gate, and marginal practice varied by parish.\n- **Test a one-off name in a series before creating a person.** When one entry gives a known man a different given name, patronymic or spouse, lay his household out across consecutive confession lists, revision lists and parish entries, comparing names and ages year by year. A name that breaks an otherwise continuous series, such as a son listed under a brother's name while that brother heads his own household, is a probable scribal substitution: annotate it beside the verbatim entry rather than correcting it. Before calling it an error, search the nearest revision list for a second same-named man of that generation. Motivating examples: [confession-list series](https://rodgersforum.borda.ru/?1-2-0-00001893-000-0-0-1781670413=), [conflicting baptism entry](https://rodgersforum.borda.ru/?1-2-0-00000862-000-0-0-1778497763=). Your emendation is an inference; a lone entry stays a conflict until the series or namesake search settles it.\n- **Conflict resolution by reliability, not by vote.** Judge each **statement** by its informant's basis of knowledge (a death certificate's informant usually knew the death firsthand but the birth secondhand — classify the statement, not the record), weight by informant proximity, count only **independent** information streams (copies aren't corroboration), correct for document conventions (a standard-form bond signed by a parent doesn't prove minority), and **explain the conflict's cause before choosing a value.** (Power of Proof; Ann Tanner; Slagle)\n- **Test independence before counting agreement.** Open any cited website or database page before counting it. Shared distinctive errors, shared placeholder entries, content matching the Family Tree, or a common descendancy book all mark one copied lineage: record it as one derivative claim and verify it against the original records. Agreement between Ancestral File or Pedigree Resource File and a Tree profile is not corroboration; per the presenter's account, their data were loaded into the Tree. Records that all agree on a father but were each supplied by the subject are one stream as well. Consider a stepparent, and test that by searching for the mother's remarriage and the siblings' or church records. Motivating examples: [shared mistakes](https://www.youtube.com/watch?v=-AqGC6qa2rU), [Bryant book](https://www.youtube.com/watch?v=9Q4qYeK5DTg), [MyHeritage citation](https://www.youtube.com/watch?v=2yVk3RoVGcA), [smart-match artefacts](https://www.youtube.com/watch?v=3-op5VOfN0M), [file history](https://www.youtube.com/watch?v=7KAPMSXHu9M), [stepfather case](https://www.youtube.com/watch?v=dY9EV5R_6ZA). Shared artefacts suggest copying, but they do not identify the original or the direction of copying. Trees without shared errors are not thereby independent. Judge dependence for each field, not for each institution: a field that a later document copied from a paper presented to the issuing office shares that paper's chain, however different the offices are. A birth date on a Soviet passport, military card or work record taken from a metrical extract or an earlier passport is one example; the later document's own event information is assessed separately. A shared parish, archive or clerk does not by itself make two records dependent, and different offices or forms do not guarantee independence. Where a field's origin is unknown, claim no extra independent chain.\n- **Grade a family, memorial or tree page item by item.** The page's narrative and dates are the page author's family testimony. A posted scan of a document is an image of that document, with \"family archive, as published on the site\" as its provenance: weigh it as that document and seek the original. If the page only retells a document you already hold, the two are one stream.\n- **Compare list order across accounts of one event.** When a later account, such as an elderly informant's interview printed in a county history, lists participants, compare its order with every earlier published history of that event. If the names follow the same sequence, the informant or the editor may have taken them from the earlier book, or both may share a common source. Treat the two lists as one stream until the later list's firsthand basis is shown. A matching order suggests copying but does not prove it, since short lists or lists in rank order can coincide. The rest of the account may still be firsthand: grade it statement by statement. (Source 186)\n- **Negative-evidence gate.** A negative finding carries weight only when the source system and circumstances create a **justified expectation** that the missing information would appear — after ruling out record loss, incomplete coverage, and indexing error, and confirming the record **should** exist. Multiple failed searches alone never convert it (that is just vote-counting). **Log every search's date** — online coverage changes over time. (RLP 409; Writing Up Negative Findings)\n- **An archive's 'no records' reply is someone else's search result.** Log it with its date, the issuing body and the years, record types and churches it covered. Separate parishes searched without result from any whose registers the reply says never reached the archive, and work out which parish actually served the village. Then check the fund inventory and any filmed copies yourself, and ask where a second copy of the register was kept: a volume may combine births and deaths over several years, or survive for only one event type in a year. Motivating examples: [negative certificate](https://forum.j-roots.info/viewtopic.php?f=20&t=5084), [unreceived parish books](https://rodgersforum.borda.ru/?1-2-0-00000636-000-0-0-1779081499=). Until coverage is verified, the reply does not meet the negative-evidence gate. 'Not received' does not show the books were destroyed, and a volume the inventory lists does not prove the entry you need survives.\n- **A missing marriage record proves neither no marriage nor a marriage.** Before inferring illegitimacy or a legal marriage, establish from a dated legal authority whether the jurisdiction recognised informal marriage at that place and time. Gather holding-out evidence: census marital status, children, land or probate records naming the wife, and any court ruling. When children and long co-residence have no marriage record, keep 'never legally married' as a live alternative. Do not read the woman's surname as either her married or her maiden name, because it may come from an earlier marriage. Test the alternatives with Bible entries, relatives' wills, estate and court records, and presentments (read the outcome too, since an indictment is only an allegation). Motivating examples: [common-law talk](https://www.youtube.com/watch?v=8IyZ2AdcCCo), [Talbott](https://www.youtube.com/watch?v=CgcnOlNO9bA). A census 'married' does not prove a legal marriage, the gate above still applies to the absent entry, and present-day recognition is not historical law.\n- **Indirect-evidence discipline.** Never let \"a record mentions X\" stand in for \"a record proves the relationship.\" An indirect conclusion must be **written as an explicit correlation argument** chaining the clues, not asserted. (Wrong Until Proven Right; RLP 409; Lesson 5)\n- **A stated status is a statement, not an event.** A census 'widowed' neither proves nor dates a spouse's death: divorce, desertion or separation can lie behind it. Likewise, 'married' does not show that an absent husband was alive. Before recording a death, look for the spouse alive or remarried later, and for death, burial or probate evidence. Where family lore says a spouse vanished, search court calendars and newspaper notices for a divorce, linking them by case number. A licence's 'single and unmarried' gives the status on that date, not 'never married'. A guardianship does not show that both parents were dead (the guardian may be the mother). An orphanage listing does not show orphanhood or adoption: trace the children back to earlier censuses and follow each parent forward. Motivating examples: [time grid](https://www.youtube.com/watch?v=8kc1qA0IKBo), [Wellborne](https://www.youtube.com/watch?v=X4MD-Bitis8), [grass widow](https://www.youtube.com/watch?v=jeshnSv9xQ0), [1900 case](https://www.youtube.com/watch?v=YPKGBX2zZOs), [Holtz](https://www.youtube.com/watch?v=ZbTw-Ba4tBs), [1880](https://www.youtube.com/watch?v=CjjD9mI_dY8), [divorce records](https://www.youtube.com/watch?v=9XPYpWcaU1o), [marriage affidavit](https://www.youtube.com/watch?v=7iLTGhthWKI), [probate](https://www.youtube.com/watch?v=PzZ4fwSbjq8), [orphanage](https://www.youtube.com/watch?v=z9IHEinKGzs). These are single cases. They set no frequency, they do not make every widow suspect, and guardianship rules depend on jurisdiction and period.\n- **A named father or legitimacy label is a registration decision, not a finding of paternity.** A baptism's father may be the mother's legal husband even when he had been absent for years (in the army, exiled, whereabouts unknown). Some registers marked a widow's child illegitimate with a note citing the husband's death entry by date and number: follow that reference and record the note as the clerk's reasoning. A participant reports that soldiers' wives' children were also often marked illegitimate while the husband was alive. List the mother's entries across neighbouring parishes in date order, with her exact status label, each child's legitimacy and the godparents. Then establish the husband's service, return and death, and search marriages for candidate fathers. Differing labels may reflect different priests. On an illegitimate entry, a sponsor described as the father's brother is an indirect clue to correlate. Motivating discussions: [absent husband](https://rodgersforum.borda.ru/?1-2-0-00001736-000-0-0-1775021161=), [legitimacy notes](https://rodgersforum.borda.ru/?1-0-0-00000221-000-0-0-1737654759=). These are participants' accounts without a cited legal rule. Practice varied by priest and parish, and no label, named father or sponsor establishes biological paternity.\n- **Alive-or-dead wording on a later entry is a dated statement too.** A 'deceased' qualifier on a bride's or groom's father says he died before that date, so search the death registers before it. Later entries that still give his rank or occupation without the qualifier do not prove he was alive, and the qualifier does not automatically outweigh them. Likewise, a periodically compiled household list may carry a person forward after a separate dated death record. Record the list's reference, date and the person's position (head or relative of the head), and ask whether that entry was updated or copied forward. First establish that the entries describe one person, and keep the conflict open until a death record or other evidence resolves it. Motivating examples: [deceased qualifier](https://rodgersforum.borda.ru/?1-2-0-00001487-000-0-0-1776019117=), [family list](https://forum.j-roots.info/viewtopic.php?f=4&t=4667). In the first, no death entry was found and a register year is missing; the second is a forum heuristic, not a rule for any list series.\n- **Date a household list from its contents, not its label.** A family list's catalogue or file year may not be the year its entries were written. Before reading a child's absence as death, marriage or omission, take the members whose birth dates are known from other records and add their stated ages to their birth years. Note which compilation window the ages imply. If that window falls before the missing child's birth, the absence says nothing. A [family-list dating example](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) motivates this step. The result depends on the stated ages and the independent birth dates, and it gives a window, not a date. Entries added at different times may imply different windows.\n- **Separation wording is not a divorce.** If a personal or service file says a man 'parted from' his wife, it records that they lived apart. Before recording a divorce, find a dissolution note beside the marriage entry, a later marriage entry saying the first marriage was dissolved, or the consistory's divorce file. If a note gives a ground such as the wife's fault, record it as the court's stated finding, not as a fact about anyone's conduct. The [divorce discussion](https://rodgersforum.borda.ru/?1-0-0-00000224-000-0-0-1716470420=) reports a case file where a spouse would agree to divorce only on a named ground. That is one file and sets no rate. A missing note in one copy of the register does not show there was no divorce.\n- **Read a divorce decree's remarriage terms.** When a dissolution note survives, record what it allows each spouse: remarriage at once, remarriage only after a church penance (one transcribed note sets seven years for the guilty wife), or a lifelong bar. Keep the decree's reference and date, and use its terms to judge when, or whether, a later marriage entry you are attributing to that person could have happened. The [divorce-note examples](https://rodgersforum.borda.ru/?1-0-0-00000224-000-0-0-1716470420=) motivate this step. They do not show how the restrictions were enforced or evaded, so a marriage that seems to break them is a conflict to investigate, not proof of a different person.\n- **Heir lists are not child lists.** A will can leave out children already provided for. An heirs' deed lists the participants and may miss a child who died earlier without heirs. 'Heir' does not mean child. In an intestate estate, record each share's stated chain (heir, deceased intermediate parent, relation to the decedent) as its own observation. Several heirs splitting one share is a lead to a deceased child's descendants. A distribution to siblings raises a question about surviving entitled descendants at that date; resolve entitlement under the descent law in force for that place and date before drawing a survival conclusion, and do not read it as proof that the decedent was childless. Before using relatives from a will or probate index, confirm each name in the testator's own text, because an index can carry names over from the adjacent entry. Motivating examples: [McClure](https://www.youtube.com/watch?v=q9dHUILop_A), [intestacy](https://www.youtube.com/watch?v=CjjD9mI_dY8), [Jerusha Abbott](https://www.youtube.com/watch?v=880wgUzrmhQ), [will index](https://www.youtube.com/watch?v=Z0wwMYchf2I). None of these sources states that law. A fractional share is a lead, not proof of descent.\n- **Use a death entry's family summary as a control, within its limits.** Some registers list a deceased man's successive marriages or count his children. Before searching for a spouse claimed only by an unsourced tree, compare her with the marriages that entry lists; her absence is a reason to doubt the claim, not proof that no such marriage occurred. A child count may cover only the children living at the death, so search baptisms after each marriage for children who died earlier. Motivating examples: [marriage list](https://forum.ahnenforschung.net/forum/thread/3013930/), [surviving children](https://forum.ahnenforschung.net/forum/thread/2927558/). Check the entry's own wording; neither thread shows how common either practice was.\n- **An age threshold needs the law of that place and date, and even then it is not a hard bound.** Before using an age of majority or a minimum sponsor or marriage age to bound a birth, read a guardianship or consent, or call someone a minor, identify and cite the legal system in force for that territory and date. Do not assume 21 or 18. A [majority compilation](https://forum.ahnenforschung.net/forum/thread/134872/) shows one state using different ages by district and changing them on different dates. Keep majority, marriage with consent, and capacity to dispose of land or take over a holding as separate thresholds; a marriage does not prove majority, and an age to inherit or dispose of land may differ from majority. A [sponsor-age discussion](https://rodgersforum.borda.ru/?1-0-0-00000141-000-0-0-1701453218=) quotes rules setting minimum sponsor ages yet reports much younger sponsors, so do not use a statutory sponsor age as a hard bound on a sponsor's birth. Verify each quoted figure against the statute; these observations set no frequency.\n- **DNA + paper as one proof.** Document each test-taker's parent-child chain to the common ancestor **before** using the match as evidence; require the documented descent path and the genetic sharing to **converge on the same hypothesis** before the match supports it. Even then, one match is evidence in the proof argument, not proof; the conclusion still has to meet the whole proof standard. (Match selection, clustering, coverage across independent descendant lines, and triangulation belong to [unknown parentage and WATO](unknown-parentage-wato.md) — route them there, don't re-derive them here.) (Why Document DNA Links; How Many Matches; Coverage; Using DNA Source Citations; RLP 409)\n- **Test a famous or gateway link from the documented end.** First find where the documentation starts. If sources appear only from the noble or gateway generation upward, the connection is unproven: verify each generation from the researcher upward. Watch for same-name ocean crossings, overlapping marriages and geographic leaps, and record a published pedigree's provenance. Check that the famous person left surviving children, and join a line only at a person a documented descendancy actually names. Convert a claimed cousin degree into the shared ancestors it implies and use them as a search guide; rule out slots by dates, then recompute the degree from the joined tree. When trees attach an ancestor to a progenitor because of a rare given name, list the progenitor's same-named descendants and compare their children with men documented locally. Motivating examples: [gateway](https://www.youtube.com/watch?v=mbDqe9rXWx4), [famous ancestor](https://www.youtube.com/watch?v=qG2YD76a3gk), [Truman](https://www.youtube.com/watch?v=Gdyo3ORfPk4), [Tecumseh](https://www.youtube.com/watch?v=jjknGUtMs7s), [rare name](https://www.youtube.com/watch?v=v3x23zLGi04). A compiled descendancy is a source to evaluate. A claim that has not been excluded is still unproved, and a shared rare name proves no link.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0f9580df3611","kind":"unclassified","anchor":"- **Two-way descriptor sort splits and unifies at once (Dewitt).** Sorting a 40+-column spreadsheet of \"David Dewitt\" *and* \"Henry Dewitt\" records simultaneously **split** two men named David (two distinct signatures on an 1833 petition) **and unified** \"Maryland Henry\" with \"Ohio Henry\" — Maryland Henry vanished from Maryland tax records in 1815–1816, Ohio Henry bought Holmes County land on 26 May 1815 — as one man, David's father. The name carried zero discriminating power; the descriptor pattern carried all of it. (From Chaos to Clarity)\n- **Test overlapping tax locations against separate family timelines (Scandinavian).** Same-name tax entries in different parishes raised a **two-family hypothesis**, not an automatic identity split. Check what each entry actually records before treating a taxable interest as residence or physical presence. In the episode's account, one father's death in 1730 was compared with the other father's child born in 1732 and separate death in 1771. Correlate the identities and event dates behind that chronology; tax geography alone does not settle it. The later choice between their same-named sons remained a separate indirect argument. (RLP 286)\n- **Reconcile, don't average (Slagle birth date).** Census enumerations implying birth years scattered across **1830–1835** (1850 → 1835; 1860/1880/1900 → 1834), plus a marriage bond, death certificate, and headstone (**4 May 1834**), were reconciled to **4 May 1834** by weighting informant proximity and geographic evidence — and the father's signature on the **$200 standard-form marriage bond was correctly *not* read as proof the bride was a minor.** Pre-1940 census ages carry an unknown informant; **1940 is the first U.S. census to mark who reported.** (When Birthdates Don't Agree)\n- **Resolve a same-name fork by tracing each candidate *forward* (457-person tree).** An entire 457-person tree rested on **one unverified parent-child link**; two same-name census candidates were eliminated by following each one's *later* residences, marriages, and families until only one stayed consistent. One bad link invalidated everything above it. (Genealogical Proof Standard | Ancestry)\n- **Absence into evidence (Henderson Weatherford / Eliza Poling).** Repeated failed searches became negative *evidence* only after corroboration and ruling out record loss / coverage / indexing; a **missing 1888 death registration** counted because the person was known to be in the area and should have been recorded. (RLP 409; Writing Up Negative Findings)\n- **Undocumented descent blocks the DNA argument.** Two starting test-takers lacked documented lines of descent, so their matches couldn't serve as strong evidence until the **paper descent was built** — proof came from correlating the DNA cluster *with* a documented line to the common ancestor, not from the match list alone. (Why Document DNA Links; RLP 409)\n- **\"Wrong until proven right\" (Josiah How).** Census, military, and pension records *about* Josiah didn't prove the family story until each was checked for belonging to the correct man **and** actually proving kinship — which overturned the story (he survived the Civil War). (Wrong Until Proven Right)\n- **Immigrant identity across two countries (Ane Jensen).** Connecting the right person in the US with the right person in the home country was itself an indirect-evidence correlation problem — resolved by correlating census and newspaper conflicts, *not* by assuming the matching name was the match. (How to Know if You've Met the GPS)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d446232d167d","kind":"unclassified","anchor":"This worksheet applies the [2024 UK naming-pattern demonstration](https://www.youtube.com/watch?v=0G_xOogKkTI)\nas a search aid within the conditional-premise procedure below, without imposing a universal\nBritish naming order.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-13416eeee650","kind":"unclassified","anchor":"Verify a name element before using it as a search term or identifier. A middle name, initial or\nsuffix found only on a tree profile or in an inherited compilation may be a compiler's label. Check\nwhether records or signatures from the person's lifetime show it, and note where it first appears.\nIn the illustrated U.S. Army records, 'NMN' is read as 'no middle name'; confirm the abbreviation against the record series. Do not turn an unverified middle\nname into the mother's maiden surname. Where a second given name or a surname-like given name\nappears, test it both as a namesake (relative, friend or minister) and as a maiden surname in the\nmother's or grandmother's generation. Motivating examples:\n[Wales](https://www.youtube.com/watch?v=AExYnNLU_LU),\n[Scotland](https://www.youtube.com/watch?v=4cVRQxlR_jY),\n[maiden names](https://www.youtube.com/watch?v=CAuwye17wbQ),\n[Tefft](https://www.youtube.com/watch?v=W-FMXSswYAY),\n[Morgan](https://www.youtube.com/watch?v=xOWgEolt7-g),\n[entry guide](https://www.youtube.com/watch?v=Y4vkJheOo80). Not finding a name in the records you\ninspected does not prove it was never used. A custom of passing on maternal surnames must be shown\nfrom the records, and any such clue is a search lead, not parentage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3b0319c4eb63","kind":"unclassified","anchor":"The [RLP 371 discussion](https://www.youtube.com/watch?v=wxj2UzRtJ98) qualifies the author's\nearlier [article](https://familylocket.com/comparing-marriage-records-original-licence-and-return-vs-marriage-book-entry/):\nin the demonstrated 1888 Texas case, a book can combine a contemporaneous license entry\nwith a deputy's copied return. Examine the volume and surrounding entries to establish\nthe actual process; give components their own source classifications. Copied wording is\ndependent evidence. A blank return leaves both an unperformed ceremony and a missing\nreturned/recorded certificate open. The article and episode belong to one authorial chain;\nestablish another jurisdiction's process from its records.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ad2a40270ef6","kind":"unclassified","anchor":"Before treating a bond witness as a family associate, compare the name/hand and stated role\non available contemporaneous bonds or court records. Retain actual evidence of routine clerk\nor other official service; repetition alone proves neither office nor kinship. Keep witness,\nbondsman and consenting-person roles distinct. The [marriage-bond example](https://familylocket.com/back-to-the-basics-with-marriage-records-part-1-marriage-bonds/)\nadds this comparison to the existing form-convention and signature controls.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-80765eb659e4","kind":"unclassified","anchor":"If an actual index exposes a bondsman/surety field, search the identified actor in that\nrole and carry each couple, date, jurisdiction and index locator to the original bond.\nInspect separately available consent and return material; an index's omitted associate\nor consent is not absence from the packet. The [bondsmen example](https://familylocket.com/rlp-233-marriage-bonds-and-bondsmen/)\nmotivates this reverse lookup without promising a current field, image route or legal rule.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c5b930102587","kind":"unclassified","anchor":"A diocese label on a marriage-licence record may not give the place of marriage. Record the licence, its issuing authority and the ceremony place as separate items. Find the marriage entry itself before placing the couple in a parish or county. In a [licence misreading](https://genarchivist.net/showthread.php?tid=837), a poster read a 'Dioceses of Canterbury' label as the marriage place for couples whose licensed marriages were in fact in Middlesex. The thread does not say what the label denotes or how the Middlesex place was found, which licensing series were involved, or what the licence copies contain. A licence alone does not prove that the ceremony took place.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d816d435dc78","kind":"unclassified","anchor":"A banns entry records an intention to marry, not a marriage, and an index may record banns readings\nas marriage dates. Several dates a few weeks apart for one couple are a sign of this. Inspect the\nfull entry and the facing page for a note of solemnization or objection, and search for the marriage\nentry itself. Banns with no recorded outcome leave the marriage open. In the other direction, a\nsecond ceremony or registration for the same couple is a separate event, not the start of the union\nor a second couple. Examples include a ceremony repeated for an administrative scheme, a later\nreligious sealing, or a civil registration made years after the children were born. Keep each entry\nwith its locator and role, and do not redate the children's legitimacy from the later event.\nMotivating examples: [banns](https://www.youtube.com/watch?v=HX-vIeT3nuo),\n[indexed banns](https://www.youtube.com/watch?v=ZOBFGCHCKy8),\n[subsidy remarriage](https://www.youtube.com/watch?v=8IyZ2AdcCCo),\n[sealing](https://www.youtube.com/watch?v=vwx-RUk8sbU),\n[late civil registration](https://www.youtube.com/watch?v=uks4xjQvig8). These sources establish no\nindexing practice, period or legal requirement; take those from dated local authority.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3ae744f6d0f8","kind":"unclassified","anchor":"For a struck-out index or later-filed entry, retain both references and distinguish the\nevent, registration and change dates. Follow supplied amendment/court references to the\navailable original and amended records. Read a later marginal identity or married-name\nnote separately from the original statement, retaining its date/author when known; compare\nall live namesake candidates. A later filing alone establishes neither adoption nor biological\nparentage. These are retrieval checks illustrated by the\n[Edna Estes](https://dna-explained.com/2022/06/12/edna-estes-miller-1920-1990-sister-once-found-twice-lost-52-ancestors-361/)\nand [Gockeler](https://dna-explained.com/2022/08/18/wolfgangius-gockeler-his-wife-barbara-born-c-1585-i-baptize-thee-52-ancestors-370-371/)\ncases; their original records remain to be inspected in any new investigation.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-58cd2c3aadd6","kind":"unclassified","anchor":"An issued certificate, extract, archive statement or compiled ancestry form is derived from a register entry. A dash or blank on it (religion, nationality, birthplace, the mother's surname, a whole paternal side) means 'not stated' there (for a blank paternal side, at most that the father was not known), not 'none' or a hidden origin. Find where the original register is held and request the entry's full text, ideally an image, including marginal notes, because issued statements may abbreviate it. Treat an uncertified handwritten addition, especially in a field that year's form lacked, as an unattributed later addition. Record differing surnames as a conflict. Look beside the act for dated notes of a name change, conversion, court decision or later acknowledgment of paternity; clerks could also write variant forms without an official change. Motivating discussions: [register extract](https://forum.j-roots.info/viewtopic.php?f=95&t=5107), [certificate addition](https://forum.j-roots.info/viewtopic.php?f=20&t=5084), [act annotations](https://forum.j-roots.info/viewtopic.php?f=4&t=4667), [blank paternal side](https://forum.ahnenforschung.net/forum/thread/7419/). None establishes period rules on forms, amendments or registering fathers, or what an omitted field contained.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f1e28818aac2","kind":"unclassified","anchor":"A bilingual seal may reflect the issuing office rather than its holder. On a Soviet-era certificate, a Yiddish stamp next to Slavic text is not a rabbinate seal and does not show the person's Jewish identity: offices in Jewish national districts and village soviets could use bilingual seals. First identify the issuing district. Then look for nationality fields, such as the parents' nationality, which one participant says was usually given on 1937 civil records, or the person's later identity documents. A [bilingual-seal discussion](https://forum.j-roots.info/viewtopic.php?f=95&t=5107) motivates this step. It shows no stamp image, and one participant's remark on 1937 nationality fields is a generalisation, not a rule for any form.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b79728959d71","kind":"unclassified","anchor":"When an entry corrects itself, transcribe both readings. Record the informant the note blames for the struck reading and the corrector's attestation, and treat each reading as a separate statement. A correction that matches an earlier register entry may mean the clergy aligned it with that entry (one participant's reading of this case); it does not independently confirm the reading. The struck reading may preserve the name the family actually used, for example a stepfather's patronymic, which later civil documents may repeat. Record notes of certificates issued later from the entry as dated later uses of it. A [metrical-book correction example](https://rodgersforum.borda.ru/?1-2-0-00001736-000-0-0-1775021161=) motivates this step. The thread quotes transcriptions only, and neither reading establishes biological parentage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6ab19a00606f","kind":"unclassified","anchor":"When the image of a birth entry is available, look for papers inserted between the leaves and for later margin notes that an index or transcription may not carry. A receipt for a birth certificate issued for an adoption, naming the recipient, issue date and number, is its own dated document. Record it with its locator, and use the named recipient to search his parish for the child under his surname or a new patronymic. A later court legitimization note names a legitimizing husband. Neither the receipt nor the note proves that an adoption was completed or who the biological father was. An [adoption-records discussion](https://rodgersforum.borda.ru/?1-0-0-00000146-000-0-0-1759035209=) shows both forms; its link to a later family is only a suggestion.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-75babae41491","kind":"unclassified","anchor":"If a disputed year comes with a month/day and liturgical observance, preserve the literal\nforms and test candidate years against the documented calendar/tradition. Compare independent\nchronology, considering a later-added signature only where the document supports it.\nReport compatibility or an unresolved calendar basis; compatibility does not prove the year.\nThe [calendar-and-signatory example](https://www.roots-branches.com/examine-assumptions-use-local-expertise/)\nsupplies this extra constraint, not a verified date for the present case.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-288e03f1df42","kind":"unclassified","anchor":"Old Style dates can also explain a gap of days. If a pre-1918 date from the former Russian Empire differs from a later Soviet-era document by about 13 days, or by nearly a year across a December–January boundary, test for a conversion that shifted the day without changing the year. If a remembered or gravestone birthday differs by days from the metrical birth date, test whether it is the name-day of the child's saint, converted to New Style. Keep each literal date with its calendar and role, and look in the register for dual dates or later issue notes that add 13 days. Motivating discussions: [calendar conversion](https://forum.j-roots.info/viewtopic.php?f=75&t=7576), [name-day](https://rodgersforum.borda.ru/?1-2-0-00000862-000-0-0-1778497763=). They give no rule for how any office converted dates and show no general practice. A fitting explanation does not prove which date is correct.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fad9b1686519","kind":"unclassified","anchor":"Do not add 13 days to every Old Style date. The gap between the Julian and Gregorian calendars was 10 days in the seventeenth century, 11 in the eighteenth, 12 in the nineteenth and 13 from 1900. Each increase falls around the end of February in 1700, 1800 and 1900. Use the offset for the date's own century, check any date near those boundaries with a calendar converter, and keep the literal Old Style date beside the conversion. A [calendar-offset table](https://rodgersforum.borda.ru/?1-0-0-00000172-000-0-0-1772397970=), credited to a secondary article, motivates this step. It does not say which calendar its boundary dates use, and it does not cover registers already kept in New Style.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5ee6253ff8a4","kind":"unclassified","anchor":"Soviet civil dating changed by the Sovnarkom decree of 24 January (6 February) 1918 introducing the Western European calendar: the day after 31 January 1918 was counted as 14 February ([decree in translation](https://soviethistory.msu.edu/1917/new-letters-and-dates/new-letters-and-dates-texts/introduction-of-a-new-calendar/)). So a civil record (state or ЗАГС, civil registry office) written at the time under Soviet authority cannot carry a date of 1–13 February 1918. If one appears, it is a Julian date (1–13 February Old Style = 14–26 February New Style), a later conversion to New Style (1–13 February NS = 19–31 January OS, valid in a later document), or a misreading. Check which calendar the source used, and keep both dates with the calendar named. The decree bound only territory under Soviet authority, so a record made elsewhere can carry those dates. (Source 165)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-abf8919ca9f9","kind":"unclassified","anchor":"A Hebrew date one day later than a converter's value for the civil date may record an evening event, since the Hebrew day begins at the previous evening; do not move the entry to another year just because the converter matches both dates exactly in that other year, and check the book's title year and neighbouring entries first. The [dual-date discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) motivates this; it explains only a one-day offset in that direction, not an earlier Hebrew date or a larger gap.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f9a8033963b0","kind":"unclassified","anchor":"A record made long after the event is a late claim. For a delayed birth certificate or affidavit,\nrecord the application or issue date separately from the birth date it asserts. Note each informant\nor affiant with their stated relationship and years known, research them as associates, and ask what\neach could actually have known. A precise day may have been fixed from a remembered feast or season,\nso check how the date was established before weighing it, and compare it with earlier records such\nas sibling order across censuses. For a church certificate issued years after the event, check\nwhether it identifies an underlying register and classify its information from that evidence. A different given name on it may be a copyist's rendering of an\noriginal-language form; test that against the register entry. Motivating examples:\n[delayed affidavit](https://www.youtube.com/watch?v=jeshnSv9xQ0),\n[delayed certificate](https://www.youtube.com/watch?v=TW-sRiN0mYM)\n(also [2024](https://www.youtube.com/watch?v=fwjzc6KsI4o)),\n[late baptismal certificate](https://www.youtube.com/watch?v=7vUOB1x6QR0). These are single cases.\nThey show neither how common the practice was nor what form was used, and the affiants' stated\nrelationships still need independent proof.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1c582996d968","kind":"unclassified","anchor":"A document reissued after a loss is also a late claim. If the family says papers were lost and replaced, for example during wartime evacuation, treat the birth year on the replacement, and on later records copied from it, as possibly changed. When contact is authorized, ask the archive to search the original birth register over several earlier years, not only the stated one. Also look on surviving certificates for altered numerals, such as an extended Roman month numeral. A [reissued-document discussion](https://forum.j-roots.info/viewtopic.php?f=64&t=561) motivates this step. The family story is unconfirmed and no earlier entry had been found, so a wider search window does not show which year is correct.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-09c3c957d230","kind":"unclassified","anchor":"When an index names only each entry's principals, a person's later roles as sponsor or\nwitness stay hidden. To bound a life window, inspect documented relatives' baptisms backward\nfrom the latest relevant date and retain the latest entry in which the person actually acts\nas sponsor or witness. A mere mention in someone else's record, such as a spouse named in a\nburial entry without participation or living-status wording, does not by itself establish\nsurvival. The [Port Royal godmother example](https://dna-explained.com/2024/06/16/francoise-dugas-1679-after-1751-goodbye-port-royal-52-ancestors-426/)\nmotivates this search; a latest appearance is not a death date.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1eae2e00ed62","kind":"unclassified","anchor":"Read a baptism's whole sponsor section, including any note in the entry, before you use a sponsorship. A named sponsor, such as a high-ranking one, may have accepted without attending or been represented by a stand-in. Record each sponsor's role as written: named, absent, represented by someone, present. Only then use the entry to place someone in the parish, to bound a life window as above, or as evidence of a close tie to the family. A [baptism with absent royal sponsors](https://forum.ahnenforschung.net/forum/thread/928/) motivates this step. It is one unusual entry. Most entries carry no such note, and a missing note does not show that a sponsor was present.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f70892689111","kind":"unclassified","anchor":"Retain an in-law term verbatim with its reference person and record date. Compare earlier\nand later household entries and independently supported unions before calling the term a\nscribal error or reconciling different fathers through a double name. Show each candidate\npath through former/current spouses and subsequent marriages; one person can hold two\naffinal roles. Preserve supported paths and unresolved alternatives. The [revision-list discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=13676)\nmotivates this dated comparison without establishing its narrated family solution or a\nuniversal kinship dictionary.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e34917a0b867","kind":"unclassified","anchor":"Surnames shift across unions too. A bride's surname on a marriage entry is not her maiden name\nunless the record says so: a widow may marry under an earlier married surname without the record\nmentioning a previous marriage. Check for children carrying that surname, for an earlier marriage,\nfor the mother's maiden name in the children's birth registrations, and for a census taken before\nthe marriage. Before attaching household members as the head's children, check the relationship\ncolumn, their ages and any earlier marriage of the wife. A census child with no birth registration\nunder the household surname may be registered under the mother's maiden or earlier married surname.\nChildren of another surname may be a remarried mother's: test this with their later answers about\nher birthplace and with land or probate records she made under both names. Motivating examples:\n[1](https://www.youtube.com/watch?v=DG2eJWmekcY), [2](https://www.youtube.com/watch?v=DncJDtUmqeE),\n[3](https://www.youtube.com/watch?v=EwBoSeXHnX8), [4](https://www.youtube.com/watch?v=Dtl6pnXMiEY),\n[Caroline](https://www.youtube.com/watch?v=gsbQIuilOYk)\n(also [Caroline, second video](https://www.youtube.com/watch?v=LtVWWY1u5OI) and\n[Caroline, third video](https://www.youtube.com/watch?v=gp9OE5-gtG4)),\n[Gertrude](https://www.youtube.com/watch?v=9g14sFJ7ZjY),\n[Patton](https://www.youtube.com/watch?v=svND4WwnX54),\n[Gunton](https://www.youtube.com/watch?v=QOxgU5AZjEo),\n[Dove](https://www.youtube.com/watch?v=pNF5B1jZ8gM). Agreement supports a surname but does not prove\nit. A matching birthplace or a registration under the maiden name identifies no father.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ade18d3affb2","kind":"unclassified","anchor":"A father named on a marriage entry may be the man who raised the bride or groom, not the birth or adoptive father. If his surname differs from the birth record, especially for a fostered child or a wartime evacuee, record him verbatim as the named father. Test foster care, a host household and a stepfather's marriage to the mother before switching the line. For England and Wales, search the GRO adoption index (the Adopted Children Register, from 1 January 1927) for a formal adoption under the surname the child may have taken. An adopted person aged 18 or over can apply for their original birth information (Source 190). A missing entry does not prove fostering, and neither outcome identifies a biological father. A [heir-hunting case](https://www.youtube.com/watch?v=_ntfDZ26ThA) motivates this check; it did not settle whether the named man fostered or adopted.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4426f036fa90","kind":"unclassified","anchor":"When a woman's marriage entry is lost, search the parish baptisms for her as a sponsor. First look for her under her married name at christenings in a candidate family, and note whether those parents share her patronymic. Then look for an unmarried woman with the same given name and patronymic under that family's surname before the estimated marriage. Keep both sets of entries with their locators as indirect evidence. The [sponsor-entry example](https://forum.molgen.org/index.php/topic,1298.0.html) motivates this search. The entries state no kinship, and an unmarried namesake is not proven to be the later married woman, so the maiden surname still needs a written correlation argument.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c3605b014dc3","kind":"unclassified","anchor":"When a mother is recorded only by given name and patronymic, look at the godparents at her children's baptisms and the sureties at their marriages for someone who shares her patronymic. Treat that person as a lead to a possible natal family, not as a brother. Then reconstruct the candidate family from a compiled family table of the registers: look for one father with both a son of the sponsor's name and a daughter of the mother's name, at compatible ages. Seek her own baptism or marriage entry to confirm the link; neither thread cited below does. Motivating examples: a [godparent-patronymic test](https://rodgersforum.borda.ru/?1-0-0-00000238-000-0-0-1721744472=) and a [surety-patronymic lead](https://rodgersforum.borda.ru/?1-2-0-00001505-000-0-0-1775639167=). Sponsors need not be kin and patronymics are common, so a fit is a reconstruction until her own record states it.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f505a65ffa00","kind":"unclassified","anchor":"If one person has a different patronymic or surname in revision lists than in metrical books, keep both forms. Test upbringing in another household in both directions between the two candidate families, A and B: a child born to B raised in A, or a child born to A, raised by B, who later took back the birth name. Check three things. Does the candidate family's birth spacing leave room in the years whose registers are missing? Do the two households stand godparent for each other before and after the gap? What do dated confession lists say about when each wife died? Record which lists you could not consult. Motivating sources: a [patronymic-mismatch case study](https://rodgersforum.borda.ru/?1-0-0-00000238-000-0-0-1721744472=) and a [rough-notes remark](https://rodgersforum.borda.ru/?1-0-0-00000230-000-0-0-1775396698=). The case's author left it a working hypothesis; a good fit proves neither direction nor identity.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2f245af97a8e","kind":"unclassified","anchor":"When testing a parent-child link with a generated timeline, mark or temporarily exclude\nparent-presence events derived solely from that attached child's birth. Compare independently\nsourced dated observations instead, retaining gaps as unknown. The [timeline-view example](https://familylocket.com/rlp-218-goldie-may-subway-map-with-richard-miller/)\nmotivates this dependency check without assuming a particular tool offers a switch. A plotted\noverlap or absence does not establish or exclude parentage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-249e7d8fd90d","kind":"unclassified","anchor":"Apply the same dependency check to inherited tree dates before they enter a reality check or a\nsearch window. Ask whether each date is an observation, a derivation or a bound. An unsourced\n'about' year may be a marriage minus an assumed age. A birth date identical to the christening date\nmay be a copied placeholder. A 'before' death date may only mean the person was dead by a later\nrecord, and a death date may have been inferred from 'died as infant'. A baptism supports the\nbaptism, the name and the listed parents. It does not support a birth date or sex that the entry\ndoes not record; without a stated birth date or infant status, treat it only as a born-before limit.\nDistinguish age-derived approximate years from assumption-based search estimates, and do not file a\nconventional marriage age as an observed fact. A record hint that matches your own estimate may only be echoing it. Motivating examples:\n[Parkinson](https://www.youtube.com/watch?v=goYE2J6rp3Y),\n[christening date](https://www.youtube.com/watch?v=mzIbF22wUKM),\n[Levenia](https://www.youtube.com/watch?v=lJSDH-L86oE),\n[Tree Sweeper](https://www.youtube.com/watch?v=Tg7wVQyTvAM),\n[source tagging](https://www.youtube.com/watch?v=QuCBcmiFGFg),\n[timeline grid](https://www.youtube.com/watch?v=yYtExm8oYxE),\n[placeholder hint](https://www.youtube.com/watch?v=XZp1tyYAJc4),\n[adult baptism](https://www.youtube.com/watch?v=v_tpU77sOn4). Label derived values with their basis\nand uncertainty, use them only within that uncertainty, and never count them as independent\ncorroboration of the observations they were derived from. Late and adult christenings occur, so treat one as a conflict to explain, not an impossibility.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-35c236f8c525","kind":"portal-availability","anchor":"When a woman in the line may have belonged to the Daughters of the American Revolution, search the public version of DAR's Genealogical Research System, which is free, and buy a copy of her verified application; its supporting documentation is sold separately [N194 @2026-11-14], [N195 @2026-11-14]. On 2026-11-14 DAR's page reported the system temporarily unavailable, so confirm that it is running before you plan this step [N195 @2026-11-14]. Such papers can hold details found nowhere else. Weigh them as the dated compiled conclusions described above: DAR does not guarantee that the documentation in its files meets today's genealogical standards [N194 @2026-11-14], [N195 @2026-11-14], [N196 @2026-11-14].","sources":["N194","N195","N196"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-26fb91618b60","kind":"method","anchor":"**Take signatures and marks from originals before you use them as descriptors.** A deed or will book in which a clerk copied each document by hand holds the clerk's copy of each signature and mark: a signature in the same hand as the whole document is most likely the clerk's [N197], [N198]. Check how the volume was made first: where the law allowed recording by photographic or electronic image, as Virginia's code does for deed and will books, the book can show the signer's own hand [N301]. Look for the person's own hand in original papers: probate and court case packets, marriage papers the couple had to sign, pension and bounty-land applications, some federal land files and draft registration cards [N197], [N198]. Search other people's records too, where the person signed as a witness or affiant, such as a relative's will or homestead affidavit, and note where each sample is so you can find it again. Compare samples from different years, because signatures change [N199], [N200]. A mark need not be an X; some people made an initial or another sign [N201], [N202]. A distinctive mark that recurs on originals, such as an M or an O, can tell namesakes apart, but a mark in a hand-copied volume is the clerk's rendering of it [N201]. A mark is evidence that the person could not write their name, not proof: literate people sometimes made a mark for convenience, at someone's request or when too weak to write [N203], [N204]. Before you call someone illiterate, look for their signature in other local records and for the census literacy answer [N203], [N205].","sources":["N197","N198","N301","N199","N200","N201","N202","N203","N204","N205"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-382142f779f7","kind":"method","anchor":"**A missing court order does not count against a name change.** For much of U.S. history a person could take a new name under the common law without going to court [N206], [N207]. Bridge the two names through records that span the change: a deed for land bought under one name and sold under the other, pension applications made after the change, probate, divorce and criminal court records that note an earlier name or an alias, and sometimes a death certificate [N208], [N206], [N209], [N210]. Then compare the two identities' descriptors in the dossier before you join them.","sources":["N206","N207","N208","N209","N210"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b0a3681d50cc","kind":"method","anchor":"**Read a stated age by the form's own definition before you compute a birth year.** The age may be at the last birthday, at the next birthday, or on a stated reference date: the 1850 U.S. census asked for the age at the last birthday before 1 June 1850, and Canada's 1851 census asked for the age next birthday [N211], [N212], [N205], [N213], [N214]. Work out the birth interval from that definition before you log a one-year discrepancy. Cite the record only for what it gives: an 1850 census age of 3 and a birthplace of Indiana support a birth in Indiana between 2 June 1846 and 1 June 1847, not an exact birth date taken from a death certificate, even when the two agree [N215], [N205].","sources":["N211","N212","N205","N213","N214","N215"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b322c33bf871","kind":"method","anchor":"**A baptism bounds a birth from one side only.** In English registers baptism usually followed birth within about a week in the sixteenth century, and the gap lengthened from the mid-seventeenth: in one study it took 14 days for 75% of the children to be baptised in 1650–1700, 38 days in 1771–89 and 64 days in 1791–1812 [N216], [N217]. Use such figures to set a likely window, never a bound, since some children were baptised on the day they were born and others years later [N216], [N218]. When several siblings were baptised together, some of them older children or even teenagers, the entry shows neither where each was born nor that the birth was recent, and a parent it names may be a stepparent after a remarriage [N218], [N219].","sources":["N216","N217","N218","N219"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-abd90e8cea36","kind":"method","anchor":"**A headstone, death certificate and obituary that agree on a birth date are often one stream.** The same family member probably supplied the date to all three, so count them as one statement until you know otherwise [N220]. A Find a Grave or BillionGraves entry is not a further witness: at best it transcribes the stone, and a Find a Grave contributor may have taken the date from an obituary, a tree or no source at all, so compare the entry with the photograph of the stone [N220], [N221].","sources":["N220","N221"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fe19e6683f0f","kind":"method","anchor":"**Split a death certificate by who supplied each item.** On a U.S. certificate the funeral director usually takes the personal details from an informant and arranges the disposition, while the attending doctor or another medical certifier completes the cause of death [N222], [N223]. The named informant may have passed on what others told them, an early certificate may name only the doctor, and a record that names no informant leaves you to work out who probably gave each item and what that person could have known; label that as inference and keep the information undetermined [N224], [N225], [N222], [N226]. Weigh each item by its own contributor. A parent's birthplace may be where the informant believed that parent's family came from, not where the parent was born [N227]. A round age, especially one ending in 0, with the months and days left blank, is often an estimate: treat it as rounded and widen the birth range instead of subtracting the age from the death date [N228], [N229].","sources":["N222","N223","N224","N225","N226","N227","N228","N229"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4697de7a85af","kind":"method","anchor":"**Classify a record by how and when it was made, not by how it looks.** A typed marriage entry from the late 1700s is a transcription, but a typed will or birth certificate from 1930 can be the original, and before photographic copying many copies were made by hand [N230], [N231]. The class says nothing about accuracy: some originals are nearly worthless and some derivatives are excellent, so never rank one record above another by its class alone [N232], [N230], [N233].","sources":["N230","N231","N232","N233"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-774f9e9bc9e5","kind":"method","anchor":"**A blank field can carry negative evidence.** When the person's entry in a record you hold leaves empty a field that the other entries fill, such as the payment date in a tax roll, treat the blank as negative evidence: a clue that the event, such as the payment, did not happen, to test against other records, not a finding that it did not happen [N234], [N12]. A failed search for the person is a different matter and counts only under the negative-evidence gate above.","sources":["N234","N12"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-135f0b59579c","kind":"method","anchor":"**'Late of [place]' means formerly of that place.** A person described as 'late of' a county usually no longer lived there; the phrase does not show a death. Record a death only from other wording, such as 'deceased', or other evidence [N235], [N236].","sources":["N235","N236"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4bcaa3e34ab8","kind":"method","anchor":"**A remarriage proves neither a death nor a divorce.** When one spouse marries again, do not record the earlier spouse's death, or a divorce, from that alone. Where divorce was harder than moving away, couples parted without any legal step and both remarried: in the United States from the 1750s to the 1820s, such separations were perhaps the commonest way to end a marriage [N237], [N238]. Some people remarried while the first spouse still lived, most after moving far away, and most such bigamies went undetected [N239], [N240]. Look for the earlier spouse alive later, for a death, burial or estate, for a divorce in the court records, and for deeds or other local records that mention the separation, such as a deed dividing the couple's property; an informal separation may have left no record at all [N237], [N239].","sources":["N237","N238","N239","N240"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b94579149c8b","kind":"method","anchor":"**Test a claimed adoption by a stepfather against his estate and the children's guardianship.** A child listed under the stepfather's surname in a census or a marriage record was not thereby adopted, and a guardian of a minor managed the child's property: the appointment is not an adoption [N241], [N242]. Read two laws: the adoption statute in force when the adoption is said to have taken place, for whether it was valid, and the inheritance law in force at his death, for whether an adopted child would inherit. Where adopted children could inherit, living stepchildren missing from his order of heirship argue against a valid adoption [N243], [N244]. In Illinois in 1900, for example, an adoption that did not strictly follow the statute gave no right to inherit, so the gap argues against a valid adoption, not against any attempt; search the court's adoption records too [N244].","sources":["N241","N242","N243","N244"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ae33f07d4cef","kind":"method","anchor":"**Read a list of heirs-at-law against the statute that produced it.** Rebuild the set of heirs that the descent law of that place and date entitled, including half-blood lines from a grandparent's second marriage where the statute counted them, and search for any branch the administrator left out; an administrator from one side of the family may not have known the other [N245], [N246]. Heirs-at-law usually come from one class: descendants first, then parents, siblings and more remote kin only when no descendant survives. So a parent or a cousin named as an heir-at-law is a lead that no descendant survived at that date, and one descendant heir suggests that the others, apart from a spouse, are descendants too [N247], [N248], [N249], [N250]. Confirm the classes and the spouse's share in the statute itself, since both differ by state and date [N248], [N249], [N250].","sources":["N245","N246","N247","N248","N249","N250"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a888ef4a41e5","kind":"method","anchor":"**A will speaks at its date.** A beneficiary named in it was alive, or believed alive, when the testator signed it; that does not show that the beneficiary outlived the testator. Read the whole estate file to see whether the share went to that person or to their heirs, since a gift to someone who died first lapses or passes as the will or the law directs [N251], [N252]. A child named only to receive nothing or a token sum was usually named so the child could not claim to have been overlooked; that shows neither estrangement nor that the will names every child [N253], [N254]. A child left out may already have received a share in the parent's lifetime: look for deeds of gift, settlement deeds and the child's own will before you read the omission as a quarrel [N253], [N255], [N256].","sources":["N251","N252","N253","N254","N255","N256"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c5fd9b183eaf","kind":"method","anchor":"Before you read a child's name as a relative's, set aside the names explained by the mother's\nfamily, by a baptismal sponsor, or by a politician or other public figure prominent at the\nbirth; only what remains is a lead to the father's side [N257], [N258], [N259]. A\nsurname-like middle name may honour such a figure rather than a maternal line: Chartist families\nnamed children after Feargus O'Connor, some with O'Connor as a middle name [N260], [N261].\nA son who carries his father's given name was not for that reason the eldest son; place him in\nthe birth order from other evidence [N262], [N263]. To suggest an earlier generation's names,\ncollect the first and middle names of all the ancestor's grandchildren across every child's\nfamily: a name that recurs in every branch is a stronger lead, and still only a lead [N264],\n[N259]. Judge a surname's rarity where the families came from as well as where they\nsettled. A name rare in the settlement can be common in the place of origin, so neighbours who\nshare it need not be kin [N265], [N266].","sources":["N257","N258","N259","N260","N261","N262","N263","N264","N265","N266"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5b75e3b1c948","kind":"method","anchor":"From 1754 an English parish marriage entry carries at least two witnesses, and they need not have\nknown the couple [N267], [N268]. Before you read kinship from a witness whose surname matches or\nnearly matches the bride's or groom's, scan the register for 'regular' witnesses who signed many\nmarriages in that parish [N267].","sources":["N267","N268"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6430683c75ba","kind":"method","anchor":"A licence, a marriage bond, or a newspaper notice of an engagement or of a journey to marry also\nrecords an intention. Most such couples married, but some did not. Record a ceremonial marriage only on\nevidence that the ceremony took place, such as the returned licence, or a date and place of\nmarriage with at least the officiant's name [N269], [N270], [N271]. Where the law recognised\ninformal marriage, test the union by the law and the holding-out evidence under 'A missing\nmarriage record' instead.","sources":["N269","N270","N271"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fc9bc1d19c70","kind":"method","anchor":"Date each version of a certificate. On a certified copy, record both the issue date and the date the original was filed. A certificate issued decades later was compiled from the record on file, usually the register: classify it as a derivative unless it is an image of the original entry, and certification does not mean that it carries every detail of the original [N220], [N231]. An original filed months after the birth was itself written after the event, though vital-records rules may call a registration 'delayed' only when it is filed a year or more late [N220], [N272]. Two certificates for one person may be an original and an amended one, not two people: a birth record replaced after an adoption or a court order, or a death certificate whose cause of death was later changed through the medical certifier [N273], [N274], [N275]. After an adoption the original birth record is usually sealed, and the replacement need not show that it replaced anything [N274]. A bishop's transcript was the copy sent to the church authorities each year, so a correction later written into the parish register, such as a mother's given name, appears only in the original: compare the two before you read a differing name as a different person [N276], [N277], [N278].","sources":["N220","N231","N272","N273","N274","N275","N276","N277","N278"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-631cdad05136","kind":"historical","anchor":"English legal and parliamentary documents also date by regnal year, which in most reigns runs from the monarch's accession day, not from 1 January or 25 March. Acts of Parliament were cited by regnal year until the Acts of Parliament Numbering and Citation Act 1962 numbered them by calendar year from 1963 [N279], [N280], [N281]. Convert with a table that gives each reign's regnal-year start, because some reigns break the rule: King John's years began on Ascension Day, a movable feast [N279], [N280]. Then double-date any day from 1 January to 24 March before 1752. Year 1 of William and Mary began on 13 February 1689, so 1 January in that year is 1 January 1689/90, and it falls after 1 May of the same regnal year [N279], [N280], [N282]. A later source may give a pre-1752 birth fully converted to New Style: George Washington, born 11 February 1731 by the Julian calendar, is remembered as born on 22 February 1732 [N283], [N284]. Before you call such a pair of dates a conflict, test it as that conversion: the day offset for the date's century, given above, with the year moved forward for a date from 1 January to 24 March [N283], [N282].","sources":["N279","N280","N281","N282","N283","N284"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-44d4c3309fd1","kind":"method","anchor":"Run the sponsor search forward to date an arrival. When a person's own records do not show when they settled in a place, collect the baptisms there of all their grandchildren and other relatives, and keep the earliest entry in which they stand sponsor in person; it places them there by that date [N285], [N286], [N287]. Apply the role check above first: an entry naming an absent or represented sponsor places no one.","sources":["N285","N286","N287"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2ade665c1e76","kind":"method","anchor":"A relationship term may hide a step or in-law link. A record can call a nephew by marriage simply\na 'nephew' and can drop 'in-law' or 'step' altogether: an older English will may call a son-in-law\na 'son', and its 'child-in-law' may be a stepchild [N288], [N289]. An obituary's list of grandchildren can include\nstep-grandchildren, even the stepchildren of a child whose marriage has since ended [N290],\n[N291]. List every blood and marriage path a term allows before you decide who should share DNA,\nand do not read a DNA non-match as proof that the record is wrong until the paths by marriage are\nruled out [N288], [N290], [N291].","sources":["N288","N289","N290","N291"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c7a29593f693","kind":"method","anchor":"An unchanged surname can also hide a marriage within the family. A widow who seems never to have\nremarried may have married her late husband's brother. A man whose wives share a maiden name, and\nperhaps similar given names, may have married his first wife's sister after her death: do not\nmerge the wives into one woman [N292], [N293], [N294]. A surname that a record calls a\nwoman's maiden name may be the name she carried just before that marriage, such as an earlier\nmarried name, or a stepfather's or adoptive family's surname [N295], [N296], [N297]. When a child\ngives the mother a maiden name that conflicts with contemporary records, often decades after her\ndeath, test it as a stepfather's surname, the grandmother's maiden name or another relative's\nmarried name before you discard it [N298], [N299]. Get every marriage record of a widowed\nancestor, including short marriages outside your line: a later form may be the only one that asks\nfor the bride's parents [N300], [N297].","sources":["N292","N293","N294","N295","N296","N297","N298","N299","N300"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
