claims:
  - {"id":"C-01","kind":"method","anchor":"Place the village or town in its court at the event date using the historical jurisdiction lists in Arkistojen Portti. Check exceptions for the particular village or part of a rural parish and establish when each exception applied. Search ordinary proceedings (*varsinaisasiain pöytäkirjat*) for disputes and criminal cases and registration proceedings (*ilmoitusasiain pöytäkirjat*) for matters such as title registration [S1] [S2] [S13].","sources":["S1","S2","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For a widow arranging guardianship, include the ordinary proceedings in your search. If the minute lists minors, compare the couple’s marriage date and the children’s baptism dates with the hearing date and the period’s age of majority before treating the minute as a complete child list [S5] [S1].","sources":["S5","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"historical","anchor":"Search the local court’s draft minutes (*konseptituomiokirjat* or *kantapöytäkirjat*) separately from the clean copies sent for review (*renovoidut tuomiokirjat*). For a pre-1827 gap in the clean copies for Åland, Suur-Savo or Sääksmäki, look for the local drafts. The Turku fire destroyed much of the clean-copy run for those courts [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For missing southern Finnish registration proceedings before 1827, check whether the district was still operating when Turku burned and verify the actual survival of its records. Try the local draft series for the same session and case type [S13] [S2].","sources":["S13","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"For a content search, open the National Archives’ Sisältöhaku. Enter the historical name when looking for a reference such as an occupation or burgher status, narrow by collection and year, and follow the result to the image in Astia. Compare the text hit with the image and record which collection and years the search actually covered [S11 @2026-11-23] [S12 @2026-11-23].","sources":["S11","S12"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"For a shipwreck inquiry, try the vessel’s name as the court-book search term and use the session and subject of any result to identify proceedings about the wreck [S13] [S11].","sources":["S13","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Search by the holding as well as by the people. When the locality is also the court venue, identify the references that concern the specific farm. In a boundary dispute keep the date stated for the demarcation separate from the hearing date [S3] [S4].","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"If the text search misses, open the draft volume for the identified session and check its judgment list (*tuomiolista*) where present. Browse the case entries in the surviving copy. Keep a missing volume, an uninspected session and an inspected session without the case as separate outcomes [S2] [S13].","sources":["S2","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"Search Astia for *tuomiokirjakortisto* and the region, then check the catalogue unit for scan coverage. According to Kyläkoski, the regional guide flags undigitized card files, so keep those units open after an online miss [S6 @2026-11-23] [S14† @2026-11-23].","sources":["S6","S14"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-10","kind":"portal-availability","anchor":"For Käkisalmi, version 2 is Zenodo record 7022629 and version 4 is record 7038077. Search `hakusanat.csv` for a subject, `ttp.csv` for a place, `tth.csv` for a member of the upper estates or `ttsl.csv` for a peasant surname. According to Kyläkoski, these are indexes to the underlying court books, so follow any surviving court-book reference to the volume [S6 @2026-11-23] [S7 @2026-11-23] [S8 @2026-11-23] [S14† @2026-11-23].","sources":["S6","S7","S8","S14"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"Copy the old shelfmark verbatim and use the Tuokko guide to identify the court. According to Kyläkoski, the cards retain superseded shelfmarks, so match the court, volume and page to the current catalogue [S6] [S14†].","sources":["S6","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"For a surname lead, search the newspapers for a Court of Appeal list. Capture the court, heading, party and the date printed beside the entry. Identify the appellate case class before you choose a volume [S9] [S10].","sources":["S9","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"For *gifna utslag* in the 1872 Turku run, look up the printed decision date in *Päätösten julkipanokirjat* Aha:12. Use the party and earlier date found there to browse *Päätösnide* Dbb:55 for January–June 1872 [S9].","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"For *utgifna domar* in the same run, take the party into *Vetoasiain diaari* Aca:46 if the publication register has no entry. Copy every labeled date and remark. Browse *Tuomionide* Dba:55 under the earlier case date when you can establish it [S9].","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"example","anchor":"An early-March browse prompted by a 30-day note in the Turku docket did not locate the judgment, so keep that window and a *huutopäivä* annotation as unconfirmed locators until the name and case match in the volume [S9].","sources":["S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
