claims:
  - {"id":"C-856c1e2582a4","kind":"method","anchor":"If a burial entry gives no cause of death and other evidence suggests a criminal case, search published provincial notices by the deceased's name, locality and the period after the death. Copy the issuing authority, named court, people, ruling as stated, ruling date, notice date and publication date. Distinguish a report of an outlawry decision from a call to locate a suspect. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c0ef78378d0f","kind":"method","anchor":"Use the decision date to look for the case and retain the publication date as a separate locator. Compare the notice's date wording with the underlying court entry before dating the decision. When a derivative date conflicts with the cited court volume, search both years and verify the dated court entry. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-065b4f01268c","kind":"platform-ui","anchor":"Find the named court's archive in Astia by its Finnish archive title, for example *Vaasan hovioikeuden arkisto*. Open the court's diary (*diaari*) for the relevant period when the case number is unknown. For older cases, follow any reference through the distribution list (*juttujen jakoluettelo*) to the series. [S2 @2026-11-22]","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-95c5b616acb9","kind":"method","anchor":"Use the diary or distribution reference to choose the case papers (*aktit*), decision records (*tuomiotaltio*) or minutes (*pöytäkirjat*) for the proceeding. Check the court's case categories before assuming every matter was an appeal or that a minute book holds the full file. If the appellate file names an originating court, follow that jurisdiction into its lower-court series. [S2] [S3]","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8dfff0e7c982","kind":"method","anchor":"When the court notice and minutes supply a locality but leave several people with the same surname, compare the parish's *henkikirjat* before and after the proceeding. Look for a named household association and whether it persists. Keep a disappearance from the roll as a lead, and require corroboration before assigning the case to the household. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
