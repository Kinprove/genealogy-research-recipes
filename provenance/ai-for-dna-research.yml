  - {"id":"N96","kind":"web-page","urls":["https://familylocket.com/endogamy-pedigree-collapse-and-multiple-relationships-whats-the-difference-and-why-does-it-matter"],"published":"2022-09-02","retrieved":"2026-11-14","access":"read","rights":null,"basis":"Read 2026-11-14.","entry_sha256":"e01d134f2c249268e8653aa94e02ebc595ed15d4afad9ec1b1b048fe56281c3f","claims":["C-7469a36b7c78"],"review":"reviewed"}
claims:
  - {"id":"C-e7f898e00ba8","kind":"unclassified","anchor":"- **Record retrieval / existence.** A bare LLM (no verified retrieval/browsing) cannot fetch an actual birth record or confirm a source exists; if pushed, it *invents* one. A tool-enabled assistant that *can* browse may surface a real catalog entry — but treat anything it returns as unverified until you inspect the actual record. Supplying the record makes it genuinely useful, but verify the output against the source even then. (Denyse Allen)\n- **Citations from a bare link.** Citation format depends on source-specific fields (author, source type, publication, access) that a URL alone doesn't carry — supply the fields or the citation will be wrong. (Family Locket & Denyse Allen)\n- **Privacy gate:** <!-- privacy-gate: third-party-tool --> Entering a tree and several matches into WATO puts living matches' cM and tree details into an outside tool; answer the privacy gate in `SKILL.md` first.\n- **cM → relationship odds.** Never ask the LLM to compute relationship probabilities from a cM number — it *fabricates* them. Route a *single* cM figure to the **Shared cM Project / DNA Painter's Shared cM Tool** (point cM → the *range* of candidate relationships); if you have a tree plus multiple matches to place, that's **WATO** — a *different* DNA Painter tool that scores hypothesis slots, not a cM→relationship lookup. Either way, always ask for **all** candidate relationships, never a single point answer. (Half vs full relationships are frequently indistinguishable by cM alone.)\n- **cM as closeness under endogamy.** Endogamy / pedigree collapse **inflates** shared cM, so the same cM implies a closer relationship than reality — the AI has no idea your lines are endogamous unless you tell it, and even then it can't quantify the correction. **Never let an AI add cM across relationship paths as though the paths were independent** — this is **non-additivity**: when a match descends from the same ancestral couple through more than one path (pedigree collapse), the realized shared DNA is the **union** of the paths' identical-by-descent (IBD) regions, so its expected once-counted cM is **at least the strongest single path's expected figure and at most the naive sum**. Those regions can overlap, so the sum is only an *upper bound*, not the expectation, unless disjointness has been established. For an actual figure, route it to a **pedigree-aware kinship / IBD-simulation tool** that states its IBD-counting convention, rather than hand-combining path estimates. Do not apply one maximum-cM cap to every relationship: full siblings and identical twins can share IBD2 regions, and vendors count IBD differently. (Estes, 2024-03-28)\n- **Auto-clustering swallowing genealogically distinct lines.** In a shared-match / in-common-with (ICW) network, a match that bridges two clusters is a genuine edge, not noise, and a clustering algorithm merges the two real family clusters into one. One explanation is a match related to the target through **more than one line** (see the next bullet for the others). Never trust an AI's auto-clustering output blindly; when two clusters look suspiciously fused, the standard fixes are to **raise the cM threshold, sub-cluster, and manually resolve the multi-relationship match**. If you exclude that match to re-cluster on single-line matches, reinstate it afterwards: dropping it loses real signal, and forcing it into a single line repeats the clustering error. Label it **multi-line** once you have identified **both** relationship paths, and where segment data exists, [evaluate each interval separately](#untangle-multiple-paths-without-discarding-the-useful-evidence) and retain unresolved ancestral assignments. (Family Locket, RLP 225, 2022-10-31)\n- **A match that bridges two clusters is not proof of two paths to the tester.** It may descend from both ancestral couples, but it may instead share separate ancestry with members of the other cluster that does not involve the tester, or both clusters may draw on one endogamous population. Until both paths to the tester are documented, do not merge the clusters or label the match as multi-line; record the bridge with all three explanations open. The [linked-cluster discussion](https://www.legacytree.com/blog/myheritage-dna-theories-of-family-relativity) lists these explanations.\n- **Ethnicity estimates as conclusions.** They're probabilistic and re-versioned by vendors; let AI surface *hypotheses* about admixture/migration, never conclude an ancestral origin. (Family Locket, 2026-03) **Never let an AI flag an ethnicity-% discordance as an NPE, and never let it declare \"no NPE\" from ethnicity % either** — ethnicity percentages alone can neither establish nor rule out a non-paternity event (NPE) or a lab problem. A parent/child regional-percentage discordance has two co-existing sources, so do not let an AI dismiss it as \"mostly estimator noise\": (a) the percentages are **model-dependent statistical estimates** (reference panel, category boundaries, algorithm version) that vendors revise over time, and (b) **real biology** — a child inherits only a recombined half of each parent's autosome, so regional proportions are genuinely **not conserved** across a generation even with a perfect estimator. Route the parentage question instead to relationship-specific DNA evidence — not total shared cM alone (parent-child and full-sibling totals overlap), but **total cM plus chromosome coverage plus the IBD1/IBD2 (FIR/HIR) pattern**, evaluated against the competing close-relationship alternatives. Reserve any \"confirms/excludes parentage\" conclusion for **appropriately identified samples**; where it matters, use a purpose-built chain-of-custody parentage test. (Estes, 2017-07-02; Ancestry Support; MyHeritage Help, 2025-11-16)\n- **A kit from a transplant recipient.** Before reading unexpected matches, ethnicity or predicted relationships as misattributed parentage or a sample swap, ask whether the tester has had a bone-marrow or stem-cell transplant. The [transplant remark](https://www.youtube.com/watch?v=1rjrcHOGygI) notes that a consumer kit from such a tester may resemble the donor's DNA. Flag the result as possibly not the tester's own genome. Do not suggest a different consumer sample type as a workaround, and do not use the explanation to dismiss a discrepancy without asking.\n- **Privacy gate:** <!-- privacy-gate: contact --> Asking a documented relative to take a targeted DNA test approaches a living person about a possible parentage question; answer the privacy gate in `SKILL.md` first.\n- **A documented line read as confirmed, or as broken, from the match list alone.** A documented relative's presence among the matches does not confirm the documented relationship: check the amount against both that relationship and its half alternative. An amount more typical of the half relationship opens a possible break on either tester's line, or on both, while the documented full relationship with unusually low sharing stays possible. Work outward one generation at a time, looking for matches through each ancestor's mother and father; matches to descendants of a distant couple do not by themselves confirm every link below it. A proposed line with no matches is not by itself proof of misattributed parentage. It is a clue, and a stronger one when it comes with another anomaly, such as low sharing with a known relative. First record the line's family sizes over several generations, whether it descends from recent immigrants from a population the database samples poorly, and whether its known descendants have tested or attached trees. Test each pattern before declaring a parentage break. For a half-typical amount, check whether the matches shared with that relative include collateral relatives of both proposed common ancestors or of only one. For a line with no matches, target-test a documented relative from that line, such as a descendant of the ancestor's sibling; the result can help confirm or refute a break. Legacy Tree Genealogists' articles on [the half-relationship check](https://www.legacytree.com/blog/using-dna-genealogy-tools-centimorgans), [closest matches](https://www.legacytree.com/blog/how-to-understand-your-closest-autosomal-dna-test-matches), [signs of misattributed parentage](https://www.legacytree.com/?p=80153), [checking a known pedigree](https://www.legacytree.com/blog/6-reasons-why-taking-an-autosomal-dna-test-can-bring-new-insights-into-your-known-ancestry) and [searching match lists](https://www.legacytree.com/blog/searching-sorting-and-filtering-dna-match-lists) motivate these checks.\n- **A tested close cousin who matches your relatives but not you.** First confirm that the comparison exists: both kits are in the same database, both take part in matching, and neither match is hidden. If so, the pattern raises a possible break on either tester's line, and matching your relatives does not localize it. At second cousin or closer, where detectable sharing is near-certain, a confirmed zero is a strong signal that the documented relationship is wrong or that a kit is not its tester's own; beyond that, genuine cousins can share no detectable DNA, so read the missing match only as a clue. Under endogamy, those relatives may also match the cousin through another line. Locate the break with relationship-specific DNA evidence before recording misattributed parentage. The [endogamy talk](https://www.youtube.com/watch?v=xaa5FcbZYb8) names this screen.\n- **DNA-estimated relationships as fact.** A tool's \"estimated relationship\" is a cM-based guess and routinely differs from the real one — AI parroting it will mis-group matches. (Family Locket, Leeds video)\n- **Final evidentiary judgment.** Proof validation is human work; AI drafts, you rule. (Denyse Allen)\n- **Source-type classification without explicit rules.** Ask AI to classify sources as *original / derivative / authored* and it will (a) confuse them with *primary / secondary* (which classify the *information*, a different axis), and (b) invent its own logic — unless you define the rules first. (Family Locket, 2026-03; the framework is Elizabeth Shown Mills methodology, so this is a real, checkable failure mode.)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-68bbae35ba41","kind":"unclassified","anchor":"For a reported region/place discrepancy, retain the provider, result date/version, exact\nlabel and the map or geographic description actually supplied. Check the displayed extent\nbefore comparing the label with a modern country name; unavailable map detail stays\nunavailable. The [Ancestry region-description example](https://www.youtube.com/watch?v=59wkUV3C3iM)\nsupplies this observation step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cb1499fdc06a","kind":"unclassified","anchor":"If the supplied community view includes a Timeline, preserve the selected date interval,\nmap and accompanying narration. Compare its place/time leads with separately documented\nfamily locations, keeping conflicting records and alternative localities in the search\nworklist. The [Journeys example](https://familytreemagazine.com/dna/why-you-should-pay-attention-to-your-ancestrydna-journeys/)\nuses successive time views to suggest where to search records. Tree-fed pins and agreement\nwith a known line are not independent validation or confidence calibration. Treat the\ndisplay as a source of documentary search leads, not proof of a personal migration route,\nbirthplace, parentage or exclusion of an ancestor.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2f54d3c24090","kind":"unclassified","anchor":"- **A documented cousin does not identify the source of every shared segment.** In Lara Diamond's example, her mother's first cousin connected through the maternal grandfather, yet some shared 7–10 cM segments overlapped the maternal grandmother's mapped lines. Other small segments agreed with the documented connection. Preserve the known relationship, but leave ambiguous segments unassigned instead of painting every overlap onto that couple. For Ashkenazi chromosome mapping, Diamond recommends a 10 cM minimum and describes 15 cM as reducing misattribution at the cost of losing some valid segments. These are her mapping heuristics, not universal detection thresholds or proof that a retained segment came from the named couple. (Diamond, 2022-01-30)\n- **Where a parent or grandparent has tested, check each segment's side against that relative.** Treat only a documented cousin's segments that overlap the regions the focal tester shares with that relative as candidates for the documented line, and leave the rest unassigned; a side assigned to one segment does not carry over to the match's other segments. The [grandparent overlay example](https://www.youtube.com/watch?v=JKa92d6na5c) and [multi-segment answer](https://www.youtube.com/watch?v=u0_x0Ce46Gs) motivate this check.\n- **Under endogamy, check both sides before placing a match or reading its total.** A match can share DNA through both the father's and the mother's side, and the sharing from both raises the total. A known cousin's shared match on one side therefore does not settle the side. Before placing the match, check whether it also appears among tested parents or known relatives on the other side. If it does, record both sides as open, and do not read the combined total as one closer relationship. Two JewishGen talks, on [recording genetic genealogy](https://www.youtube.com/watch?v=6FFXukCkV2g) and [confusing results](https://www.youtube.com/watch?v=MBNg19p37iM), describe the pattern.\n- **Use filtered totals to prioritize investigation, not as corrected relationship probabilities.** Keep the original total and segment list; alongside them record the longest segment and a separately labeled total after a chosen minimum-segment filter. Dyer describes 10–15 cM filters for endogamous analysis and ranking by longest segment together with total sharing. Compare which matches remain promising, without treating an excluded segment as disproved. Do not feed the filtered sum into ordinary Shared cM/WATO probabilities as an endogamy correction: filtering changes the input without supplying a matching probability model or eliminating multiple inheritance paths. (Dyer, 2023-01-05; WATO assumptions: `unknown-parentage-wato.md`)\n- **Record average segment length as a labelled screening flag, not a correction.** Where a report gives total cM and segment count, divide the total by the count. Take both from the same report and filter, and store the result beside the vendor's values and the longest segment. Use it only to rank matches within one project for follow-up: under endogamy, many small segments from distant paths pull the mean down. It does not replace an available longest segment or feed Shared cM/WATO probabilities, and a high average does not rule out multiple paths. The [presenter's 10 cM rule of thumb](https://www.youtube.com/watch?v=k88TGwqAJlU) and the [average-segment answer](https://www.youtube.com/watch?v=LkWh21CIHes) supply the screen.\n- **A found distant path does not explain a long segment.** Suppose a tree search finds a distant documented connection to a match whose longest segment is long. Keep searching for a more recent shared ancestor rather than letting 'endogamy' explain away the difference. Endogamy can raise totals and occasionally preserve a long segment, so keep the distant path on record while you search. The [presenter's example](https://www.youtube.com/watch?v=MJu82Zub5Ag) (385 cM, 60 cM longest, a seventh-cousin path) motivates this step.\n- **Privacy gate:** <!-- privacy-gate: contact --> Approaching a living descendant for targeted testing shares the research question and asks for their DNA; answer the privacy gate in `SKILL.md` first.\n- **Look for a documented descendant whose later branch married outside the community.** Dyer relays Paul Woodbury's term *genetic pioneers*: such a branch can help distinguish the target connection from competing endogamous sharing. Select by documented descent, not a low ethnicity percentage. Weigh that advantage against generational distance and the chance the descendant inherited useful DNA; do not automatically prefer a much more distant tester. This is a targeted-testing lead, not certification of a single relationship path or restored WATO assumptions. General coverage across relatives belongs to `unknown-parentage-wato.md`; small-segment validity and pileup checks belong to `xdna-phasing-judgment.md`. (Dyer, 2023-01-05)\n- **Locate the multi-path source before discounting.** A recent double relationship or pedigree collapse strongly raises sharing for an identifiable set of matches traceable to a specific couple. Population endogamy raises sharing broadly. Tell the two apart. Also record which ancestral line carries the endogamous origin. When only one parent's or grandparent's line is affected, matches placed on the other lines need not carry that caution, but establish the placement first. Neither label supplies a numeric correction (see the non-additivity bullet above). The [presenter's distinction](https://www.youtube.com/watch?v=-oxvx5DrcmQ) draws this line.\n- **For an Ashkenazi pair, also read the total against an endogamous reference, and keep its limit.** The Shared cM Project's ranges come from a general population. Lara Diamond's Ashkenazi DNA survey collects shared cM for documented relationships, in separate tables by the two testers' Ashkenazi fractions (for example both fully Ashkenazi, or one fully and one half). Record which table fits the pair, read its ranges as observed sample values (see the range check under predictor outputs below), and keep the candidates from each reference labelled side by side. Do not turn its excess over the Shared cM Project into a correction factor: the submissions are self-reported and sparse at distant relationships. A population table describes general endogamy, not a specific recent collapse. Where the testers' parents or grandparents were first cousins or otherwise doubly related, model those paths in a pedigree-aware tool (non-additivity above). Two JewishGen talks, on [overcoming endogamy](https://www.youtube.com/watch?v=xaa5FcbZYb8) and [recording genetic genealogy](https://www.youtube.com/watch?v=6FFXukCkV2g), describe the tables and this limit.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7cb19ca9218","kind":"unclassified","anchor":"**Record each clustering run's settings with its roster.** For endogamous auto-clustering, three filters can break up one giant cluster: average segment size (total ÷ count from one report), a minimum largest segment, and a minimum sharing among the shared matches themselves ([endogamy clustering walkthrough](https://www.youtube.com/watch?v=x-eIdnER5uk)). Membership shifts between threshold runs ([threshold demonstration](https://www.youtube.com/watch?v=lTboZ5q10Nk)), so store each run's preset or thresholds and keep runs as separate views. Where a vendor reports [weighted and unweighted totals](https://www.youtube.com/watch?v=R0Vfw_RjKzM), keep both. A close relative such as a half-uncle may exceed the tool's upper cM limit. Cluster that relative's shared-match list on its own rather than raising the ceiling, which tends to yield large, sparse clusters ([AutoKinship Q&A](https://www.youtube.com/watch?v=LnZ13VCkRfc)). Presets and limits are heuristics or tool defaults, and a smaller cluster is not more correct. Subclusters remain shared-match groupings that may connect through another path.\n4. **Use secondary matches to check the primary match's tree.** A person sharing little DNA with the focal tester but much more with a key cousin may help distinguish that cousin's maternal and paternal branches. Give the person the role “validate cousin's pedigree,” rather than demanding strong focal sharing or counting them as another confirmation of the focal hypothesis. In *Power-Up Your DNA Analyses*, comparisons among testers exposed a skipped generation and descent through a different wife. Check such patterns against documents and other pairs before changing a tree; one unusual pair is not a pedigree verdict. In *Struggles with Smithville*, the author also retained documented branch anchors below the chosen clustering cutoff. Audit which known anchors an automated cluster omits and which new members lack a documented place. (The DNA Geek, 2024-07-01; 2025-10-30)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f5b5a96303b","kind":"unclassified","anchor":"**Check a match's tree one branch point at a time.** Find other tested descendants on that tree and compare each pair's shared cM with the relationship their trees imply, recording the result per branch point rather than for the whole tree. A fit is consistent with the two connecting at about that generation. It does not rule out the other relationships the same total allows, and it does not show that the named ancestor is the right person; check the names against records. The [branch-point walkthrough](https://www.youtube.com/watch?v=D9rSab4b9EI) shows the method.\n5. **Use fully identical regions to test a documented double relationship or a total that fits several close relationships.** When a match is recorded as related through both parents, check whether the total and, where reported, the fully identical (IBD2) regions fit both paths. Do not explain a low total away. A fit to only one path is a reason to re-examine the documents, not proof that a link is wrong. Where one total fits half siblings, double first cousins and three-quarter siblings, the patterns differ: half siblings should show no sustained fully identical regions, double first cousins usually some, and three-quarter siblings more and often larger ones on a higher total. Get expected figures from a pedigree-aware tool (non-additivity above); pedigree collapse or endogamy can add IBD2. The [double first cousin answer](https://www.youtube.com/watch?v=ZmxhJsw6R-I), [three-quarter sibling explanation](https://www.youtube.com/watch?v=P6dnJ2CoCXE) and [half-sibling comparison](https://www.youtube.com/watch?v=g9CL2JK6aEU) set out these patterns.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5b2607e13e80","kind":"unclassified","anchor":"Before deriving expected sharing or pedigree collapse, label each parent link biological, adoptive/step or unknown. A cousin path through an adoptive parent predicts no shared DNA, and spouses related only through an adoption add no collapse ([Tanner's adoption example](https://www.youtube.com/watch?v=KmUK-Xpx55o) reports no DNA comparison, so a documented adoption removes an expected path; it is not DNA evidence). Model independently established identical twins as one genetic person with several partners. Descendants of different twins then share like half-relatives one degree closer: second cousins are genetically like half first cousins. Keep the documentary label and record the genetic equivalent used. The [twin example](https://www.youtube.com/watch?v=AH9B2ySZLUA) concerns identical twins only, and the presenter notes the effect becomes hard to see at more distant levels. A sharing excess is not evidence of twinning.\n2. **Keep each pair's measurements together.** Record the selected kit pair, source, result date/version, genome build, chromosome scope and known detection/reporting filters alongside autosomal total cM, segment count, largest segment and the length list when available. Keep X separate. Do not join an imported total to another kit's, filter's or older run's longest segment. Distinguish an unavailable/uncomputed comparison, an empty source-limited segment view, a computed result with no segments meeting the stated filter, and an X-only result. Unknown values stay unknown. A setting called “endogamy” does not establish the filter used for a stored result; read that result’s available filter metadata.\n3. **Compare the same match across relatives.** Inspect the full segment pattern, including informative longer tracts in an older relative or sibling that are shorter or absent in the focal descendant. A descendant need not inherit that tract; absence from a display may also reflect coverage or filtering. Do not exclude a branch from that absence alone. Check that coordinates are comparable; require transmission/phase evidence before calling overlaps the same inherited tract. Until then, label the shared inheritance unresolved. Treat confirmed copies of one inherited tract in relatives as dependent evidence. A long segment or a documented cousin still does not assign it to a particular ancestral couple. Many short segments and a high total neither quantify a probability of endogamy nor rule out a real distant connection.\n4. **Require a coherent placement for the related people.** Full siblings must retain the same parents; a niece/nephew's extra generation must follow the correct sibling. Reject combinations of individually high-ranked placements that violate those known links. Use a joint pedigree-aware model only if it supports the case’s endogamy, actual multiple paths and dependencies; check its documented assumptions and output. If unavailable, compare explicit family hypotheses qualitatively. Do not multiply separate pair/run probabilities, invent a long-segment bonus, shift every relationship one category outward, or impose a universal generation cutoff. A displayed largest segment is not evidence that the scorer uses it: inspect the scoring contract or component output for that analysis run and report an unavailable contribution as unknown. WATO's selection and model limits remain in `unknown-parentage-wato.md`; a family inventory does not make its assumptions hold.\n5. **Preserve the baseline and test what drives the result.** In separate analysis copies, compare the full observed family, omission of one counterpart branch, and views emphasizing tested ancestors versus descendants. Keep multiply descended people labeled with every path: removing a branch must not silently turn them into single-path testers. Record the included people, kits, filters, candidate set and model for each view. These are sensitivity checks, not independent replications. Explain what changes when evidence is withheld, including lost coverage; do not pick the subset merely because it favors the preferred answer. Relative ranks or percentages from different candidate/cohort sets are not directly comparable probabilities.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6a2b9871af90","kind":"unclassified","anchor":"Build the comparison roster from the union of the selected relatives' own source-labelled\nmatch shortlists, rather than only the focal tester's largest match in each descendant branch.\nDeduplicate repeated person/kit entries while retaining distinct assays, which tester nominated\neach candidate and unavailable pairs. Then apply the same family and pair controls above.\nThe [relative-shortlist example](https://familylocket.com/rlp-206-proving-a-parent-child-link-using-ancestry-thrulines-part-3/)\nsupplies this selection tactic; several relatives nominating one candidate do not create\nindependent confirmations or waive WATO's assumptions.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cd1b10385da0","kind":"unclassified","anchor":"For a question about recurrence across the research ancestor's documented child branches, an\noptional working view can list candidates nominated by testers in at least two of those\nbranches. Keep the full union, single-branch candidates and unavailable pairs; a candidate seen\nthrough only one tester can still be relevant. Recurrence orders documentary checks; it\nneither proves the ancestor nor counts as independent evidence. The [multi-tester comparison](https://familylocket.com/rlp-248-rlp-with-dna-10-research-logs/)\nand [Dyer project](https://familylocket.com/rlp-251-florence-matilda-creer-a-favorite-photo/)\nexamples motivate this view.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-31e04d77d2a0","kind":"unclassified","anchor":"**Check that sharing is coherent down the generations.** Sometimes a tester shares clearly more with a match than the parent or grandparent on whose side the match was placed. If so, do not keep the placement by default. First confirm that both figures share a reporting basis: sites differ in whether they phase against tested parents, and Ancestry's weighted and unweighted amounts can differ. Then look for the match in the other parent's list. If it appears there, record a possible second path without assigning the whole amount to either side. A small excess may be an anomaly, and known cousins can show the pattern. The [live answer](https://www.youtube.com/watch?v=ohRdRpBm-qY) and [other-parent example](https://www.youtube.com/watch?v=xv62kjXVi3g) describe this check. Appearing in both lists does not identify or measure the second path.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aad975bf8510","kind":"unclassified","anchor":"Keep the exact pair, provider/version, input quantity and any ages actually used with each\nsupplied result. Compare equivalent relationship groups: a grouped prediction and a specific\nage-conditioned label have different resolution. If the relationship is independently\ndocumented, record whether it is included and its reported probability, including omission;\notherwise report disagreement only. Omission is not biological exclusion, and related models\ndo not supply independent confirmations. The [predictor comparison](https://thednageek.com/the-award-for-best-relationship-predictor-goes-to/)\nmotivates manual output reconciliation, not a reproduced benchmark, ranking or calibration claim.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1e19b64e6b6b","kind":"unclassified","anchor":"Before entering an Ancestry total into a Shared cM or other relationship-probability tool, record whether it is the weighted (Timber-adjusted) or unweighted amount. When both are available and differ, run each and keep both candidate ranges labelled by input. Flag any weighted total smaller than that match's reported longest segment as an internal inconsistency; do not treat that weighted total as a corrected figure. The [weighted-versus-unweighted comparison](https://genarchivist.net/showthread.php?tid=137) is the source for this check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2d30ff45908d","kind":"unclassified","anchor":"When birth years are used to choose between relationships with overlapping cM, such as half-aunt versus first cousin, first identify whether each uncertain link passes through a mother or a father. Allow a much wider span of birth years on paternal links: a father's children can be born decades apart, so a paternal route can be off by more than one generation. The [presenter's age screen](https://www.youtube.com/watch?v=o8Mc7UsnTzE) is the source for this screen. Use age as a plausibility screen only: it never establishes a placement, and it should not exclude a paternal-route option on a fixed generation length.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e32529bf23ed","kind":"unclassified","anchor":"Before using a reported cM range to exclude a relationship, identify what the range describes:\nobserved sample values or an interval/limit from a named model. Retain the release, relationship\ncategory, sample count and inclusion definition when supplied; leave unavailable definitions\nunknown. A sample maximum alone does not establish a biological impossibility. Reopen an\nexclusion based only on that maximum and keep the candidate unresolved while checking an\napplicable model or discriminating documentary evidence. The\n[historical correction example](https://www.youtube.com/watch?v=aTlE-Y33G-k)\nmotivates this check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f9c4a9869790","kind":"unclassified","anchor":"If the supplied comparison spans a probability/model revision, preserve the dated original\noutputs and separate the versions. Where available and authorized, compare the same retained\ninputs under the revised version; otherwise mark earlier rows unavailable for that comparison\nwhile retaining them in the research record. Do not pool them as an unchanged model.\nThe [reported mid-comparison revision](https://thednageek.com/the-relationship-predictor-comparison-a-first-peek/)\nsupplies this trigger, without authorizing a new benchmark or establishing a provider ranking.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3b9d71009b97","kind":"unclassified","anchor":"For a close match, record segment count with total cM, both from the same kit pair and report. Within roughly first-cousin distance, more segments at the same total lean toward a route through a female line, because female meioses recombine more. Give both numbers to a sex-specific-recombination tool, such as the SegCM tool from DNA Sci that the presenters use, rather than letting the LLM estimate the route. Record the output as a tool-labelled ranking of candidate routes with its inputs, not as the side the match is on. Do not apply it to more distant relationships, and do not combine a count from a different report or filter with this total. The [demonstration](https://www.youtube.com/watch?v=DRQpINI26FU) and [SegCM walkthrough](https://www.youtube.com/watch?v=tOKJ0eVgrPQ) show the method.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bff614f2bace","kind":"unclassified","anchor":"When a supplied tool reports one estimated number of generations to the most recent common ancestor, as GEDmatch does, read it as an average over both testers, not each tester's own distance. Doubling it gives an approximate combined path length. List the splits that fit, including unequal ones (for 4.6, roughly 2+7, 3+6 or 4+5) before comparing it with the documented pedigree. The [generations-to-ancestor discussion](https://forum.molgen.org/index.php/topic,1298.0.html) includes a documented case the estimate placed closer than reality. Treat the value as an estimate: it identifies no split and neither confirms nor excludes a documented route.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b48936ef626a","kind":"unclassified","anchor":"When comparable supplied mismatches repeatedly centre on one person, audit the entered\ngeneration and parent/spouse paths against documents before interpreting a biological\ndiscrepancy. Correct only a supported input error, retain the old inputs/results and correction\nbasis, and compare the revised version separately. Do not edit a pedigree to improve fit or\nadopt a model's SD/trial count as a universal threshold. This applies the\n[person-centred input example](https://thednageek.com/power-up-your-dna-analyses/) within the\nexisting coherent-placement and baseline rules above.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ceda674c1fd7","kind":"unclassified","anchor":"When a tool supplies several generated trees ranked by odds, as in the [AutoKinship walkthrough](https://www.youtube.com/watch?v=LnZ13VCkRfc), keep every tree with its rank, odds and run inputs, and record which documented link excludes any rejected tree. A surviving lower-ranked tree is a research hypothesis, not a confirmed placement.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-370ecd403e88","kind":"unclassified","anchor":"Before interpreting a supplied two-tester relationship view, check that its stated input\ncontract fits the proposed pedigree. The [Shared cM example](https://www.yourdnaguide.com/ydgblog/shared-cm-project)\nrequires both testers to have the same genealogical relationship and generational offset to\nthe mystery person. Retain each actual pair measurement, including a reported zero distinct\nfrom unavailable or below-floor data. A zero-to-one plotting workaround belongs only in a\nlabelled display copy; it cannot replace the measured zero in evidence or likelihood inputs.\nThis input check supplies neither a joint probability model nor a biological exclusion.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ee82278c5e29","kind":"unclassified","anchor":"Treat each ethnicity readout as one kit measured under one dated model. Record the provider, whether the kit is native or uploaded from another vendor, the algorithm version, any active confidence setting and the provider's own region labels. A native test and an upload of the same person can differ on one platform, and a version or setting change is not new ancestry evidence. Before calling two readouts discordant, map nested or differently named regions onto each other. Phrase results as DNA shared with a reference population, not an ancestral country. When an update says a category 'split into' new regions, keep old and new values as separate observations; do not redistribute the old percentage arithmetically. The [upload-versus-native comparison](https://www.youtube.com/watch?v=hw1YmGKAwOw), [cross-provider label comparison](https://www.youtube.com/watch?v=alx8-1I7Ato) and [version-change review](https://www.youtube.com/watch?v=_Qzi6THU1jM) motivate this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f524f64b572","kind":"unclassified","anchor":"**Keep the displayed range with the headline percentage.** Where a provider shows a range for a region, record it beside the most-likely value from the same result version. Also note any segment the chromosome view leaves unassigned. A range reaching zero means that version's model does not rule out the region being absent. Before calling it impossible for a child to show a larger share than the transmitting parent, compare the two ranges. If the same person has a second kit on that platform, record its score and range as a sign of run-to-run variation. Point differences inside wide, overlapping ranges stay unresolved; they do not by themselves show an inheritance error or hidden ancestry. A region missing from the list is not a measured zero, because small components may be hidden. The [range-comparison report](https://genarchivist.net/showthread.php?tid=852), [region-range discussion](https://genarchivist.net/showthread.php?tid=76) and [duplicate-kit comparison](https://genarchivist.net/showthread.php?tid=954) are user reports.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8e1199cba274","kind":"unclassified","anchor":"**A parent-side split or ethnicity painting is not phasing.** A phased per-parent view estimates the half each parent passed on, not that parent's own estimate. Where sides are labelled only parent 1 and parent 2, do not name mother and father from the view itself. Before using a painted region or side assignment to place a segment or match, compare it with each tested parent's or grandparent's own result from the same provider. Record any region put on a side that person's result does not support, comparing presence rather than percentages. Overlap with a side-specific relative's segment is only an indication. In one [resubmitted-sample answer](https://www.youtube.com/watch?v=QVx5JDd9E8s), the same DNA got a different parental division. Consistent splits across tested full siblings are better support, but not proof. The [painter check](https://www.youtube.com/watch?v=6v3WMsOdZ-g), [parent-kit check](https://www.youtube.com/watch?v=huP99-Ry0lM), [family side-view check](https://www.youtube.com/watch?v=fVmFXH9y2sI), [overlap caution](https://www.youtube.com/watch?v=Gj-aDOUv2Y4) and [phased-view review](https://www.youtube.com/watch?v=Ez0wg_JcjC0) support these checks.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3bee86d36ba3","kind":"unclassified","anchor":"**Use a confirmed parent's estimate as an arithmetic control, not an origin finding.** This applies where parent and child have results from the same provider and model version, and parentage is established by relationship-specific DNA (see the 'Ethnicity estimates as conclusions' bullet above). The child carries about half the parent's genome. A category at P% in the parent therefore implies roughly at least P − 50% in the child. A child or sibling far below that floor shows that one or both estimates are inconsistent. It does not identify which estimate is wrong, give true proportions or bear on parentage. Small shortfalls are within approximation. The [parent-child MyOrigins comparison](https://genarchivist.net/showthread.php?tid=146) and [sibling floor calculation](https://genarchivist.net/showthread.php?tid=140) motivate this check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-57886c508a72","kind":"unclassified","anchor":"Where a grandparent has also tested, run the painting check interval by interval. Use the grandparent–grandchild one-to-one segments to mark which intervals of the child's copy from the intermediate parent came from that grandparent. Then compare the child's painted label on each interval with the label painted on the same grandparent-side copy of the parent. A [chromosome-by-chromosome painting audit](https://genarchivist.net/showthread.php?tid=954) found transmitted intervals relabelled and regions painted with no matching source copy. Record each mismatch as a painting or phasing inconsistency, not new ancestry. The parent's copy labels are themselves inferred, so a mismatch does not show which label is right.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6c66eff5ae98","kind":"unclassified","anchor":"**Keep community and Journey assignments apart from region percentages and from matches' communities.** Label each observation with the product that produced it. A Journey for a place whose region percentage is missing, or the reverse, is not by itself a contradiction. A list of communities common among the closest matches describes those matches; do not add it to the tester's own result. Before relying on a community parent tab, compare it with tested parents or children and with close matches documented on each side. Record any community a child holds that neither tested parent shows. Save each dated assignment set: a community dropped or renamed in an update may reflect changed criteria, not evidence against the paper trail. The [parent-split discussion](https://genarchivist.net/showthread.php?tid=519), [UK community update thread](https://genarchivist.net/showthread.php?tid=661) and [Journeys-versus-regions discussion](https://genarchivist.net/showthread.php?tid=1629) report such anomalies. Neither product confirms the other or establishes an origin.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d4f4a0795264","kind":"unclassified","anchor":"**Read an unexpected community assignment as two hypotheses.** Community, group and recent-location assignments rest on DNA shared with other testers, though not in the same way: AncestryDNA builds communities from the network of matches among its testers, while MyHeritage defines Genetic Groups from reference kits of known origin (for 23andMe's displays, see recipe 7 of [23andme-match-research](23andme-match-research.md)). Either way, an unexpected assignment can come from relatives who left the region, by emigration or forced removal: a tester in the origin country may be grouped with those relatives' descendants abroad although the tester's own ancestors never lived there. It can also come from misattributed recent ancestry. Keep both open. Where the provider lets you list the matches who share the assignment, check their documented lines. Route any parentage question to relationship-specific DNA evidence (see the 'Ethnicity estimates as conclusions' bullet above). The [admixture introduction](https://www.legacytree.com/blog/introduction-to-genetic-admixture) names both hypotheses; the [communities white paper](https://www.ancestrycdn.com/support/us/2024/02/communitieswhitepaper2024.pdf) and [Genetic Groups page](https://education.myheritage.com/article/genetic-groups-on-myheritage/) describe the two providers' methods.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e6c139ae3c90","kind":"unclassified","anchor":"**Trace a region through matches, not the label or percentage.** An expected population missing from an estimate does not disprove it, and no estimate establishes descent from a tribe or community; documents do. Look for matches with substantial ancestry from the region whose trees converge on one couple, or who also match a documented cousin. That shared couple's branch becomes the research lead. A trace (~1%) region with no such cluster may simply be wrong. Absence among one line's relatives is only a soft clue. Mark branches without placed matches as untested. Recurrence among related cousins is dependent evidence, and under endogamy shared matches may point to several lines. Suggest Y-DNA or mtDNA only for an all-male or all-female path. The [shared-cousin example](https://www.youtube.com/watch?v=t3D0iReQG_s), [region-sharing example](https://www.youtube.com/watch?v=e3ixxQev7YQ), [trace-ancestry answer](https://www.youtube.com/watch?v=SBtWjTCpPpo), [relatives check](https://www.youtube.com/watch?v=i3fuhnRtg5I), [sibling-line screen](https://www.youtube.com/watch?v=7IdlI59m8YI) and [negative-evidence caution](https://www.youtube.com/watch?v=vtICddQnrbU) motivate this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-112e412a6dd5","kind":"unclassified","anchor":"**Use matches overlapping the painted segment, not a match's displayed breakdown.** A match's ethnicity breakdown, or the populations you have in common, is that match's own estimate, not the makeup of the shared DNA. Do not place a match on a parent's side because its breakdown fits that parent's population. Where a provider paints a small region onto segments, record their coordinates and build. Then ask which matches overlap exactly there, on any platform that shows segment data. If those matches' documented ancestry points to one population, that is a lead on the segment's source. Overlap does not show shared descent on the same parental copy, and under endogamy many matches can share a segment through population background. The [segment-located match example](https://genarchivist.net/showthread.php?tid=1065) is one family's anecdote. The [match-ethnicity correction](https://forum.molgen.org/index.php/topic,1298.0.html) shows that a breakdown neither excludes a side nor identifies the shared segment.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-85a1c4ada476","kind":"unclassified","anchor":"Do not turn a small ethnicity percentage into one ancestor at one generation. First list the alternatives: misassignment from a closely related reference population, a false positive, and several distant contributors whose shares add up. If one recent source is plausible, keep a generation range. For multi-ancestor hypotheses, bound the total by adding each ancestor's low and high inheritance values, not averages. A 2020 review of a 23andMe timeline reads its 'most recent ancestor' generation as a wide date window resting on a fixed generation length; check the current display. The output only chooses which pedigree generations to complete; it places no ancestor. The [multiple-ancestor ranges](https://www.youtube.com/watch?v=gThnugZcEUc), [3% answer](https://www.youtube.com/watch?v=MlsU45miWKA), [6% example](https://www.youtube.com/watch?v=CPkieGCVhd0) and [timeline critique](https://www.youtube.com/watch?v=-mZSGxxs5-0) motivate this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d0731a5ce64f","kind":"unclassified","anchor":"**Read the painting before the label.** A component may carry different names across vendors, versions, or a parent and child. Before calling the results conflicting, compare its painted chromosome location with the vendor's earlier labels for it, and record provider, version and label against that segment. For an unexpected component, note whether it sits on a few segments or fills whole or half chromosomes, and whether its range starts at zero. One discussion read whole-chromosome blocks as smoothing that filled stretches with no better assignment, while the broader group might still be right. Test the region through matches as above. The [cross-vendor painting comparison](https://genarchivist.net/showthread.php?tid=954), [parent–child relabelling example](https://genarchivist.net/showthread.php?tid=76) and [ethnicity-update discussion](https://genarchivist.net/showthread.php?tid=1629) are the sources for these checks. A shared location shows neither which label is right nor where an ancestor came from, and a high lower bound does not prove a subgroup.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f9a40ad0b25a","kind":"unclassified","anchor":"- Confidently wrong on dates/names/places, and it may *argue* when corrected.\n- Loses track across a long multi-turn session.\n- Treats a DNA-estimated relationship as the real one; ignores endogamy inflating cM.\n- Conflates *original/derivative/authored* (source type) with *primary/secondary* (information type).\n- Fabricates citations/records when it lacks the underlying fields.\n- Silently resolves an ambiguous compound relationship phrase. A chain such as \"my maternal paternal great-grandfather\" can be parsed starting from different parents. Before computing a relationship or expected sharing, state which reading the analysis assumes. Where the readings diverge, draw or describe each one and ask the user to confirm. The [presenter's double-relationship walkthrough](https://www.youtube.com/watch?v=BCvednIm-24) names this ambiguity. Do not choose the reading that best fits the DNA.\n- Assigns a match to a line because its tree carries one of the user's surnames or places, even a rare one. The shared DNA can come through a different common couple. Keep the search hit as a lead, check whether the match also shares with documented cousins on that line before attributing it, and treat that overlap as support, not proof. The [match-list search caution](https://www.legacytree.com/blog/searching-sorting-and-filtering-dna-match-lists) names this confirmation bias.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2c97066b8cbd","kind":"unclassified","anchor":"Inspect the actual calculation, table or screenshot intended for the recipient: masking names\nin a tree view need not mask generated output. Keep the private original and the separately\nredacted derivative distinct. The [dated Banyan output example](https://www.yourdnaguide.com/ydgblog/banyandna)\nsupplies this verification trigger; it does not validate current controls or anonymity.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3684cc7aeda3","kind":"unclassified","anchor":"**Privacy gate:** <!-- privacy-gate: contact --> Consent to analyze a match does not cover\nnaming that person in a shared or published report; answer the privacy gate in `SKILL.md`\nbefore asking for that permission. When the researcher asks, state the documented or\nhypothesized connection with its uncertainty, how the name or data will appear and where the report will be shared; leave out\nsensitive findings about other people, such as unexpected parentage. Offer an excerpt limited\nto that person's own data or a redacted preview. Record the actual response and any limits\nwith that report version. No reply is not permission: anonymize or omit instead. The [permission-request example](https://familylocket.com/rlp-250-rlp-with-dna-12-whats-next/)\nsupplies this preparation step; it does not settle legal sufficiency or guarantee anonymity.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7469a36b7c78","kind":"method","anchor":"Before reading matches through a couple, research the couple's collateral marriages, especially for a family that stayed in one small area for generations. Check whether husband and wife were related to each other, and whether the husband's siblings married the wife's siblings or cousins. A match descending from such a marriage can share DNA with the tester through two lines, and until those marriages are in the paper tree the second path stays invisible (Neill, Genealogy Tip of the Day, 2023-04-11 [N95]). Build complete trees for the matches as well and check them for a second shared couple (Elder, Family Locket, 2022-09-02 [N96]).","sources":["N95","N96"],"checked":null,"stated_as":"fact","review":"reviewed"}
