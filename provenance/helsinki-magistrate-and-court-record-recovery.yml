claims:
  - {"id":"C-01","kind":"custody","anchor":"Use the name index to obtain a locator and read the minute for the decision. For a business permission, trading right or building decision, use Helsinki City Archives’ Sinetti listing for *Hakemistot maistraatin pöytäkirjoihin 1809–1874* and its separate *Helsingin maistraatin pöytäkirjat*. Check the person, place and subject indexes. Search under the spouse’s surname as well when the subject is a married woman. Check the separate Berndt Aminoff alphabetical person cards and follow their references to the underlying notes or minutes. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S1","S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"For an apparent burgher admission in a seamen’s house roll, search the digitized *Helsingin merimieshuoneen asiakirjat* by name in the relevant roll. Check the apparent admission year in the magistrate index, then the minutes for an actual grant. A later appearance in the sailor roll can conflict with death evidence, so compare the person’s parish entry and dated newspaper notice before extending the timeline. [S1 @2026-11-22] [S5 @2026-11-22]","sources":["S1","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Carry the date, section number and subject from the petition index or lease advertisement into the magistrate minute. Follow its references to earlier entries and then the follow-up decision, including the survey order or guarantee review when named. Read separately filed attachments for the petition and earlier transactions. Keep an earlier purchase bounded by the minute date when no transaction date is given and carry any competing parcel readings forward. [S1] [S4] [S6] [S7]","sources":["S1","S4","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"custody","anchor":"If a Helsinki estate inventory is unexpectedly sparse, check the town court’s alphabetical bankruptcy index for a separate proceeding. Use a hit to open the bankruptcy papers and verify identity, chronology and the assets involved. [S1 @2026-11-22] [S6 @2026-11-22]","sources":["S1","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Search *Inrikes Tidningar* for a dated notice of an absent spouse. Record the last-seen information and any order cited. If the notice names Helsinki’s *kämnerinoikeus*, use the minute register and the date and section in the notice to find the pages, then open the minutes and any *allegaatit* (attachments). Read them for the place and date of marriage, children, testimony and any certificate about when the spouse left. Keep the summons, the court’s authorization and any eventual dissolution as distinct findings. If a record names a cathedral chapter and decision date, follow that locator to the chapter’s decision. [S1] [S8]","sources":["S1","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
