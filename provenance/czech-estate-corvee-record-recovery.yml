claims:
  - {"id":"C-estate-series","kind":"method","anchor":"Find the *panství* that administered the village on the record date. In its inventory, check *urbáře* for duties assessed on an individual holding. Read the heading to distinguish a village total from a named household. Use a *gruntovnice* or *purkrechtní registra* to test who held the property at the relevant date [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-labor-series","kind":"method","anchor":"Search *robotní seznamy* for assessments or worker lists and *robotní rejstříky* for work entries. Open any commutation or exemption papers separately. For example, the Rokycany town fonds, part I, lists the 1760 laborers’ list as 926/9, E 96, unit N 791, and the 1775–1784 redemption files as 926/5, E 47, unit N 784. Use the heading and dates to tell which record measures the duty and which records a change to it [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-patent-scope","kind":"historical","anchor":"Choose the territorial patent by the location of the holding. The Bohemian patent is dated 13 August 1775 and the Moravian patent 7 September 1775. Check the estate’s dated material for when the schedule was applied. Look for earlier labor lists when the holding predates the patent [S1], [S3], [S5], [S6].","sources":["S1","S3","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-assessment","kind":"method","anchor":"Record a patent’s schedule, an estate’s assessment and the work actually performed as three separate observations. In an assessment, copy the category of holding or applicable tax bracket, the unit and period of the duty, and any requirement for draft animals. Check whether the holding kept the former terms or adopted the new schedule. The Moravian text distinguishes, for example, 13 days per year for a qualifying *podruh* from weekly obligations for assessed holdings and additional seasonal work in some cases [S1], [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-hours","kind":"historical","anchor":"For the Moravian schedule as reproduced for Šebetov, read October through March as eight hours and April through September as twelve hours per day, with breaks included. Preserve the entry’s actual days or hours separately and keep any commutation or additional seasonal work in its own field [S1], [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
