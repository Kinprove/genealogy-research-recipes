claims:
  - {"id":"C-001","kind":"historical","anchor":"Look for the Historical Records Survey’s *Inventory of the County Archives* under the state and county name. Match the county seat and volume number when supplied. [S4] If a published inventory cannot be identified, use the survey’s project records in RG 69, section 69.5.6, to investigate what work the survey did for the county. [S2]","sources":["S4","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-002","kind":"method","anchor":"According to the presenter, check FamilySearch when a printed copy is unavailable. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-003","kind":"platform-ui","anchor":"Search the FamilySearch Catalog by county and by the inventory title. Check the format and access indicators for the edition you find. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-004","kind":"method","anchor":"For Lucas County, Ohio, use *Inventory of the County Archives of Ohio*, no. 48, *Lucas County (Toledo)* (1937), with Jana Sloan Broglin’s *Additions and Corrections to the W.P.A. Inventory of Lucas County, Ohio: Toledo*. Compare entries for the target series and keep the locator for each edition you use. [S4] [S5]","sources":["S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-005","kind":"method","anchor":"Treat the WPA entry as evidence about the survey date. Copy its series title, entry number, earliest and latest years listed, creating office and recorded location where given. Use those fields to search current county and state catalogs. Keep the historical location as its own field and establish present custody separately. [S2] [S6]","sources":["S2","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-006","kind":"method","anchor":"According to the presenter, start with the clerk for an inventory entry. [S1†] If it names another creating office, start with that office or its successor. Use [state archives county-records guides](state-archives-county-records-guides.md) to check for transfers, copies or a different series title. [S6]","sources":["S1","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-007","kind":"method","anchor":"If the catalogs leave custody unresolved, ask the county office named by the inventory or its successor about the series and any transfer. Send the series title, inventory entry number, survey date and record date range. A series-level inquiry can proceed without naming the person under research. [S6]","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
