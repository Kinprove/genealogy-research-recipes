claims:
  - {"id":"C-bcebf02d2fd6","kind":"method","anchor":"For a priest's ordination, search *registros de órdenes sacerdotales* and carry the name and date into the named individual's *expediente de órdenes* where one survives. Extract the grade of order and any education or duties explicitly given. Check the separate title or licences book for permission to serve. The Córdoba study found ordinations absent from the orders book and consulted the clergy register and individual files for that gap. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dcbfd742ba1b","kind":"method","anchor":"For a diocesan mission, use *registros de misioneros* in the diocesan or relevant order's holdings. Match the named person to the stated destination and preserve the assignment wording. Use the dated assignment to choose a place to search for evidence of actual service. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-840d918a9116","kind":"portal-availability","anchor":"For someone who took vows, look for *registros de tomas de hábito y profesión* in the order's or convent's archive and distinguish taking the habit from profession. Copy any education or duties as recorded. For San José de las Carmelitas Descalzas in Córdoba, Argentina, search Javier Berdini's published profession-book index and follow the entry back to the convent book. [S2 @2026-11-22] [S4 @2026-11-22]","sources":["S2","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fbc319790b93","kind":"method","anchor":"In the Mérida–Badajoz *estadísticas generales del clero*, look for the person's name, studies and licences alongside the parish, *dotación de fábrica* and archpriest district. In the paired population figures described for those returns, record *vecinos* as family units and *almas* as individuals. Use the latter when comparing any clergy headcount with the lay population and verify the time and place match. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
