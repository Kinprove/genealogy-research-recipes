sources:
  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2025/10/myheritage-upgrades-its-dna-tests-to-whole-genome-sequencing/"],"published":"2025-10-17","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the launch announcement for the 2× implementation, imputation, file header and retesting scenarios. Current provider help supersedes the announcement’s forecast for CRAM availability and the dated terms for BioBank.","entry_sha256":"fdf813b25b363de4a426ffaf66f2f29181b68e1943c6fb4d9398c1c1f46078ee","claims":["C-01","C-02","C-03","C-04","C-05"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12851869-how-do-i-download-my-raw-dna-data-file-or-cram-file-from-myheritage"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Current provider help distinguishes the regular raw file and WGS-only CRAM and explains the two download routes.","entry_sha256":"de939efb1af764db86f9028b93fb937d6e24fd7a252692454e2f1bba8d4f6c86","claims":["C-01","C-03"],"review":"reviewed"}
  - {"id":"S3","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852595-what-is-the-myheritage-dna-biobank"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Current provider guidance on eligibility for using an existing stored sample, country availability and consent.","entry_sha256":"df08d3f6ce231c672c67873f2bda1c9291d0dc3645d2a1ddfb01f347ca06b802","claims":["C-05"],"review":"reviewed"}
  - {"id":"S4","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852457-what-does-the-whole-genome-sequencing-wgs-upgrade-mean-for-my-dna-results"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Rechecked 2026-11-20. The provider specifies January 2026 for automatic WGS of new samples sent to the lab and describes the array exception for kits upgraded to DNA Health before reaching the lab.","entry_sha256":"6dac44ceec23ddaa71bd6f98a05a45e4576f6096e758f9a7ff2978058699e300","claims":["C-01","C-04","C-06"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12851734-how-do-i-collect-my-dna-sample"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Current provider documentation identifies the specimen from a cheek swab.","entry_sha256":"d01774b98e464252abe34c59e963131b2bf91fe503ad833aa7d227aeb396ed22","claims":["C-04"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://familytreemagazine.com/blog/news/rootstech-2026-recap-genealogy-news-and-announcements/"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Community recap places the WGS transition in November without specifying a day or year. S4 supplies the documented scope and date for automatic processing.","entry_sha256":"bc8482f295c229512311561e626c5ed2f034e8ae193fbb8b07d330a80b2706cf","claims":["C-06"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://blog.myheritage.com/2023/03/myheritage-announces-third-installment-of-dna-quest-initiative/"],"published":"2023-03-03","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The blog advises people who had already tested to use the free upload option in an adoption-related search. S8 supersedes that guidance for new uploads.","entry_sha256":"718df09cae5f17d811549075de04425e794f872cec164b2f1ec5be18b700dabd","claims":["C-09"],"review":"reviewed"}
  - {"id":"S8","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852724-why-can-t-i-upload-my-dna-data-file"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Current provider help confirms that new uploads from other testing services have ended.","entry_sha256":"061f464522f600dd77fe9ffd14b74867c285db795f41f8c47e06d58155f80528","claims":["C-09"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/how-to-interpret-your-raw-dna-data-easily/"],"published":"2025-01-20","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The blog suggests extracting the raw file from a ZIP and selecting the tab delimiter in Excel. It also describes phasing as separating variants inherited from each parent. S10 and S11 guide interpretation of the export and selection of a delimiter. S12 supports treating parental-side assignment as a separate inference.","entry_sha256":"1dd31683a478a251a5fd8258c2c7e206e074799fe4784efaf8d5f0d711ef37f4","claims":["C-07","C-08"],"review":"reviewed"}
  - {"id":"S10","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852246-how-should-i-interpret-my-raw-dna-data"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Provider help describes a tab-delimited layout and explains that the allele columns have no fixed maternal or paternal ordering.","entry_sha256":"c8e6d4403cc8a8d798b9e7224da7e29416fe60c5a8d27e6602b3fd2111a1a41e","claims":["C-07","C-08"],"review":"reviewed"}
  - {"id":"S11","kind":"help-page","urls":["https://support.microsoft.com/en-us/excel/text-import-wizard"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. The Excel import documentation explains choosing the separator used in the file and checking how the preview splits the columns.","entry_sha256":"5bc6d28554ae35e5fd70916d616911fdf597ec4181b90e5c0d6b02beb9ea79ec","claims":["C-07"],"review":"reviewed"}
  - {"id":"S12","kind":"pdf","urls":["https://www.nature.com/articles/s41586-025-09357-5.pdf"],"published":"2025-08-06","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Figure 1 and the phasing methods distinguish grouping inherited variants from identifying their maternal or paternal origin.","entry_sha256":"a20c1048c4fd90da11a6dfa42a13cf54725187d7678694f3766095b90dfddc57","claims":["C-08"],"review":"reviewed"}
  - {"id":"S13","kind":"web-page","urls":["https://familytreemagazine.com/websites/myheritage-for-free/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. In tip 8 the author suggests using existing uploads to explore results for free. S14 confirms free DNA Matching for prior uploads, and S15 documents separate access terms for advanced tools.","entry_sha256":"afaa3d0aafc151e0cef1b093180754bbc88ff870245134496a3b52c7a7cc8cc2","claims":["C-10"],"review":"reviewed"}
  - {"id":"S14","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852332-is-dna-matching-free"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Provider help confirms free DNA Matching for prior autosomal uploads from 23andMe, Family Tree DNA and AncestryDNA.","entry_sha256":"61df3534713aca8eb4afb846918245f408ac9237a7c121953d25f85b507ed9e5","claims":["C-10"],"review":"reviewed"}
  - {"id":"S15","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852419-what-are-the-advanced-myheritage-dna-features"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Provider help lists the Chromosome Browser as an advanced tool and describes how the upload date, subscription and per-kit unlock affect access.","entry_sha256":"49f48405348a772f43bf468869df5647a63948422f90343590770e7bc550fc47","claims":["C-10"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Download the regular raw DNA file to the user’s own device if a copy is required. Open only the file header to check for the platform’s processing description. Record the method and kit date in the research log, keeping an ambiguous or missing header unresolved. [S1 @2026-11-18], [S2 @2026-11-18], [S4 @2026-11-18]","sources":["S1","S2","S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"For the 2× low-pass implementation described by MyHeritage, read 2× as mean depth across positions. Individual sites can differ from that average. Treat an imputed genotype as a statistical estimate and distinguish it from a directly observed read when documenting your evidence. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"portal-availability","anchor":"Choose the regular raw autosomal file when the task expects a genotype file. Choose the **Specialized Genomic CRAM File** for sequence reads from a MyHeritage kit processed with WGS. Download the CRAM locally only when the research question requires it. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"portal-availability","anchor":"If the kit contains only an uploaded array file and the research requires WGS, use a new MyHeritage cheek-swab kit for the tester’s physical sample. Keep the old result and the newly processed kit distinct in your log. [S1 @2026-11-18], [S4 @2026-11-18], [S5 @2026-11-18]","sources":["S1","S4","S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"portal-availability","anchor":"If the tester already has an eligible stored backup vial, request processing of the stored sample only after confirming that WGS is offered for that sample and country and obtaining the tester’s explicit consent. Record the new kit’s processing method from its own header. [S1 @2026-11-18], [S3 @2026-11-18]","sources":["S1","S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"Use late-2025 processing dates as rollout context. [S6 @2026-11-20] Expect WGS for new samples sent to MyHeritage’s lab from January 2026. A kit upgraded to DNA Health before it reached the lab uses the older array. Confirm the tester’s processing method in the raw file header. [S4 @2026-11-20]","sources":["S6","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"platform-ui","anchor":"If the research requires inspecting genotype rows in desktop Excel, extract the text file on the user’s device if it came in a ZIP. Select the delimiter used in the file, such as Tab or Comma, and check the columns in the import preview. Keep the file on the user’s device. [S9 @2026-11-20], [S10 @2026-11-20], [S11 @2026-11-20]","sources":["S9","S10","S11"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"Use phasing to group variants inherited together. [S9] Assign a phased group to the mother or father only when separate evidence establishes the parental side. [S12] Leave parental origin unresolved when the only clue is the order of alleles in a MyHeritage raw file. [S10]","sources":["S9","S12","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"Rule out a fresh raw DNA upload from another testing service when planning a MyHeritage match search. MyHeritage has closed the upload route described in older guidance. [S7 @2026-11-20], [S8 @2026-11-20]","sources":["S7","S8"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"fee","anchor":"If the tester already has results uploaded from another service, review that kit’s free DNA Matches before considering a new test for matching. [S13 @2026-11-21], [S14 @2026-11-21] Check what the user’s account already includes for that kit before relying on advanced tools such as the Chromosome Browser. Access can depend on the upload date, a subscription, or a per-kit unlock. [S15 @2026-11-21]","sources":["S13","S14","S15"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
