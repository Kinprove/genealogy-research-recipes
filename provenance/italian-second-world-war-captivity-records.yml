claims:
  - {"id":"C-italian-second-world-war-captivity-records-01","kind":"custody","anchor":"Locate the Vatican Information Office’s Inter Arma Caritas cards under the prisoner’s name. Consult the Vatican Apostolic Archive inventory or the DVD reproduction catalogued by the Australian War Memorial. Copy the camp or destination, prisoner number, inquiry outcome, named requester or recipient of news and any box reference. Follow any box reference to the papers it describes [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22] [S5 @2026-11-22].","sources":["S1","S2","S3","S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-italian-second-world-war-captivity-records-02","kind":"method","anchor":"Match the prisoner number and its issuing authority across the card and the custodian’s file, then compare the name and dates. For a card placing the prisoner in South Africa, follow the Commonwealth file through later transfers. Extract the departure camp, embarkation date, port, vessel and destination as distinct observations [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-italian-second-world-war-captivity-records-03","kind":"example","anchor":"Read an amended destination as a correction to test against a second card or a dated camp record. In Genealogia Familiare’s Australian case, the card amended South Africa to Australia and a second Vatican card supported the corrected destination [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-italian-second-world-war-captivity-records-04","kind":"custody","anchor":"For Australian custody, search National Archives of Australia series MP1103/1 for the Service and Casualty form and MP1103/2 for the report dossier. Use the first to place the camp transfers and repatriation in time, and open the report dossier separately [S6 @2026-11-22].","sources":["S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-italian-second-world-war-captivity-records-05","kind":"method","anchor":"Read the Report on Prisoner of War for the identification numbers and physical description. Copy the vessel, arrival port and arrival date where entered. Read NIL on a property declaration as an explicit absence for that field. In a report to an information office, distinguish the recipient office, such as the Red Cross or Vatican, from a relative documented as receiving news [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-italian-second-world-war-captivity-records-06","kind":"custody","anchor":"For an Italian military internee in Nazi custody, search the Arolsen Archives’ prisoner and persecution records as a separate route. Log the detention authority and series searched before interpreting a miss [S3 @2026-11-22] [S7 @2026-11-22]. For other Nazi-era lists, use [Holocaust register recovery](holocaust-register-and-survivor-list-recovery.md).","sources":["S3","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
