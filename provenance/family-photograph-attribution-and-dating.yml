claims:
  - {"id":"C-4c1048f1f3aa","kind":"unclassified","anchor":"Use this when an image has a caption, inherited identification or new information from a relative. Preserve the attribution and its basis; do not identify a person by their face or compare faces across photographs. A name for every face is not a prerequisite [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d8280b4bbb11","kind":"method","anchor":"1. Start with the original object or best available received copy. Retain its source/holder, copy or inheritance chain, album/page context and literal captions or reverse inscriptions. Keep an old inscription, a later relative's label and your own contextual interpretation as separate statements. Record who supplied each identification and their basis of knowledge when available. A label without a known author stays an unattributed label [S1], [S2], [S3].\n2. Transcribe struck-through, overwritten or corrected caption words as part of the literal reading. Mark the cancelled text, its replacement and the writer when known. On a porch photograph a caption writer crossed out a name that a listener remembered as her great-aunt’s nickname [S4]. Record that explanation with its contributor and test it against other family records.\n3. Transcribe a dated age literally, then calculate the implied birth date on a separate line. One cabinet card gave a child’s age as one year and eight days on 19 November 1909 [S5]. That points to 11 November 1908 if the date and age are accurate. Look for a birth record.\n4. Ask about the image. Useful prompts include what occasion is remembered, where/when it was taken, who supplied the photograph and how the contributor knows. Keep an unanswered question open. When a relative attributes a name, record their words and source; familiarity or a machine suggestion does not turn that account into a confirmed identification [S6], [S1]. Record the user's own recognition the same way, as an attributed claim with its basis. Resemblance is never evidence by itself.\n5. **Privacy gate:** <!-- privacy-gate: publish --> Sharing a marked copy sends the photograph, its captions and contributors' accounts, which may show or concern living people, beyond the user's own files; answer the privacy gate in `SKILL.md` first. For remote feedback, a marked copy or worksheet can keep the image reference, existing caption and contributor's new account together. Preserve each response separately; do not overwrite the original caption with the newest guess. Longer recollections belong to Family interviews and oral tradition. Prepare material for the user's chosen sharing scope; this request alone does not authorize sending or publishing it [S6].\n6. For a numbered group photograph, obtain the available full image and its associated name key. Bind each actually marked position to the literal key entry, retaining the image/key source relationship and any missing or ambiguous positions. Keep a contributor's newer attribution separate. Weigh the key by who made it and when: a key made with the image is strong evidence of who sat where, while a later or unattributed key is a claim like any other label. An absent key never authorizes substituting resemblance [S7].","sources":["S1","S2","S3","S4","S5","S6","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-24d97d0c9457","kind":"unclassified","anchor":"Record non-biometric context relevant to the question: an inscription, a stated occasion, location, photographer/imprint or independently supported format/date information. Preserve contradictions with a proposed attribution rather than resolving them from appearance. For related copies, retain their sources and what inscriptions or provenance they add [S6], [S1].","sources":["S6","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2becd3ebc57d","kind":"unclassified","anchor":"1. **Privacy gate:** <!-- privacy-gate: contact --> Asking distant branches or heirs about the photograph contacts people who may be living and may not know the user; answer the privacy gate in `SKILL.md` before any message goes out. Ask distant and collateral branches, heirs of the relevant household goods and lines present at a photographed event [S8], [S9].\n2. Search the literal studio name and town [S10], and check published family genealogies for reproductions of the whole image [S11].\n3. **Privacy gate:** <!-- privacy-gate: third-party-tool --> Before you upload a private family photograph to any outside service (reverse image search, enhancement or colorization), answer the privacy gate in `SKILL.md` and get the user's explicit permission for that service. Never reverse-search an image that shows living people, and never send an image to a face-recognition service. With permission, reverse-search a cropped copy and keep only exact-copy hits, as leads to ask about [S12].\n4. Record each copy's holder or host, uploader, displayed date, apparent generation and caption writer. Make observations from the copy nearest the original. Before reproducing an image, even in a family report, find out who holds the rights; do not take the uploader or the owner of a print for the rights holder. Under current U.S. law, owning a print, even the original, does not carry the copyright, which starts with the photographer, or with the employer, such as a studio, when an employee took the picture [S48]. Old commissioned portraits are an exception: in the United States, the copyright in a portrait ordered and paid for before 1978 usually belonged to the customer unless a contract said otherwise [S49], and Britain's Copyright Act 1911 gave the copyright in a photograph that someone ordered and paid for to that person, unless they agreed otherwise [S50]. In the United States, as of 2026, an unpublished work by a known author is protected for the author's life plus 70 years, and an unpublished anonymous or for-hire work for 120 years from creation; works published before 1931 are in the public domain [S51]. A photograph that circulated only within the family has usually not been \"published\" in the legal sense, which needs copies offered to the public, so the unpublished terms usually apply [S49]. Other countries' rules differ; check them before publishing.\n5. Another copy's caption is its source's attribution. Count matching captions across trees, books and sites as one attribution until someone shows an independent basis: wrong identifications are copied quickly. The earliest upload points to a holder, not a maker or sitter [S12]. A place found for one album item is a lead for its neighbours, not a finding. These are leads to ask, never resemblance matches.","sources":["S8","S9","S10","S11","S12","S48","S49","S50","S51"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c23a7d465d6e","kind":"method","anchor":"1. Transcribe a photographer's imprint literally, including a partial name or address, any telephone number and the proprietor, with uncertain letters marked. Record whether the mount was trimmed for an album, separately from captions [S13], [S15], [S17].\n2. Identify a candidate studio from the combined mark. Keep same-named studios elsewhere, branches, a possible publisher and a successor as separate candidates [S17].\n3. Trace that exact firm name and address through dated city directories, censuses or a photographer index, noting editions an index omits. Dated advertisements or maps can corroborate [S13], [S14]. Record the edition, section or page consulted and the exact listing, and compare the observed address, telephone and proprietor between the available dates. A studio missing from an edition you have confirmed covers its trade and street is a negative result for that year; a missing entry in an edition of unknown coverage is only an omission [S17].\n4. Before using a studio's working period as a date bound, record each source's range separately, with its citation: lexicon, regional reference, dated collection cards, AI/dealer summary. For a period photographer directory or studio database, record the entry consulted and the place and working years it states [S18]. For the Lanzendorf studio in Altenburg, an AI summary ended the range around 1888. Contributors cited dated cards from 1889 and 1894 and a lexicon giving 1864–1907 [S19]. In Blagoveshchensk, a contributor reported that Kato’s studio cards in a collection ran from May 1901 to March 1914, beyond two published estimates [S20]. Use lettering on dated comparison cards to suggest a range [S19].\n5. When a mount names only the photographer, other photographs from the same studio can supply its address. Match the repeated studio set (props such as a column or flower stand) against an addressed comparison card, and record which card and which features were compared. The comparison card's address applies to that card's period; a studio may have moved or reused its set elsewhere. Keep the recovered address as studio context. Nearness to barracks or an institution is a hypothesis about the sitter's affiliation, not an identification [S21].\n6. Compare a supported studio place and date with documented residences to shortlist candidate lines [S15].\n7. For a relative's review, copy the scans rather than moving the files into imprint-town folders, so the album order stays intact [S16].","sources":["S13","S15","S17","S14","S18","S19","S20","S21","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d627f045cf81","kind":"unclassified","anchor":"Read the result as a bound on the studio's use of that imprint. An original print on the studio's own mount falls inside the working span; a reproduction or a successor's print can fall later. Keep studio observations apart from what they imply for the original exposure, a later print or reproduction, the mount stock and the annotation [S17]. A studio town is not the sitter's residence [S15]. Never infer the sitter, an event or the photographed place from the business mark alone. Shared imprints show no kinship; never group by resemblance. When the records do not establish a bound, keep the window unresolved.","sources":["S17","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bd9b08b19f43","kind":"unclassified","anchor":"Name the object class before using any format clue: a cased image (a daguerreotype or ambrotype, or a tintype in a case), a carte de visite, a cabinet card, a real-photo postcard, or a snapshot or other print. The class decides which clues apply. This recipe supplies no full dating table; the ranges quoted below show how references differ. Take each class's dates from a reference and cite it. Named references include Maureen A. Taylor's photo-dating books [S32], [S33]; for Britain, Robert Pols's dating guides [S34], [S35] and the cartedevisite.co.uk site [S38]; for photographers of the American West, Peter E. Palmquist and Thomas R. Kailbourn's biographical dictionaries [S36]; for American daguerreotypists, Craig's Daguerreian Registry [S37]; and for real-photo postcards, Playle's stamp-box chart [S39].","sources":["S32","S33","S34","S35","S38","S36","S37","S39"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6d4c8fddc1cb","kind":"unclassified","anchor":"- Keep the exposure date and the processing/printing date distinct [S22].\n- A print size, border, mount, format or process cannot predate its introduction, so it gives an earliest date [S22]. A process or card type that went out of general use also gives a soft latest date. References can disagree by a decade or more and differ between countries, and late examples exist, so read the end of a range as \"probably before\", not as a cut-off. For the United States, the Library of Congress gives daguerreotypes as in general use until about 1860, ambrotypes as popular until the mid-1860s, cabinet cards as popular until about 1900 and cartes de visite as made into the 1900s [S40]. A British archive guide has daguerreotypes in general use only until the mid-1850s and ambrotypes popular into the 1880s [S41]. Tintypes give almost no latest date: they stayed in use through the 1930s in the United States, and British street and beach photographers used them into the 1940s and 1950s [S38], [S40]. A later copy print of an early image is the exception to record: the copy's process dates the copy, not the sitting.\n- On a real-photo postcard, read the back. In the United States, a back given over entirely to the address, with no dividing line, usually points to card stock printed before 1 March 1907, when postal regulations first allowed a message on the address side; old stock could still be used later, so treat it as a soft latest date [S42]. Britain allowed the divided back from 1902, and undivided cards stayed in use for some years after [S43]. Kodak introduced postcard-backed photographic paper in 1902 [S44]. The stamp box often names the paper maker, and collectors' tables give approximate years for each design: on Playle's chart, AZO with four triangles pointing up runs about 1904 to 1918. The ranges are estimates the site asks readers to refine, and many designs on its full list are marked \"Unknown Dates\". Velox used the same four up-pointing triangles in 1909 to 1914, so read the brand name as well as the corners [S39]. These clues date the card stock, not the exposure or the posting.\n- The back of a 20th-century print may carry the paper maker's printed mark. The mark dates the paper, not the negative: the print was made after that pattern was introduced and usually before it was replaced. Many papers carry no mark, the patterns differ by country of manufacture, and the published chronology is rough: on U.S. papers, the single word \"Velox\" runs from the late 1920s to the late 1940s and \"Kodak/Velox/Paper\" from about 1950 to at least the mid-1960s [S45]. Some photofinishers printed a processing month and year in the print margin, and later on the back [S46]; most slide mounts from about 1960 carry a stamped month and year [S47]. These are processing dates: the picture was taken on or before them.\n- Clothing or hairstyle gives an earliest date. For an older sitter it gives no latest date, because older people kept earlier styles [S22].\n- A dress, long hair or pink/blue coloring does not establish a child's sex. Long skirts marked a child's age: boys wore them until they were breeched, commonly between four and seven [S23].\n- An old-system house number bounds the image only where dated directories show the change [S24].\n- A licence plate's year bounds the photograph only approximately, because next year's plates could go on sale before the year began. The plate is a lead to the vehicle's owner, not to who is pictured [S25].\n- Inspect each photo in a supplied identity document (an internal passport, a party or military card, a pass) and its reverse. A photo shown to have been pasted in at issue was taken no later than the issue date, but the issue date is not the sitting date. A replacement photo or a copy needs its own bound: under the 1974 Soviet Passport Regulation, new photos were pasted in at ages 25 and 45, and the holder had a month after that birthday to hand them in [S31].","sources":["S22","S40","S41","S38","S42","S43","S44","S39","S45","S46","S47","S23","S24","S25","S31"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8dd2647b7d21","kind":"method","anchor":"**Uniforms, insignia and medals.** For a uniformed portrait, keep the full image and make linked detail crops of the cockade, belt buckle, shoulder straps, badges and awards. Date each regulated element from its cited introducing order or a medal's establishment, and treat that as an earliest bound for the picture. Where an order set a later date for wear, take the earliest bound from that date: in [S21], a contributor cited a 1907 order prescribing wear from 1909. For a fur-cap emblem a contributor cited abolition in January 1914, yet the owner dated the portrait showing it to November 1914 [S21]. Check actual wear before treating withdrawal as a latest bound. A jubilee medal's eligibility rule limits which candidates could have worn it; keep that apart from the photo-date bound. Record each order or statute as cited. A worn medal does not prove whose award it was.","sources":["S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e01df17e4403","kind":"unclassified","anchor":"**Red Army shoulder boards, 1943.** Shoulder boards (погоны) were introduced in the Red Army by the Presidium decree of 6 January 1943 and NKO (People's Commissariat of Defence) Order No. 25 of 15 January 1943 [S28], [S29], [S30]. Summaries disagree on when wear began: one museum page gives 15 January, the date of the order itself [S30]. Take the wear date from the text of Order No. 25 [S28] before using it as the earliest bound. Use that bound only for a confirmed Red Army serviceman in his own period's uniform, never for imperial or foreign uniforms, costume or re-enactment. Collar-tab rank insignia (кубари and шпалы, squares and bars) belong to the uniform before this reform, but by the abolition rule above they set no hard latest bound, because the changeover took time [S28].","sources":["S28","S29","S30"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8628bdec53b1","kind":"method","anchor":"1. Compare the named person's documented life dates with the independently supported date of the sitting itself, not of a later print, copy or composite. In one family’s account, a group picture made around 1920 included an older brother killed in 1914 [S17]. Look for an earlier portrait that might have supplied his image. A sitting that could not have happened in that lifetime is a misattachment to record. A same-named person of another generation becomes the next candidate to test, not a conclusion [S22].\n2. For a dated occasion, calculate each proposed person's age from documented birth information.\n3. For a group, compare number, sex and broad life stage with a documented household. Do not read a child's sex from dress, hair or coloring.\n4. A fit shows consistency, not identity. A conflict other than the lifetime test in step 1 reopens the attribution [S13], [S22], [S26].","sources":["S17","S22","S13","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bec18237a1e9","kind":"method","anchor":"**Named sitters as date limits.** When a group photograph's sitters are named by a caption or an attributed account, and their birth years are documented independently, use them as date limits. A named child shown sets an earliest possible date. A documented sibling missing from the image may suggest a latest one. Record each limit with the identification and the document it rests on. An absent child may simply have been elsewhere, and one wrong attribution moves the whole range. Do not assign names from appearance to make the limits fit. In one family group, a caption named a woman holding a child, but the researcher still questioned who she was and whether an older son was missing [S20]. A date limit that depends on either person remains conditional.","sources":["S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a01263ff3acc","kind":"unclassified","anchor":"Return the attributed observations, conflicting claims, linked sources and next check needed. A historical/contextual check may assess an attribution, but it does not authorize a face-based identification. Keep edited/AI-altered copies linked as derivatives and use the unaltered available source for documentary observations [S1], [S6].","sources":["S1","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2d4811ec7c17","kind":"platform-ui","anchor":"Treat an AI date estimate, such as MyHeritage's PhotoDater, as a rough range to test against the bounds above, never as a bound itself. MyHeritage says the tool gives a best-guess year only for photos taken between 1860 and 1990, and only when its confidence is good enough. In its own test about 60% of estimates fell within five years of the actual date [S52 @2026-11-12] [S53 @2026-11-12]. A missing estimate tells you nothing about the date: MyHeritage names photo quality and other factors as reasons it gives none [S52 @2026-11-12]. Record the estimate with the tool's name and the date you read it, beside the bounds from physical clues. Uploading a photo to get an estimate is an outside-service step under the privacy gate in step 3 of \"Record the context and look for other copies\".","sources":["S52","S53"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6a9c91175e6c","kind":"historical","anchor":"The commissioner rule in step 4 did not end with Britain's 1911 Act. Under the Copyright Act 1956, a person who commissioned a photograph or a portrait, and paid or agreed to pay for it, was entitled to its copyright, unless an agreement excluded that [S54]. The Copyright, Designs and Patents Act 1988 gives first ownership to the author, or to the employer for work an employee made in the course of employment unless they agreed otherwise [S55]. The law in force when a work was made decides who first owned it, except that a commission given before the 1988 Act took effect keeps the earlier rule for a work made under it after that date [S56].","sources":["S54","S55","S56"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-tree-site-tags-and-links","kind":"method","anchor":"7. **Privacy gate:** <!-- privacy-gate: publish, link, contact --> Uploading, tagging or linking a photograph on a tree site places the image and its names on that site for whoever its settings admit, and so does sending relatives a site album's link to ask who is pictured, as a 2026 podcast excerpt suggests (video not inspected) [S57†]. Answer the privacy gate in `SKILL.md` first. A face tag or a link from the photograph to a tree profile shows a bare name, without who supplied it or why. Tag or link a person only under a name you would enter in the attribution register, and write its supplier and basis in the photo's description, where a 2022 podcast excerpt suggests putting names (video not inspected) [S60†]. Keep a proposed or disputed name in the description, marked as such, and out of tags and links. Never use a site's face-recognition tagging or its name suggestions; tag by hand.","sources":["S57","S60"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-tree-site-terms-and-face-tagging","kind":"platform-ui","anchor":"On FamilySearch, albums belong to Memories, and the uploader sets each memory as public or as viewable only by themselves [S59 @2026-11-16]. FamilySearch's Content Submission Agreement says uploaded content may be displayed and available for others to search and view, and that photographs of living people, other than the uploader's own minor children, must not be posted without their consent [S58 @2026-11-16]. MyHeritage's Photo Tagger groups the faces it believes belong to one person and suggests names of deceased people from the tree [S62 @2026-11-16]; MyHeritage's 2022 announcement calls it facial recognition and says that, once enabled, it scans newly uploaded photos automatically [S61 @2026-11-16].","sources":["S59","S58","S62","S61"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-keepsake-copies","kind":"historical","anchor":"**Keepsake copies.** **Privacy gate:** <!-- privacy-gate: contact --> These questions go to relatives and heirs who may be living; answer the privacy gate in `SKILL.md` before any message goes out, as in step 1. When you ask for other prints, ask also about small portraits set into lockets and brooches. Victorian families kept photographs of their dead in such keepsakes, including portraits taken after death [S63], [S64], [S65]. Record a keepsake portrait as another copy, and transcribe the jewel's own inscription literally as a separate caption: one Royal Collection locket pairs a Camille Silvy photograph of Prince Albert with a lock of hair and is inscribed \"December 14/1861\" [S67]. An inscribed date marks the keepsake or the event it commemorates, not the sitting. A mourning setting does not make the portrait post-mortem: a mourning brooch of about 1885 at The Henry Ford holds a tintype of the deceased taken while still alive [S66]. Record a portrait as taken after death only on an inscription or an attributed account, never from pose or appearance. Such a sitting follows the documented death: take the death date as its earliest bound, and in the documented-lifetime test treat a sitting after the death as expected, not as a misattachment.","sources":["S63","S64","S65","S67","S66"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-df37c72a5a77","kind":"method","anchor":"Keep an uncropped view while testing the place of a photograph. Compare doors, windows, room corners, furniture and other fixtures with separately located photographs. Record the particular features and where the comparison photograph's location comes from. A similar room is a location hypothesis to test; it does not identify the sitter or prove a family relationship [S68], [S69].","sources":["S68","S69"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-album-dedications","kind":"method","anchor":"**Album dedications.** Record the named giver and recipient as part of the album's provenance. If captions or attributed accounts place members of the giver's family in the album, keep that as a lead to the two families' association. Verify any proposed kinship in records independent of the album [S70], [S71].","sources":["S70","S71"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-portrait-dress-and-status","kind":"method","anchor":"For a carte-de-visite portrait, read formal dress as a clue to the social standing the sitter may have wanted to project. Verify claims about the family's wealth or influence separately [S70], [S71].","sources":["S70","S71"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-google-lens-scene-upload","kind":"platform-ui","anchor":"**Locate a scene with image search.** **Privacy gate:** <!-- privacy-gate: third-party-tool --> A crop from the family's photograph goes to Google Lens. Remove people, identifying text and file metadata from the crop. If the photograph shows anyone who may be living, compare the scene locally. Answer the privacy gate in `SKILL.md` and get the user's explicit permission before sending the crop. On a computer, send the scene crop through Google's **Search by image** control and choose **Upload a file**, or drag the crop into the search box [S72 @2026-11-18].","sources":["S72"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scene-search-comparison","kind":"method","anchor":"Keep similar views as leads to the location. Check the vantage point and the arrangement of fixed features against the uncropped photograph, and corroborate the place with an independently located view [S73].","sources":["S73"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-caption-kinship-census","kind":"method","anchor":"**Captions naming a relative.** Use the caption's name and named relative together, with the independently supported studio place and period, to shortlist deceased candidates. Compare both names and the proposed relationship with the census household, and check whether the recorded age fits the sitting window [S74]. If the schedule gives relationships to the household head, read each relationship from that head. Adjacent lines alone do not establish kinship [S76].","sources":["S74","S76"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-familysearch-attached-census","kind":"platform-ui","anchor":"On a deceased candidate's FamilySearch person page, open **Sources**, select the attached census and follow its citation to the census schedule [S75 @2026-11-18].","sources":["S75"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-embedded-caption-attributions","kind":"method","anchor":"**Embedded captions.** Read names in a digital copy's IPTC Description/Caption and Keywords fields as attributions. Record the field and file version, and the contributor and their basis when known [S77], [S83].","sources":["S77","S83"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-caption-branch-leads","kind":"method","anchor":"**Photographs linking branches.** Use the named parent and kinship in a reverse caption to choose which branch's collection to check. Test a place attached to a person's name separately from the place of the sitting [S85].","sources":["S85"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-branch-group-photograph","kind":"method","anchor":"**Privacy gate:** <!-- privacy-gate: contact --> A request describing the photograph and the family connection may disclose information about living people to relatives in the other branch. Answer the privacy gate in `SKILL.md` before contacting a relative through a route the user already has. Ask whether the other branch holds a separately captioned or attributed group photograph showing members of both branches. Check where its identifications came from before using the grouping as evidence of an association. Verify the proposed kinship in records [S85].","sources":["S85"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-photographic-plate-materials","kind":"method","anchor":"**Photographs on plates.** Inspect the image-bearing surface and support. Leave any housing assembled. A mirrorlike metal image surface points to a daguerreotype, commonly made on silver-plated copper [S77], [S79]. A glass image plate that appears positive against a dark backing points to an ambrotype. A photographic layer on dark-coated iron points to a tintype [S77], [S78]. A metal backing behind an ambrotype can also attract a magnet [S78]. If the support is obscured, keep the possible formats and their date bounds conditional.","sources":["S77","S79","S78"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-carte-de-visite-mount-dimensions","kind":"method","anchor":"**Small card portraits.** Measure the card mount and the print separately. An intact carte de visite typically measures about 2½ × 4 inches (6.4 × 10 cm) overall. Check the mount and imprint together and allow for trimming before applying the format's date range [S77], [S80].","sources":["S77","S80"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-crayon-enlargement-source","kind":"method","anchor":"**Crayon portraits.** For a portrait that looks drawn, check for hand-applied media over a photographic enlargement [S77], [S81]. Record the enlargement separately and seek the source photograph. Apply the enlargement's date clues to the enlargement.","sources":["S77","S81"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-digital-copy-exif-fields","kind":"method","anchor":"**Digital dates.** Inspect the EXIF fields locally on the earliest available file. Distinguish `DateTimeOriginal` (capture) from `DateTimeDigitized` (digitization). Establish what the device captured before using either timestamp or the GPS coordinates. For a scan or a photograph of a print, metadata generated by the copying device describes the digital copy. Look for a date or place for the sitting on the physical photograph or in its provenance [S77], [S82].","sources":["S77","S82"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-vehicle-introduction-bound","kind":"method","anchor":"**Vehicles.** If a car's design is visible, record the features that distinguish the make, model or variant. Check manufacturer literature or collection records for when that design first appeared. Use a supported introduction date as the earliest bound and leave the latest date open [S77], [S84]. In a 2012 Indiana Historical Society post, a then-recent photograph shows a boy beside a 1970s car [S84].","sources":["S77","S84"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-caption-writer-attribution","kind":"method","anchor":"**Handwriting on a caption.** Record a relative's recognition of the writer as an attributed claim. Compare the writing with independently attributed letters or cards when available. Keep the proposed writer and the caption's identification of the sitter as separate claims [S88], [S89].","sources":["S88","S89"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-unnumbered-group-positions","kind":"method","anchor":"**Unnumbered groups.** Record each contributor's identification against a row and position or a distinctive garment or prop in the full image. Use the detail to locate the figure the claim refers to [S88].","sources":["S88"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-group-nonrecognition","kind":"example","anchor":"Keep competing names open when one relative does not recognize a proposed sitter and the other name has no separate support. In one reported group-photo case, a descendant's nonrecognition of the first candidate left the figure unidentified [S90].","sources":["S90"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-profile-tagged-photo-claims","kind":"platform-ui","anchor":"**Tagged photographs.** **Privacy gate:** <!-- privacy-gate: third-party-tool --> With PhotoDater enabled, MyHeritage may process an undated photo on its servers. The photo may show living people. If the date is unknown and PhotoDater is enabled, clear the gate in `SKILL.md` before opening the image [S52 @2026-11-21]. On a deceased candidate's MyHeritage desktop profile, check for a **Photos** tab and open an already tagged image [S95 @2026-11-21]. Record its listed date, place and other tags as claims to check against the caption, provenance and records [S95 @2026-11-21] [S96 @2026-11-21].","sources":["S52","S95","S96"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-streetscape-viewpoint-comparison","kind":"platform-ui","anchor":"For a candidate historical streetscape, open Google Street View at the location and compare the full photograph locally with fixed details such as the stonework around doors and windows. Try another viewpoint or **See more dates** where available if the first view is blocked or the facade has changed. Record the viewpoint, imagery date and features that agree or conflict [S97 @2026-11-21] [S98 @2026-11-21] [S99 @2026-11-21].","sources":["S97","S98","S99"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-tree-match-branch","kind":"platform-ui","anchor":"**Branches suggested by a tree match.** Use an existing MyHeritage Smart Match to trace the overlapping branch back to a documented connection. Use the match to find a possible contributor [S90 @2026-11-21] [S91 @2026-11-21].","sources":["S90","S91"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-tree-match-photo-outreach","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: contact, publish --> A message may disclose the family connection and a marked photograph may show or name living people. The recipients are the matching tree's manager or relatives in that branch. Answer the privacy gate in `SKILL.md` before contact or sharing. Use the match's **Contact** control if the tree manager is the route to the branch [S91 @2026-11-21]. Ask a descendant in the relevant branch what they recognize and how they know. Share a marked copy privately within the cleared scope and record the response as the contributor's claim [S90 @2026-11-21].","sources":["S91","S90"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cross-photo-occasion-clues","kind":"method","anchor":"**Occasion clues across photographs.** If separate attributions place the same people in two group photographs, compare distinctive clothing and other scene details for a possible shared occasion. Record the occasion as a hypothesis and test it against records of the event [S90].","sources":["S90"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dead-fred-cutoffs","kind":"platform-ui","anchor":"**Dead Fred.** The submission form specifies photographs taken before 1965 of people who are all deceased [S102 @2026-11-21]. The FAQ gives a cutoff of before 1960 [S103 @2026-11-21]. Keep a local draft when a photo dates to 1960–1964 or its eligibility is uncertain.","sources":["S102","S103"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dead-fred-submit-photo","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: publish --> The scan and its descriptive clues go to Dead Fred for public posting. The archive also requests the submitter's name and email [S105 @2026-11-21]. Check permission to publish, remove details about anyone who may be living and answer the privacy gate in `SKILL.md` before sending. Read the license in the submission terms [S104 @2026-11-21]. For an eligible unidentified photo, submit a JPEG copy via **Post Photos** with a supported date or place and an identification question [S100 @2026-11-21] [S101 @2026-11-21] [S102 @2026-11-21]. Use the first-submission password to manage the posting [S103 @2026-11-21].","sources":["S105","S104","S100","S101","S102","S103"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-publication-latest-bound","kind":"method","anchor":"**Publication dates.** Record the issue date separately from the sitting. Use the issue as a latest bound once you establish it reproduces that exposure. One contributor dated a race photograph to 1954 and its appearance in a cycling magazine to 1979 [S88].","sources":["S88"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-album-date-sequence","kind":"method","anchor":"**Album order.** Check the dated images on both sides and test whether dates in that part of the album run in order. Use the neighbours as a provisional range only where the sequence holds. If the pages are arranged by family or theme, use the neighbours as context [S86], [S87].","sources":["S86","S87"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-season-and-stay","kind":"method","anchor":"**Seasons and stays.** Use seasonal clothing as a soft clue and record an approximate season and year when the year has separate support. If the sitting is tied to a temporary household residence, use the documented years of the stay as a conditional window [S86].","sources":["S86"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photodater-processing-gate","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: third-party-tool --> With PhotoDater enabled, opening an eligible undated image lets MyHeritage process the image on its servers. The image may show living people. Clear the gate in `SKILL.md` for this use before opening the image [S52 @2026-11-21].","sources":["S52"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photodater-eligible-photo-page","kind":"platform-ui","anchor":"On MyHeritage desktop, open the thumbnail of a photo already on the site to trigger PhotoDater on its Photo Page [S52 @2026-11-21] [S92 @2026-11-21]. If there is no estimate, check for a date already stored in the site's metadata and whether the image is a photograph containing people [S52 @2026-11-21].","sources":["S52","S92"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photodater-list-filters","kind":"platform-ui","anchor":"For a batch, look in the user's desktop **List View → Year range** for **Missing date** and apply the filter. Open each undated image to request its estimate, whether you found it with the filter or directly. A decade filter can also return saved estimates. Inspect each result's date field for an estimate marker before using its year [S92 @2026-11-21] [S94 @2026-11-21].","sources":["S92","S94"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photodater-histogram","kind":"platform-ui","anchor":"Click the estimate and choose **More details** to record the reported confidence, average error and other decades the histogram suggests. Use them to prioritize what to check. Keep the average error out of the date-bound table [S52 @2026-11-21] [S92 @2026-11-21].","sources":["S52","S92"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photodater-estimated-metadata","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: publish --> Saving or editing the year records dating information about the photographed people in MyHeritage for viewers admitted by the photo's settings. Clear the gate in `SKILL.md` before changing the site's metadata. Use **Save** on a corroborated estimate. Read the saved GEDCOM-formatted year as an estimate and label it that way in the research log. Dismiss unsupported suggestions. Replace a saved estimate when the sitting's date is established and retain the prior estimate in your log [S92 @2026-11-21] [S93 @2026-11-21].","sources":["S92","S93"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photodater-disable","kind":"platform-ui","anchor":"To turn off PhotoDater estimates, uncheck **PhotoDater** under **My Privacy → Content** in the family site's settings [S52 @2026-11-21] [S92 @2026-11-21].","sources":["S52","S92"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-estimated-occasion-birth-search","kind":"method","anchor":"If the occasion is independently identified and an attributed account or record gives the person's age at it, subtract that age from the estimated occasion window to plan a birth-record search. Carry both uncertainties into the search and keep the result provisional [S92].","sources":["S92"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-apparent-age-sitting-window","kind":"method","anchor":"For an already attributed sitter with a documented birth date, add a broad estimated age range to the birth date to get a provisional sitting window. Record the apparent age and the attribution it depends on. If multiple sitters' windows disagree, keep the disagreement in the date table [S86].","sources":["S86"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-ambiguous-caption","kind":"method","anchor":"**Ambiguous labels.** When a reverse label on a mother-and-child portrait gives one name without assigning it to a figure, carry both readings into the attribution register. Test each against the independently supported sitting window and the documented relationship [S111].","sources":["S111"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-faint-scene-writing","kind":"method","anchor":"**Faint writing.** Inspect lettering inside the image as well as writing on the mount or reverse. Record its position, estimated length, legible letter groups and alternative readings before testing possible names or places [S111].","sources":["S111"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-caption-on-a-reproduction","kind":"method","anchor":"**Captions on reproductions.** Attach the caption to the copy you actually read. Record when that copy was received, and keep its receipt date separate from the sitting estimate [S112].","sources":["S112"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-ambiguous-occasion","kind":"method","anchor":"**A possible wedding occasion.** If bouquets, boutonnieres or formal dress suggest a wedding-related gathering, search marriage notices and records within the independently supported sitting window. Keep a shower, another formal occasion and no identified occasion open. A marriage that fits the window gives you an event to investigate and leaves the identity of each sitter open [S111] [S112].","sources":["S111","S112"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-album-removed-prints","kind":"example","anchor":"**Missing album photographs.** Check for cutouts or other signs that prints were removed before using an absence as evidence. A MyHeritage account describes an album whose photographs of one family member had reportedly been cut out [S133].","sources":["S133"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-photo-imprint-studio-operator","kind":"method","anchor":"**Studio credit.** When the imprint names the firm, record the firm as the credit and leave the individual camera operator open. For a Finnish studio, look up the firm in the Finnish Museum of Photography's *Kuka kuvasi* directory and look for staff in the candidate year. Keep staff as candidates until a record links one to the sitting. Charles Riis's name appears on a catalogued 1876 exhibition view, and Daniel Nyblin also worked for Riis [S127] [S128] [S129].","sources":["S127","S128","S129"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-riis-mount-advertising","kind":"method","anchor":"**Series mounts and advertisements.** Compare the series wording and layout on an undated stereograph with an independently dated view from the same firm. Put a mount match in the table as a provisional clue. For Riis's Helsinki views, compare the mount with the 1876 General Exhibition view catalogued as *Yleisen suomalaisen teollisuusnäyttelyn välisali* [S127] [S128]. Check *Helsingfors Dagblad* for 23 July and 23 December 1876 for the offers Kyläkoski cites. Record the advertised subject, offer date and any stated format. An offer bounds the exposure only if it identifies that view, and a listing silent about format leaves it open [S127].","sources":["S127","S128"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-langhans-branch-opening","kind":"historical","anchor":"**Langhans branches.** For a portrait attributed to Langhans at an established studio location, use 1876 as the earliest year for the Jindřichův Hradec studio and 1880 for the Vodičkova Street studio in Prague. Use the branch named on the mount or established in studio records before applying either date [S130] [S131].","sources":["S130","S131"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-cabinet-card-mount-size","kind":"historical","anchor":"**Cabinet cards.** Measure the whole mount as well as the print. About 4¼ × 6½ inches (10.8 × 16.5 cm) on heavier card stock is consistent with a cabinet card. Allow for other sizes and check the imprint and mount before applying the format's range. The dimensions alone leave the decade open [S112] [S113].","sources":["S112","S113"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-identify-glass-negative","kind":"historical","anchor":"**Glass negatives.** Check how the image-bearing layer reaches the plate edges and look for signs of hand coating. Compare an irregular coating with a wet-collodion reference and a uniformly coated plate with a manufactured gelatin dry-plate reference. Glass thickness alone leaves the process open. Apply the process dates only once the observations support a process, and check whether the negative copied an earlier exposure [S134] [S135].","sources":["S134","S135"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-disc-film-earliest","kind":"historical","anchor":"**Kodak Disc negatives.** Look for 15 small frames arranged around a circular hub. Use Kodak's 1982 launch as the earliest year for ordinary consumer exposures on confirmed Kodak Disc film. If it records a copy of an earlier photograph, apply the bound to the negative [S134] [S136] [S137].","sources":["S134","S136","S137"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-dated-demolition-notice","kind":"method","anchor":"**Buildings with a removal date.** If an identified building is still standing in the photograph, look for the address in dated auction and demolition notices. Record the auction, stated deadline and documented removal as separate events. A proposed deadline gives a provisional latest date. Use actual removal as a firmer latest bound and leave the earliest date open unless the image shows a separately dated change [S132].","sources":["S132"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-clothing-catalog-comparison","kind":"method","anchor":"**Clothing comparisons.** Compare distinctive hat shapes with dated Sears catalog issues by year and season. Check the brim and crown separately from the trim, and date garments separately when their silhouettes differ. On a seated sitter, inspect the fabric beside the chair before ruling out a bustle. Use period garment names as search terms and record the comparison issue and page. A match dates an advertised style and leaves room for later wear [S111] [S112] [S114] [S126] [S138].","sources":["S111","S112","S114","S126","S138"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-us-flag-star-count","kind":"historical","anchor":"**U.S. flags.** Use the clearest flag in the image. Record the star count, arrangement and number of stripes, and keep each plausible count if a fold or crop hides stars. For example, carry the official 30-star (1848–1851), 31-star (1851–1858) and 32-star (1858–1859) windows separately. The 1818 act restored 13 stripes after the 15-stripe design introduced in 1795 and set changes for the July 4 after a state's admission. Use the official table for exact dates, including when the preceding design still applied in an admission year. Keep seceded states in the Civil War count. West Virginia's 35th star took effect in July 1863 and Nevada's 36th in July 1865 [S106] [S107] [S108].","sources":["S106","S107","S108"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-us-flag-continued-use","kind":"historical","anchor":"**Flag layout and use.** Compare the layout with dated examples and verify the count even when the pattern looks familiar. Allow for layout variation before the 1912 standard. An official interval dates the design's status and leaves the flag's manufacture and later display open. A 33-star flag was used at Lincoln's bier in 1865, years after that design was superseded [S106] [S107] [S109]. For a distinctive mourning or commemorative design, check inscriptions, event notices or a dated image of the occasion before narrowing the date. Half-staff display, uniforms and the venue can help choose which occasion to check [S106] [S110].","sources":["S106","S107","S109","S110"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-post-mortem-context","kind":"method","anchor":"**Possible death portraits.** If a sitter is shown in a casket, check the reverse, album and funeral records for the deceased, date and occasion. Keep a posed death portrait and a photograph of a wake or funeral distinct. For a reclining portrait in the “last sleep” style or a lifelike mourning tableau, keep the classification open until an inscription or attributed account connects it to a death. Open eyes, support, a toy or healthy-looking color can appear in death portraits. Check for added tint and leave illness, death and identity unresolved from appearance alone [S115] [S116] [S117] [S139] [S140].","sources":["S115","S116","S117","S139","S140"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-twentieth-century-funeral-photo","kind":"example","anchor":"Keep funeral photography in consideration for a dated twentieth-century print. Gorr illustrates a family casket photograph dated about 1930 [S115].","sources":["S115"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-photo-photodater-mobile","kind":"platform-ui","anchor":"On the user's phone, look for **Photos** in MyHeritage or **Gallery** in Reimagine. Once the PhotoDater processing gate is clear, open an undated image already in that app and give the first estimate a few seconds to appear below it. Tap a displayed estimate to inspect the histogram and other possible decades. If the estimate stays absent, leave the date open [S118 @2026-11-22] [S52 @2026-11-22].","sources":["S118","S52"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-photodater-mobile-save","kind":"platform-ui","anchor":"On the phone, apply the same metadata gate before tapping **Save** on an independently corroborated estimate. Dismiss unsupported estimates. Confirm that the saved date remains marked as estimated [S118 @2026-11-22].","sources":["S118"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-photo-precision-list-view","kind":"platform-ui","anchor":"In MyHeritage **Photos → List View**, use the date field for an independently supported date. Enter the supported day, month, year or range at the precision the evidence permits [S94 @2026-11-22].","sources":["S94"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-scribe-ai-web","kind":"platform-ui","anchor":"**Privacy gate:** <!-- privacy-gate: third-party-tool --> Scribe AI sends the selected photograph, including people and visible details that may identify living people, to MyHeritage for analysis. Answer the privacy gate in `SKILL.md` and get the user's explicit permission for this service before submitting an image. On the web, choose **Upload image** in [Scribe AI](https://www.myheritage.com/scribe-ai) and select the approved historical image. Check the user's site settings if Scribe AI is unavailable. The help page specifies the PhotoDater setting as a prerequisite, so check the scope of consent before enabling it [S119 @2026-11-22] [S120 @2026-11-22] [S122 @2026-11-22] [S123 @2026-11-22].","sources":["S119","S120","S122","S123"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-scribe-ai-mobile","kind":"platform-ui","anchor":"In the MyHeritage mobile app, go to **Photos → Scribe AI → Choose image** to select a cleared historical photograph. For a photo already in MyHeritage, open its menu and choose **Get Scribe AI insights** after clearing the same processing gate [S121 @2026-11-22].","sources":["S121"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-scribe-ai-check-clues","kind":"platform-ui","anchor":"In the report, open **Estimated date**, **Estimated location** and **Visual clues** where present. Reinspect the photograph for the specific features cited, such as a garment's cut and how it is worn or the spacing of buildings. Verify the features against dated sources or independently located views. Record the tool's estimates as leads alongside the observations you can verify [S119 @2026-11-22] [S120 @2026-11-22] [S124 @2026-11-22] [S125 @2026-11-22].","sources":["S119","S120","S124","S125"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-scribe-ai-visible-details","kind":"method","anchor":"For a reported insignia, business sign or plate fragment, check the report's reading against the visible detail before following a service-archive or locality lead. Verify a named unit in insignia references before using it to choose service records. Compare a plate fragment with independently dated examples from candidate jurisdictions [S125] [S141].","sources":["S125","S141"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-photo-background-building-sightline","kind":"method","anchor":"**Uncertain background buildings.** Search historical photograph collections by place or landmark for a later view from nearly the same camera position. Use a fixed landmark to orient both images. Compare where buildings stand relative to it, allowing for changes in their outlines. A similar apparent size alone leaves a match provisional [S142] [S143]. If the building is still uncertain, find a dated elevated view that shows both the landmark and the candidate. Trace the original camera's sightline past the landmark toward each candidate in that view. Keep the identification provisional if several positions fit or the sightline remains unclear [S142].","sources":["S142","S143"],"checked":null,"stated_as":"fact","review":"reviewed"}
