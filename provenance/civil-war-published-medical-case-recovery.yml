claims:
  - {"id":"C-6160ff75897c","kind":"portal-availability","anchor":"Find digitised volumes by the work's full title. Search the NLM copy's searchable text or PDF for the surname, and browse the relevant part by the injury or disease when a name search fails. Use Civil War Washington's case index as another entry point and take a found case back to its printed page. [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a3d10c6cae87","kind":"method","anchor":"According to the presenter in the available excerpt, read adjacent numbered cases separately and check each patient's initials, company, regiment and wounding event [S1†]. Compare these details with the service record before identifying the patient. Read the patient's service designation in the entry itself. A wound grouping can include patients from different armies. [S5] [S6]","sources":["S1","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-df5301edcf65","kind":"method","anchor":"According to the presenter in the available excerpt, use the injury tables as a separate search [S1†]. Read the column headings before extracting the patient’s wound, treating physician or disposition. Keep empty fields open and keep aggregate totals separate from named entries. [S2] [S6]","sources":["S1","S2","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
