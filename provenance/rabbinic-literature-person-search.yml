  - {"id":"S27","kind":"web-page","urls":["https://github.com/Kinprove/genealogy-research-recipes/blob/871275861ec513f393dce8c64958db80499b3bfa/skills/genealogy-research-recipes/sources/rabbinic-literature-person-search.md"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Original published account of the May–October 2026 corpus checks read 2026-11-19. It reports the surname and place-spelling searches; the numerical results were not reproduced","entry_sha256":"6fbfa9658196d07e8989625f95d5eb7b9c2209f5a9a3086eddd175e8bc739af5","claims":["C-7f2e0be104f9","C-8c676cd14404","C-928180c54f43","C-f18ca9df4504"],"review":"reviewed"}
