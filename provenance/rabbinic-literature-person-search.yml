claims:
  - {"id":"C-2863e4002412","kind":"unclassified","anchor":"- **HebrewBooks.** A free library of scanned seforim with a catalogue and an OCR full-text\n  search. Most PDFs carry a text layer. The catalogue's place is where a book was printed,\n  not what it is about, and one title can belong to two different books. In October 2026 the\n  advanced search displayed at most 200 result rows: narrow a query until its list is\n  shorter than that, and never count a capped list as complete.\n- **Otzar HaHochma.** A large paid library with whole-library OCR search, used through its\n  web viewer. Without a licence you see only the first pages of each book, and a licence does\n  not open every publisher's books. Editions of one work paginate differently, so an older\n  edition is not a page-for-page substitute. Export is limited: list the pages you need before\n  paying for access.\n- **Dicta library.** A free library of OCR'd rabbinic books, many of them responsa, each with\n  a downloadable text file.\n- **Sefaria.** Born-digital texts with their section structure and an API. It holds many\n  Hasidic classics but few of the genres that carry family detail: tales, letters, lineage\n  books and biographies. Its vowel points were often added by a modern editor: treat a pointed\n  spelling there as a hint, never as the historical spelling. Pin the text version you cite.\n- **Lubavitch Library** (chabadlibrary.org). Searchable full text of Chabad books, including\n  the Tzemach Tzedek's responsa. A responsa index of the rabbis who asked the questions,\n  arranged by town, lists a town's rabbis.\n- **National Library of Israel.** The book catalogue (many items can be read only in the\n  library building), the archives records and the Ktiv manuscript portal. The archives records\n  include the microfilms that the Central Archives for the History of the Jewish People, now\n  part of the library, made in archives of the former Soviet Union. The search reads catalogue\n  descriptions, not the files, and Hebrew, Latin and Cyrillic spellings return different sets.\n- **Project Zikaron** (Touro University Libraries). Full text of yizkor books, pinkasim and\n  memoirs, where town rabbis and their families often appear. Its terms forbid automated\n  access, and a printed page number can differ from the image number.\n- **The Hebrew press.** The Historical Jewish Press site of the National Library of Israel\n  and Tel Aviv University has searchable 19th-century papers such as *HaMagid* and\n  *HaMelitz*, with notices of rabbinic appointments, obituaries and donor lists that name\n  town rabbis.\n- **Dynasty and community websites.** Each Hasidic group keeps its own sites with early\n  editions, bulletins, memorial biographies and images of documents that the big libraries\n  lack. Modern retyped editions carry new page numbers.\n- **Rabbinic directories and dictionaries.** *Oholei Shem* (1912) lists the rabbis serving\n  around 1912 by town, with birth and appointment years. *Da'at Kedoshim* (1897–1898) gives\n  genealogies of rabbinic families. Yitzhak Alfasi's personalities volumes of the\n  *Encyclopedia of Hasidism* are cited by volume and page or column as printed. N. Z.\n  Friedman's *Otzar ha-Rabbanim* (1975) gives numbered entries for about 20,000 rabbis, and\n  Meir Wunder's *Me'orei Galitsiyah* gives genealogies of Galician rabbinic families by\n  surname. Coverage of small towns is uneven; check a directory's scope before reading its\n  silence.\n- **Lineage compilations (sifrei yichus).** Dynasty genealogies, descendant lists and large\n  published genealogies such as Neil Rosenstein's *The Unbroken Chain*. Their prefaces often\n  warn that the early generations are not verified, and some modern compilations cite online\n  trees. Treat each early-generation link as a lead until a contemporary text supports it.\n  When an online tree agrees with a published genealogy, check whether the tree copied it.\n- **State archives of the Russian Empire.** Files on the election of crown rabbis (candidates,\n  voter lists, signatures), prayer-house board elections with member lists and\n  rabbinical-school records. JewishGen's index \"Jewish Religious Personnel in the Russian\n  Empire, 1853–1854\" lists rabbis and synagogue officials by town. The crown rabbi held a state\n  post; he was not necessarily the community's spiritual rabbi, and neither office stands in\n  for the other.\n- **Online trees and wikis.** Geni, Wikipedia and community wikis give leads only. Their\n  child lists are assembled by editors, and many rabbinic descent profiles sit behind a login.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7c18b57ddf5b","kind":"platform-ui","anchor":"**Reading a hit in the 1853–1854 personnel index.** JewishGen's index to G. M. Deych's book has\nfour fields: surname, given name, guberniya and town. The year each person took up his duties,\nthe size of the congregation, the office he held and his pay are in the book, not in the index.\nA congregation's list names anything from one officer (a rabbi, treasurer or gabbai) to ten.\nSo a hit shows that the person was one of the officers listed for that town, not that he was a\nrabbi; read his entry in the book before you give him a title. JewishGen names copies at YIVO,\nthe New York Public Library, Harvard and Berkeley. A miss does not show that the person held no\noffice: congregations may have been left out, and where the book lists a town without names, the\nguberniya official probably could not find them. [S11 @2026-11-12]","sources":["S11"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b71ffb102288","kind":"platform-ui","anchor":"**Bar-Ilan Responsa Project.** The project describes its database as the Bible, both Talmuds,\nMidrash, the Zohar, the codes of law and a large collection of responsa, with biographical data\non the authors of responsa (responsa.co.il). It calls the responsa rich in historical,\nsociological and economic data. Its texts are typed in, proofread and hyperlinked. Because they\nare typed in, check a passage you cite against a printed edition or a scan. [S21 @2026-11-12]","sources":["S21"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5010794fad6a","kind":"historical","anchor":"**Words for engagement and marriage.** Jastrow's dictionary gives חָתָן as \"son-in-law;\nbridegroom\" [S22] and כַּלָּה as \"bride; daughter-in-law\" [S23], so in an engagement letter these\nwords can name a betrothed couple. It defines שִׁידּוּךְ as \"negotiations preliminary to\nbetrothal\" [S24]. אירוסין (erusin) historically names the first part of marriage itself: a\nbetrothed couple are regarded as husband and wife for legal purposes and need a divorce to part\n[S25]. Since the Middle Ages the betrothal has customarily been performed during the wedding ceremony,\nan old custom formalises an engagement by signing a tena'im (תנאים) document, and in modern\nHebrew אירוסין means an engagement [S25]. In a traditional wedding the marriage contract (כתובה)\nis signed by two witnesses and read aloud under the wedding canopy [S26]. Read which stage a\npassage describes before you write it into a tree.","sources":["S22","S23","S24","S25","S26"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7f2e0be104f9","kind":"method","anchor":"- **People are named by office, father and town, rarely by surname.** A typical form is\n  \"R. Moshe son of R. Yaakov, av beit din of X\", \"the Rav of X\" or \"R. Leib Rivke's\".\n  Search the town title alongside the surname. In one English edition of Breslov works, the same rabbi appeared under the town title repeatedly but under his surname only once [S27].\n- **One name can identify several men.** Before assigning “R. Nachman” in *Siach Sarfei Kodesh*, distinguish candidates by kin, town, office and date [S27]. A town title can also pass to a successor.\n- **The genealogy sits around the text, not in it.** Title pages, introductions,\n  approbations (haskamot), subscriber lists (prenumeranten), letters, testaments, appendices\n  and an author's own autobiographical passages name fathers, fathers-in-law and wives.\n- **One account circulates as many copies.** Reprints, translations, retellings, lineage\n  compilations and online trees repeat a single witness.\n- **\"Descended from the rebbe\" usually means something else.** Discipleship, belonging to a\n  court's following or a marriage into the rebbe's household are all more common than descent.\n- **Search tools see a damaged layer.** OCR errors, attached prefix letters, vowel points,\n  acronyms and Yiddish spellings hide names that are on the printed page.","sources":["S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8c676cd14404","kind":"method","anchor":"1. Ask when the person lived (within about 30 years), where, and exactly what is claimed: a\n   rabbi in the family, descent from a named rebbe, a town office, or discipleship.\n2. Walk the documented tree two or three generations up before searching. An identification\n   needs era, region and at least one more identifying link that the passage also gives: a\n   named relative (father, father-in-law, wife or brother) or an office held at a known date.\n   A common given name alone, such as a father named Yaakov, is not enough.\n3. Read the era markers that follow names. הי\"ד marks a man killed as a martyr; ז\"ל and זצ\"ל\n   mark a man dead when the text was written, as do זצוק\"ל, זי\"ע and נ\"ע in Hasidic usage;\n   שליט\"א, נ\"י, שיחי' and תחי' mark a person alive then. A son who signs הכ\"מ after his\n   father's name is writing within twelve months of the father's death. A posthumous printing\n   can add ז\"ל, so the printing year does not date a death. When the passage's own date is\n   known, such as a dated introduction, ז\"ל shows the person was dead by then.\n4. Check each surname hit in its sentence. Kinprove’s search for a Ukrainian family returned namesakes from other regions [S27]. Determine whether the word in each new hit names a person or a place before using it as relationship evidence.","sources":["S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-928180c54f43","kind":"method","anchor":"1. List every form actually seen for the person and for each place, in Hebrew, Yiddish,\n   Russian and Latin script, with where each was seen. Keep the user's spelling as a literal\n   input; do not correct it silently.\n2. Add the sacred and everyday given-name pairs: Tzvi and Hirsh, Aryeh and Leib, Dov and\n   Ber, Ze'ev and Wolf, Naftali and Hirsh, Yehudah and Leib, Shlomo and Zalman.\n3. Search Yiddish and Hebrew place spellings separately, including אומין and אומן for Uman. A dated Otzar search found books under one spelling of a town after another gave zero [S27]. Keep the exact query, date and editions returned for each form.\n4. Search a distinctive letter pair in the text to find additional spellings. For Kremenchug, טש occurs inside קרימינטשאק, including in the addressee of letter 226 in *Alim le-Terufah* [S29].\n5. Keep a table of each spelling and its hit count. A missing form looks exactly like a\n   missing person.","sources":["S27","S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f18ca9df4504","kind":"method","anchor":"- **Vowel points.** Remove them from both the text and the query. The points belong to one\n  edition, not to the work.\n- **Prefix letters.** Allow up to three attached prefixes (ו ב כ ל מ ש ה, and the Aramaic ד\n  as in דק\"ק) at the start of a word only. At the end, allow suffixes through stems (below)\n  and the Yiddish town adjective in ער, but do not let a short name match inside a longer\n  word. In some books a town name occurs only with a prefix, never bare.\n- **Stems.** A final letter becomes a medial letter before a suffix, so חותן never matches\n  חותנו. Search the stem חותנ.\n- **Full and defective spelling.** Search both, for example קודש and קדש.\n- **Acronyms.** Texts print them with Hebrew gershayim and geresh (״ ׳) or with ASCII quotes\n  (\" '). Search every form.\n- **Whole words.** As a substring, הרב also matches הרבה, and ז\"ל also matches inside חז\"ל\n  and וז\"ל. Print the distinct forms that matched before you count.\n- **OCR damage.** Expect letters of similar shape to be swapped (ד and ר; ה, ח and ת; ב and\n  כ; ו, ז, י and ן; ס and ם), and words split by spaces. A swapped letter often still makes a\n  real word. Approbations, notes and much front matter are set in Rashi script, which OCR\n  reads far worse: read those pages as images (see\n  [HebrewBooks search recovery](hebrewbooks-search-recovery.md)).\n- **Finding forms the query missed.** Read selected sections of a relevant book, note new spellings and kinship phrases, and search again. A closed keyword list returned no candidates in sections where a later reading found them [S27]. Check each proposed reading against the page.","sources":["S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ebd4ad20de42","kind":"method","anchor":"Separate the statements even when they share a publication. A field report describes a 1991 article whose letter facsimiles named the betrothed pair, the editor identified the girl’s father and inferred the season, and a named chain of tellers supplied the account of her death. The article and facsimiles have yet to be checked against that report [S28]. Record each statement with its own page and basis.","sources":["S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
