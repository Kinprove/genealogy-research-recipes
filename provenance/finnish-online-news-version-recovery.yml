claims:
  - {"id":"C-87d328184675","kind":"method","anchor":"Use a print issue as evidence of what appeared in print. Verify the web version in a dated web capture. If a phrase is missing from today’s text or archive search, save the original public URL as a locator and compare earlier captures before deciding what readers could have seen. [S2], [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d6a6fda8edbb","kind":"example","anchor":"In one case reported by Kyläkoski, preserved print issues could not establish the wording of the newspaper’s earlier web coverage. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ab8eddf0eaa5","kind":"portal-availability","anchor":"Search the exact public URL in the Wayback Machine, then try the Finnish Web Archive’s public index for the article URL and earlier site addresses. Use an indexed harvest date to select a version at a legal deposit workstation and inspect the article itself. The National Library began continuous news harvesting in 2009, with schedules that vary by outlet. Check the date and exact URL before treating an index hit as a recovered version. [S2 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22]","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-29d4bde8ceda","kind":"portal-availability","anchor":"At a legal deposit workstation, record the original URL, title, publication or revision date as displayed, harvest date and the text relevant to the question. Check the terminal’s copy rules before taking any material away. A missing capture leaves the publication history unresolved. [S2 @2026-11-22], [S3 @2026-11-22]","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-35215409ff92","kind":"platform-ui","anchor":"Submit the verified public article URL to Save Page Now only with authorization and after checking what the capture would expose. Open the resulting capture to confirm the wording and cite its URL and capture date with the original article URL. [S4 @2026-11-22]","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
