claims:
  - {"id":"C-fa838e81715d","kind":"historical","anchor":"Start with the historical post office name, which may differ from the town name. According to the presenter, begin with the RG 28 series descriptions and select the appointment register by date [S1†]. Browse M1131 for 1789–1832 and check the volume’s own arrangement, including the alphabetical ranges for volumes 6 and 7. For 1832–September 1971, browse M841 by state, county and office name. If an office was renamed, work back through successive county frames. [S2] [S3] [S4] [S6]","sources":["S1","S2","S3","S4","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-39988dbb485e","kind":"historical","anchor":"Read the M841 key before expanding a code. In that key, P means presidential appointment and P&S means presidential appointment and Senate confirmation. Compare successive lines for the same office. Record the first appointment, later appointment and Senate confirmation dates in separate fields. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d80e2a177c35","kind":"portal-availability","anchor":"According to the presenter, follow a confirmed appointment into the Senate Executive Journal and check the volume’s index for multiple entries [S1† @2026-11-21]. Record the nomination and Senate action separately. When the nomination names a predecessor, compare the full names and the reason for the vacancy before treating them as two people. Use the access links by Congress in the legislative archives guide. [S5 @2026-11-21]","sources":["S1","S5"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-9a96e2914305","kind":"historical","anchor":"Check the relevant edition of the Official Register of the United States for a postmaster or postal contractor. For editions issued in two volumes, use the postal volume. Keep its listing date and compensation separate from the appointment and confirmation dates. [S7]","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a8f98818504","kind":"historical","anchor":"For the office’s location, browse M1126 site reports, 1837–1950, by state or territory, county or parish, and office. Record the report date, landmarks and any proposed move separately from the person’s appointment dates. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
