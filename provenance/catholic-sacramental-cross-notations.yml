claims:
  - {"id":"C-cb5eb9a5336b","kind":"historical","anchor":"The papal decree *Ne temere* (dated August 1907) took effect on Easter Sunday, 19 April 1908. Its article IX §2 requires the pastor who performs a marriage to notify the pastor of each party's baptism parish, either directly or through the bishop's office (the episcopal curia), and requires the marriage to be noted in the book of baptisms. This is why marriage entries state baptism parishes and why baptism entries carry marriage notes. One presenter says that in baptism registers \"after Easter 1908, you may begin to see this extra column\" with the marriage [S2]. Another presenter describes the marriage priest writing to the baptism priest [S1]. The 1917 Code of Canon Law, in force from 19 May 1918, kept the duty in canons 470 §2 and 1103 §2, except for a secret marriage of conscience (canon 1107) [S6, S7, S8, S9]. The 1983 Code, in force from 27 November 1983, keeps it in canons 535 §2 and 1122 [S9, S10, S11]. So the rule has applied without a break since Easter 1908, apart from marriages of conscience: a missing note after that date is a gap in compliance or survival, not in the rule.","sources":["S2","S1","S6","S7","S8","S9","S10","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4d95893bc06b","kind":"historical","anchor":"Read the label and wording of each annotation. Besides marriage, canon 535 §2 of the Latin Church’s 1983 Code specifies confirmation, adoption, sacred orders, perpetual profession in a religious institute and changes of canonical status [S10]. The ordinary register has an exception for a marriage celebrated secretly under canon 1133 [S11]. Under the 2015 revision of canon 1682 §2, once a declaration of nullity takes effect it must be noted in the marriage and baptismal registers [S13]. Distinguish each later entry by event and date.","sources":["S10","S11","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-77c0b322fced","kind":"unclassified","anchor":"Indexes can leave out the baptism-parish statements and the marriage notes, so never treat an index as complete. They give the names, the date and perhaps an origin, while the priests' notes stay on the page [S1]. Findmypast's Philadelphia baptism search fields, for example, include no marriage field. Go from every index hit to the original register image before you decide whether a cross-notation exists. Read the whole entry, the margins and every column of the page, including the far-right remarks column [S1], [S5].","sources":["S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5e16227a7650","kind":"method","anchor":"1. In the original marriage entry, copy word for word each party's stated baptism parish or church. Also copy any wording such as \"baptism confirmed at…\" [S1].\n2. Preserve references to churches of other denominations. Allen reports a Catholic marriage entry naming a Pennsylvania Methodist church and a date she could not identify as birth or baptism [S3]. Use both possibilities to search the Methodist records and record which event the entry actually describes.\n3. Search the stated baptism parish even when the marriage took place overseas or decades later. In Lisson’s interview with Jen Baldwin, an 1877 County Cork baptism entry reportedly carried the later Philadelphia marriage [S4]. Check the margin and remarks column of the original baptism page [S5].\n4. The marriage may have taken place in a third parish. Ideally the bride's baptism parish, the groom's baptism parish and the marriage parish all refer to each other, but not always [S1]. Treat each of the three as a separate retrieval target.","sources":["S1","S3","S4","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3d5224aa3af0","kind":"method","anchor":"1. Open the original baptism page, including its margin and far-right column. Read the heading across the whole spread, then identify what the individual note records. The Philadelphia register discussed in the Findmypast demonstration had space for several later events, including confirmation and marriage [S5].\n2. Transcribe the spouse, church, marriage date, witnesses and officiant where present [S2], [S5]. The Philadelphia demonstration traces a note on a 1919 baptism to a marriage dated 14 February 1943 at the Cathedral of Saints Peter and Paul [S5]. Use that date and church to distinguish the marriage entry from the later note about it.\n3. Use the note only to find the actual marriage entry in the named church. Then search for a civil marriage registration for that place and date [S5].\n4. If the collection description identifies only a diocese, check the volume title and nearby pages for the officiating parish. If it remains unidentified, keep the image reference and ask the diocesan archive which parish supplied that volume [S3].","sources":["S5","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d2ee8b9ea9b3","kind":"portal-availability","anchor":"The archdiocese's Catholic Historical Research Center (CHRC) takes research requests by form for records 75 or more years old. Newer records, and all certified copies, come from the parish. Philadelphia archdiocesan baptisms and marriages before 1920 are on Findmypast [S12 @2026-11-08].","sources":["S12"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-292a49a8ec78","kind":"unclassified","anchor":"- A marriage note on a baptism entry was written later, from a report sent by the marriage parish. It is not the marriage record. Record it as its own observation: the page and image locator, the date of the note and the hand, where these can be seen, and its literal text. Do not merge it into the original baptism statement [S4], [S1].\n- Keep the baptism date, any birth date given and any marriage note as separate dated observations [S2].\n- Read a missing note by date:\n  - **Marriage before Easter 1908:** a blank margin is expected and tells you nothing.\n  - **Marriage after Easter 1908:** a blank margin is weak negative evidence. It does not show there was no marriage. Practice was \"ideally, not all the time\", priests' detail varied [S1], and one presenter does not know how widespread the practice is [S5]. Use the blank to search the other parishes and civil records. Do not conclude anything from it.\n- Witnesses and godparents named in either entry are leads for associates or kin. They are not proof of a relationship [S4], [S5].","sources":["S4","S1","S2","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e9008ffb0761","kind":"method","anchor":"If a Latin American Catholic marriage entry gives no baptism parish, include the marriage parish in the baptism search, especially for the bride if the entry places her family there [S14], [S15]. Also search the parish serving any specific place of origin the entry names. Treat the ceremony location as a search lead and verify birthplace separately.","sources":["S14","S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0f21816333af","kind":"method","anchor":"When the archive lists the parish baptism entries under births, choose the birth volume by the person's birth year and check the original entry for the later marriage note [S16], [S17].","sources":["S16","S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
