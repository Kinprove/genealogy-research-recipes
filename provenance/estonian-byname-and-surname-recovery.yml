claims:
  - {"id":"C-5de2b714adf2","kind":"method","anchor":"Copy the whole name in its recorded order. Treat the genitive element or elements before the given name as candidate bynames. Test farm, family, occupation, nickname and patronymic readings against the rest of the entry. One person can carry more than one element [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6d1ab994d0ce","kind":"method","anchor":"Keep a historical *perenimi*, a byname carried by the family, separate in your notes from the formally assigned *perekonnanimi*. Record the date, manor, village, farm and household beside each spelling [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-95a654d3b424","kind":"method","anchor":"Trace the same household across a move using revision or parish records. Compare its last byname at the old farm, the destination farm’s name before arrival and the household’s first byname after arrival. A name carried to the new farm supports the family-name reading. Adoption of a name already attached to the destination supports the farm-name reading [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e1a7d9b466e5","kind":"method","anchor":"When a name stays put, compare the farm’s dated location with those of neighboring farms and check who held it before and after the family. A persistent name at an outlying farm can reflect the place outlasting its occupants. Leave the name type open when the available maps and records cannot establish which farm the entries mean [S1]. Use [place-name resolution](historical-place-name-resolution.md) for competing locations.","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6050f4bc343a","kind":"custody","anchor":"Search the period governorate’s assignment record in Saaga. For Livonia, start with the 1826 interim revisions in EAA.1865. For the Governorate of Estonia, start with the 1835 surname registers in EAA.1864 [S2 @2026-11-22]. Use [image coverage verification](archival-image-coverage-verification.md) to document the volumes and images actually inspected.","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0b4b8827cc2d","kind":"method","anchor":"Compare the assigned form with the earlier bynames of the documented household. Use a matching form or stem in a 16th-century farmholder list to investigate the age of the name. Carry the family only as far as linked households or direct relationships support it. Log each interval without a recovered attestation and use [evidence and proof](evidence-proof-judgment.md) for a proposed lineage link [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
