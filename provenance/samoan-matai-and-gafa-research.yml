  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2025/09/being-samoan-traditions-and-exploring-your-genealogy/"],"published":"2025-09-05","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used David Ridd’s advice on searching title and birth-name forms, pursuing village and diaspora leads, and recording oral gafa and the extended aiga.","entry_sha256":"d334a23b284a5b452d0cb6aaf0038186a8ba3956ebed72d085c0f98e06845005","claims":["C-01","C-02","C-03","C-04","C-05","C-06","C-07"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://mjca.gov.ws/judiciary/land-titles-court.html"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Official scope of the court’s customary land and chiefly title jurisdiction.","entry_sha256":"434a914fe978045fcbd1f80519c3def29b84d6937463b4170ac4566656b2be7a","claims":["C-02"],"review":"reviewed"}
  - {"id":"S3","kind":"catalogue","urls":["https://collections.tepapa.govt.nz/object/1094507?asr=1&mb=c&page=1&ros=1&rtp=1"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Collection description links chiefly titles to families and origin places and identifies the islands covered by this book.","entry_sha256":"492283b9bfe436d5dc90227f60f96b3de5ad12da89a70cb5398ac5ad24e09066","claims":["C-01"],"review":"reviewed"}
  - {"id":"S4","kind":"catalogue","urls":["https://collections.tepapa.govt.nz/object/113128"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Collection description documents multiple holders of the Tui Atua title associated with Falefa.","entry_sha256":"1c1499011d716a140e4fff71f41f2c7b079db05c9a230107910ca7f005094ad6","claims":["C-01"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"Search for the matai title as well as the birth surname in land and public records. Track the title as a role associated with a person at a particular date. Use a title’s village association to choose the locality to research and retain separate candidates when several people held the title. [S1], [S3], [S4]","sources":["S1","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"For a customary-land or chiefly-title dispute in the Independent State of Samoa, consult the Land and Titles Court as the jurisdiction to investigate. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Look for a title in wills and public documents as well as custom and land records. Keep the form in each document with its source and date. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Record the gafa from its oral or written account with the reciter or compiler, the village and the line of transmission. Include the extended aiga and label the stated connections between families. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"If the centralized search misses, ask the village, congregation or family custodian about the specific register or gafa and the period it covers. Search the local baptismal entries with the birth and title forms you already have. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Record the sponsor’s name and role as written in a baptism. If a grandparent is named as sponsor, use the entry to guide the search for kinship records. Check the evidence for the family relationship separately from the sponsor role. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Start with historical arrival and vital records in the place of settlement if the family’s Samoan locality is unknown. Extract a recorded village or title verbatim from those records and use it to select the Samoan locality and the title forms to check. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
