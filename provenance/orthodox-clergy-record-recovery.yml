claims:
  - {"id":"C-c96af11fc496","kind":"unclassified","anchor":"For dating jurisdiction and logging custody in general, use [research documentation](research-documentation.md). For auditing directory editions and reading each entry as a dated observation, use the [city-directory observation workflow](city-directory-observation-workflow.md). For merge and split rulings, and for the rule that a different name does not by itself mean a different person, use [evidence/proof judgment](evidence-proof-judgment.md). For 1930s arrest and repression files, use [Russian military and repression record episodes](russian-military-repression-record-episodes.md). For case boundaries and pages actually inspected, use [archival image coverage verification](archival-image-coverage-verification.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7b5175600859","kind":"method","anchor":"- Do not route by the present-day oblast. The Yekaterinburg diocese was formed in 1885 from the eastern part of the Perm diocese and covered Verkhoturye, Yekaterinburg, Irbit, Kamyshlov and Shadrinsk uezds. [S6] The Ural forum's reference article adds that Krasnoufimsk uezd stayed in the Perm diocese until 1917, and that Turinsk uezd and part of Tyumen uezd belonged to Tobolsk. [S6] For each post, write down the diocese, uezd and deanery (заказ, благочиннический округ) in force on that date.\n- For the 18th century, look in Tobolsk first. Participants found trans-Ural clergy in the Tobolsk consistory fond (Tobolsk archive, Ф. И-156) [S7], [S12], [S17], [S25], and found Kungur zakaz clergy in a 1755 statement at RGADA (Ф. 439, оп. 1, д. 27) [S17]. A participant cited a list of transfers made by the consistory in 1755–1758 as Ф. 155, оп. 1755, д. 246 of the Tobolsk archive. [S12] The consistory fond is otherwise cited as И-156, so confirm the fond number before you request it.\n- Expect one family's records to be spread over several archives under the names those archives use now. The threads cite metrical books and confession lists for parishes in the Shadrinsk and Kurgan area held in Chelyabinsk (ОГАЧО), Omsk (ГАОО), Shadrinsk (ГАШ), Dalmatovo, a municipal archive at Artemovsky, Perm (ГАПК) and Sverdlovsk (ГАСО). [S1], [S4], [S11], [S12], [S15], [S17] Log each custodian you checked.\n- Same-faith (единоверческие) churches were grouped in their own deanery, not under the civil uezd. The 1915 Yekaterinburg reference book lists them in a separate единоверческий округ, and the clergy registers for that deanery are filed separately (1912: ГАСО ф. 6, оп. 4, д. 334). [S10]\n- Use dated consistory files on clergy appointments to show which zakaz and diocese a parish belonged to in each period. A participant warned that these files will name few or no parishioners. [S19]\n- Match the church as well as the place name. A transfer to the Предтеченская church in Теченское поселье points to the later Теченское село, a different place from Теченская слобода [S12]. If a church village is missing from civil gazetteers, check diocesan appointment and transfer notices for the church name [S9].","sources":["S6","S7","S12","S17","S25","S1","S4","S11","S15","S10","S19","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d6371c31a35c","kind":"method","anchor":"- Before you go to an archive, read every surviving diocesan address-calendar (адрес-календарь) and reference book (справочная книга/книжка). Find the uezd, deanery and parish, then copy the name, patronymic, rank, office, education, length of service and awards where the edition gives them. [S6] The reference article lists these editions: Perm 1870, 1877, 1882, 1885, 1894, 1896, 1899, 1909, 1912; Yekaterinburg 1886, 1887, 1890, 1900, 1902, 1903, 1904, 1905, 1906, 1909, 1915; Tobolsk 1884, 1895, 1897, 1901, 1903, 1908, 1913. Full clergy lists without education or awards also appear in the Perm provincial address-calendars for 1896 and 1897. [S6] For gaps between reference books, check the separate clergy lists for Perm in 1898 [S41] and Yekaterinburg in 1899 [S42], identified in the regional bibliography [S7]. Mark each edition as inspected, unavailable or not yet seen.\n- Record every age together with the date it refers to. According to the reference article, the 1915 Yekaterinburg book gives ages as of 1 January 1914, not as of the title year. [S6] For other editions that print ages (the 1912 Perm book does [S5], [S8]), keep the reference date as unknown unless the edition states it. Where no age is printed, estimate a birth range from the school-leaving year. The article puts the end of the clerical училище at about 14–15 and the end of seminary at about 20–22. [S6] An age mismatch makes a candidate less likely. It does not exclude him.\n- Decode the abbreviations from the edition itself, for example the higher division of a named училище plus a year, a seminary rank, or \"сверх штата\" (supernumerary). A man listed as supernumerary at a parish may never have held a staff post there. [S1]\n- Read the special sections. The article reports that the 1885 Perm calendar lists men who left the diocese over the previous 20 years: those who died, moved to other dioceses or were dismissed from clerical status. [S6] Use the dismissal date in that section before searching civil records: the entry on p. 186 dates a priest’s departure to 3 August 1871 [S18].\n- Add the 1900 reference book of all Perm seminary graduates from 1800 to 1900. It gives the graduation year, class, rank and later post. The article warns that it was compiled in haste and contains errors, and that many clergy never finished seminary. [S4], [S6], [S8]\n- Use a directory staff list to check a hard-to-read metrical entry. Note the directory's reading and its page next to the original reading, and correct only the element in doubt. [S13]\n- Same surname, compatible patronymics and neighbouring parishes only suggest kinship. The article notes that until 1867 a post often passed to a son or son-in-law. [S6] Record these as hypotheses.","sources":["S6","S41","S42","S7","S5","S8","S1","S18","S4","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3d1164794561","kind":"method","anchor":"- The runs are Perm EV 1867–1919, Yekaterinburg EV 1886–1917 and Tobolsk EV 1882–1919. [S6] The reference article adds that Известия Екатеринбургской церкви (1917–1918) and Известия Екатеринбургской епархии (1919) followed the Yekaterinburg EV. [S6] A transfer notice cited as «Известия Екатеринбургской церкви», 1919, no. 1, p. 9, uses the earlier title. Search both titles and transcribe the masthead of the issue you inspect [S20], [S43].\n- When a gazette notice omits the patronymic, match the staffing, salary or transfer entry to the office and parish in the nearest directory. The 1912 Perm reference book identifies the Sazhino deacon on p. 47 and the Shlyki priest on pp. 67–68 [S5]. Where there is no name index, page the issues for the relevant years and log missing issues [S6].\n- Collect these notice types: appointment, ordination, transfer, award, ban, retirement and death [S6], [S11], [S22]; grants to retired clergy, widows and orphans [S6], [S1], [S13]; a widow's appointment as prosphora-maker [S1]; orphan-capital accounts that name the children year after year [S1], [S22]; decisions on girls' school places, which can mention siblings [S22]; membership lists of church societies [S6], [S20]; the yearly class and rank lists of seminaries, clerical училища and diocesan girls' schools [S3], [S5], [S6]; and jubilee articles and obituaries in the unofficial section (неофициальный отдел, Н.О.) [S6], [S11]. For a Synod award, check «Церковные ведомости» as well as the diocesan gazette (e.g. 15 June 1902, no. 24) [S16].\n- Cite each notice by year, volume, issue number and date, and page, including supplement pagination where it applies (\"прил.\"). [S1], [S11]\n- Keep the deceased cleric’s parish, the place of death and the widow’s later parish separate. The 1892 death notice names the deacon of Baklanskoye, while the 1895 appointment to Peschano-Tavalzhanskoye names his widow as prosphora-maker [S1]. Check the death entry for the place of death. Flag a possible misprint when a gazette’s name reading conflicts with the rest of the run [S22].","sources":["S6","S20","S43","S5","S11","S22","S1","S13","S3","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-30f630407ef3","kind":"method","anchor":"- Clergy registers, also called ведомости о церквах, were compiled every year for every church from the late 18th century. They can give origin, age, birth date and place, education, a dated career, conduct, awards and penalties, property, wife, children (including adult children living elsewhere), sons-in-law, and kinship with the other clergy of the church. [S6] Participants used them for exact dates and households. [S2], [S5], [S8], [S10], [S16], [S23]\n- They are filed in two ways. Some are year volumes covering all churches of a deanery, or of a whole uezd in earlier years, in consistory and deanery fonds. The article gives ГАСО ф. 6, 251, 252 and 698 for these. Others are multi-year volumes for a single church in that church's own fond. [S6] Examples cited: one church for 1871–1899 (ГАШ ф. 387, оп. 1, д. 51) [S1]; deanery volumes for 1894 and 1900 (ГАСО ф. 698, оп. 1, дд. 328, 340) [S11], [S16], [S23]; ГАСО ф. 6, оп. 2, д. 577 (1860) [S18]; ф. 6, оп. 2, д. 643 (1882) and оп. 4, д. 228 (1907) [S2]; ГАСО ф. 603, оп. 1, д. 695 (1909) [S5]; ГАПК ф. 542, оп. 1, д. 3 (1916) [S8].\n- The gazettes did not replace the clergy registers. The reference article points out that they had different readers, and states that the registers went on being compiled through the gazette era and at least into the early 1930s. [S6] Search for late registers on that basis, but log any year you cannot find as a coverage gap.\n- Read the register after a cleric’s death for children who have left the household. The 1907 Nevyansk Transfiguration register lists the deceased archpriest’s children, including their occupations, residences, marital status and ages (ГАСО ф. 6, оп. 4, д. 228) [S2]. Distinguish children from wards marked воспитанница [S10].\n- Read the entries for the cleric's colleagues too. Court and complaint notes in a fellow cleric's entry can name the person you are looking for and date a dispute. [S11], [S23]\n- Use the stated social origin (for example \"из крестьян\" of a named works) to link a cleric to his birth family. [S8]\n- Trace the deanery and church series separately before recording a coverage gap. For the third Kamyshlov deanery, the reported 1860 volume is ГАСО ф. 6, оп. 2, д. 580. The church’s own ф. 280 was suggested for the later years [S22]. Record the parish and years actually covered in either series before turning to substitutes [S1].","sources":["S6","S2","S5","S8","S10","S16","S23","S1","S11","S18","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09770d070f19","kind":"method","anchor":"- Clergy do appear in revision lists, despite the common belief that they do not. The article gives ГАПК ф. 111, оп. 1, дд. 2418, 2712, 2764 and 2981 for the 1833 lists of Yekaterinburg, Kamyshlov and Irbit uezds and the 1795 list of Verkhoturye. [S6] Entries show the previous revision's household and where a man left to, which links a cleric under a new surname to his father's household. [S22] A participant cited the 1833 Yekaterinburg list as ф. 111, оп. 1, д. 418. Check that locator against д. 2418 before you request it. [S22] Clergy revision lists from 1811 and 1834 also survive for Orenburg diocese parishes. [S5], [S12]\n- Confession lists start with the clergy and their households and can give a reason for absence, such as seminary study. [S6] Read successive years, not one. For how to read them and where the bound runs are, use [reading confession lists](russian-orthodox-confession-list-reading.md#6-find-the-lists).\n- For the 18th century, use the Tobolsk consistory's periodic statements on clergy and their sons, which give name, patronymic, age and sons: И-156, оп. 1, д. 2226 (1748, 1751); оп. 2, д. 2857 (1772); оп. 3, д. 335 (1773–1774); оп. 3, д. 1192 (1777); and a 1754 confession report, оп. 1, д. 1965. [S12], [S14], [S17], [S25]\n- Find staff rosters inside other files. Metrical books carry periodic lists of the church's clergy [S6], and a case on fining people who missed confession lists each parish's clergy by year (ГАСО ф. 24, оп. 1, д. 2293). [S25]\n- To test whether a man served in a gap, compare a church ledger for one year (1805: ГАСО ф. 6, оп. 2, д. 421) with a later roster (1820: ГАСО ф. 6, оп. 3, д. 21). Then find the family in the next surviving confession list (1849, in a combined metrical and confession volume for 1849–1851: Artemovsky municipal archive, ф. 13, оп. 1, д. 1, л. 1–1об.), and report the years in between as unresolved. [S15] A marriage may sit in the bride's home parish even after her father stopped serving there. [S15]\n- Before you accept a cleric as a child's father, check his age and his death window at the child's birth, the mother's age, and the nearest confession-list household. An Orthodox priest or deacon could not marry a second time while he remained in holy orders, so a late child of a widowed priest or deacon cannot come from a second marriage while he keeps that rank. [S14], [S26] A deacon listed against a psalmist vacancy retains his ordained rank [S1]. Distinguish the lower church offices (дьячок, пономарь, псаломщик): an 1866 marriage entry explicitly records a serving дьячок’s second marriage [S13]. Search the marriage entry and the dismissal record together: an 1845 second marriage describes the groom as «сложивший сан священства» (ГАСО ф. 6, оп. 1, д. 300) [S17], and the 1885 Perm calendar dates a different former priest’s dismissal before his remarriage [S18].","sources":["S6","S22","S5","S12","S14","S17","S25","S15","S26","S1","S13","S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-474d9e4efaf9","kind":"method","anchor":"- Separate same-named clergy by patronymic, school and graduation year, and household. [S1], [S8] Record a variant patronymic in a metrical entry as a conflict to resolve, not as a second man. [S1]\n- A transfer list without patronymics can point to the wrong man. Check the \"ordained to this church\" date in the registers of the sending and receiving churches. Unbroken service at one church since before the transfer points to a namesake. [S12]\n- Trace each surname form through the parish, post and father’s name. Compare seminary records for a school-assigned name [S16], revision remarks for a surname derived from the family’s village [S22], and 18th-century clergy statements for a form derived from a patronymic [S25]. A sexton’s son appears with the same patronymic and surname in an 1842 entry (ГАСО ф. 6, оп. 2, д. 483, л. 119об.–120). That wording suggests a paternal name to test, but does not establish when the surname changed [S21]. Compare spelling across the metrical book, gazette and register, and check published surname explanations against the family’s own records [S16].\n- If a cleric disappears from the parish staff, check the directory’s dismissal section (step 2). Compare subsequent marriages, jury rolls and the seminary graduate book by patronymic, graduation year and age before identifying a civil official [S18]. For a законоучитель, search the provincial address-calendars and the Памятные книжки of the Orenburg educational district as well as the parish lists [S6], [S20]. A Rezh priest also held teaching appointments at secular schools, so concurrent posts can belong to one man [S10]. Test a misrecorded name if the posts still do not align [S20].","sources":["S1","S8","S12","S16","S22","S25","S21","S18","S6","S20","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f7fb81bafe02","kind":"method","anchor":"- Metrical books from 1919–1920 still name the serving priest. [S23]\n- Use the regional lists of people deprived of voting rights (лишенцы), arranged by okrug, district, village soviet and year: ГАСО ф. р-88, оп. 9 — д. 2, т. 1 (1924); д. 33, т. 2 (1925); д. 235 (1929). [S16], [S23], [S24] Record the list, volume and folio, and quote the stated before-and-after occupation as written. [S24]\n- For the 1930 and 1937 cases, a participant pointed to ГААОСО in Yekaterinburg and advised bringing documents that prove kinship. [S8] A Kuibyshev-region priest executed in 1937 shared the Ural cleric’s full name but proved to be a different man [S17]. Match service and family evidence before assigning an arrest record.","sources":["S23","S16","S24","S8","S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-edbef45636fd","kind":"unclassified","anchor":"1. A diocese and deanery timeline for each parish, with dates and the custodian archive for each series.\n2. A service chronology with one row per source: source type, edition or issue and date, page, post, stated age with its reference date, and the level inspected.\n3. A household table from the clergy registers, revision lists and confession lists, with full locators.\n4. A namesake and surname-change register: the candidates, the linking evidence (post, parish, father, school year, household), conflicts, and status.\n5. A series-coverage list: which years of each register, confession and revision series were searched, which are missing, and which remain unrequested.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b4d67f8fe553","kind":"method","anchor":"**First test whether the family-story priest held holy orders.** A miller remembered as a priest had donated to a new iconostasis [S27]. Search the directories and clergy registers (steps 2 and 4) for an ordained rank, then check for service as a choir singer, donor or церковный староста. In the 19th century the warden was a parishioner elected for three years, confirmed by the diocese to assist the rector with church business [S28].","sources":["S27","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-47471eb0326e","kind":"method","anchor":"- **Search brothers under different surnames.** Check the date against the Synod’s 1846 direction to retain the father’s surname and its 1857 direction for sons of fathers recorded without one [S29]. In a Tula petition a grandson explained three brothers’ surnames: Берников from the village Берники, Вознесенский from its Ascension church and Елисеев from the father’s given name [S30]. Search the petition, parish rosters and service records under all three forms. Confirm the village from the family’s posts: a feast-derived surname can fit multiple villages, and place names changed [S31].\n- **Trace a clergy son’s transfer to another estate through the разбор.** Match the rule to the review year. Earlier reviews could send surplus clergy into the army or enter them on the poll-tax rolls. The 1784 decree allowed a choice of estate. The December 1796 order directed surplus sons over 15 to guberniya boards for military service, and the October 1806 order named military orphans’ departments for literate boys under 15, with exemptions and later implementation rules [S32]. A reported consistory order dismissing a priest’s son «в крестьяне» points to the son and grandson in the 1744 Voskresenskoye peasant revision [S33]. Check the receiving estate’s revision or military rolls under the name used on entry: a son’s later petition says his father entered the Moscow military orphans’ department at 14 in 1797 as Елисеев, although the family also used Либин [S30].","sources":["S29","S30","S31","S32","S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a5bf1cd9391e","kind":"historical","anchor":"- **The unofficial section can have another title.** Under its Synod-approved programme the Vyatka diocesan gazette had two sections, the official and the «духовно-литературный», and the second carried historical and statistical accounts of the diocese [S37]. A blogger who works with Vyatka gazettes notes that in some issues the unofficial section is titled «духовно-литературный» and that any article in it, parish sketches and obituaries among them, can name your relatives [S36]. In a gazette's contents, look for obituaries, jubilee articles and parish sketches under that title as well as under «неофициальная часть».","sources":["S37","S36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b393d6853c55","kind":"method","anchor":"- **Look for him in the work he did outside his parish.** A consistory could appoint an ordinary parish priest, of a town or a village, as a духовный следователь to gather the evidence in a case and send it to the consistory [S38]. In the 18th century a parish priest could also head a духовное правление (also called a заказ), which dealt with church building, the appointment and transfer of clergy and their misconduct, while he kept his own church; a study of the boards of Iset province in the 1740s gives such cases and notes that the boards' own fonds of that century have hardly survived there [S39]. A blogger advises looking through the consistory and духовное правление fonds, not only the parish's records [S40]. Search those fonds for the cleric as investigator or board member as well as party to a case, and record a board fond that does not survive as a coverage gap.","sources":["S38","S39","S40"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2704b774fe4b","kind":"portal-availability","anchor":"- **Search the gazettes' text before you page them.** Yandex «Поиск по архивам» runs a project on «Губернские и епархиальные ведомости» that makes the diocesan gazettes searchable in full text [S34 @2026-11-16]. Its help page says a search takes a surname or a settlement and that only signed-in users can view documents [S35 @2026-11-16]. Have the signed-in user search the cleric's surname and every village of his parishes, read the page image of each hit, and then page the issues of the years you need as above: recognised text misreads, so a miss is not a negative ([full text or the paper run](periodical-index-search-retrieval.md#when-a-russian-periodical-has-no-index-full-text-or-the-paper-run)).","sources":["S34","S35"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
