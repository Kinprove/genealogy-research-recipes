claims:
  - {"id":"C-step-01","kind":"method","anchor":"Read *coopvardiekapten* as a merchant captain in the cited Swedish usage. Copy the name as printed, departure and destination ports and the best-supported date window. Before searching, decide whether the route calls for passage through the Sound between Denmark and Sweden [S1], [S2], [S3], [S4].","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-02","kind":"historical","anchor":"A voyage entirely within the Baltic need not appear in the Sound Toll Registers. The surviving toll accounts span 1497–1857 with earlier gaps. Keep an in-Baltic voyage in scope for port records and shipping notices even if no toll entry was found [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-03","kind":"portal-availability","anchor":"From the Groningen dataset description follow the link to Sound Toll Registers Online. Use Database 1 for years before 1634 and Database 2 from 1634 onward. Have the user verify which search entry point opens. Search by the historical captain's name where supported. Compare candidate passages by captain, ports and direction. Follow the register reference before relying on a detail from the database reconstruction [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-04","kind":"method","anchor":"Look for arrivals and departures under each likely port and compare the stated cargo, origin or destination when given. Keep the issue date separate from the sailing or arrival date. Carry same-name captains as alternatives until the route or other records support the match [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
