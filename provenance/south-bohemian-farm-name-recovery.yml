claims:
  - {"id":"C1","kind":"portal-availability","anchor":"Start with the village, estate, approximate transfer year and holding name. For the Třeboň estate, look under *Velkostatek Třeboň* in the archive’s land registers and match the individual village to a volume [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C2","kind":"method","anchor":"Keep each holder’s recorded byname (*příjmí*) with the date and property that identify it. Follow the incoming holder back to the former village or holding and the outgoing holder forward to the next one if the entry gives that lead. A shared farm name does not establish descent. Test the transfer’s relationship clause for inheritance, purchase or entry through marriage [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C3","kind":"portal-availability","anchor":"For a Bošilec transfer near the boundary, open both *Pozemková kniha vsí Bošilec a Lhota*, IA 5AU 7 (1611–1707), and *Pozemková kniha vsi Bošilec*, OS Veselí 44 (1707–1881 with earlier material dated from 1669) [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C4","kind":"example","anchor":"In the reported 1704 Bošilec transfer, the shared farm name in the younger book suggested a father and son, while the older entry gave the incoming holder’s village and said he had married the previous holder’s foster daughter [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C5","kind":"method","anchor":"After a miss under the later farm name, use alternate names from the transfer as leads. If the groom has only a forename and village in the land book, search the parish marriages by that pair and the bride’s forename. Copy both fathers and places of origin. When the marriage village differs from both origins, check the transfer for *schovanka* (foster daughter or ward) and keep the foster household separate from the birth family [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C6","kind":"method","anchor":"Check the list of subjects for the marriage year in the groom’s home village. Compare the groom’s forename, father and village with the parish entry, then compare the bride’s farm name and village in the list’s marriage note with the land book. Treat *má se ženiti* as an intended marriage and seek a separate marriage entry [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C7","kind":"portal-availability","anchor":"In the Třeboň Digital Archive, check *Seigniorial Registers* for the estate and select the *soupis poddaných* by year and village; for the Schwarzenberg books in this case, use the *Velkostatek Třeboň* listing [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C8","kind":"method","anchor":"Check a listed age against the baptism. If you lack a baptism, derive a birth-year range from the inspected lists and carry it back to the parish search. Keep checking later lists for a baptized child whose first expected entry is missing [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
