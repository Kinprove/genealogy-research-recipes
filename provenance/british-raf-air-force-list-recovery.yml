claims:
  - {"id":"C-4a6a1637c513","kind":"portal-availability","anchor":"Search the British Air Force Lists for commissioned-officer entries. On MyHeritage, select United Kingdom, British Air Force Lists, 1919–1945, then check that the issue you need appears in the collection. An Air Force List miss leaves service open, especially for an airman outside the commissioned-officer listings. [S1 @2026-11-21] [S2 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d2fbb2f015dc","kind":"historical","anchor":"For women, check the Women’s Royal Air Force, Women’s Auxiliary Air Force and Princess Mary’s Royal Air Force Nursing Service headings where they fit the issue date. Use Miss or Mrs, the printed rank and the branch to distinguish candidates with similar names. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cddb292d0025","kind":"method","anchor":"Take the issue date from the cover and the effective or seniority date from the entry. Record the rank, branch and any stated unit or posting date beside them. Compare successive issues before assigning a promotion date. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8439efd60c02","kind":"historical","anchor":"Check the key in the issue you are using before decoding rank status. The community guide gives examples of a bold P for probation, t for temporary and w for war substantive. Preserve the printed mark and keep each rank status with its own effective date. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-110978e5dfd7","kind":"portal-availability","anchor":"Use the MyHeritage United Kingdom, Royal Air Force Personnel collection when its 1914–1928 description fits. For early RAF personnel, check the RAF Museum’s pointers to AIR 76 for officers, AIR 78 and AIR 79 for airmen, and AIR 80 for the early Women’s Royal Air Force. Keep the service number and the series reference with the list entries. [S1 @2026-11-21] [S3 @2026-11-21] [S4 @2026-11-21]","sources":["S1","S3","S4"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
