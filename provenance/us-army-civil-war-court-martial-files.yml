sources:
  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=SXbT23qTTUY"],"published":"2022-05-11","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the presenter’s advice to find the separate court-martial paperwork after a service record mentions a general court-martial.","entry_sha256":"14876fb23a1eb80015b613d96434f09378618e29a23385ab4b7aea57f5233409","claims":["C-01"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://www.archives.gov/research/military/army/court-martial-case-files"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Official entry and case-file series, indexing, search by regiment for the Civil War, and what may be in a file.","entry_sha256":"1323f35697c6dbd54c158005cd2f1e788f5d68aa260cc93dd635e6b30a3ce7f4","claims":["C-02","C-03"],"review":"reviewed"}
  - {"id":"S3","kind":"video","urls":["https://www.youtube.com/watch?v=O4DsiIdgiaE"],"published":"2023-10-07","retrieved":"2026-11-23","access":"unknown","rights":null,"basis":"The video URL could not be fetched on 2026-11-23. In the supplied transcript excerpt, the presenter recalls hearing about an alteration note, tentatively associates it with a Lincoln court-martial pardon date, and says he has never looked for the record.","entry_sha256":"71fcc7e8e94569c42408106ee1d4bb1ad00972a108b1d2fc7c3b8cc3c166623d","claims":["C-04"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://www.archives.gov/press/press-releases/2011/nr11-57.html"],"published":"2011-01-24","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. The Archives identifies Patrick Murphy’s pardon as NAID 1839980 and records the alteration from April 14, 1864 to April 14, 1865. The release supplies the correction separately from the image it captions and does not establish whether a notice was attached to the physical record.","entry_sha256":"123bf2bd5c94ca43246c2b0545fa9d6e3c535a1969ee58af58c7e5b6fdda4243","claims":["C-04","C-05"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter’s advice, follow a general court-martial entry in the service record to the separate proceedings held by the National Archives. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"Copy the name, rank, regiment, dates and any general order number from the service record. Look up the proceeding by name or, for the Civil War, by regiment in the Archives 1 finding aids. Read the case key and number into your log and use them to locate the early series in RG 153, Entry PC-29 15, National Archives Identifier 301659. [S2 @2026-11-18]","sources":["S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Extract the charge, plea, testimony, finding and sentence from the surviving documents. Record any later reviewing order separately. An allegation and the court’s finding are different observations. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For a disputed pardon date, transcribe the date as shown and cite the image. Check the catalog entry and case papers for an attached alteration note of the kind reported in the presenter’s recollection [S3†], and search for a separate National Archives correction by the soldier’s name or record identifier [S4]. Log any corrected date with its own citation. Keep the date unresolved if the evidence still conflicts.","sources":["S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"historical","anchor":"The National Archives identified April 14, 1864 as the original date of Lincoln’s pardon of Patrick Murphy (NAID 1839980) after finding that the year on the document had been altered to 1865. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
