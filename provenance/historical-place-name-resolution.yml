claims:
  - {"id":"C-462028537852","kind":"method","anchor":"- Copy the place exactly as written. Record who wrote it, when, in what source, and from whose speech. Do not modernise or correct it in the working record.\n- When a place was written from speech, record the speaker’s and listener’s languages. Test the sounds in the language of the place, including across Spanish–English and German–English spellings [S1], [S2], [S4], [S12]. Use associated places to limit the search; verify the match in an independent record (§7) [S3].\n- A compiled extract may silently regularise a place. Minert’s German church-record compilations normalise spellings and assign localities to 1871–1918 borders [S23]. Transcribe the place from the cited film or image and keep it beside the compiler’s identification.\n- Write down associated places from the same document or family records, such as a parent's parish, a stated district, or other places named in a letter. These limit where you search for sound-alikes [S1], [S15].","sources":["S1","S2","S4","S12","S3","S23","S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d43b810da57f","kind":"method","anchor":"- Search a gazetteer that covers features as well as settlements. For US names, use the Board on Geographic Names (BGN) domestic names / GNIS. For foreign names, use the BGN foreign-names gazetteers. These list populated places plus lakes, hills, valleys and other natural features, each with a feature class and coordinates [S4], [S6], [S11]. Retain historical features and variant names among the candidates [S6]. Jensen reports that a purported German town was a lake whose coordinates led him to the surrounding parishes [S11]. Plot the feature and check the registers that served the area.\n- GNIS no longer holds every feature type. USGS says these administrative feature classes were removed in 2021: the list includes cemeteries, churches, post offices, schools, mines, buildings, dams and parks. [S46] A church, cemetery or post-office name that an older presentation found there may no longer come up. A GNIS miss on one of those classes tells you nothing. Go to dated maps and gazetteers (§3).\n- List every match in the known county, then widen to the state or country and across borders. Check repeated settlement names, natural features and names carried overseas [S4], [S5], [S6], [S8], [S10], [S22]. Keep the jurisdiction and feature class beside each result.\n- A distinctive name in a letter can suggest a region to search first [S21]. Check its distribution across jurisdictions and historical spellings before excluding other regions.\n- Keep each GNIS hit’s feature ID, class, county, state and topographic quadrangle [S6]. For a small locality absent under its own name, find a larger place on the same quadrangle, then inspect nearby labels on the map or in GeoNames [S4].\n- For an illegible spelling, browse the places within the known county or province, or use a gazetteer’s fuzzy search limited to the likely country [S24]. Enter each plausible result as a candidate.\n- **Use the place list in the record's own unit before guessing sound-alikes.** If the record names a unit (a volost, parish or district), list every settlement in it from records of the same period. Use settlement headings in census and tax lists, register entries, and period lists of populated places. Keep the alias forms (\"X, also called Y\") and any alternate names given in brackets. Then match the odd reading against that list. A name can be a river or a resident family's surname standing in for the village.\n  - Compare the extract with the original and with the volost’s settlement headings. A reported identification of “Barzino” as Berdysheva came without the underlying image or an explanation [S25].\n  - Compare watercourses and surnames as well as settlement names. A reported census heading and later settlement list connect Sheveleva/Shevelova to the Shava rivulet and the name Prytkova; a reported 1904 list gives Sheveleva and Prytkova separately, so the earlier forms alone cannot settle “Shavy” [S26].\n  - Compare the uncertain first letter with a legible name in the same hand. Check whether the clerk also wrote each candidate under its normal spelling and compare the readings with a period map [S27]. An incomplete register check cannot establish the identification.\n- **Harvest other people's spellings of the same place.** When a card or list distorts a place name, collect the spellings of that place from other people's records in the same unit: the same guberniya, uezd or volost, or the same военкомат (military commissariat), such as namesakes or fellow conscripts. Take the records you need, not the whole result set, and match each spelling against the unit's place list. Forms written independently that err in different ways but converge on one listed name are strong evidence. A single form that resembles several villages is weak, so list every village it fits. Cards copied from one list are one reading, however many people they cover. A candidate stays a hypothesis until the person is found in that place's own registers, and a negative for one candidate does not transfer to the others.","sources":["S4","S6","S11","S46","S5","S8","S10","S22","S21","S24","S25","S26","S27"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2f3bda6d2249","kind":"method","anchor":"- Every candidate row needs a gazetteer or map dated close to the record. A modern-only match is not a candidate yet. Place names change in three ways:\n  - **Names move.** Compare the modern location with the locality meant at the document date. A newspaper’s Edison near Tacoma referred to today’s South Tacoma, while modern Edison lies farther north [S14].\n  - **Names change.** Search the earlier names of settlements and waterways on dated maps [S17].\n  - **Places disappear.** Check a county map from the record period for a settlement missing from modern maps [S15].\n- **A Soviet-era birthplace that modern directories lack.** If modern directories, OSM/Nominatim and Wikipedia all miss a birthplace from a Soviet-era record, test whether it was a хутор (khutor, a farmstead settlement) or another small place that later dropped out of the lists before you call the name a misspelling. Check dated administrative-territorial handbooks. For the Ukrainian SSR, use «Українська РСР. Адміністративно-територіальний поділ на 1 вересня 1946 року» (the administrative-territorial division as of 1 September 1946; Kyiv, 1947; title and imprint from a search-result catalogue citation) and its later editions [S37†], [S38]. Also check birthplace fields in 1940s military documents, period topographic sheets ([historical maps § Find a vanished cemetery, church or settlement](historical-map-record-recovery.md#find-a-vanished-cemetery-church-or-settlement)) and the neighbouring сельсоветы (village soviets).\n- **A 'founded' date is not first settlement.** A modern reference's 'founded in 19xx' date can mark a rename or a new status, such as becoming a town. Komsomolsk-on-Amur is listed as founded in 1932, but it was built on the village of Permskoye (Пермское) [S31], as a search-result extract of a Russian encyclopedia also states [S32†]. Do not reject a family birthplace on such a date; check period lists of populated places.\n- **Compare the name at the event date with the name at the document date.** A later certificate can use the newer name. Trace it back before choosing the register. From the inspected page of the thread, Kalinino led to the register for Yugo-Knaufsky zavod, but a birth with the expected date and given name had a different surname and the researcher reported that the match was unconfirmed [S29]. Also search a later index under each name, for example Petersburg, Petrograd and Leningrad; four results under one spelling do not establish the index’s naming policy [S30].\n- **A district can move between oblasts.** Identify the locality in the unit in force at the event and again when the document was written. A family account placed Tarusa district in Kaluga except for its Tula years, overlooking the Moscow interval [S57], [S58]. Much of the district formed in 1929 from Tarusa volost, Kaluga uezd and guberniya. At formation it belonged to Serpukhov okrug of Moscow oblast; on 26 September 1937 it joined Tula oblast and on 5 July 1944 Kaluga oblast [S58].\n- **Read the seal separately from the jurisdiction at the event.** A 1930 Krapivna district marriage certificate reportedly bore «Тул. Г.» for Tula guberniya after the district had passed to Tula okrug of Moscow oblast [S59], [S60]. Use the seal to identify the village soviet, then map each member village to its own parish. The reported family’s village belonged to a neighbouring parish [S59].\n- **Moscow guberniya civil registers of 1919–1929 are filed by registry office.** One researcher reports these books in TsGAMO (the Central State Archive of Moscow Oblast), fond 2510, opis 1, with case titles naming the registry office, such as a volost ZAGS [S55]. Find the village's volost in the 1920s before searching, because volosts were merged and renamed. In Moscow uezd, a June 1918 resolution merged volosts, and the names adopted in October 1918 included Razinskaya (the former Izmailovskaya, Pekhorskaya and Kuchinskaya) and Ukhtomskaya (the former Perovo-Kuskovskaya and Lyuberetskaya) [S56]. Search the case titles by the stem of the new name: try «Ухтом» as well as the full adjective «Ухтомская» [S55]. If the volost office's books do not cover the place or year, search the uezd and town offices' books too.\n- Read the period gazetteer for nearby places, civil registry, post office and railway. Check its date and any name-change supplements, including when using Meyers Orts- und Verkehrs-Lexikon (1912 edition) [S13]. For a mobile worker, try variants in gazetteers published during the service years and compare station names against the dated postings [S16].\n- For Galicia, take the official spelling and the administrative unit from period gazetteers, and record which edition gave each form. The Austrian ones are the Special-Orts-Repertorium for Galicia (Vienna 1886 and 1893, from the 1880 and 1890 censuses) and the Gemeindelexikon vol. XII Galizien (Vienna 1907, from the 1900 census according to a search-result extract) [S39], [S40†]. For interwar Poland, the *Skorowidz miejscowości Rzeczypospolitej Polskiej* (gazetteer of places of the Polish Republic) is a bibliographic lead: a 2001 county history, partially read, cites its volume II, Łódź voivodeship (Warsaw 1925), compiled from the census of 30 September 1921 [S41]. Check the edition's title page before relying on it. Tadeusz Bystrzycki's *Skorowidz miejscowości Rzeczypospolitej Polskiej* (Przemyśl–Warszawa, Książnica Naukowa, ca. 1933) is a separate work with a near-identical title; it names the authorities and offices competent for each place [S42]. To fix a Galician or Bukovinian place's jurisdiction at the event date and its country today, see [Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).\n- For Bessarabian uezds and districts by period, see [Route a Bessarabian or Moldovan record by date, district and bank of the Dniester](bessarabia-moldova-record-routing.md).\n- Read the map symbol and labels at the site. A place in an address can name a creek and the surrounding ranching area, as the Medicine Lodge example illustrates [S15].","sources":["S14","S17","S15","S37","S38","S31","S32","S29","S30","S57","S58","S59","S60","S55","S56","S13","S16","S39","S40","S41","S42"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-601f7ac7af3c","kind":"method","anchor":"- Map each syllable and regional term into the source language, for example Middle→Mittel and Lower Franconia→Unterfranken. Check the national gazetteer first (Meyers), then the alphabetical list in the regional (state-level) gazetteer, in this case Bavaria's [S12].\n- Compare the gazetteer district for each syllable match with the district as written. If the district itself looks phonetic, test that reading against its period spelling before accepting the locality [S12].\n- If only the end of a name is legible, use a reverse-alphabetical place index such as Minert's German place-name indexes [S23].\n- For Irish names, use logainm.ie, the bilingual Placenames Database of Ireland, which gives county, barony, civil parish and townland. Check the candidate at every level [S2].\n- **Name the mechanism behind a distorted Russian-Empire form.** Explain each difference between the written form and a candidate by a named change: a hearing error (a voiced for a voiceless consonant, a dropped or added vowel), a cursive look-alike, an abbreviation closed with a dot, or a Russified Romanian or Polish stem or suffix. Russified Bessarabian suffixes include -ешты for Romanian -ești (Fălești, Фалешты) and -ауцы for -ăuți (Mărcăuți, Маркауцы; an archival catalogue writes Grimăncăuți as Grimankautsy) [S33], [S34], [S35], [S36]. Treat these as examples, not conversion rules. State which changes support the candidate, and never chain arbitrary substitutions to reach a sound-alike.","sources":["S12","S23","S2","S33","S34","S35","S36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-14a5f755626f","kind":"method","anchor":"- **Scottish farm towns.** A Scottish residence name in a register or family letter may be a farm town: a cluster of farm buildings within a parish or estate, not a town. Find it on 1:25,000 Ordnance Survey or National Library of Scotland maps. Use 1:25,000 rather than 1:50,000, because the smaller farm-town names appear only at the larger scale. NLS has a side-by-side viewer for comparing an old map with modern imagery [S18], [S19]. Use the recorded farm or estate to keep same-surname households in one parish apart rather than merging them [S18].\n- **Welsh common nouns in the abode column.** Treat *Cwm* (“valley”) as a possible farm or hamlet name. In the Penmark example, the presenter read Cwm as an abode [S43]; a gazetteer lists a village of that name in the parish [S45]. Compare historical parish entries, the Historic Place Names database, and large-scale or tithe maps for an expanded or anglicised form. Ask local residents or church members about the name and verify it in a dated record before attaching the place.\n- **Parish boundaries.** Check the civil and ecclesiastical jurisdictions at the event date before choosing a repository. In 1891 the Boundary Commissioners transferred the Banffshire part of Cairnie civil parish to Keith, leaving Cairnie wholly in Aberdeenshire [S96].\n- **Nicknames.** Search local usage as well as the official name [S19]. A biography’s “Wrangle Town” reportedly meant a crossroads, identified through county historical journals; the death certificate gave the official locality [S20]. Check county journals, local societies and residents for older names [S17], [S20]. Keep the nickname and its proposed explanation separate from the official place. Verify the link against a dated record, including legislation when a story attributes a name to an official act [S20].\n- **Wherever they were at the time.** An informal name can mean only where the family happened to be at the time [S10]. If no settlement of that name fits, do not force a match to a settlement, and do not adopt the informal reading as the answer either. Add \"informal/locational\" as one candidate row and test it against dated residence evidence.","sources":["S18","S19","S43","S45","S96","S20","S17","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d408a86350ac","kind":"method","anchor":"- Carry decimal coordinates with their sign. Western-Hemisphere longitudes are negative. If you drop the minus sign, the point lands on the opposite side of the world [S4].\n- Plot each candidate against dated county boundaries, for example in the Newberry Library’s Atlas of Historical County Boundaries. List the counties that might hold records for the event date [S5], [S7]. For Small, Idaho, check Fremont County on the 1909 map, before Clark County was created in 1919 [S15].\n- When a valley crosses a county or state boundary, follow travel along the valley and check marriage records on both sides until dated residence or marriage evidence narrows the search [S8].\n- Measure each candidate’s distance from independently documented family places, comparing like feature classes. Use proximity to prioritise records to check [S9].","sources":["S4","S5","S7","S15","S8","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-32d8e932037c","kind":"method","anchor":"- Research every candidate rather than picking the one that fits the family story. For each one, check its settlement date, its population around the event date, older gazetteers, and town and county records [S10]. Use ordinary record research (land, probate and so on) to decide which state and county a common name means [S6].\n- **Check the stated owner or unit.** Compare each same-named place with a dated estate list or administrative inventory. Exclude a place only if the documented ownership or jurisdiction conflicts with the record. A forum participant’s claim that a Chernovskoye lay outside the Stroganov estates needs that check [S25].\n- **Trace a search engine’s place identification to its source.** List period gazetteer entries and renamings. Check the exact birth date in the Standesamt register that covered each candidate at the date. In a reported Josefsdorf search, the birth was absent from the Zembowitz and Domb registers on the date checked; those misses neither established the proposed hamlet nor disposed of other same-named places [S28]. Record which registers, dates and spellings were actually searched.\n- Test names from the same family together on a dated map. Small and Medicine Lodge fit a Reno in 1909 Fremont County, Idaho, redirecting the search away from Reno, Nevada [S15].\n- Plot dated service postings beside children’s birthplaces [S16]. Use other dated clues, such as a letter’s reference to gold diggings, to propose destinations and test them against travel or residence evidence [S21].\n- Keep the sound-alike provisional until an independent record names the place and fits the person. For Mulvin near Ardstraw, the presenter describes a church record in one account and a marriage record held at the Family History Library in another [S1], [S3]. Obtain the cited entry and establish what it actually says. See [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S10","S6","S25","S28","S15","S16","S21","S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2b4fee58d090","kind":"historical","anchor":"- **Two Nakhichevans.** An Armenian family's Nakhichevan can mean either of two places, so keep both as candidates until the uezd, guberniya or other dated evidence decides. Nakhichevan-on-Don (Нахичевань-на-Дону, at first Nor Nakhichevan) was founded on the lower Don by Armenians resettled from Crimea, who arrived at the end of 1779; in December 1928 it was joined to Rostov-on-Don and then became the city's Proletarsky district [S47]. The other was an uezd town of Erivan guberniya, ceded by Persia to Russia in 1828 [S48]. Wikipedia gives 1849 for the guberniya's formation, identifies the uezd town with the city of Nakhchivan and names Azerbaijan's Nakhchivan exclave among the areas the guberniya roughly corresponds to [S49].","sources":["S47","S48","S49"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-525dda0ccd7d","kind":"historical","anchor":"For a residence in or near former Cherokee lands, also plot it on Charles C. Royce's 1884 *Map of the former territorial limits of the Cherokee \"Nation of\" Indians*, which shows the boundaries of each cession the Cherokee made to the colonies and the United States [S50]. It is Plate VIII of Royce's *The Cherokee Nation of Indians* in the Bureau of Ethnology's Fifth Annual Report; Plate IX covers the lands assigned to the Cherokee west of the Mississippi [S51]. Each cession is numbered on the map, and Royce's table gives each number its treaty, a description of the tract and its colour. For example, cession 15, \"Tract in Georgia, known as Wafford's Settlement\", is red and was ceded by the treaty of 24 October 1804 [S51], [S52]. Read the number where the residence falls and take the treaty date from the map's own table. Plot the residence as of its documented date [S53]. Present-day county lines do not show these boundaries. Royce's later maps in *Indian Land Cessions in the United States* (1899) number the cessions differently, so record which map each cession number comes from [S52], [S54].","sources":["S50","S51","S52","S53","S54"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-604c74a6f98f","kind":"method","anchor":"- **A Russian village known by its owners’ name.** Look up the remembered form among the bracketed variants in settlement directories and on period maps, then search the parish they identify. A directory lists Сукромна with the alternatives Корсакова and Корсаково and assigns it to the Trinity church in Троицкое (Ильино) [S62]; the family’s account reports finding its entries there after starting from the memoir’s Корсаково [S61].","sources":["S62","S61"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8c9b69035a9e","kind":"method","anchor":"- **A Soviet birthplace may name a village soviet or a numbered farmstead.** A family account identified the passport’s «Лузское» as Лузский сельсовет. The birth справки and resettlement lists gave plot 106, хутор 4; the remembered хутор Веселый may have been an unofficial name [S63], [S64]. Compare siblings’ birthplace and residence fields. Search the settler and census lists by the recorded plot and хутор number and the jurisdiction of the date. Oparino’s 1926 list under Северо-Двинская губерния gives «Участок № 106 хутор № 4» and a householder [S65]; the district entered Kirov oblast in 1941 [S66].\n  - **Privacy gate:** <!-- privacy-gate: request --> A ZAGS справка on a sibling's birth can name people who may still be living; answer the privacy gate in `SKILL.md` before requesting one.\n  - When a Soviet birthplace cannot be found, request the person's and the siblings' birth справки and name the act record's place lines you need under «Иные сведения» ([Soviet personal files § 1](soviet-personal-file-recovery.md#1-read-the-negative-reply-before-you-treat-it-as-a-dead-end)).","sources":["S63","S64","S65","S66"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-prussian-gazetteer-editions","kind":"historical","anchor":"- **Prussian gazetteers: use the edition nearest the event.** For the early 1820s, use Mützell's *Neues topographisch-statistisch-geographisches Wörterbuch des preussischen Staats* (Halle: Kümmel). Its alphabet runs through five volumes, A–F (1821), G–Ko, Kr–O, P–S and T–Z (1823), so open the volume that holds the name's opening letters [S67], [S78], [S79]. HathiTrust catalogues the set as six volumes dated 1821–1825; check the sixth as well before you record a name as absent [S80]. It covers only the Prussia of its day: the provinces of Schleswig-Holstein, Hanover and Hesse-Nassau were formed in 1867–1868 from territory annexed after the war of 1866 [S81]. For later events, use the *Gemeindelexikon für das Königreich Preußen*, issued as one Heft per province (Schlesien is Heft 6 in both the 1885 and the 1905 editions). Its editions rest on the censuses of 1 December 1885 (Schlesien published 1887), 2 December 1895 and 1 December 1905 (Schlesien published 1908) [S75], [S76], [S77]. The community post offers only the 1905 edition [S67]. Write the edition's census date beside every form and jurisdiction you take from it.","sources":["S67","S78","S79","S80","S81","S75","S76","S77"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-kartenmeister-oder-neisse","kind":"platform-ui","anchor":"- **German names east of the Oder–Neisse line.** For a place in the Prussian provinces east of the Oder and Neisse (East Prussia with the Memel territory, West Prussia, Pomerania, Posen, Silesia and the eastern part of Brandenburg), look up the German name in Kartenmeister. It follows the provinces as they stood in spring 1918 and gives the place's Polish, Russian or Lithuanian name [S67 @2026-11-16], [S70 @2026-11-16], [S71 @2026-11-16], [S72 @2026-11-16] (of the FamilySearch lesson, only the summary was read, not the video). Type the name in German with umlauts (Königsberg, not Koenigsberg) [S70 @2026-11-16], and search by the place name only. Keep every same-named hit as a candidate row, and use Kartenmeister's list of all villages in a Kreis to check them against the Kreis the source states (§2) [S71 @2026-11-16] (again from the lesson, of which only the summary was read). Use the modern name to search today's archives and maps; the working record keeps the form as written (§1).","sources":["S67","S70","S71","S72"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-genteam-gazetteer-scope","kind":"portal-availability","anchor":"- **Places in today's Austria, Czech Republic, Slovakia and Slovenia.** GenTeam's gazetteer lists about 76,000 places in Austria (with South Tyrol) and the Czech, Slovak and Slovenian republics. Each entry gives former and present names, current and former parish, the year the surviving registers begin, archive district, and political district or crownland [S74 @2026-11-16]. Search it from either the historical or the present name [S67 @2026-11-16]. The databases are free after registration [S73 @2026-11-16]: the user signs in with their own account; do not register for them, and enter only the place name. The post presents the gazetteer as covering the whole Austro-Hungarian Empire [S67 @2026-11-16], but its own description names only those four countries [S74 @2026-11-16]. A miss for a place elsewhere in the former monarchy says nothing about the place; for Galicia and Bukovina, use [Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).","sources":["S74","S67","S73"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-alsace-lorraine-name-periods","kind":"historical","anchor":"- **Date a German Alsace-Lorraine name to its period.** The German Wikipedia article on the Reichsland reports that some names were Germanised in 1871 and changed back (Château-Salins was briefly Salzburg), that place names in the Lothringen district were changed on 22 June 1877, that French place names were systematically Germanised only in 1915, during the First World War, and that places received German names again in 1940 (Thionville became Diedenhofen) [S82]. Meyers shows jurisdictions as they stood in 1912 [S68], so it cannot hold a form introduced in 1915. To reach today's French commune, use a list that keeps the periods apart. A library catalogue, read only from a search result, describes Berger-Levrault's *Les communes de l'Alsace-Lorraine* (Nancy, 1919) as giving the French names before 1871 and the German names of 1871–1915 and of 1915–1918 in separate parts [S83†]. The community post converts names with a two-column list of German and present French commune names [S67]; before relying on such a list, find out which German period its forms come from.","sources":["S82","S68","S83","S67"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-gov-jurisdiction-history","kind":"platform-ui","anchor":"- **German lands: read the jurisdiction at the event date in GOV.** Search the place name in GOV, CompGen's historical gazetteer (Geschichtliches Ortsverzeichnis), and open every same-named entry [S67 @2026-11-16]. CompGen's 2020 comparison says GOV holds over 1.2 million places and administrative units, describes them at their successive historical dates and shows this in a graphic, while Meyers gives jurisdictions only as they stood in 1912 [S68 @2026-11-16]. Take the units in force at the event date from GOV's dated affiliations, not from the 1912 Meyers entry. Copy each entry's GOV identifier into the candidate table's feature-ID column (§8); an item page, seen only in a search-result extract, labels it \"GOV-Kennung\" and gives it as a URL [S69† @2026-11-16]. If the site does not load for you, ask the user to open the entry and read out its affiliations.","sources":["S67","S68","S69"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ontario-locator-candidates","kind":"platform-ui","anchor":"- **Ontario Locator.** Search CanadaGenWeb's directory of past and present Ontario place names and aliases [S84 @2026-11-17], [S85 @2026-11-17]. Carry each matching township and county or district into a separate candidate row, then compare its dated jurisdiction with the event (§6) before selecting a place [S85 @2026-11-17].","sources":["S84","S85"],"checked":"2026-11-17","stated_as":"fact","review":"reviewed"}
  - {"id":"C-postal-place-vs-residence","kind":"custody","anchor":"- **Postal place versus residence.** A town in a rural address may name the serving post office rather than the place where the household lived [S86 @2026-11-17], [S87 @2026-11-17]. Locate the office using NARA's dated post-office site location reports (1837–1950) [S88 @2026-11-17], and read the address in its recorded role [S87 @2026-11-17]. Plot the office and the household separately; the office location does not supply the household's coordinates.","sources":["S86","S87","S88"],"checked":"2026-11-17","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ohio-county-organisation","kind":"method","anchor":"- **County creation and organisation.** Keep creation, administrative attachment and full organisation separate when reading Newberry's Ohio chronology [S90]. Take each entry's date and the statute volume, chapter and page it cites into the candidate table's jurisdiction column (§8) [S90]. When an attachment affects the search, read that cited law for the county and function assigned, then select that county's relevant series instead of choosing from a boundary outline alone [S89], [S90].","sources":["S89","S90"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-death-record-city-or-nearby","kind":"method","anchor":"- **A large city in an immigrant's death record.** When the record gives the city as the place of origin, keep the city as written and test both the city itself and nearby towns or villages, as the advice from the available excerpt suggests [S91], [S92]. Use independent evidence to establish the exact locality (§7).","sources":["S91","S92"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-pension-birthplace-boundaries","kind":"method","anchor":"- **A birthplace jurisdiction in a pension.** Compare the boundaries at birth with those when the statement was made. For a reported 1771 North Carolina birth in an 1815 statement (from the available excerpt of the transcript) [S93], include both the later state and its former western lands. Tennessee entered the Union in 1796 from land North Carolina had ceded [S94], [S95]. Narrow the search with dated evidence.","sources":["S93","S94","S95"],"checked":null,"stated_as":"observation","review":"reviewed"}
