claims:
  - {"id":"C-462028537852","kind":"unclassified","anchor":"- Copy the place exactly as written. Record who wrote it, when, in what source, and from whose speech. Do not modernise or correct it in the working record.\n- Ask whether the writer could have misheard someone speaking another language or with a strong accent. In the presenter's Irish case, a US-born daughter wrote down her Irish-speaking father's birthplace from his speech. Her spelling matched no Irish gazetteer entry. Years later the place was resolved as Mulvin, a townland in Ardstraw civil parish, County Tyrone, the parish where his father was reportedly born [S1], [S2], [S3]. Also consider an English listener's spelling of a Spanish name (Slough for Salado) [S4] and an English phonetic spelling of a German one [S12].\n- Treat every compiled extract as normalised until you have checked the cited film or image. Minert's German-immigrant church-record compilations deliberately \"correct\" place spellings to gazetteer forms and assign places to 1871–1918 German Empire borders. Go back to the cited film or image for the literal spelling, and keep the literal and identified forms in separate columns. His team reports that about 30% of place names in the church records were misspelled, and up to 75% for one pastor [S23].\n- Write down associated places from the same document or family records, such as a parent's parish, a stated district, or other places named in a letter. These limit where you search for sound-alikes [S1], [S15].","sources":["S1","S2","S3","S4","S12","S23","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d43b810da57f","kind":"unclassified","anchor":"- Search a gazetteer that covers features as well as settlements. For US names, use the Board on Geographic Names (BGN) domestic names / GNIS. For foreign names, use the BGN foreign-names gazetteers. These list populated places plus lakes, hills, valleys and other natural features, each with a feature class and coordinates [S4], [S6], [S11]. GNIS also keeps features that no longer exist and names no longer in use, flagged as \"historical\", so a vanished place can still turn up. In Jensen's example, a German \"town\" that couldn't be found was a small lake. Its coordinates led to a detailed map and to the surrounding parishes, where the ancestor was found [S11].\n- GNIS no longer holds every feature type. USGS says these administrative feature classes were removed in 2021: the list includes cemeteries, churches, post offices, schools, mines, buildings, dams and parks. [S46] A church, cemetery or post-office name that an older presentation found there may no longer come up. A GNIS miss on one of those classes tells you nothing. Go to dated maps and gazetteers (§3).\n- Search at every level before choosing a match: the county if it is known, then the state or country, then nationally or across countries. Common names repeat. Examples:\n  - Pig Hollow, which the presenter's search found in five states [S4].\n  - Pumpkin Hollow, in many states; the presenter's GNIS search showed about 50 [S5].\n  - Many Pumpkin Centers [S6].\n  - Little Poor Valley, which the presenter's search returned in both Scott County, Virginia and Hawkins County, Tennessee [S8]. Poor Valley itself crosses those two counties.\n  - Several Deer Lakes in Michigan [S10].\n  - Aberdeen, which names several places outside Scotland, including Aberdeen, Washington. The presenter counts about 15 in former British territory [S22].\n- A name found in only one region narrows the search area. The presenter read Nicollet in an 1855 letter as pointing to the Midwest or Great Lakes, the only North American area where she says the name occurs [S21]. Confirm the distribution in GNIS and BGN, then search that region first.\n- For each hit, keep the feature ID, feature class, county, state and listed topographic quadrangle. A GNIS feature ID retrieves that exact entry, and the entry names the topo maps the feature appears on [S6]. If the target is too small to find directly, search the larger place on the same quadrangle. Then look at the names around it in a feature viewer such as GeoNames. Feaster, Arizona was found this way through the Nutrioso quadrangle [S4].\n- If you can't read the spelling, don't stop at a failed exact search. In 2018 the presenter said the FamilySearch Catalog needed an exact place spelling [S24]. Instead, browse \"places within\" the known county or province, or run a fuzzy-spelling gazetteer search limited to the likely country. In the presenter's example, the country filter cut 409 results to 3 [S24]. Any spelling you recover this way is still only a candidate.\n- **Use the place list in the record's own unit before guessing sound-alikes.** If the record names a unit (a volost, parish or district), list every settlement in it from records of the same period. Use settlement headings in census and tax lists, register entries, and period lists of populated places. Keep the alias forms (\"X, also called Y\") and any alternate names given in brackets. Then match the odd reading against that list. A name can be a river or a resident family's surname standing in for the village.\n  - In one forum thread, a commissioned extract in modern spelling named a bride's village \"Barzino\" in the volost. No settlement of that name could be found. A participant proposed building a register of the volost's settlements from the published census books, and the researcher later reported, without saying how, that the village was Berdysheva [S25].\n  - In another thread, \"Shavy\" matched no village. A participant linked it to a 1719 census heading for the village of Sheveleva (Shevelova in 1869) on the Shava rivulet, where the Prytkov family lived. The participant also reported an 1869 Perm list giving it as Shevelova (Prytkova) [S26].\n  - In a parish register, check whether each candidate also appears elsewhere under its normal spelling. A candidate that never appears separately fits an odd spelling better than one the clerk wrote normally elsewhere. Compare the uncertain first letter with a place name in the same hand that you can read with certainty. Participants resolved \"Rinsen\" near Kellinghusen as Rensing this way, and an old-map spelling was offered in support [S27].","sources":["S4","S6","S11","S46","S5","S8","S10","S22","S21","S24","S25","S26","S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2f3bda6d2249","kind":"method","anchor":"- Every candidate row needs a gazetteer or map dated close to the record. A modern-only match is not a candidate yet. Place names change in three ways:\n  - **Names move.** Edison was the name of the area now called South Tacoma. Today's Edison is in northern Washington [S14].\n  - **Names change.** Neuse Crossroads, North Carolina was formerly Dunnsville and Neuse. The Roanoke River carried other names on older maps [S17].\n  - **Places disappear.** Small, Idaho, appears on a 1909 Fremont County map; the researcher in the 2020 episode could not find it on Google Maps [S15].\n- **A Soviet-era birthplace that modern directories lack.** If modern directories, OSM/Nominatim and Wikipedia all miss a birthplace from a Soviet-era record, test whether it was a хутор (khutor, a farmstead settlement) or another small place that later dropped out of the lists before you call the name a misspelling. Check dated administrative-territorial handbooks. For the Ukrainian SSR, use «Українська РСР. Адміністративно-територіальний поділ на 1 вересня 1946 року» (the administrative-territorial division as of 1 September 1946; Kyiv, 1947; title and imprint from a search-result catalogue citation) and its later editions [S37†], [S38]. Also check birthplace fields in 1940s military documents, period topographic sheets ([historical maps § Find a vanished cemetery, church or settlement](historical-map-record-recovery.md#find-a-vanished-cemetery-church-or-settlement)) and the neighbouring сельсоветы (village soviets).\n- **A 'founded' date is not first settlement.** A modern reference's 'founded in 19xx' date can mark a rename or a new status, such as becoming a town. Komsomolsk-on-Amur is listed as founded in 1932, but it was built on the village of Permskoye (Пермское) [S31], as a search-result extract of a Russian encyclopedia also states [S32†]. Do not reject a family birthplace on such a date; check period lists of populated places.\n- **Date the name to when the document was written, not only to the event.** A later certificate, questionnaire or database may record a birthplace under the name in force when it was written rather than the name at the event. Before choosing which registers to search, establish which of the two the document uses. If it is the later name, translate it back to the name in use at the event. In one forum thread, a Soviet certificate gave the birthplace as the village of Kalinino. Its earlier name was Yugo-Knaufsky zavod, and the researcher found a matching birth date and given name in that settlement's register, under a different surname. The researcher asked whether the match was reliable and later reported that this version was not confirmed. The rename was the useful step; the match was not (from the inspected page of a long thread) [S29]. The reverse also applies: search indexes built from later forms under the later name as well. A participant found only four Leningrad-born prisoners in a database of Gulag camp prisoners and inferred that it recorded birthplaces as Leningrad, not Petersburg or Petrograd [S30]. Search every such index under both forms.\n- **A district can move between oblasts.** A Soviet-era document may name the oblast in force when it was written rather than at the event (establish which, as above), and that oblast may have held the district only briefly. In one family's record the Tarusa district (Тарусский район) is in Tula oblast [S57]. The district was formed in 1929 in the Serpukhov okrug of Moscow oblast, mostly from the Tarusa volost of Kaluga uezd, Kaluga guberniya; it joined Tula oblast on 26 September 1937 and Kaluga oblast on 5 July 1944 [S58]. List every unit in such a chain and search under the one in force at the event date: here Kaluga guberniya before 1929, Moscow oblast for 1929–1937, Tula oblast for 1937–1944 and Kaluga oblast afterwards. The family historian who reports the record summarises the district as Tula in 1937–1944 and Kaluga at every other time, which leaves out the Moscow years [S57], [S58].\n- **A seal can name a unit that no longer existed.** When a village soviet's certificate gives no birthplace or age, read its stamp and round seal for the soviet and the district. A 1930 marriage certificate from a village soviet of the Krapivna district (Крапивенский район) carried \"Тул. Г.\" (Tula guberniya) on its seal [S59], although the district had passed in 1929 to the Tula okrug of Moscow oblast [S60]. Identify the soviet's villages on period maps, then search every parish they belonged to: in that case the family's village belonged to a neighbouring parish, not to the parish of the village that gave the soviet its name [S59].\n- **Moscow guberniya civil registers of 1919–1929 are filed by registry office.** One researcher reports these books in TsGAMO (the Central State Archive of Moscow Oblast), fond 2510, opis 1, with case titles naming the registry office, such as a volost ZAGS [S55]. Find the village's volost in the 1920s before searching, because volosts were merged and renamed. In Moscow uezd, a June 1918 resolution merged volosts, and the names adopted in October 1918 included Razinskaya (the former Izmailovskaya, Pekhorskaya and Kuchinskaya) and Ukhtomskaya (the former Perovo-Kuskovskaya and Lyuberetskaya) [S56]. Search the case titles by the stem of the new name: the researcher's search for «Ухтомская» found nothing, and «Ухтом» found the books [S55]. If the volost office's books do not cover the place or year, search the uezd and town offices' books too.\n- Read period gazetteer entries for location relative to other places, civil registration office, post office and railway. Check name-change supplements too. For the German Empire, the standard gazetteer is Meyers Orts- und Verkehrs-Lexikon (1912 edition). The presenter also has an 80-page German name-change volume issued within three years of one Meyers edition, and he reports a Ukrainian village with six names in the 20th century [S13]. An Irish gazetteer from the Internet Archive, picked from those published within the ancestor's service years (1820s to 1860s), matched most of the Coast Guard station names that no modern map showed once spelling variants were tried [S16].\n- For Galicia, take the official spelling and the administrative unit from period gazetteers, and record which edition gave each form. The Austrian ones are the Special-Orts-Repertorium for Galicia (Vienna 1886 and 1893, from the 1880 and 1890 censuses) and the Gemeindelexikon vol. XII Galizien (Vienna 1907, from the 1900 census according to a search-result extract) [S39], [S40†]. For interwar Poland, the *Skorowidz miejscowości Rzeczypospolitej Polskiej* (gazetteer of places of the Polish Republic) is a bibliographic lead: a 2001 county history, partially read, cites its volume II, Łódź voivodeship (Warsaw 1925), compiled from the census of 30 September 1921 [S41]. Check the edition's title page before relying on it. Tadeusz Bystrzycki's *Skorowidz miejscowości Rzeczypospolitej Polskiej* (Przemyśl–Warszawa, Książnica Naukowa, ca. 1933) is a separate work with a near-identical title; it names the authorities and offices competent for each place [S42]. To fix a Galician or Bukovinian place's jurisdiction at the event date and its country today, see [Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).\n- For Bessarabian uezds and districts by period, see [Route a Bessarabian or Moldovan record by date, district and bank of the Dniester](bessarabia-moldova-record-routing.md).\n- Record whether each name on a dated map is a town, a creek or an area. On the 1909 map, Medicine Lodge was a creek and a ranching area, not a town [S15].","sources":["S14","S17","S15","S37","S38","S31","S32","S29","S30","S57","S58","S59","S60","S55","S56","S13","S16","S39","S40","S41","S42"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-601f7ac7af3c","kind":"unclassified","anchor":"- Map each syllable and regional term into the source language, for example Middle→Mittel and Lower Franconia→Unterfranken. Check the national gazetteer first (Meyers), then the alphabetical list in the regional (state-level) gazetteer, in this case Bavaria's [S12].\n- Accept a candidate only when the gazetteer's district fits the district given in the source. In the presenter's example, only one Bavarian entry matched the converted syllables, and the district the gazetteer listed for it corrected the phonetic district name in the biography [S12].\n- If only the end of a name is legible, use a reverse-alphabetical place index such as Minert's German place-name indexes [S23].\n- For Irish names, use logainm.ie, the bilingual Placenames Database of Ireland, which gives county, barony, civil parish and townland. Check the candidate at every level [S2].\n- **Name the mechanism behind a distorted Russian-Empire form.** Explain each difference between the written form and a candidate by a named change: a hearing error (a voiced for a voiceless consonant, a dropped or added vowel), a cursive look-alike, an abbreviation closed with a dot, or a Russified Romanian or Polish stem or suffix. Russified Bessarabian suffixes include -ешты for Romanian -ești (Fălești, Фалешты) and -ауцы for -ăuți (Mărcăuți, Маркауцы; an archival catalogue writes Grimăncăuți as Grimankautsy) [S33], [S34], [S35], [S36]. Treat these as examples, not conversion rules. State which changes support the candidate, and never chain arbitrary substitutions to reach a sound-alike.","sources":["S12","S23","S2","S33","S34","S35","S36"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-14a5f755626f","kind":"unclassified","anchor":"- **Scottish farm towns.** A Scottish residence name in a register or family letter may be a farm town: a cluster of farm buildings within a parish or estate, not a town. Find it on 1:25,000 Ordnance Survey or National Library of Scotland maps. Use 1:25,000 rather than 1:50,000, because the smaller farm-town names appear only at the larger scale. NLS has a side-by-side viewer for comparing an old map with modern imagery [S18], [S19]. Use the recorded farm or estate to keep same-surname households in one parish apart rather than merging them [S18].\n- **Welsh common nouns as farm or hamlet names.** If a Welsh register's abode column gives a common noun where the parish would normally appear (for example *Cwm*, 'valley'), treat it as the name of a particular farm or hamlet. Do not translate it and dismiss it as a description. In the presenter's Penmark (Glamorgan) burial example the abode reads *Cwm* [S43]. Gazetteers of 1870–72 and 1894–5 list Cwm as a village in Penmark parish [S44], [S45]. Check parish entries in historical gazetteers, the Historic Place Names database and large-scale or tithe maps, where the name may appear in an expanded or anglicised form. If it still can't be found, ask local church members or residents. Confirm it in a dated map or record before you attach it.\n- **Parish boundaries.** Parishes can change county. Cairnie lay across the Aberdeenshire–Banffshire line until 1891, when the Boundary Commissioners transferred its Banffshire part to the Banffshire parish of Keith. After that, Cairnie was wholly in Aberdeenshire. (The presenter described this change the other way round [S19].) Treat the nearest parish only as a candidate repository until you confirm its jurisdiction at the event date.\n- **Nicknames.** Before calling a name nonexistent, check whether it is a local nickname:\n  - Fogieloan (Foggieloan) is the old and local name for Aberchirder [S19].\n  - In a published biography, Wrangle Town turned out, from county historical journals, to be the nickname for a five-road crossroads with taverns. The subject's 1929 death certificate gave the official place [S20].\n  - Soap Hill, a name later dropped from maps, was explained by local memory [S20].","sources":["S18","S19","S43","S44","S45","S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c6240e1d8148","kind":"unclassified","anchor":"Search county historical journals, local histories, and local societies or their social-media groups [S20], [S17].\n- **Oral explanations are leads, not proof.** Record them as leads that need documents to back them up. The presenter herself planned to check the Soap Hill account against legislative records [S20]. Record the official place from another record separately from the nickname.\n- **Wherever they were at the time.** An informal name can mean only where the family happened to be at the time [S10]. If no settlement of that name fits, do not force a match to a settlement, and do not adopt the informal reading as the answer either. Add \"informal/locational\" as one candidate row and test it against dated residence evidence.","sources":["S20","S17","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d408a86350ac","kind":"unclassified","anchor":"- Carry decimal coordinates with their sign. Western-Hemisphere longitudes are negative. If you drop the minus sign, the point lands on the opposite side of the world [S4].\n- Plot each candidate against dated county boundaries, for example the Newberry Library's Atlas of Historical County Boundaries (US changes through 2000). List every county that may have created records at the event date [S5], [S7]. Small, Idaho shows why this matters: it was in Fremont County in 1909, but the area is now in Clark County, which was created from Fremont in 1919 [S15].\n- If the feature is a valley or area that crosses a boundary, keep both sides as candidate record jurisdictions until the residence is located more precisely. The presenter's Little Poor Valley family lived in Virginia and found wives in Tennessee by travelling along the valley [S8].\n- Measure each candidate's distance from the family's documented places. The presenter's GNIS search returned Clove Valley, Dutchess County as a populated place 16 miles from where a son died [S9].","sources":["S4","S5","S7","S15","S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-32d8e932037c","kind":"unclassified","anchor":"- Research every candidate rather than picking the one that fits the family story. For each one, check its settlement date, its population around the event date, older gazetteers, and town and county records [S10]. Use ordinary record research (land, probate and so on) to decide which state and county a common name means [S6].\n- **Check the owner or unit the record states.** If the record says the person came from a named estate, owner, volost or district, drop any same-named place that lay outside it at the date. In one forum thread, a 1711 census of the Stroganov estates gave the family's origin as a Chernovskaya on those estates. A participant ruled out a same-named Chernovskoye on the Siva, about 250 km from the family's home by the poster's estimate, because it did not belong to the Stroganovs [S25]. **Limit:** that ownership statement is the participant's, and the thread doesn't document it. Check it in a dated estate or administrative list.\n- **An unsourced identification is not a candidate.** Don't accept a place identification from a search engine or an AI summary that no printed gazetteer supports until its source is shown. List the same-named places from printed gazetteers for the period, including renamings. Then check the exact birth date in the civil registry office (Standesamt) register that covered each place at the date. In one forum thread, a search engine equated \"Josefsdorf\" with a hamlet beside the family's later home. A participant found it in no printed gazetteer. He then checked the exact date in two civil registers: the one covering that area (Zembowitz) and the one covering an Upper Silesian Josefsdorf (Domb). The birth was in neither. Participants also listed three West Prussian places named Josefsdorf for the researcher to check, and noted four Volhynian places named Józefin. The thread doesn't report any of those being checked [S28]. **Limit:** a failed check means the birth is not in those two registers. It does not rule the places out, and it does not make the unsourced identification true.\n- Look for a set of names that fit together on one dated map. Small, Reno and Medicine Lodge all fit within 1909 Fremont County, Idaho, which ruled out Reno, Nevada [S15].\n- Plot dated postings beside the children's birthplaces. A puzzling birthplace made sense once it lined up with the father's Coast Guard assignment [S16].\n- Use other dated context in the document. In the 1855 letter, \"the gold diggings\" led the presenter to consider the Australian goldfields [S21]. Record any inference like that as a stated premise.\n- Keep a sound-alike as a hypothesis until it is named in a record where the subject gave the place himself, or in a reliably recorded official record. In the presenter's case, Mulvin, found by a sound-alike search near Ardstraw, was confirmed only when an early church record in special collections showed the man giving it as his birthplace [S1]. In a later retelling, the presenter says a marriage record held only at the Family History Library played that role [S3]. Further weighing belongs in [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S10","S6","S25","S28","S15","S16","S21","S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b4fee58d090","kind":"historical","anchor":"- **Two Nakhichevans.** An Armenian family's Nakhichevan can mean either of two places, so keep both as candidates until the uezd, guberniya or other dated evidence decides. Nakhichevan-on-Don (Нахичевань-на-Дону, at first Nor Nakhichevan) was founded on the lower Don by Armenians resettled from Crimea, who arrived at the end of 1779; in December 1928 it was joined to Rostov-on-Don and then became the city's Proletarsky district [S47]. The other was an uezd town of Erivan guberniya, ceded by Persia to Russia in 1828 [S48]. Wikipedia gives 1849 for the guberniya's formation, identifies the uezd town with the city of Nakhchivan and names Azerbaijan's Nakhchivan exclave among the areas the guberniya roughly corresponds to [S49].","sources":["S47","S48","S49"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-525dda0ccd7d","kind":"historical","anchor":"For a residence in or near former Cherokee lands, also plot it on Charles C. Royce's 1884 *Map of the former territorial limits of the Cherokee \"Nation of\" Indians*, which shows the boundaries of each cession the Cherokee made to the colonies and the United States [S50]. It is Plate VIII of Royce's *The Cherokee Nation of Indians* in the Bureau of Ethnology's Fifth Annual Report; Plate IX covers the lands assigned to the Cherokee west of the Mississippi [S51]. Each cession is numbered on the map, and Royce's table gives each number its treaty, a description of the tract and its colour. For example, cession 15, \"Tract in Georgia, known as Wafford's Settlement\", is red and was ceded by the treaty of 24 October 1804 [S51], [S52]. Read the number where the residence falls and take the treaty date from the map's own table, as Roberta Estes did for a family living in 1818 in what became Hall County, Georgia [S53]. Present-day county lines do not show these boundaries. Royce's later maps in *Indian Land Cessions in the United States* (1899) number the cessions differently, so record which map each cession number comes from [S52], [S54].","sources":["S50","S51","S52","S53","S54"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-604c74a6f98f","kind":"method","anchor":"- **A Russian village known by its owners' name.** A memoir or family story may give a village a colloquial name rather than its official one. In one Epifan uezd case, the village Корсаково in a memoir was the сельцо (a small landowner's village) Sukromna, which the blog post reporting the case says belonged to the Rimsky-Korsakov family; the family's ancestors were then found in the metrical books of Troitskoe-Ilyino, the parish Sukromna belonged to [S61]. A place directory lists it as «сельцо Сукромна (Корсакова, Корсаково)», shows it on the 1874 three-verst military map, and puts its residents in the parish of the Trinity church in Troitskoe (Ilyino) [S62]. When a remembered name matches no village, look for it as a bracketed alternative name in period lists of populated places and on period maps, then search the parish of the place that carries it.","sources":["S61","S62"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8c9b69035a9e","kind":"method","anchor":"- **A Soviet birthplace that is a village soviet or a numbered farmstead.** A birthplace in a Soviet passport or справка can be a village soviet's name written as a village, and the hamlet a family remembers can be an unofficial name. In one Oparino district case, a woman's passport gave the village «Лузское», which never existed: it was the Лузский сельсовет. Her siblings' passports named other villages, and the family remembered a «хутор Веселый». The children's birth справки with «Иные сведения» gave the family's home as resettlement plot (переселенческий участок) 106, хутор 4, and the resettlement lists of 1909–1915 record the family under that plot and хутор [S63], [S64]. The 1926 census list of populated places of Oparino district, then in Северо-Двинская губерния, names its settlers' farmsteads the same way, as «Участок № 106 хутор № 4» followed by the householder's name [S65]; the district has been in Kirov oblast only since 1941 [S66]. For a resettler family, search census and settler lists by plot and хутор number, under the guberniya in force at the date, not by the family's name for the hamlet.\n  - **Privacy gate:** <!-- privacy-gate: request --> A ZAGS справка on a sibling's birth can name people who may still be living; answer the privacy gate in `SKILL.md` before requesting one.\n  - When a Soviet birthplace cannot be found, request the person's and the siblings' birth справки and name the act record's place lines you need under «Иные сведения» ([Soviet personal files § 1](soviet-personal-file-recovery.md#1-read-the-negative-reply-before-you-treat-it-as-a-dead-end)).","sources":["S63","S64","S65","S66"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-prussian-gazetteer-editions","kind":"historical","anchor":"- **Prussian gazetteers: use the edition nearest the event.** For the early 1820s, use Mützell's *Neues topographisch-statistisch-geographisches Wörterbuch des preussischen Staats* (Halle: Kümmel). Its alphabet runs through five volumes, A–F (1821), G–Ko, Kr–O, P–S and T–Z (1823), so open the volume that holds the name's opening letters [S67], [S78], [S79]. HathiTrust catalogues the set as six volumes dated 1821–1825; check the sixth as well before you record a name as absent [S80]. It covers only the Prussia of its day: the provinces of Schleswig-Holstein, Hanover and Hesse-Nassau were formed in 1867–1868 from territory annexed after the war of 1866 [S81]. For later events, use the *Gemeindelexikon für das Königreich Preußen*, issued as one Heft per province (Schlesien is Heft 6 in both the 1885 and the 1905 editions). Its editions rest on the censuses of 1 December 1885 (Schlesien published 1887), 2 December 1895 and 1 December 1905 (Schlesien published 1908) [S75], [S76], [S77]. The community post offers only the 1905 edition [S67]. Write the edition's census date beside every form and jurisdiction you take from it.","sources":["S67","S78","S79","S80","S81","S75","S76","S77"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-kartenmeister-oder-neisse","kind":"platform-ui","anchor":"- **German names east of the Oder–Neisse line.** For a place in the Prussian provinces east of the Oder and Neisse (East Prussia with the Memel territory, West Prussia, Pomerania, Posen, Silesia and the eastern part of Brandenburg), look up the German name in Kartenmeister. It follows the provinces as they stood in spring 1918 and gives the place's Polish, Russian or Lithuanian name [S67 @2026-11-16], [S70 @2026-11-16], [S71 @2026-11-16], [S72 @2026-11-16] (of the FamilySearch lesson, only the summary was read, not the video). Type the name in German with umlauts (Königsberg, not Koenigsberg) [S70 @2026-11-16], and search by the place name only. Keep every same-named hit as a candidate row, and use Kartenmeister's list of all villages in a Kreis to check them against the Kreis the source states (§2) [S71 @2026-11-16] (again from the lesson, of which only the summary was read). Use the modern name to search today's archives and maps; the working record keeps the form as written (§1).","sources":["S67","S70","S71","S72"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-genteam-gazetteer-scope","kind":"portal-availability","anchor":"- **Places in today's Austria, Czech Republic, Slovakia and Slovenia.** GenTeam's gazetteer lists about 76,000 places in Austria (with South Tyrol) and the Czech, Slovak and Slovenian republics. Each entry gives former and present names, current and former parish, the year the surviving registers begin, archive district, and political district or crownland [S74 @2026-11-16]. Search it from either the historical or the present name [S67 @2026-11-16]. The databases are free after registration [S73 @2026-11-16]: the user signs in with their own account; do not register for them, and enter only the place name. The post presents the gazetteer as covering the whole Austro-Hungarian Empire [S67 @2026-11-16], but its own description names only those four countries [S74 @2026-11-16]. A miss for a place elsewhere in the former monarchy says nothing about the place; for Galicia and Bukovina, use [Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).","sources":["S74","S67","S73"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-alsace-lorraine-name-periods","kind":"historical","anchor":"- **Date a German Alsace-Lorraine name to its period.** The German Wikipedia article on the Reichsland reports that some names were Germanised in 1871 and changed back (Château-Salins was briefly Salzburg), that place names in the Lothringen district were changed on 22 June 1877, that French place names were systematically Germanised only in 1915, during the First World War, and that places received German names again in 1940 (Thionville became Diedenhofen) [S82]. Meyers shows jurisdictions as they stood in 1912 [S68], so it cannot hold a form introduced in 1915. To reach today's French commune, use a list that keeps the periods apart. A library catalogue, read only from a search result, describes Berger-Levrault's *Les communes de l'Alsace-Lorraine* (Nancy, 1919) as giving the French names before 1871 and the German names of 1871–1915 and of 1915–1918 in separate parts [S83†]. The community post converts names with a two-column list of German and present French commune names [S67]; before relying on such a list, find out which German period its forms come from.","sources":["S82","S68","S83","S67"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-gov-jurisdiction-history","kind":"platform-ui","anchor":"- **German lands: read the jurisdiction at the event date in GOV.** Search the place name in GOV, CompGen's historical gazetteer (Geschichtliches Ortsverzeichnis), and open every same-named entry [S67 @2026-11-16]. CompGen's 2020 comparison says GOV holds over 1.2 million places and administrative units, describes them at their successive historical dates and shows this in a graphic, while Meyers gives jurisdictions only as they stood in 1912 [S68 @2026-11-16]. Take the units in force at the event date from GOV's dated affiliations, not from the 1912 Meyers entry. Copy each entry's GOV identifier into the candidate table's feature-ID column (§8); an item page, seen only in a search-result extract, labels it \"GOV-Kennung\" and gives it as a URL [S69† @2026-11-16]. If the site does not load for you, ask the user to open the entry and read out its affiliations.","sources":["S67","S68","S69"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ontario-locator-candidates","kind":"platform-ui","anchor":"- **Ontario Locator.** Search CanadaGenWeb's directory of past and present Ontario place names and aliases [S84 @2026-11-17], [S85 @2026-11-17]. Carry each matching township and county or district into a separate candidate row, then compare its dated jurisdiction with the event (§6) before selecting a place [S85 @2026-11-17].","sources":["S84","S85"],"checked":"2026-11-17","stated_as":"fact","review":"reviewed"}
  - {"id":"C-postal-place-vs-residence","kind":"custody","anchor":"- **Postal place versus residence.** A town in a rural address may name the serving post office rather than the place where the household lived [S86 @2026-11-17], [S87 @2026-11-17]. Locate the office using NARA's dated post-office site location reports (1837–1950) [S88 @2026-11-17], and read the address in its recorded role [S87 @2026-11-17]. Plot the office and the household separately; the office location does not supply the household's coordinates.","sources":["S86","S87","S88"],"checked":"2026-11-17","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ohio-county-organisation","kind":"method","anchor":"- **County creation and organisation.** Keep creation, administrative attachment and full organisation separate when reading Newberry's Ohio chronology [S90]. Take each entry's date and the statute volume, chapter and page it cites into the candidate table's jurisdiction column (§8) [S90]. When an attachment affects the search, read that cited law for the county and function assigned, then select that county's relevant series instead of choosing from a boundary outline alone [S89], [S90].","sources":["S89","S90"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-death-record-city-or-nearby","kind":"method","anchor":"- **A large city in an immigrant's death record.** When the record gives the city as the place of origin, keep the city as written and test both the city itself and nearby towns or villages, as the advice from the available excerpt suggests [S91], [S92]. Use independent evidence to establish the exact locality (§7).","sources":["S91","S92"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-pension-birthplace-boundaries","kind":"method","anchor":"- **A birthplace jurisdiction in a pension.** Compare the boundaries at birth with the boundaries when the statement was made. For the War of 1812 pension example from the available excerpt, compare “North Carolina” in the 1771 birth year and at the 1815 statement date [S93]. Search both North Carolina as it stood in 1815 and the western lands claimed by colonial North Carolina that became Tennessee in 1796 until dated evidence narrows the birthplace [S94], [S95].","sources":["S93","S94","S95"],"checked":null,"stated_as":"observation","review":"reviewed"}
