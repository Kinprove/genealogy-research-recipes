  - {"id":"B57","kind":"web-page","basis":"January 1728 comparison of news reports on pp. 121–126 read 2026-11-23","published":null,"urls":["https://www.academia.edu/10587423/God_dag_min_l%C3%A4sare_Bland_ber%C3%A4ttare_brevskrivare_boktryckare_och_andra_bidragsgivare_i_tidig_svensk_veckopress_1730_1773_Full_text_of_Ph_D_thesis_the_publishing_house_edition_from_2015_including_a_summary_in_English_"],"entry_sha256":"8c9e6e1de24cbddc4ed553e109fff8642b2d0ea29d208eb5ba09d74b76ae6d17","retrieved":"2026-11-23","access":"read","rights":null,"claims":["C-f56e98db75ea"],"review":"reviewed"}
claims:
  - {"id":"C-da22b854e3ea","kind":"unclassified","anchor":"- Your local record handle, such as `R1`.\n- The holding repository and collection or series title.\n- The record type and its date as written.\n- Who created the record: the office, clergyman, clerk, compiler or author.\n- The layer you consulted (original image, transcript, abstract or index), with its provider.\n  When it is not the original, name the original it reproduces as well. Mills's\n  [creator-first citation pattern](https://www.evidenceexplained.com/quicktips/citations-1-2-3-easy)\n  and [layered citations](https://www.evidenceexplained.com/content/quicklesson-19-layered-citations-work-layered-clothing)\n  motivate these two fields.\n- The archive fund, inventory and file reference when present.\n- The film or DGS identifier when present, in a separate field.\n- The volume, page, passenger line or other item locator.\n- The stable item URL or database identifier and date accessed.\n- Saved image filenames, including continuation pages.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cf4bb140ad66","kind":"unclassified","anchor":"When you photograph material in a repository, also photograph the item's identifying pages and\ncontainers. For a book, that means the title page. For a manuscript collection or vertical file,\nit means the folder and the box-end label. Store these images with the target images so each one\nkeeps its collection, box and folder context. A label photo records the arrangement at the time\nof your visit. It supports the citation but is not the citation. The\n[archivist's advice](https://www.youtube.com/watch?v=zNVSOhlUmgI) motivates this step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-700c1f84e25a","kind":"method","anchor":"When saving a register crop, record the year and place from the full page alongside the file, folio and side. In one transcription the researcher copied every word of the entry but missed the date in the heading or margin. A headerless crop can leave the same gap [B2], [B3].","sources":["B2","B3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5ff7257d34a4","kind":"method","anchor":"Copy an archival file number as cited and identify the numbering system. In one set of parish extracts the compiler says inventory 3 was renumbered and marks file 964 as new [B4]. No concordance accompanies the post. Check the dated catalogue or concordance for a matching record description before adopting a replacement number.","sources":["B4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9bcb9678bce7","kind":"method","anchor":"Cite a register entry by file, leaf and side, section, sequence, number and date as written. On leaf 36 of one 1818 deaths transcription, 1 January and 2 January both carry entry no. 1 [B5]. Inspect the register image to identify the columns before assigning a sequence to either entry.","sources":["B5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-38bbdf3a703f","kind":"method","anchor":"Cite a printed local history by book and page, then copy its archival references into a separate field for follow-up. In a posted extract about the 1843 Shadrinsk district unrest, the contributor labels the accompanying source as possible [B6]. Preserve that qualification and check the printed page for who supplied the reference before recording the file as a lead.","sources":["B6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-514a776f231d","kind":"unclassified","anchor":"Before you record a URL, test whether it reopens the specific entry in a new session. Some\nsearch-result URLs expire, and some only reopen the search form. If so, save a capture of the\nentry and record its locators in the fields above. If another site has a persistent page for the\nsame index entry, cite it as a second access path (see the two-provider rule below). The\n[FreeReg example](https://www.youtube.com/watch?v=1OyoTZez5NA) and the\n[GRO index example](https://www.youtube.com/watch?v=QuCBcmiFGFg) motivate this step. Neither\nestablishes how any site's links behave today.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7954096b7380","kind":"method","anchor":"For a broken link copied from a book or article, try the exact URL in the Wayback Machine [B9]. Internet Archive’s published API example distinguishes the archived URL from its capture timestamp [B10]. Record both with the original URL and your access date.","sources":["B9","B10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5b601865701e","kind":"unclassified","anchor":"Historical example: Family History Fanatics, [external-source citations](https://www.youtube.com/watch?v=0nbKvYysxn0)\n(2023-02-06); the demonstrated screen controls are not a current interface contract.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-822599d72440","kind":"unclassified","anchor":"If a shortened note depends on the preceding note for its source, re-resolve that reference\nafter moving, inserting or combining notes. It must identify the intended source and actual\ncited page or item. Replace an ambiguous reference with an explicit short citation, especially\nafter a note containing several sources; a repeated source can still cite a different page.\nKeep the full source record intact. Family Locket's\n[How to Shorten Citations](https://www.youtube.com/watch?v=DWdb7rQFpf0) (2023-11-11)\nmotivates this edit check without imposing an abbreviation, current style rule or software claim.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-630e4e85a749","kind":"unclassified","anchor":"If a lineage application's generation-specific source area cites an earlier member's national\nnumber instead of supporting documents, retain the reference and use it to identify and seek\nthe cited earlier application. Preserve locators and dates for both applications, then inspect\nwhat the earlier source area actually supplies for the relevant generation. Keep a transcription\ndistinct from an inspected application image. The later application's date does not date its\nunderlying evidence; unavailable or uninformative earlier material remains an explicit gap.\nGenealogy TV's [Sons of the American Revolution with Deborah Maddox](https://www.youtube.com/watch?v=EyHcF0-Xqyk)\n(2025-04-11) motivates this handoff without guaranteeing access or proving the claimed lineage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d70924031063","kind":"method","anchor":"When a volume has no printed page number, describe the entry by its actual internal structure, such as the year section, entry number and named event. Add the provider's image number with the provider and the route to that volume, rather than treating an image counter as a page printed in the source. Retain enough of the volume identification and entry context to locate it through another copy if the viewer's numbering changes [N1](https://genealogytipoftheday.com/index.php/2025/04/10/no-page-number/), [N2](https://www.evidenceexplained.com/node/1391).","sources":["N1","N2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f03478abd588","kind":"method","anchor":"For a filmed or digitized register, inspect the cover, spine or title frame and preserve its actual volume label. A catalogue title may describe an entire series rather than the specific volume you used. Record any mismatch explicitly; if the item has no title, supply a descriptive label as your own instead of silently assigning the series title to it [N3](https://genealogytipoftheday.com/index.php/2023/06/27/getting-all-the-details/), [N4](https://www.evidenceexplained.com/node/2230).","sources":["N3","N4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fad5354688be","kind":"method","anchor":"Binding does not establish publication. If the \"book\" is an unpublished typescript or manuscript deposited in a repository, identify its creator, title or supplied description, composition date when known, collection/item locator and holding institution with location. Do not invent a publisher or publication date from the binding or catalogue appearance [N5](https://genealogytipoftheday.com/index.php/2024/12/13/when-to-cite-a-specific-book/), [N6](https://answers.library.georgetown.edu/research/faq/228516).","sources":["N5","N6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a9db72229d72","kind":"method","anchor":"When a U.S. National Archives finding aid identifies the series for a textual record, note the\nrecord group and full entry number. Include the inventory or preliminary inventory number when\nneeded to identify the aid. Use the entry to recover the series title and any series identifier\nthe aid supplies. Check the series description against the record you inspected\n[N8](https://www.archives.gov/files/research/foreign-policy/related-records/rg-76-international-boundaries.pdf).\nIn the finished citation, include the series and the item or file locator alongside the record\ngroup and repository [N9](https://www.archives.gov/files/publications/general-info-leaflets/17-citing-records.pdf).\nThis step draws on Craig R. Scott's note-taking advice from the available excerpt\n[N7](https://www.youtube.com/watch?v=pvr1z7Mchxw).","sources":["N8","N9","N7"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-342a7637e25d","kind":"method","anchor":"If you use *Evidence Explained*, adapt a chapter 3 template from the fourth edition or a\nQuickCheck model from an earlier edition to the source and layer you actually inspected\n[N10](https://genealogical.com/2024/02/05/author-elizabeth-shown-mills-talks-about-the-new-fourth-edition-of-evidence-explained-citing-history-sources-from-artifacts-to-cyberspace-by-elizabeth-shown-mills-cg-cg-fasg/).\nWhen the editor provides a style sheet, use it to format the publication draft\n[N11](https://www.ngsgenealogy.org/wp-content/uploads/2026/01/2025.12.8-NGSQ-style-sheet.pdf)\nand retain the full locator in your working notes. The advice to use a model as a guide comes\nfrom Craig R. Scott's video (partial access via supplied transcript excerpts)\n[N7](https://www.youtube.com/watch?v=pvr1z7Mchxw).","sources":["N10","N11","N7"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c35600eb552b","kind":"method","anchor":"When an old volume-and-page citation fails to locate the entry, look up the name and date in\nthe later index if one exists and check which pagination it uses. For an old probate abstract\nwhose volume number does not match, compare volume labels and date ranges in the repository's\nfinding aid. Confirm the match in the record and preserve both locators with their numbering systems\n[B20, from the available excerpt] [B21] [B22].","sources":["B20","B21","B22"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-71dfa1f13c63","kind":"method","anchor":"For a Connecticut State Library probate estate file, cite the probate district and file number\nwith the estate name and date [B20, from the available excerpt] [B23].","sources":["B20","B23"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bab3f9cbc983","kind":"method","anchor":"For *Settled Accounts for Payment of Accrued Pensions (Final Payments)* under the Act of\n6 April 1838 (RG 217, Inventory 14, Series 724), cite the payment year and account number\nalongside the box number used. If a box number from an older citation fails, use a box\nconcordance if the finding aid supplies one. Verify the account by payment year and account\nnumber, and use those fields to locate it if you have no concordance\n[B24, from the available excerpt] [B28].","sources":["B24","B28"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c3ccfe3edbc","kind":"method","anchor":"When viewing digitized U.S. National Archives microfilm through another provider, inspect the\nopening title frames for the publication title, publication number and roll number. Cite the\nidentified publication with its roll and frame numbers when present. Keep the provider and its\nitem URL or image number in the access layer [B24, from the available excerpt] [B25] [B30].","sources":["B24","B25","B30"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4a086cda3a4f","kind":"platform-ui","anchor":"If the film description is incomplete, recover the title and roll details by publication number\nin the National Archives Microfilm Catalog [B26 @2026-09-19] [B29 @2026-09-19]. For a FamilySearch\nfilm, look up the film or DGS number in the FamilySearch Catalog and match the entry to the item\nand page or image you consulted [B27 @2026-09-19].","sources":["B26","B29","B27"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4f30a7f74f69","kind":"method","anchor":"When making a local screenshot of a supplied social media post, keep the poster's displayed\nname or handle in the frame with the post [B17, from the available excerpt] [B18]. Keep the\nitem URL and capture date with the screenshot on the user's device [B18].","sources":["B17","B18"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fddfb001fa0b","kind":"method","anchor":"To use the *Evidence Explained* model for a Facebook group post, start with the individual\nposter and give the group page title in quotation marks and *Facebook* in italics. Put the URL\nand posting date in parentheses, then identify the specific post or attachment you cited\n[B17, from the available excerpt] [B19].","sources":["B17","B19"],"checked":"2026-09-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0706d4fb8eff","kind":"method","anchor":"For a courthouse book inspected in person, cite the specific court and the courthouse where\nyou consulted the book, with the book title, number and entry page [B34, from the available excerpt].\nRecord the office, room or vault where you found the volume [B35].","sources":["B34","B35"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-281c4557d5aa","kind":"method","anchor":"For a Chicago-style citation to a 1950 U.S. census image, copy the locality, enumeration district,\nsheet number and head of household's name from the schedule [B32]. For an image viewed on\nFamilySearch, include the provider and the specific item URL in the access layer [B31] [B33].\nIf you start with an AI-generated template, fill the placeholders locally and leave unverified\nlocators unresolved [B31].","sources":["B32","B31","B33"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0726ad538879","kind":"method","anchor":"When a working scan or printout may be copied one page at a time, put the full citation with\nthe locator for that page on the same side as the image. Keep the unaltered capture separately.\nCraig R. Scott describes placing the citation below the scan so it stays with a photocopy [N12].","sources":["N12"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-9302d64d8822","kind":"method","anchor":"For an Astia image, keep the viewer URL as an access link and record the archival unit\nreference and exact page or spread separately. If an assigned `URN:NAN` is supplied, save it\nseparately and check whether it resolves to the unit or to the image you used [B40] [B41] [B42].","sources":["B40","B41","B42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cea83f5a4149","kind":"example","anchor":"Reimaging made saved locators unusable for some eighteenth-century Finnish provincial\naccounts in a 2024 report, so record the original page or folio with the link, or use the\nsection heading and entry locator when the account lacks pagination [B39].","sources":["B39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c089c3e15705","kind":"platform-ui","anchor":"For a public historical church-book image on Riksarkivet, copy the displayed source reference\ninto your local notes when available and preserve the full `bildid` with its page suffix.\nTo reopen the image, use the full identifier in the archive's\n[Bildid search](https://sok.riksarkivet.se/bildid) and confirm the displayed volume and page\nagainst the saved citation [B37 @2026-11-22] [B38 @2026-11-22].","sources":["B37","B38"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-be8b631a97d5","kind":"method","anchor":"Before citing an apparent print page number from an e-text, match its edition to a scan and\nlocate the passage on the printed page. If the edition or pagination stays unresolved, cite\nthe e-text with its own locator [B43] [B44].","sources":["B43","B44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e029af516833","kind":"method","anchor":"Identify the digital copy you used when its format changed what you could examine or search.\nIf that difference applies across a body of records, explain its effect in the description\nof those sources [B36].","sources":["B36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7bf8e694578f","kind":"method","anchor":"Use the [Viittausohje](https://ylioppilasmatrikkeli.fi/viittausohje.php) for Yrjö Kotivuori's\n*Ylioppilasmatrikkeli 1640–1852*. Credit Veli-Matti Autio for the 1853–1899 continuation and\nuse the University of Helsinki release announcement to establish its 2010 online publication\nyear. Take the compiler and year from the part you actually used [B45] [B46] [B47] [B48].","sources":["B45","B46","B47","B48"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-36e9f61ade56","kind":"method","anchor":"For *Suomen papisto 1800–1920*, distinguish Iikko B. Voipio's compilation from the later\nweb publication. Check the publisher's account of how the Finnish Literature Society and\nthe Finnish Church Historical Society prepared the edition before assigning credit to an\nentry [B45] [B49].","sources":["B45","B49"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a0da66ea4df6","kind":"method","anchor":"When citing Translocalis as a whole, use the collection URL. When citing the descriptive\nmetadata for one clipping, give its article URL and the place and date shown in its metadata.\nInclude the publication context and your access date in either case [B45] [B55].","sources":["B45","B55"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d332c337b4b8","kind":"method","anchor":"When a history thesis lists only the paper source, check its notes and methods for the\nformat the author consulted. Leave that field unresolved if the citation is all you have.\nThe Finnish thesis study discussed in the source describes authors naming a paper source\nwhen they used a digital copy [B36].","sources":["B36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2944df8f545e","kind":"method","anchor":"When a book has no note marker for a passage, check the back matter for source notes keyed\nto the main-text page number or to words in the passage. Use the page of the claim to find\nits note under *Lähteet* in *Minne katosi Antti Järvi?* [B50] [B51].","sources":["B50","B51"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5feaefe1951c","kind":"method","anchor":"When tracing a work in another author's bibliography, find its citations in the text and\nnotes, then record where and how often the author cited it and which claims the citations accompany.\nLeave direct consultation unresolved unless you have evidence beyond the bibliography\nentry [B54].","sources":["B54"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b9229493f705","kind":"method","anchor":"For a manuscript with no reference-manager output, copy the citations into a separate local\ndocument, split notes that contain multiple works and sort the resulting entries by author.\nCompare the sorted list with the bibliography in both directions and review differences\nagainst the manuscript and its style rules [B52] [B53].","sources":["B52","B53"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f56e98db75ea","kind":"method","anchor":"When citing a dated *Posttidningar* dispatch, copy the reporting city and dispatch date from\nthe heading. Record the issue date and page or column as the retrieval locator [B57]. In a travel\nchronology, record the event's date or relative timing from the text. If a dispatch places a\nfarewell a few days before its own date, keep that wording with the dispatch date and leave\nthe exact day of the farewell unresolved [B56].","sources":["B57","B56"],"checked":null,"stated_as":"fact","review":"reviewed"}
