claims:
  - {"id":"C-da22b854e3ea","kind":"unclassified","anchor":"- Your local record handle, such as `R1`.\n- The holding repository and collection or series title.\n- The record type and its date as written.\n- Who created the record: the office, clergyman, clerk, compiler or author.\n- The layer you consulted (original image, transcript, abstract or index), with its provider.\n  When it is not the original, name the original it reproduces as well. Mills's\n  [creator-first citation pattern](https://www.evidenceexplained.com/quicktips/citations-1-2-3-easy)\n  and [layered citations](https://www.evidenceexplained.com/content/quicklesson-19-layered-citations-work-layered-clothing)\n  motivate these two fields.\n- The archive fund, inventory and file reference when present.\n- The film or DGS identifier when present, in a separate field.\n- The volume, page, passenger line or other item locator.\n- The stable item URL or database identifier and date accessed.\n- Saved image filenames, including continuation pages.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cf4bb140ad66","kind":"unclassified","anchor":"When you photograph material in a repository, also photograph the item's identifying pages and\ncontainers. For a book, that means the title page. For a manuscript collection or vertical file,\nit means the folder and the box-end label. Store these images with the target images so each one\nkeeps its collection, box and folder context. A label photo records the arrangement at the time\nof your visit. It supports the citation but is not the citation. The\n[archivist's advice](https://www.youtube.com/watch?v=zNVSOhlUmgI) motivates this step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-700c1f84e25a","kind":"unclassified","anchor":"A cropped image or transcription of one register entry often loses the page header, so it may\ncarry no year or place. While the full page is still open, record those values from the page\nheader or margin next to the crop's locators. A\n[metrical-book screenshot collection discussion](https://forum.j-roots.info/viewtopic.php?f=181&t=4753)\nmotivates this step. A\n[church-book transcription anecdote](https://forum.ahnenforschung.net/forum/thread/928/)\nshows the same loss when the date stands only in a heading or margin. Neither source supplies the\ncrop's archival signature, which still needs its own locator.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5ff7257d34a4","kind":"unclassified","anchor":"An archive can renumber an inventory, so file numbers in older extracts may no longer match its\ncurrent numbering. Record the file number as you found it, and mark whether it follows the old or\nthe current numbering. A\n[parish-register extract discussion](https://rodgersforum.borda.ru/?1-29-0-00001515-000-0-0-1777199479=)\nmotivates this step: the poster notes that the numbers in his old extracts predate the renumbering\nand labels one file number as new. It does not give a concordance or say when the renumbering\nhappened.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9bcb9678bce7","kind":"unclassified","anchor":"An entry number alone may not identify one entry when a register section runs more than one\nnumbering sequence. Cite the entry by file, leaf and side, section, sequence (in this example,\napparently one for males and one for females), number and date as written. A\n[metrical-book transcription](https://rodgersforum.borda.ru/?1-7-0-00001326-000-0-0-1780129313=)\nmotivates this step. In one year's deaths section, two sequences interleave, so the same numbers\nappear twice. The transcription does not explain the page layout. It does not show that every\nparish or year numbered entries this way, so check the image before choosing the sequence.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-38bbdf3a703f","kind":"unclassified","anchor":"When a printed local history cites archive files for a passage, cite the book and page as the\nsource you actually read. Record the author's fond, inventory, file and folio citation in its own\nfield as a lead to the original. Do not record it as an inspected source. Keep any hedge as given:\nif a citation is marked only as a possible source, record it that way, and note whether the book\nor the person excerpting it supplied the citation. A\n[local-history excerpt thread](https://rodgersforum.borda.ru/?1-7-0-00000258-000-0-0-1776484154=)\nshows both kinds of citation as posted by a forum member; it does not show which of them the book\nprints itself. It does not establish that the cited files exist under those numbers today or that\nthey contain the paraphrased content.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-514a776f231d","kind":"unclassified","anchor":"Before you record a URL, test whether it reopens the specific entry in a new session. Some\nsearch-result URLs expire, and some only reopen the search form. If so, save a capture of the\nentry and record its locators in the fields above. If another site has a persistent page for the\nsame index entry, cite it as a second access path (see the two-provider rule below). The\n[FreeReg example](https://www.youtube.com/watch?v=1OyoTZez5NA) and the\n[GRO index example](https://www.youtube.com/watch?v=QuCBcmiFGFg) motivate this step. Neither\nestablishes how any site's links behave today.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7954096b7380","kind":"unclassified","anchor":"The [historical lookup example](https://www.youtube.com/watch?v=OHDYkHli39k) motivates this\nfallback. [Internet Archive's capture-data documentation](https://archive.org/help/wayback_api.php)\n(updated 2013-09-24; text checked 2026-10-21) describes snapshot links and timestamps;\nthe citation and gap controls are Kinprove synthesis.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5b601865701e","kind":"unclassified","anchor":"Historical example: Family History Fanatics, [external-source citations](https://www.youtube.com/watch?v=0nbKvYysxn0)\n(2023-02-06); the demonstrated screen controls are not a current interface contract.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-822599d72440","kind":"unclassified","anchor":"If a shortened note depends on the preceding note for its source, re-resolve that reference\nafter moving, inserting or combining notes. It must identify the intended source and actual\ncited page or item. Replace an ambiguous reference with an explicit short citation, especially\nafter a note containing several sources; a repeated source can still cite a different page.\nKeep the full source record intact. Family Locket's\n[How to Shorten Citations](https://www.youtube.com/watch?v=DWdb7rQFpf0) (2023-11-11)\nmotivates this edit check without imposing an abbreviation, current style rule or software claim.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-630e4e85a749","kind":"unclassified","anchor":"If a lineage application's generation-specific source area cites an earlier member's national\nnumber instead of supporting documents, retain the reference and use it to identify and seek\nthe cited earlier application. Preserve locators and dates for both applications, then inspect\nwhat the earlier source area actually supplies for the relevant generation. Keep a transcription\ndistinct from an inspected application image. The later application's date does not date its\nunderlying evidence; unavailable or uninformative earlier material remains an explicit gap.\nGenealogy TV's [Sons of the American Revolution with Deborah Maddox](https://www.youtube.com/watch?v=EyHcF0-Xqyk)\n(2025-04-11) motivates this handoff without guaranteeing access or proving the claimed lineage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
