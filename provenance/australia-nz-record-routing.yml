claims:
  - {"id":"C-6aeac45c4882","kind":"unclassified","anchor":"- **Search the registry of the state that holds the place today.** Its index also covers events from before the colony split off from New South Wales: Victoria from 1836 and Queensland from 1829 [S1], [S5], [S7].\n- **Do not send a Port Phillip or Moreton Bay event to New South Wales because it predates separation.** Today's Victorian or Queensland index is the first stop.\n- **Split the Northern Territory at 24 August 1870.** Civil registration there began on that date, and those records are with the NT registry [S24]. For NT events of 1856–1863, search New South Wales records; for 1863–1870, search South Australian records [S1].\n- **Fix the start of civil registration for the state.** Tasmania 1838, Western Australia 1841, South Australia 1842, Victoria 1 July 1853, New South Wales and Queensland 1856 [S2], [S3], [S4].","sources":["S1","S5","S7","S24","S2","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-94f835a1d68f","kind":"unclassified","anchor":"- **In the NSW, Victorian and Queensland indexes, entries from before those dates are transcribed church baptisms, marriages and burials.** The NSW registry holds transcribed copies, not the original church registers [S3]. The ranges are NSW 1788–1855 [S3], Victoria 1836–1853 [S5], and Queensland baptisms and burials 1829–1856 and marriages 1839–1856 [S7].\n- **Record such an entry as a church-register entry, not a civil certificate.** Cite the church and the transcript.\n- **Search the church registers directly before you call a pre-1853 Victorian event missing.** Every church was required to send its pre-1853 registers to the Victorian Registrar, and not every church did [S6].\n- **For Tasmania, Western Australia and South Australia, read the registry's own page before you cite a pre-civil entry.**","sources":["S3","S5","S7","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-64aeda56267d","kind":"unclassified","anchor":"- **Historical BDM indexes stop at rolling closure periods.** They differ by event type and jurisdiction. Look up each Australian state's windows on its own registry page. Never apply one state's cutoff to another.\n- **New Zealand historical records open** [S8]:","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-979eb615715e","kind":"unclassified","anchor":"- **A miss for an event still inside the window is out of scope, not negative evidence.**\n- **Search the NZ historical index at bdmhistoricalrecords.dia.govt.nz.** It needs no verified RealMe account [S8]. BDM Online (bdmonline.dia.govt.nz) is the certificate-ordering service for verified RealMe users and approved organisations [S9]. Do not use it as the historical index.","sources":["S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0a741994555f","kind":"unclassified","anchor":"- **New Zealand kept separate Māori registers:** marriages from 1911 until 1952, and births and deaths from 1913 until 1961–62 [S18]. The birth and death regulations apply to events from 1 March 1913 [S19].\n- **For those years, search both the general and the Māori registers,** because some Māori events were entered in the general system [S18].\n- **Read a birth- or death-index miss for a Māori person as expected, not negative,** before 1913 and in the Māori-register years after it. Registration could not be enforced, and many Māori births and deaths were never registered [S18]. Turn to the Māori Land Court minute books (step 10).","sources":["S18","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2cab84881be6","kind":"unclassified","anchor":"- **Treat protector, mission and child-removal records as agency series.** They are held by state archives, churches and welfare departments [S21], [S22].\n- **BDM indexes do not cover these agency files.** Search the holder's own catalogue by the person's name and place [S21], and its name indexes, such as church name indexes to mission registers [S22].\n- **Expect restricted access.** Some Queensland records are closed for up to 100 years and are released through an administrative process [S21]. Access goes through dedicated Aboriginal records units, such as Queensland's Community and Personal Histories unit, and family-tracing services such as Link-Up [S21], [S23].\n- **Read a BDM-index absence for such an ancestor as expected, not negative.**","sources":["S21","S22","S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd553486ed7c","kind":"unclassified","anchor":"- **Commonwealth rolls survive from 1903** [S13]. Enrolment became compulsory by an Act passed in December 1911 that commenced on 27 March 1912 [S10]. Voting became compulsory in 1924 [S11].\n- **Do not read a pre-1912 roll as near-complete.** An absence from a pre-1912 roll is not evidence of non-residence.\n- **For Indigenous Australians, read the franchise steps.** The federal vote was extended in 1949 to ex-servicemen and to those already enrolled for state elections. In 1962 all Indigenous Australians gained the right to enrol, but enrolment stayed voluntary. Enrolment became compulsory in 1984 [S12], [S13]. Read an absence against the law for that person and date.\n- **Treat the recorded address and any recorded occupation as dated observations for that subdivision.** Rolls omit occupation after 1983 [S13]. An entry does not prove household membership.","sources":["S13","S10","S11","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-568cba37e391","kind":"unclassified","anchor":"- **Before 1924, search the archive of the state where the ship arrived.** Federation did not move the lists: Public Record Office Victoria holds inward overseas passenger lists from British ports for 1852–1923 (VPRS 947 and 7666) [S14].\n- **After 1923, search the National Archives of Australia too.** PROV states that Victorian immigration records after 1923 are held by the NAA [S25]. Keep the state archive in the search: Queensland State Archives indexes immigrant ships bound for Queensland for 1922–1940 [S26].\n- **Route by colony and date before you call a passenger search negative.**","sources":["S14","S25","S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-67a8f499be33","kind":"unclassified","anchor":"- **Use Trove (Australia) and Papers Past (New Zealand) for family notices and shipping arrivals.**\n- **Read each title's digitised run before you search it.** A zero-hit search outside that run is a coverage gap, not a negative.\n- **Treat a DigitalNZ API search of Papers Past as a first pass.** A key is optional for public content but recommended for regular use [S15]. Re-run any miss on the Papers Past site, and check each hit on the Papers Past page image with the newspaper recipe.","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5b1064aa932c","kind":"unclassified","anchor":"- **Search Collections Search (collections.archives.govt.nz), the live Archives NZ catalogue** [S20]. If an older guide points to another catalogue, re-run its search in Collections Search before you read a miss.\n- **Record the R-number.** It is each record's unique code, and you can search it directly [S20].","sources":["S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4b32522435f2","kind":"unclassified","anchor":"- **Use the Native (Māori) Land Court minute books as a major written source of whakapapa (genealogy).** They record the court's proceedings and decisions, including whakapapa and tribal history given as evidence in title hearings [S16], [S17].\n- **Record the full minute book reference as the locator.**\n- **Read whakapapa recited to win title as claimant testimony in a contested hearing, not neutral fact.** Record who gave it, for which block and against whom.","sources":["S16","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4394a70b15e8","kind":"portal-availability","anchor":"- **Search Trove's government gazettes as a lane of their own, not only its newspapers.** The National Library of Australia lists certificates of naturalisation, employment notices and military service among what they hold [S27 @2026-11-12] [S29 @2026-11-12]. Its gazette guide adds bankruptcies, company registrations and Public Service appointments. On Trove the Commonwealth gazette runs 1901–2012 and New South Wales 1832–2001; Victoria's, for 1836–1997, are on a State Library Victoria site instead [S28 @2026-11-12].","sources":["S27","S29","S28"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e194b484fd72","kind":"platform-ui","anchor":"- **Give at least three letters before Trove's `*` wildcard** [S31 @2026-11-12]. A shorter stem is not a valid search of a variably spelled surname, so its zero is not a negative.","sources":["S31"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2bed174b9706","kind":"custody","anchor":"- **From 1904, request the file from the National Archives of Australia.** Naturalisation became a Commonwealth responsibility that year [S30 @2026-11-12].\n- **Before 1904, go to the state archives for Queensland, New South Wales, Tasmania and Western Australia, and to the NAA for Victoria and South Australia** [S30 @2026-11-12]. Date the naturalisation from its gazette notice first, then choose the custodian.","sources":["S30"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8a104d1324b7","kind":"custody","anchor":"**The Australian Capital Territory is the exception.** The area was part of New South Wales until 1911 [S1 @2026-11-13]. For births in the Canberra region before 1918, and marriages and deaths there before 1930, search the New South Wales indexes; such events may be registered under the districts of Queanbeyan or Yass [S1 @2026-11-13].","sources":["S1"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-332cfe6977cb","kind":"custody","anchor":"**Western Australian passenger lists after 1900 are the exception.** The State Records Office of Western Australia says that from 1901 responsibility for immigration passed from the states to the Commonwealth, so passenger lists for the period after 1900 are generally held by the WA Branch of the National Archives of Australia [S32 @2026-11-13]. For a ship that arrived in Western Australia after 1900, search the NAA first; the before-1924 rule above does not apply there.","sources":["S32"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
