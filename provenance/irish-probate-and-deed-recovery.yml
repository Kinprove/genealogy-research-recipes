claims:
  - {"id":"C-a7c7164b481e","kind":"unclassified","anchor":"- **Before 1858, look for the church courts' records.** The Probate Act of 1857 moved probate to a Principal Registry in Dublin and 11 district registries [S1]. A pre-1858 will was proved in a diocesan court or the Prerogative court.\n- **From 1858, start with the annual calendars.** They were printed each year, alphabetical by the deceased's surname [S4].\n- **Record which registry issued the grant.** It decides which will book can hold a copy (step 3) and whether PRONI's database covers the grant (step 2).","sources":["S1","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7a99a1aa8ae3","kind":"portal-availability","anchor":"- **Read the entry as an index line, not the will.** A calendar entry summarises the grant: name, dates, grant type, last address, executor, estate value and issuing registry [S2 @2026-11-13]. It never gives the will's clauses.\n- **Never write beneficiaries, bequests or kin from a calendar entry.** Record the executor as executor only. A relationship in the entry's own wording can be copied as written.\n- **Do not read an entry as proof that the will survives.** The entry records the grant, not the document's survival; check the copy lanes in step 3.\n- **Do not send the search to NAI's genealogy microsite.** It held the 1858–1922 calendars and has been retired [S2 @2026-11-13]. Calendars for 1918–1922 can be consulted only onsite in the NAI Reading Room, and those for 1923–1982 online and onsite [S2 @2026-11-13]. NAI says it is rebuilding its retired microsites and will restore digital access as the new systems come online, but it names no online copy of the 1858–1917 calendars yet [S2 @2026-11-13]. Until it names one, read them in the Reading Room, where NAI lists the will calendars for 1858–1920 among the collections it shows while the microsites are offline [S21 @2026-11-13].\n- **Use PRONI's will calendars database for the three northern district registries only.** It covers the Armagh, Belfast and Londonderry registries from 1858 to 1965 [S3 @2026-11-13], [S4 @2026-11-13]. A will from today's Northern Ireland proved in Dublin or in another district is not in it, so search the NAI calendars too. PRONI's printed calendars, consulted on site, run to 2009 [S4 @2026-11-13].","sources":["S2","S21","S3","S4"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-477ead7b025a","kind":"unclassified","anchor":"- **Know what burned in 1922.** The fire destroyed almost all original wills and administrations of the Principal Registry up to 1904 and of the district registries up to 1900 [S1]. NAI holds the later originals from 1904 for the registries in its collection [S1]. For Armagh, Belfast and Londonderry, PRONI holds the originals from 1900, Armagh from 1901 until that registry closed in September 1921 [S15], [S20].\n- **Search the district-registry will books for 1858–1900.** They hold copies of wills proved in the district registries in those years [S1].\n- **Expect almost nothing for the Principal Registry before 1904.** Its will books survive only for 1874, 1878, 1891 and 1896 [S1]. Outside those years, record the calendar entry as the surviving evidence and report the will itself as not found.\n- **For the three northern registries, open PRONI's digitised copy wills.** They cover Armagh 1858–1918, Belfast 1858–1909 and Londonderry 1858–1899 [S3].\n- **Before 1858, search the indexes.** The official pre-1858 wills and administrations were destroyed in 1922; look for copies in family, estate and personal papers and in solicitors' archives [S20]. Their indexes survive on microfilm at NAI [S2], and PRONI's Name Search holds the indexes to pre-1858 diocesan wills and administration bonds (step 6) [S11]. An index line gives you the testator and year, not the will. Record it as an index find, never as the will's content.\n- **Stop rule:** call a will lost only after the calendar, the will book or digitised copy for its registry and years, and, before 1858, both the NAI and PRONI indexes are each logged as searched. Follow any index entry that notes a surviving original or copy to its reference [S11]. Log a record you identified but did not consult as unconsulted, never as lost. Report every other gap by series.","sources":["S1","S15","S20","S3","S2","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f829632bb3a6","kind":"unclassified","anchor":"- **Expect the Registry of Deeds from 1708.** The Registry was set up by an Irish Act of 1707, and the first memorial was registered on 29 March 1708 [S6]. It records deeds affecting unregistered property [S7]. Since 1 March 2023 it has been part of Tailte Éireann [S6], [S7].\n- **Split a Northern Ireland deed by date.** The Dublin indexes cover all of Ireland until 1921 and the 26 counties from 1922 [S16]. Deeds registered in Northern Ireland from 1923 are with the Northern Ireland Registry of Deeds. Its 1923–1989 Names Index is on paper and can be searched only from the grantor's name; there is no search by address before 1 January 1990; the pre-1990 records are at Land & Property Services in Belfast [S17].\n- **Read the memorial, not the deed.** A memorial is the registered summary. It gives the date, the nature of the deed, the parties and a description of the property [S5]. Memorials cover leases, conveyances, mortgages and marriage settlements, and they name witnesses [S9], [S10]. A marriage settlement can carry much family detail [S10].\n- **Search the Names Index under the grantor only.** It is an alphabetical index of grantors [S5]. Grantees are not indexed in it, although an entry also shows the grantee's surname [S9], [S18]. To find a grantee, search the likely grantors, or search by land.\n- **Search the Lands Index by place, in its period's arrangement.** For 1708–1832, search by county, then townland; larger corporation towns are at the back of the county book, and cities such as Dublin, Cork and Waterford are listed separately. From 1833 to 1946, search by county, barony and townland, or for urban property by city, civil parish and street [S16]. Entries are alphabetised by the first letter only, so read the whole letter section. The index names the grantor's surname and covers 1708–1946, Dublin city and county to 1949 [S5], [S16].\n- **Add the Registry of Deeds Index Project as a lead.** It indexes all parties, witnesses and others named in the memorials it covers; use it to find the grantees and witnesses the Names Index leaves out [S8], [S9]. Its coverage depends on what volunteers submit [S8], so a miss there tests nothing.\n- **Cite the memorial number and every party as written,** then read the memorial itself before you use any detail from an index line. For the deed's family meaning, use the deed-clues recipe.","sources":["S6","S7","S16","S17","S5","S9","S10","S18","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dbf484939912","kind":"unclassified","anchor":"- **Do not read \"no memorial\" as \"no land\" or \"no transaction\".** Registration was voluntary, so many transactions were never registered [S18], [S19].\n- **Search Catholic and smallholder families in full.** They appear less often; search every index for them, and record a nil with the indexes and years searched.\n- **Turn a nil into the next lane.** Go to the valuation and occupancy series for the townland, and to the probate lanes above.","sources":["S18","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1687b608ad3f","kind":"unclassified","anchor":"- **Search PRONI's Name Search before you call the pre-1858 or pre-civil period empty.** It groups the indexes to pre-1858 diocesan wills and administration bonds with fragments of the 1740 and 1766 religious census returns and the 1775 dissenters' petitions [S11].\n- **Search the other applications as their own lanes; a Name Search miss does not cover them** [S12]:\n  - Freeholders' Records: pre-1840 freeholders' registers and poll books;\n  - Ulster Covenant: the signatures of almost half a million men and women who signed in 1912;\n  - Street Directories: digitised directories for 1819–1900 [S14], including the Belfast and Ulster Street Directory. The run has gaps, so log each edition opened [S13].","sources":["S11","S12","S14","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9dca7b8ad862","kind":"portal-availability","anchor":"**Add NAI's own pre-1858 copies to the search.** NAI lists prerogative and diocesan copies of some wills, and indexes to others, for 1595–1858 among the collections that can be viewed in its Reading Room while its genealogy microsites are offline [S21 @2026-11-13]. Log them as searched before the stop rule calls a pre-1858 will lost.","sources":["S21"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11bb7fa3bc4b","kind":"portal-availability","anchor":"**Where to read the deed indexes and memorials.** The Names Index, the Lands Index and the Transcript Books (copies of the memorials) for 1708–1929 were microfilmed; copies of the films are at the National Library of Ireland and PRONI, and the films have been published on FamilySearch. All records from 1708 to 1969 can be viewed in person, by appointment, at Tailte Éireann's Henrietta Street office [S5 @2026-11-13].","sources":["S5"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-treasury-wood","kind":"platform-ui","anchor":"Add the Virtual Record Treasury of Ireland to a lost-record search. Its current search accepts keywords, people, places and reference numbers [S22 @2026-11-16]. Use Herbert Wood’s 1919 *Guide to the Records Deposited in the Public Record Office of Ireland* to identify the pre-fire series described by NAI [S23 @2026-11-16], then seek a surviving copy or surrogate. A guide’s entry describes a former holding, not current survival, and a Treasury miss does not exhaust copies elsewhere [S24 @2026-11-16].","sources":["S22","S23","S24"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-pre-1858-court-search","kind":"historical","anchor":"**Choose the pre-1858 court by diocese and estate.** Start with the Church of Ireland court for the deceased's diocese of residence. If the deceased held property worth more than £5 in another diocese, start with the Prerogative Court of the Archbishop of Armagh [S26]. Search both courts' indexes when the property's location or value is unclear. Search for administrations as well as wills when you do not know whether the deceased left a will [S25], [S26].","sources":["S25","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-northern-wills-index","kind":"portal-availability","anchor":"**Treat the northern wills and administrations index as a lead.** MyHeritage's launch and expansion announcements describe entries for Armagh, Clogher, Connor, Derry, Down, Dromore and Kilmore [S27 @2026-11-22], [S25 @2026-11-22]. The expansion announcement puts most entries in 1621–1965 [S25 @2026-11-22]. The collection interface and individual images were unavailable for direct inspection. If the collection opens, search MyHeritage by the deceased's name. For any hit, distinguish the place and date of signing, probate or administration by letter or bond. Record residence and date of death separately if supplied [S27 @2026-11-22], [S25 @2026-11-22]. Follow any source reference to the archive and check the image when available.","sources":["S27","S25"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-estate-papers-lease-search","kind":"method","anchor":"**Trace a missing historical lease through the landlord's estate papers.** Copy the occupier and immediate lessor for the holding from the Primary Valuation [S32]. Use period directories and available lease evidence to identify the superior landlord before choosing an estate collection [S30]. Read the rent rolls for the townland to identify tenants [S28], [S31]. Follow the tenant into the lease books if the rental omits the terms of the tenancy [S30].","sources":["S32","S30","S28","S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-popery-act-land-succession","kind":"historical","anchor":"**Check how a Catholic owner's land could descend.** For a succession governed by the Popery Act (2 Anne c. 6), check whether the owner held the land in fee simple or fee tail and whether the owner disposed of it for genuine payment during their lifetime [S29]. If the equal-division rule applies, trace each eligible son's share in the deeds and estate papers, or the eligible daughters' shares if there was no male issue [S28], [S29]. Check for a qualifying Protestant eldest son or heir at law and a bishop's certificate enrolled in Chancery before inferring division [S29].","sources":["S29","S28"],"checked":null,"stated_as":"fact","review":"reviewed"}
