claims:
  - {"id":"C-ef7c302a1f26","kind":"unclassified","anchor":"Before expanding an abbreviation, interpreting a blank or category, or turning a field into a\nsearch target, read that census year's enumerator instructions and apply the definitions then\nin force ([Genealogy Gems](https://www.youtube.com/watch?v=0XVhB44U7aA),\n[Lisa Lisson](https://www.youtube.com/watch?v=ZlTq5IxHCuM)). In the 1950 instructions as read by\n[Family History Fanatics](https://www.youtube.com/watch?v=GNX7J94oEIE) and\n[Genealogy Gems](https://www.youtube.com/watch?v=TEwTGVS88Oo), an out-of-state hospital birth is\nentered under the family's state, common-law unions as married, and anyone 14 or under as never\nmarried. A relationship entry of 'partner' is paraphrased as unrelated people sharing a\ndwelling, not its modern sense ([Blandón Traiman](https://www.youtube.com/watch?v=dkkYqyBWIXc),\n[earlier version](https://www.youtube.com/watch?v=HC5z95y_5ic)). Read a changed race or a health\nterm the same way and record it literally ([FHF 2020](https://www.youtube.com/watch?v=b6jSyhjEwuk),\n[Crow](https://www.youtube.com/watch?v=D5weC7CmDlo)). Instructions show intended procedure, not\nwhat an enumerator did. Keep the literal entry beside the interpretation, and do not reuse one\nyear's definitions for another.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8bf92a19d97b","kind":"unclassified","anchor":"Before applying an age-based calculation, check that its input represents the recorded age\nin the required unit. If the calculation cannot handle that value, retain the person,\nliteral age/unit and source locator and mark only the calculation unresolved. Do not clear\nthe source value or remove the person to make a formula fill. Genealogy TV's\n[historical Excel demonstration](https://www.youtube.com/watch?v=eONcu9lTbYY) [S71]\nmotivates this safeguard; it does not validate a formula or establish a birth date.","sources":["S71"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7ac3c6eee9f4","kind":"unclassified","anchor":"1. List every expected member. Mark which names, ages, and birthplaces are best supported. Include children: their entries may be easier to recognize than the adults' entries.\n2. Search each member separately in the target census. Then remove the surname from a distinctive member's query, keeping given name, age range, birthplace, and a supported search area.\n3. Try a short name fragment or wildcard where the platform permits it. Change one constraint at a time and record the actual query. An unsuccessful surname search is a failed query, not evidence that the household was absent.\n4. Extend the locality using relatives' marriages, residences, or other dated evidence. Do not restrict a missing household to the location where it appeared ten years earlier.\n   Before recording a member as missing, moved or dead, read that year's rules on who was counted where. Keep the sheet's visit date separate from the official reference date ([Tanner 1880](https://www.youtube.com/watch?v=7Jn_XMUozo0)). Someone who died after the reference date may rightly be listed ([Genealogy Gems](https://www.youtube.com/watch?v=p4O1Zlol-2k)), and a baby born after it should be absent ([Tanner 1880](https://www.youtube.com/watch?v=7Jn_XMUozo0), [FHF](https://www.youtube.com/watch?v=GNX7J94oEIE)). As the cited presenters describe them (confirm in the 1950 enumerator instructions), the 1950 rules count college students at college and leave visitors, boarding pupils, inmates and absent servicemen out of the home household ([FHF](https://www.youtube.com/watch?v=GNX7J94oEIE), [Genealogy Gems](https://www.youtube.com/watch?v=87hGRjeZ5o4), [podcast](https://www.youtube.com/watch?v=R3Ds6GLx4es)). Lisa Lisson reports separate P-5 overseas and P8 reservation schedules, and no enumeration of other Americans abroad ([overview](https://www.youtube.com/watch?v=q7-fXZJTU7U), [preview](https://www.youtube.com/watch?v=tnaXso4LSCE)); a Family History Fanatics case shows a citizen abroad uncounted in 1930 and 1940 ([case](https://www.youtube.com/watch?v=gsbQIuilOYk)). Search where the rule points, such as an institution. Other years need their own rules, enumerators may not have complied, and an explanation stays unproven until another record places the person.\n5. Open candidate images. Compare the whole roster, ages, birthplaces, and local associates. Record indexed spelling and the image reading separately. Search the apparent alternative surname locally before dismissing it as a transcription error.\n   Before concluding that a household or member was omitted, check the page edges. A household at the top or bottom of a page may continue on the previous or next image, and an index may leave the parts unconnected ([Lefler](https://www.youtube.com/watch?v=7yVDky7MvO0), [FamilySearch indexing example](https://www.youtube.com/watch?v=vdpmIU_XOA4)). Record the continuation locator. Check the printed page sequence for a missing page, and look for a damaged or illegible entry. Test whether the head's surname was carried onto a wife and children living apart, whether children carry a stepfather's surname, and whether travel took the family away during enumeration ([FHF](https://www.youtube.com/watch?v=itVYbPHf_Oc), [travel example](https://www.youtube.com/watch?v=jeshnSv9xQ0)). If the surname on the image is blank or crossed out, also search under the previous household's surname, as in one 1930 indexing error ([Annie's Ghosts](https://www.youtube.com/watch?v=9OkR0D6bDyg)). Line order is not a relationship. Each explanation stays a hypothesis until a linked entry or dated record supports it.\n   If an entry is hard to read, try an available image of the same entry on another host\n   and the adjustment controls actually offered there. Match the schedule, printed page\n   and household or line before comparing readings; viewer image numbers can differ.\n   Record the host, image locator and reading in `image_reading`. A clearer presentation\n   is another copy of the same record, not independent corroboration. If no usable copy\n   is available, retain the legibility gap. Aimee Cross demonstrates this recovery step\n   without establishing that one provider always has better images. [S69]\n6. If name searches remain unproductive, use Recipe 2. A second platform can expose a different index, but two indexes of the same census entry remain one underlying record.\n7. Expect that one person may appear twice in a census year. Examples: a 1950 student at a dormitory and with a military family, a married son still listed by his parents ([Brady](https://www.youtube.com/watch?v=o6d7Z_W_qhg), [Tanner](https://www.youtube.com/watch?v=xW-2PVfobaE), [Genealogy Gems](https://www.youtube.com/watch?v=dY9EV5R_6ZA)), or a servant entered days before her family's listing ([Genealogy Gems](https://www.youtube.com/watch?v=xzJUics2RDs)). A family that moved between districts during enumeration can be missed at both addresses or counted at both, so compare the dates written on the sheets ([Legacy Tree answer](https://www.youtube.com/watch?v=LwjPdTcCxMM)). Keep both entries with their dates and locators. Do not split them into two people or discard one, and do not choose a residence without other evidence. Test the double-enumeration or move hypothesis with independent records. None of these sources says how often it happens.","sources":["S69"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e274b6e4f179","kind":"unclassified","anchor":"**Method origin:** Family Locket's case found a household through a child's given names, age, and birthplace after searches for the parents and surname failed. It also demonstrates wildcard searching and extending the locality through siblings' records. [S1](https://familylocket.com/3-tips-for-searching-the-census-when-a-family-goes-missing/)","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aebe025bde39","kind":"unclassified","anchor":"1. Assemble location evidence close to the census date: city directories, draft registrations, letters, school records, vital records, or other dated documents. Keep an address from a different year as a lead until supported for the target year.\n2. Identify the county and locality as they existed in that year. Check boundary changes before interpreting a different county name as a move.\n   Apply the same check at state or territory level: a later state may have been enumerated under an earlier territory, as with present-day Wisconsin residents under Michigan Territory in 1820 and 1830 ([Brady](https://www.youtube.com/watch?v=kFxsAw8HHAs)). Check territorial dates against a boundary reference; a failed modern-state search is a failed query, not absence.\n3. Locate enumeration-district maps and descriptions for the target census. Family Locket demonstrates using Steve Morse's One-Step resources to reach archival maps. Compare the address or property with streets and landmarks; retain every district consistent with the evidence.\n4. Browse the district's population-schedule images. Record image numbers and the sheet/page numbers printed on the schedules separately. Inspect continuation pages and later sections, following any cross-references.\n   Record the margin street name and the house-number column separately from dwelling, family or visitation numbers. Do not search directories by a visitation number ([Grant](https://www.youtube.com/watch?v=6aZsWQpatYA), [Genealogy Gems](https://www.youtube.com/watch?v=RIz4bAPdmWM)). A ruled line or a new street name can end a street mid-page ([Genealogy Gems](https://www.youtube.com/watch?v=RIz4bAPdmWM)). Read the prescribed urban or rural route ([Lisson](https://www.youtube.com/watch?v=tnaXso4LSCE)) and the pages before and after. Check for breaks where enumeration resumed later; in rural areas, 'next door' may mean the next farm ([Tanner](https://www.youtube.com/watch?v=UwXwt3lcp9s)). Some early lists were alphabetized ([FHF](https://www.youtube.com/watch?v=CjjD9mI_dY8), [Lisson 1790](https://www.youtube.com/watch?v=QAidkkT515s), [tips](https://www.youtube.com/watch?v=c1FM5Se8zYY)), so establish the arrangement from the pages. A new family number without a new dwelling number marks a second family in one dwelling ([Potter](https://www.youtube.com/watch?v=CXe0BbBtKME)). Page adjacency establishes neither neighbours nor kinship.\n5. Keep a browse log: district, range inspected, street or landmark encountered, candidate households, and gaps. If the location lies near a district boundary, inspect the plausible neighboring district too.\n6. Save the map or description citation alongside the census citation so another researcher can reproduce why this district was selected.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f5bbf2de82b4","kind":"unclassified","anchor":"**Method origin:** Family Locket demonstrates locating an Idaho household through rivers, roads, railways, and target-year maps; Who Are You Made Of explains changing district boundaries; Genealogy TV demonstrates finding census maps in image-only holdings. [S12](https://familylocket.com/rlp-191-preparing-for-the-1950-u-s-census-release/), [S15](https://whoareyoumadeof.com/blog/what-is-an-enumeration-district-on-the-census/), [S3](https://www.youtube.com/watch?v=1ectqP9Ogys)","sources":["S12","S15","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-975ebbb2bfad","kind":"unclassified","anchor":"**Method origin:** Amy Johnson Crow's worked example explains revisit sheet 71, the 24-image discrepancy, and looking for repeated photographic exposures. [S18](https://www.youtube.com/watch?v=4p_afzX34Uk)","sources":["S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4ecaae82a2c9","kind":"unclassified","anchor":"1. Transcribe every relevant column from the image, including its exact age bounds and historical classification. Keep categories separate. Do not reconstruct the household from the indexed totals alone.\n   For 1820–1840, open the facing second page or image as well as the tally page; it carries different columns. Count down to the same line, check the alignment against the totals, and cite both locators ([Lisson walkthrough](https://www.youtube.com/watch?v=7kVPg63qM2g), [pre-1850 tips](https://www.youtube.com/watch?v=c1FM5Se8zYY), [Smith](https://www.youtube.com/watch?v=Gr6ZqgpehE4)). The 1840 continuation names military pensioners with ages ([Wilcox](https://www.youtube.com/watch?v=HG6sY_S-Neg), [pensioner tip](https://www.youtube.com/watch?v=JOB67IJEfPU)). A pensioner may be a widow or another resident rather than the head. For a Revolutionary War veteran or widow, also check the 1840 pensioner listing and its 1841 compilation. Record pensioner, age and head of family separately, and search the population schedule under that head ([Strauss](https://www.youtube.com/watch?v=nJsQ9ftU9iM)). A pensioner entry is a lead to pension files, not proof of service or of the relationship to the head. An age-derived birth year is an estimate.\n2. Build a matrix with one row per candidate household and one column per printed category. Read the headings afresh for each census year rather than reusing another year's bins.\n3. Convert age categories into possible birth-date intervals. This calculation assumes the reported category is accurate. For an inclusive age range `a` through `b` at reference date `D`, the interval is `(D minus (b + 1) years, D minus a years]`. Interpret headings such as “under” or “of ... and under ...” literally.\n4. Place independently known people into compatible bins as **hypotheses**. Preserve unmatched counts. Household membership does not automatically establish parentage, marriage, or sibling relationships.\n   Use stable hypothesis IDs across census years. Within each mutually exclusive category,\n   proposed assignments must not exceed its recorded count; preserve the unassigned remainder.\n   Keep overlapping columns separate rather than treating them as independent capacity.\n5. Compare candidate heads across adjacent censuses and other records. Track recurring associates and historical jurisdictions. Reject a candidate only for an evidenced conflict, not a surname preference.\n6. Investigate a missing expected adult through alternate names, adjacent locations, property records, or another enumeration. Keep error, absence, and separate residence as distinct explanations.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-637e1ec45793","kind":"unclassified","anchor":"If one head's tallies hold more young men or children than a family plausibly contains,\nespecially near a college or academy, test a commercial or institutional household. Search\nlocal newspapers for tavern, hotel, boarding-house or school notices that name the head,\nincluding notices by later keepers that name him as a former proprietor. Record each notice's\ndate and locator, and compare the date with the census reference date, because a house can\nchange keepers. A notice offering student lodging at that house supports reading the excess\ncounts as boarders rather than the head's children. A young relative otherwise thought missed\nmay be one of those boarders. Keep that as a hypothesis: a compatible bin does not name him,\nand it does not exclude another enumeration elsewhere. [S80]","sources":["S80"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2f23f80f9059","kind":"unclassified","anchor":"To seek names behind household counts before 1850, consider the Pennsylvania account's reported\n'Poor School Children' lists at the ends of township tax volumes. Confirm the locality, year and\nsurviving volume, then follow any county index to the original list. Record only the child names,\nages or family connections it states, with its date and inclusion limits; keep proposed census-bin\nmatches separate. Compatible ages alone do not identify an unnamed household member. [S79]","sources":["S79"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f555089c3afa","kind":"unclassified","anchor":"If headings are missing or unreadable, consult a legible blank form for the same census\nyear, jurisdiction and schedule. Compare its column sequence with the actual page's\nremaining labels and layout before assigning a heading; an early handwritten schedule\nneed not follow the sample form's arrangement. Keep the form's locator and proposed\ncolumn interpretation separate from the literal image reading. If correspondence cannot\nbe established, leave the heading unresolved. The [blank-form demonstration](https://www.youtube.com/watch?v=1lrFNBWKwzo)\nsupplies the fallback; these alignment checks do not certify a particular original form.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bdb465b3b022","kind":"unclassified","anchor":"**Method origin:** Family Locket demonstrates checking image tick marks, distinguishing same-name heads, following associates, and investigating a head found separately under another name. The interval formula and matrix schema above are analytical adaptations. [S4](https://www.youtube.com/watch?v=oBkEoVQtPcQ)","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dd4590e88128","kind":"unclassified","anchor":"1. Compare both households member by member. List people who disappeared, appeared, married, changed names, or changed recorded location. Keep each unexplained change as a separate research question.\n2. Check whether surviving 1890 population fragments cover the locality. Check veterans' schedules separately when relevant; they have their own geographical and subject coverage.\n   Before searching the 1890 Union veterans and widows schedules, check the state. The National Archives description quoted by [Genealogy Gems](https://www.youtube.com/watch?v=zRuGRGwNmf0) says they survive largely for Kentucky through Wyoming, with Alabama through Kansas only as miscellaneous returns. Search for widows as well as soldiers. For a veteran who died before 1890, the widow's entry may name both and give the unit and service dates ([Family History Fanatics](https://www.youtube.com/watch?v=cpulm6BuAJ8)). A widow listed under a surname different from her soldier's is a remarriage lead. Some Confederates were entered against instructions and some of those lines crossed out; record struck lines literally ([Cochran](https://www.youtube.com/watch?v=NmtuDJBE5eQ), [Lefler](https://www.youtube.com/watch?v=ygn9UBhamaI)). Coverage is fragmentary and inclusion inconsistent. An entry does not prove service, and a widow's entry must still be matched to the right soldier.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a75ecdc19ea1","kind":"unclassified","anchor":"For a relevant 1890 veterans-schedule entry, read both portions of the sheet. Use the printed line number and sheet context to match the upper service fields with the lower post-office-address, disability and remarks fields. Preserve multiple service rows and widow wording. A widow's post-office address is hers, not evidence of the deceased veteran's residence in 1890. Carry recorded unit and service dates as leads into the [pension-file workflow](us-military-pension-file-recovery.md). If the lower portion or its link is missing or illegible, record the gap instead of transferring a nearby row. [S76, H5, H6]","sources":["S76","H5","H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d6cca17c9bb8","kind":"unclassified","anchor":"3. Build a coverage table for state, territorial, local, and school censuses, directories, tax records, vital records, deeds, probate, newspapers, and other dated records. Record actual years and jurisdictions held rather than copying a broad database title.\n   Where a census social schedule survives for the county and year, read it even though it names no one. It can list the taxes collected, the newspapers published and how often they appeared, and the churches counted by denomination. Turn these into coverage-table rows: tax series to request, newspaper titles to locate, and the congregations of the family's supported denomination whose records to seek. The [Curt Witcher interview](https://www.youtube.com/watch?v=uhOTAGepIms) motivates this step. It does not establish which years or places survive, where the schedules are held, or that a listed church's records still exist. A finite church count narrows the search; it does not identify the family's congregation.\n4. Search for non-federal censuses between the two federal dates. If no state census is known, investigate municipal, township, county, or other local enumerations. Search library catalogs and finding aids when an online index is absent.\n   For Colorado, Florida, Nebraska, New Mexico Territory and Dakota Territory, check the 1885 censuses, taken under an act of 3 March 1879 and paid for in part with federal funds. They are the closest in date to the lost 1890 population schedule. NARA holds Colorado (M158), Florida (M845), Nebraska (M352) and New Mexico Territory (M846). Dakota Territory's schedules were never transferred to NARA: they are at the North Dakota or South Dakota state archives, depending on the part of the territory ([NARA, the 1885 census](https://www.archives.gov/publications/prologue/2008/fall/1885-census.html); [NARA M846](https://www.archives.gov/files/research/census/nonpopulation/m846.pdf)). The State Historical Society of North Dakota holds the northern part ([State Historical Society of North Dakota, archived page](https://web.archive.org/web/20260113231006/https://www.history.nd.gov/archives/gencensus1800.html)).\n   Record in each coverage row whom a list was meant to cover, not only its years. Some local lists covered only landowners, adult men for militia, citizens or school-age children. Crow describes Ohio's quadrennial county enumerations as permitted rather than required ([FHF with Amy Johnson Crow](https://www.youtube.com/watch?v=CjjD9mI_dY8)); verify the applicable law and surviving series for the county and year. For a voter list, establish who could register from the law in force at that place and date. Do not assume women were excluded before 1920 ([Lisson](https://www.youtube.com/watch?v=jgLVRtRRheM), [Cochran](https://www.youtube.com/watch?v=NmtuDJBE5eQ)). [Allen's Pennsylvania periods](https://www.youtube.com/watch?v=27z3ekBQ4qk) are not adopted as verified rules. Search registers or poll lists, which name individuals, not election returns, which name candidates, and log browses of unindexed county volumes ([Allen](https://www.youtube.com/watch?v=QSyyFuZWsA0), [California register](https://www.youtube.com/watch?v=uHn2P2ZmpyY), [Barker](https://www.youtube.com/watch?v=hWwgeBcsEQI)). A register's age, birthplace or description can separate same-named men. A 'Mrs. [husband]' entry does not say which wife. Assess each list's coverage before reading a missing name: it may fall outside the list's scope, or reflect omission or retrieval failure; it is not by itself evidence of absence.\n5. Add dated residence observations to a timeline. Check whether changed county boundaries explain apparently different locations. Search married children separately under supported names.\n6. Reconcile the timeline with the 1880 and 1900 households. Record searches that remain incomplete because records were inaccessible, unindexed, illegible, or outside the reviewed coverage.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0080c1a1b814","kind":"unclassified","anchor":"**Method origin:** Sara Cochran discusses fragments, veterans, school censuses, directories, family reconstruction, and boundary changes. James Tanner demonstrates state and local census discovery and library searches. [S20](https://www.youtube.com/watch?v=NmtuDJBE5eQ), [S21](https://www.youtube.com/watch?v=DYAVc-ih68g)","sources":["S20","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-68fd17dee88b","kind":"unclassified","anchor":"[Ancestry's demonstration](https://www.youtube.com/watch?v=UtoRoxYo2JE) follows the veterans schedule's lower fields and unit clues. The [official form image](https://www.census.gov/content/dam/Census/programs-surveys/decennial/technical-documentation/questionnaires/1890veteranscensus.jpg) shows the repeated line numbers; the [1890 instructions, printed page 45](https://www.census.gov/content/dam/Census/programs-surveys/decennial/technical-documentation/questionnaires/1890instructions.pdf), distinguish multiple service spaces and a widow's present post-office address. [S76, H5, H6]","sources":["S76","H5","H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-649b0e0fb3c5","kind":"method","anchor":"1. Read the whole sheet, including the top, bottom, margins, and any continuation. Record the form and printed headings actually present.\n   A surname may be copied from the head ([FHF](https://www.youtube.com/watch?v=CC-6uGAuSiY)). An alphabetical run under an institution heading suggests an official's list ([Crow](https://www.youtube.com/watch?v=D5weC7CmDlo)). Compare the enumerator's letter forms before calling a spelling an error ([GeneaVlogger](https://www.youtube.com/watch?v=-CxvuPelZ4I)). A 1950 transient marked REG was copied from a lodging register ([Genealogy Gems 1950 preview](https://www.youtube.com/watch?v=87hGRjeZ5o4)).\n2. For 1940, look for a circled X after a household member's name in column 7 ([Genealogy Gems 1950 preview](https://www.youtube.com/watch?v=87hGRjeZ5o4), [provenance episode](https://www.youtube.com/watch?v=mTyYpO_3uPs), [Episode 260](https://www.youtube.com/watch?v=R3Ds6GLx4es), [Brady](https://www.youtube.com/watch?v=o6d7Z_W_qhg)). The instructions identify that person as the household informant; information from someone outside the household should instead have that person's name in the left margin opposite the household. Preserve the actual mark or note and its locator, and record the marked person, or the written-in outside informant such as a neighbour, as the household informant. If neither is legible or present, leave the informant unknown rather than assume the household head. The mark identifies the informant; it does not establish who supplied every answer or whether they knew each fact firsthand. [S74, H2] It was not always used carefully and does not show whether the answers are accurate. Weigh each answer by what the informant was likely to know. A relationship may reflect the informant's view, such as a widow labelled 'mother' because her daughter answered ([GeneaVlogger](https://www.youtube.com/watch?v=g5aMe7oUW_A)).\n3. For each household member, check whether the line is designated for supplementary questions. Match the person to the supplementary section by its printed line number.\n4. Transcribe each answer with the question it answers. Do not apply a supplementary answer to every person in the household.\n5. Resolve note numbers and written line references. A written reference such as “L 24” may have no number on the entry itself; a note number may sit over a caret beside the supplementary line, before a name, or inside the answer it qualifies, such as the age. Attach a note to the indicated entry or field. Notes can explain revisions, a doubted age and who gave it, employment details, visitors with no other residence whose lines belong after an earlier household, or why an entry was struck through, such as a death and its month [S8]. Keep a disputed answer beside the note's alternative.\n6. Keep blanks, unreadable text, questions not asked, and explicit negative answers distinct. Record uncertainty about the note's subject instead of assigning it by proximity.","sources":["S74","H2","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2ba27e6f325f","kind":"unclassified","anchor":"When an identified WPA or CCC connection accompanies a 1940 emergency-work entry,\nfollow it to civilian personnel or application records. Preserve the entry's reference\nweek; a generic yes or program names printed in the question do not identify a program.\n[Family Locket's discussion](https://www.youtube.com/watch?v=YSF4GCv61kg) [S72] points to\nWPA and CCC records at NARA in St. Louis. Use that historical pointer to find the identified\nprogram's current series, custodian and request guide before requesting. Leave other or\nunknown programs unresolved; no NYA route is supplied here. CCC files may name camps;\ncivilian service is not military service.","sources":["S72"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9d2f33f3a22e","kind":"method","anchor":"**Method origin:** Genealogy TV demonstrates matching a 1940 person to the bottom section. Amy Johnson Crow demonstrates a 1950 sample-line-4 entry and separately discusses locating and linking enumerator notes. The notes video's 1950 examples show a line-number note, footnote numbers beside the supplementary line, before a name and in the age column, and notes on a death, visitors with no other residence and a doubted age. [S7](https://www.youtube.com/watch?v=JJY4EKK_sVg), [S19](https://www.youtube.com/watch?v=jA10V_GJcio), [S8](https://www.youtube.com/watch?v=ZzrQQz4BIT4)","sources":["S7","S19","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-202acd6943b2","kind":"unclassified","anchor":"The [MyHeritage census demonstration](https://www.youtube.com/watch?v=4P8sUi-Adno) motivates extracting the 1940 informant mark. [Official paragraph 446](https://www2.census.gov/library/publications/decennial/1940/population-volume-4/33973538v4p1ch2.pdf) specifies both the circled X and the outside informant's margin note; this does not verify the demonstrated household or extend the rule to another census year.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b862aeab27ae","kind":"unclassified","anchor":"For 1880, preserve column 7's birth-month entry and column 12's marriage mark, alongside the person's marital-status fields. The census year ran from 1 June 1879 through 31 May 1880. If the entry follows those instructions, June–December birth months suggest 1879 and January–May suggest 1880. Treat an affirmative marriage mark as a lead to that window, not an exact date or an identified spouse. Column 12 applied to married, widowed or divorced people; do not assume the mark dates a first marriage or the union shown in the household. Keep derived leads separate from literal answers and investigate conflicts. A blank does not establish that the person never married. [S75, H3]","sources":["S75","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6e988e4a9ee1","kind":"unclassified","anchor":"2. Derive a marriage-period lead from reported duration. Compare multiple enumerations and retain disagreement. A subtraction such as census year minus reported married years is an approximate search lead, not an exact marriage date.\n3. For 1930, use `1930 - (reported age - reported age at first marriage)` only as a first-marriage search lead for that person. Age refers to 1 April 1930; allow for birthday timing and uncertain reported ages. The estimate need not date the union shown in the household. Compare the spouses' leads ([Brady](https://www.youtube.com/watch?v=o6d7Z_W_qhg)): disagreement prompts prior-marriage or reporting-error checks, while agreement does not prove they first married each other. Column 15 applied only to people recorded as married in column 14, so a blank does not establish that the person never married. [S73, H1]\n4. Inspect indications of previous marriages using the relevant form headings and instructions. Do not assume every duration or child count refers only to the couple shown together.\n   Test the reported marriage duration, or the 1930 age at first marriage, against the known marriage date and the children's ages. A child born before the derived period, or a first-marriage age that predates the known wedding, is an earlier-marriage lead ([Grant 1930](https://www.youtube.com/watch?v=Dtl6pnXMiEY), [BYU 1900](https://www.youtube.com/watch?v=cZZ2IbQSyPc)). Read a 1910 code such as M2 as a second or later marriage, not necessarily the second ([Lisson](https://www.youtube.com/watch?v=7kVPg63qM2g)). Households can give stepchildren the current surname, so check birth registrations under that surname, then under the mother's earlier married surname ([Grant 1911](https://www.youtube.com/watch?v=S7NX-GnX4UU)). These are approximate leads. Ages and durations can be misreported, and parentage needs the registrations or other records.\n5. Where both child counts are legible, calculate `reported children born minus reported children living`. Treat the result as a reported difference requiring investigation. Do not create named deceased children from it. A living child absent from the household may be living elsewhere.","sources":["S73","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fc6833a078ef","kind":"unclassified","anchor":"Adapt [Robyn N. Smith's child-count comparison](https://reclaimingkin.com/two-men-become-one-identity/)\n   to test a one-child/two-child hypothesis: when two names may denote one child or two,\n   build a separate child roster for each hypothesis. Record each documented child once\n   per roster, its maternal-link evidence and whether it was alive on each census reference\n   date; leave unknown links or survival unresolved. Compare each roster's required\n   born/living totals with the mother's literal reported counts. Apply the\n   [1900 question definitions, paragraphs 136–137](https://www.census.gov/programs-surveys/decennial-census/technical-documentation/questionnaires/1900/1900-instructions.html)\n   and [1910 definitions, paragraphs 116–117](https://www.census.gov/programs-surveys/decennial-census/technical-documentation/questionnaires/1910/1910-instructions.html):\n   these concern her own lifetime children, including living children elsewhere. Log the\n   discrepancy and the maternal link, birth, death or census answer to check. Counts alone\n   do not merge names or exclude a child; pass both hypotheses and linked observations to\n   [evidence and proof judgment](evidence-proof-judgment.md). [S77, H7, H8]","sources":["S77","H7","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-82df37b046ea","kind":"unclassified","anchor":"Record 'widowed' or 'single' as the reported status, not proof that a spouse died or never existed. A Census Bureau marriage-and-divorce report quoted by [Genealogy Gems](https://www.youtube.com/watch?v=SExmNq646NM) says divorced people often reported themselves as single or widowed. [Lisa Lisson](https://www.youtube.com/watch?v=Hi9QQZG8JoI) keeps divorce, desertion or bigamy open when there is no death record. Search for the spouse as a living person, including in that spouse's parents' household with any missing children, then for divorce records in the relevant jurisdiction. Do not derive a death date from the census year. Neither source shows how common misreporting was.\n6. Search for missing people through surrounding households, marriages, deaths, cemetery records, probate, and other suitable records. Compare the resulting candidates with the original households.\n7. Store literal statement, calculation, proposed event, and supporting record in separate fields. Keep immigration and naturalization statements as leads to the relevant documentary records rather than exact events established by the census alone.\n   Where the form records language or mother tongue, extract it next to the country of birth as a separate observation. This matters most when the birthplace names an empire or a pre-unification label such as Austria or Germany. A language that does not fit the stated country can point to a region inside a multinational state, as when Magyar redirected Austria-born research to Hungary ([Tanner](https://www.youtube.com/watch?v=htx73TZD-bo), [Hungary](https://www.youtube.com/watch?v=PeS050cNO-A), [immigrant](https://www.youtube.com/watch?v=SxDbhOu-_1Y)). Test it together with religion. Language narrows a region. It does not identify a town or establish a birthplace or modern country, and many languages were spoken across several countries.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0811705a9825","kind":"unclassified","anchor":"**Method origin:** Ancestry's worked comparison produces differing approximate marriage years from successive censuses. BlackProGen discusses children-born/living fields and previous marriages. MyHeritage explains the relationship column and immigration fields. [S6](https://www.youtube.com/watch?v=cMrTbAj5YN0), [S10](https://www.youtube.com/watch?v=Ejmjf550pHc), [S13](https://education.myheritage.com/article/the-u-s-census-tracing-your-family-in-census-records/)","sources":["S6","S10","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c041113a6ac9","kind":"unclassified","anchor":"[Ancestry's 1930 example](https://www.youtube.com/watch?v=lvRG8tZ2eYU) supplies the separate\nfirst-marriage-age calculation. The [official enumerator instructions](https://www.census.gov/content/dam/Census/programs-surveys/decennial/technical-documentation/questionnaires/1930instructions.pdf),\nparagraphs 156–157 and 161 (printed pages 26–27), establish the reference date, possible\napproximate ages and question scope. Agreement between calculated periods is retained as\na search lead, without adopting the video's conclusion that both spouses necessarily\nmarried each other first. [S73, H1]","sources":["S73","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b17ff6dd64b8","kind":"unclassified","anchor":"[Ancestry's 1880 example](https://www.youtube.com/watch?v=hhRsjcf0AQg) turns the birth-month\nand recent-marriage fields into record searches. The [official question headings and notes A, D, E and G](https://www.census.gov/programs-surveys/decennial-census/technical-documentation/questionnaires.1880_Census.html)\ndefine their interval and scope. The [instructions for Schedule 1](https://www.census.gov/programs-surveys/decennial-census/technical-documentation/questionnaires/1880/1880-instructions.html)\nuse 1 June as the reference date, independently of the visit date; a conflicting entry\nstill needs corroboration. [S75, H3, H4]","sources":["S75","H3","H4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7b0fbad53874","kind":"unclassified","anchor":"Legacy Tree's discussion of 1880 mortality returns reports physician notes on the reverse of the\nmain form. Check whether the surviving copy includes those pages before calling an entry complete.\nKeep each family answer, physician statement and enumerator addition separately attributed, with\nits subject and locator; leave uncertain authorship unresolved. A later medical explanation remains\na claim to assess, rather than automatically replacing the earlier answer. [S78]","sources":["S78"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bdd43b5347d5","kind":"custody","anchor":"1. Establish that mortality schedules survive for the relevant year and locality. Inspect the collection's actual contents, not just its broad title. If online coverage excludes the locality, investigate archival holdings: schedules returned to a state are usually in its state library, archives or historical society; those the Census Bureau kept went to the DAR Library in Washington, D.C., or the National Archives [S9 @2026-11-08].\n2. Read the schedule's reporting window. In Amy Johnson Crow's 1850 example, it covers 1 June 1849 through 31 May 1850. A September death in that reporting window belongs to 1849.\n3. Search name and locality variants, then compare age, birthplace, occupation, and other recorded details. The 1880 schedule asks whether the person lived here but died elsewhere, or died here but lived elsewhere; one death can appear on two schedules, so search both localities [S9].\n4. Where a mortality entry supplies a household or family reference, follow it into the corresponding population schedule. Compare the surviving household; do not assume an identical name identifies the deceased.\n5. Preserve literal death month, inferred calendar year, stated reporting window, and identity reasoning separately. Retain any conflict with other death evidence.","sources":["S9"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dd8e5eea47f3","kind":"method","anchor":"**Method origin:** Amy Johnson Crow demonstrates the reporting-window calculation, household-number correlation, and checking state coverage before searching, and explains the 1880 died-elsewhere questions and where the schedules ended up. [S9](https://www.youtube.com/watch?v=sZ1kgZLY1V0)","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2993dea54ec1","kind":"unclassified","anchor":"If named post-emancipation records leave an enslaver question unresolved, define a bounded\n1870 neighborhood to inspect and record neighboring households as possible research leads.\nTrace each selected named person into earlier censuses, comparing identity before carrying\nthe lead backward. Retain the literal property fields with their year and heading; do not\nuse a wealth threshold to infer enslaving status. Search relevant deeds, probate inventories\nand estate-sale records for named people and transactions. Add relatives to the worklist\nwhen inspected records supply a reason to investigate a transfer or bequest through them.\nWhere relevant claims files survive, search both the target's and candidate's names and\ninspect witness testimony. Keep the candidate, reason, earlier locator, record searched,\nnamed-person evidence, conflicts and next action in a separate worklist. Neighborhood\nproximity, recorded race or property value does not establish an enslaver or show that the\nfamily remained in its former location. This bounded adaptation of [Aimee Cross's example](https://www.youtube.com/watch?v=12gmfLSWs70)\nexcludes the video's property-value heuristic and assumed residence continuity. [S68]","sources":["S68"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4b88c3239d06","kind":"unclassified","anchor":"**Method origin:** Family Locket explicitly discusses surname changes, family-group and age comparison, voter registrations, and the limitations of slave schedules. Its dataset announcements are not treated as currently verified access instructions. [S11](https://familylocket.com/tracing-the-enslaved-in-the-1900-u-s-census-and-enslaved-org-project/)","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-250a4daaeb15","kind":"unclassified","anchor":"**Method origin:** [BYU's population-to-agricultural example](https://www.youtube.com/watch?v=CXe0BbBtKME)\ndemonstrates an indexed-initial error, a second-page line reference and a deed-search lead.\nIts examples do not establish universal year coverage or independently verify ownership.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fcfd26abcaaf","kind":"historical","anchor":"Amy Johnson Crow explains that the 1950 agriculture questionnaires were destroyed as temporary\nrecords. [S18](https://www.youtube.com/watch?v=4p_afzX34Uk)","sources":["S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6ec9a495d896","kind":"historical","anchor":"Before 1880 there is no enumeration district number to record. Early censuses were taken by the marshal's subdivision, and the term changed to enumeration district only with the 1880 census [S90]. For 1790 to 1870, leave `enumeration_district_if_present` unknown, and reject a citation template, including an AI-drafted one, that asks for an ED [S89]. Record the district, town or city named in the page heading as `locality_as_recorded`, even when the heading gives a district number [S91]. From 1850, the dwelling and family numbers, which run in the order of visitation, identify the household on the page [S91]. For Recipe 2 before 1880, look for a description of the subdivision instead: NARA's T1224 reproduces descriptions of subdivisions from 1830 on [S90].","sources":["S90","S89","S91"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e895d967059a","kind":"custody","anchor":"Before reading an early-census miss as absence from a state, check that the state's schedules survive. The Georgia Archives says the first three census schedules for Georgia, 1790 to 1810, are missing, lists an 1800 Oglethorpe County return among its state census reports, and names tax digests as the substitute [S93 @2026-11-12]. Diana Elder's Georgia case treats Oglethorpe as the only county with an extant 1800 census [S92 @2026-11-12]. Log a lost year as a coverage gap, not as `searched_no_candidate`, and search the substitute.","sources":["S93","S92"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2bfece3c5b65","kind":"method","anchor":"In a household on or near Cherokee land before removal, do not read a missing wife or child as proof that there was none. The Constitution left \"Indians not taxed\" out of the count, and the 1860 instructions told enumerators not to enumerate them [S87]. Roberta Estes notes that a white man's Native wife or children would therefore not appear with him [S86]. Search the tribe's own enumerations, such as the 1835 Henderson Roll (NARA T496), which lists Cherokee heads of household in Alabama, Georgia and Tennessee with information on each family and its property [S88].","sources":["S87","S86","S88"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-25613da96c13","kind":"method","anchor":"In a tenement or apartment house, expect one dwelling number with a family number for each occupied apartment: the 1910 instructions counted such a building as one dwelling and each occupied apartment as a separate family [S85]. For an immigrant family, read every family under that dwelling number, and log those born in the same country or speaking the same language as associate (FAN) leads [S84]. A shared building is a lead to test, not kinship.","sources":["S85","S84"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f2f8b3b1e9c6","kind":"method","anchor":"For 1870, also search the household under the wife's maiden surname. The FamilyTreeDNA guide reports couples counted under the wife's surname in 1870 and under the husband's in 1880, and adult children, enslaved with their mother by a different enslaver than their father's, counted under their mother's maiden name in their first census [S81]. Family members did not always take the same surname, and surnames changed [S82]. Take the maiden surname from a cohabitation record where one survives: North Carolina's 1866 cohabitation bonds give the man's and the woman's names [S83], and [freedpeople record recovery](us-freedpeople-record-recovery.md) covers the registers. Keep each link a candidate until a record joins the two households.","sources":["S81","S82","S83"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-784ba1e554cb","kind":"custody","anchor":"For step 1, start from NARA's Nonpopulation Census Records page. It lists, state by state, the 1850–1880 agriculture schedules on NARA microfilm and those held elsewhere, such as state archives and libraries, and sends you to the state archives for anything else [S94 @2026-11-12]. The FamilyTreeDNA guide notes that very few agricultural schedules were filmed and that many are only at state archives [S81 @2026-11-12].","sources":["S94","S81"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9285ae411b6c","kind":"method","anchor":"A schedule page, especially an early one, can carry more than one set of page numbers, such as a stamped number and a handwritten one [S99], [S101]. Write in `printed_sheet_or_page` which set you used and how it appears, as in `p. 792 (stamped at top right)` [S101]; Evidence Explained advises a parenthetical word or two for the same reason [S100]. Record the other sets too, each with its form and position on the page.","sources":["S99","S101","S100"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-203f5641632a","kind":"method","anchor":"Expand a place abbreviation by the usage of the record's own date, not by today's postal code. The Post Office's 1831 list abbreviated Indiana as `Ia.` and had no entry for Iowa; its 1874 list used `Ind.` and `Iowa` [S113]. Read an 1850 `Ia.` for a person living in Indiana as Indiana unless other records point to Iowa [S112], [S114]. The same tip reports `Ca.` for both Canada and California in some census records [S112]. Test the reading against the household's residence and the other members' birthplaces before you search that state's records.","sources":["S113","S112","S114"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-acc093b489f9","kind":"historical","anchor":"Record each census's official reference date as `census_reference_date`, separate from the visit date written on the sheet. The Census Bureau gives the first Monday in August for 1790 to 1820 (2 August 1790, 4 August 1800, 6 August 1810, 7 August 1820), 1 June for 1830 to 1880 and for 1900, 15 April for 1910, 1 January for 1920 and 1 April from 1930 [S96]. For 1890 it gives 2 June, but the 1890 instructions list everyone whose usual home was in the district on 1 June 1890 [S96], [S127]; record 1 June and note the conflict when an age or a birth near that date matters. The person who answered may have described the household on the day of the visit instead, or mixed up the two dates [S95].","sources":["S96","S127","S95"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-483dcd263281","kind":"historical","anchor":"Before you read a blank occupation as 'did not work', check whom that year's question covered, and record a blank outside it as `not_asked`. The 1850 instructions asked an occupation only for each male over 15 [S106]; 1860 asked it of each person over 15 [S107]; 1870 entered women keeping house for their own families as `keeping house` [S131]; 1880 asked it of each person, male or female [S103], and of a child of any age who earned money regularly [S104]; 1900 asked it of persons 10 and over who were at work [S108]; 1940 and 1950 only of persons 14 and over [S109], [S110]. Price Genealogy's list of these scopes [S105] dates the inclusion of women to 1880; follow the instructions instead.","sources":["S106","S107","S131","S103","S104","S108","S109","S110","S105"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-260ec18abc99","kind":"historical","anchor":"In 1880, also extract the months unemployed during the census year and the sickness column, which records an illness only on the day of the enumerator's visit, not over the year [S103]. A child marked as having attended school within the census year can also have an occupation; that is not a conflict [S103], [S104]. Any link between the illness, the months unemployed and the work, as in Price Genealogy's 1880 examples, is your inference [S102].","sources":["S103","S104","S102"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-71de45074b70","kind":"historical","anchor":"For 1950, read race, sex and marital status by the instructions, not as the household's own answers. Enumerators assumed that relatives in the household had the respondent's race unless told otherwise, and asked it only for unrelated people such as lodgers and employees. A person of mixed white and nonwhite parentage was entered with the nonwhite parent's race, and a mixture of nonwhite races with the father's race, subject to the exceptions the instructions name. The sex of a person absent at the interview was taken from name and relationship. `Sep` covered a legal separation or a parting through marital discord; couples apart for work or military service were entered as married; and a person whose only marriage had been annulled was entered `Nev` [S110]. So `Nev` does not rule out an annulled marriage. Price Genealogy's summary [S111] narrows 'separated' to legal separation and applies the father's-race rule to all mixed parentage; follow the instructions.","sources":["S110","S111"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fd02c3545c8c","kind":"custody","anchor":"Check every early state and year the same way. NARA knows of no 1790 schedules for Delaware, Georgia, Kentucky, New Jersey, Tennessee or Virginia and says they were apparently destroyed in the British attack on Washington in the War of 1812 [S121 @2026-11-14]. For 1810 there are no schedules for the District of Columbia, Georgia, Mississippi, New Jersey, Ohio, most of Tennessee, or the Illinois, Indiana and Michigan territories [S120 @2026-11-14]. Do not blame every loss on the war: FamilySearch gives no cause for these 1810 losses [S120 @2026-11-14]. Search tax lists as the substitute [S115 @2026-11-14], [S120 @2026-11-14]; FamilySearch also names voter registrations [S120 @2026-11-14]. For a man thought to be in Ohio around the War of 1812, start with the 1820 census and read nothing into his absence from 1810 [S119 @2026-11-14].","sources":["S121","S120","S115","S119"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-74542f9ae11b","kind":"method","anchor":"Do not read a Native person's absence from an early census as absence from the place. The Constitution excluded \"Indians not taxed\" from the count, and in 1790 most Indians were not counted [S116]. The 1800 and 1810 schedules counted \"all other free persons, except Indians, not taxed\" [S137], [S120], and Price Genealogy notes that the 1790–1840 censuses are of little help for Native ancestors who did not pay taxes [S115]. For 1950, a person living on a reservation may also appear on Form P8, the Indian Reservation Schedule, which repeats the P1 name and adds other names, tribe, clan, degree of Indian blood, languages and participation in ceremonies in 1949; people on reservations in Alaska and Oklahoma, and those off reservations, are on P1 only [S117], [S118], [S154]. The form's heading names the reservation [S111]. Copy the P8 entries literally and take the tribe and any other name to [tribal enrollment records](us-tribal-enrollment-record-recovery.md).","sources":["S116","S137","S120","S115","S117","S118","S154","S111"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2e7ac4dd8652","kind":"method","anchor":"If a man has a middle name that could pass for a surname, also search that name as his surname. One tip reports an 1870 entry that dropped the man's surname and used his middle name in its place [S97], and a FamilySearch user reports a 1900 enumerator who entered a man's given name as the surname of his whole family [S98].","sources":["S97","S98"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2004e46355d3","kind":"method","anchor":"If a person cannot be found in any record before their own marriage and their mother remarried during their childhood, find her later marriage. Then search the stepfather's households, from that marriage to the person's own, for a child of the right age under his surname [S122], [S123]. Enumerators often entered all the children under the head's surname [S125], and someone else gave the child's name until the child came of age, so the marriage record may be the first in which the person gave their own name [S122]. Keep the stepfather's surname as a search name for those years even after you have proved the birth surname, and expect the birth surname to turn up occasionally after the marriage [S123]. A child listed under a stepfather's surname was not thereby adopted: formal adoption was uncommon in the 19th century, and neither a later record calling the child his nor a guardianship proves an adoption [S124]. Name the stepfather an adoptive father only on a court adoption record.","sources":["S122","S123","S125","S124"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fc831ce314fc","kind":"method","anchor":"When a man is missing from his family's household, also search the jails and prisons of the area: the 1890 and 1950 instructions entered prisoners and other inmates at the institution, and in 1950 every jail prisoner however short the stay [S127], [S110], and a prison term can explain the absence [S126]. Follow such a lead with [criminal court and prison records](criminal-court-prison-record-recovery.md). The tip adds that a divorce over the imprisonment can leave court records of its own [S126].","sources":["S127","S110","S126"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
  - {"id":"C-a9f3c6393958","kind":"method","anchor":"For a 1950 absence, also check the other forms. Transients at some hotels, YMCAs and other paid lodgings were counted on 'T-Night' by special enumerators [S110], [S111]. Form P2, the Individual Census Report, was used for military personnel in barracks on U.S. soil and for travelers at hotels, YMCAs and campgrounds, and Form P4 for the crews of U.S.-flag vessels in U.S. and territorial ports; both were usually copied onto Form P1, so search P1 first [S118]. Do not expect a return for an American abroad: information on most overseas personnel was not retained, though schedules survive for military personnel stationed in the territories [S118].","sources":["S110","S111","S118"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-48ee514d9c8d","kind":"method","anchor":"If an earlier census shows the person owning a home or land and the next finds the household elsewhere or not at all, compare the two places of residence and search the earlier county's deed indexes for the years between to date the sale and the move [S129], [S130]; use [land-record recovery](land-index-book-series-recovery.md) for the indexes. Treat a real-estate value that later goes blank as the same lead [S128], not as a sale: the 1850 and 1860 values covered real estate wherever it lay [S106], [S107], and in 1870 personal estate under $100 was not entered [S131]. Legacy Tree warns that a Pennsylvania deed could be recorded years after the transaction, and advises searching the indexes long after the person left [S130].","sources":["S129","S130","S128","S106","S107","S131"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b1dfcdb43bb1","kind":"historical","anchor":"Check first which columns carry an age or a sex at all. The 1790 schedule counts free white females, the head of family included, with no age split, so a female tick does not show a wife or a daughter [S136], [S115]. The 1790 to 1810 schedules count \"all other free persons\" and slaves with no age or sex [S136], [S137], [S120]; age and sex categories for free people of color and the enslaved begin in 1820 [S138]. Do not put those people into age bins or relationships.","sources":["S136","S115","S137","S120","S138"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f63e61ea8ed5","kind":"method","anchor":"To test whether same-named heads in successive censuses are one household, follow the oldest male, the oldest female and the children's tallies: each person counted should be about ten years older in the next census and sit in the category that fits that age, and the places should fit the other evidence [S132], [S133]. Ages that do not progress, or sexes that do not line up, usually mean a different family [S133]. A death, a remarriage, someone moving in or out, or a misstated age can also explain a single change [S132]; record which explanation you test.","sources":["S132","S133"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-283a9fc37e20","kind":"method","anchor":"When an adult cannot be found as a head before 1850, look for an extra tick in the right sex and age column in the households of relatives who were heads: a parent or step-parent, an older brother, a brother-in-law [S134]. A widowed mother, for example, may be only a tick in a married child's household [S135]. Record a compatible tick as a hypothesis; it does not name anyone.","sources":["S134","S135"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
  - {"id":"C-202b6e1a4bbf","kind":"method","anchor":"In 1820 and 1830, read the count of foreigners not naturalized [S139], [S140]. A tally there is a lead to passenger lists and naturalization records through [U.S. immigration search](usa-immigration-search-recovery.md) [S138], [S115]. It does not say which member of the household was the alien.","sources":["S139","S140","S138","S115"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4742bf913239","kind":"historical","anchor":"Where an 1890 population fragment survives, read it as a family schedule: one sheet for each family, with each person's answers in a column rather than a row [S127], [S150]. It asks whether each person was a Civil War soldier, sailor or marine, Union or Confederate, or the widow of one, written as, for example, `Sol (U.S.)` or `W. Sol (Conf.)`; whether the person married during the census year; and, for each woman ever married, how many children she had borne and how many were living [S127]. Its race entries include mulatto, quadroon and octoroon [S127]. Record an empty answer as `blank`, as in a Price Genealogy example where the children's counts were left empty [S150].","sources":["S127","S150"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a81068b1dc18","kind":"historical","anchor":"In 1950, match each supplementary answer to its tier before you read a blank. Items 21 to 33, such as residence a year ago, parents' birthplaces, schooling and veteran status, were asked of the six people on each sheet's sample lines; items 34 to 38, including 'married more than once' and the number of children ever borne, only of the person on the last sample line [S110], [S154]. A blank for anyone else is `not_asked`. The children count leaves out stillbirths, adopted children and the woman's stepchildren, and includes children of earlier marriages, children who had died and children living elsewhere; the enumerator told her about adopted children only if she asked [S110], [S111]. The housing questions on the back of the sheets were not microfilmed, and the paper schedules were destroyed in 1961–1963, so no household's housing answers survive [S118], [S111].","sources":["S110","S154","S111","S118"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a1476396e272","kind":"historical","anchor":"Read a territory's 1950 schedule by its own form. Alaska's omitted the sample lines and asked many of the sample questions of everyone; the forms for American Samoa and Guam were shorter and had no sample questions; the Virgin Islands schedule had none; and Puerto Rico's was printed in Spanish [S151], [S111]. On a form without sample questions, a missing sample answer is `not_asked`.","sources":["S151","S111"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6cd64152fcb6","kind":"method","anchor":"Read the earlier fields the same way. The 1850 and 1860 schedules mark each person married within the year before 1 June, and the 1870 schedule gives the month of a birth or a marriage within the year [S106], [S107], [S142]. Use such a month as a dated lead where no vital record survives, not as a vital record [S141]. If the 1850 instruction was followed, an unmarked couple married before 1 June 1849. One researcher used that, with no children yet in the household, only to estimate a marriage shortly before that date [S143]; the missing children are an inference, since children can die or live elsewhere. The 1900 schedule gives every person's month and year of birth [S108], [S105].","sources":["S106","S107","S142","S141","S143","S108","S105"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bd0b5526949a","kind":"method","anchor":"Before 1880 the schedule states no relationships; the 1850 instructions listed the parents, then the children from the oldest at home to the youngest, then other inmates, lodgers, boarders, laborers and servants [S106]. Treat a person out of age order among the children, or an older one listed after them, as a lead to test in other records: a married child with a spouse, another relative, someone who had moved back or did not really live there, or an enumerator's error [S144].","sources":["S106","S144"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
  - {"id":"C-63cf3f8275ba","kind":"historical","anchor":"In 1910 and 1920, extract the parents' mother tongues as well: both years recorded the mother tongue of foreign-born parents as well as of the foreign-born person, in 1910 written into the birthplace columns and in 1920 in separate columns for the person, the father and the mother [S149], [S148]. A parent's language describes that parent even if the parent never came to the United States [S147]. Do not look for it in other years: 1930 asked only the foreign-born person's own language, 1940 the language spoken at home in earliest childhood, and 1950 asked none [S149].","sources":["S149","S148","S147"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1d161f7593c4","kind":"method","anchor":"When a man's wife has the same given name in successive censuses, compare her stated age and birthplace from one census to the next. A disagreement can mean two wives with the same given name; check the marriage records first [S145]. In one published case, an 1850 census wife and an 1814 marriage record that gave only given names were merged into one woman, although the man had married twice [S146].","sources":["S145","S146"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
  - {"id":"C-cf31f3bcf332","kind":"method","anchor":"In 1880, read the tenure columns: whether the operator owned the farm or rented it for a fixed money rent or for a share of the products [S152], [S153]. An owner answer supports the deed search in step 4. A renter answer makes a deed for the operator unlikely, so search for the landowner instead, and keep the tenure answer literally in the agricultural entry.","sources":["S152","S153"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
