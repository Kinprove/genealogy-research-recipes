claims:
  - {"id":"C-de014d15d954","kind":"unclassified","anchor":"- assuming every village in today's Croatia has, or lacks, 1895 state civil registers without checking its 1895 county\n- skipping Međimurje's and Prekmurje's Hungarian civil registers because the villages are in Croatia or Slovenia today\n- carrying Austria's 1938–1939 civil-registration dates into Burgenland\n- sending every search to the National Archives of Hungary (MNL) in Budapest\n- swapping a Hungarian surname and given name\n- reading an 18th- or 19th-century conscription as a full household list, and an absence from it as evidence\n- calling an early Jewish event missing before checking when that community's register starts","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-52a83bffbfc8","kind":"unclassified","anchor":"- **From 1 October 1895, expect state civil registers (állami anyakönyv).** Act XXXIII of 1894 made state registration general, and it began on 1 October 1895 [S1]. Before that date, the church registers are the vital records.\n- **Do search Hungarian civil registers for Međimurje and Prekmurje, 1895–1918.** Međimurje lay in Zala county; Prekmurje was divided between Vas and Zala counties [S2], [S18]. FamilySearch \"Slovenia, Prekmurje and Međimurje, Civil Registers, 1895–1918\" (collection 1985107) holds them, filmed from the Maribor Regional Archive [S2].\n- **For any other village in today's Croatia, check its 1895 county first.** Take the post-1895 series for Croatia-Slavonia from the Croatian archive guide, and search the parish books for every post-1895 event as well.\n- **Do not carry Austria's dates into Burgenland.** In Austria, civil marriage registers start on 1 August 1938 and civil birth and death registers on 1 January 1939 [S3]. Those are Austrian cutoffs. A Burgenland event from before the region passed to Austria happened in Hungary: route it by its 1895 county, as in step 1, to the church books before 1 October 1895 and the state civil registers from that date.","sources":["S1","S2","S18","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bb2a34e6d62c","kind":"unclassified","anchor":"- **Start with the archive of the state the village lies in today for local registers.** The MNL in Budapest holds them for today's Hungary, not for the whole kingdom.\n- **Search the 1828 national conscription in MNL series N 26, wherever the village lies today.** It covers the whole kingdom, Croatia, Slavonia and the Littoral included, but not Transylvania [S17].\n- **Slovakia (Upper Hungary):** reach the church books through FamilySearch first. \"Slovakia, Church and Synagogue Books, 1592–1935\" (collection 1554443) holds christening, marriage and burial images, and the originals are in the Slovak state archives [S13]. The ministry's list names the Slovak National Archives and the regional state archives in Banská Bystrica, Bratislava, Košice, Nitra, Prešov, Trenčín, Trnava and Žilina (seat in Bytča) [S14]. Map each image group back to the regional archive that holds the original. The same 1 October 1895 civil registration applies there [S1], [S15].\n- **Use Slovakiana for the 1930 Czechoslovak census sheets.** All 1930 sheets have been online on the Slovakiana cultural-heritage portal since November 2022 [S16].\n- **Romania (Transylvania, Banat, Crișana, Maramureș):** civil-status registers pass to the county service of the Arhivele Naționale (National Archives) 100 years after they were created [S4]. Ask the county service for an older register. A younger one is still with the civil-status service.\n- **Treat a FamilySearch film as a copy of the successor-state holding.** Record which archive the collection page names as the source of the originals.\n- **For Croatia, Vojvodina, Transcarpathia and Burgenland, take the holder from the successor state's own archive guide.** Mark the route unconfirmed in the series row until that guide names the holder.","sources":["S17","S13","S14","S1","S15","S16","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c47d8661571","kind":"unclassified","anchor":"- **Expect the surname first in a Hungarian-language entry:** Nagy János, not János Nagy [S5], [S6].\n- **Expect the given name translated into Latin or German in many records** [S5]. Search Joannes, Johann and János as separate lanes for the same man.\n- **Search every person in a Latin or German entry under both name orders.** Keep the literal order as written in the name register, and never index a surname as a given name.\n- **Expect Latin as the register language in many parishes until the 1840s.** Act VI of 1840 ordered parish registers to be written in Hungarian within three years, even where sermons were not preached in Hungarian [S8]. Act II of 1844 made Hungarian the official language of the Diet, the government and the courts in place of Latin [S7]. Read each register's language from the register itself.","sources":["S5","S6","S8","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00ec7213f1e1","kind":"unclassified","anchor":"- **Read the 1828 national conscription as taxpaying heads of families only.** Its recorded units are the heads of taxpaying families, and the nobles are not included [S10], [S11], [S17].\n- **Read any other tax-based conscription by its own instructions for who was counted.** Do not rely on the list until you have read them.\n- **Expect nobles in the 1784–87 Josephine census, but not named women.** It counted the whole population, nobles and clergy included; women were recorded only as numbers [S9]. Its main enumeration ran in 1784–85, with revisions to 1787 [S9].\n- **Record each tax-conscription entry as a taxpaying head present at a place and date.** Do not reconstruct a household from a conscription line. Treat absence from a tax-based list as uninformative: the person may have been noble, untaxed, a dependant or a servant. For reading a run of tax lists, use the tax-roll recipe.","sources":["S10","S11","S17","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c19643dc92f4","kind":"unclassified","anchor":"- **MNL AdatbázisokOnline:** the National Archives of Hungary's portal of thematic databases, many of them built around named persons [S12].\n- **Treat each hit as a lead.** An OCR line or a database row is not the record. Open the item, and cite the contributing archive and the item, not only the portal.","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-56484b235f46","kind":"unclassified","anchor":"- **Find the start year of the community's own register before you call an earlier event missing.** Record a year before that start as a coverage gap, not as a negative search.\n- **From 1 October 1895, search the state civil registers too** (step 2) [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
