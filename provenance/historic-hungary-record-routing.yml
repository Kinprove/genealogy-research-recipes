claims:
  - {"id":"C-de014d15d954","kind":"unclassified","anchor":"- assuming every village in today's Croatia has, or lacks, 1895 state civil registers without checking its 1895 county\n- skipping Međimurje's and Prekmurje's Hungarian civil registers because the villages are in Croatia or Slovenia today\n- carrying Austria's 1938–1939 civil-registration dates into Burgenland\n- sending every search to the National Archives of Hungary (MNL) in Budapest\n- swapping a Hungarian surname and given name\n- reading an 18th- or 19th-century conscription as a full household list, and an absence from it as evidence\n- calling an early Jewish event missing before checking when that community's register starts","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-52a83bffbfc8","kind":"unclassified","anchor":"- **From 1 October 1895, expect state civil registers (állami anyakönyv).** Act XXXIII of 1894 made state registration general, and it began on 1 October 1895 [S1]. Before that date, the church registers are the vital records.\n- **Do search Hungarian civil registers for Međimurje and Prekmurje, 1895–1918.** Međimurje lay in Zala county; Prekmurje was divided between Vas and Zala counties [S2], [S18]. FamilySearch \"Slovenia, Prekmurje and Međimurje, Civil Registers, 1895–1918\" (collection 1985107) holds them, filmed from the Maribor Regional Archive [S2].\n- **For any other village in today's Croatia, check its 1895 county first.** Take the post-1895 series for Croatia-Slavonia from the Croatian archive guide, and search the parish books for every post-1895 event as well.\n- **Do not carry Austria's dates into Burgenland.** In Austria, civil marriage registers start on 1 August 1938 and civil birth and death registers on 1 January 1939 [S3]. Those are Austrian cutoffs. A Burgenland event from before the region passed to Austria happened in Hungary: route it by its 1895 county, as in step 1, to the church books before 1 October 1895 and the state civil registers from that date.","sources":["S1","S2","S18","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ff9d1e3c412f","kind":"historical","anchor":"**In Burgenland, expect state civil registers after 1921 as well.** When the region passed to Austria, Hungary's obligatory civil marriage and the state register system tied to it stayed in force there as special federal law, and the marriage law of 1938 took the state registrars over as registry officials [S19]. So do not stop a Burgenland search for a state register at 1921: the series runs on to the Austrian cutover described above.","sources":["S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-666a1b5979a5","kind":"custody","anchor":"**Inside today's Hungary, three holders share the registers.** Before 1895 the parishes kept them; the MNL's national archive in Budapest borrowed those pre-1895 books and filmed them from 1960 to mid-1970 [S20 @2026-11-16]. Act XXIII of 1827 ordered church registers kept in two copies, the second going to the county or free royal town archive; state registers were also kept in two copies from 1895 to 1980, and the archives keep the second copies [S21 @2026-11-16].","sources":["S20","S21"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bb2a34e6d62c","kind":"portal-availability","anchor":"- **For local registers outside today's Hungary, start with the successor state's archive.** Inside Hungary, check the parish for pre-1895 church books, the MNL in Budapest for films of those books [S20 @2026-11-16], and the county archive for second copies [S21 @2026-11-16].\n- **Search the 1828 national conscription in MNL series N 26, wherever the village lies today.** It covers the whole kingdom, Croatia, Slavonia and the Littoral included, but not Transylvania [S17 @2026-11-16].\n- **Slovakia (Upper Hungary):** reach the church books through FamilySearch first. \"Slovakia, Church and Synagogue Books, 1592–1935\" (collection 1554443) holds christening, marriage and burial images, and the originals are in the Slovak state archives [S13 @2026-11-16]. The ministry's list names the Slovak National Archives and the regional state archives in Banská Bystrica, Bratislava, Košice, Nitra, Prešov, Trenčín, Trnava and Žilina (seat in Bytča) [S14 @2026-11-16]. Map each image group back to the regional archive that holds the original. The same 1 October 1895 civil registration applies there [S1 @2026-11-16], [S15 @2026-11-16].\n- **Use Slovakiana for Slovakia's 1930 census sheets.** Národné osvetové centrum announced in November 2022 that all 1930 sheets for Slovakia were online [S16 @2026-11-16].\n- **Romania (Transylvania, Banat, Crișana, Maramureș):** civil-status registers pass to the county service of the Arhivele Naționale (National Archives) 100 years after they were created [S4 @2026-11-16]. Ask the county service for an older register. A younger one is still with the civil-status service.\n- **Treat a FamilySearch film as a copy of the successor-state holding.** Record which archive the collection page names as the source of the originals.\n- **For Croatia, Vojvodina, Transcarpathia and Burgenland, take the holder from the successor state's own archive guide.** Mark the route unconfirmed in the series row until that guide names the holder.","sources":["S20","S21","S17","S13","S14","S1","S15","S16","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-72fad421bc3f","kind":"custody","anchor":"**For a village now outside Hungary whose 1895 county the new border split, also check that county's archive in Hungary.** The Sopron archive lists, for Sopron county and the city of Sopron, second copies of the state registers of 1895–1921 from the places annexed to Austria in 1921 [S22 @2026-11-13]. Look for the same kind of holding in another border county's archive before you mark a route unconfirmed.","sources":["S22"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5c47d8661571","kind":"unclassified","anchor":"- **Expect the surname first in a Hungarian-language entry:** Nagy János, not János Nagy [S5], [S6].\n- **Expect the given name translated into Latin or German in many records** [S5]. Search Joannes, Johann and János as separate lanes for the same man.\n- **Search every person in a Latin or German entry under both name orders.** Keep the literal order as written in the name register, and never index a surname as a given name.\n- **Expect Latin as the register language in many parishes until the 1840s.** Act VI of 1840 ordered parish registers to be written in Hungarian within three years, even where sermons were not preached in Hungarian [S8]. Act II of 1844 made Hungarian the official language of the Diet, the government and the courts in place of Latin [S7]. Read each register's language from the register itself.","sources":["S5","S6","S8","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00ec7213f1e1","kind":"unclassified","anchor":"- **Read the 1828 national conscription as taxpaying heads of families only.** Its recorded units are the heads of taxpaying families, and the nobles are not included [S10], [S11], [S17].\n- **Read any other tax-based conscription by its own instructions for who was counted.** Do not rely on the list until you have read them.\n- **Expect nobles in the 1784–87 Josephine census, but not named women.** It counted the whole population, nobles and clergy included; women were recorded only as numbers [S9]. Its main enumeration ran in 1784–85, with revisions to 1787 [S9].\n- **Record each tax-conscription entry as a taxpaying head present at a place and date.** Do not reconstruct a household from a conscription line. Treat absence from a tax-based list as uninformative: the person may have been noble, untaxed, a dependant or a servant. For reading a run of tax lists, use the tax-roll recipe.","sources":["S10","S11","S17","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c19643dc92f4","kind":"unclassified","anchor":"- **MNL AdatbázisokOnline:** the National Archives of Hungary's portal of thematic databases, many of them built around named persons [S12].\n- **Treat each hit as a lead.** An OCR line or a database row is not the record. Open the item, and cite the contributing archive and the item, not only the portal.","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-56484b235f46","kind":"unclassified","anchor":"- **Find the start year of the community's own register before you call an earlier event missing.** Record a year before that start as a coverage gap, not as a negative search.\n- **From 1 October 1895, search the state civil registers too** (step 2) [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1828-index-place-forms","kind":"portal-availability","anchor":"**Start with the 1828 Hungarian town and county names** in MyHeritage's *Hungary, Property Tax Census, 1828 From JewishGen* [S23 @2026-11-20], [S27 @2026-11-20] and in the JewishGen index [S11 @2026-11-20]. Keep the indexed spellings in the series locator and the modern place name in the jurisdiction row.","sources":["S23","S27","S11"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-jewish-vital-index-search","kind":"portal-availability","anchor":"**Search the Jewish vital-record index for a deceased person's historic birth, marriage or death.** Open *Hungary, Jewish Vital Records* (collection 10994) in MyHeritage [S23 @2026-11-20], [S24 @2026-11-20]. If it is unavailable in the user's account, use JewishGen's *Hungarian Vital Records* index [S25 @2026-11-20].","sources":["S23","S24","S25"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-jewish-vital-index-places","kind":"method","anchor":"**Keep the event place and registration town in separate fields.** Record the event date and any parents' names shown [S23], [S24], [S25]. Use the registration town and any record number or film reference to locate the register [S25]. If the event place is blank, leave it blank.","sources":["S23","S24","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-jewish-vital-index-megye","kind":"method","anchor":"**Read *Megye* in a birth entry as the county field.** Check that county against a gazetteer for the event year before using it to route the search [S25]. MyHeritage's published sample for an 1860 Pest birth shows *Pest-Pilis-Solt-Kiskun*, a county formed in 1876 [S23], [S26].","sources":["S25","S23","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-transylvania-civil-register-route","kind":"portal-availability","anchor":"**For Transylvanian civil registers, open Genealogica's list for the modern county.** For Cluj [S28 @2026-11-22], Arad [S29 @2026-11-22], Satu Mare [S30 @2026-11-22], Covasna [S31 @2026-11-22] or Sibiu [S32 @2026-11-22], find the commune in the alphabetical list and open the matching locality under it. To find candidate places by geography, open *Registre de stare civilă. Transilvania*, select the county under *Externe* and switch to *Hartă* [S33 @2026-11-22], [S34 @2026-11-22].","sources":["S28","S29","S30","S31","S32","S33","S34"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-transylvania-civil-register-coverage","kind":"portal-availability","anchor":"**Keep the locality label from the county list when you open its link.** Match the locality against both the row label and any alternate name in parentheses. Check district and multi-place labels for the target. Cluj and Someșeni link to the same Cluj-Napoca page and have different listed years [S28 @2026-11-22]. Check every matching row and each listed range or single year. If the event year falls outside the listed digitized coverage, record the gap and leave the event unresolved [S29 @2026-11-22], [S30 @2026-11-22], [S31 @2026-11-22], [S32 @2026-11-22]. In the locality's *Externe* tab, follow the register link to *Descoperă Arhivele Naționale* and log the record type, years and archival reference [S48 @2026-11-22].","sources":["S28","S29","S30","S31","S32","S48"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-transylvania-civil-single-year","kind":"portal-availability","anchor":"**Check the separately listed register for a single year.** For Arpașu de Jos, the two Sibiu list rows share a locality link, and the 1908 birth register (BV-F-00259-1-00582) is filed separately from the 1895–1906 birth register [S32 @2026-11-22], [S36 @2026-11-22], [S37 @2026-11-22].","sources":["S32","S36","S37"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-transylvania-confessional-register-route","kind":"portal-availability","anchor":"**For a Transylvanian event before 1 October 1895, open the confession's register collection.** In Genealogica's *Registre confesionale pentru născuți, cununați și morți*, choose the family's confession from the Reformed, Lutheran (*evanghelică*), Jewish (*izraelită*), Orthodox, Greek Catholic, Roman Catholic and Unitarian collections. Check the place and years within that collection [S33 @2026-11-22], [S35 @2026-11-22].","sources":["S33","S35"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1848-jewish-census-route","kind":"portal-availability","anchor":"**Search the 1848 Jewish census by historic county and town, including places now outside Hungary.** For a deceased person, use MyHeritage collection 20262 for age, birthplace, residence and household relationships [S38 @2026-11-22], [S39 @2026-11-22]. Check surviving and indexed locality coverage in JewishGen's *1848 Hungarian Jewish Census* before treating a miss as evidence. Check the occupation and relationship to the household head before inferring religion from inclusion, since a return can include non-Jewish domestic help [S40 @2026-11-22].","sources":["S38","S39","S40"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1869-hungary-census-route","kind":"portal-availability","anchor":"**Search the 1869 census for households of any religion and property status.** For a deceased person, use MyHeritage collection 20246 for birth year and place, residence and household members [S38 @2026-11-22], [S41 @2026-11-22]. Check town-level coverage and use the household number and film reference in JewishGen's *1869 Hungarian Census* to locate the return when available [S42 @2026-11-22].","sources":["S38","S41","S42"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-subcarpathia-jewish-vital-route","kind":"portal-availability","anchor":"**For a deceased person's historic birth or death in Zakarpats’ka oblast, search the Sub-Carpathia collection for the event type.** For the covered parts of Bereg, Máramaros, Ugocsa and Ung, open MyHeritage's *Sub-Carpathia, Jewish Birth Records from JewishGen* (20073) and look for birth year, residence, parents and the godfather field [S43 @2026-11-22], [S44 @2026-11-22]. In *Sub-Carpathia, Jewish Death Records from JewishGen* (20072), look for the deceased's birth year and place, death date and place, parents and spouse [S45 @2026-11-22], [S46 @2026-11-22]. In death entries from 1895 through 1906, check for the father's occupation and remarks [S46 @2026-11-22]. If the collection is unavailable in the user's account, check the indexed town inventory and search JewishGen's *Subcarpathia Civil Registration* for state-register entries [S47 @2026-11-22].","sources":["S43","S44","S45","S46","S47"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-maramures-civil-register-route","kind":"portal-availability","anchor":"**For Maramureș civil registers, find the commune in Genealogica's county directory and open the matching locality** [S49 @2026-11-23]. In *Externe*, choose the register for the event type and year, then confirm both in the linked *Descoperă Arhivele Naționale* description [S50 @2026-11-23], [S51 @2026-11-23]. Sarasău's 1905–1919 locality span points to a marriage register (MM-F-00743-1-1-00646) [S49 @2026-11-23], [S50 @2026-11-23], [S51 @2026-11-23].","sources":["S49","S50","S51"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
