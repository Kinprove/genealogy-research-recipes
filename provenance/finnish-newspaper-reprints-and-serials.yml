claims:
  - {"id":"C-91aa24b6002f","kind":"portal-availability","anchor":"Start with [Digi, the National Library of Finland’s digitized materials service](https://digi.kansalliskirjasto.fi/). Keep each edition’s newspaper title, date, issue and page in the search log [S1 @2026-11-22].","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-037d004dac06","kind":"method","anchor":"Read the end credit and opening lines for the cited paper, an abbreviated title or an earlier item. Follow any reference back to the named issue. Search Finnish- and Swedish-language versions using the reported place, people and event when the translated headline differs. Compare versions field by field. When wording or a source credit shows one printing depends on another, cite both versions as one report [S2], [S3].","sources":["S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e6370c2f4827","kind":"method","anchor":"Check the source newspaper’s same-day and following issues for a correction and copy any identifying title the abridgment drops [S2]. Kyläkoski traces an Ilmarinen reprint back to an Östra Finland correction dated 9 October 1878 where she finds a revised amount and deposit location as well as the deceased’s former occupation [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e019d994500a","kind":"example","anchor":"For a later article that refers back to a translated letter, follow the reference as its own link in the chain. Kyläkoski traces the 25 May 1844 opening of *Karhu-Pekasta ja Karhun taposta* to *Maamiehen ystävä*, 20 April 1844, page 4, and from there to the letter excerpt in *Wasa Tidning* [S3].","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-048abfef9715","kind":"method","anchor":"List the issues in publication order and browse later issues across the year boundary. For a missing part, look beyond the next issue and record which issues you inspected. Kyläkoski’s *Kaksi renkiä* list for *Maamiehen ystävä* runs from 6 December 1845 to 17 January 1846 with gaps between its instalments [S4]. For *Isätön tukkipoika*, start with viewer page 2 of *Oulun Lehti*, issues 1–39 of 1886, in the order of Kyläkoski’s linked list [S5].","sources":["S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a86048c0523","kind":"method","anchor":"If a promised part is missing, search later issues for a notice explaining the break or announcing another version. Start *Kaksoiset* in *Oulun wiikko-sanomia* with issue 1 of 7 January 1860, viewer page 1, and issue 2 of 14 January, viewer page 2. Kyläkoski reproduces a notice in issue 43 about the missing continuations of both *Kaksoiset* and the Garibaldi biography, with a possible later version of *Kaksoiset* in another form [S7].","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-35c6c7aa64b4","kind":"method","anchor":"Read the opening editorial note and look for reader replies and staff comments in later issues before using a first-person narrator as evidence about the author. In the *Isätön tukkipoika* case, Kyläkoski records a reader taking the serial as autobiographical and the typesetter explicitly doubting that reading [S5].","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5e82a6909746","kind":"method","anchor":"Copy the editors’ stated changes when a serial’s opening describes what they altered. Attribute a spelling or wording choice to the author only to the extent the note supports it. For *Tuomio tuomarille ja kahden rakastajan ijäinen liitto*, use Kyläkoski’s list to start with *Kaiku*, issue 5 of 1878, page 2, for the editorial introduction. Keep the issue locators in the list when following the rest of the run [S6].","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
