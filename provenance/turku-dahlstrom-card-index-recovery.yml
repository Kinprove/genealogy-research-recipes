claims:
  - {"id":"C-0761dcc43acf","kind":"portal-availability","anchor":"Open *Dahlströmin kortisto* in Astia from the Finnish National Archives guide. Start with the name\nindex for a person, the subject index for an occupation or matter, the topographic index for a street\nor lot, and the probate index for an estate. Switch divisions when the clue changes from person to\nproperty or proceeding [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f361208e279e","kind":"method","anchor":"Use municipal appointment and resignation cards to bound a person’s time in office. Check the name and\ntopographic cards for the quarter and lot number where the property is part of the question. Keep the\noffice, estate or parcel claim tied to the particular card and source it names [S2], [S3], [S4].","sources":["S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ecbeda32a497","kind":"method","anchor":"Use the card as a locator and keep the underlying record’s wording and outcome separate. Copy the\nauthority, series, session date and numbered section. For a reopened proceeding, follow each dated\nreference into the corresponding town-court minutes and keep the original inquiry and the reopened one\nseparate. Kyläkoski’s Turku example leads from the cards to two separately dated sections of a\nrenovated court book [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b02bca3dc489","kind":"custody","anchor":"Route the cards through the National Archives of Finland’s Astia. For the underlying magistrate or\ntown-court minutes, start with the Turku City Archives holdings identified in the National Archives\nguide. If the card points to a renovated copy, search separately by the court and dated section\n[S1 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d1be97eddf14","kind":"portal-availability","anchor":"Follow cross-reference cards between divisions and keep the other divisions open when the name index returns no hit [S3 @2026-11-22] [S5 @2026-11-22] [S4 @2026-11-22].","sources":["S3","S5","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-808c15e27971","kind":"method","anchor":"For a minor, search the child's name and inspect cards for any guardians named there. Record each appointment or change separately, with its date and the relationship as stated. For an apprenticeship, record the trade, the year and the place the apprentice came from. The community case leaves an apprenticeship attributed to one of two same-named men, so match the apprentice through other dated records before assigning it. [S6] [S4]","sources":["S6","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-859d4e47414c","kind":"method","anchor":"If a card names a parent and an occupation, use the combination to choose candidate cards and compare the resulting family against parish entries. For a disputed lot, carry the lot label and parties into the property cards and copy the reference to the proceeding. [S7] [S3]","sources":["S7","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
