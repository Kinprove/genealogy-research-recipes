  - {"id":"S1","kind":"web-page","urls":["https://danielpaczkowski.blogspot.com/2023/09/epidemia-cholery-w-klepaczach-w-roku.html"],"published":"2023-09-04","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reviewed 2026-11-22 (web-page, read). The post body in the author's Białystok tag archive, including the distinct April and May reports and November tally. The post credits Eugeniusz Bernacki's 1996 archival study.","entry_sha256":"a41735905acccb4c26f8ad8f080cee58b81e362138baeff3af98cb38757abff9","claims":["C-be58d7281fee","C-7bd9b28c30ce","C-fb5309401d73","C-ec4b634169b7","C-cdff11db700f"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://www.bialystok.ap.gov.pl/arch/kalendarium/12_04.htm"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reviewed 2026-11-22 (help-page, read). Committee responsibilities, distinct county fonds and the Białystok signatures 1–6.","entry_sha256":"7e69849ab784973c2d3f659c5f7d727ac37963df3a4888c2c0ef613fd94daa2d","claims":["C-be58d7281fee","C-cdff11db700f"],"review":"reviewed"}
  - {"id":"S3","kind":"pdf","urls":["https://pbc.biaman.pl/Content/56863/PDF/Marek%20Kietli%C5%84ski%2C%20Obraz%20Bia%C5%82egostoku%20w%20dokumentach%20archiwalnych.%20Katalog%20wystawy%202018.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reviewed 2026-11-22 (pdf, read). Exhibition catalogue entry for an original committee report at signature 3.","entry_sha256":"098ffd68622c314e5e142177b167ac3f5dbbc6f3ea5a0a301889a65d1e903549","claims":["C-be58d7281fee"],"review":"reviewed"}
claims:
  - {"id":"C-be58d7281fee","kind":"custody","anchor":"Start with the Białystok State Archive’s Komitet Powiatowy Białostocki Ochrony przed Cholerą, 1831–1832, signatures 1–6. Use the locality to choose the committee. Keep Sokółka and Bielsk county committees separate [S2 @2026-11-22]. Look for the village in the case reports and later lists, including the Klepacze material discussed by Paczkowski [S1 @2026-11-22]. Signature 3 is a starting point for Białystok reports [S3 @2026-11-22].","sources":["S2","S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7bd9b28c30ce","kind":"method","anchor":"Read lazaret in the 1831 county instructions as a designated house for people who were ill or might become ill. Require a separate statement of symptoms or diagnosis before counting a named occupant as a case [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fb5309401d73","kind":"example","anchor":"For Klepacze, compare the land court’s 23 April 1831 forwarding letter, the 18 May report and the 30 November tally. Record the estate owner as the reported informant in the April letter, and distinguish the court as sender from the committee as recipient. Keep each reported age and death date attached to its document [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ec4b634169b7","kind":"example","anchor":"In Paczkowski’s Klepacze example, the 30 November tally includes deaths that predate the 18 May report but do not appear in it [S1]. Search the tally on both sides of the last report inspected and log each date covered.","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cdff11db700f","kind":"method","anchor":"Read the notes alongside deaths and check for orphan lists. Extract each surviving child's age, the recorded kinship and the proposed or reported care arrangement. Check changes in marriage or farm occupancy as distinct events. Separate a promise to care for a child from evidence that the child moved or that a guardian was appointed [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
