claims:
  - {"id":"C-patent-deed","kind":"method","anchor":"According to the presenter, when a sale deed has no earlier acquisition deed, search the patents or grants for the seller [S1†]. A patent or proprietary grant can record the first transfer to a private owner. Follow subsequent deeds as separate transactions. For early abstracts, select the applicable volume of *Cavaliers and Pioneers*, then retrieve the patent by book and page [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-proprietary-series","kind":"custody","anchor":"According to the presenter, check the separate proprietary records for Northern Neck land [S1† @2026-11-20]. Search the regular Land Office patent books for grants before 1690. Search the Northern Neck proprietary grant books from 1690 onward. For 1690–1692 use the *Cavaliers and Pioneers* supplement, then use Gertrude E. Gray’s grant abstracts for later grants. For pre-1781 survey leads, check Peggy S. Joyner’s abstract set and carry the county and grantee to the warrant and survey records [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-headright","kind":"historical","anchor":"According to the presenter, compare the transported persons and the acreage in a headright patent [S1†]. Use 50 acres per qualifying passage as the usual amount and verify the actual grant terms. When only a count appears, retain it as the claimant’s stated count and leave the identities open. Record any named people as passage claims. Seek separate evidence for their relationship to the patentee and for the date they actually arrived [S4].","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-tract","kind":"method","anchor":"According to the presenter, extract the watercourse, county and adjoining landowners from the boundary clauses [S1†]. Use those names to locate adjoining grants or surveys, and return to the original wherever an abstract omits boundaries. Keep an approximate neighbourhood distinct from a traced parcel [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
