claims:
  - {"id":"C-patent-deed","kind":"method","anchor":"According to the presenter, when a sale deed has no earlier acquisition deed, search the patents or grants for the seller and check the separate proprietary series for Northern Neck land [S1†]. A patent or proprietary grant can record the first transfer to a private owner. Follow subsequent deeds as separate transactions. Retrieve the patent by book and page [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-patent-volume","kind":"method","anchor":"According to the presenter, use *Cavaliers and Pioneers* for Virginia Land Office abstracts [S7†]. Select volumes I–VII by patent date (1623–1776). Use volume VIII for the state grant books A–F (1779–1782) [S9].","sources":["S7","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-proprietary-series","kind":"custody","anchor":"For Northern Neck grants before 1690, search the regular Land Office patent books. Starting in 1690, search the separate Northern Neck grant books. Use the *Cavaliers and Pioneers* Northern Neck supplement for 1690–1692 and Gertrude E. Gray’s *Virginia Northern Neck Land Grants* for 1694–1862. Go straight to the grant books for dates outside the abstracts’ coverage. For surveys dated 1786–1874, use the later Northern Neck warrant and survey series [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-proprietary-abstracts","kind":"method","anchor":"According to the presenter, choose Gray’s grant abstracts by grant period and Joyner’s warrant and survey abstracts by the county or county group at the time of the survey [S7†]. For warrants and surveys from the proprietary period, carry the survey-era county and the claimant’s name from Peggy S. Joyner’s *Abstracts of Virginia’s Northern Neck Warrants & Surveys* to the original papers. If there is no matching grant, check Joyner’s volume 5 for problem surveys and follow any assignment to the eventual grantee [S3] [S13].","sources":["S7","S3","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-deed-to-grant","kind":"method","anchor":"According to the presenter, if a Northern Neck deed leaves the original grant unidentified, check Gray’s grant abstracts and Joyner’s warrant and survey abstracts [S7†]. Match the deed’s watercourse, acreage and adjoining owners against the grant and survey. Test entries under earlier owners or assignees as well as the seller [S3].","sources":["S7","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-proprietary-survey","kind":"method","anchor":"Pull the Northern Neck warrant, plat, survey and accompanying papers even after finding the grant [S3]. Compare any resurvey with the earlier survey for overlapping claims. Log statements about improvements, occupancy, spouses or heirs with the speaker, the date and any limits on the speaker’s knowledge. According to the presenter’s 26 July 1765 example, the earlier survey overlapped other claims and the resurvey identified only a portion as clear [S5†].","sources":["S3","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-colonial-survey-fallback","kind":"custody","anchor":"According to the presenter, follow a *Cavaliers and Pioneers* identification into survey records [S6† @2026-11-22]. For an issued regular colonial patent, look for a surviving survey or plat book in the tract’s county because the Land Office routinely destroyed surveys that accompanied issued patents. When the lead has no issued patent, also check the Land Office’s surviving 1733–1776 survey series [S11 @2026-11-22] [S12 @2026-11-22].","sources":["S6","S11","S12"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-headright","kind":"historical","anchor":"According to the presenter, compare the transported persons and the acreage in a headright patent [S1†]. Use 50 acres per qualifying passage as the usual amount and verify the actual grant terms. When only a count appears, retain it as the claimant’s stated count and leave the identities open [S4].","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-headright-roles","kind":"historical","anchor":"According to the presenter, payment for passage earned the headright [S7†]. Record the person claimed for passage, the payer and the patentee in separate roles because a headright could be transferred before patenting. The patent could issue years after the headright was claimed, and the named person might never have lived on the tract. Seek separate evidence of that person’s arrival, residence and relationship to the patentee [S12].","sources":["S7","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-headright-index","kind":"custody","anchor":"According to the presenter, *Cavaliers and Pioneers* abstracts can supply headright names [S6† @2026-11-22]. Search its headright index for the transported person because the Library of Virginia’s patent index omits that role. For patent books 4 and 5, open the original copy when the index leads to the transcription without headright names [S10 @2026-11-22].","sources":["S6","S10"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-tract","kind":"method","anchor":"According to the presenter, extract the watercourse, county and adjoining landowners from the boundary clauses [S1†]. Use those names to locate adjoining grants or surveys, and return to the original wherever an abstract omits boundaries. Keep an approximate neighbourhood distinct from a traced parcel [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ohio-company-order","kind":"historical","anchor":"According to the presenter, read the Crown and Virginia actions separately [S8†]. Record the Crown’s March 1749 instructions and the Virginia Council’s order of 12 July 1749 authorizing the Ohio Company to take up and survey 200,000 acres. Record the order’s seven-year deadline for settling 100 families and its separate requirement to build and garrison a fort. Use the order as authority to survey and seek a later instrument before recording title to a particular tract [S14] [S15].","sources":["S8","S14","S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-gist-journals","kind":"method","anchor":"According to the presenter, use Christopher Gist’s journals to identify land the Ohio Company explored [S8†]. Read the 1750–1751 and 1751–1752 journals in Darlington’s edition or the Heritage Books reprint. Extract dated waterways and bearings to compare with later surveys or grants. Record those places as exploration leads and verify any subsequent settlement or grant separately [S16] [S17].","sources":["S8","S16","S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
