claims:
  - {"id":"C-f06a0620c4ad","kind":"method","anchor":"Copy the original Ukrainian heading before translating it. A translator may turn a surname or locality into an ordinary word. When an exact phrase fails, search the inflected form or a distinctive stem, then read the full heading. Miller illustrates the difference with nominative `Канівський повіт` and genitive `Канівського повіту` [U567f922da6fa]. Log both queries and the scope you searched.","sources":["U567f922da6fa"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b5dbd36e2384","kind":"method","anchor":"Search for elections of rabbis, assistant rabbis and prayer-school boards under `выбор`, `раввин` and `молитвен`. A Vilnius archive researcher reports extracting candidates and electors for Druya, including the 1892 prayer-school board elections (LVIA 381-17-1277) [B3]. Use these terms to search Ukrainian inventories. For synagogue membership, check religious-community registration files under the local administration. A forum reader reported seeing only part of the Vinnytsia inventory online [B4]. The regional archive’s inventory of fond R-196, opys 1, describes file 843 for the Kloyz synagogue in Lityn (1925–26) as containing a statute, minutes and lists [B8]. Inspect the lists for their dates, fields and inclusion rules before using a name as evidence of participation, residence or kinship.","sources":["B3","B4","B8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a1e06fa218ba","kind":"method","anchor":"Search town, uezd and guberniya inventories, including the treasury chamber. Check whether an uezd list includes its principal town before recording a negative. A forum source raises that question for the 1874 Vitebsk guberniya lists of Jewish men [B1]. In another discussion a researcher reports that a file catalogued simply as an undated Gomel uezd revision may contain lists of Jewish men [B2]. Record the title as written and inspect the pages. Also copy the exact registration society from the person’s record. A burgher designation alone establishes neither a separate Jewish society nor residence in the place of registration.","sources":["B1","B2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6a24e7f2a8c3","kind":"method","anchor":"Search Jewish-society metrical-book inventories by society, year and event. The Streshin discussion lists separate 1880 marriage and death books under fond 2412, inventory 1, files 88 and 89, and identifies the rabbi of the second district (*stan*) of Rogachev uezd [B2]. Check Streshin alongside Rogachev, Zhlobin and Karpilovka in that district, then verify the locality and person in each entry. An inventory title alone cannot establish either.","sources":["B2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7dacba959d27","kind":"unclassified","anchor":"For 1941–44, also check occupation-administration creators, such as a district Gebietskommissariat\nor a town burgomaster. A [finding-aid excerpt for copied regional fonds](https://forum.j-roots.info/viewtopic.php?f=167&t=4906)\nlists case titles under such creators: a census of the Jewish population, residence permits and\nrefusals, and labour requests. When working from a copy collection, record the original archive,\nfund, inventory, case and folio count beside the copy's record-group and accession numbers. These\ntitles remain catalogue leads. The excerpt does not show named entries or that other regions have\nsimilar copies, and an entry does not establish a person's fate.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-952663ab6175","kind":"method","anchor":"Rabbinate files need two stems, because Ukrainian and Russian spell the word differently: a Ukrainian\ndescription has «рабинат» where a Russian title has «раввинат». The Odesa regional archive's\nguide, for example, heads fond 39 «Одеський міський рабинат» and gives the Russian name «Одесский\nгородской раввинат» beside it. [B7] Search both `рабин` and `раввин`; `рабин` also matches\nsurnames such as Рабинович, so read each hit.","sources":["B7"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
