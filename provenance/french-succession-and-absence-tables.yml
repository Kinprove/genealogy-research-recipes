claims:
  - {"id":"C-table-scope","kind":"custody","anchor":"Start with the département’s succession and absence tables or the *France, Tables of Successions and Absences, 1890–1970* index. Identify the registration office and locality on the source image. Copy the stated residence, age, spouse and event place and date when present. Read the table's column headings to distinguish death from formally established absence. Keep the tax registration date separate from the event date [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-declaration","kind":"method","anchor":"Copy the registration office, declaration date and entry or volume reference when supplied. Browse that office's chronological succession declaration register for the reference on the table. Check the declaration for named heirs, relationships and any notarial act. When the table has no usable reference, record the limit and check the civil act separately [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
