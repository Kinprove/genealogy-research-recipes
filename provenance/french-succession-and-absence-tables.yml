claims:
  - {"id":"C-table-scope","kind":"custody","anchor":"Start with the département’s succession and absence tables or the *France, Tables of Successions and Absences, 1890–1970* index. Identify the registration office and locality on the source image. Copy the stated residence, age, spouse and event place and date when present. Read the table's column headings to distinguish death from formally established absence. Keep the tax registration date separate from the event date [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-declaration","kind":"method","anchor":"Copy the registration office, declaration date and entry or volume reference when supplied. Browse that office's chronological succession declaration register for the reference on the table. Check the declaration for named heirs, relationships and any notarial act. When the table has no usable reference, record the limit and check the civil act separately [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-index-coverage","kind":"portal-availability","anchor":"Before interpreting a MyHeritage miss, check whether the collection covers the target département and years [S4 @2026-11-21] [S5 @2026-11-21]. If coverage is missing or uncertain, record the gap or uncertainty and look for the relevant office and years in the departmental archive’s table inventory [S6 @2026-11-21].","sources":["S4","S5","S6"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scan-access-and-fields","kind":"portal-availability","anchor":"MyHeritage allows searching without a subscription, and full record access may require one [S4 @2026-11-21] [S7 @2026-11-21]. Check whether the user’s account can open the scan. If it shows only the index hit, look for the corresponding departmental table image [S5 @2026-11-21] [S6 @2026-11-21]. On the image, copy the birth date, birthplace and parents’ names when given [S4 @2026-11-21] [S5 @2026-11-21].","sources":["S4","S5","S6","S7"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-death-lead","kind":"portal-availability","anchor":"If the civil death act is out of reach or the death date or commune is uncertain, look for the stated death date and commune in the succession table. Carry both details to the civil register when it is available [S4 @2026-11-21] [S8 @2026-11-21]. For a possible death in 1970, also check Insee’s named death files [S9 @2026-11-21].","sources":["S4","S8","S9"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-office-geography","kind":"method","anchor":"Use the registration office on a hit to narrow the possible communes of residence or death [S4] [S5]. Check which communes the office served at the time of the event before assigning a place from the office name. If the residence and death communes fall under different offices, check both tables and follow any *renvoi* to the office it names [S6].","sources":["S4","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
