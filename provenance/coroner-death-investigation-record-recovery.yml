claims:
  - {"id":"C-794ddfd9e183","kind":"method","anchor":"Start with the death location, date and case number if given. Look for a coroner's or medical examiner's case index. Record the index locator and the official status separately. Distinguish the death investigation, autopsy and toxicology documents by title and check the office's rules for each. [S1] [S2] [S5]","sources":["S1","S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-56c4c15a1f04","kind":"portal-availability","anchor":"For Los Angeles County, search the Medical Examiner's case index. For a confirmed deceased subject, also check MyHeritage’s *California, Los Angeles County Coroner Reports*. Match the name and death date and carry the case number to the official result. Record the investigator or examiner when given, and keep cause, manner and release status as separate fields. [S4 @2026-11-22] [S5 @2026-11-22]","sources":["S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4cb13e3666ec","kind":"portal-availability","anchor":"Request the specific report from the custodian after checking the case status, its access rules and the information required. In Humboldt County, use the Coroner's Reports page to reach the county request portal for autopsy or toxicology reports. Confirm the component exists, since an investigation can conclude without an autopsy. Check the listed release conditions and costs before requesting. [S1 @2026-11-22] [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ac5045bc7efb","kind":"portal-availability","anchor":"For British Columbia, use the Coroners Service report request form. State the interest in the findings and recommendations, or identify the applicable public-interest release basis. If an investigation is still open, record the report as pending and recheck its status before setting an expectation for delivery. [S1 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
