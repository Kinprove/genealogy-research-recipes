claims:
  - {"id":"C-3f660ae7d5d8","kind":"unclassified","anchor":"For any census from 1871 onward, write on the observation that the enumeration was de jure. People were listed where they were supposed to belong, as reported by an informant, not where they physically were at a cutoff time. Both presenters stress this as the critical difference from de facto systems, and Ep. 203 contrasts it with the English census [S1], [S2]. The 1852 census (1851 series) is the exception. It mixed de facto and de jure counting and included visitors. Do not apply the presence, absence or duplicate consequences below to 1852 without first checking that year's rules, and read a listed visitor there as someone physically present at that household. Name the informant if the record does. Otherwise mark the informant as unknown.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-702ac86e78d9","kind":"method","anchor":"- **Physical presence.** Record the address as the household's report of residence. A spouse seeking work elsewhere could still be listed at home [S1], [S2]. Look for a local record placing that person at the address on the date in question.\n- **Being in Canada.** Living abroad did not necessarily prevent enumeration at a Canadian home address [S1]. Check the destination as well.\n- **Survival on census day.** A household that had lost contact could report a relative who had already died [S1], [S2]. Compare the death record with the census entry.","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f6c989d409a0","kind":"method","anchor":"When a household reports a long-absent spouse, trace the last documented contact and search for the spouse's own records elsewhere. Obee describes an absence of up to 25 years [S2]. Check the instructions for the particular return before applying any time limit.","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-63a86f8face2","kind":"method","anchor":"- **Duplicate enumeration.** Search both the family home and the work destination. In Obee's illustration a wife in Nova Scotia could report her husband while he gave his own details in Alberta [S2]. Compare age, occupation and family connections across the two lines before deciding whether they describe one person.\n- **An earlier death certificate.** Compare the deceased's identifiers with the census household. In his own family Obee initially set aside a death certificate because a later return still listed the relative [S2]. Keep the conflict visible while checking who could have reported each event.\n- **A missing name.** Check whether the return sought usual residents or visitors. A usual resident could be omitted, and an overnight visitor could be recorded at home [S3], [S4]. The 1852 census included visitors. In 1931, instructions §§61–62 put temporary residents on the regular schedule with an asterisk. Check for that mark before using an entry to infer residence.","sources":["S2","S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c14c5bbea6a1","kind":"method","anchor":"- **Marital status.** Read the permitted responses on the form and in the instructions. Obee recalls returns with no “divorced” option and gives no years [S2]. If the form offered no such response, look for a divorce as well as a death before interpreting “widowed.”\n- **Bilingual headings.** Transcribe both headings for the column in question. Obee found variations across several years when translating the French headings [S2]. Where two readings change what the answer means, record each reading and check the enumerator instructions for that year.\n- **Reference date.** Calculate age at the date the schedule specifies. Library and Archives Canada gives 2 April 1871 [S6], 4 April 1881 [S21], 31 March 1901 [S23], 1 June 1921 [S25] and 1 June 1931 [S11]. For 1901 the retrospective *Canada Year Book* says 1 April [S8], but the schedule specifies 31 March for household membership and age [S23]. For 1891, enumeration began on 6 April [S22], and the population was counted as of 5 April [S7], [S8]. For 1911 use 1 June. LAC lists 11 June as the start, but its age column explicitly uses 1 June [S24], the date also given by the *Year Book* [S8]. The prairie censuses began on 24 June 1906 [S26], 1 June 1916 [S27] and 1 June 1926 [S28].\n- **Birth dates.** The 1901 return asks for each person's month, day and year of birth [S23]. The return for 1911 asks for month and year [S24]. Compare the reported birth date with the age column.\n- **Instructions.** Look for the enumerator instructions for the year and the notices in newspapers published before enumeration. Obee found contemporary notices explaining how to report residents [S2].\n- **Remote and northern districts:** if the entry comes from a northern or remote district that enumerators reached rarely, flag the observation with a possible timing gap and check the printed census reports for that district. Obee says such areas might get one visit a year. Information there could be taken about two months before or after the official date, so a person interviewed in person might have died by census day [S1]. Take the population and age reference date from that year's instructions. For 1931 it is 1 June 1931, and a late visit does not admit a child born after that date.","sources":["S2","S6","S21","S23","S25","S11","S8","S22","S7","S24","S26","S27","S28","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-986d07dd955c","kind":"unclassified","anchor":"Since 1 June 2023 the 1931 images have been public, and at launch they could only be browsed. The presenter's workflow comes from that period [S5]. LAC's announcement confirms a free searchable **1931** index in Census Search, made with Ancestry and FamilySearch. [S9] Search it first; check another provider's actual collection coverage before treating it as an independent search. Use the browse below when the index misses a household you have good reason to expect. A missed name search does not show the household is absent. For index and search-scope failures on a platform, use [Ancestry search recovery](ancestry-record-search-recovery.md).","sources":["S5","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f045b61fa152","kind":"method","anchor":"For the 1926 Prairie census, also record the neighbours. In the Regina search, Harry Cook's household was at 520 Osler Street, township 17, municipality of Sherwood [S5].\n2. **City directory.** Check a directory for the target year. The 1931 Regina directory placed Harry and Martha at the same address [S5]. See the [city-directory recipe](city-directory-observation-workflow.md) for edition dates.\n3. **Check what the old number now covers.** The Cooks' 1926 sub-district was 8. In 1931 the title card for 8 matched neither Sherwood nor township 17 [S5]. Discard that number as a location lead and continue through the neighbouring sub-districts.\n4. **Step through title cards.** The first image of each sub-district is a title card showing township and municipality [S5]. First check the sub-districts on either side of the old number, since the area may not have shifted far. Then, if there is still no match, open every sub-district in order from number 1, which is how the presenter worked, and look for a township-plus-municipality match [S5]. That key fits Prairie records with numbered townships, as in the presenter's Regina example. Elsewhere, match the locality, ward, parish or street address that the title card and schedule actually give. Log every card you check, including partial matches (right township but wrong municipality, or the reverse), and keep going [S5].\n5. **Plausibility screens.** For a promising sub-district, the presenter:\n   - looked at image 2, the first page of residents, and compared the neighbourhood's make-up with the earlier census's neighbours\n   - checked the township column against the recorded number\n   - measured distances between the known street and the street names on the pages\n   [S5]","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-392bcd3c8573","kind":"method","anchor":"These screens only decide where to keep looking. A neighbourhood that matches by ancestry or a nearby street does not identify anyone.\n6. **Locate and cite.** Record the year, district, sub-district and image of the household. For the Cooks, the 1931 title card for sub-district 11 matched both township 17 and Sherwood. Image 18 contained the household on Osler Street [S5]. Read the entry under the residence rules above.","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1931-radio-family-field","kind":"historical","anchor":"- **1931 radio column:** read column 10, \"Has this family a radio?\", as one answer for the family, not for a person. The 1931 instructions (§100, as transcribed by the Canadian Century Research Infrastructure project) had the enumerator write yes or no opposite the name of the head of the family \"irrespective of the ownership of the instrument\" [S15]. LAC notes that 1931 was the first census to ask it [S11]. Record the answer once, for the family. Do not copy it to other members, and do not read a yes as the head having bought or owned the set. Kathryn Lake Hogan (transcript excerpts, not independently verified) reads a yes as a hint of the family's prosperity [S10†]; log it as household context only, never as evidence of income.","sources":["S15","S11","S10"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1935-voters-list-lead","kind":"method","anchor":"Where no directory covers the place or year, take the ancestor's address from the 1935 federal voters list and work back to 1931, as Kathryn Lake Hogan suggests (transcript excerpts, not independently verified) [S10†]. Its entries give name, address and occupation and list a household's voters together [S18]. The lists run by electoral district within each province, then by polling station number and address; only some rural districts are alphabetical [S16], [S17]. Read the 1935 address as a lead to test in 1931, not as a 1931 residence: the list is four years later and names only people eligible to vote [S16]. Carry the street or township into the finding-aid lookup below, not the 1935 district or poll number, because the 1931 returns are organized by districts that closely follow the 1924 electoral map [S11].","sources":["S10","S18","S16","S17","S11"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1935-voters-list-access","kind":"portal-availability","anchor":"LAC holds the federal voters lists from 1935 on, and the 1935 lists are indexed by name and digitized on Ancestry, a subscription service that many public libraries offer free [S16 @2026-11-16].","sources":["S16"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-subdistrict-lookup","kind":"method","anchor":"**Look up the 1931 sub-district in LAC's finding aids.** Hogan (transcript excerpts, not independently verified) points to census statistics for western districts whose names do not match the place the family lived [S10†]. Do not take the district from a table of census divisions: the divisions used to publish results sometimes differ from the districts used to collect the returns [S12]. No 1931 sub-district maps are known to survive, so work from the written descriptions [S13].","sources":["S10","S12","S13"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1931-subdistrict-lookup-list","kind":"method","anchor":"- **Cities.** For a street in Halifax, Saint John, Quebec, Montréal, Toronto, Hamilton, London, Winnipeg, Edmonton, Calgary or Vancouver, use LAC's street index for that city and only its entries marked 31 [S13].\n- **Elsewhere.** Keyword-search the province's finding aid, which transcribes the Dominion Bureau of Statistics sub-district descriptions [S13]. On the Prairies, search both the village or town name and the township, range and meridian. In the Saskatchewan aid's first pages (partial read), a township's description often excludes a village that has its own sub-district, so the family's land and the nearby village can fall in different sub-districts [S14]. Open every sub-district a search returns; LAC's own example, \"Birtle\", returns sub-districts 24, 25 and 63 of Marquette [S13].\n- **Images.** The Saskatchewan aid (partial read: pages 1–2 checked) gives each sub-district's district number and name, microfilm reel and first and last image numbers [S14]. Go to that range and confirm the title card.\n- **Unnamed places.** If the aid does not name the place, find the 1924 federal riding it lay in, because 1931 districts nearly always match those ridings [S11], [S12]. Then read that district's descriptions in the aid.","sources":["S12","S13","S14","S11"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1931-combined-subdistricts","kind":"platform-ui","anchor":"- **Combined sub-districts.** Some small sub-districts were combined by the enumerators. LAC's search takes only the first number of a combined pair; for sub-districts 43 and 44 of District 114, enter 43 [S11 @2026-11-16].","sources":["S11"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-earlier-number-lead","kind":"method","anchor":"Use the earlier number when the finding aids leave the household unplaced, then step through title cards. LAC says 1931 sub-district names or boundaries are not those of 1921, particularly in large cities [S11]. Hogan's guess (transcript excerpts, not independently verified) that 1921 and 1926 districts partly carried over to 1931 is not a rule [S10†]; use an earlier sub-district description only to help read the 1931 descriptions [S13].","sources":["S11","S10","S13"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1842-household-counts","kind":"method","anchor":"For 1842 Canada West, read the head’s name separately from the numerical household columns. LAC lists a named head of each family, followed by counts by age, sex and other categories [S19]. Do not assign unnamed household counts to particular spouses or children. Check the surviving district pages and their headings before calling a household absent; a statistical total is not a nominal return [S20].","sources":["S19","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-quebec-pre-confederation-census-selection","kind":"portal-availability","anchor":"For a pre-Confederation search in present-day Québec, select the census by year and historical jurisdiction [S29 @2026-11-20]. In LAC's pre-Confederation guide, open Lower Canada for 1825 or 1831, Canada East for 1842, or the Québec returns under *Census of 1851* or *Census of 1861* [S30 @2026-11-20]. Check the surviving sub-districts before treating a miss as evidence of absence [S30 @2026-11-20].","sources":["S29","S30"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-early-finding-aid","kind":"platform-ui","anchor":"If the main census series misses your locality or year, filter LAC's [Early census and related documents, 1640 to 1945](https://www.canada.ca/en/library-archives/collection/research-help/genealogy-family-history/censuses/early-census-related-documents.html) by **Region** and **Census type**. Search within the table by place or record title and follow the transcript or original-material reference for names. Log a miss in the table as a finding-aid search [S37 @2026-11-22], [S38 @2026-11-22].","sources":["S37","S38"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-new-france-census-search","kind":"portal-availability","anchor":"For New France, check whether the return names people, names household heads, or gives only totals. Use aggregate returns for context and look for a nominal return before testing anyone's absence [S41 @2026-11-22], [S38 @2026-11-22]. In LAC's guide, open Québec's 1666 *Census of Canada* (item 2318856, MG1-G1, volume 460/1, microfilm F-765). Follow the record's locality page ranges and look through the names of individual household members as well as heads [S38 @2026-11-22], [S42 @2026-11-22], [S48 @2026-11-22].","sources":["S41","S38","S42","S48"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-early-named-household-heads","kind":"method","anchor":"For the 1825 and 1831 Lower Canada and 1842 Canada East and West returns, search for a deceased household head by name and record other residents as counts by category [S41], [S30].","sources":["S41","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ontario-historical-jurisdiction","kind":"platform-ui","anchor":"For present-day Ontario in 1842, choose Canada West. Use Upper Canada as the jurisdiction label for the preceding period [S41 @2026-11-22], [S39 @2026-11-22].","sources":["S41","S39"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-territorial-enumeration","kind":"historical","anchor":"For census returns from 1871 onward, identify the form and apply the de jure default where its instructions call for usual residence. For 1931 **Form 1–N.W.T.**, use the territorial instructions in place of the default below. They allowed an early start in the Northwest Territories and other areas covered by the special instructions, including parts of the Yukon. Enumerators listed people where they found them. Record the place as an encounter in the enumeration area and distinguish the visit date, if given, from 1 June, the official census date [S33], [S34], [S44].","sources":["S33","S34","S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-workplace-enumeration","kind":"method","anchor":"For a missing or possibly double-counted 1931 worker, use work-location evidence to choose where to browse. The instructions called for live-in servants to be counted where they worked and for people without a fixed home in shifting construction or mining camps to be counted where found. Test the workplace and home leads before drawing an absence conclusion or treating two entries as separate people [S31], [S32], [S33], [S44].","sources":["S31","S32","S33","S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-lac-census-abbreviations","kind":"portal-availability","anchor":"For unfamiliar codes that vary by year, look up **Terminology and abbreviations** in LAC's General census guide, then confirm the meaning against the target schedule and its instructions [S37 @2026-11-22], [S40 @2026-11-22].","sources":["S37","S40"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-population-form-choice","kind":"historical","anchor":"Use the form identifier on the image to select the instructions. The column guide below is for the regular Forms 1A and 1B [S11], [S31], [S32]. For Form 1–N.W.T., read its 17 headings before interpreting an apparent gap. For example, it asks for chief occupation in column 16 and has no counterpart to the regular form's unemployment block [S33], [S34], [S44].","sources":["S11","S31","S32","S33","S34","S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-informant-identity","kind":"method","anchor":"Record an unidentified informant as unknown. The instructions asked the head for household details but allowed individual returns for some absent members and information from neighbours if a dwelling was closed. Leave the supplier of each disputed answer open unless the return identifies them [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-visitation-and-address","kind":"historical","anchor":"Use columns 1 and 2 to group rows by dwelling and family in visitation order. One dwelling number can contain several family numbers. Take the location from column 4, including house number and street in town, township, lot, parish or cadastral number in rural areas, and section, township, range and meridian on Prairie returns where entered [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-head-and-relationship","kind":"historical","anchor":"In column 3 read the surname first and check the preceding line if the surname is omitted. Expect the head, wife if present in the return, children by age, and then other relatives and residents. Confirm the head in column 11 and read each relationship back to that person. A household can include servants, boarders and lodgers, so a shared family number alone supplies no kinship link [S31], [S32], [S33], [S44].","sources":["S31","S32","S33","S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-housing-fields","kind":"historical","anchor":"Read the housing entries on the head's line. Use column 5 to decide whether column 6 gives the estimated market value or May 1931 monthly rent. Rent can be an estimate for a family housed rent-free. Use column 7 for dwelling type and column 8 for exterior wall material. Read column 9 as rooms occupied by the family, except where the line is for the head of an entire hotel or boarding house [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-sex-marital-and-age","kind":"historical","anchor":"Decode **M** by its column. Column 12 uses M for male and F for female. Column 13 uses M for married, S for single, W for widowed and D for divorced. The instructions count legal separation without divorce as married. Read column 14 as age at the last birthday on the 1 June reference date. For infants, read fractions such as 11/12 as completed months and keep ages recorded in days in that unit [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-birthplace-fields","kind":"historical","anchor":"Read columns 15–17 for the person's, father's and mother's birthplaces, in that order. Use the recorded Canadian province or territory, or the listed foreign country. For changed borders, use the 1931 boundaries to interpret the entry and map the locality back to the birth-period jurisdiction before searching birth records. For births in the British Isles, look for the specific place given, such as England or Wales [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-immigration-naturalization","kind":"historical","anchor":"Check column 18 for the first entry into Canada for a foreign-born person or the permanent return of a Canadian-born person who had lived abroad. Compare column 19 for the naturalization year. If it says **Pa**, look for an application and confirm completion separately. A child's reported year can be a parent's naturalization year [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-nationality-and-origin","kind":"historical","anchor":"Record column 20 as nationality under the 1931 citizenship and allegiance instructions. Check citizenship independently when it matters, since a married woman's entry followed her husband's under those instructions. Preserve column 21 as the census's historical origin classification. The rule normally traced origin through the father and prescribed maternal origin for people classified under the instructions' Canadian Indian category. Use the reported label as a lead and corroborate ancestry independently [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-language-and-school","kind":"historical","anchor":"Read columns 22 and 23 for ability to speak English and French. Read column 24 for a mother tongue other than English or French, and leave the mother tongue unresolved when the other answers only show speaking ability. Read column 27 as months of attendance from 1 September 1930 to 1 June 1931, generally for ages 5–20. For someone in scope, distinguish a blank from the prescribed **No** for no attendance [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-occupation-classifications","kind":"historical","anchor":"Start with age and column 28. A child under 10 was outside the occupation question. Read **Income** as independent income without a reported occupation, which could include a pension. Read **None** as no gainful occupation reported. **Homemaker** was the entry for unpaid management of one's own home without other employment [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-occupation-industry-class","kind":"historical","anchor":"Read columns 28 and 29 together for the work performed and the industry or business. Keep a trade separate from whether the person was working on 1 June. A blank industry or worker class can be expected where no gainful occupation was reported. In column 30 read **E** as employer, **W** as employee, **O** or **O.A.** as working on own account, and **NP** as an unpaid family worker contributing to family income [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-earnings-and-census-day-work","kind":"historical","anchor":"Check for an occupation in column 28 and **W** in column 30 before reading the earnings and census-day work fields. Column 31 covers the preceding 12 months of employee earnings. Column 32 asks whether the employee was at work on 1 June. If it says **No**, read column 33 for the cause, distinguishing **No Job** from illness, injury, a strike or lockout, or a voluntary or employer-ordered layoff [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-unemployment-period","kind":"historical","anchor":"Compare the total in column 34 with the sum of columns 35–40 for the 12 months before census day. Check for answers given in days before adding and preserve any discrepancy. Distinguish **No Job** (35), meaning weeks without a job, promise of employment or reasonable prospect of returning to the former job, from temporary layoff (39). Read a work stoppage due to plant damage as a temporary layoff. Column 37 is for an accident to the worker, column 38 covers both strike and lockout, and column 40 can refer to a reason written in the margin [S31], [S32].","sources":["S31","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-lac-census-search-filters","kind":"platform-ui","anchor":"Choose the year and jurisdiction in LAC's [Census Search](https://recherche-collection-search.bac-lac.gc.ca/eng/census/index). It covers the main 1825–1931 series, with different geographic coverage by year. For a deceased person's name lookup, open **More** under **Who** if you need an additional field such as birthplace or occupation. Use **Where** for place keywords or district and sub-district choices. For someone who may still be living, browse by locality and keep their identifying details local [S37 @2026-11-22], [S39 @2026-11-22], [S40 @2026-11-22], [S41 @2026-11-22].","sources":["S37","S39","S40","S41"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-pre-release-search","kind":"historical","anchor":"Repeat a pre-1 June 2023 public search for a 1931 household because the images had yet to be released [S31], [S45].","sources":["S31","S45"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-surviving-schedule-and-tables","kind":"portal-availability","anchor":"For named returns, search surviving Schedule 1. Use the published *Seventh Census of Canada, 1931* for aggregate context, such as unemployment in volume 6 or agriculture in volume 8. The agriculture, institutions and merchandising schedules are outside the surviving 1931 returns [S11 @2026-11-22], [S31 @2026-11-22], [S35 @2026-11-22].","sources":["S11","S31","S35"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-myheritage-transcription","kind":"portal-availability","anchor":"If the 1931 LAC name search misses a deceased person, try the separate transcription in MyHeritage's **1931 Canada Census**, then confirm any hit on the population schedule [S31 @2026-11-22], [S33 @2026-11-22], [S43 @2026-11-22], [S44 @2026-11-22].","sources":["S31","S33","S43","S44"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1931-myheritage-household-links","kind":"method","anchor":"Check whether the MyHeritage record view in your account shows **Household** below the image, as described in the September 2023 collection guide. If it does, select a listed name to open that entry and verify its family number and relationship on the image. Otherwise read the other lines for the same family on the schedule [S33].","sources":["S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1931-findmypast-browse","kind":"platform-ui","anchor":"For another image viewer, open Findmypast's **Canada Census 1931 Image Browse** and enter the province, registration district and sub-district from the finding aid. Use the number fields if you have the numbers [S31 @2026-11-22], [S47 @2026-11-22].","sources":["S31","S47"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1926-prairie-scope-and-tables","kind":"portal-availability","anchor":"For a 1926 address lead, use the Prairie population returns for Manitoba, Saskatchewan or Alberta. For agriculture, use the published *Census of Prairie Provinces, 1926* tables. The Prairie agriculture schedules were not preserved [S31 @2026-11-22], [S36 @2026-11-22], [S46 @2026-11-22].","sources":["S31","S36","S46"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-early-nova-scotia-residence","kind":"portal-availability","anchor":"For a residence lead in early Nova Scotia, choose **Canada, Nova Scotia Census, Property Assessments and Poll Taxes, 1770-1841** (collection 20220) in [MyHeritage's Canadian Census catalogue](https://www.myheritage.com/research/records-catalog/canadian-census/catid-1300). The catalogue showed the collection link. The search form did not render during the check, and search results and signed-in access remain untested [S50 @2026-11-23]. Record an unavailable form as an access gap. If the form is available, search for the deceased person by name and use the indexed residence year and place to locate the underlying list [S49 @2026-11-23]. Where the date and locality fit, look for the list in the Nova Scotia Archives' [Census Returns, Assessment and Poll Tax Records 1767–1838](https://archives.novascotia.ca/census/). Read the list heading to identify a census return, property assessment or poll-tax roll. Record the type, year and locality from the list, and verify household membership separately for any assessment or tax hit [S51 @2026-11-23].","sources":["S49","S50","S51"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
