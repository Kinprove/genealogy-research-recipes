  - {"id":"S48","urls":["https://recherche-collection-search.bac-lac.gc.ca/eng/home/record?idnumber=2318856&app=fonandcol&resource=folderlist"],"entry_sha256":"a9050b33a4435d0ce84946ab22ff957b145b0a6e21cefe3e66e821e5bb62d78d","kind":"catalogue","published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Reference, extent and locality page ranges read 2026-11-22","claims":["C-new-france-census-search"],"review":"reviewed"}
