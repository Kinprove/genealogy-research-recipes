sources:
  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2024/08/new-extract-and-save-information-to-your-tree-directly-from-the-profile-pages/"],"published":"2024-08-21","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the profile Hint workflow for source review, highlighting, old values, editing, reverting, citations and selective additions.","entry_sha256":"4179ada3f5474ced9d9f933890d772065c76331963a87adbfaca8fc57d27f6ad","claims":["C-01","C-02","C-03","C-04","C-05"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852043-how-do-i-save-a-record-from-the-myheritage-historical-records-search-engine"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Current provider help describes the linked reference and profile display after saving a historical record.","entry_sha256":"0b1989919659a1afe8e12e2b88c645c53b3d2b69c0beacf432ca6707ed27bc86","claims":["C-05"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/from-the-amalfi-coast-to-sete-how-i-found-my-long-lost-cousins-thanks-to-myheritage/"],"published":"2025-06-26","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. In this guest account, Bousquet reports finding his great-grandmother listed in a matched tree and messaging its owner through MyHeritage. He also reports using a separate tree match to find another branch of the family that emigrated. The known-relative starting point is adapted from this account.","entry_sha256":"33619812d3a12c979a6bc831431c7991160c8a6262e1331c09430acd53417d02","claims":["C-06"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://education.myheritage.com/article/myheritage-discoveries-pages/"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Provider documentation describes the close-family comparison in Smart Match review and explains why matches with no new information can still be useful.","entry_sha256":"27da2f8a6f7e368ae0486519614307617ea7d2a5e8ae40bf9b9ccb0d0abd6535","claims":["C-06"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12851256-can-i-send-a-message-to-another-site-manager-via-a-smart-match"],"published":"2026-07-21","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Provider help documents the Contact control on the matching site manager’s name in the person’s Smart Matches list and states that access depends on the account’s subscription.","entry_sha256":"2ed57a6729631e749e4616d30792e0ebdc8d6788d8b10e9643182b18238189da","claims":["C-07"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Open the person’s **Profile**, open the **Hint** and choose **Review** on the relevant source card. Scroll through the side-by-side comparison and open the underlying source where available. Review fields beyond the yellow highlighting. Check whether the source concerns the same person. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"Confirm the profile match only once you have established the correspondence. Then open the extraction panel for the fact review. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"In **Extract information**, choose the arrows for the supported fields. Compare each selected value with the previous tree value shown beneath it. Use the revert control for an unwanted replacement. Use the pencil on a selected row to edit the value inline when the source supports the edited wording. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"In **Immediate family**, open **More details** and inspect the available facts for the relative. Select the supported facts and relationship before adding the relative to the tree. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"Use **Save to tree** for the selected facts and relatives after reviewing the scope of the change. Reopen the profile to check the new values and their linked citations, keeping a reference to the underlying source for anything the generated citation omits. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"When tracing an emigrant branch from a Smart Match, open the matching tree if you have access. Find a relative you can already place in your own tree and follow the relationships from that person toward the emigrant branch. [S3 @2026-11-20] Check the tree even when the match adds no facts about the matched person. If you cannot open the tree, inspect the Smart Match’s close-family comparison for leads. [S4 @2026-11-20] Verify each relationship before copying it.","sources":["S3","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"platform-ui","anchor":"If a relationship on the branch needs clarification, open the person’s Smart Matches list. Click or hover on the matching site manager’s name and choose **Contact** if available in your account. Ask the manager which source supports the relationship. [S5 @2026-11-20]","sources":["S5"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
