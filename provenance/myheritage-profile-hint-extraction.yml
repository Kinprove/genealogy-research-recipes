sources:
  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2024/08/new-extract-and-save-information-to-your-tree-directly-from-the-profile-pages/"],"published":"2024-08-21","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the profile Hint workflow for source review, highlighting, old values, editing, reverting, citations and selective additions.","entry_sha256":"4179ada3f5474ced9d9f933890d772065c76331963a87adbfaca8fc57d27f6ad","claims":["C-01","C-02","C-03","C-04","C-05"],"review":"reviewed"}
  - {"id":"S2","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852043-how-do-i-save-a-record-from-the-myheritage-historical-records-search-engine"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Current provider help describes the linked reference and profile display after saving a historical record.","entry_sha256":"0b1989919659a1afe8e12e2b88c645c53b3d2b69c0beacf432ca6707ed27bc86","claims":["C-05"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/from-the-amalfi-coast-to-sete-how-i-found-my-long-lost-cousins-thanks-to-myheritage/"],"published":"2025-06-26","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. In this guest account, Bousquet reports finding his great-grandmother listed in a matched tree and messaging its owner through MyHeritage. He also reports using a separate tree match to find another branch of the family that emigrated. The known-relative starting point is adapted from this account.","entry_sha256":"33619812d3a12c979a6bc831431c7991160c8a6262e1331c09430acd53417d02","claims":["C-06"],"review":"reviewed"}
  - {"id":"S4","kind":"web-page","urls":["https://education.myheritage.com/article/myheritage-discoveries-pages/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-21. Provider documentation describes the close-family comparison in Smart Match review, explains why matches with no new information can still be useful, and documents the Discoveries views and match type and status filters. Rechecked 2026-11-22. Also documents the brown Record Match icon on the person's tree card.","entry_sha256":"1985ddceaa5cd17737c934c6288168c8966f61cf438d9562e79212391dffbb22","claims":["C-06","C-10","C-19"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12851256-can-i-send-a-message-to-another-site-manager-via-a-smart-match"],"published":"2026-07-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-20. Provider help documents the Contact control on the matching site manager’s name in the person’s Smart Matches list and states that access depends on the account’s subscription. Rechecked 2026-11-22.","entry_sha256":"2220ccd2d2664c84e6ffb544e9fe48ae1b61bd8d5b47b7b57eb8b6cefab238db","claims":["C-07"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://blog.myheritage.com/2024/02/introducing-all-new-profile-pages-with-hints/"],"published":"2024-02-29","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. The provider’s desktop launch post documents the profile Matches tab for pending matches, side-by-side review, and Hint display settings shared with the family tree. Public documentation review only.","entry_sha256":"fcbe51450ad59fdf31306d941d76ca68c654d8c03e171532fdb16f48ea5c6c5f","claims":["C-08","C-09"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://familytreemagazine.com/websites/myheritage-for-free/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Papadopoulos suggests using Discoveries to group matches and filter by review status. S4 supplies the exact view names and distinguishes matches to trees from matches to records.","entry_sha256":"5fc3d48c746b7b17c1b4257bc4ae776eda94a3c9dc5e9106e52c64ca0b442839","claims":["C-10"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://blog.myheritage.com/2022/08/5-ways-to-make-progress-with-your-genealogy-even-when-youre-sick/"],"published":"2022-08-23","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Cappart suggests opening Discoveries in the app and narrowing it by match type. S9 supplies the current filter control and review steps.","entry_sha256":"6381bf5aed8ea673d47afb8295c28a46d175f7df26e8e7ab4bd351d7bfc1224e","claims":["C-11"],"review":"reviewed"}
  - {"id":"S9","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12851444-how-can-i-check-smart-matches-and-record-matches-using-the-myheritage-app"],"published":"2026-07-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-21. Provider help documents the upper-right filter for Smart Matches or Record Matches and the controls for opening a person’s matches and reviewing them. Rechecked 2026-11-22. The same page documents Confirm for both match types and the next-screen save step for Smart Matches. Access varies by subscription or record.","entry_sha256":"7a3c7525d0a4cec12780f15c7f1d57267cbbd9475bc653b7b52d14650bfa22f7","claims":["C-11","C-23","C-24"],"review":"reviewed"}
  - {"id":"S10","kind":"web-page","urls":["https://blog.myheritage.com/2023/02/i-found-my-long-lost-german-relatives-and-an-unknown-half-great-uncle-thanks-to-myheritage/"],"published":"2023-02-15","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Laetitia Renault reports finding sibling names through a Record Match and tracing one sibling’s descendants. She separately reports a Filae Smart Match that followed a different line from her great-grandfather through a child of his first marriage. Her tree already included the marriage.","entry_sha256":"24c2591e02e5f58f3461e926378ef5830ff05ab59034a36b2e231fd8972a3c9c","claims":["C-12","C-13"],"review":"reviewed"}
  - {"id":"S11","kind":"web-page","urls":["https://blog.myheritage.com/2023/02/daniels-favorites-10-myheritage-features-our-genealogy-expert-cant-live-without/"],"published":"2023-02-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Horowitz describes opening the brown icons in his tree and reports receiving incorrect Record Matches even when the suggested person had the same name and was born or died in the same place.","entry_sha256":"27b71795af40b943a4ea9388e2527ec9c299d0753336d88c36fc8940bd3bc116","claims":["C-14","C-19"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://blog.myheritage.com/2023/12/myheritage-publishes-millions-of-exclusive-marriage-records-from-north-rhine-westphalia/"],"published":"2023-12-12","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The launch post distinguishes automatic Record Match notifications from subscription access to the records it announces. Used for that distinction. S13 gives current collection-dependent scope.","entry_sha256":"c9200b5d5053fb2d4ca29adac8ca507aaee8f80fd2da0a92118bdc12022713d0","claims":["C-17"],"review":"reviewed"}
  - {"id":"S13","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/13130450-who-can-view-record-matches"],"published":"2026-07-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Provider help distinguishes site managers’ access to matches from their access to the full records and notes the exception for free collections.","entry_sha256":"cf7c91bcb63733badce1042392ebdb6b46fae34f2745fe6abe6ba04bdfd808a4","claims":["C-17"],"review":"reviewed"}
  - {"id":"S14","kind":"web-page","urls":["https://blog.myheritage.com/2022/05/the-1950-u-s-census-index-for-nevada-and-puerto-rico-are-now-live/"],"published":"2022-05-12","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The post describes free access to the standalone census records and Record Matches at release. S15 supplies the current collection listing.","entry_sha256":"dee7c6ef16091d715f641ba858500b5b896a5b02f032c98c82dfde1985c0d530","claims":["C-18"],"review":"reviewed"}
  - {"id":"S15","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-11006/1950-united-states-federal-census?tr_country=US&tr_creative=1950USCensus&tr_funnel=supersearch&utm_campaign=supersearch&utm_content=1950USCensus&utm_medium=blog&utm_source=organic_blog"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The public catalogue labels the standalone collection free. Used for the current collection title and listed access.","entry_sha256":"a66d234b39a9bfcd2b773d1e63763a35fecd77c2c0dc45530e2b8068c1581d2d","claims":["C-18"],"review":"reviewed"}
  - {"id":"S16","kind":"web-page","urls":["https://blog.myheritage.com/2022/08/i-reunited-with-my-fathers-lost-family-thanks-to-a-smart-match-on-myheritage/"],"published":"2022-08-25","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Wojciechowski reports finding a Smart Match while building her tree and comparing the matched person and both parents with the names she already knew. A relative who knew the subject recognized him in a photograph she had posted. Used for the known relatives to compare and for recording firsthand recognition as a claim.","entry_sha256":"f571276e662ced05ee120310b47bb85e725e3d1b3c3b46a676aefe2c61df7d63","claims":["C-15","C-16","C-20"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://blog.myheritage.com/2024/01/descendants-of-brothers-separated-in-wwii-find-each-other-thanks-to-a-smart-match-on-myheritage/"],"published":"2024-01-11","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Ina reports matching a known sibling count, sibling names and parents in another tree. That tree supplied birth dates and birthplace but described her grandfather as missing during the war. She reports asking the manager to compare notes about the discrepancy.","entry_sha256":"9f3d4460b755a83ca6a49a5e76426d7628e57b8b6e971d6afc5808e5950c9c69","claims":["C-07","C-15","C-20"],"review":"reviewed"}
  - {"id":"S18","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852418-what-is-a-myheritage-smart-match-and-how-do-i-use-smart-matching"],"published":"2026-07-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Provider help explains that Smart Matching can tolerate spelling differences and describes the use of family connections, including parents and siblings.","entry_sha256":"f784a7e606e0da3e360dd3c615b4899c19bdfa6d5d42f8d0fefc00a7c5323eb5","claims":["C-15"],"review":"reviewed"}
  - {"id":"S19","kind":"web-page","urls":["https://aiatsis.gov.au/family-history/family-history-sources/sources-home/photographs"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The family-history guide discusses relatives’ identifications and using old photographs as clues alongside other research.","entry_sha256":"49aef2c3d967140b3e927cf391202eafcb8df74c1ef9445a7adb0f7f97080805","claims":["C-16"],"review":"reviewed"}
  - {"id":"S20","kind":"web-page","urls":["https://blog.myheritage.com/2025/03/third-cousins-explained-a-genealogists-guide-to-distant-kin/"],"published":"2025-03-09","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The author suggests starting with known relatives in a tree, looking for tree and historical record matches, and following siblings’ lines to find collateral branches.","entry_sha256":"11daab48943f5e1787a6aaade5a16893b3b3201575289d5db115e1860da83f7a","claims":["C-20"],"review":"reviewed"}
  - {"id":"S21","kind":"web-page","urls":["https://education.myheritage.com/article/what-smart-matches-are-and-how-to-make-the-most-of-them/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Provider documentation describes new Smart Matches or Record Matches after adding information to a tree, with no assurance that a particular profile will gain a match.","entry_sha256":"70118aa248bb8e2a30c50790cbad91da38c73df28246874479c07aa8fcdd55e3","claims":["C-20"],"review":"reviewed"}
  - {"id":"S22","kind":"web-page","urls":["https://blog.myheritage.es/2023/03/presentamos-codigo-de-colores-para-arboles-familiares/"],"published":"2023-03-02","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The Spanish edition of the 2023 MyHeritage launch post documents the Smart Match review controls, the path to the manager in the matched tree, and the condition for showing colors and the blood-relative indicator. Used the Smart Match section for the desktop workflow.","entry_sha256":"29570b61144b7e82fd1661613c7ada8497e183266d11154a8ac6d89fc19f07f9","claims":["C-21","C-22"],"review":"reviewed"}
  - {"id":"S23","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852487-what-is-color-coding-and-how-do-i-use-it"],"published":"2026-07-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Provider help confirms that color and blood-relative cues in a Smart Match tree depend on the manager appearing in that tree and documents the clickable relationship label.","entry_sha256":"11f9c77943fece7d6d381f33fd7d58fced8dcee49011e50cd063ad3a69e77dc5","claims":["C-21","C-22"],"review":"reviewed"}
  - {"id":"S24","kind":"web-page","urls":["https://blog.myheritage.com/2023/08/family-history-research-for-busy-bees-genealogy-on-the-go/"],"published":"2023-08-08","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Cappart suggests reviewing, confirming and extracting information from matches in the mobile app. S9 supplies the exact confirmation control and documents the next-screen save step for Smart Matches.","entry_sha256":"b25fcfb09a4091869707192830822fbaaeb24e1377ace67589c8929684dc3f17","claims":["C-23","C-24"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"Open the person’s **Profile**, open the **Hint** and choose **Review** on the relevant source card. Scroll through the side-by-side comparison and open the underlying source where available. Review fields beyond the yellow highlighting. Check whether the source concerns the same person. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"Confirm the profile match only once you have established the correspondence. Then open the extraction panel for the fact review. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"In **Extract information**, choose the arrows for the supported fields. Compare each selected value with the previous tree value shown beneath it. Use the revert control for an unwanted replacement. Use the pencil on a selected row to edit the value inline when the source supports the edited wording. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"In **Immediate family**, open **More details** and inspect the available facts for the relative. Select the supported facts and relationship before adding the relative to the tree. [S1 @2026-11-18]","sources":["S1"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"Use **Save to tree** for the selected facts and relatives after reviewing the scope of the change. Reopen the profile to check the new values and their linked citations, keeping a reference to the underlying source for anything the generated citation omits. [S1 @2026-11-18], [S2 @2026-11-18]","sources":["S1","S2"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"platform-ui","anchor":"When tracing an emigrant branch from a Smart Match, open the matching tree if you have access. Find a relative you can already place in your own tree and follow the relationships from that person toward the emigrant branch. [S3 @2026-11-20] Check the tree even when the match adds no facts about the matched person. If you cannot open the tree, inspect the Smart Match’s close-family comparison for leads. [S4 @2026-11-20] Verify each relationship before copying it.","sources":["S3","S4"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"platform-ui","anchor":"If a relationship or event on the branch needs clarification, open the person’s Smart Matches list. Click or hover on the matching site manager’s name and choose **Contact** if available in your account. [S5 @2026-11-22] Ask which source supports the relationship or conflicting event in the matched tree. [S17 @2026-11-22]","sources":["S5","S17"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"platform-ui","anchor":"If no Hint covers the detail you need, check for the profile’s **Matches** tab. Choose **Review** beside a pending Smart Match or Record Match to compare it side by side with the profile. [S6 @2026-11-21]","sources":["S6"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"platform-ui","anchor":"To change which Hints are displayed, look for **Settings** in the desktop profile’s three-dot menu. If Hint display options are available in your account, select the types you want and choose **Apply**. Check the family tree view as well, since the display settings can affect both views. [S6 @2026-11-21]","sources":["S6"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"platform-ui","anchor":"On the website, open **Discoveries**. Choose **Matches by people** to review leads for an ancestor or **Matches by source** to focus on a record collection or matching tree. Use **Record Matches** for historical records and **Smart Matches** for other trees. Set the status filter to **Pending**, **New**, **Confirmed** or **Rejected** to reach the review stage you need. [S4 @2026-11-21], [S7 @2026-11-21]","sources":["S4","S7"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"platform-ui","anchor":"In the mobile app, open **Discoveries** and use the filter icon in the upper right to show only Smart Matches or only Record Matches. Tap **View** for the person, then **Review match** for the lead. [S8 @2026-11-21], [S9 @2026-11-21]","sources":["S8","S9"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"When a Smart Match points to an ancestor you have already identified but follows a different line of descent, check whether that line runs through a child of an earlier marriage already in your tree. [S10]","sources":["S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"If a Record Match names a deceased sibling, use that sibling’s name as a starting point to trace their deceased descendants in historical records. [S10]","sources":["S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"A Record Match can point to a namesake even when the name and birthplace or place of death agree, so compare another identifier such as a dated event or named relative before confirming it. [S11]","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"method","anchor":"For a Smart Match, compare the person’s name and both parents’ names with your own evidence. Compare the known sibling names and count as well, checking for siblings omitted from either tree. [S16], [S17] Allow for spelling differences. Treat newly supplied birth dates or places as leads and keep the match pending if a conflicting event still needs checking. [S17], [S18]","sources":["S16","S17","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"method","anchor":"If someone in the matched branch who knew the person identifies them in a photograph, record the identification in your notes as that person’s claim, along with how they knew the subject. Use the claim to guide a record search and base the match decision on the records. [S16], [S19]","sources":["S16","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-17","kind":"fee","anchor":"Check full-record access in the user’s account. A Record Match can be visible even when a subscription is needed to open the record. [S12 @2026-11-22], [S13 @2026-11-22] If it is locked, record the collection and any visible names, dates and locator. Keep the match pending while you [look for the underlying record](myheritage-historical-record-search.md).","sources":["S12","S13"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-18","kind":"fee","anchor":"For a restricted lead to a 1950 U.S. census entry, check the standalone **1950 United States Federal Census** collection, which MyHeritage lists as free. [S14 @2026-11-22], [S15 @2026-11-22]","sources":["S14","S15"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-19","kind":"platform-ui","anchor":"From the desktop tree, click the brown Record Match icon on the person’s card to open their list of Record Matches. [S11 @2026-11-22], [S4 @2026-11-22]","sources":["S11","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20","kind":"platform-ui","anchor":"To look for a separated branch, add missing profiles for the deceased target and their known deceased parents or siblings. [S16 @2026-11-22], [S17 @2026-11-22] Recheck for Smart Matches and Record Matches on the target and those relatives. Use tree matches to find candidate branches and records naming collateral relatives to trace them. [S20 @2026-11-22], [S21 @2026-11-22]","sources":["S16","S17","S20","S21"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-21","kind":"platform-ui","anchor":"On the website, choose **Review match**, hover over the matched name and choose **View in tree** if available. Open the matched person’s card and click the relationship in the left panel, when displayed, to see the path recorded in that tree between the person and its site manager. [S22 @2026-11-22], [S23 @2026-11-22]","sources":["S22","S23"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-22","kind":"platform-ui","anchor":"If branch colors or the blood-relative indicator are absent, check whether the site manager appears in the matched tree. These cues depend on the manager having a profile there. When either cue is missing, trace the relationships from the tree entries before drawing a conclusion about kinship. [S22 @2026-11-22], [S23 @2026-11-22]","sources":["S22","S23"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-23","kind":"platform-ui","anchor":"In the mobile app, tap **Confirm** on a verified Smart Match or Record Match if the control is available in your account. [S24 @2026-11-22], [S9 @2026-11-22]","sources":["S24","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-24","kind":"platform-ui","anchor":"After confirming a Smart Match in the mobile app, save only supported information on the next screen. If the app does not offer a way to select only those details, finish the extraction on the website. [S24 @2026-11-22], [S9 @2026-11-22]","sources":["S24","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
