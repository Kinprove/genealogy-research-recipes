claims:
  - {"id":"C-d2873871cfe3","kind":"platform-ui","anchor":"In the Genealogical Society of Finland's SukuHaku member service, use the *Merimiehet* material filter to enter the sailors’ house index. Record the house, dated entries, and any index citation. Check the index's scope before relying on a miss [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bb687497112c","kind":"method","anchor":"Write 'enrolled by' for an earliest observed listing and 'listed at least' for a span supported by the records. Check each house named in the evidence, including an intermediate house omitted by an obituary. Kyläkoski reports such an omission for the Pori enrollment in the life of a sailor also listed in Turku and Rauma [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-327888cd2c7c","kind":"custody","anchor":"Search the Finnish National Archives catalogue by the house name and *merimieshuone*. Check who holds the particular archive before selecting a series. The archives guide distinguishes Helsinki City Archives and the Viipuri archive in Vyborg from the National Archives branches [S2 @2026-11-22].","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1cc11f31e5e7","kind":"method","anchor":"Compare the enrollment register with crew lists and any ship's log for the same person and period. Copy the literal vessel name, role and date as recorded. Use the [household chain](scandinavian-parish-record-recovery.md) to confirm the person, and use [historical newspapers](historical-newspaper-section-search.md) for separately dated movements of the ship. Keep a ship's movement apart from evidence that the sailor served aboard on that voyage [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
