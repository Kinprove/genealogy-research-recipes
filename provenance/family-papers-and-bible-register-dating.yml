claims:
  - {"id":"C-7ec088b1dba6","kind":"method","anchor":"1. **Keep a letter or card and its envelope under one item reference.** Record whether they arrived together or were paired later. Photograph both sides of the envelope so the postmark, sender and destination can be checked against the card [S1].\n2. **Record the postmark, return address and delivery address separately from dates and places in the text** [S1].\n   - A postmark dates the mailing. It is the latest possible date for the writing and for any event the text reports as already past, but it does not date those events: a birth, death, visit or move reported inside a card needs its own date [S1].\n   - A return address is the sender's stated address at that time and a lead to where that branch of the family lived. It is not an emigrant's birthplace. In [S2], letters from relatives in Mexico to cousins in the United States are recommended because their return address can locate the family.\n3. **Check for missing pages before attributing a letter.** Three unsigned pages addressed to Mamie in 1910 appeared to fit William, whom she married later that year. The last page, folded into another family file, was signed Frank Sullivan [S3]. Keep the writer unresolved until a signature or other independent evidence identifies him.\n4. **If a separated page turns up, link it to the same item reference.** Record where it was found and the textual continuity supporting reunion [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-78cb4671cb57","kind":"method","anchor":"1. **Transcribe each entry with its page position.** Include struck-through text, arrows and added names, dates or addresses in visible order. Treat them as layers of the keeper's updates rather than one dated snapshot [S4], [S6]. A card list may be a single sheet kept with the holiday cards [S4].\n2. **Preserve the old and new forms.** When a keeper crosses out an address or a maiden surname and writes another beside it, transcribe both in page order [S4]. Check the proposed move or marriage in a dated record before assigning an event date.\n3. **Check the keeper's other cancellations before interpreting one.** The same mark in one card list meant a move for some people and a death for another [S5]. Record the cancellation as an edit and leave its cause and date open.\n4. **Check the old surname heading after a remarriage.** One keeper continued updating a remarried relative's entry under the name she used for her in conversation [S6]. Copy the heading as written and search the address book under both surnames.\n5. **Keep a relative's explanation as an attributed account.** Do not assume who made the edits.\n6. **Treat listed people as associate leads, not established kin.** One presenter says you have to work out who is a friend and who is family [S4]. Another says people appear in the book because of some relationship, whether or not they are related [S5].","sources":["S4","S6","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-eaabf922df10","kind":"method","anchor":"1. **Record every dated page, not only the main title page** [S7], [S8]: the title page and its back, any copyright or plate notice, the New Testament title page, dated engravings or maps bound in, and the publisher's address in the imprint [S12], [S15]. A title-page or copyright date is only a \"not earlier than\" date: nothing on this book's own register leaves can have been written before it [S12], and this copy may have been printed years later. Publishers reprinted from the same title page and plates: one folio dated 1813 holds plates dated up to 1818, and a printing of 1822 has the same title page and plates. The Old and New Testament title pages often carry different dates [S13]. A publisher's changing street address can narrow an undated printing [S14]. Use the latest date these pages show as the earliest possible printing date of this copy. Then check whether the register leaves belong to this book. Register pages were sometimes removed from their Bibles and kept apart, and families copied an earlier generation's records into their own Bible [S16], [S17]. Record the leaves as part of this book, not part of it, or unresolved.\n2. **Record each entry separately:** stated event date, apparent hand, ink or medium, and position [S7], [S9]. The writing medium gives an earliest writing date. Ballpoint pens became widely available only in the mid-1940s: first marketed in Argentina in 1944 and sold in U.S. shops from 29 October 1945 [S18], [S19], [S20]. Felt-tip markers came into use in the 1940s and 1950s, and the fibre-tip pen dates from 1962 [S18], [S21]. Aniline dye inks, often violet or blue, came in after about 1860 [S18]. An entry written in a medium that did not exist when its event happened was written later. Iron-gall ink stayed in use into the early 20th century [S18], so in a 19th-century register it cannot separate near-event writing from a later copy. Judging a medium by eye is a lead, not proof.","sources":["S7","S8","S12","S15","S13","S14","S16","S17","S9","S18","S19","S20","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b9177ea6947f","kind":"unclassified","anchor":"1. **Separate the work's first publication, this edition or copy, any later alteration, and a claimed acquisition or inheritance** [S11].\n2. **An inscription in another copy shows only that its edition existed by that date.** It does not date this copy, its acquisition or its owner.\n3. **The same cover design on several copies indicates a publisher's or trade binding.** It does not identify who rebound this copy, or show that it was rebound at all.\n4. **Keep the family's account and a seller's description apart from what this copy shows** [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c97e85bc39fe","kind":"method","anchor":"Compare the imprint, title page and binding across copies. Effie Kelsey's copy of *BitterSweet* had no title-page date. The work was first published in 1858, and another copy with the same Hurst and Company title page bore a 1909 inscription [S11]. Use 1909 to date that inscribed copy, leaving Effie's acquisition date open. Matching etched covers in other copies suggest a commercially produced design. They do not identify who bound hers.","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3acb261aa82c","kind":"method","anchor":"7. **Read a funeral guest book as a dated list of associates.** For a recent relative, look among the family papers for the book from the visitation or service; relatives may keep a copy with their own papers [S29]. List every signer as someone who attended and so knew the deceased or the family, as a co-worker, neighbour, friend or relative [S29], [S30], and keep any city written beside a name as that signer's residence lead [S29], [S31]. Treat signers as associate leads, not kin. Signers of a recent book may be living: keep their names and residences in private notes (Living people, in `SKILL.md`).","sources":["S29","S30","S31"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-de2f9b69fa4d","kind":"method","anchor":"The presenter in [S32†] checks diary material for what it reports, whether it was edited, and whether the writer recorded each event that day or long afterward (reviewed from transcript excerpts; the video itself was not inspected). Keep the results apart: editing and copying decide the source's class, while the time gap and the writer's knowledge decide the weight of the information [S33].","sources":["S32","S33"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2d833008ff4d","kind":"method","anchor":"1. **Name the version you are reading: the writer's manuscript, the writer's own rewrite, a transcript or extract, or a published edition.** Only the first manuscript is the original record; a transcript, extract, translation or published edition is derivative [S33]. Treat the writer's rewrite as a later version too. Editors and writers both drop and add text. Charles Nash's 1904 history of Augusta printed about a third of Martha Ballard's diary, blanked out a judge's name in one entry and cut other entries entirely [S34]. From 20 May 1944 Anne Frank rewrote a large part of her diary for a planned book, leaving out passages and adding detail [S35]. Compare an entry with the manuscript before relying on it. When no manuscript is found, record the entry as known only from that version.\n2. **Read an entry's date as its stated writing date, not as the date of the events it reports.** Give each reported event its own date, or mark it undated, and record the gap from the entry date. Text found only in a rewrite dates from the rewrite, whatever entry date heads it: Anne Frank's rewritten entry of 9 July 1942 mentions people on their way to work, a passage her first diary does not have [S35].\n3. **Weigh a late recollection; do not reclassify it as derivative.** An entry that first records an event the writer witnessed long before is still an original record, and its information is primary: the gap can lower the quality of the recollection but does not change its class [S33]. What the writer only heard about is secondary information, however soon it was written down [S33].","sources":["S33","S34","S35"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-576121f42d3d","kind":"method","anchor":"3. **On leaves belonging to this Bible, separate the date of each event from the date it was written down.** Births from 1756 to 1848 appeared in one apparent hand in a Bible dated 1853 whose owners married in 1854 [S8]. Look for a source the writer could have copied [S7], [S9]. A separate document named an earlier Bible held by the husband's father. It established that another Bible existed, while the source of the copied births remained uncertain [S8].","sources":["S8","S7","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ec46cf580221","kind":"portal-availability","anchor":"**Look for the earlier register or a copy of it.** The DAR Genealogical Records Committee, founded in 1913, compiled reports that include Bible transcriptions [S22 @2026-11-19], [S36 @2026-11-19]. Search the DAR's every-name index and record the report, volume and page. The DAR describes microfilming of the pre-1972 volumes by the Genealogical Society of Utah [S37 @2026-11-19], [S38 @2026-11-19]. Search the FamilySearch Catalog by keyword for the surname and “Bible” [S39 @2026-11-19]. Check the Library of Virginia's Bible Records Digital Collection [S24 @2026-11-19], the North Carolina State Archives' Bible Records [S25 @2026-11-19], Georgia's DAR typescripts and Bible Records Microfilm Index [S26 @2026-11-19], [S40 @2026-11-19], and the South Caroliniana Library's Family Bible Records [S27 @2026-11-19]. Record whether the result is a name index, transcription, photographed page or original leaf. The Georgia microfilm index has no page images, while Virginia also holds original leaves [S40 @2026-11-19], [S24 @2026-11-19].","sources":["S22","S36","S37","S38","S39","S24","S25","S26","S40","S27"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ead9d6c806d6","kind":"method","anchor":"4. **A claimed owner who died before this copy was printed cannot have started its own register leaves.** One whose recorded events merely predate the printing may have acquired it later and copied them in; check the hands [S8].\n5. **Apply steps 3 and 4 only to leaves that belong to this book.** Leaves that do not belong to this book, such as a loose register page or one bound in from another Bible, and leaves whose origin is unresolved, take their own bound from their own paper, print and hands. The later book's printing date does not make their entries later copies, and it does not exclude a writer who died before that printing.\n6. **Keep each entry's apparent writing occasion apart from its event date.** Many hands make recording near the events more likely [S7]; they do not prove it.\n7. **A relative's attribution of a hand stays attributed.**\n8. **Distinguish the transcriber, sender and online poster from the holding branch.** A 2017 tree post reproduced a genealogical-society secretary's transcription forwarded by a third person. The Bible itself had descended through the eldest son's line [S10]. Follow the holding branch for images and compare each date with independent records. Even a signed attestation of accuracy accompanied a date contradicted by other evidence [S7].","sources":["S8","S7","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-aa9fb1801b24","kind":"portal-availability","anchor":"**For a gap in historical Connecticut public records, check the Connecticut State Library's Bible and Family Records.** Search the statewide slip index by family name, then follow each relevant hit to the cited volume and page of the transcription [S42 @2026-11-20]. Search the index at the back of volume 27 separately. The statewide slip index covers volumes 1–26 [S42 @2026-11-20].","sources":["S42"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5aaaa8d4412d","kind":"method","anchor":"9. **Check Bible birth dates against church baptisms for the same family.** Start with the eldest child if the entries appear to have been reconstructed together, given the errors in eldest children's dates reported in [S41†]. Compare any separately stated birth date in the baptism register with the Bible date. If the register gives only the baptism date, use it as the latest possible birth date [S43]. In the Potter case, a baptism dated thirteen months after the Bible's stated birth date still left the birth year unresolved [S43]. If the evidence supports a correction, give the Bible date exactly as written beside the supported date and cite the evidence for the change.","sources":["S41","S43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a56b9b1245ad","kind":"method","anchor":"**Ask a specialist in the claimed period's script to examine the printing and handwriting on a Bible entry that carries a disputed pedigree link.** Compare the leaf and the entry with dated examples from the claimed period, following the test suggested by the case reported in [S44†]. Check for a later copy before calling an anachronistic entry a forgery. An 1823 copy of *Essays on Petrarch* bears a forged Byron inscription [S45]. Keep the pedigree link unresolved until independent evidence supports it.","sources":["S44","S45"],"checked":null,"stated_as":"observation","review":"reviewed"}
