  - {"id":"B13","kind":"unknown","urls":[],"published":null,"retrieved":null,"access":"unknown","rights":null,"basis":null,"entry_sha256":"67c480bcde6a8146b22c2de5da306ab46f5f155fa165b72c1f79be404323c87d","claims":[],"review":"pending"}
claims:
  - {"id":"C-7ec088b1dba6","kind":"unclassified","anchor":"1. **Keep a letter or card bound to its envelope under one item reference.** Note whether that pairing was received or reconstructed later. When a saved card was still in its original envelope, the presenter in [S1] read its postmark, its return address and the address it was mailed to.\n2. **Record the postmark, return address and delivery address separately from dates and places in the text** [S1].\n   - A postmark dates the mailing. It is the latest possible date for the writing and for any event the text reports as already past, but it does not date those events: a birth, death, visit or move reported inside a card needs its own date [S1].\n   - A return address is the sender's stated address at that time and a lead to where that branch of the family lived. It is not an emigrant's birthplace. In [S2], letters from relatives in Mexico to cousins in the United States are recommended because their return address can locate the family.\n3. **Record whether pages, signature or date are present.** An unsigned item's author stays unknown. Do not take it from the recipient's later spouse or from family assumption. In [S3], three pages of an unsigned 1910 love letter survived. The researcher identified the addressee, found her marriage later that year, and judged the husband to be in the right place at the right time to have written it. Months later the final page turned up folded in another file, and it was signed by a different man.\n4. **If a separated page turns up, link it to the same item reference.** Record where it was found and the textual continuity supporting reunion [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-78cb4671cb57","kind":"unclassified","anchor":"1. **Transcribe each entry with its page position.** Include struck-through text, arrows and added names, dates or addresses in visible order. Treat them as layers of the keeper's updates rather than one dated snapshot [S4], [S6]. A card list may be a single sheet kept with the holiday cards [S4].\n2. **Treat a replacement address or surname as an undated lead** to a move, a correction or a name change. In [S4], the keeper marked out an old address and wrote the new one beside it, and marked out a maiden-name entry and added a married name.\n3. **Do not read a cancellation as a move or a death.** A cancellation does not say whether the person moved, died or was dropped, nor when. In [S5], one keeper marked out both people who had moved and a person who had died.\n4. **Read a heading as the keeper's name for that person**, not necessarily the person's current surname. A speaker in [S6] kept a remarried relative's updated entry under the surname she had always called her by.\n5. **Keep a relative's explanation as an attributed account.** Do not assume who made the edits.\n6. **Treat listed people as associate leads, not established kin.** One presenter says you have to work out who is a friend and who is family [S4]. Another says people appear in the book because of some relationship, whether or not they are related [S5].","sources":["S4","S6","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eaabf922df10","kind":"unclassified","anchor":"1. **Record every dated page, not only the main title page** [S7], [S8]: the title page and its back, any copyright or plate notice, the New Testament title page, dated engravings or maps bound in, and the publisher's address in the imprint [S12], [S15]. A title-page or copyright date is only a \"not earlier than\" date: nothing on this book's own register leaves can have been written before it [S12], and this copy may have been printed years later. Publishers reprinted from the same title page and plates: one folio dated 1813 holds plates dated up to 1818, and a printing of 1822 has the same title page and plates. The Old and New Testament title pages often carry different dates [S13]. A publisher's changing street address can narrow an undated printing [S14]. Use the latest date these pages show as the earliest possible printing date of this copy. Then check whether the register leaves belong to this book. Register pages were sometimes removed from their Bibles and kept apart, and families copied an earlier generation's records into their own Bible [S16], [S17]. Record the leaves as part of this book, not part of it, or unresolved.\n2. **Record each entry separately:** stated event date, apparent hand, ink or medium, and position [S7], [S9]. The writing medium gives an earliest writing date. Ballpoint pens became widely available only in the mid-1940s: first marketed in Argentina in 1944 and sold in U.S. shops from 29 October 1945 [S18], [S19], [S20]. Felt-tip markers came into use in the 1940s and 1950s, and the fibre-tip pen dates from 1962 [S18], [S21]. Aniline dye inks, often violet or blue, came in after about 1860 [S18]. An entry written in a medium that did not exist when its event happened was written later. Iron-gall ink stayed in use into the early 20th century [S18], so in a 19th-century register it cannot separate near-event writing from a later copy. Judging a medium by eye is a lead, not proof.\n3. **On register leaves that belong to this book, entries for events before the printing were written later, from another record or from memory** [S7], [S8]. **A multi-generation run in one hand and ink points to batch copying: check for it, and decide each entry's writing occasion separately** [S9]. Copied entries point to an earlier register: look for it in other branches of the family, and record it as documented only when a document names it. In [S8], a Bible with an 1853 flyleaf date belonged to a couple married in 1854. One page carried births from 1756 to 1848 in what the presenter read as one hand. She later found a document naming an earlier family Bible held by the husband's father. Also search transcribed Bible-record collections: the DAR Genealogical Records Committee reports, typescripts compiled from 1913 on, indexed online and viewable at the DAR Library, with some volumes at the FamilySearch Library [S22], [S23]; state collections such as the Library of Virginia's Bible Records Digital Collection [S24], the State Archives of North Carolina's Bible Records [S25] and the Georgia Archives' DAR typescripts and Bible-records index [S26]; and the South Caroliniana Library's Family Bible Records, linked from the South Carolina State Library [S27]. On FamilySearch, search the catalog by keyword for the surname and the word \"Bible\", and use its wiki pages on Bible records for other collections [S28]. Most of these hold copies or transcriptions: record each under step 8, and note any original pages a collection holds [S24].\n4. **A claimed owner who died before this copy was printed cannot have started its own register leaves.** One whose recorded events merely predate the printing may have acquired it later and copied them in; check the hands [S8].\n5. **Apply steps 3 and 4 only to leaves that belong to this book.** Leaves that do not belong to this book, such as a loose register page or one bound in from another Bible, and leaves whose origin is unresolved, take their own bound from their own paper, print and hands. The later book's printing date does not make their entries later copies, and it does not exclude a writer who died before that printing.\n6. **Keep each entry's apparent writing occasion apart from its event date.** Many hands make recording near the events more likely [S7]; they do not prove it.\n7. **A relative's attribution of a hand stays attributed.**\n8. **Keep transcriptions and online copies separate, with transcriber, sender, poster and holding branch.** In [S7], a transcription signed as \"true and accurate\" still carried a date that other records contradicted. In [S10], an online-tree item posted in 2017 carried a Bible transcription made by a genealogical-society officer and sent to the poster by a third person. The Bible itself had come down through a different branch, the eldest son's line.","sources":["S7","S8","S12","S15","S13","S14","S16","S17","S9","S18","S19","S20","S21","S22","S23","S24","S25","S26","S27","S28","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b9177ea6947f","kind":"unclassified","anchor":"1. **Separate the work's first publication, this edition or copy, any later alteration, and a claimed acquisition or inheritance** [S11].\n2. **An inscription in another copy shows only that its edition existed by that date.** It does not date this copy, its acquisition or its owner.\n3. **The same cover design on several copies indicates a publisher's or trade binding.** It does not identify who rebound this copy, or show that it was rebound at all.\n4. **Keep the family's account and a seller's description apart from what this copy shows** [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c97e85bc39fe","kind":"unclassified","anchor":"In [S11], the family copy's title page carried no date, and the work was first published in 1858. A copy offered for sale with the same title page had a 1909 inscription. The author took it as support for a much later acquisition, \"perhaps 1909\". Photographs of other copies showed the same etched cover design. Under this recipe the 1909 inscription shows that the edition existed by 1909; it does not date the family's acquisition. The shared design points to a commercial cover; it does not say who rebound the family's copy.","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
