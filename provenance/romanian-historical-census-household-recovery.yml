claims:
  - {"id":"C-03","kind":"historical","anchor":"For 1930, use the historic village, commune and interwar county to look for a household schedule, then check which office holds the relevant volume. For 1941, look for the household return and any agricultural schedule separately. For 1948, look for the population, property and agricultural summaries. The archival study records a decision in 1974 to discard completed 1948 schedules and retain the summary lists [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"Classify a 1948 borderou as a summary and an extras from it as an extract. Record the exact heading, archive reference, census year and later date of the extract. Check which household or holding details are actually present before treating an omitted field as evidence [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"example","anchor":"According to the supplied excerpt from the community article, one archive response carries the heading *Extras din borderoul populației, proprietăților și exploatațiilor agricole* [S5†].","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-07","kind":"platform-ui","anchor":"Draft a request giving the census year and the locality under its census-date name. Specify the household or holding sought, distinguishing name variants from separate people. Confirm the current holder, the available record type and the terms of access before submitting [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"portal-availability","anchor":"Send a census copy request through the confirmed office’s official service once the permitted details and any evidence of eligibility are in place [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
