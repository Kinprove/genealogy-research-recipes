claims:
  - {"id":"C-000000000001","kind":"portal-availability","anchor":"Search MyHeritage for the household head in *Austria, Vienna, Jewish Emigrant Applications, 1938–1939*. Open the questionnaire images and compare the applicant’s birth details, occupation, Vienna address and prior residences with the household you are tracing. [S1 @2026-11-22] [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"custody","anchor":"If the online collection misses, use the Vienna Wiesenthal Institute’s on-site alphabetical and numerical IKG emigration card indexes and its May 1938–1940 questionnaire holdings. Keep that date range separate from the named online collection. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"method","anchor":"If a relative has no separate application, look for that person under a likely household head. Read each dependent’s relationship to the applicant, name, birth date and place, and occupation. Check separately for information about the applicant’s parents. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"Page through the questionnaire to its last scan. Check for appended letters, affidavits and other papers, then read stamps and handwritten additions alongside the form. Attribute each statement to the form’s respondent or to the dated attachment or annotation that supplies it. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000005","kind":"method","anchor":"Extract the names, historical addresses and stated relationships of relatives and friends abroad. Keep contacts and references separate from travelers and dependents. Use named contacts to prioritize destinations to search. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000006","kind":"method","anchor":"Record application date, proposed destination and stated travel date in separate fields. Use the proposal to target a departure record, passenger list or arrival record where available. Treat the proposed destination as an intention until a separate record documents travel. [S1] [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
