claims:
  - {"id":"C-03","kind":"custody","anchor":"In the Finnish National Archives, look in the Turku Cathedral Chapter’s incoming royal correspondence under `Kuninkaalliset kirjeet`. Search in volumes E I 8 or E I 9 when those volumes cover the date. Use the parties, locality and stated impediment to distinguish candidates. Track the decision date, sender, recipient, archival reference and the grounds actually given in the letter [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22] [S7 @2026-11-22].","sources":["S1","S2","S3","S4","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"If the letter abbreviates the relationship or gives only the outcome, look for the application and supporting evidence. Use Bonnie Clementsson’s study of Swedish royal marriage applications to identify proceedings in the Justitierevisionen and the papers the applicants supplied. Record the asserted kinship and test it against the parish records [S2] [S5].","sources":["S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"example","anchor":"A permission establishes authorization. The marriage register establishes whether, when and whom the applicant married. Search using both names and the locality, carry a late-year permission into the following year's register, and check the spouse in the wedding entry [S2] [S7]. One reported Vehmaa case gave a man permission to marry his cousin in 1766, yet the 1767 wedding entry named a different woman [S2].","sources":["S2","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"If a letter names a village and leaves the parish unstated, use the village and both parties as leads in HisKi and verify the wedding in the original register. If the birth of a child predates the wedding, search baptisms under both parents before the permission date and check the father's age in the communion book when the letter raises minority [S2] [S3] [S6].","sources":["S2","S3","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"For a permission after a soldier disappeared, search the same incoming correspondence. Extract any evidence recited in the letter, distinguishing captivity, reported desertion, date of last news and confirmed death. Check the actual parish wedding separately. A permission after capture or loss of contact leaves the first spouse's death unresolved. Use [Swedish military records](swedish-military-record-routing.md) for the independent service search [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
