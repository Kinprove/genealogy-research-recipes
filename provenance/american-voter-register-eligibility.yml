claims:
  - {"id":"C-california-suffrage","kind":"historical","anchor":"Identify the state, territory or county, register date and election type. Apply the suffrage date in that jurisdiction. California adopted women's suffrage in 1911. For a woman missing from a California statewide-election register compiled before that change, pursue another residence series [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-restrictions","kind":"historical","anchor":"For a Black woman missing after the Nineteenth Amendment, check for discriminatory registration practice and applicable literacy tests or poll taxes. When any eligible woman is missing, leave registration, ability to pay and personal choice open unless a record distinguishes them [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-puerto-rico","kind":"historical","anchor":"For Puerto Rico, apply the literacy requirement to women's eligibility under the 1929 law. Check the 1935 change removing that restriction before interpreting a register for those years [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-great-registers","kind":"custody","anchor":"For a California Great Register search, select the county and edition before using a name result. Compare the FamilySearch county clerk register collection with the California State Archives county holdings. Carry any recorded residence or birthplace into an independent directory or census search [S5 @2026-11-20] [S6 @2026-11-20].","sources":["S5","S6"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-colonial-poll","kind":"historical","anchor":"For a colonial poll list, check the colony's rules for that election, including property, age, sex and religious qualifications. Virginia's 1699 burgess law, for example, restricted the poll to local freeholders, excluded women, people under 21 and convicted recusants, and made provision for Quakers to affirm [S7] [S8].","sources":["S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-registration-required","kind":"historical","anchor":"Check whether the jurisdiction required a separate registration list that year and for that election. North Dakota repealed its requirement in 1951. Under the prior law, cities over 1,000 prepared lists for general elections, and an eligible voter omitted from the list could vote by affidavit. Where the election required no registration, look for a poll list or another dated residence record [S7] [S9].","sources":["S7","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-registration-rules","kind":"method","anchor":"Check the registration rule in force at the time for citizenship, the length and place of residence, court determinations of capacity, disqualifying convictions and restoration of rights. If registration failed, check what the application required to establish name, date of birth and residence [S7] [S10] [S18].","sources":["S7","S10","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-voting-age","kind":"historical","anchor":"Compare the person's age on the relevant date with the threshold for that election. For elections before 1 July 1971, check the rule in force in that jurisdiction and election. From that date the Twenty-Sixth Amendment bars federal or state denial of the vote on age grounds to citizens 18 or older [S7] [S11].","sources":["S7","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-property-and-tax","kind":"historical","anchor":"For early state elections, check property and taxpaying qualifications separately and consult the corresponding land or tax roll. Under Pennsylvania's 1838 constitution, the tax payment rule included a separate exception for otherwise qualified men between 21 and 22 [S7] [S12].","sources":["S7","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-new-jersey-early-franchise","kind":"historical","anchor":"Search early New Jersey poll lists for property-qualified unmarried or widowed women and free Black residents. Check the eligibility language of the 1776 constitution, the counties covered by the 1790 law and the statewide extension in 1797. Account for the November 1807 exclusion of women and people of color when a name disappears from later lists [S7] [S13] [S14].","sources":["S7","S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-wyoming-territorial-suffrage","kind":"historical","anchor":"In Wyoming Territory, start a search for a woman with elections after the December 1869 law if she was a territorial resident aged 21 or older [S7] [S25].","sources":["S7","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-school-election-registers","kind":"custody","anchor":"Where women's eligibility was limited by election type, search that election's registration series. For Boston, use the 1884–1920 Women Voter Registers for school committee elections under the 1879 Massachusetts law. Select by ward and date in the finding aid, checking its separate native and naturalized series and its combined series [S7 @2026-11-22] [S26 @2026-11-22].","sources":["S7","S26"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-post-reconstruction-barriers","kind":"historical","anchor":"For Black voters missing from Southern rolls after ratification of the Fifteenth Amendment in 1870, check the jurisdiction's poll tax, literacy requirements and discriminatory enforcement. Account for local intimidation or violence when assessing whether eligible residents could register or vote [S7] [S11] [S17].","sources":["S7","S11","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ceded-territory-citizenship","kind":"historical","anchor":"For a Mexican resident who remained in territory ceded in 1848, check the citizenship choice under the Treaty of Guadalupe Hidalgo and the voting requirements for the place and year. In early twentieth-century Texas, check poll taxes and exclusion from white primaries when a Mexican American voter is missing [S7] [S15] [S16].","sources":["S7","S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-asian-naturalization-bars","kind":"historical","anchor":"For an immigrant missing where U.S. citizenship was required, establish how and when the person could have acquired citizenship. Check the Chinese naturalization bar under the 1882 law and its 1943 repeal, the restriction on Japanese immigrants upheld in Ozawa in 1922 and removed by the 1952 law, and the restriction applied to immigrants from India in Thind in 1923 before eligibility expanded in 1946. Determine the person's own citizenship basis before applying these naturalization rules [S7] [S19] [S20] [S21] [S22].","sources":["S7","S19","S20","S21","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-tribal-voting-eligibility","kind":"historical","anchor":"For an American Indian ancestor, establish citizenship for the year and check the state's rules and enforcement for residents of tribal lands. The 1924 Indian Citizenship Act granted citizenship to previously noncitizen American Indians born within U.S. territorial limits. Arizona still barred reservation residents under a guardianship rationale after that grant [S7] [S23] [S24].","sources":["S7","S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marital-expatriation","kind":"historical","anchor":"If a U.S. citizen woman married a noncitizen, check the marriage date, the spouse's citizenship and eligibility to naturalize, and her own naturalization or repatriation records before interpreting a voter-list omission. For marriages affected by the 1907 Expatriation Act, check whether and when citizenship returned. The 1922 Cable Act left some restrictions in place, and later repatriation could be recorded as an oath of allegiance. Use those records to establish citizenship at the date of any voter entry [S7] [S27].","sources":["S7","S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-alabama-reconstruction-books","kind":"portal-availability","anchor":"For an Alabama man who may have been formerly enslaved, search the 1867 Reconstruction books within MyHeritage's Alabama, Voter Registration Books, 1857–1868, and read the row for the date and recorded residence. Check the county and surviving volume against the Alabama Department of Archives and History's 1867 holdings, and apply the Reconstruction requirements for male citizens aged 21 or older who took the required oath before interpreting an omission [S28 @2026-11-22] [S29 @2026-11-22] [S30 @2026-11-22].","sources":["S28","S29","S30"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-north-carolina-application-index","kind":"portal-availability","anchor":"In MyHeritage's North Carolina, Voter Registration, 1900–1908, record the application date and place, birthplace, age when given, and any named relative and their residence. Check the card image for the application fields and the relative's role before using a machine-extracted entry as evidence of residence or kinship [S32 @2026-11-22] [S33 @2026-11-22].","sources":["S32","S33"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-north-carolina-exemption","kind":"historical","anchor":"For North Carolina's 1902 registration, apply the male franchise and minimum age of 21. The grandfather clause exempted a registrant with qualifying voting eligibility on or before 1 January 1867, or a qualifying lineal ancestor, from the literacy requirement if he registered before 1 December 1908. Check the poll tax separately [S7] [S18].","sources":["S7","S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-pigeon-township-fields","kind":"portal-availability","anchor":"For the FamilySearch North Carolina voter-register and certificate collection, verify county and series coverage for the year you need. In the illustrated Pigeon Township, Haywood County permanent register headed Chapter 550, Public Laws 1901, record any father or grandfather named for the voting qualification and the state in the adjacent column. Treat the relationship as the registrant's claim. Keep 1 January 1867 as the eligibility reference date and take the application date from the rightmost column on the person's row [S7 @2026-11-22] [S18 @2026-11-22] [S31 @2026-11-22].","sources":["S7","S18","S31"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-roll-annotations","kind":"method","anchor":"Transcribe marginal annotations and their dates separately from the original entry. Use “moved” to check the next precinct and “dead” as a lead to a death record. For “removed” or “denied,” look for a recorded reason before inferring a move, death, conviction or change in voting rights [S7] [S34].","sources":["S7","S34"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-precinct-residence","kind":"method","anchor":"For a deceased person, compare dated registrations across precincts, counties or states to bracket a possible move between census and directory entries. Compare the recorded residences and check whether a precinct designation or the applicable rule could explain a discrepancy [S7] [S18] [S35].","sources":["S7","S18","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-colonial-new-york-poll-lists","kind":"custody","anchor":"For the colonial elections for representatives of the city and county of New York, look up FamilySearch Library film 497705. Select the 1761, 1768 or 1769 poll list in the reprint by election year and use the entries as a record of votes cast [S7 @2026-11-23] [S36 @2026-11-23].","sources":["S7","S36"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-craven-permanent-registration","kind":"portal-availability","anchor":"For Craven County, open *Craven County Permanent Registration of Voters, 1902–1908* in North Carolina Digital Collections. Use the township and registration date to locate the entry. If the name search misses, check both Kellenberger Room transcriptions, one for 1902 and one for 1904–1908, for those locators [S7 @2026-11-23] [S37 @2026-11-23] [S38 @2026-11-23].","sources":["S7","S37","S38"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-precinct-register-inventory","kind":"custody","anchor":"If an online name search misses, check the county's election-record inventory for the year and historical precinct. For a deceased Harris County, Texas, voter, use the precinct ranges in the county archives' *Poll Tax and Voter Registration Records* inventory to select a volume and check whether it contains a registration list, a poll-tax list or exemptions [S7 @2026-11-23] [S39 @2026-11-23].","sources":["S7","S39"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-new-york-registration-birth-lead","kind":"method","anchor":"For a confirmed-deceased New York voter whose birth record is unavailable, check the original registration for a birth date and use any recorded date as a lead [S40] [S42]. For a name in New York City's printed 1924 list, use the borough, assembly district, election district and listed address to locate the underlying registration if it survives [S41]. Use a recorded age and the registration date to estimate the birth year. Seek the precise birthplace separately [S40] [S43].","sources":["S40","S42","S41","S43"],"checked":null,"stated_as":"fact","review":"reviewed"}
