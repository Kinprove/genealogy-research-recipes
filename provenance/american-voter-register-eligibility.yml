claims:
  - {"id":"C-california-suffrage","kind":"historical","anchor":"Identify the state, territory or county, register date and election type. Apply the suffrage date in that jurisdiction. California adopted women's suffrage in 1911. For a woman missing from a California statewide-election register compiled before that change, pursue another residence series [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-restrictions","kind":"historical","anchor":"For a Black woman missing after the Nineteenth Amendment, check for discriminatory registration practice and applicable literacy tests or poll taxes. When any eligible woman is missing, leave registration, ability to pay and personal choice open unless a record distinguishes them [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-puerto-rico","kind":"historical","anchor":"For Puerto Rico, apply the literacy requirement to women's eligibility under the 1929 law. Check the 1935 change removing that restriction before interpreting a register for those years [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-great-registers","kind":"custody","anchor":"For a California Great Register search, select the county and edition before using a name result. Compare the FamilySearch county clerk register collection with the California State Archives county holdings. Carry any recorded residence or birthplace into an independent directory or census search [S5 @2026-11-20] [S6 @2026-11-20].","sources":["S5","S6"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
