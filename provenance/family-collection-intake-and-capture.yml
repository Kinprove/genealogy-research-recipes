  - {"id":"S101","kind":"web-page","urls":["https://blog.myheritage.com/2025/06/myheritage-and-scancafe-partner-to-digitize-and-preserve-family-memories/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Opened and read 2026-11-22. The announcement documented how the original family site was selected, the album locator and the album exclusion control. The linked merchant page redirected to a different offering when checked. The recipe uses the announcement to locate an earlier delivery and points to current MyHeritage help for controls.","entry_sha256":"8419cb2b185818560da7bab6eb2fd696d4fd3dd626153f291f6044aa293b16df","claims":["C-locate-past-scancafe-delivery","C-check-scancafe-photo-visibility"],"review":"reviewed"}
  - {"id":"S102","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12851988-how-do-i-make-a-photo-album-private"],"published":"2026-07-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Opened and read 2026-11-22. Documents selecting the receiving site under My privacy, opening Content, unchecking an album and saving.","entry_sha256":"8df9a9acb11e7b4b5d55d5d06b48e058b9fd02a31eb4127f61373dab0d40578b","claims":["C-check-scancafe-photo-visibility"],"review":"reviewed"}
  - {"id":"S103","kind":"web-page","urls":["https://education.myheritage.com/article/managing-your-privacy-on-myheritage/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Opened and read 2026-11-22. Distinguishes each site’s access controls from the Content controls for making albums searchable and viewable by other users.","entry_sha256":"49a6ce71e0a2c043599d33cdc2754809929868c27a13e0547d0c01e6683039ab","claims":["C-check-scancafe-photo-visibility"],"review":"reviewed"}
  - {"id":"S104","kind":"web-page","urls":["https://familytreemagazine.com/general-genealogy/common-genealogy-questions-answered/"],"published":"2023-09-29","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Opened and read 2026-11-22. The article, updated March 27, 2026, suggests documenting the contents and locations of physical and digital materials and the owner’s wishes. The recipe uses that inventory as a local handover note and makes no claim about the legal effect of an estate document.","entry_sha256":"bda0a984e3d550d5e6b7215b15ad58d8005b5ebe88df0e603dd4fb2010b79a7b","claims":["C-collection-handover-wishes"],"review":"reviewed"}
  - {"id":"S105","kind":"video","urls":["https://www.youtube.com/watch?v=oWBn-KaRXlU"],"published":"2022-12-01","retrieved":"2026-11-22","access":"snippet-only","rights":null,"basis":"Supplied transcript excerpts reviewed 2026-11-22. The video could not be opened. Maureen Taylor’s separate segment suggests matching prints with all the negative frames, preserving existing strips in the scanner holder, and previewing positives to select frames for film scans. She uses blurry textured prints as a reason to try the negative. S106 and S107 supply matching and intact-strip support, and S93 documents the current phone controls.","entry_sha256":"0797152be86dfe301199b072b7a3961402e43938c62403d520fc724e952a1ddf","claims":["C-match-print-and-negative","C-keep-film-strips-together","C-film-preview-select-frames"],"review":"reviewed"}
  - {"id":"S106","kind":"web-page","urls":["https://blogs.loc.gov/picturethis/2021/01/ready-for-research-the-anthony-angel-collection/?locl=blogpic"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Opened and read 2026-11-22. Archivists describe matching different versions through envelope, strip and frame information, and making a guide that preserves contact-sheet position to retrieve the corresponding negative. The recipe applies this method to look for frames absent from the surviving prints.","entry_sha256":"23ed5e3061dc9e325822aac0495bfc2c9407a90802e4a47c8a708d4d78ca16e3","claims":["C-match-print-and-negative","C-keep-film-strips-together","C-film-preview-select-frames"],"review":"reviewed"}
  - {"id":"S107","kind":"help-page","urls":["https://files.support.epson.com/htmldocs/prv5o_/prv5o_00ug/set2_2.htm"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Opened and read 2026-11-22. The manufacturer illustrates using a matched holder for intact 35 mm film strips. Orientation and holder details depend on the scanner.","entry_sha256":"d63788c7e4f8caa18f0e0d7167d33d63176a0c07efad07b5eab36838482ec629","claims":["C-keep-film-strips-together"],"review":"reviewed"}
  - {"id":"S108","kind":"video","urls":["https://www.youtube.com/watch?v=dbIct51FF1c"],"published":"2024-03-19","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Supplied transcript excerpts reviewed 2026-11-23. The video did not open. The Storied segment suggests scanning the code for a printed story to read additional details and listen to its audio, if present. S109 documents the QR destination and supported media.","entry_sha256":"5e598a1e0178d881670d2b9aef0b8e8cf3a67a0f96353584514f5d06cd96f5ed","claims":["C-storiedbook-story-attachments"],"review":"reviewed"}
  - {"id":"S109","kind":"help-page","urls":["https://wp.storied.com/storiedbooks-help-center/about-storiedbooks/what-is-a-storiedbook/"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Opened and read 2026-11-23. Storied’s help page documents story-level QR links to the online version and identifies photos, audio clips and PDFs as possible additions. The attachment inventory is the recipe’s application of that guidance.","entry_sha256":"8181d6c2a0a2a8d2aa83c3f9ca276501d683965ffb8d7993d2a39f377df6334a","claims":["C-storiedbook-story-attachments"],"review":"reviewed"}
  - {"id":"S110","kind":"video","urls":["https://www.youtube.com/watch?v=ksjLI2xk16g"],"published":"2026-02-17","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Supplied transcript excerpts reviewed 2026-11-23. The video did not open. The VoiceGift segment suggests numbering photos to connect them with recordings and describes using USB to back up and copy the clips to companion devices. S111 documents the controls and both copy paths.","entry_sha256":"726b976a14f6a64ee0bef646380180aeb98ea54c3598db6e59015b74bfb274c9","claims":["C-voicegift-album-recording-number","C-voicegift-companion-device-handoff"],"review":"reviewed"}
  - {"id":"S111","kind":"help-page","urls":["https://voice.gift/pages/play"],"published":null,"retrieved":"2026-11-23","access":"read","rights":null,"basis":"Opened and read the manufacturer’s instructions and FAQ 2026-11-23. The FAQ documents checking for an occupied number, keypad recording and playback, and copying files from the USB-mounted drive to a computer folder or another Play device. The album cross-check is the recipe’s application of those controls.","entry_sha256":"829d25aac05fc7b649cdd6805f4f3f627283aedd586db9024955b940954ed94b","claims":["C-voicegift-album-recording-number","C-voicegift-usb-backup","C-voicegift-companion-device-handoff"],"review":"reviewed"}
claims:
  - {"id":"C-f4bd4fa32fa0","kind":"unclassified","anchor":"1. Work with the requested subset. Keep a record of where it sits in the larger collection, but do not expand the assignment.\n2. Before reorganizing, record what arrived, who supplied it, when and how it was received, and who holds the originals when known. Keep a short collection note alongside the files. Link the source email or the relative's note rather than silently paraphrasing it into established facts. An unknown creator, holder or date stays unknown [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-928734c29982","kind":"unclassified","anchor":"Give items stable references that connect their physical location and received grouping to their files. Preserve album and page order, and link individual captures to their parent page. Capture every page in sequence, blank pages included. If a folded item opens safely, capture it closed and opened, and link both views to the same page or item. Do not lift or remove adhered material to finish the sequence [S3].","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9450b038748d","kind":"unclassified","anchor":"Keep existing files and the received order while preparing the packet. Do not detach mounted items, dismantle albums or prescribe conservation treatment. When access would require intervention, record the affected surface as inaccessible and continue with the material that is safely available. An inaccessible reverse is not a blank reverse [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5587473706c3","kind":"unclassified","anchor":"For a small task, an item reference, source and location, the files with their roles, the original's dimensions and format when accessible or stated, and a gaps note are enough. Record the original's physical dimensions and format whenever the original is accessible or its holder states them: a digital file's pixel size does not reveal the original's size, and size and format help date a photograph. Never infer object size from a resized image, and never ask anyone to handle a fragile original merely to fill a field. Add album position or capture settings when they are relevant [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-91fb43ab6f90","kind":"unclassified","anchor":"Keep four kinds of statement distinguishable: a received caption, a relative's account, an observed object detail and an interpretation [S1], [S2], [S5].","sources":["S1","S2","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b367c99ef928","kind":"unclassified","anchor":"Inventory the media and their observed condition before proposing capture [S4]. Record the equipment actually available, the intended reuse and the settings chosen for each material, rather than one resolution or file format for everything. Match the method to the object:","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2db3be3beff0","kind":"unclassified","anchor":"- **Flat prints in sound condition** can go on a flatbed [S6], [S13]. Never put an old photograph through an automatic feeder [S6].\n- **Mounted prints, and prints that are curled, brittle, cracked or flaking,** go under a camera on a copy stand, with nothing pressing on them. Do not flatten them or roll them backwards [S13], [S16].\n- **Cased images** (daguerreotypes, ambrotypes and tintypes in cases) are photographed with a camera, not laid on a flatbed. Open a case gently if it opens freely, but do not force the hinge, take the image packet apart, or remove or clean the cover glass; that is work for a conservator [S13], [S14].\n- **Glass-plate negatives and glass lantern slides:** never press on the glass, and hold a plate by two opposite edges. A sound plate can go emulsion side down on a flatbed with a transparency unit, with nothing on top of it, or under a camera over a light source. A cracked, broken or flaking plate is not captured until a conservator has stabilized it [S13], [S14], [S15].\n- **Slides and negatives on film that is not nitrate and not deteriorating** need a scanner built for film and slides [S6].\n- **Film that may be cellulose nitrate** stays out of routine capture, on a flatbed and on a film scanner alike. Nitrate film was made from 1889 into the early 1950s, and acetate film overlapped it from the 1920s. Only Kodak published end dates. Amateur roll film was often unmarked, and a copy can carry its original's \"NITRATE\" edge printing. So, except for dated Kodak film, neither the film's date nor its edge marking settles whether it is nitrate [S17], [S18], [S19]. Nitrate is a fire risk: keep suspected nitrate apart from other material, record it, and leave its copying to a person or company trained to handle nitrate [S17], [S18].\n- **Film that smells of vinegar** (deteriorating acetate) is kept apart from other film, because film in good condition absorbs acid from it. The smell shows that the decay has already begun [S18], [S19].","sources":["S6","S13","S16","S14","S15","S17","S18","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ff807d883789","kind":"unclassified","anchor":"Handle each item with clean, dry hands or clean nitrile gloves, by its edges, without touching the image [S20]. Do not use rubber bands, paper clips, staples, sticky notes, tape or glue on photographs, and do not laminate them [S20], [S21]. Label the enclosure rather than the photograph. If a paper print must be marked, write lightly in soft pencil on the back near the edge, never on the front [S16], [S20]. A glossy resin-coated print does not take pencil: if one must be marked, use a waterproof, non-acidic archival pen instead [S16].","sources":["S20","S21","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dcc8abf67e72","kind":"unclassified","anchor":"If suitable capture is unavailable, leave an explicit next action. Do not mail originals; arrange copying where the original is, locally or at the holder's home [S6].","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b6dca9ecdc57","kind":"unclassified","anchor":"For loose photographs you can safely reach, capture front and reverse and bind both to one object reference. Copy inscriptions literally and keep them separate from your interpretation. Mark each side as missing (not present), uninspected (reachable but not yet examined) or inaccessible (reachable only by intervention). For an album whose items are stuck down, such as a magnetic album, capture the whole page rather than lifting items, and keep that full page beside any individual crop. Save the last item or page actually completed, and the views still remaining, so another session can resume [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eed246c1c28d","kind":"unclassified","anchor":"Keep the full initial capture or received file. Make crops, resized copies and edits as separate derivatives. If a supplied image is already enhanced or cropped, describe it as received; do not claim that an untouched master exists. Record the source and role of each file. A new format extension cannot recover detail that the input lacks [S2]. An authored display or scrapbook page is also a derivative. It does not replace the source photograph, and it does not establish who is depicted.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2955c40837f1","kind":"unclassified","anchor":"If an original has been restored, damaged or otherwise altered, ask whether photographs or scans exist from before that change, as well as after it. Record each copy as a separate version, with its date, its maker, and whether it was made before or after the change. Do not treat the current poor image as the document itself [S7].","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0b85d4624abe","kind":"unclassified","anchor":"Treat date, author, location or contact values embedded in a received scan as assertions by whoever digitized or later edited it [S8]. Record who set them, when known, and their basis, such as whether a date is an estimate, beside the original's inscriptions before using them as the photograph's creation date or maker.","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1f054119c6b0","kind":"unclassified","anchor":"If an oversized item is captured in portions, bind each part to the item and to the position it covers. Keep the parts beside any assembled working derivative. At the joins, inspect text, lines, color and retained edges for continuity or missing extent. Record any unresolved seam instead of calling the assembly complete or lossless [S9].","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9f3f3d06d85b","kind":"method","anchor":"If a known photo, document or recording is missing from the expected person's view, check its associations with the spouse and other close relatives first; a document missing from the expected profile may have been attached to the spouse’s profile [S10]. Then inspect a collection-wide media list if one is available, using the item's retained object details. Mark the item either as found under another association or as not located, and never record one as the other. An association does not establish the identity of the person depicted or recorded.","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-31c1df072ccd","kind":"unclassified","anchor":"Contact the receiving society or archive before handing anything over, and record what it actually agrees to take, including limits on scope. Expect duplicates of what it already holds to be refused. Material that nobody has accepted stays unresolved. A named recipient alone does not establish an arranged transfer or legal authority [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-638db36747b1","kind":"method","anchor":"In the United States, a signed deed of gift transfers ownership of the physical or digital items. Apart from a will, an inheritance or another transfer made by law itself, a transfer of copyright needs a signed writing, such as a clause in the deed; a donor who keeps the copyright can grant a separate licence instead. A donor can transfer only the rights the donor holds: a donor may have inherited the copyright in a relative's own letters, while the copyright in a studio portrait, or in letters other people wrote, may not be the family's to give [S22], [S23]. Record what the deed says about copyright: transferred, licensed or not addressed.","sources":["S22","S23"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ff0ef8bb47aa","kind":"unclassified","anchor":"Open a representative delivered item and its companion files from the location they were delivered to. Check that the item reference leads to its page or context, its accessible reverse and its source note. Check that captions and other required metadata survived the actual export. Where the software allows it, also embed dates, sources, captions, places and people in each file's own metadata so they travel with the image [S12]. When an application drops those fields, preserve them in an accompanying register or plain-text sidecar file and record the gap [S1]. A passed check covers only the item you opened.","sources":["S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fb39e3577d78","kind":"method","anchor":"**Flatbed settings for a print's master.** Capture the print as it is. Turn off the scanning software's automatic correction and sharpening, and leave a margin around the print rather than cropping to its edge; straighten, crop and retouch only a derivative [S24], [S25], [S26]. Save the master as TIFF, not JPEG, which holds only 8 bits per channel; keep JPEG for working and sharing copies [S25], [S26]. Set resolution by print size, so that a smaller print gets more: 300 ppi for 8×10 inches or larger, 600 ppi for about 6×4 inches, and 1200 ppi for 2×3 inches or smaller [S25]. Scan a black-and-white print that may need restoration in full colour at 16 bits per channel [S24], [S25]. The Library of Congress's 2014 basics select grayscale for black-and-white photos [S26]; use grayscale only where no restoration is planned.","sources":["S24","S25","S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bound-volume-capture","kind":"method","anchor":"**Bound volumes** (a family Bible, diary, ledger, scrapbook or bound album) are captured open only as far as the binding opens without force. Never flatten one for capture, whether face down on a flatbed or under a lid or glass: that pressure can break the spine or loosen brittle pages [S27], [S28]. Rest a volume with weak joints or a restricted opening in a book cradle of polyethylene foam blocks or rolls, under capture equipment that adjusts to its height [S28]. The Library of Congress lists a binding that opens less than 90 degrees as a condition problem [S28]: capture what that opening shows and record the hidden gutter as inaccessible.","sources":["S27","S28"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-paper-handling-bare-hands","kind":"method","anchor":"Gloves are for photographs and film, not for paper. Handle letters, documents and bound volumes with clean bare hands, washed and dried before you start [S28], [S29]. The Library of Congress names photographs, film, metal and ivory as the materials that need gloves; on paper, gloves dull touch and make handling clumsier, and for rare books they are generally not recommended [S29], [S30]. Wear clean gloves for a volume that contains photographs or has metal or ivory decoration, and impermeable gloves whenever mould is suspected [S29], [S30].","sources":["S28","S29","S30"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b8a871fbf742","kind":"method","anchor":"For an undated newspaper clipping, capture the reverse even when its text concerns another person or event. Use reverse-side headlines and advertisements to search for candidate issues. Log that as a lead, search for the complete issue and test the date against independent records; an event mentioned on the reverse is not automatically the clipping's publication date [S31](https://genealogytipoftheday.com/index.php/2022/09/20/flipping-over-clippings-in-books/), [S32](https://threadingneedlesinahaystack.blogspot.com/2008/02/genealogical-mystery-when-did-john.html).","sources":["S31","S32"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5d3cdb2bdbb5","kind":"method","anchor":"When a sharing copy needs an identification that remains visible without a metadata viewer, create a separate derivative with a caption strip outside the original picture area. Include the stable item reference and the attributed identification, with uncertainty visible. Retain the unaltered master and metadata/sidecar; label the captioned copy as a derivative and check the copy actually delivered. Visible annotation supplements the provenance record rather than replacing it [S33](https://genealogytipoftheday.com/index.php/2025/09/28/thoughts-on-the-stuff-i-have-in-my-totes/), [S34](https://rideau-info.com/photos/genealogy-captioning.html).","sources":["S33","S34"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-collection-paper-replaceability","kind":"method","anchor":"If the user asks which papers to keep, check for an accessible library copy or digital equivalent before marking a book or record copy as replaceable, according to the podcast's discussion with Lisa Alzo [S50†], [S53], [S54]. Give priority to handwritten notes and family narratives [S55]. Inspect books and record copies for family annotations or loose notes before recommending disposal. Keep that material with its source.","sources":["S50","S53","S54","S55"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-myheritage-album-working-crops","kind":"platform-ui","anchor":"Capture each whole page locally and keep that full capture as the master. If the user chooses batch scanning in MyHeritage, use the multi-photo scanner in Reimagine to make individual working crops from safely accessible album pages [S45 @2026-11-18], [S46 @2026-11-18]. The MyHeritage mobile app's Photo Scanner can also detect and save pictures separately [S47 @2026-11-18]. A Reimagine upload to an existing family-site album follows that album's visibility settings [S48 @2026-11-18]. Check the returned crops against the master for missed photos or cut-off edges. Retain the page reference with each crop.","sources":["S45","S46","S47","S48"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-loose-newsprint-separation","kind":"method","anchor":"According to Andrew Koch's preservation advice [S35†] and the U.S. National Archives [S36], house loose acidic newsprint apart from letters, photographs and other papers. Record where each clipping was found before moving it. Leave adhered clippings in place.","sources":["S35","S36"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-newsprint-paper-copy","kind":"method","anchor":"When the newsprint itself need not be retained, use a paper copy. According to the podcast, the library practice is to photocopy the newsprint onto acid-free paper or scan it and print the scan on that paper [S37†]. Use acid-free archival bond paper [S38], [S39]. Keep the original when the physical item matters or the copy loses detail [S39].","sources":["S37","S38","S39"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-found-album-dedication","kind":"method","anchor":"When preparing to return a found album, record the named recipient, giver, place and date from the dedication under the album's reference. Start with the named recipient in historical records [S40]. Use the dedication as a lead to the album's history and keep the identities of individual sitters unresolved until supported [S41].","sources":["S40","S41"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-found-album-sibling-branch","kind":"method","anchor":"If historical records show that the album recipient's direct line ended, trace a sibling's branch for a possible family handover [S40]. A documented relationship identifies a candidate for the handover. Keep the question of authority open and follow the [Living people rule](../SKILL.md#living-people) when the trail reaches anyone who may still be living.","sources":["S40"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-specialist-repository-fit","kind":"method","anchor":"When no family recipient is available, shortlist specialist repositories by the ethnic community or place of settlement documented in the collection, according to the podcast's discussion with Lisa Alzo [S50†], [S53]. Compare the collection's places, community and formats with each institution's published collecting criteria before approaching it [S51], [S52].","sources":["S50","S53","S51","S52"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-found-photograph-two-sides","kind":"example","anchor":"For a found photograph with a name on the back, use the inscription to look for a matching family in historical records. For a flea-market find, preserve both sides together so the written name can be compared with the family found in records [S42].","sources":["S42"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-familysearch-front-and-reverse","kind":"platform-ui","anchor":"For an authorized FamilySearch hand-off, upload a two-page PDF with the front and reverse in one Memory [S43 @2026-11-18]. Link the Memory as a source only to a corroborated profile for a deceased person, and give the basis for the link [S49 @2026-11-18]. Check the Memory's visibility and omit living-person details from the source title and notes. Other tree users can see source information even when the Memory is private [S44 @2026-11-18].","sources":["S43","S49","S44"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-loose-paper-capture-equipment","kind":"method","anchor":"**Loose paper.** Capture fragile or valuable originals one sheet at a time. Use a flatbed only when the sheet can rest safely and completely on the glass. Use an overhead camera when flatbed capture would require pressure or leave part of the sheet unsupported [S56], [S39]. Reserve automatic feeding for expendable, sturdy, unfastened sheets of similar size and paper stock. If both sides contain information, use a feeder that captures both sides or capture the sides individually. Check that both sides appear in the resulting files [S39].","sources":["S56","S39"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-reimagine-facing-page-trial","kind":"platform-ui","anchor":"Once that upload gate is cleared, try capturing one facing-page spread in a single shot in the user's Reimagine app if the album opens freely and both pages fit in frame [S65 @2026-11-20], [S66 @2026-11-20]. Compare the crops from both pages with their local masters. Switch to one page at a time if the spread requires pressure on the binding or the trial misses or clips a print.","sources":["S65","S66"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-photo-metadata-list","kind":"platform-ui","anchor":"For photos already on the MyHeritage website, check the user's Photos page for List view. Review thumbnails beside titles, existing tags, dates and places [S62 @2026-11-20], [S63 @2026-11-20], [S64 @2026-11-20]. Once the gate is cleared, enter supported titles, dates or places inline if the account offers those fields [S63 @2026-11-20]. Keep each value's basis and any unresolved details in the local item register. Treat existing tags as leads for locating the file.","sources":["S62","S63","S64"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-local-multipage-pdf","kind":"method","anchor":"When preparing a multipage item for a tree or hand-off packet, assemble one working PDF locally and retain the individual master captures. Lead with a labelled, researcher-written description giving the item reference and source citation [S57]. Keep a Bible's register together with captures of its safely accessible inserts, and record where each insert was found [S58]. For a postcard, include both the front and reverse after the description [S59]. Open the assembled copy and check page order and legibility.","sources":["S57","S58","S59"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-finder-local-pdf-assembly","kind":"platform-ui","anchor":"On a Mac, Command-click the files in the required page order in Finder, then Control-click the selection and choose **Quick Actions > Create PDF** when offered [S60 @2026-11-20], [S61 @2026-11-20]. Look for a new name based on the first selected file and open the result to confirm the order before using it.","sources":["S60","S61"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-artifcts-object-capture","kind":"platform-ui","anchor":"If the user chooses Artifcts, create an entry for each documented object with the app's plus button and add its photo. Put the stable item reference and a short, attributed caption in the description. Where a narration adds context, attach the approved audio or video under the same reference [S76 @2026-11-21], [S77 @2026-11-21], [S78 @2026-11-21].","sources":["S76","S77","S78"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-artifcts-documentation","kind":"platform-ui","anchor":"For an Artifcts entry that needs supporting records, open Full Details to record the maker and acquisition details with their basis. Keep exact storage locations and valuations in the local register and attach only the supporting documents cleared for Artifcts [S76 @2026-11-21], [S77 @2026-11-21], [S78 @2026-11-21]. Check the documentation permission separately before sharing the entry [S79 @2026-11-21].","sources":["S76","S77","S78","S79"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-artifcts-share-private","kind":"platform-ui","anchor":"With the user's authorization, share the private Artifcts entry directly with each named relative by their known email or Artifcts screen name [S76 @2026-11-21], [S79 @2026-11-21]. Use a route allowed by the Living people rule to invite their account of the object. Keep each reply as a separate attributed account in the local register.","sources":["S76","S79"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-phone-album-capture","kind":"method","anchor":"When a print is stuck to an album page and a phone is the available camera, photograph it in place. Keep the phone parallel to the page and check the edges in the preview. If a wide-angle view bends the edges or the phone casts a shadow, step back and use a longer optical setting if the phone offers one. Use even, diffuse daylight or daylight-balanced light and avoid mixing light sources. If the page still reflects light, move the light or tilt the supported album and realign the phone. Use any locally saved scan-mode crop or perspective correction only as a working copy and retain the full page [S67], [S68], [S69].","sources":["S67","S68","S69"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-reimagine-destination-site","kind":"platform-ui","anchor":"If the user manages more than one site, connect Reimagine to the intended MyHeritage family site using the user's existing account. Choose a dedicated family site if the scans need a separate collection. Verify the selected site and album audience in the user's account before capturing a batch [S81 @2026-11-21], [S83 @2026-11-21].","sources":["S81","S83"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-reimagine-batch-controls","kind":"platform-ui","anchor":"After the upload gate is cleared, open Reimagine's **+ > Scan photos**. Use indirect light and hold the phone steady. Tap the capture button for each safely supported page or group of loose photos. Continue to the next page while earlier crops process, then open the thumbnail to inspect the results. Compare the processed count and crops with the photos visible in the local masters before closing the batch [S66 @2026-11-21], [S81 @2026-11-21], [S82 @2026-11-21].","sources":["S66","S81","S82"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-timestamped-scan-album","kind":"platform-ui","anchor":"In the MyHeritage mobile app, after the upload gate is cleared, use **Photos > Photo Scanner** or **Scan photos & albums** to batch capture. Retrieve the individual cropped and straightened working copies from the dedicated album in **Photos**, using the scan date and time to find it. Compare the crops with the local page master [S47 @2026-11-21], [S85 @2026-11-21], [S86 @2026-11-21].","sources":["S47","S85","S86"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scrapbook-printed-copies","kind":"method","anchor":"For a new scrapbook, mount prints made from the photo scans and print document copies on acid-free paper or as photographic prints. Keep the originals in their enclosures and record which source item each print came from [S74], [S75].","sources":["S74","S75"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mylio-watched-inbox","kind":"platform-ui","anchor":"For automatic desktop intake, save approved working scans into the Mylio InBox and keep the master files in their existing collection folders. Verify that a test scan appears in the library under its recorded item reference before routing the rest of the batch through the InBox [S67 @2026-11-21], [S70 @2026-11-21].","sources":["S67","S70"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mylio-phone-intake","kind":"platform-ui","anchor":"For automatic intake from an iPhone, grant Mylio Photos access to the iPhone photo library only if the existing library and future intake clear the gate [S67 @2026-11-21], [S71 @2026-11-21]. Check that a new test photo appears before relying on automatic intake. If the gate clears only the collection's scans, keep the camera roll unlinked and use the InBox for those copies [S70 @2026-11-21].","sources":["S67","S71","S70"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-mylio-edited-export","kind":"platform-ui","anchor":"In Mylio Photos on the computer, choose **Share > Export** to write a new file with edits applied. Keep the original scan and its XMP sidecar together. Save the derivative to a different local folder and open it there to verify the edits. Leave **Save Metadata to File** unused on the master [S67 @2026-11-21], [S72 @2026-11-21], [S73 @2026-11-21].","sources":["S67","S72","S73"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-reimagine-tag-location","kind":"platform-ui","anchor":"For a Reimagine scan, add a supported person tag manually on the linked MyHeritage family site, using the website or MyHeritage mobile app. Keep the basis in the local item register and record a person's recognition there only as their attributed claim. Leave suggested identities unassigned until corroborated [S81 @2026-11-21], [S84 @2026-11-21].","sources":["S81","S84"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-reimagine-filter-hidden-tags","kind":"platform-ui","anchor":"Use Reimagine's magnifying-glass filter to search for a name already tagged on the linked site, or choose a recorded place. If a photo shows no tags in Reimagine, open the same photo on the linked MyHeritage family site and inspect its tags there before recording a gap [S81 @2026-11-21], [S84 @2026-11-21].","sources":["S81","S84"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-reimagine-save-photo-details","kind":"platform-ui","anchor":"For a photo already in Reimagine, once the photo-details upload gate is cleared for the linked site, save a supported title, date or place through **Edit photo info** in the three-dot menu or the fields below the photo. Tap the check mark and reopen the photo to verify the saved value [S66 @2026-11-21], [S81 @2026-11-21].","sources":["S66","S81"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-artifcts-export-attachments","kind":"platform-ui","anchor":"For an existing Artifcts entry, choose **Download > ZIP** when the hand-off needs the attachments. Unpack it locally and check that the Excel inventory and the expected photographs, documents, audio and video are present and readable. An inventory spreadsheet by itself leaves the attached files out [S76 @2026-11-21], [S79 @2026-11-21].","sources":["S76","S79"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-artifcts-item-qr-handoff","kind":"platform-ui","anchor":"For an Artifcts-linked album, print the album's item QR code and put it on a loose slip with its stable reference. Test the slip with the recipient's approved access. A reader without permission can reach an access request for a private entry. Keep the local hand-off reference usable on its own [S76 @2026-11-21], [S77 @2026-11-21], [S79 @2026-11-21].","sources":["S76","S77","S79"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-artifcts-legacy-access","kind":"platform-ui","anchor":"In Artifcts, use **Account Settings > Security & Longevity** to name the primary Legacy Contact and a backup if the user has chosen one. Check what access the contacts will receive and how it is activated. Keep a checked local hand-off packet alongside the account arrangement [S76 @2026-11-21], [S80 @2026-11-21].","sources":["S76","S80"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-search-overlooked-containers","kind":"method","anchor":"When clearing a deceased relative’s belongings and an expected photograph or paper is missing, check the drawers, wallets, luggage and jewelry boxes in the collection. Record the container and where the item lay before moving it [S89].","sources":["S89"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-inherited-locket-hidden-inserts","kind":"method","anchor":"For a locket that opens freely, record the full visible contents and inspect their exposed edges for signs of an additional insert. Treat layers that require lifting a mounted image or dismantling the locket as inaccessible. A published locket case revealed more portraits beneath the one first visible [S90].","sources":["S90"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-inventory-digital-carriers","kind":"method","anchor":"Inventory digital carriers alongside the paper boxes before deciding what to migrate. Include optical discs, USB and hard drives, memory cards and floppy disks. Check for interview audio and home movies as well as photographs and papers. Mark carriers without a suitable reader as uninspected [S87], [S88].","sources":["S87","S88"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-match-print-and-negative","kind":"method","anchor":"Match safely readable negatives to prints and contact sheets by strip and frame. Record unmatched frames as additional candidates for capture and keep the envelope’s information with the strip reference [S106]. According to Maureen Taylor’s interview advice, a blurry or textured print is a reason to locate the matching negative and try a scan from that source [S105†].","sources":["S106","S105"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-keep-film-strips-together","kind":"method","anchor":"On a film-capable flatbed, use the holder for the film’s format and preserve the existing strip and frame order. Use a holder that fits the strip without cutting frames apart [S106], [S107]. According to Taylor’s interview advice, keep the frames attached during capture [S105†].","sources":["S106","S107","S105"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-adobe-document-working-pdf","kind":"platform-ui","anchor":"In Adobe Scan for iOS, choose **Document** for a loose multipage item, use **Keep scanning** for subsequent pages, check the crop margins and order, and choose **Save PDF**. Keep separate local master captures and check for missing seals, marginal notes and edges in the working PDF [S91 @2026-11-22], [S92 @2026-11-22].","sources":["S91","S92"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-adobe-book-spread","kind":"platform-ui","anchor":"For Adobe Scan’s **Book** mode, align the center divider with the gutter of the safely supported spread. Check both page edges and their order before saving the split pages to the working PDF. Capture individually if the spread will only fit under pressure [S91 @2026-11-22], [S92 @2026-11-22].","sources":["S91","S92"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-adobe-cleaned-paper-counterexample","kind":"method","anchor":"Check the original or a full local capture before drawing conclusions from paper tone or marks in a cleaned PDF. In Crume’s Adobe Scan test, **Document** mode turned a cream background white [S91], [S92].","sources":["S91","S92"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-photoscan-working-derivative","kind":"platform-ui","anchor":"For a glossy print that can lie flat safely, use Google PhotoScan’s glare removal for a working copy. Frame the entire print, take the initial shot, move the phone to each of the four alignment dots and check the cropped corners against the local master [S91 @2026-11-22], [S69 @2026-11-22].","sources":["S91","S69"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-photoscan-appearance-counterexample","kind":"method","anchor":"Check the original or a separate uncorrected capture before interpreting faint writing or tone. Crume’s PhotoScan tests produced overly light photo scans and softer detail than his comparison scans [S91].","sources":["S91"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-photomyne-review-and-recapture","kind":"platform-ui","anchor":"With a whole-page local master retained, try a Photomyne batch on a safely supported page or group of prints. Check each automatic crop. If a print is missing, check **Edit original scan shots** in the album menu for the full shot before rescanning. When a crop still obscures detail, try a separate capture that fills the frame. Check any automatic cloud backup in the user’s app before the trial [S91 @2026-11-22], [S93 @2026-11-22], [S94 @2026-11-22], [S95 @2026-11-22].","sources":["S91","S93","S94","S95"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-film-preview-select-frames","kind":"method","anchor":"According to Taylor’s interview advice, use phone positives as previews to select which negatives need full film scans [S105†]. Record the strip and frame reference with each selected preview [S106].","sources":["S105","S106"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-photomyne-negative-preview","kind":"platform-ui","anchor":"After the Photomyne gate is cleared, use **Negatives** mode on sound film that has already cleared the handling checks. Backlight the frame for a positive preview and keep it as a working copy [S93 @2026-11-22], [S95 @2026-11-22].","sources":["S93","S95"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-onedrive-account-destination","kind":"platform-ui","anchor":"If a OneDrive copy is wanted and approved, use **+ > Scan photo** in the OneDrive mobile app and select the approved folder. This scan workflow saves to OneDrive. For a device-only capture, use the phone camera and a local folder outside sync [S96 @2026-11-22], [S100 @2026-11-22].","sources":["S96","S100"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-continue-original-batch","kind":"platform-ui","anchor":"To resume a MyHeritage mobile batch, verify the existing destination album in the app. Once the upload gate is cleared for that album, open it and tap **+ > Scan photos to this album** if offered. Follow the processed-photo count beside the thumbnail while capturing successive pages and compare it with the local masters before closing [S86 @2026-11-22].","sources":["S86"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-migrate-digital-files","kind":"method","anchor":"Copy selected files from readable drives or discs into a local intake folder, and use a cable for selected phone photos, audio and video when supported. Keep received filenames, relative paths and companion metadata with the copies. Use the highest-quality accessible version as the capture source and keep variants that carry distinct captions, crops or provenance [S87], [S88].","sources":["S87","S88"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-verify-separate-backup","kind":"method","anchor":"Keep an additional copy on separate storage and test it by opening an image, recording or document with its companion metadata. Record the backup location in the collection note. A preview in the importing app leaves the backup untested [S87], [S88].","sources":["S87","S88"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-messages-attachment-intake","kind":"platform-ui","anchor":"On iPhone, open the source Messages conversation, find the attachment and tap the Save Photo button beside the photo or stack. Confirm that the saved item opens in Photos. Keep the sender’s caption and message date separately under the same item reference [S96 @2026-11-22], [S97 @2026-11-22].","sources":["S96","S97"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-instagram-native-export","kind":"platform-ui","anchor":"Before taking family photos off Instagram, request Instagram’s own download through the account’s information settings. Open the relevant files locally and keep any captions delivered alongside them. Mylio removed direct Instagram import, so use the downloaded files as the intake source [S96 @2026-11-22], [S98 @2026-11-22], [S99 @2026-11-22].","sources":["S96","S98","S99"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-photo-list-open-detail","kind":"platform-ui","anchor":"In MyHeritage **Photos**, check for the List toggle beside upload. Click a thumbnail or use **View** on the row when the thumbnail omits detail. Keep the result list open while inspecting the individual photo page in the other tab [S63 @2026-11-22].","sources":["S63"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-photo-date-place-worklist","kind":"platform-ui","anchor":"Use **Year range** for a decade or custom period. Under **Places**, expand a recorded location to inspect its subdivisions. Choose **Missing dates** or **Missing places** to make a worklist for that field. Clear filters when starting a new search and use the upload gate above before entering established values inline [S63 @2026-11-22].","sources":["S63"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-photo-people-filter","kind":"platform-ui","anchor":"In **People**, select multiple names to find photos with any selected tag. Enable **Show photos of these people together** when every selected tag must be present. Combine person, year and place filters when the question needs all three. Use **Untagged photos** to find rows needing review. An empty result only describes the tags and filters on that site [S63 @2026-11-22].","sources":["S63"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-photo-list-sort-search","kind":"platform-ui","anchor":"Sort by date taken to review photo chronology and use the direction arrow to put the oldest first. Choose upload date to review batches, or title or place when those fields suit the search. Search with a title word or a tagged name and clear restrictive filters if the expected item is missing [S63 @2026-11-22].","sources":["S63"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-myheritage-untagged-photo-review","kind":"platform-ui","anchor":"For a photo on the untagged worklist, open **Tag people** on the row to inspect the individual photo page. After clearing the link gate, save a tag only when a documented identification supports it. Keep recognition attributed in the local register and leave evidence gaps open [S63 @2026-11-22].","sources":["S63"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-collection-handover-wishes","kind":"method","anchor":"For succession planning, prepare a local handover inventory with the contents, locations and owner’s wishes for the physical materials and digital files or accounts. Keep the intended disposition separate from the recipient’s actual acceptance and any legal authority. Keep credentials out of the inventory [S104].","sources":["S104"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-locate-past-scancafe-delivery","kind":"historical","anchor":"For a past ScanCafe transfer to MyHeritage, check the site that was open when the order was started through MyHeritage, since the transfer was routed to that site. Check **Photos > Albums** there for a name beginning with ScanCafe and the upload date. Correlate the contents with the order before marking the batch received [S101].","sources":["S101"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-check-scancafe-photo-visibility","kind":"platform-ui","anchor":"For a received ScanCafe album, check the receiving site under **My privacy > Content > Photos**. If the owner wants to exclude the album from MyHeritage search and Photo Discoveries, uncheck it and save. Check site access and the album’s actual audience separately [S101 @2026-11-22], [S102 @2026-11-22], [S103 @2026-11-22].","sources":["S101","S102","S103"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-storiedbook-story-attachments","kind":"platform-ui","anchor":"For a printed StoriedBook, scan the story’s QR code and open the matching online story [S109 @2026-11-23]. Check for details beyond the printed page and play any attached audio, according to the podcast’s Storied segment [S108† @2026-11-23], [S109 @2026-11-23]. Record the story locator and available attachments in the local inventory beside the printed page’s stable reference. If the link fails or access is denied, mark the online material as uninspected.","sources":["S109","S108"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-voicegift-album-recording-number","kind":"platform-ui","anchor":"For a VoiceGift Play companion to an album, keep the recording number in the item register beside the photo’s stable reference. Put any new label on a loose slip or enclosure. To add a recollection to VoiceGift Play, enter the chosen number in **PLAY** and press **PLAY/PAUSE** to check that the slot is empty. In **REC**, enter the empty slot’s number and press **PLAY/PAUSE** to start and again to stop [S111 @2026-11-23]. According to the podcast’s VoiceGift segment, use the same number in **PLAY** to retrieve the clip [S110† @2026-11-23]. Press **PLAY/PAUSE** and check the recording against the photo or album item before marking the pairing verified [S111 @2026-11-23].","sources":["S111","S110"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
  - {"id":"C-voicegift-usb-backup","kind":"platform-ui","anchor":"Connect the VoiceGift Play recorder to the user’s computer by USB and copy the recordings from the mounted drive to the local intake folder [S111 @2026-11-23]. Keep the received filenames and the album’s item-to-number register with the copy. Play the copied files against the numbered album items and log missing or mismatched clips before relying on the backup.","sources":["S111"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-voicegift-companion-device-handoff","kind":"platform-ui","anchor":"Copy only the cleared recordings to the recipient’s Play device [S111 @2026-11-23]. On that device, enter each copied clip number in **PLAY**, press **PLAY/PAUSE** and check the recording against the numbered item in the book [S111 @2026-11-23]. According to the podcast’s VoiceGift segment, hand over the companion device with the recipient’s copy of the book when sharing the recordings [S110† @2026-11-23].","sources":["S111","S110"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
