claims:
  - {"id":"C-f4bd4fa32fa0","kind":"unclassified","anchor":"1. Work with the requested subset. Keep a record of where it sits in the larger collection, but do not expand the assignment.\n2. Before reorganizing, record what arrived, who supplied it, when and how it was received, and who holds the originals when known. Keep a short collection note alongside the files. Link the source email or the relative's note rather than silently paraphrasing it into established facts. An unknown creator, holder or date stays unknown [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-928734c29982","kind":"unclassified","anchor":"Give items stable references that connect their physical location and received grouping to their files. Preserve album and page order, and link individual captures to their parent page. Capture every page in sequence, blank pages included. If a folded item opens safely, capture it closed and opened, and link both views to the same page or item. Do not lift or remove adhered material to finish the sequence [S3].","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9450b038748d","kind":"unclassified","anchor":"Keep existing files and the received order while preparing the packet. Do not detach mounted items, dismantle albums or prescribe conservation treatment. When access would require intervention, record the affected surface as inaccessible and continue with the material that is safely available. An inaccessible reverse is not a blank reverse [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5587473706c3","kind":"unclassified","anchor":"For a small task, an item reference, source and location, the files with their roles, the original's dimensions and format when accessible or stated, and a gaps note are enough. Record the original's physical dimensions and format whenever the original is accessible or its holder states them: a digital file's pixel size does not reveal the original's size, and size and format help date a photograph. Never infer object size from a resized image, and never ask anyone to handle a fragile original merely to fill a field. Add album position or capture settings when they are relevant [S2].","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-91fb43ab6f90","kind":"unclassified","anchor":"Keep four kinds of statement distinguishable: a received caption, a relative's account, an observed object detail and an interpretation [S1], [S2], [S5].","sources":["S1","S2","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b367c99ef928","kind":"unclassified","anchor":"Inventory the media and their observed condition before proposing capture [S4]. Record the equipment actually available, the intended reuse and the settings chosen for each material, rather than one resolution or file format for everything. Match the method to the object:","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2db3be3beff0","kind":"unclassified","anchor":"- **Flat prints in sound condition** can go on a flatbed [S6], [S13]. Never put an old photograph through an automatic feeder [S6].\n- **Mounted prints, and prints that are curled, brittle, cracked or flaking,** go under a camera on a copy stand, with nothing pressing on them. Do not flatten them or roll them backwards [S13], [S16].\n- **Cased images** (daguerreotypes, ambrotypes and tintypes in cases) are photographed with a camera, not laid on a flatbed. Open a case gently if it opens freely, but do not force the hinge, take the image packet apart, or remove or clean the cover glass; that is work for a conservator [S13], [S14].\n- **Glass-plate negatives and glass lantern slides:** never press on the glass, and hold a plate by two opposite edges. A sound plate can go emulsion side down on a flatbed with a transparency unit, with nothing on top of it, or under a camera over a light source. A cracked, broken or flaking plate is not captured until a conservator has stabilized it [S13], [S14], [S15].\n- **Slides and negatives on film that is not nitrate and not deteriorating** need a scanner built for film and slides [S6].\n- **Film that may be cellulose nitrate** stays out of routine capture, on a flatbed and on a film scanner alike. Nitrate film was made from 1889 into the early 1950s, and acetate film overlapped it from the 1920s. Only Kodak published end dates. Amateur roll film was often unmarked, and a copy can carry its original's \"NITRATE\" edge printing. So, except for dated Kodak film, neither the film's date nor its edge marking settles whether it is nitrate [S17], [S18], [S19]. Nitrate is a fire risk: keep suspected nitrate apart from other material, record it, and leave its copying to a person or company trained to handle nitrate [S17], [S18].\n- **Film that smells of vinegar** (deteriorating acetate) is kept apart from other film, because film in good condition absorbs acid from it. The smell shows that the decay has already begun [S18], [S19].","sources":["S6","S13","S16","S14","S15","S17","S18","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ff807d883789","kind":"unclassified","anchor":"Handle each item with clean, dry hands or clean nitrile gloves, by its edges, without touching the image [S20]. Do not use rubber bands, paper clips, staples, sticky notes, tape or glue on photographs, and do not laminate them [S20], [S21]. Label the enclosure rather than the photograph. If a paper print must be marked, write lightly in soft pencil on the back near the edge, never on the front [S16], [S20]. A glossy resin-coated print does not take pencil: if one must be marked, use a waterproof, non-acidic archival pen instead [S16].","sources":["S20","S21","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dcc8abf67e72","kind":"unclassified","anchor":"If suitable capture is unavailable, leave an explicit next action. Do not mail originals; arrange copying where the original is, locally or at the holder's home [S6].","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b6dca9ecdc57","kind":"unclassified","anchor":"For loose photographs you can safely reach, capture front and reverse and bind both to one object reference. Copy inscriptions literally and keep them separate from your interpretation. Mark each side as missing (not present), uninspected (reachable but not yet examined) or inaccessible (reachable only by intervention). For an album whose items are stuck down, such as a magnetic album, capture the whole page rather than lifting items, and keep that full page beside any individual crop. Save the last item or page actually completed, and the views still remaining, so another session can resume [S3], [S4].","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eed246c1c28d","kind":"unclassified","anchor":"Keep the full initial capture or received file. Make crops, resized copies and edits as separate derivatives. If a supplied image is already enhanced or cropped, describe it as received; do not claim that an untouched master exists. Record the source and role of each file. A new format extension cannot recover detail that the input lacks [S2]. An authored display or scrapbook page is also a derivative. It does not replace the source photograph, and it does not establish who is depicted.","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2955c40837f1","kind":"unclassified","anchor":"If an original has been restored, damaged or otherwise altered, ask whether photographs or scans exist from before that change, as well as after it. Record each copy as a separate version, with its date, its maker, and whether it was made before or after the change. Do not treat the current poor image as the document itself [S7].","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0b85d4624abe","kind":"unclassified","anchor":"Treat date, author, location or contact values embedded in a received scan as assertions by whoever digitized or later edited it [S8]. Record who set them, when known, and their basis, such as whether a date is an estimate, beside the original's inscriptions before using them as the photograph's creation date or maker.","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1f054119c6b0","kind":"unclassified","anchor":"If an oversized item is captured in portions, bind each part to the item and to the position it covers. Keep the parts beside any assembled working derivative. At the joins, inspect text, lines, color and retained edges for continuity or missing extent. Record any unresolved seam instead of calling the assembly complete or lossless [S9].","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9f3f3d06d85b","kind":"unclassified","anchor":"If a known photo, document or recording is missing from the expected person's view, check its associations with the spouse and other close relatives first; one author found her misplaced items often attached to a spouse [S10]. Then inspect a collection-wide media list if one is available, using the item's retained object details. Mark the item either as found under another association or as not located, and never record one as the other. An association does not establish the identity of the person depicted or recorded.","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-31c1df072ccd","kind":"unclassified","anchor":"Contact the receiving society or archive before handing anything over, and record what it actually agrees to take, including limits on scope. Expect duplicates of what it already holds to be refused. Material that nobody has accepted stays unresolved. A named recipient alone does not establish an arranged transfer or legal authority [S11].","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-638db36747b1","kind":"method","anchor":"In the United States, a signed deed of gift transfers ownership of the physical or digital items. Apart from a will, an inheritance or another transfer made by law itself, a transfer of copyright needs a signed writing, such as a clause in the deed; a donor who keeps the copyright can grant a separate licence instead. A donor can transfer only the rights the donor holds: a donor may have inherited the copyright in a relative's own letters, while the copyright in a studio portrait, or in letters other people wrote, may not be the family's to give [S22], [S23]. Record what the deed says about copyright: transferred, licensed or not addressed.","sources":["S22","S23"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ff0ef8bb47aa","kind":"unclassified","anchor":"Open a representative delivered item and its companion files from the location they were delivered to. Check that the item reference leads to its page or context, its accessible reverse and its source note. Check that captions and other required metadata survived the actual export. Where the software allows it, also embed dates, sources, captions, places and people in each file's own metadata so they travel with the image [S12]. When an application drops those fields, preserve them in an accompanying register or plain-text sidecar file and record the gap [S1]. A passed check covers only the item you opened.","sources":["S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
