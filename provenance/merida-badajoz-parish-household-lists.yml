claims:
  - {"id":"C-find-lists","kind":"custody","anchor":"At the Archivos Eclesiásticos de Mérida-Badajoz, check the diocesan and parish fonds separately for censuses and *estadísticas de cumplimientos pascuales*. Use the parish and year to identify which list covers the household. The archive study points to diocesan Comp.19.A, caja 9, exp.54 for a worked example of the Easter series and to parish fonds for other examples [S1 @2026-11-22], [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ecclesiastical-census","kind":"method","anchor":"Start a row per named person. Record the date of the list, street or household grouping, relationship, recorded age band and occupation as the entry gives them. Assign an occupation to the person it qualifies. When only the parent’s occupation is entered, leave the other occupations unrecorded [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-age-bands","kind":"method","anchor":"Match the age bands to the series and period before estimating a birth window. The Mérida-Badajoz ecclesiastical census examples distinguish *párvulos* aged 1–7, *infante* aged 8–14 and *adultos* aged 15 or more [S1]. In the study of Alburquerque parish deaths for 1833–1855, *párvulo* runs from birth through age seven and *adulto* begins at eight [S3]. Carry the original label into the worksheet and use a baptism or birth act when the exact age matters.","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-easter","kind":"method","anchor":"For each named person in the Easter list, copy the age band, stated relationship and any explicit confession or Communion entry. Treat a missing person in an Easter observance list as an unresolved residence question. Check the list’s stated purpose, year and parish coverage before interpreting who appears there [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cross-check","kind":"method","anchor":"If someone drops out between two lists, compare the corresponding municipal padrón and parish burial book, especially during a period of high mortality. Start with the last dated appearance. Keep the loss of a person from the roster open until a named death, a move or other evidence accounts for it [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
