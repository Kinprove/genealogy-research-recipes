claims:
  - {"id":"C-08","kind":"historical","anchor":"Use the locality's province at the time of the inquiry to choose the district commission. For the reactivated commissions, use the territorial provision of the 1 September 1965 Temporary Regulations, AIPN GK 162/16, folios 12–13 [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-01","kind":"custody","anchor":"Start in the [IPN archival inventory for Białystok](https://inwentarz.ipn.gov.pl/archiwa-ipn/bialystok?language_content_entity=pl) for files produced by the Białystok district commission. For another locality, search for the pertinent commission under its Polish creator name, `Okręgowa Komisja Badania Zbrodni Hitlerowskich`, adding the commission city, village or county and `ankiety` or `kwestionariusze`. Include Polish terms for the event, such as `wywózki na roboty przymusowe` for deportations to forced labour and `egzekucje` for executions [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"Open the file description and read every locality and event heading. Search the village and county across commissions if the local creator's files have no match. IPN Wr 12/7, for instance, was compiled by the Wrocław commission and covers places outside its home province. Record the present branch, fond, reference and recorded date span. A description supplies a file lead and leaves the person's inclusion to be checked in the form [S3 @2026-11-22].","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Look for separate crime and forced-labour forms for the same village. For a Klepacze search, use Białystok as the creator lead, 10 June 1968 as the reported compilation date and search separately for the arrests and for forced labour in the Third Reich [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"On the crime form, copy the target person's name, father's given name, stated place and dated allegation where recorded. On a forced-labour list, preserve the maiden and married surnames as labelled and the father's given name. Keep the witness or informant, compiler and subject distinct. If the forced-labour form lacks witnesses, leave attribution open even when a companion crime form names them [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Transcribe the main text and each annotation separately. Record the note's location and retain all plausible referents when a marginal entry sits beside several names. Date an address worded in the present tense to the account that supplies it. Record arrest, escape and subsequent residence as separately dated observations [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Preserve inconsistent statements side by side. In the published transcription of the Klepacze crime form, one passage reports a shooting and also says the men's fate after arrest was unknown [S1]. Carry both statements into [evidence and proof judgment](evidence-proof-judgment.md).","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"Read `nie wróciła` as a report that the person did not return. A reported failure to return leaves later fate open. Use [Holocaust testimony and source interpretation](holocaust-testimony-source-interpretation.md) for correlating later evidence of survival or death [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
