claims:
  - {"id":"C-01","kind":"method","anchor":"Check the surviving communion-book years before reading a missing household as an absence. The Helsinki\nSwedish-Finnish parish’s early communion books resume in 1785 after the earlier runs ending in 1741. Use\n[Scandinavian parish-record recovery](scandinavian-parish-record-recovery.md) to follow the household to another\nparish when a record points there. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"historical","anchor":"For an earlier Lutheran event in a German-speaking Helsinki family, check the period parish. The separate\nGerman Lutheran congregation began in 1858. For a marriage or baptism before then, search the Helsinki\nSwedish-Finnish parish and any other parish supported by the residence and family records. Bound any negative\nHisKi search by the congregation, event type and indexed years. Check the surviving parish books directly\nwhen coverage is uncertain. [S4] [S5] [S6]","sources":["S4","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"For a household linked to the fortress, search the Helsinki and Viapori (Sveaborg) parish runs separately.\nRead a child’s artillery-parish baptism for the parent’s military title and company. Match the household and\ntest discrepancies in the child’s dates. In Kyläkoski’s example, the baptism of a boy born on 19 April 1780\nplaces the father as *hantlaakari* in von Post’s company, while the apparent Helsinki children’s-register entry gives\n1782. Keep the link tentative if the discrepancy remains. Follow a named Swedish-period unit through\n[Swedish military record routing](swedish-military-record-routing.md). [S7] [S8]","sources":["S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"example","anchor":"Prefer the occupation on the individual line when the page grouping suggests something different. In Helsinki’s\n1795–1805 communion book, p. 307, Kyläkoski finds a garden hand on the seamen’s page. Compare an\n“artilleryman’s widow” label with discharge and later civilian records before assigning the husband’s last\noccupation. The author reports a widow so described in the 1806 roll whose husband had left the artillery\nbefore his death (*Rippikirja* 1806–1819, p. 271), and the same label in a separate Helsinki death entry\non 5 March 1809. [S8]","sources":["S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"custody","anchor":"In Astia, choose the county accounts (*läänintilit*) through 1808. For later years start with the Uusimaa\nprovincial *henkikirjat*. In rolls arranged by district, block and lot, use the period parcel and check the\nvillas and islands section for places outside the city plan. Check every relevant volume for the year and look\nunder owners, tenants, children and servants. Carry the occupations and co-residents as written into the\ncomparison at the next property. [S10 @2026-11-22] [S11 @2026-11-22]","sources":["S10","S11"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Under an early “other residents” heading, compare the order of names across years. Treat recurring consecutive\nlines as a shared-building lead and test it against co-residents, a property or a church locator. Kyläkoski’s\nBurtz comparison uses KA 8448:14 (1789), KA 8452:7 (1790), KA 8463:7 (1793) and KA 8485:6 (1798). If a household\nhas a separate communion-book page, check whether it follows the related household in the annual roll. In the\n1801 example (KA 8503:7), the order supports the possibility that the parish used an extra page for the same\nbuilding, and the precise residence remains uncertain. [S2] [S11]","sources":["S2","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"example","anchor":"If the person has no entry of their own, inspect the lines for servants and other household members for an\nindirect reference by name or role. In Kyläkoski’s example a servant’s entry names the gardener at the plantation\nin 1853, before the gardener’s own 1877 entry. Use [tax-roll observation](tax-roll-observation-workflow.md) to log\nwhich years and categories you checked. [S12] [S11]","sources":["S12","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-08","kind":"custody","anchor":"For a deceased subject, use the City Archives’ *Poliisilaitoksen osoitetoimiston osoiterekisteri* guide. Search\nnearby phonetic spellings and check the spouse’s card. Transcribe the previous address, new address, reporting\ndate and any host name. For a potentially living subject, follow the [Living people rule](../SKILL.md#living-people)\nand stay with the historical materials supplied by the user. [S13 @2026-11-22]","sources":["S13"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"Compare the card with the same-year *henkikirja* at the exact property. Keep a card-only address as a separate\nobservation. Match a legible host surname to the recorded occupants and keep a match as a candidate household.\nIn the 1913 Fredriksberg villa 6 case, Kyläkoski reports a possible Kiriloff host match (U304:7216) while the\nresident named on the card is missing from that roll entry. If a host field is unreadable, check for a pasted\nclipping and record an obscured field as such, as in the spring 1914 Vaasankatu 6 example. [S13] [S14] [S11]","sources":["S13","S14","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"Where the Helsinki Swedish-Finnish parish keeps separate communion books for workers, choose by marital status\nat the date sought. Compare I Aa:10, married workers, 1827–1839, with I Aa:14, unmarried workers, 1827–1837.\nTranscribe the occupation from the individual’s line and record the dated communion marks and changes of title separately.\nKyläkoski’s Schoultz example uses the unmarried workers’ volume I Aa:16, 1844–1860, pp. 141 and 145, and\n*Rippikirjat I*, 1856–1869, p. 982, to track communion marks in 1851–1853 and 1861 and the change from sailor\nto sea captain. [S3] [S9]","sources":["S3","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"method","anchor":"If a daughter disappears from her mother’s entry, check the marriage date and search later household entries\nunder the married designation. In Kyläkoski’s Burtz example the daughter married in 1779, is absent on p. 20\nand appears as *fru maj Rosenqvist* in the book begun in 1795, p. 229. The earlier omission gives little\nsupport for a lasting family break. Check a couple’s communion entry for an out-of-town marriage date and place,\nthen search the marriage register there. In the same case, p. 435 points to Stockholm on 7 September 1799. [S2]","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-12","kind":"example","anchor":"Use the named workplace in the children’s register (*lastenkirja*) to locate the worker. Compare it with parental\ntitles and service status in the children’s dated baptisms and burials to bound the likely period of work.\nKyläkoski uses Helsinki’s 1789–1804 children’s register to place a gardener at the Schwartz plantation near\nthe west end of present-day Aleksanterinkatu. A burial on 8 September 1791 describes the father as having left\nthe army, while the baptism of a child born on 28 January 1793 calls him a master gardener. The author uses\nthese records to estimate at most a couple of years of plantation work in the 1790s. [S8]","sources":["S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-13","kind":"platform-ui","anchor":"Open Helsinki City Archives’ Sinetti catalogue and search for *kiinteistökortisto*. Choose the district and block,\nthen confirm the property from the lot number and street address at the top of the card. Copy the buyer’s name as\nwritten, occupation or title, and transaction date where shown. Use the buyer as an ownership candidate and test\nresidence in the annual poll-tax roll. [S16 @2026-11-22]","sources":["S16"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"custody","anchor":"For the Helsinki municipal rolls from 1844, find the dated *henkikirja* entry by district, block and lot. Read all the\nhouseholds at the property. List the recorded occupants who fit the surname and other clues, then compare their\ntitles and other details with the property-card buyer and the original address lead. [S11 @2026-11-22] [S16 @2026-11-22]","sources":["S11","S16"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"example","anchor":"In Kyläkoski’s memoir example, the card for Uudenmaankatu 7 records the 1861 buyer as G. A. Lindström, a town hall\ncaretaker. In the 1866 roll (U58b:1761) he appears as *Kommissions Handlanden* and is the only adult man of that\nsurname recorded at that address. Keep the candidate comparison bounded to the people listed at the property\nin the year checked. [S15]","sources":["S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-16","kind":"example","anchor":"When a newspaper names a building after a person, record owners, tenants and employees in separate fields. In\nKyläkoski’s Fjälldal example, the villa names in *Hbl* on 30 April 1878 and *HD* on 20 November 1878 differ.\nThe 1878 roll (U82:1913) lists Böckerman as owner, Tång as assistant and Andstén as tenant. Check the probate\ninventory for another property reference. The author found no property entry for Andstén in HRA 11488. [S17]","sources":["S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-17","kind":"example","anchor":"Re-read the property headings each year. In 1878, *Villan Fjelldal* appears separately from the workers’\nbarracks. In the 1886 comparison (U105:1121–1135), *Fjelldal* heads the barracks and *Lilla Fjelldal* has\nseparate sections owned by Tallgren and Böckerman, each with tenants. If a listed owner is absent from the\noccupants, keep the ownership attribution and find the owner’s own registration elsewhere in the roll. [S17]","sources":["S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-18","kind":"method","anchor":"If a directory lists a bankrupt estate under only one part of a property, check the auction notice for other\ninterests. Compare the 1890 and 1891 Fjälldal address calendars with the notice in *Finland*, 1 October 1891,\nwhich Kyläkoski reports as offering one quarter of the large villa and one half of the two-storey villa nearer\nthe city. Record each fraction as offered at auction and check a sale or conveyance before assigning a new\nowner. Use [city-directory observation](city-directory-observation-workflow.md) for the listing date and\n[land index and book series](land-index-book-series-recovery.md) for the conveyance. [S17]","sources":["S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-19","kind":"method","anchor":"For the 1806 *Helsingfors stad* entry, use the Uusimaa and Häme county accounts, KA 8529. Kyläkoski reports\nthat the digitized original declarations follow the order of the names in the roll. Use that order to find\nthe likely declaration, then confirm the match by name, property or neighbouring entries. [S18] [S19]","sources":["S18","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-20","kind":"method","anchor":"If the roll omits given names, check the declaration before accepting or rejecting the identification (reported\nexamples at pp. 158 and 252). Compare the declarations for details omitted in the tabulated roll, such as rent\n(p. 151), household birth years (p. 158) or sons’ schooling (p. 178). Behind a luxury-tax line, check who smoked\nor used silk and whether the declaration describes the taxable item, such as a dog’s size and colour (p. 237). [S18]","sources":["S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-21","kind":"method","anchor":"Find both properties in the successive rolls. Read the date written at the end of each volume and log it as the\nclosing date. Kyläkoski suggests late spring as a rough estimate when a volume closed in summer. Keep that estimate\nprovisional when the reporting day is unknown. Search the contemporary press for that year’s *henkikirjoitus*\nnotice and find the assigned reporting day for the block or outlying locality. Log the publication date, local\nreporting day, any stated reference day and the volume’s closing date separately. [S20] [S21]","sources":["S20","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-22","kind":"method","anchor":"Use the latest dated evidence at the old address and the earliest dated evidence at the new one. An earlier\nreturn can also supply a lower bound if its coverage and contents establish that the household had yet to arrive.\nWhen a late or missing entry leaves that uncertain, check a dated directory, notice or advertisement and keep the\ninterval as broad as the evidence requires. Use [newspaper section search](historical-newspaper-section-search.md)\nfor dated address evidence and [evidence and proof judgment](evidence-proof-judgment.md) to test a proposed\nabsence. [S20] [S21]","sources":["S20","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-23","kind":"example","anchor":"For Taipale, start with *Suomalainen Wirallinen Lehti* on 13 February 1897 and 15 February 1898. Kyläkoski uses\nthe local reporting dates, 6 April 1897 and 14 April 1898, and the corresponding household evidence to bound\narrival after the first date and by the second. These newspaper locators come from the cited study. Independent\nverification requires checking the notices and the matching returns. [S21]","sources":["S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-24","kind":"example","anchor":"Test a proposed customary moving day against the local deadline. Kyläkoski reports that the 1884 Helsinki volume\nclosed on 22 December, although reporting for central blocks began on 21 April. The household in her Makrilli\nexample had already left by that block’s 8 May reporting deadline, before the proposed 1 June moving day. The\nexample uses the deadlines as reported in the community study and comment. [S20] [S21]","sources":["S20","S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-25","kind":"method","anchor":"Check the incorporation date before taking a first city entry as the start of residence. Search the earlier\njurisdiction when the locality was outside the city. For Fredriksberg (Pasila), Kyläkoski reports a 1913 first\ncard entry a year after annexation and treats residence in Helsingin pitäjä in 1907–1912 as a possibility.\nUse [historical place-name resolution](historical-place-name-resolution.md) to track the period locality and\njurisdiction. [S13] [S14]","sources":["S13","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-26","kind":"method","anchor":"Keep temporary addresses separate from longer stays and use successive rolls to identify the years recorded at\nthe later address. Kyläkoski distinguishes a temporary entry at Pursimiehenkatu 25 from Kankurinkatu 4, listed\nin 1916–1918 (U340:3362, U355:3077 and U369:3130). After a gap, use the origin of the first recorded move as a\nlead back to the previous jurisdiction. In the same example, the card’s 1930 move to Pääskylänkatu 7 A 81\npoints back to Tapanila in Helsingin pitäjä after the 1919–1923 Punavuorenkatu 20 roll entries\n(U383:2001, U393:1975, U407:1527, U420:1394 and U432:1399). [S14]","sources":["S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
