  - {"id":"S56","kind":"catalogue","urls":["https://fgurgia.ru/object/2849271"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Inventory heading for hereditary grants, 1830–1890, read 2026-11-19","entry_sha256":"e8c0fbd5a7dbb665df1bf14e0dbcc28853383e87b9f9c263b6e07c2100336224","claims":["C-c7de09908183"],"review":"reviewed"}
