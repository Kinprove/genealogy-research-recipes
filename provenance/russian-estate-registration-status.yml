  - {"id":"S58","kind":"catalogue","urls":["https://fgurgia.ru/object/2849275"],"published":null,"retrieved":"2026-11-19","access":"read","rights":null,"basis":"Inventory heading for personal grants, 1833–1917, read 2026-11-19","entry_sha256":"7be0f71af894020207724b307a5c5f766d3e91f52d935c5dbc7b09e3c61e50a7","claims":["C-c7de09908183"],"review":"reviewed"}
