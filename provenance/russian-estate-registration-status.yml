claims:
  - {"id":"C-cacae3793d0f","kind":"unclassified","anchor":"- **Status:** мещанин, купец of a named guild, купецкий сын, личный or потомственный почетный гражданин, сельский обыватель, крестьянин, and so on.\n- **Registering society:** the town, or the works settlement or volost, that the status belongs to.\n- **Residence:** for example \"временно проживающий в г. Ирбите\", or \"проживающего в Невьянском заводе [town] … купецкого сына\". [S7], [S3]\n- **Occupation:** teacher, clerk, trader, and so on.","sources":["S7","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3c13bb8d2687","kind":"unclassified","anchor":"- **A town mark on мещанин or купец names the society of registration, not the birthplace or residence.** A мещанин of Irbit could live anywhere and was only registered there. Factory parishes record many \"[town] мещанин\" families living outside the town, including some marked \"временно проживающий\". [S8], [S3], [S7]\n- **Separate \"a merchant in Petersburg\" from \"a Petersburg merchant\".** Only the second names the merchant society whose fund you should search. [S2]\n- **\"X-ского завода\" names a settlement, not an employer.** A завод here is a populated place, of the kind later called a посёлок. [S4]\n- **\"Сельский обыватель\" and \"крестьянин\" are estate categories, not jobs.** Never record them as an occupation. Participants describe two ways the label was applied:\n  - factory мастеровые were moved into this category after 1861, when they were released from compulsory works labour, for example \"сельский обыватель Берёзовского завода\" [S5];\n  - from the late 19th century peasants in general were called сельские обыватели, and many town residents held peasant status (about a third in Yekaterinburg, by one participant's estimate) [S4].\n  A works-settlement address does not show that the family were works people. Follow a family into the works (заводские) records only when a record shows it among the former мастеровые; otherwise search the records of its documented registering community and estate category.\n- **\"Почетный гражданин\" is an estate, like мещанин or дворянин, not an honour from a particular town.** The estate existed from 1832 to 1917, and it was either personal (личный) or hereditary (потомственный). Always record which one. [S13], [S1]\n- **Formulary lists give birthplace and estate as separate facts.** For example, a man born in the city of Perm could be registered \"из крестьян [X] волости [Y] уезда\". Keep both fields, and search the registering community as well as the birthplace. [S12]","sources":["S8","S3","S7","S2","S4","S5","S13","S1","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0310d2a4b912","kind":"unclassified","anchor":"- **3rd guild.** The 3rd merchant guild was abolished in 1863. After that, a former 3rd-guild merchant either declared capital in the 2nd guild or became a мещанин, even if he went on trading. [S2], [S8] A \"3rd-guild merchant\" born in the 1880s is an anachronism. Look for 2nd-guild or мещанин registration instead, or move the claim to a parent's or grandparent's generation. [S2] People also moved between estates before 1863, so a record can show someone as мещанин who was earlier a 3rd-guild merchant. [S7]\n- **\"Почетный житель\" or a translated \"Honorary Citizen\" with a place.** \"Почетный житель\" of a town or shtetl was not a status. For a translated \"Honorary Citizen\", record the status and the locality in separate fields, get the original-language wording, and only then map it to потомственный or личный почетный гражданин and test both possibilities (§4). [S1]\n- **First guild.** When a 1st-guild merchant disappears from a city, look for a move or a transfer between merchant societies before you assume a death. A participant cited a 1914 transfer of a Jewish merchant from one town's 1st-guild society to another's. [S2] Do not assume that 1st-guild status gave an unconditional right to live anywhere. For Jewish merchants, the law of 16 March 1859 allowed registration in guilds outside the Pale only after a period of years in the 1st guild inside the Pale (Jewish Encyclopedia, \"Pale of Settlement\"). The right to stay outside became permanent only after 10 years of continuous 1st-guild membership. A merchant who left the guild before then had to return to the Pale. Moscow was the exception: a Jew could join the Moscow merchant guild only with the permission of the minister of finance and the governor-general of Moscow, and the right to live in Moscow ended on leaving the guild, whatever the years (same article). So check the guild years and the city as well as the guild.","sources":["S2","S8","S7","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f5cc3329c5f7","kind":"unclassified","anchor":"- **Service (formulary) records.** These record grants. The wording in participants' extracts includes \"пожалован в звание личного почетного гражданина\", \"утвержден в звании потомственного почетного гражданина\" and \"за выслугу 10 лет в гражданской службе утвержден в звании личного почетного гражданина\". They give the estate of origin separately, as \"из мещан\", \"из солдатских детей\", \"из заводских детей\" or \"сын личного почетного гражданина\". One extracted record runs: from soldiers' children; discharged from the military department in 1859; enrolled in the Perm мещане later that year; made a personal honorary citizen in 1871. Record each of these as its own dated status. [S9]\n- **Revision-list remarks.** These date entry into an estate and transfers out of it. Examples from the threads:\n  - \"в 1852 г. причислен из крепостных людей [province]\" (1858 revision, GAPK f. 111, op. 1, d. 1890, as cited);\n  - \"в 1849 г. записался в мещанское звание … из господских людей\" (cited from the 1850 revision, ГАШ f. И-605, op. 1, d. 8);\n  - \"выбыл в Екатеринбургское купечество в 1831-м году\" and \"перешел из Екатеринбургского купечества в 1843 году\";\n  - a father and son \"выбыли в Екатеринбургские мещане в 1818-м году\".\n  Record the year exactly as the remark gives it. [S7], [S11]\n- **Witness and godparent entries.** These bracket a transfer between societies. In one case a man appears in the 1858 revision list and marries in 1861 in his earlier settlement. He is then a witness in 1892 as an Alapaevsk мещанин, and his son appears the same way in 1901. Search the parishes where the family lived, and use the latest entry under the old registration and the earliest under the new one as the bracket. [S6] A godparent or witness role shows the event place, not residence: a merchant's son registered in one town can appear as a godparent in another city's parish without any residence wording. Fill the residence field only from residence wording or separate residence evidence. [S7]\n- **Later administrative lists.** These can supply the registration when nothing else does. A participant used a 1908 criminal-record list (Ведомость справок о судимости) giving \"мещанин г. Белебей\" to establish the registration and direct the next searches. [S2]","sources":["S9","S7","S11","S6","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-055caf69e34c","kind":"unclassified","anchor":"To reach the printed Ведомость справок о судимости when the year is unknown, search the Russian State Library catalogue (search.rsl.ru) for the annual alphabetical index of names (Алфавитный указатель имен и фамилий лиц, помещенных в Ведомости справок о судимости) for the right part (часть) and year. The catalogue lists such an index by part, for example 1886, ч. 2 (general courts), with a free online scan. [S14] Read the surname's entry number in the scan, then open that year's issues of the same part, which are split into numbered books (кн.). [S15] The index for a year can be printed the next year (the 1886 index appeared in 1887), so do not cite the publication year as the conviction year. [S14] The entry number is not a page or book number. An empty catalogue or OCR search is not a negative for the scan.","sources":["S14","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e5cb66c7f09f","kind":"unclassified","anchor":"The 10th revision (1857–1859) was the last; later revision-list files also survive. [S16] Town lists of that revision are usually dated 1858 and are called the 1858 revision below. Compare the acquisition date or bracket with that revision before you send anyone to a revision list. [S10] For an Orenburg Cossack household after 1834, check the holding archive's inventory for which revisions exist; see [revision-list household chaining, step 10](russian-revision-list-household-chaining.md#10-for-an-orenburg-cossack-household-confirm-which-later-revisions-exist).","sources":["S16","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5265ff3bbedb","kind":"unclassified","anchor":"**Honorary citizens, whatever the acquisition date.** Go first to the honorary-citizen grant files and formulary lists under the post-1858 branch below; RGIA f. 1343, op. 39 starts in 1830. Do not let the revision cutoff decide their series. [S1], [S9]","sources":["S1","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5430ab8f1e00","kind":"unclassified","anchor":"- Use the registering society's revision lists. A participant reported that the Irbit 1858 мещане list groups registered families wherever they lived but does not state residence, so expect household composition and no address from such a list. [S8] Copy any residence remark a revision entry does give, such as a daughter who \"имеет жительство у отца своего\" (1816 Yekaterinburg revision, GASO f. 8, op. 1, d. 453, as cited). [S11]\n- Check every sub-series. A participant listed how Yekaterinburg 1858 is split in the GASO catalogue: f. 8, op. 1, d. 1776 (цеховые мещане), d. 1777 (мещане), d. 1778 and 1778а (частные сказки), and d. 1779 (newly admitted мещане). [S3]\n- Merchants and мещане of one town and one revision are often in separate дела. Participants cite GAPK f. 111, op. 1, d. 2461 (1834 мещане) and d. 2463 (1834 купцы), while d. 2471 (1850) covers купцы, мещане and цеховые together. If a family is missing from one list, check its remarks and then the other estate's list. [S11]\n- A participant cited digitised Yekaterinburg revision lists for купцы, мещане and цеховые on \"Поколения Пермского края\" (GAPK f. 111, op. 1, d. 2413, 2415, 2416). [S3]\n- Read the confession note at the foot of the page for each person. A household can mix Orthodox and Old Believer members. [S3]","sources":["S8","S11","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cc16eda479e3","kind":"unclassified","anchor":"Revision lists will not contain the person under the new status. [S10] Use instead:","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c7de09908183","kind":"unclassified","anchor":"- **Admission (причисление) and transfer files.** Participants cited GASO f. 8, op. 1, d. 1922 and 1922а (1864, works people discharged into the town мещанство) and d. 1935а (1867, an enrolment file for the мещанское общество). [S3] For a man shown as a serf works employee in 1858 and a Kungur мещанин by 1867, participants pointed to the Kungur city archive, fund 585, which they described as holding lists, a revision list and petitions after 1864. [S10]\n- **1874 conscription family lists and later call-up lists in the city administration (городская управа) fund.** These substitute for revision lists at household level. A participant cited GASO f. 62, op. 1, d. 27а (Yekaterinburg мещане family list, 1874) and d. 28 (call-up lists 1878–79). [S3]\n- **Honorary-citizen grant files.** RGIA f. 1343 (Department of Heraldry), op. 39, covers hereditary honorary citizenship for 1830–1890. A participant added op. 40 for hereditary and op. 41 and 47 for personal honorary citizens. He judged the personal-citizen inventories to be outside the date range in his case and said the inventories are online at RGIA. Check each inventory's date range, and also look for a grant file in the provincial archive. [S1] Provincial formulary lists record the grant itself, for example GAPK f. 36 and f. 111, op. 1, d. 1030–1034 as cited in participants' extracts. [S9], [S12]\n- **For merchants of any date**, a participant listed these series:\n  - guild-certificate cases and registers of trade certificates;\n  - family lists of the мещанское and купеческое общества;\n  - declarations of people who wished to join a merchant society;\n  - lists of property owners;\n  - alphabetical lists of a province's merchants.\n  Find more through the footnotes of scholarly work on local merchants. [S2] A participant cited a personal file in RGIA f. 573 (op. 13) for a transfer between two towns' 1st-guild societies in the 1910s. [S2]","sources":["S3","S10","S1","S9","S12","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-65882573f4f4","kind":"unclassified","anchor":"**Limits on substitute lists.** A participant expected community tax-allocation (раскладка) files to list at most heads of household, not full families. Do not promise family detail from them. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-87c9129c6b87","kind":"unclassified","anchor":"- Search the metrical books of the works, village and town parishes where the person lived or traded, not only the registering town. The threads document \"[town] мещанин\", \"временно проживающий\" and \"[town] купецкий сын\" entries for births, marriages, deaths and godparents in Nevyansk, Shuralinsky, Rezh, Polevskoy and other works parishes (GASO f. 6, various inventories). [S3], [S6], [S7]\n- If the registering town's parish books seem lost, check the catalogue before you accept the gap. In one thread, a participant pointed to surviving books for 1891–1895 (GASO f. 6, op. 9, d. 860, the Holy Trinity Edinoverie church in Yekaterinburg), against the belief that the church's books began only in 1905. [S3]\n- An age or date mismatch between a candidate and the expected person lowers the candidate's rank but never excludes the candidate.","sources":["S3","S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3adb4510458f","kind":"unclassified","anchor":"- Before you rely on a case title taken from a catalogue annotation, check its years and, where relevant, its geography. [S2]\n- Absence from one society's revision list does not disprove the status or the identification. In one case a merchant was missing from his town's 1850 revision. A participant took this to mean he probably enrolled later and traded elsewhere. [S7] Check the later revision, the other estate's list (§4), the admission files, and the possibility of a transfer between societies. Record an unresolved absence as a gap.","sources":["S2","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3d60525002f7","kind":"custody","anchor":"- **Moscow мещане: find the sloboda, then the family number.** Catalogue data of the Central State Archive of Moscow (TsGA Moscow), as listed by NashiPredki, give f. 5 as the Moscow мещанская управа with one inventory [S17 @2026-11-08] and title the 1782 revision books of Moscow merchants and мещане («купцов и мещан») by sloboda, for example Taganskaya (f. 51, op. 18) [S18 @2026-11-08]. A genealogist's 2024 account says that metrical books, revision lists and confession lists name a family's sloboda, that f. 5, op. 1 holds alphabetical lists of мещане by sloboda and sloboda books in which each family has its own number, and that the sloboda's alphabetical list should be ordered first when the number is unknown [S19 @2026-11-08]. Record the sloboda in the registering-society field (§1), not as an address. Citations from before 2013 may name the Central Historical Archive of Moscow (TsIAM), which Russian Wikipedia says became part of TsGA Moscow in April 2013 [S20 @2026-11-08]; check file numbers in TsGA Moscow's own inventory before citing them.","sources":["S17","S18","S19","S20"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1edaa80d0a46","kind":"method","anchor":"Familio's searchable index of the Ведомости for 1870–1927 describes an entry as the convicted person's name, age, estate and place of residence, the time and circumstances of the conviction and the sentence, sometimes with a trade, and explains that «М» after an article number means the statute on penalties imposed by justices of the peace and «У» the Уложение о наказаниях. [S40] A Tula researcher adds the court, the date it passed sentence, the date the sentence was carried out and any earlier conviction. [S39] Search the index by surname before you page the printed volumes. Read the place beside the estate by §1, as the society of registration, before you take it as a residence. A hit in the right town can still be a namesake: in that researcher's search for a man whom family memory placed under a conviction of 1900–1905, only namesakes turned up. [S39]","sources":["S40","S39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ce416c4fd27b","kind":"method","anchor":"- **Read the sloboda book's columns before you leave it.** A genealogist describes the columns of a Moscow sloboda book: the family's sloboda number and its numbers in the 9th (1850) and 10th (1858) revisions; the men and the women with their dates; when and from which estate a man entered the мещане; distinguishing marks; «Какое имеет звание и чем занимается»; the services he was in; «Кто был под судом и чем дело кончено»; and remarks. In his family's entry the distinguishing-marks column recorded the passports issued and the addresses at the time. [S19] Use the two revision numbers to go straight to the family in the 1850 and 1858 revisions, and the entry column to date an admission after 1858 (§3). A blogger gives the occupation column's heading as «Какое имеет имение и чем занимается» and found the address and occupation there. [S50] Copy the heading from the book in front of you, and look for an address in that column, in the marks column and in the remarks.\n- **A foreign subject: find his petition for Russian subjecthood.** From 1832 the Heraldry handled cases of admission to Russian subjecthood, as well as honorary citizenship and changes of surname. [S54] A study of the petitions of enemy subjects for Russian subjecthood in the First World War draws on the petitions and on Council of Ministers and Ministry of Internal Affairs papers in RGIA, GARF and the Central State Historical Archive of St Petersburg. [S53] Other ministries' fonds hold such cases too: RGIA f. 733, op. 201, d. 499 is a 1914 file of the Department of Public Education on admitting Austrian and German subjects. [S52] A Tula blogger read a 1914 petition at RGIA in which an Austrian-subject estate manager gave his education, his birthplace and date of birth, his godfather, his wife and his daughters. The petition names Jersey as his birthplace, while his marriage entry of 1885 and his child's baptism entry of 1886 call him a native of an Austrian town. [S51] For a foreign subject, a parish entry's «родом из» can name a place of origin or of subjecthood rather than the birthplace; record both statements as testimony.\n- **Old noble families: the assembly's files prove, the printed genealogies lead.** A Tula researcher worked from several thick files on one family's genealogy in the Tula archive and from two printed books [S45]: «Родословная книга князей и дворян российских и выезжих» (1787), N. I. Novikov's edition of the Бархатная книга, and P. V. Dolgorukov's «Российская родословная книга», published in four parts in 1854–1857. [S48], [S49] Novikov printed the Бархатная книга not from the original but from copies, and its inaccuracies have been discussed in print. [S48] The guberniya noble genealogy book was compiled by a commission of the noble deputies' assembly from the evidence submitted for each family. [S46] Use the printed books to find the line and the assembly's files to prove each generation, and record the earliest printed generations as the books' statements, not as proof.","sources":["S19","S50","S54","S53","S52","S51","S45","S48","S49","S46"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-40c5e90c5aec","kind":"method","anchor":"- **«Временнообязанный» and «крестьянин-собственник» date a former serf's land status; they do not change his estate or family.** A temporarily obligated peasant was personally free but had not redeemed his land, so he still owed the landowner obrok or barshchina for its use. [S23] Entries often name that owner beside the status, in the form «деревни [X] господина [owner] временнообязанный крестьянин». [S21] Under the redemption the state paid the landowner in interest-bearing bonds, and the peasants became peasant-proprietors who repaid the state over 49½ years; redemption payments ended only on 1 January 1907. [S24] So «крестьянин-собственник» in an entry of 1868 or 1872 means that the village had gone over to redemption, not that the land was paid off, although the bloggers who cite such entries read it as a completed buyout. [S21], [S22] Redemption became compulsory from 1 January 1883 under a law of 28 December 1881, and by the end of the century the temporarily obligated category survived only in Transcaucasia. [S23] A household that moves from one label to the other between entries is the same household.\n- **A peasant who shares the village nobles' surname: test an odnodvorets origin first.** A Tula-guberniya researcher traced two such families through the revision tales; the 1795 tale for one village says its people were «положенные из дворян в однодворческий подушный оклад». [S25] Odnodvortsy descended from service men settled on the southern frontier, boyar scions among them; in the 1850s the government began to merge them with the state peasants, and the 1854 census graded them as state peasants. [S28] Their final transfer into that estate came in 1866. [S29] The same researcher rejects, for Tula guberniya, the two usual explanations: he writes that a landowner's illegitimate children got an invented surname or their mother's, and that he has never met landowners handing their own surname to surnameless peasants there. [S25] Look for the odnodvortsy formula in the revision tales before you accept either explanation, and keep a common ancestor with the noble family a hypothesis until a revision tale or a nobility file joins the lines.\n- **An odnodvortsy family missing from a later revision: read the state-peasant lists.** One Tula family was written as odnodvortsy in the revision tales of 1782–1834 and among the state peasants from the 1850 revision. [S26] Read the same village's state-peasant lists for that revision before you record the family as absent. In that researcher's account the family went on calling itself odnodvortsy and descendants of nobles, and often took noblemen's daughters as wives [S26]; another Tula post says that odnodvortsy married mostly daughters of odnodvortsy, clergy and nobles. [S27] Use that as a lead to search clergy and noble families for a wife's origin, not as a rule.\n- **Read a run of state-peasant labels as one household.** Казённые and государственные крестьяне are one estate. [S32] Пахотные (пашенные) солдаты и драгуны were a category of service men who later became state peasants [S31], and the Tatar encyclopedia's article on state peasants says that former ploughing soldiers and ямщики gained state-peasant status in the first third of the 19th century. [S33] In one Tula family the revision tales give пахотные солдаты in 1816, «крестьяне казённого ведомства» in 1834 and «государственные» in 1850. [S30] Do not split such a household into different families, and do not read «солдаты» as army service. Date each label to its own revision; one family's change years do not date another family's.\n- **A peasant's or мещанин's passport placed him away from his society of registration.** Under the regulation on residence documents of 3 June 1894, no passport was needed for an absence within the uezd, or beyond it for no more than 50 versts and no more than six months; мещане and сельские обыватели received five-year passport booklets, or passports for one year, six months or three months, from the мещанская управа or through the volost elder, while nobles not in service, honorary citizens and merchants received booklets without a term from the police. [S43] So a passport is a permit to be away from the society that issued it, not proof of residence there. A Tula blogger's image captions describe a мещанка's passport of 1901 issued by a town elder and a peasant woman's passport of 1901 issued by a volost board. [S41] Copy a metrical entry's passport note in full: Moscow entries of 1907 and 1908 record the parents' estate «по паспорту» of a named town elder with its date and number, or give the number and date of each parent's passport booklet. [S42] The issuer names the society whose records to search next, and the date shows that the person was away from it then.","sources":["S23","S21","S24","S22","S25","S28","S29","S26","S27","S32","S31","S33","S30","S43","S41","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-56948a7ed7a7","kind":"method","anchor":"- **Transfers into a town estate: find the treasury chamber's decision.** A Moscow-province family's 1850 revision entry cites a Moscow Treasury Chamber decree of 30 March 1840 that moved the family, ямщики of a volost, from the state peasants into a town's 3rd-guild merchants. Most such decrees had not survived, so the researcher found the decision in the chamber's journal of meetings for March 1840, TsGA Moscow f. 51, op. 1, d. 373. The journal records the Moscow Chamber of State Properties asking for the enrolment, and the treasury chamber instructing the town duma and the uezd treasury to enrol the family and issue its merchant certificate. A landowner's serf first needed his release from the landowner. [S34] TsGA Moscow f. 51 is the fond of the Moscow Treasury Chamber, 1775–1918. [S35] Town duma fonds hold the other end of the procedure: a file of the Orenburg town duma (OGAOO f. 368, op. 1, d. 535) combines the Orenburg treasury chamber's decrees and private petitions on enrolment into the мещане, 1851–1867. [S36] For a state peasant, ямщики included, search the treasury chamber's journals and the state-property chamber, not a landowner's papers, and use the decree date in the revision remark to find the journal.\n- **A town's merchant lists can date an enrolment.** Annual family lists of Tula merchants for 1890–1916, kept like a yearly revision with the household as it was beside the household as it became, give the date on which the head was written into the merchants. In one case that date led to the father's petition for enrolment in another fond, which named his former estate and village. The lists are in GATO f. Р-1905, op. 5, a collection that, by its inventory preface, was formed probably in the 1930s–40s from files of the Tula treasury chamber, the Tula town administration and other fonds and kept together rather than returned to them. [S37] Another researcher's notes list undated lists of Tula merchants and of householders in the same opis, whose files span 1875–1991. [S38] The first researcher notes that the «Р» prefix marks a Soviet-period fond. [S37] Do not skip an «Р» fond when you look for pre-1917 lists; read its historical note and annotation first.\n- **A part of a noble genealogy book dates how the nobility was acquired.** Part 2 of a guberniya's noble genealogy book held the families of military nobility. [S46] Under the Table of Ranks, military service gave hereditary nobility with the first ober-officer rank, and the nobility passed only to children born after the father received that rank; from the manifesto of 11 June 1845 it came only with a staff-officer rank (8th class) or the 5th civil class, and from 9 December 1856 with the rank of colonel or the 4th civil class. [S47] A Tula blogger's ancestor, born a serf, was taken as a recruit in 1815, rose to an ober-officer rank and was entered in Part 2 of the Vladimir guberniya book in 1838. [S44] Treat a Part 2 entry as an acquired status, like an honorary-citizen grant: take the rank and its date from the service record, find the birth estate there or in the parish books, and do not extend the nobility to a child born before the rank without a record that does.","sources":["S34","S35","S36","S37","S38","S46","S47","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
