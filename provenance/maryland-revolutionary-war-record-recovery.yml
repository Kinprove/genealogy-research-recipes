claims:
  - {"id":"C-01","kind":"method","anchor":"Keep wartime residence, an oath or affirmation, public aid and military service in separate evidence rows. The presentation (only transcript excerpts read) outlines the wartime census and oath search [S1]. For wartime residence, check county tax lists and the Maryland State Archives’ 1776 and 1778 census index, MSA S1419, before using a later federal census. Use Bettie Stirling Carothers’s *1776 Census of Maryland* as a second route into the census. For a locality near a county division, check the parent and successor catalogs. Test Frederick against Montgomery or Washington around the 1776 division, Baltimore and Frederick for later Carroll, Washington for later Allegany and Washington through Allegany for later Garrett. Check Anne Arundel as the parent of Howard and Somerset and Worcester as the parents of Wicomico. Choose the predecessor for the specific tract or settlement, using a period location clue if it is near a boundary. [S2], [S3], [S4], [S5]","sources":["S1","S2","S3","S4","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"Use MSA S1420 and county returns to distinguish people who took the oath from listed nonjurors. Search the surviving affirmations as well when researching Quakers, Mennonites or Tunkers under the 1777 act. Read the named recipient or authority on any oath before assigning allegiance. An oath to King George supports a different allegiance from an oath of fidelity to Maryland. Leave oath status unresolved when the person is missing from both the oath and nonjuror material, and use any same-surname cluster only to prioritize candidate counties. [S2], [S3], [S8]","sources":["S2","S3","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Once the period county is established, use Henry C. Peden Jr.’s *Revolutionary Patriots* series at REF A-1-4 to find references to militia, Continental service, oaths and aid. Use the combined Baltimore Town and Baltimore County volume for either jurisdiction. Carry each entry to the series it cites, keeping service references apart from civil records. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"If the expected county volume omits the person, search Peden’s *A Supplement* and *Second Supplement* before closing the compilation search. For a pension, federal bounty-land or pension-derived marriage lead, use Harry Wright Newman’s *Maryland Revolutionary Records*. Retrieve the cited file before treating a marriage or a term of service as established. [S2], [S6], [S7]","sources":["S2","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Search the Maryland Revolutionary War Papers and Records indexes (MSA S1422 and S1423) for aid or reimbursement, then open the cited claim or correspondence. Extract the claimant, county, date and exact service or goods described. Record any payee or agent separately and use [the DAR record recipe](dar-ancestor-record-interpretation-and-correction.md) for an existing DAR claim. For a pension lead, follow MSA S1421 and [the pension file recipe](us-military-pension-file-recovery.md). [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
