claims:
  - {"id":"C-gns-pitfalls","kind":"method","anchor":"- Reading Henry number 11 as eleven. Each position after the first is a child's birth position, so 11 is the progenitor's first child. [S2]\n- Giving person 1 in an ahnentafel a sex from the number. Person 1 is the subject, male or female; the even-male, odd-female pattern starts at 2. [S3], [S6]\n- Treating every even-numbered ancestor as being on the father's side. The mother's side has men too, and they carry even numbers. [S6]\n- Reading a letter or parenthesis in a Henry number without the document's key. Henry's own scheme and Modified Henry write the tenth child differently. [S2]\n- Reading a Register child without an identification number as childless. The number marks a child treated in full later, usually one with offspring. [S4], [S2]\n- Following every numbered child forward in an NGSQ genealogy. Every child has a number; the plus sign marks the ones with a later entry. [S2], [S3]\n- Counting a superscript generation number from the person you are researching. It counts from the publication's own first generation. [S5]","sources":["S2","S3","S6","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-name-system","kind":"method","anchor":"Find the compiler's key or introduction and name the system before decoding a single number. Ahnentafel numbers ancestors upward from one subject; Henry, d'Aboville, Register and NGSQ number descendants downward from a progenitor. [S2] Register and NGSQ look alike on the page but differ in which children receive Arabic numbers (§4, §5). [S2] Record the system and the page of its key in the extraction, and decode by that key rather than by the system's name, because the schemes handle large families differently (§3).","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-ahnentafel","kind":"method","anchor":"- Person 1 is the subject, male or female. For any person n, the father is 2n and the mother is 2n + 1. [S3], [S6], [S2]\n- Every number from 2 up is therefore male if even and female if odd. Take person 1's sex from the records, not from the number. [S3], [S6]\n- By the same rule, person n's child in the chart is n divided by 2, rounded down. Each generation starts at a power of two: the parents are 2 and 3, the grandparents 4 to 7, the great-grandparents 8 to 15. This arithmetic is the recipe's own.\n- To read a long number as a path, write it in binary, drop the leading 1 and read the remaining digits from the subject upward: 0 is a father, 1 is a mother. For 116, drop the first digit of 1110100 and trace 110100 from the subject: mother, mother, father, mother, father, father [S3].\n- The direct paternal line is 2, 4, 8, 16 and so on, the powers of two. [S6] By the same rule, the direct maternal line is 3, 7, 15, 31.\n- Even numbers do not mark the paternal side. That side is 2 and all of 2's ancestors, and the maternal side is 3 and all of 3's ancestors, with men and women on each. [S6]","sources":["S3","S6","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-ydna-line","kind":"method","anchor":"The paternal line 2, 4, 8, 16 is the line a Y-DNA test follows: men inherit the Y chromosome from their fathers, so person 1 carries it only if male. [S7] Take any test or match question to [Y-DNA and mtDNA interpretation](ydna-mtdna-interpretation.md).","sources":["S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-ahnentafel-community","kind":"method","anchor":"The Just Genealogy presenter reports the father-is-2 numbering and the 1, 2, 4, 8, 16 line as the Y-DNA line [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-gns-henry","kind":"method","anchor":"Henry numbering gives the progenitor 1 and each child the parent's number followed by one more position for birth order: 11 is the progenitor's first child, 12 the second, and 112 the first child's second child. [S2] Read 11 as two positions, one and one, never as eleven. The number of positions is the generation, counting the progenitor as 1, so 112 is in the third generation.","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-henry-past-nine","kind":"method","anchor":"Positions past nine differ by scheme. In Henry's own scheme the tenth child is X, the eleventh A and the twelfth B; Modified Henry puts the position in parentheses, so the tenth child of 12 is 12(10) rather than 12X. [S2] Count a parenthesized group as one position. d'Aboville numbering separates generations with periods, so count the period-separated segments instead. [S2] Never decode a letter or bracket in a Henry number until the document's key says which child position it stands for.","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-henry-community","kind":"method","anchor":"Check the author’s key when “Modified Henry” appears on working papers. The Just Genealogy presenter reports using letters past the ninth child under that name [S1†]. A parenthesized position and a letter can therefore require different readings [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-gns-register","kind":"method","anchor":"In Register format each child in a family's list has a lowercase Roman numeral for birth order. A child who will be treated in full later, usually one with offspring, also has an Arabic identification number before the numeral, and that number heads the child's own entry in the next generation. [S4], [S2]","sources":["S4","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-register-list","kind":"method","anchor":"- Follow each identification number to its entry, and attach the spouse, children and dates found there to the same person.\n- Do not read a child without an identification number as childless or as dying young. The number marks who is carried forward; a child without one has no known progeny or is simply not treated further. [S4], [S2], [S8]","sources":["S4","S2","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-register-community","kind":"method","anchor":"The Just Genealogy presenter reports the identification number as the pointer to the entry carried forward elsewhere in the publication, and numbering only the people carried forward as the key to the format [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-gns-ngsq","kind":"method","anchor":"The NGSQ system, also called the Record or Modified Register system, gives every child an Arabic number whether or not the child is known to have progeny. [S2], [S8] A plus sign before a child's number marks a child with a fuller entry further on. [S3] So decide continuation by the plus sign, never by the presence of a number. For a child without a plus sign, the parent's child list is the whole treatment; do not search the genealogy for a later entry.","sources":["S2","S8","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-ngsq-community","kind":"method","anchor":"The Just Genealogy presenter reports that NGSQ numbering gives everybody a number and that the plus sign determines who moves forward [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-gns-superscript","kind":"method","anchor":"In NEHGS-style genealogies the superscript generation number follows the given names and precedes the surname, so Christopher Challender⁶ Child has the surname Child. The parenthetical list traces his ancestors back to generation 1, with a superscript for each. [S5], [S3] Treat the words before the superscript as given names and those after it as the surname, even when the surname has more than one word. Published genealogies differ in where the superscript sits relative to the surname, so confirm the placement on an entry whose names you already know before splitting names across a whole publication. [S5]","sources":["S5","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-generation-one","kind":"method","anchor":"Read a superscript against the publication's own generation 1, not against the person you are researching. In Child’s examples a first U.S. generation is numbered 1, and its non-emigrant father may be marked A [S5]. Record the author’s starting generation before comparing the same person across lineages.","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-gns-superscript-community","kind":"method","anchor":"The Just Genealogy presenter reports placing a number between the given names and the surname to tell surnames, including unhyphenated ones, from other names [S1†].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
