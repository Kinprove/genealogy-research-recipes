claims:
  - {"id":"C-4a7e19d0b3c2","kind":"platform-ui","anchor":"- Reading a red notice as proof that the patriot did not serve or that every line from him is wrong. A lineage notice reports an error found on at least one paper verified on that ancestor (§3). [S2 @2026-11-16]\n- Reusing a flagged paper as proof. As a general rule, papers named in the comments are not to be used to complete new applications or supplementals. [S2 @2026-11-16]\n- Inferring that a member admitted on a flagged paper has lost membership, or that DAR will rewrite that paper. DAR notes the error in the database and leaves the paper as it was verified. [S2 @2026-11-16]\n- Assuming that a message to DAR is the usual way to add newly found service. DAR prefers to make changes within a newly submitted application or supplemental. [S2 @2026-11-16]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8d21f6e5a904","kind":"platform-ui","anchor":"Copy into the user's notes, exactly as shown: the patriot's name and number, the service description, the service source, the comments, every red notice, and each paper number with any \"EL\" beside it. DAR's Ancestor Database help, read in a June 2026 archive copy, explains these fields. The service source is the source DAR currently uses as proof of the patriot's service. An \"EL\" beside a paper number means that an error in lineage exists on that paper. Not every patriot has comments. [S2 @2026-11-16]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1c93b7e40fa8","kind":"platform-ui","anchor":"DAR describes its databases as proprietary information not to be redistributed, apart from listed exceptions such as citing a patriot's name and number. Keep the extract in the user's own notes and cite the record; do not paste it into a shared tree, a public post or another service. [S2 @2026-11-16]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6f0a2d9c58e1","kind":"platform-ui","anchor":"When a red notice requires new proof, record what the next applicant on that patriot must prove. When a line is closed to membership, the record says so in red. The notice FUTURE APPLICANTS MUST PROVE LINEAGE OF CHILD means that at least one paper verified on this ancestor has been found to contain an error in the lineage. [S2 @2026-11-16]","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b47e30c1d29f","kind":"platform-ui","anchor":"A service notice works the same way. A third-party tutorial for DAR applicants explains that under \"Future Applicants Must Prove Correct Service\" DAR no longer accepts the service submitted with earlier papers on this ancestor, and new service must be found before an application is submitted [S5 @2026-11-16]. DAR's staff genealogist wrote in 2018 that a line is closed only as a last resort, when other service cannot be found [S3 @2026-11-16].","sources":["S5","S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03d8a6f2e7b5","kind":"historical","anchor":"The 2014 edition of DAR's Genealogy Guidelines (partially read) describes the mechanism: when new information calls an established ancestor's service or verified lineage into question, the GRS record is coded, and the line stays closed to new applications and supplementals until the issue is resolved [S4]. That edition is superseded and was read only in part, in a third-party copy; the current edition was not read.","sources":["S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e95c14b8a063","kind":"platform-ui","anchor":"A lineage notice reports a lineage error; do not read it as a finding about the patriot's service. The same tutorial notes that the general notice \"Problems Have Been Discovered With At Least One Previously Verified Paper\" may or may not apply to the user's lineage [S5 @2026-11-16]. Compare the papers named in the comments and the paper numbers marked \"EL\" with the paper the user's own line rests on [S2 @2026-11-16]. Record the result as applies, does not apply, or not yet known.","sources":["S5","S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-72af0e3d91c4","kind":"custody","anchor":"DAR does not retroactively change information on previously accepted applications or supplementals. It notes the error in the database and leaves the paper as it was verified, because the papers are the historical record of DAR membership. [S2 @2026-11-16] Do not infer from the notice that a member has lost membership. Report that the notice governs new applications and supplementals and leaves the member's paper as verified, and state no conclusion about the member's standing.","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5b1d8c27f4e0","kind":"method","anchor":"The hosts of the source livestream read such a notice the same way, as a block on the line until new applications resolve it [S1†]; their remarks are used here as reported in extracted quotations, not from a re-viewing.","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-a3f67e09c2d8","kind":"custody","anchor":"DAR reviews new information about established patriots and prefers to make changes within a newly submitted application or supplemental [S2 @2026-11-16]. When the user has found service that the record lacks, or proof that answers a red notice, plan for it to reach the record on the next application or supplemental on this patriot that cites it.","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9e28b5d4103f","kind":"method","anchor":"On that paper, cite and submit acceptable proof for the service. DAR's staff genealogist (2018) calls this updating the service with an acceptable source, not re-proving it, and staff first compare a submission with the most recent verified paper [S3]. A supplemental records a member's descent from a further patriot, beyond the one on the original application, and meets the same documentation standards as an application, according to the 2014 Guidelines (superseded; partially read) and a 2022 Kansas DAR handout [S4], [S6]. So the paper is either a prospective member's application or a supplemental by a member who has not yet proved this patriot.","sources":["S3","S4","S6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f81a3c6d2b97","kind":"method","anchor":"The source livestream's hosts also advised carrying newly found service on a descendant's new application [S1†], used here as reported in extracted quotations, not from a re-viewing.","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d06c4a1e8b72","kind":"custody","anchor":"**Privacy gate:** <!-- privacy-gate: upload --> Before an application or supplemental packet leaves the user's device, answer the privacy gate in writing. Name each living person whose data the packet carries, usually the applicant and the most recent generations, and the documents that show them. Name the destination (the chapter registrar and DAR) and the audience: a verified paper becomes part of DAR's permanent membership record, which DAR does not alter later [S2 @2026-11-16]. Get each living person's permission for this transfer; until every item is answered, the packet stays an unsent draft.","sources":["S2"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2c85f9a7e1d6","kind":"custody","anchor":"DAR's help text, as archived in June 2026, also gives a route outside an application. Send documentation with a cover letter by post to the attention of the Corrections Genealogist, Registrar General's Office, 1776 D St NW, Washington, DC 20006-5303. Use <rgcorrections@dar.org> for typos in the Ancestor Database and for comments that are not clear. [S2 @2026-11-16] The 2014 Guidelines (superseded; partially read) said that DAR could not accept corrections documentation by email [S4 @2026-11-16].","sources":["S2","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-60a91d7fd3ba","kind":"platform-ui","anchor":"Open the full Ancestor records when several patriots share a name. The **Pension Number** field, when present, can refer to a pension granted to the patriot or the spouse [S8 @2026-11-18], [S9 @2026-11-18]. In the verified application and supplemental listings, look for the patriot's child through whom each applicant descended and that child's spouse [S8 @2026-11-18], [S10 @2026-11-18].","sources":["S8","S9","S10"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ca67ef3a7cf3","kind":"method","anchor":"When other evidence points to a pension, use the pension references and associated families to narrow the same-name candidates, following the advice reported in the livestream excerpts [S7†]. Keep candidates with a blank pension field in play until other evidence rules them out. Once you identify the patriot, use the listed children and their spouses as leads for sibling and collateral research. Allow for children whose lines never appear in an application.","sources":["S7"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c05f3ca2e42b","kind":"method","anchor":"When a North Carolina service citation gives “Clark” with a volume and page, test Walter Clark's edition of *The State Records of North Carolina* [S11]. The livestream advice reported in the excerpts suggests reading the surname and numbers as a single possible reference [S7†]. Confirm that the cited page supports the named patriot and service before expanding the citation in your notes.","sources":["S11","S7"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ac3f40877123","kind":"method","anchor":"If the comments flag a specific residence, follow the livestream advice reported in the excerpts and use the named place to direct the search [S7†]. Find evidence placing that patriot there during the period at issue, and check that the claimed service fits the proved wartime residence [S8]. Keep the residence question open if the service evidence leaves it unresolved.","sources":["S7","S8"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-15a1d381dab9","kind":"custody","anchor":"DAR requires its own application with supporting documentation and excludes applications from other hereditary societies [S12 @2026-11-18]. For a line accepted by the Sons of the American Revolution (SAR), follow the livestream advice reported in the excerpts and check each relationship against DAR's proof requirements using the underlying evidence [S7† @2026-11-18].","sources":["S12","S7"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0cc67a806e3b","kind":"platform-ui","anchor":"Search the Ancestor tab by a surname prefix if the family's spelling misses the entry, and record DAR's standardized surname separately from the form in the underlying records [S8 @2026-11-20]. Start with a known deceased descendant in the Descendants tab when you have a later generation but no patriot number. Search for names as they could have been filed, including nicknames, and follow the result to the full Ancestor record. From that record, follow the lineage links for the historical branches you need. [S17 @2026-11-20], [S18 @2026-11-20]","sources":["S8","S17","S18"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4674cf1e6d1b","kind":"platform-ui","anchor":"If the Ancestor search yields no match, keep looking for service independently. A patriot enters the index through a verified DAR application or supplemental, so a miss only describes the result in that index. [S8 @2026-11-20], [S10 @2026-11-20], [S15 @2026-11-20]","sources":["S8","S10","S15"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-24387a7ec6b1","kind":"custody","anchor":"Read the service description to see what DAR credits. Check military, civil and patriotic service, including supplies, loans of money and care for the wounded outside the person's immediate family. DAR lists Boston Tea Party participation as patriotic service. For a claimed participant, check whether the record credits that act or a different service. [S13 @2026-11-20], [S16 @2026-11-20]","sources":["S13","S16"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d579801eec6d","kind":"platform-ui","anchor":"For a military lead, use the listed service dates and any company or regiment number to narrow the search, following the advice reported in the interview excerpts [S14† @2026-11-20]. Browse FamilySearch's *United States, Revolutionary War Rolls, 1775–1783* (National Archives microfilm M246) by state and military unit. Compare the dates and unit in the underlying record with the DAR entry before treating it as corroboration. [S19 @2026-11-20]","sources":["S14","S19"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-89b95830febe","kind":"platform-ui","anchor":"Treat gaps in recent generations of the public Descendants index as possible privacy restrictions. Leave the link unresolved if it is hidden. An older record copy already in hand may name the applicant. Apply the Living people rule when a generation is restricted. [S17 @2026-11-20], [S10 @2026-11-20]","sources":["S17","S10"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-38d4a00fa1ff","kind":"fee","anchor":"Use the free GRS listings to compare the patriot's children against the user's tree before selecting an application or supplemental. Favor a paper through the target child that covers the most relevant shared generations. Check its notices (§§2–3) before ordering. [S8 @2026-11-20], [S10 @2026-11-20], [S17 @2026-11-20]","sources":["S8","S10","S17"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ddcd80a4fb7f","kind":"fee","anchor":"Request the selected DAR record copy to examine the applicant's direct line, service description and source citations. DAR charges for the online copy and lets readers inspect the complete record copy in the Library before purchasing. Follow the citations for the specific links you need, and request any available supporting documents separately if the citations alone do not resolve them. DAR restricts supporting documents under 100 years old when they are vital records or other sensitive material. [S10 @2026-11-20], [S15 @2026-11-20]","sources":["S10","S15"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dc089c3e4642","kind":"platform-ui","anchor":"Use the comments to distinguish a proof requirement from a finding of a specific error. Record exactly what remains at issue. A red notice can also be informational or refer to a resolved problem. [S8 @2026-11-20]","sources":["S8"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a13c4504c6f","kind":"historical","anchor":"Record the paper's approval date and check which links the evidence actually supports. Some older papers used DAR's short form, which can omit intermediate generations even on a verified application. Mark omitted or unsupported links for evidence review. [S10 @2026-11-20]","sources":["S10"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-75e7a290f415","kind":"custody","anchor":"If a relative's verified DAR application covers part of the same line, identify the most recent shared ancestor on that paper. Document the new applicant's descent to that person generation by generation. Cite the verified paper for the shared segment back to the patriot once the notice check and the paper support its use (§§2–3). Find evidence for any gaps or corrections the shared paper leaves open. [S20 @2026-11-20], [S10 @2026-11-20]","sources":["S20","S10"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8b89ef279c4e","kind":"platform-ui","anchor":"Compare the likely place and period of service from independent records with the service description and wartime residence in each full Ancestor record [S8 @2026-11-22]. Use the fit to rank same-name candidates, following the method reported in the case-study excerpts [S21† @2026-11-22]. Keep candidates open when the source evidence cannot distinguish them.","sources":["S8","S21"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4f41fe6d1e36","kind":"method","anchor":"When the record lists several residences, build a timeline and test each residence against the dated evidence for the relevant service episode. For Virginia entries naming Fincastle and Montgomery, test Fincastle against Lord Dunmore's War records and Montgomery against Revolutionary militia records, following the suggestion reported in the case-study excerpts [S21†]. Check whether the county names could refer to the same place because Montgomery was formed from part of Fincastle [S24]. Leave the residence open when the service record only places the person on duty.","sources":["S21","S24"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-598e71a75daa","kind":"platform-ui","anchor":"When a Descendants search for a deceased ancestor returns same-name candidates, compare the known child's name with the child shown in each accessible lineage. Use a matching branch to pick out earlier generations and surnames to investigate, following the advice reported in the case-study excerpts [S26† @2026-11-22]. Check the related full Ancestor record for notices and corroborate each new link before using it [S17 @2026-11-22].","sources":["S26","S17"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c6ff1cbdd3bb","kind":"platform-ui","anchor":"If a deceased relative's admission paper follows a different branch, check the verified supplementals for the target branch, which appeared on a supplemental in the case reported in the video excerpts [S25† @2026-11-22]. Use the deceased member's National Number from records already in hand to search the public Member tab, then check the linked Descendant Listings [S18 @2026-11-22], [S17 @2026-11-22]. Keep any supplemental Add Volume alongside the National Number when recording the paper locator [S29 @2026-11-22]. If the number is missing or the member may be living, use supplied papers or search the Descendants tab for a known deceased person in the target branch.","sources":["S25","S18","S17","S29"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4959f78c1ca3","kind":"platform-ui","anchor":"When an Ancestor citation abbreviates a journal title, look up the title words in the DAR Library Catalog [S22 @2026-11-22]. For “DAR Magazine,” test the historical title *Daughters of the American Revolution Magazine* against the cited volume [S23 @2026-11-22]. Open the issue at the cited volume and printed page and identify which claim the passage supports, following the advice reported in the case-study excerpts [S21† @2026-11-22]. A mention of the patriot alone leaves the service or biographical claim open.","sources":["S22","S23","S21"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-96b0c1adaeba","kind":"method","anchor":"Inspect the space above a marriage date on the record copy, following the advice reported in the livestream excerpts [S27†]. Based on the inspected section of SAR's application guide, read a check or slash directly above the date as a mark of verification for that date and a center check over “married” as an indication of earlier verification [S28]. Follow the supporting citation or earlier paper as appropriate, and leave an omitted place unresolved.","sources":["S27","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
