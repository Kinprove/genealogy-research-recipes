claims:
  - {"id":"C-56bb1d3284a1","kind":"historical","anchor":"This step does not cover Burgenland, which was Hungarian until 1921. Burgenland kept Hungary's state civil registers after 1921: obligatory civil marriage and the state register system tied to it stayed in force there as special federal law, and the marriage law of 1938 took the state registrars over as registry officials [S35]. Route a Burgenland event from before the 1938–1939 cutover with [historic Hungary record routing](historic-hungary-record-routing.md), which gives the date those registers start.","sources":["S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-de8d82c6f97a","kind":"unclassified","anchor":"- **Before the cutover, search the confessional register for a member of a recognised church or religious community.** Austria had no state civil registration for the general population before 1938. The recognised churches and religious communities kept the vital registers on the state's behalf: Catholic, Protestant and Jewish (Israelitische Kultusgemeinde, IKG) registers among them [S2]. These are the official records for the period, not a substitute.\n- **For a person in no recognised church or religious community, search the civil register of the political authority.** Under the law of 9 April 1870, the Bezirkshauptmannschaft (district authority), or in a town with its own statute the municipal authority, handled their marriages and kept their birth and death registers [S13]. Someone who left a church without joining another confession is recorded there, not in a parish book.\n- **Use the cutover dates exactly.** Standesämter recorded marriages from 1 August 1938 and births and deaths from 1 January 1939 [S1], [S2]. A marriage in autumn 1938 is in the Standesamt; a birth in the same months is still in the confessional register.\n- **Search the old books at their holders, not at the Standesamt.** The law assigns the registers from before those dates to the churches, religious communities and authorities that hold them, which keep and continue them [S1].\n- **Search each spouse's confession for a mixed or changed-confession family.** One household can have events in two confessional series.","sources":["S2","S13","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e005c91a2180","kind":"custody","anchor":"**Route a pre-1938 military-register entry to the Austrian State Archives.** Section 62(2) of the Personenstandsgesetz 2013 gives the keeping and continuation of the military registers (Militär-Matriken, Heeres-Matriken) kept before 1 August 1938 to the Austrian State Archives (Österreichisches Staatsarchiv) [S37 @2026-11-13]. An event entered in one of those registers is held there, not by a parish or a registry office.","sources":["S37"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a1cd51f20704","kind":"historical","anchor":"**Date a register's legal standing by confession.** A diocesan archive guide gives these dates. Protestant pastors were allowed registers from 1782, at first without public standing and with duplicates sent to the Catholic parish priest; they kept independent registers from 1830, and extracts from them were declared legally valid in 1849. Jews were required to keep the three registers by the patent of 20 February 1784, and their registers were given legal evidentiary force in 1868 [S13]. For a Protestant event before 1830, check the Catholic parish as well.","sources":["S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6b71ac511901","kind":"unclassified","anchor":"- **Do not search every Vienna parish.** Catholic parishes cover street-defined territories, so the district does not fix the parish. Take the address for the event year, then place it in the parish that covered that street. Check the parish against the event date with the Catholic recipe.\n- **Get the address from Lehmann's directory.** Lehmann's Vienna address book ran from 1859 to 1942, with no volumes for 1862, 1863, 1866 and 1869; Wienbibliothek Digital offers the digitised volumes with full-text search [S3]. It gives residence and occupation year by year, apart from those four years. Log those four missing years as gaps under the [city-directory observation workflow](city-directory-observation-workflow.md).\n- **Search ANNO for death notices and announcements.** ANNO is the Austrian National Library's searchable portal of digitised newspapers [S4]. A notice can give the address, the date and the church of a funeral.\n- **Search Friedhöfe Wien for a grave.** Its deceased search (Verstorbenensuche) covers the cemeteries Friedhöfe Wien runs and excludes the denominational cemeteries [S5]. A miss there says nothing about a Jewish, Protestant or other confessional cemetery.","sources":["S3","S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8b800ce5ea6b","kind":"unclassified","anchor":"- **Look for a separate index volume on Matricula.** Vienna Catholic registers on Matricula include index volumes next to the year books; Döbling B-01, for example, is an \"Index Trauungen\" (marriage index) for 1783–1850 [S6]. Open the parish's volume list and search an index before you turn pages.\n- **Search GenTeam's Vienna databases.** GenTeam is free with a registered login. Its Vienna databases include Catholic baptisms (Katholische Taufen) and Jewish registers (Jüdische Matriken), with separate Catholic, Protestant and Jewish index groups [S7].\n- **Treat every index hit as a pointer.** Open the register image it points to and read the entry there before you record the event.","sources":["S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b5a025e133b4","kind":"unclassified","anchor":"- **Search GenTeam's IKG Austritte 1868–1914 index for a withdrawal.** It indexes about 18,000 withdrawals from the official withdrawal declarations and the withdrawal protocols (Austrittsprotokolle) of the Vienna Jewish communities; its IKG field gives the year and sequence number of the protocol entry [S10]. If the person was baptised, also search the receiving parish's register for the adult baptism.\n- **Use the published indexes by period:**","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-39f0c51d3268","kind":"unclassified","anchor":"| Period | Work | Scope |\n  | --- | --- | --- |\n  | 1782–1868 | Anna L. Staudacher, *Jüdische Konvertiten in Wien 1782–1868* (Peter Lang, 2002) | about 3,000 adults baptised in Vienna [S9] |\n  | 1868–1914 | Anna L. Staudacher, *\"… meldet den Austritt aus dem mosaischen Glauben\": 18000 Austritte aus dem Judentum in Wien, 1868–1914* (Peter Lang, 2009) | about 18,000 withdrawals [S8] |","sources":["S9","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7c7df6d0622","kind":"historical","anchor":"A third work indexes baptisms into the Protestant churches: Anna L. Staudacher, *Jüdisch-protestantische Konvertiten in Wien 1782–1914* (Peter Lang, 2004). Its publisher describes it as resting on a complete survey of Vienna's Protestant baptism registers, and counts about 6,000 Jews who became Protestant in Vienna between 1782 and the First World War [S36].","sources":["S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0f313282af00","kind":"unclassified","anchor":"- **Search the state regional archive, not the parish.** Czech parish registers (matriky) are held by region in the state regional archives (státní oblastní archivy) [S11]. Route by the archive whose present territory includes the parish that kept the register.\n- **Pick the archive by territory.** Bohemia has five state regional archives (SOA): Litoměřice for the north, Plzeň for the west, Třeboň for the south, Hradec Králové for the east (SOA Zámrsk until 2022, the name older guides use) and Praha for Central Bohemia only. In Moravia and Silesia, the Moravian Provincial Archive in Brno (MZA) covers the south and the Provincial Archive in Opava (Zemský archiv v Opavě) covers north Moravia and Silesia [S11], [S16]. A parish inside the city of Prague goes to the Prague City Archives (AHMP), not SOA Praha. Each archive runs its own online register portal.\n- **Route the exceptions elsewhere** [S11]:\n  - Jewish registers: the National Archive (Národní archiv);\n  - military registers: the Military Central Archive;\n  - Prague registers: the Prague City Archives.\n- **Route a recent register by its book's last entry.** The registry office (matriční úřad) keeps a birth book for 100 years and a marriage or death book for 75 years after the book's last entry, then transfers it to the competent state regional archive [S14]. A book past that period is at the archive: find the volume in its catalogue, not at the registry office.\n- **Ask the registry office for an open entry in a book it still holds.** Access periods run from the entry itself: 100 years for a birth, 75 for a marriage, 30 for a death. If the entry is past its period but later entries keep its book at the registry office, ask that matriční úřad to let you inspect it. Under § 25b of Act No. 301/2000 Coll., anyone may then inspect the entry and take extracts in the registrar's presence, with no proof of relationship; the fee is 50 Kč per entry [S17], [S18]. After those periods, anyone may also request a certificate under § 25b without proving relationship [S18]. Do not record the register as lost.\n- **Use the archive's own viewer.** The Moravian Provincial Archive in Brno (Moravský zemský archiv, MZA) publishes the registers it holds in Acta Publica, filterable by church originator (Roman Catholic, Evangelical and others) and by civil registry office [S12]. Search the regional archive's online registers before you write to a parish.\n- **Read the volume type.** Czech register catalogues sort volumes by event: N (narození, births or baptisms), O (oddaní, marriages), Z (zemřelí, deaths) [S20]. Acta Publica writes the types out in full (Narození, Oddaní, Zemřelí), gives each index its own field (index narození, index oddaní, index zemřelí) and uses the letters in its notes, as in N+O [S19]. Open the index before paging through a year book. Search a woman's surname with the feminine -ová ending as well as the masculine form [S15].","sources":["S11","S16","S14","S17","S18","S12","S20","S19","S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5fb0643a4c73","kind":"method","anchor":"- **Ask as close family for an entry still inside its access period.** Inside the 100, 75 or 30 years, a registry office gives a certificate, an inspection or a verbatim extract (doslovný výpis) only to the person the entry concerns, that person's family and a few official or legal applicants; the extract can be a copy of the entry [S21]. The Act limits family to a spouse, partner, parents, children, siblings, grandparents, grandchildren and great-grandchildren [S21], so a great-great-grandchild has no family route. For an adoption, only the adopters and, from age 12, the adopted person may see the entry; if a court kept the birth parent secret, the adopted person must wait for full legal capacity [S21].","sources":["S21"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d68099c0c495","kind":"method","anchor":"- **Follow a marriage note from the baptism entry.** A note beginning *Getraut*, *Oddán* or *Cop.* records a marriage [S22]. Copy it word for word, decide from its wording and dates whose marriage it records, and open the marriage entry it points to. Use [Catholic baptism–marriage cross-notations](catholic-sacramental-cross-notations.md) to weigh it.","sources":["S22"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b8143c8a0d7a","kind":"historical","anchor":"- **Keep a legitimation note separate from the original entry.** A Czech legal dictionary cites a decision of 7 June 1877: a completed legitimation must be noted in the birth register, with the father's name entered and the parents' marriage mentioned [S23]. Record the entry as first written and the later note as two observations, then find the marriage.","sources":["S23"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a00776400f2a","kind":"method","anchor":"- **Do not read the mother's father as the child's father.** The father's name is normally missing from the entry of a child born outside marriage [S24], but the mother's column can still name her own parents, as *Tochter des* (daughter of) [S22]. A man named there is the child's maternal grandfather.","sources":["S24","S22"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-221fdef02fd0","kind":"portal-availability","anchor":"- **For Prague in 1850–1918, get birth details from the police registration sheets.** The National Archives' [conscriptions database](https://na.gov.cz/en/for-public/research-room/digital-research-room-archival-records-on-line/conscriptions-1850-1918) holds 664,651 sheets indexing 2,054,852 person records [S25 @2026-11-09]. A sheet gives the year and place of birth, religion, a married woman's maiden name and the household [S25 @2026-11-09]. Use the birthplace to choose the parish. Names are transcribed as written, so search variants such as Čapek, Czapek and Tschapek; a move to another Prague quarter made a new sheet, and sheets can disagree [S25 @2026-11-09]. The archive's list of covered areas includes Karlín and Smíchov but not Žižkov or Vinohrady [S25 @2026-11-09], so a miss for someone living in either says nothing.","sources":["S25"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b47a4e1f949d","kind":"portal-availability","anchor":"- **For a soldier, get birth details from the Military Central Archive's databases.** Its [Databáze VHA](https://www.vuapraha.cz/databaze-vha/) page searches by surname, first name, place and date of birth across legionnaires, the dead of both world wars, members of Czechoslovak units abroad in the Second World War and the Czechoslovak home guard in Italy [S26 @2026-11-09]. Treat a hit as a pointer and confirm the birth in the register.","sources":["S26"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ca66c1a0d909","kind":"portal-availability","anchor":"- **Check a portal's rules before any scripted reading.** SOA Praha's robots.txt bars ClaudeBot from the whole of eBadatelna and bars every automated client from its image paths [S33 @2026-11-09]. Porta fontium asks for 10 seconds between requests [S34 @2026-11-09]. A browser driven by an agent is still an automated client, so where a portal bars them, have the user open the image in their own browser and share it. At a 403, 429 or 503, stop and follow the block rule in [AI for documentary records](ai-for-documentary-records.md).","sources":["S33","S34"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8dbea4cceab9","kind":"method","anchor":"- **Find out how a volume is arranged before you jump by year.** A volume can hold several villages and record types in separate stretches, and you usually have to page through the images to find where each one begins [S27]. Porta fontium's volume page gives the order of the records and often the pages in each section [S27]; other portals may not. A jump by year can land in another village's stretch, so log which stretches you read. A \"not found\" covers only those.","sources":["S27"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4f47824ef96c","kind":"custody","anchor":"- **Check the birth cohort before you look for a Czech-lands service sheet.** The Austrian State Archives says the service sheets (Grundbuchsblätter) of conscripts born 1865–1886 are at the military archive in Prague, that earlier cohorts survive there only in fragments, and that those of men born 1887–1898 are largely destroyed [S32 @2026-11-09]. Its Vienna war archive has sheets online for cohorts up to 1864 and, for southern Bohemia and southern Moravia, for cohorts 1865–1900 [S32 @2026-11-09]. For a man born 1887–1898 elsewhere, start with the [casualty lists](galicia-bukovina-habsburg-record-routing.md#6-search-the-austro-hungarian-casualty-lists).","sources":["S32"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a370ffb5a912","kind":"portal-availability","anchor":"- **For a Jewish family, search the Familiant books as well as the registers.** The National Archives has put online all 190 volumes of its [Books of Jewish Familiants](https://na.gov.cz/en/for-public/research-room/digital-research-room-archival-records-on-line/books-of-jewish-familiants), and has added Moravian Jewish family books from other archives [S31 @2026-11-09].","sources":["S31"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4c7d1ccb8977","kind":"historical","anchor":"- **Before the registers, use the 1651 list and the 1654 tax roll.** The list of subjects by faith (Soupis poddaných podle víry) gives each person's name, status, occupation, age and religion, but mostly leaves out children under twelve [S28]. The National Archives' [Berounsko edition](https://www.nacr.cz/wp-content/uploads/2019/01/Berounsko_cele_H_zamceno.pdf) is one regional volume, as a PDF [S28]. The tax roll (berní rula) names the holders of taxable town houses, subject farmsteads and free courts; it survives for most of Bohemia and was not compiled for the Cheb region [S29]. A person who held no such property will not be in it.","sources":["S28","S29"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-493b2d458806","kind":"historical","anchor":"- **In Moravia and Silesia, use their own cadastres; the 1651 list and the tax roll are Bohemian sources, and not every Bohemian region has a surviving 1651 list.** Moravia's counterpart to the tax roll is the lánové rejstříky (lán registers). They were revised in 1669–1679; the first version survives only in fragments, so the first complete Moravian cadastre is the so-called second lánové rejstříky. Silesia's is the Carolingian cadastre of 1721–1729, revised 1733–1739 [S29]. Inside Bohemia, check that the 1651 list survives for the region: the lists cover most of the Loket, Beroun, Rakovník, Čáslav, Hradec, Bydžov and Chrudim regions, and none survive in the central fond for the Slaný, Prácheň and Litoměřice regions, Kladsko or the Cheb region [S29]. A miss for a region without lists says nothing.","sources":["S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f446fce62747","kind":"portal-availability","anchor":"- **To link generations, read the land books.** SOA Plzeň has published almost all its estate land books (pozemkové or gruntovní knihy) on Porta fontium: 6,083 volumes from 161 estate fonds, mainly for the Plzeň and Karlovy Vary regions, the oldest from 1558 [S30 @2026-11-09]. They name owners and often the relatives paid inheritance shares, and they record transfers, mortgages and marriage contracts [S30 @2026-11-09]. Elsewhere, check what the regional archive has put online.","sources":["S30"],"checked":"2026-11-09","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2ed519a2ac7e","kind":"portal-availability","anchor":"**Search the MyHeritage Opava indexes by event type** [S38 @2026-11-21]. Search under the event locality. All three collections include some places now in Poland [S39 @2026-11-21], [S40 @2026-11-21], [S41 @2026-11-21].","sources":["S38","S39","S40","S41"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f775c0d3a6bf","kind":"portal-availability","anchor":"- **Births and baptisms, 1800–1920.** Search civil births and church baptisms. Compare the child's name, birth date and place, and parents' names where indexed [S39 @2026-11-21].\n- **Deaths, 1800–1950.** Search here for civil deaths and church burials [S40 @2026-11-21].\n- **Marriages, 1800–1945.** Search civil and church marriages. Compare both spouses' names and birth dates, the marriage date and place, and parents' names where indexed [S41 @2026-11-21].","sources":["S39","S40","S41"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-91d603db1526","kind":"portal-availability","anchor":"Use the event locality and date to locate the register even when the index search comes up empty. For volumes held by the Provincial Archive in Opava, search *Matriky* in Digitální badatelna and check whether the volume has scans [S42 @2026-11-21]. Verify any index hit in the register entry.","sources":["S42"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b08d27304da3","kind":"platform-ui","anchor":"**Browse Matricula's Austrian fonds after an empty place search.** Enter the event locality in *Search for Places* [S49 @2026-11-22]. According to Katherine Schober's interview, a place-search miss is a reason to try *Fonds* [S47† @2026-11-22]. Open *Fonds* → *Österreich*, choose the archive or diocese for the region and confession, then open the parish listing and check its book types and dates [S48 @2026-11-22], [S50 @2026-11-22], [S51 @2026-11-22].","sources":["S49","S47","S48","S50","S51"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2aec0a57603b","kind":"portal-availability","anchor":"**Search the MyHeritage Vienna indexes by event.** For church marriages in 1850–1920, use *Austria, Vienna Church Marriages* (20425). Capture the wedding date and place, then compare the spouses' birth dates, ages and parents where indexed [S43 @2026-11-22], [S44 @2026-11-22]. For Catholic burials in 1850–1930, use *Austria, Vienna Catholic Church Burials* (21012). Look for the death date and burial place, then compare the birth date, age at death and names of parents or spouse where indexed [S45 @2026-11-22], [S46 @2026-11-22]. Use a hit to find the parish register entry. If the index comes up empty, continue with the address and parish route.","sources":["S43","S44","S45","S46"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2fb25744073c","kind":"method","anchor":"**Follow the confession and place named for each ceremony in a church-periodical report.** For a mixed-confession marriage, start with the church named for the wedding and work back from the report date when it gives a relative date. Treat a proposed second ceremony as a separate lead. If the report names the child's baptismal confession but gives only the settlement, identify the parish of that confession serving the settlement before searching. Use the reported ceremony to choose the first register even when a parent belonged to another confession [S52].","sources":["S52"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-50fed4155223","kind":"historical","anchor":"**Check both the Evangelical and Catholic death registers for an Evangelical death during the period of parallel recording before 1849.** Look in the Catholic parish that served the locality even if you already have an Evangelical entry, and look for the Evangelical book even if you already have a Catholic entry. Compare the details and log which series survives for the locality and date. The Chleby comparison shows that the two entries can give different accounts, and the Bystřice nad Olší comparison found some Evangelical deaths only in the Catholic books [S53], [S54].","sources":["S53","S54"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a37c73a90c64","kind":"platform-ui","anchor":"**Use the Acta Publica originator to check village coverage.** When a marriage note gives what appears to be a parish seat, search *Vyhledávání podle původce* for that parish and click the number in the *Obce* column of the candidate marriage book to see all localities it covers [S56 @2026-11-22]. Use the village named for the bride as the first section to check when the book is arranged by village. Keep the parish-seat section and other covered villages as alternatives [S55 @2026-11-22].","sources":["S56","S55"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09cb891ba168","kind":"method","anchor":"- **Route the parent's birth from the children's entries and the parents' marriage.** Compare any birth dates and villages those entries supply for the parent. A village may have its own section under a different parish name. Use the parent's birth village and year to select the parish birth register [S55].","sources":["S55"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6af18773ccb9","kind":"method","anchor":"- **Use a death annotation in a birth entry to find the death register.** Take the date and locality from the annotation and route the death through the parish covering that locality at the death date. Keep the birth annotation and the death entry as separate observations [S57].","sources":["S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-74181bb93709","kind":"method","anchor":"- **Keep the birth and baptism dates separate.** Read the event label or column heading in a Czech parish book, including in books kept as public records after the 1784 reforms. When the entry gives only a baptism date, log it as baptism and leave the birth date open [S58], [S59].","sources":["S58","S59"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b804397557d9","kind":"example","anchor":"- **Check the burial narrative for the cause of death in pre-1784 books.** Read the whole entry, including when the book has no separate cause-of-death column. The Mýto 02 burial entries for 1738–1741 start at page 530 and include an account of a death that would be missed by looking only for a dedicated field [S60], [S62].","sources":["S60","S62"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cf7a4dcc1604","kind":"method","anchor":"- **Look for the parish's loose death reports in district archive finding aids.** If the death entry points to a supporting paper or leaves a material detail unclear, search the parish-office fonds by parish name and look under *úmrtní lístky* (death slips). Record the fonds and inventory number separately from the register locator [S60], [S61].","sources":["S60","S61"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4e83119837f4","kind":"platform-ui","anchor":"**Find Czech Jewish registers through the National Archives' [Jewish registers page](https://na.gov.cz/verejnost/badatelna/digitalni-badatelna/zidovske-matriky)** [S64 @2026-11-23]. Open the HBMa inventory (finding aid 1646) in [Archivní VadeMeCum](https://vademecum.nacr.cz/vademecum/permalink?xid=f86bf41ed11ae5f01740720eed9e0dbb) and choose *Listování v pomůcce* (*Browse this aid*) [S65 @2026-11-23]. Look for a volume that matches the community, event type and year. Use this route when a guide points to Badatelna [S63 @2026-11-23].","sources":["S64","S65","S63"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4516d8261681","kind":"method","anchor":"- **Search both parishes for a baptism near the start of a separate register series.** For a Bošilec-area baptism around 1675–1676, check both Bošilec and Veselí nad Lužnicí [S66]. In the Třeboň archive, start with Bošilec register 1 (births 1675–1707). Veselí nad Lužnicí index 22 points to that Bošilec book [S67], [S68]. For the other original register, read Veselí nad Lužnicí book 1 (births 1641–1679) for the event village [S68]. Log both searches before treating the baptism as missing.","sources":["S66","S67","S68"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ed5c03a84d36","kind":"method","anchor":"- **Follow an authorised surname change from the birth-register note.** Record both surnames for the same person. Use the original surname for records before the decision and the authorised surname for later records, checking both forms around the change. Copy the issuing authority, decision date and decree number from the note and use them to look for the decision in the authority's records [S69]. Keep the dated note and any decision you recover as separate observations.","sources":["S69"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-70e8fbf8f055","kind":"example","anchor":"- **Match a foundling's baptism and death by given names and abandonment details.** Compare all given names, the dates and the recorded abandonment place across both entries. In Mýto 02 (scans 133 and 251, 18 and 29 July 1733), the published transcriptions match on both given names and the window where the child was left, although the death entry omits the baptismal surname [S62], [S70]. Read *k opatrování* in a magistrate's placement order as an assignment of care. Record the appointed caregiver or wet nurse in that role and read the abandonment clause separately for what it says about the mother [S70].","sources":["S62","S70"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-db428514c512","kind":"portal-availability","anchor":"- **For a deceased Prague resident, check the municipal population register when a police sheet is missing or disagrees.** The two series ran in parallel [S73 @2026-11-23]. Open the Prague City Archives' [Soupis pražského obyvatelstva guide](https://www.ahmp.cz/index.html/povstani/povstani/eng/index.html?mid=83) and follow its link to the *Archivní katalog* [S72 @2026-11-23]. Search the digitised cards in the older series (1830–1910) under the surname of the person with domicile rights. A wife or child may appear on the husband's or father's card [S72 @2026-11-23]. Open the card, list the household members shown there and compare the birth details or house numbers with any police sheet [S71 @2026-11-23], [S72 @2026-11-23]. Use the birth details to narrow the register search when the police sheet is missing.","sources":["S73","S72","S71"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-779ab0cd0b70","kind":"method","anchor":"- **Pair the estate's subject list and land book when a Bohemian cottage-holder's origin is unclear.** For Nová Ves (Temešvár), check the 1717–1718 subject list (inventory 97, frame 27) [S75] and the village land book in the Chřešťovice estate fonds (inventory 51, V AU 1/8, frame 3) [S76], [S77]. Keep an estate name as an estate-level lead and leave an omitted origin open [S74].","sources":["S75","S76","S77","S74"],"checked":null,"stated_as":"fact","review":"reviewed"}
