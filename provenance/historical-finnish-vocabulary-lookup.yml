claims:
  - {"id":"C-historical-finnish-vocabulary-lookup-1","kind":"method","anchor":"Use Kotus’s Vanhan kirjasuomen sanakirja for written Finnish from the 1540s through 1810. Try its advanced search for an apparent miss and compare the whole compound with its attested examples. For regional speech use Suomen murteiden sanakirja and compare the sense and its geographic distribution with the place the speaker or writer described. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-historical-finnish-vocabulary-lookup-2","kind":"portal-availability","anchor":"For a nineteenth-century written word, check the published part of Rapolan 1800-luvun sanasto. Use the dated citations to locate a period example. Leave a missing entry open because the published selection covers part of the collection. [S4 @2026-11-22] [S5 @2026-11-22] [S6 @2026-11-22]","sources":["S4","S5","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-historical-finnish-vocabulary-lookup-3","kind":"method","anchor":"For a missing or ambiguous headword, search dated newspaper and periodical texts in the Finnish National Library’s Digi. Try the printed inflections and read the page around each candidate hit. Use the named activity, component parts and location to choose the sense. Keep multiple readings if the passage describes only a setting or a list. [S7] [S8]","sources":["S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-historical-finnish-vocabulary-lookup-4","kind":"example","anchor":"When a list distinguishes kelkat from jääkelkat, as in the Tampere sidewalk report Kaisa Kyläkoski cites, retain both labels and use the setting to test the iceboat reading. Leave the construction open. [S8]","sources":["S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-historical-finnish-vocabulary-lookup-5","kind":"example","anchor":"Use the activity and materials to test the sense of jääkelkka. Kaisa Kyläkoski compares a piece of ice pushed at Teisko with boards, skates and a sail at Näsiselkä. Her downhill example establishes how the sled was used and leaves its construction open. [S8]","sources":["S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
