claims:
  - {"id":"C-f4605d9fba31","kind":"method","anchor":"Search the New Jersey Marriage Licenses index in MyHeritage for each spouse separately if a combined search fails or only one person is shown. Compare the underlying bride and groom index images where they survive. Keep variant-spelling rows together as possible duplicates until the year, file number and original record settle whether they describe one marriage [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2cfe0c94a34c","kind":"method","anchor":"Transcribe each date under its own field label. If MyHeritage shows a license application date, use it as an application date. Establish the ceremony date from the underlying record [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-92d90d447a7e","kind":"historical","anchor":"For 1915–1919, retain the whole State File Number with the marriage year. Read its first two digits as the volume and the last three as the certificate number. Keep the year because the certificate number resets. Those index images omit the place code. Confirm the place in the underlying record [S1], [S3], [S4].","sources":["S1","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-37077970d958","kind":"historical","anchor":"For 1920–1929, read the two-digit place code as a county code. For 1930–1964, keep the original code and take its first four digits for the place key. For 1965–1984, use the four digits as printed. MyHeritage’s collection announcement identifies a key for some codes. If the code is unresolved, leave the place provisional until you read the original. From 1985, read the field as an abbreviated place name [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-78242fbf2912","kind":"custody","anchor":"For 1915–1929, start with the marriage year and groom’s surname in the State Archives reel guides. For marriages through 1950 use the New Jersey State Archives holdings route. From 1951, use the Department of Health as custodian. For 1951–1957 also check the State Archives’ in-person microfilm and available bride indexes [S1 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22], [S5 @2026-11-22], [S6 @2026-11-22], [S7 @2026-11-22].","sources":["S1","S3","S4","S5","S6","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f6696e6f33e7","kind":"portal-availability","anchor":"Prepare a copy request for the underlying marriage record using the receiving office’s instructions. For a recent state record check the exact ceremony date, city and both names before submitting, and check identity and eligibility requirements for the kind of copy sought [S6 @2026-11-22], [S7 @2026-11-22], [S8 @2026-11-22], [S9 @2026-11-22].","sources":["S6","S7","S8","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-58cfd826a8f0","kind":"method","anchor":"Read the marriage record for the marriage date and place, spouses’ residences, birth details, occupations, prior marital status and any recorded details of their parents. Mark any missing fields individually [S1].","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
