claims:
  - {"id":"C-000000000001","kind":"custody","anchor":"For a Union volunteer, use RG 94, PI-17 Entry 534, NAID 655646. Browse by state, numbered organization and surname initial. Check the separate alphabetical file for U.S. Colored Troops and Veteran Reserve Corps and the relevant group for soldiers whose organization is unknown. For a Civil War Regular Army soldier, use PI-17 Entry 529, NAID 655638. [S2 @2026-11-22]","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"Make one row for each card. Copy rank, organization, admission date, complaint, hospital, disposition and the reference to the original record. For a transfer, treat the destination as the next place to search and verify admission there independently. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"custody","anchor":"According to the presenter, use the unit and battle date to narrow the facility search and check for a hospital associated with a known prison or parole camp [S1† @2026-11-22]. For an identified hospital, check RG 94’s field hospital records, 1821–1912, and its patient registers. For a fixed hospital, verify its holding location in the series description. Some fixed-facility series are held at regional archives. [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000004","kind":"custody","anchor":"For a volunteer, check the compiled service file’s personal papers for casualty reports, death and interment records and final statements. For a Regular Army soldier, look for descriptive lists and assignment cards in the separate Personal Papers series, NAID 654713. Check Certificates of Disability, NAID 654716, as its own series. [S4 @2026-11-22] According to the presenter, look for a medical descriptive list among the soldier’s papers for a hospitalization episode. [S1† @2026-11-22]","sources":["S4","S1"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000005","kind":"portal-availability","anchor":"For a Regular Army final account, use RG 94, Final Statements, 1862–1899, NAID 654719. Check the Fold3 copy when an older photocopy is unclear. Extract the sums due and look separately for an inventory of effects associated with a death in service. [S4 @2026-11-22] [S5 @2026-11-22]","sources":["S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
