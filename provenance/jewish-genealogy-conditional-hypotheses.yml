claims:
  - {"id":"C-b06df40533a7","kind":"unclassified","anchor":"Break that loop at the connection. Keep the documented descendant family intact, place the candidate ancestor alongside it, and give the unresolved edge an ID. Every claim reached through that edge must carry the ID until its own support no longer depends on the assumption. [S1–S4]","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-10784ab902e3","kind":"unclassified","anchor":"Ashkenazi deceased-relative naming is a custom with exceptions; Sephardi families can name children after living relatives. Determine the family's practice before asking the naming question. Americanized given names have no fixed reverse translation. Endogamy can make relationship predictions appear closer and permits more than one ancestral contribution. [S6, S7, S9, S10]","sources":["S6","S7","S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e286a6bbe3cc","kind":"unclassified","anchor":"K1 and A1 need not rise or fall together. In the Kiev case, a proposed brother connection meets different recorded fathers' names; a compound-name reconciliation is an additional identity hypothesis, not the solution to the relationship question. Test the name reconciliation rather than spending it as established parentage. [S2, S10, S11]","sources":["S2","S10","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d46f7f6f3f5d","kind":"unclassified","anchor":"A Russian-language civil record, such as a Soviet passport, may give a man a given name and a patronymic formed from the same civil name. That alone does not contradict a deceased-relative naming custom or show a recording error. Two distinct Hebrew names, for example Shlomo and Shalom, can both be rendered as the one Russian civil name Solomon. Before you reject the record or the stated parent, compare the birth or marriage entry, where the parent's name may appear in a different Russified form (for example Sholom or Shulim rather than Solomon), and keep A1 separate from C1. A [name-collapse discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) shows that this mechanism is possible. It does not show that it applies in any given case. Do not assume two different Hebrew names behind an identical civil pair without a record that shows them. [S14]","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a2928c9c9c60","kind":"unclassified","anchor":"Likewise, changing C1 from a deceased-relative expectation to a living-relative practice removes that route to a death-before-birth inference; it does not disprove K1. A naming clue can direct a death search while N1 and C1 remain unproved. Record the resulting search window as a scenario, not a death fact. [S6, S7, S11]","sources":["S6","S7","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d158d6819580","kind":"unclassified","anchor":"A candidate's registration or a death during a visit supplies a search place; it does not establish residence, birthplace or itinerary for everyone attached to the hypothetical branch. Keep those place propositions separate even after kinship is established. [S3, S5, S8]","sources":["S3","S5","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e962e44be0f8","kind":"unclassified","anchor":"Do not use a hypothesis-built branch, a chromosome-map label or a copied tree as independent confirmation of the assumption that produced it. Track the originating record or observation, not the number of websites displaying it. [S4, S5]","sources":["S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9be594d1854c","kind":"unclassified","anchor":"If the target's own Hebrew inscription is unavailable, a proposed sibling's gravestone can supply a candidate father's name. Record that name as conditional on the sibling proposition, which is a separate K1. It is not the target's own patronymic. A later burial in the origin area with that name, a plausible age and a matching town is still only a search hit. Test it against records that tie that man to the sibling's or the target's household. The [GeneaVlogger case](https://www.youtube.com/watch?v=2h6zplRuD28) motivates this step without confirming either the sibling link or the 1910 burial identity.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f6098594f35b","kind":"unclassified","anchor":"Use the general dependency-review rule when a premise changes. The Jewish-specific check is which of K1, A1, N1, C1, T1 and D1 actually changed: a new naming practice, a town-role correction and a rejected father have different consequences. Keep independently supported descendants and literal records. [S1–S5, S11]","sources":["S1","S2","S3","S4","S5","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-316824e2082b","kind":"unclassified","anchor":"First establish which naming practice is evidenced for this family. Even if deceased-relative naming fits, “the child was named Leib” does not show which relative supplied the name or when either candidate died. Keep “search for candidate deaths before the child's birth” as a task; leave both death dates unknown. A living-relative naming practice makes the proposed death deadline inapplicable. [S6, S7]","sources":["S6","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0330fd0ad716","kind":"unclassified","anchor":"Under H1, the first candidate's town is a useful place to search for Rivka's marriage or household. Preserve T1's actual record role. In Polish Books of Residents before 1932, permanent legal residence could differ from actual residence; do not carry that collection's rule over to every Jewish record. A record establishing the candidate's registration does not establish Rivka's birthplace, even if H1 is later supported. [S8]","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-71ff180cf761","kind":"unclassified","anchor":"Two separately documented Jewish descendant families share a surname. H1 connects their earliest men as brothers; H2 connects them more distantly; H3 leaves the link unresolved. Use these possibilities to find earlier records and identify appropriate descendants for a proposed comparison. The Nunes Vaz research illustrates the productive distinction between separately traced branches and their unresolved connecting ancestors. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f194efb450e4","kind":"unclassified","anchor":"Keep a DNA match as an observation. If you label it “from H1's father” using the hypothetical bridge, that label is an instance of D1, not a second piece of support for H1. An endogamous cousin can share DNA through additional paths; a documented relationship does not automatically assign every shared segment to that relationship. [S4, S9]","sources":["S4","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7d92ec543b96","kind":"unclassified","anchor":"If a proposed DNA test predicts the same result for H1 and H2, it does not distinguish them. A compatible Y-DNA result does not by itself identify a named father or reconstruct a migration itinerary. Do not turn the case presenter's confidence into your conclusion. [S2, S3]","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7d925a51490d","kind":"unclassified","anchor":"For a small Sephardic or Mizrahi component in an otherwise Ashkenazi ethnicity estimate, treat the estimate as an unresolved lead. Look for matches whose own ancestry is largely only Sephardic or Mizrahi. A mixed Ashkenazi ancestry label alone does not distinguish these explanations; retain such matches for separate pedigree and interval checks. If a surname or place hint appears, search both the Sephardic and the Ashkenazi record sets for that community. The [presenter's answer](https://www.youtube.com/watch?v=zOzzh0xDYY0) motivates this step. It gives no match count or threshold and proves nothing on its own.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
