  - {"id":"S51","kind":"web-page","urls":["https://education.myheritage.com/article/the-science-behind-the-myheritage-dna-ethnicity-estimate-v2-5/?lcpt=article"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"6f298c14aa98a87eada320a95834fdecd8bd18d5922736f0c30838b82d54ed4b","claims":["C-cc69a98ad42e","C-0d4520b3f11f"],"review":"reviewed"}
  - {"id":"S52","kind":"web-page","urls":["https://www.ancestry.com/c/ancestry-blog/ancestry-news/2024-ancestrydna-update?geo-lang=pt"],"published":"2024-10-10","retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"d690012ad9013fcdce9bfda954b033621a3aed7fe92ed4ce2f4f6a0fd474e7e1","claims":["C-986ea08d43d2"],"review":"reviewed"}
  - {"id":"S53","kind":"web-page","urls":["https://familytreemagazine.com/heritage/a-genealogists-research-guide-to-the-caribbean/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"d5327eead21b6ed0bcba75d74f34ddf3a77f9b244283518716a7b4cf4ad72fe5","claims":["C-0bc2a6645bb4"],"review":"reviewed"}
  - {"id":"S54","kind":"help-page","urls":["https://redir.ancestry.help/hc/en-us/articles/53933302695443-Indigenous-Americas-Regions"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"ede38c3b1e3de791144aa73dded2f6d4ffc1c7d9117e6971627ded4ba97ce921","claims":["C-0bc2a6645bb4","C-cc69a98ad42e"],"review":"reviewed"}
  - {"id":"S55","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/an-answered-prayer-i-found-my-real-dad-with-myheritage-dna/"],"published":"2025-01-02","retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"7771ed6cb518544766eda9c1e3dc96fe09250607ee8c563c57754a89c0138ca1","claims":["C-d428b45e9e25"],"review":"reviewed"}
  - {"id":"S56","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/16844152-how-do-i-confirm-my-relationship-with-a-dna-match"],"published":"2026-10-15","retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"32c263f09486e8c541dab4f9c771d1cbae382c8de81892bdd1d1277cda0d7899","claims":["C-d428b45e9e25"],"review":"reviewed"}
  - {"id":"S57","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852456-what-does-the-percentage-of-shared-dna-mean"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"003dab1c0067fa0e16d451305eba063da6cd997f09c376e17ef8916a819c1f33","claims":["C-d428b45e9e25"],"review":"reviewed"}
  - {"id":"S58","kind":"web-page","urls":["https://blog.myheritage.com/2025/02/getting-the-most-out-of-your-dna-results/"],"published":"2025-02-27","retrieved":"2026-11-22","access":"read","rights":null,"basis":"read 2026-11-22","entry_sha256":"e74f6c863d9fbc34846bc8ce01f0a890cc78925c4a196147dbfcdf291efd56a5","claims":["C-e7ca8605f824"],"review":"reviewed"}
claims:
  - {"id":"C-4b1e7a90c2d1","kind":"method","anchor":"- Accepting a share of a few percent as an established origin. MyHeritage's own help centre says small findings may be noise. [S3]\n- Rejecting a documented German line because the German-labelled category is low or missing. German ancestry is often reported under neighbouring regions. [S7], [S8]\n- Reading a difference between a parent's and a child's estimates, or between two siblings', as a sign about the relationship. [S3]\n- Treating GEDmatch admixture output as a second opinion that confirms or overturns the testing company's estimate. GEDmatch itself says its results could vary from the company's. [S6]\n- Dismissing a share of about half in a precisely detected population that the known parents cannot explain, or announcing a parentage conclusion from it. [S5], [S10]","sources":["S3","S7","S8","S6","S5","S10"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8f03d6a2b7e4","kind":"method","anchor":"- **Continent first.** 23andMe's published method assigns each short stretch of DNA to the most specific population it can call with confidence. When it cannot tell, for example, Scandinavia from the British Isles, it falls back to a broader region, and a stretch it cannot place at all stays unassigned. Its cross-validation found precision above 97% and recall above 92% for continents at the lower threshold, with wider variation among finer populations. [S5]\n- **Regions are not countries.** MyHeritage describes the boundaries between ethnicity groups as blurry and not confined by modern political borders, so a result may point to a neighbouring group with shared ancestry. [S3] Russell, comparing five companies, finds the numbers strong at the continental level and still problematic at the regional or country level. [S7]\n- **Precision differs by population.** At the lower threshold, 23andMe's Ashkenazi Jewish population reached 99.3% precision and 98.6% recall; its Central & West Europe population reached 79.7% and 81.3%. These figures were measured on reference individuals of unmixed ancestry. [S5]","sources":["S5","S3","S7"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1c9a5e3f7b20","kind":"method","anchor":"The MyHeritage post behind this rule says a reported origin can be trusted even at 2%. [S1] That is not followed. MyHeritage's help centre says small percentages may be noise rather than an ancestral signal and may not indicate a meaningful heritage connection [S3], and its 2017 announcement of the ethnicity analysis warned of false positives, especially at very low percentages [S4].","sources":["S1","S3","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d27b84e1a6f9","kind":"method","anchor":"Do not reject a documented German line because the German-labelled category is low or missing. Family Locket's guide to German DNA research says neighbouring ethnicities are common on German results and that ethnicity is less reliable for German ancestors. [S8] Russell traced her father’s German ancestry for roughly 400 years, yet her Scandinavian estimates ran from 5.4% at 23andMe to 66.9% at MyHeritage [S7]. In 23andMe's cross-validation, Central & West Europe had the lowest precision of its European populations, and its recall fell to 64.4% at the stricter threshold. [S5]","sources":["S8","S7","S5"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6e0f2c9b4a13","kind":"method","anchor":"Read the German-labelled share together with the neighbouring and broad north-west and central European shares as one block. Test the German line with matches whose ancestors come from documented German places, and with records [S8], not with the label. Do not open a new Scandinavian, French or East European line on the strength of a neighbouring label alone.","sources":["S8"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a35d71f0e8c6","kind":"method","anchor":"In the *Family Tree Magazine* interview, Kitty Cooper describes German ancestry appearing under neighbouring European labels [S2].","sources":["S2"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0b8e6d4a2f75","kind":"method","anchor":"A child does not inherit a parent's percentages. [S1] Each child receives a random half of each parent's DNA, so the share from each grandparent can differ from a quarter (MyHeritage's example is 30% and 20%), siblings can carry different proportions from the same ancestors, and a distant line can leave little or no detectable DNA. [S3] A child's share of a region can therefore be larger or smaller than a parent's, or missing. Russell reports that four siblings received the Scandinavian label and the fifth received North and West European [S7]. Record those labels with the individual results before comparing siblings.","sources":["S1","S3","S7"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f19c3b5e7d02","kind":"platform-ui","anchor":"GEDmatch's Admixture (Heritage) tool offers calculators from five projects, many of them with several calculators. GEDmatch says the results could vary from the testing company's estimate and advises choosing the project and calculator that fit your known ancestry; for example, it recommends Eurogenes K36 for mostly European ancestry and Eurogenes Jtest when there is also an Ashkenazi Jewish background. [S6 @2026-11-16]","sources":["S6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-72a4e0d9c8b1","kind":"method","anchor":"Cooper distinguishes regional estimates from matching relatives in the interview [S2]. Use shared DNA to test a proposed relationship.","sources":["S2"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-c5f81a26e3d4","kind":"platform-ui","anchor":"GEDmatch's calculators become available once a kit's upload is complete [S6 @2026-11-16]. If the tester's kit is not already there, uploading a raw DNA file to get another estimate is a data transfer to a matching database. Before it, answer every item of the [privacy gate](../SKILL.md#privacy-gate) in writing, including who can see and match the kit and whether law-enforcement uploads can match it, and get the tester's explicit permission for this upload to this destination. Apply the consent and redaction rules in [AI for DNA research](ai-for-dna-research.md#verification--privacy-discipline). If any answer is unknown, do not upload; read the testing company's estimate instead.","sources":["S6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3d6b9f07a1e8","kind":"method","anchor":"Compare the estimate with what the documented parents could have passed on. A share of about half in a population that neither known parent belongs to, or a share of only about half when both known parents belong to it entirely, is not ordinary inheritance variation (§4). When the population is one the model detects precisely, treat it as a parentage lead. Ashkenazi Jewish ancestry is the clearest case: 99.3% precision and 98.6% recall in 23andMe's cross-validation. [S5]","sources":["S5"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e8a2c4d16b59","kind":"example","anchor":"Compare the percentage lead with an actual relative match. In Greschler’s account, a 49.9% Ashkenazi estimate preceded a direct 23andMe match to the donor [S9]. In a separate case, four companies estimated a tester with four Jewish grandparents at about half Ashkenazi. She shared only 69 cM with her legal father’s brother, then 495 cM with a grandson of the proposed donor’s brother [S10]. Record which comparison tests each relationship.","sources":["S9","S10"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-59f7e3b0d2a6","kind":"example","anchor":"Cooper also mentions donor conception after an unexpected half-Jewish estimate, without giving a match or shared-DNA amount for that account [S2].","sources":["S2"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fe0faf8146fa","kind":"method","anchor":"If a percentage estimate omits an expected place, check whether the testing company's reference panel covers the population you are investigating. A gap in reference coverage can explain the omission, according to Ancestry's documentation [S14] and the submitted extract from the Family Tree Magazine episode [S13†]. Keep the ancestry question open and test the line with records or matches.","sources":["S14","S13"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-eec81ea1f333","kind":"method","anchor":"Use the places highlighted in a DNA community or location report to choose localities for a historical record search, as the Family Tree Magazine search-result extract recommends [S11†]. Read the community timeline as group history [S12]. Establish when each ancestor lived there and for how long from records.","sources":["S11","S12"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-24d84cf66d45","kind":"platform-ui","anchor":"To see which parental side AncestryDNA assigns a painted segment to, use the tester's existing results. With an Ancestry family history membership, open **DNA → Origins → By parent → View chromosome painter** and switch between the two parent views, labelled **Maternal** and **Paternal** when the sides are named. The colours show estimated regions and can change when the estimate is updated. Read matching colours on two charts as matching region labels and use shared DNA to test relationships. [S17 @2026-11-18]","sources":["S17"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1dfceca8fdb9","kind":"platform-ui","anchor":"Keep the numbered labels Parent 1 and Parent 2 until you can identify a side, for example by checking where Ancestry placed a DNA match whose side you already know. [S18 @2026-11-18]","sources":["S18"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-502719a70f95","kind":"method","anchor":"According to the submitted extract [S15†], the presenter suggests switching between the two parent views in the Family Tree Magazine episode's Tree Talk segment on Chromosome Painter [S16].","sources":["S15","S16"],"checked":"2026-11-18","stated_as":"observation","review":"reviewed"}
  - {"id":"C-7b6f87166308","kind":"platform-ui","anchor":"Read the **Ethnicity Estimate** percentages as population estimates. Use **Genetic Groups** as geographic leads to regions or cities. Record a Genetic Group by name without assigning it the percentage of the ethnicity under which it appears. [S21 @2026-11-20] [S22 @2026-11-20]","sources":["S21","S22"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1c45bb0afdd9","kind":"platform-ui","anchor":"Open the tester's Genetic Group from **DNA → Ethnicity Estimate**. Compare periods on the **Timeline Widget** to follow the group's migration. For the period under research, expand **Top Places** to shortlist localities for record searches. Use the period and places as group leads and establish the ancestor's residence from records. [S19 @2026-11-20] [S20 @2026-11-20] [S21 @2026-11-20]","sources":["S19","S20","S21"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-aba05c000fe2","kind":"platform-ui","anchor":"For a kit already linked to a tree, open **DNA → Ethnicity Estimate** and select **Family tree events** on the map. Use the ancestral birth pins to compare the tree's localities with the estimate. Treat the pins as assertions from the tree and check the underlying records. [S23 @2026-11-20] [S24 @2026-11-20] [S25 @2026-11-20]","sources":["S23","S24","S25"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6da4de5f7c14","kind":"method","anchor":"If a MyHeritage v0.95 assignment is unexpected, check which versions are available for that kit. Compare its v0.95 and v2.5 estimates using available or saved results, and check both against its Genetic Groups and documented genealogy. If the assignment disappears and the revised estimate fits the groups and records, treat model error as a possible explanation. [S22], [S26]","sources":["S22","S26"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d11764815b08","kind":"example","anchor":"In MyHeritage's published comparison for one kit, an 8% Greek and South Italian assignment in v0.95 disappeared in v2.5. [S22]","sources":["S22"],"checked":"2026-11-20","stated_as":"observation","review":"reviewed"}
  - {"id":"C-8517dc91f4f4","kind":"platform-ui","anchor":"When the tester already has both reports, use the **Ethnicity Estimate** for modern population estimates going back a few hundred years. Use **Ancient Origins** for comparisons with ancient DNA samples and populations from the Neolithic through the late Middle Ages. Record which report and time frame each result came from. [S27 @2026-11-20] [S28 @2026-11-20]","sources":["S27","S28"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3e1ee86c6fd9","kind":"platform-ui","anchor":"Read **Closest Populations** as the 50 highest-ranked single populations. In **Genetic Similarities**, compare the leading combination with other high-ranking entries among the 50 models in the selected **dual origin** or **triple origin** view. A lower **Genetic Fit** score means a closer fit in that comparison. Keep competing combinations open when different reference populations give a similar fit. [S27 @2026-11-20] [S28 @2026-11-20]","sources":["S27","S28"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08cf33b723b9","kind":"platform-ui","anchor":"On a **Genetic Distance Map**, find the black **You** label and inspect nearby ancient population or sample points. Compare the points with one another for clusters and outliers. Read proximity on this plot as genetic similarity and require separate evidence of descent from any named population or individual. [S27 @2026-11-20] [S28 @2026-11-20]","sources":["S27","S28"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c5171237fcc4","kind":"method","anchor":"For an enslaved ancestor's African origin, use existing DNA matches with documented ancestral ties to African or diaspora communities to shortlist possible regions. Check the proposed line in plantation records, wills or bills of sale. Treat a match's present-day location as insufficient to assign an ancestral birthplace or voyage. [S29], [S30] To trace the line across 1870, use [US freedpeople record recovery](us-freedpeople-record-recovery.md).","sources":["S29","S30"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5ff9b9265808","kind":"method","anchor":"When testing descent from a specific Native American tribe, use an ethnicity estimate as a geographic lead. Use shared DNA to test the proposed family relationships and trace the line to a named ancestor in records for the relevant tribe or reservation. For a deceased ancestor, look for the appropriate historical reservation census or tribal roll through [US tribal enrollment record recovery](us-tribal-enrollment-record-recovery.md). [S31], [S32], [S33]","sources":["S31","S32","S33"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1df42cba9cef","kind":"method","anchor":"When looking for an unknown parent's family, shortlist a country if it recurs among distant DNA matches and fits the broader ethnicity estimate. Check whether those matches share DNA with known relatives on either side, and verify the ancestral places suggested by their trees in historical records. Keep the country and parental side tentative until the matches and records support the proposed line. [S34], [S8]","sources":["S34","S8"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f4c845c655b8","kind":"platform-ui","anchor":"On MyHeritage, open **DNA → Overview** in the tester's account and check the existing DNA Matches breakdown. It groups matches by estimated relationship and by country of residence. Use the country breakdown to prioritize a lead and keep matches from other countries in the shared-DNA comparison. [S35 @2026-11-21]","sources":["S35"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e61f08d38f9a","kind":"example","anchor":"In the published account, the close match that advanced the paternal search was in the United States while the family's initial lead was Denmark. [S34]","sources":["S34"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-e7ca8605f824","kind":"method","anchor":"When comparing existing estimates from different providers, check the reported populations and reference panels for each estimate version before treating labels as equivalent. Look for a broader or differently named category when one label is missing. Keep each provider's percentage separate and confirm a recurring lead with records or DNA matches. [S42], [S58]","sources":["S42","S58"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-041c5ab9b601","kind":"method","anchor":"According to the submitted interview excerpt [S44†], Southard suggests comparing estimates across providers and checking which Jewish populations each reports. If a detailed Jewish label appears in only one estimate, compare the providers' category descriptions before reading the missing label as a difference in the underlying ancestry. [S22], [S37]","sources":["S44","S22","S37"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-986ea08d43d2","kind":"historical","anchor":"When reading AncestryDNA notes predating the 2024 update, match **Ethnicity Estimate** to **Ancestral Regions** and **Communities** to **Ancestral Journeys**. [S52] According to the submitted interview excerpt [S44†], Southard explains these names in the context of the 2024 update.","sources":["S52","S44"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d8ae8de3a5ad","kind":"platform-ui","anchor":"Open **DNA → Origins → Regions**, select the reported region and compare its map and percentage range with the place under investigation. Use the area shown when the name suggests a modern border. Use a macro-region to organize the nested estimates, and record the nested regions and their ranges. A macro-region has no separate reference panel or estimate. [S36 @2026-11-22] [S37 @2026-11-22] According to the submitted interview excerpt [S43† @2026-11-22], Southard suggests opening the map when the name could mislead.","sources":["S36","S37","S43"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-fb8d21c0201a","kind":"platform-ui","anchor":"For a recent migration, open **DNA → Origins → Journeys** and select the journey that includes a place where the ancestor is documented. In the map and timeline, work back from that place to earlier stops and use the places and periods to choose record searches. Treat the routes as group history. A finely named percentage region still belongs in **Regions**, even if its name sounds as specific as a Journey. [S12 @2026-11-22] [S37 @2026-11-22] According to the submitted interview excerpt [S44† @2026-11-22], Southard suggests using a later known place to look for earlier ones.","sources":["S12","S37","S44"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bfd832a6a5af","kind":"method","anchor":"When the tester plots near a single reference population, check whether combinations of other reference populations could occupy the same part of the plot. Keep multiple explanations for that proximity open. [S46] In one published Ancient Origins comparison, the tester reported that a combination of Ashkenazi Jewish and British Isles references fell near the North Italian points. [S45]","sources":["S46","S45"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-51eb7f7c53d1","kind":"platform-ui","anchor":"If the tester already has an **Ancient Origins** report, open **Notable Individuals** and read each genetic-fit result as proximity to that person's sample. Leave descent and family relationship claims open pending separate evidence. [S40 @2026-11-22] [S41 @2026-11-22]","sources":["S40","S41"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0bc2a6645bb4","kind":"method","anchor":"For a possible Indigenous Caribbean line, check whether the provider's reference panel and region map distinguish the island under investigation. Read the estimate at the geographic level the panel supports. Check the proposed line in church records and historical accounts when the percentage is broad or missing. [S53], [S54]","sources":["S53","S54"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cc69a98ad42e","kind":"method","anchor":"If available estimates from cousins on a documented branch omit a region you expected from that branch, keep the branch in the comparison. A cousin may have inherited none of the relevant DNA or too little for the model to report. Apply the same test when the region is missing in your own estimate and a cousin shows only a small share, which may be noise. Use shared DNA and documented descent to test the branch. [S49], [S50], [S51], [S54], [S3]","sources":["S49","S50","S51","S54","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d428b45e9e25","kind":"platform-ui","anchor":"If ethnicity results raise a full- versus half-sibling question on MyHeritage, open **DNA Matches → Review DNA Match** for the existing sibling match and record the total shared cM. Treat the displayed relationship as a hypothesis. A **Confirmed relationship** label records a user's prior selection. Test the relationship with shared DNA as described below. [S55 @2026-11-22] [S56 @2026-11-22] [S57 @2026-11-22]","sources":["S55","S56","S57"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-91b3c77d267e","kind":"platform-ui","anchor":"If the tester's AncestryDNA subscription and kit show **View regions by parent and grandparent**, open it from **DNA → Origins → By parent**. Read the shares as estimates of the DNA that reached the tester, including from untested grandparents. Keep the tool's labels until known-side matches or other evidence identify the branches, and leave any unassigned share open. [S37 @2026-11-22] [S38 @2026-11-22]","sources":["S37","S38"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8bf7d4f41544","kind":"platform-ui","anchor":"In an existing 23andMe+ Premium report, open **Parental Inheritance** to compare **Parent 1** and **Parent 2**, even without a connected parent. Check the confidence table at both stricter levels before assigning a region to a side and record any inconclusive result. Keep the numbered labels until independent evidence identifies the parents. [S39 @2026-11-22]","sources":["S39"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0d4520b3f11f","kind":"method","anchor":"When a substantial unexpected region recurs in existing results from siblings or across generations, compare the results with the documented origins of the branches those testers share. If a branch is unresolved, use the region to prioritize matches to that branch and test the connection with shared DNA and records. Keep the source of the estimate open until then. [S47], [S49], [S51]","sources":["S47","S49","S51"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-324316c3ed35","kind":"example","anchor":"Check the closest existing DNA matches before settling on historical population mixing as the explanation for a large unexpected share. In one published account, a close match pointed to an unexpected parent after the tester initially attributed her result to population history. [S48]","sources":["S48"],"checked":null,"stated_as":"observation","review":"reviewed"}
