claims:
  - {"id":"C-6f2638640f97","kind":"portal-availability","anchor":"For 1921 and earlier, start with the state district archive route. Identify the locality's judicial or administrative district for the census year. Where a district court prepared the return, use that court's period jurisdiction to choose the district archive. Verify the municipality and year in its catalogue before looking for the household. [S1 @2026-11-22] [S2 @2026-11-22] [S7 @2026-11-22]","sources":["S1","S2","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8c0729bca123","kind":"example","anchor":"Lednická and Jáchimová's Telč example sends Telč-area returns to SOkA Jindřichův Hradec because the historical Telč judicial district fell under Jindřichův Hradec. If an archive assignment looks unexpected on a modern map, test it against the census-era jurisdiction. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-35679d76989f","kind":"method","anchor":"Use [place-name resolution](historical-place-name-resolution.md) for competing Czech and German names. Search for *sčítací operáty* by locality and year, looking under the historical parent municipality for a small settlement. Use any name index as a pointer to the return. If the index is absent or misses the household, browse the town or district return by municipality, year and house number. [S1] [S12] [S13]","sources":["S1","S12","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f7641b846bc5","kind":"portal-availability","anchor":"Use the Moravian Land Archives' [Sčítací operáty](https://www.mza.cz/scitacioperaty/) for the districts it lists, including in South Moravia, and the Land Archives in Opava's [Digitální badatelna](https://www.archives.cz/web/digitalni_badatelna/informace/) for its north Moravian and Silesian districts. Use Třeboň's [DigiArchiv](https://digi.ceskearchivy.cz/DA?lang=cs) for South Bohemia and the part of Vysočina it covers. Check the archive's listed districts for the specific locality. For the State Regional Archives in Hradec Králové, follow its [guide to the separate census search](https://soahradec.gov.cz/napoveda-archivu-online/jak-nalezt-scitaci-operat/) to locate dated returns. [S1 @2026-11-22] [S6 @2026-11-22] [S7 @2026-11-22] [S8 @2026-11-22] [S13 @2026-11-22]","sources":["S1","S6","S7","S8","S13"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f060bb1dbd5e","kind":"portal-availability","anchor":"For a deceased person in 1910, search MyHeritage's *1910 Czechia Census* by name, birth details and residence. Use the original schedule to check the birth date and place, who was listed in the household and their stated relationships. Continue with the archive for the specific locality and house when the index gives no hit. [S9 @2026-11-22] [S10 @2026-11-22]","sources":["S9","S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2ddd5859acd1","kind":"method","anchor":"When a year is missing online, check whether the responsible district archive lists the return for that municipality and whether the images cover the locality and house. The Moravian Land Archives' search guide covers missing years in its own application. Use [archival image coverage](archival-image-coverage-verification.md) when the catalogue and images leave survival or digitization open. [S2] [S12]","sources":["S2","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-aec9f72b30c5","kind":"method","anchor":"For Central Bohemia, check the responsible district archive's holdings for the individual year. The community walkthrough's report that SOA Praha schedules were undigitized describes November 2024. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a4d59535ffa5","kind":"example","anchor":"For Pustina (Einöde) in 1900, Lednická reported an unavailable return and left both an unscanned return and a lost return possible. The linked western Bohemian return images could not be opened during the source check. Keep the gap open until the archive or its catalogue establishes coverage for that year. [S11]","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bda30237bec9","kind":"portal-availability","anchor":"For 1930, use the Czech National Archives in Prague. Its copy-request page also identifies a digital reading-room route for consulting a specified return. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4cf54cc92b35","kind":"historical","anchor":"The community walkthrough describes access by request in November 2024. Check the archive's own instructions for the access options. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-71106f11bbe0","kind":"portal-availability","anchor":"**Privacy gate:** <!-- privacy-gate: request --> The Czech National Archives can receive the applicant's details and information identifying household members who may still be living. Answer the privacy gate before sending those details. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6b2f724a4d87","kind":"portal-availability","anchor":"Prepare a request for a 1930 census copy only after matching the year and locality to the custodian and checking its current form. Supply the house number when established. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5bf6c9916c54","kind":"method","anchor":"Use the headings of the 1857 form in hand. It asked fewer questions than the first modern census in 1869 and later returns, so record an absent column separately from a blank answer. Earlier forms can give counts of sheep, pigs, goats or beehives. The published 1921 questions omit those counts. [S1] [S4] [S5]","sources":["S1","S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9527aec05193","kind":"method","anchor":"Record *domovská obec* as the municipality where the person reportedly held *domovské právo* (right of domicile). Keep it separate from birthplace and residence, then use that municipality's home-affiliation records to test it. [S1] [S2] [S5]","sources":["S1","S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fe22f2e4ec16","kind":"method","anchor":"Copy the wording of the column and the answer. Read *obcovací řeč* as the recorded language of everyday use. For 1921, transcribe the declared nationality and distinguish it from citizenship and the earlier language question. The 1921 census counted people present, so check residence separately. [S1] [S4] [S5] [S14]","sources":["S1","S4","S5","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6a204f0e1a00","kind":"example","anchor":"Use the nationality entry when a surname suggests a different language. In Lednická's 1921 Pustina account, a household with a Czech surname declared German nationality. That example comes from the account, whose linked return images could not be opened during the source check. [S11]","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7636487d849d","kind":"method","anchor":"Read *čp.* as *číslo popisné*, the house number. Read each household division under that number and record the occupants, stated relationships, occupations and locator for each division. Keep an explicitly vacant division in the house record and count only occupied divisions in the occupied-household total. Lednická's 1921 Pustina account describes a vacant third division at čp. 145. The linked images could not be opened during the source check. [S11]","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c337b02560b8","kind":"example","anchor":"Check each resident's recorded occupation before assigning a job associated with a building. In the same 1921 Pustina account, Lednická found no resident listed as a forester at the forester's lodge, čp. 149. The linked images could not be opened during the source check. Report what the occupation column says and keep any further inference about who worked there open. [S11]","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e5bfc84026bf","kind":"method","anchor":"Browse births and deaths for the same house number just before and after the census date. Use [Czech confessional and civil register routing](austrian-confessional-register-routing.md) to choose the register. Log the people, event dates, house numbers and register locators. Use the entries to assess probable occupancy while leaving the identities of census-date residents open. [S11]","sources":["S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2052fec88446","kind":"example","anchor":"For Pustina čp. 148, Lednická reported a 1919 death and a 1923 birth for different families at the house and found no 1921 house sheet. The linked census images could not be opened during the source check. Use the dates to bracket probable occupancy and leave the 1921 occupants unresolved. [S11]","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
