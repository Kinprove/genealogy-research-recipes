claims:
  - {"id":"C-000000000001","kind":"historical","anchor":"Treat *ordinary* in Virginia as a lead to a tavern or public house. Check the county’s rules and recorded rates before assuming the premises offered a fixed-price meal. Look in the county court’s dated orders for the grant or renewal of the license and copy the licensee and place as recorded. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"According to the presenter, start a Buckingham Road search with the study of its taverns, ordinaries and coffee houses [S1†]. Use Agnes Gish’s site vignettes to identify the operator and place, then follow the cited court, tax or property records. Preserve spellings and locate the road as it ran on the event date. [S2]","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000003","kind":"custody","anchor":"For a turnpike lead, use the Library of Virginia’s Board of Public Works inventory under the road company’s name. Look for plans, surveys and correspondence that place the road and its landmarks. Compare their dates to the ordinary’s license before using the surviving road alignment. [S4 @2026-11-22]","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"custody","anchor":"Use the Library of Virginia’s Mutual Assurance Society guide for a possible insured structure from 1796 onward. For the pre-1867 policies, search by locality and policyholder, and check the separate tavern or hotel listings on miscellaneous reels 776–780. In the declaration, compare the insured person, occupant, location and building use with the dated license. [S5 @2026-11-22]","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
