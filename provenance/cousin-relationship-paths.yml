  - {"id":"S4","kind":"web-page","urls":["https://blog.myheritage.com/2022/01/2021-myheritage-year-in-review/"],"published":"2022-01-03","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Used the MyHeritage Blog post's description of the redesigned tree view's diagram for tracing a path from the user to a relative. Checked the website steps against S5.","entry_sha256":"d8cff2580de0afc0f9f388088b0ad8b2cf6c63741c2204921b24002cae109298","claims":["C-05"],"review":"reviewed"}
  - {"id":"S5","kind":"help-page","urls":["https://education.myheritage.com/article/visualizing-family-relationships-with-relationship-diagrams-and-color-coding/"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Used the website instructions for opening the relationship from the profile panel and the condition that the user be associated with the tree.","entry_sha256":"c9c45dd0a48c2a07a06c825420f46917fa8298061568a0dc1b56e801f6b8a4fc","claims":["C-05"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://blog.myheritage.com/2024/10/1st-2nd-and-3rd-cousins-explained/"],"published":"2024-10-03","retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Used the author's suggestion to start with great-great-grandparents and check their children's lines, and the descriptions of cross and parallel cousins. Used S7 to check the limits of the DNA estimate and S8 to check the scope of the kinship terms.","entry_sha256":"fcdeb5852fd48dfab6a8b9f3bb38e81703a99c54acc3702b60306de0126b1cef","claims":["C-06","C-07"],"review":"reviewed"}
