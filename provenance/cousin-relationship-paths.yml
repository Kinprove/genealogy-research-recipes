  - {"id":"S3","kind":"pdf","urls":["https://cms-z-assets.familysearch.org/b1/77/ecce06334751b2d78320191150c5/family-relationship-chart.pdf"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Used the chart cells to verify cousin degree, removal and the avuncular boundary, including the intersection for two great-great-grandchildren of the common ancestor.","entry_sha256":"e7642682f1414c11900a10c8aff8ada04dffdaa844db50e04efe8395c09941b7","claims":["C-01","C-04","C-07"],"review":"reviewed"}
