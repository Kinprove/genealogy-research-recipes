  - {"id":"S11","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852747-why-don-t-i-see-relationships-in-my-online-tree"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the documentation for opening the diagram from the label beneath a person's name, including the generic Relative label in large trees.","entry_sha256":"f5cb6293f407dfc215128d58bfa81e143d5e014f66424dd3f90222f2ce6ff97c","claims":["C-08"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://blog.myheritage.com/2023/02/daniels-favorites-10-myheritage-features-our-genealogy-expert-cant-live-without/"],"published":"2023-02-21","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the author's Relationship Report walkthrough for selecting two people and following their chart, and the author's description of the PDF and print controls. Checked the website workflow against S5.","entry_sha256":"62497afba18a94a47f8deb364702e3b0489e6785040b5e5d1ca538d748ea5abe","claims":["C-10","C-11"],"review":"reviewed"}
  - {"id":"S13","kind":"web-page","urls":["https://blog.myheritage.com/2024/10/understanding-the-meaning-of-once-removed-in-genealogy/"],"published":"2024-10-10","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the warning that a census household can make cousins and cousins once removed look like members of the same pedigree generation. Used S14 to determine what the census relationship column means in the stated example.","entry_sha256":"b82f9adb3d388511d142444fa7b8304ca66eb84183fe6ba537cd1151b8a34a5b","claims":["C-09"],"review":"reviewed"}
  - {"id":"S14","kind":"pdf","urls":["https://www.census.gov/content/dam/Census/programs-surveys/decennial/technical-documentation/questionnaires/1950instructions.pdf"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the instruction for item 8, which gives Cousin as a relationship to the household head.","entry_sha256":"de4dfabff18bed2248d8cc4a6934b183c44cb4bdeebc0d0bbc6ef898a4e802fd","claims":["C-09"],"review":"reviewed"}
  - {"id":"S15","kind":"web-page","urls":["https://blog.myheritage.com/2024/12/types-of-historical-documents-you-can-use-to-find-ancestors/"],"published":"2024-12-07","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the author's description of kinship fields on some civil marriage records. Checked the wording of a form against S16.","entry_sha256":"fa8d7192cd2d6ecc6918d11ac69bdbfdd5bc9d525a0934eec3f9de91ccbe2e39","claims":["C-12"],"review":"reviewed"}
  - {"id":"S16","kind":"pdf","urls":["https://www.douglasco.gov/documents/marriage-license-application.pdf/"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the applicant's yes-or-no blood-relationship question and its write-in follow-up to distinguish the reported relationship from the pedigree supporting it.","entry_sha256":"f1d49ec430b393157ac6b679cbc9a934bba80812e5b4d120e880928f500f3011","claims":["C-12"],"review":"reviewed"}
  - {"id":"S17","kind":"web-page","urls":["https://predcuvky.opinio.cz/jak-zacit-patrat-po-predcich-9-dil"],"published":"2024-10-10","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the author's comparison of grandparents named in a 1901 Mrákotín birth entry and a 1907 Strachoňovice birth entry. The author reports that the marriage entry was still missing. S18 and S19 check the register locators.","entry_sha256":"ce4ac0a0a7987bf473ec335beaef2e33d0d3d89f07a2624bee3407ec04084130","claims":["C-13"],"review":"reviewed"}
  - {"id":"S18","kind":"catalogue","urls":["https://www.mza.cz/actapublica/matrika/detail/10464?image=216000010-000253-003373-000000-006693-000000-00-B01585-01140.jp2"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the catalogue entry 2026-11-22. Used its parish, register number and birth-year span to check the locator for the first example in S17. The record image did not render.","entry_sha256":"b919e4464f807bde056058be9c4aa43b5ff9c1f452c42421a0376b4589aa91ce","claims":["C-13"],"review":"reviewed"}
  - {"id":"S19","kind":"catalogue","urls":["https://www.mza.cz/actapublica/matrika/detail/540?image=216000010-000253-003373-000000-006827-000000-FM-B10154-01930.jp2"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the catalogue entry 2026-11-22. Used its listing for Strachoňovice, register number and birth-year span to check the locator for the second example in S17. The record image did not render.","entry_sha256":"ef8124e4e6fdd3306eba85eac60ad90b15a9ddf5d16ab2942d444d72f72f5f83","claims":["C-13"],"review":"reviewed"}
  - {"id":"S20","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/11/serkuksia-kuninkaan-luvalla-naimisiin.html"],"published":"2023-11-29","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the author's transcription of the Swedish kinship term in a royal marriage permission dated 1758-08-01 sent to the Turku cathedral chapter. Checked the meaning against S21.","entry_sha256":"4f554a60b2df99c8af96a3b6a817577489f74f8f46c6cc6c0eb7be76a9b01e87","claims":["C-14"],"review":"reviewed"}
  - {"id":"S21","kind":"web-page","urls":["https://sites.google.com/site/gunshaga/sl%C3%A4kter/l%C3%B6nn"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the 1723 correspondence in which the parish priest explains that the couple's mothers shared a mother and had different fathers. The permission uses the same kinship term.","entry_sha256":"441db04febea275835b2fb06b6f1918680fffc81b032254b22fec165c433e2ae","claims":["C-14"],"review":"reviewed"}
  - {"id":"S22","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/understanding-double-first-cousins-in-genealogy/"],"published":"2025-01-20","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. Used the twin configurations and the author's suggested comparison with half siblings and avuncular relatives. Used the advice to check both parental lines in DNA results and document both sibling pairs with vital and probate records, including checking the identities of fathers who are brothers with the same surname. Scoped the percentage and segment interpretation to the pedigree model in S23. The post gives conflicting guidance about segment length.","entry_sha256":"b35baff8457a368bc617c606102a03bbb637361a167e3ec867d9810f54aa4c32","claims":["C-15","C-16","C-17","C-18"],"review":"reviewed"}
  - {"id":"S23","kind":"pdf","urls":["https://strbase-archive.nist.gov/pub_pres/OConnor_Promega%20Proc%202010_Additional%20Loci%20Kinship.pdf"],"published":"2010-10-12","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read table 1 on 2026-11-22. Used its non-inbred pedigree coefficients to compare expected autosomal relatedness and two-copy sharing for half siblings, double first cousins and other close relatives. Used the ordinary sibling and identical twin coefficients to check each parental line's contribution to the expectations in S22.","entry_sha256":"5b0a4f6962f69b4c9839c6f12b5547cfd17cb839f6f7e2e33320961b4c033d62","claims":["C-15","C-16","C-17"],"review":"reviewed"}
  - {"id":"S24","kind":"web-page","urls":["https://blog.myheritage.fr/2024/08/graphique-de-parente-maintenant-disponible-pour-les-tres-grands-arbres/"],"published":"2024-08-05","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read 2026-11-23. Used the French edition of the July 2024 announcement for the pencil shortcut to compare two profiles in the same tree and the printer control for the open diagram. Checked both controls against S5.","entry_sha256":"8e46947fc12d7a7eae673c3b76fff29bbc3bc9b21fd9e2c3c85dbdb46d287631","claims":["C-19","C-20"],"review":"reviewed"}
  - {"id":"S25","kind":"web-page","urls":["https://blog.myheritage.com/2021/09/new-relationship-diagram-on-myheritage/"],"published":"2021-09-29","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Read the saving and printing section 2026-11-23. Used the description of the diagram printer icon opening a PDF that can be saved locally or printed.","entry_sha256":"92500beabecd6665941e6e97964b043a5d49975e59e51f50a1c4e03e333ddd91","claims":["C-20"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"For each distinct line, find the closest common ancestor on that line and count parent-child steps from each person. For counts of two or more on both sides, cousin degree is the smaller count minus one and removal is the absolute difference between the counts. A 3-step and a 4-step path make second cousins once removed. Keep a one-step path in the sibling or aunt/uncle part of the chart. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"When one person is called an uncle and the documented descent suggests cousins, trace both maternal and paternal paths. Identify each distinct shared line and record its own cousin degree and removal. If the same ancestor reappears in the pedigree, keep one identity with each documented path to it. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"When first cousins share both sets of grandparents through two sibling pairs, record both lines as double first cousins. If the connecting siblings share only one parent, record the half relationship on that line. Follow each partner and their children separately, keeping step-relationships as research leads distinct from common descent. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For the lower generation, start four steps up at your great-great-grandparents and go five steps down a different child branch. For the upper generation, start five steps up at your third-great-grandparents and go four steps down a different child branch. Check each resulting pair against the 4/5 chart cell before labeling it. [S1], [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"On the MyHeritage website, first confirm that the user's account is associated with their profile in their existing tree [S5 @2026-11-20]. In the redesigned tree view, open the relative's profile panel and click the relationship beneath the name to view the Relationship Diagram. [S4 @2026-11-20], [S5 @2026-11-20]","sources":["S4","S5"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"When a source uses this distinction, trace cross-cousin paths through the mother's brother or the father's sister, and parallel-cousin paths through the mother's sister or the father's brother. Preserve the source's kinship term alongside the documented path and calculate cousin degree and removal from the path. [S6], [S8]","sources":["S6","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"When a DNA match is estimated to be a third cousin, start with the tester's great-great-grandparents and trace their other children's descendant lines toward the match. If the match's pedigree is available, compare the ancestors four steps up each tree. [S3], [S6] Keep other paths that fit the shared DNA in play, including half and once-removed relationships, and require evidence for each parent-child link before identifying a shared ancestor. [S7]","sources":["S3","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"platform-ui","anchor":"On the full desktop profile page, click the relationship beneath the person's name to open the same diagram. [S9 @2026-11-21], [S11 @2026-11-21] If a large tree shows **Relative** beneath the name, click that label to see the path before classifying the relationship. [S10 @2026-11-21], [S11 @2026-11-21]","sources":["S9","S10","S11"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"When a census household makes two cousins look like peers, check whom each relationship entry refers to. In the 1950 U.S. census, read **Cousin** in the relationship column as a tie to the household head. Count both documented paths before assigning degree or removal, even when the people lived together or were close in age. [S13], [S14]","sources":["S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"platform-ui","anchor":"To compare two people already in the user's tree, open **Family tree → More → Relationship report**. Clear the prefilled user from **Person 1** when comparing two other people, select the two existing profiles in **Person 1** and **Person 2**, then read the chart link by link and verify both endpoints. [S5 @2026-11-22], [S12 @2026-11-22]","sources":["S5","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"platform-ui","anchor":"For a local copy, keep **Details** on **Basic** and use the upper-right download or print icon to save the chart as a PDF on the user's device or print it on the user's own printer. [S5 @2026-11-22], [S12 @2026-11-22]","sources":["S5","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"method","anchor":"When a civil marriage form indicates that the applicants are related by blood, record it as reported kinship. Read any accompanying description and trace both pedigrees before assigning a cousin degree. [S15], [S16]","sources":["S15","S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"If two spouses' birth entries name their grandparents, compare the named parents of the two suspected siblings, even when the marriage entry is missing. Test whether the entries identify the same grandparent couple before recording a first-cousin path through those siblings. [S17], [S18], [S19]","sources":["S17","S18","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"When a Swedish-language marriage permission calls the couple *halfsyskonebarn* or *half-syskonebarn*, read it as half first cousins and test the path through two half siblings to their one shared parent. [S20], [S21]","sources":["S20","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15","kind":"method","anchor":"When the records support one first-cousin path but the shared autosomal DNA suggests a closer match, test the other parental sides for a second first-cousin path. With no additional shared ancestry and two ordinary sibling pairs, double first cousins have the same expected autosomal relatedness as half siblings, an aunt or uncle and their niece or nephew, or a grandparent and grandchild. Keep those alternatives open until the paths are documented. [S22], [S23]","sources":["S22","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"method","anchor":"Check whether either parental sibling pair consists of identical twins before interpreting the total. For double first cousins without additional shared ancestry, the expected autosomal relatedness is about 25% with ordinary sibling pairs, including fraternal twins, about 37.5% with one identical-twin pair, and about 50% with two. Use these as pedigree expectations. [S22], [S23]","sources":["S22","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-17","kind":"method","anchor":"If the available segment data distinguish sharing on both copies at the same location (IBD2), use verified IBD2 to test for a second parental line. An ordinary half-sibling path alone accounts for sharing through one parent. Inspect any additional shared paths before ruling out half siblings, and leave the question open when only the total or segment lengths are available. [S22], [S23]","sources":["S22","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-18","kind":"method","anchor":"Use birth and marriage records to document both sibling pairs and the two marriages between them. Use named children in wills and probate files to test which sibling group and parent a record identifies. When the two fathers are brothers with the same surname, assign each record to a specific brother using the named spouse, parents, or children, and leave ambiguous records unresolved. [S22]","sources":["S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-19","kind":"platform-ui","anchor":"If the Relationship Diagram is already open, click its pencil icon to open the same Relationship report and select the two profiles there. [S5 @2026-11-23], [S24 @2026-11-23]","sources":["S5","S24"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-20","kind":"platform-ui","anchor":"To keep a local copy of the open Relationship Diagram, click its printer icon, then save the PDF to the user's device or print it on the user's own printer. [S5 @2026-11-23], [S24 @2026-11-23], [S25 @2026-11-23]","sources":["S5","S24","S25"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
