  - {"id":"S1","kind":"web-page","urls":["https://blog.myheritage.com/2024/10/understanding-the-relationship-3rd-cousins-once-removed/"],"published":"2024-10-30","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s examples of double first cousins, multiple marriages, cousin degree and removal. Used the charted path lengths to check the counting instructions.","entry_sha256":"6522e2d3d2544760ba2a22d321c4b71da146545e829eea4a38368c896f16b69f","claims":["C-01","C-02","C-03","C-04"],"review":"reviewed"}
