  - {"id":"S8","kind":"pdf","urls":["https://anthro.rutgers.edu/images/documents/publications/Cronk%20et%20al%20kin%20terms%20and%20FI%20EHB%202019.pdf"],"published":null,"retrieved":"2026-11-20","access":"read","rights":null,"basis":"Read 2026-11-20. Used pp. 281–282 to check how parental sibling paths distinguish cross and parallel cousins in kinship systems that use these categories.","entry_sha256":"8b7a626ff6fc9d11553f591f4fcb2c7ba037aa8a58129b752bdd2d6178c38f5d","claims":["C-06"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://blog.myheritage.com/2024/02/introducing-all-new-profile-pages-with-hints/"],"published":"2024-02-29","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the author's walkthrough of opening the Relationship Diagram from the full desktop profile page. Checked the relationship link against S11.","entry_sha256":"b0499f0110ea5743779bbcbbc04b35bfa15fd46609f232ead1aca638929ff843","claims":["C-08"],"review":"reviewed"}
  - {"id":"S10","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/wrapping-up-2024-myheritage-year-in-review/"],"published":"2025-01-01","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the July recap of Relationship Diagram support for large trees. Used S11 to verify what to click when the relationship label is generic.","entry_sha256":"6d476c4de2bbb9fd96f861ab4be4ed759a5360a0d141273276ece3011dca3774","claims":["C-08"],"review":"reviewed"}
  - {"id":"S11","kind":"help-page","urls":["https://www.myheritage.com/help/en/articles/12852747-why-don-t-i-see-relationships-in-my-online-tree"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read 2026-11-21. Used the documentation for opening the diagram from the label beneath a person's name, including the generic Relative label in large trees.","entry_sha256":"f5cb6293f407dfc215128d58bfa81e143d5e014f66424dd3f90222f2ce6ff97c","claims":["C-08"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"For each distinct line, find the closest common ancestor on that line and count parent-child steps from each person. For counts of two or more on both sides, cousin degree is the smaller count minus one and removal is the absolute difference between the counts. A 3-step and a 4-step path make second cousins once removed. Keep a one-step path in the sibling or aunt/uncle part of the chart. [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"When one person is called an uncle and the documented descent suggests cousins, trace both maternal and paternal paths. Identify each distinct shared line and record its own cousin degree and removal. If the same ancestor reappears in the pedigree, keep one identity with each documented path to it. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"When first cousins share both sets of grandparents through two sibling pairs, record both lines as double first cousins. If the connecting siblings share only one parent, record the half relationship on that line. Follow each partner and their children separately, keeping step-relationships as research leads distinct from common descent. [S1]","sources":["S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For the lower generation, start four steps up at your great-great-grandparents and go five steps down a different child branch. For the upper generation, start five steps up at your third-great-grandparents and go four steps down a different child branch. Check each resulting pair against the 4/5 chart cell before labeling it. [S1], [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"On the MyHeritage website, first confirm that the user's account is associated with their profile in their existing tree [S5 @2026-11-20]. In the redesigned tree view, open the relative's profile panel and click the relationship beneath the name to view the Relationship Diagram. [S4 @2026-11-20], [S5 @2026-11-20]","sources":["S4","S5"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"When a source uses this distinction, trace cross-cousin paths through the mother's brother or the father's sister, and parallel-cousin paths through the mother's sister or the father's brother. Preserve the source's kinship term alongside the documented path and calculate cousin degree and removal from the path. [S6], [S8]","sources":["S6","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"When a DNA match is estimated to be a third cousin, start with the tester's great-great-grandparents and trace their other children's descendant lines toward the match. If the match's pedigree is available, compare the ancestors four steps up each tree. [S3], [S6] Keep other paths that fit the shared DNA in play, including half and once-removed relationships, and require evidence for each parent-child link before identifying a shared ancestor. [S7]","sources":["S3","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"platform-ui","anchor":"On the full desktop profile page, click the relationship beneath the person's name to open the same diagram. [S9 @2026-11-21], [S11 @2026-11-21] If a large tree shows **Relative** beneath the name, click that label to see the path before classifying the relationship. [S10 @2026-11-21], [S11 @2026-11-21]","sources":["S9","S10","S11"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
