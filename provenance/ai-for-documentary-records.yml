claims:
  - {"id":"C-3db3c942a0e6","kind":"unclassified","anchor":"- **Record existence or retrieval by a bare LLM.** With no verified browsing it invents both the record and its citation — \"AI assistants are not search engines,\" and they inconsistently open even a public link. Supply the record, then verify the output against it. (DNAeXplained)\n- **Any transcription or translation accepted blind.** Names, dates, places, and legal descriptions are the highest-error zone — a deed's \"township 18 north\" became \"township 182,\" and Scribe once rendered tight handwriting into the wrong *language* (Russian). Verify word-by-word against the image. (James Tanner; Family Locket)\n- **Cultural, religious, and naming interpretation.** *madrina* is godmother, not mother; a misread ketubah dropped \"Hersh\" and swapped the father's name; Swedish records mis-apply a mother's maiden name to the children. Verify with someone who reads the language and culture. (Legacy Tree; FamilySearch)\n- **Period and foreign kin or status terms given their modern sense.** Write the literal term next to the gloss, and leave ambiguous readings open. Dutch *nicht*/*neef* can mean niece/nephew or cousin ([also](https://www.youtube.com/watch?v=b_JtDaDF6y4)). In a land-lottery draw, an 'orphan' may only have lost a father. In older English, 'Dutch' can mean German-speaking, and 'fl.' marks an active period, not a lifespan. Check an AI gloss against a dictionary from the record's own period. For Spanish, [Ryskamp](https://www.youtube.com/watch?v=_YP7JKXjthk) points to the RAE's historical-dictionary collection (NTLLE); other languages need their own period sources. None of these terms settles a relationship or origin by itself. ([GeneaVlogger](https://www.youtube.com/watch?v=R2fzEjKl2QI), [Thomsen](https://www.youtube.com/watch?v=C2_9AVcodcg), [Louden](https://www.youtube.com/watch?v=5_kZB9XyA8c), [Genealogy Gems](https://www.youtube.com/watch?v=Pbo5Gm5qSx8))\n- **Status or trade words parsed as names.** Before recording an unfamiliar word next to a name as a forename or surname, check a regional glossary for a status or trade term. In one Holstein church-book case, *Insten* (estate day labourer) had been read as part of the father's forename. In another entry, 'legitimate daughter of the smith (*Schmieds*)' followed by the father's forename was read as giving a paternal surname, which created a false conflict with the child's surname. Put such words in the occupation or status field and search without them. ([status-term example](https://forum.ahnenforschung.net/forum/thread/3013927/), [occupation example](https://forum.ahnenforschung.net/forum/thread/3014853/); single cases, with no list of terms.)\n- **Any relationship, parentage, or \"impossible\" chronology conclusion.** AI reversed family relationships in deed abstracts; FamilySearch's AI Research Assistant declared a family complete and couldn't reason that a child born just after the father's death was plausibly conceived before it. Chronology is a human check. (Family Locket; Genealogy Gems)\n- **Same-name disambiguation.** AI conflates two people sharing a name — you catch it via an impossible chronology, and professionals separate them by land boundaries, witnesses, and occupations. Anchoring the assistant to a person's unique ID reduces but does not eliminate this. (Legacy Tree; Genealogy Gems)\n- **AI narrative that reads the INDEX, not the image.** Ancestry AI Stories draw on indexed fields and can re-use OLD index errors already corrected elsewhere, producing generic narrative (a Genealogy TV / FamilySearch critique of a fast-evolving generative feature). Open the underlying image. (Genealogy TV; FamilySearch)\n- **A record HINT before its facts are verified against the actual record.** Confirm the suggested dates, places, and relationships match the record — and open the image, not the indexed summary — before attaching. Even \"highly accurate\" hints are \"not perfect.\" (FamilySearch)\n- **Extractions that change the record's event or date type.** Keep the type of event and date the entry actually records. A parish burial date is not a death date. 'Received into the congregation' may follow an earlier baptism somewhere else. A baptism 'of necessity' does not show that the child died. A delayed certificate's filing date is not the birth date. An annual report's title year may differ from the period it covers, and an 'on this date' newspaper item carries a later date. Keep qualifiers such as 'Mary late X' (an earlier surname). Search for the missing event record rather than inferring it. Motivated by [Tanner](https://www.youtube.com/watch?v=xOWgEolt7-g), [Brown](https://www.youtube.com/watch?v=_ij26t85WY8), [Ryskamp](https://www.youtube.com/watch?v=_YP7JKXjthk), [Lisson](https://www.youtube.com/watch?v=LHxFLXvGnx4), [Melick](https://www.youtube.com/watch?v=5dVcyQRtbTo) and [GeneaVlogger](https://www.youtube.com/watch?v=-CxvuPelZ4I). These are single examples, not rules for every register.\n- **A rank's seniority date taken as the promotion date.** In compiled summaries of Russian imperial civil-service files, one promotion can carry two dates: the date of the promotion and a stated seniority (*старшинство*) date, which can be years earlier. Put each in its own field with the literal wording. Do not put the seniority date on a timeline as the event, and do not use it to place the person in a post at that time. In one compiled entry the promotion is dated after the man had retired. A [Perm provincial-office service-record compilation](https://rodgersforum.borda.ru/?1-11-0-00000271-000-0-0-1745136493=) shows this pattern. It is a set of compiled summaries, not images of the original lists, and it does not explain how seniority was calculated.\n- **AI's account of what IT did.** ChatGPT claimed to have proofread an article it never accessed and reported errors that weren't there. Never accept \"I checked X\" as evidence X was checked (though note: an outright \"I can't answer\" is not itself a hallucination). (DNAeXplained)\n- **Colorized, restored, or generated images as evidence.** See the image section below — these are derived artifacts, not documentation. (James Tanner; Genealogy TV; Aimee Cross)\n- **Citation-STYLE rules from AI.** Claude gave inconsistent, self-contradictory guidance on Evidence Explained's page-abbreviation rule. Supply the fields; you decide and apply the style. (Family Locket)\n- **An AI summary or abstract that omits or mislabels fields.** A fluent platform summary of a deed or mortgage can name the parties but leave out their residences, the consideration, the land description and the witnesses. It also won't link other deeds on the same page or for the same parcel. Take those fields from the image or transcript yourself. A small consideration is only a lead toward kinship. Also, don't let an abstract call a list's dollar figures wealth or tax, or treat a signer's mark as proof of illiteracy, until the document explains them (for amounts, also check the governing statute). In one list the amounts turned out to be jury mileage pay, and some forms offer only a place to mark, so check how the other parties signed. ([deed summaries](https://www.youtube.com/watch?v=WhUJLvxfBU8), [Genealogy Gems 233](https://www.youtube.com/watch?v=p4O1Zlol-2k), [mark check](https://www.youtube.com/watch?v=dFfFvb0W0CE); none of these measures how often this happens.)\n- **Technical drawings requested as generated images.** \"Generate an image\" of a metes-and-bounds plat yields artistic pixels — accurate output needs a code path plus a human who understands deed mapping. (Family Locket)\n- **Final evidentiary judgment / GPS compliance.** AI drafts proof arguments; humans rule — even FamilySearch's own stance is to leave conflicting-record judgments to people. (FamilySearch; Legacy Tree)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7d238a9a2881","kind":"unclassified","anchor":"Retain the partial literal reading and visible beginning/ending letters. Compare candidates\nat the estimated letter length and one letter shorter/longer, checking each against the image\nand document context. For a possible place name, narrow historical-gazetteer candidates by\nthe independently supported region. Preserve unresolved letters and historical spellings;\nmodern spellcheck approval, popularity or familiarity does not verify a reading.\n[CompGen's German-handwriting worksheet](https://www.compgen.de/2023/04/fuenf-fantastische-technik-tricks-zur-entschluesselung-der-deutschen-handschrift/)\nsupports this optional sequence, not automatic replacement or current wildcard/menu syntax.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c99792baeaff","kind":"unclassified","anchor":"For an uncertain name, place or relationship parse, compare several available complete entries\nin the same clerk's hand. Note repeated formula words and their field roles; keep a change of\nhand in a separate comparison block. Preserve alternative readings rather than replacing all\nsimilar tokens. The [locality-reading discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=1272)\nmotivates this contextual check without verifying its proposed place or subject-status readings.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-470db971c792","kind":"unclassified","anchor":"For a doubtful letter in a name, find the same writer's clear forms of that letter on the same page and compare them before accepting or correcting an index reading. If the image is poor, look for an independent scan of the same page on another provider's site and compare the readings, recording which image each came from. Another copy may be clearer, but not always. When asking a helper, supply the whole page or a link to it ([Sorensen](https://www.youtube.com/watch?v=xvqeNOE_dp8)); the same likely applies to a model. The reading stays an interpretation. Motivated by the [maiden-name example](https://www.youtube.com/watch?v=9Vq4-eIqsg0), the [enumerator comparison](https://www.youtube.com/watch?v=EEhzZ94K0ms) and the [ScotlandsPeople census case](https://www.youtube.com/watch?v=bxUHrllbZI4). These are single cases and do not establish whether the copies come from different filmings or scans.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4a3fe06cdb25","kind":"unclassified","anchor":"Record which document supplied each reading. Keep keys in a separate comparison block, transcribe each entry as written, and label key-assisted readings. A clerk's copy may carry its own error, and a key pulls you toward the words you expect. Boilerplate never supplies the target's names, amounts or boundaries. Agreement is support, not proof. ([Tanner probate](https://www.youtube.com/watch?v=FA2iXKr09Lo), [Brady](https://www.youtube.com/watch?v=OU2cYqgN-lw), [Tanner town records](https://www.youtube.com/watch?v=bhpOk-A5CeA), [Obee](https://www.youtube.com/watch?v=D-eqV-ZS5UY))","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3389f7969e1a","kind":"unclassified","anchor":"After checking each page against its image, assemble a separate transcript in source-page\norder. Retain page labels/links and unresolved or missing-page markers, together with the\nimages and native page transcripts. Label the combined reading copy as a derivative of those\npages. The [four-page letter example](https://whoareyoumadeof.com/blog/ancestry-ai-image-transcript-feature-how-to-use/)\nmotivates this portable output; its historical interface and accuracy claims are not required.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-13d049f9e550","kind":"unclassified","anchor":"The same applies to register entries. Do not hand the model only the indexed page. Also open and supply the following page, because an entry can run across pages, with the parents' names on the continuation. Supply the facing page too: consent for under-age parties may name their parents outside the printed form. Record a page locator for each part. The [marriage-register example](https://www.youtube.com/watch?v=gsbQIuilOYk) motivates this step. Layouts vary by county and register, and its images are not in the transcript.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ff1235dd57a2","kind":"unclassified","anchor":"Markers only separate the layers; they verify nothing. ([Sorensen](https://www.youtube.com/watch?v=CoxXz-C754c), [theory labelling](https://www.youtube.com/watch?v=YsWgVd8-mUs), [Allen's outline prompts](https://www.youtube.com/watch?v=M3nAWOP9v8Y), [holiday scene](https://www.youtube.com/watch?v=1qeAV90uQNY), [reported speech](https://www.youtube.com/watch?v=TlZ88OEjHqY); these sources do not show how to weigh a family story as evidence.)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6ab651164143","kind":"unclassified","anchor":"These are reading aids from [Hutchison](https://www.youtube.com/watch?v=Prg_XRQSdp0), [Stoddard](https://www.youtube.com/watch?v=fCLOCtag5kA) and [Starkey](https://www.youtube.com/watch?v=GCFTz_67DkY). Normalized forms are not proof of identity, and *uxor* is not proof that the husband was still living.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bfe4a7730a73","kind":"unclassified","anchor":"- **Full-Text Search for ENSLAVED ancestors.** Search slaveholders, plantation names, overseers, and distinctive property — probate/estate files, bills of sale, and deeds of gift (within FamilySearch's U.S. Plantation and Land & Probate collections) name enslaved people by name, age, value, and family ties that traditional indexes omit. Search spelling and HTR variants (and wildcards) — an AI-misread or misspelled name won't exact-match — and re-run every week or two as processing continues. (James Tanner)\n- **Unindexed deeds/probate via a distinctive keyword.** Searching an inherited \"piano\" surfaced a probate file and unknown relatives; a rare surname + place returned an obituary and a probate naming relatives. Quote a full name to keep it together; search two names together to find shared records; try name variants because HTR misreads defeat exact matching. (FamilySearch)\n- **Court-records pipeline (Samuel Daniel and the Roystons, colonial Virginia).** In [Part 1 of her case study](https://familylocket.com/transforming-court-records-research-with-ai-a-case-study-from-colonial-virginia-part-1-finding-and-logging/), Diana Elder reports finding twelve entries dated April 1773–March 1774 by searching Middlesex County court order books with FamilySearch Full-Text Search, with all twelve from the same image group. She describes downloading images, supplying known names and preserving line breaks for Google AI Studio transcription, checking the transcriptions against the images, and compiling individually cited entries into a chronological log and table. [Part 2](https://familylocket.com/transforming-court-records-research-with-ai-a-case-study-from-colonial-virginia-part-2-analysis/) describes Claude's legal explanations and proposed reconstruction. Treat those interpretations as hypotheses: verify record-derived claims against the originals and legal terms and context against an authoritative historical legal dictionary or other cited legal source before relying on them.\n- **Correct-and-verify loop for AI-INDEXED Latin American records.** In FamilySearch's review tool, inspect EVERY name and event — don't just click Verify; include marginal notes (they record marriages and acknowledged fathers); correct godparents and witnesses (likely relatives) but skip nonessential priests and notaries; fix a gender label where \"parent/godparent\" signals a non-standardized value (re-click → father/godfather); leave multi-image, unknown-primary, or too-complex records unresolved rather than guessing — and remember a saved change is a live shared edit (on the record right away, searchable within minutes). (Ada Luque Nelson)\n- **Recurring AI-indexing error patterns.** In AI-indexed Iberian records, check the image for these errors:\n  - Spanish *M* (mujer, female) indexed as male\n  - given name and surname run together in one field\n  - the church entered as the birthplace\n  - a note that exists only in the margin indexed as its own record\n  - a 'tail' record with an unknown principal, created when an entry continues onto the next page (a duplicate, not a separate event)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2838dfea012e","kind":"unclassified","anchor":"On one 1950 census page, the first household's surname was copied onto the households listed below it. If an AI index gives a family a surname it never used, open the page before assuming a remarriage or a different person. Where editing is allowed, correct the whole page. ([Nelson's 2025 review](https://www.youtube.com/watch?v=ZJCXOYhZDzM); [Nelson's census case](https://www.youtube.com/watch?v=pNF5B1jZ8gM). These are observations, with no error rates or frequency.)\n- **German death-record model bake-off.** On a Bavarian Kurrent/Sütterlin record, Gemini won — translating column-by-column (occupation / religion / residence / cause / burial / age / pastor), catching Austrian *Jänner*=January and Latin *paralysis cordis*=heart failure — while Claude wrongly called the deceased English and ChatGPT quit after a few lines. Running two models shows where they disagree; the image settles the disagreement. (Model-specific results are 2026 single-run anecdotes on specific versions — re-test current models.) (Kitty Cooper)\n- **Foreign-language HTR discipline.** Do a rough MANUAL read and extract the facts FIRST → prompt with language + period + known names + features → transcribe 1–2 paragraphs at a time → review image and transcription side-by-side word-by-word — because you can't verify a language you don't read at all. (Family Locket)\n- **Evaluating a record HINT before attaching.** FamilySearch's AI Research Assistant proposes up to ~5 parent/spouse/child home-page hints (logical dedup filters run before AI filters). Open the ACTUAL record — not the indexed summary — confirm the suggested facts match, and check chronology (parent ages, birth timing); the system had declared a family complete and mis-reasoned a post-death birth. Well-sourced names get better hints. (FamilySearch; Genealogy Gems)\n- **Deed plat from a metes-and-bounds description.** Do NOT say \"generate an image\" — ask the Thinking model to write and run a Python script that converts bearings/distances to coordinates and plots the polygon (it matched the DeedMapper baseline). Learn deed mapping yourself so you can tell an accurate plat from a hallucinated one. (Family Locket)\n- **Name-variant consolidation.** Claude grouped 11 surname variants across 29 records by spelling/record-type/location, derived the German→English pattern (drop/add final vowels, K→C on Anglicization), and produced a linguistic search *checklist* — treat a name as a variable, not a constant. (Denyse Allen)\n- **Resolving conflicting death dates.** Feeding census + land + tax + estate records TOGETHER let Claude show the man appearing in the 1800/1810 censuses (so an 1792 death is wrong) — a contradiction the researcher had missed across years of one-record-at-a-time work; the estate inventory even hinted at an unexpected death. (Denyse Allen)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c89b997099f3","kind":"unclassified","anchor":"- **Chained tools propagate a single misread** — transcribe→translate→summarize means one bad transcription poisons every downstream output. (Family Locket)\n- **Names, dates, and numbers are the high-error zone** — models transcribe narrative well but substitute a familiar name seen earlier; \"November\"→\"December,\" \"township 18\"→\"182.\" Domain knowledge (a plat can't be township 182) is what exposes them. (Genealogy Gems; James Tanner)\n- **Scribal conventions can create false names.** Clerks broke words at the end of a line with no hyphen and not at a syllable break, so 'Chris' at a line end and 'tian' on the next line can be one name. In the cited Spanish examples, abbreviation marks support candidate expansions ('Franco' with an overline as Francisco, superscript 'Ant' and 'M' as Antonio and María); verify an expansion against the writer's usage or a period reading key. Before recording an odd fragment or surname as a new variant, test whether it joins the next line and whether each piece makes sense alone. Check the image for overlines and superscripts. Keep the line breaks and the abbreviated form, and add the joined reading or expansion as a note. Sometimes the pieces really are two words, and the sources give no fixed rule or complete list. ([Brady](https://www.youtube.com/watch?v=OU2cYqgN-lw), [Italian records](https://www.youtube.com/watch?v=UC1J5HuNYns), [Badal](https://www.youtube.com/watch?v=eb6YqIJ3aK4))\n- **Machine translation can translate surnames away.** A surname built from an ordinary word, as many German names meaning mountain or house are, may come out as that noun, and the person seems to vanish from the translation. Before translating, note where each name sits in the original. Afterwards, check those positions and keep the original-language form in any extraction. The [listener-email advice](https://www.youtube.com/watch?v=Ofj5cluPmEQ) gives no worked example and says nothing about how specific tools behave.\n- **Old spelling can break machine translation.** If older texts in a language translate into garbage while modern texts translate well, suspect a spelling reform before trusting the output (as one poster found with older Latvian newspaper articles). Convert the text to modern spelling with a documented old-to-new correspondence table, such as one in a period encyclopedia's article on the language. Then translate, keeping the original beside the converted text. The [old-Latvian spelling thread](https://forum.ahnenforschung.net/forum/thread/2971674/) reports this manual fix. The table isn't reproduced there, and a conversion can leave ambiguous letters unresolved.\n- **Some AI summary/narrative features read the INDEX, not the image** — they draw on indexed fields and silently re-use OLD index errors already corrected on the image elsewhere. Always open the image. (Genealogy TV; FamilySearch)\n- **It confidently produces IMPOSSIBLE conclusions** — the post-death-birth failure and the invented Civil-War regiment (the *brother* had served) show it won't self-check chronology or fabrication. (Genealogy Gems; Legacy Tree)\n- **It can't infer beyond supplied evidence and will REVERSE relationships to force a story** — and it can't independently locate a missing record. (Family Locket)\n- **Context fatigue degrades long chats and documents** — quality drops and it drops or invents content past the window. Split into fresh chats and reload the current state. (DNAeXplained; Genealogy TV)\n- **Assistant memory can leak known names into a reading.** When extracting people and roles from a supplied record, treat any name the assistant already knows from earlier chats or saved memory as possible contamination. Check each extracted person, role and relationship against the page where it appears. A fresh session without memory is an untested precaution, not a fix the source shows. In [Denyse Allen's estate-file test](https://www.youtube.com/watch?v=GwJYxbnI_-U), a daughter-in-law who married into the family years later was listed as a child, and the widow was misnamed. Allen only suspects memory was the cause, so this example motivates the check but does not prove the mechanism. (Denyse Allen)\n- **Full-text search is NOT exhaustive** — not every image is indexed or read correctly, and an HTR misread means a misspelled name won't exact-match. Search variants and wildcards, check it alongside internal indexes AND manual page browsing, and re-run every week or two as collections are processed. (Family Locket; James Tanner)\n- **Image quality gates everything** — download high-quality images (not low-res screenshots), crop newspaper clippings tightly to stop line-detection chaos, and expect blurry originals to be unreadable. (Family Locket; James Tanner)\n- **The model may see a smaller image than the file.** The vendor API (by default) or the agent tool in front of it may downscale an image above a size limit before the model sees it, so the file's byte size or pixel dimensions do not show what the model actually received ([Claude vision docs](https://platform.claude.com/docs/en/build-with-claude/vision), [computer-use screenshot sizing](https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool), checked 2026-11-02). Record the source's pixel size, what the tool reports showing, and that the effective model input may be unknown; if it is unknown, say so beside the reading. When letters or digits are small, crop the region from the original and read the crop. Keep the crop's binding (source file or ID plus pixel coordinates) and its line context, and check the reading against the full line; the vendor's guidance also warns against cropping away key context just to enlarge text. A reading that changes after re-cropping in a new chat does not show that the crop caused the change. Enlargement adds no detail, and generatively \"enhanced\" strokes are never evidence of the original. Limits differ by model and change, so do not hard-code pixel thresholds; cite the vendor page with its check date.\n- **Formatting can carry meaning the model drops** — some models can't reliably read COLORED text and only sometimes recognize BOLD, and they handle tables and multi-column layouts inconsistently — exactly the shape of ledgers, registers, and census forms. (DNAeXplained; Family Locket)\n- **Correct layout before recognizing text on complex pages.** Where the HTR tool supports separate layout recognition, inspect detected text regions and baselines against the image and correct layout errors before running text recognition on tables or multiple columns. [Family Locket's Transkribus tutorial](https://familylocket.com/transkribus-revolutionizing-handwritten-text-analysis-with-ai/) describes this sequence. Then check the recognized text against the image; a corrected layout does not itself verify the transcription.\n- **Marks and placement on the page can be misread or lost.** Check every strike-through, underline and separator in an AI transcription against the image. In one test, a dividing line was read as crossing out a name that was not deleted, and an underlined heading was missed. Where position carries meaning, as with side notes or grouped names, keep a layout-aware copy. Faint traces in a blank field may be show-through: mirrored, reverse-slanted strokes point to ink from the other side of the leaf. Record such a field as blank or uncertain rather than reconstructing a name. Both rest on single examples ([Scribe launch-day test](https://www.youtube.com/watch?v=DW8j5PP-0zA), [marriage register](https://www.youtube.com/watch?v=1oNhIhwKA6U), where the reverse page was not checked). They set no notation standard.\n- **Bracketed text with a 'do not read' note is a cancellation.** Official registers did not allow erasures. So in Russian-Empire metrical books a clerk put a miswritten letter, word or phrase in brackets and added a note such as *окаймленное не читать* ('the enclosed is not to be read'). Don't transcribe the enclosed text as a second name, a patronymic or an ending. Keep it as a cancelled reading, together with the note. Several participants in the [bracketed-correction discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) call this routine, but what the clerk first meant to write stays a guess.\n- **A bilingual entry has two texts, and an overwrite can hide a third.** In a Russian-Empire rabbinate register, transcribe the Hebrew-script half separately from the Russian half. Record each parent's Hebrew name and patronymic beside the Russian form (for example, a Hebrew 'son of …' beside the Russian patronymic form), then compare the two halves. Where a name was written over earlier text, record both the visible reading and the one underneath, and label which is which. In the [bilingual birth-entry discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667), the mother's Hebrew patronymic matched the patronymic underneath, not the visible one written over it. This is one example, and its image is not in the thread. Matching name forms are conventional renderings, not proof of identity.\n- **Identify the document and its form before assigning fields.** Before transcribing or searching, note the language(s), script(s) (printed Fraktur and handwritten Kurrent can share a page), content type and author. A film of the right year may hold burials rather than baptisms, which would explain a 'missing' child. Don't infer confession from language: Latin does not prove Catholic, nor the reverse. Register headings vary by year and printed form. Scandinavian headings are long instructions (does the place column want village, farm, parish or street?), so match a heading translation to the register's year and form, and read it in full rather than reducing it to one word. ([Minert](https://www.youtube.com/watch?v=cc8_6tNN8C4), [Tanner](https://www.youtube.com/watch?v=1CzAygZqg2Q); their example slides and heading tables are not in the transcripts.)\n- **Agentic browsers miss obvious follow-ups** — Claude-in-Chrome did a pedigree task but never searched for the missing man's wife in another locality. Treat agent output as a first pass, not a finished search. (Family Locket)\n- **Auto-routing may not pick the reasoning model** — select the reasoning/Thinking model yourself for hard tasks. (Family Locket)\n- **Open-web tools can't see gated genealogy sites** — Perplexity and AI web search work from the open web and can't reach sign-in-gated accounts; AI also reinforces misinformation posted repeatedly online. (Aimee Cross; DNAeXplained)\n- **A block or a blank results page is not an absence.** A block, a timeout, a CAPTCHA, a WAF or geo-block, or a certificate error from a foreign IP is an access limitation, not evidence that the archive or record is closed or absent. A fetched results page that shows only column headers, an empty `{}` or a blank panel may be an unloaded result list, a login wall or a block. Log either case as an interrupted search in the [research log](research-documentation.md), have the user check the loaded rows and the result counter in their own browser, and never record NIL from it. Never bypass an access control: no VPN or proxy, no override of a certificate warning, no CAPTCHA solving by the agent; hand the step to the user's browser. Do not mass-download collections of unclear legal status, and use scans of unclear provenance, such as public cloud folders, only as leads.\n- **Ancestry vs FamilySearch full-text is not the same capability** — FamilySearch's Full-Text Search does broad AI handwriting transcription across a growing set of image collections (land, probate, and more); Ancestry's Search Full Text leans more on OCR plus existing indexes, with AI handwriting recognition applied to selected pre-processed collections (e.g. the 1950 U.S. and 1931 Canada censuses) rather than across the board. For its 1921 England & Wales census, Ancestry licensed Findmypast's transcription rather than producing its own. Ancestry's separate image-HTR \"Transcribe\" beta (World Explorer / World Deluxe tiers; English, Spanish, French, Italian, German and more) still needs manual checking, and a Danish doc was transcribed but left untranslated. (Genealogy TV; Ancestry; Library and Archives Canada, 1931 census release; WDYTYA, 1921 census on Ancestry)\n- **Saving an AI-index correction is a live shared edit** — visible on the record right away, searchable within minutes, and it persists even if you later abandon the record; and don't waste time on highlighting fixes (they don't train the model and can trigger tool errors). (Ada Luque Nelson)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-741792e42b33","kind":"unclassified","anchor":"- **AI-generated transcriptions and abstractions are derivative artifacts, not independent evidence.** Verify record-derived claims against the original record, and contextual/research claims (terms, history, strategy) against an authoritative cited source, before either is used. AI is *safer* for analyzing, correlating, and summarizing records you already trust than for the initial finding phase; hallucination ranges from full fabrication to a subtle misunderstanding of intent. Use AI to think faster, never to decide. (Aimee Cross; Legacy Tree)\n- **Several readings of one image are one documentary chain.** Readings by people, models or OCR do not corroborate each other. Repeating the request until the model agrees with itself verifies nothing. When a confident reading's structure (rows, columns, numbers) disagrees with the image, the reading fails however confident it is; recheck which image was actually opened. A matching file hash confirms the file, not the reading or the viewing channel. For a second reader or model, record whether it saw the earlier transcription, the expected names or neighbouring pages: a hint-aware re-read is not blind. Keep the superseded reading, the correction and its basis, and leave a disputed spot open.\n- **Log which AI tools and conversations you used** — cite the AI step the way you cite any research step. (Family Locket)\n- **Check where a correction actually landed.** When correcting a transcription or structured extraction that passes between tools, record where the correction was saved and which version downstream work uses. Reopen the downstream copy or export to verify that it carries the correction. Do not assume that editing one derivative updates the upstream transcript or trains its recognizer. The [DES/Transkribus handoff example](https://www.youtube.com/watch?v=6IwX6kZbx4Q) motivates this check; current synchronization behavior is not asserted. (CompGen; verification steps are Kinprove synthesis)\n- **Privacy gate:** <!-- privacy-gate: third-party-tool --> Pasting living people's records into an AI chatbot sends their data to a third party; answer the privacy gate in `SKILL.md` first. **Apply the \"water-cooler rule\" before pasting living people's records into a consumer chatbot** — don't enter anything you wouldn't post publicly, because these tools may train on your uploads. Replacing names with **Person A / Person B** is *pseudonymization, not anonymization* — dates, places, relationships, and occupations can still re-identify someone, so also strip or generalize those indirect identifiers and treat the result as still potentially personal data; never upload private living-person data that fails the water-cooler rule. Use temporary chats, and keep a separate curated cloud account for connected folders. (This is the records-privacy caveat; the DNA recipe carries the separate de-identify/consent discipline for re-identifiable genetic data.) (Genealogy TV — Little & Thompson)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d66c7e322499","kind":"platform-ui","anchor":"For a record image already on MyHeritage, run Scribe AI from the record page, or from the photo\nin your gallery, with View insights instead of downloading and re-uploading the image\n[S1 @2026-11-12], [S2 @2026-11-12]. The option appears on many record images, not all\n[S2 @2026-11-12].","sources":["S1","S2"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-42a45d75eaa5","kind":"platform-ui","anchor":"Upload a multi-page document as one PDF rather than as separate images: Scribe AI reads a PDF as\none unit, typically up to about 15 pages, with a 10 MB file limit [S1 @2026-11-12],\n[S2 @2026-11-12].","sources":["S1","S2"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8772abc9dfc3","kind":"historical","anchor":"In Georgia's 1827 land lottery, an entry for a man's \"orphans\" does not by itself show that he\nhad died. The act of 9 June 1825 let the wives and children of men absent from the state for\nthree years draw as though they were widows and orphans [S3], [S4], [S5]. Before searching for\nthe father's death or probate before 1827, check the act's categories and look for evidence\nthat he had left Georgia.","sources":["S3","S4","S5"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04d95e299671","kind":"platform-ui","anchor":"When you compare a model's transcription with your own, settle every difference on the image\nrather than scoring the model against your typed copy. In Family Locket's deed test, the model\nwas right and the researcher wrong in four of fifteen differences, one of them a misspelling in\nthe deed that her typed copy had corrected, possibly through Google Docs autocorrect [S6 @2026-11-12]. Google Docs'\nAutocorrect fixes spelling and can be turned off, so type a reference transcription with it\noff [S7 @2026-11-12].","sources":["S6","S7"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0d1b4dd61e33","kind":"platform-ui","anchor":"For a hard hand, a line-by-line HTR draft is easier to check than a chatbot's reading of the\nimage: Transkribus links each recognized line to its place on the image, so compare every line\nwith its marked line [S8 @2026-11-12], [S9 @2026-11-12]. If you then ask a chatbot to correct the draft, as Family\nLocket did with a deed, compare its output with the draft word by word and check every change\non the image [S9 @2026-11-12]. A model correcting text without the image can replace a right reading with a\nplausible wrong one.","sources":["S8","S9"],"checked":"2026-11-12","stated_as":"observation","review":"reviewed"}
  - {"id":"C-3a0842996a6a","kind":"historical","anchor":"In older handwriting, into the 19th century, a double s was often written with a long first s\nthat looks like f or p, so a name read as 'Jepe' can be Jesse [S10], [S11]. Compare the letter\nwith an ss in a word you can read in the same document [S10]. An index or HTR may have kept the\np-reading, so search that form as a variant too.","sources":["S10","S11"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-788ba38b6aef","kind":"platform-ui","anchor":"Before treating an image taken from MyHeritage as the original photograph, look at its\ncorners; MyHeritage's help places its marks at the bottom left [S12 @2026-11-12],\n[S13 @2026-11-12]. A palette marks a colorized or color-restored photo, a magic wand an\nenhanced one, a moving ball an animation and a bandage a repair, and the original is kept\nseparately [S12 @2026-11-12]. MyHeritage calls an animation a technological simulation, not\nauthentic [S13 @2026-11-12], [S14 @2026-11-12]. A marked image is a derived artifact; ask for\nthe original. A cropped or re-saved copy can lose the marks, so their absence does not show\nthat an image is unaltered.","sources":["S12","S13","S14"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
