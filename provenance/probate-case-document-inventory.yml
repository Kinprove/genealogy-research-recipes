claims:
  - {"id":"C-1471d52cff36","kind":"unclassified","anchor":"Record the deceased person's supported names, approximate death date, residences and known\nproperty locations. Keep competing same-named people separate. Determine the relevant court,\nrecord series and present custodian from the historical locality's descriptions or finding aids;\ndo not assume that a death location, an heir's residence or today's court name decides jurisdiction.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6bbe71c0b7fd","kind":"unclassified","anchor":"1. Save the locator and image of the starting index, will, bond or estate entry.\n2. Record the name and identifying context, the court/jurisdiction stated, the case or estate\n   number when supplied, and the document and recording dates actually present.\n3. List the probate-related series available for that court and period. A surviving will book,\n   administration docket, probate journal and loose case file are different retrieval targets.\n4. Identify the present custodian for each relevant series. Records may have moved from their\n   original court to an archive or another repository.\n5. If the person owned property elsewhere, inspect that locality's probate descriptions for a\n   related proceeding. Add a candidate case only with its own locator and identity check;\n   do not presume an ancillary proceeding must exist. [S1, S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-43f28d58b2bb","kind":"unclassified","anchor":"**Artifact:** A case register: case ID, deceased name, identifying context, court/time,\ncase number, candidate related cases, relevant series, coverage and present custodian.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aa20957fd2c3","kind":"unclassified","anchor":"If the expected court yields no case, do not report \"no probate\". Widen the search as a logged\nset of candidate courts and years. Include the residence and place-of-death courts when they\ndiffer, adjoining counties, and a court where heirs lived. Extend the years well past the death,\nbecause heirs might not file until something later, such as a land sale, required it. Each venue\nis only a search target. A hit there still needs its own locator and identity check, and none of\nthese places establishes jurisdiction. The\n[Tanner probate-finding segment](https://www.youtube.com/watch?v=oZiYbKNvxJY) and\n[later talks](https://www.youtube.com/watch?v=Yt91gmZt8sE) motivate this list. They supply no\njurisdiction rule or fixed time span for any state or period. [S1, S14]","sources":["S1","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4e21548dffc9","kind":"unclassified","anchor":"Treat names on a case wrapper as a finding aid, not an exhaustive person index. When\nindependently supported locality, family and time context justifies inspecting that case,\ndefine the internal packet scope rather than restricting it to wrapper-name matches.\nInspect the available documents within that scope, recording the actual person/event\neach concerns and the extent still uninspected. [Historical demonstration](https://www.youtube.com/watch?v=1FEjeMA41eg).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12b95d20bd54","kind":"unclassified","anchor":"Before treating a digitized folder or first volume as the whole case, find out how that court\nfiled estate papers. It may have kept one file per estate, split papers by party or claimant\nunder a case number, or recorded documents chronologically into general books as they arrived.\nIn split or chronological systems, take the docket or register's document list as targets and\nsearch later volumes across the case's active years.\n[Tanner's filing-system discussion](https://www.youtube.com/watch?v=FB2SNEW3hC0) and\n[court-records example](https://www.youtube.com/watch?v=JrcVzlwtnuQ) motivate this step. The\nsystem must be established for each court and period; neither source documents the filing system\nof a specific court. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2bea64dcbe9d","kind":"unclassified","anchor":"For a death in Russia in the late Soviet period or later, search the public notarial\ninheritance-case registry by full name. Enter each hit as a candidate case row: death date, case\nnumber and year, the opening notary or state notary office, and the notarial chamber named for\nfurther enquiry. Keep same-name hits as separate candidates. An entry may give no birth date or\nonly an uncertain one, so confirm identity from independent sources before linking it. Examples in\na [descendant-search thread](https://rodgersforum.borda.ru/?1-2-0-00001643-000-0-0-1734245901=)\nand a [wartime-relatives thread](https://rodgersforum.borda.ru/?1-23-0-00000042-000-0-0-1730531911=)\nmotivate this. An entry does not name heirs or show the file's contents. Neither thread shows the\nfile being opened, the registry's starting year, or what a missing entry means. [S16]","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0cc35864981b","kind":"unclassified","anchor":"For a Dutch will whose notary or date is unknown, Hoitink describes a historical Central Last\nWills Register filed by the testator's birth year. Where the inventory confirms that register\nand arrangement, take a matching entry's notary, notary's place, will date and number to the\nnotarial series. She also describes a death-duty file as a will locator, reached where applicable\nthrough its contemporary `table V-bis`; follow the will's notary/date/place reference actually\ngiven in that file. [S19]","sources":["S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-00c5c448fdd1","kind":"unclassified","anchor":"When an expected *bouppteckning* is absent, carry the supported name forms, death date,\nresidence and verified court coverage into the existing case register. Keep four questions\nseparate: was an inventory made, was a court copy filed, does a copy survive, and does the\nsearched index or image set expose it? A legal expectation alone answers none of them. [S24]","sources":["S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f018749038fb","kind":"unclassified","anchor":"- **Index and filing date:** apply the later-year search already described above, retaining\n  death and filing dates separately. ArkivDigital reports an example filed decades after\n  death; it supplies no universal filing interval. Where the available index supports them,\n  use justified name variants or wildcards, log the actual date coverage, and retrieve the\n  court document behind a candidate. Do not carry the talk's historical index-coverage claim\n  forward as a guarantee about the current service.\n- **Court copy and heirs' original:** the presenter distinguishes the copy filed with the\n  court from the inventory delivered to heirs. If the court copy cannot be found, queue an\n  heir-held original only when a family-paper inventory, citation or other evidence gives\n  a specific lead. Record its private custody and provenance separately; if both versions\n  are recovered, compare their text. A court-series miss does not locate a private original.\n- **Poverty certificate:** for an urban case with evidence suggesting this route, ask the\n  relevant custodian whether a priest's *fattigbevis* survives for that person and period,\n  and obtain its actual filing reference before requesting it. Record what an inspected\n  certificate says and its date; an empty probate search does not establish poverty or\n  prove that no inventory was made.\n- **Lifetime transfer:** if a dated instrument or reference supports a distribution during\n  life, retrieve it through [land-record recovery](land-index-book-series-recovery.md)\n  where applicable and link it to the estate question. Preserve the transferred property,\n  parties and date. Do not infer an empty estate or nonproduction from a later probate miss.\n  Poverty and lifetime distribution are possibilities mentioned in the talk, not diagnoses\n  for an unlocated estate. [S24]","sources":["S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-013997b50ebb","kind":"unclassified","anchor":"**Artifact:** for each branch, add its actual evidence, target/custodian, covered dates,\nretrieval result and remaining production or survival question to the case register.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c77b5f30bb81","kind":"unclassified","anchor":"If the packet has a coded document key, locate the collection's actual master legend before\ndecoding it. Keep both locators and compare the listed components with inspected documents;\ndistinguish listed-but-unseen parts from inspected parts absent from the key. The\n[probate-key example](https://familylocket.com/part-6-pennsylvania-germans-probate-records/)\nillustrates this check. A contents key does not certify complete survival or inspection.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f817272cda55","kind":"unclassified","anchor":"Before browsing an unindexed will register or a run of original wills, record how it is actually\narranged. A series described as alphabetical may be grouped only by the first letter of the\nsurname and then by probate date, or by month with blank leaves between months. Scan the whole\nletter group for the relevant period, and open both films when a month or letter continues onto\nthe next one. Record whether the filmed series includes administrations as well as wills. The\n[Part 2](https://www.youtube.com/watch?v=ckpu7brPLnI) and\n[Part 3](https://www.youtube.com/watch?v=Gwcf300h1sA) England and Wales examples motivate this\ncheck. The arrangement varies by collection and county, so a reel lacking a grant is not\nevidence that no grant exists. [S13]","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-acf88504ec72","kind":"unclassified","anchor":"1. Read the starting record for references to another volume, page, docket, journal or file.\n2. Enter each reference in a queue exactly as written, including the record series and book number.\n3. Open the referenced series and volume; locate the printed page using the viewer's available\n   navigation. Save the image locator separately.\n4. Confirm that the retrieved document concerns the intended case. Inspect its continuation,\n   and record any further references it supplies.\n5. Link the resolved row back to the document that cited it. If you cannot retrieve it, record\n   the specific outcome: locator unreadable, series not held, access restricted, page not found,\n   or request pending. Keep a tentative reading visibly tentative.\n6. Continue until every discovered reference has a recorded result or an explicit next action.\n   [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-155762863c8d","kind":"unclassified","anchor":"When an index or database abstract lists a will's heirs or beneficiaries, record that list as the\nindexer's derived data, separate from the will row. Read the will image itself and compare the two\nname by name. Mark any name that appears in only one of them as a discrepancy. Do not count an\nindex-only name as a separate person, and do not drop a will-named child because the index uses a\ndifferent name. Hand the reconciliation, for example against a household census entry, to the evidence\nworkflow. A [will-versus-index comparison](https://forum.ahnenforschung.net/forum/thread/2999515/)\nmotivates this check. It does not explain why the index differs, and it does not show that the\nwill is complete. [S15]","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ca690c00dc14","kind":"unclassified","anchor":"Inventory a loose original and a clerk's recorded copy as separate rows with separate locators,\nand record which form each image shows. A will in a will book is usually the court's recorded\ncopy rather than the document the testator signed. Consecutive entries in one hand indicate\ncopying, and signatures, marks and seals there are the copyist's renderings; do not infer the testator's\nsignature, literacy or handwriting from them. Where loose\noriginals were kept, queue the original as a separate target and record differences, such as a\nclause present only on the registered copy. If a wrapper or docket points to a recorded volume\nand page because the originals are missing, retrieve that copy, but do not report the original as\nfound. The [Maryland seal example](https://www.youtube.com/watch?v=Yt91gmZt8sE),\n[Middlesex docket example](https://www.youtube.com/watch?v=1oNhIhwKA6U),\n[Tanner's source-evaluation example](https://www.youtube.com/watch?v=iLEqf98ks9M),\n[consecutive-handwriting check](https://www.youtube.com/watch?v=FB2SNEW3hC0) and\n[Maris registered/original comparison](https://www.youtube.com/watch?v=Gwcf300h1sA) motivate\nthis. None of these\nexamples establishes routine recording or the survival of originals. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-82f7bfd1c527","kind":"unclassified","anchor":"If an index, docket or wrapper gives a packet or file number that the filmed or digitized\ncollection lacks, record the result as \"not in this copy\" rather than a missing document, and log\na pending request to the present custodian for that number\n([Huron County packet example](https://www.youtube.com/watch?v=D5weC7CmDlo)); this does not\nestablish that any court still holds or will retrieve an unfilmed packet. [S7]","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8bbe409418c3","kind":"unclassified","anchor":"1. Review the inventory for administration, guardianship, appraisal, accounts and settlement\n   material relevant to the case. Search the series actually held; not every case has every type.\n2. Try supported abbreviations and administrator or executor names when the deceased's full\n   name does not recover the relevant entry. Verify each candidate from its document.\n3. Do not restrict every search to the death year. Use dates already found in bonds, accounts,\n   dockets or settlements to extend a bounded search into later years.\n4. If a deceased person appears in a land document as a boundary reference, record that role\n   separately. Follow a relevant administrator/executor deed into a probate search; do not turn\n   an ordinary neighbor reference into evidence of another estate proceeding.\n5. Preserve an inventory of estate documents even when no will is located. An administration\n   account or appraisal remains a document to retrieve and examine, rather than a failed will\n   search. Do not declare intestacy solely because a will search failed. [S1, S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ff475b7f0988","kind":"unclassified","anchor":"If an inspected estate instrument defers distribution or control until a condition is met,\nretain its literal terms and locator. When independent records support a potential triggering\nevent and date, such as a specified beneficiary's later death, add a bounded search for later\nestate action to the queue. Record the condition, event evidence, selected court/series and\ndate bounds; verify any returned case link separately. Keep an uncertain condition or trigger\nunresolved, and do not assume a universal age or automatic reopening. Judy Russell's dated\nlate-estate example motivates this search input without verifying the narrated case or its\ngoverning law. [S17]","sources":["S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3a36028d87d5","kind":"unclassified","anchor":"If an account or receipt describes an administrator's journey, retain the actor, role,\ndate, destination and stated purpose. Use that purpose to nominate a bounded related court,\nland-office or transaction-record question in the existing queue, even without a book/page\ncitation; establish the actual series and custodian before retrieval. The [administrator-itinerary example](https://dna-explained.com/2023/07/16/new-information-about-philip-jacob-miller-c1726-1799-and-magdalena-possibly-rochette-c1730-1800-1808-52-ancestors-404/)\nmotivates the lead. The administrator's destination does not establish the deceased person's\nresidence, property, service or another estate proceeding.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6a378c3287e5","kind":"unclassified","anchor":"When selecting pages from a packet, include vouchers and receipts, not only the will, inventory\nand account summaries, and inventory each as its own row. Record each signer or payee, the share\nor item receipted, and any statement that one person signs for another, such as a husband for his\nwife's share. Mark payments worded as a distributive share separately from creditor payments,\nespecially when no final distribution survives. If a share is assigned to a deceased heir's\nestate, queue that estate as a candidate related case with its own court, date bounds and\nidentity check. The [Broglin probate interview](https://www.youtube.com/watch?v=PzZ4fwSbjq8) and\n[Abbott estate walkthrough](https://www.youtube.com/watch?v=880wgUzrmhQ) motivate this. Wording\nand proxy-signing rules vary by place and period. A receipt is an heir lead for the evidence\nworkflow, not proof of kinship. A receipt without share wording does not prove a creditor. Do not\npresume the deceased heir's case exists or was filed in the same court. [S8, S9]","sources":["S8","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-367e1e7dcf84","kind":"unclassified","anchor":"Do not skip guardianship or orphans' court entries because a parent survived: if minors may have\ninherited land or other property, search them in the estate's county and where the widow and\nchildren are later found ([guardianship tip](https://www.youtube.com/watch?v=CjjD9mI_dY8),\n[Pennsylvania orphans' court remarks](https://www.youtube.com/watch?v=QTASkh59sEU)). Requirements\nvaried by place and period; a failed guardianship search carries evidentiary weight only after\nestablishing the applicable requirement, the expected recording and adequate surviving coverage, and\na guardianship alone does not establish the father's death. [S10]","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-63ff384896f7","kind":"unclassified","anchor":"For a bounded ancestor, locality and period, reverse the guardianship question: look for wards\nfor whom that person acted, not only guardians of their own children. Inspect which roles the\nactual guardianship index names. If it omits guardians, a name-search miss is not a test of\nthe register; inspect a bounded relevant register range where its arrangement and available\nextent allow, or leave the lookup unresolved. Keep guardian, ward and parent as separate\nroles, and queue each located proceeding with its own locator. Hoitink suggests this reverse\nsearch; guardianship alone establishes no kinship. [S18]","sources":["S18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-816550a67681","kind":"unclassified","anchor":"Inventory each guardianship paper for the same minor as its own row. A court appointment and a\nlater nomination of the same guardian are separate events, not duplicates and not a change of\nguardian. Record any stated age bracket literally, such as \"under fourteen\" or \"above 14 years\n... has chosen him\", and whether the minor chose the guardian. Read the dated wording as an age bound: a\nminor \"above 14 years\" who \"has chosen\" the guardian was at least 14 and still under age on that\ndate, because the common law let a minor of 14 or over choose a guardian. When the mother's maiden\nname is unknown, a guardian with a surname other than the father's is a possible lead to her kin\nfor the evidence workflow; check it in that family's own probate and vital records. The\n[Warham Wheeler guardianship example](https://vitabrevis.americanancestors.org/the-warham-wheeler-affair)\nmotivates this. [S25]","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3f16804d89a2","kind":"unclassified","anchor":"If land passed jointly to several heirs, or the estate papers or deeds point to a suit, add a\nbounded search of the court's civil or equity series for a partition, sale or title suit. An\nheir, another household member or the administrator may have brought it. Recover a U.S. suit file\nthrough [court case files](court-case-file-recovery.md), and inventory it as a related case with\nits own locator and stated link to the estate; record each heir's name and residence as stated,\nincluding married names. Such suits could be the legal route to settlement or\nclear title, so a family-versus-family caption is not evidence of a feud. The\n[Family History Fanatics example](https://www.youtube.com/watch?v=CjjD9mI_dY8) and\n[court-records remark](https://www.youtube.com/watch?v=KjWd4X-7o_k) motivate this lead without\nsupplying local law. Not every jurisdiction required such a suit; establish the period's procedure before\ninterpreting a suit. [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-75a3dde42741","kind":"unclassified","anchor":"When the court file is lost or a packet is missing, search the county or regional newspaper's\nlegal notices for the estate. Look for claim or creditor notices, petitions to sell land to pay\ndebts (which may name heirs and describe the land), estate-sale notices and final-account hearing\nnotices. Enter each as a dated case-event row with its newspaper locator, linked to the case, and\nqueue the proceeding it points to. The\n[legal-notice examples](https://www.youtube.com/watch?v=Mr03rzuk2gA) motivate this substitute. A\nnotice shows only what was published, such as alleged heirs or a scheduled hearing. It does not\ngive the will's contents, the court's decision or a complete heir list. [S12]","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e154ddfa9a23","kind":"unclassified","anchor":"1. Sort document rows by the dates of the recorded actions while preserving the original\n   image order and locators.\n2. Check that each image belongs to the intended document and case. Separate a different\n   person's entry sharing the same page.\n3. Compare the reference queue with the inventory. Mark resolved references and retain any\n   missing documents or unsearched relevant series.\n4. Report what was retrieved, the holdings/series searched, and the limits of the search.\n   Completion means the recorded queue was handled within that scope; it does not certify\n   that every historical case document survives or has been found.\n5. Hand the source-linked documents to the evidence/proof workflow for identity, kinship and\n   conflicts. Keep transcript uncertainty and proposed relationships separate from retrieval\n   status. [S1, S2, S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-52e032cc008f","kind":"unclassified","anchor":"1. When a search or secondary account supplies an estate-related opinion lead, save the exact\n   query or source locator and the context that surfaced it. Copy the case name and citation\n   as supplied, preserving the stated jurisdiction, reporter, volume and page. Leave missing\n   citation components unresolved.\n2. Use those citation components to locate the full opinion in an available reporter or\n   legal-text collection. Save its locator and the pages actually inspected. Record whether\n   you have only an article, a citation/listing, a headnote/summary, or the full opinion text;\n   if the full text is unavailable, retain the citation and a specific next action.\n3. Read the retrieved opinion for references to wills, deeds or other estate instruments.\n   Enter each reference in the existing §2 queue as a separate, initially uninspected target,\n   linked to the citing opinion and its wording. Retrieve and check each instrument separately;\n   discussion of a deed or will in an opinion does not retrieve that instrument. Use the\n   [land-record recovery workflow](land-index-book-series-recovery.md) for queued deeds.\n4. Preserve the opinion's stated court separately from the estate-record court; one does not\n   establish the other. Keep the opinion-to-estate/person link and each instrument's identity\n   state separate from retrieval status. Reconcile the added rows through §4 and send unresolved\n   identity links to the [evidence/proof workflow](evidence-proof-judgment.md). [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2fce91067930","kind":"unclassified","anchor":"When a relevant lower-court file is missing and an appeal is evidenced, check the described\nappellate archival packet as a separate target from the published opinion. Its catalogue may\nuse a next friend, administrator or another litigant. Inventory transmitted pleadings,\ndepositions or a judicially reconstructed will with their own locators and record forms;\nkeep them distinct from the absent original. The [Dobkins appeal-copy example](https://dna-explained.com/2022/09/26/why-was-old-man-jacob-dobkins-will-fraudulently-secreted-concealed-and-destroyed-52-ancestors-375/)\nmotivates this fallback, without establishing current custody, a complete packet or the\nparticipants' final outcome after appeal or remand.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0fad1da1550f","kind":"method","anchor":"To decide whether a will image shows an original or a clerk's copy, examine the volume instead of judging from the single image. The Legal Genealogist reports paging back to the start of the volume to identify a bound will book, looking for pins or ribbons fastening an inserted document, and comparing the dates of surrounding entries with the will's date and the testator's death. The worked example is one bound Missouri will book, and no independent source was found for this test. [S29]","sources":["S29"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-5890c1e3ba33","kind":"method","anchor":"Where an original will survives alongside the will book entry, compare each heir's name in the two instead of accepting a clear, legible entry as an accurate list of the children, because copying errors occur and the differences can be minor or important. [S30], [S31] The Legal Genealogist reports, from two Tennessee county wills, a recorded copy that carried an entirely different child's name and originals held only on microfilm at a county archive; those specific examples were not independently verified. [S32]","sources":["S30","S31","S32"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4150868d4c0d","kind":"method","anchor":"When a will names many children, note which are grouped in the same clause with the widow and which are placed apart as already provided for, rather than extracting one sibling group of the widow or reading the split only as a difference in bequests. The Legal Genealogist reports treating such a split as a hypothesis of different mothers, to be tested against tombstone dates, family Bibles and similar sources, which belongs in the evidence workflow. The author says the grouping is not proof by itself, and the example is one North Carolina will. [S33]","sources":["S33"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f81e0df9884b","kind":"method","anchor":"Where an annual guardian's report has narrative text, read the paragraph ahead of the line entries rather than extracting only names and sums. The Legal Genealogist reports, from one 1896-1898 Louisa County, Iowa report book, that such paragraphs can show a ward's placement, custody with relatives, schooling and marriage consents, and treats a guardian's changed surname as a marriage clue; the author also says these accounts are often only line entries. [S26] Use a ward's attached receipt on reaching majority to bound a birth date only after checking the age for that place and sex and whether the ward married: under Iowa law through the Code of 1897, minority ended at 21 for males and 18 for females, and at marriage for any minor. [S27], [S28]","sources":["S26","S27","S28"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-a67d81815280","kind":"historical","anchor":"For Illinois land with underage heirs where dower, partition or sale was at issue, look for a court case, and do not read a filing over dower or partition as proof of a family dispute. A guardian's sale of a minor's land worked through a court order, and an 1877 decision held a guardian's sale decree void for lack of notice to the heirs. [S34], [S35] A partition decree had to include and represent minors. [S36] No Illinois authority was found that division or dower assignment always needed the court, so need is established only for guardian sales. The Legal Genealogist's example is one party's allegation in an 1880 McHenry County bill, and the post cites no statute for it. [S37]","sources":["S34","S35","S36","S37"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4511fde824b5","kind":"method","anchor":"Do not look for probate matters only in court files: The Legal Genealogist reports finding a probate court docket printed in a local newspaper, listing the matters scheduled for a court session and naming the role of the person acting, such as administrator or guardian. The example is one Missouri docket from August 1876, it could not be independently checked, and the post does not say how commonly newspapers printed such dockets. [S38]","sources":["S38"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-3ed87ba62346","kind":"custody","anchor":"For a Pennsylvania estate, search two sets of county series, even after a will is found. Wills, administration papers, will books, administration dockets and their indexes belong to the Register of Wills; real-estate divisions, the audit of accounts and the property and care of minor heirs belong to the Orphans' Court, which also appointed guardians and oversaw partition and distribution [S21 @2026-11-12], [S39 @2026-11-12]. In the State Archives' microfilm list, a county's will books, estate indexes and Orphans' Court dockets can sit under one office heading, the Register of Wills and Clerk of the Orphans' Court, and state law lets smaller counties consolidate these elected offices [S40 @2026-11-12]. One office can therefore hold both sets; search each series' own index or docket instead of treating the will index as covering the Orphans' Court.","sources":["S21","S39","S40"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-631788d827eb","kind":"portal-availability","anchor":"When a Pennsylvania index entry gives only a book and page, take them to FamilySearch's Pennsylvania, Probate Records, 1683-1994, which is browsed by county and volume through waypoints rather than searched by name [S41 @2026-11-12], [S42 @2026-11-12]. Open the named volume, go to the cited page, and record the image number separately [S21 @2026-11-12]. Do not stop at an index entry in Ancestry's Pennsylvania, U.S., Wills and Probate Records, 1683-1993, and do not read a missing image there as a lost record: that collection has searchable indexes, and not every entry has an image [S21 @2026-11-12], [S42 @2026-11-12].","sources":["S41","S42","S21"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-adc87e09beef","kind":"method","anchor":"Inventory an estate sale bill or vendue list as its own row, and copy each buyer with the item and price where the list gives them. Look for it with the inventory, in the case file or in a separate sales book. Buyers likely knew the deceased and can include relatives and associates; work first through those who bought more than two items [S44]. Flag a buyer of a family keepsake such as the Bible and a buyer who was also the administrator: in one 1821 Ohio estate, the author identified both as sons of the deceased from other records [S43]. Queue each flagged buyer as a separate candidate relative for the evidence workflow; a purchase alone does not prove kinship.","sources":["S44","S43"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ffe00df5e28b","kind":"method","anchor":"Do not expect a pre-1900 U.S. probate file to give the death date: the court needed to know that the person was dead, not when, so the record may give no date or only \"on or about\" a date [S68]. Probate records are inconsistent about death dates, and an index can carry a date that the record itself lacks [S69]. Enter a stated date with its wording. Otherwise bound the death by the earliest court action that requires it, such as the petition to open the estate or the will's proving, and not by the witnesses' testimony, which in some areas was taken when the will was written [S69].","sources":["S68","S69"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-be72cc302479","kind":"method","anchor":"Search the courts of the counties a person had left as well, even after the estate where he died is found and closed. An estate could be opened in a former county years later for money or property still there: in Neill's example, an estate was opened there ten years after the death in another state, to receive a settlement from a lawsuit that had taken years [S94]. A proceeding for assets in a state other than the one where the deceased lived is an ancillary administration [S95]. Enter such an estate as its own candidate case with its own locator and identity check.","sources":["S94","S95"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a761f988eee1","kind":"method","anchor":"Before reporting a woman's death or estate record missing, look for a late last marriage and search under that husband's surname as well as the name she had with her children's father. Neill calls the last husband's surname crucial to finding a woman's death and estate settlement [S88]; widowed and divorced women often kept a prior husband's surname unless they remarried [S89].","sources":["S88","S89"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0598e516206c","kind":"method","anchor":"Browse the county will book even when the person died intestate: in some U.S. areas, particularly before the Civil War, it also recorded inventories, appointments of administrators and executors, sale accounts and lists of disbursements [S84], [S86].","sources":["S84","S86"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-33572b1af5aa","kind":"portal-availability","anchor":"For a Virginia estate, search the Library of Virginia's Wills and Estate Records Index, which covers wills, inventories, sales and other estate records from 1633 to 1800 in the will books of fifty-one counties and cities, and in some cases estate records in county order books [S86 @2026-11-14]. Then search that county court's order or minute books, which record every matter brought before the court and can hold information from loose papers since lost [S87 @2026-11-14]. Do not assume a loose-paper estate file exists: Neill expects a 1760 Virginia will to leave references in the order books but probably no case file [S85 @2026-11-14]. Record which loose papers survive for that county before calling a file missing.","sources":["S86","S87","S85"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-108cdaee0c20","kind":"historical","anchor":"When no will survives for a colonial Maryland ancestor, search the court records [S56], and route them by date. Orphans' courts, each served by a register of wills, were first created under the Acts of 1777, so do not look for one earlier [S59]. The Provincial Court heard testamentary and guardianship cases until the Prerogative Court was established and guardianship passed to the county courts [S57]. From 1692 a deputy commissary in each county took probate, recorded each will, inventory and account in his own books and sent the papers to the Prerogative Office to be recorded again [S58]. Search both the county's books and the Prerogative Court's series.","sources":["S56","S59","S57","S58"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bdd9caf915ab","kind":"custody","anchor":"For a New Hampshire estate before 1771, search the provincial probate records, not a county court. Probate from 1636 to 1771 was filed at Exeter and Portsmouth, and the colonial probate files are now at the New Hampshire State Archives [S60 @2026-11-14], [S61 @2026-11-14]. Counties were created in 1769, but the provincial probate period runs to 1771 [S61 @2026-11-14]. For a town near the Massachusetts border, also search the Massachusetts county probate records [S61 @2026-11-14].","sources":["S60","S61"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e5af3fc95405","kind":"portal-availability","anchor":"For Connecticut, search by probate district, not by town or county [S60 @2026-11-14]. Look the town up in the Connecticut State Library's Probate Districts by Town guide, which gives the district or districts the town belonged to at different times [S62 @2026-11-14]. A district created later out of another does not hold the earlier estates: Colchester's district was created in 1832 out of East Haddam, so an earlier Colchester estate is in the East Haddam district [S63 @2026-11-14]. Repeat the check for the parent district's own creation date. Connecticut probate courts also handled guardianships, adoptions and conservatorships, so search the same district for them [S62 @2026-11-14].","sources":["S60","S62","S63"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-144fcaa8aed9","kind":"method","anchor":"Do not read \"my now wife\" in a will as evidence of an earlier marriage. Neill reads the phrase as naming the wife at the time the will was written, to make clear who takes a bequest, as in a farm left to \"my now wife\" and after her death to \"our children\" [S67]. Test an earlier marriage in other records.","sources":["S67"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
  - {"id":"C-ae51dab96313","kind":"method","anchor":"Treat a bequest to grandchildren as a lead that their parent died before the will, not as proof: a will can leave property directly to grandchildren whose parent is alive, as current North Carolina law states [S55]. A grandchild with another surname suggests a daughter's child, and one with the testator's surname a son's child [S51], but an unmarried daughter's child can carry the testator's surname. Confirm the parent's death and the line in other records before placing the grandchildren.","sources":["S55","S51"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-536c06f2d2af","kind":"method","anchor":"When the final settlement or division comes years after the death, check two ordinary causes before reading the delay as a family dispute. Common-law dower was a widow's life estate in one third of her husband's land, so the heirs' possession of that part waited until her death [S82]; a will could also give her a life estate [S80]. Property was divided once all parties agreed or all heirs were at least twenty-one [S83], and heirs could wait for the youngest to come of age rather than act through a guardian [S80]. Run the search for the final settlement or partition to the later of the widow's death and the youngest heir's majority, and search the land records as well as probate, because the final division can appear in either or both; in Neill's Kentucky example, the land was partitioned sixteen years after the death [S81].","sources":["S82","S80","S83","S81"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e173301f65d3","kind":"method","anchor":"Do not record the administrator of an intestate estate as the spouse or a child by default. The spouse and heirs usually had priority, but a spouse could refuse and children could decline, so another heir or a creditor could take the office [S96]; current North Carolina law, for example, ranks the spouse, then heirs, next of kin and creditors, and lets a person with priority renounce [S97]. Record the person in the role of administrator only, and research an unfamiliar administrator's relationship to the deceased, if any, in other records.","sources":["S96","S97"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b7178650bb95","kind":"method","anchor":"An administrator *de bonis non* was appointed to finish an administration that the earlier administrator could no longer complete [S91], [S92]. Queue the earlier appointment as its own row and look in the court's orders for why it ended; the court may state a reason or may simply relieve the earlier administrator [S91].","sources":["S91","S92"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7419ed60819e","kind":"method","anchor":"Search the probate index even for a person who left no property, and classify each hit by proceeding type before treating it as an estate. Probate courts could also decide a person's sanity before commitment to a state hospital: in Minnesota their records include insanity case files, in some counties numbered in one sequence with the estates, and insanity record books mostly dated before 1920 [S77]. Neill found two entries for one poor ancestor that were insanity cases, not estates [S76]. Take a commitment case to [institutional patient records](institutional-patient-record-recovery.md).","sources":["S77","S76"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5edf4a2c7bf4","kind":"method","anchor":"Inventory the final settlement or final account as its own row, and compare its heirs with those first named in the will, petition or early accounts. Heirs who died during the settlement can be replaced there by others who were not listed at first [S90]; settlement records also show heirs who died and women who married before the final settlement [S83]. Record each change as a dated event on the heir, and pass the division of the money to the evidence workflow as a clue to each heir's relationship [S90].","sources":["S90","S83"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-82bb0948629d","kind":"method","anchor":"For a relative who vanished, list the relatives who died after the disappearance and from whom that person stood to inherit, such as a sibling who died without children or a will, and search their estate files. To settle such an estate the court had to deal with the absent heir, and its file can record when the heir was last seen, testimony about the search, a court declaration that the heir was dead, or the heir's reappearance [S64], [S65]. A probate court can declare an heir missing for years dead for probate purposes and distribute the share to that heir's own heirs [S66]. Record such a declaration as a legal finding for that estate, not as a date or place of death.","sources":["S64","S65","S66"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07821afe3867","kind":"method","anchor":"When an item in an estate appraisal is illegible, read it against its neighbors. Appraisers usually walked the property, often room by room, so an appraisal tends to group items by place or purpose, and some name the room [S78], [S79]. Ask where the surrounding items stood (kitchen, barn, field) and what the unclear word could be in that group, then record the reading as an inference with that reasoning, not as a transcription. Grouping is less likely in a list of items sold than in the appraisal [S78].","sources":["S78","S79"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e39a092e0350","kind":"method","anchor":"Read a minor's guardian in an estate as the manager of the child's property, not as the child's household. Guardianship had little to do with physical custody; its main purpose was to manage and preserve the orphan's inherited estate [S52], and the children could stay with their mother while the guardian handled their inheritances [S51]. Do not move the children into the guardian's household or infer the mother's death from the appointment. An estate guardian shows the child had property to manage, since orphans who inherited nothing did not need one [S52]. If a guardian was appointed while a parent was alive, look for that property's source, such as a grandparent's estate or a land transfer: a guardian could be appointed even when a parent was alive if the minor personally owned property [S54], and Neill asks whether such an appointment kept a parent from spending an inheritance [S53].","sources":["S52","S51","S54","S53"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5126ca59cfe0","kind":"method","anchor":"Search for a will contest outside the probate series as well as in it. A separate suit over a will may be filed with the non-probate court records of the county where the estate was administered [S45]. Which court heard a contest depends on the place and period: in Tennessee a contested probate could be filed in the chancery or circuit court [S47]; Maryland's 1777 act let the parties in contested cases file in the general court, the chancery court or the county court [S59]; in England and Wales before 1858 disputes could go to the church courts or to secular courts, most often Chancery, and from 1858 went first to the new Court of Probate, though Chancery could still hear them [S46]. Recover a U.S. suit file through [court case files](court-case-file-recovery.md). Read the probate packet even for an intestate estate: it can hold a copy of a will the court refused to probate, which still carries family clues [S45].","sources":["S45","S47","S59","S46"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3fcc7950434d","kind":"method","anchor":"When a child seems to be omitted from a will, collect every probate record of the settlement, not only the will [S48], [S49]. Look for settlement deeds for property the will does not mention and note whether every heir signed, since an omitted child may still be an heir [S48]; look in the land records for a transfer between the deceased and that child [S49]; and search for a suit over the will's validity as above [S48]. Whether an omitted child took a share depends on the law of the place and date: at common law the omission was presumed deliberate, while pretermitted-heir statutes give an unintentionally omitted child the intestate share, in some states only a child born after the will [S50].","sources":["S48","S49","S50"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-42f3f595d67d","kind":"method","anchor":"Do not read the lack of a recorded lease as evidence that land had no tenants: a rental agreement generally did not have to be recorded [S73]. Look for leases and tenants in estate and court files. A lease in force at a death can be filed in the probate case, and a dispute can bring a copy of the lease or its terms into a court case [S72]; tenants can be named in an estate partition suit because they had an interest in the land, and a landlord-tenant suit can give lease terms [S70]. For a rural renter, read the probate and estate records for leases and rented property that place the family [S71], [S74]. A lease described as recorded in a case file was filed there as evidence, not recorded like a deed [S72], but still search the county's deed and lease books: Hamilton County, Ohio, recorded leases in its deed books from 1794 to 1848 and in separate lease books from 1848 [S75].","sources":["S73","S72","S70","S71","S74","S75"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-abfd9510bdd1","kind":"method","anchor":"Search newspapers for the estate even when the packet survives. Neill found newspaper items about estate papers that were never found and that the packet did not mention, and one of them reported that the deceased had been married before and had children with his first wife [S93]. Enter such an item as a dated row with its newspaper locator, and pass any family statement in it to the evidence workflow as a lead.","sources":["S93"],"checked":"2026-11-14","stated_as":"observation","review":"reviewed"}
