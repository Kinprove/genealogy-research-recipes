claims:
  - {"id":"C-72b1b1cf78e7","kind":"unclassified","anchor":"Treat an empty catalogue or online search as covering only the repository's processed, catalogued\nholdings. Do not write \"not held\", \"nothing found\" or \"searched [repository]\" on the strength of it.\nThe presenters describe vertical files as donated material that often never enters the card catalogue\nor indexed collection [S6], [S9]. They also describe accessioned donations waiting on shelves without\nbeing processed, filmed or put online [S1], [S2], [S3].","sources":["S6","S9","S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a3d398a04ccf","kind":"unclassified","anchor":"Ask staff about each category by name, on site or by email or phone. Melissa Barker presents these\nfour as collections that patrons usually cannot see and that staff usually do not volunteer, so you\nhave to ask for them [S1], [S3]:","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-07065641a634","kind":"unclassified","anchor":"1. **Vertical files.** These are folders arranged by surname or subject [S1]. Ask for the target\n   surname and also for the locality, church and relevant topics [S6], [S8]. They can be held by local\n   and state libraries, historical societies and state archives [S8], [S10]. Ask whether the repository\n   also keeps family files. A presenter describes one county library that puts everything asked about\n   a family into one file, including a past librarian's own search notes [S4].\n2. **The index to manuscript-collection finding aids.** Ask for the index itself, then the relevant\n   finding aid [S1].\n3. **Loose records.** These are court working papers such as affidavits and subpoenas, filed\n   separately from the bound minute books that are usually brought out [S1]. Ask for them by name\n   when only the minute books have been offered. A presenter also mentions boxes of court records\n   that went unexamined until a local group indexed them [S4]. Ask whether there are unexamined boxes\n   of court records, or boxes a local group has indexed.\n4. **Accessioned but unprocessed donations.** Ask whether there are recent or unprocessed collections\n   for the surname or place. Ask what the archivist's cursory accession inventory records about each\n   one [S1], [S3]. Barker says that asking shows interest in a collection and may move it up the list\n   for processing [S3]. Staff can describe this material by email or phone, but plan an onsite visit to see\n   it: these donations are not filmed or online, and Barker says you will most likely have to travel\n   [S2].","sources":["S1","S6","S8","S10","S4","S3","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-948cfc3055ef","kind":"unclassified","anchor":"When remote, ask staff to check a named family and area and to say what they checked [S9].","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-60a087a1ec8b","kind":"unclassified","anchor":"For each category and repository, log: what was asked, the date, who answered, and the state. The\nstate is one of: inspected; described only (for example from the accession inventory); access refused;\nnot held; unanswered. The presenters say some archives allow patrons to view unprocessed collections\nand others refuse outright [S2], [S3]. A refusal or no reply is not absence. Keep that material on the\nworklist as unsearched, with the collection named as staff described it [S2]. An accession inventory\ntells you what the archivist recorded on intake, not what the boxes actually contain.","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f45a79cce473","kind":"unclassified","anchor":"Check whether the repository has digitized any vertical files, but do not assume it has. The\npresenters say most remain on site only, with some exceptions [S6], [S10].","sources":["S6","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-523e3eee6a61","kind":"unclassified","anchor":"Cite a vertical-file item by repository, file heading (surname or topic) and item description. Name\nthe compiler where known: a donating researcher, a past librarian's search notes, or an earlier\nrelative's inquiry [S4], [S5], [S7]. Record the item's creator and date where visible.","sources":["S4","S5","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dc38f11923a5","kind":"unclassified","anchor":"Lisa Lisson reports finding photocopies of deeds, family Bible pages and photographs, as well as\nnewspaper clippings, in compilers' surname files, and says vertical files hold copies rather than\noriginal records [S5], [S10]. Label such items as copies held in the compiler's file. Do not cite them\nas the Bible, the deed or the newspaper. Clippings may be undated [S5]. Leave a missing date blank\nrather than inferring one.","sources":["S5","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-afdd5e3c421c","kind":"unclassified","anchor":"Lisson also describes Bible photocopies carrying citations to the original Bible [S5]. When a copy\ncarries such a citation, transcribe it into the log and list the original as a separate item still\nto locate. Also list the sources the compiler's notes say were used, as retrieval targets [S5].","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d3105aea7d30","kind":"unclassified","anchor":"Put pedigree charts, margin notes, conclusions, oral-history notes and family lore on a clue list\nmarked unverified until the cited sources have been checked [S4], [S5], [S7], [S10]. The presenters\nstress that such notes can contain mistakes [S7]. Two compilers telling the same family story are\nnot independent confirmation; record each version separately [S4].","sources":["S4","S5","S7","S10"],"checked":null,"stated_as":null,"review":"pending"}
