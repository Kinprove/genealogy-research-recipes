claims:
  - {"id":"C-72b1b1cf78e7","kind":"unclassified","anchor":"Treat an empty catalogue or online search as covering only the repository's processed, catalogued\nholdings. Do not write \"not held\", \"nothing found\" or \"searched [repository]\" on the strength of it.\nThe presenters describe vertical files as donated material that often never enters the card catalogue\nor indexed collection [S6], [S9]. They also describe accessioned donations waiting on shelves without\nbeing processed, filmed or put online [S1], [S2], [S3].","sources":["S6","S9","S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a3d398a04ccf","kind":"unclassified","anchor":"Ask staff about each category by name, on site or by email or phone. Melissa Barker presents these\nfour as collections that patrons usually cannot see and that staff usually do not volunteer, so you\nhave to ask for them [S1], [S3]:","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-07065641a634","kind":"method","anchor":"1. **Vertical files.** Ask for folders under the surname, locality, church and relevant subjects [S1, S6, S8]. Local and state libraries, historical societies and archives may hold them [S8, S10]. Ask whether the family folder includes earlier inquiries or a librarian’s search notes. In a Jennings County Public Library interview the researcher found both under the Whitcomb surname [S4].\n2. **The index to manuscript-collection finding aids.** Ask for the index itself, then the relevant\n   finding aid [S1].\n3. **Loose court records.** If staff bring out the bound minutes, also ask about affidavits, subpoenas and other papers filed with the case [S1]. Ask whether anyone indexed the boxes locally. GeneaVlogger’s interview describes the indexing of fifty boxes [S4]. Jennings County Public Library’s own guide names a separate surname database for copies of court files in its Gray Boxes [S11]. Use the file description and date to request the full case.\n4. **Accessioned but unprocessed donations.** Ask whether there are recent or unprocessed collections\n   for the surname or place. Ask what the archivist's cursory accession inventory records about each\n   one [S1], [S3]. Barker says that asking shows interest in a collection and may move it up the list\n   for processing [S3]. Ask what staff can inspect or copy remotely and whether viewing requires an on-site visit [S2].","sources":["S1","S6","S8","S10","S4","S11","S3","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-948cfc3055ef","kind":"unclassified","anchor":"When remote, ask staff to check a named family and area and to say what they checked [S9].","sources":["S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2238903f1ea","kind":"method","anchor":"For photographs of a local family, check surname and locality vertical files even when the catalogue\nlists no photographs [S13]. According to Lisa Lisson [S12†], you can inspect the folders on site or\nask staff to search them remotely. Confirm that the repository offers vertical-file\nlookups before relying on a remote search [S14].","sources":["S13","S12","S14"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-60a087a1ec8b","kind":"unclassified","anchor":"For each category and repository, log: what was asked, the date, who answered, and the state. The\nstate is one of: inspected; described only (for example from the accession inventory); access refused;\nnot held; unanswered. The presenters say some archives allow patrons to view unprocessed collections\nand others refuse outright [S2], [S3]. A refusal or no reply is not absence. Keep that material on the\nworklist as unsearched, with the collection named as staff described it [S2]. An accession inventory\ntells you what the archivist recorded on intake, not what the boxes actually contain.","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f45a79cce473","kind":"unclassified","anchor":"Check whether the repository has digitized any vertical files, but do not assume it has. The\npresenters say most remain on site only, with some exceptions [S6], [S10].","sources":["S6","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-523e3eee6a61","kind":"unclassified","anchor":"Cite a vertical-file item by repository, file heading (surname or topic) and item description. Name\nthe compiler where known: a donating researcher, a past librarian's search notes, or an earlier\nrelative's inquiry [S4], [S5], [S7]. Record the item's creator and date where visible.","sources":["S4","S5","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dc38f11923a5","kind":"method","anchor":"Identify what you actually handled: a photograph, photocopy, clipping or researcher’s notes. Record the repository, folder heading and item description before following the underlying source. Lisson describes finding both copied material and actual photographs in vertical files [S5, S10]. For an undated clipping, transcribe any visible newspaper title and leave the date unresolved [S5].","sources":["S5","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-afdd5e3c421c","kind":"method","anchor":"If a photocopied family Bible page gives a citation to the original, copy that citation into the log and identify exactly which pages the file contains [S5]. List the original Bible and any other records the compiler named as separate retrieval targets.","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d3105aea7d30","kind":"unclassified","anchor":"Put pedigree charts, margin notes, conclusions, oral-history notes and family lore on a clue list\nmarked unverified until the cited sources have been checked [S4], [S5], [S7], [S10]. The presenters\nstress that such notes can contain mistakes [S7]. Two compilers telling the same family story are\nnot independent confirmation; record each version separately [S4].","sources":["S4","S5","S7","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7eb7aa903f1","kind":"method","anchor":"Open the website of the library serving the town even after an empty catalogue search. Browse\n**Research**, **History**, **Resources**, or **Local Archives** for records, books and photographs.\nFollow links to local newspaper databases, genealogy sites and photo collections such as Flickr\n[S16, S17].","sources":["S16","S17"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-944a1f6b3f7d","kind":"method","anchor":"For newspaper issues missing online, check the town's library, according to Anna Rose Johnson\n[S15†]. Match the newspaper title and dates against the local history guide's microfilm and print\nlistings [S18, S19]. Keep any uninspected dates on the worklist.","sources":["S15","S18","S19"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a0458e3b56fc","kind":"method","anchor":"If the menus give no lead, search the library's website itself for keywords naming the collection\nor lookup service [S16].","sources":["S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-3a9f0f0afa90","kind":"method","anchor":"If the local newspaper's title or target dates are missing from the holdings list, search local\nhistory clipping files and scrapbooks separately. Search by surname, locality or subject and check\neach clipping against the target title and dates [S20, S21, S40].","sources":["S20","S21","S40"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a961a6b72bd9","kind":"method","anchor":"After a failed library site search, ask the librarian which guide lists the collection or whether\nthe library can do the specific lookup [S16].","sources":["S16"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-c392a2461741","kind":"method","anchor":"Use the society's collection summaries and partial indexes to name the relevant series or file\nwhen you ask about material absent online. If the society runs a museum, ask the archivist about\noff-display records and whether to request a lookup or book a research appointment [S22–S25].","sources":["S22","S23","S24","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-883db68baac9","kind":"method","anchor":"At Turku City Museum, ask which parts of the archive have detailed finding aids and whether staff\ncan consult the 1996 inventory for the rest [S24, S26].","sources":["S24","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-71568863e45a","kind":"method","anchor":"If Astia misses the Finnish National Archives' bound *Lääninhallituksen kuulutukset*, ask the Turku\nbranch to check its library holdings and confirm how to request the volume. The bound series cited\nby Östman in 2023 was absent from an Astia search in March 2026 [S27, S28].","sources":["S27","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b260f5e466df","kind":"method","anchor":"When an Astia entry lacks the detail needed to identify a file, check the branch's onsite finding\naids. In Turku, ask which details the catalogue-room card index or other onsite inventories can\nadd [S27, S29].","sources":["S27","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-007550c08b08","kind":"method","anchor":"For an older Finnish Literature Society (SKS) Library publication missing from Finna and Helka,\nask library staff to check the old main catalogue and the systematic subject card index [S30, S31].","sources":["S30","S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f6943a667aaa","kind":"method","anchor":"If Fennica lists a serial but omits the issue, give the National Library of Finland the serial\ntitle, issue number and year and ask staff to check the holdings [S32, S33]. In Kyläkoski's 2023\naccount, the library confirmed it held the omitted issue, no. 14 (2019), and corrected its\nrecord [S32].","sources":["S32","S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9f4124872423","kind":"method","anchor":"For a title at Borgå Gymnasium Library in Porvoo, check the printed 1906 *Borgå lycei\nbibliotekskatalog* and ask the librarian what the later cataloguing covers. Ask for maps and\natlases separately. A 2023 account describes the map gap in the printed catalogue, and the city's\n2026 account identifies historical atlases in the collection [S34, S35, S36].","sources":["S34","S35","S36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7d21247f3503","kind":"custody","anchor":"If a Finnish court pamphlet advertised in a newspaper is missing from *Finsk bok-katalog* and\nFinna, ask the National Library of Finland to search by subject in its small-print collection.\nGive the title, issuer, place, year and advertisement citation. Use the *Oikeusjutut* (Court Cases)\ngroup, PP1IId, for the 1810–1944 period [S38 @2026-11-22] [S39 @2026-11-22].","sources":["S38","S39"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8218a7104feb","kind":"example","anchor":"According to Kaisa Kyläkoski [S37†], both title searches missed Otto Edvard Dyberg’s 1879 pamphlet\n*Kuopion raastuvan-oikeuden tutkinto Zimmermann'in murhajutusta*.","sources":["S37"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-628fe6657623","kind":"method","anchor":"If the town library's holdings have a gap, check neighboring county libraries and, for a border\ntown, historical societies across the state line. If the town's former county was absorbed, check\nthe successor county's library too. Match the title and target issue dates against each\nrepository's holdings [S16, S41, S42].","sources":["S16","S41","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-260da3da4581","kind":"method","anchor":"If a town search yields no local society, use a state archive or statewide historical society\ndirectory to identify groups serving the town or county [S22, S46].","sources":["S22","S46"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cd9f6feb6e9a","kind":"portal-availability","anchor":"For Ohio, use the Ohio Local History Alliance's Member Organizations directory and follow the\nregion links to find societies serving the target locality [S46 @2026-11-23].","sources":["S46"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c01e44cc032e","kind":"method","anchor":"If the society merged, trace its former name to the successor. Check the successor's finding\naids under both society names for the collection and follow any transfer notice that names a\ndifferent holder. If the finding aids give no destination, ask the successor where the\ncollection went [S22, S44].","sources":["S22","S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14c5b7255b1d","kind":"method","anchor":"For a historic property, check the local society's site for a house-plaque program. Ask for the\nhouse-history file or the plaque application and its supporting records by the property's period\naddress [S22, S43].","sources":["S22","S43"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-fd4fb4c8a47f","kind":"method","anchor":"When a society names a digitization partner, search the partner's catalogue by contributing\ninstitution and collection title before treating a brief description on the society's site as the\nonly online access [S22, S45].","sources":["S22","S45"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6d56a8d19bfe","kind":"portal-availability","anchor":"For Elgin History Museum material, follow the Illinois Digital Archives collection links in the\nmuseum's *Museum Collections* guide [S45 @2026-11-23].","sources":["S45"],"checked":"2026-11-23","stated_as":"fact","review":"reviewed"}
