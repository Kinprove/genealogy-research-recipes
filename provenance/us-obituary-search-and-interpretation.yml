  - {"id":"S61","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/tips-to-find-ancestors-and-uncover-your-familys-past/"],"published":"2025-01-16","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Published post read 2026-11-21","entry_sha256":"076592b69a708364388b176ef9ef57a914ead7a15f57c62a9f58ea6246055976","claims":["C-obit-cousin-survivors"],"review":"reviewed"}
claims:
  - {"id":"C-obit-what-goes-wrong","kind":"method","anchor":"- Calling a search negative when no full obituary should be expected. Early-1800s death notices seldom gave more than the name, age and residence, and large nineteenth-century city papers carried less on fewer residents than rural and small-city papers. [S2] Not everyone had an obituary. [S3]\n- Searching only for the person's own notice. A sibling's or child's obituary can name the parents, the mother's maiden name and a woman's later married surname. [S1], [S4], [S5]\n- Stopping at the week of death. A card of thanks can appear right after the funeral or much later. [S6]\n- Taking stated relationships as verified. Most obituaries are not checked for accuracy, and survivors lists can mislabel or leave out relatives. [S1], [S3], [S7], [S8]\n- Reading praise as a balanced biography, or a missing detail as proof that it never existed. [S1], [S9], [S10]","sources":["S2","S3","S1","S4","S5","S6","S7","S8","S9","S10"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-expectation","kind":"historical","anchor":"- **An early death.** Allow for there being no obituary at all [S1]. Early-1800s death notices seldom gave more than the name, age and residence, and the biographical obituary developed mainly after the Civil War [S2]. In the nineteenth century, prominent citizens received long tributes while working-class notices stayed brief [S9].\n- **A large city.** Expect less on an everyday resident. Nineteenth-century papers in cities such as New York, Chicago and St. Louis carried less information on fewer residents than papers in rural communities and small cities [S2], and small-town papers often gave obituaries considerable space [S9]. Add the papers of neighbouring smaller communities before you call the search negative [S1], choosing them as [newspaper search recovery](newspapers-com-search-recovery.md) directs.\n- **Any date.** Not everyone had an obituary [S3]. Record a miss as \"no notice found\" in the titles and issues you checked, not as \"no obituary\".","sources":["S1","S2","S9","S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-relatives-first","kind":"method","anchor":"When the person's own notice is missing or thin, or names a woman only through her husband, search the obituaries of every sibling, child and spouse, not only those of direct ancestors [S1], [S3].","sources":["S1","S3"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-relatives-list","kind":"method","anchor":"- **A woman missing under her own name.** If a pre-1850 federal population schedule names only the head of household, a wife may appear only in a tally [S11]. Look for her in her children's obituaries [S1]. Search by the full name of a surviving child or sibling, or by her married surname with a daughter's or sister's married surname. Her married and maiden names together can find notices that list her parents or surviving brothers [S4].\n- **An unknown remarriage.** If the expected surname fails, look for the surname she had at death [S5]. Allow for a remarriage you do not know about, and take her later surname from a child's or sibling's survivors list [S1]. A survivors list can give daughters' and sisters' married surnames [S5].\n- **Parents and the mother's maiden name.** Search siblings' obituaries for the mother's name [S1]. In one notice Neill found that the surname attributed to the mother appeared to belong to the grandmother, possibly as her middle name [S7]. Keep the printed name under the stated generation and test both generations against marriage and birth records.\n- **Full and half siblings.** Compare each parent's children across marriages with the people named in the notice. In Neill's case the four listed siblings were three full siblings and one maternal half-sibling. Six paternal half-siblings were omitted [S8]. Record the relationship each notice actually gives and check parentage separately for every sibling.","sources":["S11","S1","S4","S5","S7","S8"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-search-window","kind":"method","anchor":"Search the death notices and obituaries in the issues around the week of death [S1], then widen the window and record its limits in the search log. An obituary could take time to be written and submitted [S2], and a card of thanks, in which the family thanked the community, may appear right after the funeral or much later [S6]. Cards of thanks tied to deaths appear from the later nineteenth century; the earliest that the GenealogyBank author found is from 1879 [S6].","sources":["S1","S2","S6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-card-of-thanks","kind":"method","anchor":"Read a card of thanks for relationships and leads. It may describe the deceased as a wife and mother, or a survivor as a widow, which helps date a husband's death. It may give a wife's maiden name, a minister and church, or an employer and lodges [S6]. Relatives may appear only by initials or by relationship, so search for those forms too [S6].","sources":["S6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-funeral-cards","kind":"historical","anchor":"Ask the user whether family papers hold a funeral or memorial card for the person [S1]. Early cards told family and friends of the death and of the funeral and burial services; later cards were handed out at the wake, funeral and interment as keepsakes. They give birth and death dates and places and sometimes family members' names, some larger cards carry a photograph, and a card can lead to the funeral home, church and cemetery [S12]. Record what the card actually carries; do not assume that it reproduces the obituary.","sources":["S1","S12"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-funeral-card-contact","kind":"method","anchor":"Asking a relative or family friend who attended the funeral whether they kept a card [S1] contacts a living person and tells them about the user's research. Use only a route the user already has, or a relative who agrees to pass the message on. Apply the consent, disclosure and log rules of [DNA match outreach staging](dna-match-outreach-staging.md), skipping the parts that apply only to DNA tests, and answer the privacy gate in `SKILL.md` before the message is sent. Until then the message stays an unsent draft on the user's device.","sources":["S1"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-informant-chain","kind":"method","anchor":"Errors can enter at each step, from the informant to the funeral home to the newspaper [S1]. Most obituaries are not checked for accuracy, stated relationships may be wrong, and a poorly edited survivors list can be read in more than one way [S3]. In the nineteenth century, many notices were written by editors or ministers rather than by the family, and names could be misspelled or abbreviated [S9].","sources":["S1","S3","S9"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-explicit-relationships","kind":"example","anchor":"Check the relationship label against a record that identifies the same people in another role. Eliza Bryant's Atlanta death notice listed her children as her brothers and sisters [S1]. Compare each relative's own notice as well. Neill found that the named relatives and their stated relationships could differ between notices in a family with remarriages or divorces [S7].","sources":["S1","S7"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-omissions","kind":"method","anchor":"A missing spouse, child, sibling, employer or military service is not evidence that none existed. When a notice mentions two marriages but gives no outcome for the first, search for both a death and a divorce before assigning an end date [S10]. Record the omission with the printed wording. Space, cost and the informant's knowledge can affect what the family includes [S1], [S10].","sources":["S10","S1"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-praise","kind":"method","anchor":"Read praise as a portrait, not as a balanced biography. Editors sometimes embellished lives, especially those of prominent people, and left out less flattering details [S9]. The MyHeritage author finds that obituaries show the deceased in the best light and may leave negative events out [S1]. Silence in an obituary does not show that nothing adverse happened.","sources":["S9","S1"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-to-issue","kind":"method","anchor":"Use the newspaper title and publication date from the hit to open that issue, even when the date of death differs. If the hit gives a page or column, go straight there. Read the notice and any accompanying caption on the original page, and record what the text actually attributes. Keep the index entry as a locator [S13], [S14], [S29].","sources":["S13","S14","S29"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-tuscaloosa","kind":"portal-availability","anchor":"- **Alabama, Tuscaloosa County.** MyHeritage's county index points to *Tuscaloosa News* notices from 1942 onward. Use age at death and death date to distinguish candidates, then use the publication date to retrieve the issue [S14 @2026-11-18], [S15 @2026-11-18].","sources":["S14","S15"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-pueblo","kind":"portal-availability","anchor":"- **Colorado, Pueblo County.** MyHeritage's county index points to *The Pueblo Chieftain* notices from 1868 onward. Carry the publication date into the newspaper search [S14 @2026-11-18], [S16 @2026-11-18].","sources":["S14","S16"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-fairfield","kind":"portal-availability","anchor":"- **Connecticut, Fairfield County.** MyHeritage's county index lists records from 1830 onward and typically gives the deceased's name and publication date. If the hit gives a date alone, use it to check the likely titles and leave the paper unidentified until you find the notice [S13 @2026-11-18], [S17 @2026-11-18].","sources":["S13","S17"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-boise","kind":"portal-availability","anchor":"- **Idaho, Boise.** MyHeritage's Boise index starts in 1957 and points to the *Idaho Statesman* and *Idaho Daily Statesman*. Use the title on the hit [S13 @2026-11-18], [S18 @2026-11-18]. Boise Public Library's *Idaho Statesman* index supplies publication dates for 1957–2017 [S19 @2026-11-18].","sources":["S13","S18","S19"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-hendricks","kind":"portal-availability","anchor":"- **Indiana, Hendricks County.** Use MyHeritage's county index for entries from 1872 onward. Compare the burial place and spouse when supplied, then use the paper and publication date on the hit [S14 @2026-11-18], [S20 @2026-11-18].","sources":["S14","S20"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-lake-county","kind":"portal-availability","anchor":"- **Indiana, Lake County.** Look for the *Post Tribune*, *Lake County Star* and *Crown Point Register* [S13 @2026-11-18] in Lake County Public Library's title-specific indexes and corresponding microfilm. Check the *Post Tribune* issues directly for 1987–1989, when its online index is incomplete [S21 @2026-11-18].","sources":["S13","S21"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-mcpherson","kind":"portal-availability","anchor":"- **Kansas, McPherson County.** Use MyHeritage's county index for its newspaper title and issue date. McPherson Public Library's local newspaper microfilm starts in 1872. Base the issue search on the cited paper and issue date, since the collection's stated 1841 start predates the county's first newspaper [S13 @2026-11-18], [S22 @2026-11-18], [S23 @2026-11-18], [S24 @2026-11-18].","sources":["S13","S22","S23","S24"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-daviess","kind":"portal-availability","anchor":"- **Kentucky, Daviess County.** Use the Daviess County Public Library's Owensboro Area Obituary Index for Owensboro papers. Use the indexed obituary date and expand the source code before looking up the issue. MI identifies the *Owensboro Messenger & Inquirer*, OM the *Owensboro Messenger*, and OI the *Owensboro Inquirer* [S13 @2026-11-18], [S25 @2026-11-18].","sources":["S13","S25"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-columbiana","kind":"portal-availability","anchor":"- **Ohio, Columbiana County.** MyHeritage's county index points to the *Salem News*, with entries dated from 1934 and occasional parent and spouse names. Use the publication date to locate the issue [S13 @2026-11-18], [S26 @2026-11-18]. Check the Salem Public Library's gap list before relying on a miss in its local index [S27 @2026-11-18].","sources":["S13","S26","S27"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-williams","kind":"portal-availability","anchor":"- **Ohio, Williams County.** Use MyHeritage's county index for entries from 1863 onward. Keep the paper title with the publication date so you open the right issue [S14 @2026-11-18], [S28 @2026-11-18].","sources":["S14","S28"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-former-residence","kind":"method","anchor":"Browse death columns in papers from the person's documented former residences as well as the place of death. Include a former hometown even when it is outside the region where the person died [S34], [S35].","sources":["S34","S35"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-tea-party-notices","kind":"method","anchor":"When testing a claim of Boston Tea Party participation, browse nineteenth-century death columns, including those headed `DIED`, for wording that ties the person to the destruction of the tea [S36], [S37]. Record what role the notice claims, including whether the person took part or witnessed the event, and check that role against an independent account [S37].","sources":["S36","S37"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-philadelphia","kind":"portal-availability","anchor":"- **Pennsylvania, Philadelphia.** Search the *Philadelphia Jewish Exponent* obituary index on MyHeritage or JewishGen by the deceased person's public name. Compare age at death and birthplace when supplied. The index spans 1887–2013 with gaps. On a miss, check JewishGen's coverage list and go directly to issues in the gaps [S30 @2026-11-20], [S31 @2026-11-20], [S32 @2026-11-20]. Use the publication date and any page number to locate the original through Temple University's *Jewish Exponent* holdings guide [S33 @2026-11-20]. If JewishGen shows `Nerc'y` in the page field, browse the necrology in the dated issue [S32 @2026-11-20].","sources":["S30","S31","S32","S33"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-accident-chronology","kind":"method","anchor":"When a family story attributes a death to an accident abroad, compare the death notice with news coverage around the death and around the reported accident. Record the date and attributed cause of death, then date the earlier episode and any reported return separately. A corroborated return and a later death notice can overturn a claim that the person died on the trip [S38]. Check whether the death coverage actually links the accident to the death [S35], [S38].","sources":["S38","S35"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-cousin-survivors","kind":"method","anchor":"For a first cousin who is hard to place in historical records, check the survivors lists in the obituaries of the cousin's deceased parents and grandparents [S61]. Treat the printed relationship as a lead. Use the gated index search below if you need to retrieve a notice, and apply §6 to any living survivor.","sources":["S61"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-odt","kind":"portal-availability","anchor":"Search Ancestry's *Web: Obituary Daily Times Index, 1995–2016* for notices in that date range. If the hit gives a publication place and date without a title, check the papers serving that place on that date. For a later notice, go to the relevant local index or newspaper issues [S39 @2026-11-21], [S40 @2026-11-21].","sources":["S39","S40"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-illinois","kind":"portal-availability","anchor":"- **Illinois, statewide.** MyHeritage's *Illinois Obituaries* index starts in 1831, with entries concentrated in the *Chicago Daily News*, *Illinois State Journal*, *Chicago Tribune* and *Denni Hlasatel*. Use the publication place and date to narrow the issue search, checking which papers actually served that place [S46 @2026-11-21], [S47 @2026-11-21].","sources":["S46","S47"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-kane-county","kind":"portal-availability","anchor":"- **Illinois, Kane County.** MyHeritage's county index lists entries from 1850. Use the publication date to pick the issue. Check the Illinois Newspaper Project's Aurora holdings for the title in use that year, including the *Aurora Beacon* for early dates [S46 @2026-11-21], [S48 @2026-11-21], [S49 @2026-11-21].","sources":["S46","S48","S49"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-porter-county","kind":"portal-availability","anchor":"- **Indiana, Porter County.** MyHeritage's county index includes *The Northwest Indiana Times* and *The Valparaiso Vidette Messenger* notices from 1913 onward. Compare the death date in the private log, then open the title and issue dated on the hit [S41 @2026-11-21], [S42 @2026-11-21].","sources":["S41","S42"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-wells-county","kind":"portal-availability","anchor":"- **Indiana, Wells County.** Compare birth and death details, cemetery, parents, spouse and marriage date when present on a MyHeritage county index hit. Use its publication date to locate the notice [S46 @2026-11-21]. Search Wells County Public Library's downloadable Cem-Obit spreadsheet locally for marriage or plot details and whether a notice was scanned [S50 @2026-11-21].","sources":["S46","S50"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-kansas-fraternal","kind":"portal-availability","anchor":"- **Kansas, fraternal notices.** For a lodge lead, compare residence and death date in MyHeritage's *Kansas, Fraternal Order Death Notices* index, dated 1860–1969 [S58 @2026-11-21], [S59 @2026-11-21]. Search the Kansas Historical Society's fraternal order index by the deceased person's public name for the order and lodge. Use its coverage by order and proceedings call numbers to locate the original notice in the order's proceedings [S60 @2026-11-21].","sources":["S58","S59","S60"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-louisiana","kind":"portal-availability","anchor":"- **Louisiana, statewide.** MyHeritage's Louisiana index starts in 1809 and includes the *Times-Picayune*, *The Advocate* and the *Lake Charles American Press*. Compare residence, death date, age and spouse in the private log. Use the exact paper on the hit with the publication date, including when the hit names the *New Orleans States* or the *New Orleans Item-Tribune* [S46 @2026-11-21], [S51 @2026-11-21].","sources":["S46","S51"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-washington-county","kind":"portal-availability","anchor":"- **Maryland, Washington County.** MyHeritage's county index lists entries from 1790. Use the paper title and publication date to locate the issue [S41 @2026-11-21], [S43 @2026-11-21]. For Hagerstown notices, also check the Washington County Free Library's Obituary Locator [S44 @2026-11-21].","sources":["S41","S43","S44"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-boston","kind":"portal-availability","anchor":"- **Massachusetts, Boston.** MyHeritage's Boston index starts in 1932 and includes the *Boston Globe*, *Boston Herald* and *Boston Evening Transcript*. Compare residence and death date in the private log. Use the indexed paper and publication date to choose the issue [S41 @2026-11-21], [S45 @2026-11-21].","sources":["S41","S45"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-genesee-county","kind":"portal-availability","anchor":"- **Michigan, Genesee County.** Use MyHeritage's county index for *Flint Journal* notices from 1920 onward. Use the death date to distinguish hits and the publication date to pull the issue [S46 @2026-11-21], [S52 @2026-11-21].","sources":["S46","S52"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-obit-index-chemung-county","kind":"portal-availability","anchor":"- **New York, Chemung County.** MyHeritage's 1900–1968 county index draws chiefly from the *Elmira Star-Gazette*. Compare the death date and use the publication date to check the paper. Check other local titles if the hit leaves the title unclear and the notice is missing from the dated *Star-Gazette* issue [S46 @2026-11-21], [S53 @2026-11-21].","sources":["S46","S53"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
