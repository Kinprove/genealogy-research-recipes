  - {"id":"S58","kind":"web-page","urls":["https://blog.myheritage.com/2024/01/myheritage-adds-26-million-historical-records-in-december-2023/"],"published":"2024-01-01","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Published post read 2026-11-21","entry_sha256":"3c67ac4af340e8728561650f40fba6077ef77bddbded5b640c952ed40416b82e","claims":["C-obit-index-kansas-fraternal"],"review":"reviewed"}
  - {"id":"S59","kind":"catalogue","urls":["https://www.myheritage.nl/research/collection-20741/kansas-overlijdensberichten-van-de-broederlijke-orde?legacyCategoryCollectionUrl=1"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Dutch public collection description read 2026-11-21","entry_sha256":"a73aaf8a88bcafbb92cc8a192755cbab345c6d6ea16e35b674d08eeb8199ae5b","claims":["C-obit-index-kansas-fraternal"],"review":"reviewed"}
