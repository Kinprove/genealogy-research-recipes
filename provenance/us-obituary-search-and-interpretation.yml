  - {"id":"S55","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-20715/new-york-steuben-county-obituaries"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Public collection description read 2026-11-21","entry_sha256":"cfba31d95c99fd0f076ba6d1b4c23169dd009cb492a993c3e5069c56f8af257c","claims":["C-obit-index-steuben-county"],"review":"reviewed"}
