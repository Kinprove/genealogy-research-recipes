claims:
  - {"id":"C-step-01","kind":"portal-availability","anchor":"Start with Translocalis for local letters printed in the Finnish-language press through 1885. Use the place of dispatch and any author or pen-name metadata, and check links to reprints and sequel letters. Run a separate text search in the digitized issues under the signature and known initials. Open the issue and record the actual printed byline [S1 @2026-11-22], [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-02","kind":"method","anchor":"A gap under one signature leaves the writer's publication history open. Check the paper at the writer's next posting and search other titles under the known names. Include local letters, poems and riddles in the issue search, and check the press history for editorship or a recurring character attributed to the editor [S1], [S3], [S5].","sources":["S1","S3","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-03","kind":"method","anchor":"Search a known legal name and pen name within the same title and across periodicals and book credits. Where dates or names are given for a work, open each cited issue and record whether it contains the same text, another instalment or a different contribution [S1], [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-04","kind":"method","anchor":"Keep signature, editor or character, dispatch place and date, and publication date in separate fields. Date the span of located work, then search later signed notices for evidence of the writer's whereabouts. If a byline appears after a documented death, record the later publication and test for posthumous publication or another writer using the same signature [S1], [S3], [S4].","sources":["S1","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
