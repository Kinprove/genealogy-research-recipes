  - {"id":"S115","kind":"statute","urls":["https://ru.wikisource.org/wiki/%D0%97%D0%B0%D0%BA%D0%BE%D0%BD_%D0%A0%D0%A1%D0%A4%D0%A1%D0%A0_%D0%BE%D1%82_20.11.1990_%E2%84%96_340-1"],"published":null,"retrieved":"2026-11-16","access":"read","rights":null,"basis":"read 2026-11-16","entry_sha256":"013dd3d6a1f489829333894380ad04a005cb2a763894178dd97d07396d5632bf","claims":["C-cdb7b10a4c93"],"review":"reviewed"}
