claims:
  - {"id":"C-f3b541888934","kind":"method","anchor":"- **Officials, clergy, teachers, foresters, postal staff and elected councillors.** Search the Regierung’s *Amtsblatt* for appointments, departures, transfers, promotions, pensions, election terms, examinations and qualifications. Include half-yearly postal transfers and teaching qualifications for women. A Königsberg extract names two women qualified for teaching posts, which gives a dated lead even without an appointment [S2].\n- **Bavarian Palatinate teachers.** Match the year to the Speyer series: *Amts- und Intelligenzblatt des Königlich Bayerischen Rheinkreises* (1831–1837), *Königlich bayerisches Amts- und Intelligenzblatt für die Pfalz* (1838–1853), or *Königlich-bayerisches Kreis-Amtsblatt der Pfalz* (1854–1918). Issues 1–7 of 1838 carry a variant title [S6]. Use the Bavarian State Library’s issue calendar for digitised holdings [S7]. For an earlier year, identify the title in the ZDB. Compare the gazette with the regional press for appointments and transfers [S4].\n- **Foreign subjects in Imperial Germany.** Search for *Ausweisung von Ausländern aus dem Reichsgebiete*. Trier transcriptions for 1894, 1900 and 1901 include Russian subjects born in Courland and Livonia [S1]. Use these years as starting points and establish coverage for the years you need.\n- **Émigrés of the 1930s–40s.** Search the *Reichsanzeiger* expatriation lists for each family member from departure onward. A Berlin family’s reported entries appeared in June 1938, years after the reported departure [S3]. The Mannheim issue calendar identifies 22 June 1938 as issue 142 [S8]. Verify names and dates on the notice itself.","sources":["S2","S6","S7","S4","S1","S3","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-681e52bc31f9","kind":"method","anchor":"- **Work through the gazette one year at a time.** Where a volunteer or a publication offers per-year extracts, ask for every year of the person's working life.\n- **Log the names, spellings and years actually covered.** A Königsberg reply gives extracts for Wegner and Krutein from 1814 to 1868 [S2]. A gap in those extracts cannot establish a negative search of the whole run.\n- **Search spelling and prefix variants.** The Königsberg extracts include *Wegner*, *Wegener* and *v. Wegner* [S2]. Search all forms and test each candidate by title, place and date.\n- **Record the transcription level.** Cite the gazette title, year, issue and page where available. A 1938 summary supplies an address for a father and son but omits it for the wife [S3]. Mark her residence *not transcribed* until you inspect the printed entry.","sources":["S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a638189f03e2","kind":"method","anchor":"- **Issuing authority.** Record it as printed. Examples are the Royal Prussian Regierungspräsident in Potsdam or Königsberg, or the Imperial Bezirkspräsident in Straßburg [S1].\n- **Date and its label.** Transcribe *Datum des Ausweisungsbeschlusses* as the date of the expulsion decision. The 1894 extracts carry that label, while extracts from 1900–1901 give dates without it [S1]. Keep the role of a bare date open until you inspect the notice or column heading.\n- **Name.** Record name forms separately.\n  - Keep a second surname and its identifying mark as printed. In the posted seamstress entry an asterisk occurs both before a second surname and before the birth date [S1]. Check what each mark introduces in the original before assigning a birth surname.\n  - Record parenthetical added names such as *(Sara)* and *(Israel)* separately and search for variants with and without them [S3]. Verify birth names in the birth record.\n- **Occupation, title and headings.** Preserve the wording, including *a. D.* for a former office holder [S1], [S3]. A seminary-exam extract puts the candidate under *Litthauer* but gives Pokraken near Tilsit as his home place [S2]. Transcribe the heading and home place separately; neither supplies a recorded birthplace.\n- **Birth date, or age.**\n  - Keep the age with its reference date. An expulsion extract gives 65 years at the 1894 decision [S1]; an exam extract gives 22½ at Michaelmas 1843 [S2]. Derive a range at the precision of the recorded age.\n  - Turn an age into a birth-year range. A candidate whose birth year falls outside that range ranks lower but is never excluded.\n- **Birthplace.** Record the town, governorate and country as printed.\n- **Registration community (*ortsangehörig*) or citizenship.** Read the grammatical antecedent of *ebendaselbst* (“in the same place”) before copying a town. In the 1894 extract, Durben is the birthplace and Hasenpoth the named registration community; in the 1901 Mitau extract, *ortsangehörig ebendaselbst* refers back to Mitau [S1].\n  - **When an entry states only citizenship** (*russischer Staatsangehöriger*), record the registration community as *not stated*. Do not fill it with the birthplace.\n- **Last residence (*letzter Wohnsitz*).** Expatriation lists give it. Record the house number as printed [S3].","sources":["S1","S3","S2"],"checked":"2026-11-13","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f3c1ad93565b","kind":"method","anchor":"- **Separate the publishing gazette, the issuing authority and the residence.** Trier’s gazette reportedly printed expulsions ordered in Potsdam, Königsberg and Straßburg [S1]. Search another district’s surviving gazette when the local run is missing, then verify that it carried notices for the year and authority in question.\n- **Use the posting printed in a personnel notice.** A Königsberg extract records a transfer to Gumbinnen [S2]. Search the named posting and use the office, name and dates to test the next link.\n- **Record the administrative act.** Enter *expulsion ordered* when the notice says so and preserve the date label [S1]. Look for later residence, border or passenger records to establish whether and when the person left.\n- **Keep conflicting house numbers.** A Berlin family’s reported telephone-book address was Schaperstr. 24 and the reported 1938 last residence was Schaperstr. 21 [S3]. Check both originals and their dates before inferring a move.","sources":["S1","S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1c40d313f8a8","kind":"method","anchor":"- **Give every family member a separate row and a source for each populated field.** The 2 October 1940 account uses *Dasselbe für ihren Ehemann* (“the same for her husband”) and gives his names and titles, but cites no issue [S3]. Search the original for both spouses; leave his address and the publication date unverified until the notice identifies them.\n- **Do not assume relatives share one list.** Search each person separately across every list date. Record each list you searched that gave no hit.","sources":["S3"],"checked":"2026-11-13","stated_as":"observation","review":"reviewed"}
  - {"id":"C-81cd6bb0727c","kind":"method","anchor":"- **Build one dated chain per *candidate*.** Link appointments, exam results, transfers, elections and retirements, and have each link cite its own gazette and year [S2], [S4].\n- **Cross-check regional staff lists.** For Palatinate teachers, look up the 1870 *Beamtenverzeichnis und Statistik des Königlich Bayerischen Regierungsbezirkes der Pfalz* (Speyer) on Bavarica and Grünebaum’s *Das israelitische Schulwesen in der Pfalz* in the *Israelitische Annalen*, arranged by rabbinate district [S4].\n- **Tie an appointment date to its own notice.** A summary dates Moses Eigner’s provisional Rockenhausen appointment to 28 October 1834 but lists its sources together; a transcription of Grünebaum’s list gives 28 October 1837 for M. Eigner [S4]. Search both years and compare the full name, office and action before deciding which dates refer to the appointment.\n- **Treat initials-only list entries as candidates.** Entries with one initial and a surname rank lower. Confirm them through a notice that gives the full name.\n- **Separate same-name candidates before chaining posts.** Use title, place and date: a Königsberg surname run includes a forester, a postal secretary and elected councillors [S2]. A shared surname cannot connect their postings.","sources":["S2","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ede92ac83bcf","kind":"method","anchor":"- **Match each candidate against independent identifiers before joining rows.** An Otto Landsberg restitution-file hit gives Magdeburg while the transcribed 1938 notice gives a Berlin street address [S3]. Compare the dates, occupation and full addresses before accepting or dismissing the hit.\n- **Use the fields to target the next search:**\n  - **Last residence:** search the town’s address books for the years before the notice. A link to the 1931 Schneidemühl directory supplied a lead but no reported lookup result [S3]. Open the volume and record the entry or the search coverage.\n  - **Registration community:** the registration records of that community, not those of the birthplace [S1].\n  - **Posting, or home place in an exam notice:** the parish or civil registers of that place [S2].","sources":["S3","S1","S2"],"checked":"2026-11-13","stated_as":"observation","review":"reviewed"}
  - {"id":"C-708400784dc6","kind":"custody","anchor":"**For a Berlin residence, ask for a search of the resident-registration card index (*Einwohnermeldekartei*), and use the address and telephone books.** Addresses were recorded officially from 1874, and Berlin's police stations kept residents' data on printed cards. The original central index was moved out of the city in 1943 and is considered lost. The Landesarchiv Berlin holds the West Berlin index, rebuilt after the war from cards kept at police stations. It covers residents who were in the city after 1945 and had deregistered by 1960, and it is incomplete for the years before 1945. A new index of the whole population was begun in 1945. It was in East Berlin from 1948 and is now kept by the Landesamt für Bürger- und Ordnungsangelegenheiten (LABO). For anyone still registered in Berlin after 1960, the LABO, not the Landesarchiv, is responsible [S5 @2026-11-13]. The yearly address books, printed from the registration index, survive complete to 1943. The Zentral- und Landesbibliothek Berlin has digitised them, together with telephone books to 1991 [S5 @2026-11-13]. For a person who left or died before 1945, start with the address books, and still ask for a search of the West Berlin index: it is incomplete for those years, so a miss does not show that the person was never registered.","sources":["S5"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
