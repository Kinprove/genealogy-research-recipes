  - {"id":"C-country-scope","kind":"platform-ui","anchor":"Enable Country Coding with the globe control for each tree under review. Check whether Settings use birth and baptism or death and burial before comparing flags. The flags represent modern countries and may reflect the country written in the place field or the system's geolocation [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-country-panel","kind":"platform-ui","anchor":"Open the right-hand Country Coding panel and review uncoded entries for missing, ambiguous or historical place strings. Where offered, switch between country grouping and subdivisions such as U.S. states or Canadian provinces and territories. Review the underlying place wording before deciding whether an edit is justified [S1 @2026-11-20] [S2 @2026-11-20] [S3 @2026-11-20].","sources":["S1","S2","S3"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
