claims:
  - {"id":"C-country-scope","kind":"platform-ui","anchor":"On the desktop site, enable Country Coding for each tree with the globe at the lower right of Family, Pedigree or Fan view. Confirm in the first-use pop-up. The setting carries over to List view. Use Fan view in Color mode to compare direct ancestral branches [S1 @2026-11-21] [S2 @2026-11-21] [S3 @2026-11-21] [S4 @2026-11-21].","sources":["S1","S2","S3","S4"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-country-events","kind":"platform-ui","anchor":"Open **Settings** from the three-dot menu at the top of the Country Coding panel. Use the default birth and baptism pair for an origins audit or switch to death and burial for an end-of-life audit. Compare flags using the same event setting [S1 @2026-11-21] [S2 @2026-11-21] [S3 @2026-11-21].","sources":["S1","S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-country-panel","kind":"platform-ui","anchor":"Use **Current view** in the right-hand panel for counts and country assignments in the visible part of the tree [S2 @2026-11-21]. Move to another branch to refresh that list [S3 @2026-11-21]. Switch to **Entire tree** before drawing conclusions about country assignments across the tree [S2 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-country-drill-down","kind":"platform-ui","anchor":"Click a country in the panel to list the people assigned to it for the selected events and scope [S2 @2026-11-21] [S3 @2026-11-21]. From the **Current view** list, select a name to center Family view on that person, then click their card if the details panel is closed. In Pedigree, Fan or List view, selecting the name opens the details panel [S3 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-event-place-fallback","kind":"platform-ui","anchor":"In birth mode, hover over a flag to read the place and country in the tooltip, then check which event supplied the place. Country Coding falls back to baptism or christening only when no birthplace is listed. In death mode, it falls back to burial only when no death place is listed. Attribute the place to the supplying event [S3 @2026-11-21].","sources":["S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-country-geolocation","kind":"platform-ui","anchor":"A recognized modern country at the end of the place field takes precedence when assigning the flag. When the entry lacks a country, treat any assigned country flag as a present-day geolocation estimate. A Polish flag for `Danzig` reflects that estimate, so establish the jurisdiction for the event date separately [S2 @2026-11-21] [S3 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-regional-flags","kind":"platform-ui","anchor":"In **Settings**, select U.S. state or Canadian provincial breakdowns when auditing places at that level. Inspect the existing wording first. With U.S. state flags enabled, `Los Angeles, CA` can supply the California flag [S2 @2026-11-21] [S3 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-uk-flags","kind":"platform-ui","anchor":"The default United Kingdom breakdown can show St George's Cross for `London, England` and the Union Jack for `London, United Kingdom`. Check the wording behind each flag. Clear **United Kingdom** in Settings to use the Union Jack for UK places [S2 @2026-11-21] [S3 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-missing-place-icons","kind":"platform-ui","anchor":"In birth mode, use the dashed-circle flag to spot profiles with neither a birth nor a baptism place. Enable missing-place icons in **Settings** if needed. Treat a question mark as an unmatched place. Inspect its wording for an underspecified place such as a hospital name or a historical country that the tool cannot resolve. Keep a supported historical entry even when it has no flag [S2 @2026-11-21] [S3 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-missing-place-worklist","kind":"platform-ui","anchor":"Expand the missing-birthplace count at the bottom of the panel in **Current view** to open the worklist. Hover over a name and select the icon beside it to open **Edit profile**, or start from the dashed-circle flag on the profile card [S2 @2026-11-21] [S3 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-suggested-places","kind":"platform-ui","anchor":"Open the empty flag to check for **Suggested places** if the account has a subscription. When a Smart Match or Record Match supplies a candidate birthplace, inspect the underlying match and corroborate the birthplace before using it [S3 @2026-11-21].","sources":["S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-edit-birthplace","kind":"platform-ui","anchor":"Enter a verified birthplace in **Edit profile** after clearing the gate [S2 @2026-11-21] [S3 @2026-11-21].","sources":["S2","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-download-fan-chart","kind":"platform-ui","anchor":"With Country Coding enabled, download the fan chart from the arrow menu in Fan view's Color mode. Check the local copy for flags before relying on it as a record of the display [S3 @2026-11-21] [S4 @2026-11-21].","sources":["S3","S4"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
