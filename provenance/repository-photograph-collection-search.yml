claims:
  - {"id":"C-f5e89fe16ea2","kind":"method","anchor":"- **Local studio negatives.** Browse school, church and group portraits under the town and studio. In 2016 James Tanner described St. Johns, Arizona, glass negatives being added to FamilySearch Memories, including class groups [S1]. Search images filed under the school or class even if an individual pupil is unnamed.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-222b97184c3e","kind":"method","anchor":"1. Limit the search to one relevant collection at a time. Search or browse by:\n   - place and date\n   - street and building\n   - business name\n   - group subject: classes, graduations, teams, events [S1], [S2], [S6]\n2. Browse generic titles within the period of a known event. In the Larson Studio collection, Myntti reported finding his mother-in-law’s 1956 graduation portrait under “Unknown Woman” [S2]. His library account also records the family’s response and the later catalogue update [S45]. A later search under the sitter’s name can therefore retrieve an image indexed anonymously at the time of discovery.\n3. Search the business and historical street name. The historical-society description named the hardware store but omitted the great-grandfather pictured inside it. His surname was part of the business name [S5]. Check period directories for name and address changes.\n4. Query an ancestral town and state in the unidentified subset. A DeadFred search found a candidate through those two place fields even though the family surname was absent [S7]. Save the item and its caption for a separate attribution check.\n5. Try the surname alone and limit the format to images [S3]. Repeat with spelling variants. Record the collection searched and the names actually returned.","sources":["S1","S2","S6","S45","S5","S7","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-4dcc2e6b9f57","kind":"unclassified","anchor":"Use this branch for a portrait sought through a Swedish noble family. A surname can\nreturn several distinct families or branches. ArkivDigital's October 2026 Minerva\ndemonstration distinguishes family searching from object searching, then demonstrates\na separate ArkivDigital portrait index leading to cards, images and identifying backs\n[S14]. These are complementary search surfaces, not a demonstrated complete crosswalk\nbetween the two services.","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-94d984cfa927","kind":"unclassified","anchor":"1. Start with independently supported family context. In Minerva's family results,\n   preserve the full name, noble rank, introduced number and branch qualifier actually\n   supplied. Keep same-surname entries separate until the target branch is resolved;\n   an attractive portrait does not resolve that choice.\n2. Search the selected family page's related objects and the separate object search.\n   Record the family/branch filter and object type, such as portrait or photograph,\n   used on each surface. The demonstration also searches other objects; a document\n   result and a portrait result are different targets. Do not assume every family\n   has the same object coverage or that one result searches the other surface.\n3. Check ArkivDigital's Riddarhuset portrait finding aid as a separate surface, using\n   the supported family name. Save the returned locator and open it. In the\n   demonstration, the first image is a catalogue card rather than the portrait [S14].\n   Verify which object the current image shows before marking a portrait retrieved.\n4. Browse the adjoining images for the matching portrait and any photographed reverse.\n   Record each card, front and back with its own image locator and observed connection;\n   do not assume a fixed image offset or that every object has a digitized reverse.\n   Copy identifying inscriptions and cataloguer attributions separately, retaining\n   their wording and any conflict. A reverse can supply a statement about the sitter;\n   it does not establish that statement's correctness.\n5. Compare the retrieved object's stated person, dates and branch with the search\n   context, keeping uncertainty explicit. Do not identify a face or adopt a family\n   relationship from a surname, a card or the presentation's example. Return missing\n   objects, uninspected reverses and unresolved branch matches as those exact gaps.","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1fbd411f928a","kind":"unclassified","anchor":"Record Minerva and ArkivDigital searches separately, linking their results only when\nthe inspected descriptions or objects support the connection. In the 2026 talk,\nRiddarhuset explicitly describes its genealogies as Word/PDF documents rather than a\ndatabase answering spouse, child or parent queries [S14]. A family hit therefore does\nnot execute such a relationship search. The talk establishes a historical retrieval\nroute, not current controls, complete holdings or a verified portrait identification.","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-87ad21fe9d07","kind":"unclassified","anchor":"**A series marker is not the photographed house's coordinate.** In its July 2026\ndemonstration, ArkivDigital explains that it positioned aerial series from routes\ndrawn on flight maps, without knowing the exact house locations or the path flown\nbetween houses [S15]. Keep that series position separate from a house location\nestablished from the actual view. Proximity to a marker does not geolocate the image.","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-28808caa66dd","kind":"unclassified","anchor":"**Inspect several surrounding series, not only the nearest map marker.** In ArkivDigital's June 2024 demonstration, the presenter says the precise flight routes are unknown and recommends opening several nearby series [S11]. The nearest marker is a starting point; it does not establish which views the flight contains.","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-030ecadcb702","kind":"unclassified","anchor":"**Check for a corresponding paper-print series as well as the negatives.** Establish the relationship from the collection's actual metadata and images. ArkivDigital's June 2026 demonstration shows negative series marked O and paper-copy series marked R; some scanned print backs supply a place or purchaser's name [S12]. Follow that counterpart route where it exists, rather than assuming every negative has a surviving print.","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-04c1dd09eb51","kind":"unclassified","anchor":"Use [archival image coverage verification](archival-image-coverage-verification.md) to check the observed order and sides. In the 2026 demonstration, stepping two images at a time could show only fronts or only backs [S12]. Do not count a run of fronts as inspection of both sides. Record the series/item locator and the side that supplies a clue. The examples describe those historical demonstrations; check the actual collection and viewer before relying on their codes or controls.","sources":["S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f8bc7083e2a1","kind":"unclassified","anchor":"**For a located Swedish aerial view, search residents by the period property designation.** ArkivDigital's April 2026 demonstration advises locating the view, using historical maps to recover its address or *fastighetsbeteckning* at that time, then searching the designation in *Sveriges befolkning 1940–1990* [S13]. Search it only for the ancestor's household, and note only the names and family positions the question needs; do not record later or possibly living residents or use the register to find a living person. An approximate flight marker or a name on a print back is a clue; it does not establish that location.","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bf665ce07507","kind":"unclassified","anchor":"**Keep the ownership search separate.** The same demonstration directs ownership questions to *fastighetsböcker* (property books), mentioning Riksarkivet's reading rooms [S13]. A population-register resident is not thereby the owner. Check the relevant historical property and ownership entry separately; the demonstration does not establish current holdings or access.","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f9605d6f2bea","kind":"method","anchor":"**Search across photographers, then record which collections returned hits.** In BYU’s 2016 demonstration, the George Edward Anderson collection supplied most results for a surname filtered to images, but other collections also returned photographs. Include C. R. Savage as well as Anderson when their coverage fits [S3].","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-40322b306716","kind":"unclassified","anchor":"**Then search the manuscript finding aids.** The same presenter notes that many photographs in BYU's manuscript collections had not been digitized and would not appear in the digital photo collections [S3]. Search the manuscript finding aids at every repository, not only at BYU.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d7f44dab462b","kind":"unclassified","anchor":"- **U.S. passport applications.** Photographs have been required since 21 December 1914. The National Archives holds applications from October 1795 to March 1925; the State Department holds later ones. As a general rule, U.S. citizens needed no passport to travel abroad until 1941, apart from 1861–1862 and 1918–1921, so a missing application is common [S16].\n- **U.S. naturalization papers.** Declarations of intention filed from 1 July 1929 have a space for the declarant's photograph, and certificates issued from 1 July 1929 carry the holder's signed photograph [S17], [S18]. The National Archives usually has no copy of the certificate [S19]. The USCIS C-file holds a duplicate, and C-files (27 September 1906 to 31 March 1956) include photographs only from 1929 onward [S20]. A National Archives staff answer states that petitions for naturalization never carried a photograph [S21]. For the request route, see [U.S. immigration search recovery](usa-immigration-search-recovery.md).\n- **Alien Files (A-files).** They can contain photographs among visas and applications [S22]. The 1940 alien registration form (AR-2) records a fingerprint and a physical description, not a photograph [S23].\n- **U.S. federal prison inmate case files.** They can include identification photographs. The National Archives at Kansas City holds Leavenworth files for 1895 to 1957, and most include a mugshot, with front and side views [S29], [S24]. The National Archives at San Francisco holds Alcatraz files dated mainly 1934 to 1963, with prisoner identification photographs [S25].\n- **Soviet internal passports and personnel files.** Under the 1974 Passport Regulation, applicants handed in two photographs, and new ones were pasted in at ages 25 and 45, so one passport can hold portraits from different ages [S26]. To bound the date of each, see [family photograph attribution and dating](family-photograph-attribution-and-dating.md). A workplace personnel file (личное дело) may have a photograph pasted in, but not always [S27]; to find the file, see [Soviet personal-file recovery](soviet-personal-file-recovery.md).","sources":["S16","S17","S18","S19","S20","S21","S22","S23","S29","S24","S25","S26","S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cfa0d550c470","kind":"unclassified","anchor":"- **WWII participants:** Бессмертный полк (Immortal Regiment, moypolk.ru), whose veteran stories carry portraits [S8], and Дорога памяти (Road of Memory, 1418museum.ru, formerly foto.pamyat-naroda.ru), a Russian Ministry of Defence project that collects participants' photographs [S9]. Road of Memory's participant-search link was a placeholder when checked on 2026-11-02; working person search was not verified. Treat it as an unsearched lead until an actual search or browse surface is available, and do not count an unavailable search as a name miss.\n- **Repression victims:** Бессмертный барак (Immortal Barracks, bessmertnybarak.com), which describes itself as collecting documents and photographs of victims [S10].\n- **Deported or dekulakised families:** add local publications from the place of exile, not only from the place of origin.","sources":["S8","S9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8e29df0774c3","kind":"unclassified","anchor":"These portals concern living families. A Бессмертный полк page names the relative who keeps it, with their relationship, a contact form and sometimes a phone number [S28]. Record the person and the story, never collect contributors' names or contact details, and use a portal's contact form only when the user asks to make contact.","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4636713aacd1","kind":"method","anchor":"- **Photographer’s original description.** Separate the caption, date and place transcribed from the original from fields supplied later. The 2021 Frith demonstration shows both kinds of information [S6].\n- **Holder-added coordinates.** Record who supplied the location and its precision. In the Frith demonstration a named landmark could be placed more precisely than a party on a mountainside [S6].\n- **Recorded donor.** Copy the donor attribution attached to the item [S4]. Distinguish who deposited the photograph from who first identified the sitter, and note any missing link between them.\n- **Nearby-place images**, labelled \"local context only\". A view of the next village or the town centre does not show the ancestor's house or the ancestor.","sources":["S6","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fe31fb7742aa","kind":"method","anchor":"Do not compare faces yourself and do not name anyone from appearance. Resemblance is never evidence on its own: a recognition stays an attributed claim until documents support it. Record who made the attribution, when, and the provenance of any family photograph they cite [S7]. Keep AI-enhanced or generated faces out of comparisons.","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e8ad31c51225","kind":"method","anchor":"Offer a supported identification to the holding institution as a suggested metadata correction. Supply the item reference, the proposed name and its documentary basis [S2], [S5]. Preserve the original caption and record the holder’s response separately [S45].","sources":["S2","S5","S45"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8a9211474d24","kind":"method","anchor":"Old photographs are also sold through online auctions and second-hand marketplaces: a 2022 commodity-evaluation study built its sample of 100 artistic, historical and scientific photographs from those put up for sale at the Violity auction [S30]. Log each such site as one more surface, covering completed sales as well as open lots, and run the place, studio and surname terms used on the repository surfaces. A seller's description is a claim to test against other evidence, like a donor's identification; record the lot number and page address as the item locator. If a lot includes papers of people who may be living, note only what the question needs.","sources":["S30"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d91c6fee6935","kind":"platform-ui","anchor":"On Meshok, checked 2026-11-08, keyword search matches lot titles only, so also browse its catalogue categories; a separate option searches successfully completed lots [S31 @2026-11-08] [S32 @2026-11-08].","sources":["S31","S32"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7594460dfd84","kind":"portal-availability","anchor":"For a town, church or school in Russia, add History of Russia in Photographs (russiainphoto.ru). On 2026-11-12 its About page described 214,551 photographs taken on the territory of Russia from 1840 to 1999; 174,880 were placed by museums, archives and private owners and 39,671 uploaded by site visitors. It can be searched by the place where the print or negative is kept, and photos with a recorded location appear on a map [S33 @2026-11-12]. Vera Miller suggests starting with a surname or a town or village name translated into Russian, and reports portraits, class graduations, churches and street views among its photos [S34 @2026-11-12]. Use a hit as a place or context image. Record the holder and caption as the holder's claim, keep visitor uploads apart from museum and archive items, and never identify a person in it by appearance.","sources":["S33","S34"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1b7b0de1fb97","kind":"method","anchor":"Use Goskatalog, the Russian Museum Fund’s state catalogue, to find related objects at the same museum [S37]. Novozhilova’s 2020 account searched a surname, narrowed by museum or object type, and inspected each item’s description and holder [S35]. In 2025 a family researcher reported seeing a Raichikhinsk museum portrait captioned N. G. Oleshko with his wife Taisia Dmitrievna, followed by an employment book, military card and medals. She proposed a relative on the strength of the name and museum town. The captured post did not include the images [S36]. Check the family details in the documents against the caption. A museum’s town and a surname alone cannot identify the couple.","sources":["S37","S35","S36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-28b96adf553b","kind":"platform-ui","anchor":"PastVu (pastvu.com) collects users' images of human life and settlements up to the year 2000. Moderators select what is published, the uploader enters the year and the source, and comments serve to discuss the images [S38 @2026-11-16]. On its map, images are grouped into clusters that split into smaller clusters or single images as you zoom in; a time slider limits the markers to a range of years, and a thumbnail opens the full image with its information [S39 @2026-11-16].","sources":["S38","S39"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f0ba96d1e638","kind":"method","anchor":"For a PastVu place image, record the uploader’s locality, period and camera direction. Credit a later correction to its commenter and check it against a map or dated landmark before using it. Novozhilova’s 2021 Taganrog example shows why the upload and the comments need separate attributions [S40]. A matched view can illustrate the town without identifying a sitter.","sources":["S40"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b140b74bc104","kind":"method","anchor":"**Local public library photograph collections.** Browse the library’s local-history photo collection directly and log it separately from a search of the general catalogue [S42]. According to Melina Papadopoulos’s guide, a library photo collection is a place to look for period views of a school, church, business or landmark connected to the ancestor [S41†].","sources":["S42","S41"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-55f481a415cf","kind":"custody","anchor":"- **Record the institution’s access instructions with the call number.** The University of Arizona’s Overson family photograph collection, MS 549, dates from 1840 to the 1950s, chiefly the 1920s–1940s. Its collection page illustrates a circa-1916 graduation group (box 1, folder 1), says the images were scanned and directs researchers to visit for access. A negative and a print can yield separate scans of the same exposure [S43 @2026-11-19]. The Utah Historical Society lists the Larson Studio Negative Collection, 1916–1968, as Mss C 230 [S44 @2026-11-19]. Log the items actually examined in each collection.","sources":["S43","S44"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-861ff69ba59d","kind":"method","anchor":"- **Historical-society photo databases.** Find them through the society's website or social-media page [S5].\n- **Follow a county society’s links to the holding repository.** In Surry County, North Carolina, the society’s website led Lisa Lisson to a local digital collection containing a family portrait [S4]. Record the repository and item citation as well as how you found it.\n- **Unidentified-photo collections.** Search named portraits by surname. For unnamed items, use the photographer’s town and state. The DeadFred account describes this route through its “Mysteries” category [S7].","sources":["S5","S4","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7888489feb71","kind":"portal-availability","anchor":"The Goskatalog portal was inaccessible from this check on 19 November 2026 (connection timed out) [S46† @2026-11-19]. Record an unsuccessful connection separately from a completed search returning no objects.","sources":["S46"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
