  - {"id":"S107","kind":"help-page","urls":["https://www.kb.dk/danmarksetfraluften/english"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Institutional documentation read 2026-11-22","entry_sha256":"814e26cc23ae28420d4f894e79752a1f9fdd37960b13d0d4edd6d3c268afb80d","claims":["C-danish-aerial"],"review":"reviewed"}
  - {"id":"S108","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2022/02/paakalloista-talla-kertaa.html"],"published":"2022-02-17","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Community article read 2026-11-23","entry_sha256":"be51d38ae520ab9e50b2fa65e87274bb759cefc49d75dde67dac6ab20e9d5686","claims":["C-retzius-portrait-purpose"],"review":"reviewed"}
  - {"id":"S109","kind":"web-page","urls":["https://www.museovirasto.fi/fi/ajankohtaista/gustaf-retziuksen-suomessa-1873-tekemien-tutkimusten-kuva-aineistoa-on-hankittu-museoviraston-kokoelmiin-ruotsista"],"published":"2022-01-26","retrieved":"2026-11-23","access":"read","rights":null,"basis":"Institutional acquisition account read 2026-11-23","entry_sha256":"577e7006727a49d492d08ae595f03a0778d6090ae16e6cce8f4e97551029b53c","claims":["C-retzius-portrait-purpose"],"review":"reviewed"}
  - {"id":"S110","kind":"video","urls":["https://www.youtube.com/watch?v=vRBj8kmCeSo"],"published":"2022-08-20","retrieved":"2026-11-23","access":"snippet-only","rights":null,"basis":"Reader-supplied transcript excerpt read 2026-11-23","entry_sha256":"fa4020767a7f7df886201784bd1dd0e192e617230171e83c6d1f6e4b548c9ac9","claims":["C-hillard-revolutionary-veteran-portraits"],"review":"reviewed"}
