claims:
  - {"id":"C-000000000001","kind":"method","anchor":"According to the presenter, use Johnson’s Black American prisoner transcription to look for a Black captive from a Navy, privateer or merchant vessel [S1†]. Search for *Black American Prisoners of War Held by the British Royal Navy During the War of 1812*, by Eric Eugene Johnson. [S4]","sources":["S1","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"According to the presenter, check Johnson’s birth, death and parole volume for a clue involving a family member or captured crew [S2†]. Check *American Prisoners of War during the War of 1812: Birth, Death, and Parole Records* for selected parole records, deaths of American children on Quebec prison ships and records of captured crews. Treat each hit as a lead to the underlying ledger. [S3]","sources":["S2","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-000000000003","kind":"custody","anchor":"Take the transcription’s place and date to ADM 103, the British Admiralty’s prisoner registers at The National Archives. Use the depot and date window to identify the piece and record the original page and entry numbers. For Plymouth, the British Online Archives volume lists documents by archive reference. [S3 @2026-11-22] [S5 @2026-11-22]","sources":["S3","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"According to the presenter, compare the sending and receiving registers because a transfer can bring a new prisoner number [S1†]. Match the departure and arrival dates, vessel or capture details and the prisoner’s recorded identifiers before merging the entries.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
