claims:
  - {"id":"C-cda71989428b","kind":"custody","anchor":"In the *Prokuraattorin toimituskunnan arkisto*, choose *Kruununvankilain vankiluettelot* (Eoa) for Crown prison returns. Check the separate town-prison lists for a town jail and the institution's own archive for its registers [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3a8de6547584","kind":"method","anchor":"Open all units covering the relevant period and browse to the institution's heading and reporting month. An annual catalogue label can cover several units. For a worked locator, Kyläkoski cites Eoa:205, April–June 1866, and Eoa:249, May–June 1870. For the latter she identifies the separate June returns for *Kuopio Läns Arbetskompani* and *Åbo kronohäkte* [S1] [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04e0bc9b66c6","kind":"method","anchor":"At each institution record the date of an escape, recapture, detention, court action, dispatch, arrival or release only when the entry gives it. Compare the last outgoing entry with the first receiving entry and inspect the month of the reported movement as well as the next return. Keep searching by institution and reporting period across volume boundaries [S1] [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-99dbc2043506","kind":"example","anchor":"A memoir's apparent direct Luosta-to-Liminka move omitted the Turku detention that Kyläkoski reports finding in the June 1870 return. Check the receiving prison's arrival month before relying on a miss in the following month's list [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c57baa2fb8e4","kind":"custody","anchor":"For a Kuopio life prisoner, check the prison parish's *Elinkautisvankien rippikirja*. Use I Aa:2 for 1869–1877 and I Aa:3 for 1877–1890, checking both in the overlapping year [S4 @2026-11-22].","sources":["S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cda99c0db1af","kind":"method","anchor":"Record the parish of registration separately from the reported place of detention. Follow a named home or destination parish into its own [parish records](scandinavian-parish-record-recovery.md), retaining any discrepancy with the movement entries [S1] [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-76371114352b","kind":"method","anchor":"For a reported Siberian exile or a petition to go there, consult Juntunen's *Karkotetut suomalaiset Siperiassa autonomian aikana*. Copy the recorded locality and the Senate and VSV references. Keep petition, Senate consent, imperial approval and documented departure as distinct events [S1] [S5].","sources":["S1","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
