claims:
  - {"id":"C-9b6afe5e8460","kind":"portal-availability","anchor":"Find the soldier on the Australian War Memorial’s unit embarkation roll. Open the page and confirm rank, the unit or reinforcement, ship, port and sailing date, and the service number. Keep the unit and ship reference if you started from the MyHeritage index. For a gap in the printed AWM8 series, check whether AWM332 preserves the original form for that unit [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b60c9a553a71","kind":"method","anchor":"Copy the date and its column label. For a unit-joining date, verify initial enlistment through the attestation or service dossier. Use the embarkation port for the voyage, and the address on enlistment as its own clue to residence. Record next of kin as nominated and copy any stated relationship. Verify kinship separately when the roll gives only a name or address [S1] [S2] [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e2734b81f8ec","kind":"portal-availability","anchor":"Carry the service number into the nominal roll and the personnel dossier. Compare the embarkation unit with the unit attached to a later casualty or discharge, and record the date of each change. Open the Roll of Honour and any accompanying circular for a recorded death [S3 @2026-11-22].","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-479d1431038c","kind":"method","anchor":"Check the Roll of Honour’s place and date of death before using a deployment as a death location. The community account describes a Gallipoli deployment followed by a death in France [S3] [S4].","sources":["S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7dd5b3978bad","kind":"portal-availability","anchor":"Open the recommendation image and record its date, place or circumstances, service number, rank and unit when given. Search the Australian War Memorial’s AWM28 recommendations and its Honours and Awards records separately. Check for the approved award and its gazette reference before recording the honour as granted [S3 @2026-11-22] [S5 @2026-11-22] [S6 @2026-11-22] [S7 @2026-11-22].","sources":["S3","S5","S6","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
