claims:
  - {"id":"C-haitian-historical-record-recovery-1","kind":"portal-availability","anchor":"Start with the Association de Généalogie d’Haïti’s *Archives d’Haïti* index and the FamilySearch collection *Haiti, Civil Registration*. Check the locality and event year in each collection before treating a search miss as meaningful. For a FamilySearch miss, look up the locality and act type in its catalogue and check the listed volumes before broadening the name search. Use a hit to obtain the act locator and identify its creator. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-haitian-historical-record-recovery-2","kind":"portal-availability","anchor":"For a former owner or heir connected with confiscated property, check the alphabetical owner and heir sections of Oliver Gliech’s index, then trace the lead to the French commission’s *État détaillé des liquidations*. Use the BnF catalogue’s 1828–1833 publication listing to identify the volume. Record the named party’s capacity, the property and the commission’s disposition separately. [S1 @2026-11-22] [S4 @2026-11-22] [S5 @2026-11-22]","sources":["S1","S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-haitian-historical-record-recovery-3","kind":"portal-availability","anchor":"Use the University of Florida’s Caribbean collections guide to follow the Haitian material into the Digital Library of the Caribbean. Search by locality and document type, and log whether a result is a record, a publication or contextual material. Keep these holdings separate from the civil registration coverage you checked. [S1 @2026-11-22] [S6 @2026-11-22]","sources":["S1","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
