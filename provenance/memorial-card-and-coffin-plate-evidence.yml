claims:
  - {"id":"C-4f2a9c71d0e3","kind":"method","anchor":"- Entering a birth date or birthplace from a card or plate, or a birth date computed from its age, as if it came from a birth record. A card or plate was made at a death. Its birth details were supplied then, by someone other than the person born, and are not a birth record.\n- Reading a coffin plate as evidence of where, or whether, the person was buried. A coffin plate kept by the family is not burial evidence.\n- Reading a missing spouse or child on a card as evidence that none existed. Gorr finds family names on cards only occasionally. [S1]\n- Assigning a plate that names nobody to a particular child or parent from family tradition alone.\n- Copying the survivors named on a recent card into a shared tree. Treat them as living and keep their names in the private research log.","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b81e5d3a6c90","kind":"method","anchor":"Transcribe both faces in the language on the card. Give each statement its own field, including the person’s name, dates, places, age, relatives, prayers and any printer’s or undertaker’s line [S1]. On the two French cards for Sister Louis-Bertrand and Emilia Perron in Fall River, the fronts carry portraits, ages and death details, while the backs carry prayers [S3]. On James Ingram’s card (London Museum 93.160/26), transcribe the death as 3 February 1862, age ten, and the stated burial place as Abney Park Cemetery. Look for his entry in the cemetery’s register. The undertaker’s line gives a separate lead to J. Dix senior at 3 Aylesbury Street, Clerkenwell Green [S4].","sources":["S1","S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0d7c4e28f15a","kind":"method","anchor":"**Undertaker's line.** Copy the firm's name and address and the card's date exactly as printed. Undertakers used such cards to advertise and often supplied them free [S4], so take the named firm as the first candidate for the funeral home's file, and follow the funeral-home route in burial evidence packet.","sources":["S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e39a61b0c7d2","kind":"method","anchor":"**Burial place and church.** A cemetery or church named on the card leads to its burial or interment register [S1]. The card is not that entry: find the entry before treating the burial as established.","sources":["S1"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7a5f0d92e4b6","kind":"method","anchor":"**Identify the object.** Record the plate’s material, inscription and how it came into the collection. Andover’s account describes a custom particularly common in the northeastern United States from the 1840s, in which families took plates home after the funeral [S6]. For Frederick J. E. Tichborne’s Ontario plate of 1891 (Huron County Museum M972.0007.001), the museum describes removal before burial as likely [S2]. Keep that qualification when citing the object. To establish when a family acquired its own plate, look for a dated photograph, note or accession record that actually describes the transfer.","sources":["S6","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c2e8b47a1f03","kind":"method","anchor":"**Look beyond the boxes.** Check framed pieces and objects kept on mantelpieces and tables as well as stored keepsakes: Gorr notes that plates were displayed at home in a frame or on a mantelpiece or table [S1].","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-91d36f5c0a8e","kind":"method","anchor":"**Read the plate.** Copy the name, date of death and every unit of age. Frederick J. E. Tichborne’s Huron plate gives 27 February 1891 and an age of 6 months and 28 days [S2]. The Andover catalogue lists Betsey Jones as 80 years and 5 months (1951.002.2), and Eliza Hathaway Jones as 20 months and 19 days (1951.002.3) [S6]. Retain Betsey’s stated precision when estimating her birth. For Eliza, subtract 20 calendar months and 19 days from 28 April 1862 to get 9 August 1860. Record that date as calculated and test it against a birth or baptism entry.","sources":["S2","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5b0e7a3d29c4","kind":"historical","anchor":"**A plate that names nobody.** Gorr reports plates engraved only with an endearment such as \"Our Darling\" or \"Baby\" [S1]; no independent source opened for this recipe confirms it. Keep such a plate as an unidentified death in the family until a death, burial or cemetery record of a fitting date names the person, and do not assign it from family tradition alone.","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f6a2c8e1b7d5","kind":"method","anchor":"**Burial and provenance.** Compare the inscription with the catalogue’s account of recovery. Catherine Mary Harriet Saunderson’s lead plate gives her death as 2 May 1828 at nine months. London Museum records that it was removed from a coffin buried at St Pancras Churchyard (NN3661) [S5]. The churchyard comes from that recovery history. If neither a recovery record nor a family account survives for your plate, leave the route into the collection open and search the burial register independently.","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
