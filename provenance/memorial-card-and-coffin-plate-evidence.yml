claims:
  - {"id":"C-4f2a9c71d0e3","kind":"method","anchor":"- Entering a birth date or birthplace from a card or plate, or a birth date computed from its age, as if it came from a birth record. A card or plate was made at a death. Its birth details were supplied then, by someone other than the person born, and are not a birth record.\n- Reading a coffin plate as evidence of where, or whether, the person was buried. A coffin plate kept by the family is not burial evidence.\n- Reading a missing spouse or child on a card as evidence that none existed. Gorr finds family names on cards only occasionally. [S1]\n- Assigning a plate that names nobody to a particular child or parent from family tradition alone.\n- Copying the survivors named on a recent card into a shared tree. Treat them as living and keep their names in the private research log.","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b81e5d3a6c90","kind":"example","anchor":"Transcribe both faces before interpreting anything. Give each statement its own field, worded as printed: name, age, birth and death dates and places, burial place, church, family names, verse or prayer, and the printer's or undertaker's line. Gorr names birth and death dates and places, and occasionally family members, as the card's genealogical content [S1]. Two cards at the Fall River Historical Society, printed in French, give a photograph, the age, and the date and place of death [S3]. The London Museum's 1862 card for James Ingram gives his death date, his age of ten years, the cemetery where he was interred and the undertaker's name and street address [S4].","sources":["S1","S3","S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0d7c4e28f15a","kind":"method","anchor":"**Undertaker's line.** Copy the firm's name and address and the card's date exactly as printed. Undertakers used such cards to advertise and often supplied them free [S4], so take the named firm as the first candidate for the funeral home's file, and follow the funeral-home route in burial evidence packet.","sources":["S4"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e39a61b0c7d2","kind":"method","anchor":"**Burial place and church.** A cemetery or church named on the card leads to its burial or interment register [S1]. The card is not that entry: find the entry before treating the burial as established.","sources":["S1"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7a5f0d92e4b6","kind":"historical","anchor":"**Identify the object.** A coffin plate is a small metal plate attached to the coffin, usually giving the name and death date of the deceased [S2], [S6]. In the United States from the early 1840s, plates were more often not buried with the coffin: they were displayed on it during the funeral and then given to the family as a memento, to be displayed at home or put away. The custom peaked from 1880 to 1899 and had died out by the 1920s. The Andover Center for History & Culture, which gives this account, contrasts England, where plates had to stay on the coffin at burial [S6]. The Huron County Museum in Ontario describes its 1891 plate as likely removed by the family before burial and kept as a memento [S2].","sources":["S2","S6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c2e8b47a1f03","kind":"method","anchor":"**Look beyond the boxes.** Check framed pieces and objects kept on mantelpieces and tables as well as stored keepsakes: Gorr notes that plates were displayed at home in a frame or on a mantelpiece or table [S1].","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-91d36f5c0a8e","kind":"method","anchor":"**Read the plate.** Transcribe the name, the death date and the age exactly as engraved. Ages can be given to the month or day: the Huron plate is for a child who died aged 6 months and 28 days [S2], and the Andover Center's Jones family plates include ages of 80 years 5 months and of 20 months 19 days [S6]. Compute a birth date from such an age, log it as derived from the plate together with the arithmetic, and look for a birth or baptism record before using it.","sources":["S2","S6"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5b0e7a3d29c4","kind":"historical","anchor":"**A plate that names nobody.** Gorr reports plates engraved only with an endearment such as \"Our Darling\" or \"Baby\" [S1]; no independent source opened for this recipe confirms it. Keep such a plate as an unidentified death in the family until a death, burial or cemetery record of a fitting date names the person, and do not assign it from family tradition alone.","sources":["S1"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f6a2c8e1b7d5","kind":"example","anchor":"**Burial and provenance.** A plate removed before burial says nothing about where the person lies; find the burial through burial evidence packet. A plate can also have been taken from a coffin after burial: the London Museum's lead plate for a child who died in 1828 aged nine months was removed from a coffin buried at St Pancras Churchyard [S5]. For an English plate, or one with no account of how the family came to hold it, record its provenance as unknown rather than as a funeral keepsake.","sources":["S5"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
