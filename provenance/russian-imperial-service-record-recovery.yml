claims:
  - {"id":"C-816593aa9ebe","kind":"unclassified","anchor":"- Copy the post exactly as the record gives it, with its locality, for example пристав 3-го стана Красноуфимского уезда or полицейский надзиратель Сысертского завода. Metrical entries often name a father only by his post and rank, or say he has no rank (не имеющий чина). [S3]\n- Name the body that employed him in that post. A стан пристав, uezd police clerk or урядник points to police fonds. Participants told a questioner to look in police fonds at ГАПК or ГАСО. [S3] Other examples: a judicial investigator, candidate for judicial posts or notary points to the district court [S4]; a treasury bookkeeper or clerk to the treasury chamber and uezd treasuries [S5], [S8]; a forest guard to the forestry administration or the dacha forester [S7]; a physician, feldsher or pharmacy apprentice to the provincial medical personnel files [S2], [S6].\n- One post can lead to more than one fond, and the route differs by category of post. A land captain's (земский начальник) file appears in ГАПК ф. 38 оп. 2, not in the court fond ф. 1 used for court officials. [S4] A man who held posts of different kinds has files in several fonds. Search the fond for each post he held.","sources":["S3","S4","S5","S8","S7","S2","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d61aa0cbd468","kind":"unclassified","anchor":"- **Later civilian employer.** Two police inspectors (полицейские надзиратели) are documented by lists in the treasury-chamber series ГАПК ф. 111 оп. 1, because they later moved to the treasury. [S3] A gendarme officer's list is in ГАПК ф. 162 оп. 2. Physicians and a zemstvo feldsher who served in the 1877–1878 war are in ГАПК ф. 143 оп. 1. A retired army lieutenant who became a treasury-chamber clerk is in ф. 111 оп. 1. [S2] Veterans of 1812–1815 who later served as sworn treasury clerks (присяжные) have lists in ф. 111 оп. 1 д. 1021. Each list restates units, battles, wounds and awards. [S13] For a veteran who later held a civil post, search the civil employer's fond as well as any military archive.\n- **Bodies that held other agencies' lists.** ГАПК ф. 111 оп. 1 holds a list for a clerk of the prison department of the provincial board (губернское правление) [S8] and one for an employee of a state factory office [S3]. ГАПК ф. 36 оп. 2 holds mid-19th-century lists for court clerks, стан приставы and forest officials. [S3], [S5], [S7] Do not assume a fond holds only the staff of the body it is named after.\n- **Police fonds as such.** A participant pointed to ГАПК ф. 132: оп. 1 д. 223 (lists of police staff), оп. 3 д. 77 (formulary lists of police ranks, Perm uezd police administration) and оп. 3 д. 78 (list of police ranks in Perm uezd). The participant linked online copies on the Perm archive portal at the time. [S3]\n- **Courts.** ГАПК ф. 1 оп. 2 holds court officials' lists, and one official's list can run across several files: a candidate for judicial posts is documented in д. 174 л. 3–6 and д. 175 л. 2–10. Cite every delo given for the person. [S4]\n- **Other employers.** A service file for a member of a loan committee is in ГАПК ф. 113 оп. 1. [S11]\n- **Same fond number, different archive.** A participant posted this ГАСО list: ф. 36 is the senior forester of the Ekaterinburg works (1807–1886); ф. 55 is the forest department of the Ural mining administration (1839–1918); ф. 395, 404, 425 and 426 are dacha foresters; ф. 711 is the Irbit central forestry (1882–1916). [S7] ГАПК ф. 36 is a different body: the Perm provincial board (Пермское губернское правление). Always write the archive with the fond.","sources":["S3","S2","S13","S8","S5","S7","S4","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3436bea90ea7","kind":"unclassified","anchor":"**Also check the central series.** RGIA f. 1349 is a collection of civil officials' formulary lists, 1754–1917. Its personal lists are in оп. 3 (1800–1894, letters А–Я) and, for employees of central, provincial, uezd and local self-government bodies in 1894–1917, in оп. 1 (А–Р) and оп. 2 (С–Я). Group lists sent to the Heraldry in 1794–1846 are in оп. 4, group lists sent to the Inspector Department up to 1858 in оп. 5, and personal and group lists of 1754–1917 in оп. 6. The collection was put together from several streams, including lists taken from files due for destruction, so a miss there is not a negative. [S19] For nobility, honorary citizenship, change of surname and adoption, use RGIA f. 1343, the Department of Heraldry of the Senate. [S20] For the army, use RGVIA f. 409 (officers' service lists, attestations and award sheets, from 1847) and f. 489 (formulary and service lists of generals, officers, soldiers and officials, 1720–1900). For military medical staff, use RGVIA f. 879 (Medical Department, to 1867) and f. 546 (Main Military-Sanitary Directorate, 1867–1918). [S21]","sources":["S19","S20","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e314daecf3f","kind":"unclassified","anchor":"When a list ends, copy the closing entry and its reason exactly. Examples are transfer to railway control, call-up for military service, retirement on petition, or death. A stated destination is your next fond to search. The end of a list is not the end of a career. [S8], [S4], [S3]","sources":["S8","S4","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-55a300d3ae7b","kind":"unclassified","anchor":"- Annual forest-guard files bundle many estates. In ГАСО ф. 55 оп. 2 д. 377 (1890), a participant listed separate folio ranges for each dacha or forestry: for example л. 19–28 Nevyansk, л. 34–42 Utkinskaya dacha and л. 101–112 Sysert. Elected полесовщики drawn from state peasants are listed by volost on л. 13–13об.; the полесовщики of the Verkh-Isetsk possession dacha have their own list on л. 165–166. [S7] Choose the subunit's folio range: the volost list for an elected state-peasant полесовщик, the dacha's own list for dacha staff. Record archive, fond, opis, delo and folios.\n- The participant also named related series:\n  - ГАСО 55-2-371 (1890), 55-2-470 (1894–1895) and 55-2-518 (1895–1896) cover hiring, dismissal and leave.\n  - ГАСО 78-1-1133 covers the Nevyansk dacha forest guard, 1899–1900. The participant reported many more forest-guard files in ф. 78.\n  - ГАСО 72-1-5503 is a 1914 staff list of a private mining company's district. [S7]\n- Record the access state. Asked whether these ГАСО files were online, a participant answered \"not yet\" and said he had read the paper files. [S7] List paper-only files as \"not inspected — paper only\". Do not report them as searched.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c90287d29b04","kind":"unclassified","anchor":"- **Origin and education.** Record:\n  - estate or origin (\"сын пономаря\", \"из крестьян … волости\");\n  - religion;\n  - school and certificate number;\n  - any qualifying examination, such as the exam for the first class rank (1-й классный чин) at a gymnasium. [S4], [S8], [S3]\n- **Every posting with dates,** including acting appointments (и.д., вр.и.д.) and secondments, plus awards. [S2], [S4]\n- **The two dates of each promotion.**\n  - Many entries read \"произведён … со старшинством с\" a date. Record the order date and the seniority date in separate columns.\n  - The gap can be years. In the abstracts, a promotion ordered in 1885 carries seniority from 1872, and an hereditary honorary citizenship granted in 1865 runs from 1860. [S5]\n  - Neither date tells you when another record would first show the new rank.\n  - Watch for transcription slips. In the abstracts, one seniority date falls after its order date, and one promotion comes before the person entered service. [S5] If you meet either pattern, re-read the original folio before using the date.\n- **Family block.**\n  - Copy the wife with her father's estate or rank, the marriage date where given, and her maiden name.\n  - Copy the children with birth dates and, where given, birthplaces, separated by marriage (\"дети от 1-го брака\"). [S8], [S4], [S3] A father's file gave a daughter's birth date and town that no other record in the thread supplied. [S11]\n  - Copy adopted children as written (\"усыновленные\"). [S8] If the list gives a court adoption ruling (определение окружного суда) with its date, use it as the locator for that proceeding. Do not record the child as born to the marriage. [S4]\n- **Several lists for one person.** One official is documented by three ф. 36 files; another by ф. 36, ф. 37 and ф. 719 files. Keep each list as a separately dated statement with its own locator. [S3]","sources":["S4","S8","S3","S2","S5","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a1c721b4600f","kind":"unclassified","anchor":"- Build a series by year from provincial address calendars and Памятные книжки. For each, record the edition, its page and the section, for example parish schools or women's progymnasium. One participant found nothing on one page of the 1904 Tobolsk calendar but found the family under other sections of the same volume. A miss applies only to that section. [S10]\n- **Where to find address books and Памятные книжки.**\n  - The National Library of Russia (РНБ) lists Памятные книжки by guberniya at <https://nlr.ru/elibrarypro/memo/RA5888/spisok-guberniy>; the bare `/elibrarypro/memo/` address returns 404. A separate index names the libraries, archives and museums that hold copies, by city. [S14], [S15]\n  - The Vologda regional library (booksite.ru) has Памятные книжки material online, including full texts and a list of persons taken from the books. [S16]\n  - The Presidential Library (prlib.ru) answered HTTP clients with a browser security check in October–November 2026. Hand the search to the user's browser; do not try to get past the check. [S17]\n  - Before you trust a zero from a digital library's full-text search, search a phrase you can see on a page of the same volume. Search names and places in pre-1918 spelling as well as modern spelling, using the [pre-reform spelling lane](corpus-seeded-name-search.md#diagnose-three-different-failures).\n- **Erik-Amburger-Datenbank.** For an official or professional of foreign origin, search the Erik-Amburger-Datenbank of the Leibniz-Institut für Ost- und Südosteuropaforschung (IOS, Regensburg). It catalogues about 100,000 foreigners in the Russian Empire up to 1917, built from Erik Amburger's card file, and publishes a list of its sources. It is a compilation: follow each entry to its cited source before you use it. [S18]\n- **Российский медицинский список (RMS).** Record the edition year, its \"as of\" date, the page and the list used. The 1914 and 1916 editions state their data as of 1 May. A participant quoted the alphabetical list of women physicians with the maiden name, the married name (\"по мужу …\") and the current post. [S10] Participants reported the lists are freely readable in Russian national library digital collections and used one to get birth year, diploma year and residence after a university record. [S12], [S1] The Russian State Library holds a digitised 1916 edition, available through НЭБ (RusNEB).\n- **Decode compressed RMS fields from the edition's printed legend, not from a forum reading.**\n  - The 1914 legend gives the order: birth year, then degree, then graduation year. Its own example is \"63 Л. 82\": born 1863, лекарь, graduated 1882.\n  - By that key, entries quoted in the threads as \"81 Л. 910\" and \"82 Л. 910\" read as born 1881 (or 1882), лекарь, graduated 1910. [S9], [S10]\n  - One participant read a different entry, \"1919 … Л888 … Вен.\", as diploma 1919 and born 1888. [S1] That order reverses the imperial legend, and a 1919 diploma cannot appear in any pre-1917 edition. The thread does not say which list that entry came from, so do not use that reading for imperial RMS editions.\n  - For editions other than 1914, open that edition's own legend before decoding. Leave fields literal until you have it.\n- **Other professional and city lists:**\n  - zemstvo veterinary postings by year [S9];\n  - city directories such as Весь Киев [S9];\n  - the 1914 list of Russian subjects caught abroad by the war (Список русских подданных, застигнутых войною за границей, Выпуск I, 26 July – 19 August 1914, Petrograd 1914), which gives home city and foreign address [S9];\n  - A. A. Starchevsky, Памятник Восточной войны 1877–1878 гг. (St Petersburg, 1878), an alphabetical book on distinguished, killed, wounded and shell-shocked participants [S2].\n- Copy names as printed. One 1915–1916 Весь Киев entry gives two different abbreviated forenames for the same man. [S9] Keep misprints too: a participant marked one misspelt RMS surname \"(!)\". [S10]","sources":["S10","S14","S15","S16","S17","S18","S12","S1","S9","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fd76cc676ada","kind":"unclassified","anchor":"- \"Аптекарь\" can mean the pharmacy owner or a qualified pharmacist. A participant judged that descendants most likely did not know the difference. [S1]\n- One participant first said every stage required a university exam. Another corrected him: an owner might hold no pharmaceutical diploma, an apprentice needed no university exam, and провизоры were rare. [S1] Do not use the first claim.\n- Medical personnel files show how the stages worked. [S6]\n  - The apprentice title came from a supplementary test (дополнительное испытание) at a boys' gymnasium. Most abstracts name it as a Latin test; a few say only \"supplementary test\", and one says the title was conferred by a gymnasium council.\n  - The assistant's degree came from the medical faculty of Kazan University or the council of Tomsk University.\n  - Each pharmacy is named by its owner, sometimes \"управляемой провизором\" someone else, so owner and managing pharmacist are named separately (ГАПК ф. 143 оп. 1 д. 1094–1106).\n- To settle which hypothesis fits, a participant listed these sources: business directories and address calendars, the RMS, university examination files for pharmacy assistants and pharmacists, and the provincial medical-board fond. [S1]\n- The personnel file's chain of pharmacies across provinces (Astrakhan, Saratov, Perm) tells you where to search next. [S6]","sources":["S1","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8b23bbeb3a2","kind":"unclassified","anchor":"- A directory or list namesake is a candidate. In one thread a participant judged a directory namesake unlikely to be the father. He judged an institute student a likely but unconfirmed match: the surname matched and the name and patronymic matched only roughly. [S1] A difference in age or initials ranks a candidate lower and never excludes it.\n- To link one man across clergy and civil records, participants used three records: a clergy register, an address-calendar note of his release from the clergy, and a marriage entry giving him a clerk's title. [S9] Link records the same way: through dated events in the records, not because the names match.\n- Absence from one annual list, one university roll or one calendar page does not show the person never held the profession. In one thread a university roll was searched under spelling variants without a hit. [S12] Record a miss as \"not found in edition X, section Y\".","sources":["S1","S9","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-009d7d46123d","kind":"unclassified","anchor":"- One row per observation with these columns:\n  - source (fond/opis/delo/folio, or edition with its \"as of\" date and page);\n  - post, institution, place;\n  - order date and seniority date;\n  - whether you read it in the original or in an abstract.\n- A family block taken from each service list, with locators. Keep adopted children, children of earlier marriages and court rulings as written.\n- A fond and edition register: checked, unchecked, paper-only or not online, and the next fond named by a closing entry.\n- Identity matches kept as ranked candidates.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-146ada6807c9","kind":"custody","anchor":"Rosarkhiv's page on genealogical research in RGVIA, as captured in March 2023, adds seniority lists\n(списки по старшинству) of generals and officers for 1737–1917 in f. 407 and 408, says that lists of\nthese kinds also occur in other fonds of the archive, and notes an alphabetical index to the officer\nlists of the latest period. [S22 @2026-11-13]","sources":["S22"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ad30c083bcc9","kind":"historical","anchor":"Check children's birth dates against the metrical books. In Denis Shilov's study of the formulary\nlists of about 600 ministers and State Council members, the family information was usually correct\nexcept for the children's birth dates, which contained inaccuracies and errors, especially in lists of\nthe first half of the nineteenth century, because they were often entered from memory. From 1905 the\nlists also gave the children's religion and, not always, the wife's birth date and the marriage date.\n[S23]","sources":["S23"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
