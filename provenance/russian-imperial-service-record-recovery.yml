claims:
  - {"id":"C-816593aa9ebe","kind":"method","anchor":"- Copy the post exactly as the record gives it, with its locality, for example пристав 3-го стана Красноуфимского уезда or полицейский надзиратель Сысертского завода. Keep any explicit statement that the father has no rank (не имеющий чина). [S3]\n- Name the body that employed him in that post. A стан пристав, uezd police clerk or урядник points to police fonds. For Perm province, check police fonds in ГАПК or ГАСО according to the locality. [S3] Other examples: a judicial investigator, candidate for judicial posts or notary points to the district court [S4]; a treasury bookkeeper or clerk to the treasury chamber and uezd treasuries [S5], [S8]; a forest guard to the forestry administration or the dacha forester [S7]; a physician, feldsher or pharmacy apprentice to the provincial medical personnel files [S2], [S6].\n- Map each change of post to its own employer. In Perm, a land captain’s (земский начальник) service abstract points to ГАПК ф. 38 оп. 2 д. 287 л. 2–3, while district-court staff are indexed separately in ф. 1 оп. 2 [S4]. Check the cited inventories for the office and period.","sources":["S3","S4","S5","S8","S7","S2","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d61aa0cbd468","kind":"method","anchor":"- **Later civilian employer.** Trace a police inspector’s transfer into the Perm treasury chamber through ГАПК ф. 111 оп. 1 [S3]. For earlier military service, check the later employer’s personnel records too. The treasury abstracts cite д. 1033 л. 259–263 for a retired lieutenant and д. 1021 for sworn treasury clerks whose lists recount prior campaigns [S2], [S13]. Other reported routes for 1877–1878 personnel are ГАПК ф. 143 оп. 1 for physicians and a zemstvo feldsher and ф. 162 оп. 2 for a gendarme officer [S2].\n- **Bodies that kept other agencies’ lists.** Search by the holding body as well as the employee’s post. A provincial prison-department clerk’s file is cited in the treasury series, ГАПК ф. 111 оп. 1 д. 123 л. 1–2 [S8]. Check the same opis for factory-office staff [S3] and ГАПК ф. 36 оп. 2 for court clerks, стан приставы and forest officials [S3], [S5], [S7].\n- **Police fonds as such.** A participant pointed to ГАПК ф. 132: оп. 1 д. 223 (lists of police staff), оп. 3 д. 77 (formulary lists of police ranks, Perm uezd police administration) and оп. 3 д. 78 (list of police ranks in Perm uezd). The participant linked online copies on the Perm archive portal at the time. [S3]\n- **Courts.** Follow every file and folio indicated for the candidate. For one district-court career the abstract cites two files in ГАПК ф. 1 оп. 2, д. 174 л. 3–6 and д. 175 л. 2–10 [S4].\n- **Loan committees.** For service on Perm’s учетно-ссудный комитет, check ГАПК ф. 113 оп. 1. A posted file reference is д. 331 [S11].\n- **Same fond number, different archive.** A participant posted this ГАСО list: ф. 36 is the senior forester of the Ekaterinburg works (1807–1886); ф. 55 is the forest department of the Ural mining administration (1839–1918); ф. 395, 404, 425 and 426 are dacha foresters; ф. 711 is the Irbit central forestry (1882–1916). [S7] ГАПК ф. 36 is a different body: the Perm provincial board (Пермское губернское правление). Always write the archive with the fond.","sources":["S3","S2","S13","S8","S5","S7","S4","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3436bea90ea7","kind":"unclassified","anchor":"**Also check the central series.** RGIA f. 1349 is a collection of civil officials' formulary lists, 1754–1917. Its personal lists are in оп. 3 (1800–1894, letters А–Я) and, for employees of central, provincial, uezd and local self-government bodies in 1894–1917, in оп. 1 (А–Р) and оп. 2 (С–Я). Group lists sent to the Heraldry in 1794–1846 are in оп. 4, group lists sent to the Inspector Department up to 1858 in оп. 5, and personal and group lists of 1754–1917 in оп. 6. The collection was put together from several streams, including lists taken from files due for destruction, so a miss there is not a negative. [S19] For nobility, honorary citizenship, change of surname and adoption, use RGIA f. 1343, the Department of Heraldry of the Senate. [S20] For the army, use RGVIA f. 409 (officers' service lists, attestations and award sheets, from 1847) and f. 489 (formulary and service lists of generals, officers, soldiers and officials, 1720–1900). For military medical staff, use RGVIA f. 879 (Medical Department, to 1867) and f. 546 (Main Military-Sanitary Directorate, 1867–1918). [S21]","sources":["S19","S20","S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2e314daecf3f","kind":"unclassified","anchor":"When a list ends, copy the closing entry and its reason exactly. Examples are transfer to railway control, call-up for military service, retirement on petition, or death. A stated destination is your next fond to search. The end of a list is not the end of a career. [S8], [S4], [S3]","sources":["S8","S4","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-55a300d3ae7b","kind":"method","anchor":"- Select the forest guard’s subunit before reading the annual bundle. The posted folio index for ГАСО ф. 55 оп. 2 д. 377 (1890) puts elected state-peasant полесовщики under their volost on л. 13–13об., and the Verkh-Isetsk possession dacha’s полесовщики on л. 165–166 [S7]. For the Nevyansk, Utkinskaya and Sysert holdings, start at л. 19–28, 34–42 and 101–112 respectively. Verify the headings and record archive, fond, opis, delo and folios [S7].\n- For hires, dismissals or transfers, follow the subunit into its personnel files [S7]:\n  - ГАСО 55-2-371 (1890), 55-2-470 (1894–1895) and 55-2-518 (1895–1896) cover hiring, dismissal and leave.\n  - ГАСО 78-1-1133 covers the Nevyansk dacha forest guard, 1899–1900. The participant reported many more forest-guard files in ф. 78.\n  - ГАСО 72-1-5503 is a 1914 staff list of a private mining company's district. [S7]\n- Check present access for each file. The cited folio guide came from a paper reading [S7]. Record a paper file you have yet to inspect as *not inspected* and identify which inventories or images you actually searched.","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c90287d29b04","kind":"method","anchor":"- **Origin and education.** Record:\n  - estate or origin (\"сын пономаря\", \"из крестьян … волости\");\n  - religion;\n  - school and certificate number;\n  - any qualifying examination, such as the exam for the first class rank (1-й классный чин) at a gymnasium. [S4], [S8], [S3]\n- **Every posting with dates,** including acting appointments (и.д., вр.и.д.) and secondments, plus awards. [S2], [S4]\n- **The two dates of each promotion.**\n  - Many entries read \"произведён … со старшинством с\" a date. Record the order date and the seniority date in separate columns.\n  - The gap can be years. In the abstracts, a promotion ordered in 1885 carries seniority from 1872, and an hereditary honorary citizenship granted in 1865 runs from 1860. [S5]\n  - Neither date tells you when another record would first show the new rank.\n  - Check any seniority date later than the order or promotion earlier than entry into service against the original folio. A published abstract pairs an order of 10 November 1878 with seniority from 25 September 1880 [S5]. Keep both dates as transcribed until you can explain the sequence.\n- **Family block.**\n  - Copy the wife with her father's estate or rank, the marriage date where given, and her maiden name.\n  - Copy children’s birth dates and any birthplaces, keeping each marriage’s children together (дети от 1-го брака) [S8], [S4], [S3]. A parent’s service file can give a locality for the metrical search. The abstract of ГАПК ф. 113 оп. 1 д. 331 places a daughter’s birth in Irbit on 27 October 1870 [S11].\n  - Copy adopted children as written (\"усыновленные\"). [S8] If the list gives a court adoption ruling (определение окружного суда) with its date, use it as the locator for that proceeding. Do not record the child as born to the marriage. [S4]\n- **Several lists for one person.** Keep each list as a separately dated statement with its own locator. Track additional references both within the same fond and across fonds, including the reported ГАПК ф. 36, 37 and 719 references [S3].","sources":["S4","S8","S3","S2","S5","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a1c721b4600f","kind":"method","anchor":"- Search provincial address calendars and Памятные книжки by year and section, recording each edition and page. In the 1904 Tobolsk address calendar a search missed the family on p. 18 but found members in the women’s school and elementary-school sections on pp. 46 and 49 [S10].","sources":["S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fd76cc676ada","kind":"method","anchor":"- Treat a family description of someone as аптекарь as a lead to both pharmacy ownership and professional practice. Look up the proprietor and the managing pharmacist separately [S1], [S6].\n- A university qualification cannot be assumed at the apprentice stage. Perm service abstracts record a gymnasium’s supplementary examination for an apprentice and a university faculty’s award of the assistant’s degree [S6].\n- Medical personnel files show how the stages worked. [S6]\n  - The apprentice title came from a supplementary test (дополнительное испытание) at a boys' gymnasium. Most abstracts name it as a Latin test; a few say only \"supplementary test\", and one says the title was conferred by a gymnasium council.\n  - The assistant's degree came from the medical faculty of Kazan University or the council of Tomsk University.\n  - Each pharmacy is named by its owner, sometimes \"управляемой провизором\" someone else, so owner and managing pharmacist are named separately (ГАПК ф. 143 оп. 1 д. 1094–1106).\n- Check business directories and address calendars for proprietors, and the RMS, university examination files and provincial medical-board fonds for qualifications and employment [S1].\n- Follow the named pharmacy and its proprietor into each successive locality. A posted apprenticeship record traces a move from Astrakhan province through Kamyshin in Saratov province to Usolye in Perm province [S6].","sources":["S1","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e8b23bbeb3a2","kind":"method","anchor":"- Keep directory and university namesakes as separate candidates. Compare the full name, patronymic, age, location, qualification and dated employment. If only the surname agrees closely, record which fields still need evidence [S1].\n- Follow a change from clergy to civil service through a dated release and a later record giving the civil title. For the reported Pavel Voinstvensky link, the 1860 clergy register, the 1885 calendar’s notice of his 1871 release and an 1874 marriage entry provide three separate observations to verify [S9].\n- Record each unsuccessful search with the university roll or calendar edition, section or page and spellings tried [S12], [S10]. Carry the still-unsearched institutions and years forward.","sources":["S1","S9","S12","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-009d7d46123d","kind":"unclassified","anchor":"- One row per observation with these columns:\n  - source (fond/opis/delo/folio, or edition with its \"as of\" date and page);\n  - post, institution, place;\n  - order date and seniority date;\n  - whether you read it in the original or in an abstract.\n- A family block taken from each service list, with locators. Keep adopted children, children of earlier marriages and court rulings as written.\n- A fond and edition register: checked, unchecked, paper-only or not online, and the next fond named by a closing entry.\n- Identity matches kept as ranked candidates.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-146ada6807c9","kind":"custody","anchor":"Rosarkhiv's page on genealogical research in RGVIA, as captured in March 2023, adds seniority lists\n(списки по старшинству) of generals and officers for 1737–1917 in f. 407 and 408, says that lists of\nthese kinds also occur in other fonds of the archive, and notes an alphabetical index to the officer\nlists of the latest period. [S22 @2026-11-13]","sources":["S22"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ad30c083bcc9","kind":"historical","anchor":"Check children's birth dates against the metrical books. In Denis Shilov's study of the formulary\nlists of about 600 ministers and State Council members, the family information was usually correct\nexcept for the children's birth dates, which contained inaccuracies and errors, especially in lists of\nthe first half of the nineteenth century, because they were often entered from memory. From 1905 the\nlists also gave the children's religion and, not always, the wife's birth date and the marriage date.\n[S23]","sources":["S23"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-654fcd080ecf","kind":"custody","anchor":"**Other central routes.** For a naval officer or official, search the Russian State Archive of the Navy (RGA VMF), which holds over a million files on the fleet from the 17th century to 1940. [S26 @2026-11-15] For 18th-century service, the Senate's Herold-master's office kept account of service people, and a 2026 study of retired officers of Peter I's army works from its records in RGADA f. 286. [S27 @2026-11-15] A man entering service had to supply his father's formulary list, sometimes also his grandfather's, to document his origin, so look for them in his own file before you search for the father separately. [S25 @2026-11-15], [S24 @2026-11-15]","sources":["S26","S27","S25","S24"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bda23629e1c1","kind":"custody","anchor":"**Lower ranks' insignia.** RGIA f. 496 is the fond of the Chapter of Russian Orders. [S29 @2026-11-15] It holds the lists of lower ranks awarded the insignia of the Order of St George from 1807 and of the Order of St Anne from 1797, with the insignia's number, the man's name, the year and his unit. [S28 @2026-11-15] A database built from the fond's op. 3 files on the St Anne insignia for 20 years' service says that they sometimes give the date on which the insignia came back to the Chapter after its holder's death or its loss, or the date of a pension petition. [S29 @2026-11-15] Read a return date as a lead to a death or a loss, not as proof of which, and look for the event in the regiment's and the parish's records.","sources":["S29","S28"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4c998e42e878","kind":"method","anchor":"- **Moscow: «Вся Москва».** The directory appeared yearly from 1872 to 1936. Its alphabetical list of residents usually names only heads of households, so spouses and minors are missing, and it also lists the staff of state, public and private institutions. [S36] Look for it in Glavarkhiv Moscow's online service «Моя семья», which in July 2024 included pre-1917 reference editions, among them «Вся Москва» and trade-and-industry directories. [S35] For elected municipal service, check the мещанская управа listing alongside the address and business entries [S34]. Use the trade headings in the edition’s spelling, such as «Ювелирныя вещи» for jewellery in 1905 [S33]. Search each year's resident list, the institution lists and the trade sections, and record the edition, section and page of each observation.","sources":["S36","S35","S34","S33"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ae0b4a459281","kind":"method","anchor":"**Read an awarded order by the rules of its date.** Until 1845 any Russian order gave the right to hereditary nobility [S32], except that a merchant awarded an order from 30 October 1826 received only personal nobility. [S37] From 1845 only the orders of St Vladimir and St George did so in every class, and the other orders only in their first class; from 28 May 1900 the 4th class of St Vladimir gave only personal nobility. [S32] The Russian Order of St Stanislaus had three classes from its statute of 1839, so a 4th-class award comes from before 1839; awards of its 2nd and 3rd classes were suspended in 1845 and resumed in 1855, when only the 1st class still carried hereditary nobility. [S31] A Tula account records a man of clergy origin enrolled in the nobility after a 4th-class St Vladimir award in 1847 [S30]. When a list shows an order awarded before its cutoff, search the guberniya noble deputies' assembly and RGIA f. 1343 for an enrolment, whatever estate the man was born into.","sources":["S32","S37","S31","S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-408313a50ef7","kind":"portal-availability","anchor":"RGVIA's inventories are only partly online. A genealogy guide sorts them into inventories available remotely in electronic form (mainly those for 1914–1920), electronic inventories open only on the reading-room computers, paper inventories in the reading room, and inventories that must be ordered separately. [S39 @2026-11-15] A genealogist who searched the archive's electronic inventories by surname warns that the fonds are only partly catalogued, so a surname without a hit can still be in the files, and that the search has no fuzzy matching, so part of the surname works better than the whole. [S38 @2026-11-15] Record a miss as a miss in the online inventories only, and browse the inventories of the fonds that fit the man's service.","sources":["S39","S38"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-bc51df8d4731","kind":"method","anchor":"- **St Petersburg: «Весь Петербург».** The capital's yearly directory appeared under that title from 1894 to 1914, as «Весь Петроград» from 1915 and as «Весь Ленинград» from 1924. Like «Вся Москва» it listed only heads of households, without spouses and minors, and 70% or more of the city's pre-revolutionary residents, mainly industrial workers renting rooms, are not in it. [S41] A genealogist searches city address books, which give residents' home addresses as well as shops and businesses, by surname, given name and patronymic, and tells namesakes apart by a known address or workplace; a man living with parents, a brother or children is not listed under his own name. [S40] Search by the full name, separate namesakes by address or workplace, and record a miss as no evidence about a lodger, a worker or a dependent.","sources":["S41","S40"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b2b16c74fabe","kind":"portal-availability","anchor":"- The National Library of Russia (РНБ) lists Памятные книжки by guberniya [S14 @2026-11-19]. The bare `/elibrarypro/memo/` address could not be read and returned HTTP 404 [S47† @2026-11-19]. Its separate holdings index lists libraries, archives and museums by city [S15 @2026-11-19].","sources":["S14","S47","S15"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-dea8d9825174","kind":"portal-availability","anchor":"- The Vologda Regional Library hosts a name index from the Novgorod Памятные книжки [S16 @2026-11-19] and texts of the Vologda books [S46 @2026-11-19].","sources":["S16","S46"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0151dba58770","kind":"portal-availability","anchor":"- The Presidential Library search results could not be read past a browser security check on 19 November 2026 [S17† @2026-11-19]. If the check recurs, hand the search to the user’s browser.","sources":["S17"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-f40de973dab3","kind":"portal-availability","anchor":"- **Erik-Amburger-Datenbank.** For an official or professional of foreign origin, search the Erik-Amburger-Datenbank of the Leibniz-Institut für Ost- und Südosteuropaforschung (IOS, Regensburg). It catalogues about 100,000 foreigners in the Russian Empire up to 1917, built from Erik Amburger's card file, and publishes a list of its sources. It is a compilation: follow each entry to its cited source before you use it. [S18 @2026-11-19]","sources":["S18"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-4bf7b39e7202","kind":"method","anchor":"- **Российский медицинский список (RMS).** Follow a university-record lead into the RMS [S12]. Record the edition, “as of” date, section and page. The Russian State Library dates the 1914 and 1916 lists to 1 May of their respective years [S42], [S44]. Check the alphabetical women-physicians section under the birth surname as well as the married surname introduced by по мужу, and copy the post as printed [S10].\n- **Decode compressed RMS fields from the edition's printed legend, not from a forum reading.**\n  - The 1914 legend gives the order: birth year, then degree, then graduation year. Its own example is \"63 Л. 82\": born 1863, лекарь, graduated 1882 [S45].\n  - Preserve abbreviated years and degree letters before expanding them. For example, the 1914 women-physicians extract has 82 Л. 910, which by that edition’s key gives 1882, лекарь and 1910 [S10], [S45]. Check the edition of any undated extract before applying this key [S9].\n  - The forum reading of *1919 … Л888 … Вен.* points to the Soviet list current on 1 January 1924 and published in 1925 [S1], [S43]. Its sequence is no key to an imperial edition.\n  - For editions other than 1914, open that edition's own legend before decoding. Leave fields literal until you have it.\n- **Other professional and city lists:**\n  - zemstvo veterinary postings by year [S9];\n  - city directories such as Весь Киев [S9];\n  - the 1914 list of Russian subjects caught abroad by the war (Список русских подданных, застигнутых войною за границей, Выпуск I, 26 July – 19 August 1914, Petrograd 1914), which gives home city and foreign address [S9];\n  - A. A. Starchevsky, Памятник Восточной войны 1877–1878 гг. (St Petersburg, 1878), an alphabetical book on distinguished, killed, wounded and shell-shocked participants [S2].\n- Copy the printed spelling and initials before adding search variants. The quoted 1915–1916 Весь Киев lines use both Ант. and Анатол. at the same address [S9]. The 1914 women-physicians extract gives Чрнавина where the 1916 extract gives Чернавина; search both alongside the married surname Белитская [S10].","sources":["S12","S42","S44","S10","S45","S9","S1","S43","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
