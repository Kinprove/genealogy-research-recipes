claims:
  - {"id":"C-0fb391e4feee","kind":"custody","anchor":"Start with the Order fonds at the Archivos Eclesiásticos de Mérida-Badajoz and its *Catálogo-Inventario Fondo Orden de Alcántara. Prioratos de Magacela y Zalamea*. Match the historical town and institution, then use the classification and series date limits to locate the possible file [S1 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22].","sources":["S1","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-68f339a227dd","kind":"historical","anchor":"Treat this as a closed fonds with a local scope. If the town or year falls outside the surviving records of these priories, look for the relevant creator’s own archive. The loss of the Order’s central archive limits what can be inferred from gaps in the local inventory [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6eb2f102c2bb","kind":"method","anchor":"Keep the fonds, section, series, inventory sheet (*hoja*), box (*caja*), file (*expediente*) and any folio together. The sheet identifies the inventory entry. Use the box, file and folio to retrieve the papers [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cc3292f44127","kind":"method","anchor":"Under **Gobierno interno**, use *Actas* for decisions on the Order’s business, *Cartas pastorales* for a prior’s religious instructions and *Visitas pastorales* for inspections, inventories and required changes. Under *Disposiciones*, distinguish a circular, mandate and ordinance. Use *Correspondencia* for exchanges, *Inventarios* for earlier descriptions of holdings, *Certificados* for certified duties and *Jubileo* for indulgence files [S1], [S2], [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5129d968d960","kind":"example","anchor":"For visits to parishes, churches and foundations in Villanueva de la Serena, start with the index in caja 19, fols. 747–757. Use it to find the 1633 visit to the La Haba priest’s chaplaincy [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8a8a551c3c04","kind":"method","anchor":"Under **Gobierno externo**, search by the issuing or receiving authority. For ecclesiastical exchanges, check *Arzobispado Castrense* or *Junta Diocesana de Regulares*. For civil exchanges, look under *Ayuntamientos* for municipal correspondence, *Capitanía General de Extremadura* for correspondence or forms, and the provincial government or *Ministerio de Gracia y Justicia* for communications. Check the *Intendencia del Ejército y Provincia de Extremadura* for circulars and *Monarquía → Disposiciones* for formal royal acts. In the military branch, open the *Real Consejo de las Órdenes Militares* group and check the issuing body, especially for circulars from the special tribunal [S1], [S2], [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-3985a45814bb","kind":"example","anchor":"For the royal provision announcing Fernando VII’s death and directing the continued administration of justice, use caja 1, expediente 75 as the locator [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a9912c2b4e7c","kind":"method","anchor":"Use **Administración → Parroquias → Clero secular** for appointments, resignations, licences and dispensations. Check *Provisiones* for a *curato*, *coadjutoría* or *tenencia* and *Congrua* for the income or means recorded to support ordination. Under **Conventos → Clero regular**, look for entry into the order, elections, transfers or departures [S1], [S2], [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b422e14226f8","kind":"method","anchor":"Under **Administración**, use *Ermitas* or *Oratorios* for licences appropriate to the institution. For *Capellanías*, trace the foundation and founders’ testamentary terms separately from competitions, appointments and resignations. For *Obras pías*, *Patronatos* and *Hermandades y cofradías*, open the relevant foundation file. Then look for appointments or named patrons where the classification provides that series [S1], [S2], [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b82eebda1847","kind":"method","anchor":"Under **Economía**, choose the institution first. Within its branch, look for property and *censos* under *Ingresos*, repairs and expenses under *Gastos*, and accounts under *Balances*. For a hermitage, use income files for alms and property and expense files for construction decisions when the inventory omits balances. For a parish, check Mass registers alongside property and accounts. Read a *fábrica* file here for building works or repairs [S1], [S2], [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d142e843c6ac","kind":"method","anchor":"For a chaplaincy, search *Últimas voluntades* for testamentary provisions and *Misas* for Masses said or requests for reduction. Compare *Cargas* with the foundation terms and use *Cuentas* for administration. For a charitable foundation, distinguish applications for dowries from awards in *Dotes*. For a patronage or confraternity transaction, check *Bienes* and any separate *Censos* and *Cuentas* series [S1], [S2], [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b42b1bd69b01","kind":"method","anchor":"Under **Justicia**, use *Pleitos civiles* for contested inheritance or unpaid stipends, *Pleitos criminales* for prosecutions and *Pleitos matrimoniales* for marital litigation. Within the last branch, search *Nulidades matrimoniales* for a challenge to the marriage and *Otros pleitos matrimoniales* for other disputes. Read the decision separately from the allegations [S1], [S2], [S4].","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-33804b04839c","kind":"portal-availability","anchor":"For a marriage investigation without a litigation lead, use the archive’s town-by-town *Expedientes Matrimoniales* inventory as a separate search [S5 @2026-11-22].","sources":["S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
