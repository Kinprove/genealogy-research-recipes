claims:
  - {"id":"C-251c81450dea","kind":"portal-availability","anchor":"- **Backbone haplogroup (e.g. R-M269) / a 23andMe or third-party estimate** → resolves **millennia**, not generations: a high-level assignment's MRCA sits **thousands of years back** (R-M269 formed about 6,450 years ago; a 23andMe-level estimate points ~2,000–5,000 years back). Genealogically **inert**: it cannot place a paper-trail-era ancestor, and it is *not* an ethnicity (R1b is common in Europe but not all Europeans are R1b, nor all R1b European). Y and mtDNA haplogroups together capture a *shrinking* slice of ancestry (½ of the grandparents, ¼ of the great-grandparents, ⅛ …), never \"your heritage.\" (Family History Fanatics, 2026-05 [N12 @2026-11-08]; GeneaVlogger, 2026-04 [N3 @2026-11-08]; DNAeXplained, 2026-04 [N11 @2026-11-08])\n- **Y-STR panels — Y-37 and Y-111 today** → give **matches + a genetic distance (GD)**, mapped by the TiP report to a **time range that widens at lower marker counts** [N104 @2026-11-08]. A GD is *stochastic*, not a clock (below). FTDNA stopped selling Y-25 and Y-67 as *new* tests in January 2020 [N96 @2026-11-08]. Its help now says it no longer offers the 12-, 25- or 67-marker levels [N97 @2026-11-08], and its upgrade price list shows no upgrade to Y-67 [N98 @2026-11-08]. Legacy Y-67 kits can still be upgraded [N98 @2026-11-08], and FTDNA's TiP help still shows estimates for every Y-STR matching level from Y-12 to Y-111, Y-67 included [N104 @2026-11-08].\n- **Terminal SNP via Big Y-700** (~23 million Y positions, per DNAeXplained; tests STRs *and* SNPs — SNPs define the branch, and Big Y matches men who carry the same SNPs) → refines the branch, generally into a **genealogical timeframe**; Match Time Tree dates it. It is the test that can separate a recent surname connection from a deep coincidence. (DNAeXplained, 2026-04 [N11 @2026-11-08]; FTDNA, 2026-05 [N6 @2026-11-08]; Rowe-Schurwanz, 2024-08-20 [N26 @2026-11-08])\n- **mtDNA HVR1/HVR2** → a match here has low resolution and tends to point to a more distant maternal ancestor, often **thousands of years back**; on its own it cannot support a recent or geographic conclusion. **Full sequence (all 16,569 positions)** is the refined test — but even a full-sequence match is **still not proof of a genealogical-timeframe or geographic relationship** (where matches live today does not place the shared ancestor [N15 @2026-11-08]; fewer testers [N3 @2026-11-08]). (GeneaVlogger, 2025-09 [N15 @2026-11-08]; DNAeXplained, 2026-04 [N11 @2026-11-08])\n- **STR vs SNP**: SNPs are stable, long-term branch definers; **STRs mutate faster**, and a marker value can step up or down (a 15 becoming a 14 or a 16), so STR closeness is *weaker* evidence than a shared SNP. (Rowe-Schurwanz, 2024-08-20 [N26 @2026-11-08]; FTDNA, 2026-05 [N6 @2026-11-08])\n- **Privacy gate:** <!-- privacy-gate: third-party-tool --> Entering a tester's or relative's STR values into a subclade predictor sends living people's genetic data to an outside tool; answer the privacy gate in `SKILL.md` first.\n- **An STR-based subclade prediction nominates a branch; it does not assign one.** Record the predictor, or the SNP-tested project set whose STR signatures were used, along with the markers, values, tree version and date. Test it against the STRs of a documented same-line relative whose branch was measured by Big Y or sequencing, and compare a second predictor ([predictor comparison](https://genarchivist.net/showthread.php?tid=1806) [N47 @2026-11-08]). A tester who fits no signature stays unresolved ([signature example](https://genarchivist.net/showthread.php?tid=558), partially read [N48 @2026-11-08]); STR instability (see STR vs SNP above) is one reason a signature may mislead. Report the result as predicted until a SNP test confirms it. Agreement at one level does not validate deeper calls, and neither source establishes any tool's accuracy.","sources":["N12","N3","N11","N104","N96","N97","N98","N6","N26","N15","N47","N48"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e8768090b701","kind":"unclassified","anchor":"For an authorized legacy paper result, retain the report and its tester, laboratory, assay\nand panel beside any manual reconstruction. Check each available marker label and value\nagainst that source before using an offered entry/import route; leave unreadable or unmapped\nfields unresolved. Date and attribute the reconstruction: it represents the old assay, not a\nnew test or independent confirmation. The [paper-result recovery example](https://familylocket.com/recreating-a-y-dna-surname-project-at-mitoydna-org/)\ndoes not supply a current import format or a cross-laboratory conversion.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1dfe9035286f","kind":"unclassified","anchor":"For several kits, retain the full STR table and make a separate working view of comparable\nmarker columns with observed differences. Carry kit/locus labels, panel coverage and unresolved\nor multicopy calls; a missing call is not an observed equality or zero allele. Use that view\nto nominate a locus or source discrepancy for checking. The [difference-view example](https://www.yourdnaguide.com/ydgblog/ydna-for-genealogy)\nsupplies the filtering action; the view does not root a tree, count mutation events or identify\na father or MRCA.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-92ec7edf0379","kind":"unclassified","anchor":"Before computing GD across sources, label each STR value's origin and convention. It may be a laboratory panel value (with date), a value extracted from sequencing data, a copied database or certificate entry, or a typical value filled in for a missing marker. Laboratories can number the same marker differently ([cross-database entry discussion](https://forum.molgen.org/index.php/topic,3315.0.html); [laboratory-panel discussion](https://forum.molgen.org/index.php/topic,15097.0.html)). One laboratory announced renumbering that would make earlier certificates disagree with its website ([nomenclature announcement](https://forum.molgen.org/index.php/topic,125.0.html)). Convert a value only where the laboratory or target tool documents the rule, and keep original and converted values side by side. If an extracted value and a panel value disagree, keep both and mark the marker unresolved ([extraction comparison](https://forum.molgen.org/index.php/topic,10934.0.html)). Compare only markers both sides report. For a manual comparison, sort multi-copy values in ascending order without replacing the laboratory's rules ([multi-copy display case](https://genarchivist.net/showthread.php?tid=2477)). A numbering offset, an imputed value or a display-order difference is never a mutation or a GD step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8ad30ff31679","kind":"unclassified","anchor":"Label every branch age you quote. Say whether it is a formed age (the split from the parent) or a TMRCA (the common ancestor of the men sampled so far), and name the tree and the date consulted. A [formed-versus-TMRCA discussion](https://forum.molgen.org/index.php/topic,7976.0.html) describes a branch formed about 14,000 years ago whose two testers share an ancestor about 2,700 years ago. Keep both values for each node, as in a [branch-date chain check](https://genarchivist.net/showthread.php?tid=2085). Do not substitute one for the other. Do not set provider and paper figures side by side until both date the same event and node ([D0 dating comparison](https://genarchivist.net/showthread.php?tid=1069); [formed-versus-TMRCA exchange](https://genarchivist.net/showthread.php?tid=760)). If a TMRCA interval is older than the branch's own formed interval, flag it as a display or data problem ([age-interval report](https://genarchivist.net/showthread.php?tid=179)). A formed age is not the age of the tester's closest tested relative, and where an MRCA lived is not where the branch arose. A TMRCA can move when another tester joins.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c755e38367b4","kind":"unclassified","anchor":"Do not turn a full-sequence mtDNA GD0 or GD1 into centuries with a mutation rate. The lower bound is zero. The upper bound depends on the youngest branch containing both sequences, judged against all available sequences of that subclade ([common-ancestor discussion](https://forum.molgen.org/index.php/topic,2742.0.html); [full-sequence example](https://forum.molgen.org/index.php/topic,2548.0.html)). Several exact matches in one region on a widespread ancestral type with no private mutations may be independent lines, not one founder line. Record each match's own test level and compared regions beside its label. An HVR-level match shown to a full-sequence tester may never have tested the coding region. A project table of HVR values cannot show that a coding mutation is absent ([match-list discussion](https://forum.molgen.org/index.php/topic,936.0.html)). Count matches separately at each level. A subclade missing among HVR1-only matches tells you nothing ([match-count example](https://genarchivist.net/showthread.php?tid=1141)). The rates and year figures in these threads are forum estimates from one database; do not reuse them, and no frequency threshold is given.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-952eb84a594d","kind":"unclassified","anchor":"If the purchased Y-STR level shows no matches, view the match list at a lower comparison level\nbefore concluding that no paternal-line relatives have tested. Record which level produced each\nmatch. A different-surname match seen only at a lower level remains unresolved as recent or ancient.\nCheck its actual panel coverage and available higher-level results, and compare the documented\nplaces of origin of both surnames as one lead. The\n[brother's Y-67 example](https://www.youtube.com/watch?v=0c9tQzocXZs) motivates this check. A\nshared region of origin does not establish when or how the lines connect, and such a match does\nnot identify a recent family.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-30338c9bf2ba","kind":"unclassified","anchor":"Treat absence from one match list as a bounded negative. A branch member can be missing from Big Y matches yet appear in the Block Tree ([match-list exchange](https://genarchivist.net/showthread.php?tid=432)). STR-only and Big Y testers may not see each other ([project case](https://forum.molgen.org/index.php/topic,2675.0.html)). Another tree or service can hold testers who uploaded only there ([two-tree discussion](https://forum.molgen.org/index.php/topic,15097.0.html); [cross-service discussion](https://genarchivist.net/showthread.php?tid=895)). A man who never tested a level drops off that level's list, and a pair near a threshold can vanish at one level and reappear at another ([threshold case](https://genarchivist.net/showthread.php?tid=2647)). For each pair, record the levels both men tested, the GD at each and the lists where each appears. In public STR databases, classify each exact hit as a tester, a published-study sample or a modal haplotype before counting it ([database discussion](https://forum.molgen.org/index.php/topic,3315.0.html)). A modal hit means only that the haplotype is common. The match thresholds quoted in one thread are a poster's unverified statement, not current vendor documentation, and a reappearance does not date a common ancestor.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c5b81d366c90","kind":"unclassified","anchor":"Record an mtDNA haplotype-cluster label separately from the haplogroup, the GD and the documented maternal descent. Use it to narrow a long match list for review, not as the boundary of close kin. FamilyTreeDNA's explanation, quoted in a [haplotype-cluster discussion](https://genarchivist.net/showthread.php?tid=1508), says cluster signatures can include fast-mutating and personal markers. In a [cluster-versus-pedigree report](https://genarchivist.net/showthread.php?tid=1161), testers reported to share an early-1800s maternal ancestor fell on opposite sides of a cluster at GD0 and at GD1. Check excluded matches against the documented pedigree. Neither thread describes the clustering method.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-72d947046980","kind":"unclassified","anchor":"- **Relevant descendants simply never Y-tested.** So few men Y-test that you can have many autosomal-confirmed same-surname cousins and *still* no Y-match — the host knows (via autosomal DNA, conclusively) he descends from Goldbergs, yet **not one Goldberg cousin has Y-tested**, so his own Y-haplogroup looks \"disconnected.\" Absence of a co-tester is also just a **\"haplogroup in waiting\"** — a private variant needs a *second* tester before it forms a branch. (GeneaVlogger, 2026-05; DNAeXplained, 2026-04)\n- **A sequencing / read-interpretation error, or a newly-defined SNP** re-shuffling the assignment. (GeneaVlogger, 2026-05)\n- **Same-name-different-man, a stepparent/illegitimacy on a *different* generation than assumed, or a surname that predates hereditary surnames.** The Woodall project split one presumed family into **four** groups: one carried the surname via his *mother* (illegitimacy), one had a Native American paternal line, and two descended from different 1600s sons with different haplogroups — and the project could not tell whether the cause was misattributed paternity, a stepparent situation, or simply two different men who shared the same name. (Legacy Tree, 2026-01)\n- **Privacy gate:** <!-- privacy-gate: contact --> Asking another son of the same father, or other documented male-line relatives, to take a Y-DNA test approaches living people about a paternity question; answer the privacy gate in `SKILL.md` before contacting them.\n- **A laboratory sample mix-up, or a documented name change.** Before reading a surprising Y result as an event, consider a replicate on a separate kit or a test of another son of the same father ([close-relative testing discussion](https://forum.molgen.org/index.php/topic,14692.0.html)). Record both kits and their results. Agreement shows only that the result reproduces for that sample source. Disagreement between two kits from the same man points to sample handling; between brothers it leaves both handling and paternity open. Also search for a record that would explain a surname change, such as a child registered under a stepfather's surname after the mother remarried, or a clerical misentry that was later kept ([surname-change discussion](https://genarchivist.net/showthread.php?tid=1838)). Keep legitimacy and biological paternity in separate fields. A man named in a baptism, or a husband who married the mother shortly before a birth, is a documentary attribution, not genetic confirmation. The rates quoted in the surname-change thread are not used, and neither thread shows which pathway applies to a given line.\n- **A break in the matches' line, not yours.** When many Y matches share a different surname, the event may sit in their common ancestor: a misattributed or unknown parentage there put that surname on a paternal line shared with yours. To locate a break, target-test documented male-line relatives who descend from your proposed paternal ancestors at different generational depths; the pattern of matches brackets the generation or points to another explanation. A non-match with one cousin leaves the break on either man's path below their shared ancestor, so test another descendant of that ancestor before assigning it to your line. (Legacy Tree, 2023-01-04)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-704cb7b41cf8","kind":"unclassified","anchor":"**Weigh each call before it places, excludes or links.** Some markers listed as a branch's equivalents also read derived outside it, so require a reliable equivalent or a downstream variant. An ancestral read at a false-negative-prone SNP is a weak exclusion. Ancestral calls at sibling subclades leave the last one likely, not proven ([equivalent caution](https://genarchivist.net/showthread.php?tid=1590); [sibling-elimination discussion](https://genarchivist.net/showthread.php?tid=86)). For each negative used to split a block or set a basal node, record its read count and quality, and inspect the reads ([read list](https://genarchivist.net/showthread.php?tid=1497); [low-quality negative](https://forum.molgen.org/index.php/topic,10534.0.html)). Convert coordinates to each file's build before reading a state, and resolve SNP names by position ([build example](https://genarchivist.net/showthread.php?tid=2491); [naming exchange](https://genarchivist.net/showthread.php?tid=318); [position comparison](https://genarchivist.net/showthread.php?tid=275)). A variant shared with an incompatible haplogroup, or any single shared mutation, may be a recurrence, not a link ([shared-mutation explanation](https://genarchivist.net/showthread.php?tid=1161); [incompatible-haplogroup recurrence](https://forum.molgen.org/index.php/topic,10534.0.html)). Take unreliable markers from the tree, not from memory. No source gives a read-count threshold; the mapping-quality ≥30 filter in the build example is one replier's choice, not a standard.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d7cd46fe7d7","kind":"unclassified","anchor":"Before closing a candidate Y-DNA branch because an obituary names no surviving son, compare\nthe notice with the documented child roster. Check whether a son who died earlier left sons,\nand trace the relevant male-line descendants with evidence for each parent-child link. For a\nliving descendant, record only name, parents and place in the family; do not look up current\ncontact details, and stage any contact through\n[DNA match outreach staging](dna-match-outreach-staging.md). Leave unexamined branches unresolved. The [historical obituary demonstration](https://www.youtube.com/watch?v=Ff_n37xMPbA)\nmotivates this roster check; it does not establish a living tester or the reported descent.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7637de8c0682","kind":"unclassified","anchor":"- **Fluency ≠ correctness on phylogeny.** An LLM will emit a clean, wrong haplogroup story (Anzick/A2ex) and *argue* when corrected. Professional-looking output invites unwarranted confidence — that's the danger, not a tell.\n- **Surname timing traps.** \"Different surname ⇒ NPE\" ignores that hereditary surnames were adopted late and unevenly — as recently as the **1930s** in some regions; Dutch not standardized until **1811**; Normandy by the 14th c. (the 1539 Ordinance of Villers-Cotterêts then required priests to record surnames in parish registers — it fixed name *recording*, it did not mandate hereditary surnames). A shared paternal ancestor may simply predate surnames, or a surname was government-assigned for taxation/conscription. Compare the estimated MRCA date to *when surnames were adopted in that region* before reading a mismatch as an event. (FTDNA, 2026-03/2026-05; GeneaVlogger, 2025-09/2025-12; DNAeXplained, 2026-05)\n- **Third-party autosomal-derived haplogroups aren't Y/mt tests.** A haplogroup inferred from autosomal raw data is high-level and can be **thousands of years off** the tester's true paternal-line MRCA — don't treat it as equivalent to an actual Y-DNA/mtDNA result. (GeneaVlogger, 2025-09/2026-04)\n- **A chip-derived Y terminal shows where the chip's SNPs stop.** Record the vendor and chip version, or mark it inferred or unknown. Sort each downstream branch marker into tested-negative or absent from that version, searching equivalent names too. Only a tested-negative excludes a subclade. A SNP discovered after the chip was designed will not be on it under that name, though an equivalent at a probed position may still be callable ([chip-version discussion](https://genarchivist.net/showthread.php?tid=1160); [array discussion](https://genarchivist.net/showthread.php?tid=275); [chip-panel discussion](https://genarchivist.net/showthread.php?tid=2610)). Look up the raw call for each assigning SNP, and check any assigning SNP that recurs on another branch. A positive that conflicts with a positive on a sibling branch is a probable bad probe ([raw-call check](https://genarchivist.net/showthread.php?tid=754)). Two predictions from one file conflict only if neither is upstream of the other ([caller discussion](https://genarchivist.net/showthread.php?tid=2292)). A second classifier on the same file checks consistency, not correctness ([raw-data check](https://genarchivist.net/showthread.php?tid=2632)). Never fill in a subclade from an AI guess; a downstream share among upgraded testers is a population estimate, not this tester's result. The community SNP lists remain unverified.\n- **Phylogenetic trees and migration maps are tester-dependent.** Branch definitions and dates differ between platforms, and geography tools (e.g. Globetrekker) mislead when few relevant men have tested — more testers can substantially shift the inferred geography. Never present the current tree as fixed truth. (GeneaVlogger, 2026-05; DNAeXplained, 2026-05)\n- **A label string is not a clade.** Keep each haplogroup label with the tree or tool that assigned it, its version or date, its input, and the point where assignment stopped. Do not silently replace a vendor label with a deeper third-party one ([clade-finder example](https://genarchivist.net/showthread.php?tid=367); [archived-read re-call](https://genarchivist.net/showthread.php?tid=32)). Long-form and longhand names are renumbered between releases. A proposed name can also coincide with a vendor name for a different clade. So compare defining variants, and anchor on the source's SNP-named label ([nomenclature discussion](https://genarchivist.net/showthread.php?tid=96); [longhand discussion](https://genarchivist.net/showthread.php?tid=2317); [name collision](https://genarchivist.net/showthread.php?tid=1236)). Keep a generated or unsourced name-to-SNP mapping unresolved. A shallower label in a second database may only mean it lacks another carrier of the downstream variant. Check the first provider's SNP results before calling it a conflict, and do not promise an update ([cross-database exchange](https://genarchivist.net/showthread.php?tid=6)). None of these sources validates an assignment.\n- **Branch flags, country counts and frequency maps are tester tallies.** Run these checks before reading them as origin or frequency. Count documented close kin, such as a father and son or brothers, once, and record the relationship evidence ([branch-flag example](https://genarchivist.net/showthread.php?tid=1064)). Assume the same sequence may appear in several public trees. Keep entries of unknown provenance flagged, so a combined count is an upper bound ([cross-tree caution](https://genarchivist.net/showthread.php?tid=1981)). Note which communities test heavily, and compare at subclade level ([frequency-map discussion](https://genarchivist.net/showthread.php?tid=254)). Many testers stopped at an upstream SNP, so downstream shares rest partly on unresolved kits ([country-count discussion](https://genarchivist.net/showthread.php?tid=745)). State a count as observed in that database on that date. Do not correct it yourself or swap in an unsourced published frequency. No source measures the bias.\n- **A branch's size is not its age or founder status.** Do not read a large branch, or a lineage's large share of one community's Y results, as evidence that the lineage entered that community early or is old. Size depends on how many male-line descendants survived and how many of them have tested; a thin sibling branch may be under-sampled, not extinct. Take a branch's age from the tree's dated estimate, labelled as a formed age or a TMRCA (see the formed-versus-TMRCA rule above) (JewishGen, 2026-07-05).\n- **Origins reported by matches are a location lead, not an origin finding.** For a\n  paternal-origin question (England vs Ireland, England vs Germany), tabulate the earliest known\n  ancestor and place reported by each Y match or nearby Block Tree non-match. Label each entry as\n  self-reported and note its test level and branch. A pattern can show the question is worth\n  asking, but it does not answer it, verify those trees, or date a migration. The pattern depends\n  on who has tested (see the tester-dependence pitfall above). The\n  [Eberle origin-question remark](https://www.youtube.com/watch?v=0c9tQzocXZs) and the\n  [Big Y Block Tree case](https://www.youtube.com/watch?v=bEDj6kd-15Q) motivate this tabulation.\n- **A notable-connection report is a haplogroup comparison, not a pedigree.** Before any documentary search for a link to a famous person, read the report's estimate of when the shared direct-line ancestor lived; most such ancestors lived thousands of years ago. Attempt documentary proof only when that ancestor falls inside the region's paper-trail era, because proof needs a record for every generation on both direct lines and DNA does not supply them. Record how the notable's haplogroup was obtained: tested directly, deduced from tested descendants, or inferred from living collateral relatives (more common than descendant testing). Any label not tested directly also rests on the documented kinship between those testers and the notable. (Legacy Tree, 2025-06-01)\n- **A match to a named lineage's project tests descent, not group membership.** When a same-surname tester compares with a chiefly family's Y-DNA project, such as a Scottish clan chief's line, a match is a clue that the tester descends from that family's male line. Before calling it a match to that family, apply the resolution and surname-cluster rules above, and compare the estimated common ancestor's date with when that surname was adopted in the region (see the surname-timing pitfall above). Do not report a match as membership in the clan or other group that bore the name, and do not read a mismatch as excluding that membership. Membership is a separate documentary question for the records of the specific ancestors. (Legacy Tree, 2026-08-19)\n- **mtDNA is a weak genealogical instrument by design** — slow mutation, fewer testers, wide match ranges. Great for *eliminating* a direct-maternal-line hypothesis, poor for *pinning* a relationship.\n- **An mtDNA label is only as deep as the positions behind it.** Record the tool, the tree build and the regions sequenced. For each candidate, record the matched, extra and untested or no-call defining positions. HVR-only data support at most the shared parent of tied sibling subclades, so keep a deeper label provisional until coding-region calls support it ([predictor report](https://forum.molgen.org/index.php/topic,1856.0.html); [predictor output](https://forum.molgen.org/index.php/topic,2099.0.html); [tie resolved by full sequence](https://forum.molgen.org/index.php/topic,2548.0.html); [preset panels](https://forum.molgen.org/index.php/topic,3315.0.html); [control-region remark](https://genarchivist.net/showthread.php?tid=95)). Check the base each mutation requires against the observed base, reading '!' by the tree's convention ([notation discussion](https://genarchivist.net/showthread.php?tid=1987)). Read a label's parent from the tree path, not from its letters, and after an update check whether the branch was renamed or actually moved ([Mitotree label discussion](https://genarchivist.net/showthread.php?tid=1161)). When labels or providers disagree, tabulate each node's defining mutations and their stability instead of adopting either label ([placement discussion](https://genarchivist.net/showthread.php?tid=84); [coverage discussion](https://genarchivist.net/showthread.php?tid=32)). None of these sources measures accuracy. Route the current label to Mitotree.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-64df8ae7c40b","kind":"unclassified","anchor":"For a supplied ancient-sample catalogue, retain its source and date/version alongside the\ntester's externally reported haplogroup and assay/test level. Search the exact supplied\nlabel and record the query and returned specimen IDs. If a downstream Y label is absent,\nuse an actually supplied or inspected tree to record each upstream label tried; do not\ninvent the hierarchy. An unavailable tree or unknown test resolution stays unresolved.\nThe [dated British Isles catalogue example](https://dna-explained.com/2022/02/01/dna-from-459-ancient-british-isles-burials-reveals-relationships-does-yours-match/)\nsupplies this search step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8f8b838e594b","kind":"unclassified","anchor":"Keep separate Y-DNA and mtDNA lineage rows. For each documented line, record its nearest\nrepresented person, ordered upstream ancestors, sources and unresolved links, then attach\nthe existing tester and actual test type/level. Several ancestors in the same line need\nnot become separate testing targets. Keep a tree-page navigation bookmark in its own\nfield: the person used to open the next pedigree page may belong to a different lineage.\nThe [lineage worksheet example](https://dna-explained.com/2025/02/23/lineages-versus-ancestors-how-to-find-and-leverage-yours/)\nsupplies this organizational step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-966ffefb716c","kind":"unclassified","anchor":"Before recruiting a new tester, search for results already published. Where a WikiTree DNA\nTests entry or another source gives a FamilyTreeDNA kit number, run a web search for\n`\"KITNUMBER\" site:familytreedna.com`. Without a kit number, search the earliest known\nancestor's name the same way. For a maternal line, also search each documented daughter's\nname: mtDNA testers seldom appear in surname projects, so a hit usually comes from a\nhaplogroup or geographic project that lists a woman as earliest known ancestor. A public\nproject page shows a kit number and earliest known ancestor only when the member opted in,\nentered an ancestor, and the administrator enabled public display. A hit or a miss reflects\nthose settings and search indexing, not whether a tester exists. Record the project URL,\nretrieval date and displayed row as project-display data. Verify the descent path from the\nlisted ancestor before counting that kit as coverage for the row. (Estes, DNAeXplained,\n2026-10-23)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-27e074d6d71a","kind":"unclassified","anchor":"For each selected mtDNA match, place the reported earliest maternal ancestor beside the\ndirect-maternal pedigree actually inspected, with sources and unresolved links. Keep the\nancestral location distinct from the residence the match displays, and do not guess a\ntester's name or email (Living people, in `SKILL.md`); leave the ancestral country unknown\nwithout maternal-line evidence. Turn missing links or locations into a\nspecific record search or proposed manager question. A separately documented all-maternal\nbranch can help distinguish the maternal hypotheses; the match does not identify a mother.\nThe [Dorcas Johnson](https://dna-explained.com/2022/05/08/dorcas-johnsons-mitochondrial-dna-secret-revealed-52-ancestors-357/)\nand [Sarah Rash](https://dna-explained.com/2022/05/22/sarah-rashs-and-perhaps-mary-warrens-mitochondrial-dna-52-ancestors-359/)\nexamples motivate this documentary worklist, without adding a GD ranking or geographic verdict.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-83c7011ee344","kind":"method","anchor":"An exact Y-111 match is not resolved either. In a 2022 case, two exact Y-111 matches came with FamilyTreeDNA's estimate of a 98% chance of a connection within five generations, yet the Big Y Time Tree put the men's shared ancestor at an average birth year of 1643 (95% range 1462–1775); the author took this to rule out the two pedigree hypotheses resting on those matches (The DNA Geek, 2022-11-10 [N109 @2026-11-12]). FamilyTreeDNA replaced that STR estimate in 2023 because it often placed the common ancestor too recently, and now builds its ranges from Big Y branch ages (FamilyTreeDNA, 2023-02-16 [N110 @2026-11-12]). When both lines have Big Y results, take the range for their shared node on the Time Tree. Otherwise keep an exact Y-111 match unresolved, and recommend Big Y-700 before using it to choose between pedigree hypotheses.","sources":["N109","N110"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-83c6160dc57d","kind":"platform-ui","anchor":"Apply the same bounded negative to mtDNA match lists. FamilyTreeDNA's Coding Region tab lists full-sequence matches within three differences, and its HVR1 and HVR1+HVR2 tabs list exact matches only; a match who took only the older HVR1 test is seen on the HVR1 tab, not on the full-sequence list [N105 @2026-11-12]. Coding Region matches also share your Legacy (PhyloTree) haplogroup (FamilyTreeDNA, 2025-02-25 [N108 @2026-11-12]). When a documented maternal relative or a descendant of the target ancestor is missing, look on the HVR tabs for testers who never upgraded (Estes, DNAeXplained, 2022-05-08 [N92 @2026-11-12]), and read any match found there under the low-resolution rule above. Then look in mtDNA Discover. Haplogroup members four or more differences away are not on the Matches page; comparing the Discover Time Tree, which shows everyone in the haplogroup, with your Match Time Tree, which shows only your matches, finds them (Estes, DNAeXplained, 2025-09-02 [N107 @2026-11-12] and 2025-10-22 [N106 @2026-11-12]). Such a member's country entry is a location lead, not a match.","sources":["N105","N108","N92","N107","N106"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6c665445ac3d","kind":"platform-ui","anchor":"Check for a heteroplasmy before reading a one-position difference, or a haplotype-cluster split, between documented close maternal kin as evidence against the relationship. FamilyTreeDNA reports a heteroplasmy only when more than 20% of the mitochondria tested show the second base, and writes it with a letter other than A, C, G or T [N111 @2026-11-12]. A relative just below that threshold is reported without it, so sisters can differ at that position and fall into different haplotype clusters (Estes, DNAeXplained, 2025-09-02 [N107 @2026-11-12] and 2025-02-25 [N112 @2026-11-12]). If one result shows such a letter at the differing position and the other result's base is one of the bases that letter stands for (R is A or G), the difference is not evidence that the lines differ.","sources":["N111","N107","N112"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c7e94ba35a08","kind":"method","anchor":"When a medieval pedigree says several surnames descend from one ancestor, test it against the SNP branches of the surnames' tested bearers instead of accepting it, or checking only that the surnames fall under the dynasty's haplogroup. Place each surname on the Y tree by its testers' SNPs and on the pedigree, then ask three questions: do the reportedly related surnames cluster on one branch, does the branching order match the pedigree's, and do the branch ages fit the estimated births of the pedigree's common ancestors (Gleeson and DePew, FamilyTreeDNA blog, 2024-06-18 [N114 @2026-11-12])? Surnames from one pre-surname clan should sit on adjacent branches, probably under one overarching SNP (2024-05-24 [N113 @2026-11-12]). Testers of a clan who sit above the dynasty's defining SNP count against the clan's claimed attachment: the O'Malleys of Mayo fall under DF105, two steps above A259 [N114 @2026-11-12]. Rest that inference on several testers of the clan, not one man, and on a dynasty SNP established from its other lines. Two lines that fail to join where the pedigree joins them flag either a genealogical error or a DNA switch on one line, and the tree does not say which; the authors thought the genealogical error possibly more likely [N114 @2026-11-12]. Branch ages carry intervals of centuries, so an age that fits is weak support, and DNA alone does not show that a named ancestor existed [N114 @2026-11-12].","sources":["N114","N113"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-caff6127f93b","kind":"method","anchor":"A surname missing from the expected branch does not make the pedigree false. Its original signature may be absent because the surname died out, no bearer has tested, a DNA switch uncoupled the name from the signature, a family adopted a more powerful lord's surname (surname gravity), the Irish form was lost in 16th–19th-century anglicization, or testers have not made their results public on project pages (Gleeson and DePew, FamilyTreeDNA blog, 2024-05-24 [N113 @2026-11-12]).","sources":["N113"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-055aa591713a","kind":"method","anchor":"**Name the man in whom a SNP arose only by bracketing.** A SNP carried by every tested descendant of a documented ancestor may have arisen in him or anywhere further up his male line (Gleeson and DePew, 2024-06-18 [N114 @2026-11-12]). The University of Strathclyde's criteria place a SNP's origin in a man only when documented male-line descendants of two or more of his sons test positive, which puts it in him at the latest, and a male-line descendant of at least one of his brothers tests negative, which rules out his father [N116 @2026-11-12]. With positives through one son only, the criteria are not met: the SNP may have arisen in that son or in any later man of his line down to the carriers' common ancestor. Estes's Kent-line example sets descendants of one brother, who carry the SNP, against descendants of another brother, who do not (DNAeXplained, 2026-01-03 [N115 @2026-11-12]); before accepting that a SNP arose in the carrier brother himself, check that its carriers descend through two or more of his sons. Count a negative only when it is a measured ancestral call, not a no-call (see the per-SNP table above).","sources":["N114","N116","N115"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c573f6718391","kind":"platform-ui","anchor":"**One FamilyTreeDNA mtDNA page can show labels from two trees.** On the Matches page, the 'mtDNA Haplogroup' column is the PhyloTree Build 17 assignment, now called the Legacy haplotree, and the 'Mitotree Haplogroup' column is the Mitotree one [N117 @2026-11-12] (Estes, DNAeXplained, 2025-04-14 [N118 @2026-11-12]). The results page likewise shows a Legacy badge beside a Mitotree badge marked Beta (2025-09-02 [N107 @2026-11-12]). Record which column or badge each label came from, and compare labels only within one tree: a match's Legacy label set against another tester's Mitotree label is not a conflict. Coding Region matches all share your Legacy haplogroup, yet a match related within a genealogical timeframe can carry a different Mitotree haplogroup, so a different Mitotree label alone does not make a match distant (FamilyTreeDNA, 2025-02-25 [N108 @2026-11-12]).","sources":["N117","N118","N107","N108"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ea5222fa165a","kind":"platform-ui","anchor":"**A Discover flag or country percentage is a tester entry, not an origin finding.** Flags on the mtDNA Time Trees come from testers' Earliest Known Ancestor countries, and a globe instead of a flag marks a tester who gave no location (Estes, FamilyTreeDNA blog, 2025-03-20 [N119 @2026-11-12]; DNAeXplained, 2025-02-25 [N112 @2026-11-12] and 2025-05-08 [N121 @2026-11-12]). The globe is missing data, not evidence about where the line came from. A flag may repeat a family story: in Estes's Radegonde Lambert example, a Native American flag among descendants of a European maternal line probably echoed an old rumour [N121 @2026-11-12]. In the Country Frequency report, 'Haplogroup Frequency' is the share of everyone listing that country as maternal origin who fall in the haplogroup, and the report also counts academic and research samples [N120 @2026-11-12]. A country with few entries can therefore top the table and darken the map with one person: in Estes's example, one of ten testers from Mauritania gave 10% (2025-09-02 [N107 @2026-11-12]). Read the 'Number of Tested Descendants' column beside each percentage before treating a country as an origin.","sources":["N119","N112","N121","N120","N107"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-196d245e24fe","kind":"method","anchor":"**Read an ancient sample's tree placement as a floor.** When Discover or a Time Tree shows an ancient sample on the same Y branch as today's testers, the sample is at least on that branch: recovery may be incomplete and no-calls unreported, so it may carry downstream SNPs the testers lack (Estes, DNAeXplained, 2022-10-04 [N122 @2026-11-12]). Low coverage and post-mortem damage often make ancient placements overconservative or wrong (Martiniano et al., 2022, partially read [N123 @2026-11-12]). Do not infer that the sample shares the tester's downstream branch, or that it has no further SNPs. Ancient mtDNA placements carry the same limit (Estes, DNAeXplained, 2025-05-08 [N121 @2026-11-12]).","sources":["N122","N123","N121"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-99c04121f07a","kind":"platform-ui","anchor":"**Test a Native American direct-maternal claim on the measured label.** Native Americans derive from a few Asian maternal founders within haplogroups A, B, C, D and X, whose American lines split from Asian sister branches (Tamm et al., 2007, partially read [N124 @2026-11-12]; Wikipedia, 'Haplogroup X (mtDNA)' [N125 @2026-11-12]). Take the full-sequence label from Mitotree or Discover and read its path there. A label outside those five haplogroups, such as U6a7a1a for the LeJeune sisters' descendants, contradicts a Native American origin of the direct maternal line, whatever an EKA flag, a match's country entry or a family story says (Estes, DNAeXplained, 2025-09-02 [N107 @2026-11-12]). A label inside them is not proof either: within X the Native American branch is X2a, while X2b is an Old World branch [N125 @2026-11-12]. An Ancient Connection to a Native American sample supports a Native line only when the branch you share with it lies inside a Native founder branch, and the report shows each connection's shared branch and its TMRCA with you [N126 @2026-11-12]. Radegonde Lambert's X2b4g line shares only X2 with Kennewick Man, a basal X2a, and is European (Estes, DNAeXplained, 2025-05-08 [N121 @2026-11-12]; Wikipedia [N125 @2026-11-12]).","sources":["N124","N125","N107","N126","N121"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1145a5b65afe","kind":"platform-ui","anchor":"Before planning a Big Y-700 upgrade of an early Y-DNA kit, confirm that it can run. Early kits can be blocked because the tester has died, cannot be reached or will not reply, or because the last stored vial was used or failed (Estes, DNAeXplained, 2026-01-03 [N115 @2026-11-12]). FamilyTreeDNA says the number of stored samples varies, a sample may already have failed, and customer service can say whether any remain, but it cannot judge a sample's viability before testing [N130 @2026-11-12]. Record such a kit as upgrade-blocked, with the reason, not as not yet upgraded. Then route the row to a brother, son or nephew on the same documented line after checking his descent, or, while the tester is alive, ask for extra swabs and vials to be sent and stored for future upgrades (Estes [N115 @2026-11-12]; FamilyTreeDNA, 2023-08-28 [N129 @2026-11-12]).","sources":["N115","N130","N129"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-61a0b27a7806","kind":"platform-ui","anchor":"To list candidate testers for a line from a GEDCOM, load it into DNA Painter's What Are the Odds? tool, choose the ancestral couple, and import only the Y-DNA-line descendants of the man or only the mtDNA-line descendants of the woman; then scan the chart for living candidates (Perl, DNA Painter blog, 2021-05-28 [N127 @2026-11-12]). The tool still offers 'Just Male/Y-DNA line descendants of' and 'Just mtDNA line descendants of', and its import can replace living people's names with initials [N128 @2026-11-12]. The chart holds only what the GEDCOM holds: verify each descent before proposing a tester, as above.","sources":["N127","N128"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0ea14f385d50","kind":"platform-ui","anchor":"When children credited to one mother may have had different mothers, for example because the father married more than once, recruit a full-sequence tester descended through all females from each daughter; the last tester may be a man (Estes, DNAeXplained, 2024-04-09, partially read [N131 @2026-11-12]). Where possible, confirm each woman's signature with more than one documented descendant, so that one wrong pedigree cannot pass for a different mother. Daughters of one mother carry matching mtDNA, or differ only by a step that arose later in one descendant line, so clearly different lines rule out a shared mother (Estes, 2025-09-02 [N107 @2026-11-12]). Matching lines are only consistent with one mother: two wives who were sisters, or cousins through their own mothers, carry the same mtDNA, so the documents must still separate them (Russell, The Legal Genealogist, 2012-07-08 [N132 @2026-11-12]). To see how far apart two different labels are, use Discover's Compare Haplogroups tool, which shows how long ago the two lines are related (FamilyTreeDNA, 2025-02-25 [N108 @2026-11-12]); in Estes's LeJeune example the lines met about 53,000 years ago, so the women were not full or maternal half-sisters [N107 @2026-11-12].","sources":["N131","N107","N132","N108"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
