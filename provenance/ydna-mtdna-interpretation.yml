claims:
  - {"id":"C-251c81450dea","kind":"portal-availability","anchor":"- **Backbone haplogroup (e.g. R-M269) / a 23andMe or third-party estimate** → resolves **millennia**, not generations: a high-level assignment's MRCA sits **thousands of years back** (R-M269 formed about 6,450 years ago; a 23andMe-level estimate points ~2,000–5,000 years back). Genealogically **inert**: it cannot place a paper-trail-era ancestor, and it is *not* an ethnicity (R1b is common in Europe but not all Europeans are R1b, nor all R1b European). Y and mtDNA haplogroups together capture a *shrinking* slice of ancestry (½ of the grandparents, ¼ of the great-grandparents, ⅛ …), never \"your heritage.\" (Family History Fanatics, 2026-05 [N12 @2026-11-08]; GeneaVlogger, 2026-04 [N3 @2026-11-08]; DNAeXplained, 2026-04 [N11 @2026-11-08])\n- **Y-STR panels — Y-37 and Y-111 today** → give **matches + a genetic distance (GD)**, mapped by the TiP report to a **time range that widens at lower marker counts** [N104 @2026-11-08]. A GD is *stochastic*, not a clock (below). FTDNA stopped selling Y-25 and Y-67 as *new* tests in January 2020 [N96 @2026-11-08]. Its help now says it no longer offers the 12-, 25- or 67-marker levels [N97 @2026-11-08], and its upgrade price list shows no upgrade to Y-67 [N98 @2026-11-08]. Legacy Y-67 kits can still be upgraded [N98 @2026-11-08], and FTDNA's TiP help still shows estimates for every Y-STR matching level from Y-12 to Y-111, Y-67 included [N104 @2026-11-08].\n- **Terminal SNP via Big Y-700** (~23 million Y positions, per DNAeXplained; tests STRs *and* SNPs — SNPs define the branch, and Big Y matches men who carry the same SNPs) → refines the branch, generally into a **genealogical timeframe**; Match Time Tree dates it. It is the test that can separate a recent surname connection from a deep coincidence. (DNAeXplained, 2026-04 [N11 @2026-11-08]; FTDNA, 2026-05 [N6 @2026-11-08]; Rowe-Schurwanz, 2024-08-20 [N26 @2026-11-08])\n- **mtDNA HVR1/HVR2** → a match here has low resolution and tends to point to a more distant maternal ancestor, often **thousands of years back**; on its own it cannot support a recent or geographic conclusion. **Full sequence (all 16,569 positions)** is the refined test — but even a full-sequence match is **still not proof of a genealogical-timeframe or geographic relationship** (where matches live today does not place the shared ancestor [N15 @2026-11-08]; fewer testers [N3 @2026-11-08]). (GeneaVlogger, 2025-09 [N15 @2026-11-08]; DNAeXplained, 2026-04 [N11 @2026-11-08])\n- **STR vs SNP**: SNPs are stable, long-term branch definers; **STRs mutate faster**, and a marker value can step up or down (a 15 becoming a 14 or a 16), so STR closeness is *weaker* evidence than a shared SNP. (Rowe-Schurwanz, 2024-08-20 [N26 @2026-11-08]; FTDNA, 2026-05 [N6 @2026-11-08])\n- **Privacy gate:** <!-- privacy-gate: third-party-tool --> Entering a tester's or relative's STR values into a subclade predictor sends living people's genetic data to an outside tool; answer the privacy gate in `SKILL.md` first.\n- **An STR-based subclade prediction nominates a branch; it does not assign one.** Record the predictor, or the SNP-tested project set whose STR signatures were used, along with the markers, values, tree version and date. Test it against the STRs of a documented same-line relative whose branch was measured by Big Y or sequencing, and compare a second predictor ([predictor comparison](https://genarchivist.net/showthread.php?tid=1806) [N47 @2026-11-08]). A tester who fits no signature stays unresolved ([signature example](https://genarchivist.net/showthread.php?tid=558), partially read [N48 @2026-11-08]); STR instability (see STR vs SNP above) is one reason a signature may mislead. Report the result as predicted until a SNP test confirms it. Agreement at one level does not validate deeper calls, and neither source establishes any tool's accuracy.","sources":["N12","N3","N11","N104","N96","N97","N98","N6","N26","N15","N47","N48"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e8768090b701","kind":"unclassified","anchor":"For an authorized legacy paper result, retain the report and its tester, laboratory, assay\nand panel beside any manual reconstruction. Check each available marker label and value\nagainst that source before using an offered entry/import route; leave unreadable or unmapped\nfields unresolved. Date and attribute the reconstruction: it represents the old assay, not a\nnew test or independent confirmation. The [paper-result recovery example](https://familylocket.com/recreating-a-y-dna-surname-project-at-mitoydna-org/)\ndoes not supply a current import format or a cross-laboratory conversion.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1dfe9035286f","kind":"unclassified","anchor":"For several kits, retain the full STR table and make a separate working view of comparable\nmarker columns with observed differences. Carry kit/locus labels, panel coverage and unresolved\nor multicopy calls; a missing call is not an observed equality or zero allele. Use that view\nto nominate a locus or source discrepancy for checking. The [difference-view example](https://www.yourdnaguide.com/ydgblog/ydna-for-genealogy)\nsupplies the filtering action; the view does not root a tree, count mutation events or identify\na father or MRCA.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-92ec7edf0379","kind":"unclassified","anchor":"Before computing GD across sources, label each STR value's origin and convention. It may be a laboratory panel value (with date), a value extracted from sequencing data, a copied database or certificate entry, or a typical value filled in for a missing marker. Laboratories can number the same marker differently ([cross-database entry discussion](https://forum.molgen.org/index.php/topic,3315.0.html); [laboratory-panel discussion](https://forum.molgen.org/index.php/topic,15097.0.html)). One laboratory announced renumbering that would make earlier certificates disagree with its website ([nomenclature announcement](https://forum.molgen.org/index.php/topic,125.0.html)). Convert a value only where the laboratory or target tool documents the rule, and keep original and converted values side by side. If an extracted value and a panel value disagree, keep both and mark the marker unresolved ([extraction comparison](https://forum.molgen.org/index.php/topic,10934.0.html)). Compare only markers both sides report. For a manual comparison, sort multi-copy values in ascending order without replacing the laboratory's rules ([multi-copy display case](https://genarchivist.net/showthread.php?tid=2477)). A numbering offset, an imputed value or a display-order difference is never a mutation or a GD step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8ad30ff31679","kind":"method","anchor":"Record both dates for each node, with the tree and version: *formed* dates the branch’s split from its parent and *TMRCA* dates the common ancestor of its sampled members [N32], [N35]. Match the node, event and units before comparing a provider’s estimate with a paper [N33], [N34]. If the displayed estimates appear out of order, inspect their intervals and definitions and retain the discrepancy [N36]. The branch’s formation date cannot date the tester’s nearest match or establish where the branch arose.","sources":["N32","N35","N33","N34","N36"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c755e38367b4","kind":"unclassified","anchor":"Do not turn a full-sequence mtDNA GD0 or GD1 into centuries with a mutation rate. The lower bound is zero. The upper bound depends on the youngest branch containing both sequences, judged against all available sequences of that subclade ([common-ancestor discussion](https://forum.molgen.org/index.php/topic,2742.0.html); [full-sequence example](https://forum.molgen.org/index.php/topic,2548.0.html)). Several exact matches in one region on a widespread ancestral type with no private mutations may be independent lines, not one founder line. Record each match's own test level and compared regions beside its label. An HVR-level match shown to a full-sequence tester may never have tested the coding region. A project table of HVR values cannot show that a coding mutation is absent ([match-list discussion](https://forum.molgen.org/index.php/topic,936.0.html)). Count matches separately at each level. A subclade missing among HVR1-only matches tells you nothing ([match-count example](https://genarchivist.net/showthread.php?tid=1141)). The rates and year figures in these threads are forum estimates from one database; do not reuse them, and no frequency threshold is given.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-952eb84a594d","kind":"method","anchor":"If the purchased Y-STR level shows no matches, view the match list at a lower comparison level\nbefore concluding that no paternal-line relatives have tested. Record which level produced each\nmatch. A different-surname match seen only at a lower level remains unresolved as recent or ancient.\nCheck its actual panel coverage and available higher-level results, and compare the documented\nplaces of origin of both surnames as a lead [N30]. Check the paternal pedigrees before assigning a date or relationship.","sources":["N30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-30338c9bf2ba","kind":"method","anchor":"If someone is absent from a match list, record the service, test and shared panel before interpreting the miss. A Big Y branch member may appear in the Block Tree while absent from a match list [N60]. Check whether the other person tested Big Y or only STRs [N61] and which service holds the result [N53], [N62]. A pair can disappear at one STR level and reappear at another [N63]. Read the lab’s thresholds and record the actual GD for each level [N26]. In a public STR database distinguish individual testers, study samples and modal haplotypes before counting hits [N54]. A modal value represents a group summary.","sources":["N60","N61","N53","N62","N63","N26","N54"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c5b81d366c90","kind":"method","anchor":"Keep haplotype cluster, haplogroup, genetic distance and documented maternal descent in separate fields. A cluster can help prioritize matches, and its signature can include fast-mutating or personal markers [N50], [N118]. In one account, two testers reportedly sharing an early-1800s maternal ancestor lay on opposite sides of a cluster despite GD0 [N49]. Check out-of-cluster matches against the documented line as well.","sources":["N50","N118","N49"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-72d947046980","kind":"method","anchor":"- **Check who actually Y-tested.** In one account the researcher had autosomal matches to Goldberg cousins but no Y result from those cousins [N7]. An untested direct-paternal line gives no Y comparison. A private variant may acquire a named branch when another tester shares it [N11].\n- **Check the call and the tree version.** A sequencing or read-interpretation error, or a newly defined downstream branch, can produce different reported labels [N24].\n- **Check how the surname passed.** Test alternatives such as maternal transmission of the surname, a stepfamily, two men with the same name, or a shared paternal ancestor who lived before hereditary surnames. A reported Woodall project found discordant paternal lines among presumed relatives without resolving where or how the pedigrees diverged [N18].\n- **Privacy gate:** <!-- privacy-gate: contact --> Asking another son of the same father, or other documented male-line relatives, to take a Y-DNA test approaches living people about a paternity question; answer the privacy gate in `SKILL.md` before contacting them.\n- **A laboratory sample mix-up, or a documented name change.** Before reading a surprising Y result as an event, consider a replicate on a separate kit or a test of another son of the same father ([N64]). Record both kits and their results. Agreement shows only that the result reproduces for that sample source. Disagreement between two kits from the same man points to sample handling; between brothers it leaves both handling and paternity open. Also search for a record that would explain a surname change, such as a child registered under a stepfather's surname after the mother remarried, or a clerical misentry that was later kept ([N65]). Keep legitimacy and biological paternity in separate fields. A man named in a baptism, or a husband who married the mother shortly before a birth, is a documentary attribution, not genetic confirmation. The rates quoted in the surname-change thread are not used, and neither thread shows which pathway applies to a given line.\n- **A break in the matches' line, not yours.** When many Y matches share a different surname, the event may sit in their common ancestor: a misattributed or unknown parentage there put that surname on a paternal line shared with yours. To locate a break, target-test documented male-line relatives who descend from your proposed paternal ancestors at different generational depths; the pattern of matches brackets the generation or points to another explanation. A non-match with one cousin leaves the break on either man's path below their shared ancestor, so test another descendant of that ancestor before assigning it to your line. [N86]","sources":["N7","N11","N24","N18","N64","N65","N86"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-704cb7b41cf8","kind":"unclassified","anchor":"**Weigh each call before it places, excludes or links.** Some markers listed as a branch's equivalents also read derived outside it, so require a reliable equivalent or a downstream variant. An ancestral read at a false-negative-prone SNP is a weak exclusion. Ancestral calls at sibling subclades leave the last one likely, not proven ([equivalent caution](https://genarchivist.net/showthread.php?tid=1590); [sibling-elimination discussion](https://genarchivist.net/showthread.php?tid=86)). For each negative used to split a block or set a basal node, record its read count and quality, and inspect the reads ([read list](https://genarchivist.net/showthread.php?tid=1497); [low-quality negative](https://forum.molgen.org/index.php/topic,10534.0.html)). Convert coordinates to each file's build before reading a state, and resolve SNP names by position ([build example](https://genarchivist.net/showthread.php?tid=2491); [naming exchange](https://genarchivist.net/showthread.php?tid=318); [position comparison](https://genarchivist.net/showthread.php?tid=275)). A variant shared with an incompatible haplogroup, or any single shared mutation, may be a recurrence, not a link ([shared-mutation explanation](https://genarchivist.net/showthread.php?tid=1161); [incompatible-haplogroup recurrence](https://forum.molgen.org/index.php/topic,10534.0.html)). Take unreliable markers from the tree, not from memory. No source gives a read-count threshold; the mapping-quality ≥30 filter in the build example is one replier's choice, not a standard.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5d7cd46fe7d7","kind":"method","anchor":"Before closing a candidate Y-DNA branch because an obituary names no surviving son, compare\nthe notice with the documented child roster. Check whether a son who died earlier left sons,\nand trace the relevant male-line descendants with evidence for each parent-child link. For a\nliving descendant, record only name, parents and place in the family; do not look up current\ncontact details, and stage any contact through\n[DNA match outreach staging](dna-match-outreach-staging.md). A predeceased son could leave a continuing male line even when the obituary lists no surviving son [N85]. Keep branches without documentary follow-up unresolved.","sources":["N85"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7637de8c0682","kind":"method","anchor":"- **Verify a proposed haplogroup.** Confirm it in the tester’s report and the dated tree before using it to identify or date a shared branch [N16].\n- **Date surname adoption locally.** Compare the estimated paternal ancestor’s interval with historical records of surname use in that place. A hereditary surname may have been adopted after the paternal lines separated, as surname use varied by place [N4]. In the Netherlands, the 1811 decree required people who lacked a family name to adopt and register one. Check the local registers of surname adoption for the family [N148].\n- **Check what an autosomal chip actually measured.** Its Y or mtDNA calls may support only an upstream branch. Compare the chip’s covered positions with a dedicated test before interpreting a difference in resolution [N15], [N23].\n- **A chip-derived Y terminal shows where the chip's SNPs stop.** Record the vendor and chip version, or mark it inferred or unknown. Sort each downstream branch marker into tested-negative or absent from that version, searching equivalent names too. Only a tested-negative excludes a subclade. A SNP discovered after the chip was designed will not be on it under that name, though an equivalent at a probed position may still be callable ([N73]; [N71]; [N74]). Look up the raw call for each assigning SNP, and check any assigning SNP that recurs on another branch. A positive that conflicts with a positive on a sibling branch is a probable bad probe ([N76]). Two predictions from one file conflict only if neither is upstream of the other ([N77]). A second classifier on the same file checks consistency, not correctness ([N75]). Never fill in a subclade from an AI guess; a downstream share among upgraded testers is a population estimate, not this tester's result. The community SNP lists remain unverified.\n- **Date the tree and inspect its coverage.** New testers can change branch assignments, age estimates and the inferred geography of sparsely represented paternal lines. Record the tree, date and sample behind a migration map [N11].\n- **A label string is not a clade.** Keep each haplogroup label with the tree or tool that assigned it, its version or date, its input, and the point where assignment stopped. Do not silently replace a vendor label with a deeper third-party one ([N40]; [N41]). Long-form and longhand names are renumbered between releases. A proposed name can also coincide with a vendor name for a different clade. So compare defining variants, and anchor on the source's SNP-named label ([N37]; [N38]; [N39]). Keep a generated or unsourced name-to-SNP mapping unresolved. A shallower label in a second database may only mean it lacks another carrier of the downstream variant. Check the first provider's SNP results before calling it a conflict, and do not promise an update ([N42]). None of these sources validates an assignment.\n- **Branch flags, country counts and frequency maps are tester tallies.** Run these checks before reading them as origin or frequency. Count documented close kin, such as a father and son or brothers, once, and record the relationship evidence ([N43]). Assume the same sequence may appear in several public trees. Keep entries of unknown provenance flagged, so a combined count is an upper bound ([N44]). Note which communities test heavily, and compare at subclade level ([N45]). Many testers stopped at an upstream SNP, so downstream shares rest partly on unresolved kits ([N46]). State a count as observed in that database on that date. Do not correct it yourself or swap in an unsourced published frequency. No source measures the bias.\n- **A branch's size is not its age or founder status.** Do not read a large branch, or a lineage's large share of one community's Y results, as evidence that the lineage entered that community early or is old. Size depends on how many male-line descendants survived and how many of them have tested; a thin sibling branch may be under-sampled, not extinct. Take a branch's age from the tree's dated estimate, labelled as a formed age or a TMRCA (see the formed-versus-TMRCA rule above) [N89].\n- **Origins reported by matches are a location lead, not an origin finding.** For a\n  paternal-origin question (England vs Ireland, England vs Germany), tabulate the earliest known\n  ancestor and place reported by each Y match or nearby Block Tree non-match. Label each entry as\n  self-reported and note its test level and branch. A pattern can show the question is worth\n  asking, but it does not answer it, verify those trees, or date a migration. The pattern depends\n  on who has tested. Use the place pattern to select candidate records and verify the reported origins on the direct paternal lines [N30], [N31].\n- **A notable-connection report is a haplogroup comparison, not a pedigree.** Before any documentary search for a link to a famous person, read the report's estimate of when the shared direct-line ancestor lived; most such ancestors lived thousands of years ago. Attempt documentary proof only when that ancestor falls inside the region's paper-trail era, because proof needs a record for every generation on both direct lines and DNA does not supply them. Record how the notable's haplogroup was obtained: tested directly, deduced from tested descendants, or inferred from living collateral relatives (more common than descendant testing). Any label not tested directly also rests on the documented kinship between those testers and the notable. [N87]\n- **A match to a named lineage's project tests descent, not group membership.** When a same-surname tester compares with a chiefly family's Y-DNA project, such as a Scottish clan chief's line, a match is a clue that the tester descends from that family's male line. Before calling it a match to that family, apply the resolution and surname-cluster rules above, and compare the estimated common ancestor's date with when that surname was adopted in the region (see the surname-timing pitfall above). Do not report a match as membership in the clan or other group that bore the name, and do not read a mismatch as excluding that membership. Membership is a separate documentary question for the records of the specific ancestors. [N88]\n- **mtDNA is a weak genealogical instrument by design** — slow mutation, fewer testers, wide match ranges. Great for *eliminating* a direct-maternal-line hypothesis, poor for *pinning* a relationship.\n- **An mtDNA label is only as deep as the positions behind it.** Record the tool, the tree build and the regions sequenced. For each candidate, record the matched, extra and untested or no-call defining positions. HVR-only data support at most the shared parent of tied sibling subclades, so keep a deeper label provisional until coding-region calls support it ([N78]; [N79]; [N57]; [N54]; [N80]). Check the base each mutation requires against the observed base, reading '!' by the tree's convention ([N81]). Read a label's parent from the tree path, not from its letters, and after an update check whether the branch was renamed or actually moved ([N49]). When labels or providers disagree, tabulate each node's defining mutations and their stability instead of adopting either label ([N82]; [N41]). None of these sources measures accuracy. Route the current label to Mitotree.","sources":["N16","N4","N148","N15","N23","N73","N71","N74","N76","N77","N75","N11","N40","N41","N37","N38","N39","N42","N43","N44","N45","N46","N89","N30","N31","N87","N88","N78","N79","N57","N54","N80","N81","N49","N82"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-64df8ae7c40b","kind":"unclassified","anchor":"For a supplied ancient-sample catalogue, retain its source and date/version alongside the\ntester's externally reported haplogroup and assay/test level. Search the exact supplied\nlabel and record the query and returned specimen IDs. If a downstream Y label is absent,\nuse an actually supplied or inspected tree to record each upstream label tried; do not\ninvent the hierarchy. An unavailable tree or unknown test resolution stays unresolved.\nThe [dated British Isles catalogue example](https://dna-explained.com/2022/02/01/dna-from-459-ancient-british-isles-burials-reveals-relationships-does-yours-match/)\nsupplies this search step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8f8b838e594b","kind":"unclassified","anchor":"Keep separate Y-DNA and mtDNA lineage rows. For each documented line, record its nearest\nrepresented person, ordered upstream ancestors, sources and unresolved links, then attach\nthe existing tester and actual test type/level. Several ancestors in the same line need\nnot become separate testing targets. Keep a tree-page navigation bookmark in its own\nfield: the person used to open the next pedigree page may belong to a different lineage.\nThe [lineage worksheet example](https://dna-explained.com/2025/02/23/lineages-versus-ancestors-how-to-find-and-leverage-yours/)\nsupplies this organizational step.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-966ffefb716c","kind":"unclassified","anchor":"Before recruiting a new tester, search for results already published. Where a WikiTree DNA\nTests entry or another source gives a FamilyTreeDNA kit number, run a web search for\n`\"KITNUMBER\" site:familytreedna.com`. Without a kit number, search the earliest known\nancestor's name the same way. For a maternal line, also search each documented daughter's\nname: mtDNA testers seldom appear in surname projects, so a hit usually comes from a\nhaplogroup or geographic project that lists a woman as earliest known ancestor. A public\nproject page shows a kit number and earliest known ancestor only when the member opted in,\nentered an ancestor, and the administrator enabled public display. A hit or a miss reflects\nthose settings and search indexing, not whether a tester exists. Record the project URL,\nretrieval date and displayed row as project-display data. Verify the descent path from the\nlisted ancestor before counting that kit as coverage for the row. (Estes, DNAeXplained,\n2026-10-23)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-27e074d6d71a","kind":"method","anchor":"For each selected mtDNA match, place the reported earliest maternal ancestor beside the\ndirect-maternal pedigree actually inspected, with sources and unresolved links. Keep the\nancestral location distinct from the residence the match displays, and do not guess a\ntester's name or email (Living people, in `SKILL.md`); leave the ancestral country unknown\nwithout maternal-line evidence. Turn missing links or locations into a\nspecific record search or proposed manager question. A separately documented all-maternal\nbranch can help distinguish the maternal hypotheses; the match does not identify a mother.\nCheck the match’s reported earliest maternal ancestor against the tree and the records for each link. Extend the worklist through separately documented daughters when that could distinguish the proposed mothers [N92], [N21].","sources":["N92","N21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-83c7011ee344","kind":"platform-ui","anchor":"An exact Y-111 match is not resolved either. In a 2022 case, two exact Y-111 matches came with FamilyTreeDNA's estimate of a 98% chance of a connection within five generations, yet the Big Y Time Tree put the men's shared ancestor at an average birth year of 1643 (95% range 1462–1775); the author took this to rule out the two pedigree hypotheses resting on those matches (The DNA Geek, 2022-11-10 [N109 @2026-11-12]). FamilyTreeDNA replaced that STR estimate in 2023 because it often placed the common ancestor too recently, and now builds its ranges from Big Y branch ages (FamilyTreeDNA, 2023-02-16 [N110 @2026-11-12]). When both lines have Big Y results, take the range for their shared node on the Time Tree. Otherwise keep an exact Y-111 match unresolved, and recommend Big Y-700 before using it to choose between pedigree hypotheses.","sources":["N109","N110"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-83c6160dc57d","kind":"platform-ui","anchor":"Apply the same bounded negative to mtDNA match lists. FamilyTreeDNA's Coding Region tab lists full-sequence matches within three differences, and its HVR1 and HVR1+HVR2 tabs list exact matches only; a match who took only the older HVR1 test is seen on the HVR1 tab, not on the full-sequence list [N105 @2026-11-12]. Coding Region matches also share your Legacy (PhyloTree) haplogroup (FamilyTreeDNA, 2025-02-25 [N108 @2026-11-12]). When a documented maternal relative or a descendant of the target ancestor is missing, look on the HVR tabs for testers who never upgraded (Estes, DNAeXplained, 2022-05-08 [N92 @2026-11-12]), and read any match found there under the low-resolution rule above. Then look in mtDNA Discover. Haplogroup members four or more differences away are not on the Matches page; comparing the Discover Time Tree, which shows everyone in the haplogroup, with your Match Time Tree, which shows only your matches, finds them (Estes, DNAeXplained, 2025-09-02 [N107 @2026-11-12] and 2025-10-22 [N106 @2026-11-12]). Such a member's country entry is a location lead, not a match.","sources":["N105","N108","N92","N107","N106"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6c665445ac3d","kind":"platform-ui","anchor":"Check for a heteroplasmy before reading a one-position difference, or a haplotype-cluster split, between documented close maternal kin as evidence against the relationship. FamilyTreeDNA reports a heteroplasmy only when more than 20% of the mitochondria tested show the second base, and writes it with a letter other than A, C, G or T [N111 @2026-11-12]. A relative just below that threshold is reported without it, so sisters can differ at that position and fall into different haplotype clusters (Estes, DNAeXplained, 2025-09-02 [N107 @2026-11-12] and 2025-02-25 [N112 @2026-11-12]). If one result shows such a letter at the differing position and the other result's base is one of the bases that letter stands for (R is A or G), the difference is not evidence that the lines differ.","sources":["N111","N107","N112"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c7e94ba35a08","kind":"method","anchor":"When a medieval pedigree joins several surnames to one paternal ancestor, compare testers on documented branches of each family. Check whether their measured SNPs place them under the proposed dynasty SNP and whether their branching order and date intervals fit the pedigree [N113 @2026-11-12], [N114 @2026-11-12]. In the published Mayo O’Malley comparison the testers were placed under DF105, upstream of the proposed A259 dynasty branch [N114 @2026-11-12]. A broad shared label cannot establish the narrower attachment. Check the calls and test coverage, including whether A259 was actually tested, before excluding it. A discordance can flag a pedigree error or a break on either line. Compatible dates alone cannot identify a named historical ancestor.","sources":["N113","N114"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-caff6127f93b","kind":"method","anchor":"A surname missing from the expected branch does not make the pedigree false. Its original signature may be absent because the surname died out, no bearer has tested, a DNA switch uncoupled the name from the signature, a family adopted a more powerful lord's surname (surname gravity), the Irish form was lost in 16th–19th-century anglicization, or testers have not made their results public on project pages (Gleeson and DePew, FamilyTreeDNA blog, 2024-05-24 [N113 @2026-11-12]).","sources":["N113"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-055aa591713a","kind":"method","anchor":"**Bracket a SNP before naming the man in whom it arose.** Positive descendants of one man can share a variant inherited from further up his line [N114 @2026-11-12]. The University of Strathclyde’s criteria require positive descendants through at least two of his sons and a measured negative through at least one brother [N116 @2026-11-12]. Compare the pedigrees and that SNP’s actual calls. One positive brother’s branch and one negative brother’s branch can narrow the search [N115 @2026-11-12], but carriers all descending through one son leave later generations possible. A no-call supplies no negative evidence.","sources":["N114","N116","N115"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c573f6718391","kind":"platform-ui","anchor":"**One FamilyTreeDNA mtDNA page can show labels from two trees.** On the Matches page, the 'mtDNA Haplogroup' column is the PhyloTree Build 17 assignment, now called the Legacy haplotree, and the 'Mitotree Haplogroup' column is the Mitotree one [N117 @2026-11-12] (Estes, DNAeXplained, 2025-04-14 [N118 @2026-11-12]). The results page likewise shows a Legacy badge beside a Mitotree badge marked Beta (2025-09-02 [N107 @2026-11-12]). Record which column or badge each label came from, and compare labels only within one tree: a match's Legacy label set against another tester's Mitotree label is not a conflict. Coding Region matches all share your Legacy haplogroup, yet a match related within a genealogical timeframe can carry a different Mitotree haplogroup, so a different Mitotree label alone does not make a match distant (FamilyTreeDNA, 2025-02-25 [N108 @2026-11-12]).","sources":["N117","N118","N107","N108"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ea5222fa165a","kind":"platform-ui","anchor":"**Read the denominator beside a Discover country flag or percentage.** A tester’s flag reflects the reported maternal ancestor’s country. A globe marks missing location information [N119 @2026-11-12], [N112 @2026-11-12]. Check the entry against the documented maternal pedigree because it may repeat a family story [N121 @2026-11-12]. Country Frequency also includes academic and research samples [N120 @2026-11-12]. In the published Mauritania example, one entry out of ten gave 10% [N107 @2026-11-12]. Record the counts, the denominator and the report date before interpreting a dark patch on the map.","sources":["N119","N112","N121","N120","N107"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-196d245e24fe","kind":"method","anchor":"**Read an ancient sample's tree placement as a floor.** When Discover or a Time Tree shows an ancient sample on the same Y branch as today's testers, the sample is at least on that branch: recovery may be incomplete and no-calls unreported, so it may carry downstream SNPs the testers lack (Estes, DNAeXplained, 2022-10-04 [N122 @2026-11-12]). Low coverage and post-mortem damage often make ancient placements overconservative or wrong (Martiniano et al., 2022, partially read [N123 @2026-11-12]). Do not infer that the sample shares the tester's downstream branch, or that it has no further SNPs. Ancient mtDNA placements carry the same limit (Estes, DNAeXplained, 2025-05-08 [N121 @2026-11-12]).","sources":["N122","N123","N121"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-99c04121f07a","kind":"platform-ui","anchor":"**Check a proposed Indigenous American direct-maternal connection at the measured subclade.** Relevant founder branches occur within A, B, C, D and X, which also contain lineages elsewhere (Tamm et al., partially read [N124 @2026-11-12]; [N125 @2026-11-12]). Compare the full-sequence path with the specific founder branch [N107 @2026-11-12]. The Ancient Connections report identifies the shared node and its estimated age [N126 @2026-11-12]. In the published comparison, Radegonde Lambert’s inferred X2b4g and Kennewick Man’s X2a share the older X2 node [N121 @2026-11-12]. Limit the inference to the tested maternal line.","sources":["N124","N125","N107","N126","N121"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1145a5b65afe","kind":"platform-ui","anchor":"Before planning a Big Y-700 upgrade of an early Y-DNA kit, confirm that it can run. Early kits can be blocked because the tester has died, cannot be reached or will not reply, or because the last stored vial was used or failed (Estes, DNAeXplained, 2026-01-03 [N115 @2026-11-12]). FamilyTreeDNA says the number of stored samples varies, a sample may already have failed, and customer service can say whether any remain, but it cannot judge a sample's viability before testing [N130 @2026-11-12]. Record such a kit as upgrade-blocked, with the reason, not as not yet upgraded. Then route the row to a brother, son or nephew on the same documented line after checking his descent, or, while the tester is alive, ask for extra swabs and vials to be sent and stored for future upgrades (Estes [N115 @2026-11-12]; FamilyTreeDNA, 2023-08-28 [N129 @2026-11-12]).","sources":["N115","N130","N129"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-61a0b27a7806","kind":"platform-ui","anchor":"To list candidate testers for a line from a GEDCOM, load it into DNA Painter's What Are the Odds? tool, choose the ancestral couple, and import only the Y-DNA-line descendants of the man or only the mtDNA-line descendants of the woman; then scan the chart for living candidates (Perl, DNA Painter blog, 2021-05-28 [N127 @2026-11-12]). The tool still offers 'Just Male/Y-DNA line descendants of' and 'Just mtDNA line descendants of', and its import can replace living people's names with initials [N128 @2026-11-12]. The chart holds only what the GEDCOM holds: verify each descent before proposing a tester, as above.","sources":["N127","N128"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0ea14f385d50","kind":"platform-ui","anchor":"When children credited to one mother may have had different mothers, for example because the father married more than once, recruit a full-sequence tester descended through all females from each daughter; the last tester may be a man (Estes, DNAeXplained, 2024-04-09, partially read [N131 @2026-11-12]). Where possible, confirm each woman's signature with more than one documented descendant, so that one wrong pedigree cannot pass for a different mother. Small differences can arise in descendant lines. Widely separated, well-supported haplogroups in independently documented daughter lines argue against a shared mother (Estes, 2025-09-02 [N107 @2026-11-12]). Matching lines are only consistent with one mother: two wives who were sisters, or cousins through their own mothers, carry the same mtDNA, so the documents must still separate them (Russell, The Legal Genealogist, 2012-07-08 [N132 @2026-11-12]). To see how far apart two different labels are, use Discover's Compare Haplogroups tool, which shows how long ago the two lines are related (FamilyTreeDNA, 2025-02-25 [N108 @2026-11-12]). Verify the underlying assignments and pedigrees before excluding a proposed mother.","sources":["N131","N107","N132","N108"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-8a8e99f3b78d","kind":"method","anchor":"**When no Y match carries the expected surname, check the comparison group and the autosomal evidence.** For an uncommon surname, recruit a man of that surname whose family comes from your subject's county if no documented relative is available [N133 @2026-11-14]. Two local families may be unrelated. A mismatch with that man leaves the relationship open until records connect his branch to the expected family. Prefer a tester from a second documented branch of the subject’s own paternal line [N135 @2026-11-14]. Next group the subject’s autosomal matches and investigate unexplained clusters using the [WATO workflow](unknown-parentage-wato.md) [N134 @2026-11-14]. Autosomal evidence becomes less informative for a break further back. Compare the Y results with records at each proposed generation [N136 @2026-11-14].","sources":["N133","N135","N134","N136"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4b4500d03e36","kind":"platform-ui","anchor":"A Big Y-700 tester already has the Y-111 panel. FamilyTreeDNA's Big Y-700 includes the 111 STRs of the Y-111 test and provides the STR matches, plus at least 589 more STRs (FamilyTreeDNA Help Center, edited 2024-05-21 [N138 @2026-11-14]). Its product page lists Big Y-700 as including everything in Y-37 and Y-111 [N139 @2026-11-14], and a 2024 introduction calls it two tests in one (My Family Pattern [N137 @2026-11-14]). Do not advise a Big Y-700 tester to order Y-37 or Y-111, and do not look for his Y-111 matches anywhere but his own STR match list.","sources":["N138","N139","N137"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0c3af700c6c6","kind":"method","anchor":"**Use local same-surname men to build a tester worklist.** If an ancestor’s parents are unknown, identify the men of his surname in the same locality and census, and recruit a documented, unbroken male-line descendant of each for a Y-37 test [N133 @2026-11-14]. Compare results across the branches. Higher-resolution testing is informative when the other relevant lines also test [N140 @2026-11-14]. Use shared SNPs to narrow the documented lines to investigate. A close Y-37 distance alone cannot place the common ancestor.","sources":["N133","N140"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d9589cf734ae","kind":"method","anchor":"**Use Y evidence to select a generation for an unplaced autosomal cluster.** When the proposed link follows the direct paternal line, recruit male-line descendants of the cluster's ancestor and of documented branches of your own line for Big Y-700. Shared variants can define a new branch, and the service estimates the common ancestor’s date for the testers on it [N142 @2026-11-14]. A worked project’s estimated dates shifted as branches were added [N141 @2026-11-14]. Record the dated node and interval after each addition. Use the interval to choose records to inspect and identify the proposed man through documentary evidence.","sources":["N142","N141"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-278e78079438","kind":"method","anchor":"**Check which branch the Genghis Khan claim refers to.** The MyHeritage blog suggests comparing branches within C-M217 [N143 @2026-11-18]. Compare the tester's deepest measured SNPs with the specific branch cited for the claimed descent. The C2*-Star Cluster (C-F3796) is downstream of C-M217, and its estimated common ancestor predates Genghis Khan (Wei et al., 2018 [N144 @2026-11-18]). Use regional distributions to describe the sampled branches. Leave the named ancestor unresolved even if the comparison reaches the Star Cluster or the branch sampled in Golden Horde burials. Require independent evidence tying the reference branch to Genghis Khan before using it to evaluate a pedigree to him (Hawks, 2026 [N145 @2026-11-18]).","sources":["N143","N144","N145"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0775deb976ce","kind":"method","anchor":"Check an AI-supplied haplogroup against the tester’s actual report and an ancient comparison against the study that sequenced the sample. A chatbot reportedly assigned both a tester and Anzick-1 to A2ex [N16]; the original Anzick-1 study identified his mtDNA as D4h3a [N146].","sources":["N16","N146"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-487c0b9882e2","kind":"method","anchor":"For Y-STRs, use the TiP report for the shared panel and genetic distance [N104]. For Big Y results, consult the Match Time Tree [N4]. Record the range, its confidence level and any separately labelled central estimate. In one TiP demonstration the range was 1500–1850 and the documented ancestor was born in 1798 [N4]. The report cannot supply an exact birth year.","sources":["N104","N4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7b9ffa27b136","kind":"method","anchor":"**Investigate a disagreement with the pedigree.** FamilyTreeDNA’s original 95% interval missed John Stewart’s documented birth year, and the estimate changed when the model was revised [N29]. Check the model version, branch-specific rate and sequence coverage before inferring a pedigree error. A fixed number of years per SNP cannot reproduce this estimate.","sources":["N29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7756cf02c2bc","kind":"method","anchor":"An exact Y-37 or HVR1/HVR2 match establishes agreement only over the markers compared. Check the common higher-resolution test and its reporting threshold before calling the relationship recent [N14], [N26]. In a Schultz surname project, reported Y-37 matches disappeared at Y-67 and Y-111 [N9]. That change describes what the panels could distinguish.","sources":["N14","N26","N9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-544d66f28604","kind":"method","anchor":"- **Trust:** Keep the relationship unresolved at low resolution. Compare full mitochondrial sequences when available and document each direct-maternal pedigree. A match distribution spanning Romania and Hungary cannot locate the common maternal ancestor [N15].\n- **Never:** \"you match exactly, so you're closely related,\" or an mtDNA HVR/region match as evidence of a specific place or recent maternal ancestor.","sources":["N15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-310a3fc05db2","kind":"method","anchor":"Inspect which positions contribute to genetic distance before prioritizing a maternal match. A GD1 or GD2 match with differences at unstable positions can merit follow-up alongside a GD0 match [N21]. GD0 means agreement at the positions counted under the laboratory’s rules. A difference at an excluded insertion such as 309 or 315 can therefore coexist with GD0. Compare the pedigrees and positions before ranking the relationships.","sources":["N21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2bf1ecca2cde","kind":"method","anchor":"1. **Trace the path between the reported assignments.** Record the test type, results, tree and date. One relative’s broad assignment can contain the other’s downstream branch [N23]. A father and son can have different terminal labels even after the same test if the son carries a newly arisen variant found in his descendants [N22]. Inspect the connected branches and calls before treating the labels as a conflict.\n2. **Build a per-SNP table before excluding a branch.** For each informative variant, retain the report's positive, negative, no-call or untested state and distinguish **measured** from **presumed from the tree**. A tree-inferred negative is not an independent measurement confirming that placement. An omitted row is initially unknown: FamilyTreeDNA's documented haplotree view can omit downstream Big Y negatives that are available in the detailed results. Inspect those results before treating the omission as untested or negative. No-call means no resolved result, not an ancestral allele. Preserve coverage/quality information and reconcile variant identifiers and coordinates before comparing. (Rowe-Schurwanz, 2024-07-02; 2024-09-05)\n3. **State the remaining conflict at the right level.** Compatible placements do not by themselves establish the specific relationship; reliable incompatible lineage-defining calls require sample, calling and pedigree checks. A single newly acquired downstream variant is not equivalent to belonging to an incompatible paternal lineage. Route a disputed call for qualified review or suitable confirmation; do not turn a display discrepancy into a localized NPE. (Estes, 2024-05-02; comparison synthesis)","sources":["N23","N22"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ce03c9014822","kind":"method","anchor":"Kennewick Man’s sequenced mitochondrial genome lies at the root of X2a [N147]. A match at the older X2 node cannot establish descent from an X2a founder.","sources":["N147"],"checked":null,"stated_as":"observation","review":"reviewed"}
