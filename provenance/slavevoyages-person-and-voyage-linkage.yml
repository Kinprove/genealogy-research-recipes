claims:
  - {"id":"C-30e853e327b2","kind":"portal-availability","anchor":"Use African Origins for named people in records of the Atlantic trade, especially records created when authorities intercepted voyages. Use Oceans of Kinfolk for named people in the records of the U.S. coastwise trade, particularly New Orleans arrivals. Search the people dataset with the strongest known combination of name, approximate date, vessel or port. A voyage search and a search for named people cover different evidence. [S1 @2026-11-21] [S2 @2026-11-21] [S3 @2026-11-21] [S4 @2026-11-21]","sources":["S1","S2","S3","S4"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-417b6f190f20","kind":"method","anchor":"A name or route match identifies a candidate. Require a record linkage before identifying the person. Keep the person identifier and voyage identifier with the reported name, ship, ports and dates. Trace the database’s source citation to the underlying record and compare independently recorded associations, places and dates. A miss is bounded by the dataset and records it represents. [S1] [S2] [S3] [S4]","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
