claims:
  - {"id":"C-8cf665ac9412","kind":"method","anchor":"Date parole, exchange and return to duty separately. According to the presenter in the available excerpt, build a camp-by-camp timeline [S1†]. Record the date assigned to each event, and carry the next named place or authority into the next search.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-710417618e4b","kind":"method","anchor":"For a case governed by the Dix–Hill Cartel of 22 July 1862, start with War Department General Orders No. 142 of 25 September 1862 and the cartel itself. Read parole as release under a pledge restricting military duty, including police and guard work. Look for a separate exchange and confirmed return to duty. Under the cartel, the prisoner's equivalent had to reach its own lines before the parole was discharged. Use ten days from capture as the prescribed exchange-or-parole interval where transfer was practicable. Use the prisoner’s dated records to establish what happened. [S2] [S14]","sources":["S2","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e43143e9f501","kind":"method","anchor":"Use the cartel's scale by the rank actually held in service. Compare an army commanding general or admiral with 60 privates or common seamen, and a colonel or naval captain with 15. Read the listed junior ranks individually before using four as the equivalent. Apply Article 6 to exchanges across services, with privateers placed on the naval scale in Article 1. If civilians held for alleged disloyalty or a civil offense were exchanged, look for a civilian counterpart. For sutlers, teamsters and other civilian employees, look for exchange with a person in a similar position. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-761b773d4b4a","kind":"method","anchor":"For episodes governed by General Orders No. 100 of 1863, check Articles 105–110 for the authority and terms. Compare the prisoner's stated rank with dated muster evidence if the ranks differ. The code required truthful disclosure and expressly addressed incentives for understating or overstating rank. If a release lists money or supplies under Article 108, check for the applicable agreement and the field commander's authorization for an urgent supply exchange. Use the prisoner count and officer list as preliminary records under Article 110, then look for evidence of the actual exchange. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bd0b2271aa19","kind":"portal-availability","anchor":"Start in RG 109 with M598 for Confederate prisoners in Union hands. Try Ancestry or FamilySearch for a name hit. If the hit is absent or sparse, browse the named prison or station and read its volume headings. M598 has no comprehensive name index. Match the general ledger's arrival, capture and disposition with the auxiliary registers of confinement, transfers and deaths. For a station covered by RG 249 section 249.6, check its surviving morning reports or correspondence as a separate search. [S4 @2026-11-22] [S5 @2026-11-22] [S6 @2026-11-22] [S8 @2026-11-22] [S9 @2026-11-22]","sources":["S4","S5","S6","S8","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-782ca9bce892","kind":"method","anchor":"At Point Lookout, use M598 rolls 111–129. Follow transfers to or from Hammond General Hospital in roll 121, then check disposition and death records for a separately reported outcome or cause. Check rolls 123–125 for exchange, parole, oath, public-works release and United States enlistment records. Read the type of disposition from its own register. Check rolls 125–129 for money, valuables and property, including the indexed accounts ledger on roll 128. In roll 127, distinguish letters and parcels received at the prison from those delivered to the prisoner. [S5] [S10]","sources":["S5","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-96d9f3b15652","kind":"method","anchor":"At Rock Island, browse the prison's M598 rolls 131–135 for the correspondence and cash registers. Compare the date the prison received a letter or remittance with the prisoner's release, transfer or death date. Require a delivery entry or other evidence to attribute receipt to the prisoner. [S5] [S10]","sources":["S5","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5dd454683ca2","kind":"method","anchor":"For a death in Federal imprisonment or a Northern military hospital, search M918 by place of death and then surname. Record any grave number and location. For a Confederate parole in North Carolina, use M1781, seven rolls in order by town of parole, and choose the roll from the publication guide. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0838f31bbb49","kind":"portal-availability","anchor":"Search RG 249 for Federal prisoner registers, including escapes, deaths, exchange and names of Federal prisoners who enlisted in the Confederate Army. Start with M1303 for Andersonville. If a soldier reported after parole, search arrival and departure records for the relevant camp. Check Benton Barracks in the West and the separate Camp Parole and College Green Barracks series for Annapolis. For installation-level arrivals, departures and orders, check the camp by name in RG 393, especially section 393.13. [S6 @2026-11-22] [S7 @2026-11-22]","sources":["S6","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-56a77a514ad4","kind":"method","anchor":"For a Sultana passenger, check the dead and survivor lists in RG 249 entry 98 and match unit and outcome across the lists. Use the M1878 pamphlet to find the selected lists on the film. [S6] [S13]","sources":["S6","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ba80d688edd9","kind":"method","anchor":"Use Series II of the *Official Records* for orders and correspondence about an exchange, prison, transport or political prisoner. Search the eight volumes by camp, authority or date as well as by the person's name. [S12]","sources":["S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-59afb3f40b07","kind":"method","anchor":"For a Confederate prisoner who entered U.S. service, look for a prison enlistment entry and the separate CMSR in M1017 if he joined one of the 1st through 6th U.S. Volunteer Infantry regiments. Check the recruiting prison before assuming a particular regiment. For a Federal prisoner who joined Confederate forces, start with the RG 249 enlistment rolls and then check the unit's service records. Keep the two services on separate dated rows. [S5] [S6] [S11] [S15]","sources":["S5","S6","S11","S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
