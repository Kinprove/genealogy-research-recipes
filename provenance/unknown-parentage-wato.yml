claims:
  - {"id":"C-a995733c9657","kind":"unclassified","anchor":"**Where the probabilities come from (get the source right):** WATO's odds are derived from **AncestryDNA-based** relationship probabilities (calculations by Larkin & Millard), *not* from the crowd-sourced Shared cM Project. WATO and WATO Plus offer two probability sets. The **2016** set was simulated by AncestryDNA and described in its 2016 white paper; it is the original WATO's default. The **2020** set, also labelled beta, was compiled from the probabilities Ancestry showed on its site, as documented by Leah Larkin; it is WATO Plus's default. DNA Painter warns that at low cM the 2020 set favours close relationships more strongly than it should, and calls the 2016 set more sensible for small amounts. Only WATO Plus can apply **age-based probabilities**, once you state whether the unknown parent sought is the mother or the father. For every run, record the probability set and whether age-based probabilities were on, and compare scores only within one setup. ([WATO vs WATO plus](https://dnapainter.com/blog/wato-vs-wato-plus/); [WATO plus FAQ](https://dnapainter.com/help/user-guide/wato-plus/faq)) Blaine Bettinger's Shared cM Project data powers a **separate** DNA Painter tool — the \"Shared cM Tool\" — which you use to turn a cM figure into a *range of candidate relationships*. Two different tools, two different data sources; don't conflate them.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7b361aae080a","kind":"unclassified","anchor":"**Check the known side before you filter against it.** Confirm that each tested known relative appears in the target's match list at an amount the Shared cM Tool allows for the documented relationship. A missing or low-sharing known relative makes misattributed parentage of the target, the relative or both a hypothesis to test. Do not use that relative as a known-side filter until the question is resolved (see the named failure modes). Before calling a relative missing, confirm that both kits are in the same company's database (tested there or uploaded) and that the match is visible to you (not hidden or opted out of matching). Legacy Tree's [new-results checklist](https://www.legacytree.com/blog/eight-steps-to-pursue-with-new-autosomal-dna-test-results) motivates the check.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d1faaeb20514","kind":"unclassified","anchor":"**For an unknown parent, filter the pool in both directions.** Keep matches shared by at least two descendants of the subject who descend through different children. Then remove matches shared with tested relatives on the known parent's line; what remains are candidates for the unknown side. A Not-In-Common-With list against a half-sibling through the known parent does a similar sort. Where descendants of one mother's children by different fathers have tested, group each line's *unshared* matches by common ancestors in the matches' trees to find each father's line. [Paul Woodbury](https://www.youtube.com/watch?v=bnghXcCqcQc), [Mary Eberle](https://www.youtube.com/watch?v=gNFNKpvy1no) and [Family History Fanatics](https://www.youtube.com/watch?v=ZmxhJsw6R-I) motivate this. Exclusion is a clue, not a clean partition. Distant matches, maternal ones included, drop out by chance, sharing depends on vendor thresholds, and endogamy or a double relationship breaks the filter.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-17bacd114e11","kind":"unclassified","anchor":"**Under endogamy, filter by amount, not by presence.** Matches from the unknown side also appear as shared matches of known-side relatives, at small amounts, so removing every shared match discards real candidates. Mark known-side anchors: the known-side testers and documented relatives you can place on that line, such as second cousins. Where the amounts are visible, assign a match to the known side only when it shares substantial amounts with several anchors, and record the level you used. Small sharing with the anchors leaves the match in the unknown-side pool. The [JewishGen endogamy talk](https://www.youtube.com/watch?v=xaa5FcbZYb8) motivates this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dcc096f60806","kind":"unclassified","anchor":"**A filter covers only the lines its testers share with the target.** Prefer the known parent as the filter tester; failing that, a relative who shares all of that parent's ancestors, such as a half-sibling through that parent or that parent's full sibling. A cousin through only one of that parent's grandparent couples removes matches from that line only. If tested known-side relatives represent only some of that parent's lines, recruit testers from the missing lines; until then, matches from those lines stay in the pool and look like unknown-side candidates. Legacy Tree's [filter-testing advice](https://www.legacytree.com/blog/seven-strategies-to-set-up-your-dna-testing-plans) motivates this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7cbe9b9be056","kind":"unclassified","anchor":"**When the unknown parents belong to an ancestor you descend from, sort each cluster by side.** Matches who descend from the ancestor and spouse themselves ('theirs') do not by themselves identify the ancestor's parents, so a cluster made only of them is not progress on the parent question. Matches through the spouse's family ('hers' when the ancestor is a man) answer a different question; the spouse's surname recurring in members' trees is a lead to that side, not proof. Work the clusters that connect through the ancestor's own parents or grandparents. FamilySearch's [DNA Swim School, Part 3](https://www.youtube.com/watch?v=D9rSab4b9EI) motivates this.\n2. **Identify the common ancestral couple of the strongest cluster** — the MRCA the tree will hang from. A useful *heuristic*: two strong matches who share DNA with the target but **not with each other** often descend from two different lines that meet at the target, so their intersection point is a candidate placement. Treat this as a lead, not a law — the two matches could instead sit on *opposite parental sides*, or be genuinely distant on a single line, in which case they never converge on the target. Verify with the tree and additional matches before betting on the intersection. (Kitty Cooper, 2026-01-09)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b3488c525729","kind":"method","anchor":"**Count the couple's children the matches descend through.** A couple that recurs in match trees is a stronger lead when the matches descend from more than one of its children. When every match descends through one child and the same spouse of that child, the shared DNA can come from that spouse's family instead; keep that family as an alternative. Record the child and spouse on each descent path [N39].","sources":["N39"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-4fe0effb70db","kind":"unclassified","anchor":"**Finding step 2's intersection when matches form several groups.** If the target matches two or more groups that each resolve to a different ancestral couple, trace each group's descendants forward, including spouses' families, and look for the marriage (the 'union couple') that joins the lines; that couple's descendants form the candidate pool, narrowed by sex, place and timing. The [BYU FIGG lecture](https://www.youtube.com/watch?v=2bVJc1zapFE) and [GeneaVlogger's Mr. Beat case](https://www.youtube.com/watch?v=N0W5UpsyJGQ) motivate this. A marriage you find is a hypothesis to check against records and WATO. It does not exclude other connecting paths, and the groups must not share descent through pedigree collapse.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cb7d722a4e3a","kind":"unclassified","anchor":"**Do not hand the cluster's couple to the target automatically.** Shared matches who are second cousins to one another identify their own common couple. A target who shares less DNA with them may connect one generation higher, through that couple's parents. Likewise, a match who does not descend from the target's known grandmother rules out a full relationship only at the same generation. Keep full great-uncle/aunt and full 1C1R hypotheses through an unknown grandfather's own parents, and use the birth years of the tester, her father and the match to separate generations. When the cM allows it, enter each level as a hypothesis and let the scoring and documents decide. The [Mary Eberle Q&A](https://www.youtube.com/watch?v=mN76WbyY2s4) and [GeneaVlogger Q&A](https://www.youtube.com/watch?v=0__vtn3IzSc) motivate this.\n3. **Build the known descendancy tree** from that couple down to the present, placing each real DNA match at its documented position. GEDCOM import builds this fast (limit imported candidates to descendants of the selected ancestor). Model half- vs full-sibling relationships correctly — a wrong half/full edge skews every probability downstream. (Family Locket, 2025-03-27)","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6aebd997afb5","kind":"unclassified","anchor":"**Check which tree a close unexplained match supports before you place the match.** When a close match has a documented tree but no documented connection to the target, work out which documented family the shared matches between the target and that match belong to. If those shared matches are relatives on one of the target's known lines, hypothesize that the match descends from that line and that the error is in the match's tree. If they descend from a couple in the match's tree, test the target's descent from that couple. If they form their own cluster around a couple in neither tree, test whether both trees contain a misattribution. Do not place the match at a documented position the shared matches contradict; give the match a provisional slot and let records and the scoring test it. Legacy Tree's [six signs of misattributed parentage](https://www.legacytree.com/?p=80153) motivates this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f5f9699dbb1e","kind":"unclassified","anchor":"**Test the close match's own documented parentage.** If chronology rules out the match's documented parent on the relevant side as the shared ancestor (for example, that parent was a child when the person whose parent is unknown was born), reject that placement, not the documented parentage: the match may connect through that parent's own parent instead. If a male match's direct-line Y-DNA test does not match his documented father's paternal-line relatives, check both documented paths and locate the break before treating the match's own parentage as misattributed. Then add hypotheses that place the match on the unknown side, such as a child of the unknown parent and so a half-sibling of the person being researched, alongside every other relationship the cM allows. With the match's permission, cluster the match's own shared matches and build hypotheses from them; they sit generations closer to the unknown parent than the tester's distant matches. Legacy Tree's [unknown-father case](https://www.legacytree.com/blog/identify-unknown-father-1920) motivates this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3b35bbe1d385","kind":"unclassified","anchor":"**Run a known-answer control before placing hypotheses.** Before working an unknown placement, rehearse the same workflow on an ancestor you have already documented. Treat that person as unknown, enter the real matches and cM, and check whether the documented slot ranks well against its alternatives. A failure points to tree-building, match-selection or data-entry errors before they contaminate the real case. One passing control does not validate a different tree, especially one with endogamy or multiple paths. The [Eberle case study](https://www.youtube.com/watch?v=zHwjmnpTz-c) recommends this rehearsal.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f13909ba4069","kind":"unclassified","anchor":"**Check generation alignment before you place matches.** Put known relatives and people from match trees on a generation grid with estimated birth years, then check every parent-child interval. Matches born in similar years need not belong to the same generation. A parent four decades older than a child is not inherently implausible: recheck dates and documentary links, and move a branch down a generation only when they show the interval is wrong. Place a treeless match at the ancestral level its reliable reported relationship implies, and treat that slot as provisional. The [Lisa Lisson session](https://www.youtube.com/watch?v=1eEJABnbsUs) motivates this step. Its roughly 25-year spacing is an averaging heuristic and does not test any single link.\n4. **Place hypotheses** — every plausible open slot where the target could descend — and enter the shared cM between the target and each match already in the tree. WATO scores each slot.\n5. **Read the ratios and iterate — do not read a single run as an answer.** When a large tree floods the display, inspect an evidence-bearing branch in a separate working copy. Preserve the full baseline and all plausible alternative placements; a focused view answers a narrower question, and a higher percentage after pruning is not new evidence. Use the tied-hypothesis procedure below before adding or withholding matches. (Family Locket, 2025-03-27, reports branch-focused pruning; the baseline and comparison controls are this recipe's synthesis.)\n6. **Privacy gate:** <!-- privacy-gate: contact --> Recruiting a specific living relative to test discloses the hypothesis and asks for their DNA, so answer the privacy gate in `SKILL.md` before any approach. **Take the top hypothesis forward.** WATO ends the *scoring* step, not the investigation — its output points to the next move, which may be **more targeted DNA testing** (recruit a specific relative to test) *or* **documentary research**, usually both (see the final sections).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3f25a9a271f5","kind":"method","anchor":"- **A match with multiple relationship paths / endogamy / pedigree collapse.** Such matches violate WATO's single-path assumption — withhold their cM from that calculation, with the reason recorded. Preserve the person, documented paths and observations in the research record; omitting a measurement does not justify deleting a real path from the tree. If essential evidence remains multiply related, use a model whose documented assumptions support the actual pedigree and dependencies, or compare hypotheses qualitatively. Useful segment/cluster roles remain available in [ai-for-dna-research](ai-for-dna-research.md#untangle-multiple-paths-without-discarding-the-useful-evidence). [N2], [N70].\n- **Total shared cM is not proof of a shared *ancestor*.** A total-cM figure can reflect one genuinely shared ancestral segment *or* several unrelated small segments that happen to sum to the same number — WATO scores the total either way, so don't over-trust a placement whose total leans on small fragments. Where segment data are available, check whether all members actually match one another on the same interval; overlap relative to the target alone is not triangulation. Triangulation alone does not validate a small segment or establish its ancestral age or source line. Keep segment validity and attribution to the proposed ancestry as separate questions; a documented genealogical relationship remains useful even when its reported small segment cannot be used as genetic evidence. [N35].\n- **A predicted relationship as fact.** Record the measured cM and any other inputs the tool used. List each relationship compatible with the amount, ages and pedigree before adopting a label [N64].\n- **A ThruLines suggestion can repeat a tree error.** For the proposed father Hopson Milner, most apparent DNA connections led only to Cynthia (Dillard) Royston herself, while records distinguished her from Cynthia Milner [N5]. Follow each match beyond the target to see whether it actually supports the proposed parent and verify every intermediate identity.\n- **A WATO ranking as a conclusion.** Use the top placement to choose an independent test, such as a distinguishing relative or a will, census, family Bible or newspaper record [N3], [N5].\n- **Public-tree identities.** Two women with the same name and birth year get merged into one person constantly; a single bad merge routes your whole hypothesis to the wrong branch. Verify the intermediate people, don't inherit them. [N3].\n- **A single census age.** Compare the birth-year estimates across enumerations and retain the resulting interval. Cynthia’s gave years from 1815 to 1818 [N5]. Check independent dated records before using one year to exclude a candidate.\n- **Parent names on an adoptee's birth record.** Treat each named parent as a separate claim to test, not a tree fact: DNA may support one and contradict the other, so record each outcome. Check the adoption, amended-certificate and record-sealing rules in force at that time and place; an amended certificate can name the adoptive parents while the court file is sealed. Where illegitimacy carried stigma, a false name may have been given, so a candidate birth or hospital record with a mismatched parent name is not automatically the wrong record. Keep it unresolved until DNA and independent records decide. The [Eberle client case](https://www.youtube.com/watch?v=Yg8KbRoSN8U), [James Tanner](https://www.youtube.com/watch?v=E3we4fIR2qM) and [Denyse Allen](https://www.youtube.com/watch?v=H_EJZccJQfc) motivate this. [N11], [N12], [N13].\n- **Non-identifying information as complete or correct.** An earlier release may not be final, because what counts as non-identifying can depend on the person handling the request. Where the jurisdiction allows, request it again, along with the original birth certificate and the adoption file, and record what each release contained. Treat each detail, and what the adoptive family was told, as a clue that may be wrong: a birth mother may have concealed her identity or named the wrong man, and adoptive parents may have been given false background. Use the details to rank candidates; do not exclude one on a single mismatch. Legacy Tree's [adoption research tips](https://www.legacytree.com/blog/successful-adoption-research-with-genetic-genealogy) motivate this. [N41].\n- **A mutual-consent registry's 'no match' as a negative.** These registries connect an adoptee and a birth parent only when both have filed consent, so 'no match' means only that no matching consent was on file when the registry checked. It does not show that the adoption file or original birth certificate is missing or unobtainable. In some states the registry forms are themselves the route to the original birth certificate, so read which request a refusal answered. Pursue the rest through their own routes, each under its current eligibility rules: the court or county that finalized the adoption, and the state's current original-birth-certificate procedure. Record the registry result, its date and each separate request as their own rows. A birth parent may file later, so note when to check the registry again. A [DNAngels case](https://www.youtube.com/watch?v=8f_jPZ96-hQ) motivates this. [N47].\n- **Lean on mid-range matches, not the closest ones.** WATO's discriminating power sits in the mid-range — published as reliable roughly back to a 2nd/3rd-great-grandparent, growing misleading past ~4C1R. A *very close* match is the wrong workhorse for two reasons: (a) it usually **identifies the answer directly** and needs no odds engine, and (b) among several roughly **equidistant** candidate slots it **doesn't discriminate** between them. (Ignore the common backwards rationale that \"close ranges overlap\" — it's the reverse: total-cM bands overlap worst at *intermediate* degrees like 1C / half-1C / grand-aunt, and even aunt/uncle vs grandparent vs half-sibling are hard to separate by total cM — which is exactly why you carry *all* candidate relationships, never a single label.) (Independence *among* the matches is a separate constraint — see match selection.) [N2], [N70].","sources":["N2","N70","N35","N64","N5","N3","N11","N12","N13","N41","N47"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2e542156ece7","kind":"method","anchor":"- **Closeness of the question sets the bar.** A closer question needs fewer, closer matches; a distant hypothesis with a weak paper trail needs more matches from *additional independent lines*. A confirmed half-sibling can identify the shared parent, while a first-cousin placement can still leave several siblings as candidates [N4], [N64].\n- **Check dependence *among* the matches.** DNA Painter's WATO guidance is to avoid tested descendants more closely related to each other than first cousins. Prefer coverage through **different children** of the ancestral couple, while recording shared descent and additional paths. Parent/child or sibling measurements must not become independent votes; retain them for transmission and pedigree checks, or use a model that handles their dependence. This concerns relationships *among* matches, not how close each is to the target. [N4], [N70], [N9].\n- **Privacy gate:** <!-- privacy-gate: third-party-tool --> Each WATO analysis receives living testers' and matches' cM and tree positions; answer the privacy gate in `SKILL.md` before entering them.\n- **Several related testers, one match: keep separate analyses.** When same-generation relatives of the target each compare with a match, keep a separate WATO analysis for each focal tester, entering each match once. Retain the related testers' observations for qualitative comparison; do not pool duplicated entries into stronger odds, and never sum testers' cM. A pooled run entered the same match four times to represent the mother and her three first cousins [N14]. Keep the four pairwise observations identifiable and compare the separate runs qualitatively.\n- **Mind weak, fragmented segments.** False-match risk is driven mainly by **segment-level** quality — the *longest single segment*, SNP density, phasing, and the platform's own matching threshold — not by a flat total-cM number. A single clean ~20 cM segment is generally a *real* match; the thing to distrust is a ~20 cM *total* stitched from several short fragments, each near the noise floor, which can be identical-by-chance. Do not use unresolved small fragments as genetic corroboration merely because stronger matches support the placement. Retain the documentary relationship and source observations separately. [N35].\n- **Know whether a displayed cM figure has been filtered.** A 2019 [GeneaVlogger WATO tutorial](https://www.youtube.com/watch?v=ppQfwZHHqNk) describes Ancestry's Timber algorithm as removing segments judged common in the population before Ancestry reports a total; check Ancestry's current documentation. Record whether each figure you enter is filtered. If one low value zeroes out an otherwise supported hypothesis, especially in an endogamous family, check whether filtering caused the zero before you discard the hypothesis. Do not invent a correction or enter a guessed raw figure. [N15].\n- **Privacy gate:** <!-- privacy-gate: upload --> Before any upload of the tester's raw DNA, answer the privacy gate in `SKILL.md` and get the tester's informed, explicit permission for that database and its matching and visibility settings (see [Ethics and the human layer](#ethics-and-the-human-layer)); permission to work the kit does not cover an upload.","sources":["N4","N64","N70","N9","N14","N35","N15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bab1f532cd5b","kind":"platform-ui","anchor":"**Which files FamilyTreeDNA accepts (for \"Grow the pool\" above).** FamilyTreeDNA takes free uploads only from AncestryDNA, 23andMe and MyHeritage. It cannot take an AncestryDNA test taken in 2026 or processed by Ancestry after September 2025; tests processed from May 2012 through September 2025 can be uploaded. The date Ancestry processed the test counts, not the date the file was downloaded. From MyHeritage it takes only tests run on the GSA chip, which covers most tests from about March 2019 to late 2025 [N60 @2026-11-13]. Find out when the testing company processed the kit before you plan an FTDNA upload.","sources":["N60"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-97bfa63172c7","kind":"unclassified","anchor":"For a willing recipient, an optional source-linked progress brief can show the original\nobjective, actual findings, represented and still-missing child branches, and the specific\ncontribution being requested. Keep a private identity key separate from a redacted report or\nconnection diagram. The [test-taker recruitment example](https://familylocket.com/rlp-204-recruiting-test-takers-for-an-autosomal-dna-project/)\nmotivates this preparation; a private document can provide the same context as a website.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-59093fd5292f","kind":"unclassified","anchor":"**When moving a legacy tree into WATO Plus, check whom each hypothesis represents.**\nPreserve the old tree, candidate set, tested people and run inputs before using an\navailable transfer route. Perl's [2024 migration account](https://blog.dnapainter.com/blog/from-what-are-the-odds-to-wato-plus-in-one-click/)\ndescribes old hypotheses representing the DNA tester, while the Plus hypotheses\nrepresent the proposed unknown parent; that conversion removes the old hypotheses.\nRebuild the plausible alternatives for the intended question and inspect each path\nfrom the proposed parent through intervening generations to the actual tester. The\n[introduction](https://blog.dnapainter.com/blog/introducing-wato-a-new-tool-for-investigating-family-mysteries/)\ndescribes generating that trail from the structured question. A copied tree does not preserve hypothesis\nmeaning by itself; removed alternatives or changed model/age settings are not new\ngenealogical evidence. Do not compare scores until you know whom each hypothesis\nrepresents and which path it takes.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c49b0453f8d9","kind":"unclassified","anchor":"**Remove X-DNA from a vendor total before you enter it.** When you combine matches from several companies, subtract the X amount from every vendor total that includes X-DNA, and record both the original and the adjusted figure, because WATO scores autosomal totals only. Vendors differ and change: the X reporting table in [DNA comparison controls](dna-comparison-controls.md#establish-what-could-have-been-observed) says how five services report X, and each vendor's current documentation decides. The [Mary Eberle WATO session](https://www.youtube.com/watch?v=kDsqJNtZIaY) motivates this.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f170723dc557","kind":"method","anchor":"- **A focused tree manufactures a winner.** A percentage increase after pruning can reflect omitted alternatives, not new evidence; compare the surviving leaders against the preserved baseline. (Family Locket, 2025-03-27, pruning case; comparison control synthesized above)\n- **The \"don't add unknown people as hypotheses\" setting** shrinks the search space but can *bias results toward already-known, unmatched children* — know which way you've tilted it. (Family Locket, 2025-03-27)\n- **Pedigree collapse** makes one person occupy several tree positions at once; WATO's odds become uninterpretable (same root cause as endogamy inflating cM).\n- **Forcing a slot when none fits the cM.** When every candidate placement gives some matches too much DNA and others too little, research every descendant branch of the matches' common ancestor, not only the matches' own lines, and look for marriages between those branches. A match who descends through both branches has a double relationship; withhold that match's cM from single-path scoring (see \"never trust,\" above) rather than adjusting it by a guessed amount. A [Legacy Tree client case](https://www.legacytree.com/blog/dna-doesnt-lie-how-to-accurately-interpret-dna-test-results) motivates this. [N42].\n- **The false ThruLine** (above) — a member-tree-inferred hypothesis that looks DNA-backed but points at the wrong parent.\n- **Treating triangulation as segment validation** — placing a reported small segment on an ancestral line because it triangulates or its bearers share a documented ancestor. Those observations alone resolve neither the segment's validity nor its age and source line (see \"never trust,\" above).\n- **Ambiguous cM bands.** A reported 269 cM comparison admitted both second cousin and half first cousin once removed among its candidates [N2]. Preserve the full candidate set and use the shared matches and documented generations to distinguish it.\n- **Same-name conflation** and **single-record date drift** (above) route hypotheses to the wrong branch before WATO even runs.\n- **Assuming the documented spouse is the other biological parent.** Once one parental side resolves, research the documented partners. If none of them connect to the remaining match groups, treat that as a red flag and do not force the matches to fit. Locate the other side's convergence on its own, then weigh non-marital conception or adoption against records that place the candidates together in time and place. The fictional [BYU FIGG case](https://www.youtube.com/watch?v=2bVJc1zapFE) motivates this. Co-location only makes a pairing plausible; identification requires correlating DNA and records, with direct confirmatory DNA where possible and appropriate. [N21].\n- **Expecting a misattributed parent to leave strangers in the match list.** If presumed cousins on one line consistently share about half what the documented relationship predicts, but no unexplained match group appears, consider a biological parent from a family already in the tree. Look for an excess of matches on another known line, and trace that line's descendants for candidates. If the proposed placement creates pedigree collapse or another repeated path to an affected match, withhold that match from single-path scoring (see \"never trust,\" above). A [discussion of halved sharing on one line](https://genarchivist.net/showthread.php?tid=1838) motivates this. [N29].\n- **Deciding from one pair which relative is off the line.** When proposed close relatives share no DNA, or consistently less than their documented relationship allows, the pair alone cannot show which of them is misattributed, or whether both are. Compare each with other documented descendants of the couple and with collateral relatives of each spouse. Someone who matches both spouses' sides at expected levels supports full descent. Someone who lacks those matches, or lacks one spouse's side and shares consistently low amounts with the other descendants, becomes the non-descent or half-relationship candidate; do not decide half versus full from the pair's cM alone. Without such controls, leave the question open. Non-descent from the couple does not show which link broke, parent-child or grandparent-parent; test the intermediate generation before placing the break. Zero sharing is a strong signal only at second cousin or closer, where detectable sharing is near-certain. A one-sided gap in collateral matches can also mean that side's lines are untested; check who from that side has tested before reading the gap as non-descent. Two Legacy Tree articles, on [proving the exact nature of misattributed parentage](https://www.legacytree.com/blog/proving-the-exact-nature-of-misattributed-parentage) and the [six signs](https://www.legacytree.com/?p=80153), motivate this. [N40], [N43].","sources":["N42","N2","N21","N29","N40","N43"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-28fa17cdc040","kind":"unclassified","anchor":"For a proposed first approach, keep permission to use the test/kit, the family or branch the\nrecipient wants to explore, and their willingness to hear unexpected findings as separate\nchoices. Leave unexpressed preferences unknown; kit permission does not settle the other two.\nThe [collaboration example](https://www.yourdnaguide.com/ydgblog/contacting-african-american-dna-matches)\nand [informed-consent discussion](https://www.yourdnaguide.com/ydgblog/informed-consent-for-dna-testing)\nmotivate this distinction.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9719cf35c4ab","kind":"unclassified","anchor":"If unexpected findings may be discussed, prepare an unsent private heads-up and a short\noutline separating supported observations from unresolved interpretations. Let the recipient\nchoose whether to continue and which channel to use; respect a pause or decline. Send only\nwith the researcher's explicit authorization. The [communication example](https://www.yourdnaguide.com/ydgblog/dna-test-surprise-unexpected-news)\nsupports this preparation without promising a particular response.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-304d0ef73b22","kind":"method","anchor":"- **Privacy gate:** <!-- privacy-gate: contact --> Recruiting a living relative to DNA-test discloses the hypothesis and asks for their genetic data; answer the privacy gate in `SKILL.md` before any approach.\n- **WATO points; DNA testing or documents close.** Treat the top hypothesis as the objective for the next round — which may be recruiting a specific relative to DNA-test *or* a records search: wills that name (or omit) children, marriage and census records, a family bible, newspapers. In the Dillard investigation, family Bible pages identified an unnamed census-household candidate as Mariah, weakening the case that she was Cynthia [N5]. Record exactly how each document bears on the competing families.\n- **Prefer convergent confirmation over elimination.** A candidate father is stronger when separate matches tie to both of his parents' lines. Matches through only one parent's family leave his relatives in that family as alternatives. Narrowing by enumerating one branch is weaker, because adoptions, missing people and record errors hide candidates, so report 'identified children', not a complete set. Full brothers usually remain an unresolved sibling set on autosomal DNA. Use city directories from the conception period to rank them: put each brother's address and employer as those historical directories record them beside the mother's; do not look up anyone's current address, workplace or contact details, or use people-search services. That shows opportunity, not paternity. GeneaVlogger's [Breakthrough review](https://www.youtube.com/watch?v=mKL215bfBGc), [Max Miller case](https://www.youtube.com/watch?v=9RYQTQzo45I) and [descendancy stream](https://www.youtube.com/watch?v=qg_l4olzWYI), and the [Family History Fanatics example](https://www.youtube.com/watch?v=wCYIda-4sfk), motivate this. [N25], [N26], [N27], [N28].\n- **Set the conception window before you rank candidates.** Estimate a conception window from the birth date and any gestation length recorded in the non-identifying information, not one nine-month date; without a reliable gestation length, allow for a premature as well as a full-term birth. Do not assume conception happened at the birthplace; in adoption cases the two often differ. Compare each candidate's location, life situation and family facts in that window with the non-identifying information, and use the result to rank a sibling set DNA cannot separate (see the non-identifying-information point in \"never trust,\" above). Legacy Tree's [adoption research tips](https://www.legacytree.com/blog/successful-adoption-research-with-genetic-genealogy) motivate this. [N41].\n- **Work in explicit, revisable phases.** State an objective, test it, and be willing to *reject* it; every case reviewed cycled through wrong candidates before the right one. Being wrong on a hypothesis is the method working, not failing. [N5].\n- **Write it up.** Independent lines and hard-to-document descents need a proof argument, not just a WATO screenshot. [N4].","sources":["N5","N25","N26","N27","N28","N41","N4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9a48044a1c93","kind":"platform-ui","anchor":"**Age-based probabilities rest on US birth statistics.** WATO Plus can apply the sought parent's age and, as a second option, the other biological parent's age; the data comes from US National Vital Statistics Reports for 1936–2014 (WATO plus FAQ [N51 @2026-11-12]). At launch, the data for both parents' ages covered only 1940 and 1965, a missing year took the closest year, and a source note in the scores table named the data used (Perl, 2024-02-26 [N31 @2026-11-12]). Read that note for each run. For a birth outside the US or outside those years, treat the age prior as a poor fit and compare the run without it. It ranks candidates such as brothers of different ages by how common each age was at a birth, not by DNA, and a likely age is not the actual age (Perl, 2024-01-30 [N54 @2026-11-12]).","sources":["N51","N31","N54"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2adc152de98a","kind":"platform-ui","anchor":"**Set up the research question and age limits before you suggest hypotheses.** Each WATO Plus hypothesis is a candidate for the unknown parent, not a place for the tester. Enter the birth year of the person whose parent is unknown: the tester's own when the tester seeks their own parent, otherwise that of the tester's parent, grandparent or other ancestor, never the tester's by default (WATO plus FAQ [N51 @2026-11-12]; Perl, 2025-02-11 [N50 @2026-11-12]; WATO plus guide [N55 @2026-11-12]). The Father, Mother or Parent choice names the parent being sought, not the person of unknown parentage (WATO plus guide [N55 @2026-11-12]). Enter as many birth and death years as the tree supports, and the other biological parent's birth year if it is known: the generator uses ages at the birth, through the **Max and min Ages** settings under **Actions and Settings**, to decide who could be a parent (Southard, 2024-02-23 [N56 @2026-11-12]; Perl, 2024-01-30 [N54 @2026-11-12]; WATO plus guide [N55 @2026-11-12]). At launch the limits were 14 for the minimum, 54 for a mother and 75 for a father (Perl, 2024-02-26 [N31 @2026-11-12]). Read the current values before you trust the suggestions, record them with the run, and widen them when a candidate could fall outside them: a wrong birth year or a narrow limit drops the true placement without warning. **Suggest Hypotheses** stays inactive until the tree holds a match over 40 cM (DNA Painter tutorial [N57 @2026-11-12]).","sources":["N51","N50","N55","N56","N54","N31","N57"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4820ea314357","kind":"platform-ui","anchor":"**Match the generator's settings to what your research has established.** **Stop WATO from adding unknown people to the tree** is off by default, and Suggest Hypotheses then adds full and half-siblings of anyone with matching descendants as possible unknown candidates. Tick it only when research shows the tree already holds every plausible candidate; WATO then tests only people already in the tree. **Allow WATO to add siblings of the root person** is also off by default, so new people are added only as descendants of the root couple. Leave it off when the matches establish descent from that couple, because hypotheses through the root person's siblings cannot then be right. Turn it on when that descent is not established, and expect the tree to grow (Perl, 2024-02-16 [N58 @2026-11-12]; WATO plus FAQ [N51 @2026-11-12]; WATO plus guide [N55 @2026-11-12]). WATO keeps these settings only in that browser, so record them with each run (Perl, 2024-02-16 [N58 @2026-11-12]).","sources":["N58","N51","N55"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-785541232628","kind":"platform-ui","anchor":"**When WATO finds no feasible hypothesis, find the cause before you loosen the model.** Add a few hypotheses by hand and open their score calculation to see which relationships rule each one out; the usual causes are an unknown extra relationship that inflates the cM, or a tree error such as a person entered in the wrong generation (Perl, 2021-06-24 [N59 @2026-11-12]). The current guide's warning also points to a very large tree, small matches, the settings above, the age limits, the cM amounts and the birth years (WATO plus guide [N55 @2026-11-12]). WATO Plus's experimental **Flex** setting, meant for endogamy or pedigree collapse, lowers the entered cM amounts by 5 to 50% before scoring (WATO plus FAQ [N51 @2026-11-12]; Southard, 2024-02-23 [N56 @2026-11-12]). Record Flex as a separate model setting. It does not model the extra paths, so a match with a known second path still stays out of single-path scoring (see the multi-path rule above).","sources":["N59","N55","N51","N56"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2832cdd81dca","kind":"platform-ui","anchor":"**Find which rule produced a zero.** In the original WATO, Perl lists three: the cM amounts make the position impossible, birth or death dates make it impossible, or the hypothesis is more than a million times less likely than the top one; a lone hypothesis scores only 0 or 1 (Perl, 2022-04-28 [N7 @2026-11-12]). The WATO plus FAQ gives an impossible hypothesis a zero and every other hypothesis its share of the total score (WATO plus FAQ [N51 @2026-11-12]). So a zero can come from a date you entered, and the million-fold zero is relative to the current leader, not an exclusion. Focus on the hypothesis or open its score calculation and name the relationship or date that caused the zero before you call a slot impossible.","sources":["N7","N51"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4fec8d6b56bd","kind":"method","anchor":"**Compare every child, including those without a tested descendant.** Map the closest matches to the couple’s children and compare their possible relationships to the target. A closer relationship via one represented child can favor that branch. In a Los Angeles case, three matches through different children and an unrepresented son’s residence near the mother at the relevant time singled him out for investigation [N61]. Enter all children as competing hypotheses [N62], keep matches on the target’s other parental side separate and allow for missing descendants or testers in an apparently silent line [N43].","sources":["N61","N62","N43"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a029c7161ae1","kind":"method","anchor":"**Identify a half-sibling-range match's parent from what the match shares with you, not from the match's online life.** A total near 1750 cM fits a half-sibling, a grandparent or grandchild, or an aunt or uncle; the amount cannot separate them, and the two testers' ages narrow the choice (The DNA Geek, updated 2022-10-14 [N64]). Place the match on a side with the step 1 filters, and enter every relationship the amount and the ages allow as a hypothesis. Under the half-sibling hypothesis, the match's parent on the unknown side is the candidate. Learn who that parent is from the match's profile, tree and shared matches on the testing site and from records about deceased people, then ask the match through the testing site's messaging, staged through [DNA match outreach staging](dna-match-outreach-staging.md). Do not search the match's or the match's relatives' names on social media, search engines or people-search services for their posts, accounts, addresses or phone numbers, even when the candidate parent may have died; the Living people rule in `SKILL.md` forbids it. One reported half-sister-range match led to the father’s identity only through additional family information [N63].","sources":["N64","N63"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-3febdcf8b492","kind":"method","anchor":"**Start with a descendant's matches when the intervening parent has no usable test.** In a search for an unknown paternal grandfather, use the granddaughter's own existing match list with her permission. Use her known maternal relatives and relatives through her paternal grandmother to sort the matches before assigning a cluster to the unknown grandfather. Predict each match's relationship to the granddaughter and keep any unmeasured comparison with her father blank. Lovell's account [N67] and the DNA Painter unknown-grandparent example [N69] illustrate this starting point.","sources":["N67","N69"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d9cc90ea7559","kind":"method","anchor":"**Test the aunt–niece placement when a cousin match points to a missing son.** If the match's father may be the missing son of a proposed grandfather, compare the match with a documented biological daughter of that grandfather. If her result is unavailable, ask the proposed aunt whether she is willing to test through [DNA match outreach staging](dna-match-outreach-staging.md), after the contact checkpoint above. Predict a half-aunt–niece relationship if she and the match's father have different mothers. Use the testers' ages, documented descent and shared matches to check competing placements. Half-aunt and first-cousin cM ranges overlap [N68]. Lovell's account [N67] motivates choosing the proposed aunt for the follow-up comparison.","sources":["N68","N67"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-139ae4091dbb","kind":"method","anchor":"**Use a presumed full sibling to test the presumed father's placement.** If both testers have the same established biological mother, compare their permitted results under full-sibling and maternal half-sibling hypotheses. If the comparison can detect fully identical segments (IBD2), check whether the pattern supports sharing through both parents, accounting for any additional relationship paths [N66]. Keep both hypotheses open when the only evidence distinguishing them is a testing site's predicted label or a total cM that fits both [N68]. Once the maternal half-sibling relationship is established, exclude the sibling's biological father as the target's father only if his paternity of that sibling is also established. De Lio's account [N65] motivates this exclusion check.","sources":["N66","N68","N65"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-403a007543c7","kind":"portal-availability","anchor":"- **Grow the pool across databases.** With that permission, uploading the tester's raw data to a database that accepts third-party transfers surfaces matches from other descendant lines. GEDmatch describes its supported files [N71 @2026-11-19]. FamilyTreeDNA accepts only specified sources and processing dates [N60 @2026-11-19]. Living DNA accepts free transfers from AncestryDNA, 23andMe, MyHeritage and FamilyTreeDNA and requires an opt-in for Family Networks [N53 @2026-11-19]. MyHeritage requires its own test for new DNA matching kits [N72 @2026-11-19]. For native AncestryDNA or 23andMe results, use that tester’s permitted kit access. Check compatibility and matching settings before each transfer.","sources":["N71","N60","N53","N72"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-9aee19004b9c","kind":"method","anchor":"- **Privacy gate:** <!-- privacy-gate: contact --> Asking relatives or a match's older relatives to test, or asking matches for collaborator access with a research summary and diagram, discloses your research and living people's details; answer the privacy gate in `SKILL.md` before any approach.\n- **Coverage is real: different relatives inherit different segments.** Testing several relatives of the same generation, and asking key matches to share their *full* match list (Ancestry \"Collaborator\" access), surfaces relevant matches that don't overlap your own DNA at all. A short research summary and a connection diagram can explain why access would help [N6].\n- **Recruit a close match's older relatives early, not only after scoring.** An adoptee with no known relatives still has targeted-testing options. When a close match has no other tested close relatives, ask whether the match's parents, aunts, uncles or other older relatives will test. Which of them share DNA with the target shows which branch of the match's tree carries the connection, before you build a descendancy for each side. A relative absent from a match list is missing or below threshold, not zero (see the tie section). If relatives on both sides of the match share DNA, check for a second path. A tested parent and child are one line of evidence, not two votes (see dependence above). Legacy Tree's [adoption research tips](https://www.legacytree.com/blog/successful-adoption-research-with-genetic-genealogy) motivate this. [N41].\n- **Privacy gate:** <!-- privacy-gate: third-party-tool --> Adding newly found living matches' cM to WATO gives the tool their genetic data and family positions; answer the privacy gate in `SKILL.md` first.\n- **Search existing match lists after descendancy research.** Once a candidate emerges, build that candidate's descendants forward, limited to names, parents and family positions: no current addresses, phone numbers, emails, workplaces or online accounts, and no people-search services; any contact goes through [DNA match outreach staging](dna-match-outreach-staging.md). Then search every tester's match list for those names, including matches with no tree, which the first sort easily misses. Verify the descent with documents, then add each match's cM per tester (see the multi-tester point above). A large jump in WATO odds is still relative to the hypotheses you built, not proof. The descendant found this way in Eberle’s case was already on the match list but had no tree [N14].\n- **Don't over-collect.** Add a match when its placement can test a specific branch or distinguish candidates. More matches from the same branch can leave the competing placements unresolved [N4].","sources":["N6","N41","N14","N4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2bd2b401e78e","kind":"method","anchor":"1. **Inspect the contribution of each match, not just the final score.** Write the relationship predicted by H1 and H2 beside each observation and inspect the scorer's per-match breakdown where available. For WATO's per-match total-cM calculation, if every scored relationship uses the same distribution under both hypotheses, with the same other inputs and priors, those data cannot distinguish them. If different matches favor opposite candidates, an aggregate tie instead identifies a conflict to investigate. Start with the decisive match's pedigree, half/full edges, generation and possible second path. In Perl’s worked example, other family tests confirmed the lower-scoring placement [N7], [N8].\n2. **Add a comparison whose prediction changes.** For each prospective tester, state their documented descent, expected relationship under each hypothesis, and what a match or non-match could distinguish. A pair with the same relationship under all three proposals can still check the background tree, but it adds no contrast between them [N8]. Prefer a usable contrasting branch over another tester who repeats the same relationship pattern.\n3. **Treat an absent shared-match entry as an observation with a reporting limit.** Establish which pair would have appeared, the threshold on both legs, and whether the list is complete and accessible. Where the display rules are known, absence means “below the shared-match threshold,” not “shares zero DNA.” If those rules or coverage are unknown, keep it missing. A below-threshold observation helps only where H1 and H2 predict it differently. Do not enter it as 0 cM or multiply absences across related descendants as independent exclusions. The 2022 Ancestry analysis used a list with a 20 cM threshold on both legs [N9], [N52]. Record whether your current view is standard or Enhanced Shared Matches, and verify its reporting rule before interpreting a missing entry (see [AncestryDNA match investigation](ancestry-dna-match-investigation.md)).\n4. **Separate changes to the evidence from changes to the model or denominator.** Record a model change, such as a switch between the 2016 and 2020 probability sets or turning age-based probabilities on or off, as a separate analysis. When relative scores are scaled to the weakest surviving hypothesis, adding a very poor candidate can greatly increase both leaders' displayed scores without improving their ratio to each other. Deleting alternatives can similarly inflate percentages. Compare H1 directly with H2 under the same setup. Inspect a zero's cause before calling it biological impossibility: a zero model likelihood, display rounding and a filtered-out candidate are different states. Do not choose the model or candidate list because it produces the preferred winner. [N7], [N10].","sources":["N7","N8","N9","N52","N10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-biological-step-link","kind":"method","anchor":"**Look for a biological link beyond the marriages in the tree.** If two match groups on the same parental side point to different families and the only documented intersection is ruled out, look for a birth that could join those lines. Test whether a candidate's step-grandfather could also have been the candidate's biological father. Keep the recorded step relationship and track the biological link as a hypothesis [N73].","sources":["N73"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-wartime-death-clue","kind":"example","anchor":"**Use a reported wartime death to search the match's collateral lines.** Check the siblings of the match's grandparent against casualty records across the named campaign before excluding a candidate on the date in a family account. In one account, a clue about a death on D-Day led to a candidate reported killed in the later Normandy fighting at Cherbourg [N74], [N75].","sources":["N74","N75"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-close-match-family-accounts","kind":"method","anchor":"**Use family accounts to distinguish close-match placements.** Through [DNA match outreach staging](dna-match-outreach-staging.md), ask the match for the minimum historical detail that would distinguish the placements. For a reported serviceman, ask who in the match's family served at the reported station and whether he used the reported surname. If the match identifies him as a brother of their father, test the first-cousin placement alongside the other plausible relationships [N76]. When half-sibling is one possibility, compare the approximate birth time and place with the match's parent's dated posting [N77]. If the match knows of another child of that parent, compare the birth period, birthplace or mother's place of origin with that account and check the generations under the niece alternative [N78]. Record the account as an attributed lead and check it against records and DNA.","sources":["N76","N77","N78"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-autosomal-segment-transmission","kind":"method","anchor":"**Check which parent could have transmitted a shared segment.** If the target shares an autosomal segment with a documented cousin on the presumed father's side, use existing, permitted comparisons to check whether the cousin shares that interval with the presumed father [N79]. Check the established other parent too if that comparison is available, and verify coverage and reporting limits on the same interval [N80]. A segment that phases to the other parent points to another path to investigate. If the comparisons leave the segment's origin unresolved, keep it unassigned. To test paternity, check the target and presumed father's direct relationship across the autosomes. Adding cousins to the same triangulated segment leaves that direct comparison unanswered.","sources":["N79","N80"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-military-leave-and-travel","kind":"method","anchor":"**Check leave and travel against the conception window.** For a candidate who served away from home, line up dated postings, leave and departures with the other parent's documented whereabouts. Exclude a candidate on location only when the evidence places the two apart throughout the plausible window, accounting for any return or leave. Use an overlapping place and date as evidence of opportunity [N73].","sources":["N73"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-overlapping-parentage-searches","kind":"method","anchor":"**Compare candidate lists when two searches may point to the same parent.** If a close match's unknown grandparent could be your unknown parent, compare your candidate list with any notes already available to you from the match's family. Check any named partner against the candidate's identity and chronology. Keep a name in common as a lead to test with the predicted DNA relationships on both trees [N81].","sources":["N81"],"checked":null,"stated_as":"fact","review":"reviewed"}
