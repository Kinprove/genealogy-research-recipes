claims:
  - {"id":"C-4169aad925d2","kind":"unclassified","anchor":"- **Record the heading.** Union draft registration was created under the Enrollment Act of 3 March 1863. The consolidated lists name men liable to be drafted. They are not service records. A line under a heading such as \"Consolidated list of all persons of Class 1 subject to do military duty\" means the man was enrolled as liable to the draft. It does not show that he served [S1]. The registers are online at Ancestry as U.S., Civil War Draft Registrations Records, 1863–1865, filmed from NARA Record Group 110.\n- **Use the class to check the line's age and marital status.** Class 1 covered men aged 20–35 and unmarried men aged 35–45. A Class 1 man aged over 35 should therefore be unmarried. If the line says otherwise, note the conflict before you use the line to identify him.\n- **Transcribe the identity clues.** Copy the line's age, race, occupation, marital status, birthplace and residence exactly as written.\n- **Do not assert service from a name match.** Assert service only after finding a service record that matches the same identity clues. In the presenter's example, John B. Ellis was a 39-year-old, single, white, Tennessee-born farmer living in Missouri. That fits Class 1, because he was unmarried and aged 35–45. Several men had his name, but none of their service records matched those clues, so she concluded he registered and never served [S1].\n- **Keep that kind of conclusion bounded.** It is a negative inference, and it holds only for the indexes and series actually searched. Record which ones those were.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c5966f613206","kind":"unclassified","anchor":"- **Confirm a CMSR should exist.** CMSRs exist for volunteers only. Nineteenth-century Regular Army men have no CMSR [S5]. For enlisted regulars, the service is in the Registers of Enlistments. For Regular Army officers, start with Heitman's *Historical Register* and then, for service from 1863, the Commission Branch and ACP files in RG 94 (NARA, *Prologue*, Fall 2002). If the man was a regular, finding no CMSR tells you nothing, so go to the records that match his rank.\n- **Sort the cards by date.** One presenter says CMSR images are not filmed in date order, so sort them before reading them as a story [S4].\n- **Copy each card's source note and dates.** For every card, record the source note at the bottom (the original muster roll, payroll, hospital record or book it was taken from) and its dates. Plan to look at that underlying roll [S4].\n- **Check a separate medical-card source when the hospital is unidentified.** If a Union volunteer's CMSR reports sickness but its source note only names a muster roll, check the custodian's finding aid for a separate carded-medical series covering the supported unit and period. If a matching series is available, search for the soldier there and follow any actual hospital or ledger reference supplied, retaining the medical card's own locator and date [S8].\n- **Remember the CMSR is a later compilation.** The War Department compiled Union volunteer CMSRs from 1890 to verify service for pension claims [S5], [H1]. Carding started earlier. Clerks of the Record and Pension Division of the Surgeon General's Office carded medical records from 1887 [H2]. In July 1889 the War Department took that division over as its own Record and Pension Division, which became the Record and Pension Office in 1892 [H3]. One presenter's \"1880s\" [S1] therefore fits the start of medical carding, not the service records. Clerks abstracted every mention of a volunteer's name and unit onto cards and filed together the cards they *assumed* belonged to one man [S5].\n  - One envelope can therefore mix two men. One man can also have a second CMSR under a misspelling or a misfiling [S5].\n  - Check age, enlistment place and description across the cards.\n  - Search spelling variants and other unit filings before treating the envelope as one person.\n- **Confederate soldiers have CMSRs too.** The War Department began compiling them in 1903, under Ainsworth [H4]. Clerks carded Union prison and parole records, captured or other surviving Confederate records [H5], and records borrowed mostly from Southern states [H4]. Start with the *Consolidated Index to Compiled Service Records of Confederate Soldiers* (NARA M253, 535 rolls). Then read the CMSR publication for the state or unit, for example M258 for units raised directly by the Confederate government, M266 for Georgia or M267 for South Carolina [H6]. Check Fold3, FamilySearch and the NARA Catalog for digitized copies. Many Confederate rolls did not survive, so a missing CMSR does not disprove service. Search the state's Confederate pension records as well.\n- **Copy the jacket details.** Record the personal-papers count and any record-and-pension (\"R&P\" or \"bookmark\") notation number. The R&P number points to a numbered document in the Record and Pension Office document files, in Record Group 94 (Records of the Adjutant General's Office). Request that file from the National Archives as a separate item, giving the soldier's name and the R&P number [S6]. The presenter demonstrated this on a Revolutionary War jacket and says these files have never been digitized [S6]. Before you request the file, check the NARA Catalog for the series.\n- **Search under an alias when the jacket gives one.** The same presenter says aliases appear more often in the later Civil War period, when some men deserted and re-enlisted under another name [S6].","sources":["S5","S4","S8","H1","H2","H3","S1","H4","H5","H6","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-389e6d6d2176","kind":"unclassified","anchor":"- **Align the two sources.** Set the dated regimental history or the company record of events beside the card rows [S1].\n- **Record every designation the unit carried, with its dates.** Many regiments carried more than one number or name over the war, for example when organized as a battalion. List each designation with the dates it was used. Then search histories, rosters, maps and prisoner-of-war records under every designation. Do not treat two numbers as two regiments, and do not drop a source because it uses the other number.\n  - Example: a forum participant's ancestor served in the 23rd Mississippi. The regiment was known as the 3rd Mississippi while it served in Kentucky. The regimental history the participant quoted says the War Department changed its number to the 23rd on 19 November 1861. A battle narrative for Fort Donelson (February 1862) used \"Third\", while the battle maps the participant posted labelled it \"23 MS\" [S7].\n  - Limit: matching designations only shows which unit a source describes. They do not place the man in a given battle, so he still needs card rows that cover the period. The participant did not cite the history he quoted, and he did not show the man's service record.\n- **Label every battle row.** A battle is something the *unit* did. Mark each one as one of:\n  - soldier present on both bracketing musters;\n  - soldier absent or sick on a bracketing muster;\n  - no card covers that period.\n- **Example.** Isaiah Tipton enlisted in the 1st Florida Infantry in April 1861. The 1st Florida fought at Shiloh, organized there as the 1st Florida Battalion. His cards show him sick on the musters from February to the end of April 1862. Lefler reads this against the regimental history and concludes that he missed Shiloh [S1]. Label that row \"absent or sick on a bracketing muster\".\n- **Do not add battles from outside his time in the unit.** Never attach to him engagements from before he joined a unit, or from after he left it.\n  - Tipton later moved to the 5th Florida Infantry. The 5th Florida fought at Second Bull Run, Antietam, Fredericksburg, Chancellorsville, Gettysburg, the Wilderness, Spotsylvania, Cold Harbor and the siege of Petersburg. The talk lists these as his battles. The 5th Florida cards shown in the talk are dated from January 1864, when he was promoted Fourth Corporal on 25 January, and he died at Petersburg [S1]. The cited talk confirms neither when he joined the 5th nor a card placing him in each listed battle.\n  - Keep a list like that as the regiment's history, not as his service, until cards cover each period.\n- **A death or casualty card is direct evidence for that event only.** It does not prove presence at earlier engagements [S4].","sources":["S1","S7","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-95b1ceeef64a","kind":"unclassified","anchor":"- **Read \"tr.\" as transferred.** In the demonstration, the streamer first guessed it meant \"trade\" until a viewer corrected him [S3]. Check the roster's abbreviation key, and keep the literal remark.\n- **Record dates with the role the source gives them.** Copy every date beside the remark with its column heading. The roster in the demonstration has a \"date of rank or enlistment\" column [S3], so a date on the line may be the enlistment date, not the transfer date.\n- **Read both units' records.** For the months around the transfer, read the company record of events for the losing unit and for the receiving unit. Note where each was stationed and when it moved [S3].\n- **Worked example [S3].** Jeremiah Alderman was transferred from Co. H, 95th Illinois Infantry, to Co. H, 47th Illinois Infantry.\n  - The 95th's record of events has it at Vicksburg through January–February 1864, embarking there on 9 March 1864 for the Red River expedition.\n  - The 47th left La Grange, Tennessee, on 26 January 1864, embarked at Memphis and reached Vicksburg on 3 February 1864.\n  - The presenter took this to mean both units were at Vicksburg from 3 February to 9 March 1864 and guessed the transfer happened in that window. He called it speculation needing a Civil War specialist. Treat the window as his hypothesis, not as a bound. The NPS unit histories put the 95th on the Meridian campaign (3–25 February 1864) and the 47th at Black River Bridge and on a march to Canton, returning to Vicksburg on 7 March. A transfer also does not require the two companies to be in the same place.\n  - **The conflict:** the date he reads off the roster for the transfer entries is \"January 4th\". If that means 4 January 1864, it falls before the 47th reached Vicksburg, so it does not fit his window. It could be a date of rank or enlistment, an order date, or a date in another year. Resolve it from Alderman's own dated cards, both companies' muster rolls and the transfer order, not from the roster line or the co-location window.\n- **Write a transfer-bounds note:** the earliest and latest possible dates, taken from the soldier's own dated records and the transfer documentation; the place(s) consistent with those records; the sources for each; and whether the transfer is documented or inferred.\n- **Assign movements only where his own records place him in that unit.** Give a unit's movements to the soldier only for periods his cards or other dated records show him in it. Inside the uncertain transfer interval, leave attribution unresolved.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-83c5a319ac9e","kind":"unclassified","anchor":"- **Record the database's stated coverage.** The Civil War Soldiers and Sailors System (CWSS) covers sailors only through about 18,000 African-American sailors. That data was built by a Howard University research team from enlistment records and the quarterly muster rolls of Navy vessels [S2].\n- **A \"not found\" outside that set is not evidence.** For any other Navy man, a CWSS miss says nothing either way.\n- **Route Navy men elsewhere.** Search Navy enlistment records, the quarterly muster rolls of the vessels he served on, and published local service lists [S2]. For enlistments, use the *Weekly Returns of Enlistments at Naval Rendezvous*, January 1855 to August 1891 (NARA M1953, Record Group 24). Fold3 has it complete, and FamilySearch has the images to browse [H7]. For a Navy pension, start with the *General Index to Pension Files, 1861–1934* (T288), which includes Navy veterans and widows. Then try the naval part of the miscellaneous section of the *Organization Index* (T289). Approved Navy widows' files are NARA M1279, which has a book index [H8]. The presenter found published service lists with a Google Books phrase search for \"Civil War\" and \"sailors\". One result was George C. Gilmore's *Manchester Men: Soldiers and Sailors in the Civil War, 1861–'66* (1898), for Manchester, New Hampshire [S2].\n- **Re-check coverage at the time of use.** In 2016 the site said more records would be added, so record the coverage statement as it reads on the day you search.\n- **For any database, note the date and stated scope of each search.** A miss that falls inside the stated coverage is still only a search result. Name the original series that would settle the question.","sources":["S2","H7","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-93d339a9c5c2","kind":"historical","anchor":"Approved pension files of Navy veterans themselves are a separate series from M1279: NARA M1469, \"Navy Survivors' Certificates\", 1861–1910, arranged by certificate number [H9].","sources":["H9"],"checked":null,"stated_as":"fact","review":"reviewed"}
