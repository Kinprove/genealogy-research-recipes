  - {"id":"S38","kind":"catalogue","urls":["https://www.familysearch.org/en/search/collection/1932407"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"2026-11-18, read the M384 collection description, including surname order within a unit and microfilm surname ranges.","entry_sha256":"09f6718708618edf321300b507231139a8f941bd2adc538a4847215e5ae8e009","claims":["C-e686ef8c4945"],"review":"reviewed"}
  - {"id":"S39","kind":"catalogue","urls":["https://www.archives.gov/digitization/digitized-by-partners"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"2026-11-18, read the M0384 Maryland Union CMSR row identifying Fold3 as a digitization partner.","entry_sha256":"8e522c6039135fa82aff7f08194105deab3ea0143837833fcc9978b902f369bf","claims":["C-e686ef8c4945"],"review":"reviewed"}
  - {"id":"S40","kind":"pdf","urls":["https://msa.maryland.gov/megafile/msa/brg/brg1/brg76/000000/000004/000000/000003/pdf/mdsa_brg76_4_3.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"2026-11-18, read the Sixth Maryland Infantry entries in the Civil War muster-roll index for 1862, including Company I (11381) and Company K (11382).","entry_sha256":"dbe2888a481002dcda3b3f1e27220452d9c3a5eb24cc36ad95fa661f6426db29","claims":["C-4c078ace400e"],"review":"reviewed"}
  - {"id":"S41","kind":"pdf","urls":["https://apps.mht.maryland.gov/medusa/PDF/NR_PDFs/NR-206.pdf"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"2026-11-18, read the nomination's descriptions of the former railside community, railroad junction and Monocacy River.","entry_sha256":"d991b14b6969b0b057352ab886955c32428f6a0742b785bfb5b026146941c29e","claims":["C-38ff1e058b06"],"review":"reviewed"}
  - {"id":"S42","kind":"web-page","urls":["https://narations.blogs.archives.gov/?p=1282"],"published":"2010-03-26","retrieved":"2026-11-18","access":"read","rights":null,"basis":"2026-11-18, read the explanation of beginning and ending ranks and numbers matching the backs of cards.","entry_sha256":"077be6a6ec84fb1237f00e870e45db1498f121391a0d31b90ec0d8410963f82b","claims":["C-80e63bafe47d","C-0db9bc0ffabb"],"review":"reviewed"}
claims:
  - {"id":"C-4169aad925d2","kind":"unclassified","anchor":"- **Record the heading.** Union draft registration was created under the Enrollment Act of 3 March 1863. The consolidated lists name men liable to be drafted. They are not service records. A line under a heading such as \"Consolidated list of all persons of Class 1 subject to do military duty\" means the man was enrolled as liable to the draft. It does not show that he served [S1]. The registers are online at Ancestry as U.S., Civil War Draft Registrations Records, 1863–1865, filmed from NARA Record Group 110.\n- **Use the class to check the line's age and marital status.** Class 1 covered men aged 20–35 and unmarried men aged 35–45. A Class 1 man aged over 35 should therefore be unmarried. If the line says otherwise, note the conflict before you use the line to identify him.\n- **Transcribe the identity clues.** Copy the line's age, race, occupation, marital status, birthplace and residence exactly as written.\n- **Do not assert service from a name match.** Assert service only after finding a service record that matches the same identity clues. In the presenter's example, John B. Ellis was a 39-year-old, single, white, Tennessee-born farmer living in Missouri. That fits Class 1, because he was unmarried and aged 35–45. Several men had his name, but none of their service records matched those clues, so she concluded he registered and never served [S1].\n- **Keep that kind of conclusion bounded.** It is a negative inference, and it holds only for the indexes and series actually searched. Record which ones those were.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c5966f613206","kind":"unclassified","anchor":"- **Confirm a CMSR should exist.** CMSRs exist for volunteers only. Nineteenth-century Regular Army men have no CMSR [S5]. For enlisted regulars, the service is in the Registers of Enlistments. For Regular Army officers, start with Heitman's *Historical Register* and then, for service from 1863, the Commission Branch and ACP files in RG 94 (NARA, *Prologue*, Fall 2002). If the man was a regular, finding no CMSR tells you nothing, so go to the records that match his rank.\n- **Sort the cards by date.** One presenter says CMSR images are not filmed in date order, so sort them before reading them as a story [S4].\n- **Copy each card's source note and dates.** For every card, record the source note at the bottom (the original muster roll, payroll, hospital record or book it was taken from) and its dates. Plan to look at that underlying roll [S4].\n- **Check a separate medical-card source when the hospital is unidentified.** If a Union volunteer's CMSR reports sickness but its source note only names a muster roll, check the custodian's finding aid for a separate carded-medical series covering the supported unit and period. If a matching series is available, search for the soldier there and follow any actual hospital or ledger reference supplied, retaining the medical card's own locator and date [S8].\n- **Remember the CMSR is a later compilation.** The War Department compiled Union volunteer CMSRs from 1890 to verify service for pension claims [S5], [H1]. Carding started earlier. Clerks of the Record and Pension Division of the Surgeon General's Office carded medical records from 1887 [H2]. In July 1889 the War Department took that division over as its own Record and Pension Division, which became the Record and Pension Office in 1892 [H3]. One presenter's \"1880s\" [S1] therefore fits the start of medical carding, not the service records. Clerks abstracted every mention of a volunteer's name and unit onto cards and filed together the cards they *assumed* belonged to one man [S5].\n  - One envelope can therefore mix two men. One man can also have a second CMSR under a misspelling or a misfiling [S5].\n  - Check age, enlistment place and description across the cards.\n  - Search spelling variants and other unit filings before treating the envelope as one person.\n- **Confederate soldiers have CMSRs too.** The War Department began compiling them in 1903, under Ainsworth [H4]. Clerks carded Union prison and parole records, captured or other surviving Confederate records [H5], and records borrowed mostly from Southern states [H4]. Start with the *Consolidated Index to Compiled Service Records of Confederate Soldiers* (NARA M253, 535 rolls). Then read the CMSR publication for the state or unit, for example M258 for units raised directly by the Confederate government, M266 for Georgia or M267 for South Carolina [H6]. Check Fold3, FamilySearch and the NARA Catalog for digitized copies. Many Confederate rolls did not survive, so a missing CMSR does not disprove service. Search the state's Confederate pension records as well.\n- **Copy the jacket details.** Record the personal-papers count and any record-and-pension (\"R&P\" or \"bookmark\") notation number. The R&P number points to a numbered document in the Record and Pension Office document files, in Record Group 94 (Records of the Adjutant General's Office). Request that file from the National Archives as a separate item, giving the soldier's name and the R&P number [S6]. The presenter demonstrated this on a Revolutionary War jacket and says these files have never been digitized [S6]. Before you request the file, check the NARA Catalog for the series.\n- **Search under an alias when the jacket gives one.** The same presenter says aliases appear more often in the later Civil War period, when some men deserted and re-enlisted under another name [S6].","sources":["S5","S4","S8","H1","H2","H3","S1","H4","H5","H6","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-66cdc7f1869e","kind":"method","anchor":"- **Leave his fate open when the cards end in \"deserted\".** Keep the remark and its date as his last status as written. It ends the company's record of him, not his story, so do not write that he went home, survived or died until a record says so. Search his widow's obituary for an account of what became of him, including in papers of nearby towns where she was known but did not live. Log what you find as a late, secondhand account that conflicts with the card, not as proof. In one blogger's case, the record gave desertion on a stated date with no record of a return home. The widow's obituary, published 66 years later in a nearby rural town where she did not live, said only \"We understand that Mrs. Smelcer's husband was killed during the war\" [S9].","sources":["S9"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-389e6d6d2176","kind":"unclassified","anchor":"- **Align the two sources.** Set the dated regimental history or the company record of events beside the card rows [S1].\n- **Record every designation the unit carried, with its dates.** Many regiments carried more than one number or name over the war, for example when organized as a battalion. List each designation with the dates it was used. Then search histories, rosters, maps and prisoner-of-war records under every designation. Do not treat two numbers as two regiments, and do not drop a source because it uses the other number.\n  - Example: a forum participant's ancestor served in the 23rd Mississippi. The regiment was known as the 3rd Mississippi while it served in Kentucky. The regimental history the participant quoted says the War Department changed its number to the 23rd on 19 November 1861. A battle narrative for Fort Donelson (February 1862) used \"Third\", while the battle maps the participant posted labelled it \"23 MS\" [S7].\n  - Limit: matching designations only shows which unit a source describes. They do not place the man in a given battle, so he still needs card rows that cover the period. The participant did not cite the history he quoted, and he did not show the man's service record.\n- **Label every battle row.** A battle is something the *unit* did. Mark each one as one of:\n  - soldier present on both bracketing musters;\n  - soldier absent or sick on a bracketing muster;\n  - no card covers that period.\n- **Example.** Isaiah Tipton enlisted in the 1st Florida Infantry in April 1861. The 1st Florida fought at Shiloh, organized there as the 1st Florida Battalion. His cards show him sick on the musters from February to the end of April 1862. Lefler reads this against the regimental history and concludes that he missed Shiloh [S1]. Label that row \"absent or sick on a bracketing muster\".\n- **Do not add battles from outside his time in the unit.** Never attach to him engagements from before he joined a unit, or from after he left it.\n  - Tipton later moved to the 5th Florida Infantry. The 5th Florida fought at Second Bull Run, Antietam, Fredericksburg, Chancellorsville, Gettysburg, the Wilderness, Spotsylvania, Cold Harbor and the siege of Petersburg. The talk lists these as his battles. The 5th Florida cards shown in the talk are dated from January 1864, when he was promoted Fourth Corporal on 25 January, and he died at Petersburg [S1]. The cited talk confirms neither when he joined the 5th nor a card placing him in each listed battle.\n  - Keep a list like that as the regiment's history, not as his service, until cards cover each period.\n- **A death or casualty card is direct evidence for that event only.** It does not prove presence at earlier engagements [S4].","sources":["S1","S7","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-95b1ceeef64a","kind":"unclassified","anchor":"- **Read \"tr.\" as transferred.** In the demonstration, the streamer first guessed it meant \"trade\" until a viewer corrected him [S3]. Check the roster's abbreviation key, and keep the literal remark.\n- **Record dates with the role the source gives them.** Copy every date beside the remark with its column heading. The roster in the demonstration has a \"date of rank or enlistment\" column [S3], so a date on the line may be the enlistment date, not the transfer date.\n- **Read both units' records.** For the months around the transfer, read the company record of events for the losing unit and for the receiving unit. Note where each was stationed and when it moved [S3].\n- **Worked example [S3].** Jeremiah Alderman was transferred from Co. H, 95th Illinois Infantry, to Co. H, 47th Illinois Infantry.\n  - The 95th's record of events has it at Vicksburg through January–February 1864, embarking there on 9 March 1864 for the Red River expedition.\n  - The 47th left La Grange, Tennessee, on 26 January 1864, embarked at Memphis and reached Vicksburg on 3 February 1864.\n  - The presenter took this to mean both units were at Vicksburg from 3 February to 9 March 1864 and guessed the transfer happened in that window. He called it speculation needing a Civil War specialist. Treat the window as his hypothesis, not as a bound. The NPS unit histories put the 95th on the Meridian campaign (3–25 February 1864) and the 47th at Black River Bridge and on a march to Canton, returning to Vicksburg on 7 March. A transfer also does not require the two companies to be in the same place.\n  - **The conflict:** the date he reads off the roster for the transfer entries is \"January 4th\". If that means 4 January 1864, it falls before the 47th reached Vicksburg, so it does not fit his window. It could be a date of rank or enlistment, an order date, or a date in another year. Resolve it from Alderman's own dated cards, both companies' muster rolls and the transfer order, not from the roster line or the co-location window.\n- **Write a transfer-bounds note:** the earliest and latest possible dates, taken from the soldier's own dated records and the transfer documentation; the place(s) consistent with those records; the sources for each; and whether the transfer is documented or inferred.\n- **Assign movements only where his own records place him in that unit.** Give a unit's movements to the soldier only for periods his cards or other dated records show him in it. Inside the uncertain transfer interval, leave attribution unresolved.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-05d54aa5ae5d","kind":"portal-availability","anchor":"Check the current CMSR digitization listing for the supported army, state and organization before choosing an access route. NARA lists all Confederate and some Union organizations on Ancestry/Fold3, so do not assume that a Union record always requires an offline request or that an online Confederate index is the full file. Open the available jacket and card images and record their extent; use the established custodian route for material not digitized. [S11 @2026-11-16](https://www.pricegen.com/remembering-appomattox-the-civil-wars-end-160-years-later/) [S12 @2026-11-16](https://www.archives.gov/research/military/army/compiled-military-service-records)","sources":["S11","S12"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-83c5a319ac9e","kind":"unclassified","anchor":"- **Record the database's stated coverage.** The Civil War Soldiers and Sailors System (CWSS) covers sailors only through about 18,000 African-American sailors. That data was built by a Howard University research team from enlistment records and the quarterly muster rolls of Navy vessels [S2].\n- **A \"not found\" outside that set is not evidence.** For any other Navy man, a CWSS miss says nothing either way.\n- **Route Navy men elsewhere.** Search Navy enlistment records, the quarterly muster rolls of the vessels he served on, and published local service lists [S2]. For enlistments, use the *Weekly Returns of Enlistments at Naval Rendezvous*, January 1855 to August 1891 (NARA M1953, Record Group 24). Fold3 has it complete, and FamilySearch has the images to browse [H7]. For a Navy pension, start with the *General Index to Pension Files, 1861–1934* (T288), which includes Navy veterans and widows. Then try the naval part of the miscellaneous section of the *Organization Index* (T289). Approved Navy widows' files are NARA M1279, which has a book index [H8]. The presenter found published service lists with a Google Books phrase search for \"Civil War\" and \"sailors\". One result was George C. Gilmore's *Manchester Men: Soldiers and Sailors in the Civil War, 1861–'66* (1898), for Manchester, New Hampshire [S2].\n- **Re-check coverage at the time of use.** In 2016 the site said more records would be added, so record the coverage statement as it reads on the day you search.\n- **For any database, note the date and stated scope of each search.** A miss that falls inside the stated coverage is still only a search result. Name the original series that would settle the question.","sources":["S2","H7","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e09be0e8ab77","kind":"historical","anchor":"- **Do not rule out service from birthplace or citizenship.** Foreign birth, alien status during the war or a naturalization decades later does not show that he did not serve, so search the service and pension indexes for him anyway. The law expected alien soldiers: section 21 of the Act of 17 July 1862 (ch. 200) let any alien aged 21 or over who had enlisted in the regular or volunteer army and been honorably discharged become a citizen on petition, without a prior declaration of intention, on one year's residence and competent proof of the discharge [H10]. Read any naturalization file you find for a discharge or service reference. The Enrollment Act of 3 March 1863 made only citizens, and foreign-born men who had declared on oath their intention to become citizens, aged 20–45, liable to the draft [H11]. A non-declarant alien's absence from the draft lists therefore says nothing about whether he volunteered. A genealogy video raises the same trap [S10†]; only its title and channel could be checked; its transcript could not be opened.","sources":["H10","H11","S10"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-9437cf201134","kind":"historical","anchor":"For the Navy pension route above, approved pension files of Navy veterans themselves are a separate series from M1279: NARA M1469, \"Navy Survivors' Certificates\", 1861–1910, arranged by certificate number [H9].","sources":["H9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-24dd37ea57f3","kind":"method","anchor":"**Search Union service records for Quakers.** Include Union Army enlistments in the search even when the person's Society of Friends membership is documented, following advice from the available excerpt [S14] and illustrated by David Haworth's Union service [S20].","sources":["S14","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e81e0ec41a34","kind":"historical","anchor":"**Read commutation against the date of the draft.** Use the commutation lead from the available excerpt [S14]. Section 13 of the Enrollment Act of 3 March 1863 allowed a notified draftee to furnish an acceptable substitute or pay the amount set for that draft, up to $300. Either action released him from liability under that draft [S21]. Check for a payment or substitution entry before inferring what happened to the man.","sources":["S14","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5ec04c48541","kind":"historical","anchor":"**Identify who granted a Quaker exemption.** The amounts and salt-work lead come from the available excerpt [S14]. North Carolina's ordinance of 12 May 1862 required eligible Friends called to service to pay $100 for exemption and allowed the governor to detail those unable to pay to salt manufacture or hospital work [S22]. The Confederate act of 11 October 1862 required eligible members to furnish a substitute or pay a $500 tax [S23]. For a Wilmington salt-works entry, check state exemption or detail records before treating the work as Confederate Army service. The Jonathan Worth papers are a lead for both exemptions and the Wilmington salt works [S24].","sources":["S14","S22","S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dd73ecb7e73f","kind":"custody","anchor":"**Follow a Charlottesville hospital entry into the hospital's register.** If a CMSR names the Confederate General Hospital at Charlottesville, Virginia, follow the register lead from the available excerpt [S13 @2026-11-18]. Use the index (chapter VI, volume 216) to find the patient entry in the National Archives register, 1861–1865 (volumes 214–215) [S18 @2026-11-18]. Record the disposition with its date when given. Distinguish death, return to duty and discharge from service [S19 @2026-11-18]. Where entries give an organization and admission date, group by both fields to count a unit's admissions on the same date. Label the count as admissions in this register.","sources":["S13","S18","S19"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-80e63bafe47d","kind":"method","anchor":"**Inventory the inner personal-papers jacket.** Separate the muster-roll abstracts from the individual documents filed inside the CMSR [S31]. Follow the example from the available excerpt [S17] and count the enclosures you can actually inspect. Use the outer jacket count as a lead when enclosures appear to be missing. Match any listed card numbers to the numbers on the backs of the cards before assigning a meaning to a jacket number [S42].","sources":["S31","S17","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0db9bc0ffabb","kind":"method","anchor":"**Use jacket ranks as endpoints and read the dated entries between them.** Follow the example from the available excerpt [S17]. If the jacket gives a rank in and a rank out, record them as endpoints and use dated cards to establish changes [S42]. Read the bookmark for capture, confinement, parole and the orders behind a desertion remark. For restoration without trial, record the order and any absence the record explicitly retains. For a court-martial, record each offense, finding and sentence separately. Follow the cited order when the disposition is unclear [S33].","sources":["S17","S42","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-713b1a0cac5e","kind":"historical","anchor":"**Use Annapolis as a lead to prisoner records.** Follow the suggestion from the available excerpt [S17] and use the prisoner-of-war slips to establish whether capture or parole occurred. Record a City Point parole, a report at College Green Barracks in Annapolis and arrival at Camp Parole as distinct events when documented. Search the separate College Green Barracks and Camp Parole rolls for the matching entry [S34]. One documented 1863 itinerary records all three stops [S35].","sources":["S17","S34","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0e2949886714","kind":"method","anchor":"**Interpret hospital terms in their period.** For an unfamiliar diagnosis, use Hooper's *Lexicon Medicum*, following advice from the available excerpt [S17]. The 1843 American edition is one reference [S36]. Keep the term as written and label any gloss as an interpretation of the record.","sources":["S17","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-610c786297b1","kind":"portal-availability","anchor":"**Use the correspondence index when the CMSR or pension review leaves a dispute unresolved.** Follow the lead from the available excerpt [S16 @2026-11-18]. Search the *Index to General Correspondence of the Record and Pension Office, 1889–1904* (M686), listed on Ancestry [S27 @2026-11-18] and FamilySearch. Match the card to the soldier's unit and the subject of the inquiry. Carry its file reference to the Document File (NAID 300385) or Record Cards (NAID 588796), as indicated. Look for a correction of muster when the claimed rank is missing and for correspondence about removing a disputed desertion charge. The years in the index title date the correspondence and can be later than the service in question [S28 @2026-11-18].","sources":["S16","S27","S28"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e56695f00bac","kind":"method","anchor":"**Distinguish commission, duty, federal muster and later correction.** Follow the comparison from the available excerpt [S16]. For a Union volunteer officer, record the commission date, date of entry on duty in the grade, original muster date and any effective date granted by a later correction as separate observations [S29]. Compare the requested grade and date with the state adjutant general's papers and the federal ruling when enclosed [S30]. Record the company, who left the vacancy and why. If the predecessor's promotion opened the vacancy, look for that officer's own muster correction to corroborate the sequence [S29].","sources":["S16","S29","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-66e0285de814","kind":"method","anchor":"**Count repeated Dyer histories once.** Use the check from the available excerpt [S17]. The Civil War Soldiers and Sailors System used Dyer's *Compendium* for Union regimental histories [S32]. Compare wording and source credits before treating another site's account of the unit as independent evidence.","sources":["S17","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4f4f756330c3","kind":"method","anchor":"**Put company movements on their own rows.** Use the company-level comparison from the available excerpt [S17]. For a Union volunteer organization, find the corresponding company letter under the regiment in NARA microfilm M594, *Compiled Records Showing Service of Military Units in Volunteer Union Organizations* [S31]. Keep the company dates, endpoints and reported march distances beside the regimental account. Use them to test ambiguous place names against the preceding and following stations before assigning a location.","sources":["S17","S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-38ff1e058b06","kind":"historical","anchor":"**Keep Monocacy Junction distinct from the river.** Use the distinction from the available excerpt [S17]. Read Monocacy Junction as a place-name that can refer to the railroad junction or the adjacent community [S41]. When a card gives only Monocacy, use the route and the wording of the entry to decide which feature it means.","sources":["S17","S41"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d3b3669caa25","kind":"historical","anchor":"**Match capture to the dated engagement.** Use the date-and-place comparison from the available excerpt [S17]. A Winchester capture on 15 June 1863 fits the Second Battle of Winchester of 13–15 June 1863. The Third Battle was on 19 September 1864 [S37]. Record capture as the documented event and label the battle association as inferred unless the record names the engagement.","sources":["S17","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8ae07ab57174","kind":"method","anchor":"**Use a state roster when the Union CMSR images are unavailable.** Identify the candidate unit from a state adjutant general's roster or report, using the approach from the available excerpt [S15]. For Wisconsin, start with the *Roster of Wisconsin Volunteers, War of the Rebellion, 1861–1865* [S25]. Use the unit as a lead into the separate carded medical records for Union volunteers in RG 94, entry PI-17 534. Look under state, organization number and surname initial [S26].","sources":["S15","S25","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ff3006c60f74","kind":"method","anchor":"**Treat repeated Soldiers and Sailors hits as index entries.** Follow the comparison from the available excerpt [S17]. Compare side, state and regiment and follow the entries into the CMSR before deciding how many people they represent. The underlying index can have multiple cards for one person, including for alternate names or service in different regiments [S32].","sources":["S17","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e686ef8c4945","kind":"portal-availability","anchor":"**Browse the Maryland Union jackets by unit and surname.** Use the browse sequence from the available excerpt [S17 @2026-11-18]. For a name-search miss, start with the M384 Maryland Union CMSR run that NARA lists on Fold3 [S39 @2026-11-18]. Find the regiment and the surname range before looking for the soldier's jacket. Within each unit M384 is arranged by surname [S38 @2026-11-18].","sources":["S17","S39","S38"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4c078ace400e","kind":"historical","anchor":"**Check a Sixth Maryland Company J reading against Company I.** Test the Company I reading suggested from the available excerpt [S17] against the muster records. The Maryland muster-roll index lists Company I followed by Company K for the Sixth Maryland Infantry [S40]. Preserve the original reading and use the man's muster record to confirm the company.","sources":["S17","S40"],"checked":null,"stated_as":"fact","review":"reviewed"}
