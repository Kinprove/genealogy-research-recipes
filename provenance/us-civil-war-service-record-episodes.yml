claims:
  - {"id":"C-4169aad925d2","kind":"method","anchor":"- **Record the heading.** Union draft registration was created under the Enrollment Act of 3 March 1863. The consolidated lists name men liable to be drafted. They are not service records. A line under a heading such as \"Consolidated list of all persons of Class 1 subject to do military duty\" means the man was enrolled as liable to the draft. It does not show that he served [S1]. Search for the collection titled U.S., Civil War Draft Registrations Records, 1863–1865, filmed from NARA Record Group 110.\n- **Use the class to check the line's age and marital status.** Class 1 covered men aged 20–35 and unmarried men aged 35–45. A Class 1 man aged over 35 should therefore be unmarried. If the line says otherwise, note the conflict before you use the line to identify him.\n- **Transcribe the identity clues.** Copy the line's age, race, occupation, marital status, birthplace and residence exactly as written.\n- **Match identity before assigning service.** The Class 1 registration for John B. Ellis, a single 39-year-old Tennessee-born farmer in Missouri, fit the enrollment criteria. The same-named service records examined did not fit his identifiers [S1]. Record the registration and keep service unresolved.\n- **Keep that kind of conclusion bounded.** It is a negative inference, and it holds only for the indexes and series actually searched. Record which ones those were.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c5966f613206","kind":"method","anchor":"- **Confirm a CMSR should exist.** CMSRs exist for volunteers only. Nineteenth-century Regular Army men have no CMSR [S5]. For enlisted regulars, the service is in the Registers of Enlistments. For Regular Army officers, start with Heitman's *Historical Register* and then, for service from 1863, the Commission Branch and ACP files in RG 94 (NARA, *Prologue*, Fall 2002). If the man was a regular, finding no CMSR tells you nothing, so go to the records that match his rank.\n- **Sort the cards by date.** One presenter says CMSR images are not filmed in date order, so sort them before reading them as a story [S4].\n- **Copy each card's source note and dates.** For every card, record the source note at the bottom (the original muster roll, payroll, hospital record or book it was taken from) and its dates. Plan to look at that underlying roll [S4].\n- **Check a separate medical-card source when the hospital is unidentified.** If a Union volunteer's CMSR reports sickness but its source note only names a muster roll, check the custodian's finding aid for a separate carded-medical series covering the supported unit and period. If a matching series is available, search for the soldier there and follow any actual hospital or ledger reference supplied, retaining the medical card's own locator and date [S8].\n- **Remember the CMSR is a later compilation.** The War Department compiled Union volunteer CMSRs from 1890 to verify service for pension claims [S5], [H1]. Carding started earlier. Clerks of the Record and Pension Division of the Surgeon General's Office carded medical records from 1887 [H2]. In July 1889 the War Department took that division over as its own Record and Pension Division, which became the Record and Pension Office in 1892 [H3]. Clerks abstracted every mention of a volunteer's name and unit onto cards and filed together the cards they *assumed* belonged to one man [S5].\n  - One envelope can therefore mix two men. One man can also have a second CMSR under a misspelling or a misfiling [S5].\n  - Check age, enlistment place and description across the cards.\n  - Search spelling variants and other unit filings before treating the envelope as one person.\n- **Confederate soldiers have CMSRs too.** The War Department began compiling them in 1903, under Ainsworth [H4]. Clerks carded Union prison and parole records, captured or other surviving Confederate records [H5], and records borrowed mostly from Southern states [H4]. Start with the *Consolidated Index to Compiled Service Records of Confederate Soldiers* (NARA M253, 535 rolls). Then read the CMSR publication for the state or unit, for example M258 for units raised directly by the Confederate government, M266 for Georgia or M267 for South Carolina [H6]. Check Fold3, FamilySearch and the NARA Catalog for digitized copies. Many Confederate rolls did not survive, so a missing CMSR does not disprove service. Search the state's Confederate pension records as well.\n- **Copy the jacket details.** Record the personal-papers count and any record-and-pension (R&P or bookmark) number. On the Revolutionary War jacket used to explain the notation, the number pointed to a separate Record and Pension Office document [S6]. For a Civil War jacket with this notation, check the relevant RG 94 series by number and historical soldier's name. Verify the current access route for that document.\n- **Search under an alias when the jacket gives one.** The same presenter says aliases appear more often in the later Civil War period, when some men deserted and re-enlisted under another name [S6].","sources":["S5","S4","S8","H1","H2","H3","H4","H5","H6","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-66cdc7f1869e","kind":"method","anchor":"- **Leave a soldier's fate open when the cards end in desertion.** Record the date and wording, then check later casualty, prisoner and family records and newspapers in nearby towns. Mrs. Smelcer's obituary appeared 66 years later in a town where she did not live. Its wording attributed her husband's wartime death to hearsay [S9]. Keep the two observations separately until a dated record establishes what happened after his disappearance.","sources":["S9"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-389e6d6d2176","kind":"method","anchor":"- **Align the two sources.** Set the dated regimental history or the company record of events beside the card rows [S1].\n- **Record every designation the unit carried, with its dates.** Many regiments carried more than one number or name over the war, for example when organized as a battalion. List each designation with the dates it was used. Then search histories, rosters, maps and prisoner-of-war records under every designation. Do not treat two numbers as two regiments, and do not drop a source because it uses the other number.\n  - At Fort Donelson, a battle narrative calls a Mississippi regiment the Third, while maps label it 23 MS. The forum post quoting an unidentified history dates the redesignation to 19 November 1861 [S7]. Search both names, verify the change in a dated unit record, and check the soldier's own cards before assigning him the battle.\n- **Label every battle row.** A battle is something the *unit* did. Mark each one as one of:\n  - soldier present on both bracketing musters;\n  - soldier absent or sick on a bracketing muster;\n  - no card covers that period.\n- **Test apparent presence against sick and absence cards.** Isaiah Tipton's 1st Florida muster record put him away sick from February through April 1862, spanning the unit's action at Shiloh [S1]. Record the unit's battle and the soldier's illness on separate rows.\n- **Do not add battles from outside his time in the unit.** Never attach to him engagements from before he joined a unit, or from after he left it.\n  - In the 5th Florida, Tipton's promotion to Fourth Corporal is dated 25 January 1864. The cited records give no transfer date placing him with that regiment at Gettysburg in 1863 [S1]. Leave earlier battles on the unit timeline until a dated personal record supports the link.\n- **A death or casualty card is direct evidence for that event only.** It does not prove presence at earlier engagements [S4].","sources":["S1","S7","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-95b1ceeef64a","kind":"method","anchor":"- **Check the abbreviation key.** Keep the literal roster remark `tr.` alongside its expansion as transferred when the destination unit and the roster key support that reading [S3].\n- **Record dates with the role the source gives them.** Copy every date beside the remark with its column heading. The roster in the demonstration has a \"date of rank or enlistment\" column [S3], so a date on the line may be the enlistment date, not the transfer date.\n- **Read both units' records.** For the months around the transfer, read the company record of events for the losing unit and for the receiving unit. Note where each was stationed and when it moved [S3].\n- **Test a proposed transfer interval against both unit histories.** Jeremiah Alderman's roster links Company H of the 95th Illinois to Company H of the 47th. A Vicksburg overlap from 3 February to 9 March 1864 was proposed from records of events [S3]. The 95th's history puts it on the Meridian campaign on 3–25 February [H12]. The 47th's history puts it at Black River Bridge and on the march to Canton, returning to Vicksburg on 7 March [H13]. The January 4 roster date sits in a rank-or-enlistment column [S3]. Leave the transfer date open until Alderman's own cards, muster rolls or order date it. Companies could exchange a man without meeting.\n- **Write a transfer-bounds note:** the earliest and latest possible dates, taken from the soldier's own dated records and the transfer documentation; the place(s) consistent with those records; the sources for each; and whether the transfer is documented or inferred.\n- **Assign movements only where his own records place him in that unit.** Give a unit's movements to the soldier only for periods his cards or other dated records show him in it. Inside the uncertain transfer interval, leave attribution unresolved.","sources":["S3","H12","H13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05d54aa5ae5d","kind":"portal-availability","anchor":"Check the current CMSR digitization listing for the supported army, state and organization before choosing an access route. NARA lists all Confederate and some Union organizations on Ancestry/Fold3, so do not assume that a Union record always requires an offline request or that an online Confederate index is the full file. Open the available jacket and card images and record their extent; use the established custodian route for material not digitized. [S11 @2026-11-16](https://www.pricegen.com/remembering-appomattox-the-civil-wars-end-160-years-later/) [S12 @2026-11-16](https://www.archives.gov/research/military/army/compiled-military-service-records)","sources":["S11","S12"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-83c5a319ac9e","kind":"portal-availability","anchor":"- **Check the sailor database's scope.** The National Park Service describes its Civil War Soldiers and Sailors System as containing approximately 18,000 African American sailors [H14 @2026-11-19].","sources":["H14"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-e09be0e8ab77","kind":"historical","anchor":"- **Do not rule out service from birthplace or citizenship.** Foreign birth, alien status during the war or a naturalization decades later does not show that he did not serve, so search the service and pension indexes for him anyway. The law expected alien soldiers: section 21 of the Act of 17 July 1862 (ch. 200) let any alien aged 21 or over who had enlisted in the regular or volunteer army and been honorably discharged become a citizen on petition, without a prior declaration of intention, on one year's residence and competent proof of the discharge [H10]. Read any naturalization file you find for a discharge or service reference. The Enrollment Act of 3 March 1863 made only citizens, and foreign-born men who had declared on oath their intention to become citizens, aged 20–45, liable to the draft [H11]. A non-declarant alien's absence from the draft lists therefore says nothing about whether he volunteered. A genealogy video raises the same trap [S10†]; only its title and channel could be checked; its transcript could not be opened.","sources":["H10","H11","S10"],"checked":"2026-11-16","stated_as":"observation","review":"reviewed"}
  - {"id":"C-9437cf201134","kind":"historical","anchor":"For the Navy pension route above, approved pension files of Navy veterans themselves are a separate series from M1279: NARA M1469, \"Navy Survivors' Certificates\", 1861–1910, arranged by certificate number [H9].","sources":["H9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-24dd37ea57f3","kind":"method","anchor":"**Search Union service records for Quakers.** Include Union volunteer rosters even for a documented member of the Society of Friends, following the advice from the available excerpt [S14]. David M. Haworth served in the Third Tennessee Infantry [S20]. Use a matching soldier's own dated records to establish service.","sources":["S14","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e81e0ec41a34","kind":"historical","anchor":"**Read commutation against the date of the draft.** Use the commutation lead from the available excerpt [S14]. Section 13 of the Enrollment Act of 3 March 1863 allowed a notified draftee to furnish an acceptable substitute or pay the amount set for that draft, up to $300. Either action released him from liability under that draft [S21]. Check for a payment or substitution entry before inferring what happened to the man.","sources":["S14","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5ec04c48541","kind":"historical","anchor":"**Identify who granted a Quaker exemption.** The amounts and salt-work lead come from the available excerpt [S14]. North Carolina's ordinance of 12 May 1862 required eligible Friends called to service to pay $100 for exemption and allowed the governor to detail those unable to pay to salt manufacture or hospital work [S22]. The Confederate act of 11 October 1862 required eligible members to furnish a substitute or pay a $500 tax [S23]. For a Wilmington salt-works entry, check state exemption or detail records before treating the work as Confederate Army service. The Jonathan Worth papers are a lead for both exemptions and the Wilmington salt works [S24].","sources":["S14","S22","S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dd73ecb7e73f","kind":"custody","anchor":"**Follow a Charlottesville hospital entry into the hospital's register.** If a CMSR names the Confederate General Hospital at Charlottesville, Virginia, follow the register lead from the available excerpt [S13 @2026-11-18]. Use the index (chapter VI, volume 216) to find the patient entry in the National Archives register, 1861–1865 (volumes 214–215) [S18 @2026-11-18]. Record the disposition with its date when given. Distinguish death, return to duty and discharge from service [S19 @2026-11-18]. Where entries give an organization and admission date, group by both fields to count a unit's admissions on the same date. Label the count as admissions in this register.","sources":["S13","S18","S19"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-80e63bafe47d","kind":"method","anchor":"**Inventory the inner personal-papers jacket.** Separate the muster-roll abstracts from the individual documents filed inside the CMSR [S31]. Follow the example from the available excerpt [S17] and count the enclosures you can actually inspect. Use the outer jacket count as a lead when enclosures appear to be missing. Match any listed card numbers to the numbers on the backs of the cards before assigning a meaning to a jacket number [S42].","sources":["S31","S17","S42"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0db9bc0ffabb","kind":"method","anchor":"**Use jacket ranks as endpoints and read the dated entries between them.** Follow the example from the available excerpt [S17]. If the jacket gives a rank in and a rank out, record them as endpoints and use dated cards to establish changes [S42]. Read the bookmark for capture, confinement, parole and the orders behind a desertion remark. For restoration without trial, record the order and any absence the record explicitly retains. For a court-martial, record each offense, finding and sentence separately. Follow the cited order when the disposition is unclear [S33].","sources":["S17","S42","S33"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-713b1a0cac5e","kind":"historical","anchor":"**Trace each stage of parole separately.** Use the lead from the available excerpt to look for prisoner-of-war slips documenting capture and parole [S17], then check the separate College Green Barracks and Camp Parole rolls [S34]. Daniel Mangan's records distinguish parole at City Point on 2 July 1863, reporting at College Green Barracks in Annapolis on 3 July and reporting at Camp Parole on 5 July [S35]. Use the date and place of each event to choose its roll.","sources":["S17","S34","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0e2949886714","kind":"method","anchor":"**Interpret hospital terms in their period.** For an unfamiliar diagnosis, use Hooper's *Lexicon Medicum*, following advice from the available excerpt [S17]. The 1843 American edition is one reference [S36]. Keep the term as written and label any gloss as an interpretation of the record.","sources":["S17","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-610c786297b1","kind":"portal-availability","anchor":"**Use the correspondence index when the CMSR or pension review leaves a dispute unresolved.** Follow the lead from the available excerpt [S16 @2026-11-18]. Search the *Index to General Correspondence of the Record and Pension Office, 1889–1904* (M686), listed on Ancestry [S27 @2026-11-18] and FamilySearch. Match the card to the soldier's unit and the subject of the inquiry. Carry its file reference to the Document File (NAID 300385) or Record Cards (NAID 588796), as indicated. Look for a correction of muster when the claimed rank is missing and for correspondence about removing a disputed desertion charge. The years in the index title date the correspondence and can be later than the service in question [S28 @2026-11-18].","sources":["S16","S27","S28"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e56695f00bac","kind":"method","anchor":"**Distinguish commission, duty, federal muster and later correction.** Follow the comparison from the available excerpt [S16]. For a Union volunteer officer, record the commission date, date of entry on duty in the grade, original muster date and any effective date granted by a later correction as separate observations [S29]. Compare the requested grade and date with the state adjutant general's papers and the federal ruling when enclosed [S30]. Record the company, who left the vacancy and why. If the predecessor's promotion opened the vacancy, look for that officer's own muster correction to corroborate the sequence [S29].","sources":["S16","S29","S30"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-66e0285de814","kind":"method","anchor":"**Count repeated Dyer histories once.** Use the check from the available excerpt [S17]. The Civil War Soldiers and Sailors System used Dyer's *Compendium* for Union regimental histories [S32]. Compare wording and source credits before treating another site's account of the unit as independent evidence.","sources":["S17","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4f4f756330c3","kind":"method","anchor":"**Put company movements on their own rows.** Use the company-level comparison from the available excerpt [S17]. For a Union volunteer organization, find the corresponding company letter under the regiment in NARA microfilm M594, *Compiled Records Showing Service of Military Units in Volunteer Union Organizations* [S31]. Keep the company dates, endpoints and reported march distances beside the regimental account. Use them to test ambiguous place names against the preceding and following stations before assigning a location.","sources":["S17","S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-38ff1e058b06","kind":"historical","anchor":"**Keep Monocacy Junction distinct from the river.** Use the distinction from the available excerpt [S17]. Read Monocacy Junction as a place-name that can refer to the railroad junction or the adjacent community [S41]. When a card gives only Monocacy, use the route and the wording of the entry to decide which feature it means.","sources":["S17","S41"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d3b3669caa25","kind":"historical","anchor":"**Match capture to the dated engagement.** Use the date-and-place comparison from the available excerpt [S17]. A Winchester capture on 15 June 1863 fits the Second Battle of Winchester of 13–15 June 1863. The Third Battle was on 19 September 1864 [S37]. Record capture as the documented event and label the battle association as inferred unless the record names the engagement.","sources":["S17","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-8ae07ab57174","kind":"method","anchor":"**Use a state roster when the Union CMSR images are unavailable.** Identify the candidate unit from a state adjutant general's roster or report, using the approach from the available excerpt [S15]. For Wisconsin, start with the *Roster of Wisconsin Volunteers, War of the Rebellion, 1861–1865* [S25]. Use the unit as a lead into the separate carded medical records for Union volunteers in RG 94, entry PI-17 534. Look under state, organization number and surname initial [S26].","sources":["S15","S25","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ff3006c60f74","kind":"method","anchor":"**Treat repeated Soldiers and Sailors hits as index entries.** Follow the comparison from the available excerpt [S17]. Compare side, state and regiment and follow the entries into the CMSR before deciding how many people they represent. The underlying index can have multiple cards for one person, including for alternate names or service in different regiments [S32].","sources":["S17","S32"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e686ef8c4945","kind":"portal-availability","anchor":"**Browse the Maryland Union jackets by unit and surname.** Use the browse sequence from the available excerpt [S17 @2026-11-18]. For a name-search miss, start with the M384 Maryland Union CMSR run that NARA lists on Fold3 [S39 @2026-11-18]. Find the regiment and the surname range before looking for the soldier's jacket. Within each unit M384 is arranged by surname [S38 @2026-11-18].","sources":["S17","S39","S38"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4c078ace400e","kind":"historical","anchor":"**Check a Sixth Maryland Company J reading against Company I.** Test the Company I reading suggested from the available excerpt [S17] against the muster records. The Maryland muster-roll index lists Company I followed by Company K for the Sixth Maryland Infantry [S40]. Preserve the original reading and use the man's muster record to confirm the company.","sources":["S17","S40"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ad30d10d5e0f","kind":"method","anchor":"- **Interpret a miss against that scope.** The Howard University team used enlistment records and quarterly vessel muster rolls [H15]. For sailors outside that dataset, go directly to the original series.\n- **Route Navy men elsewhere.** Search enlistments in the *Weekly Returns of Enlistments at Naval Rendezvous*, January 1855 to August 1891 (NARA M1953, RG 24) [H16], then search the vessel's quarterly muster rolls. For veterans' and widows' pensions use the surname index T288, then the naval entries in the miscellaneous section of T289. Approved widows' claims are in M1279, with a book index [H17]. For a published local list, combine the town with “Civil War” and “sailors.” The 1898 *Manchester Men: Soldiers and Sailors in the Civil War, 1861–'66* covers Manchester, New Hampshire [S2].","sources":["H15","H16","H17","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-cc27fdf9a2fb","kind":"portal-availability","anchor":"- **Locate the M1953 images.** The FamilySearch collection offers a browse link to the rendezvous reports [H18 @2026-11-19]. NARA's guide also identifies a Fold3 edition [H16 @2026-11-19]. Check the image range for the station and week before logging a miss.","sources":["H18","H16"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-2a9b6cc7e4a8","kind":"method","anchor":"- **Record the date and scope of each search.** For a sailor, note which enlistment reports, vessel rolls and local service lists you checked [S2]. Record the series still needed to test the match.","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-aaaaa0fbd4c2","kind":"portal-availability","anchor":"**Search MyHeritage for the Union draft line.** Use *United States Civil War Draft Registration, 1863–1865* [S45 @2026-11-21] [S46 @2026-11-21]. Where available, open the schedule image [S61 @2026-11-21] and record the class and district shown on the page. Use a separate service-record search to test whether the registrant served.","sources":["S45","S46","S61"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-121049cdc276","kind":"method","anchor":"**Check the jacket for correspondence before searching for a separate file.** Use the filing lead from the available excerpt [S59]. Read the CMSR's inner personal papers for a letter or reply, and compare its subject and reference with any inquiry notation on the jacket [S60]. If the correspondence is missing or the jacket only records the inquiry, follow the separate correspondence index below.","sources":["S59","S60"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b9c4ac6cb2aa","kind":"historical","anchor":"**Test a justice-of-the-peace discharge against the rule in force on its date.** When a Confederate entry says “being justice of peace,” use the exemption lead from the available excerpt [S54]. For a June 1862 discharge, read Confederate General Orders No. 37, 19 May 1862, which lists justices of the peace as exempt from enrollment under the act of 21 April [S56] [S57]. For later entries, date the applicable rule because the act of 11 October 1862 repealed the April act [S58]. Compare the county record of appointment or qualification with the discharge order before attributing the discharge to the exemption.","sources":["S54","S56","S57","S58"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5421eecd873","kind":"fee","anchor":"**Check MyHeritage for Confederate service abstracts.** Search *Service Records of Confederate Soldiers*, which MyHeritage labels Free [S43 @2026-11-21] [S44 @2026-11-21]. The catalog lists images [S61 @2026-11-21]. Open a hit in your own account to see which cards you can inspect. Use the unit to locate the full CMSR when the hit supplies only an index entry or part of the jacket.","sources":["S43","S44","S61"],"checked":"2026-11-21","stated_as":"observation","review":"reviewed"}
  - {"id":"C-aa594ed231ee","kind":"custody","anchor":"**Check county enrollment books for Confederate veterans.** Follow the courthouse lead from the available excerpt [S49 @2026-11-21]. Search under the county in the clerk-of-court records, including holdings transferred to an archive. For Anderson County, South Carolina, use the *Confederate veterans' enrollment books*, 1902–1930 (series L 04015) [S50 @2026-11-21]. For Lancaster County, use Winthrop University's accession 4, a compilation from the clerk's list [S51 @2026-11-21]. Treat the county entry as a lead back to the wartime unit and preserve the date of the veterans' list separately from any service dates.","sources":["S49","S50","S51"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9a05efb4d936","kind":"method","anchor":"**Look up Prince Edward County Confederates in Driver's roster.** Follow the book lead from the available excerpt [S54]. Search alphabetically in Robert J. Driver Jr.'s *Confederates of Prince Edward County, Virginia and Deaths in Farmville Hospital, 1862–1865* (ISBN 9780788426971) [S55]. Compare any enlistment or discharge dates, occupation and physical description the entry gives with the dated service cards before assigning an identity or a service episode.","sources":["S54","S55"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-470bc3dd6904","kind":"portal-availability","anchor":"**Check the 10 Million Names regimental indexes.** For a Black soldier in the 54th or 55th Massachusetts Infantry or the 5th Massachusetts Cavalry, use the lead from the available excerpt [S47 @2026-11-21]. Search the matching index-only volume in American Ancestors' *On the Battlefield: Records of Soldiers, Veterans and Refugees* [S48 @2026-11-21]. Carry the unit and company from a hit into the soldier's CMSR. Judge a miss against the volume you searched.","sources":["S47","S48"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-634457f0cef3","kind":"custody","anchor":"**Check Treasury payments when a United States Colored Troops muster roll is missing.** Follow the payment-register lead from the available excerpt [S52 @2026-11-21]. Look for a named payment in the Second Auditor's registers of payments to Colored Troops, 1863–1868, in National Archives RG 217, § 217.7.3, Paymaster, Ordnance, and Medical Division [S53 @2026-11-21]. Record the payment as its own event. Leave the missing muster period open.","sources":["S52","S53"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e7becc8e5f36","kind":"historical","anchor":"**Trace a late Medal of Honor award through correspondence.** According to the presenters in the available excerpts, the index can lead to the correspondence behind a late award [S62†] [S63†]. If the index names an award file, use the number to locate the R&P Document File (RG 94, entry 501). If the index gives no lead, choose the correspondence series by rank and application date. Check the Enlisted Branch Letters Received (entry 409) for enlisted correspondence, the Volunteer Service Letters Received (entry 496) or the Adjutant General’s Office Document File (entry 25), as appropriate [S64]. Keep the dates of the action, witness statements and award decision separate.","sources":["S62","S63","S64"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-state-draft-before-federal","kind":"historical","anchor":"**Start with state records for a draft before 3 March 1863.** According to the presenter’s advice, start with the state adjutant general’s records for earlier drafts [S75†]. Use the enrollment locality to identify the state’s draft or militia records. The federal bureau took over functions previously carried out by the states [S77].","sources":["S75","S77"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-union-enrollment-district","kind":"custody","anchor":"**Identify the Union enrollment district by wartime residence.** According to the presenters’ advice, crosswalk the locality to its wartime congressional district and use the district finding aids [S75† @2026-11-22] [S90† @2026-11-22]. Check the resident’s ward or township against the enrollment subdistrict if a city or county is split. Use the RG 110 preliminary inventory named in §110.1 to identify the series [S76 @2026-11-22]. Check the catalog for the holding unit by enrollment district. For Illinois, start with National Archives at Chicago and NM 82, entries 5358–5892 [S77 @2026-11-22].","sources":["S75","S90","S76","S77"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-union-examination-disposition","kind":"method","anchor":"**Follow a Union call-up through examination and muster-in.** According to the presenters’ advice, follow the consolidated list with a search of examination and exemption records [S75†] [S90†]. Choose the district series for the man’s recorded status, such as enrolled exemption claimant, draftee, recruit or substitute [S78] [S79]. Check the district’s exemption list or register for a stated medical or alienage ground, then record the decision, date, place of enrollment, identifying details and remarks as given. A call-up documents selection. Look for acceptance and a mustering-in entry before recording service.","sources":["S75","S90","S78","S79"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-union-alienage-proclamation","kind":"historical","anchor":"**Date a Union alienage claim.** According to the presenter’s advice, start with Lincoln’s 8 May 1863 proclamation [S75†]. Check for a sworn declaration of intent. For a declarant, test U.S. presence at or after the end of the 65-day period while the rebellion continued. Check separately whether he had exercised suffrage or another political franchise, which also barred the plea under the proclamation [S80].","sources":["S75","S80"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-confederate-age-calls","kind":"historical","anchor":"**Test age and any extended term against the dated Confederate act.** According to the presenter’s advice, use the conscription statutes to test for local defense [S75†]. Read the 16 April 1862 act for the initial call of nonexempt white male residents aged 18–35. For a man already serving in that age band, count the three-year retention from his original enlistment and check the act’s provisos [S81]. The 27 September 1862 amendment authorized calls up to age 45 [S82]. Under the 17 February 1864 act, check reserve and detail records for the 17–18 and 45–50 age bands before inferring field service [S83].","sources":["S75","S81","S82","S83"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-confederate-exemption-grounds","kind":"historical","anchor":"**Verify the grounds and outcome of a Confederate exemption or detail.** According to the presenter’s advice, use occupation or disability to choose which records to search [S75†]. Compare the dated entry with the applicable law. The October 1862 act names specified railroad and telegraph jobs, civil offices, some artisans and suppliers, certain plantation owners or overseers, and people found unfit under the rules [S106]. Check the recorded job, conditions and decision. For later agricultural cases, check the February 1864 act and any bond or supply obligation associated with the exemption [S83]. Record eligibility, an exemption granted, a detail and a military muster as separate events.","sources":["S75","S106","S83"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-confederate-conscription-custody","kind":"custody","anchor":"**Find Confederate conscription records by creating office.** According to the presenter’s advice, search federal and state or local holdings [S75† @2026-11-22]. Search the Adjutant and Inspector General’s conscription, exemption and detail records in RG 109, §109.7.1 [S86 @2026-11-22]. For a Virginia case, also search the Library of Virginia’s indexed 1862–1863 Conscript Journal (accession 34000) for the ruling and named authority. For the 10th Virginia Congressional District, use its 1863–1865 register (accession 43957, miscellaneous reel 5495) for the enrollment, exemption or company assignment [S84 @2026-11-22].","sources":["S75","S86","S84"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-confederate-conscription-correspondence","kind":"historical","anchor":"**Identify the Confederate conscription office from orders and notices.** According to the presenter’s advice, use orders and wartime newspapers to identify the state commandant and his office [S75†]. Use General Orders No. 112 of 30 December 1862 to trace camp reports and returns to the Bureau of Superintendent of Conscripts [S88]. For North Carolina, search the name Peter Mallett from the commandant’s notice in the Raleigh Daily Progress of 20 August 1863 [S87].","sources":["S75","S87","S88"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-confederate-enrollment-free-black-people","kind":"custody","anchor":"**Check the separate register for enrollment and detail of free Black people.** The Confederate enrollment and detail register is a separate lead according to the presenter [S75† @2026-11-22]. Search the Library of Virginia copy, *Register of Free Negroes Enrolled and Detailed, May 1864–January 1865*, miscellaneous reel 2055 [S85 @2026-11-22]. Record what the entry documents about enrollment or assignment before attributing any military service.","sources":["S75","S85"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-enlistment-age-name","kind":"method","anchor":"**Keep the declared enlistment age and service name.** According to the presenter’s advice, read the reverse of the enlistment paper for the recorded age [S97†]. Compare that age with independent birth evidence. For an apparent minor, check the enlistment rules in force on that date before looking for a consent paper. Link the service name to the civilian name with dated evidence. Sarah Rosetta Wakeman enlisted as Lyons Wakeman and gave an age of 21 despite a birth date in 1843 and enlistment in 1862 [S98].","sources":["S97","S98"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-capture-cards","kind":"method","anchor":"**Follow a missing muster entry into the prisoner records.** According to the presenter’s advice, check casualty sheets for capture [S89†]. According to the presenter, the upper-right notation identifies the underlying record on the forms shown in the POW and Union medical examples [S89†] [S90†]. Copy it when the form supplies one. Record capture, confinement and any death in prison with their own dates and places. Use the memorandum to identify prisons, and check the jacket for a separate casualty or death report [S91] [S105].","sources":["S89","S90","S91","S105"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-missing-medical-enclosures","kind":"method","anchor":"**Check enclosures when successive musters still say missing.** The presenter reports a case in which enclosures recorded hospitalization and parole while the company muster still said missing [S90†]. Check the prisoner memoranda, hospital cards and disability discharge certificate together. Read both sides of the prisoner memoranda and disability discharge certificate. Look on the certificate’s reverse for the wound account and save both informative sides when making a local copy. Use each enclosure’s own date and check any underlying hospital record it names [S105] [S92].","sources":["S90","S105","S92"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-medical-by-army","kind":"method","anchor":"**Choose the medical-card route by army.** According to the presenter’s advice, check a Confederate jacket for medical abstracts and search a separate series for Union volunteers [S89†]. Look for hospital-derived cards in the Confederate CMSR [S86]. For a Union volunteer, check RG 94, entry 534, by state, organization number and surname initial even when the jacket already gives a hospitalization lead [S92].","sources":["S89","S86","S92"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-parole-exchange","kind":"historical","anchor":"**Check exchange before recording eligibility to fight again.** According to the presenters, capture, parole and exchange are separate events [S93†] [S90†]. Record a parole as release under terms barring further fighting until exchanged and keep a Camp Parole reporting date separate. Look for a dated exchange or return-to-duty record before closing the parole episode [S94].","sources":["S93","S90","S94"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-confederate-compendium-units","kind":"method","anchor":"**Find the Confederate unit in the correct branch.** According to the presenter’s advice, use the Virginia volume of Stewart Sifakis’s *Compendium of the Confederate Armies* [S95†]. Select artillery, cavalry or infantry, then match the organization and size. Use the entry to trace organization, command assignments, battles and surrender where given. Follow its bibliography or suggested reading to check the dates [S96]. Place the resulting dates on the unit timeline.","sources":["S95","S96"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-per-unit-jackets","kind":"method","anchor":"**Find a jacket under each independently documented unit.** Crume reports separate files for a soldier who served in two units [S65]. Search the name under both the losing and receiving organizations and use the custodian route above for any jacket that is unavailable digitally. Compare each record’s unit, enlistment details and date range before combining the episodes [S105].","sources":["S65","S105"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-veterans-schedule-unit","kind":"method","anchor":"**Use the 1890 veterans schedule’s unit to select wartime records.** On a surviving M123 return, take the company and regiment or vessel from the military columns [S66]. Search the organization’s state even when the veteran or widow lived elsewhere in 1890. Crume’s New York schedule pointed to a Pennsylvania regiment [S65].","sources":["S65","S66"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-soldier-index-origins","kind":"portal-availability","anchor":"**Search the soldier indexes on both sides.** Family Tree Magazine recommends the NPS search [S102 @2026-11-22]. According to the presenter’s advice, check both sides and use state indexes when needed [S75† @2026-11-22]. Search the Civil War Soldiers and Sailors System or the FamilySearch *United States, Civil War Soldiers Index, 1861–1865*. Both use the general service index cards, so a matching hit across the two sites gives one lead [S103 @2026-11-22] [S67 @2026-11-22]. If the combined index misses, check the separate Union or Confederate index for the state [S71 @2026-11-22]. The National Archives lists digitized indexes on Fold3 or Ancestry [S104 @2026-11-22]. Follow a hit to the full jacket and leave the other side open until searched.","sources":["S102","S75","S103","S67","S71","S104"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-initial-and-brother","kind":"method","anchor":"**Retry a middle-initial miss and test a brother’s unit.** Run the same Civil War Soldiers index search in your own account without the middle initial. Use a brother’s known unit to pick candidate hits and compare company and enlistment year in the underlying entries. Crume’s search missed with the middle initial but found a plausible hit without it in the brother’s unit [S65]. Use that overlap as a lead to identity-matched records.","sources":["S65"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-bates-card-file","kind":"portal-availability","anchor":"**Find Pennsylvania volunteers in the card file, then open the unit history.** Search the Civil War Veterans Card File by surname through the Pennsylvania State Archives route or Ancestry collection 62200 [S68 @2026-11-22] [S69 @2026-11-22]. Use the unit on the card to select the regiment in Samuel P. Bates’s *History of the Pennsylvania Volunteers, 1861–1865* and compare the company’s enlistment entries, following Crume’s use of the history [S65 @2026-11-22]. Search both 13th Pennsylvania Reserves and 42nd Pennsylvania Volunteers for that unit [S70 @2026-11-22].","sources":["S65","S68","S69","S70"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-indiana-muster-index","kind":"portal-availability","anchor":"**Follow an Indiana muster index hit back to the roll.** Search MyHeritage’s *Indiana, Civil War Muster Rolls* [S72 @2026-11-22] [S73 @2026-11-22]. Record age, place and date of enlistment, discharge date, branch, regiment and company when given. The state adjutant general’s office made the cards after the war to index original rolls [S74 @2026-11-22]. Use the company and regiment to locate the underlying wartime roll and cite the index with its own date.","sources":["S72","S73","S74"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-civil-war-new-york-muster-abstracts","kind":"custody","anchor":"**Check New York’s state muster abstracts when you lack a federal jacket.** According to the presenter’s advice, use the New York muster cards as a second route [S97† @2026-11-22]. Use the New York State Military Museum’s volunteer unit roster or muster-roll route and the New York State Archives’ Civil War Muster Roll Abstracts [S99 @2026-11-22]. Compare the state entries against any federal index hit and keep each source’s coverage separate.","sources":["S97","S99"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-civil-war-marine-muster-dates","kind":"portal-availability","anchor":"**Read each date column on a Marine muster roll separately.** According to the MyHeritage excerpt, the form shown separates enlistment and disciplinary events into their own columns [S100† @2026-11-22]. For Civil War U.S. Marine Corps service, use the T1118 rolls in FamilySearch, by month and then post, station or ship [S101 @2026-11-22]. When the form gives them, record enlistment, re-enlistment, last desertion, apprehension and court-martial sentence on separate dated rows. Copy the offense and remarks with the event they describe.","sources":["S100","S101"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-union-provost-inventory-part","kind":"method","anchor":"**Choose the RG 110 inventory part by creating office.** According to the presenter’s advice, select the geographic part for a district search [S75†]. Match the district’s state or territory in §110.4 to the eight-part preliminary inventory listed in §110.1 [S76]. For records created by the central Provost Marshal General’s Office or its successor Enrollment Division, use Part I (NM 65) [S76].","sources":["S75","S76"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-union-volunteer-medical-catalog","kind":"custody","anchor":"**Locate the Union volunteer medical-card series by catalog ID.** According to the presenter’s advice, start with the Adjutant General’s preliminary inventory (PI-17) in RG 94 [S90† @2026-11-23]. Look up entry 534 by National Archives Identifier 655646 [S26 @2026-11-23]. Check whether the catalog shows images covering the soldier’s unit before treating an online miss as evidence about the cards [S107 @2026-11-23].","sources":["S90","S26","S107"],"checked":"2026-11-23","stated_as":"observation","review":"reviewed"}
