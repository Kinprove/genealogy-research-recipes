claims:
  - {"id":"C-describe-device","kind":"method","anchor":"Record these parts separately when present: shield, crest above the helm, motto, supporters and any detached badge. A signet ring can preserve only the crest. Transcribe the inscription as a second clue. For a print supplied by a commercial arms vendor, record its maker and date, then look for a grant or older use before attaching it to the family [S1], [S2].","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-blazon-comparison","kind":"method","anchor":"Compare the whole surviving design with the recorded blazon. Describe the charges by type, number, position and tincture. For an animal, record stance and head direction separately. For example, a lion passant has one forepaw raised in a walking stance, while guardant describes the head looking toward the viewer. Compare an incomplete crest only with the crest portion of a candidate’s blazon [S1], [S3].","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-roll-scope","kind":"method","anchor":"Search a roll or armorial index by historical bearer name and check the entry’s locality, period and purpose. Copy the bearer’s name, the roll’s title and folio, and the blazon. A miss covers the roll you searched. Keep the attribution open and check the grant, visitation, matriculation or confirmation series for that jurisdiction [S1], [S4].","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-england-wales-ni","kind":"custody","anchor":"For England, Wales or Northern Ireland, use the College of Arms. Look for grants, pedigree registers or changes of name and arms. For an English or Welsh Tudor or Stuart candidate, check the relevant county’s heraldic visitations [S1 @2026-11-22], [S4 @2026-11-22], [S5 @2026-11-22].","sources":["S1","S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-scotland","kind":"custody","anchor":"For Scotland, use the Court of the Lord Lyon’s Public Register of All Arms and Bearings in Scotland from 1672. Check both grants and matriculations. Read the blazon even when the entry has no illustration [S1 @2026-11-22], [S6 @2026-11-22].","sources":["S1","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ireland","kind":"custody","anchor":"For Ireland, use the Office of the Chief Herald at the National Library of Ireland. For earlier Ulster Office material, browse the Genealogical Office manuscript collection and carry its manuscript number into your notes [S1 @2026-11-22], [S7 @2026-11-22].","sources":["S1","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-canada","kind":"custody","anchor":"For a Canadian grant, confirmation or registration, browse the Canadian Heraldic Authority’s Public Register of Arms, Flags and Badges of Canada. Its coverage starts with the authority’s establishment in 1988. A miss there leaves earlier or overseas grants open [S1 @2026-11-22], [S8 @2026-11-22].","sources":["S1","S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-office-request","kind":"method","anchor":"If the register entry or identification requires staff research, request the arms record from the responsible heraldic office. Give the historical bearer’s known dates and locality, the device description and any series reference. Keep the request focused on the existing record and leave living relatives’ details local until the gate is cleared [S1], [S5], [S6].","sources":["S1","S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-bearer-link","kind":"method","anchor":"A surname match gives you a candidate bearer. Require a documented link to that bearer before assigning the arms to the researched branch. Record the grant or confirmation and its named recipient separately from the pedigree that links the bearer to your subject. Keep any claim about nobility, title or property open until records specific to that claim support it [S1], [S2], [S9].","sources":["S1","S2","S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cadency","kind":"method","anchor":"In English and Welsh arms, test a label, crescent, mullet or martlet as a possible cadency mark against the bearer’s generation and sibling records. The College’s traditional examples assign a label to the eldest son during his father’s life, then a crescent, mullet and martlet to the second, third and fourth sons respectively. Check a dated blazon or pedigree before assigning birth order, especially where the family used arms without differences [S1], [S2], [S10].","sources":["S1","S2","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-maternal-arms","kind":"method","anchor":"If English or Welsh arms combine designs, distinguish arms set side by side for spouses from quarterings. For a proposed maternal quarter, identify the woman and check her father’s arms, her brothers and any surviving descendants of those brothers before treating her as an heraldic heiress. Distinguish a grant to the woman herself, inherited arms and arms displayed in marriage [S1], [S2], [S10].","sources":["S1","S2","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
