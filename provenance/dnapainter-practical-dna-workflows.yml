  - {"id":"H15","kind":"help-page","urls":["https://help.familytreedna.com/hc/en-us/articles/4405775422223-Chromosome-Painter-Chromosome-Painting-View-Guide"],"published":"2026-02-06","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12 through the Help Center article API","entry_sha256":"c592f9378d1c932479fae49dc8b4c63d3dd7b2dfcec37a48a73448412b1f3bf7","claims":["C-c6fa6c413978"],"review":"reviewed"}
claims:
  - {"id":"C-e0451d77ffc7","kind":"unclassified","anchor":"Use a named focal tester, authorized segment tables, known relatives and a specific question. A segment table needs chromosome and start/end positions; retain reported cM and SNP counts when available. Raw genotype files and a match's total cM alone are not chromosome-painting inputs. [S1, S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8f95e845acb5","kind":"unclassified","anchor":"1. Create or open the focal tester's chromosome map. Select one identified relative with a usable pairwise segment table. Preserve the original table before editing or pasting. Require the incoming intervals and any existing painted intervals to use one verified genome build before painting. Convert differing coordinates to that common build outside DNA Painter and retain the originals and conversion record; stop if a build is unknown.\n2. **Privacy gate:** <!-- privacy-gate: third-party-tool --> Pasting the segment table and match identity puts a living match's DNA data into DNA Painter; answer the privacy gate in `SKILL.md` first. Open **Paint a new match**, paste the segment table and use **Preview**. Compare the parsed chromosomes and interval endpoints with the original. Record the selected cM filter; parsing successfully does not mean every source row survived it. DNA Painter's documented ordinary painting default is 7 cM, adjustable in the form. [S1, S2]\n3. Enter the match identity and assign the supported parental side and ancestor or couple. If the connection is unresolved, use a provisional group. A group label describes your interpretation; it does not establish it. Save the match. [S1]\n4. Click a chromosome's number to open it and inspect all painted segments. In the closed view, groups higher in the key cover lower groups at overlapping positions. Dragging a group changes the visible layer, not its coordinates or evidential strength. [S3]\n5. Preserve a note explaining the assignment and its source comparison. For an apparent contradiction, inspect the underlying intervals and provider comparison before recoloring anything. DNA Painter cannot compare raw DNA between two matches; a visual overlap is a reason to investigate, not a triangulation result. [S2]","sources":["S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8b38ba907d9b","kind":"unclassified","anchor":"If an FTDNA segment map already exists, keep any later import of parental-side information\nas a separate operation. Jonny Perl's September 2024 tutorial describes importing a second\nfile containing FTDNA's match-level maternal/paternal bucket information after the segment\nfile. Preserve both dated files and check that they concern the same kit and matching\nidentities. Use that route only if the actual importer and its identity mapping can be\ninspected; ambiguous matches remain unresolved. Keep the reported bucket label separate\nfrom your evidence for a segment's parental side or ancestor. If the tool would silently\nturn a match-level label into an unsupported interval assignment, retain the label in your\nexternal match notes instead. Save which labels were added, left unassigned or could not\nbe mapped. [S10]","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a26a0fbcf71e","kind":"unclassified","anchor":"For a map's optional Y/mt panel, keep three fields distinct: the reported haplogroup and\nits tester/test level, an authorized kit link, and the documented direct-line ancestor\nselected for display. A known lineage can be recorded while its haplogroup remains unknown;\nchoosing an ancestor group does not supply a test result. Check the saved panel and linked\nkit before sharing. The chromosome-map panel and an ancestral tree's haplogroup fields are\ndifferent objects: record which was edited. If a tree propagates a label to other people,\ninspect those annotations and preserve the original tester and the conditional lineage\nbasis; propagation does not mean those ancestors were tested. Use the\n[Y/mt workflow](ydna-mtdna-interpretation.md) to assess the underlying result. [S19, S20]","sources":["S19","S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-55adc2d27c9d","kind":"unclassified","anchor":"Ancestry's Chromosome Painter shows population segments without coordinates. To get them,\nuse Kevin Borland's bookmarklet, linked from DNA Painter's [ACPS tool page](https://dnapainter.com/tools/acps):\ndrag it to the bookmarks bar, open the Chromosome Painter page and click it to download a\nCSV. Its own page states build 37 output. The older ACPS copy-and-paste route still works,\nbut since August 2025 it needs a line of JavaScript in the browser console, and it does not\nwork in Firefox; ACPS estimates positions from build 37 chromosome lengths. Follow the\ncurrent steps on the tool page. Import the CSV with **Import segment data**, or paste only\nthe rows you need into **Paint a new match**; apply the build check in step 1 before adding\nthem to a map that already holds match segments. For segment sizes, paste chromosome,\nstart and end rows into the [cM estimator](https://dnapainter.com/tools/cme) and use\n**Get centimorgans for a batch**; it takes up to 20 segments at a time and uses build 37.\n[S27, S28, H6, H7, H8]","sources":["S27","S28","H6","H7","H8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ad121fcc4717","kind":"unclassified","anchor":"Put each painted population region in its own group labeled as a provider estimate, for\nexample `Ancestry region — Devon & Somerset`. Never use such a group as a parental-side or\nancestor assignment; ACPS itself warns that Ancestry's split between parents may not be\naccurate. Use it only as a clue: compare it with intervals already assigned through\nidentified matches and with a tested parent's own region segments. When a region segment\nlies on DNA assigned to a documented ancestor from elsewhere, the region label loses; it is\nnot evidence against the documentation. Treat a trace region on one parent's side that is\nmissing from that parent's own report but fits the other parent's ancestry as a suspected\nside error. A region broad enough to cover both branches cannot tell them apart. Leave any\nportion the provider does not attribute unassigned. [S27, H6]","sources":["S27","H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a3f6f55cde86","kind":"unclassified","anchor":"Choose the smallest transfer that answers the question. Duplicate the map for an alternative analysis; copy one match for a focused comparison; export a filtered subset for an ancestor; export the unfiltered table for a whole-map transfer. Use these as alternate maps of the same focal tester. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1e11f1bcea11","kind":"unclassified","anchor":"1. Duplicate through the settings cog if you need a working copy. Edit or remove groups in that copy.\n2. For one match, click one of its segments, choose **View match**, then **Copy match segment data to clipboard**. Paste into the destination's **Paint a new match** form.\n3. For one interval, click the segment, then the chromosome number inside its popup; the clipboard receives that segment's data.\n4. For a map or subset, open settings → **All segment data**. Set or clear table filters deliberately, then choose **CSV file**. That CSV contains the table currently displayed. Import it through **Import segment data** where available. [S4]\n5. Record the source and destination map names, filters and expected row count. Before pasting or importing into a nonempty map, require the incoming and existing intervals to use one verified genome build; convert differing coordinates outside DNA Painter with a retained conversion record, or stop if a build is unknown. Check the imported interval count, identities and assignments against the exported table; inspect duplicate-looking intervals rather than assuming import deduplicated them.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-777238e0e142","kind":"unclassified","anchor":"Use this when the intervals' chromosome copies are already known. The [Common Segment Generator](https://dnapainter.com/tools/csg) intersects coordinates; it does not compare genotypes or establish that overlapping matches share the same DNA. [S5, H1]","sources":["S5","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dcec1917805f","kind":"unclassified","anchor":"1. Select a phased ancestral interval set for a tested parent and the child's measured inheritance through that parent. For example, intersect a child's match to a grandparent with the relevant parent-map intervals assigned to the child's great-grandparent.\n2. Save both input sets and document why they refer to the same inherited chromosome copy. Require both sets and the destination child map to use one verified genome build before intersecting their coordinates. If builds differ, convert the coordinates to that common build outside the generator and retain the originals and conversion record. If either build or chromosome copy is unknown, stop this remapping operation.\n3. **Privacy gate:** <!-- privacy-gate: third-party-tool --> These sets carry a parent's and a child's DNA match data into the generator; answer the privacy gate in `SKILL.md` first. Paste the two sets into the generator and record the cM cutoff. Generate the common intervals. The blog's low 3 cM default was chosen for phased known-family data; it is not a general threshold for trusting small matches. [S5]\n4. Inspect output endpoints: each interval must lie inside an interval from both inputs. Review X results separately; the author's own worked use required removing false X intervals. [S5]\n5. Paint the output on the child's map, naming the ancestral assignment and recording both inputs. Repeat separately for the other ancestral groups.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-be16588159a9","kind":"unclassified","anchor":"Use subtraction when a close relative shares a known match on DNA the focal tester did not inherit. This requires the relationship path and grandparents' independence assumed by the method; coordinate subtraction alone cannot establish the ancestor. [S6]","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5ef3df125f3e","kind":"unclassified","anchor":"1. Choose a match whose relevant relationship runs through one grandparent and establish that the relevant grandparents are unrelated. For example, use your sibling's comparison with a cousin who descends from your paternal grandfather's sibling. Retrieve two complete, comparable pairwise segment tables: focal tester–match and close relative–match. Record provider thresholds, genome build and comparison completeness. Require both tables and the destination map to use one verified genome build before subtraction; convert differing coordinates outside the generator and retain the conversion record, or stop if a build is unknown. A missing export or unavailable comparison is not a negative result.\n2. **Privacy gate:** <!-- privacy-gate: third-party-tool --> Both tables carry living testers' and the match's segment data into the generator; answer the privacy gate in `SKILL.md` before pasting them. In the [Inferred Segments Generator](https://dnapainter.com/tools/isg), put the focal tester–match intervals in **box 1** and the close relative–match intervals in **box 2**. It returns box 2 minus box 1. A partial overlap can split or shorten an interval; reversing the boxes answers another question. [H2]\n3. Save the generated intervals. Their cM values are recalculated; do not expect exact agreement with the provider's original values. [H2]\n4. For a suitable parent/sibling comparison, a missing interval associated with one grandparent can support a provisional assignment to the other grandparent on that parental side. With a first cousin, the inference may only exclude a particular great-grandparent. Full-aunt/uncle segments can span fully identical regions and include DNA from both grandparents, so do not apply the simple whole-interval rule indiscriminately. [S6]\n5. Keep all inferred intervals provisional. Paint using a match name such as `Match A — inferred`; put exclusions in segment notes instead of inventing a positive assignment. Compare with observed intervals before promoting any inferred label. A small shared subset below a provider's reporting threshold can explain an apparent discrepancy. [S6]","sources":["H2","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dfd2e5397624","kind":"unclassified","anchor":"For the specific tested-grandparent scenario, box 1 can contain your measured match to that grandparent and box 2 can be populated with a full chromosome set to infer the other grandparent's contribution on that parental side. Use this shortcut here for autosomes: remove X from the populated second field before generating and handle X through the linked X-inheritance recipe. Missing X comparison data or a male's paternal-grandparent path otherwise risks an erroneous full-X inference. The built-in full set accounts for unsampled starts on chromosomes 13, 14, 15, 21 and 22; do not replace it with hand-made `1–end` intervals. [S7, H2]","sources":["S7","H2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-142480c3aaaa","kind":"unclassified","anchor":"Use the [Distinct Segment Generator](https://dnapainter.com/tools/dsg) when several relatives share segments with the same target match and you want the distinct coordinate span represented across their comparisons. Pasting multiple sets returns merged distinct intervals and recalculated cM; the tool assumes build 37. [S8, H3]","sources":["S8","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12b74d25d754","kind":"unclassified","anchor":"1. Save one pairwise table for each relative–target comparison. Label the people and require all input coordinates to be verified build 37 before combining sets. Convert other builds outside the generator and retain the originals and conversion record; stop if a build is unknown. [H3]\n2. **Privacy gate:** <!-- privacy-gate: third-party-tool --> Several relatives' segment tables with the target match go into the generator; answer the privacy gate in `SKILL.md` first. Paste the selected sets into the single input box and generate distinct segments.\n3. Save the output and total. Inspect an overlapping chromosome to confirm that the shared span is not counted repeatedly.\n4. Keep the original per-person tables. The combined output is a coordinate union across these comparisons, not a measured match between an untested ancestor and the target, and not a single relative's ordinary pairwise cM total.\n5. Use it to prioritize a match for further tree research while recording the proposed transmission paths and remaining alternatives. The developer presents this use as experimental, not a definitive relationship-identification method. [S8]","sources":["H3","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-563117bfadd8","kind":"unclassified","anchor":"Treat the union total as a minimum for what the untested ancestor shared with the target\nmatch only if every interval came through that ancestor and no other path connects the\ntesters and the target. If you divide the union by a Coverage Estimator percentage\n(workflow 6), compute that percentage for exactly the testers whose comparisons formed the\nunion. Label the quotient a modeled estimate and keep it beside the observed union; a low\npercentage magnifies every error in the union. A Shared cM Project lookup from that\nestimate is a hypothesis for tree research. The 2022 Legacy Tree article ranks this\nestimate as stronger evidence of the relationship than any single tester's pairwise\namount; that ranking is not adopted here, because the quotient carries the coverage\nfigure's uncertainty while the pairwise amounts are measured. [S25]","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7dbd5834dde4","kind":"unclassified","anchor":"Use the [Coverage Estimator](https://dnapainter.com/tools/coverage) for a different question: how much of an ancestor's autosomal DNA is expected to be represented by tested descendants? It takes a descendancy tree and tester marks, not a segment union. [S9, H4]","sources":["S9","H4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6a7ad9bd375c","kind":"unclassified","anchor":"1. Start a tree with the ancestor as root; add the documented descendants or import a GEDCOM and select that ancestor. Back up an existing tree before GEDCOM import, which replaces its contents.\n2. Mark the descendants whose tests you can use. Check every tester's descent paths to the root: a tester related to the root more than once must appear on each documented path and be marked as tested at each occurrence. These are occurrences of the same tester, not additional independent tests. Record database access; realizing the full represented coverage requires access to the tests in the same database. A mixed-database tree is not automatically an accessible combined research dataset. [H4]\n3. Mark deceased people and known testing willingness. Note the current estimate, request next-tester suggestions and compare feasible candidates. Suggestions exclude people marked willing as well as unwilling, so compare willing candidates manually too. A tested child of an already-tested parent does not add coverage in this model. [S9]\n4. Record the proposed tester, the request the suggestion implies and the expected change, then compare feasibility with the research question. A suggested descendant may already have tested in another database or without sharing results with you; for that person the suggestion calls for access to the result or, where the research database accepts uploads, a transfer, not automatically a new test. This is a planning estimate based on typical inheritance; actual inherited DNA can differ. [S9, S25]\n5. Save to the account where available and download the Coverage tree text file as a recoverable artifact. A browser-local tree can disappear when browser data is cleared. [H4]","sources":["H4","S9","S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-af09643fd205","kind":"unclassified","anchor":"When an existing cluster result needs annotations, preserve its original HTML, focal tester,\ndatabase, run date and filters. The January 2020 Cluster Auto Painter walkthrough describes\nsupported cluster HTML and, for its GEDmatch/MyHeritage inputs, a separate shared-segment CSV.\nCheck the actual importer's requirements before generating a separate working map; a cluster\nmatrix without matching coordinates is not itself a segment table. [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-33e95a8224f2","kind":"unclassified","anchor":"The source describes match/group overlays and group/segment notes. The separate working copy\nand annotation register extend this recipe's existing preservation controls. Its worked\nexample's overlap-to-parental-side inference is not adopted: an overlapping color does not\nestablish mutual matching, triangulation or an ancestral couple. [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a8b4680edba3","kind":"unclassified","anchor":"An ancestral tree starts with the person whose ancestors are being examined. It differs from\nthe descendancy tree used by the Coverage Estimator in workflow 6. The tutorials describe\nGEDCOM root selection, tree completeness and repeated-path views, and a separate Brick Walls\nreport. Treat their button names, limits and defaults as dated descriptions. [S12, S13, S14]","sources":["S12","S13","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5bdef4beddeb","kind":"unclassified","anchor":"1. Preserve the input tree and identify the intended root. In the available import or manual\n   entry view, record the included generation depth, notes and living-person handling. Check\n   the resulting root and known ancestors against the input before interpreting gaps.\n2. Inspect the tree's available completeness and repeated-path views. Distinguish a missing\n   ancestor within the imported scope from a generation omitted by the import or view. Repeated\n   appearances are paths to a person in the supplied pedigree, not independent proof of that\n   person's identity or of DNA inherited along each path. [S12, S14]\n3. Build a worklist from the available ancestor-gap report or visible tree. Record the displayed\n   generation filter and preserve the shown rows when exporting; the December 2024 tutorial\n   describes a default recent-generation subset and a CSV of the displayed table. Keep each\n   gap or surname clue tied to its branch and label unproved clues as hypotheses. [S13, S14]\n4. Keep source-backed annotations separate from inherited colors or automatically propagated\n   labels. Before sharing, inspect the actual view and its living-person/notes scope; if that\n   scope cannot be checked, keep the worklist local. The output selects documentary follow-up,\n   not a new ancestral or genetic conclusion. [S12, S14]","sources":["S12","S14","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e290581afbf9","kind":"unclassified","anchor":"When using an available **Dimensions** view, name the category and retain the tree fields\nfrom which its values were generated. Compare generated values with the person's source\nfacts, especially a country inferred from free-text birthplace. Correct a value only with\nsupport and keep unresolved values unknown. A custom category needs a source for each\nperson's entry; a propagation checkbox supplies none for that person's ancestors. Save\nthe checked category view with its root and scope. Religion, cause of death and other\npersonal facts must not spread through a pedigree merely because a shared color is useful.\nThe 2021 tutorial supplies category creation and per-value editing; its limits and privacy\ndefaults require checking in the actual interface. [S21]","sources":["S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-df023e6a19f3","kind":"unclassified","anchor":"For a **Places** view, retain the original birthplace wording beside the generated location\nand the root, generation and lineage filters shown. Check ambiguous placements against the\nperson's supported locality. Where the actual interface offers text-based re-geocoding or\na coordinate selector, save the proposed correction and its evidence, inspect the resulting\nplacement and keep the original wording. Leave an unresolved place unresolved; a country\ndefault or a map search result does not establish it. A root location omitted by living-person\nprivacy is missing input, not evidence of an unknown birthplace; do not disclose it merely\nto make a map render. The displayed connections link pedigree birthplaces, not observed\ntravel routes or the transmission of a particular DNA segment. [S22]","sources":["S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8f422b50636a","kind":"unclassified","anchor":"1. Give each tester a distinct identifier and retain each pair's provider, report date,\n   supplied amount and source. Keep unknown amounts blank. Names copied from a cluster\n   do not supply cM values; the November 2025 example explicitly leaves those for manual\n   entry. Use only an import or manual-entry route actually available for the supplied\n   data, then compare the saved cells with their sources. [S15, S18]\n2. Enter relationships separately from measurements and retain their documentary basis.\n   Leave an unresolved relationship unknown or in a hypothesis note. If a sibling-clone\n   control is available, check every copied relationship for that new tester, including\n   half relationships or multiple paths; enter the new tester's own measured amounts.\n   The August 2025 example copies relationship labels but leaves cM blank. [S15, S17]\n3. Inspect one tester's pair values at a time. Where relationship-based percentile or\n   standard-deviation views are offered, retain the selected mode, displayed relationship\n   and reference-data label beside the raw amount. Use an unusual display to recheck\n   the input, tester identity and relationship evidence. A percentile describes position\n   in the referenced distribution; it is not a probability that the relationship is true.\n   No SD cutoff, exclusion threshold or reference-model validation is supplied here.\n   If the display's basis is unavailable, retain it as an unexplained provider output. [S16, S17]\n4. Preserve the original matrix and a correction log. Reopen the saved result after edits;\n   do not assume that a historical edit-mode save/cancel behavior still applies. A symmetric\n   pair shown twice remains one comparison. Keep any shared/exported view within the\n   permissions and fields actually inspected. [S16]","sources":["S15","S18","S17","S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-919aeb09e2af","kind":"unclassified","anchor":"Where the view also shows relationship probabilities, record the basis it states for them;\nif none is stated, record the basis as unknown. A basis drawn from AncestryDNA simulations\nor probabilities fits Ancestry's Timber-weighted totals most directly. On 2026-10-23\nDNA Painter's Shared cM Project tool credited its probabilities to \"stats from The DNA\nGeek\"; the 2024 Legacy Tree article traces those to AncestryDNA's white paper. Before\nusing such a probability with another company's total, state that mismatch in the note;\ndo not present the figure as calibrated for that company. [S26, H5]","sources":["S26","H5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d3be94c2826e","kind":"unclassified","anchor":"1. Open the histogram for a relationship being considered and retain the entered cM,\n   bin and displayed number of submissions. A value inside the published range does\n   not establish the relationship. Where percentages below and above the entered value\n   are shown, record which relationship's distribution they describe. The August 2022\n   tutorial uses approximate interpolation within histogram bins; these percentages\n   are not probabilities that one relationship is true rather than another. [S23]","sources":["S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-998c9d3e9625","kind":"unclassified","anchor":"In the probability table, a probability given for a group of genetically equivalent\n   relationships belongs to the whole group: do not report it as the chance of one label\n   in that group, such as second cousin when the group also holds first cousin twice\n   removed. The histograms are per relationship and come from separate reference data;\n   keep the two outputs apart. [S26]\n2. For an available two-value view, identify both measured tester–match pairs first.\n   Check that the two testers have the same genealogical relationship to the match\n   under the hypothesis being examined. Full siblings are the tutorial's starting\n   example; same-generation cousins need additional path checks. Extra relationships\n   through an unshared ancestor or different generations can invalidate this screen.\n   Preserve each total's definition; an unavailable comparison is not a measured zero.\n   Do not choose between filtered and unfiltered totals to favor a hypothesis. [S24]\n3. Enter the two eligible amounts and save the displayed relationship ranges that\n   accommodate both. This is a range screen, not a joint probability calculation or\n   relationship proof. The November 2022 tutorial's histogram percentages describe\n   the **first** input: check the actual view's labels, and swap the order if needed\n   to inspect the other amount. Keep the original pair labels with both views. [S24]\n4. If using the highest and lowest of several eligible relatives' amounts, retain\n   the full measurement set and eligibility checks. The relatives' results are not\n   independent evidence. A surprising screen result sends you back to the inputs,\n   paths and reference scope; it does not by itself reject a documented relationship.","sources":["S26","S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e41d8cd693ba","kind":"platform-ui","anchor":"To find candidates for that investigation, click one of the match's segments, choose **View match** and turn on the overlay's switch that shows overlapping segments; the overlay also lists matches who appear to share DNA with this one [S35 @2026-11-12], [H10 @2026-11-12], [H12 @2026-11-12]. Both views are built only from the coordinates entered in this map, so a match never painted cannot appear. Treat every name there as a candidate for the provider's own shared-match or triangulation check, never as a triangulated match.","sources":["S35","H10","H12"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3b4a9c768b87","kind":"platform-ui","anchor":"To review the whole map rather than one match at a time, download a provider's segment file and import it with **Import segment data**, which needs an active DNA Painter subscription. On 2026-11-12 DNA Painter's import help accepted FamilyTreeDNA's chromosome-browser **Download All Segments** file, a GEDmatch **Segment Search** CSV, a DNA Painter map's CSV export and a file built on its template, and said segment data is currently unavailable from 23andMe and MyHeritage [H9 @2026-11-12]. A 2024 post also lists 23andMe and MyHeritage files downloaded in late 2023 or before, and the output of DNA Painter's Bucketing tool [S10 @2026-11-12]; the current help page does not mention those older files, so check the imported result before relying on one. By default the import leaves out matches sharing more than 2,000 cM and matches already imported from that company under the same name [H9 @2026-11-12]. The 2023 subscriptions post also describes restricting an import to one chromosome or to matches above set thresholds [S29 @2026-11-12]. Record each filter and the imported match count: a stretch with few segments in a filtered import can be the filter's doing. Use the imported map to find stretches where few matches land, apparent personal pileups where more matches stack than elsewhere, and other matches on a segment whose source you have identified [S29 @2026-11-12]. A stack of matches on one interval is a reason to run the pileup and false-match checks in [X-DNA and phasing judgment](xdna-phasing-judgment.md), not a cluster, and an overlap is still not triangulation (step 5).","sources":["H9","S10","S29"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c6fa6c413978","kind":"platform-ui","anchor":"Read FamilyTreeDNA's myOrigins Chromosome Painter segments, downloaded with **Download Segments**, as provider estimates in the same way, with two further limits. FamilyTreeDNA paints by super population or by continental region; its population clusters are listed in the sidebar but not painted [H15 @2026-11-12]. A regional percentage such as Ireland therefore has no painted segment of its own, and its absence is not a contradiction [S34 @2026-11-12]. FamilyTreeDNA also paints each chromosome's maternal and paternal copies in an arbitrary order [H15 @2026-11-12], so never read its haplotype 1 and haplotype 2 labels as parental sides, even when a parent has tested there. The developer found ancestry that came only from his father labelled as both haplotypes, and DNA Painter imports the file as unknown or both [S33 @2026-11-12].","sources":["H15","S34","S33"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7a72d027ee83","kind":"platform-ui","anchor":"Preview inferred intervals before you save them. Paste the generator's output into **Paint a new match**, lower the cM filter below the 7 cM default so that short inferred pieces are kept, and click **Preview these segments** to overlay them without saving; then filter the map to the parental side the inference concerns [S30 @2026-11-12], [H10 @2026-11-12], [H11 @2026-11-12]. The developer lowers the filter to 6 cM in a full-aunt example because inferred intervals are often small parts of larger measured segments [S30 @2026-11-12]. Use the lower filter for inferred output only; it is no reason to paint small ordinary matches.","sources":["S30","H10","H11"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a6b2e1d8b33e","kind":"platform-ui","anchor":"When the testers are full siblings and the untested person is their parent, use the [Shared cM Investigator](https://dnapainter.com/tools/sci) to estimate that parent's total with the match. Paste each sibling's segments with the match into a separate field. For a sibling who tested and shares nothing with the match, tick **Sibling has tested but shares no segments of DNA with the match**: a blank field leaves that sibling out of the calculation, which raises the estimate [S37 @2026-11-12], [H13 @2026-11-12]. The tool needs valid data from two or more siblings with at least two distinct segments. It totals the siblings' distinct segments and divides by 1 − (½)^S, the average share of a parent's DNA that S siblings carry between them (75% for two) [H13 @2026-11-12], [S38 @2026-11-12].","sources":["S37","H13","S38"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5f76a4c2dde","kind":"platform-ui","anchor":"Label that result a modeled estimate, never a measured cM, before you take it to the Shared cM tool or WATO. It runs low when the tested siblings between them carry less of the parent's shared DNA than the average share the divisor assumes, as when a large segment reached no tested child, and high when they carry more, as when all of it reached them, most of all with only two siblings [S37 @2026-11-12], [S38 @2026-11-12]. It runs high under endogamy, pedigree collapse or related parents, because it assumes the shared DNA came through one parent [S37 @2026-11-12], [S38 @2026-11-12]. In the developer's own check of ten estimates made with four siblings, six came within 5% of the parent's measured amount and the worst was about 20% low (50 cM against a measured 62.6 cM); that is a small sample, not an error rate [S37 @2026-11-12].","sources":["S37","S38"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e43b57d6e404","kind":"platform-ui","anchor":"When you preserve the matrix, export it in a form that keeps the relationships. On 2026-11-12 the example matrix offered **Export matrix as CSV**, **Export matrix as CSV with relationships** and **Export matrix JSON data**; a JSON file loads back through **Load** and overwrites everything in the matrix, so export the current matrix before loading one [H14 @2026-11-12]. The launch post describes the plain CSV as testers and shared amounts only, and pasted FamilyTreeDNA or GEDmatch data as bringing no relationships [S15 @2026-11-12]. Relationships come from your own entries or from a CSV that includes them [H14 @2026-11-12].","sources":["H14","S15"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0e3c7d4532c9","kind":"platform-ui","anchor":"Read each histogram bar by its upper label: a bar labelled 600 holds the submissions from 501 to 600 cM, so a bar covers the amounts above the previous bar's label up to its own [S31 @2026-11-12], [S23 @2026-11-12]. The relationship box gives the low-to-high range at the 99th percentile [H5 @2026-11-12]; before treating an amount near either end as typical, see where most submissions fall. In the 2020 launch post the parent/child lower bound was 2,376 cM while the great majority of submissions lay between 3,300 and 3,900 cM, and the developer could not tell whether the low ones were outliers or typing errors [S32 @2026-11-12]. For relationships more distant than half second cousin, the box average counts only pairs that shared detectable DNA [H5 @2026-11-12]. Do not use the fifth-cousin average of 25 cM as the amount any fifth cousin is expected to share: the same post estimates that only about 10–30% of fifth cousins share detectable DNA, so a missing match does not by itself count against a distant relationship [S32 @2026-11-12].","sources":["S31","S23","H5","S32"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6971fcad3817","kind":"method","anchor":"Relationships that share one expected amount can put the common ancestor at different depths. In one band of Estes's generation chart, which counts generations back from the tester, the common ancestor with a half 1C3R is in the grandparents' generation, with a 2C2R or half 2C1R in the great-grandparents', and with a 3C in the great-great-grandparents' [S36]. Several relationships share the same expected amount and cannot be told apart by the amount alone [S39]. For a removed cousin the common ancestor also sits deeper in the younger person's tree than in the older person's, by the number of removals. For each relationship the amount allows, search the generation it implies in both trees. Take which of you is in the older generation from the pedigree; where the pedigree cannot tell yet, search both depths and use birth years only to test plausibility. Do not search only the same-generation depth.","sources":["S36","S39"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
