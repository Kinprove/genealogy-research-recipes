claims:
  - {"id":"C-d3ce70438934","kind":"method","anchor":"Read the index headings before searching by the owner’s surname. In the Milam County example, the owner’s entry was filed under the initial of the brand design [S1]. Follow the index reference to the recorded drawing and owner.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-1dc444f28e6d","kind":"unclassified","anchor":"Follow the locator to the matching register and verify its title, volume and printed page.\nIf the original cannot be retrieved, keep that status and inspect an authorized surrogate's\ndescription. Compare the box/reel contents and actual volume/page coverage: a reel can include\noverlapping volumes or repeated volume labels. A plausible reel title alone does not resolve\nthe entry. Keep original-register, film/reel and viewer-image locators linked and distinct. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-97daad4834c4","kind":"method","anchor":"The Legal Genealogist recommends searching for town or county livestock mark registers with the terms brand, mark and earmark in the FamilySearch catalog, Google Books, HathiTrust and Internet Archive, and says such registers generally do not sit inside books of births, marriages and deaths, although the one discussed did. [S2] The Shaftsbury, Vermont register, with entries from 1766, included annotations such as “dead” or “moved away” [S2]. Use the dated registration to place the owner in town and an annotation as a lead to a death or move. Check the event in other records before giving it a date.","sources":["S2"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1c01910f7c3a","kind":"historical","anchor":"When North Carolina county court minutes mention a county ranger, read the office as the keeper of stray-animal records rather than assuming a military, law-enforcement or forestry officer, and look for the ranger's book. Under chapter IX of the November 1777 act, county courts appointed the ranger, marks and brands were entered in that book, two neighborhood freeholders appraised strays with the appraisal returned to the ranger, and owners could prove property within twelve months. [S3] The Legal Genealogist reports stray lists returned annually to the county court in later years, in February by 1798, and stray records as late as the early 1900s; those points were not verified, and the 1777 text does not itself require a list of strays to go to the court. [S4]","sources":["S3","S4"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-acf0fe5bd284","kind":"platform-ui","anchor":"Browse **Pets and Livestock → Livestock Brands and Marks** on Cyndi’s List [S6 @2026-11-22] for\nbrand books and indexes (a tip from the available excerpt [S5 @2026-11-22]). Follow links for the\nlocality and period to the underlying catalog or record. Continue with local catalogs if the\ndirectory has no matching link.","sources":["S6","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d39b01b69876","kind":"method","anchor":"For a deceased owner, transcribe any farm or ranch name and address given in the historical\nentry [S7] [S8]. Keep the date and any address label with the transcription. Use a mailing\naddress as a clue and verify the farm’s location independently.","sources":["S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
