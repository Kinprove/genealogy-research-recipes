claims:
  - {"id":"C-d3ce70438934","kind":"unclassified","anchor":"Read the index headings and arrangement before searching by the owner's surname. A design\ninitial can be the filing key: the teaching example finds an owner under the letter beginning\nthe brand, rather than the owner's surname. Establish this from the supplied index; do not\ngeneralize that arrangement to every brand book. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1dc444f28e6d","kind":"unclassified","anchor":"Follow the locator to the matching register and verify its title, volume and printed page.\nIf the original cannot be retrieved, keep that status and inspect an authorized surrogate's\ndescription. Compare the box/reel contents and actual volume/page coverage: a reel can include\noverlapping volumes or repeated volume labels. A plausible reel title alone does not resolve\nthe entry. Keep original-register, film/reel and viewer-image locators linked and distinct. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-97daad4834c4","kind":"method","anchor":"The Legal Genealogist recommends searching for town or county livestock mark registers with the terms brand, mark and earmark in the FamilySearch catalog, Google Books, HathiTrust and Internet Archive, and says such registers generally do not sit inside books of births, marriages and deaths, although the one discussed did. [S2] In that example, from Shaftsbury, Vermont, a reader's find that the author discusses, with entries from 1766 onward, a registration places the owner in town and notations such as \"dead\" or \"moved away\" stand in for missing death or deed evidence, but the author offers this only for use \"in a pinch\" and says the town's purpose was \"potentially\" to free the mark for reuse. [S2] Treat this as one reported example, usable only where a register actually carries such annotations, rather than as settled proof of a death or a move. [S2]","sources":["S2"],"checked":"2026-11-08","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1c01910f7c3a","kind":"historical","anchor":"When North Carolina county court minutes mention a county ranger, read the office as the keeper of stray-animal records rather than assuming a military, law-enforcement or forestry officer, and look for the ranger's book. Under chapter IX of the November 1777 act, county courts appointed the ranger, marks and brands were entered in that book, two neighborhood freeholders appraised strays with the appraisal returned to the ranger, and owners could prove property within twelve months. [S3] The Legal Genealogist reports stray lists returned annually to the county court in later years, in February by 1798, and stray records as late as the early 1900s; those points were not verified, and the 1777 text does not itself require a list of strays to go to the court. [S4]","sources":["S3","S4"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
