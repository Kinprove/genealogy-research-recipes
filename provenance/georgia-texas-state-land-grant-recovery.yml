  - {"id":"S26","kind":"web-page","urls":["https://www.glo.texas.gov/archives-heritage/search-our-collections/land-grant-search"],"published":null,"retrieved":"2026-11-13","access":"read","rights":null,"basis":"read 2026-11-13","entry_sha256":"0ed83e404b0dc5b4b9040e8553c302f00fe462bc0b3476fb3020ee5428f4bf84","claims":["C-4a33c892ea0e","C-a116af3d7479"],"review":"reviewed"}
claims:
  - {"id":"C-e66e793b0f0c","kind":"method","anchor":"- **Georgia and Texas are not public-land states.** NARA's federal land-entry files cover the 30 public-land states. Texas is excluded by name, and the original 13 states, Georgia among them, are excluded as a group [S21]. Do not search BLM-GLO or order a federal case file for an original grant in either state.\n- **Do not expect section, township and range.** Texas kept its public domain at statehood and uses its own survey system. Texas descriptions use the vara (about 33⅓ inches) and the labor (1,000,000 square varas, about 177.1 acres) [S22]. The league is 25,000,000 square varas, about 4,428 acres [S7]; one league and one labor make 4,605.5 acres [S18]. Georgia lottery land is described by district, section and land lot [S1], [S5].\n- **Original grant at the state, later sales at the county.** In Texas, transactions after the original grant were recorded at the county courthouse [S7]. Georgia lottery grants and headright grants were issued by the state [S11], [S16]. Search county deed books only for what happened after the grant.","sources":["S21","S22","S7","S18","S1","S5","S11","S16"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-646eac7ff78d","kind":"historical","anchor":"- **East of the Oconee: headright and bounty.** From 1783 to 1909 Georgia granted land east of the Oconee River by headright and bounty grant. The grantee chose the land [S16]. A county land court took the petition and issued a warrant of survey [S16].\n- **West of the Oconee: lottery.** Georgia held eight lotteries between 1805 and 1833 [S11]. Each was set up by its own act, which set its own lot size, fee, eligible classes and exclusions [S12], [S13], [S14], [S15].\n- **Name the role before you search.** A person can appear as a whole-lot grantee, a fractional-lot grantee, a participant, a fortunate drawer or a purchaser of land the state sold after a lottery. Each role has a different research route [S6], [S17]. Do not use one search strategy for all lotteries [S6].\n- **Do not apply neighbour-cluster reasoning to lottery lots.** Headright grantees chose their land [S16]. Lottery lots were assigned by draw, and winners did not choose where their land lay [S3], [S11]. A drawer's lot neighbours are not evidence of kin. The people who registered in the same county are the better cluster.","sources":["S16","S11","S12","S13","S14","S15","S6","S17","S3"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-676892daf84f","kind":"historical","anchor":"| Entry or class | 1805 lottery | 1827 lottery | What it does not show |\n| --- | --- | --- | --- |\n| `orphan(s)` | Under 21, father dead, and mother dead **or remarried**; one draw for the orphan or the family of orphans [S12] | Under 18 with father dead, and 3 years' residence in Georgia or residence since birth: a family of one or two orphans gets 1 draw, three or more get 2. An orphan whose father was killed in the War of 1812 or an Indian war gets 2 draws. A convict's children with 3 years' residence get 1 draw; if their father had not drawn in any former lottery, they drew as if they were orphans [S13] | Under 1805 rules it does not show the mother was dead; under 1827 rules it says nothing about the mother. Under 1827 rules, two draws do not by themselves mean three or more children |\n| `[name]'s orphan(s)` with an absent father | — | Wife or child with 3 years' residence in Georgia, husband or father absent from the state 3 years: 1 draw [S13]. Lots won vested in them as though he were dead [S1] | That he had died. See [AI for documentary records](ai-for-documentary-records.md) |\n| `widow` | Widow with a child under 21 and one year's residence in Georgia: 2 draws [S12] | Widow with 3 years' residence in Georgia: 1 draw. Widow of a man killed in the Revolutionary War, the War of 1812 or an Indian war: 2 draws [S13] | When he died, which marriage, or the husband's name |\n| illegitimate children | — | Under 18, with residence in Georgia since birth: 1 draw for a family of one or two children, 2 for three or more [S13] | Who the father was |\n| exclusions | — | Prior fortunate drawers (a Revolutionary War veteran who had drawn before kept 1 draw), deserters, men who refused to serve, tax defaulters, people who fled debt, penitentiary convicts [S13] | A missing name proves none of these. It is only a reason to check them |","sources":["S12","S13","S1"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bcf01194564d","kind":"historical","anchor":"- **A 1805 orphan entry can sit beside a living mother.** In 1805, Robert, Elizabeth and Samuel Cessna were listed together as \"Persons Entitled to Draw as orphans\" and drew a blank. Their father had died by 1797, and their mother had remarried in 1803 [S4]. That is the 1805 rule at work, not an error.\n- **A family of orphans shares one entry.** In 1805 the orphan or the family of orphans had one draw [S12], so the children appear together. Confirm that each name belongs to the family, and establish each child's parentage with estate or guardianship records [S4], [S17].\n- **A grant to \"John Royston's orphan\" does not say which child.** The 1831 grant names only the class, and the residence was Gaines District, Morgan County [S1]. The author's choice of Thomas Beverly Royston rests on residence, migration and naming evidence. It is called probable, not proved [S2]. Keep the drawer unnamed until other records narrow the choice.\n- **A widow entry does not name the husband.** In 1827 a Sarah Vannoy of Fayette County drew as a widow [S3]. The author ties her to Daniel Vannoy, who died in October 1826, and believes she was a woman other than his never-divorced wife [S3]. That identification is the author's inference. The entry shows that she claimed widow status, had three years' residence in Georgia and lived in Fayette County when she registered [S13]. Linking her to a particular man, a death date or a lawful marriage needs other records.\n- **Children past the age limit drop out.** In 1805 orphans had to be under 21 [S12]. A handout on the lotteries makes the same point for 1820: children over 21 at registration were not included as orphans [S17]. A sibling missing from an orphan entry may simply have been too old.","sources":["S4","S12","S17","S1","S2","S3","S13"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ae5caf11f8b0","kind":"historical","anchor":"- **Most lotteries list only winners.** The Georgia Archives calls 1805 the only lottery that lists the unfortunate drawers [S12]. Some counties have partial registrant lists for other lotteries [S17]. The 1805 list gives each entrant's number, name and remarks, county of residence and result [S23]. For 1832 the standard published list is of fortunate drawers [S14]. Do not read a missing name in a later lottery as proof that the person did not register, was not eligible or was not a resident.\n- **A blank is a result, and it shows registration.** Commissioners drew a name ticket and a prize ticket together. A blank meant no land [S11]. Before 1820, blank tickets were added to the prize wheel. After 1820, names left in the wheel counted as blanks [S11]. A blank entry, where one survives, shows that the person registered in that county under some eligible class [S1], [S2].\n- **A draw is not a grant.** A fortunate drawer took out the grant only after paying the fee: $18 a lot in 1827 (202½ acres) and 1832 (160 acres), and $10 for a 40-acre gold lot [S13], [S14], [S15]. If the fee went unpaid, the lot reverted to the state for sale to the highest bidder [S11]. In one 1820 case the widow's lot reverted and was granted to another man in 1847, while her orphan daughter's lot was granted in the daughter's own name [S17]. Look up the grant itself, and expect the grantee to differ from the drawer.\n- **The grant date is not the draw date.** The Royston lot was drawn in the 1827 lottery and granted on 21 December 1831 [S1].\n- **Residence comes from the registration, not the lot.** Entrants registered in their county of residence [S11]. The residence shown with the drawer, such as \"of Gaines District, Morgan County\", is the evidence of residence [S1]. Many winners sold their lots without moving there [S5], [S1]. Do not place the person on the lot without a later deed, tax entry or residence record.\n- **Expect loss behind the grant.** The deeds that might show the Lee County lots being sold do not survive [S2], [S3]. When the county trail ends, record the grant and the residence at registration, and stop there.","sources":["S12","S17","S23","S14","S11","S1","S2","S13","S15","S5","S3"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-335fd7b479f6","kind":"historical","anchor":"- **The class gives an arrival window, read with care.** Use these windows: Class 1, before 2 March 1836; Class 2, 2 March 1836 to 1 October 1837; Class 3, 1 October 1837 to 1 January 1840; Class 4, 1 January 1840 to 1 January 1842 [S18], [S24]. Class 2 began at the Declaration of Independence, 2 March 1836 [S24]. The GLO sheet's \"22 March 1836\" is a misprint [S18], [S24].\n- **The heading on the file is not always the class.** Fourth-class headrights, the four Republic colony grants (Peters', Fisher and Miller's, Castro's and Mercer's) and some early preemption grants are filed under the Class 3 heading. Military headrights, for volunteers who arrived between 2 March and 1 August 1836, are filed under Class 1 [S18]. Read the act and the documents inside the file before you turn a heading into an arrival date.\n- **The acreage shows the family status claimed.** Class 1: one league and one labor (4,605.5 acres) for a head of family, ⅓ league for a single man. Class 2: 1,280 or 640 acres. Classes 3 and 4: 640 or 320 acres [S18]. Applicants proved residence and marital status through two witnesses [S7]. This is what was sworn at the time of the claim, not proof of a marriage. County boards approved almost all claims, and some witnesses were not credible [S8]. Look for the wife and children in other records.\n- **Conditional and unconditional certificates show different things.** For Classes 2 and 3, a conditional certificate came first. The unconditional certificate followed after the three-year residence condition was met [S18]. Class 4 also required living on the land and cultivating ten acres [S18]. A conditional certificate alone does not show that the person stayed.\n- **The board's county is the residence; the survey is not.** Applicants applied to the land board of the county where they lived. They could locate the land in that county or in any county with vacant land [S7]. The GLO sheet sets no residence condition for a First Class headright [S18]. Do not move the residence to the survey location.\n- **Mexican-era colonists left other records.** Character certificates can give origin, arrival, marital status and household [S10]. Austin's Register of Families survives in three versions that differ in notes and context. Read all three [S10].","sources":["S18","S24","S7","S8","S10"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fe012d90110c","kind":"method","anchor":"- **An abstract is a pointer.** Ancestry's \"Texas, Land Title Abstracts\" holds abstracts of General Land Office titles. Use a hit to find the file in the GLO Land Grant Database [S7], [S8]. The book-series method is in [land index and book series recovery](land-index-book-series-recovery.md).\n- **Search the Surname Index first for spellings and file numbers.** It lists grantees and patentees of the Republic and the State, and Spanish and Mexican grantees in the Spanish Collection [S19]. A typical file number is the land district abbreviation, the class and the file number, such as `Har 1 – 000131`. The documents in the file, not the heading, decide the class [S19], [S8].\n- **The land district is not the county.** The GLO files grants under 38 land districts, and a district need not match the present-day county where the land lies. Find the county in the Land Grant Database [S19], and do not infer it from the district's name [S8].\n- **Read both grantee fields.** A database row has separate Original Grantee and Patentee fields, plus the abstract number and county [S20]. When the patentee differs from the original grantee, find out from the file who completed the title.\n- **Read the whole file, in colour.** The file can hold the application, certificate, survey with neighbours, field notes and patent [S8], [S7]. Transcribe all of it [S7].","sources":["S7","S8","S19","S20"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4a33c892ea0e","kind":"portal-availability","anchor":"The Land Grant Database holds more than 3 million digitized documents [S26 @2026-11-13]. Most GLO holdings can be used through its website or in its Research Room in Austin, and some items only digitally [S25 @2026-11-13].","sources":["S26","S25"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a116af3d7479","kind":"historical","anchor":"- **No grant does not mean no land.** In one case the man appears in no Texas grant. His tax rolls show land from 1862 and name its original grantee, someone else, and his deed was not recorded until 1889 [S9]. Search tax rolls for the original-grantee name, then search the deeds well past the purchase date.\n- **No grant does not mean he was absent.** Arrival after 1 January 1842 fell outside the headright classes [S18]. A late arrival or a purchase leaves no headright in his name. The original grantee and the patentee can be different people, so search his name in both fields [S19], [S26]. Date presence from tax rolls and the surviving 1847 Nacogdoches census instead, as the author did [S9].","sources":["S9","S18","S19","S26"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
