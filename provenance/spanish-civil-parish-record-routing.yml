claims:
  - {"id":"C-267eb0c81650","kind":"unclassified","anchor":"Use this recipe before you search for, request or write off a Spanish or Andorran record: a birth, marriage or death, a padrón (municipal resident list), a tax or Catastro entry, a notarial deed, a pedigree proof, a military or student file, or a Civil War and repression file. It sends each record to the body that holds it for that date and region. It prevents nine failures: expecting the Registro Civil (civil registry) to cover an event before 1871 and missing the 1841–1870 municipal registers; inferring the diocese from the modern province; calling a parish book lost without the diocesan survival list and duplicates; searching only Andorra for a family said to be \"from Andorra\"; searching the Catastro de Ensenada outside the Crown of Castile, or expecting its household books on PARES; searching notarial protocols by client name, or at the wrong custodian for their age; stopping a pedigree at the Inquisition files; requesting a post-1939 court-martial file without first finding the military court that owns it; and reading an index miss or a town hall's \"not held\" as proof that a record is lost.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-13680f5eeec7","kind":"unclassified","anchor":"- **Reading a baptism field by field, grandparents, the two-surname and joining y/e search lanes, and the diocesan copy:** [Hispanic Catholic register recovery](hispanic-catholic-register-recovery.md), steps 2, 3 and 7.\n- **Parish candidates, the widening order, originals against copies, and dispensation files:** [Catholic parish and diocesan record recovery](catholic-parish-diocesan-record-recovery.md).\n- **A village you cannot place, or one with several names:** [historical place-name resolution](historical-place-name-resolution.md).\n- **Directory entries as address evidence:** [city-directory observation workflow](city-directory-observation-workflow.md).\n- **Yearly tax lists as a residence series:** [tax-roll observation workflow](tax-roll-observation-workflow.md).\n- **Student files beyond the custody checks here:** [school and university record recovery](school-university-record-recovery.md).\n- **The arrival-side search for a U.S. immigrant:** [U.S. immigration search recovery](usa-immigration-search-recovery.md).\n- **Identity rulings:** [evidence/proof judgment](evidence-proof-judgment.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-654d75c7d8b8","kind":"unclassified","anchor":"- **Expect the national Registro Civil only from 1 January 1871.** It rests on the Ley provisional del Registro Civil of 17 June 1870 [S1], [S2]. Before that date, use the parish books and the municipal registers below.\n- **For 1841–1870, look for a municipal civil register as well as the parish books.** A decree of 24 January 1841 ordered civil registers in the provincial capitals, the district seats (cabezas de partido) and the towns of more than 500 vecinos (households) [S3]. Read the municipal archive's inventory for a surviving civil-register series.\n- **Do not expect a register for every town.** Smaller towns were outside the 1841 decree [S3]. Read the inventory before you request a volume, and record a missing series as a coverage gap.\n- **For an event from 1871, order the certificación literal (literal certificate).** It is the full copy of the entry, not the extract. Extract the fields from it with the Hispanic register recipe.","sources":["S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a68e9f4197ef","kind":"historical","anchor":"**Andorra had no civil register before 1997.** The Llei del Registre Civil, published on 14 August 1996, created the Registre Civil del Principat d'Andorra and came into force on publication [S40]. It registers events from the 180th day after that, in February 1997; for earlier events the church registers are the record, and their keepers may certify entries from them [S40]. Search an earlier Andorran event in the parish books (step 4).","sources":["S40"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9d3527319000","kind":"unclassified","anchor":"- **Do not infer the diocese from the modern province.** Spanish dioceses do not follow provincial lines, and parishes have moved between dioceses. Fix the diocese for the event date before you write.\n- **Examples:** on 19 September 1956 a decree moved a list of parishes in the Omaña, La Lomba and Páramo areas of León province from the Diocese of Astorga to the Diocese of León, and ordered the curia's papers on them sent to León [S7]. The Cantabrian municipality of Valle de Villaverde (Trucíos) belongs to the Diocese of Bilbao, while the Valle de Mena, in Burgos province, belongs to the Diocese of Santander [S8].\n- **In the Basque Country, ask the diocesan archive for the parish books.** The diocesan archives of Bilbao, San Sebastián and Vitoria hold the parish books and their digitized images [S4].\n- **Search the Archivo Histórico de Euskadi's Registros Sacramentales index for a Basque event.** It indexes baptisms, marriages and deaths of all the historical Basque parishes, about 1490–1900, under a cooperation programme with the three dioceses [S4], [S5]. The portal shows index entries only. Each entry is linked to the digitized image held by the owning diocesan archive (for Bizkaia, the Archivo Histórico Eclesiástico de Bizkaia), and copies come from that archive [S4].\n- **Test an index miss in the book.** Use the rules in [Catholic parish and diocesan record recovery](catholic-parish-diocesan-record-recovery.md), step 4, and the surname lanes in [Hispanic Catholic register recovery](hispanic-catholic-register-recovery.md), step 3.\n- **Where a diocese has no online index, write to its archive.** Give the parish, the record type, the approximate date and the names.","sources":["S7","S8","S4","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8a4f84f2b137","kind":"unclassified","anchor":"- **Read the diocesan survival list for the parish before you request a book or call it lost.** Urgell, for example, publishes a per-parish spreadsheet with the first and last years of each surviving sacramental book [S6].\n- **Check whether the diocesan archive keeps duplicates.** A book missing in the parish may survive there.\n- **Record originals and duplicates as separate holdings,** with the rules in [Catholic parish and diocesan record recovery](catholic-parish-diocesan-record-recovery.md), step 3.","sources":["S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1029b281099e","kind":"custody","anchor":"- **Ask the parish and the Arxiu Nacional d'Andorra [S42 @2026-11-13] where the parish books can be consulted.** Record which holder answered and what form (original or copy) they hold.\n- **Check the Urgell diocesan spreadsheet for the parish** [S6 @2026-11-13], and record whether it is listed. It lists the Andorran parishes with books of 1863–1870 only [S6 @2026-11-13]. A year missing from it is not a lost book. The Arxiu Nacional d'Andorra's 1993 inventory of the La Massana parish archive (only the opening section was read) says that Urgell's 1972 transfer of parish books over 100 years old to the diocesan archive left out the Andorran parishes, because their books served as the civil register, and that the Andorran archives service took on the description, restoration and microfilming of the parish archives in 1980 [S43 @2026-11-13].\n- **Widen a family \"from Andorra\" to the neighbouring Catalan valleys.** Search the Pallars and Alt Urgell parishes and the Catalan archives as well. Add accent and B/V spelling lanes.","sources":["S42","S6","S43"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b717a610d624","kind":"unclassified","anchor":"- **Check which body holds a town's old padrones before you write to the town hall.** Bilbao's municipal fonds for 1300–1936 are at the Archivo Histórico Foral de Bizkaia, not in the municipal archive [S9]. Look for older Bilbao padrones there. A \"not held\" reply from a town hall does not mean the padrón is lost; ask where its older fonds were deposited.\n- **Find the address first for a padrón without a name index.** If the padrón is arranged by street or district with no name index, take the address from a directory, an electoral roll, a civil act or an obituary, then read the padrón. Never report someone \"not in the padrón\" on the strength of a name search the source cannot support.\n- **Use printed electoral rolls (censos electorales) between padrones and as address finders.** Read the column headings of the edition in hand before relying on any field. Expect women on the 1924 and 1928 rolls, none on those of 1923, 1930 and 1931, and women again from the 1932 renewal [S11]. Online examples: Palencia, 1890–1955, on the Diputación de Palencia website [S10]; Burgos (1890–1955) and Valladolid (1898) in the Biblioteca Digital de Castilla y León [S12]; Bizkaia (1895) in the Diputación Foral's Liburutegi Biltegi [S13].\n- **In Catalonia, use the provincial Treasury delegation fonds (Delegació d'Hisenda) for residence and property.** They are catalogued in Arxius en Línia. The Arxiu Històric de Girona, for example, holds the padrons and llistes cobratòries (yearly tax lists) of the urban property tax for almost every Girona municipality, 1909–1994, and the rural amillaraments (assessment books) of 1941–1958 [S14]. Expect to consult the volumes at the archive or ask by email; the catalogue is online, the volumes may not be [S14].","sources":["S9","S11","S10","S12","S13","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9dcb8e2a78ba","kind":"portal-availability","anchor":"- **Search it only for the Crown of Castile, and not for the Canary Islands, the Basque provinces or Navarre.** The survey began with the royal decree of 10 October 1749 and was almost finished by 1756 [S15 @2026-11-13], [S17 @2026-11-13]. It covered the localities of the Crown of Castile [S15 @2026-11-13], except the Canary Islands and the exempt territories, the Basque Country and Navarre [S41 @2026-11-13].\n- **Expect only the town-level answers on PARES.** The PARES Catastro portal publishes the Simancas copy of the Respuestas Generales (the town-level answers) [S15 @2026-11-13], [S16 @2026-11-13].\n- **Look for the household-level books in the Archivo Histórico Provincial.** The original catastro documentation is kept in the Archivos Históricos Provinciales, and some towns kept copies [S16 @2026-11-13]. Some has been lost: most of the Asturian catastro burned with the Oviedo Treasury delegation in 1934 [S16 @2026-11-13].\n- **A miss in the Respuestas Generales says nothing about a household.** They do not list households.","sources":["S15","S17","S41","S16"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-57b301c5ba6f","kind":"method","anchor":"- **Find the notaries who worked in the district in that year, then search their protocols.** A protocol is one notary's ordered collection of deeds for one year [S18], and its index lists that notary's grantors only [S18], [S21]. Find the notary before you look for the name.\n- **Route by the protocol's age:**","sources":["S18","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-1f2b74861936","kind":"custody","anchor":"| Age of the protocol | Holder | Access |\n  | --- | --- | --- |\n  | Under 5 years | the notary who now holds that notaría (notary's office), as keeper of its protocols [S18 @2026-11-13] | copies from that notary, for a party to the deed or an applicant with a legitimate interest [S18 @2026-11-13] |\n  | 5 to 100 years | the Archivo General de Protocolos of the regional Colegio Notarial [S18 @2026-11-13] | copies from the notary in charge of the archive, for applicants who prove a legitimate interest [S18 @2026-11-13], [S19 @2026-11-13] |\n  | Over 100 years | the historical section: a Colegio's historical protocol archive or the Archivo Histórico Provincial [S20 @2026-11-13], [S21 @2026-11-13] | archive consultation rules; certified copies only from the notary-archivist [S20 @2026-11-13], [S21 @2026-11-13] |","sources":["S18","S19","S20","S21"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9bc34ba333f8","kind":"custody","anchor":"- **Expect older guides to give 25 years.** From 1862 until 8 November 2023 the law sent protocols to the general archive once they were more than 25 years old [S45 @2026-11-13]. Since 9 November 2023 the Colegio's archive keeps protocols at least five years old, and electronic files reach it after 25 years [S18 @2026-11-13]. A Colegio's own page can still give the old line: the Asturias Colegio says its archive holds the Oviedo district's protocols over 25 years old [S19 @2026-11-13].\n- **Transfer dates vary, so check the archive's date range** before you write to it.","sources":["S45","S18","S19"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-932f59e3f4e0","kind":"unclassified","anchor":"- **Do not stop at the Inquisition for a limpieza de sangre (purity of blood) proof.** The military orders, cathedral chapters, colegios mayores (residential colleges) and many offices also required proofs [S24], [S25]. The Inquisition files are in the Archivo Histórico Nacional (AHN) and searchable on PARES [S22]. Search the AHN's Órdenes Militares section too, which holds the knights' proof files (expedientes de pruebas), for Santiago at least [S23]. Then search the other corporate fonds.\n- **Use the current PARES host.** PARES is at pares.cultura.gob.es; the old pares.mcu.es root redirects there [S26]. Old deep links may fail, so rerun a dead link as a catalogue search.\n- **Check the custodian before calling a student file lost.** The AHN holds indexes of Universidad Central (Madrid) student files by faculty [S27]. The cut-off varies by faculty, roughly 1920 to 1936, so later files may still be at the Complutense [S27]. The Universidad de Oviedo lost its own historic archive in the fire of October 1934 [S28]. Look for earlier Oviedo student records in the AHN or Asturian archives before calling them lost.","sources":["S24","S25","S22","S23","S26","S27","S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-586848c0dc30","kind":"unclassified","anchor":"- **Route army personnel files by service category and period.** The Archivo General Militar de Segovia holds the service records (hojas de servicio) of professional personnel, from the mid-18th to the late 20th century, once 20 years have passed since retirement or death, and the files of conscripted troops before the Reemplazo (call-up class) of 1900 [S30]. For a conscript after the Reemplazo of 1900, write to the Archivo Intermedio Militar for the province where the unit was stationed and to the Archivo General Militar de Guadalajara, which receives those files when they are transferred [S30]. Give the name, the corps or unit and the call-up class or year of entry. Request Segovia files from Segovia itself, with its authorisation form for restricted-access files [S29].\n- **Update old navy citations.** The former Archivo General de la Marina \"Álvaro de Bazán\" (Viso del Marqués, Ciudad Real) is now a sede of the Archivo Histórico de la Armada, which took over all its holdings under Real Decreto 33/2023 [S31]. Send a request that cites the old name to the new archive.\n- **Label a death date taken from a pension notice as an inference.** If a notice transfers a pension from the day after the previous holder's death, that start date bounds the death. Record it as calculated, not as a death record.\n- **Use the full-text option in the Biblioteca Virtual de Prensa Histórica.** Its search form offers \"Buscar en el texto completo\" beside the field (metadata) search [S32]. Tick it for a name search, and run the surname lanes from [Hispanic Catholic register recovery](hispanic-catholic-register-recovery.md), step 3.","sources":["S30","S29","S31","S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-94f08acbee4b","kind":"unclassified","anchor":"- **Search PARES for the Centro Documental de la Memoria Histórica (CDMH) cards and the Causa General.** The CDMH general card index of the Secretaría General and the Sección Político-Social is described in PARES down to the single card; each card names the person and the file or archive signature that holds the information. The physical index is not open to users; its database and card images are consulted in the archive's reading room [S33]. Causa General files have item-level PARES records, some with images [S33].\n- **Request a post-1939 court-martial file through the military court that owns it.** Find the Tribunal Militar Territorial (territorial military court) and the Defence archive that holds its files. For the Fourth Territorial Military Court's files at the Archivo Intermedio Militar Noroeste in Ferrol, ask the court for authorisation first [S34].\n- **For Catalonia, use the Arxiu Nacional de Catalunya's open list.** It is a dataset of people tried by military courts sitting in Catalonia, April 1938 to December 1978, with case numbers and archive references; the original files come from the archive of the Third Territorial Military Court in Barcelona [S35]. Take the case number to the file's holder.\n- **For a teacher or other public employee, also search the purge files.** The Archivo General de la Administración (AGA) holds files on the purge (depuración) of officials and publishes purge-file series in PARES [S36]. Also try the PARES portal for Civil War victims and people repressed under Franco, which covers depuraciones and lists the AGA among its archives [S37].\n- **Run every surname lane in each repression source,** as set out in [Hispanic Catholic register recovery](hispanic-catholic-register-recovery.md), step 3.","sources":["S33","S34","S35","S36","S37"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-02d8483a711b","kind":"portal-availability","anchor":"- **Shipping agents' boarding books:** the Fondo Pérez y Cía. (the Compañía Trasatlántica's boarding-ticket books for passengers from Santander to America, 1900–1960), held by the Biblioteca de la Universidad de Cantabria [S39 @2026-11-13]. The library's database searches them by name, surname, destination, ship and departure date, and the digitized books are on its ReCrea site [S39 @2026-11-13]. The surviving books leave gaps, among them 1912–1916 and 1932–1944 [S39 @2026-11-13].\n- **Emigrant societies:** the Archivo de Indianos (Colombres) gathers documentation from emigrant societies [S38 @2026-11-13]. The Centros Asturianos of Buenos Aires and Mexico, among others, helped build its collection [S38 @2026-11-13].\n- **Passenger and emigrant lists from other archives:** the PARES Movimientos Migratorios search takes a name, a birth year and a place and year of departure or arrival [S44 @2026-11-13]. It covers series such as lists of passengers and emigrants, licences to sail to Cuba and Puerto Rico, and records from Montevideo, Mexico, the Dominican Republic and the Rosario consulate [S44 @2026-11-13].\n- **The home town's archive:** read its inventory for any series that records departures.","sources":["S39","S38","S44"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
