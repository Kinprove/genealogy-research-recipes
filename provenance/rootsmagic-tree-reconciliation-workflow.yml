  - {"id":"S7","kind":"video","urls":["https://www.youtube.com/watch?v=VojUgBPUtuw"],"published":"2022-08-24","retrieved":"2026-11-18","access":"partial","rights":null,"basis":"Reviewed 2026-11-18 (video, partial). Read the two supplied transcript excerpts from the RootsMagic segment. Direct playback was unavailable.","entry_sha256":"12545c63c726690ef6b7de947c4ef5befc31de1c61b8af9c0cb0c449512bc62c","claims":["C-3d80e7827158","C-fc2b88fd0770"],"review":"reviewed"}
  - {"id":"H9","kind":"help-page","urls":["https://help.rootsmagic.com/RM11/whats-new.html"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Reviewed 2026-11-18 (help-page, read). The RootsMagic 8 navigation section documents switching between views, including Sources and Places, while retaining the position in each.","entry_sha256":"57df4f0b9314355e969fc2a4b5070f1539cdddec73260e3c8ad9eb3f8e7c5fca","claims":["C-fc2b88fd0770"],"review":"reviewed"}
  - {"id":"H10","kind":"help-page","urls":["https://help.rootsmagic.com/RM12/merging-duplicate-people.html"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Reviewed 2026-11-18 (help-page, read). The page advises backing up the tree and reviewing suggested duplicate pairs and conflicting facts before merging.","entry_sha256":"e81d21c77a7853de410d8fc676db5c04f6c5804904547912486182bdda6b38da","claims":["C-3d80e7827158"],"review":"reviewed"}
  - {"id":"H11","kind":"help-page","urls":["https://help.rootsmagic.com/RM11/individual-list.html"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Reviewed 2026-11-18 (help-page, read). The page documents including everyone in the local database and generating the list in the Report Viewer.","entry_sha256":"2c80a0254923f9b3a5ff5f0edab8d5067d1d6460a28784df97a6a5a52b93b58d","claims":["C-3d80e7827158"],"review":"reviewed"}
claims:
  - {"id":"C-6210aba1abae","kind":"unclassified","anchor":"A matching value or a completed transfer does not demonstrate that its citation,\nrecord URL, event association, note or media survived. Repeatedly copying differently\nrepresented sources can accumulate duplicates. Choose the destination and operation for\neach object, then inspect the saved result. The practitioner's citation-duplication case\nmotivates this check; it is not evidence that every RootsMagic version has the same defect.\n[S1, S2, H1, H2, H3]","sources":["S1","S2","H1","H2","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-53a3ded06d5d","kind":"unclassified","anchor":"1. Name the database that will hold the current research record. Choosing RootsMagic as\n   the master is an explicit project decision, not a requirement that it outrank a better\n   documented source found elsewhere. Record its file path and application version. [S1]\n2. Back up that database before linking or transferring. Preserve its media files too;\n   inspect the installed edition's backup options rather than assuming a database-only\n   backup contains media. [H4]\n3. **Privacy gate:** <!-- privacy-gate: upload --> A first TreeShare upload sends the\n   RootsMagic file's people, possibly including living relatives, to Ancestry; answer\n   the privacy gate in `SKILL.md` before creating the new tree.\n   Choose a small person/family set and the facts needed for this task. Keep unrelated\n   notes and speculative branches outside the proposed sharing scope. [S2]\n   This person set scopes subsequent exchanges through an existing connection. A first\n   TreeShare upload sends the RootsMagic file, not only this working list. Inspect the\n   entire upload file before creating a new Ancestry tree. If its people exceed the\n   intended sharing scope, prepare and inspect a separate scoped database first; record\n   that the resulting connection belongs to that file. [H1]\n4. Confirm authorized editing access to the intended Ancestry tree and FamilySearch\n   profiles. Record the target Ancestry tree and its sharing settings before any new-tree\n   upload; source, note, media and private-content options are independent choices. [H1]","sources":["S1","H4","S2","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0c075f7361a5","kind":"unclassified","anchor":"The [2012 splitting/combining demonstration](https://www.youtube.com/watch?v=KrdQXvtP0yE)\nillustrates selection and overlap in Family Tree Maker; use the installed application's\navailable controls when applying that logic to a RootsMagic working database.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7870695b4d7a","kind":"unclassified","anchor":"If a hosted service offers both the originally uploaded GEDCOM and a newly generated\nexport of its edited tree, choose the version needed for the task. Record the tree and\nsnapshot/date; retain the historical upload separately rather than treating it as current\nresearch. Apply the person/object checks below to the chosen output. The\n[GEDCOM-transfer demonstration](https://www.youtube.com/watch?v=5qSnG6ENAr8) distinguishes\nthese choices; it supplies no universal export control or complete-backup guarantee.\nFor writing research conclusions to a GEDCOM file, see\n[Export research findings to a GEDCOM file without changing what they prove](gedcom-research-export.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-976db65f7871","kind":"unclassified","anchor":"1. Map each RootsMagic record to the intended Ancestry profile and FamilySearch PID.\n   Compare immediate family and identifying records, not only the displayed name.\n2. **Privacy gate:** <!-- privacy-gate: link --> Connecting the local file to an Ancestry\n   tree syncs family data that may concern living relatives; answer the privacy gate in\n   `SKILL.md` first.\n   For Ancestry, use TreeShare from the Publish page in RootsMagic 8 and later.\n   RootsMagic 7.5 had it under the Internet menu, with a toolbar button added on first\n   use. [H1, H8] Initial upload creates a new\n   Ancestry tree; downloading an existing tree creates a new RootsMagic database.\n   Do not describe those operations as attaching any existing local file to any tree.\n   Record which local file the connection belongs to. [H1]\n3. Review a proposed person link before accepting it. Leave competing identities deferred.\n   A record appearing in only one tree does not justify adding or deleting a person. [H1]\n4. **Privacy gate:** <!-- privacy-gate: link --> Linking local people to FamilySearch\n   profiles prepares their data for the shared tree, and some may be living; answer the\n   privacy gate in `SKILL.md` first.\n   Enable FamilySearch support and sign in if needed. Review the matched FamilySearch\n   person before Share Data. AutoMatch establishes links; it does not exchange facts.\n   Check generated links before using them to move information. [H5, H6]","sources":["H1","H8","H5","H6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c086e2e7864e","kind":"unclassified","anchor":"1. Open the matched pair's comparison. In TreeShare, inspect the fact and the offered\n   source/media options before staging an addition or update. Pending changes are not\n   saved changes; review them before Accept Changes. [H1]\n2. In FamilySearch Share Data, inspect both fact details and the proposed operation.\n   Distinguish adding from replacing; some basic events allow only one value, so an\n   existing value may have to be replaced rather than preserved as another event. [H2]\n3. Record `accept`, `defer` or `already_equivalent`, the direction, source basis and\n   proposed add/update operation. Keep both competing values and the reason when deferring.\n   For custom facts, map the type definition separately from the event instances using it.\n   Inspect the destination's actual date/place/description fields, roles, sentence templates\n   and output/privacy options where applicable; keep unmapped or uninspected behavior as an\n   exception. Copying an instance does not verify its definition or resulting visibility.\n   The [custom-facts demonstration](https://www.youtube.com/watch?v=0X9R-Mz9rvA) shows the distinction.\n4. Review sources separately from facts. FamilySearch Sources supports source copying and\n   association changes; WebTag URLs are mapped across this transfer. Inspect the citation\n   details and the fact/relationship association instead of relying on source counts. [H3]\n5. Enter a specific reason when the FamilySearch operation requests one. Deletion,\n   detachment and person-merge repair are separate tasks, not shortcuts to make the\n   comparison display agree. [H2, H3]","sources":["H1","H2","H3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bdbeabf2baa5","kind":"unclassified","anchor":"The [Family Tree Maker demonstration](https://www.youtube.com/watch?v=44HrciUhiHI)\nsupplies the keep/change/detail/defer choices. It does not establish a RootsMagic bulk\ncontrol, historical place equivalence or lossless transfer. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cee587789077","kind":"method","anchor":"1. **Privacy gate:** <!-- privacy-gate: upload --> Accepting the batch sends facts,\n   citations, notes and media about tree people, possibly living, to Ancestry or\n   FamilySearch; answer the privacy gate in `SKILL.md` first.\n   Accept only the reviewed batch, then reopen each affected destination profile.\n2. Check the saved date/place/name or relationship; then inspect its attached citation,\n   URL, source text, note and media when those objects were selected.\n3. Match citations by the underlying record, person and fact before copying more. In\n   the TreeShare demonstration there were ten sources on Ancestry and twelve in\n   RootsMagic. The red difference indicator included custom citations and records linked\n   directly on Ancestry. Copying the ten could yield 22 local entries while leaving\n   equivalent citations unresolved [S2]. Retain both descriptions as possible duplicates\n   until you compare their record details and attachments.\n4. Open a transferred media item or record link with the intended access. A source URL\n   does not by itself establish that an image was copied or is readable locally.\n5. Record `verified`, `partial`, `failed` or `deferred` and the exact missing/changed\n   field. Correct the supported exception deliberately before starting the next provider\n   transfer. [S1, S2]","sources":["S2","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-731d8c3bfcfe","kind":"unclassified","anchor":"Use TreeShare's changed-person view or FamilySearch Central's updates list to identify\nthe next bounded comparison. Recheck the linked person and current destination before\nreusing an earlier decision; another FamilySearch contributor may have changed the profile.\nDo not disconnect and reconnect a tree merely to clear comparison markers. RootsMagic's\nWebHint Settings help warns that disconnecting the file from its Ancestry tree cannot be\nundone: reconnecting means uploading to a new Ancestry tree, downloading into a new\nRootsMagic file or restoring an earlier backup. [H7] The TreeShare help's own no-undo\nnote is for the \"Delete the person from…\" button. [H1]","sources":["H7","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3d80e7827158","kind":"platform-ui","anchor":"Use the full local RootsMagic data for large merges and whole-tree reports, following the\nrecommendation from the available excerpt. [S7 @2026-11-18] Run the merge on a backed-up\nlocal working copy and review proposed duplicate pairs before combining records. [H10 @2026-11-18]\nFor a whole-tree person list in RootsMagic 11, include everyone in Individual List and\nview the report on screen. [H11 @2026-11-18] Keep both jobs outside the online transfer batch.","sources":["S7","H10","H11"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fc2b88fd0770","kind":"platform-ui","anchor":"In RootsMagic 8, select a place in Places, switch to Sources to inspect the source, and\nreturn to Places with the same place selected. [H9 @2026-11-18] The example\nfrom the available excerpt shows this round trip. [S7 @2026-11-18] Resume the place\nreview without searching for it again.","sources":["H9","S7"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
