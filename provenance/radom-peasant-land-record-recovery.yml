claims:
  - {"id":"C-01","kind":"custody","anchor":"If the parish route led you to Kielce, check Radom as well for the governorate's peasant-affairs files. Open the [Radom State Archive catalogue for 58/117/0](https://www.szukajwarchiwach.gov.pl/zespol/-/zespol/28668), `Urząd Gubernialny Radomski do Spraw Włościańskich`. Use the village, gmina and district to identify unit titles in the fond. Look for settlement files under `Urządzenia włościan` and for `tabela likwidacyjna` entries. The office's predecessors checked and corrected the tables and received complaints about measurements [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"A village name alone does not identify the division covered by a peasant-affairs file. For Bardo, use the reported Górne, Dolne and `cz. poduchowna` titles as separate catalogue leads. Check each matching unit for resident correspondence and the `cz. poduchowna` unit for a liquidation table [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"For Szumsko, try the reported 1865–1902 general file and 1868–1901 `cz. poduchowna` file separately. Check the latter for the reported 1896 document. Read the closing witness list and tie each `sołtys` to the settlement named with that office before assigning any residence [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"custody","anchor":"If the peasant-affairs list has no matching table, look in the supporting papers of the village mortgage book. For Radostów, search the [Kielce mortgage fonds](https://www.szukajwarchiwach.gov.pl/zespol/-/zespol/112524), `Hipoteka powiatu kieleckiego` 21/1024/0, for the volume II lead. Inspect the table for named families. Record land, residence and relationship only to the extent that the individual entry states them [S1 @2026-11-22] [S4 @2026-11-22].","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
