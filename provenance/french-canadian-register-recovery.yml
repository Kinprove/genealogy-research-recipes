claims:
  - {"id":"C-538acd06e94b","kind":"unclassified","anchor":"A miss under the name the family used is not a finding. Before reporting absence, re-run each\nsearch with these forms and log every form and its result. Run them in every index you use,\nincluding Généalogie Québec and the PRDH database, which the presenter lists among the Québec\nresources. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-59d2560df782","kind":"method","anchor":"- **Baptismal prefix.** Search each given name alone and in combination. A person indexed as Cécile might be baptized Marie Cécile, and Pierre might also occur as Jean-Baptiste Pierre. Try a hyphen, a space, an initial or the omission of the first name. Brady’s worked example pairs M. Louise with Marie Louise [S1]. Check parents or spouse on the register image before accepting a match.\n- **Dit names.** For Briault dite Lamarche, search Briault and Lamarche separately, both surname orders, and the forms dit and dite. Brady described M. Louise under each surname and the name sequence reversed in the records she consulted [S1]. Keep a separate citation for each form you find. Establish any connection to a place or earlier generation from records naming that place or relative.\n- **Place names.** Search *St*/*Ste* and the spelled-out *Saint*/*Sainte*. Family trees and\n  indexes often use the abbreviation. FamilySearch standard place names spell *Saint* out in\n  full. [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-aee78752f977","kind":"unclassified","anchor":"The presenter treats the baptism, marriage and burial entries as often the only way to show that\nthe different name forms belong to one person. [S1] Search those entries first. For each\ncandidate link, record:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a97c4c3899d2","kind":"method","anchor":"Check the volume heading, then scan the margins of the chronological register for **B** (baptême), **M** (mariage) or **S** (sépulture). Copy the number with its letter and year. In the volume Brady showed, **M 5** marked the fifth marriage of that year even though baptisms and burials intervened [S1]. Use the couple’s names and the date in the entry to verify the locator.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8e90ff951678","kind":"method","anchor":"- To find one event type, scan the margins for that letter. Do not look for a separate burial or\n  marriage book until you have checked that this volume does not cover the event.\n- When the baptism describes the mother as *défunte*, record that she was reported dead by the baptism. In Brady’s Jean-Baptiste example the child was described as born the previous day. That wording neither dates the mother’s death nor gives its cause [S1]. Scan before and after the baptism for her **S** entry, then compare the husband’s name, residence and the parents’ **M** entry.\n- Read each spouse’s parentage and status separately. Brady’s marriage example distinguishes the groom’s and bride’s majority wording and identifies the bride’s mother as deceased [S1]. Keep the literal French with each person. A majority statement alone gives no exact age, and the marriage date supplies only a latest date for the reported death.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-c824a4d60315","kind":"unclassified","anchor":"Do not say Québec had no civil registration before 1994. Clergy and other legally authorized\nofficers kept the civil-status registers in duplicate: one copy stayed in the parish, and the\ncivil copy went each year to the local court clerk (prothonotary). [S3], [S4] The duty to keep\ntwo copies dates from 7 November 1678, when the Conseil souverain at Québec registered the royal\nOrdonnance of 1667. The Ordonnance also made priests hand the second copy to the civil\nauthority after each year. [S6] How far priests complied in the 17th century cannot be\nmeasured, so do not assume a court copy for every early parish or year. [S6] The Civil Code of\nQuébec, in force on 1 January 1994, made the Directeur de l'état civil (registrar of civil\nstatus) the sole officer of civil status. [S4]","sources":["S3","S4","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-701572689b39","kind":"unclassified","anchor":"- The court copy is a separately written copy of the same entries. BAnQ holds it once the record\n  is more than 100 years old; more recent registers are with the Directeur de l'état civil. [S3]\n- Because the registers were made in duplicate, one copy may survive where the other was\n  destroyed. [S5] When the parish copy is damaged, illegible or missing, or the entry you expect\n  is not in the copy you read, search the same dates in the other copy. The PRDH team filled some\n  gaps in the parish series from the court copies this way. [S6]\n- Image sets such as the Drouin collection or FamilySearch's Québec Catholic parish registers can\n  show either copy. Check which one the image shows, and log the copy you read with the entry.","sources":["S3","S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dc4dd82da5fa","kind":"unclassified","anchor":"Before treating an event as unrecorded, write down the date the local register begins. A register\nfrom the right place can still start too late for the event. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-202d17a06df4","kind":"unclassified","anchor":"- **Post registers come first.** Holy Family parish at Cahokia kept its own register from 1699;\n  the Diocese of Belleville holds it. Events in the Green Bay region turn up in the\n  Michilimackinac (Ste-Anne) register, 1695–1821. Search these before going to Montréal.\n- **Montréal is a second route, reported by the presenter.** She says the thinly settled posts\n  were served by priests on circuit from Montréal, who wrote up baptisms and marriages after they\n  got back. [S1], [S2] That does not hold as a general rule for Cahokia or Green Bay, which had\n  their own registers. Use it for events before a post's register begins, or where a post entry\n  is missing.\n- **The Montréal register is Notre-Dame de Montréal.** The presenter says to search \"the\n  cathedral\", but in the 1700s Montréal was one parish, Notre-Dame. The Diocese of Montréal was\n  not created until 1836. Notre-Dame de Montréal is among the Québec Catholic parish registers on\n  FamilySearch.\n- **Clusters.** If circuit entries are present, the presenter expects baptisms and marriages to\n  fall within a few days of each other, because they waited for the priest's visit. [S2]\n- **Burials.** The presenter expects burials to have taken place at the time of death. Do not\n  assume they were written up in Montréal. [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8c30cafb6495","kind":"unclassified","anchor":"The church marriage entry is not the marriage contract. Québec marriage contracts, including\ndowry terms, and probate/estate acts (inventaires après décès, partages) are notarial\nrecords. [S1] Tutelles (guardianships) are judicial acts: BAnQ's Montréal centre classes the\nMontréal judicial district's tutelles and curatelles as judicial acts under CC601, and\nFamilySearch has \"Canada, Quebec, Quebec Judicial District, Guardianships, 1639-1930\". For a\ntutelle, search the judicial series for the district first, then the notary. To search the\nnotarial records:","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cdcac25a8c4f","kind":"unclassified","anchor":"- For an act before 1810, search Parchemin first. It is an\n  inventory of Québec notarial minutes that gives the names of the parties and the kind of\n  transaction. Its publisher gives its span as 1626–1809 and sells access to institutions only,\n  so ask BAnQ or a genealogical library whether it subscribes. Treat a Parchemin entry as a lead\n  to the notary and act date, then find and inspect the act. [S7]\n- Then, or when Parchemin is not available, search Ancestry's \"Quebec, Canada, Notarial Records,\n  1637-1935\". Many hits there are répertoire (notary's index) pages only. Use a hit as a lead to\n  the notary and act date, then find and inspect the act itself. [S1]\n- When neither finds the act, browse by notary. Québec notarial records are arranged by notary\n  and date, not by the names of the people involved. FamilySearch's \"Canada, Quebec, Notarial\n  Records, 1800-1920\" is browse-only images with no name index. To browse it, find the notary\n  working in the family's town, or one named in a compiled genealogy. [S1]","sources":["S7","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4dbbee82160d","kind":"method","anchor":"Read the currency heading before translating an *inventaire après décès*. In the published transcription of Honoré Lord and Marguerite Babin’s Saint-Luc inventory (22 September 1818, notary Roger-François Dandurand, Archives nationales à Montréal, CN601,S107), image 140 part 2 values goods in *livres et sols ancien cours*. The medium pot and lid are priced at 48 sols, entered in the table as 2£ 8s [S8]. Check the arithmetic using 20 sols per livre and 12 deniers per sol [S9]. The £ sign here represents livres. A machine rendering of *livres* as books or pounds loses the unit established by the heading [S8]. Log the original sum, unit and image separately from any modern equivalent.","sources":["S8","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7127d2665dda","kind":"platform-ui","anchor":"On Genealogy Quebec, the Institut Drouin says which copy each folder of its Drouin Collection\nRecords holds. The Fonds Drouin folder has the court copy. The Registres paroissiaux 1621-1876\n(Parish registers 1621-1876) folder has the parish copy, in different images. [S10 @2026-11-13]\nTreat the two folders as the two copies, and log the folder with the entry.","sources":["S10"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-translated-surnames","kind":"method","anchor":"- **Translated surname.** For a family crossing from a French-speaking to an English-speaking area, search a documented English equivalent as well. Greater Sudbury Archives lists Leblanc/White [S11]; compare connecting relatives or residences before joining the hits. Only a transcript excerpt was inspected for the video’s search suggestion [S12].","sources":["S11","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-prdh-register-coverage","kind":"portal-availability","anchor":"Search the PRDH-IGD *Répertoire des actes* for extracts from Québec Catholic baptism, marriage\nand burial registers for 1621–1861. For 1862–1871, use its additional marriage records and go to\nthe parish registers for baptisms and burials. Use the parish and date from an extract to find\nthe register entry. [S13 @2026-11-20] [S14 @2026-11-20]","sources":["S13","S14"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-prdh-paid-hits","kind":"fee","anchor":"Run the name variants through PRDH-IGD’s free results list before opening candidate entries.\nOpening a record, individual, family or union file uses a paid hit. [S15 @2026-11-20]","sources":["S15"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-blue-drouin-marriage-lookup","kind":"platform-ui","anchor":"For a missing Québec marriage, search the Blue Drouin directories in Genealogy Quebec’s *Grandes\ncollections de l’Institut Drouin*. Pick the *Joseph-Drouin* series for 1760–1880 or the\n*Gabriel-Drouin* series for 1880–1935. Look up the groom’s surname in *La Masculine* or the bride’s\nin *La Féminine*. In print, *La Masculine* has 61 volumes and *La Féminine* has 64. When one\nsurname fails, try the other series. Use the parish and marriage date from the directory to find\nthe **M** entry in the register. [S13 @2026-11-20] [S16 @2026-11-20] [S17 @2026-11-20] [S18 @2026-11-20]","sources":["S13","S16","S17","S18"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ancestry-regional-drouin","kind":"portal-availability","anchor":"For a deceased ancestor’s church entry, search Ancestry’s Card Catalogue for *Drouin*. Use\nQuébec Vital and Church Records for Québec, Acadian Vital and Church Records for covered parishes\nin Nova Scotia and New Brunswick, or Ontario Catholic Church Records for Ontario. Check whether\nthe collection covers the parish and year before interpreting a miss.\n[S13 @2026-11-20] [S19 @2026-11-20] [S20 @2026-11-20]","sources":["S13","S19","S20"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-prdh-register-image","kind":"platform-ui","anchor":"If you have access to both PRDH-IGD and Genealogy Quebec, follow the link on a PRDH-IGD act\nextract to the register image on Genealogy Quebec. Use the register image for the wording and\nlocator. [S21 @2026-11-22] [S24 @2026-11-22]","sources":["S21","S24"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-birth-in-baptism","kind":"historical","anchor":"For a birth in a Québec Catholic family before 1994 with no separate civil birth entry, look for\nthe baptism in the parish register. Record any birth date stated in the entry separately from the\nbaptism date. [S21] [S22]","sources":["S21","S22"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-register-copy-labels","kind":"method","anchor":"Use *registres d’état civil* as a catalogue lead for the court series and *registres paroissiaux*\nor *registres de la paroisse* for the parish series. Confirm the copy from the holding description\nor register image. [S21 @2026-11-22] [S23 @2026-11-22]","sources":["S21","S23"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-browse-banq-civil-registers","kind":"portal-availability","anchor":"For a historical Québec entry, browse the digitized civil-status registers in BAnQ numérique by\nparish and year. Check the end of the year or volume for its own index. If the index gives a\nfolio, check both sides. If there is no index or no matching line, scan the date window in the\nregister itself. [S21 @2026-11-22] [S22 @2026-11-22] [S23 @2026-11-22] [S39 @2026-11-22]","sources":["S21","S22","S23","S39"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-parchemin-american-ancestors","kind":"portal-availability","anchor":"Use Parchemin at the American Ancestors Research Center. With a Research or Contributing\nmembership, open Parchemin from *Partner Databases From Home*. Take the notary and act date\nfrom the abstract to the original. [S21 @2026-11-22] [S28 @2026-11-22] [S36 @2026-11-22] [S37 @2026-11-22]","sources":["S21","S28","S36","S37"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-archiv-histo-notary-tables","kind":"portal-availability","anchor":"To identify a notary for an act before 1900, use the tables under *Liste des notaires* in\nArchiv-Histo’s FAQ. Choose the alphabetical table for a name, the chronological table for the\nperiod, or the table by last place of practice for a locality. Check where the\nnotary practiced in the year of the act before narrowing the search to that greffe.\n[S21 @2026-11-22] [S30 @2026-11-22]","sources":["S21","S30"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-browse-individual-notary-index","kind":"portal-availability","anchor":"If Ancestry’s name search misses, check the individual notary’s *index* or *répertoire* in the\nFamilySearch or BAnQ holdings. If the index gives a répertoire page, open that page to get the\nact number. [S21 @2026-11-22] [S28 @2026-11-22] [S31 @2026-11-22] [S33 @2026-11-22]","sources":["S21","S28","S31","S33"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-retrieve-notarial-image-by-notary","kind":"platform-ui","anchor":"When an index identifies the notary, search for that name as a keyword in the FamilySearch\nCatalog. Use the act date and number to select and check the image group for that notary.\n[S21 @2026-11-22] [S28 @2026-11-22] [S32 @2026-11-22] [S33 @2026-11-22]","sources":["S21","S28","S32","S33"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-locate-undigitized-notarial-act","kind":"custody","anchor":"If an act cited in a répertoire is missing from the images, including a marriage contract,\nlook up the notary’s *greffe* in BAnQ’s Advitam catalogue and identify the holding centre.\n[S21 @2026-11-22] [S31 @2026-11-22] [S33 @2026-11-22] [S34 @2026-11-22]","sources":["S21","S31","S33","S34"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-request-undigitized-notarial-act","kind":"portal-availability","anchor":"Request the undigitized act from the holding BAnQ centre with the notary’s name, act date,\nparties’ names, and act number. Include the archival reference if the catalogue gives it.\n[S21 @2026-11-22] [S31 @2026-11-22] [S34 @2026-11-22] [S35 @2026-11-22]","sources":["S21","S31","S34","S35"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-notarial-property-transfer-parties","kind":"method","anchor":"For a property transfer, look under *achat* and *vente* and search for the buyer and seller\nseparately. Read the terms in the act you find. [S21] [S25] [S38]","sources":["S21","S25","S38"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-marriage-contract-estate-provisions","kind":"method","anchor":"For dower or provisions for a surviving spouse and children, read the *contrat de mariage*\nalongside the will and estate inventory. Look for *douaire* and any share set aside for a\nsurviving spouse or children. [S21] [S26]","sources":["S21","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-lifetime-gift-maintenance","kind":"method","anchor":"Look for a *donation entre vifs* to trace property transferred during the donor’s lifetime.\nRead the conditions for any promise of care or maintenance. [S21] [S27]","sources":["S21","S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-engagement-labor-contract","kind":"method","anchor":"For evidence of a person’s employment, look for an *engagement* in the notary’s répertoire\nand read it as a labor contract. [S21] [S28]","sources":["S21","S28"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-testament-execution-and-notarial-localities","kind":"method","anchor":"Search for a *testament* by its execution date. If you have only the death date, browse back\nthrough the notary’s earlier years. For wills and agreements, extend the search to notaries in\nother places where the person had dealings. [S21] [S28] [S29]","sources":["S21","S28","S29"],"checked":null,"stated_as":"fact","review":"reviewed"}
