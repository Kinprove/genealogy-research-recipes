sources:
  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/resources/genealogy-translation-tools/"],"published":"2025-05-20","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s advice to compare a word with the Schrift-Generator, and use Archion and BYU script examples before translation.","entry_sha256":"7f2217e6595437615c1ff086ab892c6afae5439bea5005b8303d1077c46cca19","claims":["C-01","C-02","C-03"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://www.archion.de/en/discover-archion/church-books"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Archive platform’s description of scripts, alphabet tables, exercises and mixed Latin and Gothic usage.","entry_sha256":"17074c20254b89039c6e4a59cc53abf28e6782685502c7b060a2e8f74f73c4d8","claims":["C-01"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.deutsche-handschrift.de/adsschreiben.php"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Tool page shows the word input, script comparison options and output controls.","entry_sha256":"3e7c840a8f5fc98d1728c347a8f762a46eca5e8c068f94e70eaf2e29bc074d3a","claims":["C-03"],"review":"reviewed"}
  - {"id":"S4","kind":"pdf","urls":["https://script.byu.edu/00000183-5c5d-d961-afa7-fedf51dd0000/german-english-handwriting-practice-sheets"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Opened the downloadable practice sheets; the interactive test itself returned HTTP 403.","entry_sha256":"3e1268cc539475912004939fbf01f6ce973ce729f2c531b91e5524cc928f0d77","claims":["C-02"],"review":"reviewed"}
  - {"id":"S5","kind":"web-page","urls":["https://predcuvky.opinio.cz/jak-zacit-patrat-po-predcich-6-dil"],"published":"2024-07-10","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The author suggests using known words as letter samples, checking later Latin-script registers and indexes for local names, working back from legible endings, tracing candidate surnames by hand, and including an attempted reading when asking for help. The article distinguishes Czech and German Neo-Gothic cursive and describes a German-language 1876 birth entry in Radkov as a late example of Kurrent. Its linked image did not load. S6 and S7 supply the historical basis for selecting comparison scripts.","entry_sha256":"a4212af3a683dfadfcb7ada62b04f0ca1f14d730f460c0ed69fb62c3e70f90d9","claims":["C-01","C-04","C-05","C-06","C-07","C-08","C-09"],"review":"reviewed"}
  - {"id":"S6","kind":"web-page","urls":["https://www.czechency.org/slovnik/D%C4%9AJINY%20%C4%8CESK%C3%89HO%20P%C3%8DSMA"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The paleography entry identifies Kurrent as German Neo-Gothic cursive and describes the gradual convergence of Czech and German letterforms by the late eighteenth century.","entry_sha256":"9780f96f955f1d5fb1747cb81adef95570b6d1286fa6807594071467f49d5651","claims":["C-04"],"review":"reviewed"}
  - {"id":"S7","kind":"web-page","urls":["https://pvh.historie.upol.cz/artkey/pvt_00H_0000_28_Rozvinute_nemecke_novogoticke_pismo.php"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The Palacký University tutorial describes the shift from Kurrent to humanistic handwriting in Czech-language texts in the 1850s and its continued use in German-language writing.","entry_sha256":"350dd2fec21890e714064f9cfffa5cb841989986e2b17c866b7bf3c57e129ad3","claims":["C-05"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://www.kurrent-lernen-muecke.de/lehrgang.php"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The course author’s page distinguishes handwritten Kurrent from printed Fraktur and describes the Kurrent writing exercises and historical handwriting samples.","entry_sha256":"ab98f57c118f9a4219095a983bb743c150e408da7638233f4d2f3def8cf7a2c9","claims":["C-08"],"review":"reviewed"}
  - {"id":"S9","kind":"forum","urls":["https://genealogie.taby.cz/viewforum.php?f=41"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read 2026-11-22. The forum’s own posted rules ask for the scan link or hosted image, the entry’s position, and an attempted reading in the original language. For a single word, they ask the poster to identify it and transcribe a few surrounding words.","entry_sha256":"48f1b19345d0249da7124d782dc4f2e99cc99de6878e4696e42cc11002b11349","claims":["C-09"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"Use Archion’s alphabet table and examples for the relevant style. Check whether the scribe switched to Latin letterforms for the disputed word or name. Start with short words or names you can already read and locate two repetitions of the uncertain letter in the same hand before changing the transcription. [S1], [S2], [S5]","sources":["S1","S2","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"If the letter remains uncertain, compare its strokes with the German Script Tutorial practice sheets and then return to examples in the record itself. [S1], [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"Enter a short candidate word in the Schrift-Generator and choose the matching script or comparison view. Compare the joining strokes and the disputed letters with the original. Treat the generated word as a comparison sample and record any remaining uncertainty in the transcription. [S1 @2026-11-18], [S3 @2026-11-18]","sources":["S1","S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"For early parish entries in the Czech lands, compare specimens of both Czech and German Neo-Gothic cursive. Give the German form (Kurrent) more weight as a comparison sample for later eighteenth-century entries and confirm the match against the scribe’s letterforms. [S5], [S6]","sources":["S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"historical","anchor":"Check the entry’s language and keep Kurrent among the candidates for parish registers from the Czech lands after 1850, where German-language writing retained it after Czech-language writing shifted to Latin letterforms. [S5], [S7]","sources":["S5","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"For an unfamiliar parish, skim later historical registers or indexes written in Latin script for local surnames and place names. Treat those spellings as candidates and test them against the older entry’s strokes. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"method","anchor":"If you know the entry’s language and the beginning of a word is hard to read, work backward from its last legible letters. Use the ending to propose possible readings and check their opening strokes against the scribe’s other words. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"Sketch a candidate surname locally from the matching Kurrent alphabet and trace its strokes. Compare where the strokes turn or join at the disputed letters with the scribe’s forms. [S5], [S8]","sources":["S5","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-09","kind":"platform-ui","anchor":"If the disputed word still needs a second reading and the gate clears the material, post a focused request in the Genealogie forum’s Čtení starých materiálů section. Give the archival scan link and the entry’s position on the image. Identify the word and include your partial reading of the surrounding words in the record’s language, with gaps marked. [S5 @2026-11-22], [S9 @2026-11-22]","sources":["S5","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
