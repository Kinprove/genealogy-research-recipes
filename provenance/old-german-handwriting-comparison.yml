sources:
  - {"id":"S1","kind":"web-page","urls":["https://familytreemagazine.com/resources/genealogy-translation-tools/"],"published":"2025-05-20","retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Used the author’s advice to compare a word with the Schrift-Generator, and use Archion and BYU script examples before translation.","entry_sha256":"7f2217e6595437615c1ff086ab892c6afae5439bea5005b8303d1077c46cca19","claims":["C-01","C-02","C-03"],"review":"reviewed"}
  - {"id":"S2","kind":"web-page","urls":["https://www.archion.de/en/discover-archion/church-books"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Archive platform’s description of scripts, alphabet tables, exercises and mixed Latin and Gothic usage.","entry_sha256":"17074c20254b89039c6e4a59cc53abf28e6782685502c7b060a2e8f74f73c4d8","claims":["C-01"],"review":"reviewed"}
  - {"id":"S3","kind":"web-page","urls":["https://www.deutsche-handschrift.de/adsschreiben.php"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Tool page shows the word input, script comparison options and output controls.","entry_sha256":"3e7c840a8f5fc98d1728c347a8f762a46eca5e8c068f94e70eaf2e29bc074d3a","claims":["C-03"],"review":"reviewed"}
  - {"id":"S4","kind":"pdf","urls":["https://script.byu.edu/00000183-5c5d-d961-afa7-fedf51dd0000/german-english-handwriting-practice-sheets"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Opened the downloadable practice sheets; the interactive test itself returned HTTP 403.","entry_sha256":"3e1268cc539475912004939fbf01f6ce973ce729f2c531b91e5524cc928f0d77","claims":["C-02"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"Use Archion’s alphabet table and examples for the relevant style. Check whether the scribe switched to Latin letterforms for the disputed word or name. Locate two repetitions of the uncertain letter in the same hand before changing the transcription. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"If the letter remains uncertain, compare its strokes with the German Script Tutorial practice sheets and then return to examples in the record itself. [S1], [S4]","sources":["S1","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"Enter a short candidate word in the Schrift-Generator and choose the matching script or comparison view. Compare the joining strokes and the disputed letters with the original. Treat the generated word as a comparison sample and record any remaining uncertainty in the transcription. [S1 @2026-11-18], [S3 @2026-11-18]","sources":["S1","S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
