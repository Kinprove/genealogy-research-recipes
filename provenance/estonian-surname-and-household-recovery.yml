claims:
  - {"id":"C-97859a18e85c","kind":"portal-availability","anchor":"Use only historical names of deceased people in the online searches. Start with the farm or village, its manor and its parish at the time of assignment. For a German manor label, use the German–Estonian manor register in VAU. Search the assignment part of Onomastika using the standardized surname. List every candidate assignment locality before selecting a household. Find the archival reference in AIS and open digitized holdings in Saaga. [S1 @2026-11-22] [S6 @2026-11-22] [S7 @2026-11-22]","sources":["S1","S6","S7"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-dac6584dca74","kind":"custody","anchor":"For a Livonian parish, look in Saaga’s Hingeloendid under EAA.1865 for the 1826 interim revision. For a manor in the Governorate of Estonia, compare the 1834 revision with the 1835 surname registers under EAA.1864. Check the revision register for the particular manor. If the expected assignment entry is absent, look for a parish, rural municipality or city council copy and compare the surname in the parish books. Search both the estate and parish forms when they differ. [S2 @2026-11-22] [S5 @2026-11-22] [S6 @2026-11-22]","sources":["S2","S5","S6"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6b0414cc624c","kind":"historical","anchor":"For a 1920s assignment in Petseri County or east of the Narva, use the separate surname-committee series EAA.5433. Start with the locality and check its 1921–1923 lists before applying the nineteenth-century manor route. [S6]","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7def0816c20c","kind":"portal-availability","anchor":"In Saaga, use Hingeloendid to find the 1782–1858 revisions by governorate and manor. Follow the household back from the assignment volume using the village, farm, household number, named family members and any transfer notes. Record the registration place and the stated place of residence separately. Use Kirikuraamatud for the parish entries that can test the household link. [S1 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22] [S5 @2026-11-22]","sources":["S1","S3","S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5a10ff1c5ca1","kind":"method","anchor":"Transcribe the whole name in recorded order. Label a lisanimi provisionally as a farm label, personal or family byname, or an unresolved additional name. Compare local rows before deciding which element is the given name because scribes could reverse the order. Test whether an occupational word is the stated occupation, a byname, or both. Compare a form ending in -poeg or -son with its stem and the surrounding entries before assigning a father. With an unsuffixed name or a string of given-name-like elements, leave the relationship open until repeated entries or explicit kinship identify the roles. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4df850b9dc0d","kind":"method","anchor":"Compare successive entries for the farm and for the family. Check whether the name stays with the holding under a new occupant, travels with the family on a move, or recurs across generations. Keep parallel bynames and earlier farm labels in play. Compare the recipient with earlier occupants before using an assignment as evidence of prior family residence. Follow a documented move backwards to the birth farm as well as forwards to the farm occupied at assignment. A name from either place can reappear in the surname register after going unrecorded. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-49775b104b93","kind":"example","anchor":"In the Haljala sequence, the recipient took the name from his birth farm after moving away, while the subsequent holder of that farm took a name from a different birth farm. Compare the 1811 and 1834 revisions (EAA.1864.2.VI-53 and EAA.1864.2.VIII-127), parish books (EAA.1224.3.7 and EAA.1224.3.9) and the 1835 register (EAA.1864.2.VIII-128) when testing that kind of mismatch. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-caceff892f0e","kind":"portal-availability","anchor":"For a farm or byname lead before the household revisions, browse Saaga’s Vakuraamatud by manor or the authority that made the tax list. Record the book's own coverage and who it names. Use the dated land-tax revision for the locality when following the name across holdings. [S1 @2026-11-22] [S2 @2026-11-22] [S4 @2026-11-22] [S8 @2026-11-22]","sources":["S1","S2","S4","S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-91bc6c49fd56","kind":"method","anchor":"Compare records of the same village before treating the first appearance of a byname as its start. If an early list gives only a given name or an apparent father-name, compare how later lists label the same occupants and village. Compare which farms and householders were actually listed and check a later revision after a postwar gap. If a farm label drops out, search under the incoming holders’ bynames. Record first and last written attestations and leave the intervening use open. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-43b4a2668e97","kind":"method","anchor":"Compare earlier bynames and uncommon given names in the assignment village first, then in neighboring villages and detached manor parcels. Search the attested form and variants with or without initial h, alternative initial stops, a nominative or genitive ending, or an added suffix. Record the village, manor, year and each intermediate record for a proposed transfer. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b0a7673882b3","kind":"method","anchor":"Keep distinct assignments of the same surname in separate rows, even for neighboring manors. Compare themes across nearby assignments and test whether a matching byname is a common formation or a village label shared by different households. Require household evidence before joining bearers. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12e3564837ef","kind":"example","anchor":"For a cross-revision test at Rasina, use Polnische Akten I, pp. 90, 137, 180 and 261 for 1582, 1584, 1585 and 1588, and II, pp. 333 and 429 for 1586 and 1592. Compare the recorded name forms and occupants across those six lists before dating the local adoption of bynames. [S2]","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ba1dcc8db740","kind":"platform-ui","anchor":"For a known historical surname that may have changed, search both the old and the new form in Onomastika’s name-change module. Record the locality and whether the date is a placeholder or a publication date. The early register entries use 1 January 1935 as a placeholder. For later entries follow the publication date to the corresponding Riigi Teataja Lisa and check the named parties in the notice. Keep the prior spelling in the parish and revision searches. [S7 @2026-11-22] [S11 @2026-11-22] [S12 @2026-11-22]","sources":["S7","S11","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-aee5bf8bf4b5","kind":"method","anchor":"Keep the language of the name, the family's origin and the reason for a name change as separate fields. Allow for spelling changes within a line and retain multiple proposed original forms until the underlying records resolve them. Keep branches that retained the older form in the search as well as those that adopted a new spelling. Use the older assignment and Estonianization indexes as separate leads. [S2] [S10]","sources":["S2","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-23cc43fbd727","kind":"historical","anchor":"Read a hit in the 1930s surname protection register as an entry that restricted later adoption of the surname. Registration was optional. If the name is absent from the protection list, keep searching for the family in the assignment and name-change records. [S12] [S13]","sources":["S12","S13"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e5848ca03f44","kind":"portal-availability","anchor":"For a later historical household, browse Saaga’s Vallavalitsuste dokumendid for municipal membership lists through 1918. For the residents’ lists of the interwar era, open each relevant creator’s listing and check the year and locality before reading an absence. Use the years on the individual series rather than the portal category's heading. [S1 @2026-11-22] [S4 @2026-11-22] [S9 @2026-11-22]","sources":["S1","S4","S9"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
