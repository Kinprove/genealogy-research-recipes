claims:
  - {"id":"C-161cd845b425","kind":"historical","anchor":"Open the 25 September 1926 Slavery Convention and find the authority responsible for the locality in the period. Check Article 9 and the ratification, accession, reservation and territorial declarations for that authority. Article 2 sets out progressive abolition. Date a local change from evidence for that jurisdiction. A treaty signature is a different event. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-25fcea29cf01","kind":"historical","anchor":"Use Article 1 to interpret slavery as the exercise of powers attaching to ownership, and slave trade to include acquisition, disposal and transport for enslavement. Check Article 5 separately when the file concerns compulsory labour. It distinguishes the prevention of conditions analogous to slavery from the rules on public purposes and transitional exceptions. Retain the official wording of the record and identify the specific provision it invokes. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-0a669687933b","kind":"method","anchor":"Follow the relevant government’s correspondence and legislative records, then look for Article 7 communications about implementing measures. Search associated investigations, court or labour records using the administering office, institution and place before relying on a name search. Use diplomatic correspondence to date the government’s response and examine local files to see what happened to an individual or household. [S1] [S2] [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
