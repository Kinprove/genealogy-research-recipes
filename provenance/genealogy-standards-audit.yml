claims:
  - {"id":"C-5b21ac23145f","kind":"method","anchor":"- **Version substitution:** an index-only observation is described as an examined\n  original. Identify the version actually seen; distinguish provider-reported\n  archival details from personally checked ones. A source-of-source reference\n  does not imply that the researcher visited that repository.\n- **Locator drift:** an image number is treated as a page or leaf number, or a\n  bibliography points to a collection without locating the cited assertion.\n  Attach each locator to its actual document, film or digital presentation.\n- **Extraction drift:** a translation, normalized date or expanded abbreviation\n  appears as literal source text. Keep the source wording and researcher additions\n  distinguishable; check the original when it is supplied.\n- **Inference omission:** the citation identifies a record but the text never\n  explains why it concerns this person or supports this relationship. Request\n  the missing reasoning; do not invent it or merge identities to fill the row.\n- **Independence inflation:** several citations repeat the same information\n  stream. Record that dependence and route its evidentiary assessment to the\n  judgment recipe; citation count is not witness count.\n- **Quotation drift:** a published history or compiled genealogy quotes a source to show who a\n  person was. Follow its short citation to the full original and compare the quoted wording,\n  especially names, aliases and qualifiers. A comparison of a published piracy narrative with the text it cited found that the quotation dropped an alias while arguing for the identification [B16]. Record the exact variants from the earlier text and reassess the identification.\n- **Place anachronism:** a tree or pedigree entry names a town, county or state that did not\n  exist at the event date, even when sources are attached. Check when each named jurisdiction was\n  created. An anachronistic place makes the entry unreliable as written and may indicate copying;\n  it does not show that the person or event is fictitious.","sources":["B16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-29bbe05ab668","kind":"method","anchor":"For a documented tree or compiled pedigree, check the parent-child links one at a time,\nstarting with the present generation and moving back. Stop at the first link that lacks cited\nevidence and an inspectable argument supporting the relationship; consider both direct and\ncorrelated indirect evidence. A count of other sources attached to the person does not supply it.\nReport that link as the research frontier and mark everyone above it as unsupported; do not\npropose searches for the topmost name. A relationship-viewer path only repeats tree entries. On\neach link, also flag biologically impossible timing; a birth after the father's death alone is\nnot an impossibility. Walk the documented line back until a relationship lacks support [B15], [S1]. If a register is missing, record its coverage and the evidence still needed for that parent-child link [S2].","sources":["B15","S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f2c5a7f781a8","kind":"method","anchor":"If a compiled chart cites an English will for an American immigrant’s parentage, locate the\nwill by testator, probate court and probate date. Inspect the original will or the court’s\nregistered copy and cite the exact passage that bears on parentage [S4]. Leave the link open\nif the will is unlocated, unavailable for inspection or insufficient to support the claim.","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-201f7d3082de","kind":"method","anchor":"When a photograph of a pedigree supplies a decisive name or relationship, compare the exact\nentry with the original and record both locators [S5]. Flag details that occur only in the\nreproduction. Comparing a scanned letter with its original exposed a substituted son’s name\n[S5]. According to supplied transcript excerpts from a reading of Jacobus’s chapter, a\nseparate photographed pedigree included decisive details absent from the original [S3†]. The\nrecording and full transcript were unavailable.","sources":["S5","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-29ed1efa3569","kind":"method","anchor":"Verify each parent-child link in a published royal pedigree even when a lineage society has\naccepted the line. Use any application and attachments in the packet as leads to the citations\nand supporting records, then audit those records against the claimed links [S6].","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-map-version","kind":"method","anchor":"When the packet uses Mills’s Evidence Analysis Process Map, check the flyleaf\ncopy in *Evidence Explained* or a copy from elsewhere for three classes under each\nheading. Use the expanded map in figure 1 of QuickLesson 17 if the copy shows\nonly two classes [S8].","sources":["S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-evidence-classification","kind":"method","anchor":"If a claim row calls a record a “primary source” or an “indirect source,” identify\nthe version examined as an original record, derivative record or authored narrative.\nClassify the extracted information as primary, secondary or undetermined based on\nthe informant’s knowledge. Assign direct, indirect or negative to the evidence\nfor the stated question. Flag conclusions that treat a record’s originality as\nproof of firsthand knowledge or a reliable answer [S8]. According to the supplied\ntranscript excerpts, Scott recommends the three-class check and cautions\nagainst using “primary” or “indirect” to classify the source [S7†].","sources":["S8","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-pedigree-birth-before-marriage","kind":"method","anchor":"In a compiled pedigree, compare the child’s birth date with the stated parents’\nmarriage date. If the birth predates the marriage, flag the link for verification.\nCheck both dates against the cited birth or baptism and marriage entries, and look\nfor records that identify the child’s parents. Keep a birth to the same couple\nbefore marriage and a mistaken parent assignment open until the records resolve\nthe link [S10]. Urdank’s Gloucestershire reconstruction places one couple’s\nfirst child’s birth before their recorded marriage [S10 p. 10]. According to the\nsupplied transcript excerpt, Jacobus describes a pedigree in which a birth before\nthe recorded marriage prompted a review of the assigned parents [S9†].","sources":["S10","S9"],"checked":null,"stated_as":"observation","review":"reviewed"}
