claims:
  - {"id":"C-search-famine-relief-correspondence-1","kind":"custody","anchor":"Search the National Archives of Ireland catalogue under RLFC/2 for the Relief Commission papers. Work by locality, committee and date as well as surname, allowing for uncertain name readings. Use the separate Distress Papers indexes under CSO CR 70 onward where the correspondence concerns local distress, forming a committee or applications for relief funds. Follow each index entry to its letter, report or petition. [S1 @2026-11-22] [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-search-famine-relief-correspondence-2","kind":"method","anchor":"Record the role each person has in the relief document before using its place as their residence. Distinguish the applicant, signatory or committee member, and the people discussed in the letter. Capture any explicit residence or place of relief and its date. An appeal written for a district leaves individual receipt of aid unproven. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-a-workhouse-or-union-lead-3","kind":"custody","anchor":"Look for indoor relief or admission and discharge registers under the appropriate union. Search the volumes covering the suspected stay for the individual or household. Use the guardians’ minute books for the board’s decisions and for named cases where minutes give them. The National Archives of Ireland lists separate holdings for North Dublin (BG/78), South Dublin (BG/79) and Rathdown (BG/137). For another union, establish the holder and surviving years before logging the result. [S1 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
