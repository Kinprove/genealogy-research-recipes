claims:
  - {"id":"C-b1a07de8fedf","kind":"method","anchor":"Open the Donetsk-region *National Book of Memory* in both parts, 2008 and 2009 [S1], [S2], [S3], [S4]. Browse for the historical district and village, then search the testimony and death lists. Give a reported death its own attributed entry. Leave a district death total unresolved when the testimony supplies none. The Part 2 editors describe missing civil-registration entries behind their published list [S4].","sources":["S1","S2","S3","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9499871e943c","kind":"method","anchor":"For the *33rd: Hunger* memorial, search by the district and village in the compilation’s historical arrangement [S5]. Use the article’s footnotes to reach related printed recollections. For Dushka’s account, check *Put Oktiabria*, 16 July 1991. For Bespechnyi’s account, check *Vechernyi Donetsk*, 10 November 2007 [S2]. For the Kostyantinopil household testimony, follow the citation to pp. 215–216 of the 1991 memorial collection [S2].","sources":["S5","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ee1c0932b4d9","kind":"method","anchor":"Read a household’s inclusion in a dekulakization quota as evidence of targeting. Use named testimony and records to check who stayed, who left, when the inventory was taken and which property was seized [S2]. If a possession was omitted, check whether it was away when the inventory was made. One testimony in Hedo and Xenophontos describes a violin out on loan during the inventory and later exchanged for food [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4ec238cf677d","kind":"method","anchor":"In testimony about the “Five Ears of Grain,” record the witness’s account of gathering ears left after harvest and any punishment as distinct observations. Keep a prison term attached to the specific case or local practice described [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2bae51b85492","kind":"method","anchor":"Transcribe the administrative unit named by the document, such as a district, village or collective farm. Track any proceedings against a farm’s governing board separately [S2], [S6]. For Gurzuf or the Vladyka farm, start with Papakin, p. 160 and note 55, for the Soviet Ukrainian Council of People’s Commissars document of 26 November 1932. This reference records an executive committee’s proposed placement. Look separately for an enacted decision or an implementation record, and copy its issuing authority and date [S6]. For official context, search the dates and geographic units in Ruslan Pyrih’s 2007 document collection [S7].","sources":["S2","S6","S7"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a314359f45a5","kind":"method","anchor":"For the paper’s 1923 population figures, use its note 566 to locate the record in TsDAVO of Ukraine, fond 413, opys 1, sprava 909, folio 148. Keep the figures tied to the year and units counted and leave the postwar population open if no postwar counts are available [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
