claims:
  - {"id":"C-46f1cb841a08","kind":"method","anchor":"Turn an empty spouse, death or children field into an open research question. An adult with no recorded marriage may have a spouse or children missing from this tree. Add the marriage or household search to the worklist [S1]. Describe a person as never married or childless only when a source supports it or the search satisfies the negative-evidence gate in the closing section. Cite the evidence for that conclusion.","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-4e93a8d0ef87","kind":"unclassified","anchor":"Go through the whole descendancy view and flag every person who fits one of these patterns [S1], [S2]:","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-162295efdf28","kind":"unclassified","anchor":"1. **Birth but no death.** The person has a birth date but no death date or age at death. They might have died as an infant, or lived to old age and married more than once. A missing death date also leaves the marriage question open [S1], [S2].\n2. **Adult with no spouse.** The person lived long enough to marry, but no spouse is recorded [S1].\n3. **Couple with no children or too few.** The couple's lifespans allowed time for children, but none are recorded, or very few are. The presenter says that in the 1800s having children was much more common than having none, and that smaller families of one or two children become more plausible in the late 1800s and early 1900s [S1], [S2]. Apply this rule: if the couple's childbearing years fell in the 1800s, flag zero children and also flag one or two children. If they fell in the late 1800s or early 1900s, flag zero children and rank one or two children lower. These are the presenter's search flags, not a demographic norm or evidence that children must be missing. Check the couple's place, years and record coverage before ranking the gap; do not apply an unsourced regional fertility timetable. Check whether the line was compiled surname-only: someone took the direct ancestor in each generation and never added the other children, second wives or other relationships [S2]. A widow who was young enough to still have children at home may well have remarried, so put that on the list too [S2].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-63a9eed5c50d","kind":"unclassified","anchor":"Names repeat often within one family, so keep same-named people apart while you flag [S1].","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-816d0df0edaf","kind":"unclassified","anchor":"Check each flagged person's source count before you start research. Do the people with few or no sources first [S1], [S2]. FamilySearch Family Tree shows the number of attached sources on the person's page (Sources tab and Details page). The descendancy view shows icons for record hints, research suggestions and data problems, and a research suggestion can flag \"no sources attached\". It does not show the count itself, so open the person page to read it. Lower the rank of well-sourced people unless the gap itself is unsourced. The goal is to add what is missing, not to confirm work someone has already done [S2]. Use relatives who already have sources to decide where to search first [S1].","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-37add3759aa6","kind":"unclassified","anchor":"From each lifespan, list every census taken while the person was alive. Then mark each one as name-level, head-only, or largely lost. The name-level censuses that survive are the first targets [S1]. In the U.S., the censuses from 1790 to 1840 name only heads of household, so anyone else appears only as an unnamed tally in the household where they were counted [S4]. The 1890 population schedule was mostly destroyed after the January 1921 Commerce Department fire. Check the surviving fragments, but expect a gap between 1880 and 1900.","sources":["S1","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d9484c81a6df","kind":"method","anchor":"- **U.S. lifespan, 1819–1893.** For 1820–1840, search the named head of household and test the other members’ age groups [S4]. By 1840 the person might themselves head a household. For 1850 and 1860, free population schedules name individuals, while slave schedules generally identify enslaved people only by characteristics such as age and sex [S12]. Include 1870 and 1880, and check whether an 1890 population fragment survives for the locality [S1, S12].\n- **Birth in 1855.** After locating the family, list the census years the child could have lived through. Start in 1860 in the United States or 1861 in England and Wales [S1]. For each subsequent enumeration, check that the person was still alive and living there. In England and Wales, continue through 1921 if the dates fit. The 1931 returns were destroyed and there was no 1941 census [S5]. For someone alive on 29 September 1939, check the separate 1939 Register [S6].","sources":["S4","S12","S1","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-39d30c04fbfe","kind":"unclassified","anchor":"Work out the list from each person's own dates and jurisdiction. Do not reuse these lists as fixed defaults. The presenter calls people in this period comparatively accessible because these censuses exist, and treats that as a factor in choosing whom to research first [S1]. Rank them accordingly.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d2429b3c6128","kind":"unclassified","anchor":"Censuses are not the only targets. Lineage-society applications can carry documented descendant lines. For example, Sons of the American Revolution membership applications require the applicant to prove direct descent from a Patriot [S3]. Use the documents an application cites as leads for each generation of the descendant line.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dc729bff5b1b","kind":"unclassified","anchor":"Do not follow whatever branch looks most interesting. Jumping around that way is how siblings get skipped, and the connection you needed may be in a skipped sibling's line [S3]. Instead:","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-65cb0825ce43","kind":"method","anchor":"- Within each family, go from the oldest child to the youngest. The presenter says most family software programs place the oldest child on the far left, so the sweep runs left to right [S3]. In a vertical list view such as FamilySearch's descendancy view, use birth order instead.\n- Identify every child you can for that family, then move to the next family in the same generation [S3].\n- Finish the whole generation before you go down to the next one. Record the order you used so a later session can pick up where you stopped [S3].\n- Follow an older child across consecutive censuses. Match the other siblings, their ages and their parents before joining the two households [S3]. If the child has moved or the family composition differs, verify the relationship with a birth, marriage or other independent record.","sources":["S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-55e6c3323011","kind":"unclassified","anchor":"- **Open:** gaps remain. Name the next records to check.\n- **Closed:** a source states the absence, or the absence passes the negative-evidence gate in [evidence/proof judgment](evidence-proof-judgment.md): the records should have shown the event, record loss, coverage gaps and index errors are ruled out, and every search is logged with its date. State the reason and the source. A \"never married/no children\" tag then tells collaborators this absence was researched [S3]. A search that found nothing does not close the family by itself: keep it Open and log \"searched X on date, no entry\".\n- **Corrected:** research may show that the people in a family are not actually related to each other, or that the family was made up. If so, stop going down. Go back up the line and correct it until you reach the right ancestors, then continue [S1]. Send merge and separation decisions to the human through [evidence/proof judgment](evidence-proof-judgment.md).","sources":["S3","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9bd03bc0048b","kind":"method","anchor":"For the 10 Million Names Patriots of Color study, start the sweep from the patriot's entry in the DAR Patriots of Color database [S9]. According to Lindsay Fulton's interview, the study worked down through all children and grandchildren and stopped at births after 1900 [S10†], [S11]. When following that workflow, include births through 1900 and mark later births as outside the sweep. Compare the resulting lines locally with a grandparent or earlier ancestor the user has already identified.","sources":["S9","S10","S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-375271d4fbde","kind":"method","anchor":"If the question is whether a childless subject has surviving relatives and the siblings' lines are documented as ended, restart the sweep at the subject's verified grandparents. Work down through the subject's aunts and uncles to the first cousins and their descendants. Use historical census records to trace the branches, with family trees as leads [S7], [S8]. For anyone who may be living, follow the [Living people rule](../SKILL.md#living-people) and work from family materials the user supplied.","sources":["S7","S8"],"checked":null,"stated_as":"fact","review":"reviewed"}
