claims:
  - {"id":"C-35df7a8c3416","kind":"unclassified","anchor":"- **Locality coverage.** For planning the next searches from a locality's record coverage, use [research documentation: turn locality coverage into the next searches](research-documentation.md).\n- **Composite files and book ledgers.** For composite-file headings and a per-year book ledger of pages × targets, use [archival image coverage verification](archival-image-coverage-verification.md).\n- **Locators.** For leaf, side and sequence locators, use [source citation](source-citation.md).\n- **Cancellations and AI transcription.** For bracketed cancellations and AI transcription, use [AI for documentary records](ai-for-documentary-records.md).\n- **Kinship rulings.** For legitimacy labels, separation versus divorce, and the final kinship ruling, use [evidence/proof judgment](evidence-proof-judgment.md).\n- **Jewish records.** For Jewish rabbinate books and registration (приписка), use [Russian-Empire Jewish identity attribution](russian-empire-jewish-identity-attribution.md).\n- **Bessarabian books.** For Bessarabian metrical books of 1811–1923, which the National Archives Agency of Moldova (ANA) keeps in fond 211 by district opis (its op. 23 covers Tiraspol uezd of Kherson guberniya), use [Route a Bessarabian or Moldovan record by date, district and bank of the Dniester](bessarabia-moldova-record-routing.md).\n- **Galician and Bukovinian books.** For Galician Greek Catholic and Roman Catholic books, Bukovinian Orthodox books and the archives that hold them, use [Route a Galician or Bukovinian record by date, confession and custodian](galicia-bukovina-habsburg-record-routing.md).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bda5a3ebfa16","kind":"unclassified","anchor":"- **Start from the pre-1917 units, not today's oblast.** Place the village in its pre-1917 uezd and guberniya, then find the see that held its parish in the event year. Today's oblast boundaries say nothing about where the books accumulated.\n  - Kurgan oblast was created in the Soviet period. Before 1917 Kurgan uezd belonged to Tobolsk guberniya and Shadrinsk uezd to Perm guberniya.\n  - A participant concluded that records for one Shadrinsk-area locality therefore accumulated in Kamyshlov, Ekaterinburg and Perm, not in Kurgan or Chelyabinsk. [S10]\n- **Confirm the village, then the parish, then choose the archive.** First confirm the village in a period list of populated places. Then find its parish in a dated diocesan reference book (Справочная книга … епархии). That book lists the villages of each parish with their distances and names the nearest other church. Only then choose fond/opis/delo. A participant demonstrated the chain with:\n  - the list of populated places of Tobolsk guberniya compiled from 1868–1869 data (St Petersburg, 1871)\n  - the Справочная книга Тобольской епархии к 1 сентября 1913 года (Tobolsk, 1913)\n  - GASO f. 6 op. 10, dela 13, 26, 45, 63, 77, 94, 99, 119, 140 and 170, for the parish's books for 1871–1914. [S7]\n- **Route each period separately when the see changed.** In the same thread, the earlier run for that uezd was given as Tobolsk state archive f. 156 op. 20 (Turinsk uezd metrical books, 1765–1875). [S7] The same participant also reported reading-room restrictions on other opisi of GASO f. 6, but a current online catalogue lists those books as digitised, so that report is out of date. Take the current date ranges and access terms from the archive's present catalogue, not from the thread.\n- **Route by today's custodian of the territory as well as the historic guberniya archive.** When a historic uezd now lies in another oblast, check both today's oblast archive and the historic guberniya archive before you report \"not found\". An inventory may be titled by present-day district rather than by the historic uezd.\n- **Before a consistory existed, look in the earlier see.** For years before an Ekaterinburg consistory existed, search Perm for the second copies, and Tobolsk for earlier years. Participants had found none in either place for that territory. Only a few pre-1799 books were known, filed by chance in GASO fond 24 (Ural Mining Administration). [S10] That early assessment was incomplete. Later in the same thread another participant reported, from his own work with the delo, the books of one Katai church for 1780–1790 without gaps in the Kurgan state archive (Ф. 243 Оп. 1 Д. 1), with 1791–1801 not found. He also listed the 1798–1812 confession lists of another Katai church, with an 1800 metrical book bound in, in the Shadrinsk archive (Ф. 328 Оп. 1 Д. 2). [S10] Search the parish-level fonds before declaring a gap, and record only the parish-years still unlocated as a coverage gap, not as \"no books were kept\".","sources":["S10","S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-44a1467107d9","kind":"unclassified","anchor":"- **Mother parish before a new church.** Compare the person's estimated birth year with the founding date of the nearest church. A participant estimated an ancestor's birth at about 1861. She reported that the local church was built in 1866 and that its books do not survive, so she moved the search to the neighbouring older parishes. [S24]\n- **A newly built neighbouring church.** A participant worked through the books, which are held in a museum in Mishkino. She found that after a church opened in a neighbouring village in 1911, part of one village's Orthodox residents went there. [S6]\n- **Edinoverie and Old Believer residents.** In that village, the same participant found that many Old Believers had moved to edinoverie by 1911–1915. They were baptised, married and buried at an edinoverie church in another village. [S6] For an edinoverie baptism:\n  - Get the parish's village list from the clergy registers (клировые ведомости) and diocesan directories. A participant cited GASO f. 37 op. 4 d. 89 (clergy registers of the Shadrinsk edinoverie churches, 1870–1871).\n  - Separately, list the Orthodox parishes that served the same village. In that case a town church and the cathedral both included it.\n  - Check the founding date. A participant quoted the 1902 reference book Приходы и церкви Екатеринбургской епархии: the town's edinoverie parish formed in 1839, and before that its people went first to the Ekaterinburg edinoverie church and then to Sosnovskoe.\n  - For the years before the founding, the fallbacks are revision lists and confession lists. Those confession lists come from non-edinoverie churches.\n  - Participants noted that the church's surviving metrical books in the local archive begin only in 1861. [S12] The Shadrinsk archive guide, as posted by a participant, gives that church's fond as covering 1861–1919. [S8]\n- **Conflicting parish assignments.** In one thread, participants named different churches for the same village. Those churches' fonds sit in different archives (Kurgan, and probably Shadrinsk). Keep both candidates until a book settles it. [S6]\n- **Town and neighbouring churches.** Baptisms and weddings were not always held in the home church. A participant found family entries in town churches as well. [S8]\n- **Foreign subjects and other confessions.** Look for a Lutheran, a Catholic or a foreign subject in the local Orthodox books too. Participants quoted such people:\n  - as the non-Orthodox spouse in a mixed marriage\n  - as the parents of a child baptised Orthodox\n  - in hospital-church death entries.","sources":["S24","S6","S12","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7115da68814","kind":"unclassified","anchor":"Foreign subjects also appear as godparents and marriage guarantors. Copy the subjecthood, confession and home town as written, and record a confession only where the entry gives it. [S20]","sources":["S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b0510d5414ce","kind":"unclassified","anchor":"Every parish-year has two possible copies: the parish copy stayed at the church, and the second copy went to the consistory. [S24], [S10] Give each copy its own row:","sources":["S24","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e7209bc7ed0d","kind":"unclassified","anchor":"- **Consistory copy.** Look in the consistory fond of the see that held the parish at the event date. A participant said the books for one locality were concentrated in the Ekaterinburg consistory fond, with some later dela transferred to the Kurgan archive. [S10]\n- **Parish copy.** Participants said parish copies passed through ZAGS offices into district or oblast archives (Shadrinsk or Kurgan in that case). Expect pre-1917 parish copies in the oblast archive, not the district one. A participant said it is pointless to look for pre-revolutionary files in Kamyshlov, because a Soviet-era instruction moved such files from district to oblast archives, and that any transfer should be marked in the inventory. [S10]\n- **Read the inventory for transfer notes.** A participant transcribed the inventory of one Shadrinsk-archive church fond (Ф. И-264). It marks several metrical-book dela as handed over to a district ZAGS (Батуринский ЗАГС), so treat that ZAGS as a separate holder. Another participant said a 1913 book for one parish might be in the Kurgan archive or in the district ZAGS. [S8]\n- **Books after 1917.** The decree of 18 (31) December 1917 recognised only civil marriage, set up civil registration offices and ordered church registers sent to the city, uezd and volost zemstvo boards. From the decree of 20 January (2 February) 1918, only civil offices kept acts of civil status. [S38], [S39] Church books continued in places: the Irkutsk archive holds Orthodox metrical books of Irkutsk diocese for 1911–1922, and a 1924 circular dealt with church marriages concluded after 20 December 1917 in territory held by the Whites. [S41], [S42] Give a post-1917 parish-year three rows: the ZAGS archive, the oblast archive (consistory and church fonds), and any transfer the inventory notes. ZAGS act books stay with ZAGS for 100 years from each entry and then go to the state archive (Federal Law 143-FZ, art. 77). [S40] A book's place can still differ from what that term predicts: the Irkutsk archive received the 1911–1922 church books from the oblast ZAGS archive in 2008. [S42] Search all three rows whatever the book's age.\n- **Do not trust inventory titles.** Order the delo and check its contents:\n  - A participant found dates in a delo that differed from its inventory entry, and leaves that clearly came from other documents. [S8]\n  - Another said that in Perm many documents are hidden in inventories under other names. [S10]\n  - The 1776 confession list participants cited is catalogued under a church name and a see that differ from today's. [S10]\n  - A file titled by dedication (\"книга Дмитриевской церкви\", \"Никольской церкви\") may belong to a church of that dedication in another village, not to a village called Dmitrievka or Nikolskoe. Fix the parish and village from the full file title, the inventory and the entries before you use the book, or its empty search, for the similarly named village. For dedication names that repeat, see [Catholic parish and diocesan record recovery, step 1](catholic-parish-diocesan-record-recovery.md#1-find-the-parish-that-kept-the-register-not-just-a-church-name).\n- **The diocesan office.** A participant reported that the present Perm diocesan administration answers queries by referring people to the Perm state archive (ГАПК). [S24]\n- **Open the custodian's own online viewer before ordering.** Some archives publish their books as images:\n  - Moscow Glavarchiv publishes metrical books (cgamos.ru/metric-books/) and confession lists (cgamos.ru/ispovedalnye_vedomosti/) as online images in its «Моя семья» service. [S29], [S30] Have the user open it in their browser.\n  - The Sverdlovsk oblast archive (GASO) runs a metrical-book viewer at metriki.gaso-ural.ru. On 2026-11-02 it held only f. 6, the Ekaterinburg consistory, so it reaches the GASO f. 6 dela this recipe cites. Search it with the prefixes \"фонд:\", \"опись:\", \"дело:\" (for example \"дело: 01_6_15_100\") and \"скан:\". [S31]\n  - The Rostov oblast archive (GARO) arranges Don metrical books by settlement and okrug at donarch.ru/metrikbooks/, with scan previews on each settlement page. [S32]","sources":["S10","S8","S38","S39","S41","S42","S40","S24","S29","S30","S31","S32"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-cc6058e6cb0e","kind":"unclassified","anchor":"Years missing from an online list are not proof of loss. Browse at a human pace and never fetch in bulk.\n- **Before asking a Russian regional state archive to search,** read its current requests page and record the URL and the date you read it. Many of these archives have stopped or limited thematic genealogical searches. Some take a prepayment that is not refunded when nothing is found, and some send users to search the reading room themselves. [S33], [S34], [S35] Route the user to self-search or remote viewing, and order copies by cipher and leaf.","sources":["S33","S34","S35"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e67d1e172595","kind":"unclassified","anchor":"- **Cite the leaf span, not just the delo.** A consistory delo is often an annual volume that binds many parishes together.\n  - Participants' transcriptions of the GASO f. 6 op. 1 inventory show single dela listing dozens of churches for one year, with the starting leaf (л.) given for some sections. [S2]\n  - A participant's transcription of the GASO f. 6 op. 3 inventory (Ekaterinburg consistory, 1746–1913) lists each parish as \"year – delo, pages\". Record both numbers: \"1870 – 592, 244–285\" is a different citation from \"delo 592\". [S3]\n- **Check every row for the year.**\n  - Two dela can cover the same year and the same list of parishes, as d. 60 and d. 61 do for 1824 in op. 1. [S2]\n  - In op. 3, one parish has two rows for 1811 (299 and 301). Another has its 1846 births in d. 180 and its marriages and deaths in d. 181. [S3]\n  - A parish can appear under two uezds (\"Ирбитский / Верхотурский уезды\"). Delo numbers also jump between ranges as the parish's grouping changes. [S3]","sources":["S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a6cf8dbe6102","kind":"unclassified","anchor":"Report a parish-year as missing only after you have opened every delo row for it.\n- **Copy the page string exactly as the inventory gives it,** including oddities such as \"226об.243\", \"218об.-236\", \"32-96а\" or reversed spans like \"572-408\". These are what the inventory says, not corrected readings. [S3]\n- **Log what you inspected.** Use [archival image coverage verification](archival-image-coverage-verification.md) to record which parts (births, marriages, deaths) and which leaves you actually inspected.","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aac6fc737058","kind":"unclassified","anchor":"- **The two exemplars.** GASO f. 6 op. 1 d. 63 and d. 62 gave two forms of the same wrong surname. The participant concluded that the error was in the parish copy. [S19]\n- **Testing the bride against households.** Her identity was then tested against households:\n  - The 1816 revision list showed a daughter of that name and age in another family.\n  - Her brother's wife in the 1834 revision list matched a \"sister-in-law\" named in an 1839 report.\n  - The 1850 revision list, which in this case gave women's patronymics, confirmed that wife's patronymic.\n  - A birth entry for the bride was found.\n  - Later, godparent links ran between the two families.\n- **The result.** The participant still called the attribution indirect. The bride's ages across six sources implied births from 1794 to 1808. Treat such a spread as a range that ranks candidates. A mismatch lowers a candidate's rank but does not exclude it. [S19]","sources":["S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1989876dc42c","kind":"unclassified","anchor":"An Orthodox metrical date, like other Russian dates written before 14 February 1918, is normally Old Style; check the document's own calendar note. [S43] A Soviet, ZAGS or émigré document may restate the same event in New Style, so a difference of 12 or 13 days is not by itself a conflict. Record both dates with their calendar. For the offsets and the 1918 switch, use [evidence/proof judgment: follow record versions and test disputed dates](evidence-proof-judgment.md#follow-record-versions-and-test-disputed-dates).","sources":["S43"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1efef81d3619","kind":"unclassified","anchor":"A participant gave this search order: [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-12fa7144cdba","kind":"unclassified","anchor":"- Another participant cited a surviving obysk book from 1927–1929 in the Dalmatovo archive (Ф. 330 Оп. 11 Д. 11). [S1]\n- Archive catalogues list surviving pre-1917 obyski, for example in the Omsk regional archive (ИАОО f. 16 op. 9, Tara uezd, 1834–1845).","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-81dd5363e6f4","kind":"method","anchor":"- **Eliminate candidates.** A participant suggested listing every woman with the same given name, patronymic and age in the nearest revision list. Then read the births and deaths parts of the metrical books for those years. Follow each candidate forward and drop those who are accounted for. [S11]\n- **Read confession lists by household.** For finding a bride in her home village and for what confirms the result, use [reading confession lists, step 5](russian-orthodox-confession-list-reading.md#5-check-the-household-against-revision-lists-and-metrical-books).\n- **Search godmother entries.** Look for the bride's name among godmothers in the months before the likely marriage. A participant found brides acting as godmothers shortly before they married. [S11]","sources":["S11"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7b2cae9a1d86","kind":"unclassified","anchor":"- **\"вдов по втором браке\"** on a groom means his second wife has died and he is entering a third marriage. \"Вдова по первом браке\" means the bride is entering her second. [S1]\n- **\"полуторный брак\"** is a marriage that is the second for one spouse and the first for the other, for example a widower marrying a maiden. Search for the widowed party's earlier marriage and the first spouse's death. [S25]\n- **\"сводный брак\"** in a 1928 birth entry: one participant read it as a ZAGS-registered union without a church wedding, unlawful under church canon, and not a step-relation. The researcher had found no church marriage for those parents. Treat this as a single participant's tentative reading for the 1920s. [S1]\n- **\"нзкр\"** abbreviates незаконнорожденный (illegitimate).\n  - The birth entry does not give the father, so do not infer one from the household the child lived in.\n  - A participant advised finding the daughters' marriages, where they will probably carry the mother's married surname and be marked illegitimate again.\n  - The same participant also noted that children of Old Believer marriages were often recorded as illegitimate, and that paternity may survive in non-church records. [S13]\n- **\"из раскола\"** marks a person joining from the Old Belief. In one 1892 entry, a 21-year-old woman was marked this way, although her parents had appeared as Orthodox at their other children's baptisms. There was a gap in those baptisms around her birth.\n  - A participant read this as a lapse in the parents' observance, so her birth never entered an Orthodox book.\n  - The participant said five years without communion counted as falling into the schism, and that the written pledge given on returning was not recorded.\n  - The participant pointed to the 1899 compendium of laws on the schism and sectarians (Сборник законов о расколе и сектантах) for the rules of the period.","sources":["S1","S25","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f443ba071f48","kind":"unclassified","anchor":"Set out the parents' other baptisms as a series and look for the gap. Do not read the label as lifelong Old Belief. [S21]\n- **Several infants baptised on one date from one village** may be a visiting priest's batch. Expect different birth dates, and record the place of baptism as an inference.\n  - One participant suggested weighing the infants' villages and their distance from the church, other rites held the same day, and whether the day was a Sunday or a feast.\n  - Another said priests wrote in a notebook on the round and copied the entries into the book later. [S18]\n- **Month headings.** A month written once at the head of a section or column belongs to the entries it heads, not to every date on the page. Take a first entry under a June heading with birth \"31\" and baptism \"1 June\": it is a 31 May birth when the previous spread and the date sequence support May. Record the month as taken from context, keep the baptism date separate, and never write \"31 June\".\n- **Possessive name forms in Galician and Western-Ukrainian entries.** Surnames in -ів (Петрів, Михайлів) are possessive adjectives formed from a given name that became fixed surnames, and they are common in Galicia. Their female forms include Павліва and Павлова beside Павлів. [S27], [S28] So in \"Іван Петрів\" or \"Марія Іванова\" the second word may name the father or may already be a surname. Decide from the column heading, the grammar and the neighbouring entries, never from the ending alone.\n- **\"родомъ X\" (by origin X) is not a maiden name by itself.** Treat a maiden name as established only when an explicit \"урождённая\" (née) or other family records state it. Otherwise keep it as a hypothesis.","sources":["S21","S18","S27","S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-57285be11a86","kind":"unclassified","anchor":"- **Divorce.** Three notes show the pattern:\n  - A 1908 marriage entry (Dalmatovo archive Ф. 320 Оп. 1 Д. 20) carries a side note. The marriage was dissolved by an eparchial decision of 16/17 December 1913 (№ 720), confirmed by the Synod on 19 August 1914 (№ 13729). One spouse was given a seven-year penance, and both were allowed to remarry. The note was entered under a consistory decree of 1 September 1914. [S1]\n  - An 1886 entry in GAPK f. 37 op. 3 d. 136 carries a red cross-reference in one margin. The other margin records a 1908 dissolution, confirmed by Synod decree № 789 and entered under a consistory decree of 11 March 1911 (№ 4697). [S17]\n  - Another note records an annulment because the husband was exiled to penal labour, entered by consistory decree № 207 of 11 January 1902. The wife's later marriage entry says her first marriage was dissolved for that reason. [S17]","sources":["S1","S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-de823bd30b63","kind":"unclassified","anchor":"Follow each note to the consistory divorce cases. Divorce petitions went to the eparchy's spiritual consistory. As the first two notes show, the Synod confirmed the eparchial decision, and a consistory decree then ordered the note. Participants listed GASO f. 6 op. 4 (Ekaterinburg eparchy) and GAPK f. 37 op. 5 (Perm eparchy), both arranged by the couple's surname. Also read any later remarriage entry. [S17]\n- **Limits on divorce notes.**\n  - \"Разошелся\" (separated) is not a divorce.\n  - A participant found no note on one marriage entry, and the thread did not settle which exemplar carried such notes, so check both copies.\n  - The stated cause is the wording of the decision, not necessarily what happened. A participant read a case in which the husband agreed to a divorce only if the wife's adultery was named as the cause. [S17]\n- **Legitimation.** A 1911 birth entry received a note in 1915, entered under Ufa consistory decree № 1514 of 27 January 1915 following a decision of the Elisavetgrad circuit court of 2 January 1915, that legitimated the child to a named couple. Follow the court decision in that court's records: the court and the recording consistory were in different provinces. [S17]\n- **Adoption after 1917.** A participant reported a notice pasted onto a 1905 birth entry, addressed to the ZAGS office attached to the uezd-town militia; the extract does not name the sender. It recorded an adoption in 1917, the adopter, the new surname, given name and patronymic, and the number of the certificate issued. Another participant said such notes appear regularly but not for every adopted child, so their absence proves nothing. [S5]\n- **\"Выслано\" (sent) notes.** A participant raised a birth entry marked \"выслано\" with the year 1951 for a soldier missing from a regional memorial book. [S9] Copy the full note with its position, and take what was sent or issued from its formula and particulars, not from the word alone. Record it as a dated event that points to post-war records. On its own it does not show who asked, where they lived, or that the person was alive. [S9]\n- **Official communications in death entries.** Copy any cited \"отношение\" with its office, date and number. A participant transcribed two examples:\n  - a factory physician's communication № 256 (GASO f. 6 op. 19 d. 422, 1908)\n  - a communication № 926 of 8 July 1909 from the court investigator of the 7th district of Ekaterinburg uezd (d. 427, 1909).","sources":["S17","S5","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4851d16d0df8","kind":"unclassified","anchor":"The next retrieval target is that office's own file series. [S15]","sources":["S15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a4785f554dc0","kind":"unclassified","anchor":"- **Missing surnames.** In early books, surnames were often not written for peasants. Search by given name, patronymic and village. Use confession lists to place whole households, and read godparent entries, where the surname may appear. In one thread, a participant found an 1812 godparent entry that carried a family's surname, which the researcher had assumed arrived later. Revision lists then dated the family's arrival to between two revisions. [S4]\n- **Unstable surnames.**\n  - A participant, who held that surnames were not legal objects outside the nobility, saw the same person under different surnames in one year, at a birth and a death a week apart. [S14]\n  - An 1886 priest's account, quoted by a participant, describes peasants with no surname or with two or three. [S14]\n  - The ending -ов/-ев/-ских varied within one family. [S7]\n  - A participant traced one household head under one surname in 1710 and under a surname derived from his place of origin in 1719. [S12]\n  - Expand given names deliberately (Dionisiy = Denis). [S12]\n- **Who could be a godparent.** Under an 1834 decree quoted by V. Mikhailovsky, a boy's godfather and a girl's godmother had to be Orthodox. The rule bound that sponsor only, so do not infer the other sponsor's confession. Orthodox canon law, as set out by Milaš, excluded иноверцы (people of other faiths) and the child's own parents. So do not read a godparent as the child's parent; a participant gave the same answer for a girl's godfather. [S11]\n- **Patronymics need not come from the father.**\n  - A participant abstracted a service file (GAPK f. 36 op. 6) recording an illegitimate man whose patronymic was given from his godfather. Record any second surname as a separate name form. [S23]\n  - A participant saw a godfather called simply \"father\" in his goddaughter's marriage entry, and her patronymic matched his name. [S11]\n  - Another found that an illegitimate boy took his patronymic and surname from his mother's father. [S11]\n  - A bride may be recorded under a stepfather's or a fosterer's patronymic and surname. Marriage entries can also give names that match no real woman. [S11]\n- **Converts.** A convert may be listed with the surname and patronymic of a local household head. Keep three explanations open together: an illegitimate son, naming by a godfather, or adoption into the household. Participants disagreed on whether godfathers passed on patronymics, so find the conversion baptism and its sponsors. [S16]\n  - In a published baptism account cited by a participant, a boy acquired by a merchant was baptised with the merchant's adult children as sponsors. He later appears in an 1816 revision list with a patronymic matching his godfather's given name. [S22]\n  - His age at baptism (15 in 1806) and his revision-list age (36 in 1816) imply birth years about a decade apart. That mismatch lowers the link's rank. It does not exclude the link.\n- **Adoption before 1917.** In the cases participants discussed, adoption was not recorded as a separate act in the church books. Instead the child's status shows up across their life:\n  - as \"приемный\" to a named head in revision or confession lists\n  - often in the marriage entry\n  - later, when the child acts as godparent, guarantor, groom or parent.","sources":["S4","S14","S7","S12","S11","S23","S16","S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-19216bc2e88c","kind":"unclassified","anchor":"Another participant had seen a couple of entries recording a surname change, so do not assume the books never note it. [S14] Search under both the birth and the adoptive patronymic and surname.\n  - One participant found a woman recorded under her birth names only in her marriage entry.\n  - Another found an adoptee's birth family through a consolidated revision list that gave males across several revisions and their place of origin. [S14]","sources":["S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3928131c5c9b","kind":"unclassified","anchor":"Leave the ruling to [evidence/proof judgment](evidence-proof-judgment.md). [S11], [S19]","sources":["S11","S19"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d534b060dca3","kind":"unclassified","anchor":"Yandex «Поиск по архивам» (yandex.ru/archive) searches machine-recognised text of 18th- to early-20th-century metrical books, revision tales and confession lists. It names archives of Moscow and of the Astrakhan, Orenburg and Irkutsk regions, among others. Viewing a document needs a login, which the user does. [S26] Its catalogue (Источники) lists the holding archives in full: 29 on 8 October 2026, against about nine in July 2023. [S37] Have the logged-in user open the catalogue and record the archives it lists, with the date, before you treat a miss as a coverage gap.","sources":["S26","S37"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-efa76eb56239","kind":"unclassified","anchor":"- **Search inside entries when file titles may use another village name.** A parish-book file title can use a village's second or later name, so a catalogue filter on one name can miss the file. The service searches the recognised text of the documents by surname or settlement. [S26], [S36] Search every name form of the village, group the hits by file and read the file titles before you declare a coverage gap.\n- **A miss is not a negative.** Full text finds only what the machine recognised. Log the volumes, years and pages that have no recognised text: a page without text is not a blank page. An archive missing from the results is not proof that the service lacks it.\n- **Take spellings from the text itself.** Run pre-reform forms (Ѳеодоръ) beside modern ones (Фёдор) until you see which the recognised text uses, and build further variants from forms you actually find, using [corpus-seeded name searches](corpus-seeded-name-search.md#diagnose-three-different-failures). Take the query syntax from the service's current help page, not from web-search habits. Confirm every near hit on the image.\n- **Read the full delo title.** A composite volume (step 4) can name the target church last. In a multi-church delo, find the target parish's pages before you assign a hit to it, and limit any negative to that section and to the years and pages read.\n- **Entries without surnames.** A surname query misses surnameless entries (step 9): query the given name, patronymic and village, or browse the section.\n- **A snippet is not the entry.** Open the page text and the image. For a revision-tale household, check the next leaf. Read ages, death years and marriage-out remarks from their columns on the image.\n- **Person lists and filters.** Treat any list of names or event filter the service offers as a lead to the image, not as a second source.\n- **Locators.** Take the archive and cipher from the document description and cite the archive, not the service.\n- **Images.** Never get around a file restriction. Where the original file is not served, save a viewer screenshot with the scan URL and label it as a screenshot, not the archival original.","sources":["S26","S36"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-219243221df4","kind":"unclassified","anchor":"1. **Parish-candidate and custodian register.** One row per parish-year. Give the reason the parish was chosen (mother parish, edinoverie, new church, bride's parish, town church). For both the consistory copy and the parish copy, give:\n   - the archive, fond/opis/delo and leaf span\n   - any transfer notes (ZAGS, district archive, museum, another oblast)\n   - whether it was searched, not searched or not accessible.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3f4ef9535529","kind":"method","anchor":"- **Institution churches.** A birth or death in a town hospital could be entered in the book of the hospital's own church rather than in the home parish. In one Tula case a birth was missing from the home parish and its neighbours after three readings. A notice from the priest of the Tula zemstvo hospital church to the home parish priest, found in one of the files searched for the home parish, led to the entry in the book of the hospital's Alexander Nevsky church [S44]. That church's 1898 book is in a combined Tula city volume, GATO f. 93 op. 1 d. 69 [S100]. A peasant who had moved to Moscow and died in the Yauza city hospital in 1912 is entered, with the cause of death and the cemetery, in the hospital church's book [S45]. When a home-parish entry is missing, add the hospital and other institution churches of the nearest towns to the candidate list, and read the loose papers in the home parish's files for such notices.","sources":["S44","S100","S45"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fd8bb2f934ad","kind":"custody","anchor":"- **Moscow maternity shelters and the Foundling Home.** TsGA Moscow f. 179 op. 69 holds the books of mothers and births of the city maternity shelters (родильные приюты), by shelter and date, for 1880–1908 [S101 @2026-11-15]. When a Moscow birth entry names a shelter, search that shelter's book by the date of admission: a researcher reports that the entries run by admission, not alphabetically, and give the mother's estate, origin, age and the number of the pregnancy [S46 @2026-11-15]. A village child with no birth entry in the home parish may have been a ward (питомец, питомка) of the Imperial Moscow Foundling Home placed with a peasant foster family [S47 @2026-11-15]. Wards were sent to village wet nurses and often stayed with their carers; a carer found reliable had first claim to adopt a ward, but adoption was rare [S47 @2026-11-15], [S102 @2026-11-15]. The Foundling Home's fond is TsGA Moscow f. 108 [S103 @2026-11-15].","sources":["S101","S46","S47","S102","S103"],"checked":"2026-11-15","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bfbf44975670","kind":"method","anchor":"- **Regimental churches and an officer's station.** In the 19th century a regiment had its own church and its own metrical book. The wedding and the elder children's births of a musician of the 6th Taurida Grenadier regiment, quartered in Tula from 1878, had not been found in the Tula city parishes and were in the regimental church's books, which are now partly in ЦГИА СПб and partly in ЦГА Москвы [S48]. An officer's children could be baptised where his regiment stood. A Soviet service card gave one officer's son's birthplace as Tula, but a baptism extract in a nobility fond of the Tula archive shows his baptism in Ostrog, Volhynia, the station of his father's 126th Rylsk infantry regiment; one brother was born there too and two were baptised in Tula [S49]. Find the father's unit and its station, then search the regimental and garrison churches there.\n- **A church known by a second name.** A church can be called after the saint of a side altar (придел) or of its lower church as well as after its main dedication. In Tula the Vladimir church za Valom, whose lower church has St Nicholas as its main altar, is known as Николо-Завальская [S104]. When a revision tale names a Nicholas church, list every church known by that name, strike those that the same revision lists separately, and remember that a monastery church was not a parish church [S50].\n- **A non-Orthodox spouse.** Apart from native Finns marrying in Finland, a non-Orthodox person marrying an Orthodox one signed a pledge (подписка) before the wedding not to revile the spouse for Orthodoxy or draw the spouse to another faith, and to have the children baptised and raised Orthodox. After the wedding the priest sent the pledge to the diocesan bishop [S105], [S106]. In the Baltic provinces, local natives marrying across the Orthodox and Protestant confessions were excused the pledge from 19 March 1865 until it was restored on 8 August 1885, and in those years could have the children baptised in either church [S106]. So search the Orthodox books for a Catholic or Lutheran father's children, and the diocesan files for the pledge. Tula researchers quote pledges of 1863 and 1894; the second gives the groom's confession, rank and occupation and names the bride's father [S51], [S52].\n- **A later «оба православные» does not refute a foreign origin.** Lutherans were received into Orthodoxy by chrismation, not baptism [S107]. In an Epifan case of 1898–1900, the marriage entry gives the bride as a Lutheran railway official's daughter under her own names. About six months later she was received into Orthodoxy by chrismation and named Анна, and her child's birth entry calls both parents Orthodox and gives her patronymic as Фёдоровна, from her father Фридрих [S53]. Find the marriage entry and the reception (присоединение) entry before you weigh a family story of foreign descent.","sources":["S48","S49","S104","S50","S105","S106","S51","S52","S107","S53"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-16982c799ad9","kind":"platform-ui","anchor":"- **A first list of nearby churches.** Familio's 2021 guide says that each place page has a «Приходы» tab listing the religious communities and buildings in and around the settlement, and that a parish page sometimes lists that parish's confession lists under «Источники» [S108 @2026-11-15]. A researcher starts the candidate list there, since people usually went to the nearest church [S54 @2026-11-15]. Confirm each candidate in a dated diocesan reference book (step 1).","sources":["S108","S54"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-1db3e6cff4d0","kind":"platform-ui","anchor":"- **Find the delo before you open a film.** For Tula guberniya, A. G. Zaitsev's handbook gives, village by village (by parish church), the fond, opis and delo of the metrical books in GATO [S109 @2026-11-15], [S55 @2026-11-15]. The НашиПредки site (nashipredki.com) gathers FamilySearch's microfilms into catalogues by archive and by parish, settlement or uezd; each row gives the film and digital-folder numbers against fond, opis, delo and years [S110 @2026-11-15], [S111 @2026-11-15], [S56 @2026-11-15]. Take the delo from the handbook or the inventory, find its film there, and open the film at that delo's title sheet [S55 @2026-11-15]. In Tula, most metrical books up to 1920, including books that churches kept after 1917, are in GATO f. 93, the collection of metrical books of Tula and Kaluga guberniyas [S57 @2026-11-15], [S112 @2026-11-15].\n- **Moscow and Moscow guberniya in «Моя семья».** Glavarchiv's January 2021 account of the service says to find a guberniya village's church in its parish index (указатель приходов) and then to search both copies: town churches in the fonds of the Moscow church «сорока» (ф. 2121–2126) and in the Moscow Spiritual Consistory's fond 203, village churches in the uezd church fonds and in f. 203 [S113 @2026-11-15]. In f. 203, op. 745 is catalogued as metrical books of Moscow and the guberniya's uezds for 1744–1920, and other opisi hold more [S114 @2026-11-15]. A researcher's walkthrough used the village's uezd to page to the uezd-and-year volume, then found the parish in that volume's list [S58 @2026-11-15]. Check every church of a settlement that had several.","sources":["S109","S55","S110","S111","S56","S57","S112","S113","S114","S58"],"checked":"2026-11-15","stated_as":"fact","review":"reviewed"}
  - {"id":"C-29c72300b7f3","kind":"method","anchor":"- **Tell the copies apart by the delo.** A delo holding one parish over several years is normally the parish copy; a delo binding one year of all the parishes of an uezd or town is the consistory copy [S115], [S59]. A Tula researcher calls this the general rule, with rare exceptions. In Tula both copies of a 1907 book sit in the same opis of GATO f. 93: d. 1015 is the parish copy and d. 984 the consistory copy [S59].\n- **Expect copying slips in the consistory copy.** It was copied by hand from the year's book, often in winter at year end. In that 1907 book the consistory copy gives the mother another given name, and the daughter's death entry names her wrongly [S59]. In an 1896 Epifan uezd consistory copy the bride's half of a marriage entry is blank and the groom has no given name; the parish copy is lost [S60]. Correction decrees went to the priest and to the consistory archivist, but sometimes only the second copy was corrected [S59]. Start from the parish copy where it survives and read both: an error can also start in the parish copy and pass into the consistory copy, as in the case below.\n- **A parish on a guberniya border.** A Tula researcher reports that for parishes on the Tula guberniya border a separate consistory copy was kept for each guberniya. The 1884 Tula consistory copy for Lyuben parish (Odoev uezd) leaves out the first two births because they belonged to a village of Likhvin uezd, Kaluga guberniya; they are in a second consistory copy [S61]. Before you call an entry missing from a border parish's consistory copy, check whether its village lay in another guberniya.\n- **Drafts and 1920s recopies.** Some priests kept a draft (the «нулевой» copy) with extra detail such as the parents' ages, address and occupation; in Tula such drafts are in GATO f. 93 and f. 256. In the 1920s many parishes recopied damaged books to hand over to ZAGS; in Tula these copies are also filed as «Метрические книги» in GATO f. 93. They are in post-1918 spelling, usually without the sureties, godparents and officiating clergy, and in that researcher's experience they carry more errors than consistory copies [S59]. Find the earlier copies before you rely on one.\n- **An unknown town parish.** Read the year's consistory volumes for the whole town instead of each parish's own book: a researcher reports that the 1905 Tula births fill two dela, GATO f. 93 op. 2 dd. 8–9 [S62]. The inventory gives those two as 1905 volumes of the town's churches but also lists d. 9 а, a third 1905 volume for four more churches, and single-church files for 1903–1905, so open all of them for the year [S116].","sources":["S115","S59","S60","S61","S62","S116"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-53c28569c12e","kind":"example","anchor":"A Soviet document can be wrong in year and place, not only in calendar. An officer's service card gave a man's birth as 25 November 1910 in one village, and his 1930 birth certificate gave the same date in another. The birth entry was in the 1909 book of that village's parish, under 12 November Old Style, which is 25 November New Style, with the same parents [S63]. When the stated year has no entry, search a year or two either side for the Old Style day and the parents' names, in every parish that served each place named.","sources":["S63"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ed0bb3280f0d","kind":"historical","anchor":"- **Search terms and dates.** From July 1765 the priest entered a pre-wedding inquiry (брачный обыск) in an обыскная книга; before that a венечная память authorised each wedding. In the late 19th and early 20th century the обыск was also called a предбрачное свидетельство [S117], [S64]. Search catalogues under all three names. A Moscow church's inventory shows the switch: венечные памяти to 15 July 1765, обыски from 24 July 1765 [S118]. A full-text search for «венечные памяти» found a 1728 book of permits for churches of Novgorod and Olonets uezds in the Novgorod oblast archive, f. 480 op. 2 d. 311 [S65], [S119]. The same researcher reports that most surviving permits are in RGADA f. 280 op. 4, for 1721–1765, arranged by region [S65].\n- **What it states.** The обыск covers each party's estate, residence and age, the absence of blood and spiritual kinship and affinity, marital status, free and parental consent, and the documents presented. The groom, the bride, at least two sureties and the clergy signed it [S117], [S120]. The priest recorded his kinship check in the обыск before the wedding [S66]. The form was set in 1765 and changed in 1837, so cite the check's wording, not its point number [S117]. A groom «вдов после первого брака» reveals a first marriage, and «родителей ... в живых нет» or «матери же в живых у неё нет» places a parent's death before the wedding [S121], [S67].\n- **The documents presented.** Copy each document the обыск lists, with its issuing office, date and number: metrical extracts, passports, service records, confession certificates, a superior's permission, a merchant or meshchane board's certificate, a landowner's permission for serfs, or a non-Orthodox cleric's certificate in a mixed marriage [S120], [S121], [S122]. Each one names the next record. A 1901 Moscow обыск lists a death extract for the groom's first wife from a Moscow hospital church and the bride's birth extract from a village church of Mozhaisk uezd [S67]. An 1894 Tula обыск lists a residence certificate and a permission to marry from the Mining Department and a Baku pastor's certificate that the groom was single [S52]. A bride's extract issued in 1900 «для представления оной как документа к брачному обыску» copies her whole birth entry with the godparents and adds the priest's note that she confessed every year [S68].","sources":["S117","S64","S118","S65","S119","S120","S66","S121","S67","S122","S52","S68"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-15143c210a67","kind":"custody","anchor":"- **Where the papers are.** Some originals stayed with the обыскная книга; others were copied into it and returned to their owners with a note of the marriage [S117 @2026-11-15]. Moscow church inventories list обыск books «с приложением брачных документов» and separate books of copied marriage documents: for the Nativity church in Staroye Simonovo, an обыск book with attached documents for 1813–1827 and a copy book for 1913–1917 [S123 @2026-11-15]. That parish's copy book of 1916 holds a bride's volost passport copied field by field, with the place of the seal marked [S69 @2026-11-15]. An 1858 обыск marks each attachment as a copy or «в подлиннике» [S64 @2026-11-15]. Look for the copy book beside the обыск book.","sources":["S117","S123","S69","S64"],"checked":"2026-11-15","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9c19db1a89d6","kind":"historical","anchor":"- **Kinship and the bishop's permission.** Under the Synod decree of 19 January 1810, a marriage in the collateral blood line was forbidden up to the fourth degree inclusive, needed the diocesan bishop's permission in the fifth and sixth, and needed none from the seventh [S124]. Second cousins (троюродные) are related in the sixth degree, so a 1902 Efremov certificate stating «в шестой степени кровного родства по боковой линии» comes with the bishop's resolution permitting the marriage [S70]. One Tula researcher has seen четвероюродные, and an uncle with his троюродная племянница, married, but never троюродные; that reflects the permission rule, not a ban [S66], [S124]. Petitions went to the bishop himself, from the groom, his parents, relatives or guardians, with the parish priest's certificate of the degree and a table of the kinship [S125]. A petition need not mean blood kinship. A 1900 Tula petition concerned «шестой степени двухродного свойства», an affinity created by an earlier marriage between the two families, and its chart and the bishop's resolution were filed with the обыск [S71], [S126]. Turn every stated degree into a relationship and note which impediment it names.\n- **Age.** A Synod decree of 19 July 1830 forbade marrying a groom under 18 or a bride under 16, outside the Caucasus [S120]. The diocesan bishop could permit a marriage when the groom or the bride lacked no more than half a year of that age [S105]. In a 1902 Sarapul case, after an inquiry that used the volost's family list and the 1897 census sheet for a bride with no birth entry, the spiritual board let her marry at 15 years and 9 months if the обыск found no other impediment [S168]. A Nizhny Novgorod researcher finds peasant grooms of about 17½ and brides of about 15½ not rare in that area, and most entries of 17-year-old grooms the researcher has seen carry no note of the bishop's permission [S174]. So start a marriage search half a year below 18 and 16, and do not read a missing «с разрешения Его Преосвященства» as an error in the age. A groom's 18 written over a visible 17 with no note, as in a 1909 Epifan uezd entry, is a reason to check his birth entry before you derive a birth year from the marriage [S72].\n- **Soldiers on leave.** From a decree of 8 April 1871, any priest could marry a lower rank on leave with a yellow ticket on the ticket alone, noting on it when, whom and where. Men on short home leave with red tickets needed higher military permission, and the unfit on long leave with green tickets could not marry [S122]. A Tula researcher reports that before 1871 a soldier on temporary leave needed his command's permission [S73]. A soldier groom's marriage may therefore be written on his ticket as well as in the book.","sources":["S124","S70","S66","S125","S71","S126","S120","S105","S168","S174","S72","S122","S73"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20e4220e0c98","kind":"method","anchor":"- **An ordinal wife.** «законная его 2ая жена» in a child's birth entry means the father had married before. Confirm it from his marriage entry, whose groom column states which marriage it was («вторым браком»), then search for the first marriage and the first wife's death [S74], [S127].\n- **A convert in the births part.** An entry among the births can record a convert's baptism or reception: one book lists a group from the Molokan sect, among them a woman of 36 and girls of 5 and 1 [S75]. Read the stated age and the note before you take the date as a birth. A convert could receive a new name, but an Old Believer joining Orthodoxy could keep his («с оставлением прежнего имени») [S128], and some books record receptions in a separate part, о присоединившихся [S129].\n- **A foundling.** A foundling's birth entry reads «дочь (сын) неизвестных родителей» and may say the child was «подкинута к дому» of a named man [S130], [S75]. He is where the child was left, not a parent and not necessarily the foster carer; follow the child under the household that raised it.\n- **A serf's owner.** «Господина/госпожи N крестьянин» or «умершей Госпожи N крестьянин» in a parent's description names the owner, which leads to the owner's revision tales and estate papers [S75].\n- **Military status labels.** «бессрочно-отпускной» marks a soldier released on indefinite leave before his term was over, «запасной» a man in the reserve and «отставной» a retired man; the entry often names his regiment [S76], [S131], [S132]. To estimate his birth year, apply the rules of his call-up year and give a range. The 1834 regulation released lower ranks of the reserve battalions on indefinite leave after 20 blameless years, liable to recall until their 25-year term ended [S132]. The 1874 statute took men at 21 for 15 years, 6 active and 9 in the reserve [S133]. Later rules set 18 years, 5 of them active, for men who had turned 20 by 1 January of the call-up year [S134]. A Tula father called «уволенный в бессрочный отпуск» in 1878–1883 and «отставной рядовой» from 1885 may have been taken before 1874, so the 1874 terms do not fix his birth [S77].\n- **Births are filed by baptism.** A birth entry stands under the date and month of the baptism, not of the birth [S135], [S75]. A 19th-century priests' manual says village parishes did not put baptism off, the gap being hours and never more than two or three days [S136], and another blogger says newborns were brought the same or the next day [S78]. One regional researcher still found gaps from a day to a year [S135]. When a birth is missing from its month, search the following months and the next year's book, and record a birth known only from its baptism as on or before that date.\n- **Death-entry columns.** The last column of the death part, «Кто совершал погребение, и где погребены», gives the officiant and the burial place [S137], [S79]. «Не исповедан и не приобщен», with a cause such as «по внезапной смерти», or a blank «кто исповедовал и приобщал» column marks a death without the last rites, usually a sudden one [S138], [S80]. Read it against age: in an 1838 book an infant who died suddenly is marked only «не приобщена» [S138]. A note of the стан police officer (пристав) in that column, or a pristav's certificate filed with the entry, means the police examined the death, and burial could then come well after the usual two days [S80], [S129]. Follow it to the police file.","sources":["S74","S127","S75","S128","S129","S130","S76","S131","S132","S133","S134","S77","S135","S136","S78","S137","S79","S138","S80"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6894584b935b","kind":"historical","anchor":"- **Corrections by decree.** A wrong given name could be corrected years later under a consistory decree: in an Efremov uezd book, a boy's 1875 birth entry, made under the wrong name, was corrected in 1895 [S81]. Corrections needed an inquiry. A consistory without full evidence was not to restore or correct an entry, and a dispute about the facts of a birth went to the civil court [S139]. When a birth name disagrees with later records, look for a correction note and its decree before you reject the entry.\n- **Grounds for divorce.** Under the 1841 Statute of Consistories, a church court could dissolve a marriage at one spouse's petition only for proven adultery, incapacity for married life, a sentence with loss of all rights of status or exile to Siberia with loss of rights, or a spouse's unknown absence. A marriage also ended when both spouses, with no young children, took monastic vows [S140], [S82]. Until 1904 the spouse guilty of adultery was condemned to lifelong celibacy; from 28 May 1904 the Synod set a seven-year penance instead [S140]. Read a dissolution note's ground against that list and its date.","sources":["S81","S139","S140","S82"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-7694a181cde8","kind":"method","anchor":"- **Search the baptismal form of a given name.** The priest wrote the calendar (святцы) form at baptism, while revision tales, confession lists and family memory often keep the everyday one. Search both: Ксения for Аксинья, Гликерия for Лукерья, Иулиания for Ульяна, Агриппина for Аграфена, Евдокия for Авдотья [S83], [S141], and Георгий for a Юрий born before 1917 [S84], [S142]. A name missing from the calendar of the time, such as Светлана, was not given at baptism, because baptismal names were taken from the calendar [S85], [S143]. In about a hundred Tula cases, a remembered «бабушка Полина» was almost always Пелагея (Пелагия) at baptism [S86]; Полина is a pet form of Пелагея and also a short form of Аполлинария [S144], [S145]. A rare Latin- or Greek-looking calendar name, such as Конкордия for a peasant girl, is an ordinary baptismal name and says nothing about foreign or higher origin [S87], [S143].\n- **One remembered form can come from several calendar names.** Search each: Митя can come from Дмитрий or Митрофан, Глаша from Глафира [S146], [S147], and in one family a «баба Маня» turned out to be Манефа [S88]. In one researcher's early 19th-century Tula material, about a third of the men called Дементий were baptised Диомид and the rest Дометий, the church form of Дементий; men called Алифан turned out to be Алипий, Филипп, Феофан or Вонифатий [S81], [S148]. A Tula Василиса of the revision tales was almost always Васса at baptism, a name sometimes used in place of Василиса [S89], [S149]. In Efremov uezd a man written Егупович was Евплович in the church books, but Егуп (Ягуп) can also come from Якуб, that is Иаков, so test both [S90], [S150]. A remembered Галя may have been baptised Гали, a calendar name of its own, not Галина [S91], [S151]. A town-born Юрий can be a real Юрий, named after Prince Yuri Vsevolodovich (feast 4 February Old Style) [S84], [S152].\n- **One man can appear under two forms.** One parish may write the secular form of a man's name and another the baptismal one. The 1814 Moscow baptism of the poet Mikhail Lermontov names his father Юрий Петрович [S153], genealogies give the father as Юрий (Евтихий) [S154], and a Tula researcher reports that the Lermontov Yuris were baptised Евтихий [S92]. A man baptised Иосиф can be Осип, the old Russian form, in later entries [S93], [S155]. Compare his patronymic, his wife and his years before you split him in two, and search his children as both Осипович and Иосифович. In southern Russian speech, which covered Tula guberniya, ф was said as хв or х, and priests sometimes wrote names as heard, such as Мархва for Марфа and Трохвим for Трофим; the same spelling in other names of the entry confirms it [S94], [S156].\n- **Look-alike names can be different saints.** Check a period calendar before you merge two similar names. Ермил and Ермолай, on 13 January and 26 July Old Style, are distinct saints, as one researcher confirmed in a 1714 edition [S95], [S157], [S158]. Old editions write the day in Cyrillic numerals, with the units first for 11 to 19 (ГІ = 13) [S159]. Some books write the name-saint's day under the child's name, but one day can serve two saints: Гали and Галина of Corinth share 10 March Old Style, and Галина also has 16 April [S91], [S151], [S160]. Read the name as written and use the day only as a check. Archbishop Sergiy (Spassky)'s «Полный месяцеслов Востока», first published in 1875–1876, sets out the saints [S91], [S161].\n- **The baptismal name itself can be wrong.** Errors in birth entries most often concern the name [S139]. A child can be entered under one name at baptism and under another at burial [S162], and diocesan gazettes of 1882 and 1913 discussed people who lived, confessed and appeared in civil papers under a name different from their baptism entry [S96]. A different name in confession lists or civil documents does not by itself exclude a baptism entry: test the date, the parents and the godparents.","sources":["S83","S141","S84","S142","S85","S143","S86","S144","S145","S87","S146","S147","S88","S81","S148","S89","S149","S90","S150","S91","S151","S152","S153","S154","S92","S93","S155","S94","S156","S95","S157","S158","S159","S160","S161","S139","S162","S96"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d07ee89326d5","kind":"method","anchor":"- **Surnames in other series.** A priest may leave surnames out for decades: in Tulchino parish (Kashira uezd) the books have none until the end of the 19th century, while the revision tales of 1850–1858 give every resident's surname [S97]. Elsewhere the reverse holds: the 1834 and 1850 revision tales of Krasnoslobodsk and Orenburg uezds as a rule omit state peasants' surnames, and researchers recovered them from the metrical books [S163]. Search each series for the surname the others omit. A family can carry two or three surnames, each recurring in other documents. Any of them can reach Soviet records, so a different Soviet surname is a variant to test, not proof of a concealed change [S98], [S163].\n- **One full name in several roles.** When the same full name stands for two grooms and a surety on one day, consider a slip of the priest's pen [S99]. Such errors were frequent, and a correction, if any, may come years later [S99], [S139]. Keep each role a hypothesis until other entries settle it.","sources":["S97","S163","S98","S99","S139"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-df83ef6fc12d","kind":"method","anchor":"A project issue report describes these traps from a blind whole-parish transcription of Kaluga guberniya books of the 1870s–1910s, about 3,000 frames [S164]. The images and run outputs were not independently inspected; these are reported examples, not measured error rates established here. Apply the checks below to human and AI readings, alongside [AI documentary-record verification and image-quality guidance](ai-for-documentary-records.md#the-pitfalls-worth-internalizing-the-least-obvious-most-llm-usable-part).","sources":["S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8d991fca3b72","kind":"method","anchor":"- **Fita in given names and patronymics.** The report gives «Ѳеодорова» misread as «Сидорова» or «Богдарова», and «Ѳевронія» as «Евфросія»; the latter reading produced a false match to a different woman [S164]. Check every apparent С-/Е- name initial for the oval and crossbar of Ѳ. Enlarged crops helped in the reported exercise [S164]; compare a crop from the original with the full line, following the AI recipe's image-quality cautions, and leave an uncertain letter open. Keep the written form beside any search form; for Ѳ/Ф variants use [pre-reform spelling lanes](corpus-seeded-name-search.md#diagnose-three-different-failures).","sources":["S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d6b4d47d35df","kind":"method","anchor":"- **Year digits in «19__» headings.** The reported readings changed 1910/1911 to 1916, and 1908 to 1918 or 1308 [S164]. Recheck every header against neighbouring headings, entry dates, the running м./ж./№ counters and monthly totals. After reading the book, build a frame-to-year map in binding order. Check for monotonic years within each continuous parish sequence, allowing descending order: the report notes reverse-year binding [S164]. Flag every break and investigate an uncertain digit, a misbound leaf or an inserted document; never sort the frames or force their years to fit. Counters and totals are consistency checks, not independent proof of a year. Keep the raw header reading, the assigned year and its basis, or mark the year unresolved.","sources":["S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f7730bdcbd9e","kind":"method","anchor":"- **Counters and totals.** Track the birth columns' м./ж. counters separately and the marriage №, following the page's own headings. The report uses these with monthly and annual totals such as «Итого въ Іюлѣ…» to flag missing or doubled entries and clerical numbering slips [S164]. Record the first and last counter of every parish/year/part actually read, with the frame or leaf range and any gaps. Keep the written total, the sum of its columns and your own entry count separate, as in [coverage as pages × targets](archival-image-coverage-verification.md#report-coverage-as-pages--targets) and [the book's own totals](russian-village-family-reconstitution.md#2-state-an-identity-as-an-inference-until-countable-checks-agree). Reconcile discrepancies on the images; never add, drop or reclassify an entry, or change a year, sex or status, to make a total agree. A counter jump alone does not prove a missing scan.","sources":["S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7ba631b01817","kind":"method","anchor":"- **Misbound leaves and inserted sheets.** The report describes godparents displaced to the next frame by a reversed leaf, books of other parishes bound in, and loose later-issued extracts and police papers [S164]. Join split entries by counter within the same parish/year/part, checked against the dates, people and column continuation; retain both fragment locators. Transcribe each sheet under the parish named on that page and distinguish its document date from any event date it copies. If either is absent or unreadable, keep it unknown rather than inheriting the cover's parish or year. Record where the sheet is bound, even when it interrupts the year sequence.","sources":["S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ab9b1132758a","kind":"method","anchor":"- **Status and confession as written.** The report found «военный», «запасной рядовой», «оба раскольники» and «присоединение из раскола» omitted or normalised to «крестьянинъ … оба православные» [S164]. Copy the literal words before interpreting them under step 7. Never fill estate, military status or confession by default; preserve a blank or uncertain reading as such, including where the surrounding entries repeat a formula.","sources":["S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9b51a59ca1ba","kind":"method","anchor":"- **Later marginal notes.** The report includes consistory decrees, «Выдано … 1947» and conversion notes of 1914 attached to earlier entries [S164]. Link each note to its entry but give it its own date and wording, keeping the original event date separate. Do not assign the entry to the note's year. Follow [step 8](#8-copy-every-margin-note-as-its-own-dated-event-and-follow-it) for the issuing body, decree number and next record; leave an unstated date or recipient unknown.","sources":["S164"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-YANDEX-PARTICIPANT-ROLES","kind":"platform-ui","anchor":"Yandex's 20 May 2026 announcement describes event and participant-role filters, with examples\nincluding child, father and mother in birth records, and groom, bride and witness in marriages\n[S165 @2026-11-16]. Have the logged-in user confirm which filters the current view offers.\nRun a role-filtered search and an ordinary text search separately, recording the filters and\nvolumes actually covered. Check each candidate's name, role, place and dates in its own entry\non the image: structured machine fields are another interpretation of that image. The\nannouncement does not establish filters for godparents or marriage sureties; search ordinary\ntext and browse the relevant entries for them. A role-filter miss leaves unmarked or\nmisclassified entries unresolved.","sources":["S165"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-34b399b2d7a5","kind":"historical","anchor":"- **A non-Christian or Old Believer spouse joined the Church first.** The law counted a marriage of an Orthodox person with a non-Christian as invalid [S105], and an Orthodox priest could not marry an Orthodox person to an Old Believer in an Orthodox church [S166]. So a spouse of Jewish, Muslim or other non-Christian origin in an Orthodox marriage had been baptised before it, and an Old Believer had been received. In an 1887 Dvinsk birth entry quoted by a blogger, the Catholic father keeps his own confession, while the mother is described as «из евреев» under her first name and surname and as «нареченная при крещении» under her baptismal name and patronymic [S167]. In a 1902 case the same blogger follows, a bride from an Old Believer family was told in January that she had to join the Orthodox Church to marry an Orthodox groom [S168]. Look for the baptism or reception entry before the wedding, and search the convert under the earlier name as well.","sources":["S105","S166","S167","S168"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-245e5c40a183","kind":"example","anchor":"- **District archives can hold books as well.** A blogger who worked in a district archive of Krasnodar Krai read its ZAGS books, metrical books and confession lists for one settlement there; those books have since gone to the krai archive. [S169] A 2010 forum post likewise reports the metrical and ZAGS books of the Leningradsky district's archive department transferred to the State Archive of Krasnodar Krai (ГАКК). [S170] The Kamyshlov advice above is one area's experience: give the district archive or the district administration's archive department its own row, and check whether its books have been transferred.","sources":["S169","S170"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6a9a337c28e6","kind":"method","anchor":"- **Museums are the last custodian to check.** A genealogy site notes that regional and municipal museums hold a few metrical books and advises searching the State Catalogue of the Museum Fund (Госкаталог) when the regional archive lacks the books. [S171] A blogger who found books this way searches it for «метрическая книга» once the archives and ZAGS have nothing, and warns that a museum may hold a whole book or only parts or single leaves. [S172] Search it as [the photograph-collection recipe](repository-photograph-collection-search.md#find-the-collections-that-cover-the-town-and-period) describes, and give the holding museum its own custodian row.","sources":["S171","S172"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8b65f2c12b83","kind":"method","anchor":"- **A birth entry repeats what the clergy were told.** Birth entries were written from the word of people close to the event; the law set no way of taking those statements and required no documents, and a metrical entry could not be the only proof in court [S139]. In an 1898 case that a blogger follows through a consistory inquiry, a birth entry naming a factory craftsman and «законной жены его» turned out to be of an illegitimate child: the psalmist had written it from the godmother's word, and the priest said that when nobody else was present he wrote from what he was told [S173]. Do not take the parents' names, estate or «законная жена» in a birth entry as checked. Test them against the parents' marriage entry, the family lists and the parents' own births, and look for an inquiry file in the consistory fond.","sources":["S139","S173"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ad4fff2eca81","kind":"historical","anchor":"- **Who consented for an orphaned bride.** The law forbade marrying without the permission of parents, guardians or trustees, and when the parents disagreed the father's consent decided [S105]. In an 1843 Tomsk case quoted by a blogger, the groom's widowed mother consented alone, and for the bride, whose parents had both died, a townsman and his wife signed as her «ближайшие родственники», stating the parents' deaths and that the couple were not related by blood or by godparenthood [S175]. Read such signers as the bride's relatives or guardians, not her parents, record the relationship as they state it, and date both parents' deaths before the certificate.","sources":["S105","S175"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7d75632d9a31","kind":"historical","anchor":"- **«Погружен бабкой».** In danger a midwife could baptise a newborn, and if the child lived the priest then completed the rites and entered the child in the metrical book [S136]. A blogger found several entries recording a baptism by the midwife (повивальная бабка), among them a 1914 entry saying that a boy was «погружен бабкой», a peasant woman of a named village [S176]. Read the woman as the one who baptised the child, not as a grandmother or a godmother, and look for the child's burial in the following days.","sources":["S136","S176"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-60217a6069fe","kind":"method","anchor":"- **Search the deaths under the head of the household.** A wife's or a child's death entry often gives the husband's or the father's full name, a blogger notes [S177], and FamilySearch lists the spouse's or father's name among the details in the death records of its collection of Kazan church books [S178]. Search the deaths part and any index under the husband's or the father's name as well as the deceased's, and do not take the named man for the deceased.","sources":["S177","S178"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7a70843e1ac6","kind":"method","anchor":"- **Infant causes of death are stock phrases.** A blogger lists the causes usually given for baptised infants, «от преждевременных родов», «от слабости», «от слабого рождения» and «от родимца», and calls «от поносу» and «от младенческого» frequent [S179]. A glossary of causes in metrical books places родимец among the convulsions of newborns and warns that every diagnosis in the books is conditional [S180]. Copy the cause as written, and do not turn it into a modern diagnosis.","sources":["S179","S180"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-63e3b4d0191f","kind":"historical","anchor":"- **«Сводная жена и незаконные дети их».** A blogger quotes this heading, written for each family in a 1904 Vyatka consistory register of people who had left for the schism, and reads it as the Church's refusal to recognise Old Believer marriages [S181]. An 1895 study reports churchmen calling such marriages unlawful unions, and notes that from the law of 19 April 1874 an Old Believer marriage counted as proved from the day it was entered in the metrical register kept for Old Believers by the police [S182]. Read the heading as the consistory's label for an Old Believer marriage, not as proof that the couple never married or that the children had another father, and look for the police register entry.","sources":["S181","S182"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-11d8cc7c812e","kind":"method","anchor":"- **Sound-alike names can be confused.** A Nizhny Novgorod researcher names pairs such as Аксинья and Анисья, or Фёдор and Федот, as a frequent cause of negative archive answers, while Авдотья for Евдокия, Лукерья for Гликерия and Аксинья for Ксения are everyday forms of one name [S183]. Search both names of a sound-alike pair, and merge or split two entries only on the patronymic, the spouse and the age.","sources":["S183"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-6b41c3ee636f","kind":"historical","anchor":"- **A name-saint gives a window, not a birth date.** By old custom the baptismal name was taken from the saints commemorated on the day of baptism, by stricter tradition from the saint of the 8th day after birth, and later parents also chose freely, for example after relatives [S184]. A reader's answer on Азбука веры gives the saints of the day of birth, the 8th day and the 40th day [S185], and a blogger gives the same three days [S186]. In a 1920 entry of a Don-diocese sloboda, a boy born on 5 September and baptised the next day was named after a St Paul celebrated on 10 September, as another post by the same blogger notes [S187]. Use a name's feast only to rank possible birth dates within those weeks, never to fix one, and compare the dates in the same calendar style.","sources":["S184","S185","S186","S187"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2ef4ef809938","kind":"method","anchor":"- **A kinship check can split two forms of one name.** A blogger reports a ZAGS office in 2021 refusing to treat a mother's patronymic written Иосифовна in an 1896 birth entry, as an archival certificate gave it, and Осиповна in a 1940 death entry as the same name [S188]. The archive service's rules have a certificate give the entry's data exactly as recorded, marking a mismatch «так в документе» [S189], so the certificate keeps the church form. When a chain of records is to prove kinship, find a record that bridges each pair of forms; the blogger prefers a copy of the page to a certificate, so that the reading itself can be checked [S188].","sources":["S188","S189"],"checked":null,"stated_as":"observation","review":"reviewed"}
