claims:
  - {"id":"C-a030e6245239","kind":"unclassified","anchor":"1. List the editions actually available at each repository. Record individual years and gaps,\n   rather than treating a collection's broad date range as uninterrupted coverage.\n2. Open a volume's title page, contents and section headings. A directory named for one city\n   can include separate alphabetic sections for surrounding communities or a county taxpayer list.\n3. Record which section should contain the target and which you inspected. Inspect another\n   relevant locality section when the first does not contain the expected entry.\n   The contents may also show a separately printed racially segregated section; inspect it before\n   recording no entry, and treat a no-hit as especially weak where a group was poorly canvassed.\n   The [presenter's warning](https://www.youtube.com/watch?v=d39IOclm3wU) motivates this check\n   without showing which editions used such sections.\n4. Save the abbreviation key for that edition. Decode an entry with that key before expanding\n   residence, boarding or occupational abbreviations.\n5. Mark an inaccessible edition or uninspected section separately from an inspected section\n   with no matching entry. [S2, S3, H1]\n   Before marking an inspected edition 'no entry', also search its late-additions, changes,\n   errata, 'removals and corrections' and necrology pages at the front and back of the volume.\n   These sit apart from the main alphabetical list. Record whether each was found and inspected.\n   A search of the index or main list alone is not an inspected-edition negative. An entry on\n   these pages is a separate observation that may correct the main list or the previous edition.\n   It shows the compiler's addition, not an arrival or move date, and gives no destination unless\n   one is printed. An empty late list does not prove absence either, and such pages vary by\n   edition. See the [Cleveland 1915](https://www.youtube.com/watch?v=VcsuFFgIrWw),\n   [1814 Philadelphia](https://www.youtube.com/watch?v=b2O3BFQZ4mg),\n   [Lisa Lisson](https://www.youtube.com/watch?v=31IdUHAYlKw),\n   [removals](https://www.youtube.com/watch?v=a7aEIGoVXJw) and\n   [late-update](https://www.youtube.com/watch?v=NmtuDJBE5eQ) examples.\n6. For a former-resident directory, read the foreword to identify the addresses' roles.\n   The 1949/50 Breslauer Adressbuch lists later addresses of former Breslau residents but\n   orders entries by earlier street and house number. The ordering address is a lookup key;\n   do not record it as residence in the titled city at publication. [S4]\n7. From the title page, introduction or back matter, copy any stated coverage or canvass period\n   (such as a directory 'for the year ending' a given month) and any stated inclusion rule (such\n   as males over a stated age, widows, female heads of household or women in business),\n   recording that rule with its locator beside the coverage row. If no period or rule is found,\n   record that and leave the rule unknown. [S20] Judge a presence or absence against that period\n   and rule, not the cover year. Someone who arrived after the canvass, or who falls outside the\n   rule, is not a gap. Also check the business or classified section. Copy a firm listed under another household member's\n   initials exactly, without saying whose it is. A son's first listing under an age rule gives at\n   most a birth-year bound, because a move or an omission can also explain it. Rules differ by\n   edition and may not have been applied consistently. See the\n   [Cleveland title page](https://www.youtube.com/watch?v=VcsuFFgIrWw),\n   [South Haven examples](https://www.youtube.com/watch?v=xjLPo2MMuHs),\n   [front-matter tip](https://www.youtube.com/watch?v=8i1MYac23ec) and\n   [Hayward firm case](https://www.youtube.com/watch?v=68DpL1IWZHc).\n8. For a trade directory such as 'Вся Россия', read the inclusion rule in the volume itself. Posters in a [trade-directory discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) say only larger or guild-paying traders appeared, so a small trader's absence is weak. The town printed can be where the trader registered capital or traded rather than lived. A same-name hit in another town is therefore neither ruled out nor matched.\n9. For a German town, search CompGen's Datenbank Historischer Adressbücher (adressbuecher.genealogy.net), a free index of transcribed address-book entries searchable by name and place. Also run CompGen's separate DES address-book search, which covers further books, and look for page images in CompGen's DigiBib. A hit is an index row: use it for yearly residence and occupation only after opening the edition, and cite the edition, place and page. [S25]","sources":["S2","S3","H1","S4","S20","S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-09626b06f4ea","kind":"unclassified","anchor":"A database no-hit is not an inspected-edition negative. Check CompGen's GenWiki address-book portal for whether that edition is listed in DigiBib but not yet transcribed, or was transcribed only partly (for example, only up to a certain surname). If so, page through the DigiBib scans. Where the volume's alphabetical name register has been broken down for navigation, as in some big-city series, jump through it to the surname. Record which layer you searched: transcribed database or page images. [S26]","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1711cff94aa1","kind":"unclassified","anchor":"1. Locate the surname group or candidate entry using the volume's actual arrangement.\n   If the name index fails, browse a relevant alphabetical section only when one exists,\n   and compare the printed entry with its indexed name. For a former-resident list, use\n   the former street/house as a lookup key only when the foreword or heading confirms\n   that ordering and the former address is available. If the required key is unknown\n   and no usable index supplies another route, leave the entry unlocated and record\n   the lookup as unresolved. Do not invent an alphabetical or DES route. [S3, S4]","sources":["S3","S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-335c96827cab","kind":"unclassified","anchor":"If a long surname run looks unordered, test other sort keys before scanning every line. Within one surname, some volumes sorted entries by occupation, men before women, and filed a widow under her late husband's occupation, e.g. 'verwitwete Hauptmann'. Look for her under that word and copy the printed form. A [Berlin address-book discussion](https://forum.ahnenforschung.net/forum/thread/2950717/) states this for Berlin up to about 1925. Do not assume it for other cities or years, and treat the widow wording as status, not a death date (section 3, step 8).","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8916ef6eacc5","kind":"unclassified","anchor":"If the names listed at a dated address are unknown, no usable street or reverse\n   lookup exists, and the entries print addresses, a finite pass through the relevant\n   locality section or volume in its actual arrangement can recover literal\n   street/house-number matches. Add each match to the existing observation table\n   and record the inspected range; Gegner-Sünkler describes this approach for the\n   1812 Bremen directory. [S22]","sources":["S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-785c7e4b09db","kind":"unclassified","anchor":"2. Copy the entry as printed, including initials, spouse wording, occupation and address when\n   present. Preserve uncertain readings. Keep any normalized name in a separate column.\n3. If copying a site's tabular index into a spreadsheet, take the header once, paste subsequent\n   records beneath it, and add the correct edition year to every imported row.\n4. Compare imported fields with the image. Information printed next to a name can be a locality\n   or post office rather than another given name; retain the correction and the original index value.\n   Check the image for ditto marks. An index can merge two co-listed people into one row. Make a\n   separate row for each person on the image, expand a ditto only to the line it refers to, and\n   keep the merged index value as the original value. The\n   [MyHeritage example](https://www.youtube.com/watch?v=RRz2QHR4DmE) does not show how ditto\n   conventions differ between publishers.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-47e981a3d98d","kind":"unclassified","anchor":"In a 1913 Russian trade directory entry, an address such as 'Александровск., д.' followed by a surname in the genitive is probably a street name plus 'house of' an owner, not a town and a village. Record the street, the house owner and the listed firm holder or occupant in separate fields; the owner need not be the occupant. Check the edition's abbreviation key before expanding 'д.'. A [directory-address discussion](https://forum.j-roots.info/viewtopic.php?f=15&t=64) offers this reading as probable. It does not quote the key or show how the owner relates to the occupant.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2294be6f3804","kind":"unclassified","anchor":"When working from a volunteer transcription or extract rather than the volume, record which printed fields it left out, such as street, district, establishment type or owner-versus-lessee wording, and any sort order the transcriber added. Mark the omitted fields unknown, not absent, and take them from the edition before interpreting anyone's role. A [transcribed address-book discussion](https://forum.ahnenforschung.net/forum/thread/2552/) describes such a field-limited extract. It does not show the original pages or check the extract's accuracy.\n5. Check the first and last imported entries, remove repeated headers or interface text, and\n   confirm that each row still has its year and locator. Manual extraction uses the same schema.\n   [S1, S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-36aa1c74a3c0","kind":"unclassified","anchor":"**Check:** Do not import an index field as printed evidence when the image says something else.\nAn edition year identifies the volume; it does not by itself establish a residence date for\neach printed address or an exact move date. Keep an unstated time basis unknown. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-894d8d2b5884","kind":"unclassified","anchor":"1. Append the next available edition using the same columns.\n2. Sort complete rows by normalized surname and given name, then by edition year.\n3. Compare occupation and address within each tentative group. Try an occupation-first or\n   address-first view when repeated names remain ambiguous.\n4. Keep raw spellings and initials visible while filtering variants. An initial-only filter\n   may miss a spelled-out given name; inspect the records admitted and excluded by that filter.\n5. When the volume has an address-arranged or reverse directory, use it to inspect the\n   relevant street and nearby entries. Record those observations separately.\n6. Create a question for each change or competing group, with the row IDs that caused it.\n   A recurring name, occupation or address is a comparison clue, not an automatic merge. [S1, S2]\n   Test the opposite error too: one person can appear as two rows. A married woman may be listed\n   under her husband's entry and again on her own line with her occupation, employer and another\n   address, sometimes spelled differently. If she later appears under a new surname, a continuing\n   occupation can suggest the link. Record both rows as a proposed same-person question with\n   their row IDs. Confirm the link with a marriage or other record, because a common occupation\n   alone is weak. The [presenter's Marion example](https://www.youtube.com/watch?v=d39IOclm3wU)\n   motivates this check without showing how often such double listings occur.","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-53774544baf4","kind":"unclassified","anchor":"A business run under one initial across many editions may cover more than one holder, such as a husband and then his widow continuing the trade. Before assigning the run to one person, check the death dates of possible holders and split the run at any death as a question. A death record giving another occupation does not by itself rule out the match. A [business-run discussion](https://forum.ahnenforschung.net/forum/thread/3014463/) proposes this reading as a hypothesis. It did not compare the initial and full given name edition by edition.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8d677e76d32f","kind":"unclassified","anchor":"When a Russian or Soviet city directory shows same-named entries at one address with different occupations, do not merge or split them on the directory alone. When contact is authorized, request the house books (домовые книги) for that building and period, which register residents individually. Treat a professional directory, such as a medical one, as a separate series whose first listing can differ from the general directory's. A [house-book discussion](https://forum.j-roots.info/viewtopic.php?f=4&t=4667) and a [directory-and-house-book example](https://forum.j-roots.info/viewtopic.php?f=9&t=4132) motivate this. They do not establish survival outside one city or current access rules.\n7. For a located former-resident entry with a reported later locality, use that place for\n   one bounded follow-up, such as a later directory or a relevant civil-register search there.\n   Keep it as a source-attributed lead; it does not establish a move at the edition date. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1712b82e7a0b","kind":"unclassified","anchor":"In a former-resident list, also read the other rows under the target's former house number. Their later addresses are leads to where the household went, not evidence of a tie; in a large city a shared address can be coincidence. Copy 'über' or 'üb.' places as printed. They name the delivering post office, not the residence. Confirm the place in that locality's own directory before searching there, and check the supplement, where a later entry may give another form. An [expellee address-book discussion](https://forum.ahnenforschung.net/forum/thread/3014348/) shows both checks. It does not establish the co-resident link.\n8. Copy 'widow', 'wid of' or a printed death note exactly, as the status reported in that\n   edition. When a man's run of entries ends and his wife next appears as his widow, rule out\n   same-name men and record both row IDs as a death-interval clue. Propose a death-search window\n   from these observations and the edition's stated coverage and publication frequency, because\n   publication intervals varied; the window is conditional on their dating and accuracy, and the\n   last listing is not an established alive-after bound. Some directories added the label only in the\n   year after the death. Divorced or separated women sometimes reported themselves as widows, so\n   look for the husband elsewhere. Record contents-listed deaths-since-last-edition or\n   divorces-granted lists as separate observations. They are leads to the death or court record,\n   bounded only by the stated period. A printed death date is the directory's statement and\n   should be checked against the death or obituary record; widow labels and death or divorce\n   lists only bound or suggest a death and do not prove one. See the\n   [widow-interval](https://www.youtube.com/watch?v=JY9qiuftib4),\n   [frequency](https://www.youtube.com/watch?v=VDsZBiAxlzg),\n   [paper-widow](https://www.youtube.com/watch?v=dck2TkjsKso),\n   [listener](https://www.youtube.com/watch?v=EsfciqHqnBE),\n   [delay](https://www.youtube.com/watch?v=d39IOclm3wU),\n   [printed-date](https://www.youtube.com/watch?v=iTdSalYI6a4),\n   [death-list](https://www.youtube.com/watch?v=9Lz5OLRv8E0) and\n   [divorce-list](https://www.youtube.com/watch?v=9XPYpWcaU1o) examples.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7ef4e80b4862","kind":"unclassified","anchor":"For a supported same-block or building question, retain each literal building and unit number,\nincluding fractional addresses. Compare dated street/reverse entries and stable-neighbor\ncontext before choosing between a move, unit conversion, renumbering or an erroneous entry.\nKeep the proposed correspondence provisional until supported; do not silently correct numbers.\nThe [old-home address example](https://dna-explained.com/2023/04/09/finding-the-old-home-place-with-zillow-52-ancestors-394/)\nmotivates the comparison without proving occupancy, identity, a conveyance or renumbering.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dec175e4fcbb","kind":"unclassified","anchor":"Before treating the present building at that address as the historical dwelling, compare its\nconstruction date with the record date and retain the construction-date source. An unverified\nlisting year flags a question; a supported construction date after the record excludes that\nstructure, while leaving an earlier building or changed address correspondence to investigate.\nAn earlier construction date is only compatible with the historical observation; it proves\nneither occupancy nor that today's appearance is unchanged. [S21]","sources":["S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ab4155ed6aeb","kind":"unclassified","anchor":"If an inspected auxiliary section labels a land-register reference, preserve its heading,\nlocality, street/house wording and land number separately. Carry the stated reference into\nthe [land-index/book-series workflow](land-index-book-series-recovery.md); house, parcel and\nland-register numbers are different roles. [CompGen's directory example](https://www.compgen.de/2023/02/adressbuch-mit-unerwartetem-inhalt-entdeckt/)\nidentifies such a section, but its missing illustrated table does not establish fields in\nanother volume or prove ownership.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-65fa9c6d53ae","kind":"unclassified","anchor":"If a marriage record names an officiant without identifying a congregation, check an available\ndirectory near the event's date for a clergy listing. Preserve the printed name, denomination\nand address with the edition and entry locators; keep an unstated address role unknown.\nCompare the directory's church listings for a possible congregation, then establish whether\nits relevant marriage register survives and who holds it before requesting a record.\nKeep the affiliation provisional: matching denomination or nearby addresses do not establish\nthe ceremony's location or either spouse's membership. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c8f7e0196c34","kind":"unclassified","anchor":"If a census or other record gives an occupation but no employer, check a classified or business\nsection from a directory near the record date for the town of residence. List every business of\nthat trade with its edition and page locators. Propose a specific employer only when it is the only\none listed, and keep it marked as an inference until an employment or other record names it. An\nemployer named by a web page or AI answer is not a substitute for this check. A business section\ncan be incomplete, so a single listing does not prove there was no other employer. [S27]","sources":["S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-911fc55860a4","kind":"unclassified","anchor":"1. For the first or last apparent appearance, return to the coverage sheet.\n2. Check whether an omitted year is absent from this repository, was not published, is\n   inaccessible, or remains unlocated. Keep the unknown state when you cannot distinguish these.\n3. Check whether the earlier edition included the same community or taxpayer/resident section.\n4. Search another available edition or repository when that specific gap affects the question.\n5. Report the actual observations and remaining gaps. For example: “Listed in the inspected 1931\n   taxpayer section; not found in the inspected 1929 volume; comparable 1929 section coverage\n   remains unconfirmed.” Do not replace that with a dated arrival. [S3, H1]","sources":["S3","H1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b891e94e2c74","kind":"unclassified","anchor":"A directory listing household heads does not make an unlisted household member absent from the\nhousehold or locality. CompGen's address-book example also distinguishes a woman's\nmarital-status wording from an occupation; retain the printed role without inferring employment\nfrom it. [S20]","sources":["S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f7695b09e18d","kind":"platform-ui","anchor":"Do not skip an address book whose DES transcription is still in progress: data entered through DES can be searched by anyone at once, so a partly entered book can already return hits [S24 @2026-11-12], [S28 @2026-11-12]. A miss in such a book is the partial-transcription case above, not a negative.","sources":["S24","S28"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-21a7fd086d3c","kind":"method","anchor":"Before treating a person's disappearance from the main list as a dead end, read the entries in the editions around it for a destination printed in place of a street address, such as 'removed to' or 'moved to' and a place, sometimes abbreviated: an 1891 Seattle entry reads 'removed to S F, Cal.' Copy the note as printed and use the place for one bounded follow-up, such as that city's directory for the same and next years. A same-name hit there is a candidate, not a match, and the edition year is not the date of the move. [S29], [S30]","sources":["S29","S30"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f97dc3a613be","kind":"portal-availability","anchor":"Before you call an edition missing, find out which directories were published for the place and where they are held. For a U.S. place, uscitydirectories.com lists directories by state and locality with the repositories that hold them; its pages carry a 2002–2005 copyright, so a year it omits is unlisted there, not unpublished [S32 @2026-11-14], [S36 @2026-11-14], [S42 @2026-11-14]. The Library of Congress guide *United States: City and Telephone Directories* indexes the Library's own city and telephone directories by state [S36 @2026-11-14], [S43 @2026-11-14].","sources":["S32","S36","S42","S43"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f8e74acb75f7","kind":"method","anchor":"Identify each edition by its publisher as well as its place and year. In some cities competing publishers issued directories for the same year, and each can hold entries the other lacks, so give each its own coverage row and look for a rival before you treat a year as covered [S31], [S32], [S33].","sources":["S31","S32","S33"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e19af07d9863","kind":"method","anchor":"Some U.S. directories marked Black or other non-white residents in the main list with an asterisk or an abbreviation such as `col'd`, besides or instead of printing them in a separate 'colored' section [S32], [S35]. Decode such a mark with the edition's key rather than reading it as a footnote, and copy it with the entry as the compiler's designation.","sources":["S32","S35"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-041a098356cd","kind":"portal-availability","anchor":"For England and Wales, search the University of Leicester's Historical Directories collection on its Special Collections Online: 689 trade and local directories from the 1760s to the 1910s, with at least one for every county, searchable by name, place and occupation and also available through Ancestry.co.uk [S37 @2026-11-14], [S38 @2026-11-14]. Then look under Directories on GENUKI's county pages for transcriptions and indexes, search Internet Archive for `directory` with the town's name, and check the county family history society's publications for transcripts [S37 @2026-11-14], [S41 @2026-11-14].","sources":["S37","S38","S41"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0aa82cd89607","kind":"method","anchor":"Before the 1841 census, an English trade directory can give a trader's street address and trade where the parish register gives only a village or district as the abode; place the address on a map close to the directory's date [S37], [S39]. Early directories listed only the chief inhabitants: gentry, clergy, professionals and the more substantial tradesmen. Later ones grew to cover most heads of household but still left out labourers, servants and the poor, so an absence from any of them is weak evidence [S37], [S39], [S40]. Some directories before about 1823 give only a surname and a trade, with no address [S39].","sources":["S37","S39","S40"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-86888f1a3acb","kind":"method","anchor":"Follow a person through a change of surname by what stays the same. A woman who married several times could stay in the same home, so search the later editions by her address as well as her names, and record a run of different surnames at that address as a proposed same-person question with its row IDs [S44], [S45]. Confirm each link with a marriage or other record before merging the rows.","sources":["S44","S45"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-629bb9140e47","kind":"method","anchor":"When an entry names the employer, look the firm up in the same edition: in the business section or commercial register, often at the back and arranged by category, and among the advertisements [S34], [S35]. Copy the firm's printed address and trade with their page locators beside the employee's row.","sources":["S34","S35"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5a8f44ddbec6","kind":"method","anchor":"When no directory covers the town for the year you need, or the person is missing from the one that does, widen to other directories before you treat the year as empty. A small town can appear in a county directory, and some states had state directories: Delaware's early directories covered the whole state [S32], [S33]. Rural-route, farm, church, club and professional directories also place people in a time and place, often yearly [S32], [S33], [S36]. Newspaper classified ads can give the home or business address of someone the directory missed; search them as in the [Newspapers.com recipe](newspapers-com-search-recovery.md) [S46], [S47]. Give each such listing its own row with its title, year and locator.","sources":["S32","S33","S36","S46","S47"],"checked":"2026-11-14","stated_as":"fact","review":"reviewed"}
