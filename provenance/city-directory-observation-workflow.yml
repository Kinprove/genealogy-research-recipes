  - {"id":"S63","kind":"web-page","urls":["https://blog.myheritage.com/2025/01/tips-to-find-ancestors-and-uncover-your-familys-past/"],"published":"2025-01-16","retrieved":"2026-11-21","access":"read","rights":null,"basis":"read 2026-11-21","entry_sha256":"090ad2a95e202cfd8c4a969c102028eefcb81b7c52079dcce4ba909614248df4","claims":["C-7b44aeb49192"],"review":"reviewed"}
  - {"id":"S64","kind":"web-page","urls":["https://www.connetquotlibrary.org/adult-and-information/genealogy/"],"published":"2021-04-06","retrieved":"2026-11-21","access":"read","rights":null,"basis":"read 2026-11-21","entry_sha256":"68bd608b49b2817f3bfe1133e8f0e548ffb6ff02225d295ea5d5eb69de1f213d","claims":["C-7b44aeb49192"],"review":"reviewed"}
  - {"id":"S65","kind":"video","urls":["https://www.youtube.com/watch?v=Us20XQMebGo"],"published":"2023-02-06","retrieved":"2026-11-21","access":"partial","rights":null,"basis":"Supplied transcript excerpt read 2026-11-21","entry_sha256":"8cbea63c9297e80eb50d4687e9ce2eeb146b4bc35b5644519e94e3edd60fdc4d","claims":["C-32d51a9101ad"],"review":"reviewed"}
