claims:
  - {"id":"C-6b0b0445afee","kind":"unclassified","anchor":"Use this recipe when a user asks you to build, export or convert a GEDCOM (`.ged`) file from research findings, or to bring a supplied GEDCOM into existing research. GEDCOM is a format for transmitting and storing genealogical data [S1]. It is not an application, a tree service or a place to publish. The recipe prevents seven failures: changing the header version and calling the file converted, attaching a child to the father's wife because she shares his family record, turning a shared patronymic and surname into a parent link, reading QUAY as a research status, silently converting an Old Style date or padding an approximate year, culling or confirming a supplied tree's claims during a format change, and marking people deceased so that they can go into a shared file.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-69ac931635df","kind":"unclassified","anchor":"- **Write a local `.ged` file unless the user chose another destination.** A connected tree service is not the destination just because it is connected. Do not read from it or write to it for this task unless the user chose it.\n- **Write the version the target program imports.** If the user names none, ask. If the user cannot say, write GEDCOM 5.5.1 with `CHAR UTF-8` and the rest of the header that 5.5.1 requires: `SOUR`, a `SUBM` pointer to a submitter (SUBM) record in the same file, and `GEDC` with `VERS 5.5.1` and `FORM LINEAGE-LINKED` [S4]. The official index still lists 5.5 and 5.5.1 as in use in the marketplace [S2], a software vendor announced in 2021 that its export would default to 5.5.1 until 7.0 is in widespread use [S3], and 5.5.1 permits UTF-8 as its character set [S4], [S5]. When the user later names a program, re-export in its version.\n- **Do not treat a header change as a conversion.** Between 5.5.1 and 7.0, rewrite at least these [S1]:\n  - **Character set:** 7.0 uses only UTF-8.\n  - **Header:** 7.0 has no `HEAD.CHAR` or `HEAD.GEDC.FORM`, and `HEAD.SUBM` is optional. A 5.5.1 file needs all three, and its SUBM pointer needs a matching SUBM record [S4].\n  - **Continuation lines:** 7.0 removed `CONC` along with the old line-length limits. Join `CONC`-split values into one line.\n  - **Calendars:** 7.0 writes the calendar as a keyword (`GREGORIAN`, `JULIAN`, `FRENCH_R`, `HEBREW`). Versions 4.0 to 5.5.1 used an `@#D…@` escape instead.\n  - **BC years:** 5.5.1 writes `B.C.` after the year [S4]; 7.0 writes the epoch `BCE` after the date [S1].\n  - **Extension tags:** 7.0 maps documented extension tags to their URIs in `HEAD.SCHMA`.\n- **Check the syntax against the official specification of the target version,** linked from the gedcom.io index [S2]. Do not invent a dialect.\n- **For a conversion, keep the original file unchanged** and write the result as a separate derivative file.\n- **Keep the research log, the research notes and the report.** The GEDCOM does not replace them. Do not hold the export back until every search is finished.","sources":["S4","S2","S3","S5","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6487cd42fcd3","kind":"unclassified","anchor":"- **Evaluate each parent–child link separately.**\n- **If a record proves only the father, write a FAM with him as the only partner and the child as CHIL.** Keep the mother unresolved in the notes. HUSB and WIFE are each optional in 7.0 [S1] and in 5.5.1 [S4], [S6].\n- **Never put the child into the father's existing couple family.** Being his wife does not prove she is the mother. The father then belongs to two FAM records, one with his wife and one with the child.\n- **Never turn a shared patronymic and surname into a CHIL link.** Keep the candidate in the notes and go on with the search that can tell the candidates apart.\n- **After an import, open each one-parent family in the destination.** A reply in a 2024 FamilySearch Community thread on its new GEDCOM upload says the system creates an \"Unknown\" parent when one is missing [S13]. RootsMagic shows \"Unknown spouse\" over an empty slot that holds no person [S14]. Do not treat such a placeholder as an identified partner or attach evidence to it; list it in the export packet.\n- **Do not infer a partner's sex or role from the HUSB or WIFE pointer.** GEDCOM 7 says so explicitly [S1]; 5.5.1 still assumes HUSB is male and WIFE is female [S4], so a 5.5.1 reader may do exactly that.","sources":["S1","S4","S6","S13","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4bd3011a6831","kind":"unclassified","anchor":"- **Keep every SOUR citation already in the data.** For each new claim, cite its source and put the specific leaf, act or entry in PAGE, the field for where in the source the material is [S1].\n- **Invent no locator.** For an interview or an unpaginated source, keep the locator that exists in the citation or a NOTE. When a converted tree gives no primary source, say so in a NOTE rather than supplying one.\n- **Put the research status and the claim or link handle in a NOTE,** using the labels of the evidence/proof judgment worksheet: open, supported so far, contradicted or rejected.\n- **Never map QUAY to or from a research status.** QUAY uses the values 0–3 to rate the credibility of a piece of information. Per the GEDCOM 7 spec, the values \"do not have numeric meaning\", and QUAY is \"not intended to eliminate the receivers' need to evaluate the evidence for themselves\" [S1]. A QUAY of 3 does not make a link proved, and a missing QUAY does not make it doubtful.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-509999fffef5","kind":"method","anchor":"- **Keep the original name spellings, the date uncertainty, the calendar and the historical jurisdiction.**\n- **Write an Old Style date as Julian in the target syntax:** `JULIAN 3 MAY 1892` in 7.0 [S1], `@#DJULIAN@ 3 MAY 1892` in 5.5.1 [S4], [S8], except for the 5.5.1 dual-year form below. A 7.0 date without a calendar is read as Gregorian [S1], so the keyword is required. Never convert a date to New Style silently; take the offset for the date's century from evidence/proof judgment.\n- **Keep a dual year.** Before 1752, England, Wales, Ireland and the British colonies began the year on 25 March; Scotland used 1 January from 1600 [S9], [S10], [S19]. A date from 1 January to 24 March may therefore belong to the next modern year; a record may write it as a dual year such as 1731/32. 5.5.1 has a form for this: the year, a slash and the last two digits of the next year, as in the standard's example `15 APR 1699/00` [S16]. Write such a date as `2 DATE 30 JAN 1648/49`, with two digits after the slash and without `@#DJULIAN@`: the 5.5.1 grammar allows the slash only in its Gregorian date form, which is the default [S16]. In 7.0 the year is a plain integer with no slash form [S1]. Put the New Style year in DATE, keep the Julian calendar keyword, and put the literal dual date in PHRASE: `2 DATE JULIAN 30 JAN 1649` with `3 PHRASE 30th of January, 1648/9`. Moving the year start does not convert the day and month to Gregorian. FamilySearch's migration guide also shows `2 DATE JULIAN 30 JAN 1648` for this date [S12], so programs may disagree on the year of a JULIAN date from 1 January to 24 March; the PHRASE keeps the literal date. If the year itself is uncertain, write `2 DATE BET 1648 AND 1649` with `3 PHRASE 1648/9` [S1]. Never drop to one year silently: that moves ages and the order of events by a year. How to read such a date: [evidence/proof judgment § Follow record versions and test disputed dates](evidence-proof-judgment.md).\n- **Do not pad an approximate date.** `ABT 1890` stays `ABT 1890`, never a full day and month. Both 5.5.1 and 7.0 have `ABT`, `CAL` and `EST` for approximations, `BEF` and `AFT` for one-sided bounds, `BET … AND` for a range, and `FROM … TO` for a period [S1], [S4]. The versions differ in how they write the calendar and a BC year (section 1). If the target version cannot express a detail, keep it in a NOTE and in the notes, and say what was lost.\n- **When versions conflict, keep both.** For example, a tree gives a birth year and a document gives a Julian date in another year. Keep both in the notes with their provenance, and add a NOTE in the export that names the dispute. Do not choose one silently.\n- **Never re-export a disputed link as confirmed, and never overwrite the user's file** with a new conclusion.","sources":["S1","S4","S8","S9","S10","S19","S16","S12"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b373f47d0b4d","kind":"unclassified","anchor":"- **A pure format conversion keeps every claim and link of the supplied tree,** unverified ones included, with their provenance and status. It is not an evidence cull: do not drop claims that would fail the bar for new research findings. It confirms nothing either.\n- **List every custom tag, attachment and media link that was not carried over,** and carry its meaning in a standard NOTE where you can.\n- **Media files do not travel inside a `.ged` file.** A 5.5.1 `OBJE` `FILE` value is a local or remote file reference [S4]. A path on the sender's computer, such as the migration guide's `d:\\Media\\…` example [S12], breaks after transfer when that path is not available on the receiving computer. 7.0 defines GEDZIP: a `.gdz` zip archive that holds the dataset as `gedcom.ged` together with the local media files it references [S1]. Write a GEDZIP only when the destination imports it; otherwise hand the media files over separately and list them.\n- **Do not call a conversion lossless, or an import into another program successful, until you have checked it in that program.** For transfers between RootsMagic, Ancestry and FamilySearch, use the RootsMagic recipe's destination check.","sources":["S4","S12","S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6648ba07ead9","kind":"unclassified","anchor":"- **Keep the file unchanged as a source.** Record where and when you received it, and its SHA-256 hash.\n- **Decode before you match.** Earlier versions allowed several character encodings and defaulted to ANSEL; 7.0 uses only UTF-8 [S1]. Decode a 5.5 or 5.5.1 file with the character set its header declares. If names show stray accented capitals or symbols where letters belong, the file was decoded with the wrong character set: fix that first. Next, repair family links recorded on only one side, in the FAM record but not in the person's record or the reverse. Run duplicate detection only after both repairs. Otherwise a garbled spelling and the correct one, or a half-linked record and its fully linked twin, look like two people.\n- **Map its cross-reference IDs to your own person handles** in a small table. Do not merge same-named people automatically, and do not overwrite existing candidates. Same-named children of one couple may be two children, one named after a dead sibling: run the burial and forward-trace test in [evidence/proof judgment § Techniques that work](evidence-proof-judgment.md) before you merge them.\n- **Enter its links as hypotheses** until the documents behind them are evaluated. A website copy of the same tree is not a second source; test independence as evidence/proof judgment sets out.\n- **Never mark anyone deceased from a birth-year cutoff or a missing death date** in order to export, share or publish them. Treat probably living people as living.\n- **State partial coverage,** for example \"40 of 200 people parsed\", and keep the unsupported fields for review. Work on the parsed part without waiting for the rest.\n- **Do not let a re-import restore an identification rejected earlier.** Keep the rejection, its reason and any justified revision, as the evidence/proof judgment worksheet does when a premise changes.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c1c952361108","kind":"method","anchor":"- **Check that the file conforms to the declared version:** the header, the character set, the date syntax and the tags of that version. A 5.5.1 header needs `SOUR`, `SUBM`, `GEDC` with `VERS` and `FORM LINEAGE-LINKED`, and `CHAR`, and the file needs the SUBM record that `SUBM` points to [S4]. That record needs a `NAME` [S16], and every copy of the file carries it: ask the user, write the name or label the user chooses for the file's submitter, and do not invent one. In a 5.5.1 file every line, counting its level, cross-reference ID, tag, value, delimiters and terminator, is at most 255 characters, and every cross-reference ID, counting its `@` signs, is at most 22 [S16]. Split a longer value with `CONC`, which joins the next part without adding a space or a line break; split between two non-space characters, because a space at the split is lost when an importer trims it. `CONT` marks a line break inside the value [S16].\n- **Check that every INDI, FAM and SOUR pointer resolves.** In 7.0, every pointer except the null pointer `@VOID@` must occur as the cross-reference identifier of a structure in the same file [S1].\n- **Compare the exported links, citations and notes with the research notes.**\n- **Privacy gate:** <!-- privacy-gate: export --> A copy prepared for sharing carries tree data that may include living or possibly living people out of the user's own files; answer the privacy gate in `SKILL.md` before handing it over.\n- **Apply the living-person rules to a copy prepared for sharing.** Put a living or probably living person into it only with that person's explicit permission for the destination. Without that permission, leave the person out completely: their INDI record; every pointer to them in a FAM record, with the marriage and other events of a couple they belong to; any FAM record left empty; and the notes, citations and media about them. Redaction does not replace permission: a person kept under a placeholder name, without dates, or as a nameless spouse or child in a family record still appears, with their relationships. Also leave out private notes and attachments the user did not choose to share. Writing a local export publishes nothing; do not upload the file or its attachments anywhere the user did not choose.\n- **Report what was not checked.** Give the file path, the version and the material limits of the transfer.","sources":["S4","S16","S1"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4656e136009b","kind":"unclassified","anchor":"- **Separate conformance from importer support before you edit the file.** A file that passes a local parser can still be rejected by a program. Check the rule in the target version's specification first, then the program's own import help.\n- **Check the version differences that trip importers** [S1]:\n  - **`@` in a value:** 5.5.1 doubled every `@`; 7.0 doubles an `@` only when it is the first character of the line string.\n  - **Cross-reference IDs:** in 7.0 an ID is any run of uppercase letters, digits and underscores between `@` signs, so a leading digit is allowed. `@VOID@` is reserved.\n  - **Date phrases:** 5.5.1 put them inside the DATE value; 7.0 moved them to a PHRASE substructure.\n- **Privacy gate:** <!-- privacy-gate: upload --> A test upload sends tree data, possibly about living or possibly living relatives, to an online tree service; answer the privacy gate in `SKILL.md` before uploading even a test file.\n- **Never upload a reduced test file over an existing online tree.** A re-import can replace the tree. Familio's help (a Russian-language tree service; checked 2026-11-04) says a re-import always fully replaces person pages: the new file replaces the old one, and all edits made by hand on Familio are lost [S11]. Test on a separate test tree or with a small synthetic file, and only on a destination the user chose.","sources":["S1","S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-80db88d34dfb","kind":"method","anchor":"**Cross-reference IDs in 5.5.1:** the first character may be a letter, an underscore or a digit, and lowercase letters are allowed, unlike in 7.0 [S15]; the standard's own example ID is `@1234@` [S16]. A leading digit is valid in both versions and is no reason to rewrite IDs. If an importer still rejects the file's IDs, rename them in a derivative copy: a pointer must match a cross-reference ID in the same file [S16], so change each ID and every pointer to it in one pass, and add each old and new ID to the packet's ID map.","sources":["S15","S16"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a946fe7c43ab","kind":"method","anchor":"**Blank lines and the last line:** every 7.0 line ends with a line terminator, and 7.0 dropped the permission earlier versions gave for blank lines before a line [S15]. The 5.5.1 standard says the trailer must be followed by the terminator, and that files with extra blank lines between records are not to be used when transmitting to other systems [S16]. Remove empty lines and make sure `0 TRLR` ends with a terminator.","sources":["S15","S16"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-14c9cb53ab08","kind":"method","anchor":"**A sample export from the target program is a structure reference, not a template for the content.** `HEAD.SOUR` names the software that actually wrote the file [S15], [S16]; leave it naming that software even where the sample names the target program. Keep every place, source, note and continuation line that the sample lacks: cutting them to match loses research data silently.","sources":["S15","S16"],"checked":"2026-11-08","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f767bfdf8601","kind":"platform-ui","anchor":"On MyHeritage, importing a GEDCOM creates a new family tree on the family site and does not merge it with any existing tree there; MyHeritage also does not merge two family sites directly [S17 @2026-11-12]. Tell the user that an upload creates a separate tree; it will not update or merge into their existing MyHeritage tree. Plan the merge instead: offline in Family Tree Builder before syncing, which MyHeritage suggests [S17 @2026-11-12], or by copying evaluated changes across by hand [S18 @2026-11-12]. Either way, apply §7: map the IDs, and do not merge same-named people automatically.","sources":["S17","S18"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
