claims:
  - {"id":"C-18ed98bb9ada","kind":"platform-ui","anchor":"Open the scan folder and narrow it with QuickFilters, using an assigned scan keyword or embedded capture detail. For an existing LifeCalendar view, use a person or tag filter where it is available. Clear the filter before interpreting a missing item. [S1 @2026-11-21] [S3 @2026-11-21]","sources":["S1","S3"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-78f9af65fb1b","kind":"platform-ui","anchor":"Give an uncertain photo only the precision the evidence supports. In the Info panel use the ellipsis beside Date Created/Shown to select Date Range, Season & Year, Year, Decade or Undated. Keep the evidence for the date with your research notes. When using seasons, check Settings → LifeCalendar for the season boundaries before comparing fuzzy dates with exact dates. [S1 @2026-11-21] [S2 @2026-11-21] [S4 @2026-11-21]","sources":["S1","S2","S4"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e4763703f2b2","kind":"platform-ui","anchor":"Create a date- or folder-based Event for a documented occasion and inspect it in LifeCalendar. Keep an uncertain item’s own date range when placing it in the worklist. [S1 @2026-11-21] [S5 @2026-11-21]","sources":["S1","S5"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1a5513a81d97","kind":"platform-ui","anchor":"If using Mylio Photos+, designate an external drive you control as a local Vault. Check that the Vault preserves full-resolution originals, metadata and the catalogue, including edits to date metadata. [S1 @2026-11-21] [S6 @2026-11-21]","sources":["S1","S6"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
