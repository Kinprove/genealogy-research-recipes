claims:
  - {"id":"C-identify-the-court-and-series-1","kind":"custody","anchor":"Identify the Petty Sessions district and court for the place and year before declaring a gap. Districts can cross county boundaries. Search the National Archives of Ireland catalogue or the reading-room finding aid by court and date. Use CS/PS/1 for Order Books and CS/PS/2 for Dog Licence Registers. Use the relevant microfilm finding aid, MFGS/58 or MFGS/60, where a film exists. Check the actual run and known gaps, especially for the Dublin Metropolitan Police Court. [S3 @2026-11-22]","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-offence-or-licence-in-its-own-record-2","kind":"portal-availability","anchor":"For a case, look up the deceased person in the Petty Sessions Order Books. The MyHeritage announcement describes an Ireland, Petty Sessions Court Registers, 1828–1926 collection. Use the court, sitting date and register locator from a hit to retrieve the entry. Read who is the complainant, respondent or witness, and distinguish their residences, the location of the incident and the court seat. Transcribe the outcome separately from any allegation. [S1 @2026-11-22] [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-offence-or-licence-in-its-own-record-3","kind":"portal-availability","anchor":"For a licence, use the deceased holder’s name in the Ireland, Dog Licence Registers, 1865–1926 index described by MyHeritage. Record the issue date, court and residence from the register when given. Keep a licensing entry separate from any charge or judgment. [S2 @2026-11-22] [S3 @2026-11-22]","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-offence-or-licence-in-its-own-record-4","kind":"historical","anchor":"Read the number and description of dogs from the entry. The 1865 act provided for a duty per dog and allowed a single licence to cover multiple dogs. [S2] [S4]","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
