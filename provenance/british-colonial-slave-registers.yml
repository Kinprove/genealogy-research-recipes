claims:
  - {"id":"C-ab0a187bd0ae","kind":"unclassified","anchor":"Registration began in Trinidad in 1813 and reached most Caribbean colonies by 1817; Anguilla's registers start only in 1827 [S13]. An 1819 Act set up the Office for the Registry of Colonial Slaves in London, which received copies of the colonial registers. These copies are The National Archives series T 71, 1813–1834 [S10]. The years differ by colony [S13]:","sources":["S13","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5327f8bd9c52","kind":"method","anchor":"- **Mark each return as a full list or a change return before reading it.** Check the heading and columns. In a change return, distinguish births, purchases and other additions from deaths, sales and transfers out. The 1823 and 1829 Mount Carmel returns list changes to the estate’s 1817 registration [S13], [S1], [S15].\n- **Barbados has full lists in 1817, 1820 and 1834.** Its 1823–1832 returns give increases and decreases only [S13]. In Anguilla the first and last registers are full lists [S13]. A few owners elsewhere filed their whole population in a change year [S1].\n- **Carry a person forward provisionally across a changes-only return.** Record “no change found” and the years checked. A missing name there does not independently establish continued residence, survival or freedom.\n- **Transcribe the columns used in that colony.** Jamaican returns may give age, colour, origin and remarks naming the mother. Trinidad returns can include occupation and physical description. A Bahamas return of 31 July 1834 gives a child’s age in years and months and identifies her work in the fields [S15], [S1], [S8].","sources":["S13","S1","S15","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-9cab188ddc84","kind":"method","anchor":"- **Use the colony’s emancipation and apprenticeship dates.** Where the automatic apprenticeship provision applied, the 1833 Act set its threshold at six years on 1 August 1834. It also allowed a separate indenture for a younger child in specified circumstances. Antigua and Bermuda omitted apprenticeship, while the British Caribbean apprenticeship system elsewhere ended in 1838 [S12], [S18], [S27]. At the Cape it ran from 1 December 1834 to 1 December 1838 [S23], and in Mauritius from 1 February 1835 to 1839 [S24].\n- **Check compensation claims for births after the last return.** Read the original claim and certificate alongside the return, since the child may appear only in the later file (§ 5) [S21].\n- **Read baptisms and marriages of the apprenticeship years in full.** An apprentice's entry can name the former owner or master, which leads straight to the returns [S2].\n- **Start from the last full list where one exists.** In Barbados that is 1834 [S13].\n- **Rebuild each holding at the date you need.** Start with a full list and apply every later addition and removal. Follow a sale or transfer into the receiving return and a manumission into records of free people. A later recorded death contradicted a proposed match between a Jamaican register entry and a namesake reportedly alive in 1913 [S1].\n- **Compare the ages at the dates actually recorded.** A man baptised at about 44 in 1820 would have been about 56 in 1832, when a man with the same surname on the estate was listed as 42 [S3]. Keep them separate pending evidence that explains the discrepancy. Look for a record that states any proposed relationship.\n- **Keep every same-named candidate.** One owner's population often holds several people with the same name [S1]. Carry them all until mother, age, colour and origin separate them.","sources":["S12","S18","S27","S23","S24","S21","S2","S13","S1","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5d1422eaee58","kind":"method","anchor":"- **Index by owner and by maker.** Most registers are indexed under owners or plantations [S10]. Some indexes give only the person who made the return, not the owner [S11].\n- **Read the header of each return.** It names who made the return: the owner, or a representative acting for the owner or a dead owner's estate. The representative can be an agent; a planting attorney, who managed an estate for an absentee owner and was not a lawyer; a trustee under a will; an executor; or a receiver appointed in a property dispute [S1]. The registers of Grenada and Jamaica also name guardians [S13].\n- **Expect colony differences.** Barbados returns usually state the maker's capacity, such as attorney or executor. Tobago returns name the registrant, not the beneficial owner. Virgin Islands registrants are people to whom the enslaved \"belonged\" or by whom they were \"possessed\", so a lessee can appear [S13].\n- **Bridge a change of representative.** A return's header can name the previous receiver or attorney, which tells you whose name to search in the earlier years [S1].\n- **Include town households and returns made by free people of colour.** A Kingston householder registered a single enslaved woman in 1817 [S4]. Search individual residents as well as estate owners and their representatives [S6].\n- **Search every name.** List each owner, joint owner, attorney, executor, guardian, trustee, receiver and lessee linked to the estate across 1817–1834, and search each one in the owner field.","sources":["S10","S11","S1","S13","S4","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-0e0bf17efa39","kind":"method","anchor":"- **Do not search Jamaica by estate name.** Most Jamaican register entries do not name the estate [S13]. Find the owner of the estate first, then search under the owner and the representatives [S1].","sources":["S13","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-77e72a1479a8","kind":"method","anchor":"- **Know what was paid and to whom.** The 1833 Act paid £20 million to owners [S18], [S27]. Nothing went to the people freed [S1]. The Slave Compensation Commission met from October 1833 to the end of 1842 [S10].","sources":["S18","S27","S1","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b9d2b164a296","kind":"method","anchor":"- **Match transfers on both sides.** Copy the seller or former estate from an increase marked *by vendition* (sale), then look for the corresponding decrease under the seller’s name. Follow the names and any family group across the two entries [S1].\n- **Distinguish an absence from removal from the register.** One Jamaican return recorded a man as having run away in 1823, and the same owner continued to list him as a runaway in 1832 [S4]. Check later returns for his reported status and any separate removal.\n- **Corroborate a manumission with a deed.** One 1818 baptism called a man free, while a possible namesake appeared as manumitted in an 1820 return [S6]. Compare residence, age and other identifying details before treating the entries as one person’s change of status.\n- **In Barbados, follow references to earlier deed volumes.** The surviving volumes described by the Lancaster project are late nineteenth-century transcriptions, generally chronological with batches out of sequence [S20]. Browse the period when the index misses an entry. A researcher reported working without photographs or digital copies in a March 2026 lecture [S5]. Confirm access to the particular volume before a visit.\n- **Search both Trinidad series.** Trinidad has two volumes for each year, \"Plantation Slaves\" and \"Personal Slaves\" [S13]. A person missing from one may be in the other.","sources":["S1","S4","S6","S20","S5","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-4aaeda494c69","kind":"method","anchor":"- **Copy each alias exactly as paired.** A Jamaican entry gave *Rose alias Jane Duncan*, while another register used *Good Luck alias Richard* [S1], [S4]. Search each form in later returns and baptism registers, including a surname when one is recorded. Check the baptism before assigning either name to it [S15].\n- **Allow for a different baptismal given name as well as a new surname.** Compare age, mother, estate, parish and date when a search under the register name misses [S1], [S15].\n- **Test each person in a group baptism.** At Mount Carmel the rector gave ages for 101 people baptised in 1819, yet researchers could securely link only eight to the estate schedule (D-PIT/T/855) and proposed 22 more [S15]. Record tentative matches separately, using the estate, ages, mothers and dates where available.\n- **Browse the Jamaican parish volume and its handwritten index.** Use the collection title *Jamaica, Church of England Parish Register Transcripts, 1664–1880* to locate the parish. Inspect the baptism for an estate or owner even when neither is in the name index [S16], [S28], [S3], [S15].\n- **Use surnames to choose records to search.** Check both parts of a two-part name separately in children’s records [S1]. A Jamaican planter shared a family’s later surname, but the two-year-old child found in his 1826 return was recorded with a different surname [S7]. Trace the child forward through later records before deciding how the surname arose.","sources":["S1","S4","S15","S16","S28","S3","S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-899d76c327f5","kind":"method","anchor":"- **Follow each named mother to her own entry.** At Mount Carmel, 51 of the 101 identifiable entries in the 1817 return named a mother [S15]. Copy the relationship where recorded. Check earlier returns and follow transfers to another holding when the woman leaves the list [S1].\n- **Look for a record that names the father.** A return for one Jamaican estate listed two males aged 42 and 14 with the same surname. A presenter proposed father and son, but the return supplies no relationship [S3]. Record the shared holding and the proposed link separately [S1].\n- **Keep the return’s own terminology for each person.** The registers can describe a child as *Creole* and the mother as *African* [S4]. Check how the return defines origin, then compare its recorded name, age, origin and colour across years [S15], [S3].","sources":["S15","S1","S3","S4"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-565af95941d4","kind":"unclassified","anchor":"- **Use the 2026 Ancestry collection.** The older collection, \"Slave Registers of former British Colonial Dependencies, 1813-1834\", can be searched by enslaved person's name, year of birth, owner, colony and sometimes parish [S11]. It comes from black-and-white microfilm and stops at 1834 [S1]. Some T 71 volumes are not on it [S11]: it lacks Bermuda, the Cape of Good Hope, Montserrat and parts of Guyana [S1], [S2]. The newer collection, \"Former British Colonies Enslavement Registers\", covers 20 colonies from 1813 to 1840, with nearly 4 million records on about 300,000 pages [S17]. It has colour images and more indexed fields, and needs only a free Ancestry account [S1].\n- **Search as Ancestry's presenter does.**\n  - Put the owner or representative in the owner field, not the general name fields, and sort the results by role.\n  - Put variant spellings of a place that no longer exists, in quotation marks, in the keyword field.\n  - Use the landing-page map to browse a place when you have no name [S1].\n- **Browse the images.** Look at whole returns to learn the layout before trusting index hits [S1].\n- **Use the names of the time.** Search Demerara, Essequibo and Berbice (now Guyana), St Christopher (St Kitts), Honduras (Belize), Ceylon (Sri Lanka) and the Cape of Good Hope [S1], [S13].\n- **Map Jamaica's old parishes.** Jamaica cut its parishes to 14 in 1867, so register parishes often no longer exist [S19]:\n  - St Dorothy, St John and St Thomas in the Vale became part of St Catherine.\n  - Vere became part of Clarendon, and St David part of St Thomas.\n  - St George was split between St Mary and Portland, and Metcalfe went into St Mary.\n  - Port Royal was split between Kingston and St Andrew.\n- **Go behind a missing image.** The Kew volumes are London copies of registers kept in each colony [S10]. When an image is missing or unreadable, search the T 71 catalogue by colony and parish [S11]. Then ask the colony's archive whether its own register survives. For the Cape, the registers are mainly in the Cape archives as well as in T 71 [S9].","sources":["S11","S1","S2","S17","S13","S19","S10","S9"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b1884ff47c5d","kind":"platform-ui","anchor":"- **Use the Legacies of British Slavery estates database.** Search by estate name, colony, parish and division. An estate record lists the people linked to it, each with a role (owner, attorney, mortgage holder, executor, trustee) and a date range, the yearly numbers of enslaved people, and a link to the compensation claim [S14 @2026-11-19], [S25 @2026-11-19]. It also cites each register entry by T 71 piece and folio, for example \"T71/1 222-223\" for 1817. Go straight to those folios.","sources":["S14","S25"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-5df1e06bf108","kind":"method","anchor":"- **Check the match.** The same estate name occurs in several colonies and parishes, spellings vary, and some links are marked as tentative [S13], [S14]. Filter by colony and parish, and carry a tentative link as a candidate.\n- **Use Jamaica's almanac lists.** The Jamaica Almanac printed lists of proprietors and properties by parish, taken from the \"givings-in\", and these are transcribed online. An almanac reflects the givings-in of the previous March quarter, so date its observation to the year before the edition [S25]. In Montserrat, annual Poll Tax Acts list owners and numbers of enslaved people [S13].\n- **Trace the estate named in a baptism.** Copy its name and parish, identify its owner for the register year, then search the owner and representatives. In St Elizabeth, an 1820 baptism named Berlin Plantation, and an estate map led researchers to the name under which they searched its 1832 return [S3]. Use the entries to test the family link.","sources":["S13","S14","S25","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-67dc69c1e526","kind":"platform-ui","anchor":"- **Find the claim in the LBS database.** It names each claim by colony, parish and number, for example \"Jamaica St Catherine 550\". Each claim gives the number of enslaved people, the amount, the claimants and whether the claim was contested [S26 @2026-11-19]. The database also works as an index to the compensation returns in T 71 [S11 @2026-11-19].","sources":["S26","S11"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3746cf92b2a3","kind":"custody","anchor":"- **Know where the originals are.** T 71 holds valuers' returns, registers of claims with indexes, original claims and certificates, counter-claims, adjudications in contested cases and lists of awards [S10 @2026-11-19]. The National Debt Office's payment registers (NDO 4) give claimants' names and agents' signatures. AO 14 holds further lists of awards [S12 @2026-11-19], [S10 @2026-11-19].","sources":["S10","S12"],"checked":"2026-11-19","stated_as":"fact","review":"reviewed"}
  - {"id":"C-bbb63a1ab192","kind":"method","anchor":"- **Search the compensation index by claimant, then read the original claims and certificates.** Find the claim through the claimant's name in the LBS database [S11]. The claim forms record numbers and values by type of work [S12]. The original claims and certificates, signed by the claimant, add details missing from the registers: children born after the last registration, usually with the mother's name [S21]. Read the counter-claims as well, for details on enslaved people that predate the registers [S21].\n- **Use the claim for three things.**\n  1. It identifies the parties who claimed an interest in the holding. Check each party’s role against the return.\n  2. Every claimant and counter-claimant, such as a mortgagee, executor or heir, is a name to search in the register indexes.\n  3. Its count tests your rebuilt population.\n- **Reconcile counts at the dates of the return and claim.** Include intervening births, deaths and transfers. At Spring Valley on Nevis, two births in the seven-month interval accounted for the change from 179 registered to 181 people included in the compensation payment [S22].","sources":["S11","S12","S21","S22"],"checked":null,"stated_as":"observation","review":"reviewed"}
