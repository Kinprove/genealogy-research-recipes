  - {"id":"S31","kind":"web-page","urls":["https://dna-explained.com/2022/08/17/how-many-matches-at-each-dna-testing-vendor/"],"published":"2022-08-17","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","claims":["C-df9a54f352f1"],"review":"reviewed","entry_sha256":"23d3877041f6675fe56896910c0ddd876cfb6ff1b3b3634b8a4baa9de21e2ba4"}
  - {"id":"S32","kind":"web-page","urls":["https://blog.dnapainter.com/blog/how-each-dna-testing-site-could-be-better/"],"published":"2021-05-28","retrieved":"2026-11-12","access":"read","rights":null,"basis":"read 2026-11-12","claims":["C-df9a54f352f1"],"review":"reviewed","entry_sha256":"0514d9cf06b9d22b97439f37af068ba7f0d453c9033715f47c7fb27d356b854b"}
  - {"id":"O28","kind":"web-page","urls":["https://www.23andme.org/shop/premium-ancestry-health"],"published":null,"retrieved":"2026-11-12","access":"read","rights":null,"basis":"product page read 2026-11-12","claims":["C-df9a54f352f1"],"review":"reviewed","entry_sha256":"23765694f8d87fbdb5e2c6ad8baead860a5b0187cfba3ae8e041e41268152a7d"}
claims:
  - {"id":"C-b2cab3c21782","kind":"unclassified","anchor":"Check the vendor's current help and the account's eligibility message before paying for an\nupgrade or planning a tool-dependent workflow. Subscription names, chip requirements,\nregional availability, and match-list limits change. A missing button deserves an access\ncheck; a withheld comparison belongs in the worksheet as **unavailable**. Participation and\nancestry sharing disclose different fields; record both. [O1]","sources":["O1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9c05e07bd731","kind":"unclassified","anchor":"For a requested visibility pause, check matching participation, existing Connections and the\nactual ancestry/health sharing scope for each managed profile separately. Record the states\nactually offered; do not assume a matching opt-out stops established sharing or deletes data.\nThe [2023 Connections correction](https://dna-explained.com/2023/10/29/23andme-dna-relatives-connections-event-history-report-and-other-security-tools/)\nmotivates this check without guaranteeing current controls or invisibility.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ead43d19a75a","kind":"unclassified","anchor":"Practitioners described a returned chromosome browser and newly introduced clustering in\n2026; current official help describes both tools. Check access for this profile; help pages can retain\noutage banners alongside feature documentation. A returned browser does not establish that\nan all-match segment export also returned. [S1, S3, O2, O3]","sources":["S1","S3","O2","O3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3b7f4c965126","kind":"unclassified","anchor":"1. Start with a relative whose genealogical identity you already know. Open their profile and\n   preserve the match identifier or stable profile link, displayed name, shared amount and\n   unit, segment count if available, and provider-predicted relationship.\n2. Add Family Background's ancestral surnames, locations, and external tree link. Record\n   these as the match's reported information. Search the named branch with those clues;\n   verify the person and descent in the tree before assigning your match to it. [S6]\n3. Open Relatives in Common and record how much each useful match shares with the anchor as\n   well as with you. Add an **identified relationship** column alongside the provider's\n   prediction. The extra pairwise amounts often reveal a parent, child, sibling, or close\n   cousin inside a group of otherwise distant matches. [S1, S5]\n4. **Privacy gate:** <!-- privacy-gate: contact --> A message to a match reaches a living person\n   and may ask for their family details; answer the privacy gate in `SKILL.md` first.\n   Use the available newest-relative or activity information to choose a contact who is\n   likely to respond. Ask for a specific connection or a specific ancestry question.\n   Record the request date and the permission still needed. [S1]","sources":["S6","S1","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6f4aa5da51b0","kind":"unclassified","anchor":"Make this a repeatable connection queue: inspect recently added matches, request the explicit\nconnection needed for the planned comparison, then use the Connections filter when available\nto find accepted partners. For a genealogy question, ask for the relevant grandparents'\nnames, dates and places, their tree link, and whether they tested elsewhere. An active\nperson in the target's cluster can be a useful starting contact. [S1, S8]","sources":["S1","S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-520b05995b28","kind":"unclassified","anchor":"Keep a searchable notes index outside the account. A 2023 practitioner account reports that\nnotes accompanied the relatives export. Inspect an existing CSV for that field; search it\nlocally by surname, place, branch or haplogroup. Where the field or export is absent, put\nthese clues directly in the worksheet, keyed to the match ID. A compact note such as\n`branch=unknown; place=Tulchin; tree=URL; question=grandparents; evidence=reported` makes\nlater filtering practical without upgrading a reported clue into an identified ancestor.\nThe note format is synthesis; the historical export is not a current availability promise. [S7]","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-4f3658bcd1af","kind":"unclassified","anchor":"When one target does not respond, try an identified or active member of the same cluster.\nTheir cooperation can provide another route into the family. Their segment data establish\ntheir own comparison; they do not supply the unavailable target's coordinates. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-86080cf7c74a","kind":"unclassified","anchor":"Compare percentage ordering with strength-of-relationship ordering when they disagree.\nThe latter follows the provider's relationship prediction, which can incorporate segment\nstructure. These are different orderings, not interchangeable measurements. The dated 2022 practitioner example highlights\nthis particularly for endogamous match lists. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b4e29f7fbca8","kind":"unclassified","anchor":"Do not infer that strength-of-relationship sorting excludes X; neither the practitioner\naccount nor the checked official sorting help establishes that. Avoid transferring a historical universal percentage-to-cM cutoff into a current\nanalysis. Use the provider's labeled amounts and a calculator suited to the quantity you\nactually have. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-66f73a290577","kind":"unclassified","anchor":"For close sibling comparisons, also retain the browser's half/full IBD distinction. Before\nusing a percentage or total in another calculator, check how both tools count fully identical\nregions. The 2022 sibling article describes a historical 23andMe counting difference; do not\napply its conversion automatically to a current output. Preserve the original amount and\ntracks instead of silently treating unlike totals as equivalent. [S9, O2]","sources":["S9","O2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-2b26719b82e4","kind":"unclassified","anchor":"The practical question is why this match changed rank, and whether its available evidence\nhelps the named branch. A provider prediction remains a prediction even when its ordering\nis convenient. The current help defines the available sorts; check that definition rather\nthan reverse-engineering a biological relationship from the order. [O4]","sources":["O4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-44aa00bc32e7","kind":"unclassified","anchor":"Where clustering is available, begin with a known anchor or a target's Relatives in Common.\nRecord the selected target and all thresholds before generating the chart. [S1, S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3604933aceb6","kind":"unclassified","anchor":"1. Hover useful intersections to inspect the between-match amounts.\n2. Download the cluster CSV and retain the original. Its cells describe pairwise sharing;\n   they are not chromosome start/end coordinates.\n3. Open the file in a spreadsheet. Check the row and column identities and a few displayed\n   pair values against the account before using it to infer close relationships.\n4. Only after the privacy gate above: the February 2026 DNA Painter account describes pasting this\n   CSV into a matrix through its **Load** menu. Verify that route in the current tool, then check imported labels and\n   pair values. [S2]\n5. Treat the controls separately: minimum/maximum sharing with you, minimum sharing between\n   matches, and connection strength. Current official help gives an exploratory Leeds-style\n   example of 50–70 cM minimum and 300–500 cM maximum with you. It describes connection strength\n   1 as favoring mutually interconnected groups and 0 as maximally merging groups. Save the\n   actual settings; these examples are not relationship or segment-validity thresholds. [O3]\n6. If endogamy merges the chart into one broad group, raise the between-match minimum and\n   keep your own match minimum at least as high. Official examples start at 30–50 cM and\n   can exceed 100 cM in strongly endogamous cases. Compare changed membership against known\n   anchors, including useful matches the filter removed; do not call the stricter chart\n   the true family structure. [O3]\n7. Save a second run with one deliberate setting change. Keep blanks, zeroes and omitted\n   people as exported; do not relabel them as measured biological non-matches. A matrix\ngenerated under different filters needs its own date and settings.","sources":["S2","O3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e2f793fab9d3","kind":"unclassified","anchor":"Use two runs for two different questions. A chart centered on you surveys the available\ngroups; a chart focused on one relative explores that target's shared-match cohort. Keep\nthe target selection with each matrix. If useful known cousins are absent, check the selected\ncohort before assuming the branch disappeared. A February 2026 demonstration also varies\nthe number of included matches. Where that control is offered, vary it separately from DNA\nthresholds and compare identities, not just colors. [S1, S2, S14]","sources":["S1","S2","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d6990dda4113","kind":"unclassified","anchor":"A Relatives in Common row records the shared-match connection. The separate **Yes** indicator\nreports three-way overlapping DNA under the provider's definition. **No** does not rule out\na shared genealogical ancestor. A permission-limited result remains unavailable. The indicator\nsupports a segment hypothesis without identifying the ancestor; inspect the permitted pairwise\ncomparisons before assigning an interval. [O5]","sources":["O5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-837ab3120142","kind":"unclassified","anchor":"The 2026 practitioner workflow distinguishes mutual Open Sharing from an explicit\nconnection. Open Sharing can expose a match's comparison with yourself. To make another\nperson the primary profile for a comparison with a third person, that primary profile must\nbe selectable as a managed or connected profile. Open Sharing to yourself alone does not\ngrant this selection. Check the primary-profile selector and record the missing permission\nbefore requesting a connection. [S1, O2]","sources":["S1","O2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7bfe4e08215b","kind":"unclassified","anchor":"Where allowed, use the overlap's comparison link or **Compare with more relatives** to reach\nAdvanced DNA Comparison. Scroll to the numerical table and copy the selected rows into a\nlocal spreadsheet. This route is described in the 2026 practitioner accounts. [S1, S3]","sources":["S1","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5f57cc542069","kind":"unclassified","anchor":"For a single match, DNA Painter's current help describes pasting the numerical comparison\ntable into **Paint a new match**. Preview it before saving: confirm the intended partner,\nchromosome, endpoints and cM, and inspect which rows the importer accepts or filters. Keep\nthe original table so a failed or partial import can be retried without another account\nvisit. This gives a selected-match painting route when a bulk export is absent. [O10]","sources":["O10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-7e46a5d842d9","kind":"unclassified","anchor":"Add these rows to a known anchor-relative worksheet, with columns for which tested family\nmembers share each match. Kitty Cooper describes this as a practical way to place new\nmatches against an existing family segment map. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d6ebbe3bbb58","kind":"unclassified","anchor":"Classic DNA Relatives maternal/paternal filters depend on a tested, connected parent. Check\nwhich parent is connected and what the label actually covers. A surname, ethnic similarity,\nor shared haplogroup does not create that parent connection. This requirement is documented\nfor those DNA Relatives filters, not for every feature using a parent-side label. [O4]","sources":["O4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-eb2a44bf2a78","kind":"unclassified","anchor":"For a \"which side?\" question, name the exact tool and output before interpreting its label.\nFamily Phasing / Parental Inheritance estimates ancestry-composition inheritance using\ndatabase relatives and can operate without a tested, connected parent. That is a different\noutput from the classic DNA Relatives Mom/Dad filters. Record whether a side assignment comes\nfrom a connected parent, an inferred group, or an ancestry-composition model. Preserve unnamed\nParent 1 / Parent 2 labels until their identities are established; an inferred side does not\nname the common ancestor. The current Premium Parental Inheritance page explicitly describes\nFamily Phasing without a connected parent; do not carry the older classic parent-based\nphasing requirement into that different product. Record the feature name and inference\nbasis with the result. [O6]","sources":["O6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fead17d28775","kind":"unclassified","anchor":"Treat an inferred side assignment as suspect where the database relatives it relies on are\nrelated through more than one path, such as in endogamous families or with double cousins and\nother double relationships. A relative known on one side may also carry DNA from the other,\nwhich can pull segments to the wrong parent. Check the affected matches against documented\npedigrees and an identified anchor before sorting matches by this label. The\n[GeneaVlogger update discussion](https://www.youtube.com/watch?v=gpq-ePNCr9E) explains this\nmechanism for automated side-assignment tools; it does not test 23andMe's feature\nspecifically and gives no error rate. [S20]","sources":["S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6106bae0dca4","kind":"unclassified","anchor":"To orient the generated Family Tree, start with an identified cousin or other documented\nrelative and check their placed branch. Do not assume that the left/right order names your\nmother's and father's sides. The 2023 unknown-grandparent workflow combines these anchors,\ntree placements and Relatives in Common. [S8]","sources":["S8"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-907f03dde12c","kind":"unclassified","anchor":"Treat a haplogroup search as a lead list, not a count. Test a DNA Relatives keyword search with\na relative whose profile visibly shows that haplogroup. If that known positive is missing,\nrecord the search as unreliable for this profile, not as zero matches. Check that a short label\ndoes not also return longer labels it prefixes. When searching dated relatives exports, use\n23andMe's own label string and record each file's tester, download date and approximate match\ncount. 23andMe's haplogroup tree can skip levels another vendor names, so also count broader upstream labels; a\nmatch may carry only a less specific call. A hit is a contact lead, not a measured Y-DNA match\nor proof of your direct line; check its side against a parent's list. No hit covers only the\nfiles searched. The [keyword-search discussion](https://genarchivist.net/showthread.php?tid=1392)\nand [a saved-download search thread](https://genarchivist.net/showthread.php?tid=275) report\nthese failures without establishing their cause. [S24]","sources":["S24"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1d68f39f2dba","kind":"unclassified","anchor":"To estimate a target ancestor's haplogroup, search DNA Relatives for that family's rare\nsurnames and places. For each hit, document the match's direct female line (for mtDNA) or\nmale line (for Y) back to the ancestor. Use profile fields such as grandparents' birthplaces\nand surnames as leads; confirm each generation in records. An autosomal match through the\nancestor does not by itself carry the ancestor's haplogroup. Accept a partial haplogroup only\nwhen at least two documented lines through different children of the ancestor show compatible\ncalls, and record it at the shared upstream level. One line, or two lines through the same\nchild, remains a hypothesis. A match's haplogroups show only where that person has chosen to\nshow ancestry results. 23andMe assigns a paternal haplogroup only to males; one shown for a\nwoman comes from a linked male relative's result, such as her father's or brother's, so record\nit as his call. 23andMe offers no Y or mtDNA matching: DNA Relatives compares shared chromosome\nsegments, so this is not a measured haplogroup match. For a deeper call or the next test, use\n[ydna-mtdna-interpretation](ydna-mtdna-interpretation.md). [S30, O1, O21, O22]","sources":["S30","O1","O21","O22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0cd87f0cd8d8","kind":"unclassified","anchor":"A raw genotype download does not preserve your match identities or private conversations.\nA matrix CSV does not preserve matching-segment coordinates. Ancestry Composition coordinates\ndescribe ancestry assignments; they do not establish a match's shared segment. [S1, S3, S5]","sources":["S1","S3","S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d701ebe1a14b","kind":"platform-ui","anchor":"Request raw data early if preservation matters. 23andMe's raw-data help asks for the profile's\ndate of birth before the request and again before the download. It says a notification email\nfollows when the file is ready, usually after about one week but sometimes up to thirty days\n[O8 @2026-11-12]. Confirm the email address and retain the request confirmation as\npreservation checks. Read the current delivery instructions before promising a download time.\nThis is a separate genotype request, not a backup of DNA Relatives.","sources":["O8"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-e2a2f3716bc6","kind":"unclassified","anchor":"Preserve profile clues, external tree links, useful communications, and the match worksheet\nalongside exported files. Start with the closest identified matches and the branch relevant\nto the research question. [S5]","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bc8eb2f135c6","kind":"unclassified","anchor":"Keep pre-breach relatives exports and older cluster outputs as dated originals. Add a new\nsnapshot instead of overwriting them. A missing person in today's displayed list may reflect\nparticipation, access, or list limits; inspect those conditions before using the absence in\nan analysis. The 2024 preservation article describes an outage-era workflow and historical\nexports, not the current feature set. [S5, S6]","sources":["S5","S6"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3a0aac6db1c4","kind":"unclassified","anchor":"Keep the untouched 23andMe genotype file before any transfer or format conversion, and\npreserve transformed copies separately. Check the destination's current acceptance page\nfor the original chip/file version and live upload availability. A destination's usable\nmarker set and downloadable output need not reproduce the source file. Transfer advice in\nan old tutorial is a lead to verify, not a standing list of working destinations.\nFor example, MyHeritage's current official help says it no longer accepts DNA uploads;\nan older instruction to upload 23andMe there is obsolete. [O13]","sources":["O13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-56d9ac84f1a5","kind":"unclassified","anchor":"If the user requests a privacy or account change, clarify the requested object before\nacting: destruction of a stored physical sample, deletion of stored digital genetic/account\ndata, or withdrawal of research consent. A March 2025 article treats these as separate\nactions. Keep one entry for each requested object, with the request date, available provider\nresponse and unresolved questions; do not infer one action from confirmation of another.\nMake the user's preservation choices before any separately authorized irreversible action.\nA confirmation records what the provider reported; it is not independent verification of\ndestruction, deletion or an effect on completed research. Where the current request route\nor effect is unavailable, leave it unresolved. [S27]","sources":["S27"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d94b6835adea","kind":"custody","anchor":"23andMe's owner changed in 2025. On 30 June 2025 23andMe announced that the U.S.\nBankruptcy Court for the Eastern District of Missouri had approved the sale to TTAM Research\nInstitute, a nonprofit. TTAM completed the acquisition of the Personal Genome Service and\nResearch Services business lines on 14 July 2025. [O24 @2026-11-12], [O25 @2026-11-12] TTAM\ncommitted to honour 23andMe's existing policies that let individuals delete their account and\ngenetic data and opt out of research. [O23 @2026-11-12] Before the sale, the attorneys general\nof New York and 27 other jurisdictions, including the District of Columbia, sued 23andMe. They\nargued that it could not sell customers' genetic data without their consent. [O26 @2026-11-12]\nThe service now runs as 23andMe Research Institute. Its privacy statement, read on 12 November\n2026 (last updated 17 October 2025), says an account can be deleted in Account Settings at any\ntime, that deletion opts the account out of research and discards the sample, that deletion\ncannot be reversed and that it is subject to retention requirements. It also says that 23andMe\nand/or its contracted genotyping laboratory will retain genetic information, date of birth and\nsex as legal obligations such as the federal CLIA laboratory rules require, even after the\naccount is deleted. [O27 @2026-11-12] Before advising whether to delete, preserve or transfer\nthe data, read the current privacy statement and terms; do not rely on guidance written before\nthe sale.","sources":["O24","O25","O23","O26","O27"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a45ee8dbc8b2","kind":"unclassified","anchor":"1. Record the selected confidence threshold and save the ancestry-coordinate export.\n   Current official help specifies NCBI Build 37 for this CSV; keep that build with these\n   rows without assuming it establishes the build of a different export. [O7]\n2. Compare a second supported confidence setting and retain both outputs. Record which\n   assignments persist, broaden or disappear; a changing assignment does not document a\n   particular ancestor.\n3. Keep these rows labeled as population assignments when painting or importing them.\n   They are not pairwise IBD coordinates and cannot substitute for a missing match table.\n4. If two matching intervals show different ancestry labels, do not reject the DNA match\n   from the colors alone. Official help explains that Ancestry Composition and DNA Relatives\n   use different phasing treatments. Check the actual matching evidence separately. [O7]","sources":["O7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c9141b5c24ab","kind":"unclassified","anchor":"Inspect population categories before summarizing imported rows. One 2022 DNA Painter example\nfound both a broad population and its narrower child population in the same 23andMe export.\nKeep the original rows and choose a consistent category level for a summary; do not add\nnested labels as if they were independent tracts. Record that filtering choice. [S11]","sources":["S11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-21d7228eb93f","kind":"unclassified","anchor":"Where a parent has a 23andMe ancestry result, compare the population painted at the same\nchromosome interval in both kits. Treat different labels on an interval believed inherited from\nthat parent as a discrepancy to investigate, not as proof that either label is wrong. The\nparent's painted label may be on the copy that was not passed on. Unless phasing or matching\nestablishes which parent passed on the child's segment, it may come from the other parent. A\n[version-update discussion comparing parent and child paintings](https://genarchivist.net/showthread.php?tid=1972)\nmotivates this check without validating any category. [S26]","sources":["S26"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-10216b197fbd","kind":"unclassified","anchor":"Before relying on a small or trace assignment, open 23andMe's Ancestry Composition white\npaper, matching the result's version where identifiable (our precaution; the video does not\naddress versions). Record that population's published precision and recall. These figures\nvary by population, so judge each trace against its own population's figures; do not treat\nevery trace as noise or every trace as real. They are aggregate performance figures; they do\nnot prove that this tester's trace is correct. The\n[GeneaVlogger white-paper walkthrough](https://www.youtube.com/watch?v=19axV2xDZSU)\nmotivates this check without establishing current values. [S21]","sources":["S21"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-724c7e896b34","kind":"unclassified","anchor":"The 2022 population-painting tutorial uses the chromosome map's settings menu and\n**Import 23andme ancestry composition** to paste its CSV. Use the dedicated population\nimporter in a separate map and check the imported rows. The same tutorial warns\nthat Copy 1 / Copy 2 can change parental meaning across chromosomes without identified-parent\nphasing. Save those labels verbatim and check the present export's phasing basis; do not\nrename Copy 1 globally as Mom from one chromosome. This is a dated export lesson, not a\nrequirement that every current phasing feature have a tested parent. [S13]","sources":["S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-be46c9fd4bd5","kind":"unclassified","anchor":"Do not read a population painted on both copies as ancestry from both parents unless both\ncopies carry it over the same interval. Without identified-parent phasing, one painted copy can\ncombine maternal and paternal DNA along a single chromosome. A population on Copy 1 of some\nchromosomes and Copy 2 of others, or on both copies at different places on one chromosome, may\nstill come from one parent. Keep its side unknown until a tested parent or other phasing\nevidence settles it. Large overlapping regions painted with that population on both copies of\nseveral chromosomes are different: at any one position one copy comes from each parent, so they\ncan indicate that both parents carry some of that ancestry. [S28]","sources":["S28"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-622504764e9f","kind":"unclassified","anchor":"For a changed ancestry result, open the available **Version History**, compare the new and\nprevious outputs, and read its **Change Log**. Record both version labels and confidence\nsettings. The September 2025 version-7 announcement limits that release to V5 customers\nwith ancestry-service access and gives Premium members a broader previous-version/confidence\nhistory. Compare what this account offers; an algorithm update changes the estimate rather\nthan documenting a newly inherited ancestor. [S18, O18]","sources":["S18","O18"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-3d4723c590d5","kind":"unclassified","anchor":"Where the profile-data settings offer a Computed Data download, request it as a further dated\nartifact and inspect whether it holds earlier Ancestry Composition versions. A\n[computed-data discussion](https://genarchivist.net/showthread.php?tid=730) reports past-version\ncoordinates in this file, including for recent-chip testers. Keep each row's version or revision\nlabel and confidence level, and compare versions at the same confidence level. Retain the\noriginal before importing it into a third-party painter, whose colors need not match 23andMe's.\nThe thread does not establish which version is more accurate, nor that the file or menu path is\nstill offered. [S25]","sources":["S25"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a07bdc0d930a","kind":"unclassified","anchor":"Where an Ancestry Timeline is offered, record each population's displayed birth range. The cited\npresenter interprets it as an estimate of when the most recent ancestor fully of that population\nwas likely born, assuming the whole share came from one ancestor; keep that reading unresolved\nuntil current help for the feature and the result version establish its definition, and verify it\nthere before using the range to select generations. It does not mean the population appears in\nevery generation since that date, and several ancestors may have contributed. Use the range only\nto choose which generation of the documented tree to search first, not to identify a particular\nancestor. The [presenter's explanation](https://www.youtube.com/watch?v=bGT_9CcA674)\nmotivates this reading without vendor documentation. [S22]","sources":["S22"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-6fdbfbc27333","kind":"unclassified","anchor":"For a recent geographic lead, open the Country Match or Genetic Group and save its displayed\nconfidence label. Inspect a Country Match's available shaded subregions: darker shading\nreflects more DNA-sharing participants reporting ancestors there, not a percentage of your\nancestry. Genetic Groups have no subregions; their outlines summarize reference individuals'\nrecent-ancestor birth locations and can cross national borders. Use the named places to\nchoose records and compare documented family locations, without assigning a particular\nancestor or parental side from this display alone. Current help gives inconsistent numeric\nconfidence bands, so retain the actual qualitative label. [S19, O19, O20]","sources":["S19","O19","O20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1581d207fc05","kind":"unclassified","anchor":"Where a ranked list of match-reported locations is shown for a population (the 2021 videos\nshow one; check whether the current Country Match display offers it), read it as places that\nmatches report in their own family information. The presenter says most of those places usually\ncome from the matches' lines unrelated to their connection with you; treat that as his\nobservation, not a provider fact, and keep each place's relevance unresolved.\nLarge metropolitan areas rank high because many people in that population report them. An\nunexpectedly small locality is the more useful lead. Hold it as a hypothesis to test against\ndocumented lines, not as an origin. The\n[presenter's ranked-list example](https://www.youtube.com/watch?v=bv9KiUV4Os8) and\n[a second review](https://www.youtube.com/watch?v=dCLTYFFRPVk) motivate this from his own\nunderstanding, without vendor documentation. [S23]","sources":["S23"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-951b745a6b11","kind":"unclassified","anchor":"An older all-match segment export can still support a new branch-focused worklist. DNA\nPainter's Bucketing tool filters the main segment file by identifiers found in other files;\nit does not require a tested parent. [S10]","sources":["S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-bede1fe37ac0","kind":"unclassified","anchor":"1. Select your original segment CSV as the main file. Use the correct tester's file; a raw\n   genotype download or clustering matrix is a different input.\n2. Add an authorized match or segment file from an identified relative on the branch of\n   interest. Use the same testing platform so identifiers correspond. Inspect a few known\n   matches before filtering. Keep the source tester and file date with each input. [O9]\n   If a full companion export is unavailable but the relative's matching IDs are available,\n   the tool also accepts a minimal CSV whose first column is headed `BucketMatchID`. Use\n   exact IDs from the same platform, not names or IDs copied from another vendor. [O9]\n3. Choose inclusion or exclusion deliberately and record all size filters. Inclusion makes\n   a branch candidate list. If using a parent's list for exclusion, label the remainder\n   **not found in this parent's supplied list**; gaps in that list can remain.\n4. Download the filtered CSV, retaining the originals. Inspect it in a spreadsheet or import\n   it into a separate DNA Painter map/group for follow-up. [S10, O9]","sources":["O9","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-76487af74b25","kind":"unclassified","anchor":"Where the feature is available, use it to explore an ancestor's partial ancestry profile.\nIt depends on DNA relatives placed in the Family Tree. The October 2025 tutorial demonstrated\nan early beta; the March 2026 official launch describes parents and grandparents. Check\ncurrent eligibility rather than copying the tutorial's beta-enrollment requirement. [S12, O11]","sources":["S12","O11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f5d3fcf1822e","kind":"unclassified","anchor":"1. Save the ancestor label, displayed reconstructed amount/completeness, available ancestry\n   view and listed contributing relatives before changing the tree.\n2. **Privacy gate:** <!-- privacy-gate: link --> Placing a DNA Relative attaches a living\n   person's tested profile to the Family Tree; check who can see the Family Tree and its\n   placements under the current settings and answer the privacy gate in `SKILL.md` before\n   placing the relative.\n   Verify the identity and descent of a useful DNA Relative. Check their current placement\n   and relevant alternate paths before adding or correcting their position.\n   Attach the actual DNA Relative to the right tree person; merely typing an ancestor's name supplies\n   no additional tested DNA. [S12]\n3. Revisit the profile after the tool updates. Save the date, placed relative and changed\n   output. The vendor says additional placed relatives can make a profile more complete;\n   a change is not guaranteed for every added person. [O11]\n4. Inspect contributing relatives where that view is offered. Resolve misplaced donors\n   before using the ancestor's population breakdown in further research. [S12]","sources":["S12","O11"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-97977065fda0","kind":"unclassified","anchor":"Tree placement is an input. Do not move an uncertain relative between candidate brothers\nand treat a fuller reconstruction as proof of which brother was the ancestor. Endogamy and\nmultiple paths can also impair attribution. Preserve the result as a partial model, separate\nfrom your documentary tree and independently tested relationship hypothesis. [S12, O12]","sources":["S12","O12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-db2fe1f955d9","kind":"unclassified","anchor":"The April 2026 visual-tagging article points to Genealogy Assistant for 23andMe shared-match\ngroups. Its developer separately documents match-list and shared-match CSV downloads.\nThese are extension operations, distinct from a native 23andMe export. Check the extension's\ncurrent installation, license and feature settings before relying on them. No extension was\ninstalled or used on a private account for this recipe. [S15, O14, O15]","sources":["S15","O14","O15"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-0802a025e303","kind":"platform-ui","anchor":"1. Enable **23andMe Download Matches Pages as CSV File** in the extension panel and open\n   DNA Relatives. Type a page count, or click **select all** for every page from the one you\n   are on; the download follows the list's on-screen filters and sort order. Download the CSV\n   and retain tester, retrieval date, filters and chosen scope. Developer-documented\n   columns include shared amounts, segment count, predicted relationship, star status,\n   Groups, Match GUID and Match URL. Check several IDs and amounts against visible rows.\n   [O14 @2026-11-12]\n2. For a particular anchor, enable **23andMe Download Shared Matches as CSV File** and open\n   that match's Relatives in Common. Choose the page scope and download. The documented CSV\n   separates your shared amounts from **Shared cM with Match** and **Shared Percentage with\n   Match**, retaining URLs and GUIDs. Use those labeled quantities to populate the anchor\n   worksheet rather than transcribing each between-match value. Record the focal tester\n   and anchor with the file. [O15 @2026-11-12]\n3. To label that cohort, enable **23andMe Add Groups to Shared Matches**, open **Add/Manage\n   Groups**, and create the intended group. Select individual matches or use **Select all**\n   for every page from the one you are on, then assign the selection to that group. The\n   developer says groups belong to the DNA test being viewed and are kept in the browser.\n   Save the cohort scope and export its Groups field for your local index. [O16 @2026-11-12]\n4. Use a consistent color/name scheme across platforms, as the practitioner article proposes.\n   Keep a candidate-branch label distinct from a documented relationship. A structured name\n   such as `branch=Tulchin | status=candidate` is our synthesis. Join 23andMe snapshots using\n   sample-checked 23andMe IDs; use an explicit verified mapping for another provider's IDs.\n   A group label alone does not assign every member to an ancestor. [S15 @2026-11-12]","sources":["O14","O15","O16","S15"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b3b41543a275","kind":"platform-ui","anchor":"For quick relationship-range exploration, the extension also offers a **DNA Painter Shared\ncM Tool** button on a match profile. Its developer explicitly says it converts the displayed\npercentage to cM before opening the calculator. Keep that conversion separate from directly\nreported amounts. The CSV help pages say their cM fields are likewise worked out from\n23andMe's shared percentage: preserve the percentages and label the cM fields as\nextension-produced rather than assuming measured autosomal-only totals. Use recipe 2 when\nselecting calculator inputs. [O14 @2026-11-12], [O15 @2026-11-12], [O17 @2026-11-12]","sources":["O14","O15","O17"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9a26dac9e21b","kind":"unclassified","anchor":"When native Clustering is unavailable but Relatives in Common is accessible, organize the\nvisible matches in a manual color chart. The March 2022 tutorial demonstrates spreadsheet\nseed iteration; its former bulk-download route and fixed percentage conversions are dated\nexamples. Start with the quantities and access checks in recipes 1–2. [S16]","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-b8d3a31ec522","kind":"unclassified","anchor":"1. Make one row per selected match with its stable ID/link, displayed amount/unit, predicted\n   and identified relationships, and retrieval date. Choose the cohort for your branch\n   question. Known second cousins can help seed a grandparent-line exploration; keep\n   descendants and closer family as separate anchors because they can span several lines.\n2. Give the first eligible uncolored seed a column/color and record which person started it.\n   Open that seed's Relatives in Common. Color people present in both that list and your\n   selected cohort. Keep the source list or retrieval date with the run.\n3. Repeat with the next eligible uncolored person until the cohort has been examined. If a\n   person appears in several seed lists, preserve every membership. Mark a withheld or\n   unexamined list as unavailable rather than recording an empty group.\n4. Research the groups using documentary anchors. If a seed joins a broad set, save a\n   separate run from a documented alternative seed and compare the additional people. The\n   tutorial suggests trying a known second cousin and then a stronger match in that group. Preserve\n   both seed identities and runs. [S16]","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-dcdf9c439d5b","kind":"unclassified","anchor":"An external research tree can hold an identified match's family while their relationship to\nthe tester remains unresolved. A 2021 Family Locket tutorial demonstrates private Ancestry\ntrees, floating branches, custom tags and person notes. Use a tree tool that supports\nunconnected people and check its present controls. [S17]","sources":["S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d039a77432ac","kind":"unclassified","anchor":"1. Create a research tree and choose its privacy/searchability settings. The tutorial's\n   unknown-parentage project uses a private, unsearchable tree. Record the focal tester and\n   research purpose.\n2. Add a useful 23andMe match as an unconnected person or floating branch. Use the tool's\n   supported creation route and verify that no unsupported parent/child connection remains.\n   The dated demonstration adds a new person from a record or temporarily connects a person\n   and then removes only that connecting relationship.\n3. Tag the person with provider and focal tester. Retain their match ID/link, amount/unit,\n   predicted relationship, available X status and haplogroups, reported surnames/places,\n   and useful Relatives in Common in dated notes beside the source observations. [S17]\n4. Research their parents and grandparents from records and tree leads. Add other useful\n   matches as separate branches and compare documented ancestors. Join a branch when the\n   identity and relationship have support; keep competing placements separate.","sources":["S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-df9a54f352f1","kind":"platform-ui","anchor":"Read DNA Relatives as a capped list of the closest matches, not a roster of everyone who tested.\n23andMe's Premium Ancestry page advertises up to 5,000 DNA Relatives for members\n[O28 @2026-11-12]; practitioners reported a 1,500-match list without a membership from 2021 to\n2023 [S31 @2026-11-12], [S32 @2026-11-12], [S7 @2026-11-12]. Record the membership state and the\nlist size with each worksheet. Estes reports that matches the user has communicated with, or tried\nto, are kept after they would otherwise roll off the list [S7 @2026-11-12], [S31 @2026-11-12]. A\ndistant cousin missing from a full list may sit below the cap: record `not in the capped list`,\nnot `not tested` or `not related`. One endogamous side can fill the list with distant matches.\nPerl had only 88 maternal matches among 1,500 although both parents had tested\n[S32 @2026-11-12]. Few matches on one side do not show that few relatives on that side tested.","sources":["O28","S31","S32","S7"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a7e7707e487a","kind":"method","anchor":"Expect some bucketed matches that do not fit the branch. Perl found 17 matches in common between\nthe lists of two testers who are not related to each other, each list holding more than 10,000\nmatches [S10]. Before assigning an unexpected bucketed match to the branch, review its shared\nmatches in detail on the testing site [S10].","sources":["S10"],"checked":"2026-11-12","stated_as":"fact","review":"reviewed"}
