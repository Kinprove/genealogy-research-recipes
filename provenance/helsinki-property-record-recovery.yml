claims:
  - {"id":"C-11","kind":"method","anchor":"Identify the parcel by period district, block and lot before linking records by street number. In a notice with both *tontille n:o* and *osoite n:o*, keep the lot and street address in separate fields. The 21 June 1899 US notice for Rikardinkatu gives plot 2 and street address 1. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"portal-availability","anchor":"Use Helsinki City Archives’ inner-city *Kiinteistökortisto* in Sinetti with a period map. For annexed districts, check the separate card series and its coverage. Read both faces for city sales and other transfers, transaction and title dates, parties, price, area, building details and any later title reference. [S1 @2026-11-22] [S11 @2026-11-22] [S22 @2026-11-22]","sources":["S1","S11","S22"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"method","anchor":"If a number repeats, compare the older local series and the broader series against the dated name, location and extent. For No. 10 keep Åhmanska nybygget and the 1909 Träsk entry as candidates, and compare Träsk with No. 13. Search under variant names and verify the period of each in the records. Kyläkoski’s compilation gives Humleberg and Humalisto for No. 55, Hummelvik, Rosavilla and Miramar for No. 56, and Tykistöpiha, Nygård and Valo for No. 60. On Broholmen, the listings for Nos. 35 and 36 cover portions west of the road. Keep the suggested links from Nos. 8 and 9 to parts of Nos. 56 and 57 tentative. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-13","kind":"method","anchor":"Browse by number plus locality or land use when the name fails. In Kyläkoski’s compilation, No. 33 is by the long bridge in the 1876 address calendar, No. 46 is by the Töölö brickworks in the 1855 lease notice, and Nos. 50–53 share a meadow description in the 1846 entries. Compare period lease notices in *Finlands Allmänna Tidning* (FAT) and *Helsingfors Tidningar* (HT) with *henkikirjat* and address calendars. Retain an unnumbered Töölö drawing when the location and period fit. [S4] [S5]","sources":["S4","S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-14","kind":"method","anchor":"For the numbered-villa compilation, follow FAT 23 November 1846 and 15 January, 9 March and 19 June 1847, and HT 20 April 1850, 21 August and 6 November 1852, and 8 July 1854. Compare the 1857, 1868 and 1875 *henkikirjat*, the 1885 *Adresskalender för Helsingfors stad*, the 1909 *Adress- och yrkeskalender för Helsingfors jämte förorter*, and the archival catalogue. [S4]","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"Compare the owners of each candidate lot at the date sought. Use the card dates to choose whose probate inventory to read, then check the building’s position relative to boundaries or gates. In Kyläkoski’s Palmén example, Mikonkatu 17 and 19 are lots 4 and 5 in block 28. The narrow stone house would stand by the gate on the northern boundary. Keep both lots open when one inventory omits building details and the relevant owner of the other lot died after selling. [S2] [S1]","sources":["S2","S1"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"example","anchor":"If the clue is a lottery, use the Museovirasto ticket in Finna and read both faces for block and lot. Check the lottery outcome, then follow the property card for the parties and date of an actual sale. In Kyläkoski’s account, the 1847 ticket identifies Elefantti plot 3 while Palmén gives the Sederholm House address, Aleksanterinkatu 18. The lottery remained unfinished and the card records the sale from Tigerstedt to Louis Kleineh in spring 1850. [S6] [S1]","sources":["S6","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-15","kind":"method","anchor":"Carry the literal name and tract number as separate locators. Align successive cultivation lists by number and compare holders, land use and neighboring tracts before assigning a name from a will or identifying a tract in probate. Check the tenant named in the dated lease when a tract still bears a predecessor’s name. [S19] [S21]","sources":["S19","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-16","kind":"example","anchor":"For Kamppi tracts 92–94, compare the 1776 and 1784 lists with the will of 24 May 1791 (magistrate minutes, 15 March 1797 §2). Kyläkoski links the name Pipping’s plantation to an earlier holder. Keep the October 1797 inventory’s leased plantation and city-owned field as tentative parcel matches. In the 1819 inventory (HKA 281), test whether the plantation entry covers the Pipping tract alone or includes the adjoining Sederholm meadows. Use the subsequent auction descriptions to test both readings. [S21]","sources":["S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-01","kind":"custody","anchor":"Follow the card’s title reference to the exact court series. Use the City Archives guide’s 1880 boundary to choose between earlier Helsinki city-court title records in the City Archives and later records in the National Archives. In Sinetti, distinguish a catalogue description or a digitized related case series from an image of the actual registration. [S1 @2026-11-22] [S11 @2026-11-22] [S23 @2026-11-22]","sources":["S1","S11","S23"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-17","kind":"method","anchor":"When the magistrate index gives few results for a reported expansion, build a parallel chronology from the property cards. Extract earlier and later lot numbers, named buildings and uses from probate, and match them against a dated map. Trace each successor lot by its own identifiers and carry waterfront warehouse lots separately. To follow the former Holmberg field into city sales, Kyläkoski uses present-day block 86 as an approximate locator and follows Bulevardi 18 to its 1825 purchase. [S1] [S19] [S22] [S26]","sources":["S1","S19","S22","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-18","kind":"example","anchor":"For the Hietalahti brewery, start with the May 1848 inventory (HKA 2474), which Kyläkoski reports gives Hanhi block 83 lots 1–3 as earlier numbers for 26–28. Leave the block assignment of the garden on lot 28 uncertain. Keep the waterfront warehouse parcel 1a distinct from the other warehouse lots. [S26]","sources":["S26"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-19","kind":"method","anchor":"Record payment, city sale, first registration for a buyer and title deed as separate events. In Kyläkoski’s Hietalahti comparison, the 1845 first registrations for Hanhi lots 26–28 make the effect of the reported 1819 redemption payment a question to resolve from the instruments. For Strutsi block 84 lots 23 and 25, the 1840 first registrations for the brewery owner follow reported city sales to other buyers in 1829. Keep the intervening loss of ownership open. [S1] [S26]","sources":["S1","S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-20","kind":"portal-availability","anchor":"Use Helsinki City Archives’ digitized-materials list to find the magistrate minutes (*maistraatin pöytäkirjat*, Mpk) in Sinetti. For 1809–1874, use the person, place and subject indexes when the notice supplies no usable date. Use the separate Helsinki Auction Chamber minutes series when a sale notice names that creator. [S11 @2026-11-22]","sources":["S11"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-21","kind":"method","anchor":"Search petitions under the tract name as well as the people’s names. Follow each reference from index to meeting date, section and attachments. For Sandvikskärret, Kyläkoski follows the petition of 1 May 1811 §5 to the auction outcome on 12 October 1811. Record the petitioner and the winning bidder separately. [S9] [S19]","sources":["S9","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"method","anchor":"Pair the newspaper offer with the minutes for the scheduled sitting. Record whether bidding took place, then log the high bid, parcel name and previous cultivator for each tract, even at a joint auction. Check the award or agreement for the successful lessee and any representative, the operative term and rent, the guarantees and promised improvements, and the disposition of a bid pending acceptance. If an auction fell through or passed over a tract, look for the next notice and decision. When the incumbent loses the lease, leave participation open unless the minutes settle it. For the ten-year lease of two Hietalahti plots previously run by a gardener’s widow, Kyläkoski gives Mpk 13 December 1824 §3. [S7] [S8] [S19] [S21] [S25]","sources":["S7","S8","S19","S21","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-22","kind":"example","anchor":"Keep simultaneous rounds distinct. Kyläkoski’s garden example pairs FAT 13 January 1827 with Mpk 15 January, where the auction failed to take place, and FAT 21 April with Mpk 25 April §§5 and 8 for the later round. The same 25 April minutes at §9 are the locator for the Sederholm tract in Kamppi after a breach ended the earlier lease. For the 1836 round, pair FAT 20 April with Mpk 4 May §14. For a joint Kamppi auction, compare HKA 287 and Mpk 6 September 1819 §2 with the later decisions and read each tract’s bids separately. [S21] [S25]","sources":["S21","S25"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-23","kind":"method","anchor":"On first letting, extract named components, measured area, terrain and prior tenancy. In Kyläkoski’s account of villa lots 75 Lönnberg and 76 Jägersdorff, the 3 February 1849 minute §4 distinguishes an earlier field, parts of the Guard’s garden and ground previously unleased. Follow FAT 12 March and Mpk 17 March §2 for the reported 30-year award covering both lots. [S9]","sources":["S9"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-24","kind":"method","anchor":"At each re-auction, compare the term, measured extent and street or landmark references. Test the reported boundary against a period map. Look for detached lots and roads in the street-planning decision and in any rent-reduction petition. Record the condition in the offer and the cause in the later decision. In the Bulevardi example, Kyläkoski pairs HT 26 November 1834 and Mpk 1 December §8 for the offer and award, Mpk 17 August 1825 §13 for planning, and Mpk 29 April 1840 §1 for the reduction due to a neighboring boundary drawn in 1835. [S8] [S19] [S21]","sources":["S8","S19","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-25","kind":"method","anchor":"For missing Hietalahti measurements, compare FAT 15 November 1837 and Mpk 11 January 1840 §10. The later minute gives a Bulevardi location and reports the area in a different unit. Record each stated measurement and unit with its date. [S19]","sources":["S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-26","kind":"example","anchor":"In the Kamppi example, locate the former Pipping tract by the road toward the Kamppi well and the former Sederholm tract by its position opposite the Kamppi barracks, later called the Turku barracks. Compare the diminished Sederholm tract in FAT 8 March 1841 and Mpk 31 March §6 with earlier extent. Kyläkoski identifies the former Pipping tract’s rent-reduction entry, Mpk 25 April 1846 §1, as a locator for itemized detached lots, access roads and grant timing. [S21]","sources":["S21"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-27","kind":"method","anchor":"Carry a documented term across gaps as a possible limit for the lease and check later minutes for extension, separate building permission, dispute, breach, bankruptcy, early re-auction or release. Look for damage complaints as dated evidence of a tract’s existence. In Hietalahti, Mpk 6 July 1812 §10 is the locator for the complaint about sand extraction damaging a field fence. For Byströmska åkern or Byströmska uppodlingskärret, follow the award of 11 January 1840 §11 to the widow’s release on 23 January 1841 §6. [S8] [S19] [S21] [S25]","sources":["S8","S19","S21","S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-28","kind":"method","anchor":"When a bankruptcy or estate notice offers the remaining years of a lease, record the years offered and use the original lease and later award to determine the interest actually transferred. For a possible change of tenant, compare the bankruptcy date with the next advertisement and decision. Kyläkoski gives FAT 18 March 1843 for the last two years of one Hietalahti lease after bankruptcy, and HT 13 July and FAT 24 July 1839 for the Sederholm widow’s offer of two remaining years in Kamppi. [S19] [S21]","sources":["S19","S21"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-29","kind":"method","anchor":"When probate describes a rented garden with buildings, trace the lease through the magistrate minutes and the buildings through the estate division and sale. Search for agreements disputed by heirs, subsequent leaseholders and subleases. Keep the lease valuation at death dated to that inventory. For the garden later crossed by Unioninkatu, use Mpk 8 November 1773 §2 and 2 October 1786 §4 for the term, extension and greenhouse permission, Mpk 5 July 1809 §2 and 4 February 1811 §4 for later rights, and HKA 63 for the 1812 valuation reported by Kyläkoski. [S25]","sources":["S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Distinguish the landowner, building owner, lessee, representative, subtenant and cultivator. Locate a tenant’s home separately. To check promised improvements at Fjälldal, compare the 5 December 1846 lease auction, Maistraatin pöytäkirjat Ca:155 §1, with HKA 2976 for the buildings listed at death. Use Ca:156, 24 March 1847 §7, for the separately leased field on lot 27 on Aleksanterinkatu and check the reported 1850 residence at the Aleksanterinkatu and Mikonkatu corner independently. Treat the later ownership wording in HT 28 December 1859 as a lead to verify against the lease after bankruptcy. [S7] [S19]","sources":["S7","S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-30","kind":"method","anchor":"For Gröna Villan, follow the *henkikirjat* from Kluuvinlahti (Gloviken, also Glowiken in the 1845 advertisement) in 1846–1848 to Gröna Villan in 1849–1850. A household-head listing leaves the principal lease open. Check the boundaries and term again when the 1850 proposed 25-year letting gives way to one-year terms on the newly bounded Grönudd lot 40. Read FAT 17 May 1852 for the building owner’s need for the land lessee’s permission, and Mpk 22 March 1853 §4 for the winner and representative. If an auction notice is missing, use furnished-premises advertisements and accounts of summer tenants as leads for actual use, with the lease outcome still open. Kyläkoski gives HT 20 May 1854 for the furnished-premises offer. [S10]","sources":["S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"custody","anchor":"Browse the Helsinki magistrate’s approved building drawings in Sinetti by period district, block and plot. Treat its digitized pre-1933 holdings as incomplete. Inspect the full set and look for a separately filed elevation when a sheet has only a floor plan. Date every sheet from the approval stamp or drafter’s annotation. Carry the authority, date and section into the permit minutes and use the annotations to order the drawings. [S1 @2026-11-22] [S5 @2026-11-22] [S11 @2026-11-22] [S17 @2026-11-22]","sources":["S1","S5","S11","S17"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-31","kind":"method","anchor":"When a secondary source or index cites construction or a lot extension, inspect the dated and numbered minute. Cross-check its scope against the cards and drawings. In Kyläkoski’s brewery search, 11 June 1827 §9 was found and gave no extension size. The 30 May 1832 §1 reference for distillery and brewery construction on Hanhi lot 3 remained unlocated. Carry it as a lead. [S26]","sources":["S26"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-32","kind":"method","anchor":"Read floor materials individually when a description calls a building a stone house. At Pukki 7 between Liisankatu and Oikotie, Kyläkoski reports that the drawing shows a wooden upper storey despite the stone-house description associated with HKA 1536 and FAT 29 October 1836. [S25]","sources":["S25"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"Use the site plan and elevation together. Orient the street frontage using an independently identified landmark, compare footprint and window spacing, then check the design and any proposed enlargement against dated photographs. In Kyläkoski’s Töölö comparison, the Kivelä building orients the Strömsten villa 4 view from Taivallahti. For villa 3, compare the 1880 residential plan, 1895 L-shaped enlargement plan and later images. For Vega 16, compare the 1885 design with the photograph in *Suomen Kuvalehti* 2/1928 before describing its built details. Use [repository photograph search](repository-photograph-collection-search.md) to recover additional views. [S5]","sources":["S5"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-33","kind":"method","anchor":"When two buildings share a name, compare footprints, recorded uses and demolition dates before interpreting a missing building in a later view. Kyläkoski distinguishes the smaller Tunturilaakson school at Dagmarinkatu 3, reported demolished in 1930, from the larger school at the bend in Fjälldal’s northern boundary, reported demolished in 1957. For the larger building, compare the undated plan’s *asuinrakennus* label with the 1885 school drawings. The 1934 existence notation is a clue to dating the plan. [S18]","sources":["S18"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-34","kind":"example","anchor":"In Kyläkoski’s comparison, match Brander’s 1908 and Pälsi’s 1934 Dagmarinkatu views by the four unevenly spaced windows. Test the eastward orientation of Brander’s second 1908 school view against her separate photograph of the likely Tång shop landmark, with six evenly spaced windows on the school’s east side. For the smaller school missing from the 1934 views, use the earlier west-northwest view from Aurorankatu 9 and the museum’s Nervanderinkatu attribution. Keep the suspected factory near the Tunturikatu bend and the fit to the southern footprint tentative. [S18]","sources":["S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-35","kind":"example","anchor":"Test the smaller building north of the larger school by its position in the 1927 National Museum tower view and Pälsi’s 1934 views, including the ground-level close-up. Compare the visible details around vegetation against the nearly matching 1922 and spring 1930 views. Use these matches as leads from Kyläkoski’s reading. The linked drawing viewers exposed no images to the recorded check and the old photo links redirected to the museum search home. [S18]","sources":["S18"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-36","kind":"portal-availability","anchor":"Use the National Library of Finland’s *Rakennustaito* title record in Finna to reach the digitized run. Browse the area reports for proposed projects, then consult the parcel card, building drawings and dated records of standing buildings to check which were completed. Continue with the cards when a project is missing from the magazine. [S27 @2026-11-22] [S11 @2026-11-22] [S24 @2026-11-22]","sources":["S27","S11","S24"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-37","kind":"method","anchor":"Read the building details on the cards beyond the ownership entries. In the Eira comparison, Kyläkoski uses 1910 and 1920 census-derived details, checks for *yhden perheen koti* (single-family home), and compares building-wide room counts with documented tenements. Keep the type open when only building size or appearance is available. [S24]","sources":["S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-38","kind":"method","anchor":"Compare the same building across consecutive *henkikirjat*. Date each count and record both the total households as listed and the family households. Include a worker listed alone in the household tally. In Kyläkoski’s Eira example, the 1913 and 1914 counts for a building differ and the owner changed between the listings. [S23] [S24]","sources":["S23","S24"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-39","kind":"method","anchor":"Search *Hufvudstadsbladet* (Hbl), US, *Päivälehti* and HS by period street address or corner, and check reports headed by a neighboring property. Extract the site, building description, earlier uses and occupants’ roles, named owners or buyers, aliases used at purchase and the proposed replacement. Search for site-change complaints in other periodicals, such as *Tuulispää* 8/1905, and use them as leads to the relevant minutes. [S3] [S12] [S13] [S16] [S20]","sources":["S3","S12","S13","S16","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-40","kind":"example","anchor":"For Pirtti, Kyläkoski points to Hbl 30 May 1939 in coverage principally about the last wooden building on Etelä-Espa. At Merikatu 19 and 21 and Laivurinkatu 3, Hbl 1 June 1941 is a lead to Emma Mäkinen’s institution, the 1885 purchases under the name Emma Åhman and the 1921 transfer to the city. For a reported mismatch between a proposed replacement and the structure later documented, check the period house number. Kyläkoski leaves the identity of Erotori No. 2 in the 1903 proposal open against Pirtti at Erottaja 2 in 1904. [S16] [S20]","sources":["S16","S20"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"method","anchor":"Convert “yesterday” and other relative dates using the issue date. Enter each auction, conditional clearance deadline, scheduled demolition, work underway, documented completion and proposed construction in its own dated row. Assign the status and deadline to the precise building or portion when a lot contains several. Cross-check the planned replacement against later evidence and recheck the historical numbering if the accounts disagree. Where storey counts match, look for excavation, demolition to the foundations or other evidence that the later structure is a replacement. [S3] [S12] [S13] [S14] [S15] [S20]","sources":["S3","S12","S13","S14","S15","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-41","kind":"example","anchor":"Use the dated wording to bound the event. Kyläkoski’s crown granary example pairs the conditional clearance target in *Päivälehti* 15 January 1896 with work reported underway in US 8 March. The US 12 December 1899 report for plot 9 on Kirkkokatu gives a counterexample to identifying a building by its storey count. It describes demolition to the foundations and construction of another four-storey building. [S12] [S3]","sources":["S12","S3"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-42","kind":"example","anchor":"Check whether old and new structures stood together. The 22 July 1891 *Päivälehti* notice cited by Kyläkoski places the old wooden fire tower in front of the completed new tower and schedules the old tower’s razing separately. Confirm removal of yard structures or fixtures in later evidence when a notice only gives a deadline. [S15]","sources":["S15"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-43","kind":"example","anchor":"Use a dated photo to establish standing buildings or actual work, then check later reports for the fate of each portion. In Kyläkoski’s Willensauna sequence, the summer 1903 photograph supplies a standing date and HS 9 March 1907 describes work underway, followed by a July report on the removal of the guest rooms. At Korkeavuorenkatu 32, compare the 1942 Hbl proposal with Constantin Grünberg’s photograph of demolition in 1954. Brander’s 1907 view supplies a separate clue to the earlier shop from its signage. [S14] [S16]","sources":["S14","S16"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-44","kind":"method","anchor":"Read the auction wording for the exact object sold, such as land, buildings for removal, a named storey or separately priced or excluded fixtures. Check who later commissioned construction on the site. Long possession and ownership of a building can coexist with uncertain title to the land, as Kyläkoski’s Lapinlahdenkatu example shows. Keep that uncertainty and check the parcel records. Use the notice’s named roles, such as gravedigger and cemetery caretaker in that example, to connect the occupants to the institution. [S3] [S13] [S20]","sources":["S3","S13","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"method","anchor":"Track the buyer, removal obligation and destination for each structure. Keep proposed re-erection, reuse of materials, and completed work as distinct events. Verify the destination and record which materials the notice connects with an earlier structure. Keep the replacement on the original parcel’s chronology. For example, US 19 March 1896 describes demolition underway on Aleksanterinkatu plot 19 and planned re-erection at Kaavi in Töölö. The *Päivälehti* notice of 10 May 1891 describes a building at Boulevardinkatu 10 as already demolished and its reassembly near Ulfåsa in Humallahti as prospective. US 16 June 1905 offers Espoo parish and Snappertuna chapel district as destination leads for Albertinkatu 17. [S3] [S12] [S13] [S14] [S15] [S20]","sources":["S3","S12","S13","S14","S15","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-45","kind":"method","anchor":"When multiple buildings or fixtures are reported in one lot sale, keep each deadline attached to the part sold. In the Korkeavuorenkatu notice cited by Kyläkoski, the older buildings on the Third Lutheran Church lot and the wooden dwelling at No. 10 have different deadlines. The 1903 auction report for Etelä-Makasiinikatu 4 gives a lead on reused timber from the old wooden church at Senate Square. [S15] [S20]","sources":["S15","S20"],"checked":null,"stated_as":"fact","review":"reviewed"}
