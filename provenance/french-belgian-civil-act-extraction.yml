claims:
  - {"id":"C-1b9296c9cb68","kind":"unclassified","anchor":"Work from the original image. A yearly index or a ten-year table (*table décennale*, available for Belgian civil registers in the FamilySearch catalog) is only a way to find the act. Marriage acts hold leads that an index leaves out. [S1], [S2] For when French registers and tables begin and where they are kept, see [French departmental record routing, step 1](french-departmental-record-routing.md#1-route-by-département-not-by-a-national-index).","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-607bdb9186a6","kind":"unclassified","anchor":"- Search Belgian parish and civil registers in the State Archives' AGATHA (agatha.arch.be). It replaced the old SEARCH site (search.arch.be), which was shut down on 23 December 2024. Links and guides that point to search.arch.be no longer reach the registers. A SEARCH account also works on AGATHA. [S5]\n- Create an AGATHA account from its homepage before opening register images. [S5]\n- A person hit in AGATHA is a pointer. Open the register image and extract the act from it.\n- Search the locality under its French, Dutch and German forms. Belgian place names have several official forms, and an index may use only one.\n- For a large city such as Antwerp or Brussels, also check the city archives before closing a population or migration search.","sources":["S5"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-599e612515ea","kind":"unclassified","anchor":"The Archives de Paris say the Paris civil registers before 1860 were destroyed in May 1871, and only about a third of the 8 million lost acts were restored. [S6] For a Paris event before 1860, or when the original series is otherwise unavailable, [S3] identifies a\nseparate *état civil reconstitué* and its *fichiers*. Check the actual collection\ndescription and coverage, then use an applicable reconstruction-file name/date lead\nto locate the reconstructed act. Searching the ordinary register series does not\nsearch this separately created corpus.","sources":["S6","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-07c52f4c7612","kind":"unclassified","anchor":"1. Record the act's opening date first, as its own field. In birth and death acts this is the date the act was recorded, not the date of the event. [S1]\n2. Resolve relative expressions against that act date: *aujourd'hui* (today), *hier* (yesterday), \"the Nth of this month\", or a late declaration that gives a day and says \"N years ago\". Store two fields: the act date, and the event date as stated (literal) or as resolved. Never fill only one date field. [S1]\n3. In a marriage act, the opening date is the marriage date. The spouses' birth extracts were handed to the officer, who worked out each spouse's age from them. These ages contain errors. Treat the age as derived, and keep any mismatch with the birth act visible instead of correcting it. [S1]\n4. Years can be written out as French number words, for example a \"four-score-and-eleven\" form for 1791. Transcribe the literal words beside the number you read from them. [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1cf17327a729","kind":"unclassified","anchor":"1. Write down the literal Republican date: day, month name and year number. Enter it in a Republican–Gregorian converter and record the Gregorian result next to the literal date, naming the tool. The napoleon.org converter takes a day, a month from a dropdown and a Roman-numeral year (I–XIV), and converts in both directions. Do not work the date out in your head. Example: 17 Floréal year XI = 7 May 1803. The presenter's other example, 10 Thermidor year IX, falls in Thermidor (about 19 July – 17 August); run it through the converter for the exact day. [S2]\n2. Many registers are filed by Republican year. To browse them, convert the Gregorian target date into a Republican year first. Later marriage acts can still give a spouse's birth in Republican form, so you will need the converter for acts written after 1805 as well. [S2]\n3. Handwritten month names are easy to confuse. The presenter has mixed up Brumaire and Frimaire. Check the month you read against the order of the entries before and after it in the register. If the order does not settle it, keep both readings and convert each. [S2]\n4. Which acts can carry Republican dates: the calendar was decreed in October 1793 and applied from day one, 22 September 1792. France returned to the Gregorian calendar on 1 January 1806. In Belgium, annexed in 1795, the Republican calendar was used in the civil registers from 17 June 1796 and became mandatory from 3 April 1798 (Leiestam, Familiekunde Deinze). Use these dates to spot which acts may carry Republican dates. They do not tell you what a particular commune's clerk actually wrote. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-74a0e5bab476","kind":"unclassified","anchor":"The presenter explains that a clerk who made a mistake wrote *je dis* (\"I say\", meaning \"or rather\"), and that the value after it replaces the value before it. Her example reads like \"born on the 5th of March, *je dis* the 8th of April\". Extract only the corrected value as the field. Record the replaced value in a note marked \"superseded by clerk\". Never give both as alternative dates or names. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-399c3e2185a3","kind":"unclassified","anchor":"- *veuf / veuve de* (widower / widow of): the named spouse died before the act date. The presenter says a widower clause in a marriage may give the first spouse's death date and place. If it does, add that as a death-act lead. [S1]\n- *époux / épouse de* (husband / wife of): the spouse was alive at the act date. Look for their death after it. [S1]\n- *défunt / décédé(e)(s)* before a parent: that parent was dead by the act date. Under the Code civil, a deceased parent's death had to be proven to the officer at the marriage, so marriage acts often give the date and place of death. Use the gender and number endings to see which parent the word covers. In the presenter's example the plural *-s* showed that both parents had died. [S1], [S2]\n- *présent(e)* parent: the parent was alive and present at the marriage. [S1]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-87749fbae7df","kind":"unclassified","anchor":"1. **Dated statement** (a date and usually a commune). Convert the date if it is Republican, then search that commune's death register around that date. [S2]\n2. **Undated \"died before\"** (the presenter shows a word meaning \"earlier\"). This gives only an upper limit, the act date. The presenter takes it as a sign the officials could not find the death act. Treat that as her inference, not a negative search result. [S2]\n3. **Witness attestation**. When a parent's death act could not be produced, the Avis du Conseil d'État of 4 Thermidor XIII allowed a declaration sworn by the four marriage witnesses to be recorded in the marriage act. The legal formula concerns not knowing the place of death or last domicile. In the presenter's example, a mother's death \"about 22 years ago\" was attested this way because it was not found in that place's registers. Record the approximate date as secondhand testimony from the date of the attestation. The attestation establishes only the declarations the act records. Treat a register search as done only when the act says so, and only for the place and registers it names. It does not prove that no death act exists elsewhere. The presenter says such a record cannot be found. Do not repeat that as a finding. Keep a lower-priority search open in other likely communes and periods. [S2]","sources":["S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-a7509bfb956d","kind":"unclassified","anchor":"1. Do not stop after the couple, the parents or the witnesses. After the formula stating that the couple are united in marriage \"in the name of the law\", look for the couple *ont déclaré … est né d'eux* (have declared … was born of them) a child whom they recognise and legitimate by this marriage. Under Code civil art. 331, a child born before the marriage was legitimated by it if recognised before or in the marriage act. [S1], [S2]\n2. For each child, record: sex, the commune where the birth was registered (in a phrase like \"inscribed in the civil-status registers of …\"), the date given (as written; convert it if Republican), and the name under which the child was registered. The presenter usually sees one such child, sometimes two, and gives an example with five. [S1], [S2]\n3. Look for the birth act in that commune on that date under the **mother's surname**, and check its margin for a legitimation note. Then link it to the **father's surname** the child is expected to use in later records. Keep both forms as linked name variants, not as a merge. Whether the man legitimating the child is the biological father is a separate question. [S1], [S2]","sources":["S1","S2"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-f17d18f400a5","kind":"unclassified","anchor":"For French acts, [S4] describes margin notes continued on the register's end pages or beside a\nneighbouring act. Before treating a margin as complete, inspect those places where available.\nRetain each note's locator and establish which person or act it concerns from its wording and\nany cross-reference; proximity alone does not assign it to the adjacent act.","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-d90fd7b9ca28","kind":"unclassified","anchor":"Where the local descriptions establish separate municipal and court copies, compare the\navailable annotations with a separate locator for each copy. Check any stated transfer or\nannotation-maintenance dates instead of assuming both copies were updated alike. A missing\nnote in one copy is not proof of no marriage, divorce or death, nor of an event before a\ncutoff. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e90b61b88582","kind":"method","anchor":"A Belgian act younger than its public term is not open to everyone. The Archives de la Ville de Bruxelles say that from 1 January 2025, for genealogical, historical or scientific research, birth acts are public after 100 years and marriage and death acts after 75 years; an act exactly 75 or 100 years old is not yet public, and the ten-year tables follow the same terms [S7]. That page dates the change to the law of 13 September 2023 and its royal decree of 11 November 2024 [S7]. The State Archives' page for genealogists still gave 50 years for death acts when it was read on 2026-11-13 [S8], so do not take a death act between 50 and 75 years old as open on the strength of that page.","sources":["S7","S8"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
