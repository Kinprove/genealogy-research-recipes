claims:
  - {"id":"C-step-01","kind":"portal-availability","anchor":"Identify the dated parish and its court, *häradsrätt* for a rural district or *rådhusrätt* where the town used one. Search the FamilySearch Catalog under that jurisdiction for Land and Property, and compare the series descriptions in Riksarkivet. Use *jordeböcker* to trace the property's tax listing [S1 @2026-11-22], [S2 @2026-11-22], [S5 @2026-11-22].","sources":["S1","S2","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-02","kind":"historical","anchor":"A miss in the land-title book index leaves the earlier court search open. The orders for *lagfartsböcker* and *inteckningsböcker* date to 1875 and took effect on 1 January 1876. For an earlier transfer, browse the court's *lagfartsprotokoll*, *inteckningsprotokoll* or *småprotokoll*, and check the *dombok* when the separate series is absent [S1], [S2], [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-03","kind":"method","anchor":"In the older procedure, follow each *uppbud* (announcement) through the later sessions and look for the final *fasta*. Carry forward the property name, applicants, acquisition type, deed date and court date. For earlier volumes without a usable name index, scan the margins for the farm or village and verify it in the entry [S2], [S4].","sources":["S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-04","kind":"method","anchor":"Look for the prior-title document referenced in a registration from 1806 onward. Where an earlier inheritance has no registration, compare the probate inventory and parish entries and keep the transfer open until its basis is supported [S4].","sources":["S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-rural-and-town-title-routes","kind":"portal-availability","anchor":"For a rural parcel around 1875–1933, use the *lagfartsböcker* database and follow the [Swedish property-book route](land-index-book-series-recovery.md#swedish-property-books-follow-rooms-and-changed-parcel-identifiers). For a town parcel, search the town court archive for the relevant year, starting with the title protocols or an older town lot book if the inventory lists one [S6 @2026-11-25].","sources":["S6"],"checked":"2026-11-25","stated_as":"fact","review":"reviewed"}
