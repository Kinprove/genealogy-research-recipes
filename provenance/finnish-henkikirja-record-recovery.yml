  - {"id":"S5","kind":"web-page","urls":["https://sukututkijanloppuvuosi.blogspot.com/2023/06/kun-verkkopalvelun-tekija-ymmartaa.html"],"published":"2023-06-04","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Community account of using contributed section entries for Töölön Taipale in 2023 and browsing years absent from the results. The current Digihakemisto text-search form did not open. Read 2026-11-22 in the author’s weekly archive beginning 2023-06-04.","entry_sha256":"2b3dd68e33bd51e8d46a835d7f5d5edd68184b356ed6c60bfe5a6ba183cb76cd","claims":["C-04"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"In the 1634–1808 microfilm guide, use the back index to identify the parish’s district (*kihlakunta*) and then open the relevant province’s tables. For each target year, take the volume signum and starting folio from the district row. Treat the guide’s page as the start of the district. Confirm the parish heading and browse until you reach its entry. Keep the folio and digital image number in separate fields [S1], [S2], [S3].","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"portal-availability","anchor":"In Astia, match the signum with its provincial accounts series, volume title and year. For Porvoon kihlakunta in 1710, use *Uudenmaan ja Hämeen läänin tilejä*, *Tositekirja* 8123 and folio 472 as the district locator. If a detail search returns no result, go back to the series and signum [S1 @2026-11-22], [S2 @2026-11-22], [S3 @2026-11-22].","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"custody","anchor":"For 1634, start with the bailiffs’ accounts (*voudintilit*). For 1635–1808, follow the provincial accounts (*läänintilit*) and check its voucher books (*tositekirjat*) or separately bound rolls as appropriate to the year. For later rolls, browse the province’s henkikirja series in Astia [S2 @2026-11-22].","sources":["S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"example","anchor":"Kyläkoski reports using contributed Digihakemisto entries in 2023 to jump to property sections for selected years. Check whether the target volume has a contributed contents entry for the place. When a year or place is missing from the index, open the volume in Astia and browse the images for that year [S5].","sources":["S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"portal-availability","anchor":"Open *Suomen asutuksen yleisluettelo* (SAY) by parish. Read the individual volumes’ dates before ruling in or out a year. Within the volume go from village to farm, record the source indicated by the colour key, and retrieve the cited roll or other source. Prefer the colour images for decoding the key. When the volumes skip the target years, resume with the provincial accounts [S1 @2026-11-22], [S4 @2026-11-22].","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"method","anchor":"Check whom the roll was meant to include that year. For a village in a seventeenth-century roll, inspect the rest of the parish before treating a missing farm as an omission. Farms from the same village can appear in different parts of the parish list [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
