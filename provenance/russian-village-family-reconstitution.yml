claims:
  - {"id":"C-f9dccc0cf130","kind":"method","anchor":"- **A surname is a hint, not an identifier.** A guide to finding St Petersburg metrical books warns that peasants received surnames later than other estates, that people could still be «бесфамильными» at the start of the 20th century, and that the parents' names and patronymics are needed to tell whether an entry is the right one. [S1] Russian Wikipedia gives one kin written for two centuries as Прокудины in the revision tales and as Бодаевы in the recruit lists. [S2] On the VGD forum one participant could tell that four surnames belonged to one man only because his given name and patronymic were unique, and another met a man written «то так, то этак» under two surnames. [S3] A participant in another thread wrote that after the end of serfdom peasants «нередко имели одновременно несколько разных фамилий». [S4] According to Kinprove's own case notes [S5†], one man appeared under three surnames, and once with none, in entries years apart, and the entries under three of the forms were written by the same priest, so the change was not a change of clerk; a search by surname had missed half of his entries.\n- **Build the identity key.** Start from the evidence/proof list of what does not depend on the name, and key each person in the village index by given name and patronymic, the spouse's given name and patronymic, the village and the ages. Record the surname only as a name form seen in that entry, written as the entry gives it.\n- **Treat a second surname as an explanation to test.** VGD participants reported an official and a so-called street surname used side by side, a street surname taken from a nickname, from the father's or grandfather's name or from a place of origin, entries under a stepfather's or a father-in-law's surname, and the descendants of one kin splitting into branch surnames while one man was written «и под старой и под новой фамилиями». [S3] One of them called this neither a double surname nor a change of surname, but the absence of a stable surname. [S3] Each of these explanations needs its own evidence, and evidence/proof judgment asks you to compare what does not depend on the name before you split or merge ([different names are a bucket to test](evidence-proof-judgment.md#techniques-that-work)). According to Kinprove's own case notes [S5†], the family whose surname the man also bore was still recorded under it in a later civil death entry, which made it a lead to a tie with that family, not a renaming of either family. Never merge two lines because one man carries both names.","sources":["S1","S2","S3","S4","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ba2f1e4ee677","kind":"method","anchor":"A Board for Certification of Genealogists article by Thomas W. Jones notes that even when the first source answers the question, \"its accuracy is unknown until its answer is compared with other evidence\". [S6] A BCG post by Judy Kellar Fox gives as an example of identity proof a list that correlates data from several sources to show that a woman known under one surname was the same person as a woman under another. [S7] Build that list before you present an identity that crosses surname forms, and call it an inference until then. According to Kinprove's own case notes [S5†], an AI assistant presented such an identity as a fact before any check and had to correct itself when the researcher asked why.","sources":["S6","S7","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-283c5b72719a","kind":"method","anchor":"- **One child across events.** Find the same child's birth and death entries and compare the age at death with the birth date. Fox's checklist for a reasonably exhaustive search asks whether \"at least two sources of independent information items agree\". [S8] According to Kinprove's own case notes [S5†], a child born under one surname died under another at an age that matched the birth entry, which tied the two surname forms to one couple.\n- **The book's own totals.** A regional archive's article says each part of a metrical book closed every month and year with a count of births, marriages and deaths, by sex for births and deaths, and that a yearly ведомость covered all parts; its example matches the ведомость's two illegitimate births of 1866 with the two entries in the book. [S9] BYU notes that boys and girls are numbered separately within a year. [S10] Count all the entries you read for a book and year, not only the village's, against the book's totals and running numbers. A match supports full coverage of that book and year only ([coverage as pages × targets](archival-image-coverage-verification.md#report-coverage-as-pages--targets)): it shows that a second couple of the same names with a recorded event there would be in your index, not that no such couple lived in the parish, so the namesake test of [evidence/proof judgment](evidence-proof-judgment.md#techniques-that-work) still applies.\n- **Cross-roles.** Fox extends a reasonably exhaustive search to the subject's \"family, associates, and neighbors\". [S11] A study of Transbaikal metrical books found that sureties were recorded by their «кровной или дружеской принадлежности» to the groom or the bride. [S12] So a man who stands surety under one surname at the wedding of a man who was godfather to his child under another surname links the two forms through one circle. According to Kinprove's own case notes [S5†], such a chain within a few months linked two of the man's surname forms.","sources":["S8","S5","S9","S10","S11","S12"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7e13e4726cd7","kind":"method","anchor":"- **What the forms ask.** The 1918 code on civil status required a birth registration to state the parents' ages and «которым по счету ребенком, по числу имеющихся у данных родителей детей, является новорожденный». [S13] A blogger's transcriptions of one district's birth books show those columns in 1920–1921 and, in 1922–1926, the child's number split into two columns, «по числу родившихся» and «по числу оставшихся в живых». [S14] A forum repost dates that split to 1920. [S15] Read the column headings on the form in front of you.\n- **Use the numbers, and report where they disagree.** A contemporary report on civil registration in Petrograd found that the form the code required was not followed and that «Книги ведутся небрежно». [S16] Compute the birth year that each stated age implies, and list the couple's known children against the ordinal and the born and living counts. Report each conflict as found, and explain it before you choose a value ([evidence/proof judgment](evidence-proof-judgment.md#techniques-that-work)); ages given by one declarant on one day are not independent of each other. According to Kinprove's own case notes [S5†], one man's ages on two civil forms implied different birth years, a child's ordinal on one form matched the born count on a later one, and a later household book gave his wife a birth year far from both civil ages.\n- **Household books are another declared source.** A study of kolkhoz households in the Altai says household books (похозяйственные книги) were kept from 1934 and recorded families arriving and leaving. [S17] Treat their ages and birth years as further declared values, not as a check that overrides the others.","sources":["S13","S14","S15","S16","S5","S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e8d4df2e889f","kind":"method","anchor":"- **One file can hold many churches.** A Mari El archive inventory describes one 1786 file of consistory copies as «Метрические книги церквей» of five districts, and its index sends the reader to the internal inventories to learn which settlements a unit covers. [S18] A fragment of the target parish can sit inside a file titled for another parish or district ([metrical-book recovery, step 4](russian-orthodox-metrical-book-recovery.md#4-inside-a-consistory-fond-record-the-delo-and-the-leaf-span-and-check-every-delo-for-the-year)). According to Kinprove's own case notes [S5†], a neighbouring parish's volume held a misbound fragment of the target parish.\n- **Identify each held file from its own pages.** Evidence Explained notes that with some digitized microfilm the first image or two carry the title page of the microfilm publication. [S19] Open the cover and title page of every PDF or image folder and record what it is. A checksum does not change when only the filename changes, so equal checksums find byte-identical copies under different names. [S20] According to Kinprove's own case notes [S5†], a folder named for one delo was a byte-identical copy of another, and two unidentified PDFs were 1858 revision tales that do not name the village.\n- **A case cited in another tree is a lead, not a reading.** Evidence Explained warns against borrowing a source's citation and leaving \"the impression that we consulted the original\". [S19] Repeating a provider's citation is, in Elizabeth Shown Mills's words, \"simply regurgitating what my provider is citing\". [S21] Evidence Explained also asks researchers to double-check the details of a ready-made citation. [S22] A Russian researcher keeps the year from the table heading, the month and the entry numbers visible in every screenshot of an entry. [S23] Before you propose a cited case as the place to look for an event, open the cited frame and read its header: the year, the register part and the church. According to Kinprove's own case notes [S5†], two cases cited for the family in another researcher's tree were a town church's deaths and marriages of other decades, which cannot hold the village baptism sought.","sources":["S18","S5","S19","S20","S21","S22","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bb1a58873f7a","kind":"method","anchor":"- **Record every mention, in every role.** In a one-place study, Wikipedia says, the parish registers are transcribed \"so they can be restructured into family order\", and done scientifically this is family reconstitution. [S24] Cambridge Group notes on reconstitution databases aim \"to capture all data in the registers\", make people rather than families the base unit, and link people by names \"not only of subject but also parents/spouse names\". [S25] Two Russian researchers applied family reconstitution, which rebuilds families from the registers on special family forms, to the genealogy of a village's peasants. [S26] Record every entry in which anyone of the village appears: as a parent, godparent, surety, declarant or the deceased. Cover every parish and civil register that served the village ([metrical-book recovery, step 2](russian-orthodox-metrical-book-recovery.md#2-list-every-parish-that-could-have-served-the-village-in-that-year)). Then reconstitute couples, children and households from the mentions.\n- **Look in the associates' records.** Mills's FAN principle: when the people studied \"left no document to handily supply the information we seek, we often find it in the records created by members of their FAN Club\". [S27] According to Kinprove's own case notes [S5†], a whole-village index of several hundred entries surfaced the only plausible father, a soldier named as a child's father in a fragment that no surname search had opened.\n- **Re-run old negatives on the identity key.** A guide to negative evidence says that a search that finds nothing \"is a research outcome that must be logged and evaluated, but on its own, it is not evidence\", and asks for every spelling variant, the original images where possible and each search term in the log. [S28] Re-run each earlier \"not found\" on the identity key, and record which frames were actually read; a surname query misses surnameless entries ([metrical-book recovery, step 10](russian-orthodox-metrical-book-recovery.md#10-use-machine-read-full-text-search-for-leads-never-for-a-negative)). According to Kinprove's own case notes [S5†], earlier passes had logged \"not found\" in books where the man appears under another surname or none.","sources":["S24","S25","S26","S27","S5","S28"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bb3224dfb502","kind":"method","anchor":"- **In-laws and godparents often live in other villages.** Russian Wikipedia describes the село as a peasant settlement with a church that served as the centre for «близлежащих деревень». [S29] BYU glosses a деревня as a village \"without a church\". [S10] The Yasnaya Polyana study read that village's families in the books of another village's church, to whose parish it belonged. [S26] In the Transbaikal study, the couple came from different settlements in 14 of 31 marriage entries in which the families' relatives were the couple or the sureties. [S12] The St Petersburg guide advises checking both the groom's and the bride's parish for a marriage. [S1] So an index limited to the target village leaves out the wife's natal family, an alias family and godparents from the other villages of the parish, much as an English parish reconstitution has \"no coverage of out-migrants\". [S30] Familio adds that peasants sometimes went to a nearer church than their own and were registered there, so check the neighbouring churches. [S31]\n- **A book read for one village is unread for another.** A book that a village-only pass marked as read in full was viewed, but its other villages were not transcribed. For a cross-village question, count it as unread ([words the agent must earn](agent-research-project.md#words-the-agent-must-earn)). If the cheaper searches give nothing, transcribing every entry of every village in the held books of each parish that served the village, including a second parish the families used, is one way forward.\n- **Search the wife's patronymic in the indexes you already have.** Evidence/proof judgment already treats a sponsor who shares a mother's patronymic as a lead to her natal family ([evidence/proof judgment](evidence-proof-judgment.md#resolve-a-relationship-label-across-successive-unions)). In the Transbaikal marriage entries a bride was recorded with her name, patronymic and village and whose daughter she was, and godparent ties helped recover maiden surnames and close relatives. [S12] Search every index you hold for the wife's patronymic, not only the sponsors and the target surname and given name, and treat a match as a lead, never as proof. According to Kinprove's own case notes [S5†], the wife's rare patronymic matched a man of one surname in a neighbouring village of the parish, a candidate brother, whom only the researcher's own frame index of all the villages showed.","sources":["S29","S10","S26","S12","S1","S30","S31","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04a3f119a587","kind":"method","anchor":"- **Why godparents and sureties point to kin.** The Transbaikal study found that godparents were often close relatives and that some godparent ties later grew into close kinship; for sureties see step 2. [S12] An ethnographer wrote in 1963 that parents, as a general rule, invited a relative as godfather, that inviting non-relatives came later, and that influential or rich patrons such as landowners and superiors were also invited. [S32] Mills's example finds a cousin as the bondsman of a marriage bond, and she calls such pieces of evidence ones \"that prove nothing by themselves\". [S27]\n- **Record each link with its strength and its rivals.** For each godparent or surety link, record the person, the entry, the household or family it points to, its strength (a relative named as such, a shared household in a list, or a shared surname only) and the competing explanations: kin, neighbour, social equal or patron. Where several people could fill one place, list all of them. The Cambridge notes add that \"Where multiple possible matches exist, must choose\", using match scores. [S25] According to Kinprove's own case notes [S5†], both godparents of the candidate father's child came from one household of the last confession list, which made a link to that household probable but did not choose between three men of the same given name who could have been his father.\n- **Read a bridging kin term as a relationship to explain.** Start from [the audit's kin-term rule](russian-household-list-transcription-audit.md#4-read-the-household-as-the-scribe-wrote-it), which gives приемыш as also a son-in-law taken into the house. Dal defines a примак as «зять, принятый в дом тестем». [S33] Brockhaus and Efron describe a влазень as a daughter's husband taken into his father-in-law's house, usually when the father-in-law had no sons. [S34] A пасынок is one spouse's son, not the other's, such as a son brought from a first marriage. [S35] Dal also records племянник in the old sense of any collateral kinsman [S36], and тётка for a stepmother in Vologda usage. [S37] So a term that bridges two households can describe kinship by marriage or by the household, not by blood. Trace each such term back to the earliest list that uses it before you assign a bloodline, and keep your reading of it, such as примак, in brackets as an interpretation. According to Kinprove's own case notes [S5†], a man listed as the приемыш of two brothers married their niece, and the household's later «племянник» and «тётка» described kinship by marriage.","sources":["S12","S32","S27","S25","S5","S33","S34","S35","S36","S37"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8223a4e6e3d3","kind":"method","anchor":"- **One faithful sheet per list first.** BYU describes confession lists as made at least yearly, showing the members of a household together with their relationships. [S38] BYU's revision-list page lists the previous revision's family numbers and the reasons someone was absent, as when \"they moved away or died between revisions\". [S39] Transcribe each list on its own sheet in source order, keep the household and running numbers, kin terms and notes as written, and audit it against its images ([household-list transcription audit](russian-household-list-transcription-audit.md)). The Cambridge notes keep the original spelling beside any standardised form. [S25]\n- **Then one merged village sheet.** Put the year blocks side by side and give each person one row aligned across years. In the merged view, household changes show at a glance: a son's household splits off, a widow or a stepson moves between households, a recruit, a transferred man or a dead man drops out, and a newcomer arrives. This complements the per-household table and the widowhood rule in [reading confession lists, step 4](russian-orthodox-confession-list-reading.md#4-compare-the-household-across-several-lists): here a person leaving one household can be found arriving in another.\n- **Keep the merged sheet derived.** Broman and Woo advise that the primary data file hold \"just the data and nothing else\", that data be rearranged by code rather than by copy-and-paste, and that every version be kept. [S40] Excel's consolidation updates a summary automatically only when it is created with links to the source data. [S41] Microsoft also advises putting values in cells and referring to those cells in formulas rather than typing constants. [S42] So give each merged cell the locator of its source entry: list, leaf, household and person numbers. After any correction to a year sheet, compare the year sheets before and after the edit, carry each change to the merged cell with the same locator, and resolve by hand any change that has no single matching locator. Leave pure spelling variants in the merged sheet as typed, and compute birth years with a formula. According to Kinprove's own case notes [S5†], a hand-typed summary sheet that was not linked to the year sheets had silently kept 41 pre-audit readings.","sources":["S38","S39","S25","S40","S41","S42","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5f8bd1bed996","kind":"method","anchor":"- **Continue the panel into the metrical and civil years.** Add the village index of step 5 (couples, children, godparents and ages) and later household books. The Yasnaya Polyana study found that the surviving metrical books did not form a continuous series, and that combining them with the revision tales gives the most complete genealogical record. [S26] Volost fonds can also hold family lists and yearly call-up lists from the 1870s on ([volost and town administration records, step 2](russian-volost-town-administration-records.md#2-build-the-register-by-series-class)).\n- **Align the last list's men with the first couples.** Familio's example: if the metrical books name an ancestor Савва Гаврилович, look in the confession lists for a Гавриил with a son Савва of a fitting age. [S31] Align the men of the last list with the couples first seen decades later by given name, patronymic and age. Age only ranks candidates ([reading confession lists, step 4](russian-orthodox-confession-list-reading.md#4-compare-the-household-across-several-lists)). According to Kinprove's own case notes [S5†], the candidate father was found by setting a soldier with one patronymic against the men of that given name in the last list, one of whom lived in the household whose surname the family later bore.","sources":["S26","S31","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-310083121b54","kind":"method","anchor":"- **Online databases change silently.** Evidence Explained says the access date records which version of a database was used, \"given that online material is often updated\" [S43]; that web materials are \"edited frequently and often silently\" [S44]; and that providers sometimes remove content as well as add it. [S45] One blogger tracks FamilySearch's record collections every week and gives each updated collection's new count beside the previous one. [S46] A Russian researcher writes that the Pamyat Naroda database «постоянно пополняется», so a person not found a month ago may appear today. [S23]\n- **Keep a snapshot and diff it.** Save the place queries with the date, each record's URL and its fields. To answer the question, re-run the same queries, including every spelling of the volost and the uezd, and diff by record URL for additions, removals and changed fields. A record without a patronymic or a village is a weak lead only (step 1). If the detail pages cannot be opened, say so. According to Kinprove's own case notes [S5†], such a diff showed no new records for the volost since the previous day's snapshot.","sources":["S43","S44","S45","S46","S23","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-35aa84594af0","kind":"method","anchor":"- **Re-read every decisive finding on the image.** Start from [AI for documentary records](ai-for-documentary-records.md#verification--privacy-discipline) and the audit's [same-scribe rule](russian-household-list-transcription-audit.md#2-settle-a-disputed-glyph-against-the-same-scribe). BYU gives the age column's heading in a death register as «Лета умершего» [S48]; a unit written after the number, not the heading, says whether it counts years, months or weeks. According to Kinprove's own case notes [S5†], first-pass readings by helpers were wrong more than once: a death entry's surname was read as the man's other surname, an infant's age written with «н.» meant weeks, not months, and a neighbouring village's name was repeatedly taken for the target village until its letters were tested against the same hand's ц and ч.\n- **Use the verified subset as a control.** When a new pass re-reads frames that an earlier pass already transcribed and checked, compare the two on that subset before you trust the new pass. Transkribus recommends measuring a model's accuracy on new pages against a ground-truth transcription as \"a useful test before running a model on an entire document or collection\". [S49] A study of OCR post-correction normalised away spelling variants that \"do not alter meaning\" and found \"a substantial impact on the reported scores\". [S50] Normalise canonical name pairs inside that comparison only. Petrovsky's dictionary gives Иоанн as the old form of Иван [S51], Федосья as a colloquial form of Феодосия [S52], Козьма as a colloquial form of Кузьма [S53], Елисавета as the old form of Елизавета [S54], Емилиан as the old form of Емельян [S55] and София as the old form of Софья. [S56] The sheets keep the written form ([audit, step 5](russian-household-list-transcription-audit.md#5-read-names-against-the-household-and-the-other-years)). Send each disagreement to adjudication on the image, not to a vote ([reading a source](agent-research-project.md#reading-a-source)). According to Kinprove's own case notes [S5†], raw agreement between two passes over 201 persons was 66% and normalised agreement 91%, and the remaining disagreements sat in unclear names and in patronymics cut off at the gutter.\n- **Give an AI reader few images per turn.** In the MileBench benchmark, \"as the number of images increases, the performance of most models significantly declines\", and merging several images into one large image lowered the scores of two of the three proprietary models tested. [S57] A multimodal needle-in-a-haystack study found that accuracy \"drops significantly with more images\", and also as more sub-images are stitched into one image. [S58] Anthropic's documentation applies a stricter size limit to every image in a request that holds more than 20 images. [S47] In agent sweeps give at most one spread per turn (two page halves, or one composite of them) plus at most two zooms. Save steps by batching the text work, not the images, and state the image cap together with any request to use fewer steps. According to Kinprove's own case notes [S5†], a model sent about 50 frames at once read much worse than one sent about 10, and readers told to use fewer steps began sending 7 to 9 images per turn.\n- **Measure throughput before you promise a duration.** A digitisation guide suggests trial runs timed with stopwatches to estimate transcription rates [S59], and another says expected rates should be specified \"before project start, ideally by allowing an appropriate time for workflow testing\". [S60] Measure frames per lane after about ten minutes and steps per frame against the step budget before you state how long a sweep will take, and plan resume lanes from the progress files. According to Kinprove's own case notes [S5†], at 4 to 6 steps per frame a 250-step budget ended at frame 40 to 60 of a 70-frame lane, and an unmeasured estimate of \"many hours\" was rightly rejected.","sources":["S48","S5","S49","S50","S51","S52","S53","S54","S55","S56","S57","S58","S47","S59","S60"],"checked":null,"stated_as":"observation","review":"reviewed"}
