claims:
  - {"id":"C-ba2f1e4ee677","kind":"method","anchor":"Compare the first answer with independent evidence [S6]. For an identity spanning surnames, list corroborating and conflicting details across the sources [S7]. According to Kinprove’s case notes, an identity announced before those checks had to be withdrawn as a conclusion [S5†]. Keep it as an inference until the checks agree.","sources":["S6","S7","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-283c5b72719a","kind":"method","anchor":"- **One child across events.** Find the same child's birth and death entries and compare the age at death with the birth date. Fox's checklist for a reasonably exhaustive search asks whether \"at least two sources of independent information items agree\". [S8] Compare each event’s parents and age across both surnames.\n- **The book's own totals.** A regional archive's article says each part of a metrical book closed every month and year with a count of births, marriages and deaths, by sex for births and deaths, and that a yearly ведомость covered all parts including the count of illegitimate births where supplied. [S9] BYU notes that boys and girls are numbered separately within a year. [S10] A blogger's guide to the births part adds that the column holding a child's number gives the sex when the name is illegible, and that the numbering shows whether pages are lost. [S76] Count all the entries you read for a book and year, not only the village's, against the book's totals and running numbers. A match supports full coverage of that book and year only ([coverage as pages × targets](archival-image-coverage-verification.md#report-coverage-as-pages--targets)): it shows that a second couple of the same names with a recorded event there would be in your index, not that no such couple lived in the parish, so the namesake test of [evidence/proof judgment](evidence-proof-judgment.md#techniques-that-work) still applies.\n- **Cross-roles.** Fox extends a reasonably exhaustive search to the subject's \"family, associates, and neighbors\". [S11] A study of Transbaikal metrical books found that sureties were recorded by their «кровной или дружеской принадлежности» to the groom or the bride. [S12] So a man who stands surety under one surname at the wedding of a man who was godfather to his child under another surname links the two forms through one circle.\n- **One father across brothers.** Compare the named relatives and addresses on WWII loss records for men entered under different surnames [S81], [S82]. Count a shared father only where each record names him in that role. A wife or mother requires a different comparison.","sources":["S8","S9","S10","S76","S11","S12","S81","S82"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-7e13e4726cd7","kind":"method","anchor":"- **What the forms ask.** The 1918 code on civil status required a birth registration to state the parents' ages and «которым по счету ребенком, по числу имеющихся у данных родителей детей, является новорожденный». [S13] A blogger's transcriptions of one district's birth books show those columns in 1920–1921 and, in 1922–1926, the child's number split into two columns, «по числу родившихся» and «по числу оставшихся в живых». [S14] A forum repost dates that split to 1920. [S15] Read the column headings on the form in front of you.\n- **Use the numbers, and report where they disagree.** A contemporary report on civil registration in Petrograd found that the form the code required was not followed and that «Книги ведутся небрежно». [S16] Compute the birth year that each stated age implies, and list the couple's known children against the ordinal and the born and living counts. Report each conflict as found, and explain it before you choose a value ([evidence/proof judgment](evidence-proof-judgment.md#techniques-that-work)); ages given by one declarant on one day are not independent of each other.\n- **Household books are another declared source.** A study of kolkhoz households in the Altai says household books (похозяйственные книги) were kept from 1934 and recorded families arriving and leaving. [S17] Treat their ages and birth years as further declared values, not as a check that overrides the others.","sources":["S13","S14","S15","S16","S17"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-e8d4df2e889f","kind":"method","anchor":"- **One file can hold many churches.** A Mari El archive inventory describes one 1786 file of consistory copies as «Метрические книги церквей» of five districts, and its index sends the reader to the internal inventories to learn which settlements a unit covers. [S18] A fragment of the target parish can sit inside a file titled for another parish or district ([metrical-book recovery, step 4](russian-orthodox-metrical-book-recovery.md#4-inside-a-consistory-fond-record-the-delo-and-the-leaf-span-and-check-every-delo-for-the-year)). According to Kinprove’s case notes, a neighbouring parish’s volume held a misbound fragment of the target parish [S5†]. Check the parish heading wherever a volume’s sequence breaks.\n- **Identify each held file from its own pages.** Evidence Explained notes that with some digitized microfilm the first image or two carry the title page of the microfilm publication. [S19] Open the cover and title page of every PDF or image folder and record what it is. A checksum does not change when only the filename changes, so equal checksums find byte-identical copies under different names. [S20] Verify unidentified files against the village on their pages.\n- **A case cited in another tree is a lead, not a reading.** Evidence Explained warns against borrowing a source's citation and leaving \"the impression that we consulted the original\". [S19] Repeating a provider's citation is, in Elizabeth Shown Mills's words, \"simply regurgitating what my provider is citing\". [S21] Evidence Explained also asks researchers to double-check the details of a ready-made citation. [S22] A Russian researcher keeps the year from the table heading, the month and the entry numbers visible in every screenshot of an entry. [S23] Before you propose a cited case as the place to look for an event, open the cited frame and read its header: the year, the register part and the church. According to Kinprove’s case notes, the cited volumes contained the wrong church, parts and decades for the proposed baptism [S5†].","sources":["S18","S5","S19","S20","S21","S22","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bb1a58873f7a","kind":"method","anchor":"- **Record every mention, in every role.** In a one-place study, Wikipedia says, the parish registers are transcribed \"so they can be restructured into family order\", and done scientifically this is family reconstitution. [S24] Cambridge Group notes on reconstitution databases aim \"to capture all data in the registers\", make people rather than families the base unit, and link people by names \"not only of subject but also parents/spouse names\". [S25] Two Russian researchers applied family reconstitution, which rebuilds families from the registers on special family forms, to the genealogy of a village's peasants. [S26] Record every entry in which anyone of the village appears: as a parent, godparent, surety, declarant or the deceased. Cover every parish and civil register that served the village ([metrical-book recovery, step 2](russian-orthodox-metrical-book-recovery.md#2-list-every-parish-that-could-have-served-the-village-in-that-year)). Then reconstitute couples, children and households from the mentions.\n- **List every owner of the village.** Use the General Survey’s economic notes (экономические примечания) to identify the owners of each estate (дача). Check whether the notes group co-owners and whether the revision’s household and soul counts are broken down by owner [S85]. Distinguish cash dues (оброк) from labour services (изделье) when separating owners’ sections [S86]. Check the full notes for amounts where they survive [S87], [S88]. Search each owner’s sections in revision tales and confession lists.\n- **Look in the associates' records.** Mills's FAN principle: when the people studied \"left no document to handily supply the information we seek, we often find it in the records created by members of their FAN Club\". [S27] Search the records of associates in every indexed role.\n- **Re-run old negatives on the identity key.** A guide to negative evidence says that a search that finds nothing \"is a research outcome that must be logged and evaluated, but on its own, it is not evidence\", and asks for every spelling variant, the original images where possible and each search term in the log. [S28] Re-run each earlier \"not found\" on the identity key, and record which frames were actually read; a surname query misses surnameless entries ([metrical-book recovery, step 10](russian-orthodox-metrical-book-recovery.md#10-use-machine-read-full-text-search-for-leads-never-for-a-negative)). According to Kinprove’s case notes, a surname-only search had missed entries under another surname and entries with none [S5†].","sources":["S24","S25","S26","S85","S86","S87","S88","S27","S28","S5"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-bb3224dfb502","kind":"method","anchor":"- **Extend the search to neighbouring settlements.** A село could serve nearby деревни without churches [S29], [S10], [S26]. Check both spouses’ parishes and neighbouring churches [S12], [S1], [S31]. A village-only reconstruction misses possible in-laws, godparents, alias families and out-migrants [S30].\n- **A book read for one village is unread for another.** A book that a village-only pass marked as read in full was viewed, but its other villages were not transcribed. For a cross-village question, count it as unread ([words the agent must earn](agent-research-project.md#words-the-agent-must-earn)). If the cheaper searches give nothing, transcribing every entry of every village in the held books of each parish that served the village, including a second parish the families used, is one way forward.\n- **Search the wife's patronymic in the indexes you already have.** Evidence/proof judgment already treats a sponsor who shares a mother's patronymic as a lead to her natal family ([evidence/proof judgment](evidence-proof-judgment.md#resolve-a-relationship-label-across-successive-unions)). In the Transbaikal marriage entries a bride was recorded with her name, patronymic and village and whose daughter she was, and godparent ties helped recover maiden surnames and close relatives. [S12] Search every index you hold for the wife's patronymic, not only the sponsors and the target surname and given name, and treat a match as a lead, never as proof.","sources":["S29","S10","S26","S12","S1","S31","S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04a3f119a587","kind":"method","anchor":"- **Why godparents and sureties point to kin.** The Transbaikal study found that godparents were often close relatives and that some godparent ties later grew into close kinship; for sureties see step 2. [S12] An ethnographer wrote in 1963 that parents, as a general rule, invited a relative as godfather, that inviting non-relatives came later, and that influential or rich patrons such as landowners and superiors were also invited. [S32] Mills's example finds a cousin as the bondsman of a marriage bond, and she calls such pieces of evidence ones \"that prove nothing by themselves\". [S27]\n- **Record each link with its strength and its rivals.** For each godparent or surety link, record the person, the entry, the household or family it points to, its strength (a relative named as such, a shared household in a list, or a shared surname only) and the competing explanations: kin, neighbour, social equal or patron. Where several people could fill one place, list all of them. The Cambridge notes add that \"Where multiple possible matches exist, must choose\", using match scores. [S25]\n- **Read a bridging kin term as a relationship to explain.** Start from [the audit's kin-term rule](russian-household-list-transcription-audit.md#4-read-the-household-as-the-scribe-wrote-it), which gives приемыш as also a son-in-law taken into the house. Dal defines a примак as «зять, принятый в дом тестем». [S33] Brockhaus and Efron describe a влазень as a daughter's husband taken into his father-in-law's house, usually when the father-in-law had no sons. [S34] A пасынок is one spouse's son, not the other's, such as a son brought from a first marriage. [S35] Dal also records племянник in the old sense of any collateral kinsman [S36], and тётка for a stepmother in Vologda usage. [S37] So a term that bridges two households can describe kinship by marriage or by the household, not by blood. Trace each such term back to the earliest list that uses it before you assign a bloodline, and keep your reading of it, such as примак, in brackets as an interpretation.\n- **Chart both spouses’ ancestries in a village marriage.** A reported marriage between distant cousins illustrates that a common ancestor can belong to both spouses’ lines [S74]. Determine the degree of collateral blood kinship and check the period guidance and marriage file. Under the 1810 decree first cousins could not marry, and more distant relationships could qualify for episcopal permission [S75], [S96]. For seventh-degree kinship the guides differ [S75], [S95]. Look for the diocese’s practice before inferring a missing dispensation [S95].","sources":["S12","S32","S27","S25","S33","S34","S35","S36","S37","S74","S75","S96","S95"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8223a4e6e3d3","kind":"method","anchor":"- **One faithful sheet per list first.** BYU describes confession lists as made at least yearly, showing the members of a household together with their relationships. [S38] BYU's revision-list page lists the previous revision's family numbers and the reasons someone was absent, as when \"they moved away or died between revisions\". [S39] Transcribe each list on its own sheet in source order, keep the household and running numbers, kin terms and notes as written, and audit it against its images ([household-list transcription audit](russian-household-list-transcription-audit.md)). The Cambridge notes keep the original spelling beside any standardised form. [S25]\n- **Then one merged village sheet.** Put the year blocks side by side and give each person one row aligned across years. In the merged view, household changes show at a glance: a son's household splits off, a widow or a stepson moves between households, a recruit, a transferred man or a dead man drops out, and a newcomer arrives. This complements the per-household table and the widowhood rule in [reading confession lists, step 4](russian-orthodox-confession-list-reading.md#4-compare-the-household-across-several-lists): here a person leaving one household can be found arriving in another.\n- **Keep the merged sheet derived.** Broman and Woo advise that the primary data file hold \"just the data and nothing else\", that data be rearranged by code rather than by copy-and-paste, and that every version be kept. [S40] Excel's consolidation updates a summary automatically only when it is created with links to the source data. [S41] Microsoft also advises putting values in cells and referring to those cells in formulas rather than typing constants. [S42] So give each merged cell the locator of its source entry: list, leaf, household and person numbers. After any correction to a year sheet, compare the year sheets before and after the edit, carry each change to the merged cell with the same locator, and resolve by hand any change that has no single matching locator. Leave pure spelling variants in the merged sheet as typed, and compute birth years with a formula.","sources":["S38","S39","S25","S40","S41","S42"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-5f8bd1bed996","kind":"method","anchor":"- **Continue the panel into the metrical and civil years.** Add the village index of step 5 (couples, children, godparents and ages) and later household books. The Yasnaya Polyana study found that the surviving metrical books did not form a continuous series, and that combining them with the revision tales gives the most complete genealogical record. [S26] Volost fonds can also hold family lists and yearly call-up lists from the 1870s on ([volost and town administration records, step 2](russian-volost-town-administration-records.md#2-build-the-register-by-series-class)).\n- **Compare the last list with the first couples.** For each later couple, use both given names, the patronymic and the ages to find possible households in the last list [S31]. Age ranks candidates ([reading confession lists, step 4](russian-orthodox-confession-list-reading.md#4-compare-the-household-across-several-lists)). Check a household associated with a later surname alongside the others.\n- **Use the household censuses between the revisions and 1897.** Zemstvo household censuses (подворные переписи) were taken in 311 uezds of European Russia from emancipation to the First World War, most often in the mid-1880s, the late 1890s, about 1900 and in 1910–1912. [S78] What one lists varies: in two Moscow-guberniya villages the censuses of 1869–1871 and 1886 list every household member, and the agricultural data of 1883 only the household heads. [S78] Where the census lists members, copy patronymics, ages, trades and both absent and unregistered residents [S77]. In Tula guberniya the household cards of the 1910–1912 agricultural census record each peasant household's trades and enterprises. [S79] Read each census's own columns before you treat it as a family list.\n- **Use the priest's call-up extracts where the death books are lost.** Under the 1874 Military Service Statute, parish priests sent metrical extracts listing every male of the cohort due for call-up, those who had turned 20 by 1 January of the levy year, with his birth month and day, his father's name and, for those who had died, the date of death. [S84] Read a blank death column as no death known to the priest, and use the list to count namesakes in one year's cohort. The uezd boards for military service also kept checks of the call-up lists with copies of family lists. [S83]","sources":["S26","S31","S78","S77","S79","S84","S83"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-310083121b54","kind":"method","anchor":"- **Date the database search.** Online collections can change silently, including removals [S44], [S45]. Record the access date [S43] and the collection count where available [S46]. Repeat searches in the expanding Pamyat Naroda collection [S23].\n- **Compare dated snapshots.** Save each query, including the volost and uezd spellings, the record URLs and the returned fields. Rerun the same searches and compare by URL for added, removed and changed entries. Record whether the detail pages opened. A hit without a patronymic or village remains a lead (step 1).","sources":["S44","S45","S43","S46","S23"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-35aa84594af0","kind":"method","anchor":"- **Re-read every decisive finding on the image.** Start from [AI for documentary records](ai-for-documentary-records.md#verification--privacy-discipline) and the audit's [same-scribe rule](russian-household-list-transcription-audit.md#2-settle-a-disputed-glyph-against-the-same-scribe). BYU gives the age column's heading in a death register as «Лета умершего» [S48]; a unit written after the number, not the heading, says whether it counts years, months or weeks. According to Kinprove’s case notes, «н.» in an infant’s death entry meant weeks, making a reading in months misleading [S5†]. Compare uncertain place-name letters such as ц and ч in the same hand.\n- **Use the verified subset as a control.** When a new pass re-reads frames that an earlier pass already transcribed and checked, compare the two on that subset before you trust the new pass. Transkribus recommends measuring a model's accuracy on new pages against a ground-truth transcription as \"a useful test before running a model on an entire document or collection\". [S49] A study of OCR post-correction normalised away spelling variants that \"do not alter meaning\" and found \"a substantial impact on the reported scores\". [S50] Normalise canonical name pairs inside that comparison only. Petrovsky's dictionary gives Иоанн as the old form of Иван [S51], Федосья as a colloquial form of Феодосия [S52], Козьма as a colloquial form of Кузьма [S53], Елисавета as the old form of Елизавета [S54], Емилиан as the old form of Емельян [S55] and София as the old form of Софья. [S56] The sheets keep the written form ([audit, step 5](russian-household-list-transcription-audit.md#5-read-names-against-the-household-and-the-other-years)). Send each disagreement to adjudication on the image, not to a vote ([reading a source](agent-research-project.md#reading-a-source)).\n- **Give an AI reader few images per turn.** In the MileBench benchmark, \"as the number of images increases, the performance of most models significantly declines\", and merging several images into one large image lowered the scores of two of the three proprietary models tested. [S57] A multimodal needle-in-a-haystack study found that accuracy \"drops significantly with more images\", and also as more sub-images are stitched into one image. [S58] Anthropic's documentation applies a stricter size limit to every image in a request that holds more than 20 images. [S47] In agent sweeps give at most one spread per turn (two page halves, or one composite of them) plus at most two zooms. Save steps by batching the text work, not the images, and state the image cap together with any request to use fewer steps.\n- **Measure throughput before you promise a duration.** A digitisation guide suggests trial runs timed with stopwatches to estimate transcription rates [S59], and another says expected rates should be specified \"before project start, ideally by allowing an appropriate time for workflow testing\". [S60] Measure frames per lane after about ten minutes and steps per frame against the step budget before you state how long a sweep will take, and plan resume lanes from the progress files.","sources":["S48","S5","S49","S50","S51","S52","S53","S54","S55","S56","S57","S58","S47","S59","S60"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-ca63353a5527","kind":"example","anchor":"A Soviet civil-registration book can cover several settlements, and a restored book can register a\nbirth years later. In the Ukrainian Wikisource index to the Sumy oblast archive's f. Р-7720, op. 2\n(Buryn district, 1918–1949), at least 206 of the 298 books name more than one settlement, and 20 birth\nbooks of 1944–1949 are marked restored (поновлені). [S61] Record the registration date and stated basis separately from the birth date. If a restored entry cites a commission protocol, locate it before deciding what evidence supported the registration [S62].","sources":["S61","S62"],"checked":"2026-11-13","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3df8946c8bb7","kind":"method","anchor":"**A missing surname is a fact about that entry.** The same family’s surname was reported present and absent across records in a captured text read without its images [S65]. Compare [another series for the same years](russian-orthodox-metrical-book-recovery.md#9-treat-names-and-patronymics-as-hypotheses) and try the later form in earlier censuses and revisions before dating its use.","sources":["S65"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-342-prior-work","kind":"method","anchor":"**Before rebuilding, say what already exists.** Inventory the trees, couples tables, household panels and dated reports, naming the extraction and version each rests on. Mark a superseded extraction and any artifact not rebuilt after its correction. List every tested and dropped hypothesis with its reason and report locator; reopen a dropped hypothesis only with relevant new evidence, and say what changed. Reuse a finding already established rather than calling it new ([agent-project search discipline](agent-research-project.md#searches-and-absence)). Record which surviving tables still depend on the superseded readings [O1].","sources":["O1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-342-act-digest","kind":"method","anchor":"**Read a compact view of every act, and update the couples after each portion.** Derive a print-only digest from the extraction, one line per act: locator and date; parents → child | godparents; groom × bride, ages and sureties; or deceased and age. Tag outsiders with their recorded village. Keep the literal transcription separately, retain conflicts and unknown fields, and mark each reading as index-only or checked on the image. Split the digest into portions visible in full, preserve long-line tails, and record the acts each covers. Read every portion, not just name-search hits, and write the couples table after each portion rather than waiting until the end. Preserve the reading status and locator when updating the couples table [O1].","sources":["O1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-342-bride-origins","kind":"method","anchor":"**Count where the brides came from before suggesting a sister.** Tabulate the natal villages recorded for brides of village grooms, with the years, denominator and unknown origins. A resident wife's shared patronymic does not make her the target's sister. First use her children's godparents, especially outsiders with that patronymic, to seek her natal village and marriage entry; keep an origin suggested by sponsors apart from one stated in a marriage, and apply step 7's rival explanations. Verify index readings on the image and leave a sibling link open until independent evidence supports it [O1].","sources":["O1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-342-second-name","kind":"method","anchor":"**Test a lone second name against the spouse, age and other entries.** Do not force every second name into a father's given name ([metrical-book naming rules](russian-orthodox-metrical-book-recovery.md#9-treat-names-and-patronymics-as-hypotheses)). Keep each form with its entry and test whether it is a patronymic, a grandfather's name or a household name; a single occurrence does not choose among them. Match a householder to the last confession list on given name and age, then compare spouse, household and other entries before accepting the identity or parentage. In a reported sequence the same wife appeared with the man under his own patronymic and his father’s patronymic [O1]. Check the original image and keep a proposed intergenerational match provisional.","sources":["O1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-342-yard-plan","kind":"method","anchor":"**Use a numbered-yard plan as a bridge, within its list's scope.** Look for village plans and attached householder lists between the last confession list and the surviving registers. Record the date, archive locator, who the list includes, yard numbers and adjacency. Search construction-department files for approved plans. A reported householder list left other residents unenumerated, and yard adjacency did not settle a choice between households [O1]. Check all recorded forms of the name and the list’s coverage before drawing an inference from absence.","sources":["O1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-342-open-ends","kind":"method","anchor":"**Make the open ends the product.** Give every household of the last list a row, with the later couples it explains, supporting entries, conflicts and unresolved links. List households without a later family and later families without an earlier household, with candidates and the next check that could distinguish them. An unmatched row is an open question, not proof of extinction, migration or parentage. Leave [a sole surviving candidate](evidence-proof-judgment.md#hard-rules--apply-these-before-you-rule-the-load-bearing-directives) unresolved until a record or independent evidence identifies the relationship [O1].","sources":["O1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-f9dccc0cf130","kind":"method","anchor":"- **A surname is a hint, not an identifier.** Include entries without surnames [S1], look for different surnames across series [S2], and test the given name and patronymic against other men in the village [S3], [S4]. According to Kinprove’s case notes, the same priest used several surnames for one man, ruling out a change of clerk as the explanation [S5†].\n- **Build the identity key.** Start from the evidence/proof list of what does not depend on the name, and key each person in the village index by given name and patronymic, the spouse's given name and patronymic, the village and the ages. Record the surname only as a name form seen in that entry, written as the entry gives it.\n- **Test a second surname.** Consider an official or street name, a nickname, a father’s or grandfather’s name, a place of origin, a stepfather or father-in-law, or a branch surname [S3]. According to Kinprove’s case notes, another family continued using the disputed surname after the man appeared under it, so the overlap alone could not establish a renaming [S5†]. Compare [identifiers independent of the name](evidence-proof-judgment.md#techniques-that-work) before joining or separating the families.\n- **Test a church-servitor origin for an occupational second surname.** In 1722 the sons, grandsons, nephews and other kin living at churches, of priests, deacons, дьячки and пономари who had once served there but no longer did, were ordered into the poll tax and attached to the owner of the church's land or, where the pogost stood apart, to parishioners of their choice. [S64] A clerical family's kin could thus join a village's taxpayers under a surname such as Попов. Check the earliest census or revision for a church servitor or prosphora baker in the ancestor’s household or among the sons, then trace each branch across the tax and parish series [S63].\n- **Look for a cleric's son in any taxpaying estate.** Reviews of the clergy (разборы), held from 1703 and in every reign, took surplus clerics and their children into the army or the poll tax. [S73] When a peasant or town line begins with an unexplained surname such as Попов, look in nearby clergy tales and confession lists for a cleric matching the patronymic. Check the receiving estate’s revision and any consistory transfer order [S72], [S71].\n- **Date each form within the village.** Trace every bearer back through the censuses and revisions, test for a common ancestor, then follow each branch through the series in date order [S63]. For odnodvortsy, check the 16th- and 17th-century frontier service groups (including children of boyars, streltsy and reitars) and search service and census records under the surname before the first revision [S70], [S69].\n- **Search the name behind the surname.** Match the root to everyday and baptismal forms of both parents’ names [S2], including forms such as Нефёд/Мефодий and Абросим/Амвросий [S66], [S67]. A report traces Аринушкины to sons of Ирина (Арина) whose father was known, so a maternal name need not indicate unknown paternity [S68]. Test the proposed descent in the revisions.\n- **Compare forms within each series.** Trace spelling and surname changes separately in revision tales, recruit lists, confession lists and parish books. Search each series under every form before dating a change [S63], [S2].","sources":["S1","S2","S3","S4","S5","S64","S63","S73","S72","S71","S70","S69","S66","S67","S68"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3ca72e3c6f78","kind":"custody","anchor":"Most of the economic notes are in RGADA, f. 1355, of 2,534 files. [S88 @2026-11-15]","sources":["S88"],"checked":"2026-11-15","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ef5fa4055a7b","kind":"platform-ui","anchor":"The VGD forum's genealogical map (forum.vgd.ru/map/) carries marks that members leave on the places they research, with forum topics attached, and VGD's guide suggests writing to such a member, who may know the local sources or, in a small village, share your pedigree. [S90 @2026-11-15] Read the marks and their topics for the village first, write to a member only after the gate, and treat a shared village as a lead to compare records for the households [S89 @2026-11-15].","sources":["S90","S89"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-efc984f3b780","kind":"custody","anchor":"The Tula household cards of 1910–1912 are op. 3 of f. 4 (the guberniya zemstvo board) at the State Archive of Tula Oblast, which reported scanning more of them in October 2026. [S80 @2026-11-15] A blogger places the Moscow guberniya household censuses and family lists of 1869–1899 in ЦГА Москвы, f. 184, opisi 10 and 12, found by volost. [S77 @2026-11-15]","sources":["S80","S77"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-d3a2ec28f3a5","kind":"method","anchor":"- **Same-named children can be twins.** A reported pair of boys baptised Василий had separate deaths even though only one entry identified a twin [S91]. Check both entry numbers against the running count, look for близнецы or двойня, and search for both burials before merging apparent duplicates [S91], [S92].","sources":["S91","S92"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b6661f31b37b","kind":"method","anchor":"**An adopted «сын» can be a son-in-law.** A 2024 study, of which only a summary was read, finds that in Arkhangelsk province in the second half of the 19th and the early 20th century a son-in-law whom the bride's parents took into their house after the wedding was formalised as their adoptee, by contracts, wills and other agreements, with a right to inherit after their death. [S93] A «сын» who first appears as an adult, or a «приемыш» married to a daughter of the head, may be a son-in-law: look for his marriage to a daughter of the household and for an agreement or consent from his living parents [S94] before you count him as the head's son by birth, and look for his birth family in the lists from before he joined the household.","sources":["S93","S94"],"checked":null,"stated_as":"observation","review":"reviewed"}
