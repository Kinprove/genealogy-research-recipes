claims:
  - {"id":"C-choose-the-ceremony-and-register-route-1","kind":"method","anchor":"Compare the ceremony date with the spouse’s embarkation and arrival dates and with marital status on the passport and arrival record. Run two searches where the dates or statements are ambiguous. In Italy, look for the parish or civil act showing the representative who appeared for the absent spouse. In the destination country, look for a ceremony with both spouses present. Use travel documents to choose which act to retrieve first, and use the act to settle how the marriage occurred. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-choose-the-ceremony-and-register-route-2","kind":"example","anchor":"Include prewar years in an Australia-linked search when the family chronology allows. The published case documents a 1937 Italian parish ceremony with the emigrant in Australia. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-read-the-mandate-and-endorsements-3","kind":"method","anchor":"Open the community companion guide alongside the documented case to identify the file stages. In the procura speciale, distinguish authority to contract marriage with the named spouse, authority to request banns and authority to handle civil transcription. Classify a power for banns by its actual wording before treating it as a power to marry. Record the proxy and principal separately, and copy the signer’s declared residence apart from the place of execution. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-mandate-and-endorsements-4","kind":"method","anchor":"Trace execution, local official’s attestation, consular legalization and any foreign-ministry authentication as separate events. Note which signature each endorsement authenticates. If the filed paper is certified as conforming to an original in a consular notarial archive, classify it as a certified copy and use the named consulate and repertory number to locate the original. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-read-the-mandate-and-endorsements-5","kind":"historical","anchor":"For a mandate governed by the 1917 Code of Canon Law, check canon 1089 for a special mandate to marry the specified person and the principal’s signature plus the applicable countersignature route. Check for the local parish priest or Ordinary where the mandate was made, a priest delegated by either, or at least two witnesses. Check any applicable diocesan statutes. Under canon 1091, read the officiant’s statement for authentication and look for evidence of just cause and the Ordinary’s permission where time allowed. [S1] [S2] [S4]","sources":["S1","S2","S4"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-banns-and-the-overseas-response-6","kind":"method","anchor":"In the parish request for civil banns, look for an insertion or footnote naming the special procurator. Compare the comune’s banns request and local completion certificate with any request for the other spouse’s residence. Where the legal regime required both places, a certificate from one comune covers only the posting it attests. Use a consular stamp to locate the office and check the declared residence separately. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-follow-banns-and-the-overseas-response-7","kind":"method","anchor":"If an overseas request was returned without banns, look for the consular dispatch and its enclosures. In the published Victoria case, the returned request carried a negative register-search certificate. Record the issuing office, name queried and the actual search dates before using any negative certificate. Compare the local completion date, dispatch, incoming protocol date and ceremony date to distinguish time spent waiting on the overseas reply from an unexplained gap. [S1] [S2]","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-trace-the-parish-act-into-civil-transcription-8","kind":"historical","anchor":"In the parish act, read the handwritten appearance clause and the groom’s signature line, including on a Padua model XV form. If an ordinary banns line is struck through, look for the local certificate and for later documentation of any incomplete banns. Check a separate transcription notice where one was made, recording its number, the church and priest, and the ceremony date and family details. The historical notice procedure in article 13 of Law 847/1929 applies to marriages it governed that lacked the prescribed banns or dispensation. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-trace-the-parish-act-into-civil-transcription-9","kind":"historical","anchor":"If the file has an avviso of intended transcription, follow any municipal and returned consular attestations separately. The 1929 law specifies a municipal notice. In the published interwar case, a returned form also attests posting at the consulate. Read the signatory and replacement wording for the place of posting even where the form was printed for the comune. Use a stated residence as a historical residence observation and the consular office as a locality lead. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-trace-the-parish-act-into-civil-transcription-10","kind":"method","anchor":"Check the relevant Part II transcription and its supporting papers when the parish act identifies a ceremony intended to have civil effects. Compare the identifying details in the mandate, birth extracts, banns, ceremony act and transcription. Preserve the actual ceremony date separately from the transcription date and record who made each copy or entry. [S1] [S2] [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
