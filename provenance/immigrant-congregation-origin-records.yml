claims:
  - {"id":"C-5d2907194826","kind":"unclassified","anchor":"Use this recipe when U.S. civil, census, passenger or naturalization records name only a country or region (\"Germany\", \"Prussia\", \"Bavaria\") and the family's U.S. residence is known. The recipe has three parts. First, choose candidate congregations by language community, dates and address. Then work each candidate's registers past index misses to the original image. If the registers have not been filmed, trace the congregation's present-day successor or custodian.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e37eec221724","kind":"unclassified","anchor":"For German-speaking Protestant immigrants, the main finding aid is Roger P. Minert's abstract series *German Immigrants in American Church Records* (GIACR). It is published in state volumes, such as the Indiana volume Everett uses. Each volume has a name index at the back and a table of contents arranged by place and congregation. The rest of this recipe calls it \"the series\". [S1], [S2], [S3]","sources":["S1","S2","S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-e8ccaf37fac0","kind":"unclassified","anchor":"- Searching only the church nearest the census address, then treating a miss there as absence.\n- Ignoring ethnic or national parishes, and the dates when congregations were founded or split.\n- Trusting a miss in an abstract's name index, or stopping at the abstract.\n- Assuming the congregation's historical name, and its custodian, are still current.\n- Expecting every register type and every confession to give a hometown.\n- Filing one hometown statement as proven identity.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-c1fc171cbac1","kind":"unclassified","anchor":"1. Date each U.S. residence from the census and city directories. Record the street address where you have it. The state tells you which volumes of the series to open. A state can span several volumes, so open every volume that covers the town. The town and address tell you which congregations to test in step 2. [S1]\n2. Gather context from other sources and family records:\n   - spelling variants\n   - spouse, children, siblings and parents, with approximate birth years\n   - religion\n   [S1]\n3. Keep this context in a list. In step 4 you will need it to recognise an entry that the index missed.","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-002437410efb","kind":"method","anchor":"Identify congregations that served the family’s language community, even beyond the immediate neighbourhood. Allen suggested checking an Italian-speaking church three miles away after a search of a Polish church three houses from an Italian family’s home [S5], [S6]. The account does not report a register hit. The Archdiocese of New York explains that national parishes served immigrants from a particular country in their own language [S8].","sources":["S5","S6","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8f2999093040","kind":"method","anchor":"- **Language and community.** Include both territorial parishes and congregations formed for an immigrant community [S8].\n- **Founding date.** Check that each candidate existed on the event date. In Castillo’s Manhattan search, only one of two German-serving parishes had already opened [S4].\n- **Splits and offshoots.** Date the formation of the new congregation. Allen described Polish worshippers attending a German church before a separate congregation formed [S5], [S6]. Search the parent register for earlier events and check both sets around the transition.\n- **Address.** Compare the dated city-directory address with the area each remaining candidate served [S4].\n- **Custodian or successor**, filled in during step 5.","sources":["S8","S4","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-8693767ae551","kind":"unclassified","anchor":"**Catholic cases:** list the diocese's parishes and other Catholic institutions from the printed historical volumes of the *Official Catholic Directory*. The series began in 1817 as the *Laity's Directory to the Church Service*. It did not appear every year at first (1817, 1822, then from 1833), and the *Official Catholic Directory* title dates from 1912. No volume exists for 1818–1821 or 1823–1832, so for those years build the parish list from other diocesan sources. In her 2017 talk, Castillo said the printed volumes carry historical parish information that the online version lacks. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fd529b70a421","kind":"historical","anchor":"For Spanish immigrant families in Carondelet, south St. Louis, check Our Lady of Covadonga, founded in 1915 [S13], [S14]. The library finding aid lists roll 100, item 4 (Family History Library film 1887440), for baptisms dated 1915–1931 and marriages dated 1915–1927 [S14]. Match the sacrament’s year range to the event date.","sources":["S13","S14"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-e2899bc84e75","kind":"historical","anchor":"For Spanish immigrant families in early twentieth-century New York City, add Manhattan’s Our Lady of Guadalupe (229–231 West 14th Street, founded in 1902) to the baptism and marriage search [S13], [S15]. Check each register’s year range against the event date.","sources":["S13","S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d85ba78efb54","kind":"unclassified","anchor":"**Places with no resident clergy:** visiting or circuit clergy may have kept the entries. Find out whom they reported to and where their journals or logs are now held. [S4]","sources":["S4"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-925d26d46556","kind":"unclassified","anchor":"In each candidate congregation, search the immigrant and their relatives. Also search neighbouring congregations, and places where siblings, children or parents settled. A relative's entry may be the one that names the hometown. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-63af2acd1f95","kind":"method","anchor":"- **Baptisms of U.S.-born children.** Read the parents’ birthplace fields, distinguishing each parent’s origin from the child’s birthplace [S2], [S3].\n- **Confirmations.** Copy the confirmand’s stated birthplace and birth date when given [S2], [S3].\n- **Marriages.** Copy the place given for each spouse and distinguish town, parish and district. Minert’s 1875 entry gave places for both spouses but no ages [S2], [S3]. Use those places for the next register search and label any inferred birth years as estimates.\n- **Membership or soul registers.** [S1]\n- **Deaths and burials.** Distinguish birthplace, death place, age and date of death. If you derive a birth date from the age at death, label it as calculated [S2], [S3].","sources":["S2","S3","S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-680225f1f338","kind":"method","anchor":"If a U.S. vital record for a Polish immigrant gives only a country or region, start the hometown search with the immigrant’s marriage and their children’s baptisms in candidate U.S. Polish Catholic parishes [S11], [S12]. Record the place stated for each spouse or parent and retain the broader civil label alongside it.","sources":["S11","S12"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-f286679704c9","kind":"unclassified","anchor":"- The series covers Protestant congregations. Minert says this means \"any kind of Protestant\", and the publisher's listings include Lutheran, Evangelical, Reformed and German Methodist congregations. [S3]\n- Minert reports that German Catholics often joined existing Irish- or French-dominated parishes. Those registers rarely name a German hometown and usually give only a Latin country term. A miss in such a register says nothing about where the family came from. Go to the German-language congregations of relatives, other register types, or other jurisdictions. [S3]\n- For pre-Revolutionary Pennsylvania Germans, Minert says records rarely give a hometown. He calls the usual \"from the Palatinate\" label usually wrong. Record that label as an unverified regional attribution, and keep looking for an entry that names a town. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aa3e2e6f3633","kind":"unclassified","anchor":"Minert says the series includes only people his team could show were born in Europe. A U.S.-born child is not indexed under their own name, so search the immigrant parents' names. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-9edb3b88729f","kind":"method","anchor":"1. Open the table of contents at the place and congregation of known residence.\n2. Browse every entry, matching on the context from step 1 (given names, birth years, spouse, children).\n3. Test visually confusable letters against the given names, dates and relatives. In Everett’s example, an *n* had been indexed as *u*, so searching the expected surname missed the entry [S1].","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-b06b0097a492","kind":"unclassified","anchor":"Next, find the heading of that congregation's section, which may be many pages earlier. Copy its U.S. place, county and state, and the source reference it gives for the original. Everett describes this reference as a FamilySearch film number or an Ancestry reference. At least one section instead cites a denominational archive microfilm (ELCA), so copy the reference as printed. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5fa26c43f039","kind":"method","anchor":"- the correct spelling\n- details absent from the abstract, such as marital status, exact birth date, birthplace and residence, keeping each in its own field\n- other entries for the same family [S1]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-996bdb8da8df","kind":"method","anchor":"If the American surname gives no reliable Swedish origin, copy the stated birth parish and birth date from the Swedish-American congregation’s membership register. ArkivDigital’s 2022 demonstration used those fields to search for a Swedish household under the emigrant’s given name [S7]. Compare the household with the U.S. evidence before linking the people.","sources":["S7"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d2be6f3f943e","kind":"portal-availability","anchor":"For a candidate Swedish-American Lutheran congregation, open Ancestry’s ELCA [*Swedish American Church Records*](https://www.ancestry.com/search/collections/61584/) and check for membership volumes covering that church and the relevant years [S21 @2026-11-22], [S22 @2026-11-22].","sources":["S21","S22"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1de61a2b037c","kind":"method","anchor":"In the membership image, look for a Swedish birth parish and the stated year of arrival in America [S20], [S21], [S23]. Record the arrival year separately from the church admission date. If the entry gives an arrival year and no parish, use the year to narrow the passenger-list search and keep the parish unresolved.","sources":["S20","S21","S23"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-52325f5c89ac","kind":"custody","anchor":"If you cannot access a candidate Swedish-American register online, check the Swenson Swedish American Research Center’s church-record microfilm catalogue by state, town and congregation, including California congregations when the immigrant lived there [S17 @2026-11-21]. Match the register type and years, then copy the film number and any reel number.","sources":["S17"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7bcbd2695e43","kind":"custody","anchor":"If you cannot inspect the matching film, request a staff search for the immigrant’s Swedish parish of origin [S16 @2026-11-21], [S18 @2026-11-21]. Use the Center’s Genealogy Research Request Form and follow its mailing and payment instructions [S18 @2026-11-21], [S19 @2026-11-21]. Give the name to search and the U.S. settlement [S19 @2026-11-21]. Specify the candidate congregation, register type, years and film reference in the research question.","sources":["S16","S18","S19"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d29198a81c39","kind":"unclassified","anchor":"1. Use the candidate congregation table to select the U.S. church and relevant years.\n   Check which membership and other register volumes are actually available. The\n   demonstration covers selected congregations and says record types vary between\n   them; its historical counts do not establish current coverage. A missing church,\n   year or image remains unsearched or unavailable rather than a person-level no-hit.\n2. From the image, retain the American name, literal birth place and date, and any\n   spouse, children, admission and migration statements with their own field labels.\n   Keep the original place spelling beside a separately justified Swedish parish\n   reading; do not turn a residence or church-admission date into a birth date.\n3. Resolve numeric date order before using an exact-date search. The presentation\n   warns that these books can use either American month/day or European day/month\n   order [S7]. Check this entry's headings and unambiguous dates in its context;\n   never decide from the book's U.S. location alone. Preserve the literal date and\n   the basis for its reading. If both readings remain possible, retain both as\n   search candidates and leave the date unresolved; a convenient hit does not settle it.\n4. Use the parish/date candidates and supported given-name or patronymic variants\n   to locate Swedish entries. Inspect the original birth entry and household page,\n   comparing parents, household and subsequent dated observations. Keep an index\n   result separate from its image. Use the [Swedish household workflow](scandinavian-parish-record-recovery.md)\n   to follow the household and moving references, and retain discrepancies between\n   the U.S. membership and Swedish records.","sources":["S7"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-aeec7ec22a82","kind":"unclassified","anchor":"Everett says that some sections were abstracted from books held by a local church or church archive. For those sections, the original can only be seen at that local church or archive. If the section heading gives no film or Ancestry reference, request the original from its custodian. [S1]","sources":["S1"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-da8e68f2afdf","kind":"custody","anchor":"1. **Trace the name and affiliation through dated directories or congregational histories.** Minert described an Illinois German Evangelical Lutheran church that he located under the name Trinity Lutheran [S3 @2026-11-19]. Keep the renaming date open until you find a dated record.\n2. **Check denominational holdings.** For a Lutheran Church—Missouri Synod congregation, use Concordia Historical Institute’s guide to church records and historical annuals [S9 @2026-11-19]. For an Evangelical Lutheran Church in America predecessor, use the ELCA regional directory to identify the archive serving the relevant synod and years [S10 @2026-11-19]. Ask which registers or microfilms it holds and what copying is permitted.\n3. **Contact the congregation directly.** Ask whether its books are digitised and whether staff can search for a specific entry. [S3]\n4. **Log each request:** the custodian asked, the date, what was requested, and the answer.","sources":["S3","S9","S10"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-3162be4c64ef","kind":"unclassified","anchor":"1. **Candidate congregation table:** language community, founding and split dates, address fit, and custodian or successor.\n2. **Entry log by register type:** abstract locator, film, archive or Ancestry reference, image locator, literal stated origin place, and the person whose entry it is.\n3. **Not-searched or inaccessible list:** each congregation or register left unsearched, with the reason.","sources":[],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-1eca79682b9d","kind":"unclassified","anchor":"- One hometown statement in one entry is a lead. Before filing identity, correlate it with the rest of the family's evidence and with origin-side records.\n- Minert says the series does not confirm entries against church records in Germany. [S3]","sources":["S3"],"checked":null,"stated_as":null,"review":"pending"}
