claims:
  - {"id":"C-c12f7b786eac","kind":"portal-availability","anchor":"Use the personal index in SukuHaku to find a candidate in Johanna Aminoff-Winberg's *Finska flyktingar i Sverige under stora ofreden: flyktingförteckningar*. Carry the reference to the list entry. Use the dissertation's source discussion to identify the underlying return by year and record creator [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1ffe162dc56e","kind":"method","anchor":"Copy the named recipient, place labels, date, stated dependants and any number of children or family members with its original meaning. When probate is missing, use an explicit child count for the recipient's recorded household or care arrangement. Establish individual kinship in other records. The author reports using a widow's refugee-aid entry this way [S1†]. The commission's returns often give a count alongside the household head's name, and the study documents mistakes in reported widowhood [S2].","sources":["S1","S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-a4fc1716f2a5","kind":"method","anchor":"Follow the return's year and creator into the underlying archive. Aminoff-Winberg locates 1712–1713 rolls in Stockholm City Archives under *Inkvarteringskommissionens arkiv*. For the 1715 central roll she points to *Flyktingdeputationen 1712. Räkenskaper med verifikat 1715–1716* in the revised accounts. For the Härnösand 1715 return and the 1714 and 1716 central lists, she points to *Deputerade för flyktingmedlens utdelande 1712*, ÅK 449 [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dda216e7f026","kind":"method","anchor":"Distinguish the place of payment, the stated Finnish home, and any recorded Swedish residence. A receipt signed in Stockholm places the payment. For a Swedish residence, check the local refugee or diocesan list and then the corresponding parish entries. Use the dissertation's source chapter to compare the relevant commission and local lists. If the central list is silent, continue with those local records because relief lists and parish books cover different households [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-dd38553e6fa9","kind":"method","anchor":"Use the [parish household workflow](scandinavian-parish-record-recovery.md) on both sides. Record Swedish burials and Finnish baptisms as individual dated observations. Use a Finnish baptism for a child previously documented in Sweden to bound that child's return when the entry confirms their identity. Keep the timing of the rest of the family's movements open until each member is placed. Preserve conflicting names or statuses for [identity review](evidence-proof-judgment.md) [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-07d03502e24f","kind":"method","anchor":"For same-named clergy, compare the numbered *Ylioppilasmatrikkeli* entries by parentage, parish appointment and refugee-era dates before attaching a burial or relief entry. Follow each numbered biography's record references for the comparison [S5] [S6].","sources":["S5","S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-3038775b681a","kind":"example","anchor":"Keep the Stockholm death of the Laitila rector (no. 4100) separate from the Kalanti assistant's trace in the Strängnäs diocese through 1716 (no. 4300), a distinction also reported in the community post [S1†] [S5] [S6].","sources":["S1","S5","S6"],"checked":null,"stated_as":"observation","review":"reviewed"}
