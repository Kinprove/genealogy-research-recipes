claims:
  - {"id":"C-0ab09d4e3590","kind":"platform-ui","anchor":"Enter the permitted pedigree and pairwise cM in BanyanDNA. Represent each known relationship in the project. Enter each measured pair under the two people compared, including pairs involving additional testers when permitted. Keep a local record of the provider and reporting basis for each value. According to the developer interview, comparisons from several testing sites can be entered into the same project [S1† @2026-11-22]. Check their reporting basis with [DNA comparison controls](dna-comparison-controls.md) before combining them [S3 @2026-11-22].","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"observation","review":"reviewed"}
  - {"id":"C-5a6fab3d9d6f","kind":"platform-ui","anchor":"In the Calculations panel, run validation against the proposed pedigree. Compare each pair’s observed cM with the simulated average and spread. Read flags as a cue to inspect the comparison and its documented paths. Recheck the entered value, the two profiles and the relationships represented, especially where more than one pair challenges the same placement [S2 @2026-11-22] [S3 @2026-11-22].","sources":["S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f5e8fcfeb56c","kind":"method","anchor":"Read the result as conditional on the paths represented in the project. Where endogamy likely created paths beyond the oldest documented ancestors, leave those paths unresolved. Record whether the model accounts for the extra sharing before using the result to choose a placement [S2].","sources":["S2"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5c0ad11596bf","kind":"platform-ui","anchor":"Create separate hypotheses for the proposed positions of the person whose placement is uncertain, and run the hypothesis calculation. Compare the relative scores only across the placements tested in that run. Investigate the higher-scoring placements using records or independent comparisons that could distinguish them. Keep the tested alternatives and the unresolved relationships with the run notes [S3 @2026-11-22].","sources":["S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
