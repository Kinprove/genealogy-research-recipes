claims:
  - {"id":"C-9946d8d1ebcb","kind":"method","anchor":"[S2], [S7], [S8]","sources":["S2","S7","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-fbac132a4a4f","kind":"method","anchor":"- **Write the locality list first.** Before searching, list the ancestral place's jurisdictions: civil, parish, court or district, and region. Use the list for locality searches and when scanning tables of contents. [S12]\n- **Search the surname, then the place with event terms.** Start with a surname search for articles about the family. Then search the place combined with record-type or topic terms. For a death, try death, died, burial, probate, will and cemetery. An article is filed under whatever title its author chose. [S8]\n- **Don't search an individual's full name; search the topic.** This does not contradict the surname search above. Articles rarely name a particular ancestor in the title, so a query for one individual's name mostly returns nothing. Presenters give two worked examples: a county with \"churches\" or \"ministers\", and a town with \"probate\". [S9], [S14], [S15]\n- **Keep queries short.** Each extra keyword narrows the results. A 2016 presenter said PERSI accepts asterisk wildcards. That describes an earlier interface, so test whether wildcards work in the current ACPL search before relying on them. [S7]\n- **Don't search only the target place's own journals.** Material about one place can be printed in an unrelated region's periodical, for example as filler pages. Use a cross-periodical index. [S1], [S2]\n- **Follow cross-references,** such as a region pointing to its sub-regions, through to further entry numbers. [S13]\n- **Copy any qualifier printed after a place name exactly.** Examples are Kr. (Kreis, district) or an abbreviation for a cultural or topographical region. Resolve the qualifier in the Meyers gazetteer, which separates same-named places by Kreis, before tying the article to one place. In the worked example, one of four like-named places matched the printed district. [S11]\n- **Treat an entry marked Rez. (Rezension) as a book review.** It points to a separately published book. Look for holdings of that book, for example in WorldCat. [S11]\n- **Track authors.** Note the author of any relevant article and add that name to later surname searches. Authors often write more than one article about the same family or area. [S10], [S12]","sources":["S12","S8","S9","S14","S15","S7","S1","S2","S13","S11","S10"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-789e2b89cfc7","kind":"unclassified","anchor":"A hit list is a list of citations to work through, not a set of findings. [S3], [S7], [S10], [S14]\n- **Try retrieval routes and log each one.** Presenters name these routes:\n  - an online copy found by searching the article title\n  - the publisher or society\n  - other repositories, such as FamilySearch holdings or a state memory project\n  - WorldCat holdings and interlibrary loan\n  - a copy order from ACPL. One presenter treats this as the fallback when no other copy turns up. The presenter describes emailing the citation to ACPL for a copy quote [S2]. ACPL's contact page, checked 2026-11-07, confirms <genealogy@acpl.info> for the Genealogy Center. [S20] Ask for the current article-order procedure and quote rather than treating the old form or fee as current.","sources":["S3","S7","S10","S14","S2","S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c8545cfe8b5","kind":"unclassified","anchor":"[S2], [S3], [S6], [S7], [S8], [S9]\n- **Confirm ACPL's current order terms before relying on them.** Presenters in 2021–22 mentioned these terms, and none has been confirmed as current:\n  - a fee per order form (S14)\n  - about four to six weeks' turnaround (S8)\n  - staff sometimes checking whether the person is named (S14)","sources":["S2","S3","S6","S7","S8","S9","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8a58b480146c","kind":"unclassified","anchor":"[S8], [S14]\n- **Check each holding volume by volume.** Library and digitized runs often have gaps. A digitized run only shows the copies one repository held, and Google Books results do not list volumes in order. Record which volumes and issues each holding actually has. [S5]\n- **Check the volume itself.** Once you have the volume, also check its table of contents and any surname index for the volume or issue. [S12]","sources":["S8","S14","S5","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ab4ac5cf99ef","kind":"unclassified","anchor":"If a PERSI heading is missing from the cited issue's table of contents, first confirm the journal,\nvolume and issue, then inspect the complete cited issue for the indexed subject. The ACPL\npresentation explains that indexers sometimes create a title for an untitled passage. Preserve\nthe index heading separately from the printed passage and its page locator; a TOC miss alone\ndoes not close the enquiry. [S16]","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-76310d00c8f4","kind":"unclassified","anchor":"When the citation or inspected article suggests continuation in another issue, identify the\nadditional parts in the copy request. If the extent is unclear, ask the holder whether it\ncontinues and which parts the request covers. Record each supplied or still-outstanding part;\none indexed citation or one received copy does not establish that every instalment was obtained. [S17]","sources":["S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ada4fe89352d","kind":"portal-availability","anchor":"For Russian newspapers and provincial gazettes, look for a full-text search of the recognised page text, or go to the paper run. Full text searches every recognised word, not only the terms an index recorded. Yandex's Поиск по архивам (yandex.ru/archive) searches text that its neural networks recognised; on 2026-11-15 its newspaper projects covered «Вечерняя Москва», the periodicals of 1941–1945 and «Советский спорт» from 1922, and viewing documents needed a signed-in account [S21 @2026-11-15]. In February 2025 it added «Известия» for 1917–2024 in full text and named diocesan gazettes and «Русский инвалид» among its other periodicals [S22 @2026-11-15]. For Siberia and the Far East, Tomsk State University's library runs PRO Сибирь, with more than 120,000 open-access sources, periodicals and manuscripts among them [S23 @2026-11-15]; a family historian recommends both services and PRO Сибирь's keyword search [S24 @2026-11-15]. Search an event, place or surname instead of reading issue by issue, and read the page image of every hit. Recognised text misreads, so a miss there is not a negative.","sources":["S21","S22","S23","S24"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b2f2e249b9b2","kind":"custody","anchor":"A provincial gazette (губернские ведомости) can name individuals. A Tula genealogist lists printed lists of conscripts, voters and candidates for elected posts, and notices of property sales, awards and incidents, in «Тульские губернские ведомости»; when a run was missing online, library staff located the bound newspapers for one reader [S25 @2026-11-15]. The library holds the gazette, which ran until 12 April 1917, in print and on microfilm [S26 @2026-11-15]. Check which years of a gazette are digitised before searching, and plan a microfilm or paper search of the library's run for the rest.","sources":["S25","S26"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0b9f0cc50048","kind":"portal-availability","anchor":"Two library finding aids show which Russian newspapers are digitised and where. The Presidential Library's collection «Отечественная периодика в фонде Президентской библиотеки» (prlib.ru/collections/684567) listed 190 newspaper and 223 journal titles on 2026-11-16, from imperial runs such as «Правительственный вестник» (1869–1917) to Soviet ones, most of them in full text [S27 @2026-11-16]. The National Library of Russia's guide «Газеты в сети и вне её» lists digital copies of newspapers by title and by place of publication, has chronological, geographical and language sections, and points to printed newspaper bibliographies and the largest newspaper holdings for titles that are not online [S28 @2026-11-16].","sources":["S27","S28"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-42106809d4fc","kind":"method","anchor":"A family historian who recommends both reports that digitisation is slow and that a catalogue often says an issue can be read only in the reading room [S29]. Record such an issue as held but unread, not as lost, and note the reading room that holds it.","sources":["S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2cb7336a2858","kind":"historical","anchor":"- **Search GPAI as well for English-language periodicals of 1962–2001.** The Genealogical Periodical Annual Index is a separate printed index, published yearly from 1962 to 2001 and indexed by surname, location or topic [S36]. A Library of Congress guide, read in its 2009 capture, shows the depth changing by volume. Volumes 1–4 (1962–65) are arranged by broad subject, article title, principal surname, author and place. Volumes 5–8 (1966–69) are arranged by male personal name, place, subject and author. Volumes 13–30 (1974–91) are arranged by personal name (surname and given name), locality and topic. The guide lists volumes 9–12 as not yet published [S35]. A PERSI miss for those years says nothing about GPAI. Record which volumes you searched and how each was arranged, and don't treat a woman's name missing from volumes 5–8 as a negative. One presenter recommends GPAI for articles about the research area but calls it hard to use (partial read: transcript excerpts only) [S37].","sources":["S36","S35","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9a8be3a40c19","kind":"platform-ui","anchor":"- **Add PERSI's record types to place searches.** ACPL's PERSI handout lists the subject categories and record types PERSI uses: biographies, cemeteries, census, church, court records, deeds, directories, history, institutions, land, maps, military, naturalization, obituaries, passenger lists, school records, tax lists, vital records, voter lists, wills and other. Pair the place with each type that could record the event. Before narrowing, read the wording of the titles already in the results and take your next keywords from it, as the handout advises. [S31 @2026-11-16]","sources":["S31"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-53fb1baee013","kind":"method","anchor":"- **When the original record is lost, look for a printed transcription.** Society periodicals printed abstracts and transcriptions of local records, cemetery transcriptions among them, and PERSI indexes those articles [S33], [S34]. A transcription located through the index preserved information from records later lost in a fire, according to the ACPL account (partial read: transcript excerpts only) [S30]. Before reporting a destroyed record's content as lost, search the place with that record type. Cite and weigh what you find as a derivative of the lost original, not as the original.","sources":["S33","S34","S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d5a577a5528b","kind":"platform-ui","anchor":"- **Try retrieval routes in this order and log each one.** ACPL's PERSI handout puts the publisher first, a library that holds the periodical second and an ACPL order last, and says ordering from ACPL is not the fastest route [S31].\n  - an online copy found by searching the article title, or a digitized issue on the publisher's or society's own website\n  - **Privacy gate:** <!-- privacy-gate: contact --> A copy request to the publisher or society sends the user's name, contact details and the wanted citations to that publisher or society.\n  - the publisher or society, at the contact details PERSI lists for the publisher in its results; ACPL calls a request to the publisher typically the fastest way to a copy [S31 @2026-11-16]. If the society has dissolved, go to the library routes; do not trace a former editor or member.\n  - other repositories, such as FamilySearch holdings or a state memory project\n  - **Privacy gate:** <!-- privacy-gate: contact --> A loan request sends the user's name, library account details and the wanted citations to the user's own library and, through it, to the lending library.\n  - a library that holds the periodical. Search WorldCat for the periodical title, not the article title [S31], then visit a holding library or ask your own library for an interlibrary loan.\n  - **Privacy gate:** <!-- privacy-gate: contact --> An article order sends the user's name and email address, the requested mailing address and the wanted citations to the ACPL Genealogy Center by email.\n  - a copy order from ACPL, last (next bullet).","sources":["S31"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-803ef4a8551a","kind":"method","anchor":"ACPL staff add the publisher's own digitized issues and the WorldCat search by periodical title (partial read: transcript excerpts only) [S30]","sources":["S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3011d51bc9da","kind":"fee","anchor":"- **Order from ACPL on its current article order form.** Open the [article order form](https://www.genealogycenter.info/pdf/Article-ORDER-FORM.pdf) and enter the full PERSI article and journal titles for up to six articles per form [S38 @2026-11-18], [S32 @2026-11-18]. ACPL's handout directs you to email the completed form to <genealogy@acpl.info> and lists $7.50 per order plus $0.20 per copied page, excluding the cover or title page [S31 @2026-11-18]. The posted form calls for prepayment of the $7.50, asks you to allow six to eight weeks and rules out orders by phone [S32 @2026-11-18]. Confirm payment timing in the order inquiry before sending money.","sources":["S38","S32","S31"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-0e9e35a34ada","kind":"platform-ui","anchor":"- **Scan short PERSI surname hit lists before filtering.** Read the unfiltered titles for an unusual surname when the list is short. For a long list, put the place in the **Search Article Title** box under the **Article Title** column. Clear that filter and check the unfiltered list again when a relevant title could omit the place. [S38 @2026-11-18], [S39 @2026-11-18]","sources":["S38","S39"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9b74aecb246b","kind":"platform-ui","anchor":"- **Browse PERSI's subjects within the locality.** For an English locality, open **British Isles**, choose England under **Country**, and enter the place in **County or City/Town** [S38 @2026-11-18], [S40 @2026-11-18]. For a U.S. county, open **United States**, choose the state, then choose the county [S38 @2026-11-18], [S41 @2026-11-18]. Open each relevant subject in the results. A county search starts from the articles indexed to that county, so follow it with a title-keyword pass for a distinctive town name. [S39 @2026-11-18]","sources":["S38","S40","S41","S39"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-516bd27a2b94","kind":"platform-ui","anchor":"- **Use PERSI's Research Techniques to find how-to articles.** Start with the broad record type and narrow to the method or topic you need. Keep this search separate from a locality search for published records. [S38 @2026-11-18], [S39 @2026-11-18]","sources":["S38","S39"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9597e4cf43f7","kind":"platform-ui","anchor":"- **Use Article Title Keyword for distinctive places or events.** Enter a distinctive town name of at least five characters and scan the titles for the right town [S38 @2026-11-18], [S39 @2026-11-18], [S42 @2026-11-18]. When an event name brings up several occurrences, filter the **Article Title** column by the event year. Leave **Publication Year** alone and check the unfiltered titles for articles that omit the year. [S38 @2026-11-18], [S39 @2026-11-18]","sources":["S38","S39","S42"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-db7b4d44be4d","kind":"portal-availability","anchor":"- **Search PERSI where it is hosted now.** Start with ACPL’s free PERSI search [S18 @2026-11-19]. In the published descriptions checked, ACPL staff compile PERSI, and this copy is the larger one. The archived Findmypast description lists a second copy with fewer entries but images of some articles [S19 @2026-11-19]. Check access and article coverage on the current collection page. Talks recorded before 2022 describe earlier interfaces.","sources":["S18","S19"],"checked":"2026-11-19","stated_as":"observation","review":"reviewed"}
  - {"id":"C-16ddc98e6911","kind":"method","anchor":"- **German indexes: each one indexes to a different depth.** One presenter describes the three indexes the same way across four talks:\n  - **Der Schlüssel:** nine volumes, each with locality, subject and surname indexes. All three are drawn only from article titles. He adds that the surname index also covers authors and compilers. A surname that appears only inside an article, such as a name in an extracted town census, is not indexed. [S4], [S10], [S11]\n  - **Familiengeschichtliche Quellen:** a surname index only. He says it covers every surname in every article. [S4], [S13]\n  - **Quellenschau für Familienforscher:** separate town and district locality indexes, plus subject and surname indexes. He says that for the years it covers, it indexes surnames, places and subjects throughout the articles, not just in titles. [S4], [S13]\n- **Record each index’s years for the periodical.** In one comparison Der Schlüssel and Quellenschau both covered 1928–1931, but they indexed to different depths [S13]. Search each applicable index before ruling out a surname that appeared only within an article.\n- **Look up each numbered entry.** In Der Schlüssel, a locality entry does not list the surnames or subjects in the article, and a surname or subject entry does not give the places. The presenter shows item numbers that lead to the full entry. Looking up each number is the only way to see what the article covers. [S10], [S11]","sources":["S4","S10","S11","S13"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-abe43acca788","kind":"method","anchor":"- **Check the journal's own surname indexes before obtaining an issue.** When you have a likely journal, look for volume-level surname indexes on the publisher's site. Check the relevant volumes even after a PERSI surname miss. [S43]","sources":["S43"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-79862c523184","kind":"portal-availability","anchor":"For *San Diego Leaves & Saplings*, open **Indexes – Leaves & Saplings** on the [San Diego Records page](https://casdgs.org/San-Diego-Records/) and browse the public surname index for each relevant volume. Use the index locator to read the matching page in the society's member archive or in a library copy. [S44 @2026-11-20]","sources":["S44"],"checked":"2026-11-20","stated_as":"fact","review":"reviewed"}
  - {"id":"C-cee77be0261f","kind":"historical","anchor":"- **Search Jacobus for early U.S. genealogical periodicals.** Look up Donald Lines Jacobus's *Index to Genealogical Periodicals* in library catalogues under the original volumes (1932, 1948 and 1953) or the Genealogical Publishing Company reprint from Baltimore (chapter reading, partial read) [S48]. The 1978 reprint combines all three volumes in one [S49]. Use the periodical's publication year to choose a starting volume: volume 1 through 1931, volume 2 for 1931–1946, and volume 3 for 1947–1952. Check both volumes 1 and 2 for 1931. Search by surname, personal name or locality and check which issues of the periodical the volume indexed before interpreting a miss. Continue with PERSI or the journal's own index for years or titles outside Jacobus's coverage. [S49]","sources":["S48","S49"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-73b27014bcbb","kind":"method","anchor":"- **Find *Family Tree Magazine* articles by publication year.** Start with the index covering the year the article appeared (issue preview, partial read) [S45].","sources":["S45"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6bca06105636","kind":"portal-availability","anchor":"Open the public [combined 2000–2004 index](https://familytreemagazine.com/wp-content/uploads/2017/08/ftmindex.pdf) for those years [S47 @2026-11-21]. The publisher's [article index page](https://familytreemagazine.com/freebie/article-index-downloads/) offers the PDF bundle at no charge and requires an email address on its download form. Search the relevant index by subject and use the listed issue date and page number to retrieve the article from the back issue. [S46 @2026-11-21]","sources":["S47","S46"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-234eef27c307","kind":"platform-ui","anchor":"- **Use PERSI’s Other Countries route for Eastern European localities.** Start with **Other Countries** on the ACPL search menu, then work through the localities and subjects relevant to the research question. [S50 @2026-11-22], [S51 @2026-11-22]","sources":["S50","S51"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-91bd09e81cea","kind":"historical","anchor":"- **Use the journal title in effect for the issue.** For *The American Genealogist*, search *New Haven Genealogical Magazine* for volumes 1–8 beginning in 1922, *The American Genealogist and New Haven Genealogical Magazine* from July 1932, and *The American Genealogist* from 1937. For the early New Haven family sketches, also search *Families of Ancient New Haven*, the reprint title. [S54], [S55] Jacobus describes the early project and a later presenter mentions the title change (partial read of both transcripts). [S52], [S53]","sources":["S54","S55","S52","S53"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-728bcae443bc","kind":"historical","anchor":"- **Choose the right index for the Register.** For the *New England Historical and Genealogical Register*, which began in 1847 [S56], use the *Index of Persons* for volumes 1–50 [S58] or Jane Fletcher Fiske’s *Index of Persons* for volumes 51–148 [S59]. Use Margaret Wellington Parsons’s 1959 abridged index to volumes 51–112 for genealogies, biographies, places and topics. Check separate volume indexes for individual names when the consolidated person index is unavailable or the target volume lies outside its range. Jacobus describes the Parsons and volume-index routes in the chapter reading (partial read of the transcript). [S57], [S60] The Register’s start date also appears in the periodical-history talk (partial read of the transcript). [S53]","sources":["S56","S58","S59","S57","S60","S53"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-cbee86b29a19","kind":"method","anchor":"- **Check annual indexes in *The New York Genealogical and Biographical Record*.** Include the journal when looking for record abstracts about a New England as well as a New York family (partial read of the chapter transcript). [S57] Search the annual indexes by surname in volumes 1–25 and by individual name from volume 26. For witnesses in church-record transcripts, supplement Worden’s cross-volume index with the publisher’s full-text search. [S61]","sources":["S57","S61"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-d4948bb23c13","kind":"platform-ui","anchor":"- **Choose a New Jersey journal index by what you know.** For records published in *The Genealogical Magazine of New Jersey* (begun in 1925, partial read of the chapter transcript) [S57 @2026-11-22], use the society’s **Digital GMNJ Name, Subject, Author and Place Indexes** and check the volume range of the index you choose. Carry the resulting volume and page to the journal. [S62 @2026-11-22]","sources":["S57","S62"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-d48bfb321060","kind":"historical","anchor":"- **Search *The Virginia Genealogist* by its full-run index.** For Virginia records in the journal Jacobus identifies (partial read of the chapter transcript) [S57], look up John Frederick Dorman’s *Index to the Virginia Genealogist*, volumes 1–50, covering 1957–2006. Use the smaller volumes 1–20 index only for 1957–1976. [S63]","sources":["S57","S63"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b8585456adc4","kind":"historical","anchor":"- **Check the earlier title for Pennsylvania society articles.** In catalogues, search under the Genealogical Society of Pennsylvania’s *Publications* for volumes before 16 and *The Pennsylvania Genealogical Magazine* from volume 16 (1948). [S64] Jacobus recommends the society journal for Pennsylvania research (partial read of the chapter transcript). [S57]","sources":["S64","S57"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-ebef13298a9c","kind":"platform-ui","anchor":"- **Check the series’ own index after an Alvin miss.** For *Kungliga Vetenskaps Academiens Handlingar*, use the [academy’s archive links](https://www.vetenskapshistoria.se/samlingar/vara-arkiv/) to open the dedicated 1739–1854 search. Search by author or title words, or browse by year and page. [S66 @2026-11-22], [S67 @2026-11-22] For later volumes, match the series, volume and part in the [HathiTrust volume list](https://catalog.hathitrust.org/Record/008891274). Check its **Previous Title** link for earlier holdings. The two routes cover different runs, so an Alvin miss leaves digitization unresolved. [S65 @2026-11-22], [S68 @2026-11-22]","sources":["S66","S67","S65","S68"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4740846cbbf2","kind":"portal-availability","anchor":"- **Use Finnish interlibrary borrowing for an overseas yearbook article.** If Finna and online searches turn up no usable copy and you are a private customer of the National Library of Finland, send an article-copy request to the National Library of Finland using the full citation. Check for an existing digital copy first and plan for a paper copy through the service. [S65 @2026-11-22], [S69 @2026-11-22]","sources":["S65","S69"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-73a0594dcefb","kind":"method","anchor":"- **Check a yearbook bibliography for a named subject missing from an article title.** Read its annotations or subject entries alongside the titles and use the yearbook title, volume, year and pages to retrieve the article. For example, the Finnish Literature Society bibliography names Paul Widemark as the subject of Senni Timonen’s *Unohtunut Karjalan-kävijä* in *Kalevalaseuran vuosikirja* 57 (1977), pp. 195–215. [S70], [S71]","sources":["S70","S71"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-062aed540359","kind":"portal-availability","anchor":"- **Match the Finnish Historical Bibliography to the publication year.** Search its ARTO references in Finna. Melinda documents broad coverage from 1960 to about 2012, thinner coverage through 2018, about half of the 1950s, and scattered older entries. For publication years through 1990, also check the printed bibliography for the year in question, using [Doria’s volume listings](https://www.doria.fi/handle/10024/136376/browse?etal=-1&order=ASC&rpp=20&sort_by=1&starts_with=P&type=title). The early runs include 1544–1900, 1901–1925 and 1926–1950. Keep an ARTO miss within the limits of that coverage. [S72 @2026-11-22], [S73 @2026-11-22], [S77 @2026-11-22]","sources":["S72","S73","S77"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3ae41ab06c35","kind":"historical","anchor":"- **Use the specialist bibliographies for press and literary leads.** For Finnish press titles, look up Akseli Routavaara’s *Suomen sanomalehdistö 1771–1932* and Väinö Kaarna and Kaarina Winter’s *Suomen sanomalehdistön bibliografia 1771–1963*. Choose by publication year and carry any title and issue clues to the newspaper run. For literary studies from 1901–1925, look up Sulo Haltsonen’s *Luettelo suomalaisista kirjallisuudentutkimuksista 1901–1925* in *Kirjallisuudentutkijain seuran vuosikirja*, volume 11 (1954). [S72], [S74], [S75], [S76]","sources":["S72","S74","S75","S76"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-2b964723ed71","kind":"platform-ui","anchor":"- **Start a Finna search from the record’s classification.** Open a relevant ARTO citation and follow its **Luokitus** classification link. For medieval history, retain the complete displayed `\"z HIS:7\"` when testing the classification search. Compare it with the shorter `\"HIS:7\"` keyword query in your own Finna session and inspect the classification on candidate hits before accepting them. [S77 @2026-11-22], [S78 @2026-11-22], [S79 @2026-11-22]","sources":["S77","S78","S79"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3ece604187ed","kind":"platform-ui","anchor":"- **Check classifications against the edition for the work’s publication year.** Compare the printed schedules for 1981–85 and 1986–90 when a subject code disagrees with the article. Search the subject in words as well as by code. A Kanteletar article carries `HIS:17.2` in ARTO, even though the later schedule uses 17.2 for newspapers, periodicals and calendars. [S73 @2026-11-22], [S78 @2026-11-22], [S80 @2026-11-22], [S81 @2026-11-22]","sources":["S73","S78","S80","S81"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1c4c8418151e","kind":"platform-ui","anchor":"- **Search medieval-history codes across publication years.** Check the medieval-history class in the corresponding print volume and run the ARTO `HIS:7` search across the older years as well. The 1980 article *Ålands kyrka intill föreningen med Åbo stift* carries ARTO code `HIS:7.3`, so a search restricted to publications from 1986 onward can miss it. [S78 @2026-11-22], [S82 @2026-11-22]","sources":["S78","S82"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
