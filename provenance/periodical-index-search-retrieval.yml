  - {"id":"S37","kind":"video","urls":["https://www.youtube.com/watch?v=H4SDdOicYjQ"],"published":"2022-07-16","retrieved":"2026-11-16","access":"partial","rights":"All rights reserved (standard YouTube license)","basis":"Read only as transcript excerpts quoted by the community-technique extraction on 2026-11-16","entry_sha256":"73c555250562a725e1de1a38f5cedfc545d6a7b9828325dd1750787806de03ba","claims":["C-2cb7336a2858"],"review":"reviewed"}
claims:
  - {"id":"C-9946d8d1ebcb","kind":"unclassified","anchor":"[S2], [S7], [S8]\n- **Search PERSI where it is hosted now.** Start with ACPL's own free PERSI search on the Genealogy Center website. ACPL staff compile PERSI, and this copy is the larger one. Findmypast still carries PERSI, with fewer entries but images of some articles, so use it as a second search and for those images. [S18], [S19] Talks recorded before 2022 (S3, S7, S14) describe older Findmypast or HeritageQuest interfaces, so don't rely on their screen or access details.\n- **German indexes: each one indexes to a different depth.** One presenter describes the three indexes the same way across four talks:\n  - **Der Schlüssel:** nine volumes, each with locality, subject and surname indexes. All three are drawn only from article titles. He adds that the surname index also covers authors and compilers. A surname that appears only inside an article, such as a name in an extracted town census, is not indexed. [S4], [S10], [S11]\n  - **Familiengeschichtliche Quellen:** a surname index only. He says it covers every surname in every article. [S4], [S13]\n  - **Quellenschau für Familienforscher:** separate town and district locality indexes, plus subject and surname indexes. He says that for the years it covers, it indexes surnames, places and subjects throughout the articles, not just in titles. [S4], [S13]\n- **Record which periodicals and years each index covers, and search every index that overlaps.** The presenter's worked comparison for one periodical shows the three indexes overlapping for some years. Because each index works to a different depth, a miss in Der Schlüssel says nothing about what Quellenschau or Familiengeschichtliche Quellen hold for the same years. Search all of them. [S13]\n- **Look up each numbered entry.** In Der Schlüssel, a locality entry does not list the surnames or subjects in the article, and a surname or subject entry does not give the places. The presenter shows item numbers that lead to the full entry. Looking up each number is the only way to see what the article covers. [S10], [S11]","sources":["S2","S7","S8","S18","S19","S3","S14","S4","S10","S11","S13"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-fbac132a4a4f","kind":"unclassified","anchor":"- **Write the locality list first.** Before searching, list the ancestral place's jurisdictions: civil, parish, court or district, and region. Use the list for locality searches and when scanning tables of contents. [S12]\n- **Search the surname, then the place with event terms.** Start with a surname search for articles about the family. Then search the place combined with record-type or topic terms. For a death, try death, died, burial, probate, will and cemetery. An article is filed under whatever title its author chose. [S8]\n- **Don't search an individual's full name; search the topic.** This does not contradict the surname search above. Articles rarely name a particular ancestor in the title, so a query for one individual's name mostly returns nothing. Presenters give two worked examples: a county with \"churches\" or \"ministers\", and a town with \"probate\". [S9], [S14], [S15]\n- **Keep queries short.** Each extra keyword narrows the results. A 2016 presenter said PERSI accepts asterisk wildcards. That describes an earlier interface, so test whether wildcards work in the current ACPL search before relying on them. [S7]\n- **Don't search only the target place's own journals.** Material about one place can be printed in an unrelated region's periodical, for example as filler pages. Use a cross-periodical index. [S1], [S2]\n- **Follow cross-references,** such as a region pointing to its sub-regions, through to further entry numbers. [S13]\n- **Copy any qualifier printed after a place name exactly.** Examples are Kr. (Kreis, district) or an abbreviation for a cultural or topographical region. Resolve the qualifier in the Meyers gazetteer, which separates same-named places by Kreis, before tying the article to one place. In the teaching example, four places shared a name and the district qualifier identified which one was meant. [S11]\n- **Treat an entry marked Rez. (Rezension) as a book review.** It points to a separately published book. Look for holdings of that book, for example in WorldCat. [S11]\n- **Track authors.** Note the author of any relevant article and add that name to later surname searches. Authors often write more than one article about the same family or area. [S10], [S12]","sources":["S12","S8","S9","S14","S15","S7","S1","S2","S13","S11","S10"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-789e2b89cfc7","kind":"unclassified","anchor":"A hit list is a list of citations to work through, not a set of findings. [S3], [S7], [S10], [S14]\n- **Try retrieval routes and log each one.** Presenters name these routes:\n  - an online copy found by searching the article title\n  - the publisher or society\n  - other repositories, such as FamilySearch holdings or a state memory project\n  - WorldCat holdings and interlibrary loan\n  - a copy order from ACPL. One presenter treats this as the fallback when no other copy turns up. The presenter describes emailing the citation to ACPL for a copy quote [S2]. ACPL's contact page, checked 2026-11-07, confirms <genealogy@acpl.info> for the Genealogy Center. [S20] Ask for the current article-order procedure and quote rather than treating the old form or fee as current.","sources":["S3","S7","S10","S14","S2","S20"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-5c8545cfe8b5","kind":"unclassified","anchor":"[S2], [S3], [S6], [S7], [S8], [S9]\n- **Confirm ACPL's current order terms before relying on them.** Presenters in 2021–22 mentioned these terms, and none has been confirmed as current:\n  - a fee per order form (S14)\n  - about four to six weeks' turnaround (S8)\n  - staff sometimes checking whether the person is named (S14)","sources":["S2","S3","S6","S7","S8","S9","S14"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-8a58b480146c","kind":"unclassified","anchor":"[S8], [S14]\n- **Check each holding volume by volume.** Library and digitized runs often have gaps. A digitized run only shows the copies one repository held, and Google Books results do not list volumes in order. Record which volumes and issues each holding actually has. [S5]\n- **Check the volume itself.** Once you have the volume, also check its table of contents and any surname index for the volume or issue. [S12]","sources":["S8","S14","S5","S12"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ab4ac5cf99ef","kind":"unclassified","anchor":"If a PERSI heading is missing from the cited issue's table of contents, first confirm the journal,\nvolume and issue, then inspect the complete cited issue for the indexed subject. The ACPL\npresentation explains that indexers sometimes create a title for an untitled passage. Preserve\nthe index heading separately from the printed passage and its page locator; a TOC miss alone\ndoes not close the enquiry. [S16]","sources":["S16"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-76310d00c8f4","kind":"unclassified","anchor":"When the citation or inspected article suggests continuation in another issue, identify the\nadditional parts in the copy request. If the extent is unclear, ask the holder whether it\ncontinues and which parts the request covers. Record each supplied or still-outstanding part;\none indexed citation or one received copy does not establish that every instalment was obtained. [S17]","sources":["S17"],"checked":null,"stated_as":null,"review":"pending"}
  - {"id":"C-ada4fe89352d","kind":"portal-availability","anchor":"For Russian newspapers and provincial gazettes, look for a full-text search of the recognised page text, or go to the paper run. Full text searches every recognised word, not only the terms an index recorded. Yandex's Поиск по архивам (yandex.ru/archive) searches text that its neural networks recognised; on 2026-11-15 its newspaper projects covered «Вечерняя Москва», the periodicals of 1941–1945 and «Советский спорт» from 1922, and viewing documents needed a signed-in account [S21 @2026-11-15]. In February 2025 it added «Известия» for 1917–2024 in full text and named diocesan gazettes and «Русский инвалид» among its other periodicals [S22 @2026-11-15]. For Siberia and the Far East, Tomsk State University's library runs PRO Сибирь, with more than 120,000 open-access sources, periodicals and manuscripts among them [S23 @2026-11-15]; a family historian recommends both services and PRO Сибирь's keyword search [S24 @2026-11-15]. Search an event, place or surname instead of reading issue by issue, and read the page image of every hit. Recognised text misreads, so a miss there is not a negative.","sources":["S21","S22","S23","S24"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-b2f2e249b9b2","kind":"custody","anchor":"A provincial gazette (губернские ведомости) can name individuals. A Tula genealogist lists printed lists of conscripts, voters and candidates for elected posts, and notices of property sales, awards and incidents, in «Тульские губернские ведомости»; a newspaper run one reader needed at the Tula Regional Scientific Library was not digitised and took staff time to find on paper [S25 @2026-11-15]. The library holds the gazette, which ran until 12 April 1917, in print and on microfilm [S26 @2026-11-15]. Check which years of a gazette are digitised before searching, and plan a microfilm or paper search of the library's run for the rest.","sources":["S25","S26"],"checked":"2026-11-15","stated_as":"observation","review":"reviewed"}
  - {"id":"C-0b9f0cc50048","kind":"portal-availability","anchor":"Two library finding aids show which Russian newspapers are digitised and where. The Presidential Library's collection «Отечественная периодика в фонде Президентской библиотеки» (prlib.ru/collections/684567) listed 190 newspaper and 223 journal titles on 2026-11-16, from imperial runs such as «Правительственный вестник» (1869–1917) to Soviet ones, most of them in full text [S27 @2026-11-16]. The National Library of Russia's guide «Газеты в сети и вне её» lists digital copies of newspapers by title and by place of publication, has chronological, geographical and language sections, and points to printed newspaper bibliographies and the largest newspaper holdings for titles that are not online [S28 @2026-11-16].","sources":["S27","S28"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-42106809d4fc","kind":"method","anchor":"A family historian who recommends both reports that digitisation is slow and that a catalogue often says an issue can be read only in the reading room [S29]. Record such an issue as held but unread, not as lost, and note the reading room that holds it.","sources":["S29"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-2cb7336a2858","kind":"historical","anchor":"- **Search GPAI as well for English-language periodicals of 1962–2001.** The Genealogical Periodical Annual Index is a separate printed index, published yearly from 1962 to 2001 and indexed by surname, location or topic [S36]. A Library of Congress guide, read in its 2009 capture, shows the depth changing by volume. Volumes 1–4 (1962–65) are arranged by broad subject, article title, principal surname, author and place. Volumes 5–8 (1966–69) are arranged by male personal name, place, subject and author. Volumes 13–30 (1974–91) are arranged by personal name (surname and given name), locality and topic. The guide lists volumes 9–12 as not yet published [S35]. A PERSI miss for those years says nothing about GPAI. Record which volumes you searched and how each was arranged, and don't treat a woman's name missing from volumes 5–8 as a negative. One presenter recommends GPAI for articles about the research area but calls it hard to use (partial read: transcript excerpts only) [S37].","sources":["S36","S35","S37"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9a8be3a40c19","kind":"platform-ui","anchor":"- **Add PERSI's record types to place searches.** ACPL's PERSI handout lists the subject categories and record types PERSI uses: biographies, cemeteries, census, church, court records, deeds, directories, history, institutions, land, maps, military, naturalization, obituaries, passenger lists, school records, tax lists, vital records, voter lists, wills and other. Pair the place with each type that could record the event. Before narrowing, read the wording of the titles already in the results and take your next keywords from it, as the handout advises. [S31 @2026-11-16]","sources":["S31"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-53fb1baee013","kind":"method","anchor":"- **When the original record is lost, look for a printed transcription.** Society periodicals printed abstracts and transcriptions of local records, cemetery transcriptions among them, and PERSI indexes those articles [S33], [S34]. An ACPL staff member tells of a researcher who found a transcription of records that later burned (partial read: transcript excerpts only) [S30]. Before reporting a destroyed record's content as lost, search the place with that record type. Cite and weigh what you find as a derivative of the lost original, not as the original.","sources":["S33","S34","S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-d5a577a5528b","kind":"platform-ui","anchor":"- **Try retrieval routes in this order and log each one.** ACPL's PERSI handout puts the publisher first, a library that holds the periodical second and an ACPL order last, and says ordering from ACPL is not the fastest route [S31].\n  - an online copy found by searching the article title, or a digitized issue on the publisher's or society's own website\n  - **Privacy gate:** <!-- privacy-gate: contact --> A copy request to the publisher or society sends the user's name, contact details and the wanted citations to that publisher or society.\n  - the publisher or society, at the contact details PERSI lists for the publisher in its results; ACPL calls a request to the publisher typically the fastest way to a copy [S31 @2026-11-16]. If the society has dissolved, go to the library routes; do not trace a former editor or member.\n  - other repositories, such as FamilySearch holdings or a state memory project\n  - **Privacy gate:** <!-- privacy-gate: contact --> A loan request sends the user's name, library account details and the wanted citations to the user's own library and, through it, to the lending library.\n  - a library that holds the periodical. Search WorldCat for the periodical title, not the article title [S31], then visit a holding library or ask your own library for an interlibrary loan.\n  - **Privacy gate:** <!-- privacy-gate: contact --> An article order sends the user's name and email address, the wanted citations and any payment details to the ACPL Genealogy Center by email.\n  - a copy order from ACPL, last (next bullet).","sources":["S31"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
  - {"id":"C-803ef4a8551a","kind":"method","anchor":"ACPL staff add the publisher's own digitized issues and the WorldCat search by periodical title (partial read: transcript excerpts only) [S30]","sources":["S30"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-3011d51bc9da","kind":"fee","anchor":"- **Order from ACPL on its current article order form.** ACPL's handout, opened 2026-11-16 (the file is dated April 2023), says to email the completed form to <genealogy@acpl.info>; the articles and the fee statement come back by email. It gives the fee as $7.50 for up to six articles plus $0.20 a page, not counting the cover or title page [S31 @2026-11-16]. The form asks for the full article title as PERSI gives it and the journal title, takes six articles per form, accepts no phone requests and says to allow six to eight weeks. It was read in a 2024 Internet Archive capture because the live file refused automated requests on 2026-11-16 [S32 @2026-11-16]. Follow the payment instructions on the form you send: the archived form asks for the $7.50 in advance, and the newer handout does not say.","sources":["S31","S32"],"checked":"2026-11-16","stated_as":"fact","review":"reviewed"}
