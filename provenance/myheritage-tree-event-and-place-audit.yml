claims:
  - {"id":"C-01","kind":"platform-ui","anchor":"In Family Tree → Consistency Checker, choose the intended tree. Review flags for children born before a parent or long after a parent’s death, unusually young parents and large spouse age gaps. For a profile flagged at advanced age, verify the birth date and check for evidence of death before proposing a change to living status. Treat a flag, plotted event or unusual age as a lead to inspect the underlying entry. [S1 @2026-11-22], [S2 @2026-11-22]","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02","kind":"platform-ui","anchor":"Open Family Tree Timeline for the target profile and compare a parent’s age at each recorded birth against the family events shown. Use historical events as timeline context and trace a surprising date or a gap back to the supporting record. [S1 @2026-11-22], [S4 @2026-11-22]","sources":["S1","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"platform-ui","anchor":"Open PedigreeMap from the Family Tree menu, using More if your account groups it there. Choose the tree, anchor person and proximity filter. Select a country or locality and open the events at that location to get the involved profiles. Use event and time filters before interpreting a cluster. [S1 @2026-11-22], [S3 @2026-11-22]","sources":["S1","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-04","kind":"platform-ui","anchor":"Review available place warnings and trace each spelling, misplaced pin or ambiguous locality to its source. Open the [Country Coding audit](myheritage-country-coding-place-audit.md) for uncoded place names and misleading modern flags. [S1 @2026-11-22], [S3 @2026-11-22], [S4 @2026-11-22]","sources":["S1","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-05","kind":"platform-ui","anchor":"Use List view to sort or narrow the set of profiles for review. Use Pedigree view to follow direct ancestors compactly, or Fan view to compare how far their branches extend and which generation has a gap. Verify the fields available for sorting and filtering in the account. [S4 @2026-11-22], [S5 @2026-11-22]","sources":["S4","S5"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
