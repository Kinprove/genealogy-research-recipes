claims:
  - {"id":"C-a9ca9549479b","kind":"portal-availability","anchor":"If you know the town or commune, look it up in Genealogica’s [Localități](https://genealogica.ro/localitati) to see its listed sources [S19 @2026-11-22] [S23 @2026-11-22]. For the county route, start with the civil-register guide for Moldavia and Wallachia or Transylvania. The thematic catalogue lists the regional civil collections and the separate confessional series [S19 @2026-11-22] [S22 @2026-11-22] [S64 @2026-11-22] [S73 @2026-11-22]. The Moldavia and Wallachia collection distinguishes entries in Genealogica from links to external registers [S77 @2026-11-22].","sources":["S19","S23","S22","S64","S73","S77"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-romanian-eanr-civil-register-recovery-1","kind":"platform-ui","anchor":"Find the present-day commune alphabetically and then the historical village or town under it, as in the Giurgiu, Gorj and Galați lists [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22]. Read *azi* as the modern name attached to that row. Keep the commune, historical spelling and modern label. When a modern name is absent, check the historical labels under the commune.","sources":["S1","S2","S3"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b4dd02088a29","kind":"method","anchor":"Use the county directories for Neamț [S5], Olt [S6], Ialomița [S14], Iași [S15], Dolj [S24], Vaslui [S25], Dâmbovița [S29], Prahova [S36] or Teleorman [S44] for the listed historical places and years. For Transylvania, see the Hunedoara [S13] and Sălaj [S28] directories.","sources":["S5","S6","S14","S15","S24","S25","S29","S36","S44","S13","S28"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-5f4bf09bd987","kind":"method","anchor":"Other county directories include Alba [S48], Argeș [S49], Bacău [S50], Bihor [S52], Bistrița-Năsăud [S53], Botoșani [S54], Brașov [S55], Brăila [S56], Buzău [S57], Caraș-Severin [S58], Tulcea [S65], Vrancea [S75] and Vâlcea [S76]. Use the exact row in the relevant directory.","sources":["S48","S49","S50","S52","S53","S54","S55","S56","S57","S58","S65","S75","S76"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-6224723ca185","kind":"portal-availability","anchor":"For București, use the municipal guide to reach the city’s **Externe** listing. Choose its civil-status series by type and date and retain the archival reference from the volume row [S59 @2026-11-22] [S61 @2026-11-22].","sources":["S59","S61"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-712260e37d1d","kind":"portal-availability","anchor":"For a place you can locate only approximately, try the county-filtered **Hartă** view to orient nearby candidates, as in Neamț and Olt [S7 @2026-11-22] [S8 @2026-11-22]. The catalogue checks covered text and navigation. If the interactive map fails to render, use the alphabetical list. Confirm every candidate’s historical label and years in the directory.","sources":["S7","S8"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c1fccc5c8788","kind":"portal-availability","anchor":"Use the Transylvania collection’s county views for Hunedoara, Sălaj or Bistrița-Năsăud [S16 @2026-11-22] [S32 @2026-11-22] [S62 @2026-11-22]. In the Moldavia and Wallachia collection, keep **Externe** selected and use the county or municipal filter. The reviewed views include Ialomița, Iași, Dâmbovița, Prahova and Teleorman [S17 @2026-11-22] [S18 @2026-11-22] [S33 @2026-11-22] [S40 @2026-11-22] [S45 @2026-11-22], plus Bacău, București, Tulcea, Vrancea and Vâlcea [S51 @2026-11-22] [S63 @2026-11-22] [S74 @2026-11-22] [S78 @2026-11-22] [S79 @2026-11-22].","sources":["S16","S32","S62","S17","S18","S33","S40","S45","S51","S63","S74","S78","S79"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-3f9aefcac647","kind":"portal-availability","anchor":"When the period and authority point to confessional records, choose the known confession’s directory for births, marriages and deaths. Genealogica has directories for Evangelical [S66 @2026-11-22], Greek Catholic [S67 @2026-11-22], Jewish [S68 @2026-11-22], Orthodox [S69 @2026-11-22], Reformed [S70 @2026-11-22], Roman Catholic [S71 @2026-11-22] and Unitarian registers [S72 @2026-11-22]. For an uncertain place, use the map link in the confession’s directory as a starting point and confirm the locality in the list.","sources":["S66","S67","S68","S69","S70","S71","S72"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f19199cbcf20","kind":"portal-availability","anchor":"Find the county and commune, then check the village within grouped rows or the parish, church or district within city rows. Check every applicable event-year interval even if the rows share a link. For Jewish registers under Năsăud, compare the parenthetical village lists and check both Hordou and Coșbuc, or Prislop and Liviu Rebreanu [S68 @2026-11-22]. For Reformed registers, use the Beclean link from the row for Reteag in 1864–1871 or Şintereag in 1872–1888 [S70 @2026-11-22]. For an Orthodox or Roman Catholic city entry, carry the specific church or district into the volume search [S69 @2026-11-22] [S71 @2026-11-22].","sources":["S68","S70","S69","S71"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2af2cb4f1d1f","kind":"portal-availability","anchor":"For Evangelical Măgheruș, look under Nadeș for Măieruș (azi Măgheruș) [S66 @2026-11-22]. For Roman Catholic Cădișeni, follow the row to Crișeni [S71 @2026-11-22].","sources":["S66","S71"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-romanian-eanr-civil-register-recovery-2","kind":"platform-ui","anchor":"In Giurgiu, Cacaleți under Gogoșari and Corbii Ciungi under Vânătorii Mici both appear as Izvoru today and lead to different entries. Use the commune to select the row. [S1 @2026-11-22]","sources":["S1"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5230a46a36e","kind":"portal-availability","anchor":"In Prahova, follow Netoți under Dumbrava to the Dumbrava page and look for registers still headed Netoți [S36 @2026-11-22] [S37 @2026-11-22]. For Gornet, compare the commune heading and the register description. Select Gornet Cuib under Gornet for its listed years 1909–1918 or Gornet Cricov under Gornet-Cricov for 1906–1920 [S36 @2026-11-22] [S38 @2026-11-22] [S39 @2026-11-22].","sources":["S36","S37","S38","S39"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-333c04067e66","kind":"portal-availability","anchor":"In Vaslui, distinguish Deleni (Huși) under Hoceni, listed for 1901–1910, from Deleni under Deleni commune, listed for 1901–1906 and 1908–1918. Follow Șurănești to Emil Racoviță and Micești to Gherghești [S25 @2026-11-22].","sources":["S25"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-62b53f6968ec","kind":"example","anchor":"In Hunedoara, follow Almaș (Poiana) to Almașu Mic de Munte [S13]. In Olt, follow Călugări to Lunca or Bâzgărăi to Plopșorelu [S6]. In Iași, find Brăteşti (azi Brătești) under Stolniceni-Prăjescu for 1900–1914 [S15].","sources":["S13","S6","S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-31f9550888e0","kind":"portal-availability","anchor":"In Bacău, distinguish Bogdănești under Bogdănești commune from Bogdănești under Traian [S50 @2026-11-22]. In Vâlcea, follow Slăveşti to Târgu Gângulești. For Dăești, choose by commune before comparing years. Dăești commune’s row lists 1895–1921 and the row under Popești lists 1912–1913 [S76 @2026-11-22].","sources":["S50","S76"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7a6ba67349d5","kind":"portal-availability","anchor":"Follow Jidovița via Năsăud in Bistrița-Năsăud [S53 @2026-11-22], Știubeni via Știubieni in Botoșani [S54 @2026-11-22], Țânțari via Dumbrăvița in Brașov [S55 @2026-11-22] and Cârpa via Valea Timișului in Caraș-Severin [S58 @2026-11-22].","sources":["S53","S54","S55","S58"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-f32adc9940be","kind":"portal-availability","anchor":"In Tulcea, follow Săcele (Caraharman) for 1881 or 1883 to Caraorman under Crișan. For Pisica in 1900–1901, follow Grindu [S65 @2026-11-22].","sources":["S65"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b86a5a02cb7f","kind":"portal-availability","anchor":"Search for the target anywhere in a combined row, including rows headed by another village. In Bihor, a row under Bicaciu includes Miersig for 1895–1901 [S52 @2026-11-22]. In Bistrița-Năsăud, check the combined Sigmir listing for 1917–1920 or the Dorolea listing that includes Cușma for 1906 [S53 @2026-11-22]. In Brașov, check both the group linked from Ohaba and the separate Șercăița row for 1895–1898 [S55 @2026-11-22].","sources":["S52","S53","S55"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-340b93b57f86","kind":"portal-availability","anchor":"For Vărsătura in Vrancea in 1902, use the combined Jariștea, Vărsătura row. The single-locality row begins in 1903. Confirm the linked locality under Jariștea commune [S75 @2026-11-22] [S80 @2026-11-22].","sources":["S75","S80"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-df6659d527d6","kind":"portal-availability","anchor":"For Rușani or Rășani in plasa Câmpu, follow Adâncata’s Ialomița row for 1894–1919 and check for the hamlet wording in the register description [S14 @2026-11-22] [S20 @2026-11-22].","sources":["S14","S20"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c0022e5d5cc2","kind":"portal-availability","anchor":"In Vaslui, check the combined Chilieni and Mireni listing under Coroiești for 1903–1909 and the separate Mireni listing for 1901–1902 or 1911–1918 [S25 @2026-11-22].","sources":["S25"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-fdc301cb8314","kind":"example","anchor":"In Teleorman, try Balaci for Pădureţi in the listed years 1868 and 1870–1910, carrying forward the directory’s limit to partial inclusion. Look for Balta Sărată with Dorobanţu for 1867–1910 [S44].","sources":["S44"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-02","kind":"portal-availability","anchor":"Follow named cross-references as separate searches. In Teleorman, check Pârlita-Urluiu alongside Bogdana. From Deparaţi Hârleşti, check both Deparaţi and Hârleşti and read the locality and year scope of each entry [S44 @2026-11-22].","sources":["S44"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-romanian-eanr-civil-register-recovery-3","kind":"portal-availability","anchor":"Use the years on the historical locality row, even when another row opens the same modern locality page. Compare the event year with every interval and single year. The countywide span describes the directory as a whole. An omitted year establishes a gap in the listed coverage and leaves the event and the register’s survival unresolved [S1 @2026-11-22] [S2 @2026-11-22].","sources":["S1","S2"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-2a071a34e86c","kind":"method","anchor":"Match the actual row before opening a shared page. Check Pângălești and Schitu separately in Giurgiu [S1]. Under Roman, keep the Carol I row separate from the town row [S5]. On the Corabia page in Olt, use the years for Celeiu, Daşova or the town of Corabia as applicable [S6] [S11].","sources":["S1","S5","S6","S11"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-a5a34017ba9c","kind":"portal-availability","anchor":"In Dolj, read Fântâna Banului’s intervals independently of Cetate’s on their shared page [S24 @2026-11-22]. In Dâmbovița, the shared Poiana page serves Poiana de Jos and Poiana de Sus, whose rows cover different years [S29 @2026-11-22]. In Teleorman, read Măgurele and Odaia separately on the Turnu Măgurele route [S44 @2026-11-22].","sources":["S24","S29","S44"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-6fc7dffacd7d","kind":"portal-availability","anchor":"In Ialomița, use Frumușica’s own intervals on the shared Axintele page. The Frumușica row omits 1916. On the Ion Ghica route, use Larga for 1904–1907 and Ion for 1908–1918 [S14 @2026-11-22].","sources":["S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ebe3da76a63d","kind":"portal-availability","anchor":"In Bacău, use Lucăcești’s 1909–1919 row on the shared Moinești page, and read Văsiești’s years separately [S50 @2026-11-22]. In Bihor, compare both Episcopia Bihor rows under Oradea [S52 @2026-11-22]. In Brăila, the Islaz and Brăila rows share a locality link with distinct years [S56 @2026-11-22]. In Caraș-Severin, distinguish Bocșa Montană from Bocșa Română on their shared page [S58 @2026-11-22].","sources":["S50","S52","S56","S58"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-7c6bb5fdf699","kind":"example","anchor":"Check both kinds of gap. Râu Bărbat in Hunedoara ends in 1902 [S13]. Interior years can be absent, as with 1914 for Bahna in Neamț [S5], 1902–1906 for Aghireș in Sălaj [S28], 1906–1907 for Brezoaele in Dâmbovița [S29] or the years between Gherghița’s 1882–1883 and 1915–1918 blocks in Prahova [S36].","sources":["S13","S5","S28","S29","S36"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b04ff1b269bf","kind":"portal-availability","anchor":"In Bacău, 1907 falls between Ardeoani’s listed spans [S50 @2026-11-22]. In Brașov, Cuciulata’s listed spans are 1895–1899 and 1925–1950 [S55 @2026-11-22]. In Buzău, Boldu lists 1910–1916 and 1918, while Pardoși lists only 1917 [S57 @2026-11-22].","sources":["S50","S55","S57"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-459814963c5d","kind":"example","anchor":"In Olt, check both of the listed blocks for Balș, 1865–1907 and 1918–1920. For Coteana, the directory lists only 1889 [S6].","sources":["S6"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-198305b03d75","kind":"example","anchor":"The Iași county directory has rows for Iași and Brăteşti. The Iași city row skips 1883–1884. For another locality or an omitted year, go to the archive search below [S15].","sources":["S15"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-015b304b8b7b","kind":"method","anchor":"Check the event type at volume level. If a year is listed only for a different series, keep looking for the series you need [S9] [S10].","sources":["S9","S10"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-romanian-eanr-civil-register-recovery-4","kind":"platform-ui","anchor":"Open the selected locality’s **Externe** listing. Use the year-by-year volume rows to choose by historical registering authority, event type and any district or circumscription in the title [S22 @2026-11-22] [S64 @2026-11-22]. In Galați, use the subdivision as well as the year and series to select the volume [S3 @2026-11-22] [S4 @2026-11-22].","sources":["S22","S64","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-02b1c2dac231","kind":"method","anchor":"Look for births, marriages and deaths and check descriptions for adoptions and divorces where listed [S13] [S15] [S22]. Determine whether the act is an original entry, a copy or a transcription. The Prahova fonds catalogue gives a copied divorce judgment in a Slănic marriage register and transcribed deaths in a Teișani register, so check the volume description and the act even when the series title names a different event [S41].","sources":["S13","S15","S22","S41"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-617b42fa39fc","kind":"portal-availability","anchor":"Follow the volume’s ANR link and match the official unit’s creator, title, series, span of years or acts and *cotă arhivistică*. Record the archive branch, fonds and unit reference when available. Keep the Genealogica row and volume link as finding-aid locators alongside the archive citation. For Adâncata, carry the cote from the external listing into the linked archive unit and match the unit description [S20 @2026-11-22] [S21 @2026-11-22].","sources":["S20","S21"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-ce9ee36ed4ca","kind":"method","anchor":"At the archive unit, distinguish the description from any published reproduction [S12]. When a scan is accessible, read the cover, title page or register heading to confirm the recording locality, event series and year. Check the image for any wording that identifies a copy or later transcription [S75] [S76].","sources":["S12","S75","S76"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-762865bc3646","kind":"portal-availability","anchor":"Use the issuing locality on the unit description. The Neamț example is the 1901 birth register for *com. Carol I*, cote `1/1901` [S9 @2026-11-22] [S10 @2026-11-22].","sources":["S9","S10"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-step-03","kind":"portal-availability","anchor":"For a 1900 Măgurele death, follow that creator to `130/1900` and check the archival description. The Genealogica name transcript covers part of the volume [S46 @2026-11-22] [S47 @2026-11-22].","sources":["S46","S47"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"method","anchor":"In Sălaj, the GÎRBOU unit `SJ-F-00573-01-00161` describes marriages for 1895–1906 and GÂRBOU `SJ-F-00573-02-00028` describes births for 1907–1911. Check the event type as well as the spelling [S28] [S30] [S31].","sources":["S28","S30","S31"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"method","anchor":"For Cuciulat in Sălaj, search both the single-place and compound labels. CUCIULAT deaths for 1895–1902 are described at `SJ-F-00573-01-00126`, and CUCIULAT-LETCA marriages for 1895–1906 at `SJ-F-00573-01-00128`. These are unit descriptions. Inspect the matching images before reporting an act [S28] [S34] [S35].","sources":["S28","S34","S35"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-4582b3cc85da","kind":"portal-availability","anchor":"For Prahova’s 1914 Gornet deaths, carry cote `30/1914` from the Genealogica volume. The linked ANR unit did not resolve during that catalogue check. Use the reference to search the archive again before treating the images as reached [S42 @2026-11-22].","sources":["S42"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"platform-ui","anchor":"Genealogica’s illustrated walkthroughs show an optional transcribed name index ending in `_IDX.pdf` in the archive unit’s **MEDIA/FIȘIERE** section. When the register provides this file, open it and use the PDF viewer’s local **Ctrl+F** search for a full or partial name. Take the register page number from the last column, circled in yellow in the examples. The controls were checked in the illustrated guides [S22 @2026-11-22] [S64 @2026-11-22].","sources":["S22","S64"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-a3dc9a3fa14d","kind":"platform-ui","anchor":"Return to **MEDIA/FIȘIERE** and open the scanned register PDF that contains that page. When the register spans several PDFs, check the later files as needed. Use the viewer’s page list to reach the register page. The Transylvanian walkthrough marks the list control with a red arrow [S22 @2026-11-22] [S64 @2026-11-22]. Read the act image and verify the locality, act type and number before transcribing and citing it.","sources":["S22","S64"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-b55a6db2f423","kind":"method","anchor":"Treat partial name transcripts and searchable indexes as finding aids. Check the scan for the spelling and entry details. If the index is unavailable or yields no usable hit, browse the applicable image range and log the pages you can inspect [S9] [S19] [S22] [S47].","sources":["S9","S19","S22","S47"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-94afc48b0d33","kind":"platform-ui","anchor":"If a directory year is missing, an event type is unlisted or a volume link fails, browse [Descoperă Arhivele Naționale](https://descopera.arhivelenationale.ro/) by archive, fonds and unit, or use its field search with the historical locality and any cote you found [S12 @2026-11-22]. Try the historical administrative parent and variant creator names if an exact locality search fails.","sources":["S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-9485d775d25d","kind":"method","anchor":"Check the relevant county archive’s register inventory for the exact place, event type and date. The Iași civil-status inventory illustrates how holdings are itemized by locality and date [S27].","sources":["S27"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-b88107d31e4a","kind":"portal-availability","anchor":"For Prahova, search the civil-register fonds by commune and year. For earlier material, also check the locality entries in the State Archives’ 1971 Prahova guide. It lists Gornet Cuib and Gornet Cricov separately and describes holdings at publication. Test a guide lead in the catalogue using the locality, year and type [S41 @2026-11-22] [S43 @2026-11-22].","sources":["S41","S43"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"historical","anchor":"The archive director described digitization of civil registers and publication through the archive’s own portal [S60 @2026-11-22]. The Ministry of Justice progress report describes a tranche targeting pre-1920 registers with progressive publication [S26 @2026-11-22]. Genealogica’s February 2026 guide describes phased release and uneven selection by locality [S19 @2026-11-22]. Keep unposted scans among the possibilities when the portal search stops short. Check the exact place and year even when a neighboring locality has scans. For 1920 and later, check the exact directory row and the archive inventory. The published Prahova directory includes some years through 1924 [S36 @2026-11-22].","sources":["S60","S26","S19","S36"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-c8dc23491fb0","kind":"method","anchor":"For civil and confessional series, an unlisted register may survive outside the digitized selection. Loss or deterioration remains possible. Check the original holding or an inventory before assigning a cause to the gap [S64] [S66] [S67] [S68] [S69] [S70] [S71] [S72].","sources":["S64","S66","S67","S68","S69","S70","S71","S72"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-785c9865e2a3","kind":"method","anchor":"For a pre-civil Orthodox event in Moldavia, look for parish books separately in the county archival inventory. Use the period and parish route for Bukovina as well. Genealogica’s project guide describes parish-register collections in Moldavia and Bukovina outside that eANR digitization project [S19].","sources":["S19"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-9b8f4921c255","kind":"portal-availability","anchor":"Open the Genealogica directory for Constanța or Călărași. Find the locality under its commune and compare the event year with each interval and each isolated year. Open its linked locality page and look among the external records for the Romanian National Archives eANR entry matching the event type. A missing year in the directory leaves the event and the register's survival open. Search the archives’ portal independently by locality and event type before reporting the gap. [S81 @2026-11-22] [S82 @2026-11-22] [S83 @2026-11-22] [S12 @2026-11-22]","sources":["S81","S82","S83","S12"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-4646a3f18233","kind":"portal-availability","anchor":"Search historical and current names and compare every matching row, including rows that share a destination. For Deleni, check both Enigea and Einigea. For an 1889 Abrud or Adamclisi search, follow the combined row to Deleni. For Osmanfacâ, test both the Bărăganu and Osmancea rows against the event year and corroborate the intended place before using either. [S81 @2026-11-22] [S83 @2026-11-22]","sources":["S81","S83"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-367001510cb0","kind":"portal-availability","anchor":"In Călărași, carry the historical label into the search log after following its modern link. Check Găunoși under Gălățui, Cocargeaua under Borcea, Dor-Mărunt under Dor Mărunt and Cacomeanca under Grădiștea. [S82 @2026-11-22]","sources":["S82"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-1472fc632ef9","kind":"portal-availability","anchor":"Use the external collection's **Hartă** view to find candidate localities when geography is unclear. Confirm each candidate in the listing and verify the year and register type before opening the scan. [S84 @2026-11-22] [S85 @2026-11-22]","sources":["S84","S85"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
