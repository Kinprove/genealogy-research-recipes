  - {"id":"S1","kind":"video","urls":["https://www.youtube.com/watch?v=yFTJ_vF6x3E"],"published":"2024-01-14","retrieved":"2026-11-18","access":"unknown","rights":null,"basis":"Opened the video URL on 2026-11-18 but playback or the full transcript was not accessible. Used the supplied transcript excerpt to identify the presenter’s advice on using county licenses before the statewide vital series and searching the separate state copy.","entry_sha256":"0b669b167ee5a076542d436d8a5af14e7f0b722d679d81be823dc42881bc9642","claims":["C-01","C-03"],"review":"reviewed"}
