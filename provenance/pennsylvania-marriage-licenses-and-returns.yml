  - {"id":"S3","kind":"web-page","urls":["https://www.pa.gov/agencies/phmc/pa-state-archives/research-online/vital-records/marriage-records"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Official guide for county custody and start of licenses, historical marriage bonds and the incomplete 1885–1891 state listing.","entry_sha256":"76dd5f575e021fbdcecc6c7b86f8a5944e178a25c85527fac32d2c98cb3df2bd","claims":["C-02","C-05","C-06","C-07"],"review":"reviewed"}
  - {"id":"S4","kind":"catalogue","urls":["https://www.phmc.state.pa.us/bah/dam/rg/di/r14-25RecordMarriages/r14-25MainInterface.htm"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Read the series description for county returns and the fields in the state record, along with the online span and paper remainder.","entry_sha256":"de5e3f6ecc9e27c6df19847ca0f29eeb8bb84e879f7f633ab5984c9b53ad0c75","claims":["C-06"],"review":"reviewed"}
  - {"id":"S5","kind":"catalogue","urls":["https://www.franklincountypa.gov/departments/archives-records-management/"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. County’s separate marriage docket indexes, applications and returns or duplicates illustrate the series split.","entry_sha256":"2d34e2a453494b5d08f197de58d4f32e3490988e5de9fd5bf86b5ffedabab195","claims":["C-05"],"review":"reviewed"}
  - {"id":"S6","kind":"help-page","urls":["https://www.pa.gov/agencies/phmc/pa-state-archives/research-online/frequently-asked-questions"],"published":null,"retrieved":"2026-11-18","access":"read","rights":null,"basis":"Read 2026-11-18. Official dates for county marriage licenses and the start of state birth and death records.","entry_sha256":"b41bdf616ad41ab4871bfa4ab919feae3d1ec5b1bc4929b23f72be63ff0a1ebf","claims":["C-02"],"review":"reviewed"}
  - {"id":"S7","kind":"video","urls":["https://www.youtube.com/watch?v=OXWTvCrqkt0"],"published":"2022-10-26","retrieved":"2026-11-21","access":"snippet-only","rights":null,"basis":"On 2026-11-21 the search listing showed the video title and publisher, and opening the video was throttled. The supplied excerpt and the host’s written interview in S8 preserve Venezia’s advice to compare the county filing with any separate city return and religious marriage record.","entry_sha256":"34d35a9daf8ec342ff259e95f63386214f197b8a2ee3e3bbd925d6904051f43d","claims":["C-08"],"review":"reviewed"}
  - {"id":"S8","kind":"web-page","urls":["https://lisalouisecooke.com/2022/09/28/ancestors-town-origin/"],"published":"2022-09-28","retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read the marriage-license section of Lisa Louise Cooke’s interview notes on 2026-11-21. Rich Venezia suggests looking for city returns and religious records because the entries for the same event can contain different details.","entry_sha256":"dd33a7374ef2c98c610e587eb7a35785252dd6e30465ea0df3330de78e5f240c","claims":["C-08"],"review":"reviewed"}
  - {"id":"S9","kind":"web-page","urls":["https://www.phila.gov/departments/department-of-records/city-archives/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read the collections list on 2026-11-21. It dates the city marriage series from 1 July 1860 through 31 December 1885 and lists the later Orphans’ Court series separately.","entry_sha256":"439408ac8d2a4e82b2b520b9b6335893a5bc10badfe8b8427e418ca0f64a5892","claims":["C-09"],"review":"reviewed"}
  - {"id":"S10","kind":"pdf","urls":["https://files.lib.byu.edu/family-history-library/research-outlines/US/Pennsylvania.pdf"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read the marriage records section on 2026-11-21. It describes the Philadelphia Board of Health returns in the library’s microfilm holdings, arranged by officiant and quarter, and identifies them as the source of the city marriage register.","entry_sha256":"d3086ae19450bb6cf49069a864e290240853dfa75976e34f051b1b2f8ae59e96","claims":["C-09"],"review":"reviewed"}
  - {"id":"S11","kind":"help-page","urls":["https://chrc-phila.org/faq/"],"published":null,"retrieved":"2026-11-21","access":"read","rights":null,"basis":"Read the genealogy section on 2026-11-21. It identifies the Archdiocese’s digitized sacramental marriage records through 1919.","entry_sha256":"39a905194812e3ee4602b73be0e97f0bfd1edde787764914a52bfca9a2e1841b","claims":["C-10"],"review":"reviewed"}
  - {"id":"S12","kind":"web-page","urls":["https://blog.myheritage.com/2024/02/myheritage-adds-55-million-historical-records-in-january-2024/"],"published":"2024-02-01","retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the MyHeritage Blog announcement’s Lancaster County table entry on 2026-11-22. It introduces the marriage index under the title Pennsylvania, Lancaster County Marriages and gives 1944 as the starting year.","entry_sha256":"e77ea6006c9bde4504f91098551fcd77b90cd75b396200399f6370220de2c9e8","claims":["C-11"],"review":"reviewed"}
  - {"id":"S13","kind":"catalogue","urls":["https://www.myheritage.com/research/collection-20763/pennsylvania-lancaster-county-marriage-licenses"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the public collection description and search form on 2026-11-22. The page gives the current title, lists Lancaster County coverage starting in 1944 and shows fields for the spouses’ names and marriage year. The description gives no last year or guarantee of completeness.","entry_sha256":"9a49dc2133aee87b876faa702a97a80aced65d1cd587d973746bf64f392b383e","claims":["C-11"],"review":"reviewed"}
  - {"id":"S14","kind":"catalogue","urls":["https://www.co.lancaster.pa.us/1157/Marriage-License-Index-1937-1972"],"published":null,"retrieved":"2026-11-22","access":"read","rights":null,"basis":"Read the county’s index guide on 2026-11-22. It lists separate bride and groom indexes for 1937–1972 and gives the book, volume and license number as reference details for the filing.","entry_sha256":"9ada53221c4d98746d024c891169dfa6a6ff5d76c4272add7dc0e43e8c91606c","claims":["C-12"],"review":"reviewed"}
claims:
  - {"id":"C-01","kind":"method","anchor":"According to the presenter, use a Pennsylvania county marriage license to investigate family details in the years before statewide birth and death registration, and compare early county entries with their state counterparts. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-02","kind":"custody","anchor":"For licenses issued from 30 September 1885, search the issuing county’s marriage docket and license files. Use these as family leads for the years before state birth and death registration began in 1906. [S3 @2026-11-18], [S6 @2026-11-18]","sources":["S3","S6"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-03","kind":"method","anchor":"According to the podcast adviser, start a colonial search with a marriage bond when the record series includes one, and look for other marriage filings individually. [S1†]","sources":["S1"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-04","kind":"method","anchor":"According to the marriage-record presenter, look for a bond, license and return as distinct records where they were created. [S2†]","sources":["S2"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-05","kind":"custody","anchor":"Check separately for the application, issued license and officiant’s return or duplicate. Record what the applicants reported and what the officiant certified. Franklin County, for example, describes applications and returns as separate archival series. [S3 @2026-11-18], [S5 @2026-11-18]","sources":["S3","S5"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-06","kind":"custody","anchor":"For marriages in 1885–1891, check the state’s incomplete *Record of Marriages* in RG 14 alongside the county record. Compare recorded birthplace, residence and date field by field. The reading room series extends past the dated images linked from its older state scan interface. A miss in the state listing leaves the county search open. [S3 @2026-11-18], [S4 @2026-11-18]","sources":["S3","S4"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-07","kind":"custody","anchor":"For a period with surviving bonds, find the bond and copy its date, principals and named signers by role. Look separately for a marriage entry or an officiant’s return to establish that the ceremony took place. The State Archives lists surviving Philadelphia County bonds among its earlier materials. [S3 @2026-11-18]","sources":["S3"],"checked":"2026-11-18","stated_as":"fact","review":"reviewed"}
  - {"id":"C-08","kind":"method","anchor":"According to the interview, check the officiating congregation’s marriage register and any separate city marriage return even after finding the county filing for a historical Pennsylvania marriage. [S7†], [S8] Compare the surviving entries for the same ceremony field by field.","sources":["S7","S8"],"checked":null,"stated_as":"observation","review":"reviewed"}
  - {"id":"C-09","kind":"custody","anchor":"For a ceremony in Philadelphia from 1 July 1860 through 31 December 1885, check the city marriage records at the Philadelphia City Archives. Use the officiant’s name and the quarter of the ceremony to locate the Board of Health return. [S9 @2026-11-21], [S10 @2026-11-21]","sources":["S9","S10"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-10","kind":"portal-availability","anchor":"For a Catholic ceremony in the same period, look for the parish marriage register in the Philadelphia Archdiocese’s digitized sacramental records. [S11 @2026-11-21]","sources":["S11"],"checked":"2026-11-21","stated_as":"fact","review":"reviewed"}
  - {"id":"C-11","kind":"portal-availability","anchor":"For a marriage recorded in Lancaster County in 1944 or later, search MyHeritage’s *Pennsylvania, Lancaster County Marriage Licenses* by either spouse’s name and the marriage year if known. [S12 @2026-11-22], [S13 @2026-11-22] Use a hit to locate the county filing. Continue in the county docket even if MyHeritage returns no match.","sources":["S12","S13"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-12","kind":"portal-availability","anchor":"For Lancaster County licenses from 1937 through 1972, browse the county archives’ separate bride and groom indexes and record the book, volume and license number to locate the filing. [S14 @2026-11-22]","sources":["S14"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
