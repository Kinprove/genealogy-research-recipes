claims:
  - {"id":"C-000000000001","kind":"portal-availability","anchor":"Search *Ireland, Ulster Freeholders* on MyHeritage and compare the hit with the PRONI digitized freeholders’ records. Open the image and identify it as a register or a poll book. Copy the given residence, freehold location, and any named landlord and candidate in separate fields. [S1 @2026-11-22] [S2 @2026-11-22] [S3 @2026-11-22] [S4 @2026-11-22]","sources":["S1","S2","S3","S4"],"checked":"2026-11-22","stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000002","kind":"historical","anchor":"Read *freeholder* as a man who owned the land outright or held it on a lease measured by one or more lives. Use the entry to target a deed or lease, and leave the kind of tenure unresolved until the instrument distinguishes it. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000003","kind":"historical","anchor":"Use the election date and the eligibility rule before interpreting a missing voter. PRONI summarizes the county freehold franchise as Protestant 40-shilling freeholders from 1727 to 1793, Protestant and Catholic 40-shilling freeholders from 1793 to 1829, and a £10 threshold from 1829. Check the actual election and the surviving list before using the threshold to explain a miss. [S1] [S3]","sources":["S1","S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
  - {"id":"C-000000000004","kind":"historical","anchor":"Use a register as evidence of recorded eligibility. Use a poll book’s named candidate as evidence of the vote publicly declared. Consider landlord pressure before using the entry to infer the voter’s allegiance. [S3]","sources":["S3"],"checked":null,"stated_as":"fact","review":"reviewed"}
