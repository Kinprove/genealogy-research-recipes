version: 2
updates:
  # Keeps the commit-SHA pins in .github/workflows/ up to date; each update PR
  # moves the SHA and its trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  # Keeps the two npm lockfiles current: the CI tools and the Markdown link checker.
  - package-ecosystem: npm
    directories: ["/ci-tools", "/tests/markdown-links"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
