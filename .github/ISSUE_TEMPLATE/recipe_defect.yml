name: Recipe defect
description: Report an incorrect claim, missing qualification, or broken research step.
title: "Recipe defect: "
body:
  - type: markdown
    attributes:
      value: |
        For security or privacy problems, follow [SECURITY.md](https://github.com/Kinprove/genealogy-research-recipes/security/policy) and report privately. Do not post credentials, DNA data, private photographs, or identifying details of living people.
  - type: input
    id: location
    attributes:
      label: Recipe slug, source or claim ID, and passage location
      description: Give a stable slug#ID locator when available, plus the file and line or section.
      placeholder: skills/genealogy-research-recipes/recipes/example.md, section 2
    validations:
      required: true
  - type: dropdown
    id: defect_class
    attributes:
      label: Defect class
      options:
        - Incorrect fact or instruction
        - Missing or incorrect source link
        - Access status or qualification
        - Stale current-state claim
        - URL or source numbering
        - Other recipe defect
    validations:
      required: true
  - type: input
    id: observation
    attributes:
      label: Observed access status and date
      description: Say read, partial, snippet-only, refused, private or unknown and YYYY-MM-DD; do not guess.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: Include the version you read, or its commit or permalink.
    validations:
      required: true
  - type: textarea
    id: passage
    attributes:
      label: Current passage and problem
      description: Quote the affected passage and explain what a reader or agent would get wrong.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Expected text or behavior
      description: Suggest corrected wording or describe what the step should do.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link the source, note its date and relevant passage, or provide a minimal redacted example. Say when the evidence is uncertain or unavailable.
