name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  beider-lookup:
    name: Beider lookup regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.12+ so that unittest exits non-zero when it collects no tests.
          python-version: "3.12"
      - name: Run offline lookup tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s skills/genealogy-research-recipes/tests -p 'test_*.py'

  unit-tests:
    name: Repository unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's test merge commit needs its first parent, the base
          # branch tip, for the legacy provenance inventory comparison below.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # test_clawhub_package.py runs `npm pack`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the pinned Markdown parser
        run: npm ci --prefix tests/markdown-links --ignore-scripts
      - name: Run repository unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check recipe headers and announce expiring platform checks
        run: python -B scripts/recipe_catalog.py --check
      - name: Check provenance ledgers, generated report and frozen legacy inventory
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        # Compare with the base branch tip for a pull request, and with the commit
        # main pointed to before the push (several commits back, if need be) for a push.
        run: |
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            base=$PUSH_BEFORE
          fi
          python -B scripts/provenance.py --check --legacy-base "$base"

  distributions:
    name: Channel distribution builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check all channel distributions
        run: |
          for target in claude-directory hermes-catalog openai-plugin; do
            python -B scripts/build_dist.py --target "$target" --source HEAD --out "$RUNNER_TEMP/$target"
          done
          python -B scripts/build_dist.py --check-claude "$RUNNER_TEMP/claude-directory"
          python -B scripts/build_dist.py --check-links "$RUNNER_TEMP/claude-directory"
          python -B scripts/build_dist.py --check-links "$RUNNER_TEMP/hermes-catalog"
          python -B scripts/build_dist.py --check-links "$RUNNER_TEMP"/openai-plugin/*.zip

  hermes:
    name: Hermes native plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          # Freeze the runtime that exercises the public register_skill contract.
          ref: 6cf3104d749b49151a22a5cdbe40dc729577b505
          path: .hermes-runtime
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
      - name: Prepare the pinned Hermes runtime
        run: |
          HERMES_RUNTIME="$RUNNER_TEMP/hermes-runtime"
          printf 'HERMES_RUNTIME=%s\n' "$HERMES_RUNTIME" >> "$GITHUB_ENV"
          mv .hermes-runtime "$HERMES_RUNTIME"
          uv sync --project "$HERMES_RUNTIME" --frozen --no-dev --python 3.14
      # `validate` passes with warnings, but a security-scan caution makes every
      # Hermes catalog install and update ask the user to confirm, so any warning fails.
      - name: Validate native plugin and real registration
        run: |
          set -o pipefail
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev hermes plugins validate . --json | tee "$RUNNER_TEMP/validate-root.json"
          jq -e 'has("warnings") and (.warnings | length == 0)' "$RUNNER_TEMP/validate-root.json" > /dev/null || { echo "::error::hermes plugins validate reported warnings"; exit 1; }
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev hermes plugins doctor . --ci
      - name: Validate the Hermes catalog distribution with the pinned runtime
        run: |
          set -o pipefail
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev python -B scripts/build_dist.py --target hermes-catalog --source HEAD --out "$RUNNER_TEMP/hermes-catalog"
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev hermes plugins validate "$RUNNER_TEMP/hermes-catalog" --json | tee "$RUNNER_TEMP/validate-dist.json"
          jq -e 'has("warnings") and (.warnings | length == 0)' "$RUNNER_TEMP/validate-dist.json" > /dev/null || { echo "::error::hermes plugins validate reported warnings on the catalog distribution"; exit 1; }
      - name: Exercise namespaced skill and recipe access in an isolated profile
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ runner.temp }}/hermes-runtime
          TMPDIR: ${{ runner.temp }}
        run: uv run --project "$HERMES_RUNTIME" --frozen --no-dev python -B tests/check_hermes_runtime.py

  openclaw:
    name: OpenClaw native plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked CI tools without lifecycle scripts
        run: |
          npm ci --prefix ci-tools --ignore-scripts
          echo "$PWD/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install and inspect the native plugin in an isolated profile
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 -B tests/check_openclaw_runtime.py

  validate:
    name: Plugin validate (--strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked CI tools without lifecycle scripts
        run: npm ci --prefix ci-tools --ignore-scripts
      - name: Validate marketplace + plugin manifest
        # The package supplies this launcher for --ignore-scripts installs; the
        # usual .bin/claude entry needs postinstall to place its native binary.
        run: node ci-tools/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs plugin validate . --strict
      - name: Validate the ClawHub package with the locked maintainer CLI
        run: ci-tools/node_modules/.bin/clawhub package validate . --openclaw ci-tools/node_modules/openclaw --out "$RUNNER_TEMP/clawhub-validation" --json

  markdownlint:
    name: markdownlint (check-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked CI tools without lifecycle scripts
        run: npm ci --prefix ci-tools --ignore-scripts
      - name: Install link-check dependencies
        run: npm ci --prefix tests/markdown-links --ignore-scripts
      - name: Check internal Markdown links and anchors
        run: npm test --prefix tests/markdown-links
      # Check-only: markdownlint-cli2 does NOT modify files (no --fix). Config is the
      # committed .markdownlint-cli2.jsonc. Fix the source/generator and regenerate on a
      # finding; never format generated bytes in CI.
      - name: markdownlint-cli2
        run: ci-tools/node_modules/.bin/markdownlint-cli2 "**/*.md"

  gitleaks:
    name: Secret scan (working tree + git history, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The export's D1 guard checks equality with the private source config.
      # Public CI requires the exported config and scans files and all fetched refs.
      - name: Verify added-and-deleted keys fail the scan
        run: python3 -B tests/check_secret_scan.py
      - name: gitleaks (pinned image, working tree and history)
        run: bash scripts/check_secrets.sh
