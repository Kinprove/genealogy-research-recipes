name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  beider-lookup:
    name: Beider lookup regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12+ so that unittest exits non-zero when it collects no tests.
          python-version: "3.12"
      - name: Run offline lookup tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s skills/genealogy-research-recipes/tests -p 'test_*.py'

  unit-tests:
    name: Repository unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # test_clawhub_package.py runs `npm pack`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install the pinned Markdown parser
        run: npm ci --prefix tests/markdown-links --ignore-scripts
      - name: Run repository unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check provenance ledgers and generated report
        run: python -B scripts/provenance.py --check

  hermes:
    name: Hermes native plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          # Freeze the runtime that exercises the public register_skill contract.
          ref: 6cf3104d749b49151a22a5cdbe40dc729577b505
          path: .hermes-runtime
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.10"
      - name: Prepare the pinned Hermes runtime
        run: |
          HERMES_RUNTIME="$RUNNER_TEMP/hermes-runtime"
          printf 'HERMES_RUNTIME=%s\n' "$HERMES_RUNTIME" >> "$GITHUB_ENV"
          mv .hermes-runtime "$HERMES_RUNTIME"
          uv sync --project "$HERMES_RUNTIME" --frozen --no-dev --python 3.14
      - name: Validate native plugin and real registration
        run: |
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev hermes plugins validate . --json
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev hermes plugins doctor . --ci
      - name: Exercise namespaced skill and recipe access in an isolated profile
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ runner.temp }}/hermes-runtime
          TMPDIR: ${{ runner.temp }}
        run: uv run --project "$HERMES_RUNTIME" --frozen --no-dev python -B tests/check_hermes_runtime.py

  openclaw:
    name: OpenClaw native plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install locked CI tools without lifecycle scripts
        run: |
          npm ci --prefix ci-tools --ignore-scripts
          echo "$PWD/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install and inspect the native plugin in an isolated profile
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 -B tests/check_openclaw_runtime.py

  validate:
    name: Plugin validate (--strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install locked CI tools without lifecycle scripts
        run: npm ci --prefix ci-tools --ignore-scripts
      - name: Validate marketplace + plugin manifest
        # The package supplies this launcher for --ignore-scripts installs; the
        # usual .bin/claude entry needs postinstall to place its native binary.
        run: node ci-tools/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs plugin validate . --strict
      - name: Validate the ClawHub package with the locked maintainer CLI
        run: ci-tools/node_modules/.bin/clawhub package validate . --openclaw ci-tools/node_modules/openclaw --out "$RUNNER_TEMP/clawhub-validation" --json

  markdownlint:
    name: markdownlint (check-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install locked CI tools without lifecycle scripts
        run: npm ci --prefix ci-tools --ignore-scripts
      - name: Install link-check dependencies
        run: npm ci --prefix tests/markdown-links --ignore-scripts
      - name: Check internal Markdown links and anchors
        run: npm test --prefix tests/markdown-links
      # Check-only: markdownlint-cli2 does NOT modify files (no --fix). Config is the
      # committed .markdownlint-cli2.jsonc. Fix the source/generator and regenerate on a
      # finding; never format generated bytes in CI.
      - name: markdownlint-cli2
        run: ci-tools/node_modules/.bin/markdownlint-cli2 "**/*.md"

  gitleaks:
    name: Secret scan (working tree + git history, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The export's D1 guard checks equality with the private source config.
      # Public CI requires the exported config and scans files and all fetched refs.
      - name: Verify added-and-deleted keys fail the scan
        run: python3 -B tests/check_secret_scan.py
      - name: gitleaks (pinned image, working tree and history)
        run: bash scripts/check_secrets.sh
