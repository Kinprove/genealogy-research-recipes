name: Recipe behavioural evaluations

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# A run started by any other label gets its own group, so it cannot cancel an evaluation.
concurrency:
  group: recipe-evals-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'behavioural-evals' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  credentials:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'behavioural-evals') &&
       (github.event.action != 'labeled' || github.event.label.name == 'behavioural-evals'))
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.credentials.outputs.available }}
    steps:
      - name: Check model credentials
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Behavioural evaluations skipped: ANTHROPIC_API_KEY is not configured.'
          fi

  golden-cases:
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the locked model harness without lifecycle scripts
        run: |
          npm ci --prefix ci-tools --ignore-scripts
          mkdir -p "$RUNNER_TEMP/recipe-evals-bin"
          cat > "$RUNNER_TEMP/recipe-evals-bin/claude" <<'CLAUDE_SHIM'
          #!/bin/sh
          exec node "$GITHUB_WORKSPACE/ci-tools/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs" "$@"
          CLAUDE_SHIM
          chmod +x "$RUNNER_TEMP/recipe-evals-bin/claude"
          echo "$RUNNER_TEMP/recipe-evals-bin" >> "$GITHUB_PATH"
      - name: Run three samples per golden case
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
        run: python3 -B skills/genealogy-research-recipes/evals/run_evals.py --output eval-results
      - name: Keep answers, tool traces, judge decisions and run identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-evals-${{ github.sha }}-${{ github.run_attempt }}
          path: eval-results/
          if-no-files-found: error
          retention-days: 30
